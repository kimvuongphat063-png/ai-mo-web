<!DOCTYPE html>
<html lang="vi" data-game="tapviet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3f8cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bé Tập Viết</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}

/* ===== Kit v2 additions (Bộ game 2) ===== */
/* tutorial hand */
.k-hand{position:fixed;z-index:72;left:0;top:0;width:clamp(54px,9vmin,78px);height:auto;pointer-events:none;opacity:0;
  filter:drop-shadow(0 6px 6px rgba(30,10,80,.25));transition:opacity .25s;will-change:transform}
.k-hand.on{opacity:1}
.k-hand .tapring{transform-origin:22px 10px;animation:k-ring 1s ease-out infinite}
@keyframes k-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* segmented chips (Dễ / Vừa / Khó …) */
.k-seg{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(40,20,90,.12)}
.k-seg button{border:none;cursor:pointer;min-height:48px;min-width:56px;padding:0 16px;border-radius:999px;background:transparent;
  font:800 clamp(16px,2.6vmin,21px)/1 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.k-seg button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.k-seg button:active{transform:translateY(2px)}
/* tile buttons for mode / level grids */
.k-tile{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;color:var(--ink);padding:12px 10px 10px;
  box-shadow:0 7px 0 rgba(40,20,90,.16),0 12px 20px rgba(40,20,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:800 clamp(16px,2.7vmin,22px)/1.05 var(--font);transition:transform .14s,box-shadow .14s;min-height:64px;text-align:center}
.k-tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(40,20,90,.16)}
.k-tile .emo{font-size:clamp(34px,6.4vmin,54px)}
.k-tile small{font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .k-tstars{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5;display:block}
.k-mini-star.on svg{color:#ffc83d;filter:drop-shadow(0 1px 0 #e09a00)}
/* scrollable screen body under the bar */
.k-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--bar-h) + var(--safe-t) + 6px) calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l));
  display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  box-shadow:0 4px 0 rgba(40,20,90,.12);white-space:nowrap}
.k-pill .emo{font-size:1.3em}
@keyframes k-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}50%{filter:drop-shadow(0 0 14px rgba(255,220,80,.95))}}
.k-glow{animation:k-glow 1.2s ease-in-out infinite}
@keyframes k-squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}}
.k-squash{animation:k-squash .5s ease}
@keyframes k-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.k-jump{animation:k-jump .5s cubic-bezier(.3,1.5,.5,1)}
</style>
<style>
:root{--c1:#3f8cff;--c1d:#2563d9;--c1l:#e3eeff;--c2:#ff6fa5;--c2d:#d9467f;--bg1:#c4defc;--bg2:#fff0cf;--ink:#2f3a66;--ink-soft:#66709a;
  --gc:#3f8cff;--gcd:#2563d9;--gl:#dceaff;--paper:#fffdf8}
body{background:
  linear-gradient(90deg,transparent calc(26px + var(--safe-l)),rgba(255,110,140,.30) 0 calc(28px + var(--safe-l)),transparent 0),
  repeating-linear-gradient(0deg,rgba(80,130,225,.14) 0 1.5px,transparent 1.5px 28px),
  repeating-linear-gradient(90deg,rgba(80,130,225,.07) 0 1.5px,transparent 1.5px 28px),
  linear-gradient(165deg,var(--bg1),#e8f2ff 48%,var(--bg2))}
.gdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- pencil mascot ---------- */
.pencil{overflow:visible;display:block}
.pencil .pb{transform-box:view-box;transform-origin:70px 206px;animation:pbob 2.6s ease-in-out infinite}
@keyframes pbob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
.pencil .eyes{transform-box:view-box;transform-origin:70px 95px;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.pencil .pup{transition:transform .18s ease-out}
.pencil .ar{transform-box:view-box;transform-origin:99px 124px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.pencil .al{transform-box:view-box;transform-origin:41px 124px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.pencil.wave .ar{animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
.pencil.hop .pb{animation:phop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes phop{0%{transform:scale(1,1)}20%{transform:scale(1.1,.88)}50%{transform:translateY(-24px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
.pencil.no .pb{animation:pno .6s ease}
@keyframes pno{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.pencil .mouth{transform-box:fill-box;transform-origin:center top;transition:transform .2s}
.pencil.hop .mouth,.pencil.cheer .mouth{transform:scale(1.25,1.5)}
.pencil.cheer .pb{animation:pcheer .55s ease-in-out infinite alternate}
@keyframes pcheer{0%{transform:translateY(0) rotate(-4deg)}100%{transform:translateY(-10px) rotate(4deg)}}
.pencil.cheer .ar{animation:wave .55s ease-in-out infinite}
.pencil.cheer .al{transform:rotate(40deg)}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.2vmin,12px);padding:calc(66px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
.floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters b{position:absolute;font-weight:800;font-size:clamp(34px,7vmin,66px);line-height:1;opacity:.5;color:var(--fc);
  -webkit-text-stroke:.07em #fff;paint-order:stroke fill;animation:drift 11s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1))}}
.t-art,.t-txt{position:relative;z-index:1}
#tArt .pencil{width:clamp(96px,min(34vw,21vh),200px);height:auto;cursor:pointer}
.t-txt{display:flex;flex-direction:column;align-items:center}
.logo .l2{color:#ffd23d;font-size:1.12em}
.scrib{width:clamp(170px,40vmin,380px);height:auto;margin:-2px 0 2px;overflow:visible}
.scrib path{stroke-dasharray:440;stroke-dashoffset:440;animation:scrib 1.8s .3s ease-out forwards}
@keyframes scrib{to{stroke-dashoffset:0}}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(4px,1.4vmin,14px)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
#tStars .emo{font-size:1.25em}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #title{flex-direction:row;gap:5vw;padding-top:calc(56px + var(--safe-t))}
  #tArt .pencil{width:auto;height:min(60vh,230px)}
  .title-btns{gap:12px}
}

/* ---------- select ---------- */
#select .k-scroll{gap:12px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(860px,100%);flex:0 0 auto}
.tab{position:relative;border:none;cursor:pointer;border-radius:22px;background:#fff;padding:7px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;
  box-shadow:0 6px 0 rgba(40,60,140,.14);font:800 clamp(12px,2.1vmin,17px)/1 var(--font);color:var(--ink-soft);transition:transform .15s;white-space:nowrap}
.tab b{font-size:clamp(24px,4.6vmin,36px);line-height:1;color:var(--tc)}
.tab span{white-space:normal;line-height:1;text-align:center}
.tab .tb{position:absolute;top:-9px;right:-5px;font:800 12px/1 var(--font);font-style:normal;padding:4px 6px;border-radius:10px;background:var(--gold);color:#6b3d00;box-shadow:0 2px 0 var(--goldd)}
.tab.on{background:var(--tc);color:#fff;box-shadow:0 6px 0 var(--tcd),0 0 0 4px #fff;transform:translateY(-2px)}
.tab.on b{color:#fff}
.tab:active{transform:translateY(3px)}
.opts{display:flex;gap:10px 14px;flex-wrap:wrap;justify-content:center;width:min(860px,100%);flex:0 0 auto}
.k-seg button{min-height:52px;white-space:nowrap}
@media (max-width:480px){.k-seg{gap:3px;padding:5px}.k-seg button{padding:0 9px;gap:4px;font-size:16px}}
.k-seg button .emo{font-size:1.2em}
.k-seg .lw{display:inline-block;width:22px;height:22px;position:relative}
.k-seg .lw i{position:absolute;left:0;right:0;top:50%;border-radius:9px;background:currentColor;opacity:.9;transform:translateY(-50%)}
.grid{--tw:clamp(70px,min(20.5vw,13vh),122px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(980px,100%);flex:0 0 auto}
.gt{position:relative;border:none;cursor:pointer;border-radius:22px;background:#fff;padding:5px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;

  50%{transform:scale(1) rotate(0)}60%{transform:rotate(-6deg)}70%{transform:rotate(6deg)}80%{transform:rotate(-4deg)}90%{transform:rotate(2deg)}100%{transform:none}}

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }

  let cov = 0, tot = 0; for (let i = 0; i <= S.n; i += 2) { tot++; if (minD(S.pts0[i], pts) <= rCov) cov++; }
  const frac = cov / Math.max(1, tot);
  let dev = 0; pts.forEach(p => { dev += Math.min(2, minD(p, S.pts0) / tol); }); dev /= pts.length;
  if (S.closed && frac >= 0.65) { // orientation must match for loops
    const area = arr => { let s = 0; for (let i = 1; i < arr.length; i++) s += arr[i - 1][0] * arr[i][1] - arr[i][0] * arr[i - 1][1]; return s; };
    const want = area(S.pts0), got = area(pts);
    if (Math.abs(got) > Math.abs(want) * 0.25 && Math.sign(got) !== Math.sign(want)) return { ok: false, why: 'dir' };
  }
  if (frac >= 0.65 && (eOK || rev || S.closed)) return { ok: true, dev };
  return { ok: false, why: !eOK && frac >= 0.65 ? 'dir' : 'shape' };
}

/* ---------- finishing a glyph: the letter comes alive ---------- */
async function finishGlyph() {
  const my = round, g = G.g;
  G.state = 'done'; G.tracking = false; hidePointer(true); stopDemo(); idleStop(); updateMid();
  let st;
  if (G.mode === 'trace') {
    const q = G.stats.n ? G.stats.dev / G.stats.n : 0, off = G.stats.tt > 0 ? G.stats.off / G.stats.tt : 0;
    st = q < 0.42 && off < 0.15 ? 3 : q < 0.66 && off < 0.32 ? 2 : 1;
  } else {
    const d = G.stats.fdev.length ? G.stats.fdev.reduce((a, b) => a + b, 0) / G.stats.fdev.length : 0, f = G.stats.fails;
    st = d < 0.55 && f <= 1 ? 3 : d < 0.9 && f <= G.S.length + 1 ? 2 : 1;
  }
  G.lastStars = st;
  const tab = STARS[G.mode], before = groupDone(G.grp, G.mode);
  tab[g.key] = Math.max(tab[g.key] || 0, st); saveS();
  const allNow = !before && groupDone(G.grp, G.mode);
  await wait(260); if (my !== round) return;
  const gd = $('.gd', gSvg); if (gd) gd.classList.add('fin');
  tSvg.innerHTML = ''; renderFaces();
  alive.className = ''; void alive.offsetWidth; alive.classList.add('jump');
  sfx.boing(); later(() => sfx.win(), 220);
  const c = toScr([(g.ink[0] + g.ink[2]) / 2, (g.ink[1] + g.ink[3]) / 2]);
  burst(c[0], c[1], { n: 22, colors: ['#ffc83d', '#ff5d8f', '#4cc9f0', '#3ecf6e', '#a35cff'] });
  later(() => { const a = toScr([g.ink[0], g.ink[1]]), b = toScr([g.ink[2], g.ink[3]]); sparkle(a[0], a[1]); sparkle(b[0], b[1]); }, 300);
  Kit.praise(st === 3 ? pick(['Tuyệt vời!', 'Đẹp quá!', 'Siêu quá!']) : pick(['Giỏi quá!', 'Hay lắm!', 'Bé giỏi lắm!']), { speak: false, top: '30%' });
  pM.hop(); later(() => pM.cheer(true), 700);
  if (st === 3) later(() => Kit.confetti(), 350);
  later(() => { if (my === round && G.state === 'done') { alive.className = 'idle'; } }, 1350);
  await wait(600); if (my !== round) return;
  fillDone(st, my);
  if (allNow) later(() => groupTrophy(), 3600);
}
function fillDone(st, my) {
  const g = G.g, box = $('#wcard');
  if (g.kind === 'digit') {
    box.innerHTML = `<div class="count" id="count" style="--cols:${g.num <= 5 ? Math.max(1, g.num) : Math.ceil(g.num / 2)}"></div>`;
    const n = g.num, cnt = $('#count');
    if (n === 0) { cnt.innerHTML = `<div class="wcard"><span class="wemo emo">🧺</span><span class="wtx"><span class="wch">số không</span><span class="wwd">0</span></span></div>`; say('Số không. Không có quả nào!'); }
    else {
      say(NUMW.slice(1, n + 1).join(', ') + '!', { rate: 0.85 });
      for (let i = 0; i < n; i++) later(() => { if (my !== round) return; cnt.insertAdjacentHTML('beforeend', `<span class="ci"><b class="emo">${g.emo}</b><i>${i + 1}</i></span>`); snd.count(i); }, 150 + i * 520);
    }
  } else if (g.kind === 'letter') {
    box.innerHTML = `<div class="wcard"><span class="wemo emo">${g.emo}</span><span class="wtx"><span class="wch"><b>${g.label}</b> · ${g.name}</span><span class="wwd">${hlWord(g.word, g.id)}</span></span></div>`;
    say(`${g.name}. ${g.word}!`);
  } else {
    box.innerHTML = `<div class="wcard"><span class="wemo emo">${g.emo}</span><span class="wtx"><span class="wwd">${g.kind === 'shape' ? g.name : g.word}</span></span></div>`;
    say(g.kind === 'shape' ? `${g.name}!` : `${g.word}!`);
  }
  $('#dstars').innerHTML = [0, 1, 2].map(i => `<span>${STAR_SVG(i < st)}</span>`).join('');
  $$('#dstars svg').forEach((s, i) => later(() => { if (my !== round) return; s.classList.add('on'); if (i < st) sfx.star(); }, 250 + i * 300));
  $('#bNext span').textContent = grpById(G.grp).next;
  panel.classList.add('isdone');
}
function groupTrophy() {
  if (screen !== 'play') return;
  const gn = grpById(G.grp).name.toLowerCase();
  Kit.result({ title: 'Hoàn thành!', stars: 3, text: `Bé đã viết hết ${gn}!`, reward: { emoji: '🏆', label: 'Cúp ' + gn },
    say: `Hoan hô! Bé đã viết hết ${gn}!`,
    buttons: [{ label: 'Bảng chữ', icon: 'book', cls: 'white', onClick: () => { leavePlay(); renderSelect(); show('select'); } }, { label: 'Viết tiếp', icon: 'next', cls: 'ok' }] });
}
function tickle(x, y) {
  if (G.mode === 'draw') return;
  alive.className = ''; void alive.offsetWidth; alive.classList.add('tickle');
  const my = round; later(() => { if (my === round && G.state === 'done') alive.className = 'idle'; }, 620);
  snd.giggle(); sparkle(x, y, { n: 5 });
  const g = G.g; say(g.kind === 'letter' ? g.name : g.kind === 'digit' ? g.name : g.word);
}
function eyesFollow(x, y) {
  if (!G.g) return; const f = G.g.faces[0], c = toScr([f[0], f[1]]), a = Math.atan2(y - c[1], x - c[0]), d = Math.min(1, Math.hypot(x - c[0], y - c[1]) / 150);
  faceSvg.style.setProperty('--ex', R2(Math.cos(a) * 1.7 * d) + 'px'); faceSvg.style.setProperty('--ey', R2(Math.sin(a) * 1.7 * d) + 'px');
}
$('#bAgain').innerHTML = icon('replay');
$('#bAgain').onclick = () => { if (screen === 'play' && G.mode !== 'draw') loadGlyph(); };
$('#bNext').insertAdjacentHTML('beforeend', icon('next'));
$('#bNext').onclick = () => { if (screen !== 'play' || G.mode === 'draw') return; G.idx = (G.idx + 1) % LIST[G.grp].length; loadGlyph(); };
$('#mbox').addEventListener('pointerdown', e => {
  if (e.target.closest('.pencil') == null) return;
  pM.hop(); sfx.boing();
  if (G.mode === 'draw') { say('Bé vẽ gì cũng được!'); return; }
  if (G.state === 'play') { const t = G.mode === 'trace' ? 'Bắt đầu từ chấm xanh, tô theo mũi tên nhé!' : 'Bé tự viết, bắt đầu từ chấm xanh nhé!'; say(t); bubble('<i class="gdot"></i> ' + (G.mode === 'trace' ? 'Tô theo mũi tên nhé!' : 'Bắt đầu từ chấm xanh nhé!')); demoStroke(G.cur, 1); }
  else say(pick(['Bé giỏi quá!', 'Đẹp lắm!', 'Viết tiếp nào!']));
});

/* ---------- tools (crayons + buttons) ---------- */
const SIZES = [3, 6.5, 12], ERASER = 15;
function buildTools() {
  const draw = G.mode === 'draw', list = draw ? CRAY : CRAY.slice(0, 7), cur = draw ? P.dcolor : P.color, cr = $('#crayons');
  cr.style.setProperty('--cc', draw ? 5 : 4);
  cr.innerHTML = list.map(c => `<button class="cr${c.id === cur && !(draw && G.draw && G.draw.erase) ? ' on' : ''}" data-id="${c.id}" style="--crc:${c.c || '#a35cff'}" aria-label="${c.n}">${crayonSVG(c)}</button>`).join('');
  $$('.cr', cr).forEach(b => b.onclick = () => {
    const id = b.dataset.id; sfx.pick();
    if (draw) { P.dcolor = id; if (G.draw) G.draw.erase = false; } else { P.color = id; renderInk(); }
    saveP(); pM.tip(crayById(id).c); buildTools();
  });
  pM.tip(crayById(cur).c);
  const tr = $('#trow'); tr.innerHTML = '';
  const ib = (ic, lab, fn, extra) => { const b = el('button', 'ibtn' + (extra || ''), typeof ic === 'string' && ic.startsWith('<') ? ic : icon(ic)); b.setAttribute('aria-label', lab); b.onclick = fn; tr.appendChild(b); return b; };
  if (!draw) {
    ib('eye', 'Xem mẫu', () => { if (G.state === 'play') { demoStroke(G.cur, 1); } });
    ib('replay', 'Viết lại', () => { if (G.state !== 'idle') loadGlyph(); });
  } else {
    SIZES.forEach((s, i) => ib(`<i class="sz" style="width:${8 + i * 7}px;height:${8 + i * 7}px"></i>`, 'Cỡ bút ' + (i + 1), () => { P.brush = i; G.draw.erase = false; saveP(); sfx.pick(); buildTools(); }, P.brush === i && !G.draw.erase ? ' on' : ''));
    ib(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M14.5 4.5l5 5-8.5 8.5H6.5l-2-2a2 2 0 0 1 0-2.8z"/><path d="M10 9l5 5M11 18h9"/></svg>`, 'Tẩy', () => { G.draw.erase = !G.draw.erase; sfx.pick(); buildTools(); }, G.draw.erase ? ' on' : '');
    ib('undo', 'Hoàn tác', () => drawUndo());
    ib('trash', 'Xóa hết', () => drawClear());
    ib('save', 'Lưu ảnh', () => drawSave());
  }
}

/* ---------- Vẽ tự do (whiteboard) ---------- */
function startDraw(gl, from) {
  leavePlay();
  G.mode = 'draw'; G.from = from; G.g = gl ? prep(gl) : null; G.S = G.g ? G.g.S : null; G.state = 'play'; G.idx = gl ? LIST[gl.grp].indexOf(gl) : 0;
  G.draw = { strokes: [], hist: [], erase: false };
  setGroupColors(gl ? gl.grp : 'S'); document.body.dataset.pmode = 'draw';
  show('play'); panel.classList.remove('isdone'); faceSvg.innerHTML = ''; alive.className = '';
  buildTools(); buildMid(); layout();
  round++;
  if (!SEEN.draw) { SEEN.draw = 1; saveSeen(); say('Chọn bút sáp, rồi vẽ thật đẹp nhé!'); bubble('Bé vẽ gì cũng được! 🎨', 3000); }
  else say(gl ? 'Bé viết thử chữ ' + gl.name + ' nhé!' : 'Vẽ tự do!');
}
function drawDown(u) {
  const d = G.draw; if (!d) return;
  d.live = newPoly(u, P.dcolor, d.erase ? ERASER : SIZES[P.brush] || 6.5, d.erase);
  paintPoly(d.live, 0);
}
function drawMove(u) { const d = G.draw; if (!d || !d.live) return; if (polyAdd(d.live, u)) { paintPoly(d.live, d.live.pts.length - 1); if (!d.live.erase && performance.now() - scrT > 80) { scrT = performance.now(); snd.scratch(); } } }
function drawUp() { const d = G.draw; if (!d || !d.live) return; d.strokes.push(d.live); d.live = null; }
function drawUndo() {
  const d = G.draw; if (!d) return;
  if (d.strokes.length) d.strokes.pop(); else if (d.hist.length) d.strokes = d.hist.pop(); else { snd.soft(); return; }
  sfx.swap(); renderInk();
}
function drawClear() {
  const d = G.draw; if (!d || !d.strokes.length) { snd.soft(); return; }
  d.hist.push(d.strokes); d.strokes = []; sfx.whoosh(); renderInk();
  const c = toScr([VB[0] + VB[2] / 2, VB[1] + VB[3] / 2]); burst(c[0], c[1], { n: 14, shape: 'circle', colors: ['#dfe7f6', '#ffffff', '#c9d6f0'] });
}
function drawSave() {
  const d = Kit.dpr(), c = document.createElement('canvas'); c.width = ink.width; c.height = ink.height; const x = c.getContext('2d');
  x.fillStyle = '#fffdf8'; x.fillRect(0, 0, c.width, c.height);
  x.setTransform(d, 0, 0, d, 0, 0); x.lineWidth = 1.2;
  for (let y = Math.ceil(VB[1] / 10) * 10; y <= VB[1] + VB[3]; y += 10) { const py = (y - VB[1]) * K; x.strokeStyle = y === 100 ? '#ffa3b8' : y === 20 || y === 60 ? '#b3cbf3' : '#edf2fc'; x.beginPath(); x.moveTo(0, py); x.lineTo(PR.w, py); x.stroke(); }
  x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(ink, 0, 0);
  if (Kit.saveCanvas(c, 'be-tap-viet.png')) { sfx.coin(); Kit.toast('Đã lưu tranh! 🖼️'); pM.hop(); }
}

/* ---------- debug / test hooks (read-only) ---------- */
window.__dbg = {
  state: () => ({ screen, mode: G.mode, grp: G.grp, idx: G.idx, key: G.g && G.g.key, st: G.state, cur: G.cur, prog: G.prog, n: G.S ? G.S.length : 0,
    N: G.S && G.S[G.cur] ? G.S[G.cur].n : 0, tolPx: R2(G.tolPx), k: R2(K), onPath: G.onPath, ptr: G.ptrOn, tracking: G.tracking, stars: G.lastStars,
    wrong: G.stats && G.stats.wrong, fails: G.stats && G.stats.fails, polys: G.polys.length, draw: G.draw ? G.draw.strokes.length : 0 }),
  pts(si, step = 3, rev = false) {
    const S = G.S[si]; let src = S.pts0; if (rev) src = src.slice().reverse();
    const out = []; for (let i = 0; i <= S.n; i += step) out.push(toScr(src[i])); const l = toScr(src[S.n]); if (out.length && hyp(out[out.length - 1], l) > 0.5) out.push(l);
    return out.map(p => [R2(p[0]), R2(p[1])]);
  },
  toScr: u => toScr(u).map(R2),
  counts: () => Object.fromEntries(Object.entries(LIST).map(([k, v]) => [k, v.length])),
  totalStars,
  sheet(grp, cols = 8, hh = 150, faces = false) {
    const o = $('#sheet'); if (o) o.remove();
    const box = el('div'); box.id = 'sheet';
    box.style.cssText = `position:fixed;inset:0;z-index:300;background:#fff;display:grid;grid-template-columns:repeat(${cols},1fr);gap:2px;padding:2px;overflow:auto;align-content:start`;
    (grp ? LIST[grp] : Object.values(LIST).flat()).forEach(g => {
      prep(g); const [x0, y0, x1, y1] = g.box, vb = [x0, y0, x1 - x0, y1 - y0].map(R2);
      const body = faces ? g.S.map(S => `<path d="${S.d}" fill="none" stroke="#7aa8ff" stroke-width="${g.lane * 0.76}" stroke-linecap="round" stroke-linejoin="round"/>`).join('') + g.faces.map(faceMarkup).join('')
        : guideMarkup(g, { cur: 0, sheet: true });
      box.insertAdjacentHTML('beforeend', `<div style="border:1px solid #e4e4e4;position:relative;background:#fffdf8"><svg viewBox="${vb.join(' ')}" style="width:100%;height:${hh}px;display:block">${paperLines(vb)}${body}</svg><div style="position:absolute;left:3px;top:1px;font:700 12px sans-serif;color:#888">${g.key}</div></div>`);
    });
    document.body.appendChild(box);
  },
  unsheet() { const o = $('#sheet'); if (o) o.remove(); },
};

renderTitle();
Kit.music.start(SONG);
})();
