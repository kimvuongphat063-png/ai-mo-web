<!DOCTYPE html>
<html lang="vi" data-game="spelling">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#62bdf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bé Tập Đánh Vần</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
:root{--c1:#2fa6f2;--c1d:#1a7cc6;--c1l:#e0f2ff;--c2:#45c35a;--c2d:#2a983d;--bg1:#86cdfb;--bg2:#fff3cf;--ink:#24385f;--ink-soft:#5b7093;
  --leaf:#4fcf5f;--leafd:#2ea343;--sun:#ffd84a;--sund:#e9a800}
body{background:linear-gradient(180deg,#76c5fa 0%,#b3e0ff 44%,#e6f5ff 72%,#fff4d2 100%)}
.k-ov{background:rgba(18,52,96,.42)}
.k-panel{box-shadow:0 14px 0 rgba(20,70,130,.16),0 30px 60px rgba(20,60,120,.3)}
.k-panel h2{color:var(--c1d)}

/* ---------- sky ---------- */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cloud{position:absolute;left:0;width:var(--w);height:calc(var(--w) * .34);background:#fff;border-radius:999px;opacity:.9;
  animation:cloud var(--d,80s) linear infinite;will-change:transform}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:52%;height:150%;left:14%;bottom:28%}
.cloud::after{width:36%;height:115%;right:16%;bottom:32%}
@keyframes cloud{from{transform:translateX(-40vw)}to{transform:translateX(120vw)}}
.sun{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,#fff6b0 0 34%,#ffe066 35% 52%,rgba(255,224,102,.35) 53% 66%,transparent 67%);transition:opacity .4s}
.hills{position:absolute;left:-10%;right:-10%;bottom:-1px;height:22vh;transition:opacity .4s,transform .5s}
.hills i{position:absolute;bottom:-60%;border-radius:50%;display:block}
.hills i:nth-child(1){left:-5%;width:70%;height:150%;background:#8ee07a}
.hills i:nth-child(2){right:-8%;width:72%;height:170%;background:#6fd16a}
.hills i:nth-child(3){left:30%;width:50%;height:120%;background:#a6ea8a}
body:not([data-screen="title"]) .hills{opacity:0;transform:translateY(40px)}
body[data-screen="play"] .sun{opacity:.45}

/* ---------- tiles (shared look) ---------- */
.tin,.mt{position:absolute;inset:0;border-radius:24%;
  background:linear-gradient(180deg,var(--tl,#d2ebff) 0%,var(--tc,#a3d5ff) 58%);
  box-shadow:inset 0 calc(var(--ts) * .05) 0 rgba(255,255,255,.6),inset 0 calc(var(--ts) * -.05) 0 rgba(0,0,0,.07),
    0 calc(var(--ts) * .085) 0 var(--td,#68ade6),0 calc(var(--ts) * .13) calc(var(--ts) * .14) rgba(25,60,110,.22);
  display:grid;place-items:center;transition:box-shadow .18s,background .3s}
.tin::before,.mt::before{content:"";position:absolute;left:13%;top:8%;width:34%;height:17%;border-radius:50%;background:rgba(255,255,255,.62);transform:rotate(-14deg)}
.tin::after,.mt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(100deg,rgba(120,70,20,.035) 0 2px,transparent 2px 9px)}
.ch{position:relative;z-index:1;font-weight:800;font-size:calc(var(--ts) * .6);line-height:1;color:var(--ink);transform:translateY(5%);
  letter-spacing:0;white-space:nowrap}
.upper .ch,.upper .gh,.upper .wc .w,.upper .bubble b,.upper .rw b{text-transform:uppercase}
.upper .ch,.upper .gh{font-size:calc(var(--ts) * .5);transform:translateY(8%)}

.tile{position:absolute;left:0;top:0;width:var(--ts);height:var(--ts);z-index:10;cursor:grab;will-change:transform;touch-action:none}
.tile.up{z-index:40}
.tile .tin{transform-origin:50% 90%}
.tile .tin.lift{box-shadow:inset 0 calc(var(--ts) * .05) 0 rgba(255,255,255,.6),inset 0 calc(var(--ts) * -.05) 0 rgba(0,0,0,.07),
  0 calc(var(--ts) * .085) 0 var(--td),0 calc(var(--ts) * .32) calc(var(--ts) * .3) rgba(25,60,110,.28)}
.tile.fixed{cursor:default}
.tile.fixed .tin{--tc:#fff;--tl:#fff;--td:#cfe0f2}
.tile.fixed .tin::after{display:none}
.tin.land{animation:land .34s ease-out}
@keyframes land{0%{transform:scale(1.16,.84)}45%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
.tin.hop{animation:hopin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hopin{0%{transform:scale(.2)}100%{transform:scale(1)}}
.tin.bad{--tc:#ffb4a8;--tl:#ffd8d1;--td:#e07f70;animation:k-shake .48s ease-in-out}
.tin.wig{animation:k-wiggle .4s ease-in-out}
.tin.keep::before{background:rgba(255,255,255,.62)}
.tin .ok-dot{position:absolute;right:-6%;top:-6%;width:30%;height:30%;border-radius:50%;background:var(--leaf);box-shadow:0 2px 0 var(--leafd);
  display:grid;place-items:center;color:#fff;transform:scale(0);transition:transform .3s cubic-bezier(.2,1.8,.4,1);z-index:2}
.tin .ok-dot svg{width:72%;height:72%}
.tin.keep .ok-dot{transform:scale(1)}
.tile .tin.ok,.tile.fixed .tin.ok{--tc:#5fd36a;--tl:#a4f0a0;--td:#2f9e3f;animation:okpop .5s cubic-bezier(.2,1.6,.4,1)}
.tile.fixed .tin.ok::after{display:block}
.tin.ok .ch{color:#fff;text-shadow:0 calc(var(--ts) * .03) 0 rgba(20,90,30,.35)}
.tin.ok .ok-dot{transform:scale(0)}
@keyframes okpop{0%{transform:scale(1)}35%{transform:scale(1.22) translateY(-10%)}100%{transform:scale(1)}}
.tin.glow{box-shadow:0 0 0 calc(var(--ts) * .06) #fff,0 0 calc(var(--ts) * .35) calc(var(--ts) * .1) rgba(255,205,40,.95),0 calc(var(--ts) * .085) 0 var(--td);
  animation:glow .5s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.1)}}
.tile.out{transition:opacity .35s}
.tile.out .tin{opacity:0;transform:scale(.3);transition:opacity .35s,transform .35s}

/* ---------- play stage ---------- */
#play{justify-content:flex-start}
#stage{position:absolute;left:var(--safe-l);right:var(--safe-r);bottom:var(--safe-b);top:calc(var(--bar-h) + var(--safe-t));touch-action:none;--ts:64px}
.board{position:absolute;border-radius:calc(var(--ts) * .34);background-color:#fff;
  background-image:linear-gradient(rgba(140,110,220,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(140,110,220,.16) 1px,transparent 1px),
    linear-gradient(rgba(140,110,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(140,110,220,.07) 1px,transparent 1px);
  background-size:var(--ts) var(--ts),var(--ts) var(--ts),calc(var(--ts) / 4) calc(var(--ts) / 4),calc(var(--ts) / 4) calc(var(--ts) / 4);
  background-position:var(--gx,0) var(--gy,0);
  box-shadow:0 7px 0 rgba(26,124,198,.2),0 16px 28px rgba(20,70,130,.16)}
.board::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--ts) * .12);width:2px;background:rgba(255,110,130,.35)}
.slot{position:absolute;left:0;top:0;width:var(--ts);height:var(--ts);border-radius:24%;background:rgba(47,166,242,.07);
  border:max(2px,calc(var(--ts) * .045)) dashed rgba(47,166,242,.55);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.slot.pop{animation:k-pop .4s cubic-bezier(.2,1.6,.4,1) both}
.slot .gh{font-weight:800;font-size:calc(var(--ts) * .6);line-height:1;color:rgba(36,56,95,.17);transform:translateY(5%);transition:opacity .4s}
.slot .gh.hide{opacity:0}
.slot.next{border-color:var(--c1);background:rgba(47,166,242,.13);animation:slotp 1.3s ease-in-out infinite}
@keyframes slotp{0%,100%{box-shadow:0 0 0 0 rgba(47,166,242,.0)}50%{box-shadow:0 0 0 calc(var(--ts) * .08) rgba(47,166,242,.22)}}
.slot.hot{border-color:var(--sund);border-style:solid;background:rgba(255,216,74,.4);transform:scale(1.08)}
.tray{position:absolute;border-radius:calc(var(--ts) * .36);
  background:repeating-linear-gradient(92deg,rgba(150,90,30,.07) 0 3px,transparent 3px 17px),
    radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.35),transparent 60%),linear-gradient(180deg,#f5cf93,#e6ad63);
  box-shadow:inset 0 calc(var(--ts) * .1) calc(var(--ts) * .14) rgba(120,64,10,.32),inset 0 -3px 0 rgba(255,255,255,.3),
    0 calc(var(--ts) * .12) 0 #c3843d,0 calc(var(--ts) * .22) calc(var(--ts) * .3) rgba(90,50,10,.25)}
.tray::before{content:"";position:absolute;inset:calc(var(--ts) * .1);border-radius:calc(var(--ts) * .28);border:2px dashed rgba(255,255,255,.35);pointer-events:none}

.pcard{position:absolute;left:0;top:0;width:var(--c);height:var(--c);border-radius:15%;background:var(--pc,#ffe3ec);
  box-shadow:0 0 0 calc(var(--c) * .028) #fff,0 calc(var(--c) * .05) 0 calc(var(--c) * .028) rgba(26,124,198,.22),0 calc(var(--c) * .09) calc(var(--c) * .12) rgba(20,70,130,.2)}
.pcard .pin{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:grid;place-items:center;
  background-image:radial-gradient(rgba(255,255,255,.7) 14%,transparent 16%);background-size:calc(var(--c) / 7) calc(var(--c) / 7)}
.pcard .pin::after{content:"";position:absolute;left:12%;right:12%;bottom:9%;height:12%;border-radius:50%;background:rgba(0,0,0,.07)}
.pcard .pe{position:relative;z-index:1;font-size:calc(var(--c) * .58);line-height:1;filter:drop-shadow(0 calc(var(--c) * .02) 0 rgba(0,0,0,.08))}
.pcard .pe{animation:pefloat 3.4s ease-in-out infinite}
@keyframes pefloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3%) rotate(2deg)}}
.pcard.enter{animation:cardin .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cardin{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.pcard.exit{animation:cardout .4s ease-in both}
@keyframes cardout{to{transform:scale(.6) rotate(8deg);opacity:0}}
.pcard.happy{animation:happy .9s cubic-bezier(.3,1.4,.5,1)}

@keyframes phop{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.06,.92)}50%{transform:translateY(-16px) scale(.96,1.05)}}

@keyframes flapl{from{transform:rotate(20deg)}to{transform:rotate(70deg)}}

  const cands = [];
  for (let ts = Math.floor(tsMax); ts >= 30; ts -= 2) {
    const g = Math.round(ts * .14), wg = Math.round(ts * .55), bp = Math.round(ts * .22), lg = Math.round(ts * .3);
    const tg = Math.round(ts * .26), tp = Math.round(ts * .3), sg = clamp(ts * .36, 12, 34);
    const boards = splits.map(lines => {
      const lw = lines.map(ln => ln.reduce((a, k) => a + k * ts + (k - 1) * g, 0) + (ln.length - 1) * wg);
      return { lines, lw, w: Math.max(...lw) + 2 * bp, h: lines.length * ts + (lines.length - 1) * lg + 2 * bp };
    });
    const trayFor = colW => {
      let cols = Math.min(m, Math.floor((colW - 2 * tp + tg) / (ts + tg))); if (cols < 1) return null;
      const rows = Math.ceil(m / cols); cols = Math.ceil(m / rows);
      return { cols, rows, w: cols * ts + (cols - 1) * tg + 2 * tp, h: rows * ts + (rows - 1) * tg + 2 * tp + ts * .1 };
    };
    const base = { ts, g, wg, bp, lg, tg, tp, sg, pad, land };
    if (!land) {
      const colW = SW - 2 * pad;
      const b = boards.filter(b => b.w <= colW).sort((x, y) => x.h - y.h)[0]; if (!b) continue;
      const tr = trayFor(colW); if (!tr) continue;
      const c = Math.min(cMax, colW / GW, (SH - 2 * pad - b.h - tr.h - 2 * sg - ts * .16) / 1.04);
      if (c < cMin) continue;
      cands.push(Object.assign({ c, b, tr, colW }, base));
    } else {
      let lastRows = 0;
      for (let c = Math.min(cMax, (SW - 2 * pad) * .5 / GW); c >= cMin; c -= 6) {
        const colW = SW - 2 * pad - c * GW - sg * 1.6;
        const b = boards.filter(b => b.w <= colW).sort((x, y) => x.h - y.h)[0]; if (!b) continue;
        const tr = trayFor(colW); if (!tr) continue;
        if (b.h + sg + tr.h + ts * .16 > SH - 2 * pad) continue;
        if (lastRows && tr.rows >= lastRows) continue; // only keep the largest card for each tray shape
        lastRows = tr.rows;
        cands.push(Object.assign({ c, b, tr, colW }, base));
      }
    }
  }
  if (!cands.length) return null;
  const top = cands[0].ts;
  const score = k => Math.min(k.c, cPref) * 2 + k.c * .3 + k.ts * (land ? 3 : 2.2)
    - (land ? (k.tr.rows - 1) * k.ts * 1.1 : (k.tr.rows - Math.ceil(m / 5)) * k.ts * .5);
  const floor = land ? Math.max(top * .72, Math.min(top, 56)) : Math.max(top * .78, Math.min(top, 50));
  return cands.filter(k => k.ts >= floor).sort((a, b) => score(b) - score(a))[0];
}

function layout(initial) {
  if (!W) return;
  const st = $('#stage'), SW = st.clientWidth, SH = st.clientHeight;
  if (!SW || !SH) return;
  const m = W.tray.length;
  let k = solve(SW, SH, W.item, m);
  if (!k) { // tiny screen fallback
    const ts = 34; k = solve(SW * 1.25, SH * 1.25, W.item, m) || { ts, c: 90, g: 4, wg: 16, bp: 6, lg: 8, tg: 6, tp: 8, sg: 8, pad: 6, land: SW > SH,
      b: { lines: [W.item.parts.map(p => p.length)], lw: [0], w: 0, h: ts + 12 }, tr: { cols: m, rows: 1, w: m * 40, h: 52 }, colW: SW - 12 };
    k = Object.assign({}, k, { ts: Math.max(28, Math.floor(k.ts * .8)), c: k.c * .8 });
  }
  const { ts, c, b, tr, g, wg, bp, lg, tg, tp, sg, pad, land } = k;
  const pw = c * .5, ph = pw * 1.15;
  const trayW = Math.max(tr.w, Math.min(k.colW, b.w)), trayH = tr.h;
  let cardX, cardY, boardX, boardY, trayX, trayY, colX, colW;
  if (!land) {
    const used = c * 1.04 + sg + b.h + sg + trayH + ts * .16, free = Math.max(0, SH - 2 * pad - used);
    const gw = c * (1.07) + pw * .86;
    cardX = (SW - gw) / 2 + pw * .86; cardY = pad + free * .32 + c * .03;
    boardY = cardY + c + sg + free * .26; trayY = boardY + b.h + sg + free * .18;
    boardX = (SW - b.w) / 2; trayX = (SW - trayW) / 2;
  } else {
    const gw = c * 1.07 + pw * .86, rightW = Math.max(b.w, trayW);
    const total = gw + sg * 1.6 + rightW, off = Math.max(0, (SW - 2 * pad - total) / 2);
    cardX = pad + off + pw * .86; cardY = Math.max(pad + c * .07, (SH - c) / 2 - Math.min(ph * .1, 10));
    colX = pad + off + gw + sg * 1.6; colW = rightW;
    const used = b.h + sg + trayH + ts * .16, free = Math.max(0, SH - 2 * pad - used);
    boardY = pad + free * .42; trayY = boardY + b.h + sg + free * .16;
    boardX = colX + (colW - b.w) / 2; trayX = colX + (colW - trayW) / 2;
  }
  LAY = { ts, c, W: SW, H: SH, slots: [], homes: [] };
  st.style.setProperty('--ts', ts + 'px');
  // card & parrot & bubble
  const pc = $('#pcard'); pc.style.setProperty('--c', c + 'px'); pc.style.left = cardX + 'px'; pc.style.top = cardY + 'px';
  const pp = $('#pp'); pp.style.setProperty('--pw', pw + 'px');
  const px = cardX - pw * .86 - pw * .06, py = cardY + c - ph + ph * .02;
  pp.style.left = px + 'px'; pp.style.top = py + 'px';
  const bub = $('#bub');
  bub.style.setProperty('--bs', clamp(c * .1, 17, 30) + 'px');
  bub.style.left = (px + pw * .32) + 'px'; bub.style.bottom = (SH - py - ph * .08) + 'px';
  bub.style.setProperty('--bw', (land ? Math.max(c * .95, 200) : Math.max(pw * 1.55, 130)) + 'px');
  // board
  const bd = $('#board'); Object.assign(bd.style, { left: boardX + 'px', top: boardY + 'px', width: b.w + 'px', height: b.h + 'px' });
  bd.style.setProperty('--gx', bp + 'px'); bd.style.setProperty('--gy', bp + 'px');
  // slots
  let si = 0;
  b.lines.forEach((ln, li) => {
    let x = boardX + (b.w - b.lw[li]) / 2; const y = boardY + bp + li * (ts + lg);
    ln.forEach((n, wi) => {
      for (let q = 0; q < n; q++) { LAY.slots.push({ x, y }); x += ts + (q < n - 1 ? g : 0); }
      x += wg;
    });
  });
  W.slots.forEach((s, i) => { const p = LAY.slots[i]; s.x = p.x; s.y = p.y; s.el.style.left = p.x + 'px'; s.el.style.top = p.y + 'px'; });
  // tray
  const ty = $('#tray'); Object.assign(ty.style, { left: trayX + 'px', top: trayY + 'px', width: trayW + 'px', height: trayH + 'px' });
  for (let r = 0, i = 0; r < tr.rows; r++) {
    const n = Math.min(tr.cols, m - r * tr.cols), rw = n * ts + (n - 1) * tg;
    let x = trayX + (trayW - rw) / 2; const y = trayY + tp + r * (ts + tg);
    for (let q = 0; q < n; q++, i++) { LAY.homes.push({ x, y }); x += ts + tg; }
  }
  // place tiles
  W.tiles.forEach(t => {
    if (t.drag) return;
    const p = typeof t.at === 'number' ? W.slots[t.at] : LAY.homes[t.home];
    if (!p) return;
    if (t.tw) { t.tw.tx = p.x; t.tw.ty = p.y; }
    else setPos(t, p.x, p.y, 1, 0);
  });
  if (!initial) hideHand();
}
let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); layout(false); rzT = setTimeout(() => layout(false), 120); });

/* =====================================================================
   KEYBOARD (bonus)
   ===================================================================== */
document.addEventListener('keydown', e => {
  if (screen !== 'play' || !G || !W || document.querySelector('.k-ov')) { if (e.key === 'Escape' && screen !== 'title' && !document.querySelector('.k-ov')) $('#bBack').click(); return; }
  if (e.key === 'Escape') { $('#bBack').click(); return; }
  if (G.busy || W.done) return;
  if (e.key === ' ') { e.preventDefault(); sayWord(false); return; }
  if (e.key === 'Enter') { e.preventDefault(); hint(); return; }
  if (e.key === 'Backspace') {
    e.preventDefault();
    const s = [...W.slots].reverse().find(s => s.tile && !s.tile.locked); if (s) { speakLetter(s.tile.ch); returnToTray(s.tile); }
    return;
  }
  const k = (e.key || '').toLowerCase().normalize('NFC'); if (k.length !== 1) return;
  const next = emptySlots()[0];
  const cands = W.tray.filter(t => t.at === 'tray' && !t.locked && (t.ch === k || plainOf(t.ch) === plainOf(k)));
  if (!cands.length) return;
  const t = cands.find(t => next && t.ch === next.ch) || cands.find(t => t.ch === k) || cands[0];
  W.touched = true; hideHand(); speakLetter(t.ch); snd.tok(1.1); tapTile(t);
});

/* =====================================================================
   WORD BOOK (Sổ từ của bé)
   ===================================================================== */
let bookTab = 0;
function openBook() {
  const m = Kit.overlay('', { closable: true, cls: 'book', onClose: () => { save.fresh = []; persist(); } });
  const fresh = new Set(save.fresh);
  const tabIcon = n => Array.from({ length: n }, (_, i) => { const c = TILE_COLORS[(i * 2 + n) % 7]; return `<span class="m"><span class="mt" style="--tc:${c.c};--tl:${c.l};--td:${c.d}"></span></span>`; }).join('');
  const render = () => {
    m.panel.querySelectorAll(':scope > :not(.k-close)').forEach(n => n.remove());
    const n = save.book.length, list = GROUPS[bookTab];
    const box = el('div');
    box.innerHTML = `<h2>Sổ từ của bé</h2>
      <div class="bcount">📖 ${n} / ${ALL.length}<span class="bar"><i style="width:${n / ALL.length * 100}%"></i></span></div>
      <div class="hats"><span class="mini-p" id="miniP"></span>
        <button class="hat-b none${!save.hat ? ' on' : ''}" data-h="">✕</button>
        ${HATS.map(h => { const ok = save.hats.includes(h.id); return `<button class="hat-b${ok ? '' : ' lock'}${save.hat === h.id ? ' on' : ''}" data-h="${h.id}" aria-label="${h.name}"><span class="emo">${h.emo}</span>${ok ? '' : `<b>${h.need}</b>`}</button>`; }).join('')}
      </div>
      <div class="btabs">${GROUPS.map((gr, i) => `<button class="btab${i === bookTab ? ' on' : ''}" data-t="${i}" aria-label="Nhóm ${i + 1}">${tabIcon([2, 3, 5][i])}<b>${gr.filter(x => bookSet.has(x.w)).length}/${gr.length}</b></button>`).join('')}</div>
      <div class="bgrid">${list.map((x, i) => {
        const ok = bookSet.has(x.w);
        const dots = x.parts.map(p => p.map(() => '<i></i>').join('')).join('<i class="sp"></i>');
        return `<button class="wc${ok ? '' : ' no'}${ok && fresh.has(x.w) ? ' newc' : ''}" data-i="${i}" style="--pc:${x.bg}"><span class="emo">${x.e}</span>${ok ? `<span class="w">${esc(x.w)}</span>` : `<span class="dots">${dots}</span>`}</button>`;
      }).join('')}</div>
      ${n === 0 ? '<p>Ghép đúng một từ để thêm vào Sổ từ nhé!</p>' : ''}`;
    m.panel.insertBefore(box, m.panel.firstChild);
    mountParrot($('#miniP', box));
    $$('.btab', box).forEach(b => b.onclick = () => { bookTab = +b.dataset.t; sfx.pick(); render(); });
    $$('.hat-b', box).forEach(b => b.onclick = () => {
      const id = b.dataset.h, h = HATS.find(x => x.id === id);
      if (h && !save.hats.includes(id)) { sfx.bad(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); Kit.toast('Sưu tầm ' + h.need + ' từ để mở nhé!'); return; }
      save.hat = id; persist(); refreshHats(); snd.squawk(); render();
      const mp = $('#miniP svg', m.panel); if (mp) mood(mp, 'cheer', 1200);
    });
    $$('.wc', box).forEach(b => b.onclick = () => {
      const x = list[+b.dataset.i];
      if (!bookSet.has(x.w)) { sfx.bad(); b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); say('Bé chưa học từ này!'); return; }
      sfx.pop(); say(x.p); b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle');
      const r = b.getBoundingClientRect(); sparkle(r.left + r.width / 2, r.top + r.height / 3);
    });
  };
  // open the tab that has new words, if any
  if (save.fresh.length) { const f = BYW.get(save.fresh[save.fresh.length - 1]); if (f) bookTab = f.g; }
  render(); say('Sổ từ của bé!');
}

/* blur buttons after a pointer click so Space/Enter keys stay with the game */
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b && e.detail > 0) b.blur(); });

applyCase(); refreshBookBadge();
Kit.music.start('calm');
window.__sp = { get G() { return G; }, get W() { return W; }, get LAY() { return LAY; }, save, ALL, POOLS, hint, startRound, letterName, distractors, vowelVariants };
})();
