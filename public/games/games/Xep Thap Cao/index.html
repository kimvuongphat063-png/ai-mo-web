<!DOCTYPE html>
<html lang="vi" data-game="xepthap">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6ec0ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Xếp Tháp Cao</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}

/* ===== Kit v2 additions (Bộ game 2) ===== */
/* tutorial hand */
.k-hand{position:fixed;z-index:72;left:0;top:0;width:clamp(54px,9vmin,78px);height:auto;pointer-events:none;opacity:0;
  filter:drop-shadow(0 6px 6px rgba(30,10,80,.25));transition:opacity .25s;will-change:transform}
.k-hand.on{opacity:1}
.k-hand .tapring{transform-origin:22px 10px;animation:k-ring 1s ease-out infinite}
@keyframes k-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* segmented chips (Dễ / Vừa / Khó …) */
.k-seg{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(40,20,90,.12)}
.k-seg button{border:none;cursor:pointer;min-height:48px;min-width:56px;padding:0 16px;border-radius:999px;background:transparent;
  font:800 clamp(16px,2.6vmin,21px)/1 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.k-seg button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.k-seg button:active{transform:translateY(2px)}
/* tile buttons for mode / level grids */
.k-tile{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;color:var(--ink);padding:12px 10px 10px;
  box-shadow:0 7px 0 rgba(40,20,90,.16),0 12px 20px rgba(40,20,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:800 clamp(16px,2.7vmin,22px)/1.05 var(--font);transition:transform .14s,box-shadow .14s;min-height:64px;text-align:center}
.k-tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(40,20,90,.16)}
.k-tile .emo{font-size:clamp(34px,6.4vmin,54px)}
.k-tile small{font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .k-tstars{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5;display:block}
.k-mini-star.on svg{color:#ffc83d;filter:drop-shadow(0 1px 0 #e09a00)}
/* scrollable screen body under the bar */
.k-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--bar-h) + var(--safe-t) + 6px) calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l));
  display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  box-shadow:0 4px 0 rgba(40,20,90,.12);white-space:nowrap}
.k-pill .emo{font-size:1.3em}
@keyframes k-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}50%{filter:drop-shadow(0 0 14px rgba(255,220,80,.95))}}
.k-glow{animation:k-glow 1.2s ease-in-out infinite}
@keyframes k-squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}}
.k-squash{animation:k-squash .5s ease}
@keyframes k-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.k-jump{animation:k-jump .5s cubic-bezier(.3,1.5,.5,1)}
</style>
<style>
:root{--c1:#ff8a2a;--c1d:#cf5a08;--c2:#ff6fa5;--c2d:#d9467f;--bg1:#8fd3ff;--bg2:#dff5ff;--ink:#3b2f63}
body{background:linear-gradient(180deg,#6ec0ff 0%,#a6dcff 48%,#dcf4ff 100%)}
body.playing .deco{display:none}

/* ---------- decorative sky (title / select / badges) ---------- */
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco .sun{position:absolute;right:8%;top:calc(var(--bar-h) + 2%);width:clamp(60px,12vmin,110px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fff6b0,#ffd23d 60%,#ffb703);box-shadow:0 0 0 12px rgba(255,226,120,.35),0 0 0 26px rgba(255,226,120,.18);animation:sunb 6s ease-in-out infinite}
@keyframes sunb{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.deco .cl{position:absolute;height:clamp(26px,5vmin,46px);border-radius:999px;background:#fff;opacity:.95;box-shadow:0 6px 0 rgba(120,170,220,.25);animation:drift linear infinite}
.deco .cl::before,.deco .cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.deco .cl::before{width:55%;aspect-ratio:1;left:14%;bottom:30%}
.deco .cl::after{width:38%;aspect-ratio:1;right:14%;bottom:36%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.deco .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:22vh}

/* ---------- mascot cat ---------- */
.cat{display:block;overflow:visible}
.cat *{transform-box:view-box}
.cat .c-all{transform-origin:100px 244px}
.cat .c-body{transform-origin:100px 240px;animation:c-breathe 3s ease-in-out infinite}
.cat .c-head{transform-origin:100px 160px;animation:c-nod 3.4s ease-in-out infinite;transition:transform .3s}
.cat .c-eyes{transform-origin:100px 110px;animation:c-blink 4.4s infinite}
.cat .c-pup{transition:transform .18s ease-out}
.cat .c-tail{transform-origin:136px 222px;animation:c-tail 2.4s ease-in-out infinite}
.cat .c-armL{transform-origin:74px 162px;transition:transform .32s cubic-bezier(.3,1.4,.5,1)}
.cat .c-armR{transform-origin:126px 162px;transition:transform .32s cubic-bezier(.3,1.4,.5,1)}
.cat .c-happy,.cat .c-mo,.cat .c-thumb,.cat .c-ham{opacity:0}
.cat.cheer .c-armL{transform:rotate(132deg)}
.cat.cheer .c-armR{transform:rotate(-132deg)}
.cat.cheer .c-all{animation:c-hop .6s cubic-bezier(.3,1.6,.5,1)}
.cat.cheer .c-eyes,.cat.thumb .c-eyes,.cat.dance .c-eyes{opacity:0}
.cat.cheer .c-happy,.cat.thumb .c-happy,.cat.dance .c-happy{opacity:1}
.cat.cheer .c-mo,.cat.dance .c-mo,.cat.oops .c-mo{opacity:1}
.cat.cheer .c-mc,.cat.dance .c-mc,.cat.oops .c-mc{opacity:0}
.cat.oops .c-armL{transform:rotate(168deg)}
.cat.oops .c-armR{transform:rotate(-168deg)}
.cat.oops .c-head{transform:translateY(5px) rotate(-4deg);animation:none}
.cat.thumb .c-armR{transform:rotate(-105deg)}
.cat.thumb .c-thumb{opacity:1}
.cat.thumb .c-head{transform:rotate(5deg);animation:none}
.cat.thumb .c-all{animation:c-hop .5s cubic-bezier(.3,1.6,.5,1)}
.cat.fix .c-armR{animation:c-hammer .24s ease-in-out 4}
.cat.fix .c-ham{opacity:1}
.cat.fix .c-hip{opacity:0}
.cat.dance .c-all{animation:c-dance .9s ease-in-out infinite}
.cat.dance .c-armL{animation:c-wavL .45s ease-in-out infinite alternate}
.cat.dance .c-armR{animation:c-wavR .45s ease-in-out infinite alternate}
.cat.dance .c-tail{animation-duration:.6s}
.cat.poke .c-all{animation:c-hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes c-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
@keyframes c-nod{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes c-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes c-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes c-hop{0%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-30px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.04,.96)}}
@keyframes c-hammer{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-95deg)}}
@keyframes c-dance{0%,100%{transform:translateY(0) rotate(-6deg)}25%{transform:translateY(-16px) rotate(0)}50%{transform:translateY(0) rotate(6deg)}75%{transform:translateY(-16px) rotate(0)}}
@keyframes c-wavL{from{transform:rotate(150deg)}to{transform:rotate(55deg)}}
@keyframes c-wavR{from{transform:rotate(-55deg)}to{transform:rotate(-150deg)}}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.4vmin,14px);padding:calc(var(--bar-h) + 4px) 16px 20px;z-index:1}
#title .tbox{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vmin,16px)}
.hero{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,1vmin,10px);cursor:pointer}
.hero .cat{width:clamp(130px,30vmin,250px);height:auto}
.hero canvas{width:clamp(88px,22vmin,180px);height:auto;transform-origin:50% 100%;animation:hsway 3.2s ease-in-out infinite}
.hero canvas.wob{animation:hwob .8s ease-in-out}
@keyframes hsway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes hwob{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}}
.logo{--c1d:#b8470a}
.logo .l2{color:#ffd23d;font-size:1.18em}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(4px,1.5vmin,14px)}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #title .tbox{flex-direction:row;gap:5vw}
  #title .tcol{display:flex;flex-direction:column;align-items:center}
  .hero .cat{width:min(34vmin,190px)}
  .hero canvas{width:min(24vmin,130px)}
}

/* ---------- select ---------- */
#select,#badges{z-index:1}
.selhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 18px}
.k-seg button .emo{font-size:1.5em}
.themes{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:min(1100px,100%);padding-bottom:6px}
.thm{width:clamp(150px,40vw,210px);padding:10px 8px 10px;gap:4px;justify-content:flex-start}
.thm canvas{width:100%;height:auto;aspect-ratio:6/5;display:block;border-radius:18px;background:linear-gradient(#bfe8ff,#e8f8ff)}
.thm .nm{font-size:clamp(17px,2.8vmin,22px)}
.thm .rec{display:flex;align-items:center;gap:4px;font-size:clamp(14px,2.2vmin,17px);color:#8a5a00;background:#fff4cf;border-radius:999px;padding:2px 10px;min-height:26px}
.thm .rec.none{background:#eef4ff;color:#7d8aa8}
.thm .rec .emo{font-size:1.05em}
@media (min-aspect-ratio:4/3){
  .thm{width:calc((min(1100px,100vw) - 110px) / 5)}
  .thm canvas{aspect-ratio:7/5}
}
@media (max-height:430px){
  .thm{padding:6px 6px 8px;gap:3px}
  .thm canvas{aspect-ratio:2/1}
  #select .k-scroll{gap:8px}
}

/* ---------- badges ---------- */
.shelf{width:min(980px,100%);background:linear-gradient(#c98a52,#b77840);border-radius:28px;padding:14px;box-shadow:inset 0 0 0 6px #a5672f,0 10px 0 rgba(90,50,20,.25);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,22vw,190px),1fr));gap:14px}
.bdg{border:none;cursor:pointer;border-radius:22px;background:#fff7ea;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;
  font:800 clamp(14px,2.2vmin,17px)/1.1 var(--font);color:var(--ink);box-shadow:0 6px 0 #8d5528;transition:transform .12s}
.bdg:active{transform:translateY(4px)}
.bdg .md{position:relative;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:38px;
  background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23d 55%,#f0a800);box-shadow:inset 0 -5px 0 #d08a00,0 4px 0 rgba(0,0,0,.15)}
.bdg .md::before,.bdg .md::after{content:"";position:absolute;bottom:-14px;width:16px;height:24px;background:#ff6b8b;z-index:-1;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.bdg .md::before{left:14px;transform:rotate(14deg)}
.bdg .md::after{right:14px;transform:rotate(-14deg);background:#4cc9f0}
.bdg small{font-weight:700;color:#8a7aa8;font-size:.82em}
.bdg.no{background:rgba(255,247,234,.55);box-shadow:0 6px 0 rgba(141,85,40,.5)}
.bdg.no .md{background:radial-gradient(circle,#e8e2f0,#cfc6dc);box-shadow:inset 0 -5px 0 #b3a9c4}
.bdg.no .md .emo{filter:grayscale(1) opacity(.35)}
.bdg.no .md::before,.bdg.no .md::after{background:#cfc6dc}

/* ---------- play ---------- */
#play{display:none;touch-action:none}
#play.on{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.catbox{position:absolute;left:calc(6px + var(--safe-l));bottom:calc(2px + var(--safe-b));width:90px;pointer-events:none;z-index:3}
.catbox .cat{width:100%;height:auto;position:relative;z-index:1;margin-bottom:-30%}
.catbox .basket{display:block;width:110%;margin-left:-5%;height:auto;position:relative;z-index:2}
.hud{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:nowrap}
.hud .k-pill{padding:4px 12px;min-height:42px;gap:6px}
.hud .k-pill b{font-size:1.15em}
.hud .k-pill small{font-weight:700;color:var(--ink-soft)}
.hud .tw svg{width:26px;height:26px}
.hud .hs{transition:background .2s,color .2s}
.hud .hs.on{background:#ffd23d;color:#7a4300;box-shadow:0 4px 0 #e09a00}
.hud .hs.dim{opacity:.6}
.hud .pop{animation:k-pop .35s cubic-bezier(.2,1.6,.4,1)}
.hud .k-mini-star svg{width:22px}
.ftxt{position:fixed;z-index:60;left:0;top:0;pointer-events:none;font-weight:800;white-space:nowrap;color:#fff;
  -webkit-text-stroke:.16em #7b5cff;paint-order:stroke fill;text-shadow:0 .08em 0 #7b5cff,0 .16em .25em rgba(0,0,0,.2);
  font-size:clamp(24px,5vmin,40px);animation:ftxt 1.05s cubic-bezier(.2,1.4,.4,1) forwards}
.ftxt.gold{color:#fff6b0;-webkit-text-stroke-color:#d0700a;text-shadow:0 .08em 0 #d0700a,0 .16em .25em rgba(0,0,0,.2);font-size:clamp(30px,6.4vmin,54px)}
.ftxt.oops{-webkit-text-stroke-color:#d9467f;text-shadow:0 .08em 0 #d9467f,0 .16em .25em rgba(0,0,0,.2);font-size:clamp(34px,7vmin,60px)}
.ftxt.big{font-size:clamp(30px,6.6vmin,56px);animation-duration:1.6s}
@keyframes ftxt{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}22%{transform:translate(-50%,-62%) scale(1.12);opacity:1}38%{transform:translate(-50%,-64%) scale(1)}78%{opacity:1}100%{transform:translate(-50%,-125%) scale(.95);opacity:0}}
.bpop{position:fixed;z-index:62;left:50%;top:calc(var(--bar-h) + var(--safe-t) + 8px);display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;
  padding:6px 18px 6px 6px;box-shadow:0 6px 0 rgba(40,20,90,.15),0 12px 24px rgba(40,20,90,.2);font-weight:800;font-size:clamp(15px,2.6vmin,20px);
  animation:bpop 2.8s ease forwards;pointer-events:none;white-space:nowrap}
.bpop .md{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23d 55%,#f0a800);box-shadow:inset 0 -3px 0 #d08a00}
@keyframes bpop{0%{transform:translate(-50%,-30px) scale(.6);opacity:0}12%{transform:translate(-50%,0) scale(1.06);opacity:1}20%{transform:translate(-50%,0) scale(1)}85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-20px);opacity:0}}
</style>
</head>

<div class="deco" id="deco">

<header class="k-bar">

<!-- TITLE -->

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }
    else ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + a + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.2, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 2, t, vol: vol * 0.22, dur: dur * 0.5, bus });
    tone({ f: f * 3.01, t, vol: vol * 0.07, dur: dur * 0.3, bus });
  }
  function marimba(f, t = 0, vol = 0.2, dur = 0.4, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 4, t, vol: vol * 0.16, dur: dur * 0.18, bus });
  }
  function pluck(f, t = 0, vol = 0.12, dur = 0.3, bus) { tone({ f, t, vol, dur, type: 'triangle', lp: 2200, bus }); }

  const sfx = {
    tap() { tone({ f: 700, to: 960, dur: 0.06, vol: 0.12, type: 'triangle' }); },
    click() { tone({ f: 1300, dur: 0.03, vol: 0.06, type: 'triangle' }); },
    pop() { tone({ f: 360, to: 1250, slide: 0.07, dur: 0.1, vol: 0.32 }); noise({ f: 2600, q: 0.8, dur: 0.05, vol: 0.1 }); },
    good() { bell(1046.5, 0, 0.18, 0.5); bell(1318.5, 0.09, 0.18, 0.7); },
    bad() { tone({ f: 330, to: 300, dur: 0.15, vol: 0.15, type: 'triangle', lp: 1200 }); tone({ f: 262, to: 240, t: 0.17, dur: 0.24, vol: 0.15, type: 'triangle', lp: 1000 }); },
    star() { [1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.06, 0.08, 0.35)); },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.11, 0.17, 0.6));
      [1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.5 + i * 0.05, 0.05, 0.4));
    },
    fanfare() {
      const n = [[523.25, 0], [523.25, 0.12], [523.25, 0.24], [659.25, 0.36], [783.99, 0.6], [659.25, 0.78], [783.99, 0.9], [1046.5, 1.08]];
      n.forEach(([f, t]) => { tone({ f, t, vol: 0.09, dur: 0.22, type: 'square', lp: 2600 }); bell(f, t, 0.1, 0.4); });
      [1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 1.2 + i * 0.05, 0.05, 0.5));
    },
    whoosh() { noise({ f: 400, to: 3200, q: 1.2, dur: 0.28, vol: 0.13 }); },
    pick() { tone({ f: 520, to: 800, dur: 0.08, vol: 0.14, type: 'triangle' }); },
    drop() { tone({ f: 620, to: 300, dur: 0.1, vol: 0.16 }); noise({ f: 320, q: 0.7, dur: 0.06, vol: 0.08, ft: 'lowpass' }); },
    flip() { noise({ f: 1900, to: 900, q: 0.9, dur: 0.08, vol: 0.12 }); tone({ f: 520, to: 720, dur: 0.05, vol: 0.05, type: 'triangle' }); },
    boing() { tone({ f: 170, to: 540, slide: 0.12, dur: 0.3, vol: 0.18 }); },
    chomp() { noise({ f: 650, q: 1.6, dur: 0.07, vol: 0.32, ft: 'lowpass' }); noise({ t: 0.15, f: 560, q: 1.6, dur: 0.07, vol: 0.3, ft: 'lowpass' }); },
    coin() { tone({ f: 988, dur: 0.07, vol: 0.1, type: 'square', lp: 4000 }); tone({ f: 1319, t: 0.07, dur: 0.3, vol: 0.1, type: 'square', lp: 4000 }); },
    tick() { tone({ f: 1800, dur: 0.02, vol: 0.05 }); },
    sparkle() { for (let i = 0; i < 5; i++) bell(1800 + Math.random() * 2200, i * 0.045, 0.045, 0.25); },
    swap() { tone({ f: 440, to: 660, dur: 0.07, vol: 0.1, type: 'triangle' }); tone({ f: 660, to: 440, t: 0.07, dur: 0.07, vol: 0.1, type: 'triangle' }); },
    unlock() { [784, 988, 1175, 1568].forEach((f, i) => bell(f, i * 0.07, 0.12, 0.45)); },
  };

  /* ---------- background music (tiny sequencer) ---------- */
  const songs = {
    sunny: { bpm: 112, swing: 0.08, inst: 'marimba', bars: [
      { r: 48, c: [60, 64, 67], m: [72, 0, 76, 0, 79, 0, 76, 0] }, { r: 55, c: [59, 62, 67], m: [74, 0, 0, 71, 74, 0, 79, 0] },
      { r: 57, c: [57, 60, 64], m: [76, 0, 72, 0, 69, 0, 72, 74] }, { r: 53, c: [57, 60, 65], m: [77, 0, 76, 0, 74, 0, 0, 0] },
      { r: 48, c: [60, 64, 67], m: [72, 0, 76, 0, 79, 0, 84, 0] }, { r: 55, c: [59, 62, 67], m: [83, 0, 79, 0, 74, 0, 79, 0] },
      { r: 53, c: [57, 60, 65], m: [81, 0, 79, 77, 76, 0, 74, 0] }, { r: 55, c: [59, 62, 67], m: [74, 0, 76, 0, 74, 0, 71, 0] }] },
    bouncy: { bpm: 124, swing: 0.14, inst: 'marimba', bars: [
      { r: 53, c: [60, 65, 69], m: [77, 0, 77, 0, 81, 0, 84, 0] }, { r: 50, c: [62, 65, 69], m: [81, 0, 77, 0, 74, 0, 77, 0] },
      { r: 46, c: [58, 62, 65], m: [74, 0, 77, 0, 82, 0, 81, 0] }, { r: 48, c: [60, 64, 67], m: [79, 0, 0, 0, 76, 0, 72, 0] },
      { r: 53, c: [60, 65, 69], m: [77, 0, 81, 0, 84, 0, 86, 0] }, { r: 50, c: [62, 65, 69], m: [84, 0, 81, 0, 77, 0, 74, 0] },
      { r: 46, c: [58, 62, 65], m: [74, 0, 77, 0, 79, 0, 82, 0] }, { r: 48, c: [60, 64, 67], m: [81, 0, 79, 0, 76, 0, 0, 0] }] },
    calm: { bpm: 90, swing: 0.06, inst: 'musicbox', bars: [
      { r: 55, c: [55, 59, 62], m: [83, 0, 0, 86, 83, 0, 79, 0] }, { r: 52, c: [52, 55, 59], m: [79, 0, 0, 0, 76, 0, 79, 0] },
      { r: 48, c: [48, 52, 55], m: [76, 0, 0, 79, 76, 0, 72, 0] }, { r: 50, c: [50, 54, 57], m: [74, 0, 0, 0, 0, 0, 78, 0] },
      { r: 55, c: [55, 59, 62], m: [79, 0, 83, 0, 86, 0, 91, 0] }, { r: 52, c: [52, 55, 59], m: [88, 0, 86, 0, 83, 0, 79, 0] },
      { r: 48, c: [48, 52, 55], m: [84, 0, 83, 0, 81, 0, 79, 0] }, { r: 50, c: [50, 54, 57], m: [78, 0, 76, 0, 74, 0, 0, 0] }] },
  };
  const music = {
    _want: null, _song: null, _timer: null, _step: 0, _next: 0,
    start(name) {
      const song = typeof name === 'string' ? songs[name] : name;
      this._want = song;
      if (!song || !unlocked || !ctx) return;
      if (this._song === song && this._timer) return;
      this.stop(true);
      this._song = song; this._step = 0; this._next = ctx.currentTime + 0.15;
      this._timer = setInterval(() => this._tick(), 40);
    },
    stop(keepWant) { clearInterval(this._timer); this._timer = null; this._song = null; if (!keepWant) this._want = null; },
    _tick() {
      if (!ctx || !this._song || ctx.state !== 'running') return;
      const s = this._song, e8 = 60 / s.bpm / 2;
      if (this._next < ctx.currentTime - 0.3) this._next = ctx.currentTime + 0.05;
      while (this._next < ctx.currentTime + 0.25) {

function drawRuler(c) {

/* ---------- finish ---------- */
function finish() {
  const g = G, th = g.th.id, my = roundId;
  const stars = starsNow(), hb = g.blocks.length, m = hb * MPB;
  const oldRec = save.rec[th] || 0, newRec = hb > oldRec;

  if (THEMES.every(t => save.played[t.id])) award('all', true);
  if (THEMES.every(t => (save.stars[t.id] || 0) >= 3)) award('gold', true);
  persist();
  const nb = g.newBadges.length ? BADGES.find(b => b.id === g.newBadges[g.newBadges.length - 1]) : null;
  let reward = null;
  if (nb) reward = { emoji: nb.e, label: 'Huy hiệu mới: ' + nb.n + '!' };
  else if (newRec) reward = { emoji: '🏆', label: 'Kỷ lục mới: ' + m + ' mét!' };
  const ti = THEMES.findIndex(t => t.id === th);
  Kit.result({
    stars, title: stars === 3 ? 'Tuyệt vời!' : stars === 2 ? 'Giỏi lắm!' : 'Xây xong rồi!',
    text: `Tháp cao <b>${m} mét</b>${newRec && oldRec ? ' · kỷ lục mới!' : ''}<br>✨ ${g.perfect} lần hoàn hảo`,
    reward,
    say: (stars === 3 ? 'Tuyệt vời! ' : stars === 2 ? 'Giỏi lắm! ' : 'Xây xong rồi! ') + 'Tháp cao ' + m + ' mét!',
    buttons: [
