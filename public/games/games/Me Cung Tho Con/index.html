<meta name="apple-mobile-web-app-capable" content="yes">

<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
:root{--c1:#ff8a3d;--c1d:#e0661a;--c2:#ff6fa5;--c2d:#d9467f;--bg1:#8fdcff;--bg2:#c4f29c;--ink:#3b2f63;--wc:#4cb944;--wcd:#2e8b2e;--wl:#e3f7d5}
body{background:linear-gradient(180deg,var(--bg1) 0%,#c9f1ff 46%,var(--bg2) 100%)}
body.w-garden{--c1:#4cb944;--c1d:#2b8a32;--bg1:#8fdcff;--bg2:#b5ec88;--wc:#4cb944;--wcd:#2b8a32;--wl:#e3f7d5}
body.w-ocean{--c1:#17a5d6;--c1d:#0a78a3;--bg1:#7fe0f5;--bg2:#2a86d1;--wc:#17a5d6;--wcd:#0a78a3;--wl:#d9f4fb}
body.w-space{--c1:#8a5cff;--c1d:#5b35d6;--bg1:#191446;--bg2:#3b1f72;--wc:#8a5cff;--wcd:#5b35d6;--wl:#ece5ff}
body.w-candy{--c1:#ff5d8f;--c1d:#d63a6c;--bg1:#ffd3e7;--bg2:#dccbff;--wc:#ff5d8f;--wcd:#d63a6c;--wl:#ffe3ee}
body.w-ocean{background:linear-gradient(180deg,#86e4f6 0%,#3fb0e0 45%,#1d6fbf 100%)}
body.w-space{background:radial-gradient(ellipse at 20% 15%,#4b2a8f 0,transparent 55%),radial-gradient(ellipse at 85% 85%,#1f3c8f 0,transparent 55%),linear-gradient(170deg,#1a1448,#2c1a5e 60%,#150f3a)}
body.w-candy{background:linear-gradient(170deg,#ffd3e7 0%,#ffe9f3 45%,#dccbff 100%)}
.emo{font-family:var(--emoji)}
.hat{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

/* ---------- background decor ---------- */
#bgdeco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgdeco .cloud{position:absolute;width:var(--w,160px);height:calc(var(--w,160px)*.42);background:#fff;border-radius:999px;opacity:.85;animation:cloud var(--t,60s) linear infinite}
#bgdeco .cloud::before,#bgdeco .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
#bgdeco .cloud::before{width:52%;height:120%;left:14%;bottom:30%}
#bgdeco .cloud::after{width:38%;height:95%;right:14%;bottom:36%}
@keyframes cloud{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#bgdeco .hill{position:absolute;bottom:-14vh;border-radius:50%;background:#9bdc6e;box-shadow:inset 0 14px 0 rgba(255,255,255,.25)}
#bgdeco .ray{position:absolute;top:-10%;width:16vw;height:120%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 80%);transform-origin:50% 0;filter:blur(6px);animation:ray 9s ease-in-out infinite alternate}
@keyframes ray{from{transform:rotate(14deg);opacity:.5}to{transform:rotate(22deg);opacity:1}}
#bgdeco .weed{position:absolute;bottom:-6px;width:46px;transform-origin:50% 100%;animation:weed 4s ease-in-out infinite alternate}
@keyframes weed{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#bgdeco .bstar{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
#bgdeco .bplanet{position:absolute;border-radius:50%}
#bgdeco .dot{position:absolute;border-radius:50%;opacity:.55}
#bgdeco .swirl{position:absolute;border-radius:50%;background:repeating-conic-gradient(#ff8fb8 0 20deg,#fff 20deg 40deg);opacity:.35}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.2vmin,12px);padding:calc(70px + var(--safe-t)) 16px 18px;z-index:2}
.tscene{position:relative;width:clamp(210px,min(84vw,40vh),430px);aspect-ratio:1.18;flex:0 0 auto}
.tscene .medal{position:absolute;right:0;top:0;width:85%;height:auto;overflow:visible}
.tscene .tb{position:absolute;left:-3%;bottom:-4%;width:50%;cursor:pointer}
.tscene .tb svg,.tscene .tc svg{width:100%;height:auto;display:block;overflow:visible}
.tscene .tc{position:absolute;width:19%;left:48%;top:38%;animation:gbounce 1.3s ease-in-out infinite;transform-origin:50% 90%}
.tscene .tglow{position:absolute;width:36%;aspect-ratio:1;left:39.5%;top:28.5%;border-radius:50%;background:radial-gradient(circle,rgba(255,244,170,.95),rgba(255,220,90,.35) 45%,transparent 70%);animation:glow 1.6s ease-in-out infinite}
.tb.hop .tbi{animation:thop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes thop{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.1,.85)}45%{transform:translateY(-22%) scale(.95,1.08)}75%{transform:translateY(0) scale(1.06,.94)}}
.tb .tbi{transform-origin:50% 92%;animation:breathe 2.4s ease-in-out infinite}
.title-txt{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vmin,14px);position:relative;z-index:1}
.logo{-webkit-text-stroke-color:#2b7a31;text-shadow:0 .1em 0 #2b7a31,0 .2em .3em rgba(20,60,10,.25)}
.logo .l2{color:#ffb238;font-size:1.06em}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(4px,1.4vmin,14px)}
.tstat{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 14px 4px 8px;font-weight:800;color:#9a6400;font-size:clamp(16px,2.6vmin,20px);box-shadow:0 4px 0 rgba(40,20,90,.08)}
.tstat svg{width:24px;height:24px;color:#ffc83d}
.floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters span{position:absolute;width:clamp(44px,8vmin,74px);animation:drift 11s ease-in-out infinite;opacity:.95}
.floaters span svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1))}}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  #title{flex-direction:row;gap:5vw;padding-top:calc(58px + var(--safe-t))}
  .tscene{width:clamp(200px,min(64vh,42vw),400px)}
  .title-btns{gap:12px}
}

/* ---------- select ---------- */
#select{justify-content:flex-start;padding:calc(76px + var(--safe-t)) 14px calc(18px + var(--safe-b));overflow-y:auto;gap:8px;z-index:2}
.sel-in{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.sec-h{margin:4px 0 2px;font-size:clamp(20px,3.6vmin,30px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.worlds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(980px,100%)}
@media (min-width:1400px) and (min-height:900px){.worlds,.levels{width:min(1240px,100%)}.world{font-size:24px}.lvl .mm{width:86px}}
.world{border:none;cursor:pointer;border-radius:24px;padding:7px 7px 6px;background:#fff;box-shadow:0 6px 0 rgba(40,20,90,.16);display:flex;flex-direction:column;align-items:center;gap:2px;
  position:relative;transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s;font-weight:800;color:var(--ink);font-size:clamp(15px,2.5vmin,21px);line-height:1.1}
.world .wsc{width:100%;aspect-ratio:1.55;border-radius:18px;position:relative;overflow:hidden}
.world .wsc>div{position:absolute}
.world .wsc .h{left:5%;bottom:3%;width:50%}
.world .wsc .g{right:5%;top:12%;width:36%;animation:gbounce 1.4s ease-in-out infinite;transform-origin:50% 90%}
.world .wsc svg{width:100%;height:auto;display:block;overflow:visible}
.world .ws{display:flex;align-items:center;gap:3px;font-size:.78em;color:#a67000}
.world .ws svg{width:1.05em;height:1.05em;color:#ffc83d}
.world.on{box-shadow:0 6px 0 var(--wcd),0 0 0 4px var(--wc);transform:translateY(-3px) scale(1.04)}
.world:active{transform:translateY(3px)}
.world.locked .wsc{filter:grayscale(.85) brightness(1.05) opacity(.75)}
.world.locked{color:#9a8fbf}
.world .lk{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px}
.world .lk .lki{width:48px;height:48px;border-radius:50%;background:#fff;color:#8f83b8;display:grid;place-items:center;box-shadow:0 4px 0 rgba(40,20,90,.15)}
.world .lk .lki svg{width:28px;height:28px}
.world .pips{display:flex;gap:4px;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 6px}
.world .pips i{width:12px;height:12px;border-radius:50%;background:#e2dcf2;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.world .pips i.on{background:var(--ok)}
.levels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:min(980px,100%)}
.lvl{border:none;cursor:pointer;border-radius:22px;background:#fff;padding:12px 6px 8px;box-shadow:0 7px 0 rgba(40,20,90,.18);display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;transition:transform .15s;justify-content:space-between}
.lvl:active{transform:translateY(4px)}
.lvl .num{position:absolute;top:-10px;left:-6px;width:34px;height:34px;border-radius:50%;background:var(--c1);color:#fff;font:800 19px/34px var(--font);box-shadow:0 3px 0 var(--c1d)}
.lvl .mm{width:clamp(46px,9vmin,74px);height:auto;display:block}
.lvl .st{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5}
.k-mini-star.on svg{color:#ffc83d}
.lvl.locked{background:#eee8fb;box-shadow:0 7px 0 rgba(60,30,140,.1);cursor:default}
.lvl.locked .mm{opacity:.28;filter:grayscale(1)}
.lvl.locked .num{background:#c3b8e6;box-shadow:0 3px 0 #a597d6}

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }

/* =========================================================
   MAZE CORE
   ========================================================= */
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], BIT = [1, 2, 4, 8], OPP = [2, 3, 0, 1];
function genMaze(c, r, loops, rng = Math.random) {
  const N = c * r, m = new Uint8Array(N), seen = new Uint8Array(N);
  const ri = n => Math.floor(rng() * n);
  const st = [ri(N)]; seen[st[0]] = 1;
  while (st.length) {
    const i = st[st.length - 1], x = i % c, y = (i / c) | 0, opts = [];
    for (let d = 0; d < 4; d++) { const nx = x + DX[d], ny = y + DY[d]; if (nx >= 0 && ny >= 0 && nx < c && ny < r && !seen[ny * c + nx]) opts.push(d); }
    if (!opts.length) { st.pop(); continue; }
    const d = opts[ri(opts.length)], j = (y + DY[d]) * c + x + DX[d];
    m[i] |= BIT[d]; m[j] |= BIT[OPP[d]]; seen[j] = 1; st.push(j);
  }
  let tries = 0;
  while (loops > 0 && tries++ < 300) {
    const x = ri(c), y = ri(r), d = rng() < .5 ? 1 : 2, nx = x + DX[d], ny = y + DY[d];
    if (nx >= c || ny >= r) continue;
    const i = y * c + x, j = ny * c + nx;
    if (m[i] & BIT[d]) continue;
    m[i] |= BIT[d]; m[j] |= BIT[OPP[d]];
    if (openSquare(m, c, r)) { m[i] &= ~BIT[d]; m[j] &= ~BIT[OPP[d]]; continue; }
    loops--;
  }
  return { c, r, m };
}
function openSquare(m, c, r) {
  for (let y = 0; y < r - 1; y++) for (let x = 0; x < c - 1; x++) {
    const a = y * c + x, d = a + c + 1;

  say(W_.win);
  later(finish, Math.max(1900, 450 + T.length * step + 300));
  kick();
}
function finish() {
  if (!G) return;
  const g = G, w = W_, got = g.got;
  g.phase = 'done';
  const title = got === 3 ? 'Tuyệt vời!' : got === 2 ? 'Giỏi quá!' : got === 1 ? 'Hoàn thành!' : 'Về đích rồi!';
  let reward = null, extra = '';
  if (g.unlockW >= 0) { const nw = WORLDS[g.unlockW]; reward = { emoji: svgOf(nw.hero, hatId), label: 'Mở khóa: ' + nw.name + '!' }; if (g.newHats.length) extra = ' · Mũ mới ' + g.newHats[0].e; }
  else if (g.newHats.length) { const h = g.newHats[g.newHats.length - 1]; reward = { emoji: `<span class="emo" style="font-size:46px">${h.e}</span>`, label: 'Mũ mới: ' + h.name + '!' }; }
  const nextL = g.L < 6 ? [g.wi, g.L + 1] : (g.wi < 3 && worldOpen(g.wi + 1) ? [g.wi + 1, 1] : null);
  const buttons = [
    { label: 'Chơi lại', icon: 'replay', cls: 'white', onClick: () => startLevel(g.wi, g.L) },
    nextL ? { label: 'Màn tiếp', icon: 'next', cls: 'ok', onClick: () => startLevel(nextL[0], nextL[1]) } : { label: 'Chọn màn', icon: 'next', cls: 'ok', onClick: () => { endGame(); renderSelect(); show('select'); } },
  ];
  const top = `<div class="res-art"><div class="rh">${svgOf(w.hero, hatId)}</div><div class="rg">${svgOf(w.goal)}</div></div>`;
  const text = (got ? `Bé nhặt được ${got} ngôi sao!` : 'Lần sau nhặt sao nhé!') + extra;
  Kit.result({ top, title, stars: got, text, reward, buttons, say: title + (reward ? ' ' + reward.label.replace(/<[^>]+>/g, '') : '') });
  if (reward) setTimeout(() => sfx.unlock(), 1500);
}

/* =========================================================
   AMBIENT
   ========================================================= */
function buildAmbient() {
  const a = $('#amb'); a.innerHTML = '';
  const add = (cls, css, html) => { const e = el('div', cls, html || null); Object.assign(e.style, css); a.appendChild(e); return e; };
  const id = W_.id;
  if (id === 'garden') {
    [['#ff8fc8', '#ffd1e8'], ['#ffd23d', '#fff1a8'], ['#8fd3ff', '#d4efff']].forEach(([c1, c2], i) => add('bfly', { top: (14 + i * 28) + '%', left: '0', '--t': (20 + i * 5) + 's', animationDelay: (-i * 7) + 's' }, ART.butterfly(c1, c2)));
    for (let i = 0; i < 7; i++) add('fluff', { left: rand(0, 90) + '%', bottom: rand(-5, 30) + '%', '--t': rand(11, 18) + 's', animationDelay: rand(-18, 0) + 's' });
  } else if (id === 'ocean') {
    for (let i = 0; i < 14; i++) { const s = rand(8, 26); add('bub', { left: rand(0, 98) + '%', width: s + 'px', height: s + 'px', '--t': rand(7, 15) + 's', animationDelay: rand(-15, 0) + 's' }); }
  } else if (id === 'space') {
    for (let i = 0; i < 16; i++) add('tw' + (i % 4 === 0 ? ' x' : ''), { left: rand(0, 98) + '%', top: rand(0, 96) + '%', '--t': rand(1.8, 3.6) + 's', animationDelay: rand(-3, 0) + 's' });
    add('shoot', {}); add('shoot', { top: '55%', left: '90%', animationDelay: '-3.4s', animationDuration: '9s' });
  } else if (id === 'candy') {
    const cols = ['#ff8fb8', '#ffd23d', '#8fd3ff', '#b18cff', '#7ee0a8'];
    for (let i = 0; i < 12; i++) add('spr', { left: rand(-5, 95) + '%', background: pick(cols), '--t': rand(10, 18) + 's', animationDelay: rand(-18, 0) + 's' });
    for (let i = 0; i < 4; i++) add('hrt emo', { left: rand(0, 95) + '%', '--t': rand(12, 18) + 's', animationDelay: rand(-16, 0) + 's' }, pick(['💗', '🍬', '🍭', '💖']));
  }
}

/* =========================================================
   HATS (wardrobe)
   ========================================================= */
function openHats() {
  const m = Kit.overlay('', { closable: true, cls: 'hats' });
  const render = () => {
    const ts = totalStars(), kind = WORLDS[curW].hero;
    m.panel.querySelectorAll(':scope > :not(.k-close)').forEach(n => n.remove());
    const box = el('div');
    box.innerHTML = `<div class="hwrap"><div class="hleft"><h2>Mũ xinh</h2><div class="hprev">${svgOf(kind, hatId)}</div><div class="htot">${icon('star')} ${ts}</div></div>
      <div class="hright"><div class="hgrid"><button class="hit${!hatId ? ' on' : ''}" data-id=""><span class="x">✕</span><small>Không đội</small></button>
      ${HATS.map(h => { const ok = ts >= h.need; return `<button class="hit${ok ? '' : ' lock'}${hatId === h.id ? ' on' : ''}" data-id="${h.id}"><span class="emo">${h.e}</span><small>${ok ? h.name : icon('star') + ' ' + h.need}</small></button>`; }).join('')}</div>
      ${ts < HATS[0].need ? '<p>Nhặt sao trong mê cung để mở mũ nhé!</p>' : ''}</div></div>`;
    m.panel.insertBefore(box, m.panel.firstChild);
    $$('.hit', box).forEach(b => b.onclick = () => {
      const id = b.dataset.id, h = HATS.find(x => x.id === id);
      if (h && ts < h.need) { sfx.bad(); b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); say('Bé cần thêm ngôi sao nhé!'); Kit.toast(`Cần ${h.need} ngôi sao`); return; }
      hatId = id || null; store.set('hat', hatId); sfx.pop();
      if (h) say(h.name); render();
      const r = $('.hprev', m.panel).getBoundingClientRect(); Kit.sparkle(r.left + r.width / 2, r.top + r.height * .3);
      renderTitle();
    });
  };
  render(); say('Chọn mũ cho bạn nhỏ nhé!');
}

/* =========================================================
   QA HOOKS
   ========================================================= */
window.MZ = {
  rev: 0, log: null, trace: null, ft: 0, fn: 0, dbg: null, seedNext: 0,
  get G() { return G; }, H, L, IN,
  state: () => G && { c: G.mz.c, r: G.mz.r, hero: [H.x, H.y], route: H.route.slice(), goal: cellXY(G.goal), start: cellXY(G.start), stars: G.stars.map(s => [...cellXY(s.i), s.got]), got: G.got, phase: G.phase, trail: G.trail.length, cs: L.cs, left: L.left, top: L.top, pad: L.pad },
  client: (x, y) => [L.left + L.pad + (x + .5) * L.cs, L.top + L.pad + (y + .5) * L.cs],
  solution: () => { const e = edge(); return (pathTo(G.mz, e.b < 0 ? e.a : nearestCell(), G.goal) || []).map(cellXY); },
  pathTo: (x, y) => (pathTo(G.mz, nearestCell(), idx(x, y)) || []).map(cellXY),
  walls: () => Array.from(G.mz.m),
  start: (w, l) => startLevel(w, l),
};

renderTitle();
Kit.music.start('bouncy');
})();
</script>
