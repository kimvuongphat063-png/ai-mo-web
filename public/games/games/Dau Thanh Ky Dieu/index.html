<!DOCTYPE html>
<html lang="vi" data-game="dau-thanh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fd6ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dấu Thanh Kỳ Diệu</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== NhiKit 3 — shared styles (Bộ game 3) ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#2f2a55; --ink2:#6b6592;
  --c1:#4f8dff; --c1d:#2f63d8; --c1l:#e3edff;
  --c2:#ff6f9f; --c2d:#de4479;
  --ok:#35c46a; --okd:#1e9a4e;
  --gold:#ffc83a; --goldd:#e09600;
  --warn:#ff9f43; --warnd:#e07a12;
  --bg1:#a9d8ff; --bg2:#ffe3f1;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --btn:56px;
  --bar-h:76px; /* real value measured by Kit */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-nt{touch-action:none}

/* ---------- top bar ---------- */
.k-bar{position:fixed;z-index:50;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:8px;
  padding:calc(8px + var(--st)) calc(10px + var(--sr)) 8px calc(10px + var(--sl));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;min-width:0;min-height:var(--btn);display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-tools{display:flex;gap:8px;flex:0 0 auto}
.k-bar .k-left{display:flex;gap:8px;flex:0 0 auto;min-width:var(--btn)}
@media (max-width:560px) and (orientation:portrait){
  .k-bar{flex-wrap:wrap;row-gap:6px}
  .k-bar .k-mid{order:9;flex-basis:100%;min-height:0}
  .k-bar .k-mid:empty{display:none}
  .k-bar .k-left{margin-right:auto}
}
@media (max-height:440px){
  :root{--btn:52px}
  .k-bar{padding-top:calc(6px + var(--st));padding-bottom:4px}
}
.ibtn{position:relative;width:var(--btn);height:var(--btn);flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 5px 0 rgba(30,20,80,.16),0 9px 16px rgba(30,20,80,.10);transition:transform .12s ease,box-shadow .12s ease,color .2s}
.ibtn svg{width:58%;height:58%}
.ibtn.press{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 rgba(30,20,80,.16),0 3px 6px rgba(30,20,80,.08)}
.ibtn.off{color:#b9b2d1}
.ibtn .badge,.btn .badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 14px/24px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none;pointer-events:none}
.ibtn.glow{animation:k-glow 1.4s ease-in-out infinite}

/* ---------- buttons ---------- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  min-height:var(--btn);font:800 clamp(20px,3.4vmin,28px)/1 var(--font);padding:.55em 1.25em .62em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 6px 0 var(--bd),0 11px 20px rgba(30,15,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn::after{content:"";position:absolute;left:12%;right:12%;top:8%;height:32%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.08));pointer-events:none}
.btn.press{transform:translateY(5px) scale(.98);box-shadow:0 1px 0 var(--bd),0 3px 8px rgba(30,15,80,.15)}
.btn svg{width:1.1em;height:1.1em;flex:0 0 auto}
.btn.big{font-size:clamp(28px,5.6vmin,46px);padding:.5em 1.4em .58em}
.btn.small{font-size:clamp(17px,2.7vmin,21px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3b00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.warn{--b:var(--warn);--bd:var(--warnd)}
.btn.white{--b:#fff;--bd:#d9d3ee;color:var(--c1d);text-shadow:none}
.btn.round{width:var(--btn);padding:0;border-radius:50%}
.btn[disabled]{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.screen.on{display:flex;animation:k-fade .3s ease}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(42px,9.6vmin,100px);
  -webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-shadow:0 .09em 0 var(--c1d),0 .17em .28em rgba(20,10,60,.25)}
.k-logo .w{display:inline-block;white-space:nowrap}
.k-logo .ch{display:inline-block;animation:k-wave 2.6s ease-in-out infinite}
.k-logo .alt{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.6vmin,22px);color:var(--ink2);margin:.3em 0 0;text-align:center}

/* title layout helper */
.k-title{gap:clamp(4px,1.6vmin,16px);padding:calc(var(--bar-h) + 4px) 16px calc(16px + var(--sb))}
.k-title .k-hero{position:relative;z-index:1;width:clamp(150px,34vmin,300px);height:auto;overflow:visible}
.k-title .k-ttxt{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.k-title .k-tbtns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(8px,2.2vmin,22px)}
.k-title .k-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  .k-title{flex-direction:row;gap:5vw}
  .k-title .k-hero{width:min(38vmin,40vw)}
}

/* tiles (mode / level pickers) */
.k-pick{justify-content:flex-start;padding:calc(var(--bar-h) + 6px) calc(14px + var(--sr)) calc(18px + var(--sb)) calc(14px + var(--sl));overflow-y:auto;-webkit-overflow-scrolling:touch;gap:10px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pick>:first-child{margin-top:auto}.k-pick>:last-child{margin-bottom:auto}
.k-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,168px),1fr));gap:14px;width:min(1040px,100%)}
.k-tile{--t:var(--c1);--td:var(--c1d);--tl:var(--c1l);position:relative;border:none;cursor:pointer;border-radius:28px;background:#fff;padding:12px 10px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;
  box-shadow:0 7px 0 rgba(30,20,80,.14),0 12px 22px rgba(30,20,80,.10);transition:transform .14s;font-weight:800;color:var(--ink);text-align:center}
.k-tile .art{width:clamp(70px,13vmin,104px);height:clamp(70px,13vmin,104px);border-radius:50%;background:var(--tl);display:grid;place-items:center;font-size:clamp(38px,7vmin,58px)}
.k-tile .art svg{width:80%;height:80%}
.k-tile .nm{font-size:clamp(18px,3vmin,24px);line-height:1.05}
.k-tile .ds{font-size:clamp(13px,2.1vmin,16px);color:var(--ink2);font-weight:700;line-height:1.1}
.k-tile .k-stars-mini{margin-top:2px}
.k-tile.press{transform:translateY(5px) scale(.98)}
.k-tile.sel{box-shadow:0 7px 0 var(--td),0 0 0 4px var(--t),0 12px 22px rgba(30,20,80,.10)}
.k-tile .tag{position:absolute;top:-8px;right:-4px;background:var(--t);color:#fff;font:800 13px/1 var(--font);padding:5px 9px;border-radius:12px;box-shadow:0 3px 0 var(--td)}
.k-tile .txt{display:flex;flex-direction:column;align-items:center;gap:2px}
@media (max-height:540px){
  .k-tile{min-height:0;flex-direction:row;justify-content:flex-start;gap:10px;padding:8px 12px;text-align:left;border-radius:22px}
  .k-tile .art{width:60px;height:60px;font-size:34px;flex:0 0 auto}
  .k-tile .txt{display:flex;flex-direction:column;align-items:flex-start}
}
.k-stars-mini{display:flex;gap:1px}
.k-stars-mini svg{width:clamp(17px,2.8vmin,22px);height:auto;color:#e5e0f3}
.k-stars-mini .on svg{color:var(--gold)}

/* ---------- overlay / modal ---------- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(32,20,80,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:k-fade .22s ease;padding:calc(12px + var(--st)) 12px calc(12px + var(--sb))}
.k-panel{position:relative;width:min(560px,94vw);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:34px;padding:24px 20px 22px;text-align:center;
  box-shadow:0 12px 0 rgba(30,20,80,.14),0 28px 60px rgba(30,20,80,.32);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain;touch-action:pan-y}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,46px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,2.9vmin,22px);font-weight:700;color:var(--ink2)}
.k-panel .k-close{position:absolute;top:10px;right:10px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center;margin-top:20px}
.k-result{overflow:visible}
.k-result .k-mascot{display:block;margin:-80px auto 0;width:120px;height:120px}
.k-starrow{display:flex;justify-content:center;gap:4px;margin:8px 0 2px}
.k-starrow svg{width:clamp(58px,11vmin,84px);height:auto;transform:scale(0);filter:drop-shadow(0 4px 0 rgba(160,100,0,.22))}
.k-starrow svg.mid{margin-top:-16px}
.k-starrow svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:12px;padding:8px 18px 8px 10px;border-radius:22px;background:#fff6db;
  border:3px dashed #f2c158;font-weight:800;font-size:clamp(16px,2.8vmin,21px);color:#9a6200;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both;text-align:left}
.k-reward .emo,.k-reward svg{font-size:44px;width:52px;height:52px;display:grid;place-items:center;animation:k-wiggle 1.2s 1.4s ease-in-out infinite;flex:0 0 auto}
@media (max-height:500px){
  .k-panel{padding:16px 16px 14px;border-radius:28px}
  .k-panel h2{font-size:30px}
  .k-starrow svg{width:56px}
  .k-btns{margin-top:12px}
  .k-result .k-mascot{display:none}
}

/* ---------- praise / toast / bubble / float ---------- */
.k-praise{position:fixed;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.14em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.35s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.4vmin,58px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(20px + var(--sb));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:800;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(30,20,80,.12),0 12px 24px rgba(30,20,80,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-float{position:fixed;z-index:72;pointer-events:none;font-weight:800;white-space:nowrap;transform:translate(-50%,-50%);
  font-size:clamp(24px,4.6vmin,40px);color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;animation:k-floatup 1.1s ease-out forwards}
.k-bubble{position:fixed;z-index:60;background:#fff;color:var(--ink);border-radius:22px;padding:8px 16px;font-weight:800;font-size:clamp(17px,2.8vmin,23px);line-height:1.15;
  box-shadow:0 5px 0 rgba(30,20,80,.12),0 10px 22px rgba(30,20,80,.14);pointer-events:none;max-width:min(78vw,420px);text-align:center;animation:k-pop .35s cubic-bezier(.2,1.6,.4,1) both}
.k-bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-10px;width:22px;height:22px;background:#fff;border-radius:4px;transform:translateX(-50%) rotate(45deg)}
.k-bubble.down::after{bottom:auto;top:-10px}
.k-bubble.out{animation:k-fadeout .25s ease forwards}
.k-hand{position:fixed;z-index:65;left:0;top:0;width:64px;height:64px;pointer-events:none;opacity:0;margin:-8px 0 0 -18px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}

/* ---------- fx canvas & deco ---------- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}

/* ---------- mascot idle helpers (SVG) ---------- */
.k-blink{transform-box:fill-box;transform-origin:50% 55%;animation:k-blink 4.8s infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3.2s ease-in-out infinite}
.k-sway{transform-box:fill-box;transform-origin:50% 100%;animation:k-sway 3.6s ease-in-out infinite}
.k-pupil{transition:transform .14s ease-out}

/* ---------- animations ---------- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-fadeout{to{opacity:0;transform:translateY(-6px) scale(.96)}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-glow{0%,100%{box-shadow:0 5px 0 rgba(30,20,80,.16),0 0 0 0 rgba(255,200,58,.0)}50%{box-shadow:0 5px 0 rgba(30,20,80,.16),0 0 0 7px rgba(255,200,58,.75)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.08em)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jelly{0%,100%{transform:scale(1,1)}25%{transform:scale(1.14,.86)}50%{transform:scale(.92,1.1)}75%{transform:scale(1.04,.97)}}
@keyframes k-blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes k-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-76%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
@keyframes k-floatup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.1);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.k-a-wiggle{animation:k-wiggle .5s ease-in-out}
.k-a-shake{animation:k-shake .45s ease-in-out}
.k-a-jelly{animation:k-jelly .5s ease-in-out}
.k-a-bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.k-a-bob,.btn.pulse,.k-logo .ch{animation:none!important}}
</style>
<style>
:root{--c1:#4a7dff;--c1d:#2b57cf;--c1l:#e3ebff;--c2:#ff6f9f;--c2d:#de4479;--ink:#2b2f5e;--ink2:#626a96;--bg1:#b3defe;--bg2:#ffe3f2;
  --tile:80px;--tb:100px;--pic:240px;--bird:110px;--cols:3;--pg:12px}
body{background:linear-gradient(180deg,#9fd6ff 0%,#c3dbff 34%,#e4d7ff 68%,#ffe0ef 100%)}
.screen{z-index:1}

/* ---------- magical sky garden background ---------- */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky .sun{position:absolute;right:6vw;top:calc(var(--bar-h) + 1vh);width:11vmin;height:11vmin;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#fffbe8,#ffe07a 70%);box-shadow:0 0 0 2vmin rgba(255,236,150,.34),0 0 0 4.6vmin rgba(255,236,150,.14)}
.sky .rainbow{position:absolute;left:50%;bottom:4vh;width:min(150vw,150vh);transform:translateX(-50%);opacity:.3}
.sky .cloud{position:absolute;height:5.5vmin;width:17vmin;border-radius:99px;background:#fff;opacity:.72;animation:drift 50s linear infinite}
.sky .cloud::before,.sky .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.sky .cloud::before{width:7.5vmin;height:7.5vmin;left:2.6vmin;top:-3.8vmin}
.sky .cloud::after{width:5.6vmin;height:5.6vmin;left:8.6vmin;top:-2.4vmin}
@keyframes drift{from{transform:translateX(-30vmin)}to{transform:translateX(130vw)}}
.sky .isle{position:absolute;width:clamp(84px,15vmin,170px);height:auto}
.sky .isle.a{left:1.5vw;top:40vh;animation:k-bob 7s ease-in-out infinite}
.sky .isle.b{right:1.5vw;top:60vh;animation:k-bob 8.5s ease-in-out -3s infinite}
.sky .tw{position:absolute;width:14px;height:14px;background:#fff;opacity:0;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1)}}
.sky .ground{position:absolute;left:0;bottom:0;width:100%;height:clamp(64px,13vh,150px)}
.sky .sw{transform-box:fill-box;transform-origin:50% 100%;animation:k-sway 3.4s ease-in-out infinite}

/* ---------- bird mascot ---------- */
.bird-host{position:relative;touch-action:none;flex:0 0 auto}
.bird-host>svg{display:block;width:100%;height:auto;overflow:visible}
.bird-host .b-body{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3.2s ease-in-out infinite}
.note{position:fixed;z-index:62;left:0;top:0;pointer-events:none;font:800 28px/1 var(--font);-webkit-text-stroke:5px #fff;paint-order:stroke fill;
  animation:noteUp 1.25s ease-out forwards}
@keyframes noteUp{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{opacity:1;transform:translate(calc(-50% + var(--nx)*.3),-90%) scale(1.1)}100%{transform:translate(calc(-50% + var(--nx)),-260%) scale(.9) rotate(var(--nr));opacity:0}}

/* ---------- title ---------- */
#title .k-hero{width:clamp(170px,40vmin,360px);cursor:pointer}
#title .k-logo{font-size:clamp(44px,10vmin,100px)}
#title .tag{font-weight:800;color:var(--c1d);background:#ffffffc4;border-radius:999px;padding:4px 16px;font-size:clamp(15px,2.5vmin,20px);margin-top:8px;text-align:center}
.tdots{display:flex;gap:clamp(6px,1.4vmin,12px);margin-top:clamp(8px,1.6vmin,14px);flex-wrap:wrap;justify-content:center}
.td{--tc:#888;--td:#555;width:clamp(46px,7vmin,60px);height:clamp(46px,7vmin,60px);border:none;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 4px 0 var(--td),0 8px 14px rgba(40,30,90,.16);transition:transform .12s,box-shadow .12s}
.td svg{width:56%;height:56%;overflow:visible}
.td.press{transform:translateY(3px) scale(.94);box-shadow:0 1px 0 var(--td)}
#bGarden .badge{background:var(--t4,#20bf72);box-shadow:0 2px 0 #0e9150}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  #title .k-hero{width:min(44vmin,36vw)}
  #title .tag{display:none}
  #title .k-tbtns{flex-direction:row;gap:12px;margin-top:10px}
  #title .k-logo{font-size:clamp(34px,9vmin,64px)}
  .tdots{margin-top:6px}
  .td{width:44px;height:44px}
}
@media (max-height:680px) and (max-aspect-ratio:1/1){ #title .tag{display:none} #title .k-hero{width:clamp(150px,34vmin,300px)} }
@media (min-aspect-ratio:1/1) and (min-height:541px) and (max-height:960px){
  #title{flex-direction:row;gap:5vw}
  #title .k-hero{width:min(44vmin,38vw)}
  #title .k-tbtns{flex-direction:row;gap:14px}
}

/* ---------- pickers ---------- */
.k-tile .art{font-family:var(--emoji)}
.k-tile .art .aw{font:800 clamp(30px,5.6vmin,46px)/1 var(--font);color:var(--ink);letter-spacing:.01em}
.k-tile .art svg{overflow:visible}
.lvart{width:auto!important;min-width:clamp(70px,13vmin,104px);padding:0 12px;border-radius:26px!important;display:flex!important;gap:7px;flex-wrap:wrap;align-content:center;justify-content:center}
.lvart.six{display:grid!important;grid-template-columns:repeat(3,auto);gap:4px;padding:6px 10px}
.mchip{--tc:#888;--td:#555;width:clamp(32px,5.4vmin,44px);height:clamp(32px,5.4vmin,44px);border-radius:13px;background:var(--tc);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--td)}
.mchip svg{width:68%;height:68%;overflow:visible}
.lvart.six .mchip{width:clamp(22px,3.7vmin,30px);height:clamp(22px,3.7vmin,30px);border-radius:9px;box-shadow:0 2px 0 var(--td)}
@media (max-height:540px){ .lvart{min-width:60px;height:60px!important;padding:0 8px} .lvart .mchip{width:30px;height:30px} .lvart.six .mchip{width:18px;height:18px;border-radius:6px} }
#pick .k-tiles,#levels .k-tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
@media (max-width:560px) and (orientation:portrait){ #pick .k-tiles,#levels .k-tiles{grid-template-columns:1fr 1fr} }
@media (max-height:540px){ #pick .k-tiles,#levels .k-tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- shared play layout ---------- */
#play,#listen,#read{justify-content:flex-start;padding:calc(var(--bar-h) + 4px) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl))}
.pl{position:relative;flex:1 1 auto;width:100%;max-width:1240px;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"scene" "word" "pad";gap:var(--pg);align-items:center;justify-items:center}
.pl.land{grid-template-columns:minmax(0,44fr) minmax(0,56fr);grid-template-rows:minmax(0,1fr) auto auto minmax(0,1fr);grid-template-areas:"scene ." "scene word" "scene pad" "scene ."}
#ll.pl{grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"scene" "word"}
#ll.pl.land{grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"scene ." "scene word" "scene ."}
.scene{grid-area:scene;position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0}
.duo{display:flex;align-items:flex-end;justify-content:center}
.pbird{width:var(--bird);margin-right:calc(var(--bird) * -.2);margin-bottom:calc(var(--pic) * -.04);z-index:3;cursor:pointer}
.duo.col{flex-direction:column;align-items:flex-start}
.duo.col .pbird{margin:0 0 calc(var(--bird) * -.12) calc(var(--pic) * .03)}
body[data-scr="play"] .sky .isle,body[data-scr="listen"] .sky .isle,body[data-scr="read"] .sky .isle,body[data-scr="garden"] .sky .isle{display:none}
body[data-scr="play"] .sky .rainbow,body[data-scr="listen"] .sky .rainbow,body[data-scr="read"] .sky .rainbow,body[data-scr="garden"] .sky .rainbow{opacity:.16}
.pic{position:relative;width:var(--pic);height:var(--pic);border-radius:calc(var(--pic) * .17);border:none;padding:0;cursor:pointer;flex:0 0 auto;
  background:var(--pbg,linear-gradient(160deg,#fff,#eaf3ff));display:grid;place-items:center;
  box-shadow:inset 0 0 0 calc(var(--pic) * .022) rgba(255,255,255,.95),0 8px 0 rgba(60,50,130,.12),0 16px 30px rgba(60,50,130,.14);transition:transform .14s}
.pic::before{content:"";position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0 42%,rgba(255,255,255,0) 70%);pointer-events:none}
.pic.press{transform:scale(.97)}
.pic .pe{position:relative;font-size:calc(var(--pic) * .54);line-height:1;filter:drop-shadow(0 calc(var(--pic) * .02) 0 rgba(40,30,90,.12));animation:k-bob 3.2s ease-in-out infinite;transition:margin .3s}
.pic.lab .pe,.pic.lab .num{margin-top:calc(var(--pic) * -.12)}
.pic .num{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--pic) * .02);transition:margin .3s}
.pic .num b{font:800 calc(var(--pic) * .44)/1 var(--font);color:#ff8a3d;-webkit-text-stroke:calc(var(--pic) * .018) #fff;paint-order:stroke fill;text-shadow:0 calc(var(--pic) * .02) 0 rgba(200,90,20,.25)}
.pic .num .dots{display:grid;grid-template-columns:repeat(5,auto);gap:calc(var(--pic) * .018)}
.pic .num .dots i{width:calc(var(--pic) * .065);height:calc(var(--pic) * .065);border-radius:50%;background:#ffc83a;box-shadow:0 2px 0 #e09600}
.plab{position:absolute;left:50%;bottom:7%;transform:translateX(-50%) scale(0);background:#fff;border-radius:999px;padding:0 .5em .06em;white-space:nowrap;
  font-weight:800;font-size:calc(var(--pic) * .15);line-height:1.25;color:var(--ink);box-shadow:0 4px 0 rgba(60,50,130,.12);transition:transform .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.plab.on{transform:translateX(-50%) scale(1)}
.plab b,.wcard b,.syl b,.tile.toned span,.gword b{color:var(--tc)}
.spk{position:absolute;right:calc(var(--pic) * .045);top:calc(var(--pic) * .045);width:clamp(44px,calc(var(--pic) * .19),60px)!important;height:clamp(44px,calc(var(--pic) * .19),60px)!important;border-radius:50%!important;pointer-events:none}
.spk.ping{animation:k-glow 1s ease-in-out 2}

/* word tiles */
.word{grid-area:word;position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--tile) * .1)}
.tiles{display:flex;gap:calc(var(--tile) * .1);justify-content:center;align-items:flex-end;position:relative}
.tile{position:relative;min-width:calc(var(--tile) * .84);height:calc(var(--tile) * 1.08);padding:0 calc(var(--tile) * .12);border-radius:calc(var(--tile) * .24);background:#fff;
  display:grid;place-items:center;font-weight:800;font-size:calc(var(--tile) * .7);line-height:1;color:var(--ink);white-space:nowrap;
  box-shadow:0 calc(var(--tile) * .06) 0 rgba(60,50,130,.14),0 8px 18px rgba(60,50,130,.1)}
.tile span{display:block;transform:translateY(.06em)}
.tile.v{background:linear-gradient(#fff,#fff4df)}
.tile.tgt::after{content:"";position:absolute;inset:-6px;border-radius:calc(var(--tile) * .3);border:3px dashed #ffb52e;animation:tgt 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tgt{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.tile.toned{box-shadow:0 0 0 4px var(--tc),0 calc(var(--tile) * .06) 0 var(--td),0 8px 18px rgba(60,50,130,.14)}
.tile.toned::after{display:none}
.tile.morph span{animation:morph .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes morph{0%{transform:translateY(.06em) scale(.4)}100%{transform:translateY(.06em) scale(1)}}
.tile.in{animation:tileIn .5s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes tileIn{from{transform:translateY(40px) scale(.4);opacity:0}}
.tile.dance{animation:dance .62s ease}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-34%) rotate(-7deg) scale(1.06)}62%{transform:translateY(0) rotate(5deg)}80%{transform:translateY(-8%) rotate(0)}}
.ghost{opacity:0;transition:opacity .45s,transform .45s;pointer-events:none;transform:translateY(10px)}
.ghost.on{opacity:1;transform:none}
.ghost .tile{height:calc(var(--tile) * .74);min-width:0;padding:0;font-size:calc(var(--tile) * .52);background:rgba(255,255,255,.42);box-shadow:none;color:rgba(43,47,94,.34);
  outline:3px dashed rgba(255,255,255,.95);outline-offset:-3px;border-radius:calc(var(--tile) * .18)}
.ghost .tile.g span{color:var(--tc);opacity:.75}

/* tone buttons */
.pad{grid-area:pad;display:grid;grid-template-columns:repeat(var(--cols),var(--tb));gap:var(--pg);justify-content:center}
.tb{--tc:#888;--td:#555;position:relative;width:var(--tb);height:calc(var(--tb) * .88);border:none;border-radius:calc(var(--tb) * .24);background:var(--tc);cursor:pointer;padding:0;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--tb) * .03);
  box-shadow:0 calc(var(--tb) * .055) 0 var(--td),0 10px 18px rgba(40,30,90,.18);transition:transform .12s,box-shadow .12s,opacity .3s,filter .3s}
.tb::before{content:"";position:absolute;left:12%;right:12%;top:6%;height:26%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.tb .mk{width:44%;height:40%;display:grid;place-items:center}
.tb .mk svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 0 rgba(0,0,0,.14))}
.tb .lb{display:flex;align-items:center;gap:.18em;background:#fff;border-radius:999px;padding:.04em .5em .1em;font-weight:800;font-size:clamp(13px,calc(var(--tb) * .155),22px);color:var(--td);line-height:1.15;white-space:nowrap}
.tb .lb svg{width:1.6em;height:1em;color:var(--tc);flex:0 0 auto}
.tb.press{transform:translateY(calc(var(--tb) * .045)) scale(.97);box-shadow:0 1px 0 var(--td),0 4px 8px rgba(40,30,90,.14)}
.tb.dim{filter:saturate(.38) brightness(1.13);transform:scale(.93)}
.tb.dim.press{transform:translateY(calc(var(--tb) * .045)) scale(.9)}
.tb.hint{animation:tbHint .9s ease-in-out infinite}
@keyframes tbHint{0%,100%{box-shadow:0 calc(var(--tb) * .055) 0 var(--td),0 0 0 0 rgba(255,215,80,0)}50%{box-shadow:0 calc(var(--tb) * .055) 0 var(--td),0 0 0 8px rgba(255,215,80,.95)}}
.tb.ok{box-shadow:0 calc(var(--tb) * .055) 0 var(--td),0 0 0 6px #fff,0 0 0 10px var(--tc)}
.tb.flash{animation:tbFlash .5s ease}
@keyframes tbFlash{40%{transform:translateY(-8%) scale(1.08)}}
.fly{position:fixed;left:0;top:0;z-index:75;pointer-events:none;will-change:transform}
.fly svg{width:100%;height:100%;overflow:visible}

/* progress pots in the top bar */
.pots{display:flex;gap:2px;background:#fff;border-radius:999px;padding:3px 12px 2px;box-shadow:0 5px 0 rgba(60,50,130,.12);align-items:flex-end}
.pot{width:26px;height:34px;display:block;transition:transform .3s}
.pot svg{width:100%;height:100%;overflow:visible;display:block}
.pot .pf{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .5s cubic-bezier(.2,1.7,.4,1)}
.pot.on .pf{transform:scale(1)}
.pot.on .sp{opacity:0}
.pot .ph circle{fill:var(--fc,#ff7aa8)}
.pot.cur{transform:translateY(-3px) scale(1.16)}
.pot.cur .rim{fill:#ffd36b}
@media (max-width:380px){.pot{width:22px;height:29px}.pots{padding:3px 8px 2px}}

/* listen cards */
.cards{grid-area:word;display:flex;gap:var(--pg);justify-content:center;align-items:center}
.wcard{--tc:#888;--td:#555;position:relative;width:var(--cw);height:calc(var(--cw) * 1.02);border:none;border-radius:calc(var(--cw) * .2);background:#fff;cursor:pointer;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .03);font-weight:800;color:var(--ink);
  box-shadow:0 calc(var(--cw) * .05) 0 rgba(60,50,130,.14),0 10px 20px rgba(60,50,130,.12);transition:transform .14s,opacity .3s,filter .3s}
.wcard .wt{font-size:var(--cf);line-height:1.15;white-space:nowrap}
.wcard .ct{width:42%;height:auto;color:var(--tc)}
.wcard.press{transform:translateY(4px) scale(.97)}
.wcard.in{animation:tileIn .5s cubic-bezier(.2,1.5,.4,1) backwards}
.wcard.no{opacity:.4;filter:grayscale(.5)}
.wcard.win{box-shadow:0 0 0 5px #fff,0 0 0 10px var(--tc),0 14px 26px rgba(60,50,130,.2);z-index:4}
.wcard.hint{animation:k-pulse .8s ease-in-out infinite}
.wcard.gone{opacity:0;transform:scale(.6)}

/* read (Đọc dấu) */
.rl{position:relative;flex:1 1 auto;width:100%;max-width:1240px;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--pg);
  grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"chips" "main" "board" "pad";justify-items:center;align-items:center}
.rl.land{grid-template-columns:minmax(0,56fr) minmax(0,44fr);grid-template-rows:auto minmax(0,1fr) auto auto minmax(0,1fr);grid-template-areas:"chips chips" "board ." "board main" "board pad" "board ."}
.rl.land .board{align-self:center}.rl.land .chips{flex-wrap:nowrap}
.chips{grid-area:chips;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.chip{position:relative;border:none;background:#fff;border-radius:18px;min-width:var(--chw,66px);height:var(--chh,58px);padding:2px 10px 6px;font:800 var(--chf,25px)/1 var(--font);color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 5px 0 rgba(60,50,130,.12);transition:transform .12s}
.chip.press{transform:translateY(4px)}
.chip.sel{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d)}
.chip .hd{display:flex;gap:2px}
.chip .hd i{width:6px;height:6px;border-radius:50%;background:#e4e0f2}
.chip.sel .hd i{background:rgba(255,255,255,.35)}
.chip .hd i.on{background:var(--tc)!important}
.rmain{grid-area:main;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vmin,18px)}
.syl{position:relative;font-weight:800;font-size:var(--sf,72px);line-height:1.2;color:var(--ink);background:#fff;border-radius:.34em;padding:0 .38em .06em;
  box-shadow:0 6px 0 rgba(60,50,130,.12),0 12px 22px rgba(60,50,130,.1);min-width:2.5em;text-align:center}
.syl.pop{animation:k-jelly .5s ease}
.sylw{position:relative;display:inline-block}
.rpic{position:absolute;right:calc(var(--sf,72px) * -.42);top:calc(var(--sf,72px) * -.38);font-size:calc(var(--sf,72px) * .78);line-height:1;width:1.25em;height:1.25em;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(60,50,130,.12),0 0 0 3px #ffe27a;transform:scale(0) rotate(-20deg);transition:transform .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.rpic .num{font-size:.8em}
.rpic.on{transform:scale(1) rotate(8deg)}
.rpic .num{font:800 1em/1 var(--font);color:#ff8a3d;-webkit-text-stroke:.08em #fff;paint-order:stroke fill}
#bAll{padding:.45em .9em .5em;font-size:clamp(17px,2.8vmin,22px)}
#bAll.on{--b:var(--c1);--bd:var(--c1d)}
.board{grid-area:board;position:relative;width:var(--bw,400px);height:var(--bh,220px);border-radius:28px;background:linear-gradient(180deg,#ffffff,#f6f3ff);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.9),0 8px 0 rgba(60,50,130,.1),0 14px 28px rgba(60,50,130,.1);touch-action:none}
.board svg.bd{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rbird{position:absolute;left:0;top:0;width:var(--rb,70px);will-change:transform;z-index:2;pointer-events:none}
#read .pad{grid-area:pad}

/* garden */
#garden{gap:10px}
.g-top{display:flex;align-items:center;gap:clamp(8px,2vmin,16px);justify-content:center;flex-wrap:wrap}
#gBird{width:clamp(86px,15vmin,140px);cursor:pointer}
.g-hd{display:flex;flex-direction:column;align-items:center;gap:6px}
.gcount{background:#fff;border-radius:999px;padding:4px 16px 4px 8px;font-weight:800;font-size:clamp(18px,3vmin,24px);color:var(--ink);display:inline-flex;gap:6px;align-items:center;box-shadow:0 5px 0 rgba(60,50,130,.12)}
.gcount svg{width:1.5em;height:1.9em}
.beds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(1040px,100%)}
@media (max-width:620px){.beds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bed{--tc:#888;--td:#555;--tl:#eee;position:relative;background:linear-gradient(#fbfaff,#f3f0ff);border-radius:26px;padding:8px 8px 0;display:flex;flex-direction:column;gap:2px;overflow:hidden;
  box-shadow:0 6px 0 rgba(60,50,130,.1),0 12px 22px rgba(60,50,130,.08)}
.sign{display:flex;align-items:center;gap:8px;border:none;background:none;padding:0 46px 0 0;cursor:pointer;font:800 clamp(18px,2.8vmin,22px)/1 var(--font);color:var(--td);min-height:48px;text-align:left;width:100%}
.sign .mk{width:44px;height:44px;border-radius:14px;background:var(--tc);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--td);flex:0 0 auto}
.sign .mk svg{width:66%;height:66%;overflow:visible}
.sign .nmc{display:flex;flex-direction:column;gap:2px;min-width:0}
.sign .ct{width:36px;height:20px;color:var(--tc);flex:0 0 auto}
.sign .cnt{position:absolute;top:12px;right:10px;background:var(--tl);color:var(--td);border-radius:999px;padding:4px 10px;font:800 18px/1 var(--font);min-width:34px;text-align:center}
.plot{position:relative;min-height:96px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;align-content:flex-end;padding:2px 2px 16px;margin:0 -8px}
.plot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(#b7845a,#9a6a43);border-radius:14px 14px 0 0}
.plot .empty{position:relative;z-index:1;width:100%;text-align:center;font-size:34px;opacity:.6;padding-bottom:4px}
.fl{position:relative;z-index:1;border:none;background:none;padding:0;width:clamp(38px,7vmin,52px);height:clamp(61px,11.2vmin,83px);margin:0 -4px -8px;cursor:pointer}
.fl svg{width:100%;height:100%;overflow:visible;transform-origin:50% 100%;animation:k-sway 3.2s ease-in-out infinite}
.fl.new svg{animation:flNew .8s cubic-bezier(.2,1.6,.4,1) backwards,k-sway 3.2s ease-in-out .8s infinite}
@keyframes flNew{from{transform:scale(0)}}
.fl.tap svg{animation:flTap .6s ease}
@keyframes flTap{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95) rotate(6deg)}}
.g-empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.bfly{position:absolute;z-index:3;pointer-events:none;font-family:var(--emoji);font-size:clamp(26px,4.6vmin,40px);animation:bfly 6s ease-in-out infinite}
@keyframes bfly{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(18px,-14px) rotate(6deg)}50%{transform:translate(34px,4px) rotate(-4deg)}75%{transform:translate(12px,12px) rotate(8deg)}}

/* result */
.resfl{display:flex;justify-content:center;flex-wrap:wrap;gap:0;margin-top:8px}
.resfl svg{width:clamp(30px,6vmin,42px);height:clamp(48px,9.6vmin,67px);animation:flNew .6s cubic-bezier(.2,1.6,.4,1) backwards}
.k-result .bird-host.k-mascot{width:150px;height:auto;margin:-86px auto -4px}
@media (max-height:500px){ .resfl svg{width:26px;height:42px} }
</style>
</head>

<script>/* ===== NhiKit 3 — shared engine (audio synth, music, voice, fx, ui, input) ===== */
const Kit = (() => {
  'use strict';
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const ease = {
    out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    back: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1,
  };
  /* restart a CSS animation class on an element */
  function anim(e, cls, ms = 600) { if (!e) return; e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); clearTimeout(e['_k_' + cls]); e['_k_' + cls] = setTimeout(() => e.classList.remove(cls), ms); }
  const shake = e => anim(e, 'k-a-shake', 480), wiggle = e => anim(e, 'k-a-wiggle', 520), jelly = e => anim(e, 'k-a-jelly', 520);
  const vibrate = ms => { try { if (settings.sound && navigator.vibrate) navigator.vibrate(ms); } catch (e) { } };

  /* Vietnamese number words 0..1000 */
  const DIG = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  function numVi(n) {
    n = Math.round(n);
    if (n < 0) return 'âm ' + numVi(-n);
    if (n < 10) return DIG[n];
    if (n < 20) return 'mười' + (n === 10 ? '' : ' ' + (n % 10 === 5 ? 'lăm' : DIG[n % 10]));
    if (n < 100) { const t = Math.floor(n / 10), u = n % 10; return DIG[t] + ' mươi' + (u === 0 ? '' : ' ' + (u === 1 ? 'mốt' : u === 5 ? 'lăm' : u === 4 ? 'tư' : DIG[u])); }
    if (n < 1000) { const h = Math.floor(n / 100), r = n % 100; return DIG[h] + ' trăm' + (r === 0 ? '' : r < 10 ? ' lẻ ' + DIG[r] : ' ' + numVi(r)); }
    return String(n);
  }

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { try { localStorage.removeItem(ns + k); } catch (e) { } },
  });
  const store = mkStore('bv3.' + GAME + '.');
  const shared = mkStore('bv3.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- generation guard (cancels stale timers on screen change) ---------- */
  let gen = 0;
  const timers = new Set();
  function after(ms, fn) { const g = gen; const id = setTimeout(() => { timers.delete(id); if (g === gen) fn(); }, ms); timers.add(id); return id; }
  function sleep(ms) { const g = gen; return new Promise(r => { const id = setTimeout(() => { timers.delete(id); if (g === gen) r(); }, ms); timers.add(id); }); }
  function cancelAll() { gen++; timers.forEach(clearTimeout); timers.clear(); }

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.26;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) return null;
    if (ctx.state === 'suspended' && !document.hidden && unlocked) ctx.resume().catch(() => { });
    return ctx;
  }
  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
    master = ctx.createGain(); master.gain.value = 0.9;
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
    musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
    sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
  }
  function unlock() {
    if (unlocked) { if (ctx && ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { }); return; }
    unlocked = true;
    build();
    if (!ctx) return;
    try { const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) { }
    if (ctx.state === 'suspended') ctx.resume().catch(() => { });
    if (music._want) music.start(music._want);
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { speech.stop(); if (ctx) ctx.suspend().catch(() => { }); }
    else if (ctx && unlocked) ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.22 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || 6; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + a + (o.hold || 0) + d + 0.05); }
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.18 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + a + (o.hold || 0) + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.18, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus }); tone({ f: f * 2, t, vol: vol * 0.2, dur: dur * 0.5, bus }); tone({ f: f * 3.01, t, vol: vol * 0.06, dur: dur * 0.3, bus });
  }
  function marimba(f, t = 0, vol = 0.18, dur = 0.4, bus) { tone({ f, t, vol, dur, bus }); tone({ f: f * 4, t, vol: vol * 0.14, dur: dur * 0.16, bus }); }
  function pluck(f, t = 0, vol = 0.11, dur = 0.3, bus) { tone({ f, t, vol, dur, type: 'triangle', lp: 2200, bus }); }
  function flute(f, t = 0, vol = 0.09, dur = 0.4, bus) { tone({ f, t, vol, dur, a: 0.03, type: 'sine', vib: 5.5, vibAmt: 4, bus }); tone({ f: f * 2, t, vol: vol * 0.12, dur, a: 0.03, bus }); }

  const sfx = {
    tap() { tone({ f: 660, to: 920, dur: 0.06, vol: 0.1, type: 'triangle' }); },
    click() { tone({ f: 1250, dur: 0.03, vol: 0.06, type: 'triangle' }); },
    pop() { tone({ f: 380, to: 1300, slide: 0.07, dur: 0.1, vol: 0.28 }); noise({ f: 2600, q: 0.8, dur: 0.05, vol: 0.08 }); },
    good() { bell(1046.5, 0, 0.16, 0.5); bell(1318.5, 0.09, 0.16, 0.6); bell(1568, 0.18, 0.12, 0.7); },
    bad() { tone({ f: 340, to: 300, dur: 0.14, vol: 0.13, type: 'triangle', lp: 1200 }); tone({ f: 270, to: 245, t: 0.16, dur: 0.24, vol: 0.13, type: 'triangle', lp: 1000 }); },
    soft() { tone({ f: 520, to: 440, dur: 0.16, vol: 0.09, type: 'sine' }); },
    star() { [1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.06, 0.07, 0.35)); },
    win() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.11, 0.15, 0.6)); [1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.5 + i * 0.05, 0.05, 0.4)); },
    fanfare() {
      [[523.25, 0], [659.25, 0.12], [783.99, 0.24], [1046.5, 0.42], [783.99, 0.62], [1046.5, 0.76]].forEach(([f, t]) => { tone({ f, t, vol: 0.07, dur: 0.22, type: 'square', lp: 2600 }); bell(f, t, 0.09, 0.4); });
      [1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.9 + i * 0.05, 0.05, 0.5));
    },
    whoosh() { noise({ f: 400, to: 3200, q: 1.2, dur: 0.26, vol: 0.12 }); },
    swish() { noise({ f: 1800, to: 5200, q: 2.2, dur: 0.12, vol: 0.12, ft: 'bandpass' }); },
    pick() { tone({ f: 520, to: 820, dur: 0.08, vol: 0.12, type: 'triangle' }); },
    drop() { tone({ f: 640, to: 300, dur: 0.1, vol: 0.14 }); noise({ f: 320, q: 0.7, dur: 0.06, vol: 0.07, ft: 'lowpass' }); },
    snap() { tone({ f: 880, dur: 0.05, vol: 0.12, type: 'triangle' }); tone({ f: 1320, t: 0.05, dur: 0.12, vol: 0.12, type: 'triangle' }); },
    boing() { tone({ f: 170, to: 560, slide: 0.12, dur: 0.3, vol: 0.16 }); },
    jump() { tone({ f: 300, to: 760, slide: 0.14, dur: 0.18, vol: 0.14, type: 'triangle' }); },
    bonk() { tone({ f: 200, to: 90, dur: 0.16, vol: 0.2, type: 'triangle', lp: 900 }); noise({ f: 300, q: 0.6, dur: 0.07, vol: 0.12, ft: 'lowpass' }); },
    chomp() { noise({ f: 650, q: 1.6, dur: 0.07, vol: 0.28, ft: 'lowpass' }); noise({ t: 0.15, f: 560, q: 1.6, dur: 0.07, vol: 0.26, ft: 'lowpass' }); },
    splash() { noise({ f: 1200, to: 400, q: 0.8, dur: 0.3, vol: 0.18 }); tone({ f: 900, to: 300, dur: 0.12, vol: 0.06 }); },
    slice() { noise({ f: 3000, to: 7000, q: 3, dur: 0.09, vol: 0.14, ft: 'bandpass' }); tone({ f: 1200, to: 2400, dur: 0.06, vol: 0.05, type: 'triangle' }); },
    water() { for (let i = 0; i < 4; i++) tone({ f: rand(500, 900), to: rand(1200, 1800), t: i * 0.07, dur: 0.06, vol: 0.06 }); },
    coin() { tone({ f: 988, dur: 0.07, vol: 0.09, type: 'square', lp: 4000 }); tone({ f: 1319, t: 0.07, dur: 0.28, vol: 0.09, type: 'square', lp: 4000 }); },

  for (let k = 0; out.length < n && k < n * 8; k++) { const l = per[order[k % order.length]]; if (l.length) out.push(l.pop()); }

    bw = Math.min(lw, avail * 1.82, 800);
  }
  st.setProperty('--bw', bw.toFixed(1) + 'px'); st.setProperty('--bh', (bw / 1.82).toFixed(1) + 'px'); st.setProperty('--rb', clamp(bw * 0.15, 46, 110).toFixed(1) + 'px');
  if (!rAnim && G.samples) placeReadBird(1, G.tone);
}

/* =====================================================================
   GARDEN (Vườn dấu thanh) — persistent collection
   ===================================================================== */
let gardenBack = goTitle;
function goGarden(back) {
  token++; G = null; cleanupFx();
  gardenBack = back || goTitle;
  show('garden', { back: () => gardenBack(), music: 'dreamy' });
  renderGarden();
  const n = gTotal();
  speak(n ? `Vườn dấu thanh! Bé có ${Kit.numVi(Math.min(n, 999))} bông hoa!` : 'Vườn còn trống. Chơi để trồng hoa nhé!', gBird);
  if (!n) Kit.bubble($('#gBird'), 'Chơi để trồng hoa nhé!', { ms: 3200 });
}
function renderGarden() {
  const n = gTotal();
  $('#gTotal').innerHTML = `${flowerSVG(2, 0)}<span>${n}</span>`;
  $('#gEmpty').classList.toggle('hidden', n > 0);
  const box = $('#beds'); box.innerHTML = '';
  [0, 1, 2, 3, 4, 5].forEach(t => {
    const bed = el('div', 'bed'); bed.setAttribute('style', tv(t)); bed.dataset.t = t;
    const words = save.garden.w[t].slice(-12), cnt = save.garden.c[t];
    bed.innerHTML = `<button class="sign" data-nosfx aria-label="${TONES[t].full}"><span class="mk">${markSvg(t)}</span><span class="nmc"><span>${TONES[t].name}</span>${contourIcon(t)}</span><span class="cnt">${cnt}</span></button><div class="plot"></div>`;
    const plot = $('.plot', bed);
    if (!words.length) plot.innerHTML = '<div class="empty">🌱</div>';
    words.forEach((w, i) => {
      const f = el('button', 'fl', flowerSVG(t, hash(w))); f.dataset.w = w; f.dataset.nosfx = '';
      f.style.setProperty('--d', i); f.querySelector('svg').style.animationDelay = (-(i * 0.37) % 3).toFixed(2) + 's';
      f.setAttribute('aria-label', w);
      f.onclick = () => {
        Kit.anim(f, 'tap', 620); singTone(t, gBird);
        const b = BANK_MAP[w];
        Kit.bubble(f, `${b ? '<span class="emo">' + picSmall(b) + '</span> ' : ''}${b ? colorWord(b.A, t) : w}`, { ms: 1800 });
        Kit.after(Math.round(humDur(t) * 1000) + 80, () => speak(w, gBird));
        const r = f.getBoundingClientRect(); Kit.sparkle(r.left + r.width / 2, r.top + r.height * 0.25, { n: 5, r: 14, colors: [TONES[t].c, '#fff'] });
      };
      plot.appendChild(f);
    });
    $('.sign', bed).onclick = () => { singTone(t, gBird); Kit.jelly($('.sign .mk', bed)); Kit.after(Math.round(humDur(t) * 1000) + 80, () => speak(TONES[t].full, gBird)); };
    box.appendChild(bed);
  });
  // butterflies: a little decoration that grows with the garden (cosmetic only)
  $$('#garden .bfly').forEach(b => b.remove());
  const nb = Math.min(5, Math.floor(n / 10));
  for (let i = 0; i < nb; i++) { const b = el('div', 'bfly', '🦋'); b.style.left = (8 + i * 19 + rand(-3, 3)) + '%'; b.style.top = `calc(var(--bar-h) + ${rand(4, 40).toFixed(0)}px)`; b.style.animationDelay = (-i * 1.3) + 's'; $('#garden').appendChild(b); }
}
$('#gBird').addEventListener('pointerdown', () => { const t = Math.floor(rand(0, 6)); singTone(t, gBird); gBird.hop(); });

/* =====================================================================
   END OF ROUND
   ===================================================================== */
function endRound() {
  token++; stopHints();
  const m = G.mode, li = G.li, n = G.n, stars = starsFor(G.first, n), items = G.items;
  save.best[m + li] = Math.max(save.best[m + li] || 0, stars); persist();
  const mascot = el('div', 'bird-host k-mascot'); const mb = new Bird(mascot, { branch: true }); mb.happy(true);
  const fl = items.map((it, i) => flowerSVG(it.A.tone, hash(it.w)).replace('<svg ', `<svg style="animation-delay:${(0.9 + i * 0.12).toFixed(2)}s" `)).join('');
  const nextLi = (li + 1) % LEVELS.length;
  const res = Kit.result({
    title: stars === 3 ? 'Giỏi quá!' : stars === 2 ? 'Tuyệt vời!' : 'Bé cố gắng lắm!',
    stars,
    text: `Bé trồng được ${n} bông hoa!`,
    extra: `<div class="resfl">${fl}</div>`,
    say: (stars === 3 ? 'Giỏi quá! ' : 'Tuyệt vời! ') + `Bé trồng được ${Kit.numVi(n)} bông hoa!`,
    buttons: [
      { label: 'Chơi lại', icon: 'replay', cls: 'ok', onClick: () => m === 'add' ? startAdd(li) : startLis(li) },
      { label: 'Màn tiếp', icon: 'next', cls: '', onClick: () => m === 'add' ? startAdd(nextLi) : startLis(nextLi) },
      { label: '<span class="emo">🌷</span>', cls: 'gold round', onClick: () => goGarden(() => goLevels(m)) },
      { label: '', icon: 'home', cls: 'white round', onClick: () => goLevels(m) },
    ],
  });
  res.panel.prepend(mascot);
  setTimeout(() => { mb.hop(); mb.sing(900, TONES[2].c); }, 700);
  Kit.setBack(() => { res.close(); goLevels(m); });
}

/* ---------- resize ---------- */
Kit.onResize(() => { layoutPlay(); layoutLis(); layoutRead(); });

/* ---------- test hooks (tests use them only to decide where to tap) ---------- */
window.__game = {
  get state() {
    if (!G) return { screen: Kit.current };
    const s = { screen: Kit.current, mode: G.mode, li: G.li, q: G.q, n: G.n, busy: G.busy, first: G.first, tries: G.tries, wrongTotal: G.wrongTotal };
    if (G.cur) { s.word = G.cur.w; s.ans = G.cur.A.tone; if (G.mode === 'lis') s.ansCard = G.cur.cards.findIndex(c => c.t === G.cur.A.tone); }
    if (G.mode === 'read') Object.assign(s, { base: G.base, tone: G.tone, all: G.all, anim: !!rAnim });
    return s;
  },
  get save() { return JSON.parse(JSON.stringify(save)); },
  bank: () => BANK.map(b => ({ w: b.w, pic: b.pic, tone: b.A.tone, ci: b.A.ci, rule: b.A.rule, ti: b.A.ti, tiles: b.A.tiles.map(t => t.s), base: b.A.bs, stop: b.A.stop })),
};

goTitle();
})();
</script>
