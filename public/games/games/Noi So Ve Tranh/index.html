<!DOCTYPE html>
<html lang="vi" data-game="noiso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4fb6f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nối Số Vẽ Tranh</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}

/* ===== Kit v2 additions (Bộ game 2) ===== */
/* tutorial hand */
.k-hand{position:fixed;z-index:72;left:0;top:0;width:clamp(54px,9vmin,78px);height:auto;pointer-events:none;opacity:0;
  filter:drop-shadow(0 6px 6px rgba(30,10,80,.25));transition:opacity .25s;will-change:transform}
.k-hand.on{opacity:1}
.k-hand .tapring{transform-origin:22px 10px;animation:k-ring 1s ease-out infinite}
@keyframes k-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* segmented chips (Dễ / Vừa / Khó …) */
.k-seg{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(40,20,90,.12)}
.k-seg button{border:none;cursor:pointer;min-height:48px;min-width:56px;padding:0 16px;border-radius:999px;background:transparent;
  font:800 clamp(16px,2.6vmin,21px)/1 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.k-seg button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.k-seg button:active{transform:translateY(2px)}
/* tile buttons for mode / level grids */
.k-tile{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;color:var(--ink);padding:12px 10px 10px;
  box-shadow:0 7px 0 rgba(40,20,90,.16),0 12px 20px rgba(40,20,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:800 clamp(16px,2.7vmin,22px)/1.05 var(--font);transition:transform .14s,box-shadow .14s;min-height:64px;text-align:center}
.k-tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(40,20,90,.16)}
.k-tile .emo{font-size:clamp(34px,6.4vmin,54px)}
.k-tile small{font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .k-tstars{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5;display:block}
.k-mini-star.on svg{color:#ffc83d;filter:drop-shadow(0 1px 0 #e09a00)}
/* scrollable screen body under the bar */
.k-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--bar-h) + var(--safe-t) + 6px) calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l));
  display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  box-shadow:0 4px 0 rgba(40,20,90,.12);white-space:nowrap}
.k-pill .emo{font-size:1.3em}
@keyframes k-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}50%{filter:drop-shadow(0 0 14px rgba(255,220,80,.95))}}
.k-glow{animation:k-glow 1.2s ease-in-out infinite}
@keyframes k-squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}}
.k-squash{animation:k-squash .5s ease}
@keyframes k-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.k-jump{animation:k-jump .5s cubic-bezier(.3,1.5,.5,1)}
</style>
<style>
:root{--c1:#2f8cff;--c1d:#1a62c4;--c1l:#e1efff;--c2:#ff5f9e;--c2d:#d63a7a;--bg1:#8fd3ff;--bg2:#ffe4f1;--ink:#3b2f63;--gold:#ffc83d;--goldd:#e09a00}
body{background:linear-gradient(168deg,#86cffd 0%,#bfe8ff 42%,#ffe3f0 100%)}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.deco i{position:absolute;border-radius:50%;opacity:.5;animation:k-float 10s ease-in-out infinite}
.deco b{position:absolute;font-weight:800;color:#fff;opacity:.55;animation:k-float 12s ease-in-out infinite;font-size:22px}

/* ---------- ladybug mascot ---------- */
.lady{display:block;overflow:visible}
.lady *{transform-box:view-box}
.lady .ld-all{transform-origin:100px 190px}
.lady .ld-body{transform-origin:100px 190px;animation:ld-breathe 3s ease-in-out infinite}
.lady .ld-head{transform-origin:100px 110px}
.lady .ld-eyes{transform-origin:100px 72px;animation:ld-blink 4.4s infinite}
.lady .ld-pup{transition:transform .15s ease-out}
.lady .ld-antL{transform-origin:90px 44px;animation:ld-ant 3.4s ease-in-out infinite}
.lady .ld-antR{transform-origin:110px 44px;animation:ld-ant2 3.4s ease-in-out infinite}
.lady .ld-wL,.lady .ld-wR{transform-origin:100px 84px;transition:transform .25s}
.lady .ld-mo{opacity:0}
.lady.happy .ld-all{animation:ld-hop .62s cubic-bezier(.3,1.6,.5,1)}
.lady.happy .ld-mo,.lady.talk .ld-mo{opacity:1}.lady.happy .ld-mc{opacity:0}
.lady.talk .ld-mo{animation:ld-talk .3s steps(2) infinite}
.lady.fly .ld-wL{animation:ld-wl .16s ease-in-out 8 alternate}
.lady.fly .ld-wR{animation:ld-wr .16s ease-in-out 8 alternate}
.lady.no .ld-head{animation:ld-no .7s ease-in-out}
@keyframes ld-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
@keyframes ld-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes ld-ant{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes ld-ant2{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
@keyframes ld-hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-30px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.94)}}
@keyframes ld-talk{0%{opacity:1}100%{opacity:0}}
@keyframes ld-wl{from{transform:rotate(0)}to{transform:rotate(-34deg)}}
@keyframes ld-wr{from{transform:rotate(0)}to{transform:rotate(34deg)}}
@keyframes ld-no{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}45%{transform:rotate(9deg)}70%{transform:rotate(-5deg)}}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.4vmin,14px);padding:calc(var(--bar-h) + 4px) 16px 20px}
#title .tbox{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vmin,16px)}
.hero{position:relative;width:clamp(170px,40vmin,330px);aspect-ratio:1}
.hero .trail{position:absolute;inset:-6%;width:112%;height:112%;overflow:visible}
.hero .trail .rb{stroke-dasharray:400;stroke-dashoffset:400;animation:trail 5s ease-in-out infinite}
.hero .trail .td{animation:tdot 5s ease-in-out infinite}
@keyframes trail{0%{stroke-dashoffset:400}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}
@keyframes tdot{0%,100%{opacity:1}55%,85%{opacity:.35}}
.hero .lady{position:absolute;left:18%;top:20%;width:64%;height:64%}
.logo{--c1d:#1557b0}
.logo .l2 span{display:inline-block}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(4px,1.5vmin,14px)}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #title .tbox{flex-direction:row;gap:5vw}
  #title .tcol{display:flex;flex-direction:column;align-items:center}
  .hero{width:min(58vmin,250px)}
}

/* ---------- select ---------- */
.modes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:min(980px,100%)}
@media (max-width:720px){.modes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mode{border:none;cursor:pointer;min-height:66px;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(26,70,140,.22);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font:800 clamp(18px,3.1vmin,26px)/1 var(--font);color:var(--ink);padding:8px 4px;transition:transform .12s}
.mode .seq{display:flex;gap:.28em;align-items:center}
.mode .seq i{font-style:normal}
.mode .seq i:nth-child(1){color:#ff5a5f}.mode .seq i:nth-child(2){color:#ff9f1c}.mode .seq i:nth-child(3){color:#2fae5a}
.mode small{font-size:.58em;color:var(--ink-soft);font-weight:700}
.mode:active{transform:translateY(3px)}
.mode.on{background:var(--gold);box-shadow:0 5px 0 var(--goldd),0 0 0 4px #fff}
.mode.on small{color:#7a4b00}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(100px,19vw,150px),1fr));gap:12px;width:min(980px,100%);padding-bottom:8px}
.pic{position:relative;border:none;cursor:pointer;border-radius:24px;background:#fff;padding:8px 6px 8px;box-shadow:0 6px 0 rgba(26,70,140,.2);display:flex;flex-direction:column;
  align-items:center;gap:2px;font:800 clamp(14px,2.3vmin,18px)/1.1 var(--font);color:var(--ink);transition:transform .12s}
.pic:active{transform:translateY(4px)}
.pic .th{width:100%;aspect-ratio:1;display:block}
.pic .th svg{width:100%;height:100%;display:block;overflow:visible}
.pic.done{background:linear-gradient(#fffbe9,#fff)}
.pic .rib{position:absolute;top:-8px;right:-6px;width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--okd)}
.pic .rib svg{width:22px;height:22px}
.pic .k-tstars{margin-top:-2px}
.pic.rnd{background:linear-gradient(140deg,#ffe1ef,#fff6c9 50%,#d9f3ff)}
.pic.rnd .th{display:grid;place-items:center;font-size:clamp(44px,8vmin,64px)}

/* ---------- play ---------- */
#play{display:none}
#play.on{display:block}

.dt.first{background:#22b45a}
.dt.first::after,.dt.hint::after{content:"";position:absolute;inset:-70%;border-radius:50%;border:3px solid #22b45a;animation:ring 1.1s ease-out infinite}
.dt.hint{background:#ff8a00;animation:hintb .7s ease-in-out infinite alternate}
.dt.hint::after{border-color:#ff8a00}
.dt.done{background:var(--hc);transform:scale(.72)}
.dt.pop{animation:dpop .42s cubic-bezier(.3,1.6,.5,1)}

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }
    else ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);

  by5: 'Đếm cách năm: năm, mười, mười lăm... Bắt đầu từ số 5 nhé!', by10: 'Đếm cách mười: mười, hai mươi, ba mươi... Bắt đầu từ số 10 nhé!',
};

function startPicture(id) {
  leavePlay();
  const my = roundId;
  const pic = picById(id) || PICS[0], mode = modeById(save.mode), v = makeVariant(pic, mode);
  G = { pic, mode, P: v.P, n: v.P.length, closeIdx: v.closeIdx, mir: v.mir, next: 0, wrong: 0, phase: 'play', hue0: rand(0, 360), grow: 1, closing: 0,
    lastConn: 0, lastWrong: 0, color: doneColor(pic), px: [], finger: null, drag: false, tw: null };
  board.classList.remove('fin'); cv.classList.remove('fade'); artEl.classList.remove('live', 'pop'); artEl.innerHTML = ''; dotsEl.innerHTML = '';
  G.dots = G.P.map((p, i) => { const d = el('i', 'dt' + (i === 0 ? ' first' : '')); dotsEl.appendChild(d); return d; });
  G.labs = G.P.map((p, i) => { const b = el('b', 'lb', String(mode.lab(i))); dotsEl.appendChild(b); return b; });
  $('#lady').innerHTML = ladySVG();
  $('#bub').classList.remove('yay');
  show('play'); $('#mid').appendChild(progEl);
  layout(); setProgress(); setBubble(false);
  if (!save.seen[mode.id]) { save.seen[mode.id] = 1; persist(); speak(INTRO[mode.id]); }
  else speak('Bắt đầu từ ' + spoken(mode, 0) + ' nhé!');
  if (!save.tut.first) setTimeout(() => { if (my === roundId && G && G.next === 0) hand.drag(() => G && G.n > 1 ? pagePt(0) : null, () => G && G.n > 1 ? pagePt(1) : null, { times: 3 }); }, 1100);
  armHints();
}
function speak(t, o) { const b = lady(); if (say(t, Object.assign({ onend: () => b && b.classList.remove('talk') }, o)) && b) b.classList.add('talk'); }
function setProgress() { if (!G) return; $('#pc', progEl).textContent = `${G.next}/${G.n}`; $('.pbar i', progEl).style.width = (G.next / G.n * 100) + '%'; }
function setBubble(pop) {
  if (!G) return;
  const done = G.next >= G.n;
  $('#tg').textContent = done ? '★' : G.mode.lab(G.next);
  $('#bub .bdot').style.display = done ? 'none' : '';
  $('#bub').classList.toggle('yay', done);
  if (pop) act($('#bub'), 'pop', 360);
}
function placeDots() {
  if (!G || !LAY) return;
  const { pad, inner, fs, r, s, lw } = LAY;
  G.px = G.P.map(p => ({ x: pad + p.x / 100 * inner, y: pad + p.y / 100 * inner }));
  G.dots.forEach((d, i) => { d.style.left = G.px[i].x + 'px'; d.style.top = G.px[i].y + 'px'; });
  const L = placeLabels(G.px, G.P.map((_, i) => G.mode.lab(i)), { fs, r: r * 1.38, W: s, H: s, closeIdx: G.closeIdx, lw: lw / 2 });
  G.labs.forEach((b, i) => { b.style.left = L[i].x + 'px'; b.style.top = L[i].y + 'px'; b.style.fontSize = L[i].s < 1 ? (fs * L[i].s) + 'px' : ''; });
}

/* ---------- rainbow line (canvas) ---------- */
let rq = false;
function redraw() { if (rq) return; rq = true; Kit.loop.add(() => { rq = false; draw(); return false; }); }
function draw() {
  if (!G || !LAY || screen !== 'play') return;
  const s = LAY.s, lw = LAY.lw, C = G.px, k = Math.min(G.next, C.length);
  g2.clearRect(0, 0, s, s);
  if (!C.length) return;
  const pts = []; for (let i = 0; i < k; i++) pts.push(C[i]);
  if (k >= 2 && G.grow < 1) { const a = C[k - 2], b = C[k - 1]; pts[k - 1] = { x: lerp(a.x, b.x, G.grow), y: lerp(a.y, b.y, G.grow) }; }
  const segsL = []; for (let i = 1; i < pts.length; i++) segsL.push([pts[i - 1], pts[i], hueAt(i - 1), hueAt(i)]);
  if (G.closing > 0 && G.closeIdx != null) { const a = C[G.n - 1], b = C[G.closeIdx]; segsL.push([a, { x: lerp(a.x, b.x, G.closing), y: lerp(a.y, b.y, G.closing) }, hueAt(G.n - 1), hueAt(G.n - 1) + 40]); }
  g2.lineCap = 'round'; g2.lineJoin = 'round';
  if (segsL.length) {
    g2.strokeStyle = 'rgba(255,255,255,.96)'; g2.lineWidth = lw + 6; g2.beginPath();
    segsL.forEach(([a, b]) => { g2.moveTo(a.x, a.y); g2.lineTo(b.x, b.y); }); g2.stroke();
    g2.lineWidth = lw;
    segsL.forEach(([a, b, h1, h2]) => { const gr = g2.createLinearGradient(a.x, a.y, b.x + .01, b.y + .01); gr.addColorStop(0, hsl(h1)); gr.addColorStop(1, hsl(h2)); g2.strokeStyle = gr; g2.beginPath(); g2.moveTo(a.x, a.y); g2.lineTo(b.x, b.y); g2.stroke(); });
    g2.strokeStyle = 'rgba(255,255,255,.38)'; g2.lineWidth = Math.max(2, lw * .26); g2.beginPath();
    segsL.forEach(([a, b]) => { g2.moveTo(a.x, a.y - lw * .18); g2.lineTo(b.x, b.y - lw * .18); }); g2.stroke();
  }
  if (G.drag && G.finger && k >= 1 && k < G.n && G.phase === 'play') {
    const a = C[k - 1], f = G.finger;
    g2.globalAlpha = .7; g2.setLineDash([1, lw * 1.05]); g2.strokeStyle = hsl(hueAt(k - 1) + 15, 60); g2.lineWidth = lw * .72;
    g2.beginPath(); g2.moveTo(a.x, a.y); g2.lineTo(f.x, f.y); g2.stroke(); g2.setLineDash([]);
    g2.globalAlpha = .28; g2.fillStyle = hsl(hueAt(k - 1) + 15, 64); g2.beginPath(); g2.arc(f.x, f.y, lw * 1.3, 0, Math.PI * 2); g2.fill(); g2.globalAlpha = 1;
  }
}

/* ---------- input: tap dots one by one OR drag a finger through them ---------- */
const local = e => ({ x: e.clientX - LAY.bx, y: e.clientY - LAY.by });
board.addEventListener('pointerdown', e => {
  if (!G || !LAY) return;
  if (G.phase === 'color') { e.preventDefault(); artEl.classList.add('pop'); setTimeout(() => artEl.classList.remove('pop'), 240); sfx.boing(); speak(G.pic.say); return; }
  if (G.phase !== 'play' || ptr) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault(); try { board.setPointerCapture(e.pointerId); } catch (_) { }
  const p = local(e), hr = LAY.hitR;
  const t = ptr = { id: e.pointerId, x0: p.x, y0: p.y, lx: p.x, ly: p.y, moved: false, wrong: null, got: 0 };
  armHints(); hand.hide();
  const ni = G.next;
  if (Math.hypot(p.x - G.px[ni].x, p.y - G.px[ni].y) <= hr) { t.got++; connect(ni, 'tap'); }
  else {
    let best = -1, bd = hr * .9;
    for (let j = G.next + 1; j < G.n; j++) { const d = Math.hypot(p.x - G.px[j].x, p.y - G.px[j].y); if (d < bd) { bd = d; best = j; } }
    if (best >= 0) t.wrong = best;
  }
  G.finger = p; G.drag = true; redraw();
});
board.addEventListener('pointermove', e => {
  const t = ptr; if (!t || e.pointerId !== t.id || !G || !LAY) return;
  e.preventDefault();
  const p = local(e);
  if (Math.hypot(p.x - t.x0, p.y - t.y0) > 12) t.moved = true;
  const a = { x: t.lx, y: t.ly }; let guard = 0;
  while (G && G.phase === 'play' && G.next < G.n && guard++ < 8 && segDist(G.px[G.next], a, p) <= LAY.hitR * .8) { t.got++; connect(G.next, 'drag'); }
  t.lx = p.x; t.ly = p.y;
  if (G) { G.finger = p; redraw(); }
});
const pUp = e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const t = ptr; ptr = null;
  if (!G) return;
  G.drag = false; G.finger = null;
  if (e.type === 'pointerup' && !t.moved && !t.got && t.wrong != null && G.phase === 'play') wrongTap(t.wrong);
  redraw();
};
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => board.addEventListener(ev, pUp));

function connect(i, how) {
  const now = performance.now(), my = roundId;
  if (G.tw) { G.tw.cancel(); G.tw = null; }
  G.next = i + 1; G.grow = how === 'tap' && i > 0 ? 0 : 1;
  $$('.hint', dotsEl).forEach(x => x.classList.remove('hint'));
  const d = G.dots[i]; d.classList.remove('first'); d.style.setProperty('--hc', hsl(hueAt(i))); d.classList.add('done'); act(d, 'pop', 430);
  G.labs[i].classList.add('done');
  S.note(i, G.n);
  const bp = pagePt(i); sparkle(bp.x, bp.y, { n: 4, colors: [hsl(hueAt(i), 64), '#fff', '#ffe27a'] });
  if (G.grow < 1) { const tw = tween(150, t => { if (my === roundId && G) { G.grow = t; redraw(); } }); G.tw = tw; tw.then(() => { if (G && G.tw === tw) { G.tw = null; G.grow = 1; redraw(); } }); }
  if (how === 'tap' && now - G.lastConn > 600 && G.next < G.n) say(speakLab(G.mode, i), { rate: 1.05 });
  G.lastConn = now;
  if (!save.tut.first) { save.tut.first = 1; persist(); hand.hide(); }
  setProgress(); setBubble(true);
  if ((i + 1) % 5 === 0 && G.next < G.n) act(lady(), 'happy', 650);
  if (G.next >= G.n) finish(); else armHints();
  redraw();
}
function wrongTap(j) {
  const now = performance.now();
  if (now - G.lastWrong > 900) G.wrong++;
  G.lastWrong = now;
  S.wrong(); Kit.vibrate(30);
  act(G.dots[j], 'wob', 470); act(G.labs[j], 'wob', 520);
  showHint(); act($('#bub'), 'shake', 470); act(lady(), 'no', 750);
  speak('Tìm ' + spoken(G.mode, G.next) + ' nhé!');
}
function showHint() { if (!G || G.next >= G.n) return; G.dots[G.next].classList.add('hint'); G.labs[G.next].classList.add('hint'); }
function armHints() {
  clearTimeout(hintT); clearTimeout(handT);
  const my = roundId, ok = () => my === roundId && G && G.phase === 'play' && G.next < G.n;
  hintT = setTimeout(() => { if (ok()) { showHint(); sfx.tick(); } }, 4000);
  handT = setTimeout(() => { if (!ok()) return; showHint(); hand.tap(() => (G && G.next < G.n && screen === 'play') ? pagePt(G.next) : null, { times: 3 }); speak('Tìm ' + spoken(G.mode, G.next) + ' nhé!'); act(lady(), 'happy', 650); }, 9000);
}
function askAgain() {
  if (!G) return;
  act(lady(), 'happy', 650);
  if (G.phase === 'play') { showHint(); speak('Tìm ' + spoken(G.mode, G.next) + ' nhé!'); }
  else speak(G.pic.say);
}
$('#bub').addEventListener('click', askAgain);
$('#lady').addEventListener('click', () => { sfx.boing(); askAgain(); });

/* ---------- finished: reveal the coloured picture ---------- */
async function finish() {
  const my = roundId; G.phase = 'reveal'; clearTimers(); hand.hide(); G.drag = false; ptr = null;
  setBubble(true);
  await wait(G.grow < 1 ? 170 : 40); if (my !== roundId) return;
  if (G.closeIdx != null) {
    S.close();
    await tween(320, t => { if (my === roundId && G) { G.closing = t; redraw(); } }); if (my !== roundId) return;
    const p = pagePt(G.closeIdx); sparkle(p.x, p.y, { n: 6 }); S.note(G.n, G.n);
  }
  S.magic();
  G.px.forEach((p, i) => setTimeout(() => { if (my === roundId && G && i % 2 === 0) { const q = pagePt(i); sparkle(q.x, q.y, { n: 2 }); } }, i * 22));
  await wait(380); if (my !== roundId) return;
  board.classList.add('fin');
  artEl.innerHTML = `<defs><clipPath id="rvc"><circle id="rvr" cx="50" cy="50" r="0"/></clipPath></defs><g clip-path="url(#rvc)">${artInner(G.pic, G.color, G.mir)}</g>`;
  cv.classList.add('fade');
  const circ = $('#rvr');
  await tween(950, t => { if (circ) circ.setAttribute('r', (t * 82).toFixed(1)); }, ease.inOut); if (my !== roundId) return;
  artEl.innerHTML = artInner(G.pic, G.color, G.mir); artEl.classList.add('live', 'pop'); setTimeout(() => artEl.classList.remove('pop'), 260);
  S.tada(); speak(G.pic.say); Kit.praise(G.pic.name + '!', { speak: false });
  const c = Kit.center(board); burst(c.x, c.y, { n: 24 });
  act(lady(), 'happy', 650); act(lady(), 'fly', 1400);
  saveDone();
  await wait(1500); if (my !== roundId) return;
  openChooser();
}
function saveDone() {
  if (!G) return;
  const d = save.done[G.pic.id] || {};
  save.done[G.pic.id] = { c: G.color, s: Math.max(d.s || 0, starsFor(G.wrong)), t: Date.now() };
  persist();
}
function openChooser() {
  G.phase = 'color';
  const sws = $('#sws'); sws.innerHTML = '';
  G.pic.sw.forEach(col => {
    const b = el('button', 'sw' + (col === G.color ? ' on' : '')); b.style.setProperty('--sc', col); b.dataset.c = col; b.setAttribute('aria-label', 'Màu');
    b.onclick = () => pickColor(col, b); sws.appendChild(b);
  });
  layout();
  act($('#chooser'), 'k-squash', 520);
  speak('Bé chọn màu cho tranh nhé!');
  const my = roundId;
  chooseT = setTimeout(() => { if (my === roundId && G && G.phase === 'color') hand.tap(() => (screen === 'play' && $('#sws .sw:not(.on)')) || null, { times: 2 }); }, save.tut.color ? 9000 : 2600);
}
function pickColor(col, b) {
  if (!G || G.phase !== 'color') return;
  clearTimeout(chooseT); hand.hide();
  if (!save.tut.color) save.tut.color = 1;
  G.color = col; $$('#sws .sw').forEach(x => x.classList.toggle('on', x === b));
  artEl.innerHTML = artInner(G.pic, col, G.mir); artEl.classList.add('pop'); setTimeout(() => artEl.classList.remove('pop'), 250);
  S.splash(); const c = Kit.center(board); burst(c.x, c.y, { n: 14, colors: [col, cols(col).l, '#fff'], shape: 'circle', speed: 7 });
  act(lady(), 'happy', 650);
  saveDone();
  const my = roundId; chooseT = setTimeout(() => { if (my === roundId && G && G.phase === 'color') { act($('#bDone'), 'k-squash', 520); hand.tap($('#bDone'), { times: 2 }); } }, 7000);
}
function nextPicId(id) { const i = PICS.findIndex(p => p.id === id); for (let k = 1; k <= PICS.length; k++) { const p = PICS[(i + k) % PICS.length]; if (!save.done[p.id]) return p.id; } return PICS[(i + 1) % PICS.length].id; }
$('#bDone').onclick = () => { if (G && G.phase === 'color') showResult(); };
function showResult() {
  G.phase = 'result'; clearTimers(); hand.hide(); saveDone();
  const stars = starsFor(G.wrong), pic = G.pic, color = G.color, mir = G.mir, nextId = nextPicId(pic.id);
  Kit.result({
    stars, top: `<div class="rprev">${artSVG(pic, color, { live: true, mir })}</div>`,
    title: stars === 3 ? 'Tuyệt vời!' : stars === 2 ? 'Giỏi quá!' : 'Hoàn thành!',
    text: pic.name + ' đã vào Phòng tranh', say: (stars === 3 ? 'Tuyệt vời! ' : 'Giỏi quá! ') + pic.name + ' đã vào phòng tranh!',
    buttons: [
      { label: 'Vẽ lại', icon: 'replay', cls: 'white', onClick: () => startPicture(pic.id) },
      { label: 'Tranh mới', icon: 'next', cls: 'ok', onClick: () => startPicture(nextId) },
      { label: 'Phòng tranh', icon: 'book', cls: 'gold small', onClick: () => { leavePlay(); galFrom = 'select'; renderGallery(); show('gallery'); } },
    ],
  });
}

/* ---------- test hooks (read-only) ---------- */
function sheet(modeId, size = 300, withArt = false) {
  const mode = modeById(modeId); let d = $('#sheet'); if (d) d.remove(); d = el('div'); d.id = 'sheet'; document.body.appendChild(d);
  const stats = [];
  PICS.forEach(pic => {
    const P = dotsFor(pic, mode.n); let closeIdx = P.findIndex(p => p.z); if (closeIdx < 0) closeIdx = 0;
    const s = size, { fs, r } = dotSize(s, P.length), pad = Math.max(fs * 1.35, s * .065), inner = s - 2 * pad, lw = clamp(s * .021, 6, 15);
    const px = P.map(p => ({ x: pad + p.x / 100 * inner, y: pad + p.y / 100 * inner })), texts = P.map((_, i) => mode.lab(i));
    const L = placeLabels(px, texts, { fs, r: r * 1.38, W: s, H: s, closeIdx, lw: lw / 2 });
    let md = 1e9, ov = 0;
    for (let i = 0; i < px.length; i++) for (let j = i + 1; j < px.length; j++) md = Math.min(md, Math.hypot(px[i].x - px[j].x, px[i].y - px[j].y));
    L.forEach((a, i) => { L.forEach((b, j) => { if (j > i && Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2) ov++; });
      px.forEach((q, j) => { if (Math.abs(q.x - a.x) < a.w / 2 + r && Math.abs(q.y - a.y) < a.h / 2 + r) ov++; }); });
    stats.push({ id: pic.id, n: P.length, minDist: Math.round(md), overlaps: ov });
    const line = px.map(p => `${r1(p.x)},${r1(p.y)}`).join(' ') + ` ${r1(px[closeIdx].x)},${r1(px[closeIdx].y)}`;
    d.insertAdjacentHTML('beforeend', `<figure><svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><rect width="${s}" height="${s}" fill="#fffef8"/>
      ${withArt ? `<svg x="${pad}" y="${pad}" width="${inner}" height="${inner}" viewBox="0 0 100 100" overflow="visible">${artInner(pic, pic.sw[0], false)}</svg>` : ''}
      <polyline points="${line}" fill="none" stroke="${withArt ? '#ff2d55' : '#cfc8ea'}" stroke-width="${withArt ? 1.5 : 3}"/>
      ${px.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${i ? INK : '#22b45a'}" stroke="#fff" stroke-width="${r * .7}"/>`).join('')}
      ${withArt ? '' : L.map((l, i) => `<text x="${l.x}" y="${l.y + fs * .34}" text-anchor="middle" font-family="'Baloo 2',Nunito,Arial,sans-serif" font-weight="800" font-size="${fs}" fill="${INK}" stroke="#fff" stroke-width="${fs * .26}" paint-order="stroke">${texts[i]}</text>`).join('')}
      </svg><figcaption>${pic.id} d${Math.round(md)} ov${ov}</figcaption></figure>`);
  });
  return stats;
}
function liveOverlaps() {
  if (!G) return null; let ov = 0; const R = G.labs.map(b => b.getBoundingClientRect()), D = G.dots.map(d => d.getBoundingClientRect());
  R.forEach((a, i) => { R.forEach((b, j) => { if (j > i && a.left < b.right - 1 && a.right > b.left + 1 && a.top < b.bottom - 1 && a.bottom > b.top + 1) ov++; });
    D.forEach(q => { if (a.left < q.right - 2 && a.right > q.left + 2 && a.top < q.bottom - 2 && a.bottom > q.top + 2) ov++; }); });
  return ov;
}
Object.defineProperty(window, '__dbg', { get: () => ({
  screen, phase: G && G.phase, pic: G && G.pic.id, mode: G && G.mode.id, next: G && G.next, n: G && G.n, wrong: G && G.wrong, color: G && G.color,
  pts: G && LAY ? G.px.map(p => ({ x: LAY.bx + p.x, y: LAY.by + p.y })) : null, hitR: LAY && LAY.hitR,
  board: LAY && { x: LAY.bx, y: LAY.by, s: LAY.s }, sheet, liveOverlaps, picIds: PICS.map(p => p.id) }) });

Kit.music.start(SONG);
})();
</script>
