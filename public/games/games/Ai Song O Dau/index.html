<!DOCTYPE html>
<html lang="vi" data-game="aisong">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3fb867">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ai Sống Ở Đâu</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* ===== BéVui Kit 5 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','Segoe UI Symbol',sans-serif;
  --ink:#33305a; --ink-soft:#6c6896;
  --c1:#4f8cff; --c1d:#2f63d6; --c1l:#e2edff;
  --c2:#ff7a9c; --c2d:#dd4f76;
  --ok:#35c46a; --okd:#1f9a4d;
  --gold:#ffc93c; --goldd:#e19a00;
  --bad:#ff8a65;
  --bg1:#bfe3ff; --bg2:#fff1c9;
  --panel:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:76px;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-play{touch-action:none}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-right{display:flex;gap:10px;align-items:center;margin-left:auto;flex:0 0 auto}
.k-bar .k-extra{display:flex;gap:10px}
.k-bar .k-extra:empty{display:none}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(30,40,90,.16),0 10px 18px rgba(30,40,90,.10);
  transition:transform .12s ease,box-shadow .12s ease,opacity .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(30,40,90,.16),0 4px 8px rgba(30,40,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn .emo{font-size:30px}
.ibtn.off{color:#b4b2cc}
.ibtn .badge,.btn .badge{position:absolute;top:-8px;right:-8px;min-width:25px;height:25px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 15px/25px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.k-back{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(30,40,90,.12)}
.k-back:active{box-shadow:0 1px 0 var(--c1d)}
@media (max-height:500px),(max-width:430px){
  .ibtn{width:50px;height:50px;border-radius:16px}
  .ibtn svg{width:27px;height:27px}
  .k-bar,.k-bar .k-right,.k-bar .k-extra{gap:8px}
  .k-bar{padding-top:calc(8px + var(--safe-t));padding-bottom:6px}
}
/* narrow portrait: middle slot drops to its own row when it has content */
@media (max-width:600px) and (orientation:portrait){
  .k-bar{flex-wrap:wrap;row-gap:8px}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:var(--tap);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(20,30,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(20,30,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.15em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d5d9ee;color:var(--c1d);text-shadow:none}
.btn.purple{--b:#9b6bff;--bd:#7246dc}
.btn.orange{--b:#ff9a3c;--bd:#db7412}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.glow{animation:k-glow 1.3s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(42px,9.5vmin,100px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(20,30,80,.25)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.05}

/* ---- tiles (mode / level pickers) ---- */
.k-tiles{display:grid;gap:clamp(10px,2vmin,18px);width:min(1000px,100%);grid-template-columns:repeat(auto-fit,minmax(min(150px,42vw),1fr))}
.k-tile{--tc:var(--c1);--tcd:var(--c1d);--tcl:var(--c1l);position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:12px 10px 12px;
  box-shadow:0 7px 0 rgba(30,40,90,.14),0 12px 20px rgba(30,40,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:800;color:var(--ink);font-size:clamp(16px,2.6vmin,22px);line-height:1.1;text-align:center;transition:transform .15s;min-height:var(--tap)}
.k-tile:active{transform:translateY(4px) scale(.98)}
.k-tile .ti{font-size:clamp(38px,7vmin,62px);width:1.55em;height:1.55em;display:grid;place-items:center;border-radius:50%;background:var(--tcl)}
.k-tile .ti svg{width:72%;height:72%}
.k-tile small{display:block;font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .st{display:flex;gap:1px;justify-content:center}
.k-tile.sel{background:var(--tc);color:#fff;box-shadow:0 7px 0 var(--tcd),0 0 0 4px #fff}
.k-tile.sel small{color:rgba(255,255,255,.9)}
.k-tile.sel .ti{background:rgba(255,255,255,.3)}
.st{display:inline-flex;gap:1px;justify-content:center;align-items:center}
.k-mini-star{display:inline-block}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e3e2f2;display:block}
.k-mini-star.on svg{color:var(--gold)}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(30,30,80,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px;overflow:auto}
.k-panel{position:relative;width:min(580px,94vw);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(30,40,90,.14),0 30px 60px rgba(30,40,90,.3);animation:k-panel .34s cubic-bezier(.2,1.5,.4,1) both;overscroll-behavior:contain}
.k-panel.wide{width:min(900px,96vw)}
.k-panel h2{margin:0 0 4px;font-size:clamp(28px,6vmin,46px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(54px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars .mid svg{margin-top:-16px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}
.k-result .k-hero{width:clamp(96px,22vmin,140px);margin:-80px auto 0;display:block}
.k-panel.k-result{overflow:visible;margin-top:60px}
@media (max-height:500px){
  .k-panel{padding:16px 18px 16px;border-radius:26px}
  .k-btns{margin-top:12px}
  .k-stars svg{width:52px}
  .k-result .k-hero{width:80px;margin-top:-56px}
  .k-panel.k-result{margin-top:40px}
}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,58px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(30,40,90,.12),0 12px 24px rgba(30,40,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---- speech bubble with replay ---- */
.k-say{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 8px 6px 16px;font-weight:800;color:var(--ink);
  font-size:clamp(17px,2.8vmin,24px);box-shadow:0 5px 0 rgba(30,40,90,.12);line-height:1.1;max-width:100%}
.k-say .ibtn{width:44px;height:44px;border-radius:14px;background:var(--c1l);box-shadow:none}
.k-say .ibtn svg{width:24px;height:24px}

/* ---- tutorial hand ---- */
.k-hand{position:fixed;left:0;top:0;z-index:85;width:74px;height:74px;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.k-hand svg{width:100%;height:100%}

/* ---- decorative ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:50%;height:150%;left:15%;bottom:20%}
.k-cloud::after{width:38%;height:120%;right:14%;bottom:25%}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-panel{0%{transform:scale(.88) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-glow{0%,100%{box-shadow:0 7px 0 var(--bd),0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 7px 0 var(--bd),0 0 0 10px rgba(255,255,255,.55)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-22%) scale(.94,1.08)}75%{transform:translateY(0) scale(1.06,.94)}}
@keyframes k-float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-22px)}}
@keyframes k-drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-wiggle{animation:k-wiggle .5s ease-in-out}
.k-shake{animation:k-shake .45s ease-in-out}
.k-jump{animation:k-jump .6s cubic-bezier(.3,1.4,.5,1)}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3s ease-in-out infinite}
.k-blink{transform-box:fill-box;transform-origin:50% 50%;animation:k-blink 4.4s infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.btn.glow,.k-breathe{animation:none!important}}
</style>
<style>
:root{--c1:#2fb36d;--c1d:#1b8a4f;--c1l:#dcf7e6;--c2:#ff9f43;--c2d:#e07b16;--ink:#2c4636;--ink-soft:#678a74}
body{background:
  radial-gradient(ellipse 80% 50% at 50% 112%,rgba(255,255,255,.75),transparent 70%),
  linear-gradient(170deg,#bdeeff 0%,#dcf8e4 55%,#fff3c4 100%)}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco .k-cloud{animation:k-drift linear infinite}
.deco .lf{position:absolute;bottom:-60px;opacity:.5;animation:leafUp linear infinite;font-family:var(--emoji)}
@keyframes leafUp{0%{transform:translateY(0) rotate(-20deg)}50%{transform:translateY(-55vh) translateX(26px) rotate(25deg)}100%{transform:translateY(-118vh) rotate(-10deg);opacity:0}}
.screen{z-index:1}

/* ---------- turtle mascot ---------- */
.tur{display:block;overflow:visible}
.tur .head{transform-box:view-box;transform-origin:130px 150px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tur .bodyg{transform-box:view-box;transform-origin:130px 246px}
.tur .breathe{animation:k-breathe 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:130px 246px}
.tur .eyes,.turm .eyes{transform-box:view-box;transform-origin:130px 98px;animation:k-blink 4.6s infinite}
.tur .pupils,.turm .pupils{transition:transform .18s ease-out}
.tur .m-open,.tur .brows,.turm .m-open,.turm .brows{opacity:0;transition:opacity .15s}
.tur.happy .m-open,.turm.happy .m-open{opacity:1}.tur.happy .m-smile,.turm.happy .m-smile{opacity:0}
.tur.hmm .brows{opacity:1}.tur.hmm .head{transform:rotate(-9deg)}
.tur .armR{transform-box:view-box;transform-origin:174px 164px;animation:wave 4.2s ease-in-out infinite}
.tur .armL{transform-box:view-box;transform-origin:86px 164px}
.tur .hat{transform-box:view-box;transform-origin:130px 56px}
.tur.happy .hat{animation:hatHop .6s ease-out}
@keyframes wave{0%,58%,100%{transform:rotate(0)}66%{transform:rotate(-16deg)}74%{transform:rotate(8deg)}82%{transform:rotate(-14deg)}90%{transform:rotate(4deg)}}
@keyframes hatHop{0%,100%{transform:none}40%{transform:translateY(-16px) rotate(-6deg)}}
.turm{display:block;width:100%;height:100%;overflow:visible}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.4vmin,14px);padding:calc(var(--bar-h) + 2px) 16px calc(16px + var(--safe-b))}
.t-hero{position:relative;width:clamp(200px,min(64vw,40vh),420px);aspect-ratio:1/1;flex:0 0 auto}
.t-hero .tur{width:100%;height:100%;cursor:pointer}
.orb{position:absolute;width:23%;aspect-ratio:1/1;border-radius:50%;background:#fff;display:grid;place-items:center;border:4px solid var(--oc);
  box-shadow:0 5px 0 rgba(30,80,50,.14);animation:k-bob 3.2s ease-in-out infinite;cursor:pointer}
.orb .emo{font-size:clamp(22px,5.4vmin,48px)}
.t-txt{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vmin,22px)}
.k-logo{--c1d:#167a43}
.k-logo .l1{color:#fff}.k-logo .l2{color:#ffd23f;font-size:1.06em}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:16px}
.t-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#bPlay{font-size:clamp(30px,6vmin,52px)}
@media (min-aspect-ratio:6/5){
  #title{flex-direction:row;gap:6vw}
  .t-hero{width:min(60vh,420px)}
}

/* ---------- select ---------- */
#select{justify-content:center;gap:clamp(8px,2vmin,18px);padding:calc(var(--bar-h) + 6px) 16px calc(14px + var(--safe-b))}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vmin,26px);width:min(1180px,100%)}
.mode{--tc:#2fb36d;--tcd:#1b8a4f;--tcl:#dcf7e6;border:none;cursor:pointer;border-radius:30px;background:#fff;padding:16px 12px 14px;position:relative;
  box-shadow:0 8px 0 rgba(30,80,50,.14),0 14px 24px rgba(30,80,50,.10);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);transition:transform .15s}
.mode:active{transform:translateY(5px)}
.mode .mi{width:clamp(96px,18vmin,190px);height:clamp(96px,18vmin,190px);border-radius:50%;background:var(--tcl);display:grid;place-items:center;position:relative;overflow:hidden}
.mode .mi svg{width:86%;height:86%}
.mode b{font-size:clamp(22px,4vmin,34px);line-height:1;color:var(--tcd)}
.mode small{font-weight:700;color:var(--ink-soft);font-size:clamp(14px,2.3vmin,19px);line-height:1.15;text-align:center}
.mode .mt{display:flex;flex-direction:column;align-items:center;gap:4px}
.mode.m2{--tc:#ff8a3d;--tcd:#d9611b;--tcl:#ffe9d6}
.mode.m3{--tc:#ff6fa5;--tcd:#d9467f;--tcl:#ffe0ec}
@media (max-aspect-ratio:1/1){
  .modes{grid-template-columns:1fr;max-width:520px}
  .mode{flex-direction:row;justify-content:flex-start;text-align:left;padding:12px 16px;gap:16px}
  .mode .mi{width:clamp(78px,21vw,108px);height:clamp(78px,21vw,108px);flex:0 0 auto}
  .mode .mt{align-items:flex-start}
  .mode small{text-align:left}
}
@media (max-height:520px) and (orientation:landscape){
  .mode{padding:10px 8px 10px}
  .mode .mi{width:min(26vh,104px);height:min(26vh,104px)}
}

/* ---------- top-bar progress ---------- */
.pips{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.92);padding:7px 12px;border-radius:999px;box-shadow:0 4px 0 rgba(30,80,50,.12)}
.pips i{width:28px;height:28px;border-radius:50%;background:#e4efe8;display:grid;place-items:center;font-style:normal;font-size:18px;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s;overflow:visible}
.pips i.cur{background:#fff3c9;box-shadow:0 0 0 3px var(--c2);animation:k-pulse 1.2s infinite}
.pips i.ok{background:#ffe27a;transform:scale(1.1)}
.pips i.ok2{background:#c4f0d3}
.pips i .emo{font-size:20px}
.pips i .asv{width:22px;height:22px}
.mcount{font-weight:800;color:var(--c1d);background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 rgba(30,80,50,.12);font-size:clamp(16px,2.6vmin,20px);white-space:nowrap;display:flex;align-items:center;gap:6px}
.mcount .emo{font-size:1.2em}
.hintb{background:#fff7d6!important;padding:2px!important}
.hintb svg.turm{width:46px;height:42px}

/* ---------- map (habitats) ---------- */
.mv{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0}
.map{position:absolute;left:8px;right:8px;top:4px;bottom:calc(8px + var(--safe-b))}
.rg{position:absolute;border-radius:24px;overflow:hidden;border:4px solid #fff;background:var(--bg);cursor:pointer;touch-action:none;
  box-shadow:0 6px 0 rgba(30,70,50,.16),0 10px 20px rgba(30,70,50,.10);transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .2s;-webkit-tap-highlight-color:transparent}
.rg .sc{position:absolute;inset:0;width:100%;height:100%;display:block}
.rg .fog{position:absolute;inset:0;background:rgba(236,244,248,.55);transition:opacity 1s;pointer-events:none;z-index:1}
.rg.alive .fog{opacity:0}
.rg:not(.alive) .sc *{animation-play-state:paused!important}
.rg .ra{position:absolute;inset:0;pointer-events:none;z-index:2}
.rl{position:absolute;z-index:3;display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.93);border-radius:999px;padding:2px 10px 3px 5px;
  font-weight:800;color:var(--rd);font-size:var(--lf,16px);line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.08);white-space:nowrap;pointer-events:none}
.rl .emo{font-size:1.2em}
.rg.hot{transform:scale(1.04);box-shadow:0 0 0 5px var(--rc),0 12px 26px rgba(0,0,0,.22);z-index:4}
.rg.hint{animation:hintGlow 1.1s ease-in-out infinite;z-index:3}
@keyframes hintGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,214,60,0),0 6px 0 rgba(30,70,50,.16)}50%{box-shadow:0 0 0 9px rgba(255,214,60,.95),0 6px 0 rgba(30,70,50,.16)}}
.rg.cheer{animation:rgCheer .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes rgCheer{0%,100%{transform:none}40%{transform:scale(1.05) rotate(-.6deg)}}
.rg.nope{animation:k-shake .45s}
.lv{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:50% 100%;transition:opacity .5s,transform .7s cubic-bezier(.2,1.6,.4,1)}
.l1 .lv1,.l2 .lv2,.l3 .lv3,.l4 .lv4{opacity:1;transform:none}

/* placed animals */
.pa{position:absolute;width:var(--as);height:var(--as);margin:calc(var(--as)/-2) 0 0 calc(var(--as)/-2);display:grid;place-items:center;pointer-events:auto;cursor:pointer;
  transition:left .4s,top .4s}
.pa::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:12%;border-radius:50%;background:rgba(0,0,0,.17);z-index:-1}
.pa .gi{font-size:calc(var(--as)*.8);display:block;animation:paBob 2.8s ease-in-out infinite;animation-delay:var(--dl,0s)}
.pa.in{animation:paIn .55s cubic-bezier(.2,1.6,.4,1)}
.pa.jump .gi{animation:k-jump .6s cubic-bezier(.3,1.4,.5,1)}
.rg[data-h="ocean"] .pa .gi{animation-name:swim;animation-duration:3.4s}
.rg[data-h="ocean"] .pa::after{opacity:.35}
.rg[data-h="arctic"] .pa .gi{animation-name:waddle;animation-duration:2.2s}
@keyframes paBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6%) scale(.98,1.03)}}
@keyframes swim{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(6%,-8%) rotate(4deg)}}
@keyframes waddle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes paIn{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* hub */
.hub{position:absolute;z-index:6;width:var(--hs);height:var(--hs);margin:calc(var(--hs)/-2) 0 0 calc(var(--hs)/-2);pointer-events:none}
.hub::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9) 46%,rgba(255,255,255,0) 70%)}
.hub .disc{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 50% 30%,#ffffff 0,#f2fff6 60%,#d9f5e3 100%);
  box-shadow:0 7px 0 rgba(30,90,60,.18),0 14px 24px rgba(30,90,60,.2),inset 0 -6px 0 rgba(0,0,0,.05)}
.hub .ring{position:absolute;inset:-2%;border-radius:50%;border:4px dashed rgba(47,179,109,.55);animation:spin 22s linear infinite}
.ha{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;cursor:grab;touch-action:none}
.ha .gi{font-size:calc(var(--hs)*.56);display:block;animation:haIdle 2.6s ease-in-out infinite;filter:drop-shadow(0 5px 0 rgba(0,0,0,.1))}
.ha.gone .gi{opacity:0}
.ha.spawn{animation:spawnIn .6s cubic-bezier(.2,1.6,.4,1) both}
.ha.tap .gi{animation:k-jump .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes haIdle{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6%) rotate(3deg)}}
@keyframes spawnIn{0%{transform:scale(.2) translateY(30%);opacity:0}60%{transform:scale(1.2) translateY(-8%);opacity:1}100%{transform:none;opacity:1}}
.hn{position:absolute;left:50%;top:calc(100% - 8px);transform:translateX(-50%);background:var(--c1);color:#fff;font-weight:800;font-size:var(--nf,18px);
  padding:1px 12px 3px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 0 var(--c1d);pointer-events:none;line-height:1.2;z-index:2}
.hn.in{animation:hnIn .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes hnIn{0%{transform:translateX(-50%) scale(.3);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.hb{position:absolute;inset:6%;border-radius:50%;display:grid;place-items:center;z-index:3;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.98) 0 9%,rgba(200,240,255,.55) 22%,rgba(150,215,255,.35) 60%,rgba(120,190,255,.6) 100%);
  border:3px solid rgba(255,255,255,.95);box-shadow:inset -6px -8px 14px rgba(80,160,255,.35),0 6px 14px rgba(40,120,200,.2);animation:bubIn .6s cubic-bezier(.2,1.5,.4,1) both}
.hb .gi{font-size:calc(var(--hs)*.42);filter:brightness(0) opacity(.28)}
@keyframes bubIn{0%{transform:scale(.1)}55%{transform:scale(1.12,.92)}75%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
.hubT{position:absolute;inset:6%;pointer-events:auto;cursor:pointer}

/* drag ghost + reactions */
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;display:grid;place-items:center;will-change:transform}
.ghost .gi{font-size:calc(var(--gs)*.8);display:block;filter:drop-shadow(0 12px 8px rgba(0,0,0,.22))}
.ghost.cold .gi{animation:shiver .09s linear infinite;filter:saturate(.4) brightness(1.18) drop-shadow(0 0 7px #8fdcff)}
.ghost.cold::after{content:"";position:absolute;inset:4%;border-radius:45%;background:radial-gradient(circle,rgba(210,245,255,0) 46%,rgba(200,240,255,.85) 100%);border:3px solid rgba(255,255,255,.8)}
.ghost.hot .gi{animation:wobH .45s ease-in-out infinite;filter:saturate(1.4) drop-shadow(0 0 10px #ff7a3d)}
.ghost.wet .gi{animation:flail .4s ease-in-out infinite}
.ghost.flop .gi{animation:flop .5s ease-in-out infinite}
.ghost.huh .gi{animation:huh 1.1s ease-in-out infinite}
@keyframes shiver{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes wobH{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.92) translateY(4%)}}
@keyframes flail{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-12%) rotate(14deg)}}
@keyframes flop{0%,100%{transform:translateY(0) rotate(-25deg)}50%{transform:translateY(-22%) rotate(20deg)}}
@keyframes huh{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}}
.rbub{position:fixed;z-index:61;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  padding:8px 14px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.12);pointer-events:none;white-space:nowrap;animation:rbIn .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rbIn{0%{transform:translate(-50%,-100%) scale(.3);opacity:0}100%{transform:translate(-50%,-100%) scale(1);opacity:1}}
.rbub::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.rbub .emo{font-size:1.2em;margin-right:4px}

/* asset svg animals */
.asv{display:inline-block;width:1.12em;height:1.12em;vertical-align:middle;overflow:visible}
.gi.svgi{line-height:0}
.gi.svgi .asv{width:1.1em;height:1.1em}

/* ---------- pair games (food / baby) ---------- */
.pv{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;margin:0 auto;max-width:1200px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  padding:4px 12px calc(12px + var(--safe-b));gap:6px}
.pv.land{flex-direction:row;justify-content:center;gap:clamp(20px,5vw,70px)}
.hero{position:relative;width:var(--hw,280px);height:var(--hw,280px);flex:0 0 auto;touch-action:none;cursor:grab}
.hero .hbg{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff 0 50%,var(--hc,#fff2c9) 51% 100%);
  box-shadow:0 10px 0 rgba(30,80,50,.13),0 18px 30px rgba(30,80,50,.12);border:6px solid #fff}
.hero.in{animation:cardIn .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cardIn{from{transform:translateY(40px) scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.hero .hgi{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:calc(var(--hw,280px)*.5);line-height:1;z-index:2}
.hero .hgi .gi{display:block;animation:k-bob 2.6s ease-in-out infinite}
.hero.baby .hgi{top:50%;font-size:calc(var(--hw,280px)*.34)}
.hero.baby .hgi .gi{animation:sadSway 2.2s ease-in-out infinite}
@keyframes sadSway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4%)}}
.hero .plate{position:absolute;left:12%;right:12%;bottom:6%;height:24%;z-index:1}
.hero .nest{position:absolute;left:22%;right:22%;bottom:16%;height:20%;z-index:1}
.think{position:absolute;right:-4%;top:-4%;width:30%;height:30%;border-radius:50%;background:#fff;display:grid;place-items:center;z-index:3;
  font-weight:800;color:var(--c2d);font-size:calc(var(--hw,280px)*.15);box-shadow:0 5px 0 rgba(0,0,0,.08);animation:thinkB 2.4s ease-in-out infinite}
.think::before,.think::after{content:"";position:absolute;background:#fff;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.think::before{width:26%;height:26%;left:-8%;bottom:-6%}
.think::after{width:14%;height:14%;left:-22%;bottom:-22%}
@keyframes thinkB{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero.chomp .hgi .gi{animation:chomp .22s ease-in-out 3}
@keyframes chomp{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.84) translateY(6%)}}
.hero.no .hgi .gi{animation:noShake .5s ease-in-out}
@keyframes noShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
.hero.yay .hgi .gi{animation:k-jump .65s cubic-bezier(.3,1.4,.5,1) 2}
.opts{display:flex;gap:var(--og,14px);justify-content:center;align-items:center;flex:0 0 auto}
.opt{position:relative;width:var(--ow,110px);height:var(--ow,110px);border-radius:28%;background:#fff;border:none;padding:0;cursor:grab;touch-action:none;display:grid;place-items:center;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.05),0 7px 0 rgba(30,80,50,.14),0 12px 20px rgba(30,80,50,.1)}
.opt .gi{font-size:calc(var(--ow,110px)*.6);display:block}
.opt.in{animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both}
.opt.hide .gi{opacity:0}
.opt.no{animation:k-shake .45s}
.opt.no .gi{animation:noShake .5s ease-in-out}
.opt.hug{animation:hug .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes hug{0%,100%{transform:none}30%{transform:scale(1.14) rotate(-4deg)}60%{transform:scale(1.06) rotate(3deg)}}
.opt.glow{box-shadow:0 0 0 6px rgba(255,214,60,.9),0 7px 0 rgba(30,80,50,.14)}
.opt.hot{transform:scale(1.08);box-shadow:0 0 0 5px var(--c1),0 12px 22px rgba(30,80,50,.2)}
.hero.hot .hbg{box-shadow:0 0 0 7px var(--c1),0 18px 30px rgba(30,80,50,.18)}
.opt .kid{position:absolute;right:-6%;bottom:-6%;font-size:calc(var(--ow,110px)*.36);animation:paIn .5s cubic-bezier(.2,1.6,.4,1)}
.pv.land .opts{flex-direction:row;flex-wrap:wrap;max-width:calc(var(--ow) * 3 + var(--og) * 2 + 4px)}
.opt .kid .gi{font-size:inherit}
.opt.dim{opacity:.4;filter:grayscale(.6)}
.pips i .gi{font-size:19px;line-height:1}
@media (max-height:500px) and (orientation:landscape){
  .k-ov .k-panel.card{width:min(700px,94vw);margin-top:0;display:grid;grid-template-columns:auto 1fr;column-gap:20px;row-gap:4px;text-align:left;align-items:center;padding:16px 20px 14px}
  .k-ov .card{--cp:min(176px,58vh)}
  .k-ov .card .cpic{grid-row:1/6;margin:0}
  .k-ov .card h2{margin:0!important}
  .k-ov .card .chab{justify-self:start}
  .k-ov .card .k-btns{justify-content:flex-start;margin-top:6px}
}

/* ---------- world ---------- */
.wempty{position:absolute;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:rgba(255,255,255,.95);border-radius:26px;padding:12px 18px 16px;box-shadow:0 8px 0 rgba(30,80,50,.14);text-align:center;width:min(440px,92vw)}
.wempty p{margin:0;font-weight:800;color:var(--ink);font-size:clamp(17px,3vmin,22px);line-height:1.2}

/* ---------- card (mini encyclopedia) ---------- */
.k-panel.card{overflow:visible;margin-top:70px;padding-top:12px;width:min(520px,94vw)}
.card .cpic{position:relative;width:var(--cp);height:var(--cp);margin:calc(var(--cp)*-.42) auto 6px;border-radius:50%;overflow:hidden;border:6px solid #fff;
  box-shadow:0 8px 0 rgba(0,0,0,.1),0 16px 30px rgba(0,0,0,.18);background:var(--bg)}
.card{--cp:clamp(150px,min(46vw,34vh),240px)}
.card .cpic .sc{position:absolute;inset:0;width:100%;height:100%}
.card .cpic .ci{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:calc(var(--cp)*.5);line-height:1;z-index:2}
.card .cpic .ci .gi{display:block;animation:k-bob 2.6s ease-in-out infinite}
.card h2{color:var(--rd)!important}
.chab{display:inline-flex;align-items:center;gap:6px;background:var(--rl);color:var(--rd);border-radius:999px;padding:4px 16px 5px 10px;font-weight:800;font-size:clamp(16px,2.8vmin,21px)}
.chab .emo{font-size:1.3em}
.cfact{color:var(--ink)!important;font-weight:700!important;font-size:clamp(18px,3.2vmin,24px)!important;line-height:1.3;margin-top:10px!important}
.card .k-btns{margin-top:14px}
.cnew{position:absolute;left:50%;top:calc(var(--cp)*.5);transform:translateX(-50%) rotate(-6deg);background:var(--c2);color:#fff;font-weight:800;border-radius:999px;padding:2px 14px;
  box-shadow:0 4px 0 var(--c2d);font-size:18px;z-index:3;white-space:nowrap}
@media (max-height:500px){.k-panel.card{margin-top:54px}.card .k-btns{margin-top:8px}.cfact{margin-top:4px!important}}

/* ---------- album (Sổ thú) ---------- */
#album{justify-content:flex-start;padding:calc(var(--bar-h) + 4px) 10px calc(10px + var(--safe-b));gap:6px}
.alist{flex:1 1 auto;overflow-y:auto;width:min(1040px,100%);padding:4px 6px 24px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.asec{margin:0 0 14px}
.ash{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--rd);font-size:clamp(18px,3vmin,24px);background:var(--rl);border-radius:18px;padding:4px 14px 5px;margin:0 0 8px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.ash .emo{font-size:1.25em}
.ash small{margin-left:auto;font-size:.8em;opacity:.85}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(88px,14vmin,120px),1fr));gap:10px}
.aw{border:none;cursor:pointer;background:#fff;border-radius:22px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 rgba(30,80,50,.12);color:var(--ink);min-height:100px}
.aw .ab{width:clamp(56px,10vmin,76px);height:clamp(56px,10vmin,76px);border-radius:50%;display:grid;place-items:center;background:var(--rl)}
.aw .gi{font-size:clamp(36px,6.6vmin,52px);display:block}
.aw span.nm{font-weight:800;font-size:clamp(14px,2.2vmin,17px);line-height:1.1;text-align:center}
.aw.no{background:rgba(255,255,255,.55);box-shadow:none}
.aw.no .gi{filter:brightness(0) opacity(.22)}
.aw.no span.nm{color:#a9bdb0}
.aw.jump{animation:k-jump .6s}
.aw.k-shake{animation:k-shake .45s}

@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- scene idle animations ---------- */
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.swt{transform-box:fill-box;transform-origin:50% 0;animation:sway 5.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
.wave{animation:waveX 5s linear infinite}
@keyframes waveX{from{transform:translateX(0)}to{transform:translateX(30px)}}
.bub{animation:bubUp 4.2s ease-in infinite;animation-delay:var(--d,0s)}
@keyframes bubUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.snow{animation:snowF 7s linear infinite;animation-delay:var(--d,0s)}
@keyframes snowF{0%{transform:translate(0,-20px)}100%{transform:translate(16px,210px)}}
.flo{transform-box:fill-box;transform-origin:50% 50%;animation:floB 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes floB{50%{transform:translateY(3px) rotate(1.5deg)}}
.shim{animation:shim 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes shim{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-7px);opacity:.75}}
.fall{animation:fallW .5s linear infinite}
@keyframes fallW{to{stroke-dashoffset:-24}}
.flit{animation:flit 8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes flit{0%,100%{transform:translate(0,0)}25%{transform:translate(34px,-16px)}50%{transform:translate(64px,2px)}75%{transform:translate(26px,12px)}}
.wg{transform-box:fill-box;transform-origin:100% 50%;animation:flap .22s ease-in-out infinite alternate}
.wg2{transform-box:fill-box;transform-origin:0 50%;animation:flap .22s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
.birds{animation:acrossX 16s linear infinite;animation-delay:var(--d,0s)}
.swimx{animation:acrossX 13s linear infinite;animation-delay:var(--d,0s)}
@keyframes acrossX{from{transform:translateX(-70px)}to{transform:translateX(320px)}}
.roll{transform-box:fill-box;transform-origin:50% 50%;animation:rollX 10s linear infinite}
@keyframes rollX{from{transform:translateX(-60px) rotate(0)}to{transform:translateX(300px) rotate(900deg)}}
.tw{animation:twk 2.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes twk{0%,100%{opacity:.15}50%{opacity:1}}

<script>/* ===== BéVui Kit 5 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';

  const inRect = (x, y, r, pad = 0) => x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  /* ---------- storage (never throws) ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { try { localStorage.removeItem(ns + k); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio core ---------- */
  const MUSIC_VOL = 0.22;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }

      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden && unlocked) ctx.resume().catch(() => { });

  }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    const c = audio(); if (!c) return;
    try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
    if (c.state === 'suspended') c.resume().catch(() => { });
    if (music._want) music.start(music._want);
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { speech.stop(); if (ctx) ctx.suspend().catch(() => { }); }

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    src.connect(f); f.connect(g);
    if (o.pan != null && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); p.connect(bus); } else g.connect(bus);

  function bell(f, t = 0, vol = 0.2, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 2, t, vol: vol * 0.22, dur: dur * 0.5, bus });

  const sfx = {
    tap() { tone({ f: 680, to: 940, dur: 0.06, vol: 0.11, type: 'triangle' }); },

    boing() { tone({ f: 170, to: 540, slide: 0.12, dur: 0.3, vol: 0.17 }); },

    coin() { tone({ f: 988, dur: 0.07, vol: 0.09, type: 'square', lp: 4000 }); tone({ f: 1319, t: 0.07, dur: 0.3, vol: 0.09, type: 'square', lp: 4000 }); },
    tick() { tone({ f: 1800, dur: 0.02, vol: 0.05 }); },
    sparkle() { for (let i = 0; i < 5; i++) bell(1800 + Math.random() * 2200, i * 0.045, 0.04, 0.25); },
    clap() { noise({ f: 1500, q: 0.9, dur: 0.07, vol: 0.32 }); noise({ t: 0.012, f: 2200, q: 1.2, dur: 0.05, vol: 0.18 }); },
    drum(i = 0) { drum(120 + i * 25); },
    kick() { tone({ f: 160, to: 55, slide: 0.1, dur: 0.16, vol: 0.45 }); noise({ f: 1200, q: 0.8, dur: 0.04, vol: 0.18 }); },
    cheer(dur = 1.4) { noise({ f: 1100, q: 0.5, a: 0.15, hold: dur * 0.5, dur: dur * 0.6, vol: 0.12 }); noise({ f: 2600, q: 0.7, a: 0.2, hold: dur * 0.4, dur: dur * 0.5, vol: 0.05 });
      for (let i = 0; i < 6; i++) tone({ f: rand(500, 900), to: rand(900, 1400), t: rand(0.05, dur * 0.6), dur: 0.25, vol: 0.02, type: 'triangle' }); },

  /* ---------- background music (tiny 8th-note sequencer) ---------- */
  const songs = {
    happy: { bpm: 116, swing: 0.08, inst: 'marimba', bars: [
      { r: 48, c: [60, 64, 67], m: [72, 0, 74, 76, 0, 79, 0, 76] }, { r: 43, c: [59, 62, 67], m: [74, 0, 71, 0, 67, 0, 71, 74] },

      { r: 48, c: [60, 64, 67], m: [76, 0, 79, 0, 84, 0, 79, 0] }, { r: 50, c: [57, 62, 65], m: [77, 0, 74, 0, 81, 0, 77, 0] },

    gentle: { bpm: 92, swing: 0.05, inst: 'musicbox', bars: [
      { r: 43, c: [55, 59, 62], m: [79, 0, 0, 83, 86, 0, 83, 0] }, { r: 50, c: [54, 57, 62], m: [81, 0, 0, 78, 74, 0, 0, 0] },

const Amb = (() => {
  let bus = null, timer = 0, lv = {}, nx = {};
  function ensure() {
    if (bus) return bus;
    if (!Kit.unlocked) return null;
    const c = Kit.audio(); if (!c || !Kit.sfxBus) return null;
    try { bus = c.createGain(); bus.gain.value = 1; bus.connect(Kit.sfxBus); } catch (e) { bus = null; }
    return bus;
  }
  function tick() {
    if (document.hidden || !Kit.settings.sound || !Kit.unlocked) return;
    const b = ensure(), c = Kit.ctx; if (!b || !c || c.state !== 'running') return;
    const now = performance.now(), duck = Kit.speaking() ? .35 : 1;
    for (const h in lv) {
      const L = lv[h]; if (!L) continue;
      if (!nx[h]) { nx[h] = now + rand(200, 2200); continue; }
      if (now < nx[h]) continue;
      try { AMBS[h](Math.min(1.1, .45 + L * .16) * duck, b); } catch (e) { }
      nx[h] = now + HAB[h].per / (.7 + L * .4) * rand(.65, 1.4);
    }
  }
  return {
    set(o) { lv = Object.assign({}, o); Object.keys(nx).forEach(h => { if (!lv[h]) delete nx[h]; }); },
    start() { if (!timer) timer = setInterval(tick, 200); },
    stop() { clearInterval(timer); timer = 0; lv = {}; nx = {}; },
    sig(h, k = 1.4) { if (!Kit.settings.sound) return; const b = ensure(); if (b) try { AMBS[h](k, b); } catch (e) { } },
    get levels() { return Object.assign({}, lv); },
  };
})();

  d._s = size; d._k = 1;

function placeGhost(d, x, y, rot = 0, k = 1) { d._x = x; d._y = y; d._k = k; d.style.transform = `translate(${x - d._s / 2}px,${y - d._s / 2}px) rotate(${rot}deg) scale(${k})`; }

function killGhosts() { ghosts.forEach(g => g.remove()); ghosts.clear(); $$('.rbub').forEach(b => b.remove()); }
function flyGhost(d, x, y, o, done) {
  const x0 = d._x, y0 = d._y, s = d._s, k0 = d._k || 1, k1 = o.k == null ? 1 : o.k;
  const TT = (px, py, k, r = 0) => `translate(${px - s / 2}px,${py - s / 2}px) rotate(${r}deg) scale(${k})`;
  const mx = (x0 + x) / 2, my = Math.min(y0, y) - (o.arc == null ? 60 : o.arc);
  let an;
  try {
    an = d.animate([{ transform: TT(x0, y0, k0) }, { transform: TT(mx, my, Math.max(k0, k1) * 1.08, o.spin || 0), offset: .5 }, { transform: TT(x, y, k1) }],
      { duration: o.ms || 500, easing: 'cubic-bezier(.45,.1,.4,1)', fill: 'forwards' });
  } catch (e) { an = null; }
  const fin = () => { placeGhost(d, x, y, 0, k1); try { an && an.cancel(); } catch (e) { } done && done(); };
  if (an) an.onfinish = fin; else setTimeout(fin, 0);
  return an;
}
/* speak a list; fn() runs when finished, interrupted or after max ms (never stalls), but not before min ms */
function sayChain(items, fn, o = {}) {
  const tok = S.tok, t0 = performance.now(); let done = false, i = 0;
  const fire = () => {
    if (done) return; done = true; clearTimeout(mx);
    const w = Math.max(0, (o.min || 0) - (performance.now() - t0));
    setTimeout(() => { if (tok === S.tok) fn(); }, w);
  };
  const mx = setTimeout(fire, o.max || 12000);
  const step = () => {
    if (done || tok !== S.tok) return;
    if (i >= items.length) return fire();
    Kit.say(items[i++], { rate: o.rate, silentMs: 0, onend: r => { if (r && r.cancelled) return fire(); setTimeout(step, o.gap == null ? 160 : o.gap); } });
  };
  step();
}

  const r = m.host.getBoundingClientRect(); if (!r.width || !r.height) return;
  const W = r.width, H = r.height, land = W / H > 1.1;
  const cols = land ? 3 : 2, rows = land ? 2 : 3;
  const gap = clamp(Math.min(W, H) * .02, 6, 14);
  const cw = (W - gap * (cols - 1)) / cols, ch = (H - gap * (rows - 1)) / rows, mn = Math.min(cw, ch);

  const st = m.host.style;
  st.setProperty('--hs', m.hs + 'px'); st.setProperty('--as', m.as + 'px');
  st.setProperty('--lf', clamp(mn * .095, 14, 22) + 'px'); st.setProperty('--nf', clamp(m.hs * .16, 15, 26) + 'px');
  m.hub.style.left = hx + 'px'; m.hub.style.top = hy + 'px';
  HABS.forEach((h, i) => {
    const R = m.reg[h.id], c = i % cols, rr = Math.floor(i / cols);
    const x = c * (cw + gap), y = rr * (ch + gap);
    Object.assign(R.el.style, { left: x + 'px', top: y + 'px', width: cw + 'px', height: ch + 'px' });
    R.x = x; R.y = y; R.w = cw - 8; R.h = ch - 8;
    const top = y + ch / 2 <= hy + 1, left = x + cw / 2 <= hx + 1;
    const ls = R.rl.style; ls.top = ls.bottom = ls.left = ls.right = '';

    if (left) ls.left = '5px'; else ls.right = '5px';
    R.lt = top; R.ll = left;

}
function computeSpots(m, R, hcx, hcy) {

    const okSet = new Set([bare(q.f), ...q.ok.map(bare)]);
    const pool = shuffle([...new Set(FOODS.map(x => x.f))].filter(f => !okSet.has(bare(f))));
    opts = shuffle([q.f, pool[0], pool[1]]);
    S.ans = opts.indexOf(q.f);
  } else {
    const others = shuffle(BABIES.filter(x => x.id !== q.id && x.m !== q.m)).slice(0, 2).map(x => x.m);
    opts = shuffle([q.m, ...others]); S.ans = opts.indexOf(q.m);
  }
  S.opts = opts;
  const box = $('#opts'); box.innerHTML = '';
  opts.forEach((g, i) => {
    const b = el('div', 'opt', glyph(g)); b.dataset.i = i;
    b.setAttribute('role', 'button'); b.setAttribute('aria-label', food ? 'Đồ ăn' : 'Thú mẹ');
    b.style.animationDelay = (i * 90) + 'ms';
    box.appendChild(b); Kit.restart(b, 'in'); bindOpt(b, i);
  });
  layoutPair();
  setTimeout(() => {
    if (tok !== S.tok) return;
    if (food) playEmoCall(q.a); else if (q.b.startsWith('svg:')) Kit.sfx.squeak(); else playEmoCall(q.b);
    const qt = questionText(q);
    if (first) sayChain([food ? 'Bé kéo đồ ăn cho bạn thú nhé!' : 'Bé giúp thú con tìm mẹ nhé!', qt], () => { }); else Kit.say(qt);
    if (first && (rounds[S.mode] || 0) < 2) setTimeout(() => { if (tok === S.tok && S.ready && !S.busy && S.idx === 0) pairHand(); }, 1700);
  }, 450);
  armIdle();
}
const questionText = q => S.mode === 'food' ? `${Cap(q.n)} thích ăn gì nhỉ?` : `Mẹ của ${q.bn} đâu nhỉ?`;
function tapHero() {
  if (!S.ready || S.busy) return;
  const q = S.cur, hero = $('#hero');
  Kit.restart(hero, 'yay'); setTimeout(() => hero.classList.remove('yay'), 700);
  if (S.mode === 'food') playEmoCall(q.a); else Kit.sfx.squeak();
  Kit.say(questionText(q)); armIdle();
}
function pairHand() {
  const ob = $$('#opts .opt')[S.ans]; if (!ob) return;
  const a = Kit.center(ob), h = Kit.center($('#heroI'));
  if (S.mode === 'food') Kit.hand.drag(a.x, a.y, h.x, h.y, { times: 2 }); else Kit.hand.drag(h.x, h.y, a.x, a.y, { times: 2 });
}
const overHero = (x, y) => { const c = Kit.center($('#hero')); return Math.hypot(x - c.x, y - c.y) < c.r.width * .56; };
function optAt(x, y) { return $$('#opts .opt').findIndex(o => !o.classList.contains('dim') && Kit.inRect(x, y, o.getBoundingClientRect(), 10)); }
const heroGhostSize = () => parseFloat(getComputedStyle($('#heroI')).fontSize) / .8;
function bindOpt(b, i) {
  let moved = false, g = null;
  Kit.drag(b, {
    can: () => S.ready && !S.busy && Kit.screen === 'pair' && !b.classList.contains('dim'),
    start() { moved = false; Kit.hand.hide(); clearTimeout(S.idleT); },
    move(e, inf) {
      if (!moved && Math.hypot(inf.dx, inf.dy) < 8) return;
      if (!moved) {
        if (!S.ready || S.busy) return;
        moved = true; const c = Kit.center(b);
        g = makeGhost(S.opts[i], c.x, c.y, b.offsetWidth * .75); b.classList.add('hide'); Kit.sfx.pick();
      }
      if (!g) return;
      placeGhost(g, e.clientX, e.clientY, clamp(inf.vx * 10, -18, 18), 1.1);
      $('#hero').classList.toggle('hot', overHero(e.clientX, e.clientY));
    },
    end(e, inf) {
      $('#hero').classList.remove('hot');
      if (!moved) { if (!inf.cancel) pairAnswer(i, null, 'tap'); return; }
      moved = false; const gg = g; g = null; if (!gg) return;
      if (!inf.cancel && overHero(e.clientX, e.clientY) && S.ready && !S.busy) pairAnswer(i, gg, 'opt');
      else { Kit.sfx.swish(); const c = Kit.center(b), tok = S.tok; flyGhost(gg, c.x, c.y, { ms: 320, arc: 20 }, () => { dropGhost(gg); if (tok === S.tok) b.classList.remove('hide'); armIdle(); }); }
    }
  });
}
(function bindHero() {
  const hero = $('#hero'); let moved = false, g = null;
  Kit.drag(hero, {
    can: () => S.ready && !S.busy && Kit.screen === 'pair',
    start() { moved = false; Kit.hand.hide(); clearTimeout(S.idleT); },
    move(e, inf) {
      if (!moved && Math.hypot(inf.dx, inf.dy) < 8) return;
      if (!moved) {
        if (!S.ready || S.busy) return;
        moved = true; const c = Kit.center($('#heroI .gi')), q = S.cur;
        g = makeGhost(S.mode === 'food' ? q.a : q.b, c.x, c.y, heroGhostSize()); $('#heroI').style.visibility = 'hidden'; Kit.sfx.pick();
      }
      if (!g) return;
      placeGhost(g, e.clientX, e.clientY, clamp(inf.vx * 10, -18, 18), 1.06);
      const k = optAt(e.clientX, e.clientY);
      $$('#opts .opt').forEach((o, j) => o.classList.toggle('hot', j === k));
    },
    end(e, inf) {
      $$('#opts .opt').forEach(o => o.classList.remove('hot'));
      if (!moved) { if (!inf.cancel) tapHero(); return; }
      moved = false; const gg = g; g = null; if (!gg) return;
      const k = inf.cancel ? -1 : optAt(e.clientX, e.clientY);
      if (k >= 0 && S.ready && !S.busy) pairAnswer(k, gg, 'hero');
      else { Kit.sfx.swish(); const c = Kit.center($('#heroI')), tok = S.tok; flyGhost(gg, c.x, c.y, { ms: 320, arc: 20 }, () => { dropGhost(gg); if (tok === S.tok) $('#heroI').style.visibility = ''; armIdle(); }); }
    }
  });
})();
function pairAnswer(i, g, from) {
  if (!S.ready || S.busy) return;
  const q = S.cur, tok = S.tok, food = S.mode === 'food', ok = i === S.ans;
  const ob = $$('#opts .opt')[i], hI = $('#heroI');
  if (!ob || ob.classList.contains('dim')) { if (g) { dropGhost(g); hI.style.visibility = ''; } return; }
  S.busy = true; S.ready = false; clearTimeout(S.idleT); Kit.hand.hide();
  $$('#opts .opt').forEach(o => o.classList.remove('glow', 'hot'));
  let mover = g;
  if (food && from !== 'opt') {
    if (g) { dropGhost(g); hI.style.visibility = ''; }
    const c = Kit.center(ob); mover = makeGhost(S.opts[i], c.x, c.y, ob.offsetWidth * .75); ob.classList.add('hide'); Kit.sfx.whoosh();
  }
  if (!food && from !== 'hero') {
    if (g) { dropGhost(g); ob.classList.remove('hide'); }
    const c = Kit.center($('#heroI .gi')); mover = makeGhost(q.b, c.x, c.y, heroGhostSize()); hI.style.visibility = 'hidden'; Kit.sfx.whoosh();
  }
  if (food) foodResolve(ok, ob, mover, tok); else babyResolve(ok, ob, mover, tok);
}
function wrongDone(ob, tok) {
  if (tok !== S.tok) return;
  ob.classList.add('dim');
  S.busy = false; S.ready = true;
  if (S.wrong >= 2) { const c = $$('#opts .opt')[S.ans]; if (c) c.classList.add('glow'); pairHand(); }
  armIdle();
}
function foodResolve(ok, ob, g, tok) {
  const q = S.cur, hero = $('#hero'), hc = Kit.center($('#heroI .gi'));
  const mx = hc.x, my = hc.y + hc.r.height * .2;
  flyGhost(g, mx, my, { ms: 460, arc: 50, k: ok ? .9 : 1 }, () => {
    if (tok !== S.tok) { dropGhost(g); return; }
    if (ok) {
      if (S.first[S.idx] == null) S.first[S.idx] = S.wrong === 0;
      try { g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'forwards' }).onfinish = () => dropGhost(g); } catch (e) { dropGhost(g); }
      $('#think').classList.add('hidden');
      Kit.restart(hero, 'chomp'); chompSnd();
      Kit.floatText(mx, my - hc.r.height * .55, 'Măm măm!', { size: 32, stroke: '#d9611b' });
      let n = 0; const crumbs = setInterval(() => { if (n++ > 3 || tok !== S.tok) return clearInterval(crumbs); Kit.dust(mx, my, { n: 5, colors: ['#ffd27a', '#ffb13d', '#fff1c9'] }); }, 150);
      setTimeout(() => {
        if (tok !== S.tok) return;
        hero.classList.remove('chomp'); Kit.restart(hero, 'yay'); playEmoCall(q.a); Kit.sfx.good(); Kit.vibrate(20);
        Kit.burst(hc.x, hc.y - hc.r.height * .3, { n: 12, shape: 'heart', colors: ['#ff5d8f', '#ff8fb3', '#ffc2d6'] });
        Kit.praise(pick(Kit.PRAISE), { speak: false, top: '22%' });
        renderPips();
        sayChain([`${Cap(q.n)} thích ăn ${q.fn}!`], nextPair, { min: 1800 });
      }, 720);
    } else {
      S.wrong++;
      Kit.restart(hero, 'no'); Kit.sfx.bad();
      bubbleAt(hc.x, hc.y - hc.r.height * .55, '🙅', 'Không phải món này!', 1300);
      Kit.say(`${Cap(q.n)} không ăn cái này đâu!`);
      setTimeout(() => {
        if (tok !== S.tok) return;
        const c = Kit.center(ob);
        flyGhost(g, c.x, c.y, { ms: 380, arc: 40 }, () => { dropGhost(g); if (tok !== S.tok) return; ob.classList.remove('hide'); Kit.restart(ob, 'no'); wrongDone(ob, tok); });
      }, 950);
    }
  });
}
function babyResolve(ok, ob, g, tok) {
  const q = S.cur, mc = Kit.center(ob), ow = ob.offsetWidth;
  const tx = mc.x + ow * .3, ty = mc.y + ow * .28;
  flyGhost(g, tx, ty, { ms: 540, arc: 70, k: ok ? (ow * .36) / (g._s * .8) : .8 }, () => {
    if (tok !== S.tok) { dropGhost(g); return; }
    if (ok) {
      if (S.first[S.idx] == null) S.first[S.idx] = S.wrong === 0;
      dropGhost(g);
      ob.insertAdjacentHTML('beforeend', `<span class="kid">${glyph(q.b)}</span>`);
      $('#think').classList.add('hidden');
      Kit.restart(ob, 'hug'); Kit.sfx.good(); playEmoCall(q.m); Kit.vibrate(20);
      Kit.burst(mc.x, mc.y - ow * .3, { n: 14, shape: 'heart', colors: ['#ff5d8f', '#ff8fb3', '#ffc2d6', '#ff3d7f'], up: 3 });
      Kit.praise(pick(Kit.PRAISE), { speak: false, top: '22%' });
      renderPips();
      Kit.toast('💕 ' + q.f, 3600);
      sayChain([`${Cap(q.bn)} là con của ${q.mn}!`, q.f], nextPair, { min: 2600 });
    } else {
      S.wrong++;
      Kit.restart(ob, 'no'); Kit.sfx.bad();
      bubbleAt(mc.x, mc.y - ow * .55, '🙅', 'Không phải con mình!', 1300);
      Kit.say(`Đây không phải mẹ của ${q.bn} rồi!`);
      setTimeout(() => {
        if (tok !== S.tok) return;
        const c = Kit.center($('#heroI'));
        flyGhost(g, c.x, c.y, { ms: 420, arc: 50, k: 1 }, () => { dropGhost(g); if (tok !== S.tok) return; $('#heroI').style.visibility = ''; wrongDone(ob, tok); });
      }, 950);
    }
  });
}
function nextPair() {
  S.idx++;
  if (S.idx >= S.list.length) return endPair();
  renderPips(); showPair(false);
}
function endPair() {
  const tok = S.tok, mode = S.mode; S.busy = true; S.ready = false;
  const r = endStars(mode);
  renderPips();
  Kit.restart($('#hero'), 'yay'); Kit.sfx.fanfare();
  setTimeout(() => { if (tok === S.tok) showResult(mode, r); }, 900);
}
Kit.onScreen('pair', { leave() { Kit.hand.hide(); } });

/* ================= mini encyclopedia card ================= */
function openCard(a) {
  const h = HAB[a.h]; Kit.hand.hide();
  const m = Kit.overlay(`<div class="cpic l1 l2 l3 l4">${SCENES[h.id]()}<span class="ci">${glyph(a.g)}</span></div>
    <h2>${Cap(a.n)}</h2><div class="chab"><span class="emo">${h.e}</span>Sống ở ${h.say}</div><p class="cfact">${a.f}</p><div class="k-btns"></div>`,
    { closable: true, cls: 'card', onClose: () => Kit.stopSpeech() });
  const p = m.panel;
  p.style.setProperty('--rd', h.d); p.style.setProperty('--rl', h.l); p.style.setProperty('--bg', h.bg);
  const speak = () => { playCall(a); const ci = $('.ci', p); if (ci) ci.animate([{ transform: 'translate(-50%,-50%)' }, { transform: 'translate(-50%,-62%) scale(1.1)' }, { transform: 'translate(-50%,-50%)' }], { duration: 450 }); setTimeout(() => { if (p.isConnected) Kit.say(`${Cap(a.n)}. ${a.f}`); }, 500); };
  const b = el('button', 'btn small', Kit.voiceAvailable() ? Kit.icon('speak') + '<span>Nghe lại</span>' : '<span class="emo">🎵</span><span>Tiếng kêu</span>');
  b.onclick = speak; $('.k-btns', p).appendChild(b);
  speak();
  return m;
}

/* ================= album: Sổ thú ================= */
function renderAlbum() {
  const box = $('#alist'); box.innerHTML = '';
  HABS.forEach(h => {
    const list = ANIMALS.filter(a => a.h === h.id), got = list.filter(a => col.has(a.id)).length;
    const sec = el('div', 'asec');
    sec.style.setProperty('--rd', h.d); sec.style.setProperty('--rl', h.l);
    sec.innerHTML = `<div class="ash"><span class="emo">${h.e}</span>${h.n}<small>${got}/${list.length}</small></div><div class="agrid"></div>`;
    const g = $('.agrid', sec);
    list.forEach(a => {
      const on = col.has(a.id);
      const b = el('button', 'aw' + (on ? '' : ' no'), `<span class="ab">${glyph(a.g)}</span><span class="nm">${on ? Cap(a.n) : '?'}</span>`);
      b.setAttribute('aria-label', on ? a.n : 'Chưa tìm thấy');
      b.onclick = () => {
        if (on) { Kit.restart(b, 'jump'); openCard(a); return; }
        Kit.sfx.boing(); Kit.restart(b, 'k-shake');
        Kit.toast(`Chơi “Ai sống ở đâu?” để gặp bạn này nhé!`);
        Kit.say(`Bạn này đang trốn ở ${h.say}!`);
      };
      g.appendChild(b);
    });
    box.appendChild(sec);
  });
  box.scrollTop = 0;
  Kit.bar.setMid(`<span class="mcount"><span class="emo">🐾</span>${col.size}/${ANIMALS.length}</span>`);
}
Kit.onScreen('album', { enter() { renderAlbum(); Kit.music.start('cozy'); Kit.say(col.size ? `Bé đã có ${col.size} bạn thú!` : 'Sổ thú còn trống. Bé chơi để tìm các bạn nhé!'); } });

/* ================= world: Thế giới ================= */
function goWorld() { S.tok++; S.busy = false; S.ready = false; killGhosts(); Kit.stopSpeech(); Kit.hand.hide(); clearTimeout(S.idleT); Kit.go('world'); }
Kit.onScreen('world', {
  enter() {
    Kit.music.start('gentle');
    clearMap(WM); WM.active = true;
    layoutMap(WM);
    ANIMALS.filter(a => col.has(a.id)).forEach(a => addPlaced(WM, a, false));
    Amb.set(levelsOf(WM)); Amb.start();
    Kit.bar.setMid(`<span class="mcount"><span class="emo">🌍</span>${col.size}/${ANIMALS.length}</span>`);
    $$('.wempty').forEach(x => x.remove());
    if (!col.size) {
      const w = el('div', 'wempty', `<p>Chưa có bạn thú nào về nhà. Bé đưa các bạn về nhé!</p>`);
      const b = el('button', 'btn ok', Kit.icon('play') + '<span>Chơi</span>'); b.onclick = () => startHab();
      w.appendChild(b); $('#world').appendChild(w);
    }
    Kit.say(col.size ? 'Thế giới của bé đây! Chạm vào các bạn thú nhé.' : 'Chưa có bạn thú nào. Bé chơi để đưa các bạn về nhà nhé!');
  },
  leave() { WM.active = false; Amb.stop(); $$('.wempty').forEach(x => x.remove()); }
});
HABS.forEach(h => WM.reg[h.id].el.addEventListener('click', () => { if (Kit.screen === 'world') pokeRegion(WM, h.id); }));
WM.ha.addEventListener('click', () => {
  const t = $('svg', WM.ha); t.classList.add('happy'); setTimeout(() => t.classList.remove('happy'), 1200);
  WM.ha.animate([{ transform: 'none' }, { transform: 'translateY(-14%) scale(1.06)' }, { transform: 'none' }], { duration: 500, easing: 'ease-out' });
  Kit.sfx.yay(); Kit.say(col.size ? `Bé đã đưa ${col.size} bạn thú về nhà rồi!` : 'Chào bé! Mình là Rùa Tí.');
});
Kit.follow($('.pupils', WM.ha), { r: 5, ref: $('.eyes', WM.ha) });

/* ================= title & select ================= */
function buildDeco() {
  const d = $('#deco');
  [[8, 9, 46], [62, 17, 70], [30, 4, 58]].forEach(([top, w, dur], i) => {
    const c = el('div', 'k-cloud'); c.style.cssText = `top:${top}%;width:${w * 9}px;height:${w * 3}px;animation-duration:${dur}s;animation-delay:${-i * 17}s`; d.appendChild(c);
  });
  for (let i = 0; i < 9; i++) {
    const s = el('span', 'lf', pick(['🍃', '🌿', '🍂', '🌸', '🦋']));
    s.style.left = rand(2, 96) + '%'; s.style.fontSize = rand(18, 36) + 'px';
    s.style.animationDuration = rand(14, 24) + 's'; s.style.animationDelay = -rand(0, 24) + 's';
    d.appendChild(s);
  }
}
let titleTimer = 0;
function buildTitle() {
  const h = $('#tHero'); h.innerHTML = turtleSVG('tt');
  const tt = $('#tt');
  Kit.follow($('.pupils', tt), { r: 5, ref: $('.eyes', tt) });
  const orbs = [['canhcut', -6, 0], ['lacda', 79, -2], ['caheo', -15, 40], ['khi', 91, 36], ['cao', -4, 76], ['bo', 82, 74]];
  orbs.forEach(([id, x, y], i) => {
    const a = ANI[id], o = el('div', 'orb', glyph(a.g));
    o.style.left = x + '%'; o.style.top = y + '%'; o.style.setProperty('--oc', HAB[a.h].c); o.style.animationDelay = (-i * .55) + 's';
    o.addEventListener('pointerdown', e => {
      e.stopPropagation();
      o.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25) rotate(-10deg)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'ease-out' });
      playCall(a); Kit.say(`${Cap(a.n)} sống ở ${HAB[a.h].say}.`);
    });
    h.appendChild(o);
  });
  tt.addEventListener('pointerdown', () => { moodT(tt, 'happy', 900); Amb.sig(pick(HABS).id, 1.2); Kit.say('Chào bé! Mình là Rùa Tí, nhà thám hiểm nhí!'); });
}
function updBadge() { const b = $('#albumN'); b.textContent = col.size; b.classList.toggle('hidden', !col.size); }
Kit.onScreen('title', {
  enter() {
    Kit.music.start('adventure'); updBadge();
    clearInterval(titleTimer);
    titleTimer = setInterval(() => { if (Kit.screen === 'title' && !document.hidden) moodT($('#tt'), 'happy', 700); }, 7000);
  },
  leave() { clearInterval(titleTimer); }
});
function renderModes() {
  const box = $('#modes'); box.innerHTML = '';
  MODES.forEach(m => {
    const b = el('button', 'mode ' + m.cls);
    b.innerHTML = `<div class="mi">${modeIcon(m.id)}</div><div class="mt"><b>${m.name}</b><small>${m.desc}</small>${Kit.starRow(best[m.id] || 0)}</div>`;
    b.onclick = () => startMode(m.id);
    box.appendChild(b);
  });
}
Kit.onScreen('select', { enter() { renderModes(); Kit.music.start('adventure'); } });

/* ================= layout & boot ================= */
Kit.onResize(() => {
  if (Kit.screen === 'play') layoutMap(PM);
  else if (Kit.screen === 'world') layoutMap(WM);
  else if (Kit.screen === 'pair') layoutPair();
});
window.GAME_DEBUG = {
  S, ANIMALS, HABS, FOODS, BABIES, col, PM, WM, Amb,
  get cur() { return S.cur; },
  wrongHab() { const a = S.cur; return shuffle(HABS.map(h => h.id).filter(h => h !== a.h))[0]; },
  dropPoint: (h, world) => dropPoint(world ? WM : PM, h),
  hubPoint: () => { const c = Kit.center(PM.ha); return { x: c.x, y: c.y }; },
  tapPoint: (h, world) => { const c = Kit.center((world ? WM : PM).reg[h].rl); return { x: c.x, y: c.y }; },
  pt: sel => { const e = document.querySelector(sel); if (!e) return null; const c = Kit.center(e); return { x: c.x, y: c.y }; },
  get ans() { return S.ans; },
};
buildDeco();
buildTitle();
$('#bPlay').addEventListener('click', () => Kit.go('select'));
$('#bWorld').addEventListener('click', () => goWorld());
$('#bAlbum').addEventListener('click', () => Kit.go('album'));
Kit.go('title');
</script>
