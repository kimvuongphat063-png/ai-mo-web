<!DOCTYPE html>
<html lang="vi" data-game="icecream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff7ea6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tiệm Kem Của Bé</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
/* ===== Tiệm Kem Của Bé ===== */
:root{--c1:#ff6f9f;--c1d:#e0477c;--c2:#35c4ae;--c2d:#1f9c88;--ink:#5b3550;--ink-soft:#91708a;--aw:66px;--tc:clamp(64px,13vh,130px)}
@media (max-height:500px),(max-width:430px){:root{--aw:60px}}
body{background:#fff1e5}
.ibtn{color:var(--c1d)}
.logo{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(140,30,70,.25)}
.logo .l2{color:#ffe27a}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.coin{width:1.4em;height:1.4em;flex:0 0 auto;display:inline-block;vertical-align:middle}

/* ---------- shop backdrop ---------- */
#shop{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#shop .wall{position:absolute;inset:0;background:
  radial-gradient(circle,rgba(255,255,255,.85) 0 2.5px,transparent 3px) 22px 22px/44px 44px,
  repeating-linear-gradient(90deg,#fff5ea 0 44px,#ffeaf1 44px 88px)}
#shop .wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(255,200,215,.35))}
#awning{position:absolute;z-index:2;left:0;top:0;width:100%;height:calc(var(--aw) + var(--safe-t) + 26px);pointer-events:none}
#awning svg{display:block}
#decoL{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.deco{position:absolute;pointer-events:none}
.deco svg{width:100%;height:100%;display:block;overflow:visible}
.tcounter{position:absolute;z-index:2;left:0;right:0;bottom:0;height:calc(var(--tc) + var(--safe-b));pointer-events:none}
.tcounter .ctop{position:absolute;left:-12px;right:-12px;top:0;height:20px;border-radius:10px;background:linear-gradient(#fde3c2,#f2c48f);box-shadow:0 5px 0 #dba066,0 10px 14px rgba(140,70,30,.18)}
.tcounter .cfront{position:absolute;left:0;right:0;top:20px;bottom:0;background:linear-gradient(#ffb7cc,#ff9ebc)}
.tcounter .cfront::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:#e8799e}
.tcounter .glass{position:absolute;left:2%;right:2%;top:7px;bottom:14px;border-radius:14px;background:linear-gradient(180deg,#eefcff,#c9eef6);box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),inset 0 -8px 12px rgba(80,170,190,.22);display:flex;align-items:flex-end;justify-content:space-evenly;gap:4px;overflow:hidden;padding:0 1.5%}
.tcounter .glass svg{height:92%;width:auto;flex:0 0 auto;margin-bottom:1px}
.tcounter .glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 30%,rgba(255,255,255,.55) 30% 34%,transparent 34% 62%,rgba(255,255,255,.4) 62% 64%,transparent 64%)}
.shelf{position:absolute;z-index:1;pointer-events:none;display:none}
.shelf svg{width:100%;height:100%;display:block;overflow:visible}
body[data-scr="play"] .shelf{display:none!important}
body[data-scr="play"] .tcounter{display:none}
@media (max-height:500px),(max-aspect-ratio:1/1) and (max-height:760px){body[data-scr="select"] .tcounter{display:none}body[data-scr="select"] #select{padding-bottom:calc(12px + var(--safe-b))}}

/* ---------- title ---------- */
#title .t-main,#select>*{position:relative;z-index:8}
#title{padding:calc(var(--bar-h) + var(--safe-t)) 16px calc(var(--tc) + var(--safe-b) + 6px)}
.t-main{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.2vmin,12px)}
.t-txt{display:flex;flex-direction:column;align-items:center}
.mascot{width:clamp(120px,28vmin,250px);height:auto;overflow:visible;cursor:pointer;display:block}
.mascot{transform-origin:50% 97%;animation:mBob 2.6s ease-in-out infinite}
.mascot.happy{animation:mJump .7s cubic-bezier(.3,1.6,.5,1)}
.mascot .m-armL{transform-origin:44px 112px;animation:wave 1.6s ease-in-out infinite}
.mascot .m-eyes{transform-origin:100px 90px;animation:blink 4.2s infinite}
@keyframes mBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-8px) scale(.98,1.02)}}
@keyframes mJump{0%{transform:scale(1.15,.82)}35%{transform:translateY(-34px) scale(.92,1.1)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.t-stat{font-weight:800;color:var(--c1d);font-size:clamp(15px,2.4vmin,20px);background:rgba(255,255,255,.85);border-radius:999px;padding:3px 14px;margin-top:6px;display:inline-flex;align-items:center;gap:6px}
.t-stat:empty{display:none}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(10px,2vmin,18px)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bag{display:inline-flex}
.bag svg{width:1.15em;height:1.15em}
@media (max-aspect-ratio:4/5){
  #title .logo{font-size:clamp(44px,min(14vw,7.4vh),100px)}
  .mascot{width:clamp(110px,min(40vw,24vh),280px)}
  .title-btns .row .btn{font-size:clamp(16px,4.6vw,24px)}
}
@media (min-aspect-ratio:5/4){
  .t-main{flex-direction:row;gap:5vw}
  .mascot{width:clamp(110px,34vmin,330px)}
}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .mascot{width:30vmin}
  .title-btns{gap:12px;margin-top:8px}
}

/* ---------- select ---------- */
#select{justify-content:safe center;padding:calc(var(--bar-h) + var(--safe-t) + 6px) 14px calc(var(--tc) + var(--safe-b) + 14px);overflow-y:auto;gap:10px}
.sec-h{margin:2px 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.board{width:min(1040px,100%);background:rgba(255,255,255,.62);border-radius:30px;padding:10px 14px 16px;box-shadow:0 8px 0 rgba(200,90,130,.1)}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 12px;width:100%;padding-top:12px}
.day{border:none;cursor:pointer;border-radius:22px;background:#fff;padding:20px 4px 8px;box-shadow:0 7px 0 rgba(140,50,90,.16);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:transform .15s}
.day:active{transform:translateY(4px)}
.day .num{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--c1);color:#fff;border-radius:999px;padding:3px 12px 2px;font:800 clamp(14px,2.2vmin,18px)/1.2 var(--font);box-shadow:0 3px 0 var(--c1d);white-space:nowrap}
.day .ic{height:clamp(60px,12vmin,110px);width:100%;display:block}
.day .ic svg{display:block;height:100%;width:100%;overflow:visible}
.day .st{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#f1e3ea}
.k-mini-star.on svg{color:#ffc83d}
.day.locked{background:#f8eef3;box-shadow:0 7px 0 rgba(140,50,90,.08);cursor:default}
.day.locked .ic{opacity:.45;filter:grayscale(.85)}
.day.locked .num{background:#d9c3cf;box-shadow:0 3px 0 #c4a9b8}
.day .lk{color:#c4a9b8;height:clamp(16px,2.8vmin,22px);display:grid;place-items:center}
.day .lk svg{width:clamp(20px,3.4vmin,26px);height:auto}
.day.new{box-shadow:0 7px 0 rgba(140,50,90,.16),0 0 0 4px var(--gold),0 0 18px rgba(255,200,60,.8);animation:k-pulse 1.4s ease-in-out infinite}
.sel-foot{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px}
.memo{border:none;cursor:pointer;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 8px 6px 10px;box-shadow:0 5px 0 rgba(140,50,90,.14);font:800 clamp(16px,2.6vmin,20px)/1 var(--font);color:var(--ink);min-height:56px}
.memo .emo{font-size:28px}
.memo .sw{width:54px;height:32px;border-radius:99px;background:#eadbe3;position:relative;transition:background .2s}
.memo .sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.memo.on .sw{background:var(--c2)}
.memo.on .sw i{transform:translateX(22px)}
.memo.locked{opacity:.75}
.memo.locked .sw{display:none}
.memo .lk2{display:none;color:#c4a9b8;font-size:14px;align-items:center;gap:4px}
.memo.locked .lk2{display:inline-flex}
.memo .lk2 svg{width:20px;height:20px}
@media (max-aspect-ratio:1/1){.days{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px}.day .ic{height:clamp(54px,8.5vh,120px)}.board{padding:8px 8px 12px}.day .num{padding:3px 8px 2px;font-size:clamp(13px,1.7vh,18px)}}
@media (max-aspect-ratio:1/1) and (min-width:640px){.days{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 14px}}
@media (max-aspect-ratio:1/1) and (max-height:720px){.days{gap:14px 8px;padding-top:10px}.day{padding:16px 3px 5px;gap:2px}.day .ic{height:6.6vh}#select .sec-h{font-size:20px}.sel-foot{margin-top:2px;gap:8px}.memo{min-height:50px;padding:4px 8px}}
@media (max-height:520px){
  #select{padding-bottom:calc(10px + var(--safe-b));gap:6px}
  .board{padding:6px 10px 10px}
  .sec-h{font-size:20px}
  .day{padding:16px 4px 5px;gap:2px}
  .day .ic{height:44px}
  .memo{min-height:50px}
}

/* ---------- play ---------- */
#play{display:none}
#play.on{display:block}
#counter{position:absolute;z-index:4;pointer-events:none;background:linear-gradient(180deg,#f7d6ad 0,#f3c995 40%,#eebd86 100%)}
#counter::before{content:"";position:absolute;left:0;right:0;top:-6px;height:18px;border-radius:9px;background:linear-gradient(#fff4e4,#fbdcb6);box-shadow:0 4px 0 #e5b27b,0 8px 10px rgba(140,70,30,.12)}
#counter::after{content:"";position:absolute;left:0;right:0;top:22px;bottom:0;opacity:.35;background:repeating-linear-gradient(180deg,transparent 0 26px,rgba(200,130,70,.35) 26px 28px)}
#custBox{position:absolute;z-index:3;pointer-events:none}
#custIn{position:absolute;inset:0;will-change:transform}
#cust{position:absolute;inset:0}
#cust svg{width:100%;height:100%;overflow:visible;display:block}
#held{position:absolute;left:70%;top:28%;width:42%;height:52%;transform-origin:10% 90%}
#held svg{width:100%;height:100%;overflow:visible}
#held.lick{animation:lk .5s ease-in-out 4}
@keyframes lk{0%,100%{transform:none}50%{transform:translate(-34%,-6%) rotate(-18deg)}}
.an .a-body{transform-origin:100px 240px;animation:breathe 2.8s ease-in-out infinite}
.an .a-head{transform-origin:100px 150px;animation:tilt 6s ease-in-out infinite}
.an .eyes{animation:blink 4.6s infinite}
.an .eh,.an .mh,.an .mu,.an .ml{display:none}
.an.happy .en,.an.happy .mn,.an.lick .en,.an.lick .mn{display:none}
.an.happy .eh,.an.lick .eh{display:inline}
.an.happy .mh{display:inline}
.an.lick .ml{display:inline}
.an.lick .tongue{animation:tng .5s ease-in-out infinite;transform-origin:100px 128px}
.an.no .a-head{animation:shakeNo .9s ease-in-out}
.an.no .mn{display:none}
.an.no .mu{display:inline}
.an.happy .a-body{animation:hop .5s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}65%{transform:rotate(3deg)}}
@keyframes shakeNo{0%,100%{transform:rotate(0)}15%{transform:rotate(-11deg)}35%{transform:rotate(10deg)}55%{transform:rotate(-8deg)}75%{transform:rotate(6deg)}}
@keyframes tng{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1.15)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px)}}

#bubble{position:absolute;z-index:7;background:#fff;border-radius:28px;box-shadow:0 6px 0 rgba(150,50,90,.12),0 14px 26px rgba(150,50,90,.16);cursor:pointer;touch-action:none}
#bubble.hidden{display:block!important;visibility:hidden}
#bubble.pop{animation:bubPop .5s cubic-bezier(.2,1.6,.4,1) both}
#bubble.bye{animation:bubBye .45s ease-in both}
@keyframes bubBye{0%{transform:scale(1)}30%{transform:scale(1.08)}100%{transform:scale(0);opacity:0}}
@keyframes bubPop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
#bubble .tail{position:absolute;left:-26px;bottom:18%;width:40px;height:40px;overflow:visible}
#bubble .ord{position:absolute;inset:10px 10px 10px 10px}
#bubble .ord svg{width:100%;height:100%;overflow:visible;display:block}
#bubble .spk{position:absolute;top:-8px;right:-6px;width:40px;height:40px;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--c1d)}
#bubble .spk svg{width:24px;height:24px}
#bubble .think{position:absolute;inset:0;display:grid;place-items:center;font:800 40px/1 var(--font);color:#e6c9d6;letter-spacing:4px}
#bubble .cover{position:absolute;inset:6px;border-radius:24px;background:radial-gradient(circle at 30% 30%,#fff 0,#fff1f6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--c1d);font-weight:800;font-size:clamp(14px,2.2vmin,18px);text-align:center;animation:k-fade .3s}
#bubble .cover b{font-size:clamp(44px,9vmin,80px);line-height:1;color:var(--c1)}
#bubble .cover svg{width:34px;height:34px}
#bubble .tbar{position:absolute;left:16px;right:16px;bottom:8px;height:8px;border-radius:9px;background:#f6e6ee;overflow:hidden}
#bubble .tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:9px;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#bubble .hl{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);background:var(--c1);color:#fff;border-radius:18px;padding:6px 14px;font-weight:800;font-size:clamp(14px,2.3vmin,19px);line-height:1.15;text-align:center;box-shadow:0 4px 0 var(--c1d);width:max-content;max-width:min(300px,96vw);animation:k-pop .35s cubic-bezier(.2,1.6,.4,1);z-index:2}
.pt{transform-box:fill-box;transform-origin:center}
.pt.miss{animation:miss .6s ease-in-out 5}
@keyframes miss{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.2);filter:drop-shadow(0 0 5px #ff2f72) drop-shadow(0 0 2px #ff2f72)}}
.bad-wig{animation:badWig .5s ease-in-out 2;transform-box:fill-box;transform-origin:center bottom}
@keyframes badWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}

#station{position:absolute;z-index:6;touch-action:none;cursor:pointer}
#stSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#station.shake{animation:k-shake .45s}

.trash{position:absolute;z-index:7;border:none;background:none;padding:0;cursor:pointer;touch-action:none}
.trash svg{width:100%;height:100%;overflow:visible;display:block}
.trash .lid{transform-origin:12px 25px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.trash.open .lid{transform:rotate(-38deg)}
.trash.gulp svg{animation:gulp .5s cubic-bezier(.3,1.6,.5,1)}
.trash:active svg{transform:scale(.92)}
@keyframes gulp{0%{transform:scale(1)}30%{transform:scale(1.2,.8)}60%{transform:scale(.9,1.12)}100%{transform:scale(1)}}
#bServe,#bSnap{position:absolute;z-index:7;padding:0 .9em;justify-content:center}
#bServe .cn,#bSnap .cn{width:1.3em;height:1.3em}
#bServe.ready{animation:k-pulse 1.3s ease-in-out infinite}
.want{animation:want .8s ease-in-out infinite!important;z-index:3}
.pk-it.want,.pk-tab.want{background:#fff;box-shadow:0 0 0 4px var(--c1),0 0 18px rgba(255,90,140,.7)}
@keyframes want{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

#picker{position:absolute;z-index:7;border-radius:26px;background:linear-gradient(180deg,#9fe9dc,#62d0bc);padding:8px;box-shadow:0 7px 0 #33ae99,0 14px 24px rgba(30,110,100,.22);display:flex;flex-direction:column;gap:7px;touch-action:none}
#picker::before{content:"";position:absolute;left:18px;right:18px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.55)}
.pk-tabs{display:flex;gap:6px;flex:0 0 auto}
.pk-tabs:empty{display:none}
.pk-tab{flex:1;min-width:0;border:none;cursor:pointer;border-radius:16px;background:rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;gap:6px;font:800 var(--tf,17px)/1 var(--font);color:#16786a;height:var(--th,48px);position:relative;transition:background .2s,transform .15s}
.pk-tab svg{height:76%;width:auto;flex:0 0 auto;overflow:visible}
.pk-tab .n{position:absolute;top:-6px;left:-4px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--c2d);font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.pk-tab.on{background:#fff;color:var(--c1d);box-shadow:0 4px 0 rgba(20,110,95,.25)}
#picker.compact .pk-tab>span:last-child{display:none}
#picker.compact .pk-tab svg{height:82%}
.pk-tab.on .n{background:var(--c1);color:#fff}
.pk-body{flex:1;min-height:0;position:relative;border-radius:18px;background:linear-gradient(165deg,#f4fffd 0,#dff7f2 60%,#cdf1ea 100%);box-shadow:inset 0 4px 10px rgba(30,120,110,.18);display:grid;gap:var(--gap,8px);align-content:center;justify-content:center;overflow:hidden}
.pk-body::before{content:"";position:absolute;left:-20%;top:-60%;width:40%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:rotate(25deg);pointer-events:none}
.pk-body.swap{animation:pkIn .3s ease-out}
@keyframes pkIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pk-it{border:none;background:rgba(255,255,255,.7);border-radius:18px;padding:3px 2px 4px;width:var(--is,80px);height:var(--is,80px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:0 3px 0 rgba(30,120,110,.14);transition:transform .12s}
.pk-it .art{flex:1;min-height:0;width:100%;position:relative}
.pk-it .art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pk-it .nm{font-weight:800;font-size:var(--fs,14px);color:var(--ink);line-height:1;margin-top:1px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pk-body.nolabel .nm{display:none}
.pk-it.press{transform:translateY(4px) scale(.92)}
.pk-it.on{background:#fff;box-shadow:0 0 0 3px var(--c1),0 3px 0 var(--c1d)}
.pk-it .chk{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--c1);color:#fff;display:none;place-items:center;box-shadow:0 2px 0 var(--c1d)}
.pk-it .chk svg{width:16px;height:16px}
.pk-it.on .chk{display:grid}
.pk-it.full{animation:k-shake .4s}
#fmascot{position:absolute;z-index:5;pointer-events:auto;cursor:pointer}
#fmascot svg{width:100%;height:100%;overflow:visible}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:4px 14px 4px 5px;font-weight:800;font-size:clamp(18px,2.6vmin,22px);box-shadow:0 5px 0 rgba(150,50,90,.14);color:var(--ink);white-space:nowrap;line-height:1}
.chip .coin{width:32px;height:32px}
.chip.bump{animation:bump .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{50%{transform:scale(1.18)}}
.dayp{background:var(--c1);color:#fff;border-radius:999px;padding:7px 14px 6px;font-weight:800;font-size:clamp(15px,2.3vmin,19px);box-shadow:0 4px 0 var(--c1d);white-space:nowrap;line-height:1}
.dayp.mint{background:var(--c2);box-shadow:0 4px 0 var(--c2d)}
.qd{display:flex;gap:4px;background:#fff;border-radius:999px;padding:6px 9px;box-shadow:0 5px 0 rgba(150,50,90,.14)}
.qd i{width:22px;height:22px;border-radius:50%;background:#f4e6ee;display:grid;place-items:center;color:#fff;transition:background .3s}
.qd i svg{width:15px;height:15px}
.qd i.done{background:var(--c2)}
.qd i.cur{background:#ffd0df;box-shadow:0 0 0 2px var(--c1)}

/* fly layer */
#fly{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.flysc{position:absolute;left:0;top:0;width:120px;height:104px;transform-origin:60px 52px;will-change:transform}
.flysc svg{width:100%;height:100%;overflow:visible}
.flyst{position:absolute}
.flyst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flycoin{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px}
.flycoin svg{width:100%;height:100%}
.hand{position:fixed;z-index:61;width:58px;height:58px;margin:-6px 0 0 -18px;pointer-events:none;animation:handTap 1.1s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.hand svg{width:100%;height:100%}
@keyframes handTap{0%,100%{transform:translate(10px,18px) scale(1)}50%{transform:translate(0,0) scale(.9)}}
.flash{position:fixed;inset:0;z-index:70;background:#fff;pointer-events:none;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.polar{position:fixed;z-index:71;background:#fff;border-radius:14px;padding:10px 10px 26px;box-shadow:0 10px 26px rgba(0,0,0,.25);pointer-events:none}
.polar svg{width:100%;height:100%}

/* deco animations */
.d-bal .bl{animation:k-float 5s ease-in-out infinite}
.d-lan svg{transform-origin:30px 0;animation:sway 3.6s ease-in-out infinite}
.d-lan.b svg{animation-delay:-1.8s}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.d-clk .tail{transform-origin:50px 150px;animation:tailSw 1s ease-in-out infinite alternate}
.d-clk .pup{animation:eyeSw 1s ease-in-out infinite alternate}
@keyframes tailSw{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes eyeSw{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.d-neo .glo{filter:drop-shadow(0 0 3px #ff4f97) drop-shadow(0 0 8px #ff4f97);animation:flick 5s infinite}
.d-neo .glo2{filter:drop-shadow(0 0 3px #49e6ff) drop-shadow(0 0 8px #49e6ff)}
@keyframes flick{0%,40%,44%,48%,100%{opacity:1}42%,46%{opacity:.35}}
.d-fsh .fish{animation:swim 6s ease-in-out infinite}
.d-fsh .bub{animation:bubUp 2.4s ease-in infinite}
@keyframes swim{0%,100%{transform:translateX(-14px)}50%{transform:translateX(12px)}}
@keyframes bubUp{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.d-rbw{opacity:.8}
.d-flw svg{transform-origin:50% 100%;animation:flwB 3s ease-in-out infinite}
@keyframes flwB{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.deco.pop{animation:k-pop .6s cubic-bezier(.2,1.6,.4,1) both}

/* shop / gallery panels */
.k-panel.shop,.k-panel.gal{width:min(760px,96vw)}
.shop-h{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.stabs{display:flex;gap:8px;justify-content:center;margin:12px 0 14px;flex-wrap:wrap}
.stab{border:none;cursor:pointer;border-radius:16px;padding:9px 14px;font:800 clamp(15px,2.4vmin,19px)/1 var(--font);background:#fff0f5;color:var(--c1d);display:flex;align-items:center;gap:6px;min-height:48px}
.stab svg{width:28px;height:28px;overflow:visible}
.stab.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
@media (max-width:460px){.stabs{gap:6px}.stab{padding:8px 9px;font-size:15px;gap:4px}.stab svg{width:22px;height:22px}.sgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}.sitem .art{width:66px;height:66px}}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.sitem{border:none;border-radius:20px;background:#fff7fa;box-shadow:0 4px 0 #f5d9e4;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;font-family:var(--font);color:var(--ink);transition:transform .15s}
.sitem:active{transform:translateY(3px)}
.sitem .art{width:78px;height:78px;position:relative}
.sitem .art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sitem b{font-size:15px;line-height:1.1;min-height:2.2em;display:flex;align-items:center;text-align:center}
.sitem .pr{display:inline-flex;align-items:center;gap:3px;background:#fff1bf;border-radius:999px;padding:2px 10px 2px 3px;font-weight:800;font-size:16px;color:#9a6400}
.sitem .pr .coin{width:22px;height:22px}
.sitem.own .pr{background:#d6f6ef;color:var(--c2d);padding:3px 10px}
.sitem.own .pr svg{width:16px;height:16px}
.sitem.off .art{opacity:.4}
.sitem.off .pr{background:#eee;color:#999}
.sitem.cant .art{filter:saturate(.5);opacity:.75}
.sitem.cant .pr{background:#f3e9ee;color:#b49aa8}
.sitem.got{animation:got .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes got{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:12px}
.gcard{border:none;cursor:pointer;background:#fff;border-radius:16px;padding:0;box-shadow:0 4px 12px rgba(150,50,90,.18);aspect-ratio:3/4;position:relative;transform:rotate(var(--r,0deg))}
.gcard::before{content:"";position:absolute;left:7px;right:7px;top:7px;bottom:20px;border-radius:10px;background:radial-gradient(circle at 50% 40%,#fff,#ffeaf2)}
.gcard svg{position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 30px);overflow:visible}
.gcard:nth-child(3n+1){--r:-2deg}.gcard:nth-child(3n+2){--r:1.5deg}.gcard:nth-child(3n){--r:-.5deg}
.gbig{width:min(60vw,260px);height:min(46vh,340px);margin:6px auto 0;background:radial-gradient(circle,#fff 0,#ffeef5 100%);border-radius:24px;padding:10px}
.gbig svg{width:100%;height:100%;overflow:visible}
.gempty{margin:16px 0 4px;font-weight:700;color:var(--ink-soft)}
.res-mascot{width:110px;height:auto;margin:-78px auto 0;display:block;overflow:visible}
.k-panel.k-result{overflow:visible;margin-top:60px}
.sum{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:clamp(22px,4vmin,30px);color:#9a6400;background:#fff6d6;border-radius:999px;padding:4px 18px 4px 6px}
.sum .coin{width:38px;height:38px}
.res-sub{display:block;font-size:.85em;margin-top:6px}
@media (max-height:520px){
  .k-panel.k-result{margin-top:40px;padding:12px 18px 14px;width:min(600px,94vw)}
  .res-mascot{width:62px;margin-top:-52px}
  .k-result h2{font-size:28px}
  .k-result .k-stars{margin:4px 0 0}
  .k-result .k-stars svg{width:46px}
  .k-result .k-stars svg.mid{margin-top:-8px}
  .k-result .k-reward{margin-top:6px;padding:4px 12px 4px 8px;font-size:15px}
  .k-result .k-reward .emo{font-size:28px}
  .k-result .k-btns{margin-top:10px;gap:10px 10px}
  .k-result .btn{font-size:18px;padding:.55em 1em .6em}
  .res-sub{display:none}
  .sum{font-size:20px;padding:2px 14px 2px 4px}
  .sum .coin{width:30px;height:30px}
  .k-result p{margin-top:2px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="defsIn"></defs></svg>

</section>

  <div id="custBox"><div id="custIn"><div id="cust"></div><div id="held"></div></div></div>

  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {

      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;

      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }

      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }

  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }
    else ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();

  const songs = {

    bouncy: { bpm: 124, swing: 0.14, inst: 'marimba', bars: [

  const music = {
    _want: null, _song: null, _timer: null, _step: 0, _next: 0,

    stop(keepWant) { clearInterval(this._timer); this._timer = null; this._song = null; if (!keepWant) this._want = null; },
    _tick() {

        this._step++;

  };
  function duck(on) {
    if (!ctx || !musicBus) return;
    const target = settings.music ? (on ? MUSIC_VOL * 0.3 : MUSIC_VOL) : 0;
    musicBus.gain.setTargetAtTime(target, ctx.currentTime, on ? 0.05 : 0.4);
  }

  /* ---------- Vietnamese voice ---------- */
  const speech = (() => {
    const synth = window.speechSynthesis;
    let voice = null, timer = null, cur = null;
    function choose() {
      if (!synth) return;
      const vs = synth.getVoices() || [];
      const vi = vs.filter(v => /^vi([-_]|$)/i.test(v.lang || '') || /vietnam/i.test(v.name || ''));
      const score = v => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 4 : 0) + (/hoaimy|linh|google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
      vi.sort((a, b) => score(b) - score(a));

    }
    if (synth) { choose(); try { synth.addEventListener('voiceschanged', choose); } catch (e) { synth.onvoiceschanged = choose; } }
    function say(text, o = {}) {

      const go = () => {

        u.voice = voice; u.lang = voice.lang; u.rate = o.rate || 0.92; u.pitch = o.pitch || 1.1; u.volume = 1;

        u.onend = u.onerror = () => { if (cur === u) { cur = null; duck(false); } o.onend && o.onend(); };
        synth.speak(u);
      };
      clearTimeout(timer);
      if (o.queue) go();
      else if (synth.speaking || synth.pending) { synth.cancel(); timer = setTimeout(go, 90); }
      else go();
      return true;
    }
    return { say, has: () => !!voice, stop() { clearTimeout(timer); if (synth) synth.cancel(); duck(false); }, voiceName: () => voice && voice.name };
  })();

  /* ---------- particles / confetti ---------- */
  const COLORS = ['#ff5d8f', '#ffc83d', '#4cc9f0', '#7b5cff', '#3ecf6e', '#ff8a3d', '#ff7ad9'];
  const fx = (() => {
    let cv, g, W, H, parts = [], raf = 0, last = 0;

    function loop(now) {
      const dt = Math.min(2.5, (now - last) / 16.67); last = now;
      g.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt;
        if (p.life <= 0 || p.y > H + 60) { parts.splice(i, 1); continue; }
        p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
        p.x += p.vx * dt + (p.flutter ? Math.sin(now / 180 + p.seed) * p.flutter : 0); p.y += p.vy * dt; p.rot += p.vr * dt;

  })();
  function confetti(o = {}) {

  /* ---------- icons ---------- */

    const c = cfg.cont ? pick(CT_IDS) : 'C';
    const n = randInt(cfg.s[0], cfg.s[1]);
    const s = [];
    for (let i = 0; i < n; i++) { let f = pick(fl); if (s.includes(f) && Math.random() < 0.75) f = pick(fl); s.push(f); }
    if (G.fresh.length && Math.random() < 0.6) { const f = G.fresh.shift(); s[randInt(0, n - 1)] = f; }
    const k = Math.min(tps.length, randInt(cfg.t[0], cfg.t[1]));
    const t = shuffle(tps).slice(0, k);

    if (!G.prev || codeOf(o) !== codeOf(G.prev)) { G.prev = o; return o; }
  }

}

  const fs = counts.length === o.s.length ? 'vị ' + joinVi(counts.map(x => FL[x[0]].say)) : joinVi(counts.map(([f, n]) => NUMW[n] + ' viên ' + FL[f].say));

  const pool2 = o.s.slice(); b.s.forEach((f, i) => { const j = pool2.indexOf(f); if (j >= 0) pool2.splice(j, 1); else r.extraS.push(i); });
  r.missT = o.t.filter(t => !b.t.includes(t));
  r.extraT = b.t.filter(t => !o.t.includes(t));
  r.ok = !r.cont && !r.missS.length && !r.extraS.length && !r.missT.length && !r.extraT.length;
  return r;
}

}

  const render = () => {
    box.innerHTML = `<h2>Bộ sưu tập kem</h2>` + (save.gal.length
      ? `<div class="ggrid">${save.gal.map((c, i) => `<button class="gcard" data-i="${i}">${iceSVG(decode(c), { pad: 6 })}</button>`).join('')}</div>`
      : `<p class="gempty">Chưa có ảnh nào.<br>Làm kem rồi bấm <b>Chụp ảnh</b> nhé!</p>`);
    $$('.gcard', box).forEach(b => b.onclick = () => openBig(+b.dataset.i));
  };
  const openBig = i => {
    const code = save.gal[i]; if (!code) return;
    Kit.sfx.pop(); say(pick(['Kem của bé đẹp quá!', 'Trông ngon quá!', 'Tuyệt vời!']));
    const v = Kit.overlay(`<div class="gbig">${iceSVG(decode(code), { pad: 6 })}</div><div class="k-btns"></div>`, { closable: true });
    const bx = $('.k-btns', v.panel);
    const del = el('button', 'btn white small', icon('trash') + '<span>Xóa</span>');
    del.onclick = () => {
      const c = Kit.confirm({ title: 'Xóa kem này?', buttons: [{ label: 'Không', cls: 'white' }, { label: 'Xóa', icon: 'trash', cls: 'pink', onClick: () => { save.gal.splice(i, 1); persist(); refreshGalBadge(); v.close(); render(); S.remove(); } }] });
      return c;
    };
    const ok = el('button', 'btn ok small', icon('check') + '<span>Đóng</span>'); ok.onclick = () => v.close();
    bx.append(del, ok);
  };
  render();
  say('Bộ sưu tập kem của bé!');
}

/* =====================================================================
   SELECT SCREEN
   ===================================================================== */
function samplePreview(i) {
  const cfg = DAYS[i], c = cfg.cont ? CT_IDS[i % 3] : 'C';
  const fl = ['s', 'c', 'v', 's', 'c'], s = fl.slice(i % 3, i % 3 + cfg.s[1]);
  const t = ['che', 'spr', 'choc'].slice(0, cfg.t[1]);
  return { c, s, t };
}
function renderSelect() {
  const dv = $('#days'); dv.innerHTML = '';
  DAYS.forEach((cfg, i) => {
    const n = i + 1, locked = false, st = save.stars[n] || 0;
    const b = el('button', 'day' + (locked ? ' locked' : '') + '');
    b.innerHTML = `<span class="num">Ngày ${n}</span><div class="ic">${iceSVG(samplePreview(i), { pad: 4, w: 150 })}</div>${locked ? `<div class="lk">${icon('lock')}</div>` : `<div class="st">${Kit.starRow(st)}</div>`}`;
    b.onclick = () => {
      if (locked) { sfx.bad(); replay(b, 'shake'); Kit.toast('Xong Ngày ' + (save.cleared + 1) + ' để mở khóa nhé!'); say('Bé bán xong ngày trước để mở khóa nhé!'); return; }
      startDay(n);
    };
    dv.appendChild(b);
  });
  const mb = $('#bMemo'), unlocked = true; // memory challenge is open from the start
  mb.classList.toggle('locked', !unlocked); mb.classList.toggle('on', unlocked && save.memo);
  $('.lk2', mb).innerHTML = icon('lock') + 'Xong Ngày ' + MEMO_AT;
}
$('#bMemo').onclick = () => {
  save.memo = !save.memo; persist(); renderSelect(); Kit.sfx.click();
  say(save.memo ? 'Thử thách nhớ đơn hàng! Đơn hàng sẽ ẩn đi sau vài giây. Thưởng gấp đôi xu!' : 'Tắt thử thách nhớ đơn hàng.');
  if (save.memo) Kit.toast('Đơn hàng sẽ ẩn sau vài giây · Thưởng ×2 xu');
};

/* =====================================================================
   WIRING
   ===================================================================== */
$('#bPlay').onclick = () => { renderSelect(); show('select'); say('Chọn ngày bán kem nhé!'); };
$('#bFree').onclick = () => startFree();
$('#bShop').onclick = () => openShop();
$('#bShop2').onclick = () => openShop();
$('#bGal').onclick = () => openGallery();
$('#bBack').onclick = () => {
  hideHand();
  if (screen === 'play') { const free = G && G.mode === 'free'; endSession(); if (free) show('title'); else { renderSelect(); show('select'); } }
  else { refreshTitle(); show('title'); }
};
$('#bServe').innerHTML = `<svg class="cn" viewBox="-56 -70 112 230">${contBack('C')}<g transform="translate(0 -26)">${scoopArt('s')}</g></svg><span>Giao kem!</span>`;
$('#bServe').onclick = () => doServe();
$('#bSnap').innerHTML = `${CAM}<span>Chụp ảnh</span>`;
$('#bSnap').onclick = () => doSnap();
$('#bTrash').innerHTML = `<svg viewBox="0 0 80 92"><ellipse cx="40" cy="88" rx="27" ry="4" fill="#000" opacity=".12"/><path d="M13 30H67L61.5 81Q60.6 87 55 87H25Q19.4 87 18.5 81Z" fill="#9adfd3" stroke="#2f9c88" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 38L24 80" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/><ellipse cx="31" cy="52" rx="3.8" ry="4.8" fill="#2e2235"/><ellipse cx="49" cy="52" rx="3.8" ry="4.8" fill="#2e2235"/><circle cx="32.3" cy="50.3" r="1.3" fill="#fff"/><circle cx="50.3" cy="50.3" r="1.3" fill="#fff"/><path d="M34 62Q40 68 46 62" stroke="#2e2235" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="24.5" cy="60" rx="4.2" ry="2.6" fill="#ff8fb1" opacity=".75"/><ellipse cx="55.5" cy="60" rx="4.2" ry="2.6" fill="#ff8fb1" opacity=".75"/><g class="lid"><rect x="8" y="19" width="64" height="12" rx="6" fill="#7fd6c6" stroke="#2f9c88" stroke-width="3.5"/><rect x="32" y="11" width="16" height="9" rx="4.5" fill="#7fd6c6" stroke="#2f9c88" stroke-width="3"/></g></svg>`;
$('#bTrash').addEventListener('pointerdown', e => { e.preventDefault(); doTrash(); });
$('#station').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!G || screen !== 'play') return;
  bumpIdle();
  if (!ST.c && G.phase === 'build') { nudge('c'); return; }
  stWobble(e);
});
$('#fmascot').addEventListener('pointerdown', () => { const m = $('#fmascot .mascot'); if (m) { replay(m, 'happy'); Kit.sfx.boing(); say(pick(['Kem ngon quá!', 'Làm cao nữa đi!', 'Tớ là Bé Kem!'])); } });
$('#mascot').innerHTML = mascotInner();
$('#mascot').addEventListener('pointerdown', () => {
  const m = $('#mascot'); replay(m, 'happy'); Kit.sfx.boing();
  const [x, y] = center(m); burst(x, y - 40, { n: 10, shape: 'heart', colors: ['#ff5d8f', '#ff8fb3', '#ffd0df'], speed: 6, size: 16 });
  say(pick(['Chào bé! Tớ là Bé Kem!', 'Cùng bán kem nhé!', 'Kem dâu ngon lắm!']));
});
$$('.bag').forEach(b => b.innerHTML = BAG);
$('#bGal').insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M9.6 13.2h4.8L12 19z" fill="currentColor" fill-opacity=".35"/><path d="M8.6 13.2a3.4 3.4 0 0 1 6.8 0z" fill="currentColor"/></svg>');

// keyboard
document.addEventListener('keydown', e => {
  if (screen !== 'play' || !G || $('.k-ov')) return;
  if (/^[1-9]$/.test(e.key)) { const b = $$('#pkBody .pk-it')[+e.key - 1]; if (b) pkPress(b); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const i = G.tabs.indexOf(pkCur), j = clamp(i + (e.key === 'ArrowRight' ? 1 : -1), 0, G.tabs.length - 1); pkTab(G.tabs[j]); }
  else if (e.key === 'Enter') { e.preventDefault(); if (G.mode === 'day') doServe(); else doSnap(); }
  else if (e.key === 'Backspace' || e.key === 'Delete') doTrash();
  else if (e.key === ' ' && G.mode === 'day' && G.text) { e.preventDefault(); say(G.text); }
});

let rzT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => { drawAwning(); if (screen === 'play') { layoutPlay(); hideHand(); } else placeDeco(); }, 60);
});

buildDefs();
$('#shelfL').innerHTML = shelfArt('L'); $('#shelfR').innerHTML = shelfArt('R');
drawAwning();
buildDeco();
refreshTitle();
renderHUD();
Kit.music.start('bouncy');
// test hook (harmless): exposes state for automated QA
window.__ice = { save, ST, get G() { return G; }, startDay, startFree, openShop, openGallery, compare, stDesc, nextStep, persist, art: { custSVG, randomLook, iceSVG, tubArt, topIcon, decoArt, MASCOT_SVG } };
})();
</script>
</body>
</html>
