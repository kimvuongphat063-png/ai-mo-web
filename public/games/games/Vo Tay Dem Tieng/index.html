<!DOCTYPE html>
<html lang="vi" data-game="votay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff9a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vỗ Tay Đếm Tiếng</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* ===== BéVui Kit 5 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','Segoe UI Symbol',sans-serif;
  --ink:#33305a; --ink-soft:#6c6896;
  --c1:#4f8cff; --c1d:#2f63d6; --c1l:#e2edff;
  --c2:#ff7a9c; --c2d:#dd4f76;
  --ok:#35c46a; --okd:#1f9a4d;
  --gold:#ffc93c; --goldd:#e19a00;
  --bad:#ff8a65;
  --bg1:#bfe3ff; --bg2:#fff1c9;
  --panel:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:76px;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-play{touch-action:none}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-right{display:flex;gap:10px;align-items:center;margin-left:auto;flex:0 0 auto}
.k-bar .k-extra{display:flex;gap:10px}
.k-bar .k-extra:empty{display:none}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(30,40,90,.16),0 10px 18px rgba(30,40,90,.10);
  transition:transform .12s ease,box-shadow .12s ease,opacity .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(30,40,90,.16),0 4px 8px rgba(30,40,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn .emo{font-size:30px}
.ibtn.off{color:#b4b2cc}
.ibtn .badge,.btn .badge{position:absolute;top:-8px;right:-8px;min-width:25px;height:25px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 15px/25px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.k-back{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(30,40,90,.12)}
.k-back:active{box-shadow:0 1px 0 var(--c1d)}
@media (max-height:500px),(max-width:430px){
  .ibtn{width:50px;height:50px;border-radius:16px}
  .ibtn svg{width:27px;height:27px}
  .k-bar,.k-bar .k-right,.k-bar .k-extra{gap:8px}
  .k-bar{padding-top:calc(8px + var(--safe-t));padding-bottom:6px}
}
/* narrow portrait: middle slot drops to its own row when it has content */
@media (max-width:600px) and (orientation:portrait){
  .k-bar{flex-wrap:wrap;row-gap:8px}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:var(--tap);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(20,30,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(20,30,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.15em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d5d9ee;color:var(--c1d);text-shadow:none}
.btn.purple{--b:#9b6bff;--bd:#7246dc}
.btn.orange{--b:#ff9a3c;--bd:#db7412}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.glow{animation:k-glow 1.3s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(42px,9.5vmin,100px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(20,30,80,.25)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.05}

/* ---- tiles (mode / level pickers) ---- */
.k-tiles{display:grid;gap:clamp(10px,2vmin,18px);width:min(1000px,100%);grid-template-columns:repeat(auto-fit,minmax(min(150px,42vw),1fr))}
.k-tile{--tc:var(--c1);--tcd:var(--c1d);--tcl:var(--c1l);position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:12px 10px 12px;
  box-shadow:0 7px 0 rgba(30,40,90,.14),0 12px 20px rgba(30,40,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:800;color:var(--ink);font-size:clamp(16px,2.6vmin,22px);line-height:1.1;text-align:center;transition:transform .15s;min-height:var(--tap)}
.k-tile:active{transform:translateY(4px) scale(.98)}
.k-tile .ti{font-size:clamp(38px,7vmin,62px);width:1.55em;height:1.55em;display:grid;place-items:center;border-radius:50%;background:var(--tcl)}
.k-tile .ti svg{width:72%;height:72%}
.k-tile small{display:block;font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .st{display:flex;gap:1px;justify-content:center}
.k-tile.sel{background:var(--tc);color:#fff;box-shadow:0 7px 0 var(--tcd),0 0 0 4px #fff}
.k-tile.sel small{color:rgba(255,255,255,.9)}
.k-tile.sel .ti{background:rgba(255,255,255,.3)}
.st{display:inline-flex;gap:1px;justify-content:center;align-items:center}
.k-mini-star{display:inline-block}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e3e2f2;display:block}
.k-mini-star.on svg{color:var(--gold)}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(30,30,80,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px;overflow:auto}
.k-panel{position:relative;width:min(580px,94vw);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(30,40,90,.14),0 30px 60px rgba(30,40,90,.3);animation:k-panel .34s cubic-bezier(.2,1.5,.4,1) both;overscroll-behavior:contain}
.k-panel.wide{width:min(900px,96vw)}
.k-panel h2{margin:0 0 4px;font-size:clamp(28px,6vmin,46px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(54px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars .mid svg{margin-top:-16px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}
.k-result .k-hero{width:clamp(96px,22vmin,140px);margin:-80px auto 0;display:block}
.k-panel.k-result{overflow:visible;margin-top:60px}
@media (max-height:500px){
  .k-panel{padding:16px 18px 16px;border-radius:26px}
  .k-btns{margin-top:12px}
  .k-stars svg{width:52px}
  .k-result .k-hero{width:80px;margin-top:-56px}
  .k-panel.k-result{margin-top:40px}
}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,58px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(30,40,90,.12),0 12px 24px rgba(30,40,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---- speech bubble with replay ---- */
.k-say{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 8px 6px 16px;font-weight:800;color:var(--ink);
  font-size:clamp(17px,2.8vmin,24px);box-shadow:0 5px 0 rgba(30,40,90,.12);line-height:1.1;max-width:100%}
.k-say .ibtn{width:44px;height:44px;border-radius:14px;background:var(--c1l);box-shadow:none}
.k-say .ibtn svg{width:24px;height:24px}

/* ---- tutorial hand ---- */
.k-hand{position:fixed;left:0;top:0;z-index:85;width:74px;height:74px;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.k-hand svg{width:100%;height:100%}

/* ---- decorative ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:50%;height:150%;left:15%;bottom:20%}
.k-cloud::after{width:38%;height:120%;right:14%;bottom:25%}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-panel{0%{transform:scale(.88) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-glow{0%,100%{box-shadow:0 7px 0 var(--bd),0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 7px 0 var(--bd),0 0 0 10px rgba(255,255,255,.55)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-22%) scale(.94,1.08)}75%{transform:translateY(0) scale(1.06,.94)}}
@keyframes k-float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-22px)}}
@keyframes k-drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-wiggle{animation:k-wiggle .5s ease-in-out}
.k-shake{animation:k-shake .45s ease-in-out}
.k-jump{animation:k-jump .6s cubic-bezier(.3,1.4,.5,1)}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3s ease-in-out infinite}
.k-blink{transform-box:fill-box;transform-origin:50% 50%;animation:k-blink 4.4s infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.btn.glow,.k-breathe{animation:none!important}}
</style>
<style>
:root{--c1:#ff8a3d;--c1d:#d9611b;--c1l:#ffe7d4;--c2:#ff6fa5;--c2d:#d9467f;--ink:#4a3150;--ink-soft:#8b6b8e}
body{background:
  radial-gradient(ellipse 70% 45% at 50% 108%,rgba(255,255,255,.6),transparent 70%),
  linear-gradient(172deg,#ffe8a8 0%,#ffd3bf 52%,#ffc2dd 100%)}
.notes{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.notes span{position:absolute;bottom:-50px;color:#fff;opacity:.55;font-weight:800;animation:rise linear infinite;text-shadow:0 3px 0 rgba(217,97,27,.18)}
@keyframes rise{0%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-55vh) translateX(18px) rotate(10deg)}100%{transform:translateY(-115vh) rotate(-8deg);opacity:0}}
.screen{z-index:1}

/* ---------- bear ---------- */
.bear{display:block;overflow:visible}
.bear .arm,.bear .carm{transform-box:view-box}
.bear .armL,.bear .carmL{transform-origin:82px 152px}
.bear .armR,.bear .carmR{transform-origin:178px 152px}
.bear .head{transform-box:view-box;transform-origin:130px 150px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.bear .bodyg{transform-box:view-box;transform-origin:130px 240px}
.bear .skin{transform-box:fill-box;transform-origin:50% 50%}
.bear .eyes{transform-box:view-box;transform-origin:130px 95px;animation:k-blink 4.6s infinite}
.bear .pupils{transition:transform .18s ease-out}
.bear .m-open,.bear .brows{opacity:0;transition:opacity .15s}
.bear.happy .m-open{opacity:1}.bear.happy .m-smile{opacity:0}
.bear.hmm .brows{opacity:1}.bear.hmm .head{transform:rotate(-9deg)}
.bear.clap .drum,.bear.clap .arm{display:none}
.bear:not(.clap) .carm{display:none}
.breathe{animation:k-breathe 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:130px 240px}

/* ---------- title ---------- */
#title{gap:clamp(2px,1.2vmin,12px);padding:calc(var(--bar-h) + 2px) 16px calc(16px + var(--safe-b))}
.t-hero{position:relative;width:min(64vw,36vh,420px);min-width:170px}
.t-hero .bear{width:100%;height:auto;cursor:pointer}
.t-txt{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vmin,22px)}
.k-logo{--c1d:#c84f17}
.k-logo .l1{color:#fff}.k-logo .l2{color:#ffd23f;font-size:1.04em}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:16px}
.t-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media (min-aspect-ratio:6/5){
  #title{flex-direction:row;gap:5vw}
  .t-hero{width:min(62vh,440px)}
}

/* ---------- select ---------- */
#select{justify-content:center;gap:clamp(8px,2vmin,18px);padding:calc(var(--bar-h) + 6px) 16px calc(14px + var(--safe-b))}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vmin,26px);width:min(1180px,100%)}
.mode{--tc:#3fbf74;--tcd:#26985a;--tcl:#dcf7e6;border:none;cursor:pointer;border-radius:30px;background:#fff;padding:16px 12px 14px;position:relative;
  box-shadow:0 8px 0 rgba(120,50,30,.14),0 14px 24px rgba(120,50,30,.10);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);transition:transform .15s}
.mode:active{transform:translateY(5px)}
.mode .mi{width:clamp(92px,19vmin,200px);height:clamp(92px,19vmin,200px);border-radius:50%;background:var(--tcl);display:grid;place-items:center;position:relative}
.mode .mi svg{width:78%;height:78%}
.mode b{font-size:clamp(22px,4.2vmin,44px);line-height:1;color:var(--tcd)}
.mode small{font-weight:700;color:var(--ink-soft);font-size:clamp(14px,2.3vmin,19px);line-height:1.15;text-align:center}
.mode .st{margin-top:2px}
.mode .mt{display:flex;flex-direction:column;align-items:center;gap:4px}
.mode.m2{--tc:#9b6bff;--tcd:#7546e0;--tcl:#ece4ff}
.mode.m3{--tc:#3aa0ff;--tcd:#1f78d6;--tcl:#dcefff}
.inst{display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:100%;background:rgba(255,255,255,.75);border-radius:999px;padding:6px;box-shadow:0 4px 0 rgba(120,50,30,.1)}
.inst .lbl{font-weight:800;color:var(--ink-soft);padding:0 6px 0 10px;font-size:clamp(15px,2.4vmin,19px)}
.inst button{border:none;cursor:pointer;border-radius:999px;padding:6px 14px 6px 10px;white-space:nowrap;min-height:52px;display:flex;align-items:center;gap:6px;background:transparent;font-weight:800;font-size:clamp(16px,2.6vmin,21px);color:var(--ink)}
.inst button .emo{font-size:30px}
.inst button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
@media (max-width:420px){.inst .lbl{display:none}.inst button{padding:6px 12px 6px 8px}}
@media (max-aspect-ratio:1/1){
  .modes{grid-template-columns:1fr;max-width:520px}
  .mode{flex-direction:row;justify-content:flex-start;text-align:left;padding:12px 16px;gap:16px}
  .mode .mi{width:clamp(76px,20vw,104px);height:clamp(76px,20vw,104px);flex:0 0 auto}
  .mode .mt{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .mode small{text-align:left}
}
@media (max-height:520px) and (orientation:landscape){
  .mode{padding:10px 8px 10px}

}

/* ---------- top-bar progress ---------- */
.pips{display:flex;gap:7px;align-items:center;background:rgba(255,255,255,.92);padding:9px 14px;border-radius:999px;box-shadow:0 4px 0 rgba(120,50,30,.12)}
.pips i{width:22px;height:22px;border-radius:50%;background:#f1e3e6;display:grid;place-items:center;font-style:normal;font-size:14px;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s}
.pips i.cur{background:#ffe0c6;box-shadow:0 0 0 3px var(--c1);animation:k-pulse 1.2s infinite}
.pips i.ok{background:#ffd23f;transform:scale(1.12)}
.pips i.ok2{background:#9fe0b4}
.pips i svg{width:16px;height:16px}

/* ---------- count play ---------- */
.pv{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;margin:0 auto;max-width:1500px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  padding:2px 14px calc(10px + var(--safe-b));gap:4px}
.pv.land{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;justify-items:center;align-items:center;column-gap:20px;row-gap:4px}
.pv.land .qcard{grid-row:1/3;grid-column:1}
.pv.land .stage{grid-column:2;grid-row:1}
.pv.land .bot{grid-column:2;grid-row:2;flex-direction:row;gap:18px}
.bot{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,16px);flex:0 0 auto}

.qcard{position:relative;width:var(--cw,300px);background:#fff;border-radius:calc(var(--cw,300px)*.12);padding:calc(var(--cw,300px)*.06) 12px calc(var(--cw,300px)*.05);
  box-shadow:0 8px 0 rgba(120,50,30,.13),0 18px 30px rgba(120,50,30,.12);display:flex;flex-direction:column;align-items:center;gap:calc(var(--cw,300px)*.025)}
.qcard.in{animation:cardIn .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cardIn{from{transform:translateY(40px) scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.qpic{width:var(--pw,180px);height:var(--pw,180px);border-radius:50%;display:grid;place-items:center;background:var(--pc,#ffe7d4);position:relative}
.qpic .emo{font-size:calc(var(--pw,180px)*.62);filter:drop-shadow(0 6px 0 rgba(0,0,0,.08));animation:k-bob 3s ease-in-out infinite}
.qword{font-weight:800;font-size:var(--wf,34px);line-height:1.05;color:var(--ink);text-align:center;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.12em .22em;min-height:1.1em}
.qword .sy{display:inline-block;padding:.02em .22em .06em;border-radius:.3em;transition:background .2s,color .2s}
.qword.split .sy{background:var(--syc);color:#fff;box-shadow:0 .09em 0 rgba(0,0,0,.14)}
.qword .dot{color:#d8c4cf;font-size:.8em}
.qword .sy.jump{animation:syJump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes syJump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-.45em) scale(1.25) rotate(-4deg)}70%{transform:translateY(.05em) scale(.95)}100%{transform:none}}
.spk{position:absolute;top:10px;right:10px;width:52px;height:52px;border-radius:16px;background:var(--c1l);color:var(--c1d);box-shadow:0 4px 0 rgba(217,97,27,.18)}
.ntag{position:absolute;top:-14px;left:-10px;background:var(--c2);color:#fff;font-weight:800;font-size:clamp(18px,3vmin,26px);padding:4px 14px;border-radius:999px;box-shadow:0 4px 0 var(--c2d);transform:scale(0) rotate(-10deg);transition:transform .45s cubic-bezier(.2,1.8,.4,1)}
.ntag.on{transform:scale(1) rotate(-6deg)}

.stage{position:relative;border:none;background:none;padding:0;cursor:pointer;width:var(--sw,240px);height:var(--sw,240px);touch-action:none;flex:0 0 auto}
.stage::before{content:"";position:absolute;inset:6% 0 -2%;border-radius:50%;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.75),rgba(255,255,255,0) 68%);pointer-events:none}
.stage .bear{position:relative;width:100%;height:100%}
.ring{position:absolute;left:50%;top:78%;width:60%;height:20%;margin-left:-30%;margin-top:-10%;border-radius:50%;border:5px solid #fff;opacity:0;pointer-events:none}
.ring.go{animation:ring .5s ease-out}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}

.slots{display:flex;gap:calc(var(--sl,64px)*.2);align-items:center;flex:0 0 auto}
.slot{width:var(--sl,64px);height:var(--sl,64px);border:none;border-radius:50%;cursor:pointer;background:#fff;color:#e2cdd4;display:grid;place-items:center;
  font:800 calc(var(--sl,64px)*.46)/1 var(--font);box-shadow:inset 0 -5px 0 rgba(0,0,0,.06),0 5px 0 rgba(120,50,30,.13);transition:background .2s,color .2s,transform .2s;position:relative;padding:0}
.slot.on{background:var(--sc,#ff8a3d);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 5px 0 rgba(120,50,30,.18);animation:slotPop .38s cubic-bezier(.2,1.8,.4,1)}
.slot.flash{animation:slotFlash .5s ease}
.slot .emo{position:absolute;top:-12px;right:-10px;font-size:calc(var(--sl,64px)*.42);opacity:0;transform:scale(.3);transition:transform .3s cubic-bezier(.2,1.8,.4,1),opacity .2s}
.slot.on .emo{opacity:1;transform:scale(1)}
@keyframes slotPop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes slotFlash{0%,100%{transform:scale(1)}40%{transform:scale(1.25);box-shadow:0 0 0 8px rgba(255,210,63,.7)}}
.slots.shake{animation:k-shake .45s}
.ctrl{display:flex;align-items:center;gap:16px;flex:0 0 auto}
.flynote{position:fixed;z-index:60;pointer-events:none;font-weight:800;font-size:34px;text-shadow:0 2px 0 #fff,0 0 8px #fff;left:0;top:0}
.ctrl .ibtn{width:max(54px,calc(var(--sl,64px)*.9));height:max(54px,calc(var(--sl,64px)*.9))}
#bDone{font-size:clamp(24px,calc(var(--sl,64px)*.46),38px);min-width:calc(var(--sl,64px)*2.3);min-height:max(56px,var(--sl,64px))}

/* ---------- build (ghép) play ---------- */
.gv{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;margin:0 auto;max-width:1500px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 12px calc(12px + var(--safe-b));gap:clamp(14px,4.5vh,44px)}
.gv.land{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr 1fr;justify-items:center;align-items:center;column-gap:24px;row-gap:clamp(10px,3vh,30px)}
.gv.land .qcard{grid-row:1/3}
.gv.land .ans{align-self:end}
.gv.land .tray{align-self:start}
.ans{display:flex;gap:var(--gap,10px);justify-content:center;flex-wrap:nowrap;padding:12px;border-radius:26px;background:rgba(255,255,255,.55)}
.gslot{position:relative;min-width:var(--cwid,84px);height:var(--chh,68px);border-radius:20px;border:4px dashed #e9b8a2;background:rgba(255,255,255,.7);display:grid;place-items:center}
.gslot .ghost{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:var(--cfs,30px);color:#e9cbbd;opacity:0;transition:opacity .4s}
.gslot.showghost .ghost{opacity:1}
.gslot .gn{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:#fff;color:var(--c1d);border-radius:999px;font-weight:800;font-size:14px;padding:1px 9px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.gslot.ok{border-color:#5bd18b;border-style:solid;background:#e6fbef}
.tray{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;min-height:calc(var(--chh,68px) + 16px);max-width:100%}
.chip{position:relative;min-width:var(--cwid,84px);height:var(--chh,68px);padding:0 .4em;border:none;border-radius:20px;background:var(--chc,#ff8a3d);color:#fff;cursor:grab;
  font:800 var(--cfs,30px)/1 var(--font);text-shadow:0 2px 0 rgba(0,0,0,.15);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),0 6px 0 rgba(90,40,30,.16),0 10px 16px rgba(90,40,30,.12);touch-action:none;display:grid;place-items:center}
.gslot .chip{box-shadow:inset 0 -6px 0 rgba(0,0,0,.14);margin:-4px}
.chip.drag{cursor:grabbing;z-index:60;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),0 18px 30px rgba(90,40,30,.3)}
.chip.shake{animation:k-shake .45s}
.chip.jump{animation:syJump .5s cubic-bezier(.3,1.6,.5,1)}
.gslot.hot{border-color:var(--c1);background:#fff3e8;transform:scale(1.06)}
.gslot{transition:transform .15s,border-color .15s,background .15s}

/* ---------- album ---------- */
#album{justify-content:flex-start;padding:calc(var(--bar-h) + 4px) 12px calc(12px + var(--safe-b));gap:10px}
.atabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.atab{border:none;cursor:pointer;border-radius:999px;background:#fff;padding:8px 16px;min-height:52px;font-weight:800;font-size:clamp(16px,2.6vmin,21px);color:var(--ink);box-shadow:0 4px 0 rgba(120,50,30,.12);display:flex;align-items:center;gap:6px}
.atab.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.atab small{font-weight:700;opacity:.8;font-size:.8em}
.agrid{flex:1 1 auto;overflow-y:auto;width:min(1000px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(92px,15vmin,124px),1fr));gap:12px;padding:6px 4px 20px;align-content:start;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.aw{border:none;cursor:pointer;background:#fff;border-radius:22px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(120,50,30,.12);color:var(--ink);min-height:100px}
.aw .emo{font-size:clamp(40px,7vmin,54px);width:1.5em;height:1.5em;display:grid;place-items:center;border-radius:50%;background:var(--pc)}
.aw span{font-weight:800;font-size:clamp(14px,2.2vmin,17px);line-height:1.1;text-align:center}
.aw.no{background:rgba(255,255,255,.55);box-shadow:none}
.aw.no .emo{filter:grayscale(1) opacity(.28);background:#f3e9ec}
.aw.no span{color:#c5adb6}
.aw.jump{animation:k-jump .6s}
.acount{font-weight:800;color:var(--c1d);background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 rgba(120,50,30,.12);font-size:clamp(16px,2.6vmin,20px);white-space:nowrap}
</style>

<script>/* ===== BéVui Kit 5 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1 };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const restart = (e, cls) => { if (!e) return; e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); };
  const center = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; };
  const inRect = (x, y, r, pad = 0) => x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  /* ---------- storage (never throws) ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { try { localStorage.removeItem(ns + k); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio core ---------- */
  const MUSIC_VOL = 0.22;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden && unlocked) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    const c = audio(); if (!c) return;
    try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
    if (c.state === 'suspended') c.resume().catch(() => { });
    if (music._want) music.start(music._want);
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { speech.stop(); if (ctx) ctx.suspend().catch(() => { }); }
    else if (ctx && unlocked) ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    if (!unlocked) return null;
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibDepth || 6; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + a + (o.hold || 0) + d + 0.05); }
    node.connect(g);
    if (o.pan != null && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); p.connect(bus); } else g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    if (!unlocked) return;
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    src.connect(f); f.connect(g);
    if (o.pan != null && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); p.connect(bus); } else g.connect(bus);
    src.start(t0, Math.random() * 1.2); src.stop(t0 + a + (o.hold || 0) + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.2, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 2, t, vol: vol * 0.22, dur: dur * 0.5, bus });
    tone({ f: f * 3.01, t, vol: vol * 0.07, dur: dur * 0.3, bus });

/* ================= round control ================= */
function pickWords(mode) {
  const m = MODES.find(x => x.id === mode);
  const per = { easy: [3, 3], hard: [3, 3], build: [2, 2, 2] }[mode];
  const out = [];
  m.ns.forEach((n, i) => {
    let pool = shuffle(BY_N(n).filter(w => !recent.includes(w.id)));
    if (pool.length < per[i]) pool = shuffle(BY_N(n));
    // prefer words not yet learned, but keep it random
    pool.sort((a, b) => (learned.has(a.id) ? 1 : 0) - (learned.has(b.id) ? 1 : 0) + rand(-0.7, 0.7));
    const used = new Set(out.map(w => w.e));
    for (const w of pool) { if (out.filter(x => x.n === n).length >= per[i]) break; if (used.has(w.e)) continue; used.add(w.e); out.push(w); }
  });
  out.forEach(w => { recent.push(w.id); if (recent.length > 40) recent.shift(); });
  return shuffle(out);
}
function startRound(mode) {

}

function flipMove(c, parent, before) {

  const r1 = c.getBoundingClientRect();
  c.animate([{ transform: `translate(${r0.left - r1.left}px,${r0.top - r1.top}px)` }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.3,1.3,.5,1)' });
}
function bindChip(c) {
  let ox = 0, oy = 0, moved = false, ghost = null, r0 = null;
  const clearHot = () => $$('#ans .gslot').forEach(g => g.classList.remove('hot'));
  Kit.drag(c, {
    can: () => !S.busy && !c.classList.contains('placed'),
    start(e) {
      moved = false; r0 = c.getBoundingClientRect();
      ox = e.clientX - r0.left; oy = e.clientY - r0.top;
      Kit.hand.hide(); armIdleBuild();
    },
    move(e, i) {
      if (!moved && Math.hypot(i.dx, i.dy) < 8) return;
      if (!moved) {
        moved = true; Kit.sfx.pick();
        ghost = c.cloneNode(true); ghost.classList.add('drag');
        Object.assign(ghost.style, { position: 'fixed', left: r0.left + 'px', top: r0.top + 'px', width: r0.width + 'px', height: r0.height + 'px', margin: '0', pointerEvents: 'none' });
        $('#gv').appendChild(ghost); c.style.opacity = '0';
      }
      ghost.style.transform = `translate(${e.clientX - ox - r0.left}px,${e.clientY - oy - r0.top}px) scale(1.08) rotate(-3deg)`;
      const slot = slotAt(e.clientX, e.clientY);

    },
    end(e, i) {

      const gr = ghost.getBoundingClientRect(); ghost.remove(); ghost = null; c.style.opacity = '';
      const slot = i.cancel ? null : slotAt(e.clientX, e.clientY);
      const from = c.closest('.gslot');
      if (slot && !slot.classList.contains('ok') && slot !== from) {

        slot.appendChild(c); Kit.sfx.drop();
      } else if (slot && slot === from) { Kit.sfx.drop(); }
      else { if (from) $('#tray').appendChild(c); Kit.sfx.swish(); }
      const r1 = c.getBoundingClientRect();
      c.animate([{ transform: `translate(${gr.left - r1.left}px,${gr.top - r1.top}px) scale(1.08)` }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.3,1.3,.5,1)' });

    }
  });
}

    const b = el('button', 'aw' + (on ? '' : ' no'), `<span class="emo" style="--pc:${w.pc}">${w.e}</span><span>${on ? w.w : '?'}</span>`);
    b.onclick = () => {
      if (!on) { Kit.sfx.bad(); Kit.restart(b, 'k-shake'); Kit.toast('Chơi để mở từ này nhé!'); return; }
      Kit.restart(b, 'jump');
      Kit.sayList(w.s.concat([w.w]), { rate: .82, gap: 200, onEach: i => { if (i < w.n) beat(i); } });
    };
    g.appendChild(b);
  });
  Kit.bar.setMid(`<span class="acount">📒 ${learned.size}/${WORDS.length} từ</span>`);
}
Kit.onScreen('album', { enter() { renderAlbum(); } });

/* ================= layout ================= */
function layout() {
  if (Kit.screen === 'play') layoutCount();
  else if (Kit.screen === 'build') layoutBuild();
}
function layoutCount() {
  const pv = $('#pv'), r = pv.getBoundingClientRect(); if (!r.width) return;
  const W = r.width - 28, H = r.height - 14;
  const land = W / H > 1.05;
  pv.classList.toggle('land', land);
  let cw, sw, sl;
  if (land) {
    cw = clamp(Math.min(W * 0.38, (H - 6) / 0.95), 160, 620);
    const col = W - cw - 20;
    sl = clamp(Math.min((col - 40) / 9, H * 0.14), 44, 104);
    sw = clamp(Math.min(col * 0.9, H - Math.max(sl, 66) - 18), 110, 660);
  } else {
    sl = clamp(Math.min(W / 5.6, H * 0.085), 48, 84);
    cw = clamp(Math.min(W * 0.86, H * 0.36), 170, 420);
    sw = clamp(Math.min(W * 0.8, H - cw * 0.98 - sl - 64 - 46), 110, 340);
  }
  pv.style.setProperty('--cw', cw + 'px'); pv.style.setProperty('--pw', (land ? cw * 0.6 : Math.min(cw * 0.56, H * 0.22)) + 'px');
  pv.style.setProperty('--wf', clamp(cw * 0.12, 24, 50) + 'px');
  pv.style.setProperty('--sw', sw + 'px'); pv.style.setProperty('--sl', sl + 'px');
  // safety: shrink the slot row until it really fits
  const bot = $('.bot', pv);
  for (let k = 0; k < 5; k++) {
    const avail = land ? r.right - 14 - Math.max(bot.getBoundingClientRect().left, r.left) : r.width - 20;
    const need = bot.scrollWidth;
    if (need <= avail || sl <= 40) break;
    sl = Math.max(40, sl * avail / need - 1); pv.style.setProperty('--sl', sl + 'px');
  }
}
function layoutBuild() {
  const gv = $('#gv'), r = gv.getBoundingClientRect(); if (!r.width) return;
  const W = r.width - 24, H = r.height - 16;
  const land = W / H > 1.05;
  gv.classList.toggle('land', land);
  const w = S.list[S.idx]; if (!w) return;
  const n = w.n, maxLen = Math.max(...w.s.map(s => s.length));
  const availW = land ? W * 0.6 : W - 24;
  const gap = clamp(availW * 0.025, 6, 14);
  const em = maxLen * 0.56 + 0.95;
  let fs = (availW - 32 - gap * (n - 1)) / n / em;
  fs = clamp(fs, 14, land ? Math.min(74, H * 0.085) : 46);
  const chh = Math.max(52, fs * 2.1), cwid = fs * em;
  gv.style.setProperty('--cfs', fs + 'px'); gv.style.setProperty('--chh', chh + 'px'); gv.style.setProperty('--cwid', cwid + 'px'); gv.style.setProperty('--gap', gap + 'px');
  const cw = land ? clamp(Math.min(W * 0.36, H * 0.88), 150, 560) : clamp(Math.min(W * 0.74, H - chh * 2 - 150), 140, 340);
  gv.style.setProperty('--cw', cw + 'px'); gv.style.setProperty('--pw', cw * 0.62 + 'px');
  // safety: shrink chips until the answer row fits
  const ans = $('#ans'); let f = fs;
  for (let k = 0; k < 5; k++) {
    const avail = (land ? W - cw - 24 : W) - 4, need = ans.scrollWidth;
    if (need <= avail || f <= 12) break;
    f = Math.max(12, f * avail / need - 0.5);
    gv.style.setProperty('--cfs', f + 'px'); gv.style.setProperty('--cwid', f * em + 'px'); gv.style.setProperty('--chh', Math.max(48, f * 2.1) + 'px');
  }
}
Kit.onResize(layout);

/* ================= boot ================= */
buildNotes();
mountBear($('#tHero'), 'tb');
mountBear($('#stage'), 'pb');
$('#tHero').addEventListener('pointerdown', () => { const b = bears.tb; bearHit(b); beat(rand(0, 3) | 0); bearMood(b, 'happy', 700); });
$('#bPlay').addEventListener('click', () => Kit.go('select'));
$('#bAlbum').addEventListener('click', () => Kit.go('album'));
setInst(inst);
Kit.go('title');
</script>
