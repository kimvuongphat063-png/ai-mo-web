<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
:root{--c1:#ff8a5b;--c1d:#e0602f;--c1l:#ffe6d8;--c2:#2fc6b1;--c2d:#1b9c89;--bg1:#fff3c4;--bg2:#ffcfb4;--ink:#5b3a2c;--ink-soft:#94705c;
  --mc:#46d4c7;--mcd:#22a89b;--mcl:#aaf4eb;--mline:#137a71}
body{background:
  radial-gradient(circle at 8% 22%,rgba(255,255,255,.5) 0 70px,transparent 71px),
  radial-gradient(circle at 94% 80%,rgba(255,255,255,.38) 0 120px,transparent 121px),
  linear-gradient(172deg,#fff6d2 0%,#ffe9c9 50%,#ffd4bd 100%)}
.dots{position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(rgba(255,255,255,.75) 2.2px,transparent 2.8px);background-size:30px 30px}
.bunting{position:absolute;left:0;right:0;top:calc(var(--safe-t) - 6px);height:56px;pointer-events:none;background-repeat:repeat-x;background-size:240px 56px;opacity:.9}
.k-ov{background:rgba(110,60,30,.38)}
.k-panel h2{color:var(--c1d)}
.btn.teal{--b:var(--c2);--bd:var(--c2d)}
.btn .hg{width:1.15em;height:1.15em;flex:0 0 auto}

/* ---------- monster ---------- */
.mon-host{position:relative;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mon{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.mon .m-root,.mon .m-breath{transform-box:view-box;transform-origin:150px 300px}
.mon .m-breath{animation:m-breath 3.4s ease-in-out infinite}
#pMon .m-breath{scale:calc(1 + var(--f,0) * .013) calc(1 + var(--f,0) * .007);transition:scale .35s cubic-bezier(.3,1.6,.5,1)}
.mon .m-armL{transform-box:view-box;transform-origin:64px 206px}
.mon .m-armR{transform-box:view-box;transform-origin:236px 206px}
.mon .m-eyeL{transform-box:view-box;transform-origin:112px 150px;transition:transform .07s}
.mon .m-eyeR{transform-box:view-box;transform-origin:188px 150px;transition:transform .07s}
.mon .m-cheek{transform-box:fill-box;transform-origin:50% 50%;transition:transform .2s}
.mon .m-happy,.mon .m-squint,.mon .m-brow{opacity:0}
.e-blink .m-eye{transform:scaleY(.08)}
.e-happy .m-eye,.e-squint .m-eye{opacity:0}
.e-happy .m-happy{opacity:1}
.e-squint .m-squint{opacity:1}
.e-worry .m-brow{opacity:1}
.e-happy .m-cheek{transform:scale(1.25)}
.a-chomp .m-root{animation:m-squash .42s ease-out}
.a-chomp .m-cheek{animation:m-puff .5s ease-out}
.a-hop .m-root{animation:m-hop .55s cubic-bezier(.3,1.5,.5,1)}
.a-dance .m-root{animation:m-dance 1.6s ease-in-out}
.a-dance .m-armL{animation:m-wavel .4s ease-in-out 4}
.a-dance .m-armR{animation:m-waver .4s ease-in-out 4}
.a-wiggle .m-root{animation:m-wig .7s ease-in-out}
.a-wiggle .m-armL{animation:m-wavel .35s ease-in-out 2}
.a-wiggle .m-armR{animation:m-waver .35s ease-in-out 2 .1s}
.a-rub .m-armL{animation:m-rubl .5s ease-in-out 3}
.a-rub .m-armR{animation:m-rubr .5s ease-in-out 3 .25s}
.a-rumble .m-breath{animation:m-rumble .11s linear 7}
.a-burp .m-root{animation:m-burp .75s ease-out}
.a-wave .m-armR{animation:m-waver .32s ease-in-out 4}
@keyframes m-breath{0%,100%{transform:none}50%{transform:scale(.988,1.018)}}
@keyframes m-squash{0%{transform:none}22%{transform:scale(1.08,.9)}52%{transform:scale(.96,1.05)}100%{transform:none}}
@keyframes m-puff{0%,100%{transform:none}25%,65%{transform:scale(1.6,1.45)}}
@keyframes m-hop{0%,100%{transform:none}40%{transform:translateY(-18px) scale(.96,1.05)}}
@keyframes m-dance{0%,100%{transform:none}12%{transform:translateY(-20px) rotate(-6deg)}25%{transform:scale(1.06,.94)}37%{transform:translateY(-20px) rotate(6deg)}50%{transform:scale(1.06,.94)}62%{transform:translateY(-24px) rotate(-5deg)}75%{transform:scale(1.05,.95)}87%{transform:translateY(-14px) rotate(4deg)}}
@keyframes m-wavel{0%,100%{transform:none}50%{transform:rotate(70deg)}}
@keyframes m-waver{0%,100%{transform:none}50%{transform:rotate(-70deg)}}
@keyframes m-wig{0%,100%{transform:none}18%{transform:rotate(-7deg) scale(1.03,.97)}38%{transform:rotate(6deg)}58%{transform:rotate(-4deg)}78%{transform:rotate(3deg)}}
@keyframes m-rubl{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-46deg)}}
@keyframes m-rubr{0%,100%{transform:rotate(18deg)}50%{transform:rotate(46deg)}}
@keyframes m-rumble{0%,100%{transform:none}25%{transform:translateX(-3px) scale(1.012,.99)}75%{transform:translateX(3px) scale(.99,1.012)}}
@keyframes m-burp{0%{transform:none}18%{transform:scale(.93,1.1)}34%{transform:scale(1.1,.92)}52%{transform:scale(.97,1.04)}70%{transform:scale(1.02,.98)}100%{transform:none}}

/* ---------- title ---------- */
.floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters span{position:absolute;font-size:clamp(30px,6vmin,52px);animation:drift 11s ease-in-out infinite;opacity:.9;line-height:1}
.floaters span .fsvg{width:1em;height:1em}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1))}}
#title{gap:clamp(2px,1vmin,10px);padding:calc(64px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
#title>*{position:relative;z-index:1}
.t-mon{position:relative;width:clamp(150px,min(68vw,36vh),420px);aspect-ratio:300/332;flex:0 0 auto;margin-bottom:6px}
.t-mon .mon-host{position:absolute;inset:0}
.blanket{position:absolute;left:-16%;right:-16%;bottom:-3%;height:22%;border-radius:50%;background-color:#fffaf5;
  background-image:linear-gradient(90deg,rgba(255,112,92,.42) 50%,transparent 0),linear-gradient(rgba(255,112,92,.42) 50%,transparent 0);
  background-size:26px 26px;box-shadow:0 7px 0 rgba(214,96,62,.28),inset 0 0 0 5px rgba(255,255,255,.75)}
.title-txt{display:flex;flex-direction:column;align-items:center}
.logo{font-size:clamp(46px,min(14vw,10.6vmin),110px)}
.logo .l1{color:#6fe3d6;-webkit-text-stroke-color:#137a71;text-shadow:0 .1em 0 #137a71,0 .2em .3em rgba(30,80,70,.22)}
.logo .l2{color:#ffd84d;font-size:1.06em}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(10px,2.4vmin,22px)}
@media (min-aspect-ratio:6/5){
  #title{flex-direction:row;gap:6vw;padding-top:calc(var(--bar-h) + var(--safe-t) - 16px)}
  .t-mon{width:min(40vw,60vh,470px)}
  .logo{font-size:clamp(46px,11vmin,120px)}
}

/* ---------- modes ---------- */
#modes{gap:clamp(8px,2vmin,18px);padding:calc(var(--bar-h) + var(--safe-t)) 14px calc(14px + var(--safe-b))}
.sec-h{margin:0;font-weight:800;font-size:clamp(26px,5vmin,44px);color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c1d);text-align:center;line-height:1.1}
.mhead{display:flex;align-items:center;gap:clamp(6px,1.6vmin,16px)}
.mhead .mon-host{width:clamp(78px,16vmin,140px);aspect-ratio:300/332;flex:0 0 auto}
.mode-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2.2vmin,22px);width:min(1060px,100%)}
@media (max-aspect-ratio:1/1){.mode-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:min(560px,100%)}}
.mcard{border:none;cursor:pointer;background:#fff;border-radius:28px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;
  box-shadow:0 8px 0 rgba(170,90,50,.2),0 16px 26px rgba(170,90,50,.12);transition:transform .15s;color:var(--ink)}
.mcard:active{transform:translateY(5px)}
.mc-art{width:100%;aspect-ratio:1.3;border-radius:20px;background:var(--mc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%;position:relative;overflow:hidden}
.mc-art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.6px);background-size:16px 16px}
.mc-art>*{position:relative}
.mc-big{font-weight:800;font-size:clamp(34px,7.4vmin,70px);line-height:.9;color:#fff;-webkit-text-stroke:.14em var(--mcd);paint-order:stroke fill;text-shadow:0 .08em 0 var(--mcd)}
.mc-row{display:flex;gap:2px;font-size:clamp(22px,5vmin,44px);line-height:1}
.mc-row .fsvg{width:1em;height:1em}
.mtf{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:rgba(255,255,255,.55);padding:4px;border-radius:9px;width:62%}
.mtf i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.7)}
.mtf i.on{background:#ff7a45;box-shadow:0 2px 0 #d4521f}
.mdots{display:flex;align-items:center;gap:3px}
.mdots i{width:clamp(14px,3vmin,26px);aspect-ratio:1;border-radius:50%;background:#ff7a45;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mdots i.b{background:#7a5cff}
.mdots i.x{background:rgba(255,255,255,.65);position:relative;box-shadow:none}
.mdots i.x::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#d6402c;font-weight:800;font-size:.8em;line-height:1}
.mdots b{color:#fff;font-size:clamp(16px,3vmin,26px);margin:0 2px;-webkit-text-stroke:.15em var(--mcd);paint-order:stroke fill}
.mc-name{font-weight:800;font-size:clamp(18px,3.2vmin,28px);line-height:1.15;margin-top:2px}

/* ---------- play ---------- */
#play{justify-content:flex-start}
.stage{position:absolute;left:0;right:0;bottom:0;top:calc(var(--bar-h) + var(--safe-t));touch-action:none}

#pMon{z-index:3}
.prog{display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:5px 12px 5px 5px;box-shadow:0 5px 0 rgba(170,90,50,.16)}

.pd{width:28px;height:28px;border-radius:50%;border:3px dashed #f0c6ae;display:grid;place-items:center;flex:0 0 auto}

.pd.st{border:none;animation:k-pop .45s cubic-bezier(.2,1.8,.4,1)}
.pd.st svg{width:32px;height:32px;filter:drop-shadow(0 2px 0 rgba(200,130,0,.35))}

.panel{z-index:4;--c:30px;--bp:10px;padding:var(--bp);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:calc(var(--c) * .7);background:#fff;box-shadow:0 7px 0 rgba(170,90,50,.18),0 14px 26px rgba(170,90,50,.14)}
.p-head{height:calc(var(--c) * 1.7);display:flex;align-items:center;justify-content:center;gap:calc(var(--c) * .22);line-height:1;white-space:nowrap}
.num{font-weight:800;font-size:calc(var(--c) * 1.75);color:#ff7a45;text-shadow:0 calc(var(--c) * .09) 0 #d9541f;line-height:.8;padding-top:.08em}
.ex{font-weight:800;font-size:calc(var(--c) * 1.22);color:var(--ink);line-height:1;padding-top:.08em}
.ex .ca{color:#ff7a45}.ex .cb{color:#7a5cff}.ex .q{color:#2fc6b1}
.p-head .fi{font-size:calc(var(--c) * 1.15)}
.fsvg{display:inline-block;width:1em;height:1em;vertical-align:middle}
.fsvg svg{width:100%;height:100%;display:block}
.frame{display:grid;grid-template-columns:repeat(5,var(--c));grid-auto-rows:var(--c);margin-top:calc(var(--c) * .15);border:3px solid #f5c3a6;border-radius:calc(var(--c) * .26);
  background:#fff8f2;position:relative;overflow:visible}
.frame .cell{border-right:2px solid #f7dccb;border-bottom:2px solid #f7dccb;display:grid;place-items:center;position:relative}
.frame .cell:nth-child(5n){border-right:0}
.frame.r1 .cell{border-bottom:0}
.frame.r2 .cell:nth-child(n+6){border-bottom:0}
.dot{width:74%;height:74%;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffc0a0,#ff7a45 68%);box-shadow:0 2px 0 #d4521f}
.bubble .dot{animation:k-pop .32s cubic-bezier(.2,1.7,.4,1) calc(220ms + var(--i,0) * 75ms) both}
.dot.b{background:radial-gradient(circle at 34% 30%,#cbbaff,#7a5cff 68%);box-shadow:0 2px 0 #5236c9}
.dot.x{background:#ffe1d3;box-shadow:none;position:relative}
.dot.x::before,.dot.x::after{content:"";position:absolute;left:-8%;right:-8%;top:43%;height:14%;border-radius:9px;background:#e2412c;transform:rotate(45deg)}
.dot.x::after{transform:rotate(-45deg)}
.bubble{cursor:pointer}
.bubble::before{content:"";position:absolute;width:26px;height:26px;background:#fff;border-radius:5px;transform:rotate(45deg)}
.bubble.side::before{left:-10px;top:calc(var(--ty) - 13px)}
.bubble.stack::before{bottom:-10px;left:calc(var(--tx) - 13px)}
.bubble.pop{animation:k-pop .45s cubic-bezier(.2,1.6,.4,1)}
.bubble.wig{animation:k-wiggle .5s ease-in-out 2}
.bubble .ear{position:absolute;top:calc(var(--bp) * .5);right:calc(var(--bp) * .5);width:calc(var(--c) * .8);height:calc(var(--c) * .8);min-width:22px;min-height:22px;color:#f0a27a;display:grid;place-items:center}

.bubble .stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}

  box-shadow:0 5px 0 var(--okd),0 0 0 6px rgba(255,255,255,.9);animation:stamp .45s cubic-bezier(.2,1.8,.4,1) both}

@keyframes needp{0%,100%{opacity:.35;transform:scale(.88)}50%{opacity:1;transform:scale(1)}}
.over{position:absolute;right:calc(var(--c) * -.35);top:calc(var(--c) * -.5);background:#ff6b5b;color:#fff;border-radius:999px;font-weight:800;font-size:calc(var(--c) * .62);
  padding:.12em .45em 0;line-height:1.2;box-shadow:0 3px 0 #c93c3c;animation:k-pop .3s cubic-bezier(.2,1.7,.4,1);white-space:nowrap}

.tray{z-index:2;--cell:60px;--tp:10px;border-radius:calc(var(--cell) * .34);border:var(--tp) solid #fff;background-color:#fffaf4;
  background-image:linear-gradient(90deg,rgba(255,112,92,.36) 50%,transparent 0),linear-gradient(rgba(255,112,92,.36) 50%,transparent 0);

@keyframes fhey{0%,100%{transform:none}20%{transform:translateY(-22%) rotate(-10deg)}40%{transform:translateY(0) rotate(0)}60%{transform:translateY(-14%) rotate(8deg)}80%{transform:none}}

.say{z-index:6;left:0;top:0;background:#fff;border-radius:999px;padding:.32em .85em .22em;font-weight:800;font-size:clamp(17px,2.8vmin,26px);color:var(--ink);
  box-shadow:0 5px 0 rgba(170,90,50,.2);white-space:nowrap;transform:translate(-50%,-50%) scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;line-height:1.2}

.say .emo{font-size:1.15em;vertical-align:-.12em}
.hand{z-index:9;left:0;top:0;font-size:48px;pointer-events:none;line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.2))}

@keyframes puff{0%{transform:translate(-50%,-40%) scale(.2);opacity:0}15%{transform:translate(-50%,-75%) scale(1.08);opacity:1}30%{transform:translate(-50%,-80%) scale(1) rotate(-3deg)}75%{opacity:1}100%{transform:translate(-50%,-150%) scale(1.15) rotate(4deg);opacity:0}}

/* ---------- closet ---------- */

}
.cl-sec h3{margin:clamp(6px,1.4vmin,12px) 4px clamp(5px,1vmin,9px);font-size:clamp(18px,2.8vmin,24px);color:var(--c1d);display:flex;align-items:center;gap:8px;line-height:1}

.tile.new::before{content:"MỚI";position:absolute;top:-9px;left:-6px;z-index:2;background:var(--gold);color:#6b3d00;font:800 12px/1 var(--font);padding:5px 7px 4px;border-radius:10px;box-shadow:0 3px 0 var(--goldd);animation:k-pulse 1.2s infinite}

/* ---------- result ---------- */

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }
    else ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;

    const f = v => v.toFixed(1);
    const d = `M${f(cx - hw)} ${cy}C${f(cx - hw * .5)} ${f(top)} ${f(cx + hw * .5)} ${f(top)} ${f(cx + hw)} ${cy}C${f(cx + hw * .6)} ${f(bot)} ${f(cx - hw * .6)} ${f(bot)} ${f(cx - hw)} ${cy}Z`;

let raf = 0, lastT = 0, inFrame = false;
function wake() { if (!raf && !inFrame) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
function frame(now) {
  const dt = Math.min(3, Math.max(0.2, (now - lastT) / 16.67)); lastT = now;
  inFrame = true;

  try {
    if (G) alive = stepPlay(now) || alive;

  } finally { inFrame = false; }

}

  const w = pick(words);
  Kit.praise(w, { speak: false });
  talk(g.wrongs === 0 ? pick(['Ngon quá! Cảm ơn bạn!', 'Măm măm! Đúng rồi!', 'Tuyệt vời! Ngon quá đi!']) : pick(['Ngon quá! Cảm ơn bạn!', 'Đúng rồi! Tớ no rồi!']));
  if (g.first[g.idx]) later(() => { const d = $$('.pd')[g.idx]; if (d) { const c = centerOf(d); Kit.sparkle(c.x, c.y); sfx.star(); } }, 250);
  later(() => g.items.forEach(it => it.el.classList.add('bye')), 1350);
  later(() => { g.idx++; if (g.idx >= 5) finishRound(); else nextOrder(); }, 2100);
}
function hungry() {
  G.wrongs++; G.lastAct = performance.now();
  sfx.bad(); later(snd.rumble, 250);
  PM.expr('e-worry', 1900); PM.act('a-rub', 1550); PM.seq([[0.2, 300], [-0.3, 400], [0.15, 300], [null, 0]]);
  const bub = $('#bubble'); bounce(bub, 'wig');
  later(() => { const r = bub.getBoundingClientRect(); PM.lookAt(r.left + r.width / 2, r.top + r.height / 2); }, 50);
  sayPill('Còn đói! Thêm nữa nhé! <span class="emo">🥺</span>', 2200);
  talk('Tớ vẫn còn đói! Thêm nữa đi!');
  if (G.wrongs >= 2) G.hint = true;
  markNeed(true);
  later(() => markNeed(), 2600);
}
function tooMany() {
  const g = G; g.wrongs++; g.phase = 'spit';
  const t = g.cur.target, extra = g.eaten - t;
  PM.expr('e-squint', 1000); PM.act('a-burp', 760); PM.seq([[0.95, 520], [0.1, 200], [null, 0]]);
  snd.burp(); Kit.vibrate(40);
  const mp = mouthPos();
  burpCloud(mp.x, mp.y, PM.rect().width);
  sayPill(`Ợ! Nhiều quá! <span class="emo">😵</span>`, 2400);
  talk(`Ợ! Nhiều quá! Tớ chỉ cần ${t} ${g.cur.food.u} thôi!`);
  for (let k = 0; k < extra; k++) later(spitOne, 700 + k * 320);
  later(() => {
    g.phase = 'play'; g.lastAct = performance.now();
    if (g.wrongs >= 2) g.hint = true;
    markNeed();
    bounce($('#bDone'), 'pulse');
  }, 700 + extra * 320 + 450);
}
const CLOUD = [[30, 50, 21], [54, 32, 25], [84, 38, 22], [98, 56, 15], [60, 58, 20]];
function burpCloud(x, y, mw) {
  const w = clamp(mw * .5, 90, 190);
  const d = el('div', 'puff', `<svg viewBox="0 0 120 80" aria-hidden="true"><g fill="#8fd6c0">${CLOUD.map(([a, b, r]) => `<circle cx="${a}" cy="${b}" r="${r + 3}"/>`).join('')}</g><g fill="#f1fffa">${CLOUD.map(([a, b, r]) => `<circle cx="${a}" cy="${b}" r="${r}"/>`).join('')}</g></svg><b>Ợ!</b>`);
  d.style.width = w + 'px'; d.style.left = x + 'px'; d.style.top = y + 'px';
  $('#fly').appendChild(d); setTimeout(() => d.remove(), 1500);
}
const setFull = () => $('#pMon').style.setProperty('--f', G ? G.eaten : 0);
function spitOne() {
  const it = G.eatenList.pop(); if (!it) return;
  G.eaten--; updateBelly(); setFull();
  PM.seq([[0.75, 120], [-0.4, 120], [null, 0]]); snd.spit();
  const mp = mouthPos();
  it.state = 'flying';
  const gh = ghost(G.cur.food, mp.x, mp.y);
  addFlight('spit', it, gh, mp.x, mp.y, () => centerOf(it.el), 560, 0, () => { it.state = 'tray'; it.el.classList.remove('gone'); bounce(it.el, 'land'); sfx.drop(); });
}

/* ---------- idle prompts ---------- */
function idleCheck(now) {
  if (G.flights.length || G.drags.size || G.queue.length) return;
  if (now - G.lastAct > 9000 && G.rumbles < 3) {
    G.rumbles++; G.lastAct = now;
    PM.act('a-rumble', 800); PM.expr('e-worry', 1300); snd.rumble();
    sayPill('Ọc ọc… đói quá! <span class="emo">🤤</span>', 1800);
    if (G.rumbles === 1) talk('Tớ đói quá!');
    bounce($('#bubble'), 'wig');
    const it = pick(G.items.filter(i => i.state === 'tray')); if (it) bounce(it.el, 'hey');
    if (G.eaten === 0) showHand();
  }
}

/* ---------- tutorial hand ---------- */
let handAnim = null;
function showHand() {
  if (!G || G.phase !== 'play' && G.phase !== 'intro') return;
  const it = G.items.find(i => i.state === 'tray'); if (!it) return;
  const st = $('#stage').getBoundingClientRect(), a = centerOf(it.el), b = mouthPos();
  const h = $('#hand'); h.classList.remove('hidden');
  const ax = a.x - st.left - 14, ay = a.y - st.top + 6, bx = b.x - st.left - 14, by = b.y - st.top + 10;
  if (handAnim) handAnim.cancel();
  handAnim = h.animate([
    { transform: `translate(${ax}px,${ay + 30}px)`, opacity: 0 },
    { transform: `translate(${ax}px,${ay}px)`, opacity: 1, offset: .15 },
    { transform: `translate(${ax}px,${ay}px) scale(.82)`, opacity: 1, offset: .25 },
    { transform: `translate(${ax}px,${ay}px) scale(1)`, opacity: 1, offset: .33 },
    { transform: `translate(${bx}px,${by}px) scale(1)`, opacity: 1, offset: .75 },
    { transform: `translate(${bx}px,${by}px) scale(1)`, opacity: 0, offset: 1 },
  ], { duration: 2200, iterations: Infinity, easing: 'ease-in-out' });
}
function hideHand() { if (handAnim) { handAnim.cancel(); handAnim = null; } $('#hand').classList.add('hidden'); }

/* ---------- play monster tap = tickle ---------- */
$('#pMon').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!G || G.phase !== 'play' || G.flights.length || G.drags.size) return;
  G.lastAct = performance.now();
  tickle(PM, e.clientX, e.clientY);
  sayPill('Hi hi! <span class="emo">🤭</span>', 1200);
});

/* ---------- round end ---------- */
function finishRound() {
  const g = G; g.phase = 'over';
  const firstN = g.first.filter(Boolean).length;
  const stars = firstN === 5 ? 3 : firstN === 4 ? 2 : 1;
  save.stars[g.mode.id] = Math.max(save.stars[g.mode.id] || 0, stars);
  let lvl = save.lvl[g.mode.id] || 0;
  if (firstN === 5) lvl = Math.min(3, lvl + 1); else if (firstN <= 2) lvl = Math.max(0, lvl - 1);
  save.lvl[g.mode.id] = lvl;
  const before = unlockedN(); save.rounds++; const after = unlockedN();
  let reward, newId = null;
  if (after > before) {
    const k = UNLOCKS[after - 1]; newId = k.startsWith('c:') ? k.slice(2) : k;
    if (COLOR_IDS.includes(newId)) outfit.color = newId; else outfit[ITEMS[newId].slot] = newId;
    rerenderMons();
    reward = { emoji: itemIcon(newId), label: 'Quà mới: ' + itemName(newId) + '!' };
  } else reward = { emoji: '💖', label: 'Mon Mon yêu bé!' };
  persist();
  const title = stars === 3 ? 'Siêu giỏi!' : stars === 2 ? 'Giỏi quá!' : 'Mon Mon no rồi!';
  const dots = g.first.map(f => f ? `<i>${Kit.STAR_SVG(true)}</i>` : `<i class="ok">${icon('check')}</i>`).join('');
  const m = Kit.result({
    top: '<div class="mon-host res-host e-happy"></div>', title, stars, reward,
    text: `<span class="res-dots">${dots}</span>`,
    say: title + (newId ? ' Bé nhận được ' + itemName(newId) + '!' : ' Mon Mon no căng bụng rồi!'),
    buttons: [
      { label: 'Trò khác', icon: 'home', cls: 'white', onClick: () => { endGame(); renderModes(); show('modes'); } },
      newId ? { label: HANGER + ' Tủ đồ', cls: 'teal', onClick: () => openCloset('modes') } : null,
      { label: 'Chơi tiếp', icon: 'next', cls: 'ok', onClick: () => startRound(g.mode) },
    ].filter(Boolean),
  });
  new Mon($('.res-host', m.panel), { static: true });
}

/* =========================================================
   LAYOUT
   ========================================================= */
function layoutPlay() {
  if (!G) return;
  const st = $('#stage'), W = st.clientWidth, H = st.clientHeight;
  if (!W || !H) return;
  const m = Math.min(W, H), fr = G.mode.frame, rows = G.mode.trayRows;
  const pad = Math.round(clamp(m * .03, 8, 22));
  const land = W > H * 1.05;
  const tp = Math.round(clamp(m * .022, 7, 14));
  const bfs = Math.round(clamp(m * .055, 21, 34));
  const btnH = Math.round(bfs * 2.45 + 8);
  let cell, tr = {}, MA;
  if (land) {
    const faW = Math.min(W * .47, 5 * 118 + 2 * tp + 2 * pad);
    const split = W - faW;
    cell = Math.floor(Math.min((faW - 1.5 * pad - 2 * tp) / 5, (H - 2.6 * pad - btnH - 2 * tp) / rows, 118));
    tr.w = 5 * cell + 2 * tp; tr.h = rows * cell + 2 * tp;
    const blockH = tr.h + pad * .8 + btnH;
    tr.x = split + pad * .5 + (faW - 1.5 * pad - tr.w) / 2; tr.y = Math.max(pad * .6, (H - blockH) / 2);
    MA = { x: pad, y: pad * .6, w: split - pad * 1.5, h: H - pad * 1.2 };
  } else {
    cell = Math.floor(Math.min((W - 2 * pad - 2 * tp) / 5, (H * .42 - 2 * tp) / rows, 108));
    tr.w = 5 * cell + 2 * tp; tr.h = rows * cell + 2 * tp;
    tr.x = (W - tr.w) / 2; tr.y = H - pad - btnH - pad * .8 - tr.h;
    MA = { x: pad, y: pad * .5, w: W - 2 * pad, h: tr.y - pad * 1.3 };
  }
  G.L = { cell };
  // monster area: side (monster | panels) or stack (panels over monster)
  const bp = Math.round(clamp(m * .022, 7, 16)), HEAD = 1.7, GC = .15, cMax = Math.round(clamp(m * .058, 40, 60)), BW = 6, BELLYB = 8;
  const monMax = m > 600 ? Math.min(m * .62, 560) : 9999;
  const pW = c => 5 * c + BW + 2 * bp + BELLYB, pH = c => 2 * bp + (HEAD + GC + fr) * c + BW + BELLYB;
  let side, stack;
  {
    let iw = clamp(MA.w * .42, pW(18), pW(cMax));
    const mw = Math.min(MA.w - iw - pad, MA.h * ASPECT, monMax);
    iw = Math.min(MA.w - mw - pad, pW(cMax));
    const c = Math.min((iw - BW - 2 * bp - BELLYB) / 5, (MA.h - pad * .8 - 2 * (2 * bp + BW + BELLYB)) / (2 * (HEAD + GC + fr)), cMax);
    side = { c: Math.floor(c), mw };
  }
  {
    const pw = Math.min((MA.w - pad) / 2, pW(cMax));
    const c = Math.floor(Math.min((pw - BW - 2 * bp - BELLYB) / 5, cMax));
    const ph = pH(c), mh = MA.h - ph - pad * .6;
    stack = { c, mw: Math.min(MA.w * .92, mh * ASPECT, monMax), ph };
  }
  const useStack = stack.c >= 20 && (stack.mw > side.mw * 1.04 || side.c < 18);
  const c = useStack ? stack.c : side.c;
  const PW = pW(c), PH = pH(c);
  let mon, bub, bel;
  if (useStack) {
    const mw = stack.mw, mh = mw / ASPECT;
    const rowW = 2 * PW + pad, x0 = MA.x + (MA.w - rowW) / 2;
    bub = { x: x0, y: MA.y, w: PW, h: PH }; bel = { x: x0 + PW + pad, y: MA.y, w: PW, h: PH };
    const rest = MA.h - PH - pad * .6;
    mon = { x: MA.x + (MA.w - mw) / 2, y: MA.y + PH + pad * .6 + Math.max(0, (rest - mh) / 2), w: mw, h: mh };
  } else {
    const mw = Math.min(side.mw, MA.w - PW - pad), mh = mw / ASPECT;
    const gw = mw + pad + PW, x0 = MA.x + (MA.w - gw) / 2;
    mon = { x: x0, y: MA.y + (MA.h - mh) / 2, w: mw, h: mh };
    const colH = 2 * PH + pad * .8, y0 = MA.y + (MA.h - colH) / 2;
    bub = { x: x0 + mw + pad, y: y0, w: PW, h: PH }; bel = { x: x0 + mw + pad, y: y0 + PH + pad * .8, w: PW, h: PH };
  }
  const put = (e, r) => { e.style.left = r.x + 'px'; e.style.top = r.y + 'px'; e.style.width = r.w + 'px'; e.style.height = r.h + 'px'; };
  put($('#pMon'), mon);
  const b = $('#bubble'), bl = $('#belly');
  [b, bl].forEach(p => { p.style.setProperty('--c', c + 'px'); p.style.setProperty('--bp', bp + 'px'); });
  put(b, bub); put(bl, bel);
  b.classList.toggle('side', !useStack); b.classList.toggle('stack', useStack);
  const mouthY = mon.y + (230 - VB.y) / VB.h * mon.h, mouthX = mon.x + mon.w / 2;
  b.style.setProperty('--ty', clamp(mouthY - bub.y, 28, PH - 28) + 'px');
  b.style.setProperty('--tx', clamp(mouthX - bub.x, 30, PW - 30) + 'px');
  const tray = $('#tray');
  put(tray, tr); tray.style.setProperty('--cell', cell + 'px'); tray.style.setProperty('--tp', tp + 'px');
  const bd = $('#bDone');
  bd.style.fontSize = bfs + 'px';
  bd.style.left = (tr.x + tr.w / 2) + 'px'; bd.style.top = (tr.y + tr.h + pad * .8) + 'px'; bd.style.transform = 'translateX(-50%)';
  bd.style.translate = '';
  const say = $('#say'); say.style.left = (mon.x + mon.w / 2) + 'px'; say.style.top = (mon.y + mon.h * .1) + 'px';
  placeItems();
  if (handAnim) showHand();
}
window.addEventListener('resize', () => { if (screen === 'play') layoutPlay(); });

/* =========================================================
   CLOSET
   ========================================================= */
function openCloset(from) {
  closetFrom = from;
  if (G) endGame();
  renderCloset(); show('closet');
  CM.act('a-hop', 600);
  talk('Tủ đồ của Mon Mon!');
}
function renderCloset() {
  const newOnes = new Set(UNLOCKS.slice(save.seen, unlockedN()).map(k => k.replace('c:', '')));
  save.seen = unlockedN(); persist(); refreshClosetBadge();
  $('#mid').innerHTML = `<div class="cl-pill">${HANGER}<span>${unlockedN()}/${UNLOCKS.length}</span></div>`;
  const tile = (id, slot) => {
    const open = isOpen(id), on = slot === 'color' ? outfit.color === id : outfit[slot] === id;
    return `<button class="tile${open ? '' : ' locked'}${on ? ' on' : ''}${newOnes.has(id) ? ' new' : ''}" data-id="${id}" data-slot="${slot}" aria-label="${itemName(id)}">${itemIcon(id)}${open ? '' : `<span class="lk">${icon('lock')}</span>`}</button>`;
  };
  const none = slot => `<button class="tile none${outfit[slot] ? '' : ' on'}" data-id="" data-slot="${slot}" aria-label="Bỏ ra">${icon('close')}</button>`;
  $('#clPanel').innerHTML = `
    <div class="cl-sec"><h3>Mũ &amp; nơ</h3><div class="cl-grid">${none('head')}${HEAD_IDS.map(i => tile(i, 'head')).join('')}</div></div>
    <div class="cl-sec"><h3>Kính</h3><div class="cl-grid">${none('face')}${FACE_IDS.map(i => tile(i, 'face')).join('')}</div></div>
    <div class="cl-sec"><h3>Màu lông</h3><div class="cl-grid">${COLOR_IDS.map(i => tile(i, 'color')).join('')}</div></div>`;
  $$('#clPanel .tile').forEach(t => t.onclick = () => tapTile(t));
}
function tapTile(t) {
  const id = t.dataset.id, slot = t.dataset.slot;
  if (t.classList.contains('locked')) {
    sfx.bad(); bounce(t, 'shake');
    Kit.toast('Chơi thêm để mở khóa nhé!'); talk('Chơi thêm để mở quà nhé!');
    CM.expr('e-worry', 900);
    return;
  }
  if (slot === 'color') outfit.color = id;
  else outfit[slot] = (outfit[slot] === id || !id) ? null : id;
  persist();
  const wasNew = $$('#clPanel .tile.new').map(x => x.dataset.id);
  rerenderMons(); renderCloset();
  wasNew.forEach(i => { const x = $(`#clPanel .tile[data-id="${i}"]`); if (x) x.classList.add('new'); });
  CM.act('a-hop', 600); CM.expr('e-happy', 1000);
  sfx.sparkle();
  const r = CM.rect(); Kit.sparkle(r.left + r.width / 2, r.top + r.height * .25, { n: 10 });
  talk(id && (slot === 'color' || outfit[slot] === id) ? itemName(id) + '! Đẹp quá!' : 'Đẹp quá!');
}

/* =========================================================
   BOOT
   ========================================================= */
refreshClosetBadge();
Kit.music.start('bouncy');
setTimeout(() => TM.act('a-hop', 600), 400);
window.__mm = { get G() { return G; }, save, outfit, monSVG, ITEMS, BODY, itemIcon };
})();
</script>
