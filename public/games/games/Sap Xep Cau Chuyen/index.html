<!DOCTYPE html>
<html lang="vi" data-game="sapxep">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8e6bd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sắp Xếp Câu Chuyện</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* ===== BéVui Kit 5 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','Segoe UI Symbol',sans-serif;
  --ink:#33305a; --ink-soft:#6c6896;
  --c1:#4f8cff; --c1d:#2f63d6; --c1l:#e2edff;
  --c2:#ff7a9c; --c2d:#dd4f76;
  --ok:#35c46a; --okd:#1f9a4d;
  --gold:#ffc93c; --goldd:#e19a00;
  --bad:#ff8a65;
  --bg1:#bfe3ff; --bg2:#fff1c9;
  --panel:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:76px;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-play{touch-action:none}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-right{display:flex;gap:10px;align-items:center;margin-left:auto;flex:0 0 auto}
.k-bar .k-extra{display:flex;gap:10px}
.k-bar .k-extra:empty{display:none}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(30,40,90,.16),0 10px 18px rgba(30,40,90,.10);
  transition:transform .12s ease,box-shadow .12s ease,opacity .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(30,40,90,.16),0 4px 8px rgba(30,40,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn .emo{font-size:30px}
.ibtn.off{color:#b4b2cc}
.ibtn .badge,.btn .badge{position:absolute;top:-8px;right:-8px;min-width:25px;height:25px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 15px/25px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.k-back{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(30,40,90,.12)}
.k-back:active{box-shadow:0 1px 0 var(--c1d)}
@media (max-height:500px),(max-width:430px){
  .ibtn{width:50px;height:50px;border-radius:16px}
  .ibtn svg{width:27px;height:27px}
  .k-bar,.k-bar .k-right,.k-bar .k-extra{gap:8px}
  .k-bar{padding-top:calc(8px + var(--safe-t));padding-bottom:6px}
}
/* narrow portrait: middle slot drops to its own row when it has content */
@media (max-width:600px) and (orientation:portrait){
  .k-bar{flex-wrap:wrap;row-gap:8px}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:var(--tap);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(20,30,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(20,30,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.15em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d5d9ee;color:var(--c1d);text-shadow:none}
.btn.purple{--b:#9b6bff;--bd:#7246dc}
.btn.orange{--b:#ff9a3c;--bd:#db7412}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.glow{animation:k-glow 1.3s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(42px,9.5vmin,100px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(20,30,80,.25)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.05}

/* ---- tiles (mode / level pickers) ---- */
.k-tiles{display:grid;gap:clamp(10px,2vmin,18px);width:min(1000px,100%);grid-template-columns:repeat(auto-fit,minmax(min(150px,42vw),1fr))}
.k-tile{--tc:var(--c1);--tcd:var(--c1d);--tcl:var(--c1l);position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:12px 10px 12px;
  box-shadow:0 7px 0 rgba(30,40,90,.14),0 12px 20px rgba(30,40,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:800;color:var(--ink);font-size:clamp(16px,2.6vmin,22px);line-height:1.1;text-align:center;transition:transform .15s;min-height:var(--tap)}
.k-tile:active{transform:translateY(4px) scale(.98)}
.k-tile .ti{font-size:clamp(38px,7vmin,62px);width:1.55em;height:1.55em;display:grid;place-items:center;border-radius:50%;background:var(--tcl)}
.k-tile .ti svg{width:72%;height:72%}
.k-tile small{display:block;font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .st{display:flex;gap:1px;justify-content:center}
.k-tile.sel{background:var(--tc);color:#fff;box-shadow:0 7px 0 var(--tcd),0 0 0 4px #fff}
.k-tile.sel small{color:rgba(255,255,255,.9)}
.k-tile.sel .ti{background:rgba(255,255,255,.3)}
.st{display:inline-flex;gap:1px;justify-content:center;align-items:center}
.k-mini-star{display:inline-block}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e3e2f2;display:block}
.k-mini-star.on svg{color:var(--gold)}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(30,30,80,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px;overflow:auto}
.k-panel{position:relative;width:min(580px,94vw);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(30,40,90,.14),0 30px 60px rgba(30,40,90,.3);animation:k-panel .34s cubic-bezier(.2,1.5,.4,1) both;overscroll-behavior:contain}
.k-panel.wide{width:min(900px,96vw)}
.k-panel h2{margin:0 0 4px;font-size:clamp(28px,6vmin,46px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(54px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars .mid svg{margin-top:-16px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}
.k-result .k-hero{width:clamp(96px,22vmin,140px);margin:-80px auto 0;display:block}
.k-panel.k-result{overflow:visible;margin-top:60px}
@media (max-height:500px){
  .k-panel{padding:16px 18px 16px;border-radius:26px}
  .k-btns{margin-top:12px}
  .k-stars svg{width:52px}
  .k-result .k-hero{width:80px;margin-top:-56px}
  .k-panel.k-result{margin-top:40px}
}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,58px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(30,40,90,.12),0 12px 24px rgba(30,40,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---- speech bubble with replay ---- */
.k-say{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 8px 6px 16px;font-weight:800;color:var(--ink);
  font-size:clamp(17px,2.8vmin,24px);box-shadow:0 5px 0 rgba(30,40,90,.12);line-height:1.1;max-width:100%}
.k-say .ibtn{width:44px;height:44px;border-radius:14px;background:var(--c1l);box-shadow:none}
.k-say .ibtn svg{width:24px;height:24px}

/* ---- tutorial hand ---- */
.k-hand{position:fixed;left:0;top:0;z-index:85;width:74px;height:74px;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.k-hand svg{width:100%;height:100%}

/* ---- decorative ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:50%;height:150%;left:15%;bottom:20%}
.k-cloud::after{width:38%;height:120%;right:14%;bottom:25%}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-panel{0%{transform:scale(.88) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-glow{0%,100%{box-shadow:0 7px 0 var(--bd),0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 7px 0 var(--bd),0 0 0 10px rgba(255,255,255,.55)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-22%) scale(.94,1.08)}75%{transform:translateY(0) scale(1.06,.94)}}
@keyframes k-float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-22px)}}
@keyframes k-drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-wiggle{animation:k-wiggle .5s ease-in-out}
.k-shake{animation:k-shake .45s ease-in-out}
.k-jump{animation:k-jump .6s cubic-bezier(.3,1.4,.5,1)}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3s ease-in-out infinite}
.k-blink{transform-box:fill-box;transform-origin:50% 50%;animation:k-blink 4.4s infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.btn.glow,.k-breathe{animation:none!important}}
</style>
<style>
:root{--c1:#8e6bd8;--c1d:#6a47b8;--c1l:#efe7ff;--c2:#ff8a5c;--c2d:#e0603a;--ink:#3f2e5c;--ink-soft:#7d6a9a}
body{background:radial-gradient(ellipse 80% 50% at 50% 112%,rgba(255,255,255,.6),transparent 70%),linear-gradient(170deg,#fff0d4 0%,#ffe1ec 50%,#e3dbff 100%)}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco span{position:absolute;color:#fff;opacity:.6;font-weight:800;animation:floaty ease-in-out infinite alternate;text-shadow:0 3px 0 rgba(142,107,216,.15)}
@keyframes floaty{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-28px) rotate(10deg)}}
.screen{z-index:1}

/* ---------- owl ---------- */
.owl{display:block;overflow:visible}
.owl .o-body,.owl .o-breathe{transform-box:view-box;transform-origin:110px 228px}
.owl .o-breathe{animation:k-breathe 3.4s ease-in-out infinite}
.owl .o-head{transform-box:view-box;transform-origin:110px 150px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.owl .o-eyes{transform-box:view-box;transform-origin:110px 102px;animation:k-blink 4.8s infinite}
.owl .o-pup{transition:transform .18s ease-out}
.owl .o-wl{transform-box:view-box;transform-origin:52px 124px}
.owl .o-wr{transform-box:view-box;transform-origin:168px 124px}
.owl .o-happy,.owl .o-brows,.owl .o-beak2{opacity:0;transition:opacity .15s}
.owl.happy .o-happy,.owl.happy .o-beak2{opacity:1}.owl.happy .o-eyes{opacity:0}
.owl.hmm .o-brows{opacity:1}.owl.hmm .o-head{transform:rotate(-9deg)}
.owl.talk .o-beak2{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{from{opacity:0}to{opacity:1}}

/* ---------- scene animations (only where a parent is .live) ---------- */
.sc{display:block;width:100%;height:100%;overflow:hidden}
.sc .an{transform-box:fill-box;transform-origin:50% 50%}
.live .an.bob{animation:a-bob 1.6s ease-in-out infinite}
.live .an.fly{animation:a-fly 2.2s ease-in-out infinite alternate}
.live .an.sway{transform-origin:50% 0;animation:a-sway 1.8s ease-in-out infinite alternate}
.live .an.fall{animation:a-fall 1.1s linear infinite}
.live .an.rise{animation:a-rise 1.9s ease-out infinite}
.live .an.shake{animation:a-shake .24s linear infinite}
.live .an.spin{animation:a-spin 10s linear infinite}
.live .an.pulse{animation:a-pulse .9s ease-in-out infinite alternate}
.live .an.drift{animation:a-drift 3s ease-in-out infinite alternate}
.live .an.flick{transform-origin:50% 100%;animation:a-flick .32s ease-in-out infinite alternate}
.live .an.bubble{animation:a-bub .9s ease-in-out infinite}
.live .an.pop{animation:a-pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes a-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes a-fly{0%{transform:translate(-6px,3px) rotate(-6deg)}100%{transform:translate(6px,-4px) rotate(6deg)}}
@keyframes a-sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes a-fall{from{transform:translateY(-10px);opacity:.3}50%{opacity:1}to{transform:translateY(10px);opacity:.3}}
@keyframes a-rise{from{transform:translateY(4px);opacity:0}30%{opacity:1}to{transform:translateY(-14px);opacity:0}}
@keyframes a-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,.5px) rotate(-1deg)}75%{transform:translate(1.5px,-.5px) rotate(1deg)}}
@keyframes a-spin{to{transform:rotate(360deg)}}
@keyframes a-pulse{from{transform:scale(.9)}to{transform:scale(1.12)}}
@keyframes a-drift{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
@keyframes a-flick{from{transform:scale(.9,.85)}to{transform:scale(1.1,1.15)}}
@keyframes a-bub{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-4px);opacity:1}}
@keyframes a-pop{0%{transform:scale(0) translateY(20px)}100%{transform:none}}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.4vmin,14px);padding:calc(var(--bar-h) + 2px) 16px calc(16px + var(--safe-b))}
.t-hero{position:relative;width:clamp(220px,46vmin,420px);aspect-ratio:1/1;flex:0 0 auto}
.t-hero .owl{position:absolute;left:17%;bottom:0;width:66%;height:auto;cursor:pointer}
.t-card{position:absolute;top:2%;width:31%;aspect-ratio:4/3;border-radius:11%;background:#fff;padding:2.2%;box-shadow:0 5px 0 rgba(90,50,140,.16),0 10px 18px rgba(90,50,140,.14);animation:tcard 3.2s ease-in-out infinite alternate;cursor:pointer}
.t-card .sc{border-radius:9%}
.t-card b{position:absolute;top:-16%;left:-9%;width:30%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(13px,3vmin,24px);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15);line-height:1}
.t-card:nth-child(1){left:0;--r:-9deg;animation-delay:-.4s}
.t-card:nth-child(2){left:34.5%;top:-4%;--r:0deg;animation-delay:-1.4s}
.t-card:nth-child(3){left:69%;--r:9deg;animation-delay:-2.2s}
@keyframes tcard{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-8px) rotate(calc(var(--r) * .5))}}
.t-arrow{position:absolute;top:14%;width:6%;color:#fff;font-weight:800;font-size:clamp(14px,3.4vmin,28px);text-align:center;text-shadow:0 2px 0 var(--c1d)}
.t-txt{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vmin,22px)}
.k-logo{--c1d:#5b3aa6}
.k-logo .l1{color:#fff}.k-logo .l2{color:#ffd23f;font-size:1.02em}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:16px}
#bLib{--b:var(--gold)}
@media (min-aspect-ratio:6/5){#title{flex-direction:row;gap:5vw}.t-hero{width:min(64vh,460px)}}

/* ---------- select ---------- */
#select{justify-content:center;gap:clamp(8px,2.2vmin,22px);padding:calc(var(--bar-h) + 4px) 14px calc(12px + var(--safe-b))}
.cnts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vmin,20px);width:min(900px,100%)}
.tile{--tc:var(--c1);--tcd:var(--c1d);--tcl:var(--c1l);border:none;cursor:pointer;border-radius:26px;background:#fff;position:relative;color:var(--ink);
  box-shadow:0 7px 0 rgba(90,50,140,.14),0 12px 22px rgba(90,50,140,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s;padding:12px 8px 10px;min-height:56px}
.tile:active{transform:translateY(5px)}
.tile b{font-size:clamp(19px,3.4vmin,30px);line-height:1;color:var(--tcd)}
.tile .mini{display:flex;gap:4px;justify-content:center}
.tile .mini i{width:clamp(20px,4.6vmin,40px);aspect-ratio:3/4;border-radius:6px;display:grid;place-items:center;color:#fff;font:800 clamp(12px,2.6vmin,22px)/1 var(--font);font-style:normal;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.ths{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,1.8vmin,16px);width:min(1100px,100%)}
.ths .tile{border-radius:22px;padding:10px 4px 8px}
.ths .tile .ti{font-size:clamp(30px,6vmin,52px);width:1.5em;height:1.5em;display:grid;place-items:center;border-radius:50%;background:var(--tcl)}
.ths .tile b{font-size:clamp(14px,2.5vmin,21px);text-align:center}
.sec-t{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--ink-soft);font-size:clamp(15px,2.4vmin,20px);margin-bottom:-4px;width:min(1100px,100%);padding-left:6px}
.sec-t .emo{font-size:1.2em}
@media (max-aspect-ratio:1/1){.ths{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{padding:16px 6px 12px;gap:8px}.tile .mini{gap:3px}.tile .mini i{width:clamp(17px,5vw,40px)}.tile b{font-size:clamp(21px,5.6vw,32px)}.ths .tile .ti{font-size:clamp(38px,10vw,60px)}.ths .tile b{font-size:clamp(15px,4.1vw,22px)}.cnts,.ths{width:min(620px,100%)}.sec-t{width:min(620px,100%)}}
@media (max-aspect-ratio:1/1) and (min-height:700px){#select{gap:16px}.tile{padding:24px 6px 18px;gap:10px}.ths .tile .ti{font-size:clamp(44px,12vw,66px)}}
@media (min-width:900px) and (min-height:640px){#select{gap:18px}.cnts{width:min(1000px,100%)}.tile{padding:22px 10px 18px;gap:10px;border-radius:30px}.tile .mini i{width:clamp(30px,5vmin,48px)}.tile b{font-size:clamp(26px,4vmin,38px)}.ths .tile .ti{font-size:clamp(40px,8vmin,80px)}.ths .tile b{font-size:clamp(17px,2.8vmin,25px)}.sec-t{width:min(1100px,100%)}}
@media (max-height:520px) and (orientation:landscape){#select .k-h,#select .sec-t{display:none}.tile{padding:8px 6px 6px;gap:4px}.ths .tile .ti{font-size:clamp(26px,9vh,40px)}}

/* ---------- top bar mid ---------- */
.pbar{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.pips{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:999px;box-shadow:0 4px 0 rgba(90,50,140,.12);flex:0 0 auto}
.pips i{width:20px;height:20px;border-radius:50%;background:#ece4f6;display:grid;place-items:center;font-style:normal;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s}
.pips i.cur{background:#e6dbff;box-shadow:0 0 0 3px var(--c1);animation:k-pulse 1.2s infinite}
.pips i.ok{background:#ffd23f;transform:scale(1.1);color:#e89a00}.pips i.ok2{background:#9fe0b4;color:#1f9a4d}
.pips i svg{width:14px;height:14px}
.stitle{border:none;cursor:pointer;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px 6px 10px;font-weight:800;color:var(--c1d);font-size:clamp(14px,2.3vmin,19px);box-shadow:0 4px 0 rgba(90,50,140,.12);min-width:0;max-width:46vw;min-height:40px}
.stitle span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stitle .emo{font-size:1.2em}

/* ---------- play ---------- */
.pv{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;display:grid;justify-content:center;align-content:center;padding:4px 12px calc(10px + var(--safe-b));gap:var(--sg,12px);--pad:6px}
.pv.rows{grid-template-columns:auto auto}
.pv.rows .owlbox{grid-column:1;grid-row:1/3;align-self:end;flex-direction:column;align-items:center}
.pv.rows .strip{grid-column:2;grid-row:1}
.pv.rows .tray{grid-column:2;grid-row:2}
.pv.cols{grid-template-columns:auto auto}
.pv.cols .owlbox{grid-column:1/3;grid-row:1;flex-direction:row;align-items:center;height:var(--oh)}
.pv.cols .strip,.pv.cols .tray{grid-row:2;flex-direction:column}
.pv.cols .strip{grid-column:1}.pv.cols .tray{grid-column:2}
.owlbox{position:relative;display:flex;gap:8px;min-width:0}
.owlbox .owl{width:var(--ow,100px);height:auto;flex:0 0 auto;cursor:pointer;touch-action:none}
.pv.cols .owlbox .owl{width:auto;height:100%}
.bub{position:relative;background:#fff;border-radius:18px;padding:8px 14px;font-weight:800;color:var(--ink);font-size:var(--bf,18px);line-height:1.15;box-shadow:0 5px 0 rgba(90,50,140,.13);
  transition:opacity .25s,transform .3s cubic-bezier(.3,1.5,.5,1);pointer-events:none;display:flex;align-items:center;gap:8px}
.bub .emo{font-size:1.3em}
.bub::before{content:"";position:absolute;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px}
.pv.cols .bub{flex:0 1 auto;max-width:calc(100% - var(--oh) - 10px)}
.pv.cols .bub::before{left:-6px;top:calc(50% - 8px)}
.pv.rows .bub{position:absolute;left:0;bottom:calc(100% + 10px);width:max-content;max-width:calc(var(--ow,100px) + 14px);z-index:6;opacity:0;transform:translateY(10px) scale(.7);transform-origin:30% 100%;padding:7px 10px}
.pv.rows .bub.on{opacity:1;transform:none}
.pv.rows .bub::before{left:calc(50% - 8px);bottom:-6px}
.bub.pop{animation:bubPop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bubPop{0%{transform:scale(.7)}100%{transform:scale(1)}}

.strip{position:relative;display:flex;gap:var(--sg,12px);padding:var(--spy,16px) var(--spx,10px);background:linear-gradient(180deg,#4a3470,#35244f);border-radius:18px;box-shadow:0 7px 0 rgba(60,30,90,.2),0 12px 22px rgba(60,30,90,.18)}
.strip::before,.strip::after{content:"";position:absolute;left:12px;right:12px;height:calc(var(--spy,16px)*.42);border-radius:3px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 9px,transparent 9px 20px);opacity:.75}
.strip::before{top:calc(var(--spy,16px)*.29)}.strip::after{bottom:calc(var(--spy,16px)*.29)}
.pv.cols .strip::before,.pv.cols .strip::after{top:12px;bottom:12px;left:auto;right:auto;height:auto;width:calc(var(--spx,16px)*.42);background:repeating-linear-gradient(180deg,rgba(255,255,255,.8) 0 9px,transparent 9px 20px)}
.pv.cols .strip::before{left:calc(var(--spx,16px)*.29)}.pv.cols .strip::after{right:calc(var(--spx,16px)*.29)}
.slot{position:relative;width:var(--sw);height:var(--sh);border-radius:14px;border:3px dashed rgba(255,255,255,.5);background:rgba(255,255,255,.08);display:grid;place-items:center;transition:transform .15s,border-color .15s,background .15s;flex:0 0 auto}
.slot .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--ch)*.05);color:rgba(255,255,255,.8);font-weight:800;font-size:calc(var(--ch)*.42);line-height:1;pointer-events:none}
.slot .ph i{display:flex;gap:calc(var(--ch)*.04)}
.slot .ph i b{width:calc(var(--ch)*.075);height:calc(var(--ch)*.075);border-radius:50%;background:currentColor;opacity:.8}
.nb{position:absolute;z-index:4;top:calc(var(--nbs)*-.36);left:calc(var(--nbs)*-.36);width:var(--nbs,30px);height:var(--nbs,30px);border-radius:50%;background:var(--nc);color:#fff;font:800 calc(var(--nbs,30px)*.58)/1 var(--font);
  display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.18);pointer-events:none;transition:background .3s}
.slot.hot{border-color:#ffd23f;border-style:solid;background:rgba(255,210,63,.25);transform:scale(1.05)}
.slot.want{animation:want 1s ease-in-out infinite}
@keyframes want{0%,100%{border-color:rgba(255,255,255,.5)}50%{border-color:#ffd23f;background:rgba(255,210,63,.25)}}
.slot.ok{border-style:solid;border-color:#5be08f}
.slot.ok .nb{background:#33bb66}
.tray{display:flex;gap:var(--sg,12px);padding:10px;background:rgba(255,255,255,.6);border-radius:20px;box-shadow:inset 0 -4px 0 rgba(90,50,140,.06)}
.nest{width:var(--sw);height:var(--sh);border-radius:14px;border:3px dashed rgba(142,107,216,.22);display:grid;place-items:center;flex:0 0 auto}
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:12px;background:#fff;padding:3px;cursor:grab;touch-action:none;
  box-shadow:0 4px 0 rgba(60,30,90,.2),0 8px 14px rgba(60,30,90,.14);transform:rotate(var(--rot,0deg));transition:box-shadow .2s}
.card .sc{border-radius:9px;pointer-events:none}
.slot .card{--rot:0deg}
.card.lifted{opacity:0}
.card.ghost{position:fixed;z-index:60;margin:0;pointer-events:none;cursor:grabbing;box-shadow:0 18px 30px rgba(60,30,90,.35);transition:none}
.card.fixed{cursor:default}
.card .tk{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:#33bb66;color:#fff;display:none;place-items:center;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.card .tk svg{width:16px;height:16px}
.card.fixed .tk{display:grid;animation:k-pop .4s cubic-bezier(.2,1.8,.4,1)}
.card.bad::after{content:"";position:absolute;inset:0;border-radius:12px;background:rgba(255,120,120,.28);box-shadow:inset 0 0 0 3px #ff8a8a}
.card.shake{animation:k-shake .45s ease-in-out}
.card.snap{animation:snap .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes snap{0%{transform:scale(.88)}100%{transform:scale(1)}}
.card.jump{animation:cjump .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes cjump{0%,100%{transform:none}40%{transform:translateY(-14%) scale(1.06)}}
.card.glow{animation:cglow 1s ease-in-out infinite;z-index:3}
@keyframes cglow{0%,100%{box-shadow:0 4px 0 rgba(60,30,90,.2),0 0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 4px 0 rgba(60,30,90,.2),0 0 0 7px rgba(255,210,63,.95),0 0 26px 8px rgba(255,210,63,.6)}}

/* ---------- cinema ---------- */
#cine{position:fixed;left:0;right:0;bottom:0;top:var(--bar-h);z-index:30;display:none;overflow:hidden;
  background:radial-gradient(ellipse 80% 70% at 50% 42%,#5a3a8a,#24143f 78%)}
#cine.on{display:block;animation:k-fade .3s ease}
.cstage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 12px calc(10px + var(--safe-b))}
.cscreen{position:relative;width:var(--csw,400px);height:var(--csh,300px);border-radius:14px;overflow:hidden;background:#1a0f2e;flex:0 0 auto;
  box-shadow:0 0 0 5px #ffd23f,0 0 0 9px #b97a2e,0 0 40px 10px rgba(255,210,63,.25),0 24px 40px rgba(0,0,0,.5)}
.cscreen .layer{position:absolute;inset:0;will-change:transform,opacity}
.cconn{position:absolute;z-index:3;top:10px;left:10px;display:flex;align-items:center;gap:8px;background:var(--nc,#ff6b8b);color:#fff;border-radius:999px;padding:4px 14px 4px 4px;
  font-weight:800;font-size:var(--capf,20px);box-shadow:0 4px 0 rgba(0,0,0,.2);border:3px solid #fff}
.cconn b{width:1.55em;height:1.55em;border-radius:50%;background:#fff;color:var(--nc,#ff6b8b);display:grid;place-items:center;line-height:1}
.cconn.in{animation:k-pop .45s cubic-bezier(.2,1.6,.4,1)}
.ccap{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:22px 16px 12px;background:linear-gradient(rgba(20,10,40,0),rgba(20,10,40,.78));color:#fff;font-weight:800;font-size:var(--capf,20px);text-align:center;line-height:1.18;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.ccap.in{animation:capIn .5s ease both}
#cine.tall .ccap{position:relative;left:auto;right:auto;bottom:auto;width:var(--csw);background:none;padding:2px 6px;min-height:3.6em;display:flex;align-items:center;justify-content:center;font-size:calc(var(--capf,20px)*1.12)}
@keyframes capIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.cend{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(30,15,60,.45);animation:k-fade .4s ease}
.cend .the{font-weight:800;color:#fff;font-size:calc(var(--capf,20px)*2.2);-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c1d);animation:k-pop .6s cubic-bezier(.2,1.6,.4,1) both}
.cend .cst{display:flex;gap:4px}
.cend .cst svg{width:calc(var(--capf,20px)*2.4);height:auto;transform:scale(0);filter:drop-shadow(0 3px 0 rgba(160,100,0,.3))}
.cend .cst svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.crow{display:flex;align-items:center;justify-content:center;min-height:var(--rowh,64px);flex:0 0 auto}
.cthumbs{display:flex;gap:8px}
.cthumb{position:relative;flex:0 0 auto;width:var(--tw,64px);aspect-ratio:4/3;border-radius:8px;overflow:hidden;opacity:.4;border:3px solid rgba(255,255,255,.4);transition:opacity .3s,transform .3s,border-color .3s;background:#fff}
.cthumb.on{opacity:1;border-color:#ffd23f;transform:translateY(-4px) scale(1.06)}
.cthumb.seen{opacity:.85}
.cthumb i{position:absolute;left:2px;top:2px;font:800 12px/1 var(--font);font-style:normal;color:#fff;background:var(--nc);border-radius:50%;width:17px;height:17px;display:grid;place-items:center}
.cbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.cbtns .btn{font-size:clamp(20px,3.4vmin,30px)}
.curtain{position:absolute;z-index:8;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#cf3a58 0 16px,#b02a47 16px 30px,#c23350 30px 40px);transition:transform 1s cubic-bezier(.65,0,.3,1);pointer-events:none;box-shadow:inset 0 -30px 40px rgba(0,0,0,.25)}
.curtain.l{left:0;border-radius:0 0 40px 0}.curtain.r{right:0;border-radius:0 0 0 40px}
#cine.open .curtain.l{transform:translateX(-90%)}#cine.open .curtain.r{transform:translateX(90%)}
.valance{position:absolute;z-index:9;top:0;left:0;right:0;height:18px;background:radial-gradient(circle at 50% 0,#e0466a 13px,transparent 14px) 0 0/30px 18px repeat-x;pointer-events:none}
.valance::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#e0466a}

/* ---------- library ---------- */
#lib{justify-content:flex-start;padding:calc(var(--bar-h) + 4px) 12px calc(8px + var(--safe-b));gap:6px}
.shelf{flex:1 1 auto;overflow-y:auto;width:min(1120px,100%);padding:4px 6px 30px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.shelf h3{margin:12px 4px 8px;display:flex;align-items:center;gap:8px;font-size:clamp(18px,3vmin,25px);color:var(--tcd,#6a47b8);line-height:1}
.shelf h3 .emo{font-size:1.4em}
.shelf h3 small{margin-left:auto;font-size:.7em;background:#fff;border-radius:999px;padding:4px 10px;color:var(--ink-soft);box-shadow:0 3px 0 rgba(90,50,140,.1)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(132px,21vmin,186px),1fr));gap:12px 10px;padding:8px 6px 14px;border-radius:16px;
  background:linear-gradient(180deg,transparent calc(100% - 12px),#d9a066 calc(100% - 12px),#c48a50 100%)}
.book{border:none;cursor:pointer;background:#fff;border-radius:16px;padding:5px 5px 7px;display:flex;flex-direction:column;align-items:stretch;gap:4px;color:var(--ink);
  box-shadow:0 5px 0 rgba(90,50,140,.14),0 8px 14px rgba(90,50,140,.08);transition:transform .15s;text-align:center}
.book:active{transform:translateY(4px)}
.book .cv{position:relative;width:100%;aspect-ratio:4/3;border-radius:11px;overflow:hidden}
.book .cv .n{position:absolute;right:5px;bottom:5px;background:rgba(40,20,70,.6);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:2px 8px;line-height:1.2}
.book .cv .nw{position:absolute;left:5px;top:5px;background:#ff6b8b;color:#fff;font-weight:800;font-size:11px;border-radius:999px;padding:2px 7px;line-height:1.2}
.book span.tt{font-weight:800;font-size:clamp(14px,2.2vmin,17px);line-height:1.1;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.book .st{margin:0 auto}
.book.jump{animation:k-jump .6s}

/* ---------- reader ---------- */
.rv{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--rg,12px);padding:6px 12px calc(10px + var(--safe-b))}
.rgrid{display:grid;grid-template-columns:repeat(var(--rc,3),auto);gap:var(--rg,12px);justify-content:center}
.rcard{position:relative;border:none;cursor:pointer;background:#fff;border-radius:16px;padding:5px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);
  box-shadow:0 5px 0 rgba(90,50,140,.14),0 8px 14px rgba(90,50,140,.1);transition:transform .2s,box-shadow .2s;--nbs:clamp(26px,calc(var(--cw)*.17),38px)}
.rcard .cv{width:var(--cw);height:calc(var(--cw)*.75);border-radius:11px;overflow:hidden}
.rcard p{margin:0;width:var(--cw);font-weight:700;font-size:var(--rf,16px);line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center;text-align:center}
.rcard.live{transform:translateY(-4px) scale(1.03);box-shadow:0 5px 0 rgba(90,50,140,.14),0 0 0 5px #ffd23f}
.rcard .nb{top:-8px;left:-8px}
.rbar{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.rbar .ibtn{width:56px;height:56px}
@media (max-width:520px){.rbar{gap:7px}.rbar .ibtn{width:50px;height:50px}.rbar .btn{font-size:clamp(17px,4.6vw,24px);padding:.55em .8em .6em}}
</style>
</head>
<body>
<div class="deco" id="deco"></div>

<section class="screen" id="title">
  <div class="t-hero" id="tHero"></div>
  <div class="t-txt">
    <h1 class="k-logo"><span class="l1">Sắp Xếp</span><br><span class="l2">Câu Chuyện</span></h1>
    <div class="t-btns">
      <button class="btn big pulse" id="bPlay" data-icon="play">Chơi</button>
      <button class="btn gold" id="bLib" data-icon="book">Kể lại<span class="badge hidden" id="libN"></span></button>
    </div>
  </div>
</section>

<section class="screen" id="select">
  <div class="k-h">Chọn truyện</div>
  <div class="sec-t"><span class="emo">🃏</span>Số thẻ</div>

/* ---------- scene renderer ---------- */
function parseItem(str) {
  const tk = str.trim().split(/\s+/);
  const it = { h: tk[0], x: +tk[1] || 0, y: +tk[2] || 0, s: tk[3] != null ? +tk[3] : 1, f: 0, r: 0, o: 1, an: '', p: {} };
  for (const t of tk.slice(4)) {
    if (t === 'f') it.f = 1;
    else if (t[0] === '~') it.an = t.slice(1);
    else if (t.includes('=')) { const k = t.indexOf('='); it.p[t.slice(0, k)] = t.slice(k + 1); }
    else if (/^r-?\d/.test(t)) it.r = +t.slice(1);
    else if (/^o[\d.]/.test(t)) it.o = +t.slice(1);
  }
  return it;
}
function itemSVG(it) {
  const shape = it.h[0] === '#', fn = shape && SH[it.h.slice(1)];
  const inner = shape ? (fn ? fn(it.p) : '') : T(it.h, 0, 0, it.s);
  const k = shape ? it.s : 1;
  let tf = `translate(${it.x} ${it.y})`;
  if (it.r) tf += ` rotate(${it.r})`;
  if (it.f || k !== 1) tf += ` scale(${it.f ? -k : k} ${k})`;
  return `<g transform="${tf}"${it.o !== 1 ? ` opacity="${it.o}"` : ''}>${it.an ? `<g class="an ${it.an}">${inner}</g>` : inner}</g>`;
}
const sceneCache = new Map();
function sceneSVG(card) {
  const key = card[0] + '§' + card[1];
  if (!sceneCache.has(key)) sceneCache.set(key, bgSVG(card[0]) + card[1].split('|').filter(Boolean).map(s => itemSVG(parseItem(s))).join('') + `<rect width="200" height="150" fill="url(#gVig)"/>`);
  return `<svg class="sc" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${sceneCache.get(key)}</svg>`;
}

  Kit.result({
    hero: owlSVG('rOwl', 'happy'), title: titles[stars], stars,
    text: one ? `Bé đã xếp xong truyện “${S.list[0].st.t}”` : `Bé xếp đúng ngay ${good}/${n} truyện`,
    reward: S.newSolved ? { emoji: '📚', label: `+${S.newSolved} truyện mới lên kệ` } : null,
    say: one ? `${titles[stars]}` : `${titles[stars]} Bé xếp đúng ngay ${good} trên ${n} truyện.`,
    buttons: [
      { label: 'Chơi lại', icon: 'replay', cls: 'ok', onClick: () => startRound(S.mode) },
      { label: 'Kể lại', icon: 'book', cls: 'gold', onClick: () => leaveRound('lib') },
      ...(one ? [] : [{ label: 'Chọn khác', icon: 'grid', cls: 'white', onClick: () => leaveRound() }]),
    ]
  });
  const ro = $('#rOwl'); if (ro) { Kit.follow($('.o-pup', ro), { r: 4, ref: $('.o-eyes', ro) }); setTimeout(() => tok === S.tok && flap(ro, 4), 500); }
}

/* ---------- cinema ---------- */
const KB = [[1.14, -3, 2, 1.03, 1, 0], [1.03, 1, -1, 1.15, -3, -2], [1.12, 3, -2, 1.02, 0, 1], [1.02, 0, 1, 1.13, 3, 3], [1.13, -2, -3, 1.04, 1, 1]];
function openCine(v, o) {
  const tok = ++C.tok, cards = versionCards(v), n = cards.length, conn = CONN(n);
  const root = $('#cine');
  C.open = true; C.ended = false; C.idx = -1; C.v = v; C.o = o;
  Kit.hand.hide(); clearTimeout(S.idleT);
  root.innerHTML = `<div class="cstage"><div class="cscreen" id="cScr"><div class="cconn" id="cConn"></div><div class="ccap" id="cCap"></div></div>
    <div class="crow"><div class="cthumbs" id="cTh">${cards.map((c, k) => `<div class="cthumb" style="--nc:${NUMC[k]}">${sceneSVG(c)}<i>${k + 1}</i></div>`).join('')}</div><div class="cbtns hidden" id="cBtns"></div></div></div>
    <div class="curtain l"></div><div class="curtain r"></div><div class="valance"></div>`;
  root.classList.remove('open'); root.classList.add('on');
  layoutCine();
  Kit.bar.setBack(o.mode === 'play' ? () => leaveRound() : () => { closeCine(); Kit.bar.setBack(() => Kit.go('lib')); });
  void root.offsetWidth; setTimeout(() => { if (tok === C.tok) { root.classList.add('open'); Kit.sfx.whoosh(); } }, 60);
  const step = () => {
    if (tok !== C.tok) return;
    const i = ++C.idx;
    if (i >= n) return endCine(tok);
    showScene(cards, i, conn[i]);
    playSnd(cards[i][3], i);
    const t0 = performance.now();
    Kit.say(narr(conn[i], cards[i][2]), { rate: .92, silentMs: 2700, onend: () => {
      if (tok !== C.tok) return;
      C.t = setTimeout(step, Math.max(0, 2300 - (performance.now() - t0)) + 450);
    } });
  };
  Kit.say(v.st.t, { silentMs: 900, onend: () => { if (tok === C.tok) C.t = setTimeout(step, 250); } });
}
function showScene(cards, i, conn) {
  const scr = $('#cScr'); if (!scr) return;
  const layer = el('div', 'layer live', sceneSVG(cards[i]));
  scr.insertBefore(layer, $('#cConn'));
  const [s0, x0, y0, s1, x1, y1] = KB[i % KB.length];
  layer.animate([{ transform: `scale(${s0}) translate(${x0}%,${y0}%)` }, { transform: `scale(${s1}) translate(${x1}%,${y1}%)` }], { duration: 5200, easing: 'ease-out', fill: 'forwards' });
  layer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 550, easing: 'ease-out' });
  const old = $$('.layer', scr).slice(0, -1); setTimeout(() => old.forEach(l => l.remove()), 600);
  const cc = $('#cConn'); cc.style.setProperty('--nc', NUMC[i]); cc.innerHTML = `<b>${i + 1}</b>${conn}`; Kit.restart(cc, 'in');
  const cap = $('#cCap'); cap.textContent = cards[i][2]; Kit.restart(cap, 'in');
  $$('#cTh .cthumb').forEach((t, k) => { t.classList.toggle('on', k === i); t.classList.toggle('seen', k < i); });
}
function endCine(tok) {
  C.ended = true;
  const o = C.o, v = C.v, scr = $('#cScr');
  const end = el('div', 'cend', `<div class="the">Hết!</div>${o.stars ? `<div class="cst">${[0, 1, 2].map(k => Kit.STAR_SVG(k < o.stars)).join('')}</div>` : ''}`);
  scr.appendChild(end);
  $$('.cst svg', end).forEach((s, k) => setTimeout(() => { if (tok !== C.tok) return; s.classList.add('on'); if (k < o.stars) Kit.sfx.star(); }, 300 + k * 280));
  Kit.sfx.fanfare();
  const p = Kit.center(scr); Kit.burst(p.x, p.y, { n: 24 });
  Kit.say(o.mode === 'play' ? pick(['Hay quá!', 'Giỏi quá!', 'Tuyệt vời!']) + ' Hết truyện rồi!' : 'Hết truyện rồi!');
  $('#cTh').classList.add('hidden');
  const bx = $('#cBtns'); bx.classList.remove('hidden'); bx.innerHTML = '';
  const mk = (label, icon, cls, fn) => { const b = el('button', 'btn ' + cls, Kit.icon(icon) + `<span>${label}</span>`); b.onclick = fn; bx.appendChild(b); return b; };
  mk('Xem lại', 'replay', 'white', () => openCine(v, o));
  if (o.mode === 'play') { const last = S.i >= S.list.length - 1; mk(last ? 'Xong' : 'Tiếp', last ? 'check' : 'next', 'ok glow', () => { closeCine(); nextStory(); }).id = 'cNext'; }
  else mk('Đóng', 'close', 'ok', () => { closeCine(); Kit.bar.setBack(() => Kit.go('lib')); }).id = 'cNext';
  layoutCine();
}
function closeCine(silent) {
  C.tok++; clearTimeout(C.t);
  if (!C.open) return;
  C.open = false; C.ended = false;
  if (!silent) Kit.stopSpeech();
  const root = $('#cine'); root.classList.remove('on', 'open'); root.innerHTML = '';
}

/* ---------- library ---------- */
function renderLib() {
  const sh = $('#shelf'); sh.innerHTML = '';
  THEMES.forEach(th => {
    const list = STORIES.filter(s => s.th === th.id), got = list.filter(s => sstars[s.id]).length;
    const h = el('h3', '', `<span class="emo">${EMO(th.e)}</span>${th.name}<small>${got}/${list.length}</small>`); h.style.setProperty('--tcd', th.c);
    const g = el('div', 'books');
    list.forEach(s => {
      const st = sstars[s.id] || 0;
      const b = el('button', 'book', `<div class="cv">${sceneSVG(s.c[s.c.length - 1])}<span class="n">${s.c.length} thẻ</span>${st ? '' : '<span class="nw">Mới</span>'}</div><span class="tt">${s.t}</span>${Kit.starRow(st)}`);
      b.dataset.id = s.id; b.setAttribute('aria-label', s.t);
      b.onclick = () => { Kit.restart(b, 'jump'); openRead(s.id); };
      g.appendChild(b);
    });
    sh.append(h, g);
  });
  Kit.bar.setMid(`<span class="stitle"><span class="emo">📚</span><span>${solvedCount()}/${STORIES.length} truyện</span></span>`);
}
Kit.onScreen('lib', { enter(prev) { if (prev !== 'read') $('#shelf').scrollTop = 0; renderLib(); Kit.music.start('gentle'); } });

/* ---------- reader (Kể lại) ---------- */
function openRead(id) {
  R.id = id;
  Kit.go('read', { back: () => Kit.go('lib') });
}
Kit.onScreen('read', {
  enter() { renderRead(); Kit.music.start('gentle'); },
  leave() { closeCine(true); clearTimeout(R.liveT); }
});
function renderRead() {
  const s = BY_ID[R.id], n = s.c.length, conn = CONN(n), g = $('#rgrid'); g.innerHTML = '';
  s.c.forEach((c, k) => {
    const b = el('button', 'rcard', `<div class="cv">${sceneSVG(c)}</div><p>${c[2]}</p><span class="nb" style="--nc:${NUMC[k]}">${k + 1}</span>`);
    b.setAttribute('aria-label', c[2]);
    b.onclick = () => {
      $$('.rcard.live').forEach(x => x.classList.remove('live'));
      b.classList.add('live'); clearTimeout(R.liveT); R.liveT = setTimeout(() => b.classList.remove('live'), 4500);
      playSnd(c[3], k); Kit.say(narr(conn[k], c[2]));
      const p = Kit.center(b); Kit.sparkle(p.x, p.y - p.r.height * .2, { n: 6, spread: p.r.width * .3 });
    };
    g.appendChild(b);
  });
  const st = sstars[s.id] || 0;
  Kit.bar.setMid(`<span class="stitle"><span class="emo">📖</span><span>${s.t}</span></span>${st ? Kit.starRow(st) : ''}`);
  layoutRead();
  Kit.say(s.t + '. Bé chạm vào từng tranh để nghe kể nhé!');
  const kk = $$('.rcard'); kk.forEach((b, k) => b.animate([{ transform: 'translateY(30px) scale(.8)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, delay: k * 80, easing: 'cubic-bezier(.2,1.4,.4,1)', fill: 'backwards' }));
}
function stepRead(d) { const i = STORIES.findIndex(s => s.id === R.id); R.id = STORIES[(i + d + STORIES.length) % STORIES.length].id; Kit.sfx.swish(); renderRead(); }
$('#rPrev').addEventListener('click', () => stepRead(-1));
$('#rNext').addEventListener('click', () => stepRead(1));
$('#rFilm').addEventListener('click', () => openCine(fullV(BY_ID[R.id]), { mode: 'read' }));
$('#rPlay').addEventListener('click', () => startRound('one-' + R.id));

/* ---------- layout ---------- */
function layoutPlay() {
  if (Kit.screen !== 'play') return;
  const pv = $('#pv'), r = pv.getBoundingClientRect(); if (!r.width) return;
  const v = S.list[S.i]; if (!v) return;
  const n = v.idx.length, W = r.width - 24, H = r.height - 16;
  const pad = 6, gap = Math.round(clamp(Math.min(W, H) * .02, 6, 14)), spr = Math.round(clamp(Math.min(W, H) * .035, 12, 20));
  const owR = clamp(Math.min(H * .34, W * .13), 64, 170);
  const cwR = Math.min((W - owR - gap * 2 - (n - 1) * gap - 20 - n * 2 * pad) / n, (H - 2 * spr - gap - 20 - 4 * pad) / 1.5);
  const ohC = clamp(H * .11, 54, 100);
  const cwC = Math.min((W - gap - 2 * spr - 20 - 4 * pad) / 2, ((H - ohC - gap - 20 - 20 - (n - 1) * gap - n * 2 * pad) / n) / .75);
  const rows = cwR >= cwC * .92;
  const cw = Math.floor(clamp(rows ? cwR : cwC, 56, 300)), ch = Math.round(cw * .75);
  const ohFit = rows ? ohC : clamp(H - (n * (ch + 2 * pad) + (n - 1) * gap + 20) - gap - 8, 54, Math.min(150, H * .2));
  pv.classList.toggle('rows', rows); pv.classList.toggle('cols', !rows);
  const P = (k, val) => pv.style.setProperty(k, val);
  P('--cw', cw + 'px'); P('--ch', ch + 'px'); P('--sw', (cw + pad * 2) + 'px'); P('--sh', (ch + pad * 2) + 'px'); P('--sg', gap + 'px');
  P('--spx', (rows ? 10 : spr) + 'px'); P('--spy', (rows ? spr : 10) + 'px');
  P('--ow', Math.round(rows ? owR : ohFit * 220 / 240) + 'px'); P('--oh', Math.round(ohFit) + 'px');
  P('--nbs', Math.round(clamp(cw * .2, 24, 40)) + 'px'); P('--bf', Math.round(clamp(rows ? Math.min(W, H) * .045 : ohFit * .2, 15, 24)) + 'px');
}
function layoutRead() {
  if (Kit.screen !== 'read') return;
  const rv = $('#rv'), r = rv.getBoundingClientRect(); if (!r.width) return;
  const s = BY_ID[R.id]; if (!s) return;
  const n = s.c.length, W = r.width - 24, H = r.height - 16 - 70, gap = Math.round(clamp(Math.min(W, H) * .022, 8, 16));
  let bc = 1, bw = 0;
  for (let cols = 1; cols <= n; cols++) {
    const rowsN = Math.ceil(n / cols);
    const w1 = (W - (cols - 1) * gap) / cols - 10;
    const fs = clamp(w1 * .085, 13, 20);
    const w2 = ((H - (rowsN - 1) * gap) / rowsN - 14 - fs * 2.4) / .75;
    const w = Math.min(w1, w2, 330);
    if (w > bw + 2) { bw = w; bc = cols; }
  }
  const cw = Math.floor(clamp(bw, 70, 330));
  rv.style.setProperty('--cw', cw + 'px'); rv.style.setProperty('--rc', bc); rv.style.setProperty('--rg', gap + 'px');
  rv.style.setProperty('--rf', clamp(cw * .085, 13, 20) + 'px');
}
function layoutCine() {
  const root = $('#cine'); if (!C.open) return;
  const r = root.getBoundingClientRect(); if (!r.width) return;
  const W = r.width - 24, H = r.height - 30;
  const n = $$('#cTh .cthumb').length || 4;
  const rowH = clamp(H * .16, 56, 96), tall = H > W * 1.25;
  const capf0 = clamp(Math.min(W, H) * .045, 15, 30);
  const sh = Math.max(120, Math.min(H - rowH - 14 - (tall ? capf0 * 4.6 : 0), W * .75 - 10));
  const sw = sh / .75;
  root.classList.toggle('tall', tall);
  const cap = $('#cCap'), scr = $('#cScr');
  if (cap && scr) { if (tall && cap.parentElement === scr) scr.after(cap); else if (!tall && cap.parentElement !== scr) scr.appendChild(cap); }
  root.style.setProperty('--csw', Math.round(sw) + 'px'); root.style.setProperty('--csh', Math.round(sh) + 'px');
  root.style.setProperty('--rowh', Math.round(rowH) + 'px');
  root.style.setProperty('--tw', Math.round(Math.min((rowH - 12) / .75, (W - (n - 1) * 8) / n - 8)) + 'px');
  root.style.setProperty('--capf', Math.round(clamp(sw * .045, 15, 30)) + 'px');
}
Kit.onResize(() => { layoutPlay(); layoutRead(); layoutCine(); if (Kit.screen === 'play') { const b = $('#bub'); if (b.textContent) b.classList.add('on'); } });

/* ---------- debug hooks for tests ---------- */
window.GAME_DEBUG = {
  S, C, R, STORIES, BY_ID, sstars,
  get v() { return S.list[S.i]; },
  get n() { const v = S.list[S.i]; return v ? v.idx.length : 0; },
  get cine() { return C.open; }, get cineEnded() { return C.ended; },
  versions: n => versionsOf(n).length,
};

/* ---------- boot ---------- */
buildTitle();
owlP = mountOwl($('#owlbox'), 'pOwl', $('#bub'));
owlP.addEventListener('pointerdown', e => { e.preventDefault(); if (Kit.screen !== 'play' || C.open) return; hoot(); if (!S.busy) hint(S.miss >= 1); else owlMood(owlP, 'happy', 700); });
$('#bPlay').addEventListener('click', () => Kit.go('select'));
$('#bLib').addEventListener('click', () => Kit.go('lib'));
Kit.go('title');

</script>
