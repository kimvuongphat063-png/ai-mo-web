<!DOCTYPE html>
<html lang="vi" data-game="thinghiemmau">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d9fd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Phòng Thí Nghiệm Màu</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Kit Bé Vui 4 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','EmojiOne Color',sans-serif;
  --ink:#3a2e5c; --ink2:#6e6492;
  --c1:#6f5cff; --c1d:#4c3bd6; --c1l:#ebe7ff;
  --c2:#ff6f9f; --c2d:#d94a7c;
  --ok:#35c46a; --okd:#1f9c4f;
  --gold:#ffc83d; --goldd:#de9800;
  --warn:#ff9a52; --warnd:#e06d22;
  --bg1:#bfe3ff; --bg2:#ffe1f0;
  --sh:40,24,90;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:78px;
  --ib:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-noselect{pointer-events:none}

/* ---------- top bar ---------- */
.k-bar{position:absolute;z-index:50;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 10px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-r{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.ibtn{position:relative;width:var(--ib);height:var(--ib);flex:0 0 auto;border:none;border-radius:19px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(var(--sh),.17),0 10px 18px rgba(var(--sh),.10);
  transition:transform .12s ease,box-shadow .12s ease,background .2s,color .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(var(--sh),.17),0 4px 8px rgba(var(--sh),.08)}
.ibtn svg{width:58%;height:58%}
.ibtn.off{color:#b6aecb;background:#f4f1fa}
.ibtn.on{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(var(--sh),.12)}
.ibtn .badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}
.k-bar .k-back{color:var(--c1d)}
@media (max-width:520px),(max-height:520px){
  :root{--ib:48px;--bar-h:66px}
  .ibtn{border-radius:16px}
  .k-bar{gap:7px;padding-top:calc(8px + var(--safe-t));padding-bottom:8px;padding-left:calc(9px + var(--safe-l));padding-right:calc(9px + var(--safe-r))}
  .k-bar .k-r{gap:7px}
}
@media (max-width:359px){ :root{--ib:44px} .k-bar .k-r{gap:5px} }

/* pill for mid-bar info */
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 14px 5px 6px;min-height:44px;
  font-weight:800;font-size:clamp(17px,2.6vmin,22px);color:var(--ink);box-shadow:0 5px 0 rgba(var(--sh),.14);white-space:nowrap;max-width:100%;overflow:hidden}
.k-pill .emo{font-size:26px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--c1l)}
.k-pill svg{width:28px;height:28px;flex:0 0 auto}
.k-dots{display:flex;gap:5px;align-items:center}
.k-dots i{width:12px;height:12px;border-radius:50%;background:#e6e0f3;transition:background .3s,transform .3s}
.k-dots i.on{background:var(--gold);transform:scale(1.15);box-shadow:0 2px 0 var(--goldd)}
.k-dots i.cur{background:var(--c1);transform:scale(1.25)}
@media (max-width:420px){ .k-dots i{width:9px;height:9px} .k-dots{gap:3px} .k-pill{padding:4px 10px 4px 5px;font-size:16px} }

/* ---------- buttons ---------- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.42em;
  font:800 clamp(20px,3.5vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:56px;
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(var(--sh),.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.26);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(var(--sh),.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.2em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.7vmin,22px);min-height:50px}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.orange{--b:var(--warn);--bd:var(--warnd)}
.btn.white{--b:#fff;--bd:#d9d2ee;color:var(--c1d);text-shadow:none}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.round{width:1.9em;height:1.9em;padding:0;border-radius:50%}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.k-play{touch-action:none}
.k-below{position:absolute;left:0;right:0;bottom:0;top:var(--bar-h)}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(46px,10.5vmin,108px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .32em rgba(var(--sh),.28)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.7vmin,23px);color:var(--ink2);margin:.25em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,3.8vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1;
  text-shadow:0 .08em 0 var(--c1d)}

/* level cards (generic) */
.k-grid{display:grid;gap:14px;width:min(1000px,100%);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.k-card{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:14px 10px 12px;box-shadow:0 7px 0 rgba(var(--sh),.16),0 14px 24px rgba(var(--sh),.08);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s;font-weight:800;color:var(--ink);font-size:clamp(16px,2.5vmin,20px);line-height:1.1;text-align:center;min-height:56px}
.k-card:active,.k-card.press{transform:translateY(4px) scale(.98)}
.k-card .emo{font-size:clamp(36px,6.5vmin,54px)}
.k-card small{font-weight:700;color:var(--ink2);font-size:.82em}
.k-card .k-num{position:absolute;top:-10px;left:-6px;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--c2);color:#fff;font:800 19px/34px var(--font);box-shadow:0 3px 0 var(--c2d)}
.k-ministars{display:flex;gap:2px;justify-content:center}
.k-ministars svg{width:clamp(18px,3vmin,24px);height:auto;color:#e7e1f4}
.k-ministars svg.on{color:var(--gold);filter:drop-shadow(0 1px 0 var(--goldd))}

/* ---------- overlay / modal ---------- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:calc(12px + var(--safe-t)) 14px calc(12px + var(--safe-b));touch-action:none}
.k-ov.out{animation:k-fadeout .2s ease forwards}
.k-panel{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:34px;padding:24px 20px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(var(--sh),.14),0 30px 60px rgba(var(--sh),.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain;touch-action:pan-y}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink2);line-height:1.3}
.k-close{position:absolute!important;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-result{overflow:visible;padding-top:20px}
.k-result .k-mascot{width:clamp(96px,20vmin,140px);height:auto;margin:-70px auto 0;display:block;filter:drop-shadow(0 6px 0 rgba(var(--sh),.12))}
.k-result .k-mascot svg{width:100%;height:auto;display:block}
.k-stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:8px 0 2px}
.k-stars svg{width:clamp(56px,11vmin,86px);height:auto;transform:scale(0);color:#e9e4f5;filter:drop-shadow(0 4px 0 rgba(150,110,20,.18))}
.k-stars svg.mid{width:clamp(66px,13vmin,100px)}
.k-stars svg.show{animation:k-star .55s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.on{color:var(--gold)}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#94600a;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both;text-align:left}
.k-reward .emo,.k-reward .k-rw{font-size:46px;width:56px;height:56px;display:grid;place-items:center;animation:k-wiggle 1.2s 1.4s ease-in-out infinite;flex:0 0 auto}
.k-reward .k-rw svg{width:100%;height:100%}
@media (max-height:520px){
  .k-result .k-mascot{width:84px;margin-top:-46px}
  .k-stars svg{width:52px}.k-stars svg.mid{width:62px}
  .k-panel{padding:14px 16px 16px;border-radius:26px}
  .k-panel h2{font-size:30px}
  .k-btns{margin-top:12px}
  .k-reward{margin-top:8px;padding:6px 14px 6px 8px}.k-reward .emo,.k-reward .k-rw{font-size:34px;width:42px;height:42px}
}

/* ---------- praise / toast ---------- */
.k-praise{position:fixed;z-index:85;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,86px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-float{position:fixed;z-index:85;pointer-events:none;font-weight:800;font-size:clamp(24px,4.5vmin,40px);color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;
  transform:translate(-50%,-50%);animation:k-floatup 1s ease-out forwards;white-space:nowrap}
.k-toast{position:fixed;z-index:86;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(var(--sh),.12),0 12px 24px rgba(var(--sh),.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}

/* ---------- fx canvas ---------- */
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---------- decorative background ---------- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.32);animation:k-float 9s ease-in-out infinite}

/* ---------- mascot helpers ---------- */
.k-blink{transform-box:fill-box;transform-origin:center;animation:k-blink 4.4s infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3.2s ease-in-out infinite}
.k-pupil{transition:transform .14s ease-out}
.k-talk{animation:k-talk .32s ease-in-out infinite}

/* ---------- animations ---------- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-fadeout{to{opacity:0}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-50deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}50%{transform:scale(.9,1.1)}70%{transform:scale(1.05,.96)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-floatup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-70%) scale(1.1);opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-anim-shake{animation:k-shake .45s ease-in-out}
.k-anim-jelly{animation:k-jelly .5s ease-in-out}
.k-anim-wiggle{animation:k-wiggle .5s ease-in-out}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
:root{--c1:#1d9fd8;--c1d:#11709f;--c1l:#dff4ff;--c2:#ff6fa5;--c2d:#d9497f;--ink:#22385c;--ink2:#5a6f94;--sh:20,60,110;--line:#3b3150;
  --u:180px;--ring:180px;--gap:12px;--tw:64px;--th:170px}
body{background:linear-gradient(180deg,#d6f3ff 0%,#ecfaff 36%,#fbfeff 60%,#fff0f7 100%)}
body::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(110,190,228,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(110,190,228,.13) 2px,transparent 2px);background-size:46px 46px;background-position:-2px -2px}
.screen{z-index:1}
.emo{font-family:var(--emoji)}

/* ---------- lab decoration (shelves, bubbles) ---------- */
#deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;transition:opacity .4s}
body.playing #deco{opacity:.42}
body.playing .shelf.lo{display:none}
body.listing #deco{opacity:.5}
.pw.col,.fw.col,.ww.col{justify-content:space-evenly}
.shelf{position:absolute;width:clamp(140px,23vmin,250px);top:calc(var(--bar-h) + 7vh)}
.shelf.l{left:-12px}.shelf.r{right:-12px}
.shelf.lo{top:auto;bottom:9vh}
.shelf svg{width:100%;height:auto;display:block}
.fbub{transform-box:fill-box;transform-origin:center;animation:fbub 2.8s ease-in infinite}
@keyframes fbub{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.95}100%{transform:translateY(-52px) scale(1.15);opacity:0}}
.dbub{position:absolute;bottom:-70px;border-radius:50%;border:3px solid rgba(255,255,255,.95);
  background:radial-gradient(circle at 32% 30%,#fff 0 13%,rgba(255,255,255,.2) 15%);box-shadow:inset 0 0 0 2px rgba(110,190,240,.22),0 2px 6px rgba(80,160,220,.12);animation:drise linear infinite}
@keyframes drise{0%{transform:translate(0,0)}50%{transform:translate(20px,-58vh)}100%{transform:translate(-10px,-120vh)}}

/* ---------- title ---------- */
#title{padding:calc(var(--bar-h) + 4px) 16px calc(16px + var(--safe-b))}
.t-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.3vmin,14px)}
.t-cat{position:relative;width:clamp(170px,35vmin,310px);cursor:pointer}
.t-cat svg{width:100%;height:auto;display:block}
.t-txt{display:flex;flex-direction:column;align-items:center}
.k-logo{--c1d:#0f5f8c;font-size:clamp(38px,8.6vmin,92px)}
.k-logo .l2{font-size:1.45em;letter-spacing:.03em;color:#fff}
.k-logo .l2 b{display:inline-block;font-weight:800;animation:lbounce 2.6s ease-in-out infinite}
.k-logo .l2 b:nth-child(1){color:#ff5468}.k-logo .l2 b:nth-child(2){color:#ffd23d;animation-delay:.18s}.k-logo .l2 b:nth-child(3){color:#3f8cff;animation-delay:.36s}
@keyframes lbounce{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-.12em) rotate(-4deg)}90%{transform:translateY(0) rotate(2deg)}}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:clamp(10px,2.2vmin,22px)}
.t-btns .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--c2);color:#fff;font:800 16px/28px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
@media (min-aspect-ratio:5/4){
  .t-wrap{flex-direction:row;gap:5vw}
  .t-cat{width:min(52vmin,32vw)}
}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  .t-cat{width:min(42vmin,30vw)}
  .t-btns{gap:12px;margin-top:8px}
  .k-sub{display:none}
}

/* ---------- cat mascot ---------- */
.cat .arm-l{transform-box:view-box;transform-origin:76px 186px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.cat .arm-r{transform-box:view-box;transform-origin:144px 186px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.cat .head{transform-box:view-box;transform-origin:110px 168px;animation:ctilt 6s ease-in-out infinite}
.cat .tail{transform-box:view-box;transform-origin:152px 232px;animation:cswish 2.6s ease-in-out infinite}
.cat .gog{transform-box:view-box;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.cat .mouth-o,.cat .eyes-hap{opacity:0}
.cat .fb{transform-box:fill-box;transform-origin:center;animation:fbub 2.2s ease-in infinite}
.cat .cbody{transform-box:view-box;transform-origin:110px 250px}
@keyframes ctilt{0%,45%,100%{transform:rotate(0)}55%,85%{transform:rotate(-6deg)}}
@keyframes cswish{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
.cat.gogdown .gog{transform:translateY(40px)}
.cat.cheer .arm-l{transform:rotate(128deg)}
.cat.cheer .arm-r{transform:rotate(-128deg)}
.cat.cheer .cbody{animation:chop .5s cubic-bezier(.3,1.6,.5,1) 2}
.cat.cheer .mouth-o,.cat.talk .mouth-o,.cat.wow .mouth-o{opacity:1}
.cat.cheer .mouth,.cat.talk .mouth{opacity:0}
.cat.cheer .eyes{opacity:0}.cat.cheer .eyes-hap{opacity:1}
.cat.talk .mouth-o{transform-box:fill-box;transform-origin:50% 0;animation:ctalk .26s ease-in-out infinite alternate}
.cat.wow .eyes{transform-box:fill-box;transform-origin:center;transform:scale(1.15)}
.cat.wow .mouth{opacity:0}.cat.wow .mouth-o{transform-box:fill-box;transform-origin:50% 0;transform:scale(.55,.8)}
.cat.sad .head{animation:none;transform:rotate(7deg)}
.cat.point .arm-r{transform:rotate(-70deg)}
@keyframes chop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes ctalk{from{transform:scaleY(.45)}to{transform:scaleY(1)}}

/* ---------- select screens ---------- */
.sel{position:absolute;left:0;right:0;bottom:0;top:var(--bar-h);padding:4px 16px calc(22px + var(--safe-b));display:flex;flex-direction:column;align-items:center}
.sel-in{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.k-h{--c1d:#0f5f8c}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;width:min(1000px,100%);padding-top:6px}
@media (min-aspect-ratio:13/10){.mode-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mode{padding:12px 10px 14px;gap:2px;justify-content:flex-start;overflow:hidden}
.mode .art{width:100%;aspect-ratio:1/.8;display:grid;place-items:center;margin-bottom:2px}
.mode .art svg{width:92%;height:100%;display:block}
.mode .nm{font-size:clamp(19px,3.1vmin,27px)}
.mode small{font-size:clamp(13px,2.1vmin,17px)}
.mode.m1{background:linear-gradient(175deg,#fff 45%,#ffeef4)}.mode.m2{background:linear-gradient(175deg,#fff 45%,#eaf7ff)}
.mode.m3{background:linear-gradient(175deg,#fff 45%,#fff6dc)}.mode.m4{background:linear-gradient(175deg,#fff 45%,#eefbe9)}
@media (max-height:520px){.mode .art{aspect-ratio:auto;height:max(90px,calc(100vh - var(--bar-h) - 128px))}.mode-grid{gap:12px}}
.ch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px;width:min(1060px,100%);padding:10px 2px 4px}
@media (min-width:640px){.ch-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ch{padding:16px 4px 10px;gap:5px}
.ch .blob{position:relative;width:clamp(58px,11vmin,86px);aspect-ratio:1;border-radius:50%;background:var(--cc);
  box-shadow:inset -5px -7px 0 rgba(0,0,0,.13),0 4px 0 rgba(var(--sh),.12)}
.ch .blob::after{content:"";position:absolute;left:19%;top:15%;width:28%;height:19%;border-radius:50%;background:rgba(255,255,255,.72);transform:rotate(-32deg)}
.ch .nm{font-size:clamp(14px,2.3vmin,18px);line-height:1.05;min-height:2.15em;display:flex;align-items:center;justify-content:center}
.ch .k-num{background:var(--tc);box-shadow:0 3px 0 var(--tcd)}
.ch.rand .blob{background:conic-gradient(#ff5468,#ff9a3c,#ffd23d,#35c46a,#3f8cff,#a35cff,#ff5468)}
.ch.rand .blob b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2em;color:#fff;-webkit-text-stroke:.12em #3b3150;paint-order:stroke fill;z-index:1}
.tier{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(16px,2.6vmin,21px);color:var(--ink2);margin:6px 0 -6px 4px}
.tier i{width:14px;height:14px;border-radius:50%;background:var(--tc)}
.pic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;width:min(1000px,100%);padding-top:8px}
@media (min-aspect-ratio:13/10){.pic-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{padding:10px 10px 10px;gap:6px}
.pcard .thumb{width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 3px #eef3f9}
.pcard .thumb svg{width:100%;height:100%;display:block}
.pcard .nm{font-size:clamp(15px,2.4vmin,19px)}

/* ---------- play (challenge) ---------- */
.pw,.fw,.ww{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;display:flex;align-items:center;justify-content:center;gap:var(--gap);
  padding:4px calc(12px + var(--safe-r)) calc(10px + var(--safe-b)) calc(12px + var(--safe-l))}
.pw.col,.fw.col,.ww.col{flex-direction:column}
.pw.row,.fw.row,.ww.row{flex-direction:row}
.tgt{position:relative;background:#fff;border-radius:30px;box-shadow:0 7px 0 rgba(var(--sh),.11),0 14px 26px rgba(var(--sh),.1);display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;flex:0 0 auto}
.pw.row .tgt{flex-direction:column;padding:14px 14px 12px;gap:8px}
.pw.col .tgt{flex-direction:row;width:100%;max-width:640px}
.ringw{position:relative;width:var(--ring);height:var(--ring);flex:0 0 auto}
.ring{width:100%;height:100%;display:block}
.ring .rc,.ring .rt,.ring .seam,.ring .qm{transition:opacity .4s}
.ring.done .seam{opacity:0}
.ring.done{animation:k-jelly .6s ease-in-out}
.rlab{position:absolute;left:0;right:0;bottom:-4px;display:flex;justify-content:space-between;padding:0 8%;pointer-events:none}
.rlab span{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(var(--sh),.14)}
.rlab svg{width:20px;height:20px}
.tinfo{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.pw.row .tinfo{flex:0 0 auto;gap:8px}
.tname{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(19px,calc(var(--ring)*.14),34px);color:var(--ink);background:#f2f7fc;border-radius:999px;padding:3px 16px 5px 7px;white-space:nowrap;max-width:100%}
.tname i{width:1.1em;height:1.1em;border-radius:50%;background:var(--tc);box-shadow:inset -3px -3px 0 rgba(0,0,0,.13);flex:0 0 auto}
.meter{display:flex;align-items:center;gap:6px;width:min(100%,calc(var(--ring)*1.05));min-width:120px}
.mtrack{position:relative;flex:1;height:20px;border-radius:10px;background:#edf2f8;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.mfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:var(--mc,#ffb2c4);transition:width .55s cubic-bezier(.3,1.4,.5,1),background .4s}
.mtrack::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),#fff calc(20% - 2px) 20%)}
.face{width:46px;height:46px;flex:0 0 auto;transition:transform .3s}
.face.pop{animation:k-jelly .5s}
.hintb{background:var(--gold)!important;color:#7a4b00!important;box-shadow:0 5px 0 var(--goldd),0 8px 16px rgba(var(--sh),.2)!important}
.pw.row .hintb{position:absolute;right:-10px;top:-10px;z-index:3}
.tgt .k-num{position:absolute;left:-6px;top:-10px;min-width:36px;height:36px;padding:0 7px;border-radius:18px;background:var(--c2);color:#fff;font:800 20px/36px var(--font);box-shadow:0 3px 0 var(--c2d);text-align:center;z-index:3}
.recipe{position:absolute;z-index:8;left:50%;top:calc(100% + 10px);transform:translateX(-50%);background:#fffbe6;border:3px solid #ffd23d;border-radius:22px;padding:8px 14px;
  display:flex;gap:12px;align-items:center;box-shadow:0 6px 0 rgba(222,152,0,.25),0 12px 24px rgba(var(--sh),.18);white-space:nowrap;animation:k-pop .35s cubic-bezier(.2,1.6,.4,1)}
.recipe::before{content:"";position:absolute;left:50%;top:-12px;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#ffd23d}
.recipe .ri{display:flex;align-items:center;gap:2px;font-weight:800;font-size:22px;color:#7a4b00}
.recipe .ri svg{width:17px;height:50px}
.recipe .plus{font-weight:800;font-size:22px;color:#c99512}

/* ---------- lab (beaker + tube rack), shared by challenge + free ---------- */
.lab{display:flex;align-items:center;justify-content:center;gap:var(--gap);flex:0 0 auto}
.lab.col{flex-direction:column}
.lab.row{flex-direction:row}
.bzone{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.catmini{width:calc(var(--u)*.6);flex:0 0 auto;margin-bottom:calc(var(--u)*.08)}
.catmini svg{width:100%;height:auto;display:block}
.lab.nocat .catmini{display:none}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.beakw{position:relative;width:calc(var(--u)*.96);height:calc(var(--u)*1.1)}
.beakw svg{width:100%;height:100%;display:block}
.beakw .liq{transition:color .1s}
.beakw .wave{animation:bwave 1.8s linear infinite}
@keyframes bwave{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.beakw.full{animation:k-jelly .5s}
.beakw.tip{animation:btip 1.1s ease-in-out}
@keyframes btip{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-14deg)}}
.pdots{display:flex;gap:max(3px,calc(var(--u)*.018));justify-content:center}
.pdots i{width:max(9px,calc(var(--u)*.068));height:max(9px,calc(var(--u)*.068));border-radius:50%;border:2px dashed #c3d4e6;box-sizing:border-box}
.pdots i.on{border:none;background:var(--pc);box-shadow:inset -2px -2px 0 rgba(0,0,0,.14),0 0 0 2px #fff;animation:k-pop .35s cubic-bezier(.2,1.6,.4,1)}
.pdots i.on.w{box-shadow:inset -2px -2px 0 rgba(0,0,0,.1),0 0 0 2px #c7d3e2}
.rinse{align-self:center;margin-bottom:calc(var(--u)*.25);color:#1b7bb0}
.rinse.glow{animation:k-pulse 1s ease-in-out infinite;background:#e2f6ff}
.rack{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 14px 0;flex:0 0 auto}
.rack::before{content:"";position:absolute;left:4px;right:4px;bottom:calc(30px + var(--th)*.1);height:calc(var(--th)*.42);border-radius:18px;background:linear-gradient(#ffffff,#eef7fd);box-shadow:0 0 0 3px #e0eef8,0 6px 14px rgba(var(--sh),.08)}
.rack::after{content:"";position:absolute;left:0;right:0;bottom:calc(30px + var(--th)*.12);height:max(16px,calc(var(--th)*.11));border-radius:12px;background:linear-gradient(#ffd79e,#f4b264);box-shadow:0 5px 0 #d58c3e,inset 0 3px 0 rgba(255,255,255,.5);z-index:2;pointer-events:none}
.tube{position:relative;z-index:1;border:none;background:none;padding:0;margin:0;width:var(--tw);height:calc(var(--th) + 30px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;touch-action:manipulation;font-family:var(--font)}
.tube .tb{width:calc(var(--th)*.3);height:var(--th);display:block;flex:0 0 auto;transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.tube.press .tb,.tube:active .tb{transform:translateY(-8px) scale(1.04)}
.tube .tl{position:relative;z-index:3;height:26px;margin-top:4px;font-size:clamp(11px,calc(var(--tw)*.2),15px);font-weight:800;color:var(--ink2);line-height:1;white-space:nowrap;display:flex;align-items:center}
.tube.flying{z-index:6}
.tube.flying .tb{transition:none}
.tube.glow .tb{animation:tglow .9s ease-in-out infinite}
@keyframes tglow{0%,100%{transform:translateY(0);filter:drop-shadow(0 0 0 #ffd23d)}50%{transform:translateY(-12px);filter:drop-shadow(0 0 10px #ffc400) drop-shadow(0 0 4px #ffd23d)}}
.tube.no .tb{animation:k-shake .45s}
.tb .tbub{transform-box:fill-box;transform-origin:center;animation:fbub 2.4s ease-in infinite}
.stream{position:absolute;z-index:4;pointer-events:none;border-radius:8px;transform-origin:50% 0;background:var(--sc);box-shadow:inset 3px 0 0 rgba(255,255,255,.4)}
.stream.w{box-shadow:inset 3px 0 0 rgba(255,255,255,.8),0 0 0 2px rgba(170,190,215,.6)}

/* ---------- free mode ---------- */
.picbox{position:relative;width:var(--ps);height:var(--ps);flex:0 0 auto}
.pic{width:100%;height:100%;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 0 0 5px #fff,0 9px 0 5px rgba(var(--sh),.12),0 18px 30px rgba(var(--sh),.14)}
.pic svg,.thumb svg{width:100%;height:100%;display:block}
[data-r]{fill:#fff;stroke:var(--line);stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.pic [data-r]{cursor:pointer;transition:fill .2s}
.pic .dt,.thumb .dt,.thumb [data-r]{pointer-events:none}
.dt{fill:none;stroke:var(--line);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.dk{fill:var(--line);stroke:none}
.wh{fill:#fff;stroke:none}
.bl{fill:#ff8fa8;opacity:.55;stroke:none}
.tg{fill:#ff8fa8;stroke:var(--line);stroke-width:3.5}
.rd{fill:#cfeaff;stroke:#5aaee8;stroke-width:3}
.fside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap);min-width:0}
.swrow{display:flex;align-items:center;justify-content:center;gap:8px;max-width:100%}
.sw{position:relative;width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(var(--sh),.16),0 6px 12px rgba(var(--sh),.08);background:var(--sc);cursor:pointer;flex:0 0 auto;padding:0}
.sw.empty{background:repeating-linear-gradient(45deg,#f4f7fb 0 6px,#e9eef6 6px 12px);border-style:dashed;border-color:#d5deea;cursor:default}
.swrow .ibtn{flex:0 0 auto}
.brushdot{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--bc,#fff);border:4px solid #fff;box-shadow:0 3px 0 rgba(var(--sh),.2);pointer-events:none;display:grid;place-items:center}
.brushdot svg{width:26px;height:26px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.brushdot.none{background:repeating-linear-gradient(45deg,#f4f7fb 0 6px,#e5ebf3 6px 12px)}
.brushdot.none svg{color:#a8b5c8;filter:none}

/* ---------- colour wheel ---------- */
.wheel{position:relative;width:var(--wd);height:var(--wd);flex:0 0 auto}
.wplate{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 0 60%,#f0f7fd 61% 100%);box-shadow:0 0 0 6px #fff,0 9px 0 6px rgba(var(--sh),.1),0 18px 34px rgba(var(--sh),.13)}
.wheel.spin .wring{animation:wspin 1.4s cubic-bezier(.4,0,.2,1)}
@keyframes wspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wring{position:absolute;inset:0}
.pot{position:absolute;width:var(--pd);height:var(--pd);margin:calc(var(--pd) / -2) 0 0 calc(var(--pd) / -2);border-radius:50%;touch-action:none;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.pot svg{width:100%;height:100%;display:block;overflow:visible}
.pot.sel{transform:scale(1.16);z-index:3}
.pot.sel svg{filter:drop-shadow(0 0 7px #ffc400)}
.pot.want{animation:k-pulse .9s ease-in-out infinite}
.pot.hint svg{filter:drop-shadow(0 0 8px #ffc400)}
.wcenter{position:absolute;left:50%;top:50%;width:var(--wc);transform:translate(-50%,-56%);pointer-events:auto}
.wcenter svg{width:100%;height:auto;display:block}
.wside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap);min-width:0}
.wtabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:999px;box-shadow:0 5px 0 rgba(var(--sh),.1)}
.wtab{border:none;border-radius:999px;padding:6px 18px 8px;font:800 clamp(17px,2.7vmin,22px)/1 var(--font);background:transparent;color:var(--ink2);min-height:48px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.wtab.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.wtab i{display:inline-flex;gap:2px}.wtab i b{width:9px;height:9px;border-radius:50%}
.formula{display:flex;align-items:flex-start;gap:8px;background:#fff;border-radius:26px;padding:10px 16px 8px;box-shadow:0 6px 0 rgba(var(--sh),.1),0 12px 22px rgba(var(--sh),.08);min-height:96px}
.formula .fd{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:clamp(13px,2.2vmin,17px);width:clamp(62px,10vmin,84px);text-align:center;line-height:1.05}
.formula .fd i{width:clamp(44px,8vmin,62px);height:clamp(44px,8vmin,62px);border-radius:50%;background:var(--fc,#eef2f8);box-shadow:inset -4px -5px 0 rgba(0,0,0,.12)}
.formula .fd.q i{background:repeating-linear-gradient(45deg,#f4f7fb 0 6px,#e5ebf3 6px 12px);box-shadow:inset 0 0 0 3px #dbe3ee}
.formula .op{font-size:clamp(26px,4.4vmin,38px);font-weight:800;color:var(--ink2);line-height:1;margin-top:clamp(8px,1.6vmin,14px)}
.formula.pop{animation:k-jelly .55s}
.dropg{position:fixed;z-index:70;width:58px;height:58px;margin:-29px 0 0 -29px;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.dropg svg{width:100%;height:100%;display:block}

/* ---------- book (collection) ---------- */
.book{width:min(640px,100%)}
.book h2{margin-bottom:0}
.bcount{font-weight:800;color:var(--c2d);font-size:20px}
.bsec{font-weight:800;color:var(--c1d);font-size:18px;margin:14px 2px 0;text-align:left}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:8px}
.chip{border:none;background:#fff;border-radius:18px;padding:6px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 0 0 2px #edf2f8,0 4px 0 #e1e9f3;cursor:pointer;font-family:var(--font);min-height:56px}
.chip i{width:100%;height:50px;border-radius:13px;background:var(--cc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.09),inset 0 0 0 2px rgba(0,0,0,.04)}
.chip span{font-weight:800;font-size:13px;line-height:1.08;min-height:2.2em;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink)}
.chip.no i{background:repeating-linear-gradient(45deg,#f3f6fa 0 7px,#e8edf4 7px 14px);box-shadow:inset 0 0 0 3px #dde4ee}
.chip.no span{color:#b3bed1}
.bempty{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px}
.bempty svg{width:120px;height:auto}
.cdet .big{width:clamp(120px,30vmin,180px);aspect-ratio:1;border-radius:50%;margin:4px auto 6px;background:var(--cc);box-shadow:inset -10px -12px 0 rgba(0,0,0,.12),0 0 0 8px #fff,0 0 0 11px #edf2f8;position:relative}
.cdet .big::after{content:"";position:absolute;left:20%;top:15%;width:26%;height:18%;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-32deg)}
.rrow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.rrow .ri{display:flex;align-items:center;gap:2px;font-weight:800;font-size:24px;color:var(--ink)}
.rrow .ri svg{width:19px;height:56px}
.rrow .plus{font-weight:800;font-size:24px;color:var(--ink2)}

/* ---------- misc ---------- */
.hand{position:fixed;z-index:88;width:70px;height:70px;pointer-events:none;margin:-6px 0 0 -22px;filter:drop-shadow(0 5px 4px rgba(0,0,0,.22));opacity:0}
.hand svg{width:100%;height:100%;display:block}
.newc{position:fixed;z-index:84;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.2);pointer-events:none}
.k-pill .bk{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#fff3cf;color:#b07800}
.k-pill .bk svg{width:24px;height:24px}

<script>
/* ===== Kit Bé Vui 4 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';
  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const center = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, r }; };
  const seeded = seed => { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; };
  const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const util = { rand, randInt, pick, shuffle, clamp, lerp, wait, $, $$, el, center, seeded, hash };

  /* ---------- storage (works when blocked) ---------- */
  const mem = {};
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); if (v != null) return JSON.parse(v); } catch (e) { if ((ns + k) in mem) return mem[ns + k]; } return (ns + k) in mem ? mem[ns + k] : d; },
    set(k, v) { mem[ns + k] = v; try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { delete mem[ns + k]; try { localStorage.removeItem(ns + k); } catch (e) { } }
  });
  const shared = mkStore('bevui.');
  let store = mkStore('bevui.game.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', { sound: settings.sound, music: settings.music });

  /* ---------- audio core ---------- */
  const MUSIC_VOL = 0.2;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return null; } }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.85;
      sfxBus = ctx.createGain(); sfxBus.gain.value = settings.sound ? 1 : 0;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && unlocked && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    if (unlocked) { if (ctx && ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { }); return; }
    unlocked = true;
    const c = audio(); if (!c) return;
    try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
    if (c.state === 'suspended') c.resume().catch(() => { });
    if (music.want) music.play(music.want, true);
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { }
      if (ctx && ctx.state === 'running') ctx.suspend().catch(() => { });
      music._pause();
    } else {
      if (ctx && unlocked) ctx.resume().catch(() => { });
      music._resume();
    }
  });
  function noise() {
    const c = audio(); if (!c) return null;
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, c.sampleRate * 1.5, c.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const n2m = n => { if (typeof n === 'number') return n; const m = /^([A-G])(#|b)?(-?\d)$/.exec(n); if (!m) return 60; return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
  /* tone: low-level oscillator voice */
  function tone(freq, dur = 0.15, o = {}) {
    const c = audio(); if (!c || (!settings.sound && !o.music)) return;
    const t = (o.t != null ? o.t : c.currentTime) + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + (o.glide || dur));
    if (o.detune) osc.detune.value = o.detune;
    const v = (o.vol != null ? o.vol : 0.3), a = o.attack != null ? o.attack : 0.008, rel = o.release != null ? o.release : dur;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + a);
    if (o.sustain) { g.gain.setValueAtTime(v, t + dur); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel); }
    else g.gain.exponentialRampToValueAtTime(0.0001, t + a + rel);
    let node = osc;
    if (o.filter) { const f = c.createBiquadFilter(); f.type = o.filter.type || 'lowpass'; f.frequency.value = o.filter.f || 2000; f.Q.value = o.filter.q || 0.7; osc.connect(f); node = f; }
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib.f || 6; lg.gain.value = o.vib.d || 8; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + rel + 0.1); }
    node.connect(g);
    if (o.pan != null && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); p.connect(o.music ? musicBus : sfxBus); }
    else g.connect(o.music ? musicBus : sfxBus);
    osc.start(t); osc.stop(t + (o.sustain ? dur : a) + rel + 0.05);
  }
  function noiseHit(dur = 0.1, o = {}) {
    const c = audio(); if (!c || (!settings.sound && !o.music)) return;
    const t = (o.t != null ? o.t : c.currentTime) + (o.delay || 0);
    const s = c.createBufferSource(); s.buffer = noise();
    const f = c.createBiquadFilter(); f.type = o.ftype || 'bandpass'; f.frequency.setValueAtTime(o.f || 2000, t); f.Q.value = o.q || 1;
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + dur);
    const g = c.createGain(); const v = o.vol != null ? o.vol : 0.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(o.music ? musicBus : sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  const bell = (m, t0 = 0, vol = 0.22, dur = 0.5) => { const f = mtof(n2m(m)); tone(f, dur, { vol, delay: t0, type: 'sine', release: dur }); tone(f * 2, dur * 0.6, { vol: vol * 0.35, delay: t0, release: dur * 0.5 }); tone(f * 3.01, dur * 0.3, { vol: vol * 0.12, delay: t0, release: dur * 0.3 }); };

  /* ---------- sound effects ---------- */
  const SFX = {
    tap: () => tone(700, 0.06, { to: 980, vol: 0.16, type: 'sine', release: 0.07 }),
    click: () => tone(1500, 0.02, { vol: 0.08, type: 'square', release: 0.02, filter: { f: 3000 } }),
    pop: (o = {}) => { const p = o.pitch || 1; tone(900 * p, 0.08, { to: 260 * p, vol: 0.32, release: 0.1 }); noiseHit(0.04, { f: 3000, vol: 0.12 }); },
    ok: () => { bell('C6', 0, 0.2, 0.35); bell('E6', 0.08, 0.2, 0.35); bell('G6', 0.16, 0.22, 0.6); },
    no: () => { tone(330, 0.12, { type: 'triangle', vol: 0.22, to: 300, release: 0.14 }); tone(262, 0.18, { type: 'triangle', vol: 0.22, delay: 0.14, to: 240, release: 0.22 }); },
    star: (o = {}) => { const i = o.i || 0; const base = [72, 76, 79, 84][i % 4]; bell(base, 0, 0.24, 0.5); bell(base + 12, 0.05, 0.1, 0.4); },
    win: () => { ['C5', 'E5', 'G5', 'C6'].forEach((n, i) => bell(n, i * 0.11, 0.2, 0.4)); ['C5', 'E5', 'G5', 'C6', 'E6'].forEach(n => tone(mtof(n2m(n)), 0.9, { delay: 0.48, type: 'triangle', vol: 0.06, release: 0.9, attack: 0.02 })); },
    whoosh: () => noiseHit(0.35, { f: 400, fto: 2400, q: 0.8, vol: 0.16, attack: 0.08 }),
    swoosh: () => noiseHit(0.25, { f: 2600, fto: 500, q: 0.8, vol: 0.14, attack: 0.04 }),
    boing: () => tone(220, 0.35, { to: 520, glide: 0.12, vol: 0.25, type: 'sine', vib: { f: 18, d: 30 }, release: 0.35 }),
    sparkle: () => { for (let i = 0; i < 5; i++) bell(84 + [0, 4, 7, 12, 16][i], i * 0.05, 0.08, 0.25); },
    drop: () => tone(1300, 0.09, { to: 380, vol: 0.2, release: 0.1 }),
    coin: () => { tone(988, 0.07, { type: 'square', vol: 0.07, release: 0.06, filter: { f: 4000 } }); tone(1319, 0.2, { type: 'square', vol: 0.07, delay: 0.07, release: 0.25, filter: { f: 4000 } }); },
    splash: () => { noiseHit(0.35, { ftype: 'lowpass', f: 1800, fto: 300, vol: 0.2 }); tone(500, 0.1, { to: 180, vol: 0.1, delay: 0.02 }); },
    bubble: () => tone(rand(300, 420), 0.12, { to: rand(800, 1100), vol: 0.14, release: 0.12 }),
    dice: () => { for (let i = 0; i < 7; i++) noiseHit(0.03, { f: rand(1800, 3500), q: 3, vol: 0.18, delay: i * 0.06 + rand(0, 0.02) }); },
    slide: () => tone(1000, 0.7, { to: 280, glide: 0.7, vol: 0.18, type: 'sine', sustain: true, release: 0.12, vib: { f: 7, d: 12 } }),
    climb: () => { [0, 2, 4, 5, 7, 9].forEach((s, i) => tone(mtof(67 + s), 0.08, { delay: i * 0.09, type: 'triangle', vol: 0.14, release: 0.09 })); },
    step: (o = {}) => tone(o.f || 560, 0.04, { type: 'triangle', vol: 0.18, release: 0.06, to: (o.f || 560) * 0.8 }),
    pour: (o = {}) => { const d = o.dur || 0.8; noiseHit(d, { ftype: 'bandpass', f: 900, fto: 600, q: 2, vol: 0.12, attack: 0.08 }); for (let i = 0; i < d * 10; i++) tone(rand(500, 900), 0.05, { to: rand(900, 1300), vol: 0.04, delay: i * 0.1 + rand(0, 0.05) }); },
    fizz: () => { for (let i = 0; i < 10; i++) noiseHit(0.03, { f: rand(5000, 8000), q: 4, vol: 0.08, delay: i * 0.04 + rand(0, 0.03) }); },
    chomp: () => { noiseHit(0.07, { ftype: 'lowpass', f: 900, vol: 0.28 }); tone(160, 0.06, { to: 90, vol: 0.2 }); noiseHit(0.07, { ftype: 'lowpass', f: 900, vol: 0.28, delay: 0.16 }); tone(160, 0.06, { to: 90, vol: 0.2, delay: 0.16 }); },
    magic: () => { [72, 76, 79, 83, 86, 88, 91, 95].forEach((m, i) => bell(m, i * 0.045, 0.09, 0.35)); },
    grow: () => tone(320, 0.4, { to: 760, glide: 0.35, vol: 0.16, type: 'sine', vib: { f: 9, d: 10 }, release: 0.25 }),
    buzz: () => tone(190, 0.4, { type: 'sawtooth', vol: 0.05, release: 0.2, vib: { f: 30, d: 25 }, filter: { f: 900 } }),
    thud: () => { tone(140, 0.15, { to: 55, vol: 0.32 }); noiseHit(0.06, { ftype: 'lowpass', f: 500, vol: 0.12 }); },
    squeak: () => tone(1400, 0.1, { to: 2100, vol: 0.12, release: 0.1 }),
    swap: () => { tone(520, 0.06, { vol: 0.14, type: 'triangle' }); tone(780, 0.08, { vol: 0.14, type: 'triangle', delay: 0.07 }); },
    snap: () => { tone(1100, 0.03, { vol: 0.2, type: 'square', filter: { f: 2500 }, release: 0.04 }); tone(660, 0.12, { vol: 0.16, delay: 0.03, release: 0.12 }); },
    pick: () => tone(480, 0.06, { to: 720, vol: 0.14, type: 'triangle', release: 0.08 }),
    put: () => tone(620, 0.06, { to: 420, vol: 0.16, type: 'triangle', release: 0.09 }),
    page: () => noiseHit(0.22, { f: 1500, fto: 3500, q: 0.6, vol: 0.1, attack: 0.05 }),
    yay: () => { bell('G5', 0, 0.16, 0.3); bell('C6', 0.1, 0.18, 0.3); bell('E6', 0.2, 0.2, 0.5); noiseHit(0.5, { f: 3000, q: 0.5, vol: 0.04, delay: 0.05, attack: 0.1 }); },
    firework: () => { tone(300, 0.5, { to: 1400, glide: 0.45, vol: 0.06, type: 'sine', release: 0.1, sustain: true }); noiseHit(0.6, { ftype: 'lowpass', f: 2500, fto: 200, vol: 0.25, delay: 0.5 }); for (let i = 0; i < 6; i++) noiseHit(0.03, { f: 6000, q: 5, vol: 0.06, delay: 0.6 + i * 0.07 + rand(0, 0.05) }); }
  };
  let lastSfx = {};
  function sfx(name, o) {
    if (!settings.sound) return;
    const now = performance.now();
    if (lastSfx[name] && now - lastSfx[name] < 25) return;
    lastSfx[name] = now;
    const f = SFX[name]; if (!f) return;
    try { audio(); if (ctx && ctx.state !== 'closed') f(o || {}); } catch (e) { }
  }
  const note = (m, dur = 0.3, o = {}) => { if (!settings.sound) return; const f = mtof(n2m(m)); if ((o.inst || 'bell') === 'bell') bell(m, o.delay || 0, o.vol || 0.22, dur); else tone(f, dur, Object.assign({ type: o.inst, release: dur }, o)); };

  /* ---------- background music (tiny generative loop) ---------- */
  const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], penta: [0, 2, 4, 7, 9, 12, 14], dorian: [0, 2, 3, 5, 7, 9, 10] };
  const STYLES = {
    happy: { bpm: 112, root: 60, scale: 'major', prog: [0, 4, 5, 3], lead: 'bell', arp: [0, 2, 1, 2], bass: 'root5', shaker: true, density: 0.55 },
    calm: { bpm: 78, root: 65, scale: 'major', prog: [0, 3, 5, 4], lead: 'flute', arp: [0, 1, 2, 1], bass: 'root', shaker: false, density: 0.35, pad: true },
    playful: { bpm: 126, root: 67, scale: 'major', prog: [0, 3, 4, 3], lead: 'pluck', arp: [0, 2, 0, 2], bass: 'bounce', shaker: true, density: 0.6 },
    garden: { bpm: 92, root: 62, scale: 'penta', prog: [0, 3, 4, 0], lead: 'marimba', arp: [0, 1, 2, 3], bass: 'root', shaker: true, density: 0.45 },
    space: { bpm: 72, root: 57, scale: 'minor', prog: [0, 5, 2, 6], lead: 'bell', arp: [0, 2, 4, 2], bass: 'root', shaker: false, density: 0.3, pad: true },
    adventure: { bpm: 104, root: 62, scale: 'dorian', prog: [0, 6, 5, 6], lead: 'pluck', arp: [0, 1, 2, 1], bass: 'root5', shaker: true, density: 0.5 },
    mystery: { bpm: 84, root: 57, scale: 'minor', prog: [0, 3, 0, 4], lead: 'marimba', arp: [0, 2, 1, 2], bass: 'root', shaker: false, density: 0.3, pad: true },
    party: { bpm: 128, root: 60, scale: 'major', prog: [0, 5, 3, 4], lead: 'bell', arp: [0, 2, 1, 2], bass: 'bounce', shaker: true, kick: true, density: 0.65 },
    lab: { bpm: 100, root: 64, scale: 'major', prog: [0, 5, 1, 4], lead: 'marimba', arp: [0, 2, 3, 2], bass: 'bounce', shaker: true, density: 0.5 },
    sleepy: { bpm: 66, root: 65, scale: 'major', prog: [0, 3, 0, 4], lead: 'bell', arp: [0, 1, 2, 1], bass: 'root', shaker: false, density: 0.25, pad: true }
  };
  function mInst(name, t, m, dur, vol) {
    const f = mtof(m), o = { t, music: true };
    switch (name) {
      case 'bell': tone(f, dur, Object.assign({}, o, { vol, release: dur * 1.4 })); tone(f * 2, dur, Object.assign({}, o, { vol: vol * 0.3, release: dur * 0.7 })); break;
      case 'pluck': tone(f, dur, Object.assign({}, o, { type: 'triangle', vol, release: dur * 0.9 })); break;
      case 'marimba': tone(f, dur, Object.assign({}, o, { vol, release: dur * 0.6 })); tone(f * 4, dur, Object.assign({}, o, { vol: vol * 0.18, release: dur * 0.12 })); break;
      case 'flute': tone(f, dur, Object.assign({}, o, { vol: vol * 0.8, attack: 0.06, sustain: true, release: 0.18, vib: { f: 5, d: 4 } })); break;
      case 'bass': tone(f, dur, Object.assign({}, o, { type: 'triangle', vol, release: dur * 0.8 })); break;
      case 'pad': tone(f, dur, Object.assign({}, o, { type: 'sawtooth', vol, attack: 0.4, sustain: true, release: 0.6, filter: { f: 700 } })); tone(f, dur, Object.assign({}, o, { type: 'sawtooth', detune: 9, vol, attack: 0.4, sustain: true, release: 0.6, filter: { f: 700 } })); break;
    }
  }
  const music = {
    want: null, cur: null, timer: 0, step: 0, next: 0, motif: null, paused: false,
    play(style, force) {
      if (!STYLES[style]) style = 'happy';
      this.want = style;
      if (!force && this.cur === style && this.timer) return;
      this.stop(true); this.want = style;
      if (!unlocked || !settings.music) return;

}
function layoutWheel() {
  const A = area(), g = clamp(Math.min(A.W, A.H) * .03, 8, 18), row = A.W / A.H > 1.1;
  let wd = row ? Math.min(A.H - 4, A.W - 300 - g) : Math.min(A.W - 4, A.H - 250 - 2 * g);
  wd = clamp(wd, 220, 640);
  const pd = W6.n === 6 ? wd * .25 : Math.min(wd * .19, (0.2618 * wd - 8.1) / 1.2618);
  $('#ww').className = 'ww k-play ' + (row ? 'row' : 'col');
  setVars({ '--wd': wd, '--pd': pd, '--wc': W6.n === 6 ? wd * .4 : wd * .34, '--gap': g });
  positionPots();
}
function layout() {
  const s = Kit.curScreen;
  if (s === 'play') layoutPlay(); else if (s === 'free') layoutFree(); else if (s === 'wheel') layoutWheel();
}
Kit.onResize(layout);

/* =========================================================
   WIRING
   ========================================================= */
buildLab();
Kit.eyes($('#wCenter'), '.k-pupil', 4);
$('#wCenter').addEventListener('pointerdown', () => { catMood('gogdown', 1300); Kit.sfx('squeak'); });
$('#bPlay').addEventListener('click', goModes);
$('#bBook').addEventListener('click', openBook);
updBadge();
Kit.screen('title');

/* test hooks */
window.__game = {
  state: () => ({
    screen: Kit.curScreen, ch: G.ch ? { id: G.ch.id, name: G.ch.name, rec: G.ch.rec, hex: MIX.hex(G.ch.col), tol: G.ch.tol } : null, done: G.done, stars: G.stars,
    amt: Object.assign({}, LAB.amt), n: LAB.n, queue: LAB.queue.length, pumping: LAB.pumping, lock: LAB.lock, mix: LAB.col ? MIX.hex(LAB.col) : null,
    de: LAB.col && G.ch ? +MIX.de(LAB.col, G.ch.col).toFixed(2) : null, poured: LAB.poured, rinses: LAB.rinses, book: save.book.length,
    pic: F.pic ? F.pic.id : null, painted: F.pic ? Object.keys(save.paint[F.pic.id] || {}).length : 0, regions: F.pic && Kit.curScreen === 'free' ? regionsOf($('#pic')).length : 0,
    wheelN: W6.n, wheelFilled: W6.slots.filter(s => filled(s.i)).length, wheelTotal: W6.slots.length, busy: W6.busy
  }),
  nextStep: () => { const s = MIX.nextStep(G.ch.col, LAB.amt, CAP - LAB.n, G.ch.tol); return s && s.k; },
  emptyPots: () => W6.slots.filter(s => !filled(s.i)).map(s => ({ i: s.i, needs: s.needs, half: halfOf(s.i) })),
  counts: () => ({ challenges: CH.length, pictures: PICS.length, named: NAMED.length })
};
