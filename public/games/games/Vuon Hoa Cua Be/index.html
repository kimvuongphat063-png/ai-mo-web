<!DOCTYPE html>
<html lang="vi" data-game="vuonhoa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fcf5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vườn Hoa Của Bé</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Kit Bé Vui 4 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','EmojiOne Color',sans-serif;
  --ink:#3a2e5c; --ink2:#6e6492;
  --c1:#6f5cff; --c1d:#4c3bd6; --c1l:#ebe7ff;
  --c2:#ff6f9f; --c2d:#d94a7c;
  --ok:#35c46a; --okd:#1f9c4f;
  --gold:#ffc83d; --goldd:#de9800;
  --warn:#ff9a52; --warnd:#e06d22;
  --bg1:#bfe3ff; --bg2:#ffe1f0;
  --sh:40,24,90;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:78px;
  --ib:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-noselect{pointer-events:none}

/* ---------- top bar ---------- */
.k-bar{position:absolute;z-index:50;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 10px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-r{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.ibtn{position:relative;width:var(--ib);height:var(--ib);flex:0 0 auto;border:none;border-radius:19px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(var(--sh),.17),0 10px 18px rgba(var(--sh),.10);
  transition:transform .12s ease,box-shadow .12s ease,background .2s,color .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(var(--sh),.17),0 4px 8px rgba(var(--sh),.08)}
.ibtn svg{width:58%;height:58%}
.ibtn.off{color:#b6aecb;background:#f4f1fa}
.ibtn.on{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(var(--sh),.12)}
.ibtn .badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}
.k-bar .k-back{color:var(--c1d)}
@media (max-width:520px),(max-height:520px){
  :root{--ib:48px;--bar-h:66px}
  .ibtn{border-radius:16px}
  .k-bar{gap:7px;padding-top:calc(8px + var(--safe-t));padding-bottom:8px;padding-left:calc(9px + var(--safe-l));padding-right:calc(9px + var(--safe-r))}
  .k-bar .k-r{gap:7px}
}
@media (max-width:359px){ :root{--ib:44px} .k-bar .k-r{gap:5px} }

/* pill for mid-bar info */
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 14px 5px 6px;min-height:44px;
  font-weight:800;font-size:clamp(17px,2.6vmin,22px);color:var(--ink);box-shadow:0 5px 0 rgba(var(--sh),.14);white-space:nowrap;max-width:100%;overflow:hidden}
.k-pill .emo{font-size:26px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--c1l)}
.k-pill svg{width:28px;height:28px;flex:0 0 auto}
.k-dots{display:flex;gap:5px;align-items:center}
.k-dots i{width:12px;height:12px;border-radius:50%;background:#e6e0f3;transition:background .3s,transform .3s}
.k-dots i.on{background:var(--gold);transform:scale(1.15);box-shadow:0 2px 0 var(--goldd)}
.k-dots i.cur{background:var(--c1);transform:scale(1.25)}
@media (max-width:420px){ .k-dots i{width:9px;height:9px} .k-dots{gap:3px} .k-pill{padding:4px 10px 4px 5px;font-size:16px} }

/* ---------- buttons ---------- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.42em;
  font:800 clamp(20px,3.5vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:56px;
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(var(--sh),.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.26);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(var(--sh),.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.2em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.7vmin,22px);min-height:50px}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.orange{--b:var(--warn);--bd:var(--warnd)}
.btn.white{--b:#fff;--bd:#d9d2ee;color:var(--c1d);text-shadow:none}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.round{width:1.9em;height:1.9em;padding:0;border-radius:50%}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.k-play{touch-action:none}
.k-below{position:absolute;left:0;right:0;bottom:0;top:var(--bar-h)}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(46px,10.5vmin,108px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .32em rgba(var(--sh),.28)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.7vmin,23px);color:var(--ink2);margin:.25em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,3.8vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1;
  text-shadow:0 .08em 0 var(--c1d)}

/* level cards (generic) */
.k-grid{display:grid;gap:14px;width:min(1000px,100%);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.k-card{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:14px 10px 12px;box-shadow:0 7px 0 rgba(var(--sh),.16),0 14px 24px rgba(var(--sh),.08);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s;font-weight:800;color:var(--ink);font-size:clamp(16px,2.5vmin,20px);line-height:1.1;text-align:center;min-height:56px}
.k-card:active,.k-card.press{transform:translateY(4px) scale(.98)}
.k-card .emo{font-size:clamp(36px,6.5vmin,54px)}
.k-card small{font-weight:700;color:var(--ink2);font-size:.82em}
.k-card .k-num{position:absolute;top:-10px;left:-6px;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--c2);color:#fff;font:800 19px/34px var(--font);box-shadow:0 3px 0 var(--c2d)}
.k-ministars{display:flex;gap:2px;justify-content:center}
.k-ministars svg{width:clamp(18px,3vmin,24px);height:auto;color:#e7e1f4}
.k-ministars svg.on{color:var(--gold);filter:drop-shadow(0 1px 0 var(--goldd))}

/* ---------- overlay / modal ---------- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:calc(12px + var(--safe-t)) 14px calc(12px + var(--safe-b));touch-action:none}
.k-ov.out{animation:k-fadeout .2s ease forwards}
.k-panel{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:34px;padding:24px 20px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(var(--sh),.14),0 30px 60px rgba(var(--sh),.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain;touch-action:pan-y}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink2);line-height:1.3}
.k-close{position:absolute!important;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-result{overflow:visible;padding-top:20px}
.k-result .k-mascot{width:clamp(96px,20vmin,140px);height:auto;margin:-70px auto 0;display:block;filter:drop-shadow(0 6px 0 rgba(var(--sh),.12))}
.k-result .k-mascot svg{width:100%;height:auto;display:block}
.k-stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:8px 0 2px}
.k-stars svg{width:clamp(56px,11vmin,86px);height:auto;transform:scale(0);color:#e9e4f5;filter:drop-shadow(0 4px 0 rgba(150,110,20,.18))}
.k-stars svg.mid{width:clamp(66px,13vmin,100px)}
.k-stars svg.show{animation:k-star .55s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.on{color:var(--gold)}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#94600a;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both;text-align:left}
.k-reward .emo,.k-reward .k-rw{font-size:46px;width:56px;height:56px;display:grid;place-items:center;animation:k-wiggle 1.2s 1.4s ease-in-out infinite;flex:0 0 auto}
.k-reward .k-rw svg{width:100%;height:100%}
@media (max-height:520px){
  .k-result .k-mascot{width:84px;margin-top:-46px}
  .k-stars svg{width:52px}.k-stars svg.mid{width:62px}
  .k-panel{padding:14px 16px 16px;border-radius:26px}
  .k-panel h2{font-size:30px}
  .k-btns{margin-top:12px}
  .k-reward{margin-top:8px;padding:6px 14px 6px 8px}.k-reward .emo,.k-reward .k-rw{font-size:34px;width:42px;height:42px}
}

/* ---------- praise / toast ---------- */
.k-praise{position:fixed;z-index:85;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,86px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-float{position:fixed;z-index:85;pointer-events:none;font-weight:800;font-size:clamp(24px,4.5vmin,40px);color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;
  transform:translate(-50%,-50%);animation:k-floatup 1s ease-out forwards;white-space:nowrap}
.k-toast{position:fixed;z-index:86;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(var(--sh),.12),0 12px 24px rgba(var(--sh),.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}

/* ---------- fx canvas ---------- */
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---------- decorative background ---------- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.32);animation:k-float 9s ease-in-out infinite}

/* ---------- mascot helpers ---------- */
.k-blink{transform-box:fill-box;transform-origin:center;animation:k-blink 4.4s infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3.2s ease-in-out infinite}
.k-pupil{transition:transform .14s ease-out}
.k-talk{animation:k-talk .32s ease-in-out infinite}

/* ---------- animations ---------- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-fadeout{to{opacity:0}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-50deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}50%{transform:scale(.9,1.1)}70%{transform:scale(1.05,.96)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-floatup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-70%) scale(1.1);opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-anim-shake{animation:k-shake .45s ease-in-out}
.k-anim-jelly{animation:k-jelly .5s ease-in-out}
.k-anim-wiggle{animation:k-wiggle .5s ease-in-out}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
/* season colours are registered so they can cross-fade */
@property --sky1{syntax:'<color>';inherits:true;initial-value:#9fdcff}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#eaf9ff}
@property --lawn1{syntax:'<color>';inherits:true;initial-value:#9ee07c}
@property --lawn2{syntax:'<color>';inherits:true;initial-value:#8ad46b}
:root{--c1:#3fb24b;--c1d:#2a8a35;--c1l:#e3f6d9;--c2:#ff7fa8;--c2d:#de5584;--ink:#34502a;--ink2:#61794f;--sh:46,82,30;
  --sky1:#9fdcff;--sky2:#eaf9ff;--lawn1:#9ee07c;--lawn2:#8ad46b;--soil:#8a5a36;--soild:#6e4427;--soilw:#5a361f;
  transition:--sky1 1.2s,--sky2 1.2s,--lawn1 1.2s,--lawn2 1.2s}
:root.s1{--sky1:#62c2ff;--sky2:#dff5ff;--lawn1:#8edb55;--lawn2:#79c947}
:root.s2{--sky1:#ffc98a;--sky2:#fff1dc;--lawn1:#e3c46a;--lawn2:#d4ae4f}
:root.s3{--sky1:#b4c7e8;--sky2:#f1f5fc;--lawn1:#f4f9ff;--lawn2:#e1ebf7}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.t-hill{position:absolute;bottom:-14vh;height:42vh;border-radius:50%;pointer-events:none}
.t-hill.a{left:-30%;width:95%;background:var(--lawn2)}
.t-hill.b{right:-35%;width:110%;background:var(--lawn1);bottom:-18vh}
.t-hill.c{left:20%;width:70%;background:var(--lawn1);bottom:-24vh;opacity:.9}
.k-logo{-webkit-text-stroke-color:#2a8a35;text-shadow:0 .1em 0 #2a8a35,0 .2em .32em rgba(var(--sh),.28)}
.k-logo .l2{color:#ffd23d;font-size:1.05em}
.k-h{-webkit-text-stroke-color:#2a8a35;text-shadow:0 .08em 0 #2a8a35}
.k-panel h2{color:#2a8a35}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--c2);color:#fff;font:800 16px/28px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.btn .bi{width:1.25em;height:1.25em;display:inline-block;flex:0 0 auto}
.btn .bi svg{width:100%;height:100%;display:block}

/* ---------- title ---------- */
#title{padding:calc(var(--bar-h) + 4px) 16px calc(18px + var(--safe-b))}
.t-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(2px,1.2vmin,12px)}
.t-art{position:relative;width:clamp(200px,min(62vw,40vh),380px);height:clamp(176px,min(54vw,35vh),330px)}
.t-art>div{position:absolute}
.t-bun{left:26%;bottom:0;width:48%;cursor:pointer;z-index:2}
.t-bun svg,.t-pl svg{width:100%;height:auto;display:block}
.t-pl{bottom:2%;width:30%}
.t-pl.a{left:-2%}.t-pl.b{right:-2%;width:27%}.t-pl.c{left:14%;width:20%;bottom:0;z-index:1}.t-pl.d{right:12%;width:21%;bottom:0;z-index:1}
.t-pl svg{transform-origin:50% 92%;animation:sway 3.6s ease-in-out infinite}
.t-pl.b svg{animation-delay:-1.4s}.t-pl.c svg{animation-delay:-2.2s}.t-pl.d svg{animation-delay:-.6s}
.t-ground{position:absolute;left:-12%;right:-12%;bottom:-6%;height:20%;border-radius:50%;background:var(--lawn2);opacity:.75}
.t-txt{display:flex;flex-direction:column;align-items:center}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:clamp(10px,2.4vmin,22px)}
.t-btns .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  .t-wrap{flex-direction:row;gap:5vw}
  .t-art{width:min(40vmin,36vw);height:min(36vmin,32vw)}
  .t-btns{gap:12px;margin-top:8px}
  .k-sub{display:none}
}
.floaty{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaty i{position:absolute;display:block;width:clamp(30px,6.5vmin,58px);opacity:.75;animation:drift 10s ease-in-out infinite}
.floaty i svg{width:100%;height:auto;display:block}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1))}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* ---------- bunny mascot ---------- */
.bun .bhead{transform-box:fill-box;transform-origin:50% 90%;animation:btilt 5.5s ease-in-out infinite}
.bun .bear{transform-box:fill-box;transform-origin:50% 100%;animation:bear 4s ease-in-out infinite}
.bun .bear.r{animation-delay:-2s}
.bun .bflow{transform-box:fill-box;transform-origin:20% 100%;animation:sway 2.6s ease-in-out infinite}
.bun.happy .bbody{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.bun.happy .bear{animation:bearFast .18s ease-in-out 4 alternate}
.bun .bmouth{transform-box:fill-box;transform-origin:50% 0}
.bun.talk .bmouth{animation:k-talk .28s ease-in-out infinite}
@keyframes btilt{0%,40%,100%{transform:rotate(0)}50%,80%{transform:rotate(-5deg)}}
@keyframes bear{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-10deg)}90%{transform:rotate(6deg)}}
@keyframes bearFast{to{transform:rotate(-16deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}

/* ---------- garden ---------- */
#garden{overflow:hidden}
.gw{position:absolute;inset:0;overflow:hidden}
.bk{position:absolute;inset:0;pointer-events:none}
.bk-sky{position:absolute;left:0;right:0;top:0;height:var(--hz,40%);background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.bk-lawn{position:absolute;left:0;right:0;bottom:0;top:var(--hz,40%);background:var(--lawn1);
  background-image:repeating-linear-gradient(100deg,transparent 0 46px,rgba(255,255,255,.09) 46px 92px)}
.bk-lawn::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.25),transparent 60%)}
.bk-hedge{position:absolute;left:0;right:0;height:var(--hh,60px);top:calc(var(--hz,40%) - var(--hh,60px) + 2px);background-repeat:repeat-x;background-position:var(--hx,0) 100%;background-size:auto 100%}
.bk-shade{position:absolute;inset:0;background:rgba(30,40,80,.16);opacity:0;transition:opacity .8s}
.gw.dim .bk-shade{opacity:1}
.world{position:absolute;left:0;top:var(--bar-h);transform-origin:0 0}
.world>*{position:absolute}
.wl{position:absolute;inset:0;pointer-events:none}
.wl>*{position:absolute;pointer-events:auto}

/* sun + clouds */
.sun{width:0;height:0;z-index:2}
.sun .sw{position:absolute;transform:translate(-50%,-50%)}
.sun .rays{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.sun .glowr{transition:opacity .6s}
.sun.sleepy .glowr{opacity:.15}
.sun .face-h{transition:opacity .3s}.sun .face-s{opacity:0;transition:opacity .3s}
.sun.sleepy .face-h{opacity:0}.sun.sleepy .face-s{opacity:1}
.sun.sleepy .sw{filter:saturate(.55) brightness(.92)}
.sun.beam .sw{animation:sunpop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sunpop{40%{transform:translate(-50%,-50%) scale(1.25)}}
.cloud{z-index:3;cursor:grab;touch-action:none}
/* invisible grab pad: ~16 screen px around each cloud whatever the world scale (--hp is set in world units) */
.cloud::before{content:"";position:absolute;inset:calc(var(--hp,0px) * -1)}
.cloud .cw{display:block;animation:cbob 4.5s ease-in-out infinite}
.cloud:nth-of-type(2n) .cw{animation-delay:-2s}
.cloud svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 0 rgba(90,120,170,.15))}
.cloud.cover .cbody{fill:#e4e9f2}
.cloud.drag{cursor:grabbing}
.cloud.drag .cw{animation:none;transform:scale(1.06)}
.cloud.glow .cw{animation:cglow 1s ease-in-out infinite}
@keyframes cbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cglow{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(14px) scale(1.06)}}

/* garden bed + plots */
.bed{border-radius:26px;background:#b98454;box-shadow:inset 0 0 0 7px #d9a466,inset 0 0 0 10px #b07a45,0 8px 0 rgba(60,40,10,.18);
  background-image:radial-gradient(rgba(90,55,25,.22) 1.6px,transparent 2.4px),radial-gradient(rgba(255,230,190,.16) 1.4px,transparent 2px);background-size:22px 22px,17px 17px;background-position:0 0,8px 9px}
:root.s3 .bed{box-shadow:inset 0 0 0 7px #e9d2b2,inset 0 0 0 10px #c99b6c,0 8px 0 rgba(60,40,10,.14)}
.plot{touch-action:none;cursor:pointer}
.plot .mound{position:absolute;left:5%;width:90%;pointer-events:none}
.plot .mound svg{display:block;width:100%;height:auto}
.plot .mtop{transition:fill .5s}
.plot.wet .mtop{fill:var(--soilw)}
.plot .wetdots{opacity:0;transition:opacity .5s}
.plot.wet .wetdots{opacity:1}
.plot .pp{position:absolute;pointer-events:none;transform-origin:50% 92%}
.plot .pp svg{display:block;width:100%;height:auto;pointer-events:none}
.plot .pp svg *{pointer-events:visiblePainted}
.plot .pp.grow{animation:growpop .7s cubic-bezier(.3,1.6,.5,1)}
.plot.ripe .pp{animation:ripe 2.2s ease-in-out infinite}
.plot.need .pp{animation:sway 3s ease-in-out infinite}
.plot.need-water .pp{animation:droop 2.4s ease-in-out infinite}
@keyframes growpop{0%{transform:scale(.6,.4)}55%{transform:scale(1.1,1.12)}100%{transform:scale(1)}}
@keyframes ripe{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.03)}}
@keyframes droop{0%,100%{transform:rotate(-4deg) scaleY(.96)}50%{transform:rotate(3deg) scaleY(.94)}}
.plot .halo{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(255,244,150,.85),rgba(255,244,150,0) 68%);opacity:0;transition:opacity .4s}
.plot.ripe .halo{opacity:1;animation:halo 1.8s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.plot .ghost{position:absolute;pointer-events:none;border-radius:50%;border:3px dashed rgba(255,255,255,.95);display:none;place-items:center;background:rgba(255,255,255,.22)}
.plot .ghost svg{width:62%;height:62%;opacity:.95}
.plot.empty.sowing .ghost{display:grid;animation:k-pulse 1.2s ease-in-out infinite}
.plot .weed{position:absolute;pointer-events:none;transform-origin:50% 100%}
.plot .weed svg{display:block;width:100%;height:auto}
.plot .weed.in{animation:weedin .5s cubic-bezier(.3,1.6,.5,1) both}
.plot .weed .wg{transform-box:fill-box;transform-origin:50% 100%;animation:sway 1.6s ease-in-out infinite}
@keyframes weedin{from{transform:scale(0)}to{transform:scale(1)}}
.plot .bug{position:absolute;pointer-events:none}
.plot .bug svg{display:block;width:100%;height:auto}
.plot .bug .bseg{transform-box:fill-box;transform-origin:50% 100%;animation:crawl .5s ease-in-out infinite alternate}
.plot .bug .bseg:nth-child(2){animation-delay:.1s}.plot .bug .bseg:nth-child(3){animation-delay:.2s}.plot .bug .bseg:nth-child(4){animation-delay:.3s}
.plot .bug .bwalk{animation:bugwalk 3s ease-in-out infinite alternate}
.plot .bug.in{animation:k-pop .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes crawl{to{transform:translateY(-2.5px) scaleY(1.06)}}
@keyframes bugwalk{from{transform:translateX(-8%)}to{transform:translateX(10%)}}
.plot .bub{position:absolute;pointer-events:none;left:50%;transform:translate(-50%,-100%);opacity:0;transition:opacity .2s}
.plot .bub svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(var(--sh),.16))}
.plot .bub.on{pointer-events:auto;opacity:1;animation:bubin .45s cubic-bezier(.2,1.7,.4,1) both,bubbob 1.8s .45s ease-in-out infinite}
@keyframes bubin{from{transform:translate(-50%,-100%) scale(.2)}to{transform:translate(-50%,-100%) scale(1)}}
@keyframes bubbob{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-112%)}}
.plot.hl .bub.on{animation:bubin .45s cubic-bezier(.2,1.7,.4,1) both,bubhl .7s .45s ease-in-out infinite}

.plot .mark{position:absolute;pointer-events:none}

/* decorations, mascot, visitors */
.deco{pointer-events:auto;transform-origin:50% 100%}

.deco.out{animation:decoout .3s ease-in forwards}
.deco.wig{animation:k-jelly .5s ease-in-out}
@keyframes decoin{0%{transform:scale(0) translateY(-40px)}100%{transform:scale(1)}}
@keyframes decoout{to{transform:scale(0);opacity:0}}
.deco .swseat{transform-box:view-box;transform-origin:50% 12%;animation:swing 2.8s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.deco .lglow{animation:lglow 2.4s ease-in-out infinite}
:root:not(.s2):not(.s3) .deco .lglow{opacity:.35;animation:none}
@keyframes lglow{0%,100%{opacity:.6}50%{opacity:1}}
.deco .ripl{transform-box:fill-box;transform-origin:center;animation:ripl 3s ease-out infinite}
@keyframes ripl{from{transform:scale(.4);opacity:.8}to{transform:scale(1.4);opacity:0}}
:root.s3 .deco .water{fill:#cfe6fb}
:root.s3 .deco .ripl{display:none}
.deco .duck{animation:duck 7s ease-in-out infinite}
@keyframes duck{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.snowcap{display:none}
:root.s3 .snowcap{display:inline}
.mascot{z-index:900;cursor:pointer}
.mascot svg{display:block;width:100%;height:auto}
.vis{position:absolute;left:0;top:0;pointer-events:none!important;z-index:1500}
.vis svg{display:block;width:100%;height:auto}
.vis .wingL,.vis .wingR{transform-box:fill-box;animation:flap .2s ease-in-out infinite alternate}
.vis .wingL{transform-origin:100% 60%}.vis .wingR{transform-origin:0 60%}
.vis.slow .wingL,.vis.slow .wingR{animation-duration:.5s}
.vis .bwing{transform-box:fill-box;transform-origin:30% 80%;animation:bflap .12s ease-in-out infinite alternate}
.vis.perch .bwing{animation:none}
.vis .bfly{transform-box:fill-box;transform-origin:50% 100%;animation:bwing .2s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.5)}}
@keyframes bflap{to{transform:rotate(-30deg)}}
@keyframes bwing{to{transform:scaleY(.4)}}

/* tip bubble (speech of the mascot) */
.tipb{z-index:2000;pointer-events:none;background:#fff;border-radius:22px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:8px;
  box-shadow:0 5px 0 rgba(var(--sh),.15),0 10px 18px rgba(var(--sh),.12);font-weight:800;font-size:19px;line-height:1.1;color:var(--ink);white-space:nowrap;
  opacity:0;transform:scale(.3);transform-origin:var(--to,0 100%);transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.tipb.on{opacity:1;transform:scale(1)}
.tipb .ti{width:52px;height:52px;flex:0 0 auto;display:grid;place-items:center;border-radius:16px;background:#f0fae9}
.tipb .ti svg{width:86%;height:86%}
.tipb::after{content:"";position:absolute;bottom:-12px;left:var(--tail,26px);border:8px solid transparent;border-top:12px solid #fff;border-bottom:0}
.tipb.wrap{white-space:normal;width:max-content}
.tipb.side::after{bottom:auto;top:50%;left:-12px;margin-top:-8px;border:8px solid transparent;border-right:12px solid #fff;border-left:0}
.tipb.side.sr::after{left:auto;right:-12px;border-right:0;border-left:12px solid #fff}
.plot.ripe:not(.hl) .bub{opacity:0!important;pointer-events:none!important;animation:none!important}

/* weather particles */
.wx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.wx i{position:absolute;top:-30px;display:block;animation:fall var(--d,9s) linear infinite;animation-delay:var(--dl,0s)}
.wx i b{display:block;width:var(--sz,14px);height:var(--sz,14px);animation:wob var(--wd,2.6s) ease-in-out infinite alternate}
.wx i svg{display:block;width:100%;height:100%}
.wx.up i{top:auto;bottom:-30px;animation-name:rise}
@keyframes fall{from{transform:translate(0,0)}to{transform:translate(var(--dx,40px),calc(100vh + 60px))}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translate(var(--dx,40px),-70vh);opacity:0}}
@keyframes wob{from{transform:translateX(-12px) rotate(-30deg)}to{transform:translateX(12px) rotate(40deg)}}

/* tool dock */
.dock{position:absolute;z-index:40;display:flex;gap:var(--dg,10px);justify-content:center;align-items:center;pointer-events:none}
.dock.row{left:0;right:0;bottom:0;padding:8px calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));flex-direction:row}
.dock.col{left:0;top:var(--bar-h);bottom:0;padding:6px 8px calc(8px + var(--safe-b)) calc(8px + var(--safe-l));flex-direction:column}
.tool{pointer-events:auto;position:relative;width:var(--ts,64px);height:var(--ts,64px);border:none;border-radius:22px;background:#fff;padding:0;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 6px 0 rgba(var(--sh),.2),0 10px 18px rgba(var(--sh),.12);transition:transform .12s,box-shadow .12s;touch-action:none}
.tool svg{width:80%;height:80%;pointer-events:none}
.tool:active,.tool.press{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(var(--sh),.2)}
.tool.glow{animation:tglow 1.1s ease-in-out infinite}
@keyframes tglow{0%,100%{box-shadow:0 6px 0 rgba(var(--sh),.2),0 0 0 4px #ffd23d,0 0 16px 4px rgba(255,210,61,.7);transform:translateY(0)}50%{box-shadow:0 6px 0 rgba(var(--sh),.2),0 0 0 7px #ffd23d,0 0 26px 8px rgba(255,210,61,.85);transform:translateY(-5px)}}
.tool.held{opacity:.35}
.tool .tb{position:absolute;right:-6px;top:-6px;width:42%;height:42%;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(var(--sh),.2);display:grid;place-items:center}
.tool .tb svg{width:82%;height:82%}
.tool.sel{background:#fff6cf;box-shadow:0 6px 0 #e9b92f,0 10px 18px rgba(var(--sh),.12)}
.xtra{position:absolute;z-index:40;display:flex;gap:8px;left:calc(10px + var(--safe-l));top:calc(var(--bar-h) + 4px)}
.xtra .ibtn svg{width:72%;height:72%}
.k-bar .ibtn.xb svg{width:72%;height:72%}
.cnt{gap:6px;padding-right:16px}
.cnt .ci{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#fff3cf}
.cnt .ci svg{width:30px;height:30px}
.cnt b{min-width:1.3em;text-align:center}
.cnt.bump{animation:k-jelly .45s}

/* floating watering can, flying items, demo hand */
.fly{position:absolute;inset:0;pointer-events:none;z-index:60}
.fly>*{position:absolute;left:0;top:0}
.fcan{width:var(--cs,96px);transform-origin:84% 52%}
.fcan svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 6px rgba(var(--sh),.25))}
.fitem{width:var(--is,54px)}
.fitem svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 0 rgba(var(--sh),.15))}
.hand{width:var(--hs,70px);z-index:70;opacity:0}
.hand svg{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 4px rgba(0,0,0,.25))}
.beam{position:absolute;height:14px;border-radius:7px;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,236,120,.95),rgba(255,236,120,0));pointer-events:none}

/* modals: seed picker, shop, book, seasons */
.k-panel.wide{width:min(760px,100%)}
.mh{display:flex;align-items:center;justify-content:center;gap:6px 12px;margin:0 50px 6px;flex-wrap:wrap}
.mh .coins{margin:0}
.mh .mi{width:46px;height:46px;flex:0 0 auto}.mh .mi svg{width:100%;height:100%}

.pc{position:relative;border:none;background:#f6fbef;border-radius:22px;padding:8px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 5px 0 #dcebcc;font-family:var(--font);color:var(--ink);font-weight:800;font-size:16px;line-height:1.1;min-height:56px;transition:transform .12s}
.pc:active,.pc.press{transform:translateY(3px)}

.pc.nogrow .art{filter:grayscale(.85) opacity(.4)}
.pc.nogrow .nm{color:#9aa88d}
.pc .cts{display:flex;gap:8px;font-size:15px;color:var(--ink2)}
.pc .cts span{display:inline-flex;align-items:center;gap:2px}
.pc .cts svg{width:20px;height:20px}
.pc.seas{min-height:120px;justify-content:center}

.coins{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:22px;color:#94600a;background:#fff6dc;border-radius:99px;padding:4px 14px 4px 6px;margin-top:2px}

}

</head>

<script>
/* ===== Kit Bé Vui 4 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';
  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);

function bestLayout(w, h) {
  let best = 'P', bd = 1e9;
  for (const k in LAYOUTS) { const L = LAYOUTS[k]; const d = Math.abs(Math.log((w / h) / (L.W / L.H))); if (d < bd) { bd = d; best = k; } }

function layout() {
  if (!R.built) return;
  const W = innerWidth, H = innerHeight, barH = Math.ceil(Kit.bar.getBoundingClientRect().height);
  const dock = $('#dock'), rowDock = W < H * 1.02;

  let ts, gap, x0, y0, aw, ah;
  if (rowDock) {
    gap = clamp(W * .025, 8, 16); ts = clamp((Math.min(W, 640) - 24 - 4 * gap) / 5, 52, 80);
    const dh = ts + 18 + 8;
    x0 = 0; y0 = barH; aw = W; ah = H - barH - dh;
  } else {
    gap = clamp(H * .018, 6, 14); ts = clamp((H - barH - 18 - 4 * gap) / 5, 48, 80);
    const dw = ts + 18;
    x0 = dw; y0 = barH; aw = W - dw; ah = H - barH - 4;
  }
  dock.style.setProperty('--ts', ts + 'px'); dock.style.setProperty('--dg', gap + 'px');

  const mid = Kit.bar.mid;

    if (cntPill.parentNode !== mid) mid.appendChild(cntPill);
    const host = R.wide ? mid : xtra;
    [bxBook, bxShop, bxSeason].forEach(b => { if (b.parentNode !== host) host.appendChild(b); });
    xtra.style.left = (x0 + 10) + 'px';
  }
  const key = bestLayout(aw, ah), L = LAYOUTS[key];
  const S = Math.min(aw / L.W, ah / L.H);
  R.S = S; R.left = x0 + (aw - L.W * S) / 2; R.top = y0 + (ah - L.H * S) / 2;
  world.style.width = L.W + 'px'; world.style.height = L.H + 'px';
  world.style.left = R.left + 'px'; world.style.top = R.top + 'px'; world.style.transform = `scale(${S})`;
  world.style.setProperty('--hp', (16 / S).toFixed(1) + 'px');

  gw.style.setProperty('--hx', (R.left % (240 * S * 58 / 64)) + 'px');
  fly.style.setProperty('--cs', (L.cw * S * 1.0) + 'px');

/* put the bubble beside or above the mascot, wherever it hides the fewest plots */

  const free = right ? bed[0] - 8 : L.W - (bed[0] + bed[2]) - 8;

    let o = 0; boxes.forEach(b => { const ix = Math.max(0, Math.min(b[2], c.x + c.m.w) - Math.max(b[0], c.x)), iy = Math.max(0, Math.min(b[3], c.y + c.m.h) - Math.max(b[1], c.y)); o += ix * iy; });

  const tail = best.side ? 0 : clamp(M.x - best.x, 18, best.m.w - 30);
  t.style.setProperty('--tail', tail + 'px');
  t.style.setProperty('--to', best.side ? (right ? '0 50%' : '100% 50%') : tail + 'px 100%');
}

const bloomList = () => G.plots.map((p, i) => p.sp && p.st >= 3 ? i : -1).filter(i => i >= 0);

  if (onTimeline) onTimeline(V);

}

   ========================================================= */
const PACK = ['#ffd23d', '#ff7a8a', '#ff6b5a', '#ff8fb1', '#ff7fa8', '#ff9f43', '#ffab45', '#9fd36a', '#f2c94c', '#b48cf0'];
const packetSVG = (sp, k) => `<svg viewBox="0 0 70 84" aria-hidden="true"><path d="M8 10l6-6 6 6 6-6 6 6 6-6 6 6 6-6 6 6 6-6v74H8z" fill="#fffaf0" stroke="#e8d8b8" stroke-width="2"/><rect x="8" y="10" width="54" height="14" fill="${PACK[k % PACK.length]}"/>
  <circle cx="35" cy="50" r="22" fill="#f0fae9"/><g transform="translate(9 25) scale(.87)">${ITEM[sp]()}</g></svg>`;
function openSeeds(target) {
  if (modalOpen()) return;
  R.pendingPlot = target;
  const m = Kit.modal({ cls: 'wide', html: `<div class="mh"><span class="mi">${ICON.seed}</span><h2>Chọn hạt</h2></div><div class="pgrid" id="seedGrid"></div>`, tapOut: true });
  const g = $('#seedGrid', m.panel);
  SPECIES.forEach((s, k) => {
    const b = el('button', 'pc seedp', `<span class="art">${packetSVG(s.id, k)}</span><span class="nm">${s.name}</span>`); b.dataset.sp = s.id;
    b.addEventListener('click', () => chooseSeed(m, s.id)); g.appendChild(b);
  });
  const rb = el('button', 'pc seedp', `<span class="art"><svg viewBox="0 0 70 84"><path d="M8 10l6-6 6 6 6-6 6 6 6-6 6 6 6-6 6 6 6-6v74H8z" fill="#fffaf0" stroke="#e8d8b8" stroke-width="2"/><rect x="8" y="10" width="54" height="14" fill="#5ec8ff"/><g transform="translate(17 32) scale(1.5)" color="#3f8fe0">${Kit.icon('dice').replace('<svg', '<svg width="24" height="24"')}</g></svg></span><span class="nm">Ngẫu nhiên</span>`);
  rb.dataset.sp = 'rand'; rb.addEventListener('click', () => chooseSeed(m, 'rand')); g.appendChild(rb);
  Kit.sfx('page'); talk('Bé chọn hạt giống nào?');
}
function chooseSeed(m, sp) {
  m.close();
  setSeedMode(sp);
  if (sp !== 'rand') Kit.say(SP[sp].say);
  const t = R.pendingPlot; R.pendingPlot = null;
  if (t != null && !G.plots[t].sp) T.after(160, () => sow(t, sp));
  else T.after(400, () => { const a = nextAction(); if (a.k === 'sow') hintFor('sow', a.i, !G.seen.sow); G.seen.sow = 1; });
}
function openShop() {
  if (modalOpen()) return;
  const m = Kit.modal({ cls: 'wide', html: `<div class="mh"><span class="mi">${ICON.shop}</span><h2>Cửa hàng</h2><span class="coins">${ICON.coin}<b id="shopC">${G.coins}</b></span></div><div class="pgrid" id="shopGrid"></div>`, tapOut: true });
  const g = $('#shopGrid', m.panel);
  const card = d => {
    const own = !!G.owned[d.id], on = own && G.shown[d.id];
    const b = el('button', 'pc deco-c' + (own ? ' own' : '') + (own && !on ? ' off' : ''));
    b.dataset.id = d.id;
    b.innerHTML = `<span class="art">${decoSVG(d.id)}</span><span class="nm">${d.name}</span>` +
      (own ? `<span class="pr">${on ? Kit.icon('check') : Kit.icon('plus')}<span>${on ? 'Trong vườn' : 'Đặt vào'}</span></span>` : `<span class="pr">${ICON.coin}<b>${d.price}</b></span>`);
    $('.pr svg', b) && ($('.pr svg', b).style.width = '20px');
    return b;
  };
  DECOR.forEach(d => {
    let b = card(d); g.appendChild(b);
    const onTap = () => {
      if (G.owned[d.id]) {
        G.shown[d.id] = !G.shown[d.id]; persist(); Kit.sfx(G.shown[d.id] ? 'pop' : 'put');
        if (R.built && R.lay) placeDeco(d.id, G.shown[d.id] ? 'in' : 'out');
        const nb = card(d); nb.addEventListener('click', onTap); b.replaceWith(nb); b = nb; Kit.jelly(nb);
        return;
      }
      if (G.coins >= d.price) {
        G.coins -= d.price; G.owned[d.id] = true; G.shown[d.id] = true; persist();
        Kit.sfx('coin'); Kit.sfx('win'); $('#shopC', m.panel).textContent = G.coins;
        if (Kit.curScreen === 'garden') {
          setCount(G.coins, true); m.close();
          T.after(260, () => { placeDeco(d.id, 'in'); const e = R.deco[d.id]; if (e) { const c = Kit.center(e); Kit.fx.burst(c.x, c.y, { n: 22 }); Kit.fx.sparkle(c.x, c.y); } tip(decoSVG(d.id), d.name + '!', d.name + ' đẹp quá!'); updateHints(); });
        } else { const nb = card(d); nb.addEventListener('click', onTap); b.replaceWith(nb); b = nb; Kit.jelly(nb); const c = Kit.center(nb); Kit.fx.burst(c.x, c.y, { n: 18 }); Kit.say(d.name + ' đẹp quá!'); }
        return;
      }
      Kit.sfx('no'); Kit.shake(b); Kit.vibrate(30);
      Kit.toast(`<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:28px;height:28px;display:inline-block">${ICON.coin}</span>Cần thêm ${d.price - G.coins}</span>`);
      Kit.say('Bé thu hoạch thêm để mua nhé!');
    };
    b.addEventListener('click', onTap);
  });
  Kit.sfx('page');
}
function openBook() {
  if (modalOpen()) return;
  const grown = SPECIES.filter(s => (G.book[s.id] || {}).h > 0).length;
  const m = Kit.modal({ cls: 'wide', html: `<div class="mh"><span class="mi">${ICON.book}</span><h2>Sổ cây</h2><span class="coins">${stampSVG().replace('<svg', '<svg style="width:28px;height:28px"')}<b>${grown} / ${SPECIES.length}</b></span></div><div class="pgrid" id="bookGrid"></div>`, tapOut: true });
  const g = $('#bookGrid', m.panel);
  SPECIES.forEach(s => {
    const b0 = G.book[s.id] || { p: 0, h: 0 };
    const c = el('button', 'pc bk-c' + (b0.p ? '' : ' nogrow'), `<span class="art">${plantSVG(s.id, 3)}</span><span class="nm">${s.name}</span>
      <span class="cts"><span>${ICON.seed}${b0.p}</span><span>${ICON.coin.replace('viewBox="0 0 40 40"', 'viewBox="0 0 40 40"')}${b0.h}</span></span>${b0.h ? `<span class="stamp">${stampSVG()}</span>` : ''}`);
    c.dataset.sp = s.id;
    c.addEventListener('click', () => { if (b0.p) { Kit.jelly(c); Kit.sfx('pop'); Kit.say(s.say); } else { Kit.shake(c); Kit.sfx('tap'); Kit.say('Bé gieo hạt ' + s.name + ' nhé!'); } });
    g.appendChild(c);
  });
  Kit.sfx('page');
}
function openSeasons() {
  if (modalOpen()) return;
  const m = Kit.modal({ cls: 'wide', html: `<div class="mh"><span class="mi">${SEASON_ICON[G.season]}</span><h2>Chọn mùa</h2></div><div class="pgrid" id="seaGrid" style="--pc:120px"></div>`, tapOut: true });
  const g = $('#seaGrid', m.panel);
  SEASONS.forEach((s, k) => {
    const b = el('button', 'pc seas' + (k === G.season ? ' cur' : ''), `<span class="art">${SEASON_ICON[k]}</span><span class="nm">${s.name}</span>`); b.dataset.k = k;
    b.addEventListener('click', () => { m.close(); setSeason(k); });
    g.appendChild(b);
  });
  Kit.sfx('page');
}
function setSeason(k) { G.season = k; G.sh = 0; persist(); applySeason(true); Kit.say(SEASONS[k].name + '!'); }
function seasonUp() {
  const s = (G.season + 1) % 4; G.season = s; persist(); applySeason(true);
  T.after(900, () => {
    if (modalOpen()) Kit.closeModals();
    Kit.result({ stars: 3, title: SEASONS[s].name + ' đến rồi!', text: `Bé đã thu hoạch ${PER_SEASON} lần. Vườn đổi màu rồi!`, mascot: bunnySVG(), reward: { svg: SEASON_ICON[s], text: SEASONS[s].name },
      buttons: [{ label: 'Chơi tiếp', icon: 'play', cls: 'ok', pulse: true }], speak: 'Giỏi quá! ' + SEASONS[s].name + ' đến rồi!' });
  });
}

/* =========================================================
   TITLE · FLOWS · WIRING
   ========================================================= */
function buildTitle() {
  $('#tBun').innerHTML = bunnySVG(); Kit.eyes($('#tBun'), '.k-pupil', 5);
  $('#tpA').innerHTML = plantSVG('sun', 3); $('#tpB').innerHTML = plantSVG('tulip', 3); $('#tpC').innerHTML = plantSVG('daisy', 3); $('#tpD').innerHTML = plantSVG('berry', 3);
  $('#biBook').innerHTML = ICON.book; $('#biShop').innerHTML = ICON.shop;
  const f = $('#floaty'), spots = [[4, 16], [84, 20], [3, 52], [88, 46], [6, 84], [80, 80], [44, 6], [62, 92], [22, 34], [70, 30]];
  const items = ['sun', 'tulip', 'berry', 'rose', 'daisy', 'tomato', 'lav', 'carrot'];
  spots.forEach((s, i) => { const d = el('i', '', i < 8 ? itemSVG(items[i]) : butterflySVG(i)); d.style.left = s[0] + '%'; d.style.top = s[1] + '%'; d.style.setProperty('--r', ((i % 2 ? 1 : -1) * rand(5, 12)).toFixed(1) + 'deg'); d.style.animationDelay = (-i * 1.1) + 's'; f.appendChild(d); });
  $('#tBun').addEventListener('pointerdown', () => { bunHappy($('#tBun')); Kit.sfx('squeak'); talk(pick(['Chào bé! Mình là Thỏ Mơ!', 'Cùng trồng hoa nào!', 'Vườn của bé đẹp lắm!'])); });
}
function updBookBadge() { $('#bookN').textContent = SPECIES.filter(s => (G.book[s.id] || {}).h > 0).length; }
function leaveGarden() {
  T.clear(); cancelDemo(); hideTip();
  if (R.pour) { R.pour.el.remove(); R.pour = null; }
  tools.can.classList.remove('held');
  fly.innerHTML = ''; wlVis.innerHTML = ''; R.vis = []; R.needT = {};
  R.clouds.forEach(C => { C.tw++; C.el.classList.remove('drag'); });
  [cntPill, bxBook, bxShop, bxSeason].forEach(b => b.remove());
}
function goTitle() {
  leaveGarden(); Kit.closeModals(); Kit.hush();
  Kit.screen('title'); Kit.back(null); Kit.bar.mid.innerHTML = '';
  updBookBadge(); Kit.music.play('garden'); saveNow();
}
function goGarden() {
  leaveGarden(); Kit.closeModals();
  Kit.screen('garden'); Kit.back(goTitle);
  buildGarden(); layout(); renderAll(); setCount(G.coins);
  DECOR.forEach(d => placeDeco(d.id));
  resumeNeeds(); updateHints();
  R.lastAct = performance.now();
  T.every(1000, idleCheck); T.every(3200, visitorTick);
  Kit.music.play('garden');
  if (!G.intro) { G.intro = 1; persist(); T.after(700, () => { const i = G.plots.findIndex(p => !p.sp); tip(ICON.seed, 'Chạm ô đất', 'Chào bé! Mình là Thỏ Mơ. Bé chạm vào ô đất để gieo hạt nhé!'); if (i >= 0) demo('tap', (() => { const m = plotPt(i); return { x: m.x, y: m.y - m.cw * .1 }; })()); }); }
  else T.after(700, () => { const a = nextAction(); if (a.k !== 'wait') hintFor(a.k, a.i, false); });
}
tools.seed.addEventListener('click', () => {
  Kit.sfx('tap'); R.lastAct = performance.now(); cancelDemo();
  if (!G.plots.some(p => !p.sp)) { tip(ICON.basket, 'Vườn đầy rồi!', 'Vườn đầy rồi! Bé thu hoạch cây chín để có chỗ trống nhé.'); return; }
  openSeeds(null);
});
tools.hand.addEventListener('click', () => {
  Kit.sfx('tap'); R.lastAct = performance.now(); Kit.jelly(tools.hand);
  const i = G.plots.findIndex(p => p.need === 'weed');
  if (i >= 0) hintFor('weed', i, true); else tip(ICON.hand, 'Chưa có cỏ dại', 'Vườn sạch cỏ rồi!');
});
tools.bug.addEventListener('click', () => {
  Kit.sfx('tap'); R.lastAct = performance.now(); Kit.jelly(tools.bug);
  const i = G.plots.findIndex(p => p.need === 'bug');
  if (i >= 0) hintFor('bug', i, true); else tip(ICON.bug, 'Chưa có sâu', 'Không có bạn sâu nào cả!');
});
tools.basket.addEventListener('click', () => {
  Kit.sfx('tap'); R.lastAct = performance.now(); Kit.jelly(tools.basket);
  const list = bloomList();
  if (!list.length) { tip(ICON.basket, 'Chưa có cây chín', 'Chưa có cây nào chín. Bé chăm cây thêm nhé!'); return; }
  list.forEach((i, k) => T.after(k * 320, () => harvest(i)));
});
bxBook.addEventListener('click', openBook); bxShop.addEventListener('click', openShop); bxSeason.addEventListener('click', openSeasons);
$('#bPlay').addEventListener('click', goGarden);
$('#bBook').addEventListener('click', openBook);
$('#bShop').addEventListener('click', openShop);

/* boot */
G = loadGarden();
buildTitle(); updBookBadge(); applySeason(false);
Kit.screen('title');

/* test hooks */
window.__game = {
  state: () => ({ screen: Kit.curScreen, plots: G.plots.map(p => ({ sp: p.sp, st: p.st, need: p.need })), coins: G.coins, shownCoins: R.shownCoins, owned: Object.keys(G.owned).filter(k => G.owned[k]),
    shown: Object.keys(G.shown).filter(k => G.shown[k] && G.owned[k]), season: G.season, harv: G.harv, sh: G.sh, seedMode: R.seedMode, covered: R.built ? sunCovered() : false, layout: R.key, vis: R.vis.length, book: G.book, next: R.built ? nextAction() : null }),
  plotPt: i => plotPt(i), headPt: i => headPt(i), canPoint: i => canPoint(i),
  coverCloud: () => { const C = R.clouds.find(c => Math.hypot(c.x - R.sun.x, c.y - R.sun.y) < R.sun.r + c.w * .3); if (!C) return null; const p = toScreen(C.x, C.y); return { x: p.x, y: p.y, w: C.w * R.S, dir: R.sun.x > R.lay.W / 2 ? -1 : 1 }; },
  weedPt: i => { const r = R.plots[i].weed.getBoundingClientRect(); return r.width ? { x: r.left + r.width / 2, y: r.top + r.height * .6 } : null; },
  bugPt: i => { const r = R.plots[i].bug.getBoundingClientRect(); return r.width ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : null; },
  fast: on => { R.fast = !!on; },
  wipe: () => { noSave = true; clearTimeout(saveT); Kit.store.del('garden'); },   // test only: fresh garden on next load
  spawn: k => { if (k === 'b') spawnButterfly(); else if (k === 'e') spawnBee(); else spawnBird(); },
  snapshot: () => JSON.stringify({ p: G.plots.map(p => [p.sp, p.st, p.need]), c: G.coins, o: G.owned, s: G.shown, se: G.season, h: G.harv, b: G.book })
};
</script>
</body>
