<!DOCTYPE html>
<html lang="vi" data-game="balloons">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5cbcff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bong Bóng Bay</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
:root{--c1:#2f9bff;--c1d:#1668cf;--c1l:#e1f1ff;--c2:#ff6f91;--c2d:#e0466d;--bg1:#5cbcff;--bg2:#eaf8ff;--ink:#22385e;--ink-soft:#587095;
  --ph:56px;--pf:23px;--outline:#24305e}
body{background:linear-gradient(180deg,#46b0ff 0%,#7fcdff 38%,#c4ebff 74%,#ecfaff 100%)}
.ibtn{color:var(--c1d);box-shadow:0 5px 0 rgba(16,60,120,.16),0 10px 18px rgba(16,60,120,.10)}

/* ================= scene ================= */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sun{position:absolute;right:calc(3vw + var(--safe-r));top:calc(var(--bar-h) + var(--safe-t) - 6px);width:clamp(74px,14vmin,150px);aspect-ratio:1}
.sun svg{position:absolute;inset:0;width:100%;height:100%}
.sun .rays{animation:spin 40s linear infinite}
.sun .sface .se{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cloud{position:absolute;left:0;will-change:transform;animation:cloud linear infinite}
.cloud svg{display:block;width:100%;height:auto}
@keyframes cloud{from{transform:translate3d(-110%,0,0)}to{transform:translate3d(100vw,0,0)}}
.hills{position:absolute;left:0;right:0;bottom:0;height:clamp(64px,15vh,170px);width:100%}
.birds{position:absolute;left:0;top:22%;width:60px;animation:cloud 46s linear infinite;animation-delay:-20s}
.birds svg{width:100%;height:auto;display:block}
body.paused .scene *,body.paused #play *,body.paused #title *{animation-play-state:paused!important}

/* ================= title ================= */
#title{padding:calc(var(--bar-h) + var(--safe-t)) 16px calc(18px + var(--safe-b))}
.tfl{position:absolute;inset:0;overflow:hidden;z-index:0}
.tb{position:absolute;bottom:-34vmin;width:var(--w);height:calc(var(--w)*1.75);animation:tbUp var(--d) linear infinite;animation-delay:var(--dl);cursor:pointer;touch-action:manipulation}
.tb .tbi{width:100%;height:100%;animation:sway 2.6s ease-in-out infinite alternate;transform-origin:50% 0}
.tb svg{width:100%;height:100%;display:block;overflow:visible}
.tb.gone{visibility:hidden}
@keyframes tbUp{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,calc(-100vh - 70vmin),0)}}
.tmain{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.4vmin,14px)}
.bear{width:clamp(150px,min(46vw,33vh),290px);height:auto;overflow:visible;cursor:pointer}
.bear .bfly{animation:bfly 3.4s ease-in-out infinite}
.bear .bshadow{transform-box:fill-box;transform-origin:center;animation:bshadow 3.4s ease-in-out infinite}
@keyframes bfly{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
@keyframes bshadow{0%,100%{transform:scale(1);opacity:.16}50%{transform:scale(.8);opacity:.09}}
.bear .leg1,.bear .leg2{transform-box:fill-box;transform-origin:50% 10%;animation:leg 1.7s ease-in-out infinite alternate}
.bear .leg2{animation-delay:-.85s}
@keyframes leg{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.bear .arm{transform-box:fill-box;transform-origin:80% 10%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(16deg)}80%{transform:rotate(-6deg)}90%{transform:rotate(12deg)}}
.bear .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
.bear .pupils{transition:transform .15s ease-out}
.bear .mb{transform-box:fill-box;transform-origin:50% 100%;animation:mbs 3s ease-in-out infinite alternate}
.bear .mb1{animation-delay:-1s}.bear .mb3{animation-delay:-2s}
@keyframes mbs{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.bear.happy .bfly{animation:bhop .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes bhop{0%,100%{transform:translateY(0)}40%{transform:translateY(-34px) rotate(-4deg)}}
.logo{-webkit-text-stroke:.16em #1a5fbf;text-shadow:0 .1em 0 #1a5fbf,0 .2em .3em rgba(10,50,120,.25)}
.logo .ch{display:inline-block;animation:lw 2.6s ease-in-out infinite}
.logo .l2 .ch{color:#ffe66b}
@keyframes lw{0%,100%{transform:translateY(0)}50%{transform:translateY(-.08em)}}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(6px,1.6vmin,16px)}
.tbtns .btn.gold{font-size:clamp(18px,3vmin,24px)}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .tmain{flex-direction:row;gap:5vw}
  .ttxt{display:flex;flex-direction:column;align-items:center}
  .bear{width:min(46vmin,40vw)}
  .logo{font-size:clamp(40px,11vmin,80px)}
}

/* ================= modes ================= */
#modes{justify-content:flex-start;overflow-y:auto;overflow-x:hidden;padding:calc(var(--bar-h) + var(--safe-t)) 14px calc(16px + var(--safe-b))}
.mwrap{margin:auto 0;width:min(1060px,100%);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.sec-h{margin:4px 0 2px;font-size:clamp(20px,3.6vmin,30px);font-weight:800;color:#fff;-webkit-text-stroke:.14em #1a5fbf;paint-order:stroke fill;text-align:center;
  text-shadow:0 3px 0 #1a5fbf}
.mgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.mc{flex:0 1 calc((100% - 48px)/5);border:none;cursor:pointer;border-radius:26px;padding:10px 6px 10px;background:#fff;box-shadow:0 6px 0 rgba(16,60,120,.16);
  display:flex;flex-direction:column;align-items:center;gap:0;font-weight:800;color:var(--ink);font-size:clamp(17px,2.6vmin,22px);position:relative;transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .2s}
.mc .mi{width:clamp(54px,10vmin,96px);height:auto;overflow:visible}
.mc .mi .mbb{transform-box:fill-box;transform-origin:50% 100%}
.mc.on .mi .mbb{animation:mbs 1.2s ease-in-out infinite alternate}
.mc small{font-weight:700;color:var(--ink-soft);font-size:.74em;display:flex;align-items:center;gap:3px;line-height:1.2}
.mc small svg{width:1em;height:1em;color:#ffc83d}
.mc.on{background:var(--mc);color:#fff;box-shadow:0 6px 0 var(--mcd),0 0 0 4px #fff;transform:translateY(-3px) scale(1.04)}
.mc.on small{color:rgba(255,255,255,.92)}
.mc.on small svg{color:#fff3b0}
.mc:active{transform:translateY(3px)}
.lgrid{display:flex;justify-content:center;gap:14px;width:100%;flex-wrap:wrap;padding-top:6px}
.lv{flex:0 1 230px;min-width:0;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:14px 8px 10px;box-shadow:0 7px 0 rgba(16,60,120,.18);display:flex;flex-direction:column;align-items:center;gap:4px;
  position:relative;transition:transform .15s;min-height:clamp(118px,21vmin,186px);justify-content:space-between;color:var(--ink)}
.lv:active{transform:translateY(4px)}
.lv .num{position:absolute;top:-10px;left:-6px;width:36px;height:36px;border-radius:50%;background:var(--mc);color:#fff;font:800 20px/36px var(--font);box-shadow:0 3px 0 var(--mcd)}
.lv .lp{font-weight:800;font-size:clamp(26px,5.4vmin,48px);line-height:1;color:var(--mc);display:flex;align-items:center;justify-content:center;gap:.12em;min-height:1.1em;
  -webkit-text-stroke:.05em var(--mcd);paint-order:stroke fill}
.lv .lp .dot{width:.5em;height:.6em;border-radius:50% 50% 46% 46%;box-shadow:inset -.06em -.08em 0 rgba(0,0,0,.18),inset .06em .06em 0 rgba(255,255,255,.4)}
.lv .lp svg{width:.78em;height:.78em}
.lv .ln{font-weight:800;font-size:clamp(15px,2.4vmin,20px);line-height:1.1}
.lv .st{display:flex;gap:1px}
.k-mini-star svg{width:clamp(18px,3vmin,26px);height:auto;color:#dfe8f3}
.k-mini-star.on svg{color:#ffc83d}
.lv.locked{background:#e6eef8;box-shadow:0 7px 0 rgba(16,60,120,.1);cursor:default}
.lv.locked .lp{opacity:.3;filter:grayscale(1)}
.lv.locked .ln{color:#93a6c4}
.lv.locked .num{background:#a9b9d0;box-shadow:0 3px 0 #8396b3}
.lv .lk{color:#93a6c4;height:clamp(18px,3vmin,26px);display:grid;place-items:center}
.lv .lk svg{width:clamp(20px,3.4vmin,26px);height:auto}
.lv.new::after{content:"MỚI";position:absolute;top:-10px;right:-6px;background:var(--gold);color:#6b3d00;font:800 13px/1 var(--font);padding:5px 8px;border-radius:10px;box-shadow:0 3px 0 var(--goldd);animation:k-pulse 1.2s infinite}
.lv.free{flex-basis:300px}
.lv.free .lp{font-size:clamp(34px,7vmin,60px)}
@media (max-width:600px) and (orientation:portrait){
  .mc{flex-basis:calc((100% - 24px)/3)}
  .lv{flex-basis:calc((100% - 28px)/3)}
  .lv.free{flex-basis:70%}
}
@media (max-width:600px) and (orientation:portrait) and (max-height:760px){
  .mwrap{gap:4px}
  .mc{padding:6px 4px 7px;border-radius:22px}
  .mc .mi{width:44px}
  .lv{min-height:100px;padding:12px 4px 8px;gap:2px}
  .lv .lp{font-size:24px}
}
@media (max-height:520px){
  .mwrap{gap:4px}
  .sec-h{font-size:19px;margin:0}
  .mc{flex-direction:row;justify-content:center;gap:4px;padding:5px 6px;border-radius:18px;font-size:16px}
  .mc .mi{width:30px}
  .mc small{display:none}
  .lv{min-height:0;padding:10px 6px 6px;gap:2px;flex-basis:200px}
  .lv .lp{font-size:28px}
}

/* ================= play ================= */
#play{justify-content:flex-start}
#stage{position:absolute;inset:0;z-index:2;touch-action:none;overflow:hidden;--S:100px}
.bl{position:absolute;left:0;top:0;width:var(--S);height:calc(var(--S)*1.78);will-change:transform;transform-origin:50% 32%;pointer-events:none}
.bw{position:absolute;inset:0;transform-origin:50% 36%}
.bw::before{content:"";position:absolute;left:-26%;top:-20%;width:152%;height:calc(var(--S)*1.56);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,252,200,.95),rgba(255,236,120,.6) 55%,rgba(255,236,120,0));opacity:0;transform:scale(.6);transition:opacity .35s,transform .35s}
.bl.hint .bw::before{opacity:1;transform:scale(1);animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(.86)}to{transform:scale(1.06)}}
.bb{position:absolute;left:0;top:0;width:100%;height:calc(var(--S)*1.2);overflow:visible}
.bs{position:absolute;left:calc(50% - var(--S)*.12);top:calc(var(--S)*1.13);width:calc(var(--S)*.24);height:calc(var(--S)*.64);transform-origin:50% 0;animation:sway 2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.bt{position:absolute;left:0;top:0;width:100%;height:calc(var(--S)*1.04);display:grid;place-items:center;padding-top:calc(var(--S)*.04);color:#fff;font-weight:800;
  font-size:calc(var(--S)*.6);line-height:1;-webkit-text-stroke:calc(var(--S)*.055) var(--outline);paint-order:stroke fill;text-shadow:0 calc(var(--S)*.035) 0 rgba(36,48,94,.45)}
.bt.two{font-size:calc(var(--S)*.47);letter-spacing:-.03em}
.bt svg{width:60%;height:auto;overflow:visible}
.bt.face svg{width:74%}
.bt.gift{font-size:calc(var(--S)*.44);-webkit-text-stroke:0;text-shadow:0 3px 4px rgba(0,0,0,.15)}
.bw.wob{animation:wob .62s cubic-bezier(.3,.6,.4,1)}
@keyframes wob{0%{transform:none}14%{transform:scale(1.15,.85) rotate(-8deg)}32%{transform:scale(.9,1.1) rotate(7deg)}52%{transform:scale(1.06,.95) rotate(-4deg)}72%{transform:scale(.97,1.03) rotate(2deg)}100%{transform:none}}
.bl .tw{position:absolute;width:calc(var(--S)*.16);height:calc(var(--S)*.16);background:#fff7c2;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.1s ease-in-out infinite}
.bl .tw.t1{left:-6%;top:12%}.bl .tw.t2{right:-4%;top:4%;animation-delay:-.4s}.bl .tw.t3{right:2%;top:58%;animation-delay:-.8s;width:calc(var(--S)*.12);height:calc(var(--S)*.12)}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}

#tray{position:absolute;z-index:3;left:50%;bottom:calc(8px + var(--safe-b));transform:translateX(-50%);pointer-events:none;background:rgba(255,255,255,.86);border-radius:999px;
  padding:6px 12px;box-shadow:0 5px 0 rgba(16,60,120,.14),0 10px 24px rgba(16,60,120,.14);display:flex;gap:var(--tg,5px);--ts:40px}
.slot{position:relative;width:var(--ts);height:calc(var(--ts)*1.16)}
.slot::before{content:"";position:absolute;left:5%;right:5%;top:3%;bottom:14%;border-radius:50% 50% 46% 46%;border:2.5px dashed #9fc7ee;background:rgba(214,236,255,.7)}
.slot.on::before{display:none}
.slot.pop .mini{animation:slotIn .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes slotIn{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#tray.full{animation:trayJ .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes trayJ{0%,100%{transform:translateX(-50%)}40%{transform:translateX(-50%) translateY(-12px) scale(1.06)}}
.mini{position:absolute;inset:0;display:block}
.mini svg.mbx{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mini .ml{position:absolute;left:0;right:0;top:0;height:88%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:calc(var(--ts)*.56);line-height:1;padding-top:4%;
  -webkit-text-stroke:calc(var(--ts)*.07) var(--outline);paint-order:stroke fill}
.mini .ml.two{font-size:calc(var(--ts)*.42)}
.mini .ml svg{width:58%;height:auto;overflow:visible}
.fly{position:absolute;left:0;top:0;z-index:6;pointer-events:none;will-change:transform}

#peek{position:absolute;z-index:1;left:calc(2px + var(--safe-l));bottom:0;width:var(--pk,90px);pointer-events:none;transform-origin:50% 100%}
#peek svg{width:100%;height:auto;display:block;overflow:visible}
#peek .ph{transform-box:fill-box;transform-origin:50% 95%;animation:phIdle 3.6s ease-in-out infinite}
#peek .pe{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes phIdle{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
#peek.yay{animation:pkYay .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes pkYay{0%,100%{transform:translateY(0)}35%{transform:translateY(-26%) scale(1.06)}70%{transform:translateY(2%) scale(1.02,.96)}}
#peek.yay .pp{animation:paw .75s ease-in-out}
@keyframes paw{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
#peek .pp{transform-box:fill-box;transform-origin:center}
#peek.hmm .ph{animation:pkHmm .9s ease-in-out}
@keyframes pkHmm{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg)}60%{transform:rotate(-10deg)}}
#peek .pm2{display:none}
#peek.yay .pm1,#peek.hmm .pm1{display:none}
#peek.yay .pm2{display:inline}

.prompt{display:flex;align-items:center;gap:8px;height:var(--ph);padding:0 14px 0 6px;border:none;border-radius:999px;background:#fff;cursor:pointer;max-width:100%;min-width:0;
  box-shadow:0 5px 0 rgba(16,60,120,.16),0 10px 20px rgba(16,60,120,.12);font:800 var(--pf)/1 var(--font);color:var(--ink);white-space:nowrap;
  animation:k-pop .4s cubic-bezier(.2,1.6,.4,1);transition:transform .12s}
.prompt:active{transform:scale(.96)}
.prompt .spk{width:calc(var(--ph) - 14px);height:calc(var(--ph) - 14px);border-radius:50%;background:var(--c1l);color:var(--c1d);display:grid;place-items:center;flex:0 0 auto}
.prompt .spk svg{width:62%;height:62%}
.prompt .pt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prompt .pw{color:var(--c1d)}
.prompt .chip{position:relative;flex:0 0 auto;width:calc(var(--ph) - 4px);height:calc(var(--ph) + 6px);margin:-10px 0 -6px;--ts:calc(var(--ph) - 4px);animation:chipIn .55s cubic-bezier(.2,1.7,.4,1) both}
.prompt .chip .mini{animation:chipSw 2.4s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes chipIn{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes chipSw{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.prompt.nudge{animation:nudge .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes nudge{0%,100%{transform:scale(1)}30%{transform:scale(1.1)}60%{transform:scale(.97)}}
.prompt .cnt{font-size:1.1em;color:var(--c2d);min-width:1.4em;text-align:left}

.callout{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);pointer-events:none;background:#fff;border-radius:34px;padding:14px 30px 18px;text-align:center;
  box-shadow:0 10px 0 rgba(16,60,120,.14),0 24px 50px rgba(16,60,120,.25);animation:coIn .55s cubic-bezier(.2,1.6,.4,1) both;white-space:nowrap}
.callout .co-t{font-weight:800;font-size:clamp(22px,4.4vmin,38px);color:var(--c1d);line-height:1.1}
.callout .co-b{position:relative;width:clamp(76px,17vmin,150px);height:calc(clamp(76px,17vmin,150px)*1.16);margin:8px auto 0;--ts:clamp(76px,17vmin,150px)}
.callout .co-b .mini{animation:chipSw 1s ease-in-out infinite alternate;transform-origin:50% 100%}
.callout .co-p{font-weight:800;font-size:clamp(24px,5vmin,42px);color:var(--ink);line-height:1.1;margin-top:2px}
@keyframes coIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

.para{position:absolute;left:0;top:0;z-index:4;pointer-events:none;will-change:transform;width:var(--pw);height:calc(var(--pw)*1.5)}
.para svg{position:absolute;left:0;top:0;width:100%;height:auto;transform-origin:50% 100%;transition:transform .3s}
.para .emo{position:absolute;left:50%;top:calc(var(--pw)*.6);transform:translateX(-50%);font-size:calc(var(--pw)*.56);filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.para.land svg{transform:scaleY(.25) translateY(30%);opacity:.0;transition:transform .35s,opacity .5s .2s}

@media (min-width:1100px) and (min-height:900px){:root{--ph:64px;--pf:27px}}
@media (max-height:500px),(max-width:430px){:root{--ph:46px;--pf:19px}}
@media (max-width:600px) and (orientation:portrait){:root{--ph:46px;--pf:clamp(15px,4.6vw,20px)}
  .prompt{gap:6px;padding-right:12px}}

/* ================= board (collection) ================= */
.k-panel.board{width:min(640px,96vw);padding:22px 16px 20px}
.btabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 6px}
.btab{border:none;cursor:pointer;min-width:58px;height:58px;padding:0 12px;border-radius:18px;background:#eef5ff;font:800 24px/1 var(--font);color:var(--c1d);display:flex;align-items:center;gap:6px;position:relative;
  box-shadow:0 4px 0 #d7e6f7}
.btab .emo{font-size:26px}
.btab.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.btab b{position:absolute;bottom:-8px;right:-6px;background:#fff;border-radius:9px;font:800 12px/1 var(--font);padding:3px 5px;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.1)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:9px;margin-top:12px}
.tile{position:relative;border:none;cursor:pointer;border-radius:18px;background:#f0f5fc;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:76px;
  box-shadow:0 4px 0 #dde7f3;color:#9fb0c8;font-family:var(--font)}
.tile .tg{font-weight:800;font-size:30px;line-height:1.05;display:flex;align-items:baseline;gap:2px}
.tile .tg small{font-size:.62em}
.tile .tg svg{width:34px;height:34px}
.tile .tn{font-weight:700;font-size:12px;line-height:1;color:var(--ink-soft)}
.tile .pips{display:flex;gap:3px}
.tile .pips i{width:9px;height:9px;border-radius:50%;background:#d9e4f2}
.tile .pips i.on{background:#ffc83d;box-shadow:0 1px 0 #e09a00}
.tile.lit{background:linear-gradient(160deg,var(--tc1),var(--tc2));color:#fff;box-shadow:0 4px 0 var(--tc3),0 0 0 3px #ffe27a inset}
.tile.lit .tg{-webkit-text-stroke:.09em rgba(20,30,70,.55);paint-order:stroke fill}
.tile.lit .tn{color:#fff}
.tile.lit .pips{display:none}
.tile .tstar{position:absolute;top:-7px;right:-6px;width:24px;height:24px;display:none;filter:drop-shadow(0 2px 0 rgba(160,100,0,.3))}
.tile.lit .tstar{display:block;animation:tws 2s ease-in-out infinite}
@keyframes tws{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.15)}}
.tile:active{transform:translateY(3px)}
.bcount{font-weight:800;color:var(--c2d);font-size:20px;margin-top:2px}
.bhelp{font-weight:700;color:var(--ink-soft);font-size:15px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.bhelp .pips{display:inline-flex;gap:3px}.bhelp .pips i{width:10px;height:10px;border-radius:50%;background:#ffc83d}
.litpop{position:absolute;z-index:7;left:50%;bottom:90px;background:linear-gradient(#fffbe6,#ffe9a0);border:3px solid #ffc83d;border-radius:999px;
  padding:5px 18px 5px 6px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(17px,3vmin,24px);color:#8a5600;white-space:nowrap;pointer-events:none;
  box-shadow:0 5px 0 #e9a400,0 12px 24px rgba(120,80,0,.2);animation:litIn 2.6s cubic-bezier(.2,1.6,.4,1) forwards}
.litpop svg{width:clamp(30px,5vmin,40px);height:auto;animation:tws 1s ease-in-out infinite}
@keyframes litIn{0%{transform:translateX(-50%) scale(.3);opacity:0}12%{transform:translateX(-50%) scale(1.08);opacity:1}20%,85%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-14px) scale(.9);opacity:0}}
.rbear{width:130px;margin:-86px auto 8px;display:block}
.k-panel.board h2{padding:0 44px;font-size:clamp(24px,5.4vmin,42px)}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .k-panel.k-result{width:min(760px,94vw);display:grid;grid-template-columns:.8fr 1.2fr;column-gap:18px;align-items:center;margin-top:0;padding:16px 18px}
  .k-result h2{grid-column:1;grid-row:1}
  .k-result .rbear{grid-column:1;grid-row:2/6;width:min(150px,30vh);margin:0 auto;align-self:center}
  .k-result .k-stars{grid-column:2;grid-row:1;margin:0}
  .k-result .k-stars svg{width:54px}
  .k-result .k-stars svg.mid{margin-top:-10px}
  .k-result p{grid-column:2;grid-row:2;margin:4px 0 0}
  .k-result .k-reward{grid-column:2;grid-row:3;margin:8px auto 0}
  .k-result .k-btns{grid-column:2;grid-row:4;margin-top:12px;gap:10px}
  .k-panel.board{padding:14px 12px 14px}
  .k-panel.board h2{font-size:24px}
  .btabs{margin:6px 0 2px}.btab{height:46px;min-width:50px;font-size:20px}
  .bgrid{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px;margin-top:8px}
  .tile{min-height:62px;padding:4px 2px 5px}.tile .tg{font-size:26px}
}
.k-panel.k-result{overflow:visible;margin-top:64px}
.newlit{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.newlit span{min-width:44px;height:44px;border-radius:14px;background:linear-gradient(160deg,#ffe58a,#ffc83d);color:#7a4a00;font:800 26px/44px var(--font);padding:0 8px;box-shadow:0 3px 0 #e09a00;animation:k-pop .5s 1s cubic-bezier(.2,1.6,.4,1) both}
@media (max-width:420px){.bgrid{grid-template-columns:repeat(5,1fr);gap:7px}.k-panel.board{padding:20px 10px 16px}.tile{min-height:70px}.tile .tg{font-size:27px}.btab{min-width:56px;height:56px;padding:0 9px}}
@media (prefers-reduced-motion:reduce){.cloud,.sun .rays,.logo .ch,.tb{animation-duration:0s!important}}
</style>
</head>

  <div id="stage"></div>
  <div id="tray"></div>
</section>
<canvas id="fxc" style="position:fixed;inset:0;z-index:30;pointer-events:none;width:100%;height:100%"></canvas>

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }
    else ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + a + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.2, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 2, t, vol: vol * 0.22, dur: dur * 0.5, bus });
    tone({ f: f * 3.01, t, vol: vol * 0.07, dur: dur * 0.3, bus });
  }
  function marimba(f, t = 0, vol = 0.2, dur = 0.4, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 4, t, vol: vol * 0.16, dur: dur * 0.18, bus });
  }
  function pluck(f, t = 0, vol = 0.12, dur = 0.3, bus) { tone({ f, t, vol, dur, type: 'triangle', lp: 2200, bus }); }

  const sfx = {
    tap() { tone({ f: 700, to: 960, dur: 0.06, vol: 0.12, type: 'triangle' }); },
    click() { tone({ f: 1300, dur: 0.03, vol: 0.06, type: 'triangle' }); },
    pop() { tone({ f: 360, to: 1250, slide: 0.07, dur: 0.1, vol: 0.32 }); noise({ f: 2600, q: 0.8, dur: 0.05, vol: 0.1 }); },
    good() { bell(1046.5, 0, 0.18, 0.5); bell(1318.5, 0.09, 0.18, 0.7); },
    bad() { tone({ f: 330, to: 300, dur: 0.15, vol: 0.15, type: 'triangle', lp: 1200 }); tone({ f: 262, to: 240, t: 0.17, dur: 0.24, vol: 0.15, type: 'triangle', lp: 1000 }); },
    star() { [1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.06, 0.08, 0.35)); },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.11, 0.17, 0.6));
      [1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.5 + i * 0.05, 0.05, 0.4));
    },
    fanfare() {
      const n = [[523.25, 0], [523.25, 0.12], [523.25, 0.24], [659.25, 0.36], [783.99, 0.6], [659.25, 0.78], [783.99, 0.9], [1046.5, 1.08]];
      n.forEach(([f, t]) => { tone({ f, t, vol: 0.09, dur: 0.22, type: 'square', lp: 2600 }); bell(f, t, 0.1, 0.4); });
      [1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 1.2 + i * 0.05, 0.05, 0.5));
    },
    whoosh() { noise({ f: 400, to: 3200, q: 1.2, dur: 0.28, vol: 0.13 }); },
    pick() { tone({ f: 520, to: 800, dur: 0.08, vol: 0.14, type: 'triangle' }); },
    drop() { tone({ f: 620, to: 300, dur: 0.1, vol: 0.16 }); noise({ f: 320, q: 0.7, dur: 0.06, vol: 0.08, ft: 'lowpass' }); },
    flip() { noise({ f: 1900, to: 900, q: 0.9, dur: 0.08, vol: 0.12 }); tone({ f: 520, to: 720, dur: 0.05, vol: 0.05, type: 'triangle' }); },
    boing() { tone({ f: 170, to: 540, slide: 0.12, dur: 0.3, vol: 0.18 }); },
    chomp() { noise({ f: 650, q: 1.6, dur: 0.07, vol: 0.32, ft: 'lowpass' }); noise({ t: 0.15, f: 560, q: 1.6, dur: 0.07, vol: 0.3, ft: 'lowpass' }); },
    coin() { tone({ f: 988, dur: 0.07, vol: 0.1, type: 'square', lp: 4000 }); tone({ f: 1319, t: 0.07, dur: 0.3, vol: 0.1, type: 'square', lp: 4000 }); },
    tick() { tone({ f: 1800, dur: 0.02, vol: 0.05 }); },
    sparkle() { for (let i = 0; i < 5; i++) bell(1800 + Math.random() * 2200, i * 0.045, 0.045, 0.25); },
    swap() { tone({ f: 440, to: 660, dur: 0.07, vol: 0.1, type: 'triangle' }); tone({ f: 660, to: 440, t: 0.07, dur: 0.07, vol: 0.1, type: 'triangle' }); },
    unlock() { [784, 988, 1175, 1568].forEach((f, i) => bell(f, i * 0.07, 0.12, 0.45)); },
  };

  /* ---------- background music (tiny sequencer) ---------- */
  const songs = {
    sunny: { bpm: 112, swing: 0.08, inst: 'marimba', bars: [
      { r: 48, c: [60, 64, 67], m: [72, 0, 76, 0, 79, 0, 76, 0] }, { r: 55, c: [59, 62, 67], m: [74, 0, 0, 71, 74, 0, 79, 0] },
      { r: 57, c: [57, 60, 64], m: [76, 0, 72, 0, 69, 0, 72, 74] }, { r: 53, c: [57, 60, 65], m: [77, 0, 76, 0, 74, 0, 0, 0] },
      { r: 48, c: [60, 64, 67], m: [72, 0, 76, 0, 79, 0, 84, 0] }, { r: 55, c: [59, 62, 67], m: [83, 0, 79, 0, 74, 0, 79, 0] },
      { r: 53, c: [57, 60, 65], m: [81, 0, 79, 77, 76, 0, 74, 0] }, { r: 55, c: [59, 62, 67], m: [74, 0, 76, 0, 74, 0, 71, 0] }] },
    bouncy: { bpm: 124, swing: 0.14, inst: 'marimba', bars: [
      { r: 53, c: [60, 65, 69], m: [77, 0, 77, 0, 81, 0, 84, 0] }, { r: 50, c: [62, 65, 69], m: [81, 0, 77, 0, 74, 0, 77, 0] },
      { r: 46, c: [58, 62, 65], m: [74, 0, 77, 0, 82, 0, 81, 0] }, { r: 48, c: [60, 64, 67], m: [79, 0, 0, 0, 76, 0, 72, 0] },
      { r: 53, c: [60, 65, 69], m: [77, 0, 81, 0, 84, 0, 86, 0] }, { r: 50, c: [62, 65, 69], m: [84, 0, 81, 0, 77, 0, 74, 0] },
      { r: 46, c: [58, 62, 65], m: [74, 0, 77, 0, 79, 0, 82, 0] }, { r: 48, c: [60, 64, 67], m: [81, 0, 79, 0, 76, 0, 0, 0] }] },
    calm: { bpm: 90, swing: 0.06, inst: 'musicbox', bars: [
      { r: 55, c: [55, 59, 62], m: [83, 0, 0, 86, 83, 0, 79, 0] }, { r: 52, c: [52, 55, 59], m: [79, 0, 0, 0, 76, 0, 79, 0] },
      { r: 48, c: [48, 52, 55], m: [76, 0, 0, 79, 76, 0, 72, 0] }, { r: 50, c: [50, 54, 57], m: [74, 0, 0, 0, 0, 0, 78, 0] },
      { r: 55, c: [55, 59, 62], m: [79, 0, 83, 0, 86, 0, 91, 0] }, { r: 52, c: [52, 55, 59], m: [88, 0, 86, 0, 83, 0, 79, 0] },
      { r: 48, c: [48, 52, 55], m: [84, 0, 83, 0, 81, 0, 79, 0] }, { r: 50, c: [50, 54, 57], m: [78, 0, 76, 0, 74, 0, 0, 0] }] },
  };
  const music = {
    _want: null, _song: null, _timer: null, _step: 0, _next: 0,
    start(name) {
      const song = typeof name === 'string' ? songs[name] : name;
      this._want = song;
      if (!song || !unlocked || !ctx) return;
      if (this._song === song && this._timer) return;
      this.stop(true);
      this._song = song; this._step = 0; this._next = ctx.currentTime + 0.15;
      this._timer = setInterval(() => this._tick(), 40);
    },
    stop(keepWant) { clearInterval(this._timer); this._timer = null; this._song = null; if (!keepWant) this._want = null; },
    _tick() {
      if (!ctx || !this._song || ctx.state !== 'running') return;
      const s = this._song, e8 = 60 / s.bpm / 2;
      if (this._next < ctx.currentTime - 0.3) this._next = ctx.currentTime + 0.05;
      while (this._next < ctx.currentTime + 0.25) {
        const k = this._step % 8, bar = s.bars[Math.floor(this._step / 8) % s.bars.length];
        const t = this._next - ctx.currentTime;
        if (settings.music) {
          const B = musicBus;
          if (k === 0 || k === 4) tone({ f: mtof(k === 0 ? bar.r : bar.r + (bar.r + 7 < 60 ? 7 : -5)), t, vol: 0.2, dur: 0.4, type: 'triangle', lp: 900, bus: B });
          if (k === 2 || k === 6) bar.c.forEach((n, i) => pluck(mtof(n), t + i * 0.012, 0.045, 0.22, B));
          const m = bar.m[k];
          if (m) s.inst === 'musicbox' ? bell(mtof(m), t, 0.11, 0.7, B) : marimba(mtof(m), t, 0.16, 0.42, B);
          noise({ t, f: 7000, ft: 'highpass', q: 0.5, dur: 0.03, vol: k % 2 ? 0.035 : 0.018, bus: B });
        }
        this._next += e8 * (k % 2 === 0 ? 1 + s.swing : 1 - s.swing);
        this._step++;
      }
    },
  };
  function duck(on) {
    if (!ctx || !musicBus) return;
    const target = settings.music ? (on ? MUSIC_VOL * 0.3 : MUSIC_VOL) : 0;
    musicBus.gain.setTargetAtTime(target, ctx.currentTime, on ? 0.05 : 0.4);
  }

  /* ---------- Vietnamese voice ---------- */
  const speech = (() => {
    const synth = window.speechSynthesis;
    let voice = null, timer = null, cur = null;
    function choose() {
      if (!synth) return;
      const vs = synth.getVoices() || [];
      const vi = vs.filter(v => /^vi([-_]|$)/i.test(v.lang || '') || /vietnam/i.test(v.name || ''));
      const score = v => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 4 : 0) + (/hoaimy|linh|google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
      vi.sort((a, b) => score(b) - score(a));
      voice = vi[0] || null;
    }
    if (synth) { choose(); try { synth.addEventListener('voiceschanged', choose); } catch (e) { synth.onvoiceschanged = choose; } }
    function say(text, o = {}) {
      if (!synth || !voice || !settings.sound || !text) { if (o.onend) setTimeout(o.onend, 0); return false; }
      const go = () => {
        const u = new SpeechSynthesisUtterance(text);
        u.voice = voice; u.lang = voice.lang; u.rate = o.rate || 0.92; u.pitch = o.pitch || 1.1; u.volume = 1;
        cur = u; duck(true);
        u.onend = u.onerror = () => { if (cur === u) { cur = null; duck(false); } o.onend && o.onend(); };
        synth.speak(u);
      };
      clearTimeout(timer);
      if (o.queue) go();
      else if (synth.speaking || synth.pending) { synth.cancel(); timer = setTimeout(go, 90); }
      else go();
      return true;
    }
    return { say, has: () => !!voice, stop() { clearTimeout(timer); if (synth) synth.cancel(); duck(false); }, voiceName: () => voice && voice.name };
  })();

  /* ---------- particles / confetti ---------- */
  const COLORS = ['#ff5d8f', '#ffc83d', '#4cc9f0', '#7b5cff', '#3ecf6e', '#ff8a3d', '#ff7ad9'];
  const fx = (() => {
    let cv, g, W, H, parts = [], raf = 0, last = 0;
    function init() {
      cv = el('canvas', 'k-fx'); document.body.appendChild(cv); g = cv.getContext('2d');
      resize(); window.addEventListener('resize', resize);
    }
    function resize() { if (!cv) return; const d = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); }
    function star(x, y, r) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); }
    function heart(x, y, r) { g.beginPath(); g.moveTo(x, y + r * 0.7); g.bezierCurveTo(x - r * 1.3, y - r * 0.2, x - r * 0.6, y - r * 1.1, x, y - r * 0.35); g.bezierCurveTo(x + r * 0.6, y - r * 1.1, x + r * 1.3, y - r * 0.2, x, y + r * 0.7); g.fill(); }
    function loop(now) {
      const dt = Math.min(2.5, (now - last) / 16.67); last = now;
      g.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt;
        if (p.life <= 0 || p.y > H + 60) { parts.splice(i, 1); continue; }
        p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
        p.x += p.vx * dt + (p.flutter ? Math.sin(now / 180 + p.seed) * p.flutter : 0); p.y += p.vy * dt; p.rot += p.vr * dt;
        const a = Math.min(1, p.life / (p.max * 0.35)) * (p.fadeIn ? Math.min(1, (p.max - p.life) / 6) : 1);
        g.globalAlpha = Math.max(0, a);
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
        g.fillStyle = p.color;
        const s = p.size * (p.grow ? 1 + (1 - p.life / p.max) * p.grow : 1);
        if (p.shape === 'rect') { g.scale(1, Math.cos(now / 140 + p.seed)); g.fillRect(-s / 2, -s * 0.3, s, s * 0.6); }
        else if (p.shape === 'circle') { g.beginPath(); g.arc(0, 0, s / 2, 0, Math.PI * 2); g.fill(); }
        else if (p.shape === 'star') star(0, 0, s / 2);
        else if (p.shape === 'heart') heart(0, 0, s / 2);
        else if (p.shape === 'ring') { g.strokeStyle = p.color; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, s / 2, 0, Math.PI * 2); g.stroke(); }
        else if (p.shape === 'text') { g.font = `${s}px ${getComputedStyle(document.body).getPropertyValue('--emoji') || 'sans-serif'}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.text, 0, 0); }
        g.restore();
      }
      g.globalAlpha = 1;
      if (parts.length) raf = requestAnimationFrame(loop); else { raf = 0; g.clearRect(0, 0, W, H); }
    }
    function add(p) {
      if (!cv) init();
      parts.push(Object.assign({ vx: 0, vy: 0, g: 0.3, drag: 0.985, rot: 0, vr: 0, size: 10, color: pick(COLORS), shape: 'rect', life: 120, seed: Math.random() * 10 }, p));
      parts[parts.length - 1].max = parts[parts.length - 1].life;
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
    }
    return { add, get count() { return parts.length; } };
  })();
  function confetti(o = {}) {
    const W = innerWidth, H = innerHeight, n = o.n || Math.round(Math.min(160, 60 + W / 8));
    for (let i = 0; i < n; i++) {
      const left = i % 2 === 0, x = left ? -10 : W + 10, y = H * (0.75 + Math.random() * 0.2);
      const th = rand(Math.PI * 0.3, Math.PI * 0.44), sp = rand(14, 26) * Math.min(1.25, Math.max(0.7, H / 800));
      fx.add({ x, y, vx: (left ? 1 : -1) * Math.cos(th) * sp * Math.min(1.6, Math.max(0.8, W / H)), vy: -Math.sin(th) * sp, g: 0.32, drag: 0.975,
        vr: rand(-0.2, 0.2), size: rand(8, 15), shape: pick(['rect', 'rect', 'circle', 'star']), life: rand(110, 170), flutter: rand(0.5, 1.6), color: pick(o.colors || COLORS) });
    }
  }
  function burst(x, y, o = {}) {
    const n = o.n || 16;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand(-0.2, 0.2), sp = rand(o.speed ? o.speed * 0.6 : 3, o.speed || 8);
      fx.add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 1.5), g: o.g == null ? 0.18 : o.g, drag: 0.94, size: rand(o.size ? o.size * 0.6 : 8, o.size || 16),
        shape: o.shape || pick(['star', 'circle']), color: pick(o.colors || COLORS), life: rand(35, 60), vr: rand(-0.2, 0.2), text: o.text });
    }
  }
  function sparkle(x, y, o = {}) {
    for (let i = 0; i < (o.n || 7); i++) fx.add({ x: x + rand(-30, 30), y: y + rand(-30, 30), vx: rand(-1, 1), vy: rand(-2.2, -0.5), g: 0.02, drag: 0.97,
      size: rand(8, 18), shape: 'star', color: pick(o.colors || ['#fff', '#ffe27a', '#ffd23d', '#fff4b8']), life: rand(30, 55), fadeIn: true });
  }
  function emojiBurst(x, y, text, n = 8) {
    for (let i = 0; i < n; i++) { const a = rand(-Math.PI * 0.9, -Math.PI * 0.1), sp = rand(5, 10); fx.add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.32, drag: 0.98, shape: 'text', text, size: rand(26, 40), life: rand(60, 90), vr: rand(-0.08, 0.08) }); }
  }

  /* ---------- icons ---------- */

  const cols = shuffle(['#ff5d73', '#ffd23d', '#2f80ff', '#3cc94e', '#ff8c1a']).slice(0, 2);
  const e = el('div', 'para', `<svg viewBox="0 0 100 78" aria-hidden="true"><g fill="none" stroke="#5a6b8c" stroke-width="1.6" opacity=".8"><path d="M8 38L44 74M30 40L47 74M70 40L53 74M92 38L56 74"/></g>
    <path d="M4 40Q4 4 50 4T96 40Q85 32 74 40 62 32 50 40 38 32 26 40 15 32 4 40Z" fill="${cols[0]}"/><path d="M26 40Q30 8 50 4 38 18 38 37 32 33 26 40ZM74 40Q70 8 50 4 62 18 62 37 68 33 74 40Z" fill="${cols[1]}"/>
    <ellipse cx="34" cy="16" rx="10" ry="5" fill="#fff" opacity=".4" transform="rotate(-24 34 16)"/></svg><span class="emo">${a}</span>`);
  e.style.setProperty('--pw', pw + 'px');
  $('#play').appendChild(e);
  paras.push({ el: e, x: x - pw / 2, y: y - pw * .6, vy: -160, t: 0, ph: rand(0, 6), landed: false, life: 0, pw });
  peek('yay'); say(pick(['Ồ, bạn nhỏ!', 'Món quà bất ngờ!', 'Xin chào bạn!']));
  freeCount(); kick();
}
function updateParas(dt) {
  for (let i = paras.length - 1; i >= 0; i--) {
    const p = paras[i];
    p.t += dt;
    if (!p.landed) {
      p.vy = Math.min(p.vy + 300 * dt, 66); p.y += p.vy * dt;
      const sx = Math.sin(p.t * 1.7 + p.ph) * 26, rot = Math.cos(p.t * 1.7 + p.ph) * 9;
      p.dx = clamp(p.x + sx, 4, W - p.pw - 4);
      p.el.style.transform = `translate3d(${p.dx.toFixed(1)}px,${p.y.toFixed(1)}px,0) rotate(${rot.toFixed(1)}deg)`;
      if (p.y + p.pw * 1.25 >= GROUND) { p.landed = true; p.el.classList.add('land'); sfx.boing(); Kit.sparkle(p.dx + p.pw / 2, p.y + p.pw * 1.2, { n: 5 }); }
    } else {
      p.life += dt;
      const hop = Math.abs(Math.sin(p.life * 7)) * Math.max(0, 1 - p.life / 1.2) * p.pw * .3;
      p.el.style.transform = `translate3d(${p.dx.toFixed(1)}px,${(p.y - hop).toFixed(1)}px,0)`;
      p.el.style.opacity = clamp(2.4 - p.life, 0, 1);
      if (p.life > 2.4) { p.el.remove(); paras.splice(i, 1); }
    }
  }
}
function popFree(b) {
  const [x, y] = popBalloon(b);
  popSnd(); pick(FUNNY)(); Kit.vibrate(15);
  Kit.emojiBurst(x, y, pick(FREE_EMO), 6);
  Kit.burst(x, y, { n: 8, colors: [TRI[b.col][1], '#fff', '#ffd23d'], size: 11, speed: 6 });
  if (Math.random() < .35) peek('yay');
  freeCount();
}
function freeCount() {
  if (!G || G.mode !== 'free') return;
  G.done++;
  const c = $('#fcnt'); if (c) { c.textContent = G.done; nudgePrompt(); }
  if (G.done % 15 === 0) { Kit.confetti({ n: 70 }); sfx.win(); Kit.praise(pick(['Siêu quá!', 'Tuyệt vời!', 'Giỏi quá!']), { sayText: G.done + ' quả bóng! Giỏi quá!' }); }
}

/* ---------- keyboard (bonus) ---------- */
window.addEventListener('keydown', e => {
  if (document.querySelector('.k-ov')) return;
  if (e.key === 'Escape' && screen !== 'title') { $('#bBack').click(); return; }
  if (screen !== 'play' || !G || G.phase !== 'play') return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); speakPrompt(true); nudgePrompt(); return; }
  if (e.key.length !== 1) return;
  const k = e.key.toLowerCase();
  const m = G.balloons.filter(b => b.disp != null && String(b.disp).toLowerCase() === k && b.y < H - S * .8).sort((a, c) => a.y - c.y)[0];
  if (m) tapBalloon(m);
});

/* ---------- end of round ---------- */
function finishRound() {
  G.phase = 'end';
  tray.classList.remove('full'); later(() => { tray.classList.add('full'); sfx.unlock(); }, 760);
  const rest = G.balloons.slice().sort((a, b) => a.y - b.y);
  rest.forEach((b, i) => later(() => { if (G.balloons.includes(b)) { popBalloon(b); sfx.pop(); chime(Math.min(11, 3 + i)); } }, 900 + i * 110));
  later(() => { G.running = false; showResult(); }, 1500 + rest.length * 110);
}
function showResult() {
  const g = G, w = g.wrong;
  const stars = w <= 2 ? 3 : w <= 5 ? 2 : 1;
  const ms = save.stars[g.mode] = save.stars[g.mode] || {};
  const first = !ms[g.L];
  ms[g.L] = Math.max(ms[g.L] || 0, stars); persist();
  refreshBoardBadge();
  const hasNext = g.L < g.M.levels.length;
  const unlockedNew = false;
  const title = stars === 3 ? 'Tuyệt vời!' : stars === 2 ? 'Giỏi quá!' : 'Hoàn thành!';
  const lit = (g.newLitLab || []);
  let text = 'Bé bắn trúng 10 quả bóng!';
  if (unlockedNew) text += '<br>Đã mở khóa màn ' + (g.L + 1) + '!';
  const reward = lit.length ? { emoji: '⭐', label: 'Sáng sao: ' + lit.join(', ') } : g.bonus ? { emoji: '🌟', label: 'Bé bắn được ' + g.bonus + ' sao vàng!' } : null;
  const buttons = [
    { label: 'Chơi lại', icon: 'replay', cls: 'white', onClick: () => startGame(g.mode, g.L) },
    hasNext ? { label: 'Màn tiếp', icon: 'next', cls: 'ok', onClick: () => startGame(g.mode, g.L + 1) }
      : { label: 'Chọn trò', icon: 'next', cls: 'ok', onClick: () => { endGame(); renderModes(); show('modes'); } },
  ];
  Kit.result({ top: `<svg class="rbear" viewBox="0 0 140 124">${PEEK}</svg>`, title, stars, text, reward, buttons,
    say: title + (lit.length ? ' Bảng của bé có thêm sao mới!' : '') });
  if (unlockedNew) setTimeout(() => sfx.unlock(), 1500);
}

/* ================= collection board ================= */
function openBoard(tabId) {
  let cur = tabId || 'letters';
  const m = Kit.overlay('', { closable: true, cls: 'board' });
  const render = () => {
    const T = BOARD_TABS.find(t => t.id === cur);
    m.panel.querySelectorAll(':scope > :not(.k-close)').forEach(n => n.remove());
    const box = el('div');
    const lit = litCount(cur);
    box.innerHTML = `<h2>${T.title}</h2>
      <div class="btabs">${BOARD_TABS.map(t => `<button class="btab${t.id === cur ? ' on' : ''}" data-id="${t.id}" aria-label="${t.title}"><span class="${t.tab === '🎨' ? 'emo' : ''}">${t.tab}</span><b>${litCount(t.id)}</b></button>`).join('')}</div>
      <div class="bhelp">Bắn trúng 3 lần <span class="pips"><i></i><i></i><i></i></span> để sáng sao ⭐</div>
      <div class="bgrid">${T.items.map((it, i) => tileHTML(cur, it, i)).join('')}</div>
      <div class="bcount">⭐ ${lit} / ${T.items.length}</div>`;
    m.panel.insertBefore(box, m.panel.firstChild);
    $$('.btab', box).forEach(b => b.onclick = () => { cur = b.dataset.id; sfx.pick(); render(); });
    $$('.tile', box).forEach(b => b.onclick = () => {
      const it = T.items[+b.dataset.i];
      sfx.pop(); say(it.say); b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle');
      const r = b.getBoundingClientRect(); Kit.sparkle(r.left + r.width / 2, r.top + r.height / 2, { n: b.classList.contains('lit') ? 8 : 3 });
    });
  };
  render(); say('Bảng chữ cái của bé!');
}
function tileHTML(tab, it, i) {
  const n = seenN(tab, it.key), lit = n >= 3;
  let col = BRIGHT[i % BRIGHT.length], g = '', nm = '';
  if (tab === 'letters') g = `${esc(it.up)}<small>${esc(it.lo)}</small>`;
  else if (tab === 'numbers') g = esc(it.key);
  else if (tab === 'colors') { col = it.key; g = `<svg viewBox="0 0 100 120" style="width:30px;height:36px">${bodyInner(it.key)}</svg>`; nm = it.name; }
  else { g = shapeSVG(it.key, lit ? '#fff' : '#c3d0e2', lit ? '#24305e' : '#a6b6cc'); nm = it.name; }
  const [c1, c2, c3] = tab === 'colors' ? ['#7cc6ff', '#3f8ff0', '#2a6dc4'] : TRI[col];
  return `<button class="tile${lit ? ' lit' : ''}" data-i="${i}" style="--tc1:${c1};--tc2:${c2};--tc3:${c3}"><span class="tg">${g}</span>${nm ? `<span class="tn">${nm}</span>` : ''}
    <span class="pips">${[0, 1, 2].map(k => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</span><svg class="tstar" viewBox="0 0 100 96">${Kit.STAR_SVG(true).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg></button>`;
}

/* ================= boot ================= */
measure();
refreshBoardBadge();
Kit.music.start('sunny');
window.BB = { get G() { return G; }, get S() { return S; }, get W() { return W; }, get H() { return H; }, get TOP() { return TOP; }, isCorrect: b => isCorrect(b), startGame, openBoard, show, save,
  target(k, upper) { if (!G) return; G.target = G.pool.find(i => i.key === k) || G.target; if (upper != null) G.upper = upper; setPrompt(); },
  special(kind) { if (!G) return; const px = pickX(H * .5) || [W / 2 - S / 2, S * .1]; return !!makeBalloon({ kind, col: kind === 'gold' ? 'gold' : 'pink' }, px[0], H * .5, px[1]); } };
})();
</script>
