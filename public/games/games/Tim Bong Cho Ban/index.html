<!DOCTYPE html>
<html lang="vi" data-game="timbong">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101850">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tìm Bóng Cho Bạn</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}

/* ===== Kit v2 additions (Bộ game 2) ===== */
/* tutorial hand */
.k-hand{position:fixed;z-index:72;left:0;top:0;width:clamp(54px,9vmin,78px);height:auto;pointer-events:none;opacity:0;
  filter:drop-shadow(0 6px 6px rgba(30,10,80,.25));transition:opacity .25s;will-change:transform}
.k-hand.on{opacity:1}
.k-hand .tapring{transform-origin:22px 10px;animation:k-ring 1s ease-out infinite}
@keyframes k-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* segmented chips (Dễ / Vừa / Khó …) */
.k-seg{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(40,20,90,.12)}
.k-seg button{border:none;cursor:pointer;min-height:48px;min-width:56px;padding:0 16px;border-radius:999px;background:transparent;
  font:800 clamp(16px,2.6vmin,21px)/1 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.k-seg button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.k-seg button:active{transform:translateY(2px)}
/* tile buttons for mode / level grids */
.k-tile{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;color:var(--ink);padding:12px 10px 10px;
  box-shadow:0 7px 0 rgba(40,20,90,.16),0 12px 20px rgba(40,20,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:800 clamp(16px,2.7vmin,22px)/1.05 var(--font);transition:transform .14s,box-shadow .14s;min-height:64px;text-align:center}
.k-tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(40,20,90,.16)}
.k-tile .emo{font-size:clamp(34px,6.4vmin,54px)}
.k-tile small{font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .k-tstars{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5;display:block}
.k-mini-star.on svg{color:#ffc83d;filter:drop-shadow(0 1px 0 #e09a00)}
/* scrollable screen body under the bar */
.k-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--bar-h) + var(--safe-t) + 6px) calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l));
  display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  box-shadow:0 4px 0 rgba(40,20,90,.12);white-space:nowrap}
.k-pill .emo{font-size:1.3em}
@keyframes k-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}50%{filter:drop-shadow(0 0 14px rgba(255,220,80,.95))}}
.k-glow{animation:k-glow 1.2s ease-in-out infinite}
@keyframes k-squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}}
.k-squash{animation:k-squash .5s ease}
@keyframes k-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.k-jump{animation:k-jump .5s cubic-bezier(.3,1.5,.5,1)}
</style>
<style>
:root{--c1:#6c5cff;--c1d:#4434c4;--c2:#ff6fa8;--c2d:#d24680;--bg1:#18215e;--bg2:#0c1240;--ink:#2a2d63;--ink-soft:#5f6396;
  --silf:brightness(0) invert(.108) sepia(.316) saturate(18.8) hue-rotate(202.8deg) brightness(1.247) drop-shadow(0 0 1.5px rgba(28,36,82,.6));
  --navy:#1c2452}
body{background:linear-gradient(180deg,#0a1040 0%,#141d5c 38%,#25307c 74%,#323c8e 100%)}

/* ---------- night sky ---------- */
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.7);animation:twinkle 3.4s ease-in-out infinite}
.sky b{position:absolute;color:#fff3b0;font-size:16px;line-height:1;font-weight:400;animation:twinkle 4.2s ease-in-out infinite}
.sky .bug{position:absolute;width:7px;height:7px;border-radius:50%;background:#f4ff9a;box-shadow:0 0 10px 4px rgba(230,255,120,.55);animation:drift 9s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.2}25%{opacity:1}50%{transform:translate(28px,-22px);opacity:.5}75%{transform:translate(-14px,-40px);opacity:1}}
.moon{position:absolute;top:calc(8px + var(--safe-t));left:clamp(74px,22vw,300px);width:clamp(40px,7vmin,64px);height:auto;filter:drop-shadow(0 0 18px rgba(255,240,170,.75))}
.moon .lid{transform-box:fill-box;transform-origin:50% 50%}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:22vh;min-height:90px}
.shoot{position:absolute;top:12%;left:60%;width:110px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);opacity:0;transform:rotate(-24deg);animation:shoot 9s 3s linear infinite}
@keyframes shoot{0%,90%{opacity:0;transform:translate(0,0) rotate(-24deg)}92%{opacity:1}100%{opacity:0;transform:translate(-260px,116px) rotate(-24deg)}}

/* ---------- torch (finger light) ---------- */
#torch{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .7s ease;will-change:transform,opacity}
#torch.hov{opacity:.45;transition:opacity .4s}
#torch.on{opacity:1;transition:opacity .16s}

/* ---------- firefly mascot ---------- */
.ff{overflow:visible;display:block;width:100%;height:auto}
.ff *{transform-box:view-box}
.ff .ff-all{transform-origin:70px 70px;animation:ff-bob 2.4s ease-in-out infinite}
.ff .ff-wingF{transform-origin:60px 60px;animation:ff-flap .14s ease-in-out infinite alternate}
.ff .ff-wingB{transform-origin:56px 62px;animation:ff-flap .14s .07s ease-in-out infinite alternate}
.ff .ff-glow{transform-origin:34px 84px;animation:ff-glow 1.8s ease-in-out infinite}
.ff .ff-tail{transform-origin:40px 76px;animation:ff-tail 1.8s ease-in-out infinite}
.ff .ff-eyes{transform-origin:96px 57px;animation:ff-blink 4.2s infinite}
.ff .ff-pupils{transition:transform .15s ease-out}
.ff .ff-head{transform-origin:94px 84px}
.ff .ff-m2{opacity:0}
.ff.happy .ff-m2{opacity:1}.ff.happy .ff-m1{opacity:0}
.ff.happy .ff-all{animation:ff-loop .8s cubic-bezier(.4,0,.3,1)}
.ff.no .ff-head{animation:ff-no .6s ease-in-out}
.ff.talk .ff-m2{animation:ff-talk .3s steps(2) infinite}
.ff.talk .ff-m1{animation:ff-talk .3s steps(2) infinite reverse}
@keyframes ff-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes ff-flap{from{transform:rotate(-12deg) scaleY(1)}to{transform:rotate(14deg) scaleY(.7)}}
@keyframes ff-glow{0%,100%{opacity:.6;transform:scale(.88)}50%{opacity:1;transform:scale(1.12)}}
@keyframes ff-tail{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@keyframes ff-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ff-loop{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-24px) rotate(-200deg) scale(1.1)}100%{transform:translateY(0) rotate(-360deg)}}
@keyframes ff-no{0%,100%{transform:rotate(0)}25%{transform:rotate(-13deg)}55%{transform:rotate(11deg)}80%{transform:rotate(-5deg)}}
@keyframes ff-talk{0%{opacity:1}100%{opacity:0}}
#fly{position:fixed;left:0;top:0;z-index:34;pointer-events:none;opacity:0;transition:opacity .3s;will-change:transform}
#fly.on{opacity:1}
#fly .halo2{position:absolute;left:-90%;top:-90%;width:280%;height:280%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,248,170,.42) 0,rgba(255,248,170,.16) 30%,rgba(255,248,170,0) 62%);animation:ff-glow 2.2s ease-in-out infinite}
#fly .flip{position:relative;transition:transform .25s ease}
#fly.left .flip{transform:scaleX(-1)}
.bub{position:fixed;z-index:35;left:0;top:0;max-width:min(70vw,420px);background:#fff;color:var(--ink);border-radius:20px;padding:8px 14px;
  font-weight:800;font-size:clamp(16px,2.8vmin,22px);line-height:1.15;box-shadow:0 5px 0 rgba(10,15,60,.3);display:flex;align-items:center;gap:8px;
  opacity:0;transform:scale(.6);transform-origin:100% 50%;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.bub.on{opacity:1;transform:scale(1)}
.bub::after{content:"";position:absolute;right:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:13px solid #fff;border-right:0}
.bub .emo{font-size:1.4em}

/* ---------- title ---------- */
#title{padding:calc(var(--bar-h) + 2px) 16px 18px}
#title .tbox{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.8vmin,18px)}
.hero{position:relative;width:clamp(210px,min(70vw,40vh),380px);aspect-ratio:1.28;cursor:pointer}
.plaque{position:absolute;left:0;bottom:0;width:80%;height:76%;border-radius:24px;overflow:hidden;
  background:radial-gradient(ellipse 80% 70% at 90% -10%,rgba(255,251,225,.95),rgba(255,251,225,0) 70%),linear-gradient(170deg,#f5f0e0,#e0e2f3 62%,#ccd1ec);

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);

/* ---------- emoji support check (missing glyph => item skipped, so a shadow never shows a "tofu" box) ---------- */
const canShow = (() => {
  let g = null, font = '', tofu = null; const cache = new Map();
  function sig(s) {
    g.clearRect(0, 0, 36, 36); g.fillText(s, 18, 19);
    const d = g.getImageData(0, 0, 36, 36).data; let n = 0, h = 0;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 24) { n++; h = (h * 31 + d[i - 3] * 7 + d[i - 2] * 3 + d[i - 1] + i) % 1e9; }
    return n + ':' + h;
  }
  return it => {
    if (it.svg) return true;
    if (cache.has(it.e)) return cache.get(it.e);
    let ok = true;
    try {
      if (!g) { const cv = document.createElement('canvas'); cv.width = cv.height = 36; g = cv.getContext('2d', { willReadFrequently: true });
        font = getComputedStyle(document.documentElement).getPropertyValue('--emoji') || 'sans-serif';
        g.font = '28px ' + font; g.textAlign = 'center'; g.textBaseline = 'middle'; tofu = sig('\u{10FFFD}'); }
      const s = sig(it.e); ok = !s.startsWith('0:') && s !== tofu;
    } catch (e) { ok = true; }
    cache.set(it.e, ok); return ok;
  };
})();

/* ================= PLAY: content generation ================= */
function pickDistinct(pool, k, groups, avoid, ban) {
  const out = [];
  const order = shuffle(pool).sort((a, b) => (avoid.has(a.id) ? 1 : 0) - (avoid.has(b.id) ? 1 : 0));
  for (const it of order) { if (out.length >= k) break; if (groups.has(it.g) || ban.has(it.id)) continue; out.push(it); groups.add(it.g); ban.add(it.id); }
  return out;
}
function poseFor(kind) {
  if (kind === 'rot') return { r: pick([90, 180, 270]), sx: 1, sy: 1 };
  if (kind === 'flip') return Math.random() < 0.7 ? { r: 0, sx: -1, sy: 1 } : { r: 0, sx: 1, sy: -1 };
  if (kind === 'mix') { const q = Math.random(); return q < 0.4 ? { r: 0, sx: 1, sy: 1 } : q < 0.75 ? { r: 0, sx: -1, sy: 1 } : { r: pick([90, 270]), sx: 1, sy: 1 }; }
  return { r: 0, sx: 1, sy: 1 };
}
function buildSet() {
  const Lv = G.L, pool = themePool(), avoid = G.recent;
  const groups = new Set(), ban = new Set();
  if (Lv.kind === 'who') {
    const pairs = themePairs();
    let target = null, sib = null;
    if (Lv.sib && pairs.length && Math.random() < 0.75) {
      const pr = shuffle(pairs).sort((a, b) => (avoid.has(a[0].id) || avoid.has(a[1].id) ? 1 : 0) - (avoid.has(b[0].id) || avoid.has(b[1].id) ? 1 : 0))[0];
      [target, sib] = Math.random() < 0.5 ? pr : [pr[1], pr[0]];
    } else target = pickDistinct(pool, 1, new Set(), avoid, new Set())[0];
    groups.add(target.g); ban.add(target.id);
    const cands = [target];
    if (sib) { cands.push(sib); groups.add(sib.g); ban.add(sib.id); }
    cands.push(...pickDistinct(pool, Lv.c - cands.length, groups, avoid, ban));
    const pose = Lv.flip && Math.random() < 0.5 ? { r: 0, sx: -1, sy: 1 } : { r: 0, sx: 1, sy: 1 };
    G.set = { shadows: [{ item: target, pose, jx: 0, jy: 0 }], cards: shuffle(cands).map(item => ({ item })) };
  } else {
    let items = [];
    if (Lv.similar) {
      const pairs = shuffle(themePairs()).sort((a, b) => (avoid.has(a[0].id) || avoid.has(a[1].id) ? 1 : 0) - (avoid.has(b[0].id) || avoid.has(b[1].id) ? 1 : 0));
      for (const [a, b] of pairs) {
        if (items.length >= Lv.similar * 2) break;
        if (ban.has(a.id) || ban.has(b.id) || groups.has(a.g) || groups.has(b.g)) continue;
        items.push(a, b); ban.add(a.id); ban.add(b.id); groups.add(a.g); groups.add(b.g);
      }
    }
    items.push(...pickDistinct(pool, Lv.n - items.length, groups, avoid, ban));
    const simIds = new Set(items.slice(0, Lv.similar ? Lv.similar * 2 : 0).map(i => i.id));
    const shadows = shuffle(items).map(item => ({ item, pose: (Lv.pose === 'mix' && simIds.has(item.id)) ? (Math.random() < 0.3 ? { r: 0, sx: -1, sy: 1 } : { r: 0, sx: 1, sy: 1 }) : poseFor(Lv.pose), jx: rand(-0.6, 0.6), jy: rand(-0.6, 0.6) }));
    // rotated level: make sure the poses differ a bit across the screen
    if (Lv.pose === 'rot') { const rs = shuffle([90, 180, 270, 90, 270, 180]); shadows.forEach((s, k) => s.pose.r = rs[k % rs.length]); }
    G.set = { shadows, cards: shuffle(items).map(item => ({ item })) };
  }
  G.recent = new Set([...G.set.cards.map(c => c.item.id)]);
}

/* ================= PLAY: layout ================= */
const wall = $('#wall'), wallIn = $('#wallIn'), tray = $('#tray');
function gridFor(n, iw, ih) {
  let best = null;
  for (let cols = 1; cols <= n; cols++) { const rows = Math.ceil(n / cols), cell = Math.min(iw / cols, ih / rows); if (!best || cell > best.cell + 0.5) best = { cols, rows, cell }; }
  return best;
}
const R = (n, r) => { n.style.left = r.x + 'px'; n.style.top = r.y + 'px'; n.style.width = r.w + 'px'; n.style.height = r.h + 'px'; };

  torch.size(); heroSize();

  const W = innerWidth, H = innerHeight, m = W < 500 ? 10 : 16;
  const top = Math.ceil($('.k-bar').getBoundingClientRect().bottom) + (W < 500 ? 2 : 6), bot = H - m;
  const land = W > H * 1.05, aw = W - 2 * m, ah = bot - top, g = 10, pad = 10;
  const n = G.set.cards.length, sMax = clamp(Math.min(W, H) * 0.24, 76, 128);
  let tr, wr, best = null;
  if (land) {
    for (let cols = 1; cols <= 3; cols++) {
      const rows = Math.ceil(n / cols), s = Math.min(sMax, (ah - 2 * pad - (rows - 1) * g) / rows), w = cols * s + (cols - 1) * g + 2 * pad;
      const sc = s >= Math.min(sMax, 80) ? 1000 - w : s;
      if (!best || sc > best.sc) best = { cols, rows, s, w, sc };
    }
    tr = { x: W - m - best.w, y: top, w: best.w, h: ah };
    wr = { x: m, y: top, w: aw - best.w - g, h: ah };
  } else {
    for (let rows = 1; rows <= 3; rows++) {
      const cols = Math.ceil(n / rows), s = Math.min(sMax, (aw - 2 * pad - (cols - 1) * g) / cols), h = rows * s + (rows - 1) * g + 2 * pad;
      const sc = s >= Math.min(sMax, 76) ? 1000 - h : s;
      if (!best || sc > best.sc) best = { cols, rows, s, h, sc };
    }
    tr = { x: m, y: bot - best.h, w: aw, h: best.h };
    wr = { x: m, y: top, w: aw, h: ah - best.h - g };
  }
  R(wall, wr); R(tray, tr);
  // cards
  const s = Math.floor(best.s), cols = best.cols, rows = Math.ceil(n / cols);
  const gw = cols * s + (cols - 1) * g, gh = rows * s + (rows - 1) * g;
  const ox = (tr.w - gw) / 2, oy = (tr.h - gh) / 2;
  G.set.cards.forEach((c, i) => {
    const r = Math.floor(i / cols), k = i % cols, inRow = r === rows - 1 ? n - r * cols : cols, off = (cols - inRow) * (s + g) / 2;
    c.el.style.left = (ox + off + k * (s + g)) + 'px'; c.el.style.top = (oy + r * (s + g)) + 'px';
    c.el.style.width = c.el.style.height = s + 'px'; c.el.style.setProperty('--a', Math.round(s * 0.74) + 'px');
  });
  // shadows
  const padT = Math.max(28, wr.h * 0.08), padB = Math.max(24, wr.h * 0.07), padX = Math.max(12, wr.w * 0.035);
  const iw = wr.w - 2 * padX, ih = wr.h - padT - padB, ns = G.set.shadows.length;
  const gr = gridFor(ns, iw, ih), cw = iw / gr.cols, ch = ih / gr.rows;
  const size = ns === 1 ? Math.min(iw * 0.8, ih * 0.84, 340) : Math.min(gr.cell * 0.86, 250);
  const lastRow = ns - (gr.rows - 1) * gr.cols;
  G.set.shadows.forEach((sh, i) => {
    const r = Math.floor(i / gr.cols), k = i % gr.cols, inRow = r === gr.rows - 1 ? lastRow : gr.cols, off = (gr.cols - inRow) * cw / 2;
    const cx = padX + off + k * cw + cw / 2 + sh.jx * Math.max(0, cw - size) / 2, cy = padT + r * ch + ch / 2 + sh.jy * Math.max(0, ch - size) / 2 - (ns > 1 ? size * 0.04 : 0);
    sh.el.style.left = (cx - size / 2) + 'px'; sh.el.style.top = (cy - size / 2) + 'px';
    sh.el.style.width = sh.el.style.height = size + 'px'; sh.el.style.setProperty('--a', Math.round(size * 0.92) + 'px');
    sh.el.style.setProperty('--tf', clamp(size * 0.12, 13, 19) + 'px');
  });
  $('.cap', wall).style.height = clamp(wr.h * 0.035, 12, 20) + 'px';
  // firefly home: top-right corner of the wall
  const ffs = Math.round(clamp(Math.min(W, H) * 0.15, 54, 92));
  const home = { x: wr.x + wr.w - ffs * 0.62, y: wr.y + ffs * 0.12 };
  LAY = { land, wr, tr, s, size, home, ffs };
  FF.size(ffs); FF.setHome(home.x, home.y);
  if ($('#bub').classList.contains('on')) placeBubble();
}

}
const INTRO = {
  up: ['Kéo hình vào đúng cái bóng nhé!', 'Tìm bóng cho bạn nhé!', '🔦'],
  rot: ['Bóng bị xoay rồi! Bé tìm đúng bóng cho bạn nhé!', 'Bóng bị xoay!', '↻'],
  flip: ['Bóng bị lật rồi! Bé nhìn thật kỹ nhé!', 'Bóng bị lật!', '⇆'],
  similar: ['Các bóng giống nhau lắm! Bé nhìn thật kỹ nhé!', 'Nhìn thật kỹ nhé!', '🔍'],
  who: ['Đây là bóng của bạn nào nhỉ? Bé chọn ở dưới nhé!', 'Bóng của ai?', '❓'],
  mix: ['Thám tử ơi! Tìm bóng cho tất cả các bạn nhé!', 'Thám tử ơi!', '🔍'],
};
const introKey = Lv => Lv.kind === 'who' ? 'who' : Lv.pose === 'mix' ? 'mix' : Lv.similar ? 'similar' : Lv.pose;

async function nextScreen(my) {
  if (my !== roundId || !G) return;
  G.idx++; G.phase = 'intro'; G.selCard = null; G.selShadow = null; G.wrongBy = {}; G.screenMistakes = 0;
  buildSet();
  wallIn.innerHTML = ''; tray.innerHTML = ''; wallIn.classList.remove('out'); tray.classList.remove('out');
  G.set.shadows.forEach((sh, si) => {
    const p = sh.pose, tf = `rotate(${p.r}deg) scale(${p.sx},${p.sy})`;
    const n = el('div', 'sh in', `<div class="halo"></div><div class="zoom"><div class="pose" style="transform:${tf}"><div class="bob"><div class="sil">${art(sh.item)}</div><div class="col">${art(sh.item)}</div></div></div></div><div class="tag">${sh.item.n}</div>`);
    n.dataset.i = si; n.style.animationDelay = (0.15 + si * 0.09) + 's';
    n.addEventListener('pointerdown', e => { e.preventDefault(); onShadowTap(si); });
    if (G.L.kind === 'who') n.appendChild(el('div', 'qb', '?'));
    sh.el = n; wallIn.appendChild(n);
  });
  G.set.cards.forEach((c, ci) => {
    const n = el('div', 'pic in', `<span class="pa">${art(c.item)}</span>`);
    n.dataset.i = ci; n.style.animationDelay = (0.35 + ci * 0.07) + 's';
    c.el = n; tray.appendChild(n); bindCard(c, ci);
  });
  setMid(); layout();
  const sw = $('#sweep'); sw.classList.remove('go'); void sw.offsetWidth; sw.classList.add('go');
  S.appear();
  await wait(650 + G.set.cards.length * 70); if (my !== roundId || !G) return;
  $$('.sh.in', wallIn).forEach(n => { n.classList.remove('in'); n.style.animationDelay = ''; });
  $$('.pic.in', tray).forEach(n => { n.classList.remove('in'); n.style.animationDelay = ''; });
  G.phase = 'play';
  const key = introKey(G.L), [sayT, bubT2, ic] = INTRO[key];
  if (G.idx === 1) { speak(sayT); bubble(ic, bubT2, 5200); }
  else if (G.L.kind === 'who') { speak(pick(['Bóng của ai đây nhỉ?', 'Còn bóng này của ai?', 'Bạn nào đây nhỉ?'])); }
  if (G.idx === 1 && !save.tut[key]) { save.tut[key] = 1; persist(); armHint(1300, () => showHand(2)); }
  armIdle();
}

/* ---------- input: cards (tap or drag) & shadows (tap) ---------- */
function bindCard(c, ci) {
  let ghost = null, offY = 0;
  Kit.tapDrag(c.el, {
    can: () => G && G.phase === 'play' && !c.done && !c.dim && !c.busy,
    tap: () => onCardTap(ci),
    start: (e, p) => {
      hand.hide(); clearSel(); hideBubble();
      const s = c.el.getBoundingClientRect().width;
      offY = e.pointerType === 'touch' ? s * 0.45 : 0;
      ghost = makeGhost(c.item, s * 0.82);
      c.el.classList.add('out'); sfx.pick();
      moveGhost(ghost, p.x, p.y - offY, 1.18, -6);
      overTarget(p.x, p.y - offY, p.x, p.y);
    },
    move: (e, p) => { if (!ghost) return; moveGhost(ghost, p.x, p.y - offY, 1.18, -6 + Math.sin(performance.now() / 120) * 3); overTarget(p.x, p.y - offY, p.x, p.y); },
    end: (e, p) => {
      if (!ghost) return; const gh = ghost; ghost = null;
      const si = p.cancel ? -1 : findTarget(p.x, p.y - offY, p.x, p.y);
      $$('.sh.over', wallIn).forEach(n => n.classList.remove('over'));
      if (si < 0 || !G || G.phase !== 'play') { flyBack(gh, ci); return; }
      tryMatch(ci, si, gh);
    },
  });
}
function makeGhost(item, px) {
  const g = el('div', 'ghost', `<div class="gp">${art(item)}</div>`);
  g.style.width = g.style.height = px + 'px'; g.style.setProperty('--a', px + 'px'); g._s = px;
  document.body.appendChild(g); return g;
}
function moveGhost(g, x, y, sc = 1, rot = 0, sx = 1, sy = 1) {
  g._x = x; g._y = y; g._sc = sc; g._rot = rot;
  g.style.transform = `translate3d(${x - g._s / 2}px,${y - g._s / 2}px,0) rotate(${rot}deg) scale(${sc * sx},${sc * sy})`;
}
function findTarget(x, y, fx, fy) {
  if (!G || !G.set) return -1;
  if (G.L.kind === 'who') { const r = wall.getBoundingClientRect(); return (Kit.inRect(x, y, r, 16) || Kit.inRect(fx, fy, r, 16)) && !G.set.shadows[0].done ? 0 : -1; }
  let best = -1, bd = 1e9;
  G.set.shadows.forEach((s, i) => {
    if (s.done) return;
    const r = s.el.getBoundingClientRect(), pad = Math.max(22, r.width * 0.22), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    [[x, y], [fx, fy]].forEach(([px, py]) => { if (Kit.inRect(px, py, r, pad)) { const d = Math.hypot(px - cx, py - cy); if (d < bd) { bd = d; best = i; } } });
  });
  return best;
}
function overTarget(x, y, fx, fy) {
  const si = findTarget(x, y, fx, fy);
  G.set.shadows.forEach((s, i) => s.el.classList.toggle('over', i === si));
}
function clearSel() {
  if (!G || !G.set) return;
  G.selCard = null; G.selShadow = null;
  $$('.pic.sel', tray).forEach(n => n.classList.remove('sel'));
  $$('.sh.sel,.sh.invite', wallIn).forEach(n => n.classList.remove('sel', 'invite'));
}
function onCardTap(ci) {
  if (!G || G.phase !== 'play') return;
  const c = G.set.cards[ci]; hand.hide(); hideBubble();
  if (G.L.kind === 'who') { tryMatch(ci, 0, null); return; }
  if (G.selShadow != null) { const si = G.selShadow; clearSel(); tryMatch(ci, si, null); return; }
  if (G.selCard === ci) { clearSel(); sfx.click(); return; }
  clearSel(); G.selCard = ci; c.el.classList.add('sel'); sfx.pick();
  G.set.shadows.forEach(s => { if (!s.done) s.el.classList.add('invite'); });
  if (!G.saidName) { G.saidName = 1; speak(c.item.n + '! Bóng của bạn ấy đâu nhỉ?'); }
}
function onShadowTap(si) {
  if (!G || !G.set) return;
  const s = G.set.shadows[si];
  if (s.done) { bump(s.el, 'boing', 520); sfx.pop(); speak(s.item.n); return; }
  if (G.phase !== 'play') return;
  hand.hide(); hideBubble();
  if (G.L.kind === 'who') { sfx.tap(); $$('.pic:not(.done):not(.dim)', tray).forEach(n => bump(n)); speak('Bé chọn một bạn ở dưới nhé!'); return; }
  if (G.selCard != null) { const ci = G.selCard; clearSel(); tryMatch(ci, si, null); return; }
  if (G.selShadow === si) { clearSel(); sfx.click(); return; }
  clearSel(); G.selShadow = si; s.el.classList.add('sel'); sfx.tap();
  $$('.pic:not(.done)', tray).forEach(n => bump(n));
  speak('Bóng của bạn nào nhỉ?');
}

/* ---------- matching ---------- */
function tryMatch(ci, si, ghost) {
  const c = G && G.set.cards[ci], s = G && G.set.shadows[si];
  if (!G || G.phase !== 'play' || !c || !s || c.done || s.done) { if (ghost) flyBack(ghost, ci); return; }
  hand.hide(); armIdle();
  if (c.item.id === s.item.id) correct(ci, si, ghost); else wrong(ci, si, ghost);
}
async function correct(ci, si, ghost) {
  const my = roundId, c = G.set.cards[ci], s = G.set.shadows[si];
  c.done = s.done = true; G.matched++;
  if (G.L.kind === 'who') { G.phase = 'clear'; clearHint(); }
  c.el.classList.remove('sel', 'out', 'hint'); c.el.classList.add('done');
  s.el.classList.remove('hint', 'over', 'sel', 'invite');
  addFound(c.item);
  let g = ghost;
  if (!g) { const r = c.el.getBoundingClientRect(); g = makeGhost(c.item, r.width * 0.74); moveGhost(g, r.left + r.width / 2, r.top + r.height / 2, 1, 0); }
  S.hop();
  await flyInto(g, s);
  g.remove();
  if (my !== roundId || !G) return;
  lightUp(s);
  const done = G.set.shadows.filter(x => x.lit).length;
  S.chime(done);
  speak(s.item.n + '!');
  const r = s.el.getBoundingClientRect(); FF.visit(r.left + r.width / 2, r.top, 1000); FF.react('happy', 820);
  if (G.set.shadows.every(x => x.lit)) screenClear(my);
}
function flyInto(g, s) {
  const r = s.el.getBoundingClientRect(), tx = r.left + r.width / 2, ty = r.top + r.height / 2;
  const x0 = g._x, y0 = g._y, sc0 = g._sc || 1, rot0 = g._rot || 0, k = (parseFloat(s.el.style.getPropertyValue('--a')) || r.width) / g._s;
  const p = s.pose, spin = p.r ? 360 : 0, hop = clamp(Math.hypot(tx - x0, ty - y0) * 0.35, 50, 160);
  return tween(560, (t, raw) => {
    const x = lerp(x0, tx, t), y = lerp(y0, ty, t) - Math.sin(raw * Math.PI) * hop;
    const sc = lerp(sc0, k, t) * (1 + Math.sin(raw * Math.PI) * 0.12);
    g._x = x; g._y = y;
    g.style.transform = `translate3d(${x - g._s / 2}px,${y - g._s / 2}px,0) rotate(${lerp(rot0, p.r + spin, t)}deg) scale(${sc * lerp(1, p.sx, t)},${sc * lerp(1, p.sy, t)})`;
  }, ease.inOut);
}
function flyBack(g, ci) {
  const c = G && G.set && G.set.cards[ci];
  if (!c || !c.el.isConnected) { g.remove(); return; }
  const r = c.el.getBoundingClientRect(), tx = r.left + r.width / 2, ty = r.top + r.height / 2, x0 = g._x, y0 = g._y, sc0 = g._sc || 1, rot0 = g._rot || 0;
  S.back();
  tween(300, t => { g.style.transform = `translate3d(${lerp(x0, tx, t) - g._s / 2}px,${lerp(y0, ty, t) - g._s / 2}px,0) rotate(${lerp(rot0, 0, t)}deg) scale(${lerp(sc0, 1, t)})`; }, ease.out)
    .then(() => { g.remove(); if (!c.done) { c.el.classList.remove('out'); bump(c.el); } });
}
function lightUp(s) {
  s.lit = true; s.el.classList.add('lit');
  const ring = el('div', 'ring'); s.el.appendChild(ring); setTimeout(() => ring.remove(), 750);
  const c = Kit.center(s.el);
  burst(c.x, c.y, { n: 16, colors: ['#fff3a0', '#ffd84a', '#ffffff', '#ffb3d9', '#a8f0ff'], size: 14, speed: 7 });
  sparkle(c.x, c.y, { n: 8 });
  S.bloom();
  setTimeout(() => s.el.isConnected && bump(s.el, 'dance', 650), 120);
  // rotated / flipped friends land in the shadow's pose, then happily spin back upright
  const p = s.pose;
  if (p.r || p.sx < 0 || p.sy < 0) {
    const my = roundId, po = s.el.querySelector('.pose');
    setTimeout(() => {
      if (my !== roundId || !po.isConnected) return;
      po.style.transition = 'transform .75s cubic-bezier(.3,1.45,.5,1)';
      po.style.transform = `rotate(${p.r > 180 ? 360 : 0}deg) scale(1,1)`;
      tone({ f: 300, to: 820, dur: 0.22, vol: 0.09, type: 'triangle' });
    }, 750);
  }
}
function wrong(ci, si, ghost) {
  const c = G.set.cards[ci], s = G.set.shadows[si];
  G.mistakes++; G.screenMistakes++; G.wrongBy[ci] = (G.wrongBy[ci] || 0) + 1;
  clearSel(); sfx.bad(); Kit.vibrate(35);
  act(s.el, 'shake', 460);
  if (ghost) flyBack(ghost, ci); else act(c.el, 'shake', 460);
  FF.react('no', 650);
  Kit.praise(pick(['Thử lại nhé!', 'Chưa đúng rồi!', 'Gần đúng rồi!']), { soft: true, speak: false });
  if (G.L.kind === 'who') {
    c.dim = true; setTimeout(() => c.el.classList.add('dim'), 380);
    speak(pick(['Không phải bạn này rồi. Thử bạn khác nhé!', 'Chưa đúng, bé nhìn kỹ hình dáng nhé!']));
    if (G.screenMistakes >= 2) showAnswerHint();
  } else {
    speak(pick(['Không phải bóng này rồi. Thử lại nhé!', 'Chưa đúng, bé nhìn kỹ hình dáng nhé!', 'Gần đúng rồi! Thử bóng khác nhé!']));
    if (G.wrongBy[ci] >= 2) showAnswerHint(ci);
  }
}
function targetOf(ci) { const id = G.set.cards[ci].item.id; return G.set.shadows.findIndex(s => s.item.id === id); }
function showAnswerHint(ci) {
  if (!G || !G.set) return;
  if (ci == null) ci = G.set.cards.findIndex(c => !c.done && targetOf(G.set.cards.indexOf(c)) >= 0);
  const si = targetOf(ci); if (si < 0) return;
  G.set.shadows[si].el.classList.add('hint'); G.set.cards[ci].el.classList.add('hint');
  hand.drag(() => G && G.set && G.set.cards[ci] && G.set.cards[ci].el, () => G && G.set && G.set.shadows[si] && G.set.shadows[si].el, { times: 1 });
}
function showHand(times) {
  if (!G || !G.set || G.phase !== 'play') return;
  const ci = G.set.cards.findIndex((c, i) => !c.done && !c.dim && targetOf(i) >= 0); if (ci < 0) return;
  const si = targetOf(ci);
  hand.drag(() => G && G.set && G.set.cards[ci] && G.set.cards[ci].el, () => G && G.set && G.set.shadows[si] && G.set.shadows[si].el, { times });
}
function addFound(item) {
  if (!save.album.includes(item.id)) { save.album.push(item.id); G.newFound.push(item); persist(); }
}

let hintT = 0, idleT = 0;
function armHint(ms, fn) { clearTimeout(hintT); const my = roundId; hintT = setTimeout(() => { if (my === roundId && G) fn(); }, ms); }
function armIdle() {
  clearTimeout(idleT); const my = roundId;
  idleT = setTimeout(() => {
    if (my !== roundId || !G || G.phase !== 'play') return;
    const [sayT, bubT2, ic] = INTRO[introKey(G.L)];
    speak(sayT); bubble(ic, bubT2, 3000); FF.react('happy', 800); showHand(1);
    armIdle();
  }, 9000);
}
function clearHint() { clearTimeout(hintT); clearTimeout(idleT); hand.hide(); }
window.addEventListener('pointerdown', () => { if (G && G.phase === 'play') armIdle(); }, true);

async function screenClear(my) {
  G.phase = 'clear'; clearHint(); clearSel();
  G.res[G.idx - 1] = G.screenMistakes ? 2 : 1; setMid();
  await wait(500); if (my !== roundId || !G) return;
  S.clear(); FF.home(); FF.react('happy', 820);
  Kit.praise(G.screenMistakes ? pick(['Đúng rồi!', 'Hay lắm!', 'Giỏi lắm!']) : null, { speak: G.L.kind !== 'who' });
  G.set.shadows.forEach((s, i) => setTimeout(() => { if (my !== roundId || !s.el.isConnected) return; bump(s.el, 'dance', 650); const c = Kit.center(s.el); sparkle(c.x, c.y, { n: 5 }); }, 80 + i * 110));
  await wait(G.L.kind === 'who' ? 1300 : 1700); if (my !== roundId || !G) return;
  if (G.idx >= G.total) { finish(my); return; }
  wallIn.classList.add('out'); tray.classList.add('out');
  await wait(380); if (my !== roundId || !G) return;
  wallIn.classList.remove('out'); tray.classList.remove('out');
  nextScreen(my);
}
function finish(my) {
  if (my !== roundId || !G) return;
  G.phase = 'end'; clearHint();
  const m = G.mistakes, stars = m === 0 ? 3 : m <= 3 ? 2 : 1, key = save.theme + ':' + G.li;
  save.stars[key] = Math.max(save.stars[key] || 0, stars); persist();
  const nf = G.newFound, li = G.li;
  Kit.result({
    stars, title: stars === 3 ? 'Thám tử bóng đêm!' : stars === 2 ? 'Giỏi lắm!' : 'Hoàn thành!',
    text: `Bé đã tìm bóng cho ${G.matched} bạn`,
    reward: nf.length ? { emoji: rewardArt(nf[0]), label: `+${nf.length} bạn mới trong Sổ bóng` } : null,
    say: stars === 3 ? 'Thám tử bóng đêm! Bé giỏi quá!' : 'Giỏi lắm! Bé đã tìm bóng cho các bạn!',
    buttons: [
      { label: 'Chơi lại', icon: 'replay', cls: 'white', onClick: () => startLevel(li) },
      { label: li + 1 < LEVELS.length ? 'Màn tiếp' : 'Màn 1', icon: 'next', cls: 'ok', onClick: () => startLevel((li + 1) % LEVELS.length) },
      { label: 'Chọn màn', icon: 'home', cls: 'gold small', onClick: () => { leavePlay(); renderSelect(); show('select'); } },
    ],
  });
}

/* ================= ALBUM ================= */
function renderAlbum() {
  const body = $('#albumBody'), all = ITEMS.filter(canShow), got = all.filter(i => save.album.includes(i.id)).length;
  body.innerHTML = `<div class="k-h">Sổ bóng</div><div class="k-pill"><span class="emo">🔦</span>${got} / ${all.length}</div>`;
  THEMES.forEach(t => {
    const list = all.filter(i => i.t === t.id), n = list.filter(i => save.album.includes(i.id)).length;
    const sec = el('div', 'alb-sec', `<h3><span class="emo">${t.icon}</span>${t.name}<small>${n}/${list.length}</small></h3><div class="alb-grid"></div>`);
    const gr = sec.querySelector('.alb-grid');
    list.forEach(it => {
      const has = save.album.includes(it.id);
      const c = el('button', 'card ' + (has ? 'has' : 'no'), `<span class="ca${has ? '' : ' sil'}">${art(it)}</span><span class="lb">${has ? it.n : '?'}</span>`);
      c.onclick = () => {
        if (has) { sfx.pop(); say(it.n); bump(c); const r = Kit.center(c); sparkle(r.x, r.y, { n: 5 }); }
        else { Kit.sfx.boing(); act(c, 'shake', 460); say('Chơi để tìm bạn này nhé!'); }
      };
      gr.appendChild(c);
    });
    body.appendChild(sec);
  });
}

Kit.music.start(SONG);

/* ---------- test hook (read-only) ---------- */
Object.defineProperty(window, '__dbg', { get: () => G && G.set && ({
  phase: G.phase, kind: G.L.kind, idx: G.idx, total: G.total, mistakes: G.mistakes, li: G.li,
  pairs: G.set.cards.map((c, ci) => ({ ci, si: targetOf(ci), done: !!c.done, dim: !!c.dim, id: c.item.id })),
  poses: G.set.shadows.map(s => s.pose),
}) });
Object.defineProperty(window, '__items', { get: () => ({ items: ITEMS.map(i => ({ id: i.id, n: i.n, g: i.g, t: i.t, ok: canShow(i), html: art(i) })), pairs: THEMES.map(t => t.pairs) }) });
})();
</script>
</body>
</html>
