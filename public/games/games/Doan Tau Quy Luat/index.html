<!DOCTYPE html>
<html lang="vi" data-game="train">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4fb9ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Đoàn Tàu Quy Luật</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
:root{--c1:#2f9bff;--c1d:#1b6fd1;--c2:#ff6a5b;--c2d:#d9453a;--bg1:#7fd3ff;--bg2:#e6f8ff;--ink:#27406b;--ink-soft:#5e7397;--ok:#3cc86a;--okd:#22a04f;--u:80px;--cs:90px}
body{background:#bfe9ff}
.screen{z-index:1}

/* ---------- world (parallax scenery) ---------- */
#world{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:linear-gradient(180deg,#46b4ff 0%,#8fd6ff 42%,#d9f4ff 78%,#eefaff 100%)}
.lyr{position:absolute;left:0;top:0;background-repeat:repeat-x;background-position:0 0;will-change:transform}
#lGround{background-repeat:repeat;background-color:#8bd264}
.sun{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
  background:radial-gradient(circle,#fff7b8 0 34%,#ffe066 35% 52%,rgba(255,224,102,.35) 53% 64%,rgba(255,224,102,0) 70%)}
.sun::before{content:"";position:absolute;inset:-18%;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,236,140,.55) 0 10deg,transparent 10deg 30deg);
  -webkit-mask:radial-gradient(circle,transparent 0 46%,#000 47% 70%,transparent 71%);mask:radial-gradient(circle,transparent 0 46%,#000 47% 70%,transparent 71%);
  animation:sunspin 30s linear infinite}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-1 * var(--tw)),0,0)}}
.cruise .lyr,.cruise .track{animation:scroll var(--dur,10s) linear infinite}

/* ---------- track ---------- */
.track{position:absolute;left:-26px;width:calc(100% + 52px);height:16px;pointer-events:none;will-change:transform;z-index:1;
  background:
    linear-gradient(180deg,#eef2f7 0 1.5px,#97a2b2 1.5px 4px,#6c7686 4px 5.5px) 0 0/100% 5.5px no-repeat,
    repeating-linear-gradient(90deg,#86562c 0 13px,transparent 13px 26px) 0 5px/100% 6px no-repeat,
    linear-gradient(180deg,#d7c29b,#b9a07a) 0 8px/100% calc(100% - 8px) no-repeat;
  border-radius:0 0 6px 6px;--tw:26px}

/* ---------- train cars ---------- */
.car{position:absolute;left:0;top:0}
.car>svg{position:absolute;display:block;overflow:visible}
.wg{width:var(--u);height:calc(var(--u) * 1.32)}
.wg .wsvg{left:0;bottom:0;width:100%;height:calc(var(--u) * .6)}
.cargo{position:absolute;left:12%;width:76%;height:calc(var(--u) * .76);bottom:calc(var(--u) * .5);z-index:2}
.cargo>.art{position:absolute;inset:0;--as:calc(var(--u) * .76);filter:drop-shadow(0 3px 0 rgba(30,40,80,.18))}
.loco{width:calc(var(--u) * 1.62);height:calc(var(--u) * 1.215);z-index:3}
.loco .lsvg{inset:0;width:100%;height:100%}
.pc{width:calc(var(--u) * 1.15);height:calc(var(--u) * .958)}
.pc>svg{inset:0;width:100%;height:100%}
.pas{position:absolute;top:45%;font-size:calc(var(--u) * .4);transform:translate(-50%,-50%);animation:pasb 1.2s ease-in-out infinite;transform-origin:50% 90%;z-index:2}
.pas.p0{left:29%}.pas.p1{left:71%;animation-delay:-.6s}
@keyframes pasb{0%,100%{transform:translate(-50%,-50%) rotate(-7deg)}50%{transform:translate(-50%,-60%) rotate(7deg)}}
.moving .pas{animation-duration:.5s}

.whl{transform-box:fill-box;transform-origin:center}
.moving .whl{animation:spin .42s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.moving .car{animation:rock .32s ease-in-out infinite}
.moving .car:nth-child(2n){animation-delay:-.16s}
@keyframes rock{0%,100%{translate:0 0}50%{translate:0 -1.5px}}

/* loco face & driver */
.look{transition:transform .18s ease-out}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.lsvg .m-o,.lsvg .m-flat,.lsvg .brows{display:none}
.loco.o .m-smile,.loco.sad .m-smile{display:none}
.loco.o .m-o{display:inline}
.loco.sad .m-flat,.loco.sad .brows{display:inline}
.drv{animation:drv 1.6s ease-in-out infinite}
@keyframes drv{0%,100%{transform:translateY(0)}50%{transform:translateY(1.2px)}}
.arm{display:none;transform-box:view-box;transform-origin:70px 88px}
.loco.wave .arm{display:inline;animation:wave .32s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(14deg)}}
.lamp{animation:lamp 2.2s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.55}50%{opacity:1}}

/* smoke */
.puff{position:absolute;left:69.5%;top:14%;width:30%;aspect-ratio:1;margin:-15% 0 0 -15%;border-radius:50%;pointer-events:none;opacity:0;z-index:4;
  background:radial-gradient(circle at 38% 36%,#fff 0 30%,#f1f6fb 55%,#d9e3ee 100%);animation:puff 3.2s ease-out infinite}
.puff.p2{animation-delay:-.8s}.puff.p3{animation-delay:-1.6s}.puff.p4{animation-delay:-2.4s}
@keyframes puff{0%{transform:translate(0,0) scale(.2);opacity:0}10%{opacity:.95}100%{transform:translate(-70%,-170%) scale(1.25);opacity:0}}
.moving .puff{animation-duration:.85s;animation-name:puffm}
@keyframes puffm{0%{transform:translate(0,0) scale(.25);opacity:0}12%{opacity:.95}100%{transform:translate(-190%,-120%) scale(1.3);opacity:0}}
.puff.big{animation:puffb 1.3s ease-out forwards;width:40%;margin:-20% 0 0 -20%}
@keyframes puffb{0%{transform:translate(0,0) scale(.3);opacity:0}10%{opacity:1}100%{transform:translate(var(--px,-60%),-210%) scale(1.6);opacity:0}}

/* slot (empty wagon) */
.slot{position:absolute;inset:3%;border-radius:24%;border:3px dashed #ffb21e;background:rgba(255,255,255,.78);display:grid;place-items:center;
  animation:slotGlow 1.5s ease-in-out infinite;transition:background .15s,transform .15s}
.slot b{font-weight:800;font-size:calc(var(--u) * .5);line-height:1;color:#ff9a0e;-webkit-text-stroke:.07em #fff;paint-order:stroke fill;margin-top:4%}
@keyframes slotGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,196,40,0);transform:scale(1)}50%{box-shadow:0 0 calc(var(--u) * .2) calc(var(--u) * .05) rgba(255,200,40,.85);transform:scale(1.05)}}
.slot.over{background:#fff3c4;transform:scale(1.15);animation:none;border-style:solid;box-shadow:0 0 0 4px #ffd23d,0 0 calc(var(--u) * .3) rgba(255,190,30,.9)}

/* highlights while reading */
@keyframes hl{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-14%) scale(1.14)}100%{transform:translateY(0) scale(1)}}
.wg.hl .cargo::after{content:"";position:absolute;left:8%;right:8%;bottom:-6%;height:14%;border-radius:50%;background:rgba(255,236,120,.9);filter:blur(4px);z-index:-1}
.wg.hop{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16%)}}
.wg.land .cargo{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(1.25,.7)}45%{transform:scale(.9,1.15) translateY(-8%)}100%{transform:none}}
.wg.hl .cargo{animation:hl .5s cubic-bezier(.3,1.6,.5,1)}
.wg.no{animation:nono .55s ease-in-out}
@keyframes nono{0%,100%{transform:rotate(0)}20%{transform:translateX(-5%) rotate(-5deg)}40%{transform:translateX(5%) rotate(5deg)}60%{transform:translateX(-3%) rotate(-3deg)}80%{transform:translateX(2%) rotate(2deg)}}
.wg.no{transform-origin:50% 100%}

/* reading tag */
.tag{position:absolute;z-index:6;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;background:#fff;color:var(--ink);font-weight:800;white-space:nowrap;
  font-size:max(15px,calc(var(--u) * .22));line-height:1;padding:.32em .7em .28em;border-radius:999px;box-shadow:0 4px 0 rgba(30,60,120,.15),0 6px 14px rgba(30,60,120,.15)}
.tag::after{content:"";position:absolute;left:calc(50% + var(--ax,0px));bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.tag.q{background:#ffd23d;color:#7a4a00}
.tag.q::after{border-top-color:#ffd23d}
.tag.pop{animation:tagpop .35s cubic-bezier(.2,1.7,.4,1)}
@keyframes tagpop{from{transform:translate(-50%,-100%) scale(.4)}to{transform:translate(-50%,-100%) scale(1)}}

/* speaker on the loco */
.spk{position:absolute;right:-6%;top:-26%;width:max(44px,calc(var(--u) * .5));height:max(44px,calc(var(--u) * .5));border-radius:50%;border:none;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(30,60,120,.18),0 6px 12px rgba(30,60,120,.15);z-index:7;padding:0;touch-action:manipulation}
.spk svg{width:60%;height:60%}
.spk.ping{animation:k-pulse 1.2s ease-in-out 3}
.spk:active{transform:translateY(3px) scale(.95)}

/* ---------- title ---------- */
#title{justify-content:space-evenly;padding:calc(66px + var(--safe-t)) 12px calc(14px + var(--safe-b))}
#title .logo{--c1d:#1b6fd1;position:relative;z-index:2}
#title .logo .l2{color:#ffd23d;font-size:1.08em}
.trainbox{position:relative;flex:0 0 auto;z-index:2}
.trainbox .car{cursor:pointer}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:2}
#ttrack{z-index:1}
@media (orientation:portrait){#title .logo{font-size:min(15vw,8vh,104px)}}
@media (max-height:500px){
  #title{padding-top:calc(58px + var(--safe-t))}
  #title .logo{font-size:clamp(34px,9vmin,60px)}
  #title .logo br{display:none}
  #title .logo .l2{margin-left:.25em}
  .title-btns{flex-direction:row}
}

/* ---------- map ---------- */
#map{background:linear-gradient(180deg,#c8f2a6 0%,#a3e07e 100%)}
#map .mapbg{position:absolute;inset:0;background-size:320px auto;opacity:.85;pointer-events:none}
#mapBox{position:absolute;left:calc(6px + var(--safe-l));right:calc(6px + var(--safe-r));top:calc(var(--bar-h) + var(--safe-t));bottom:calc(6px + var(--safe-b))}
#mapSvg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sta{position:absolute;border:none;cursor:pointer;border-radius:24px;background:#fff;padding:6px 4px 6px;font-family:var(--font);color:var(--ink);
  box-shadow:0 7px 0 rgba(40,110,40,.22),0 12px 22px rgba(30,90,30,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .15s}
.sta:active{transform:translateY(4px)}
.sta .num{position:absolute;top:-10px;left:-8px;width:clamp(30px,calc(var(--sh) * .24),44px);height:clamp(30px,calc(var(--sh) * .24),44px);border-radius:50%;background:var(--c2);color:#fff;font:800 clamp(17px,calc(var(--sh) * .14),24px)/clamp(30px,calc(var(--sh) * .24),44px) var(--font);box-shadow:0 3px 0 var(--c2d);text-align:center}
.sta .lm{font-size:calc(var(--sh) * .25);width:1.45em;height:1.45em;border-radius:50%;background:#e6f5ff;display:grid;place-items:center}
.sta .chips{display:flex;align-items:center;justify-content:center;gap:3px;height:calc(var(--sh) * .12);min-height:12px;font-size:calc(var(--sh) * .11)}
.chip{display:block;width:calc(var(--sh) * .1);height:calc(var(--sh) * .1);min-width:9px;min-height:9px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}

.chips .emo{font-size:1.2em;letter-spacing:-.05em}
.chips b{font-weight:800;color:var(--c1d);font-size:1.25em;letter-spacing:.05em}
.chips .bar{display:block;width:calc(var(--sh) * .05);min-width:5px;background:#ff9124;border-radius:2px}
.sta .nm{font-weight:800;font-size:clamp(11px,calc(var(--sh) * .1),19px);line-height:1;white-space:nowrap;color:var(--ink-soft)}
.sta .st{display:flex;gap:1px}
.k-mini-star svg{width:clamp(15px,calc(var(--sh) * .15),22px);height:auto;color:#dfe7f1}
.k-mini-star.on svg{color:#ffc83d}
.sta .lk{color:#9fb5a0;display:grid;place-items:center}
.sta .lk svg{width:clamp(18px,calc(var(--sh) * .16),26px);height:auto}
.sta.locked{background:#e8f2e1;box-shadow:0 7px 0 rgba(40,110,40,.14)}
.sta.locked .lm{filter:grayscale(1);opacity:.45}
.sta.locked .chips{opacity:.35;filter:grayscale(.8)}

.sta.cur{box-shadow:0 7px 0 var(--c1d),0 0 0 5px #fff,0 0 30px rgba(255,255,255,.95);animation:k-pulse 1.8s ease-in-out infinite}

.here{position:absolute;right:-5%;top:-36%;width:52%;pointer-events:none;animation:k-bob 1.6s ease-in-out infinite}

.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:20px;color:var(--ink);box-shadow:0 5px 0 rgba(30,60,120,.14)}

#cards{display:flex;gap:var(--cg,12px);justify-content:center;padding:10px 14px 14px;border-radius:30px;background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);pointer-events:auto}
.ans{position:relative;width:var(--cs);height:calc(var(--cs) * 1.2);border:none;border-radius:calc(var(--cs) * .22);background:#fff;padding:0;cursor:grab;color:var(--ink);
  box-shadow:0 6px 0 #c3d6ea,0 10px 18px rgba(30,60,110,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s,opacity .2s}
.ans .art{width:80%;height:68%;--as:calc(var(--cs) * .66)}
.ans.nolb .art{width:86%;height:80%}
.ans .lb{font-weight:800;line-height:1;margin-top:3%;text-align:center;white-space:nowrap;color:var(--ink)}
.ans.press{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 #c3d6ea,0 4px 8px rgba(30,60,110,.14)}
.ans.lift{opacity:.3;transform:scale(.92)}
.ans.in{animation:cardIn .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cardIn{from{transform:translateY(60%) scale(.5);opacity:0}to{transform:none;opacity:1}}
.ans.glow{box-shadow:0 6px 0 #e3a600,0 0 0 4px #ffd23d,0 0 26px rgba(255,200,40,.95);animation:k-pulse 1s ease-in-out infinite}
.ans.wig{animation:k-wiggle .45s ease-in-out}

.art{display:grid;place-items:center;pointer-events:none}
.art svg{width:100%;height:100%;display:block;overflow:visible}
.art .emo{font-size:calc(var(--as) * .9);line-height:1}

.hand{position:fixed;left:0;top:0;z-index:58;pointer-events:none;font-size:52px;line-height:1;margin:-6px 0 0 -26px;opacity:0;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}

.sbanner{position:absolute;left:50%;top:12px;z-index:5;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;
  padding:6px 22px 6px 8px;box-shadow:0 6px 0 rgba(30,60,120,.15),0 14px 30px rgba(30,60,120,.2);pointer-events:none;white-space:nowrap;animation:sban 2.4s cubic-bezier(.2,1.4,.4,1) forwards}

.sbanner small{display:block;font-size:.55em;color:var(--c2d);font-weight:800}
@keyframes sban{0%{transform:translateX(-50%) scale(.3);opacity:0}14%{transform:translateX(-50%) scale(1.08);opacity:1}22%{transform:translateX(-50%) scale(1)}82%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-20px) scale(.9);opacity:0}}

/* result + passengers */
.k-panel.k-result{overflow:visible;margin-top:64px}
.res-top{position:relative;width:170px;height:96px;margin:-92px auto 0}

.res-top .emo{position:absolute;right:-30px;bottom:6px;font-size:44px;animation:k-bob 1.4s ease-in-out infinite}

@media (max-height:520px){
  .k-ov{padding:8px}
  .k-panel.k-result{margin-top:44px;padding:10px 18px 14px;max-height:none}

  .res-top .emo{font-size:34px;right:-24px}
  .k-panel.k-result h2{font-size:30px}
  .k-result .k-stars{margin:4px 0 0}

  .k-result p{margin-top:2px;font-size:16px}
  .k-result .k-reward{margin-top:6px;padding:4px 14px 4px 8px;font-size:16px}
  .k-result .k-reward .emo{font-size:32px}
  .k-result .k-btns{margin-top:10px}
  .k-result .btn{font-size:20px}
}
.paspanel h2{margin-bottom:4px}
.pcount{font-weight:800;color:var(--c2d);font-size:20px}
.psec{font-weight:800;color:var(--ink-soft);font-size:17px;margin:12px 0 6px;display:flex;align-items:center;justify-content:center;gap:6px}
.psec svg{width:20px;height:20px;color:#ffc83d}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pas-b{border:none;background:#f3f9ff;border-radius:18px;padding:6px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #e0ecf8;font-family:var(--font);color:var(--ink);position:relative}
.pas-b .emo{font-size:clamp(28px,8vw,40px);width:1.45em;height:1.45em;display:grid;place-items:center;border-radius:50%;background:#fff}

.pas-b small{position:absolute;top:-6px;left:-4px;background:var(--c1);color:#fff;border-radius:9px;font:800 11px/1 var(--font);padding:3px 5px;box-shadow:0 2px 0 var(--c1d)}
.pas-b.no .emo{filter:brightness(0) opacity(.14)}
.pas-b.no span.n{color:#b6c4d6}
.pas-b.wig{animation:k-wiggle .5s ease-in-out}

@media (prefers-reduced-motion:reduce){.sun::before,.puff,.drv,.pas{animation:none!important}}

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }
    else ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + a + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.2, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 2, t, vol: vol * 0.22, dur: dur * 0.5, bus });
    tone({ f: f * 3.01, t, vol: vol * 0.07, dur: dur * 0.3, bus });
  }
  function marimba(f, t = 0, vol = 0.2, dur = 0.4, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 4, t, vol: vol * 0.16, dur: dur * 0.18, bus });
  }
  function pluck(f, t = 0, vol = 0.12, dur = 0.3, bus) { tone({ f, t, vol, dur, type: 'triangle', lp: 2200, bus }); }

  const sfx = {
    tap() { tone({ f: 700, to: 960, dur: 0.06, vol: 0.12, type: 'triangle' }); },
    click() { tone({ f: 1300, dur: 0.03, vol: 0.06, type: 'triangle' }); },
    pop() { tone({ f: 360, to: 1250, slide: 0.07, dur: 0.1, vol: 0.32 }); noise({ f: 2600, q: 0.8, dur: 0.05, vol: 0.1 }); },
    good() { bell(1046.5, 0, 0.18, 0.5); bell(1318.5, 0.09, 0.18, 0.7); },
    bad() { tone({ f: 330, to: 300, dur: 0.15, vol: 0.15, type: 'triangle', lp: 1200 }); tone({ f: 262, to: 240, t: 0.17, dur: 0.24, vol: 0.15, type: 'triangle', lp: 1000 }); },
    star() { [1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.06, 0.08, 0.35)); },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.11, 0.17, 0.6));
      [1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.5 + i * 0.05, 0.05, 0.4));
    },
    fanfare() {
      const n = [[523.25, 0], [523.25, 0.12], [523.25, 0.24], [659.25, 0.36], [783.99, 0.6], [659.25, 0.78], [783.99, 0.9], [1046.5, 1.08]];
      n.forEach(([f, t]) => { tone({ f, t, vol: 0.09, dur: 0.22, type: 'square', lp: 2600 }); bell(f, t, 0.1, 0.4); });
      [1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 1.2 + i * 0.05, 0.05, 0.5));
    },
    whoosh() { noise({ f: 400, to: 3200, q: 1.2, dur: 0.28, vol: 0.13 }); },
    pick() { tone({ f: 520, to: 800, dur: 0.08, vol: 0.14, type: 'triangle' }); },
    drop() { tone({ f: 620, to: 300, dur: 0.1, vol: 0.16 }); noise({ f: 320, q: 0.7, dur: 0.06, vol: 0.08, ft: 'lowpass' }); },
    flip() { noise({ f: 1900, to: 900, q: 0.9, dur: 0.08, vol: 0.12 }); tone({ f: 520, to: 720, dur: 0.05, vol: 0.05, type: 'triangle' }); },
    boing() { tone({ f: 170, to: 540, slide: 0.12, dur: 0.3, vol: 0.18 }); },
    chomp() { noise({ f: 650, q: 1.6, dur: 0.07, vol: 0.32, ft: 'lowpass' }); noise({ t: 0.15, f: 560, q: 1.6, dur: 0.07, vol: 0.3, ft: 'lowpass' }); },
    coin() { tone({ f: 988, dur: 0.07, vol: 0.1, type: 'square', lp: 4000 }); tone({ f: 1319, t: 0.07, dur: 0.3, vol: 0.1, type: 'square', lp: 4000 }); },
    tick() { tone({ f: 1800, dur: 0.02, vol: 0.05 }); },

const T_CLOUD = { w: 1200, h: 200 }, T_MOUNT = { w: 1000, h: 200 }, T_HILL = { w: 1600, h: 220 }, T_GROUND = { w: 360, h: 260 }, T_BUSH = { w: 900, h: 70 };

      if (snow) s += `<path d="M${x - w * .115} ${H - h * .8} Q${x - w * .06} ${H - h * .96} ${x} ${H - h} Q${x + w * .06} ${H - h * .96} ${x + w * .115} ${H - h * .8} Q${x + w * .06} ${H - h * .75} ${x + w * .02} ${H - h * .8} Q${x - w * .03} ${H - h * .74} ${x - w * .115} ${H - h * .8}Z" fill="#fff" opacity=".9"/>`;

function tileHills() {

  const tree = (x, y, s) => `<g transform="translate(${x} ${y.toFixed(1)}) scale(${s})"><rect x="-4" y="-30" width="8" height="32" rx="3" fill="#94653a"/><circle cx="-12" cy="-38" r="15" fill="#3fa24f"/><circle cx="12" cy="-36" r="16" fill="#3a9a4a"/><circle cx="0" cy="-48" r="22" fill="#47b058"/><circle cx="-7" cy="-56" r="8" fill="#76d47c"/></g>`;

function tileGround() {

const LAYERS = [
  { id: 'lClouds', f: .07, tile: T_CLOUD, svg: tileClouds() },
  { id: 'lMount', f: .2, tile: T_MOUNT, svg: tileMount() },
  { id: 'lHills', f: .45, tile: T_HILL, svg: tileHills() },
  { id: 'lGround', f: 1, tile: T_GROUND, svg: tileGround(), both: true },
  { id: 'lBush', f: 1, tile: T_BUSH, svg: tileBush() },
];
LAYERS.forEach(L => { L.el = $('#' + L.id); L.el.style.backgroundImage = svgURL(L.svg); });
$('#mapbg').style.backgroundImage = svgURL(LAYERS[3].svg);
let cam = 0;
const CRUISE = 70; // px/s on the title screen
function setWorld(hz, u, bushBottom) {
  const W = innerWidth, H = innerHeight;
  const sc = Kit.clamp(u / 90, .55, 1.3);
  const geo = {
    lClouds: { h: Kit.clamp(hz * .5, 70, 200), top: Math.max(4, hz * .06) },
    lMount: { h: Kit.clamp(u * 2.1, 80, 240) }, lHills: { h: Kit.clamp(u * 1.75, 70, 210) },
    lGround: { top: hz - 2, h: H - hz + 2, scale: sc }, lBush: { h: Kit.clamp(u * .55, 30, 70) },
  };
  geo.lMount.top = hz - geo.lMount.h + 4;
  geo.lHills.top = hz - geo.lHills.h * .78;
  geo.lBush.top = (bushBottom || hz + 40) - geo.lBush.h + 2;
  geo.lGround.top = hz - 2;
  for (const L of LAYERS) {
    const g = geo[L.id];
    let tw, th;
    if (L.both) { th = L.tile.h * g.scale; tw = L.tile.w * g.scale; }
    else { th = g.h; tw = L.tile.w * th / L.tile.h; }
    L.tw = tw;
    const s = L.el.style;
    s.top = g.top + 'px'; s.height = g.h + 'px'; s.width = (W + tw * 2 + 4) + 'px';
    s.backgroundSize = `${tw}px ${th}px`;
    s.setProperty('--tw', tw + 'px'); s.setProperty('--dur', (tw / (CRUISE * L.f)) + 's');
  }
  $('#lBush').style.display = bushBottom ? '' : 'none';
  const sun = $('#sun').style; sun.left = (W * .86) + 'px'; sun.top = Math.max(Kit.clamp(hz * .26, 40, 160), 0) + 'px';
  applyCam();
}
const mod = (a, b) => ((a % b) + b) % b;
function applyCam() {
  for (const L of LAYERS) if (L.tw) L.el.style.transform = `translate3d(${-mod(cam * L.f, L.tw).toFixed(2)}px,0,0)`;
  $$('#tracks .track').forEach(t => t.style.transform = `translate3d(${-mod(cam, 26).toFixed(2)}px,0,0)`);
}

const SND = {
  whistle(t = 0, hold = .45) {
    const f0 = 587.33;
    [[1, .07], [1.26, .055], [1.5, .05]].forEach(([m, v]) => {
      Kit.tone({ f: f0 * m * .94, to: f0 * m, slide: .09, type: 'triangle', vol: v, a: .05, hold, dur: .24, lp: 2600, t });
      Kit.tone({ f: f0 * m * 1.88, to: f0 * m * 2, slide: .09, type: 'sine', vol: v * .22, a: .05, hold, dur: .2, t });
    });
    Kit.noise({ f: 2400, q: 1.2, a: .05, dur: hold + .2, vol: .035, t });
  },
  toot() { this.whistle(0, .14); this.whistle(.3, .55); },
  chuff(v = .11) { Kit.noise({ f: 700, to: 300, ft: 'lowpass', q: .8, dur: .11, vol: v }); Kit.noise({ f: 2600, q: 1, dur: .05, vol: v * .35 }); },
  brake() { Kit.noise({ f: 4600, to: 2600, q: 4, dur: .5, vol: .045 }); },
  ding() { Kit.bell(1318.5, 0, .08, .5); Kit.bell(1046.5, .16, .08, .6); },
  note(m) { Kit.marimba(Kit.mtof(m), 0, .17, .5); },
  ask() { Kit.tone({ f: 500, to: 760, slide: .2, dur: .26, vol: .11, type: 'triangle' }); },
};

/* =====================================================================
   TRAIN BUILDING / LAYOUT
   ===================================================================== */
const GAP = .05;
function buildTrain(box, items, riders, o = {}) {
  box.innerHTML = '';
  const cars = [];
  if (riders && riders.length) {
    const c = el('div', 'car pc', pcSVG() + riders.map((p, i) => `<span class="pas emo p${i}">${p[1]}</span>`).join(''));
    cars.push({ el: c, kind: 'pc', w: 1.15, h: .958 });
  }
  items.forEach((it, i) => {
    const c = el('div', 'car wg', `<div class="cargo">${it ? `<div class="art">${art(it)}</div>` : '<div class="slot"><b>?</b></div>'}</div>${wagonSVG()}`);
    c.dataset.i = i;
    cars.push({ el: c, kind: 'wg', i, w: 1, h: 1.32 });
  });
  const lc = el('div', 'car loco', locoSVG() + '<i class="puff p1"></i><i class="puff p2"></i><i class="puff p3"></i><i class="puff p4"></i>' +
    (o.spk ? `<button class="spk" aria-label="Nghe lại">${icon('sound')}</button>` : ''));
  cars.push({ el: lc, kind: 'loco', w: 1.62, h: 1.215 });
  cars.forEach(c => box.appendChild(c.el));
  return cars;
}
const rowUnits = (cars, a, b) => { let s = 0; for (let i = a; i < b; i++) s += cars[i].w; return s + (b - a - 1) * GAP; };
function bestSplit(cars, R) {
  const n = cars.length; if (R > n) return null;
  const okRow = (a, b) => cars.slice(a, b).some(c => c.kind === 'wg');
  let best = null;
  const consider = s => { if (!s.every(([a, b]) => okRow(a, b))) return; const m = Math.max(...s.map(([a, b]) => rowUnits(cars, a, b))); if (!best || m < best.m) best = { m, s }; };
  if (R === 1) consider([[0, n]]);
  else if (R === 2) for (let k = 1; k < n; k++) consider([[0, k], [k, n]]);
  else for (let a = 1; a < n - 1; a++) for (let b = a + 1; b < n; b++) consider([[0, a], [a, b], [b, n]]);
  return best && best.s;
}
function placeCars(cars, split, u, W, railYs, padR = 0) {
  split.forEach(([a, b], r) => {
    let x = (W - (rowUnits(cars, a, b) + (cars[b - 1].kind === 'loco' ? padR : 0)) * u) / 2;
    for (let i = a; i < b; i++) {
      const c = cars[i]; c.W = c.w * u; c.H = c.h * u; c.x = x; c.y = railYs[r] - c.H; c.row = r;
      c.el.style.left = x.toFixed(1) + 'px'; c.el.style.top = c.y.toFixed(1) + 'px';
      x += c.W + GAP * u;
    }
  });
}

    const txt = lb.textContent, two = lb.innerHTML.includes('<br>');
    const longest = two ? Math.max(...lb.innerHTML.split('<br>').map(s => s.length)) : txt.length;
    lb.style.fontSize = Math.max(11, Math.min(v.cs * .155, v.cs * 1.55 / Math.max(longest, 1), two ? v.cs * .13 : 99)) + 'px';
  });
  setWorld(sr.top + railYs[0] - .95 * u, u, sr.top + railYs[0]);
  if (G.tagFor != null) placeTag(G.tagFor);
}

/* ---------- motion ---------- */
let chuffAcc = 0, chuffLast = 0;
function chuffBy(dx) {
  chuffAcc += Math.abs(dx);
  const now = performance.now();
  if (chuffAcc > (G ? G.u : 80) * .9 && now - chuffLast > 85) { chuffAcc = 0; chuffLast = now; SND.chuff(); }
}
async function enterTrain(first) {
  const g = G, W = innerWidth, d = W * .62, cam0 = cam;
  g.phase = 'enter'; g.busy = true;
  $('#train').classList.add('moving');
  let lx = -(W + 80), braked = false;
  await tween(first ? 1700 : 1600, (e, p) => {
    if (G !== g) return;
    const x = -(W + 80) * (1 - p) * (1 - p);
    setTrainX(x); chuffBy(x - lx); lx = x;
    cam = cam0 + d * (2 * p - p * p); applyCam();
    if (p > .72 && !braked) { braked = true; SND.brake(); }
  });
  if (G !== g) return;
  $('#train').classList.remove('moving');
  setTrainX(0);
  SND.ding();
  const lc = $('#train .loco'); lc.classList.add('o'); later(() => lc.classList.remove('o'), 500);
  // cards slide in
  $('#dock').classList.remove('hide');
  $$('#cards .ans').forEach((b, i) => { b.style.animationDelay = (i * .07) + 's'; b.classList.add('in'); });
  g.phase = 'play'; g.busy = false; g.idle = 0;
  later(() => readPattern(), 350);
  armIdle();
}
async function departTrain() {
  const g = G, W = innerWidth, d = W * .5, cam0 = cam;
  g.phase = 'depart';
  $('#dock').classList.add('hide');
  $('#train').classList.add('moving');
  let lx = 0;
  await tween(1350, (e, p) => {
    if (G !== g) return;
    const x = (W + 80) * p * p;
    setTrainX(x); chuffBy(x - lx); lx = x;
    cam = cam0 + d * p * p; applyCam();
  });
  if (G !== g) return;
  g.idx++;
  renderMid();
  if (g.idx >= TRAINS) { $('#train').classList.remove('moving'); $('#train').style.visibility = 'hidden'; finish(); return; }
  setupTrain();
  enterTrain(false);
}

/* ---------- reading the pattern ---------- */
function clearHL() { G && G.cars.forEach(c => c.el.classList.remove('hl')); }
function placeTag(i) {
  const c = carOfSlot(i), t = G.tag; if (!c || !t) return;
  const W = $('#stage').clientWidth, hw = t.offsetWidth / 2, want = c.x + c.W / 2;
  const x = Math.max(hw + 6, Math.min(W - hw - 6, want));
  t.style.left = x.toFixed(1) + 'px'; t.style.top = (c.y + c.H * .02).toFixed(1) + 'px';
  t.style.setProperty('--ax', Kit.clamp(want - x, -hw + 14, hw - 14).toFixed(1) + 'px');
}
function showTag(i, text, q) {
  const t = G.tag; G.tagFor = i;
  t.textContent = text; t.classList.remove('hidden', 'pop'); t.classList.toggle('q', !!q); void t.offsetWidth; t.classList.add('pop');
  placeTag(i);
}
function hideTag() { if (G && G.tag) { G.tag.classList.add('hidden'); G.tagFor = null; } }
function stopReading() { if (!G) return; G.readTok++; clearHL(); Kit.stopSpeech(); }
function readPattern(hand) {
  const g = G; if (!g || !g.P || DR) return;
  const tok = ++g.readTok, P = g.P;
  const voice = Kit.hasVoice() && Kit.settings.sound;
  let i = 0;
  const alive = () => G === g && g.readTok === tok && g.phase === 'play' && !DR;
  const step = () => {
    if (!alive()) return;
    clearHL();
    if (i >= P.seq.length) {
      const s = firstEmpty(); if (s < 0) { hideTag(); return; }
      showTag(s, P.q, true); SND.ask();
      if (voice) say(P.q);
      later(() => { if (alive()) { $('.spk') && $('.spk').classList.add('ping'); if (hand) showHand(false); else maybeHand(); } }, 900);
      return;
    }
    const k = i++, c = carOfSlot(k);
    void c.el.offsetWidth; c.el.classList.add('hl');
    if (P.filled[k]) {
      const it = P.seq[k];
      showTag(k, cap(it.name)); SND.note(it.note);
      if (voice) {
        let done = false; const t0 = performance.now(); const nx = () => { if (done) return; done = true; later(step, Math.max(90, 480 - (performance.now() - t0))); };
        say(it.say, { onend: nx }); later(nx, 1800);
      } else later(step, P.seq.length > 6 ? 520 : 600);
    } else { showTag(k, '?', true); SND.ask(); later(step, 650); }
  };
  step();
}

/* ---------- idle help ---------- */
function armIdle() {
  const g = G; if (!g) return;
  clearTimeout(g.idleT);
  g.idleT = later(() => {
    if (g.phase !== 'play' || g.busy || DR) return armIdle();
    g.idle++;
    if (g.idle <= 3) readPattern(true);
    armIdle();
  }, 12000);
}
function maybeHand() { if (G && save.tut < 1 && G.L <= 2 && G.idx === 0) showHand(true); }
function showHand(demo) {
  if (!G || G.phase !== 'play' || G.busy || DR) return;
  hideHand();
  const s = firstEmpty(); if (s < 0) return;
  const slot = $('.slot', carOfSlot(s).el); if (!slot) return;
  const b = slot.getBoundingClientRect(), x1 = b.left + b.width / 2, y1 = b.top + b.height * .55;
  const h = el('div', 'hand emo', '👆'); document.body.appendChild(h); G.hand = h;
  if (demo) {
    // first train ever: show the drag gesture with the right card (a real tutorial)
    const oi = G.P.opts.findIndex(o => o.id === G.P.seq[s].id), card = $(`#cards .ans[data-oi="${oi}"]`);
    const a = card.getBoundingClientRect(), x0 = a.left + a.width / 2, y0 = a.top + a.height * .5;
    h.animate([
      { transform: `translate(${x0}px,${y0}px) scale(1.1)`, opacity: 0 },
      { transform: `translate(${x0}px,${y0}px) scale(.9)`, opacity: 1, offset: .15 },
      { transform: `translate(${x1}px,${y1}px) scale(.9)`, opacity: 1, offset: .7 },
      { transform: `translate(${x1}px,${y1}px) scale(1.1)`, opacity: 0 }], { duration: 1800, iterations: 2, easing: 'ease-in-out' });
  } else {
    // idle hint: point at the empty wagon, without giving the answer away
    h.animate([
      { transform: `translate(${x1}px,${y1 + 60}px) scale(1)`, opacity: 0 },
      { transform: `translate(${x1}px,${y1 + 10}px) scale(1)`, opacity: 1, offset: .25 },
      { transform: `translate(${x1}px,${y1}px) scale(.85)`, opacity: 1, offset: .4 },
      { transform: `translate(${x1}px,${y1 + 10}px) scale(1)`, opacity: 1, offset: .55 },
      { transform: `translate(${x1}px,${y1}px) scale(.85)`, opacity: 1, offset: .7 },
      { transform: `translate(${x1}px,${y1 + 30}px) scale(1)`, opacity: 0 }], { duration: 1700, iterations: 2, easing: 'ease-in-out' });
  }
  later(hideHand, 3600);
}
function hideHand() { if (G && G.hand) { G.hand.remove(); G.hand = null; } }

/* ---------- answering ---------- */
const canAnswer = () => G && G.phase === 'play' && !G.busy && screen === 'play';
function bindCard(card, oi) {
  Kit.drag(card, {
    can: () => canAnswer() && !DR,
    start: () => { DR = { card, oi, moved: false, ghost: null }; card.classList.add('press'); sfx.pick(); hideHand(); G.idle = 0; armIdle(); },
    move: (e, p) => {
      if (!DR || DR.card !== card) return;
      if (!DR.moved && Math.hypot(p.dx, p.dy) > 9) {
        DR.moved = true; stopReading(); hideTag();
        card.classList.remove('press'); card.classList.add('lift');
        DR.ghost = makeGhost(G.P.opts[oi], card);
      }
      if (DR.moved) {
        const g = DR.ghost, w = g._w, lift = e.pointerType === 'touch' ? w * .45 : w * .1;
        ghostAt(g, p.x - w / 2, p.y - w / 2 - lift);
        const s = slotAt(p.x, p.y - lift);
        $$('#train .slot').forEach(sl => sl.classList.toggle('over', s >= 0 && sl.closest('.wg').dataset.i == s));
      }
    },
    end: (e, p) => {
      const d = DR; DR = null; card.classList.remove('press');
      if (!d || !G) { if (d && d.ghost) d.ghost.remove(); return; }
      $$('#train .slot.over').forEach(s => s.classList.remove('over'));
      if (!d.moved) { if (!p.cancel && canAnswer()) { stopReading(); attempt(oi, firstEmpty(), card, null); } return; }
      const lift = e.pointerType === 'touch' ? d.ghost._w * .45 : d.ghost._w * .1;
      const s = slotAt(p.x, p.y - lift);
      if (s >= 0 && !p.cancel && canAnswer()) attempt(oi, s, card, d.ghost);
      else flyBack(d.ghost, card);
    },
  });
}
function makeGhost(it, card) {
  const r = $('.art', card).getBoundingClientRect();
  const g = el('div', 'ghost', `<div class="art">${art(it)}</div>`);
  g._w = r.width; g.style.width = r.width + 'px'; g.style.height = r.height + 'px'; g.style.setProperty('--as', r.width + 'px');
  document.body.appendChild(g); ghostAt(g, r.left, r.top);
  return g;
}
function ghostAt(g, x, y, s = 1) { g._x = x; g._y = y; g._s = s; g.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${s})`; }
function flyGhost(g, r, ms, arc = 40) {
  const s = r.width / g._w, from = `translate3d(${g._x}px,${g._y}px,0) scale(${g._s})`;
  const mx = (g._x + r.left) / 2, my = Math.min(g._y, r.top) - arc;
  const to = `translate3d(${r.left}px,${r.top}px,0) scale(${s})`;
  const a = g.animate([{ transform: from }, { transform: `translate3d(${mx}px,${my}px,0) scale(${(g._s + s) / 2 * 1.08})`, offset: .5 }, { transform: to }], { duration: ms, easing: 'ease-in-out' });
  ghostAt(g, r.left, r.top, s);
  return a.finished.catch(() => { });
}
function flyBack(g, card) {
  const r = $('.art', card).getBoundingClientRect();
  sfx.swap();
  flyGhost(g, r, 320, 20).then(() => { g.remove(); card.classList.remove('lift'); card.classList.remove('wig'); void card.offsetWidth; card.classList.add('wig'); });
}
function slotAt(x, y) {
  if (!G) return -1;
  let best = -1, bd = 1e9;
  for (let i = 0; i < G.P.seq.length; i++) {
    if (G.P.filled[i]) continue;
    const sl = $('.slot', carOfSlot(i).el); if (!sl) continue;
    const r = sl.getBoundingClientRect();
    if (!Kit.inRect(x, y, r, G.u * .42)) continue;
    const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
async function attempt(oi, slot, card, ghost) {
  const g = G; if (!g || slot < 0) return;
  const P = g.P, it = P.opts[oi], car = carOfSlot(slot), sl = $('.slot', car.el);
  g.busy = true; hideHand(); hideTag(); g.idle = 0;
  if (!sl) { if (ghost) flyBack(ghost, card); g.busy = false; return; }
  const dragged = !!ghost;
  if (!ghost) { card.classList.add('lift'); ghost = makeGhost(it, card); }
  const target = sl.getBoundingClientRect();
  await flyGhost(ghost, target, dragged ? 200 : 340, dragged ? 10 : 40);
  if (G !== g) { ghost.remove(); return; }
  const lc = $('#train .loco');
  if (it.id === P.seq[slot].id) {
    ghost.remove(); card.classList.remove('lift');
    P.filled[slot] = true;
    $('.cargo', car.el).innerHTML = `<div class="art">${art(it)}</div>`;
    car.el.classList.remove('land'); void car.el.offsetWidth; car.el.classList.add('land');
    later(() => car.el.classList.remove('land'), 600);
    sfx.drop(); sfx.good(); Kit.vibrate(20); SND.note(it.note);
    const [x, y] = [target.left + target.width / 2, target.top + target.height / 2];
    burst(x, y, { n: 14, colors: ['#ffd23d', '#fff', '#ff9ec7', '#7fd3ff'] }); sparkle(x, y);
    lc.classList.add('o'); later(() => lc.classList.remove('o'), 600);
    if (save.tut < 1) { save.tut = 1; persist(); }
    if (P.filled.every(Boolean)) { completeTrain(); return; }
    Kit.praise(null, { soft: true, sayText: cap(it.say) + '!' });
    g.busy = false;
    later(() => { const s = firstEmpty(); if (s >= 0 && G === g && g.phase === 'play' && !g.busy) showTag(s, '?', true); }, 500);
    armIdle();
  } else {
    g.mistakes++;
    const m = P.miss[slot] = (P.miss[slot] || 0) + 1;
    car.el.classList.remove('no'); void car.el.offsetWidth; car.el.classList.add('no');
    const gt = (dx) => `translate3d(${ghost._x + dx}px,${ghost._y}px,0) scale(${ghost._s})`;
    ghost.animate([{ transform: gt(0) }, { transform: gt(-10) }, { transform: gt(9) }, { transform: gt(-6) }, { transform: gt(0) }], { duration: 420 });
    sfx.bad(); Kit.vibrate(40);
    lc.classList.add('sad'); later(() => lc.classList.remove('sad'), 1100);
    await new Promise(r => setTimeout(r, 430));
    if (G !== g) { ghost.remove(); return; }
    flyBack(ghost, card);
    if (m === 1) Kit.retry();
    else if (m === 2) { Kit.praise('Nghe lại nhé!', { soft: true, speak: false }); later(() => readPattern(), 500); }
    else {
      Kit.retry({ speak: false });
      const right = P.opts.findIndex(o => o.id === P.seq[slot].id);
      const rc = $(`#cards .ans[data-oi="${right}"]`); if (rc) { rc.classList.add('glow'); }
      later(() => readPattern(), 500);
    }
    later(() => { if (G === g) { g.busy = false; const s = firstEmpty(); if (s >= 0 && g.phase === 'play') showTag(s, '?', true); } }, 380);
    armIdle();
  }
}
function completeTrain() {
  const g = G; g.phase = 'done'; g.busy = true; clearTimeout(g.idleT);
  hideTag(); clearHL();
  $$('#cards .ans').forEach(b => b.classList.remove('glow'));
  const wagons = g.cars.filter(c => c.kind === 'wg');
  const step = g.P.seq.length > 6 ? 105 : 125;
  wagons.forEach((c, i) => later(() => { c.el.classList.remove('hop'); void c.el.offsetWidth; c.el.classList.add('hop'); SND.note(g.P.seq[c.i].note); }, 250 + i * step));
  const t1 = 250 + wagons.length * step + 120;
  const lc = $('#train .loco');
  later(() => {
    SND.toot(); bigPuffs(lc, 4); lc.classList.add('o', 'wave');
    Kit.praise(g.idx === TRAINS - 1 ? 'Về ga rồi!' : null);
    $$('#train .pas').forEach(p => { const r = p.getBoundingClientRect(); sparkle(r.left + r.width / 2, r.top + r.height / 2, { n: 4 }); });
  }, t1);
  later(() => { lc.classList.remove('o'); departTrain(); }, t1 + 1200);
}

/* ---------- finish station ---------- */
function finish() {
  const g = G; g.phase = 'over';
  const L = g.L, stars = g.mistakes <= 2 ? 3 : g.mistakes <= 5 ? 2 : 1;
  save.stars[L] = Math.max(save.stars[L] || 0, stars);
  const unlockedNew = false; // all stations are open from the start
  save.cleared = Math.max(save.cleared, L);
  const got = [];
  if (!save.pass.includes('c' + L)) got.push('c' + L);
  if (stars === 3 && !save.pass.includes('s' + L)) got.push('s' + L);
  got.forEach(id => save.pass.push(id));
  if (got.length) save.newest = got[got.length - 1];
  persist(); refreshPassBadge();
  const gp = got.map(passById);
  const reward = gp.length ? { emoji: gp.map(p => p[1]).join(''), label: 'Hành khách mới: ' + gp.map(p => p[2]).join(', ') + '!' } : null;
  const title = stars === 3 ? 'Tuyệt vời!' : stars === 2 ? 'Giỏi quá!' : 'Hoàn thành!';
  const hasNext = L < NST;
  const top = `<div class="res-top">${locoSVG()}${gp.length ? `<span class="emo">${gp[0][1]}</span>` : ''}</div>`;
  Kit.result({
    top, title, stars, reward,
    text: unlockedNew ? 'Đã mở ga ' + (L + 1) + '!' : L === NST ? 'Bé đã đi hết ' + NST + ' ga tàu! 🎉' : 'Bé đã đưa ' + TRAINS + ' đoàn tàu về ga!',
    say: title + (gp.length ? ' Bé có hành khách mới: ' + gp.map(p => p[2]).join(' và ') + '!' : ''),
    buttons: [
      { label: 'Chơi lại', icon: 'replay', cls: 'white', onClick: () => startStation(L) },
      hasNext ? { label: 'Ga tiếp', icon: 'next', cls: 'ok', onClick: () => startStation(L + 1) }
        : { label: 'Bản đồ', icon: 'next', cls: 'ok', onClick: () => { endGame(); renderMap(); show('map'); } },
    ],
  });
  if (unlockedNew) setTimeout(() => sfx.unlock(), 1500);
}

/* ---------- passengers ---------- */
function openPassengers() {
  const have = new Set(save.pass);
  const m = Kit.overlay('', { closable: true, cls: 'paspanel' });
  const cell = p => {
    const ok = have.has(p[0]), L = +p[0].slice(1), star = p[0][0] === 's';
    return `<button class="pas-b${ok ? '' : ' no'}" data-id="${p[0]}"><small>${star ? '★' : ''}Ga ${L}</small><span class="emo">${p[1]}</span><span class="n">${ok ? p[2] : '???'}</span></button>`;
  };
  const box = el('div');
  box.innerHTML = `<h2>Hành khách</h2><div class="pcount">🐾 ${save.pass.length} / ${PASS.length}</div>
    <div class="psec">${icon('check')}<span>Về đến ga</span></div><div class="pgrid">${PASS.slice(0, 10).map(cell).join('')}</div>
    <div class="psec">${icon('star')}<span>Ba sao</span></div><div class="pgrid">${PASS.slice(10).map(cell).join('')}</div>
    ${save.pass.length === 0 ? '<p>Hoàn thành một ga để đón hành khách nhé!</p>' : ''}`;
  m.panel.insertBefore(box, m.panel.firstChild);
  $$('.pas-b', box).forEach(b => b.onclick = () => {
    const p = passById(b.dataset.id);
    if (b.classList.contains('no')) { sfx.bad(); say('Bé chưa đón bạn này!'); b.classList.remove('wig'); void b.offsetWidth; b.classList.add('wig'); return; }
    sfx.pop(); say(p[2]); b.classList.remove('wig'); void b.offsetWidth; b.classList.add('wig');
    const r = b.getBoundingClientRect(); sparkle(r.left + r.width / 2, r.top + r.height / 2);
  });
  say('Các bạn hành khách của bé!');
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (screen === 'play' && G) {
    if (/^[1-4]$/.test(e.key)) { const b = $$('#cards .ans')[+e.key - 1]; if (b && canAnswer()) { stopReading(); attempt(+b.dataset.oi, firstEmpty(), b, null); } }
    else if (e.key === ' ' || e.key === 'r') { e.preventDefault(); if (canAnswer()) readPattern(); }
  }
  if (e.key === 'Escape' && !$('.k-ov') && screen !== 'title') $('#bBack').click();
});

/* ---------- resize ---------- */
let rzT = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(rzT);
  rzT = requestAnimationFrame(() => {
    if (DR) { DR.card.classList.remove('press'); if (DR.ghost) flyBack(DR.ghost, DR.card); DR = null; $$('#train .slot.over').forEach(s => s.classList.remove('over')); }
    if (screen === 'title') layoutTitle();
    else if (screen === 'map') layoutMap();
    else if (screen === 'play') layoutPlay();
  });
});

/* ---------- init ---------- */
buildTitleTrain();
cruise(true);
refreshPassBadge();
Kit.music.start('sunny');
window.__train = { get G() { return G; }, save, startStation, show, makePuzzles };
})();
