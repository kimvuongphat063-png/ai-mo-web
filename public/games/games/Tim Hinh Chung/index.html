<!DOCTYPE html>
<html lang="vi" data-game="hinhchung">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12b3a3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tìm Hình Chung</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Kit Bé Vui 4 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','EmojiOne Color',sans-serif;
  --ink:#3a2e5c; --ink2:#6e6492;
  --c1:#6f5cff; --c1d:#4c3bd6; --c1l:#ebe7ff;
  --c2:#ff6f9f; --c2d:#d94a7c;
  --ok:#35c46a; --okd:#1f9c4f;
  --gold:#ffc83d; --goldd:#de9800;
  --warn:#ff9a52; --warnd:#e06d22;
  --bg1:#bfe3ff; --bg2:#ffe1f0;
  --sh:40,24,90;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:78px;
  --ib:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-noselect{pointer-events:none}

/* ---------- top bar ---------- */
.k-bar{position:absolute;z-index:50;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 10px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-r{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.ibtn{position:relative;width:var(--ib);height:var(--ib);flex:0 0 auto;border:none;border-radius:19px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(var(--sh),.17),0 10px 18px rgba(var(--sh),.10);
  transition:transform .12s ease,box-shadow .12s ease,background .2s,color .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(var(--sh),.17),0 4px 8px rgba(var(--sh),.08)}
.ibtn svg{width:58%;height:58%}
.ibtn.off{color:#b6aecb;background:#f4f1fa}
.ibtn.on{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(var(--sh),.12)}
.ibtn .badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}
.k-bar .k-back{color:var(--c1d)}
@media (max-width:520px),(max-height:520px){
  :root{--ib:48px;--bar-h:66px}
  .ibtn{border-radius:16px}
  .k-bar{gap:7px;padding-top:calc(8px + var(--safe-t));padding-bottom:8px;padding-left:calc(9px + var(--safe-l));padding-right:calc(9px + var(--safe-r))}
  .k-bar .k-r{gap:7px}
}
@media (max-width:359px){ :root{--ib:44px} .k-bar .k-r{gap:5px} }

/* pill for mid-bar info */
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 14px 5px 6px;min-height:44px;
  font-weight:800;font-size:clamp(17px,2.6vmin,22px);color:var(--ink);box-shadow:0 5px 0 rgba(var(--sh),.14);white-space:nowrap;max-width:100%;overflow:hidden}
.k-pill .emo{font-size:26px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--c1l)}
.k-pill svg{width:28px;height:28px;flex:0 0 auto}
.k-dots{display:flex;gap:5px;align-items:center}
.k-dots i{width:12px;height:12px;border-radius:50%;background:#e6e0f3;transition:background .3s,transform .3s}
.k-dots i.on{background:var(--gold);transform:scale(1.15);box-shadow:0 2px 0 var(--goldd)}
.k-dots i.cur{background:var(--c1);transform:scale(1.25)}
@media (max-width:420px){ .k-dots i{width:9px;height:9px} .k-dots{gap:3px} .k-pill{padding:4px 10px 4px 5px;font-size:16px} }

/* ---------- buttons ---------- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.42em;
  font:800 clamp(20px,3.5vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:56px;
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(var(--sh),.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.26);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(var(--sh),.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.2em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.7vmin,22px);min-height:50px}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.orange{--b:var(--warn);--bd:var(--warnd)}
.btn.white{--b:#fff;--bd:#d9d2ee;color:var(--c1d);text-shadow:none}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.round{width:1.9em;height:1.9em;padding:0;border-radius:50%}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.k-play{touch-action:none}
.k-below{position:absolute;left:0;right:0;bottom:0;top:var(--bar-h)}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(46px,10.5vmin,108px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .32em rgba(var(--sh),.28)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.7vmin,23px);color:var(--ink2);margin:.25em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,3.8vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1;
  text-shadow:0 .08em 0 var(--c1d)}

/* level cards (generic) */
.k-grid{display:grid;gap:14px;width:min(1000px,100%);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.k-card{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:14px 10px 12px;box-shadow:0 7px 0 rgba(var(--sh),.16),0 14px 24px rgba(var(--sh),.08);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s;font-weight:800;color:var(--ink);font-size:clamp(16px,2.5vmin,20px);line-height:1.1;text-align:center;min-height:56px}
.k-card:active,.k-card.press{transform:translateY(4px) scale(.98)}
.k-card .emo{font-size:clamp(36px,6.5vmin,54px)}
.k-card small{font-weight:700;color:var(--ink2);font-size:.82em}
.k-card .k-num{position:absolute;top:-10px;left:-6px;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--c2);color:#fff;font:800 19px/34px var(--font);box-shadow:0 3px 0 var(--c2d)}
.k-ministars{display:flex;gap:2px;justify-content:center}
.k-ministars svg{width:clamp(18px,3vmin,24px);height:auto;color:#e7e1f4}
.k-ministars svg.on{color:var(--gold);filter:drop-shadow(0 1px 0 var(--goldd))}

/* ---------- overlay / modal ---------- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:calc(12px + var(--safe-t)) 14px calc(12px + var(--safe-b));touch-action:none}
.k-ov.out{animation:k-fadeout .2s ease forwards}
.k-panel{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:34px;padding:24px 20px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(var(--sh),.14),0 30px 60px rgba(var(--sh),.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain;touch-action:pan-y}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink2);line-height:1.3}
.k-close{position:absolute!important;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-result{overflow:visible;padding-top:20px}
.k-result .k-mascot{width:clamp(96px,20vmin,140px);height:auto;margin:-70px auto 0;display:block;filter:drop-shadow(0 6px 0 rgba(var(--sh),.12))}
.k-result .k-mascot svg{width:100%;height:auto;display:block}
.k-stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:8px 0 2px}
.k-stars svg{width:clamp(56px,11vmin,86px);height:auto;transform:scale(0);color:#e9e4f5;filter:drop-shadow(0 4px 0 rgba(150,110,20,.18))}
.k-stars svg.mid{width:clamp(66px,13vmin,100px)}
.k-stars svg.show{animation:k-star .55s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.on{color:var(--gold)}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#94600a;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both;text-align:left}
.k-reward .emo,.k-reward .k-rw{font-size:46px;width:56px;height:56px;display:grid;place-items:center;animation:k-wiggle 1.2s 1.4s ease-in-out infinite;flex:0 0 auto}
.k-reward .k-rw svg{width:100%;height:100%}
@media (max-height:520px){
  .k-result .k-mascot{width:84px;margin-top:-46px}
  .k-stars svg{width:52px}.k-stars svg.mid{width:62px}
  .k-panel{padding:14px 16px 16px;border-radius:26px}
  .k-panel h2{font-size:30px}
  .k-btns{margin-top:12px}
  .k-reward{margin-top:8px;padding:6px 14px 6px 8px}.k-reward .emo,.k-reward .k-rw{font-size:34px;width:42px;height:42px}
}

/* ---------- praise / toast ---------- */
.k-praise{position:fixed;z-index:85;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,86px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-float{position:fixed;z-index:85;pointer-events:none;font-weight:800;font-size:clamp(24px,4.5vmin,40px);color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;
  transform:translate(-50%,-50%);animation:k-floatup 1s ease-out forwards;white-space:nowrap}
.k-toast{position:fixed;z-index:86;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(var(--sh),.12),0 12px 24px rgba(var(--sh),.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}

/* ---------- fx canvas ---------- */
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---------- decorative background ---------- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.32);animation:k-float 9s ease-in-out infinite}

/* ---------- mascot helpers ---------- */
.k-blink{transform-box:fill-box;transform-origin:center;animation:k-blink 4.4s infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3.2s ease-in-out infinite}
.k-pupil{transition:transform .14s ease-out}
.k-talk{animation:k-talk .32s ease-in-out infinite}

/* ---------- animations ---------- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-fadeout{to{opacity:0}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-50deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}50%{transform:scale(.9,1.1)}70%{transform:scale(1.05,.96)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-floatup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-70%) scale(1.1);opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-anim-shake{animation:k-shake .45s ease-in-out}
.k-anim-jelly{animation:k-jelly .5s ease-in-out}
.k-anim-wiggle{animation:k-wiggle .5s ease-in-out}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
:root{--c1:#12b3a3;--c1d:#0a8276;--c1l:#d6f5f0;--c2:#ffad1f;--c2d:#e08500;--ink:#1f4756;--ink2:#4d7482;--sh:8,72,82;
  --sun:#ffd23d;--p1:#ff8a3d;--p1d:#e0651a;--p1l:#fff1e4;--p2:#7b68ff;--p2d:#5644dc;--p2l:#efecff}
body{background:linear-gradient(170deg,#84e2d6 0%,#c6f3ec 44%,#fff3c6 100%)}
body::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle,rgba(255,255,255,.85) 0 2.4px,transparent 3px);background-size:34px 34px}
.k-logo{--c1d:#0a7c70}
.k-logo .l2{color:var(--sun);font-size:1.08em}
.k-h{--c1d:#0a7c70}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--c2);color:#fff;font:800 16px/28px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.btn.violet{--b:var(--p2);--bd:var(--p2d)}

/* ---------- title ---------- */
#title{padding:calc(var(--bar-h) + 4px) 16px calc(18px + var(--safe-b))}
.t-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(2px,1.2vmin,12px)}
.t-dog{width:clamp(160px,min(52vw,27vh),300px);cursor:pointer}
.t-dog svg{width:100%;height:auto;display:block}
.t-txt{display:flex;flex-direction:column;align-items:center}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(10px,2.4vmin,22px)}
.t-btns .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  .t-wrap{flex-direction:row;gap:5vw}
  .t-dog{width:min(40vmin,30vw)}
  .t-btns{gap:12px;margin-top:8px}
  .k-sub{display:none}
}
.floaty{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaty .fc{position:absolute;border-radius:50%;background:rgba(255,255,255,.66);box-shadow:0 0 0 .5vmin rgba(255,255,255,.5),0 .9vmin 0 rgba(var(--sh),.06);animation:fdrift 12s ease-in-out infinite}
.floaty .fc span{position:absolute;font-family:var(--emoji);line-height:1;opacity:.75}
@keyframes fdrift{0%,100%{transform:translateY(0) rotate(var(--r0,0deg))}50%{transform:translateY(-24px) rotate(var(--r1,0deg))}}

/* ---------- mascot: detective puppy ---------- */
.dog .dtail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.3s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
.dog .dhead{transform-box:fill-box;transform-origin:50% 88%;animation:tilt 6s ease-in-out infinite}
@keyframes tilt{0%,42%,100%{transform:rotate(0)}52%,82%{transform:rotate(-5deg)}}
.dog .dear{transform-box:fill-box;transform-origin:50% 6%;animation:ear 6s ease-in-out infinite}
.dog .dear.dr{animation-delay:-.4s}
@keyframes ear{0%,40%,100%{transform:rotate(0)}48%{transform:rotate(6deg)}56%{transform:rotate(-3deg)}}
.dog .dhappy{opacity:0}
.dog .deyes,.dog .dhappy{transition:opacity .15s}
.dog .dmag{transform-box:fill-box;transform-origin:85% 90%;transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.dog.happy .deyes{opacity:0}.dog.happy .dhappy{opacity:1}
.dog.happy .dmag{transform:translate(14px,-24px) rotate(24deg)}
.dog.happy .dhop{animation:dhop .55s cubic-bezier(.3,1.6,.5,1) 2}
.dog.happy .dtail{animation-duration:.28s}
@keyframes dhop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.dog.think .dhead{animation:think .8s ease-in-out}
@keyframes think{0%,100%{transform:rotate(0)}30%{transform:rotate(10deg)}65%{transform:rotate(-6deg)}}
.dog .dmouth{transform-box:fill-box;transform-origin:50% 0}
.dog.talk .dmouth{animation:k-talk .3s ease-in-out infinite}

/* ---------- select ---------- */
#select{justify-content:flex-start}
.sel{position:absolute;left:0;right:0;bottom:0;top:var(--bar-h);padding:4px 16px calc(18px + var(--safe-b))}
.sel-in{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vmin,20px);width:100%}
.sel-top{display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:center;align-items:center;width:min(980px,100%)}
.seg{display:inline-flex;background:rgba(255,255,255,.55);border-radius:999px;padding:5px;gap:4px;box-shadow:inset 0 2px 0 rgba(var(--sh),.08)}
.seg button{border:none;background:transparent;border-radius:999px;font:800 clamp(17px,2.8vmin,22px)/1 var(--font);color:var(--ink2);padding:8px 16px 9px;min-height:52px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg button svg{width:26px;height:26px;flex:0 0 auto}
.seg button.on{background:#fff;color:var(--c1d);box-shadow:0 4px 0 rgba(var(--sh),.14)}
.seg button.on[data-m="duo"]{color:var(--p2d)}
.themes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.th{border:none;cursor:pointer;background:#fff;border-radius:22px;padding:6px 14px 6px 7px;display:inline-flex;align-items:center;gap:7px;font:800 clamp(15px,2.4vmin,19px)/1.05 var(--font);color:var(--ink);min-height:54px;
  box-shadow:0 5px 0 rgba(var(--sh),.12);transition:transform .15s,box-shadow .2s}
.th .ti{font-family:var(--emoji);font-weight:400;font-size:27px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--c1l);position:relative;flex:0 0 auto}
.th .ti.mix i{position:absolute;font-style:normal;font-size:16px;line-height:1}
.th.on{box-shadow:0 0 0 4px var(--c1),0 5px 0 4px var(--c1d);transform:translateY(-2px)}
.lv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px;width:min(940px,100%)}
.lv{--lc:#2fc28a;--lcd:#1e9a6a;padding:16px 10px 12px;gap:8px;justify-content:center}
.lv .k-num{background:var(--lc);box-shadow:0 3px 0 var(--lcd)}
.card.minic{position:relative;left:auto;top:auto;--D:clamp(96px,19vmin,168px);width:var(--D);height:var(--D);flex:0 0 auto;margin:calc(var(--D)*.05)}
.lv .lvt{display:flex;flex-direction:column;align-items:center;gap:4px}
.lv .nm{font-size:clamp(20px,3.2vmin,27px);line-height:1}
.lv .df{font-size:.78em;font-weight:800;color:#fff;background:var(--lc);border-radius:999px;padding:2px 12px 4px;box-shadow:0 3px 0 var(--lcd);line-height:1.1}
.lv .rw{display:flex;align-items:center;gap:6px;min-height:26px}
.lv .bz{font-family:var(--emoji);font-size:20px;line-height:1}
.lv .go{display:none}
@media (max-aspect-ratio:4/5){
  .lv-grid{grid-template-columns:1fr;width:min(460px,100%);gap:14px}
  .lv{flex-direction:row;justify-content:flex-start;gap:14px;padding:10px 16px}
  .card.minic{--D:clamp(84px,23vw,124px)}
  .lv .lvt{align-items:flex-start}
  .lv .go{display:grid;place-items:center;margin-left:auto;flex:0 0 auto;width:54px;height:54px;border-radius:50%;background:var(--lc);color:#fff;box-shadow:0 4px 0 var(--lcd)}
  .lv .go svg{width:52%;height:52%;margin-left:8%}
}
@media (max-height:520px){
  .sel .k-h{display:none}
  .sel-in{gap:12px}
  .card.minic{--D:clamp(78px,25vh,118px)}
  .lv{padding:12px 8px 8px;gap:4px}
  .th{min-height:50px;padding:4px 12px 4px 5px}
  .seg button{min-height:48px}
}

/* ---------- play ---------- */
.pa{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;overflow:hidden}
.card{position:absolute;left:0;top:0;border-radius:50%;--rim:#a8ece2;--D:300px;
  background:radial-gradient(circle at 50% 36%,#fff 0 60%,#f1faf8 100%);
  box-shadow:0 0 0 calc(var(--D)*.016) #fff,0 0 0 calc(var(--D)*.034) var(--rim),0 calc(var(--D)*.034) 0 calc(var(--D)*.034) rgba(var(--sh),.13),0 calc(var(--D)*.05) calc(var(--D)*.09) rgba(var(--sh),.14);
  transform-origin:50% 50%;transition:opacity .2s;will-change:transform}
.card::before{content:"";position:absolute;inset:2.6%;border-radius:50%;border:calc(var(--D)*.006 + 1px) dashed rgba(18,179,163,.16);pointer-events:none}
.card.pile{--rim:#94e4d8}
.card.mine{--rim:#ffd469}
.card.centre{--rim:#94e4d8}
.card.p1{--rim:#ffb07a}
.card.p2{--rim:#b5a9ff}
.card.cool{opacity:.62}
.card.land{animation:cland .35s ease-out}
@keyframes cland{0%{scale:1.05 .95}60%{scale:.98 1.02}100%{scale:1}}
.sym{position:absolute;pointer-events:none}
.sym .sr{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(var(--rot,0deg))}
.g{display:block;font-family:var(--emoji);font-style:normal;font-weight:400;font-size:calc(var(--D) * var(--fs));line-height:1}
.g.gs svg{display:block;width:calc(var(--D) * var(--fs) * 1.12);height:calc(var(--D) * var(--fs) * 1.12)}
.sym::before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(255,248,180,.98) 0 40%,rgba(255,210,61,.55) 58%,rgba(255,210,61,0) 71%);opacity:0;transform:scale(.5);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.sym.found::before{opacity:1;transform:scale(1.2)}
.sym.found .sr{animation:lift .42s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes lift{to{transform:rotate(var(--rot,0deg)) scale(1.28)}}
.sym.wig .g{animation:wig .55s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0) scale(1)}18%{transform:rotate(-17deg) scale(.9)}38%{transform:rotate(14deg) scale(.95)}58%{transform:rotate(-9deg)}80%{transform:rotate(5deg)}}
.sym.wig::before{background:radial-gradient(circle,rgba(255,160,160,.55) 0 45%,rgba(255,160,160,0) 70%);animation:wbad .55s ease-out}
@keyframes wbad{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.sym.hint::before{animation:hglow 1.15s ease-in-out infinite}
.sym.hint .g{animation:hbob 1.15s ease-in-out infinite}
@keyframes hglow{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:.95;transform:scale(1.16)}}
@keyframes hbob{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

.mini-dog{position:absolute;pointer-events:none;z-index:5;filter:drop-shadow(0 4px 0 rgba(var(--sh),.12))}
.mini-dog svg{width:100%;height:auto;display:block}
.hintb{position:absolute!important;z-index:6;background:var(--sun)!important;color:#7a4b00!important;box-shadow:0 5px 0 var(--c2d),0 9px 16px rgba(var(--sh),.2)!important}
.hintb.glow{animation:k-pulse 1.2s ease-in-out infinite}
.pd{padding:5px 14px!important;gap:0!important}
.pd .k-dots i{width:13px;height:13px}
@media (max-width:420px){.pd{padding:4px 9px!important}.pd .k-dots i{width:10px;height:10px}}

/* fly layer (symbols flying together, hand demo) */
.fly{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.fsym{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.fsym .g{position:absolute;left:0;top:0;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 0 rgba(0,0,0,.14))}
.fsym .halo{position:absolute;left:0;top:0;width:calc(var(--D)*var(--fs)*2.1);height:calc(var(--D)*var(--fs)*2.1);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,250,190,.98) 0 36%,rgba(255,210,61,.5) 56%,rgba(255,210,61,0) 70%)}
.hand{position:absolute;left:0;top:0;width:68px;height:80px;z-index:2;filter:drop-shadow(0 6px 6px rgba(0,0,0,.22));will-change:transform}
.hand svg{width:100%;height:100%;display:block}
.rip{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 3px rgba(18,179,163,.5);animation:rip .6s ease-out forwards}
@keyframes rip{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.3);opacity:0}}

/* ---------- 2 players ---------- */
.strip{position:absolute;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none;border-radius:24px;padding:6px 8px;
  background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 3px rgba(255,255,255,.75)}
.strip.vert{flex-direction:column;gap:6px}
.strip.s2{transform:rotate(180deg)}
.s1{--pc:var(--p1);--pcd:var(--p1d);--pl:var(--p1l)} .s2{--pc:var(--p2);--pcd:var(--p2d);--pl:var(--p2l)}
.strip .av{flex:0 0 auto;width:var(--av,48px);height:var(--av,48px);border-radius:50%;background:var(--pl);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pc);display:grid;place-items:center;overflow:hidden}
.strip .av svg{width:100%;height:100%;display:block}
.strip .nmz{font-weight:800;color:#fff;background:var(--pc);border-radius:999px;padding:1px 12px 3px;font-size:var(--nf,17px);box-shadow:0 3px 0 var(--pcd);white-space:nowrap;line-height:1.2}
.strip .sts{display:grid;grid-template-columns:repeat(var(--cols,5),var(--ss,20px));grid-auto-rows:var(--ss,20px);gap:3px;justify-content:center;align-content:center;min-height:calc(var(--ss,20px)*2 + 3px)}
.strip .sts i{display:block;width:var(--ss,20px);height:var(--ss,20px);color:rgba(var(--sh),.13)}
.strip .sts i.got{color:#ffc83d;filter:drop-shadow(0 2px 0 #de9800);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1)}
.strip .sts i svg{width:100%;height:100%;display:block}
.strip.win{animation:swin .7s ease-out}
@keyframes swin{0%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),0 0 0 0 rgba(255,210,61,.9)}100%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),0 0 0 22px rgba(255,210,61,0)}}
.dban{position:absolute;z-index:8;pointer-events:none;background:#fff;color:var(--ink);font-weight:800;font-size:clamp(16px,2.8vmin,22px);padding:8px 16px 10px;border-radius:20px;
  box-shadow:0 5px 0 rgba(var(--sh),.14),0 10px 20px rgba(var(--sh),.14);white-space:nowrap;display:flex;align-items:center;gap:8px;animation:dban 2.9s ease forwards}
.dban .emo{font-size:1.4em}
.dban.b2{--rr:180deg}
@keyframes dban{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rr,0deg)) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rr,0deg)) scale(1.06)}20%,85%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rr,0deg)) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rr,0deg)) scale(.9)}}

/* 2-player end panel */
.k-panel.duoend{width:min(600px,100%);height:min(100%,780px);display:flex;flex-direction:column;gap:12px;padding:14px;overflow:hidden}
.de-h{flex:1 1 0;min-height:0;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3.5vmin,28px);padding:10px 14px}
.de-h.p1{--pc:var(--p1);--pcd:var(--p1d);background:linear-gradient(160deg,#fff6ee,#ffe2c9)}
.de-h.p2{--pc:var(--p2);--pcd:var(--p2d);background:linear-gradient(160deg,#f4f2ff,#dfd8ff);transform:rotate(180deg)}
.de-av{position:relative;width:clamp(74px,min(30vw,15vh),150px);aspect-ratio:1;flex:0 0 auto;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pc)}
.de-av>svg{width:100%;height:100%;display:block;border-radius:50%}
.de-av .crown{position:absolute;left:50%;top:-40%;width:64%;transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(0 4px 0 rgba(150,90,0,.25));animation:crownIn .8s .35s cubic-bezier(.2,1.6,.4,1) both}
.de-av .crown svg{width:100%;height:auto;display:block}
@keyframes crownIn{0%{transform:translate(-50%,-60%) rotate(-30deg) scale(0)}100%{transform:translateX(-50%) rotate(-8deg) scale(1)}}
.de-t{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.de-t b{font-size:clamp(28px,min(9vw,5.4vh),50px);line-height:1;color:var(--pcd)}
.de-t .nmz{font-weight:800;color:#fff;background:var(--pc);border-radius:999px;padding:1px 12px 3px;font-size:clamp(16px,2.8vmin,21px);box-shadow:0 3px 0 var(--pcd)}
.de-n{display:flex;align-items:center;gap:6px;font-weight:800;font-size:clamp(26px,5vmin,40px);line-height:1;color:#b07400}
.de-n svg{width:1.1em;height:1.1em;color:var(--gold);filter:drop-shadow(0 2px 0 #de9800)}
.de-mid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;flex:0 0 auto}
@media (max-height:520px){ .k-panel.duoend{padding:8px;gap:6px} .de-h{padding:4px 10px} .de-mid .btn{min-height:50px;font-size:19px;padding:.4em 1em} .de-av{width:68px} }

/* ---------- result extras ---------- */
.bolt{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:6px 16px 8px;border-radius:999px;background:linear-gradient(90deg,#fff3a6,#ffe066);color:#7a4b00;font-weight:800;font-size:clamp(17px,3vmin,22px);box-shadow:0 4px 0 #f0c43a;animation:k-pop .5s 1.2s cubic-bezier(.2,1.6,.4,1) both}
.bolt .emo{font-size:1.3em;animation:k-wiggle 1s 1.6s ease-in-out infinite}
.k-reward .k-rw .g{--D:56px;--fs:.78}
@media (max-height:520px){.k-result>p{display:none}.k-result{margin-top:40px}.bolt{margin-top:6px}}

/* ---------- album ---------- */
.alb h2{margin-bottom:2px}
.acount{font-weight:800;color:var(--c1d);font-size:22px}
.abadges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 2px}
.abadges>span{background:#f2fbf9;border-radius:999px;padding:4px 12px 6px;font-weight:800;color:var(--ink);font-size:16px;box-shadow:0 3px 0 #dceee9}
.abadges .emo{font-size:1.15em;margin-right:4px}
.agh{margin:16px 0 0;font-size:20px;color:var(--ink);display:flex;justify-content:center;align-items:baseline;gap:8px}
.agh small{color:var(--ink2);font-size:15px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:8px}
.stk{border:none;background:#f3fbf9;border-radius:18px;padding:6px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 0 #dcefea;font-family:var(--font);min-height:60px}
.stk .ic{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #e6f4f1;--D:46px;--fs:.7}
.stk .lb{font-weight:800;font-size:12px;line-height:1.1;min-height:2.2em;display:flex;align-items:center;text-align:center;color:var(--ink)}
.stk.no .ic .g{filter:brightness(0) opacity(.12)}
.stk.no .lb{color:#b9cbd0}
</style>
</head>

  <div class="pa k-play" id="da"></div>
</section>

<div class="fly" id="fly"></div>

<script>
/* ===== Kit Bé Vui 4 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';
  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const center = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, r }; };
  const seeded = seed => { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; };
  const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const util = { rand, randInt, pick, shuffle, clamp, lerp, wait, $, $$, el, center, seeded, hash };

  /* ---------- storage (works when blocked) ---------- */
  const mem = {};
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); if (v != null) return JSON.parse(v); } catch (e) { if ((ns + k) in mem) return mem[ns + k]; } return (ns + k) in mem ? mem[ns + k] : d; },
    set(k, v) { mem[ns + k] = v; try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { delete mem[ns + k]; try { localStorage.removeItem(ns + k); } catch (e) { } }
  });
  const shared = mkStore('bevui.');
  let store = mkStore('bevui.game.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', { sound: settings.sound, music: settings.music });

  /* ---------- audio core ---------- */
  const MUSIC_VOL = 0.2;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return null; } }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.85;
      sfxBus = ctx.createGain(); sfxBus.gain.value = settings.sound ? 1 : 0;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && unlocked && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    if (unlocked) { if (ctx && ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { }); return; }
    unlocked = true;
    const c = audio(); if (!c) return;

/* =========================================================
   5. CARD LAYOUT — non-overlapping discs inside the circle (random + relaxation),
   varied sizes and random rotation like the real game.
   ========================================================= */
function packCard(k) {
  const P = PACK[k], M = .04;
  let dens = P.dens;
  for (let attempt = 0; attempt < 40; attempt++) {
    const f = Array.from({ length: k }, () => rand(P.lo, P.hi));
    const m2 = f.reduce((s, v) => s + v * v, 0) / k;
    const base = Math.sqrt(dens / (k * m2));
    const r = f.map(v => v * base).sort((a, b) => b - a);
    const p = r.map(ri => { const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * (1 - ri); return { x: Math.cos(a) * d, y: Math.sin(a) * d }; });
    for (let it = 0; it < 500; it++) {
      let moved = 0;
      for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) {
        const dx = p[j].x - p[i].x, dy = p[j].y - p[i].y, d = Math.hypot(dx, dy) || 1e-6, need = r[i] + r[j] + M;
        if (d < need) { const push = (need - d) / 2 + 1e-4, ux = dx / d, uy = dy / d; p[i].x -= ux * push; p[i].y -= uy * push; p[j].x += ux * push; p[j].y += uy * push; moved++; }
      }
      for (let i = 0; i < k; i++) { const d = Math.hypot(p[i].x, p[i].y), lim = 1 - r[i]; if (d > lim) { p[i].x *= lim / d; p[i].y *= lim / d; moved++; } }
      if (!moved) break;
    }
    let ok = true;
    for (let i = 0; i < k && ok; i++) { if (Math.hypot(p[i].x, p[i].y) + r[i] > 1.0001) ok = false; for (let j = i + 1; j < k; j++) if (Math.hypot(p[j].x - p[i].x, p[j].y - p[i].y) < r[i] + r[j] + M * .8) { ok = false; break; } }
    if (ok) return p.map((q, i) => ({ x: q.x, y: q.y, r: r[i] }));
    if (attempt % 6 === 5) dens *= .95;
  }
  // fallback: a ring (always valid)
  const rr = k === 4 ? .38 : k === 6 ? .3 : .26, out = [{ x: 0, y: 0, r: rr }];
  for (let i = 1; i < k; i++) { const a = i / (k - 1) * Math.PI * 2; out.push({ x: Math.cos(a) * (1 - rr), y: Math.sin(a) * (1 - rr), r: rr * .92 }); }
  return out;
}
function makeCard(ids, map, k) {
  const lay = packCard(k), maxRot = PACK[k].rot, order = shuffle(ids.slice());
  return { ids: ids.slice(), base: 0, syms: order.map((s, i) => ({ s, pic: map.get(s), x: lay[i].x, y: lay[i].y, r: lay[i].r, rot: rand(-maxRot, maxRot) })) };
}

/* choose K cards of the plane: few distinct symbols (so a theme with ~50 pictures is enough even for order 7),
   and (solo) no three consecutive cards through one point → the answer never repeats twice in a row */
function greedySeq(n, K, noRepeat) {
  const cards = PLANES[n], N = cards.length, seq = [randInt(0, N - 1)], cover = new Set(cards[seq[0]]);
  while (seq.length < K) {
    const cand = [];
    for (let i = 0; i < N; i++) {
      if (seq.includes(i)) continue;
      if (noRepeat && seq.length >= 2) { const p = common(cards[seq[seq.length - 2]], cards[seq[seq.length - 1]]); if (cards[i].includes(p)) continue; }
      cand.push({ i, w: cards[i].filter(s => !cover.has(s)).length + Math.random() * 1.6 });
    }
    if (!cand.length) return null;
    cand.sort((a, b) => a.w - b.w);
    const c = cand[Math.floor(Math.random() * Math.min(2, cand.length))].i;
    seq.push(c); cards[c].forEach(s => cover.add(s));
  }
  return seq;
}
function buildDeck(theme, n, K, noRepeat) {
  const pool = themePool(theme), k = n + 1;
  let best = null;
  for (let t = 0; t < 50; t++) {
    const seq = greedySeq(n, K, noRepeat && t < 40); if (!seq) continue;
    const Us = new Set(); seq.forEach(i => PLANES[n][i].forEach(s => Us.add(s)));
    if (!best || Us.size < best.U.size) best = { seq, U: Us };
    if (t >= 4 && best.U.size <= pool.length) break;
  }
  const Ul = [...best.U];
  let pics = shuffle(pool).slice(0, Ul.length);
  const fallback = pics.length < Ul.length;
  if (fallback) pics = pics.concat(shuffle(PICS.filter(p => !p.noMix && !pics.includes(p))).slice(0, Ul.length - pics.length));
  const map = new Map(Ul.map((s, i) => [s, pics[i]]));
  return { seq: best.seq, union: Ul.length, pool: pool.length, fallback, map, cards: best.seq.map(ci => makeCard(PLANES[n][ci], map, k)) };
}

function startSolo(li) {
  leaveFlows();

  Object.assign(G, { mode: 'solo', li, n: L.n, k: L.k, theme: save.theme, idx: 0, shown: 0, mistakes: 0, hints: 0, times: [], newFound: [], busy: true, streak: 0, fast: false });

function removeHand() { $$('.hand,.rip', flyL).forEach(h => h.remove()); }
/* first-time demo: an animated finger taps the shared picture on both cards */
async function demo() {

/* solo layout: portrait = cards stacked, landscape = side by side; mascot + hint button in free space */
function soloLayout() {
  const pa = $('#pa'), W = pa.clientWidth, Hh = pa.clientHeight; if (!W || !Hh) return;
  const pad = clamp(Math.min(W, Hh) * .03, 8, 18), gap = clamp(Math.min(W, Hh) * .035, 10, 28), K = 1.08;
  const Dp = Math.min((W - 2 * pad) / K, (Hh - 2 * pad - gap) / 2 / K);
  const Dl = Math.min((Hh - 2 * pad) / K, (W - 2 * pad - gap) / 2 / K);
  const land = Dl > Dp * 1.02, D = Math.min(land ? Dl : Dp, 600), vd = D * K;
  let A, B;
  if (!land) { const y0 = (Hh - 2 * vd - gap) / 2; A = { x: W / 2, y: y0 + vd / 2 - D * .01 }; B = { x: W / 2, y: y0 + vd * 1.5 + gap - D * .01 }; }
  else { const x0 = (W - 2 * vd - gap) / 2; A = { x: x0 + vd / 2, y: Hh / 2 - D * .015 }; B = { x: x0 + vd * 1.5 + gap, y: Hh / 2 - D * .015 }; }
  G.lay = { W, H: Hh, D, land, A, B, gap };
  if (G.top && G.top.el) placeCard(G.top, A, D);
  if (G.bot && G.bot.el) placeCard(G.bot, B, D);
  // mascot + hint button
  const R = vd / 2 * .97, circ = [A, B], side = land ? (W - 2 * vd - gap) / 2 : (W - vd) / 2;
  const hb = $('#bHint'), bs = hb.offsetWidth || 56;
  let dogBox = null, hintBox = null;
  const maxS = Math.min(D * .42, 170);
  for (let s = maxS; s >= 54 && !dogBox; s -= 4) {
    const h = s * 1.09; let b;
    if (side >= 84) b = { x: Math.max(4, (side - s) / 2), y: (land ? A.y + vd / 2 : B.y + vd / 2) - h, w: s, h };
    else if (!land) b = { x: 3, y: (A.y + B.y) / 2 - h / 2, w: s, h };
    else b = { x: (A.x + B.x) / 2 - s / 2, y: Hh - 3 - h, w: s, h };
    if (side >= 84 && s > side - 8) continue;
    if (boxClear(b, circ, R, W, Hh)) dogBox = b;
  }
  const cands = [];
  if (side >= 84) cands.push({ x: W - side / 2 - bs / 2, y: (land ? A.y + vd / 2 : B.y + vd / 2) - bs - 4 });
  if (!land) cands.push({ x: W - 4 - bs, y: (A.y + B.y) / 2 - bs / 2 });
  else cands.push({ x: (A.x + B.x) / 2 - bs / 2, y: 4 });
  cands.push({ x: W - 4 - bs, y: Hh - 4 - bs }, { x: W - 4 - bs, y: 4 });
  for (const c of cands) { const b = { x: c.x, y: c.y, w: bs, h: bs }; if (boxClear(b, circ, R * .96, W, Hh)) { hintBox = b; break; } }
  if (!hintBox) hintBox = { x: W - 4 - bs, y: Hh - 4 - bs };
  mDog.classList.toggle('hidden', !dogBox);
  if (dogBox) { mDog.style.left = dogBox.x + 'px'; mDog.style.top = dogBox.y + 'px'; mDog.style.width = dogBox.w + 'px'; }
  hb.style.left = hintBox.x + 'px'; hb.style.top = hintBox.y + 'px';
}

/* =========================================================
   9. TWO CHILDREN — split screen, top/left half turned 180°, shared centre card
   first correct tap scores a star; the winner's card goes onto the centre and they get a new card
   ========================================================= */

function duoIdle() { H.clear(); H.after(16000, () => { if (D2.busy) return; [0, 1].forEach(pi => duoHint(pi)); }); }
function duoAns(pi) { const a = common(D2.p[pi].ids, D2.c.ids); return { s: a, p: D2.p[pi].syms.find(x => x.s === a), c: D2.c.syms.find(x => x.s === a) }; }
function duoHint(pi) { const a = duoAns(pi); a.p.el.classList.add('hint'); }
$('#da').addEventListener('pointerdown', e => {
  if (Kit.curScreen !== 'duo') return;

});
function duoWrong(pi, sy) {

}
async function duoWin(pi) {
  D2.busy = true; H.clear();

}
async function duoSwap(pi) {
  const L = D2.lay, mv = D2.p[pi], old = D2.c, from = L.P[pi], to = L.C, dx = to.x - from.x, dy = to.y - from.y, r0 = mv.base;

function duoEnd() {
  save.duo++; persist();
  const [a, b] = D2.score, tie = a === b, w = a > b ? 0 : 1;
  const half = pi => {
    const win = tie || pi === w;
    return `<div class="de-h p${pi + 1}"><div class="de-av">${win ? `<span class="crown">${CROWN}</span>` : ''}${dogSVG({ head: true, happy: true, collar: pi ? '#7b68ff' : '#ff8a3d' })}</div>
      <div class="de-t"><b>${tie ? 'Hòa rồi!' : win ? 'Thắng rồi!' : 'Giỏi lắm!'}</b><span class="nmz">${NAMES[pi]}</span><span class="de-n">${Kit.icon('star')}${D2.score[pi]}</span></div></div>`;
  };
  const m = Kit.modal({ cls: 'duoend', closeBtn: false, html: `${half(1)}<div class="de-mid"><button class="btn ok" id="deAgain">${Kit.icon('replay')}<span>Chơi lại</span></button><button class="btn white" id="deSel">${Kit.icon('grid')}<span>Chọn cấp</span></button></div>${half(0)}` });
  $('#deAgain', m.panel).addEventListener('click', () => { m.close(); startDuo(G.li); });

  T.after(450, () => talk(tie ? 'Hòa rồi! Cả hai bạn đều giỏi quá!' : `${NAMES[w]} thắng! Cả hai bạn đều rất giỏi!`));
}
function duoLayout() {
  const da = $('#da'), W = da.clientWidth, Hh = da.clientHeight; if (!W || !Hh) return;
  const pad = clamp(Math.min(W, Hh) * .025, 6, 16), gap = clamp(Math.min(W, Hh) * .025, 8, 22), K = 1.08;
  const sW = clamp(W * .3, 96, 150), sH = clamp(Hh * .14, 50, 74);
  const Dc = Math.min((W - 2 * pad - sW - gap) / K, (Hh - 2 * pad - 2 * gap) / 3 / K);
  const Dr = Math.min((Hh - 2 * pad - sH - gap * .5) / K, (W - 2 * pad - 2 * gap) / 3 / K);
  const row = Dr > Dc, D = Math.min(row ? Dr : Dc, 440), vd = D * K;
  let C, P1, P2, S1, S2, from, fromC;
  if (!row) {
    const gw = vd + gap + sW, x0 = (W - gw) / 2, y0 = (Hh - 3 * vd - 2 * gap) / 2;
    P2 = { x: W - x0 - vd / 2, y: y0 + vd / 2 }; C = { x: W / 2, y: y0 + vd * 1.5 + gap }; P1 = { x: x0 + vd / 2, y: y0 + vd * 2.5 + gap * 2 };
    S1 = { x: x0 + vd + gap, y: P1.y - vd / 2 + vd * .06, w: sW, h: vd * .88 }; S2 = { x: x0, y: P2.y - vd / 2 + vd * .06, w: sW, h: vd * .88 };
    from = [{ x: P1.x, y: Hh + D }, { x: P2.x, y: -D }]; fromC = { x: -D, y: C.y };
  } else {
    const x0 = (W - 3 * vd - 2 * gap) / 2, gh = vd + gap * .5 + sH, y0 = (Hh - gh) / 2;
    P2 = { x: x0 + vd / 2, y: y0 + sH + gap * .5 + vd / 2 }; C = { x: W / 2, y: Hh / 2 }; P1 = { x: x0 + vd * 2.5 + gap * 2, y: y0 + vd / 2 };
    S1 = { x: P1.x - vd / 2, y: y0 + vd + gap * .5, w: vd, h: sH }; S2 = { x: P2.x - vd / 2, y: y0, w: vd, h: sH };
    from = [{ x: W + D, y: P1.y }, { x: -D, y: P2.y }]; fromC = { x: C.x, y: -D };
  }
  D2.lay = { W, H: Hh, D, row, C, P: [P1, P2], from, fromC };
  if (D2.c && D2.c.el) placeCard(D2.c, C, D);
  [0, 1].forEach(pi => { const c = D2.p[pi]; if (c && c.el) placeCard(c, D2.lay.P[pi], D); });
  [S1, S2].forEach((S, pi) => {
    const s = D2.strips[pi]; if (!s || !s.isConnected) return;
    Object.assign(s.style, { left: S.x + 'px', top: S.y + 'px', width: S.w + 'px', height: S.h + 'px' });
    s.classList.toggle('vert', !row);
    const nm = $('.nmz', s);
    if (!row) { const ss = clamp((S.w - 30) / 5, 14, 26); s.style.setProperty('--ss', ss + 'px'); s.style.setProperty('--cols', 5); s.style.setProperty('--av', clamp(S.h * .3, 40, 72) + 'px'); s.style.setProperty('--nf', clamp(S.w * .14, 14, 19) + 'px'); nm.classList.remove('hidden'); }
    else { const av = S.h - 14, ss = clamp(Math.min((S.w - av - 30) / 5, (S.h - 18) / 2), 12, 26); s.style.setProperty('--ss', ss + 'px'); s.style.setProperty('--cols', 5); s.style.setProperty('--av', av + 'px'); nm.classList.toggle('hidden', S.w - av - 5 * ss < 120); s.style.setProperty('--nf', '15px'); }
  });
}
Kit.onResize(() => { if (Kit.curScreen === 'play') soloLayout(); if (Kit.curScreen === 'duo') duoLayout(); });

    <p>Mỗi hình chung bé tìm được sẽ vào album!</p><div class="agroups"></div>` });

}

const _ctr = sy => { const r = sy.el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width }; };
const _wrongOf = (card, s) => { const o = card.syms.filter(x => x.s !== s).sort((p, q) => q.r - p.r)[0]; return _ctr(o); };
window.__game = {
  state: () => ({
    screen: Kit.curScreen, mode: G.mode, n: G.n, k: G.k, theme: G.theme, idx: G.idx, shown: G.shown, mistakes: G.mistakes, hints: G.hints, busy: G.busy, hinted: G.hinted,

  duo: () => [0, 1].map(pi => { const a = duoAns(pi); return { ok: _ctr(a.p), wrong: _wrongOf(D2.p[pi], a.s) }; }),
  planes: () => PLANES,
  check: n => checkPlane(PLANES[n], n),
  minSym: () => { const cs = $$('.screen.on .card[data-hit] .sym'); return cs.length ? Math.min(...cs.map(e => e.getBoundingClientRect().width)) : 0; },
  overlap: () => { let bad = 0; $$('.screen.on .card[data-hit]').forEach(c => { const ss = [...c.querySelectorAll('.sym')].map(e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 }; }); const cr = c.getBoundingClientRect(), R = cr.width / 2, cx = cr.left + R, cy = cr.top + R; ss.forEach((a, i) => { if (Math.hypot(a.x - cx, a.y - cy) + a.r > R * U + 1) bad++; ss.slice(i + 1).forEach(b => { if (Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r - 1) bad++; }); }); }); return bad; },
