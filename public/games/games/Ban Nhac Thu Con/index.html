<meta name="apple-mobile-web-app-capable" content="yes">

<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}

/* ===== Kit v2 additions (Bộ game 2) ===== */
/* tutorial hand */
.k-hand{position:fixed;z-index:72;left:0;top:0;width:clamp(54px,9vmin,78px);height:auto;pointer-events:none;opacity:0;
  filter:drop-shadow(0 6px 6px rgba(30,10,80,.25));transition:opacity .25s;will-change:transform}
.k-hand.on{opacity:1}
.k-hand .tapring{transform-origin:22px 10px;animation:k-ring 1s ease-out infinite}
@keyframes k-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* segmented chips (Dễ / Vừa / Khó …) */
.k-seg{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(40,20,90,.12)}
.k-seg button{border:none;cursor:pointer;min-height:48px;min-width:56px;padding:0 16px;border-radius:999px;background:transparent;
  font:800 clamp(16px,2.6vmin,21px)/1 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.k-seg button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.k-seg button:active{transform:translateY(2px)}
/* tile buttons for mode / level grids */
.k-tile{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;color:var(--ink);padding:12px 10px 10px;
  box-shadow:0 7px 0 rgba(40,20,90,.16),0 12px 20px rgba(40,20,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:800 clamp(16px,2.7vmin,22px)/1.05 var(--font);transition:transform .14s,box-shadow .14s;min-height:64px;text-align:center}
.k-tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(40,20,90,.16)}
.k-tile .emo{font-size:clamp(34px,6.4vmin,54px)}
.k-tile small{font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .k-tstars{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5;display:block}
.k-mini-star.on svg{color:#ffc83d;filter:drop-shadow(0 1px 0 #e09a00)}
/* scrollable screen body under the bar */
.k-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--bar-h) + var(--safe-t) + 6px) calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l));
  display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  box-shadow:0 4px 0 rgba(40,20,90,.12);white-space:nowrap}
.k-pill .emo{font-size:1.3em}
@keyframes k-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}50%{filter:drop-shadow(0 0 14px rgba(255,220,80,.95))}}
.k-glow{animation:k-glow 1.2s ease-in-out infinite}
@keyframes k-squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}}
.k-squash{animation:k-squash .5s ease}
@keyframes k-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.k-jump{animation:k-jump .5s cubic-bezier(.3,1.5,.5,1)}
</style>
<style>
:root{--bg1:#3a2585;--bg2:#26175e;--c1:#7b5cff;--c1d:#4a2fc4;--curtain:#d6286b;--curtaind:#9c1049}
body{background:#2a1a64}
/* ---------- stage backdrop ---------- */
.stagebg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  background:radial-gradient(120% 75% at 50% 0%,#6040b8 0%,#3c268a 42%,#24155a 100%)}
.stagebg .stars{position:absolute;inset:0;opacity:.55;background-image:radial-gradient(rgba(255,255,255,.7) 1.4px,transparent 2px),radial-gradient(rgba(255,230,160,.6) 1.2px,transparent 1.8px);
  background-size:46px 46px,71px 71px;background-position:0 0,23px 31px}
.spot{position:absolute;top:-4%;width:min(46vw,420px);height:112%;transform-origin:50% 0;opacity:.9;
  clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);animation:sway 9s ease-in-out infinite alternate}
.spot.s1{left:calc(18% - min(23vw,210px));background:linear-gradient(rgba(255,240,190,.30),rgba(255,240,190,0) 85%);--r0:-16deg;--r1:-4deg}
.spot.s2{left:calc(50% - min(23vw,210px));background:linear-gradient(rgba(255,150,210,.20),rgba(255,150,210,0) 80%);--r0:-6deg;--r1:7deg;animation-duration:11s}
.spot.s3{left:calc(82% - min(23vw,210px));background:linear-gradient(rgba(140,230,255,.24),rgba(140,230,255,0) 85%);--r0:15deg;--r1:3deg;animation-duration:8s}
@keyframes sway{from{transform:rotate(var(--r0))}to{transform:rotate(var(--r1))}}
.playing .spot{animation-duration:2.4s}
.valance{position:absolute;left:0;right:0;top:0;height:calc(34px + var(--safe-t));z-index:1;
  background:linear-gradient(#8e0f44,var(--curtain));box-shadow:inset 0 -5px 0 #ffc83d}
.valance::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;
  background:radial-gradient(circle at 50% 0,var(--curtain) 13px,#ffc83d 13.5px,#ffc83d 15.5px,transparent 16px) 0 0/34px 18px repeat-x}
.curtain{position:absolute;top:0;bottom:0;width:clamp(10px,9vw,150px);z-index:1;
  background:repeating-linear-gradient(90deg,#a3124b 0,var(--curtain) 14px,#ff4f8e 22px,var(--curtain) 30px,#a3124b 44px);
  box-shadow:0 0 30px rgba(0,0,0,.45)}
.curtain.l{left:0;border-bottom-right-radius:60% 30%}
.curtain.r{right:0;border-bottom-left-radius:60% 30%}
.floor{position:absolute;left:0;right:0;bottom:0;height:16%;z-index:0;
  background:linear-gradient(#e6a15a,#c27a3a 30%,#9a5a28);box-shadow:0 -6px 0 #f6c27a,0 -14px 30px rgba(255,200,120,.25)}
.floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 70px,rgba(90,40,10,.18) 70px,rgba(90,40,10,.18) 73px)}

/* ---------- animal heads ---------- */
.ani{display:block;width:100%;height:100%;overflow:visible}
.ani .m1{display:none}
.ani.open .m1{display:inline}
.ani.open .m0{display:none}
.ani .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ani .hat{display:none}
.ani.hatted .hat{display:inline}
.hb,.hs{position:absolute;inset:0;transform-origin:50% 85%}

/* ---------- title ---------- */
#title{padding:calc(var(--bar-h) + var(--safe-t)) calc(clamp(10px,9vw,150px) + 6px) calc(16px + var(--safe-b));gap:clamp(4px,1.4vmin,14px)}
#title>.tz{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vmin,16px)}
.logo{--c1d:#9c1049;font-size:clamp(42px,9.5vmin,100px)}
.logo .l2{color:#ffe36e}
.band{position:relative;z-index:2;display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(2px,1vmin,12px);width:min(900px,94vw)}
.band .mem{position:relative;aspect-ratio:1;cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation}
.band .mem .hb{animation:bobm 1.9s ease-in-out infinite}
@keyframes bobm{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.band .mem::after{content:"";position:absolute;left:14%;right:14%;bottom:-6%;height:12%;border-radius:50%;background:rgba(0,0,0,.25);z-index:-1}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media (max-aspect-ratio:1/1){.band{grid-template-columns:repeat(4,1fr);width:min(420px,88vw)}}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #title{flex-direction:row;gap:3vw;padding-top:calc(54px + var(--safe-t))}
  .band{grid-template-columns:repeat(4,1fr);width:min(46vw,52vh * 2)}
  .logo{font-size:clamp(36px,10vmin,64px)}
  .title-btns{gap:12px}
}

/* ---------- select ---------- */
#select .k-scroll{gap:8px;z-index:2}
.sel-sec{width:min(1000px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.k-h{-webkit-text-stroke-color:#9c1049;margin-top:6px}
.k-h:first-child{margin-top:0}
.tile{position:relative;border:none;cursor:pointer;border-radius:24px;background:#fff;color:var(--ink);padding:10px 8px 10px;
  box-shadow:0 7px 0 rgba(20,8,60,.35),0 12px 20px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:6px;
  font:800 clamp(16px,2.5vmin,20px)/1.05 var(--font);transition:transform .14s;min-height:64px;text-align:center}
.tile:active{transform:translateY(5px)}
.tile .thumb{width:100%;max-width:150px;aspect-ratio:2/1;border-radius:10px;background:#2c1d6a;display:block}
.tile .nm{display:flex;align-items:center;gap:6px}
.tile .nm .emo{font-size:1.35em}
.tile.big{flex-direction:row;justify-content:center;gap:12px;font-size:clamp(19px,3vmin,24px);min-height:84px}
.tile.big .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.tile.big .ic svg{width:34px;height:34px}
.tile.big .ic.emo{font-size:34px}
.tile.empty{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}
.tile.empty .thumb{background:transparent;display:grid;place-items:center;border:3px dashed rgba(255,255,255,.45)}
.tile.empty .thumb svg{width:34px;height:34px;opacity:.85}
.tile .slotn{position:absolute;top:-8px;left:-6px;width:32px;height:32px;border-radius:50%;background:var(--c2);color:#fff;font:800 18px/32px var(--font);box-shadow:0 3px 0 var(--c2d)}
.tile.just{animation:k-pop .5s cubic-bezier(.2,1.6,.4,1)}

/* ---------- play (sequencer) ---------- */
#play,#live{justify-content:flex-start;align-items:stretch}
#seq{position:absolute;left:0;top:0;z-index:2;touch-action:none}
#heads{position:absolute;left:0;top:0;width:0;height:0}
.head{position:absolute;cursor:pointer}
.head::before{content:"";position:absolute;inset:6%;border-radius:30%;background:radial-gradient(circle at 50% 60%,var(--cc) 0,transparent 70%);opacity:.0;transition:opacity .2s}
.head.sing::before{opacity:.55}
#cells{position:absolute;left:0;top:0;width:0;height:0}
.cell{position:absolute;left:0;top:0;border-radius:22%;background:var(--ci);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.10),inset 0 -3px 0 rgba(0,0,0,.18)}
.cell.g1{background:var(--ci2)}
.cell.on{background:linear-gradient(165deg,var(--cl) 0%,var(--cc) 55%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 0 12px var(--cg)}
.cell.on::before{content:"";position:absolute;left:16%;right:30%;top:10%;height:18%;border-radius:99px;background:rgba(255,255,255,.45)}
.cell .dot{position:absolute;left:50%;width:28%;max-width:12px;aspect-ratio:1;border-radius:50%;background:var(--cc);opacity:.5;transform:translate(-50%,50%)}
.cell.on .dot{background:#fff;opacity:.95;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.cell.off{display:none}
#ph{position:absolute;left:0;top:0;border-radius:14px;pointer-events:none;opacity:0;
  background:rgba(255,255,255,.16);box-shadow:0 0 0 3px rgba(255,255,255,.75),0 0 24px 4px rgba(255,255,255,.45)}
#ph.on{opacity:1}
#pager{position:absolute;z-index:5;display:none;flex-direction:column;gap:6px}
#pager.on{display:flex}
#pager button{flex:1;border:none;cursor:pointer;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font:800 20px/1 var(--font);min-width:0;min-height:44px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
#pager button.on{background:#fff;color:var(--c1d)}
#pager button.ph{animation:k-pulse .6s ease-in-out infinite}
.ctrl{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;gap:10px}
.ctrl.port{left:0;right:0;bottom:0;padding:8px calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l))}
.ctrl.land{top:0;bottom:0;left:0;flex-direction:column;padding:calc(var(--bar-h) + var(--safe-t)) 8px calc(10px + var(--safe-b)) calc(10px + var(--safe-l))}
.tools{display:flex;gap:10px;align-items:center}
.k-mid .tools{gap:8px}
.k-bar .k-mid{gap:8px}
.bigplay{--ps:88px;position:relative;width:var(--ps);height:var(--ps);flex:0 0 auto;border-radius:50%;border:5px solid #fff;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 50% 30%,#7ff0a4,#36c96a 60%,#25a957);box-shadow:0 8px 0 #1b8a45,0 14px 26px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
.bigplay svg{width:52%;height:52%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.bigplay .i-stop{display:none}
.bigplay.on{background:radial-gradient(circle at 50% 30%,#ff9cc2,#ff5d8f 60%,#e23d74);box-shadow:0 8px 0 #b52458,0 14px 26px rgba(0,0,0,.35)}
.bigplay.on .i-play{display:none}.bigplay.on .i-stop{display:block}
.bigplay:active{transform:translateY(6px);box-shadow:0 2px 0 #1b8a45,0 6px 12px rgba(0,0,0,.3)}
.bigplay.on:active{box-shadow:0 2px 0 #b52458,0 6px 12px rgba(0,0,0,.3)}
.bigplay.pulse{animation:k-pulse 1.4s ease-in-out infinite}
.tb{position:relative}
.tb .emo{font-size:28px}
.ibtn.tb.tempo{flex-direction:column}
.tempo .dots3{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.tempo .dots3 i{width:5px;height:5px;border-radius:50%;background:#d8d0ef}
.tempo .dots3 i.on{background:var(--c1)}
.tempo .emo{margin-top:-6px}
.tb.undo{background:var(--gold);color:#6b3d00;animation:k-pulse 1s ease-in-out infinite}
.tb .dotb{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--c2);box-shadow:0 2px 0 var(--c2d);display:none}
.tb.dirty .dotb{display:block;animation:k-pulse 1s ease-in-out infinite}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:72px}
  .k-bar .k-mid:empty{display:none}
}

@media (max-width:370px){.ctrl.port .ibtn{width:48px;height:48px}.ctrl.port{gap:6px}.ctrl.port .tools{gap:6px}}

/* ---------- live ---------- */
#pads{position:absolute;z-index:2;display:grid;gap:12px;touch-action:none}
.pad{position:relative;border-radius:26px;cursor:pointer;background:linear-gradient(165deg,var(--cl),var(--cc) 70%);
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.18),0 8px 0 var(--cd),0 14px 22px rgba(0,0,0,.3);overflow:visible;touch-action:none}
.pad .pa{position:absolute;left:50%;top:46%;width:min(82%,76% * var(--ar,1));aspect-ratio:1;transform:translate(-50%,-50%)}

.pad .rip{position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 6px #fff;opacity:0;pointer-events:none}
#beatBtn .bdg{position:absolute;right:-10px;top:-10px;width:44%;height:44%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:calc(var(--ps) * .24);box-shadow:0 3px 0 rgba(0,0,0,.18)}

/* ---------- overlays ---------- */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:14px}
.slot{position:relative;border:none;cursor:pointer;border-radius:20px;background:#f5f2ff;padding:12px 8px 8px;box-shadow:0 5px 0 #e2dbf7;display:flex;flex-direction:column;align-items:center;gap:6px;font:800 16px/1 var(--font);color:var(--ink)}
.slot .thumb{width:100%;aspect-ratio:2/1;border-radius:10px;background:#2c1d6a}
.slot.empty .thumb{background:#fff;border:3px dashed #cfc6ea;display:grid;place-items:center;color:#b3abc9}
.slot.empty .thumb svg{width:34px;height:34px}
.slot .slotn{position:absolute;top:-8px;left:-6px;width:30px;height:30px;border-radius:50%;background:var(--c2);color:#fff;font:800 17px/30px var(--font);box-shadow:0 3px 0 var(--c2d)}
.slot:active{transform:translateY(4px)}
.hats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.hats .hc{position:relative;border-radius:18px;background:#f5f2ff;padding:8px 4px 4px;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center}
.hats .hc .hw{position:relative;width:86%;aspect-ratio:1;min-width:0}
.hats .hc.yes{background:#fff6dc;box-shadow:inset 0 0 0 3px #ffd36b}
.hats .hc.no .ani .hat{display:inline;opacity:.38;filter:grayscale(1) brightness(.75)}
.hats .hc .q{position:absolute;top:2%;left:50%;transform:translateX(-50%);font:800 22px/1 var(--font);color:#b3abc9;background:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;box-shadow:0 2px 0 #e2dbf7}
.hats .hc span{font-weight:800;font-size:14px}
.hatcount{font-weight:800;color:var(--c2d);font-size:20px;margin-top:8px}
.how{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;color:var(--ink-soft);font-weight:700}
.how svg{width:30px;height:30px;color:var(--c1)}
.res-ani{width:130px;height:130px;margin:-80px auto 0;position:relative}
.k-panel.k-result{overflow:visible;margin-top:60px}
.flythumb{position:fixed;z-index:90;left:0;top:0;border-radius:10px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style>
</head>

      <button class="ibtn tb tempo" id="bTempo" aria-label="Nhịp độ"><span class="emo">🚲</span><span class="dots3"><i></i><i></i><i></i></span></button>

  </div>

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }
    else ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + a + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.2, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 2, t, vol: vol * 0.22, dur: dur * 0.5, bus });
    tone({ f: f * 3.01, t, vol: vol * 0.07, dur: dur * 0.3, bus });
  }
  function marimba(f, t = 0, vol = 0.2, dur = 0.4, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 4, t, vol: vol * 0.16, dur: dur * 0.18, bus });
  }
  function pluck(f, t = 0, vol = 0.12, dur = 0.3, bus) { tone({ f, t, vol, dur, type: 'triangle', lp: 2200, bus }); }

  const sfx = {
    tap() { tone({ f: 700, to: 960, dur: 0.06, vol: 0.12, type: 'triangle' }); },
    click() { tone({ f: 1300, dur: 0.03, vol: 0.06, type: 'triangle' }); },
    pop() { tone({ f: 360, to: 1250, slide: 0.07, dur: 0.1, vol: 0.32 }); noise({ f: 2600, q: 0.8, dur: 0.05, vol: 0.1 }); },
    good() { bell(1046.5, 0, 0.18, 0.5); bell(1318.5, 0.09, 0.18, 0.7); },
    bad() { tone({ f: 330, to: 300, dur: 0.15, vol: 0.15, type: 'triangle', lp: 1200 }); tone({ f: 262, to: 240, t: 0.17, dur: 0.24, vol: 0.15, type: 'triangle', lp: 1000 }); },
    star() { [1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.06, 0.08, 0.35)); },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.11, 0.17, 0.6));
      [1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.5 + i * 0.05, 0.05, 0.4));
    },
    fanfare() {
      const n = [[523.25, 0], [523.25, 0.12], [523.25, 0.24], [659.25, 0.36], [783.99, 0.6], [659.25, 0.78], [783.99, 0.9], [1046.5, 1.08]];
      n.forEach(([f, t]) => { tone({ f, t, vol: 0.09, dur: 0.22, type: 'square', lp: 2600 }); bell(f, t, 0.1, 0.4); });
      [1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 1.2 + i * 0.05, 0.05, 0.5));
    },
    whoosh() { noise({ f: 400, to: 3200, q: 1.2, dur: 0.28, vol: 0.13 }); },
    pick() { tone({ f: 520, to: 800, dur: 0.08, vol: 0.14, type: 'triangle' }); },
    drop() { tone({ f: 620, to: 300, dur: 0.1, vol: 0.16 }); noise({ f: 320, q: 0.7, dur: 0.06, vol: 0.08, ft: 'lowpass' }); },
    flip() { noise({ f: 1900, to: 900, q: 0.9, dur: 0.08, vol: 0.12 }); tone({ f: 520, to: 720, dur: 0.05, vol: 0.05, type: 'triangle' }); },
    boing() { tone({ f: 170, to: 540, slide: 0.12, dur: 0.3, vol: 0.18 }); },
    chomp() { noise({ f: 650, q: 1.6, dur: 0.07, vol: 0.32, ft: 'lowpass' }); noise({ t: 0.15, f: 560, q: 1.6, dur: 0.07, vol: 0.3, ft: 'lowpass' }); },
    coin() { tone({ f: 988, dur: 0.07, vol: 0.1, type: 'square', lp: 4000 }); tone({ f: 1319, t: 0.07, dur: 0.3, vol: 0.1, type: 'square', lp: 4000 }); },
    tick() { tone({ f: 1800, dur: 0.02, vol: 0.05 }); },
    sparkle() { for (let i = 0; i < 5; i++) bell(1800 + Math.random() * 2200, i * 0.045, 0.045, 0.25); },
    swap() { tone({ f: 440, to: 660, dur: 0.07, vol: 0.1, type: 'triangle' }); tone({ f: 660, to: 440, t: 0.07, dur: 0.07, vol: 0.1, type: 'triangle' }); },
    unlock() { [784, 988, 1175, 1568].forEach((f, i) => bell(f, i * 0.07, 0.12, 0.45)); },
  };

  /* ---------- background music (tiny sequencer) ---------- */
  const songs = {

  s.g[4] = P(pick(['x...x...x...x...', 'x..x..x.x..x..x.', 'x.x.x.x.x.x.x.x.', 'x.....x.x.....x.', 'x...x.x.x...x.x.']));

    Kit.hand.tap(() => padH[randInt(0, 7)].pad, { times: 2 });
  }
}

/* ================= live mode (big pads, multi-touch, slide across) ================= */
const LIVE_PH = { 4: '03430343'.split('').map(Number), 5: '2345654323456532'.split('').map(Number), 6: '57875452'.split('').map(Number), 7: '24575420'.split('').map(Number) };
const liveIdx = new Array(NR).fill(0);
const padH = [];
let padRects = [], liveTaps = 0;
function buildLive() {
  const box = $('#pads');
  ROWS.forEach((R, r) => {
    const pad = el('div', 'pad');
    pad.style.cssText = `--cc:${R.c};--cl:${R.cl};--cd:${R.cd}`;
    const h = mkHead(r, 'pa'); const rip = el('i', 'rip');
    pad.append(rip, h.el, el('div', 'pn', R.name));
    box.appendChild(pad); padH[r] = { pad, h, rip };
  });
  const ptr = new Map();
  const hitPad = (x, y) => { for (let r = 0; r < NR; r++) { const q = padRects[r]; if (q && x >= q.l && x <= q.r && y >= q.t && y <= q.b) return r; } return -1; };
  box.addEventListener('pointerdown', e => {
    if (screen !== 'live' || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const r = hitPad(e.clientX, e.clientY); if (r < 0) return;
    e.preventDefault();
    try { box.setPointerCapture(e.pointerId); } catch (_) { }
    ptr.set(e.pointerId, r); hitLive(r);
  });
  box.addEventListener('pointermove', e => {
    if (!ptr.has(e.pointerId)) return;
    const r = hitPad(e.clientX, e.clientY);
    if (r !== ptr.get(e.pointerId)) { ptr.set(e.pointerId, r); if (r >= 0) hitLive(r); }
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => box.addEventListener(t, e => ptr.delete(e.pointerId)));
}
function hitLive(r) {
  const c = ac(); if (!c) return;
  const R = ROWS[r]; let pi = 0;
  if (R.scale) { const ph = LIVE_PH[r]; pi = ph[liveIdx[r]++ % ph.length]; }
  playVoice(r, c.currentTime + 0.002, 1, pi, 0.3);
  const P = padH[r];
  sing(P.h, SING_MS[R.kind] + 80);
  anim(P.pad, [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(5px) scale(.95)', offset: .3 }, { transform: 'translateY(0) scale(1)' }], { duration: 260, easing: 'ease-out' });
  anim(P.rip, [{ transform: 'scale(.9)', opacity: .9 }, { transform: 'scale(1.12)', opacity: 0 }], { duration: 420, easing: 'ease-out' });
  const q = padRects[r];
  if (q && Kit.fx.count < 60) Kit.burst((q.l + q.r) / 2, q.t + (q.b - q.t) * .35, { n: 6, colors: [R.cl, '#fff', R.c], size: 12, speed: 6 });
  liveTaps++; dbg.liveHits = (dbg.liveHits || 0) + 1;
  if (liveTaps === 3 && !saveData.liveTut) { saveData.liveTut = 1; persist('liveTut'); Kit.hand.hide(); Kit.praise('Hay quá!', { speak: true }); }
}
function layoutLive() {
  if (screen !== 'live') return;
  const W = innerWidth, H = innerHeight, port = W < H, sa = safe(), ctrl = $('#ctrl2');
  const ps = port ? clamp(Math.min(W * 0.22, H * 0.11), 64, 100) : clamp(Math.min(H * 0.24, W * 0.11), 64, 120);
  $('#beatBtn').style.setProperty('--ps', ps + 'px');
  placeCtrl(ctrl, port, null);
  const barB = $('.k-bar').getBoundingClientRect().bottom, cr = ctrl.getBoundingClientRect();
  let ax, ay, aw, ah;
  if (port) { ax = sa.l + 12; ay = barB + 6; aw = W - sa.l - sa.r - 24; ah = cr.top - ay - 10; }
  else { ax = cr.right + 4; ay = barB + 6; aw = W - ax - sa.r - 14; ah = H - ay - sa.b - 14; }
  const cols = port ? 2 : 4, rows = NR / cols, gap = clamp(Math.min(aw, ah) * 0.03, 8, 18);
  let pw = (aw - (cols - 1) * gap) / cols, ph = (ah - (rows - 1) * gap - 8) / rows;
  pw = Math.min(pw, ph * 1.35, 260); ph = Math.min(ph, pw * 1.15, 240);
  const gw = cols * pw + (cols - 1) * gap, gh = rows * ph + (rows - 1) * gap;
  const box = $('#pads'), x0 = ax + (aw - gw) / 2, y0 = ay + (ah - gh) / 2;
  Object.assign(box.style, { left: x0 + 'px', top: y0 + 'px', width: gw + 'px', height: gh + 'px', gap: gap + 'px', gridTemplateColumns: `repeat(${cols},1fr)`, gridTemplateRows: `repeat(${rows},1fr)` });
  padH.forEach(p => p.pad.style.setProperty('--ar', (ph / pw).toFixed(3)));
  padRects = padH.map((p, r) => { const c = r % cols, rr = Math.floor(r / cols); const l = x0 + c * (pw + gap), t = y0 + rr * (ph + gap); return { l, t, r: l + pw, b: t + ph }; });
}
$('#beatBtn').addEventListener('click', () => {
  if (S.playing) { stopTransport(); return; }
  S.mode = 'live'; startTransport();
});

/* ================= thumbnails, select screen ================= */
function thumbSVG(s) {
  let r = '';
  for (let i = 0; i < NR; i++) for (let j = 0; j < NS; j++)
    r += `<rect x="${j * 10 + 1 + Math.floor(j / 4)}" y="${i * 10 + 1}" width="8.4" height="8.4" rx="2" fill="${s.g[i][j] ? ROWS[i].c : 'rgba(255,255,255,.09)'}"/>`;
  return `<svg class="thumb" viewBox="0 0 164 81" preserveAspectRatio="xMidYMid meet">${r}</svg>`;
}
const DEMO_SONGS = DEMOS.map(parseDemo);
function renderSelect(justSlot) {
  const b = $('#selBody'); b.innerHTML = '';
  const sec = () => { const d = el('div', 'sel-sec'); b.appendChild(d); return d; };
  const head = t => b.appendChild(el('div', 'k-h', t));
  const s1 = sec();
  const tNew = el('button', 'tile big', `<span class="ic" style="background:var(--ok)">${Kit.icon('plus')}</span><span>Bài mới</span>`);
  tNew.onclick = () => startSong(blankSong(), { type: 'new' }, false);
  s1.appendChild(tNew);
  const dr = saveData.draft && saveData.draft.song ? deser(saveData.draft.song) : null;
  if (dr && noteCount(dr)) {
    const t = el('button', 'tile', `${thumbSVG(dr)}<span class="nm"><span class="emo">✏️</span>Đang làm</span>`);
    t.onclick = () => startSong(dr, saveData.draft.src || { type: 'new' }, false, true);
    s1.appendChild(t);
  }
  const tLive = el('button', 'tile big', `<span class="ic emo" style="background:var(--c2)">🥁</span><span>Gõ live</span>`);
  tLive.onclick = () => openLive('select');
  s1.appendChild(tLive);
  head('🎵 Bài mẫu');
  const s2 = sec();
  DEMOS.forEach((d, i) => {
    const t = el('button', 'tile', `${thumbSVG(DEMO_SONGS[i])}<span class="nm"><span class="emo">${d.emo}</span>${d.name}</span>`);
    t.dataset.demo = i;
    t.onclick = () => { startSong(DEMO_SONGS[i], { type: 'demo', i }, true); say(d.name); };
    s2.appendChild(t);
  });
  head('⭐ Bài của bé');
  const s3 = sec();
  saveData.slots.forEach((o, i) => {
    let t;
    if (o) { const s = deser(o); t = el('button', 'tile', `<span class="slotn">${i + 1}</span>${thumbSVG(s)}<span class="nm">Bài ${i + 1}</span>`); t.onclick = () => startSong(s, { type: 'slot', i }, true); }
    else { t = el('button', 'tile empty', `<span class="slotn">${i + 1}</span><span class="thumb">${Kit.icon('plus')}</span><span class="nm">Trống</span>`); t.onclick = () => startSong(blankSong(), { type: 'new' }, false); }
    t.dataset.slot = i;
    if (justSlot === i) t.classList.add('just');
    s3.appendChild(t);
  });
}
function startSong(s, src, autoplay, resume) {
  song = copySong(s); songSrc = src;
  if (resume) base = src.type === 'demo' && DEMO_SONGS[src.i] ? copySong(DEMO_SONGS[src.i]) : (src.type === 'slot' && saveData.slots[src.i]) ? deser(saveData.slots[src.i]) : blankSong();
  else base = copySong(s);
  edited = !sameSong(song, base);
  clearUndo(); page = 0;
  show('play');
  renderAll(); layoutSeq();
  if (autoplay) { S.mode = 'seq'; startTransport(); }
  if ((saveData.tut & 7) !== 7 && !autoplay) setTimeout(() => { if (screen === 'play') coach(); }, 450);
}

/* ================= save / celebrate / hats ================= */
function openSave() {
  if (!noteCount(song)) {
    sfx.bad(); Kit.toast('Thêm vài nốt nhạc trước nhé! 🎵');
    anim($('#bSave'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(7px)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(0)' }], { duration: 420 });
    Kit.hand.tap(() => cellEls[0][L ? L.s0 : 0], { times: 2 }); return;
  }
  Kit.hand.hide();
  const m = Kit.overlay(`<h2>Lưu bài hát</h2><div class="slots"></div>`, { closable: true });
  const box = $('.slots', m.panel);
  saveData.slots.forEach((o, i) => {
    const b = el('button', 'slot' + (o ? '' : ' empty'), `<span class="slotn">${i + 1}</span>${o ? thumbSVG(deser(o)) : `<span class="thumb">${Kit.icon('plus')}</span>`}`);
    b.dataset.slot = i; b.setAttribute('aria-label', 'Ô ' + (i + 1));
    b.onclick = () => {
      if (o && !(songSrc.type === 'slot' && songSrc.i === i)) {
        Kit.confirm({ title: 'Thay bài cũ?', text: `<span style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px"><span style="width:110px;display:block">${thumbSVG(deser(o))}</span><span style="font-size:30px">➜</span><span style="width:110px;display:block">${thumbSVG(song)}</span></span>`,
          buttons: [{ label: 'Thôi', icon: 'close', cls: 'white' }, { label: 'Thay', icon: 'check', cls: 'ok', onClick: () => doSave(i, b, m) }] });
      } else doSave(i, b, m);
    };
    box.appendChild(b);
  });
  say('Bé muốn lưu vào ô nào?');
}
function doSave(i, btn, m) {
  const wasEdited = edited || songSrc.type === 'new';
  saveData.slots[i] = ser(song); persist('slots');
  songSrc = { type: 'slot', i }; base = copySong(song); edited = false; updateSaveBtn();
  clearTimeout(draftT); saveData.draft = null; persist('draft');
  // the song flies into its slot
  const from = L ? { x: L.x0, y: L.y0, w: L.gw, h: L.gh } : { x: innerWidth / 2 - 80, y: innerHeight / 2 - 40, w: 160, h: 80 };
  const tr = btn && btn.isConnected ? btn.getBoundingClientRect() : { left: innerWidth / 2 - 60, top: innerHeight / 2 - 30, width: 120, height: 60 };
  const fly = el('div', 'flythumb', thumbSVG(song)); const fw = 164, fh = 81;
  fly.style.width = fw + 'px'; fly.style.height = fh + 'px'; fly.style.background = '#2c1d6a';
  document.body.appendChild(fly);
  const sx = from.w / fw, sy = from.h / fh, s0 = Math.min(sx, sy), s1 = tr.width / fw;
  const a = anim(fly, [
    { transform: `translate(${from.x + (from.w - fw * s0) / 2}px,${from.y + (from.h - fh * s0) / 2}px) scale(${s0})`, opacity: .2 },
    { transform: `translate(${from.x + (from.w - fw * s0) / 2}px,${from.y + (from.h - fh * s0) / 2 - 20}px) scale(${s0 * .9})`, opacity: 1, offset: .25 },
    { transform: `translate(${tr.left}px,${tr.top}px) scale(${s1})`, opacity: 1 }], { duration: 700, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' });
  fly.style.transformOrigin = '0 0';
  sfx.whoosh();
  const done = () => {
    fly.remove(); sfx.coin();
    const c = { x: tr.left + tr.width / 2, y: tr.top + tr.height / 2 }; Kit.sparkle(c.x, c.y, { n: 10 }); Kit.burst(c.x, c.y, { n: 14 });
    setTimeout(() => { m && m.close(); celebrate(wasEdited); }, 380);
  };
  if (a) a.onfinish = done; else done();
}
function celebrate(earn) {
  const notes = noteCount(song);
  if (earn && notes >= 4 && saveData.hats < 8) {
    const r = saveData.hats; saveData.hats++; persist('hats'); refreshHats();
    Kit.result({ showStars: false, top: `<div class="res-ani">${aniSVG(r, true)}</div>`, title: 'Đã lưu bài!',
      text: `Quà mới: ${HATS[r].name} cho bạn ${ROWS[r].name}!`, buttons: [{ label: 'Chơi tiếp', icon: 'play', cls: 'ok' }],
      say: `Đã lưu bài! Bạn ${ROWS[r].name} được ${HATS[r].name.toLowerCase()} mới!` });
  } else {
    const r = randInt(0, 7);
    Kit.result({ showStars: false, top: `<div class="res-ani">${aniSVG(r, hatOn(r)).replace('class="ani', 'class="ani open')}</div>`, title: 'Đã lưu bài!',
      buttons: [{ label: 'Chơi tiếp', icon: 'play', cls: 'ok' }], say: 'Đã lưu bài! Bé giỏi quá!' });
  }
}
function openHats() {
  const cells = ROWS.map((R, r) => `<div class="hc${hatOn(r) ? ' yes' : ' no'}"><div class="hw">${aniSVG(r, hatOn(r))}</div><span>${R.name}</span></div>`).join('');
  Kit.overlay(`<h2>Quà của bé</h2><div class="hatcount">🎩 ${saveData.hats} / 8</div><div class="hats">${cells}</div>
    <div class="how">${Kit.icon('save')}<span>➜</span><span class="emo" style="font-size:30px">🎩</span></div>`, { closable: true });
  say(saveData.hats ? 'Đây là quà của bé! Lưu bài hát để nhận thêm mũ nhé!' : 'Lưu bài hát để nhận mũ cho các bạn thú nhé!');
}

/* ================= title ================= */
function buildTitle() {
  const band = $('#band');
  ROWS.forEach((R, r) => {
    const b = el('button', 'mem'); b.setAttribute('aria-label', R.name); b.setAttribute('data-silent', '');
    const h = mkHead(r, ''); h.el.style.cssText = 'position:absolute;inset:0';
    h.hb.style.animationDelay = (-r * 0.23).toFixed(2) + 's';
    b.appendChild(h.el); band.appendChild(b);
    b.addEventListener('pointerdown', () => {
      const c = ac(); if (!c) return;
      let pi = 0; if (R.scale) { const ph = LIVE_PH[r]; pi = ph[liveIdx[r]++ % ph.length]; }
      playVoice(r, c.currentTime + 0.004, 1, pi, 0.3); sing(h, SING_MS[R.kind] + 80);
    });
  });
}
const MENU_SONG = { bpm: 100, swing: 0.1, inst: 'marimba', bars: [
  { r: 48, c: [60, 64, 67], m: [76, 0, 79, 0, 81, 0, 79, 76] }, { r: 45, c: [57, 60, 64], m: [72, 0, 0, 74, 76, 0, 72, 0] },
  { r: 53, c: [57, 60, 65], m: [74, 0, 72, 0, 69, 0, 72, 0] }, { r: 55, c: [59, 62, 67], m: [74, 0, 0, 0, 79, 0, 0, 0] }] };

/* ================= screens & navigation ================= */
let liveFrom = 'title';
function show(id) {
  Kit.hand.hide(); coaching = false;
  stopTransport();
  if (paint) paint = null;
  if (idleH) { idleH.stop(); idleH = null; }
  if (screen === 'play' && id !== 'play') { saveDraft(); restoreCtrl(); }
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  screen = id;
  $('#bBack').classList.toggle('hidden', id === 'title');
  if (id === 'title' || id === 'select') Kit.music.start(MENU_SONG); else Kit.music.stop();
  if (id === 'play' || id === 'live') idleH = Kit.idle(9000, onIdle);
  if (id === 'play') layoutSeq();
  if (id === 'live') layoutLive();
  updatePlayUI();
}
function openLive(from) {
  liveFrom = from; show('live');
  liveTaps = 0;
  if (!saveData.liveTut) { setTimeout(() => { if (screen === 'live' && !liveTaps) Kit.hand.tap(() => padH[0].pad); }, 500); say('Chạm vào các bạn thú để chơi nhạc nhé!'); }
}
$('#bBack').addEventListener('click', () => {
  if (screen === 'play') { show('select'); renderSelect(); }
  else if (screen === 'live') { if (liveFrom === 'select') renderSelect(); show(liveFrom); }
  else if (screen === 'select') show('title');
});
$('#bPlay').addEventListener('click', () => { renderSelect(); show('select'); say('Chọn bài hát nào!'); });
$('#bLive').addEventListener('click', () => openLive('title'));
$('#bHats').addEventListener('click', openHats);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && screen === 'play' && !document.querySelector('.k-ov')) { e.preventDefault(); $('#bigPlay').click(); }
});
$$('[data-k="sound"]').forEach(b => b.addEventListener('click', () => setTimeout(syncBus, 0)));
Kit.onResize(() => { if (screen === 'play') layoutSeq(); else if (screen === 'live') layoutLive(); });
// stop any lingering paint when the window loses focus
window.addEventListener('blur', () => { paint = null; });

/* ================= init ================= */
buildSeq(); buildLive(); buildTitle(); renderAll(); updatePlayUI();
Kit.music.start(MENU_SONG);

// read-only hooks for automated tests
window.__dbg = {
  get screen() { return screen; }, get playing() { return S.playing; }, get mode() { return S.mode; }, get step() { return S.step; },
  get loops() { return S.loops; }, get song() { return ser(song); }, get edited() { return edited; }, get src() { return songSrc; },
  get layout() { return L && { rot: L.rot, n: L.n, s0: L.s0, cw: L.cw, ch: L.ch, x0: L.x0, y0: L.y0, gw: L.gw, gh: L.gh }; },
  get hats() { return saveData.hats; }, get tickGaps() { return dbg.gaps.slice(); }, get frameMs() { const a = dbg.frames.slice().sort((x, y) => x - y); return a.length ? +a[a.length >> 1].toFixed(1) : null; }, get slots() { return saveData.slots.map(o => !!o); },
  sched: dbg.sched, fired: dbg.fired, get resync() { return dbg.resync; }, get liveHits() { return dbg.liveHits || 0; },
  ctx: () => AC && { state: AC.state, t: AC.currentTime, lat: AC.outputLatency || AC.baseLatency || 0 },
  stepDur: s => stepDur(s), notes: () => noteCount(song),
  cell(r, s) { const d = cellEls[r][s]; if (!d || d.classList.contains('off')) return null; const q = d.getBoundingClientRect(); return { x: q.left + q.width / 2, y: q.top + q.height / 2, w: q.width, h: q.height, on: d.classList.contains('on') }; },
  pad(r) { const q = padRects[r]; return q && { x: (q.l + q.r) / 2, y: (q.t + q.b) / 2 }; },
  demoLens: DEMOS.map(d => d.rows.map(x => x.length)),
  openSet: () => openSet.size,

})();
