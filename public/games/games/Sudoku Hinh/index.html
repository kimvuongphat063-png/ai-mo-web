<!DOCTYPE html>
<html lang="vi" data-game="sudoku">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8f6af0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sudoku Hình</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* ===== BéVui Kit 5 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','Segoe UI Symbol',sans-serif;
  --ink:#33305a; --ink-soft:#6c6896;
  --c1:#4f8cff; --c1d:#2f63d6; --c1l:#e2edff;
  --c2:#ff7a9c; --c2d:#dd4f76;
  --ok:#35c46a; --okd:#1f9a4d;
  --gold:#ffc93c; --goldd:#e19a00;
  --bad:#ff8a65;
  --bg1:#bfe3ff; --bg2:#fff1c9;
  --panel:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:76px;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-play{touch-action:none}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-right{display:flex;gap:10px;align-items:center;margin-left:auto;flex:0 0 auto}
.k-bar .k-extra{display:flex;gap:10px}
.k-bar .k-extra:empty{display:none}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(30,40,90,.16),0 10px 18px rgba(30,40,90,.10);
  transition:transform .12s ease,box-shadow .12s ease,opacity .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(30,40,90,.16),0 4px 8px rgba(30,40,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn .emo{font-size:30px}
.ibtn.off{color:#b4b2cc}
.ibtn .badge,.btn .badge{position:absolute;top:-8px;right:-8px;min-width:25px;height:25px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 15px/25px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.k-back{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(30,40,90,.12)}
.k-back:active{box-shadow:0 1px 0 var(--c1d)}
@media (max-height:500px),(max-width:430px){
  .ibtn{width:50px;height:50px;border-radius:16px}
  .ibtn svg{width:27px;height:27px}
  .k-bar,.k-bar .k-right,.k-bar .k-extra{gap:8px}
  .k-bar{padding-top:calc(8px + var(--safe-t));padding-bottom:6px}
}
/* narrow portrait: middle slot drops to its own row when it has content */
@media (max-width:600px) and (orientation:portrait){
  .k-bar{flex-wrap:wrap;row-gap:8px}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:var(--tap);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(20,30,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(20,30,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.15em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d5d9ee;color:var(--c1d);text-shadow:none}
.btn.purple{--b:#9b6bff;--bd:#7246dc}
.btn.orange{--b:#ff9a3c;--bd:#db7412}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.glow{animation:k-glow 1.3s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(42px,9.5vmin,100px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(20,30,80,.25)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.05}

/* ---- tiles (mode / level pickers) ---- */
.k-tiles{display:grid;gap:clamp(10px,2vmin,18px);width:min(1000px,100%);grid-template-columns:repeat(auto-fit,minmax(min(150px,42vw),1fr))}
.k-tile{--tc:var(--c1);--tcd:var(--c1d);--tcl:var(--c1l);position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:12px 10px 12px;
  box-shadow:0 7px 0 rgba(30,40,90,.14),0 12px 20px rgba(30,40,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:800;color:var(--ink);font-size:clamp(16px,2.6vmin,22px);line-height:1.1;text-align:center;transition:transform .15s;min-height:var(--tap)}
.k-tile:active{transform:translateY(4px) scale(.98)}
.k-tile .ti{font-size:clamp(38px,7vmin,62px);width:1.55em;height:1.55em;display:grid;place-items:center;border-radius:50%;background:var(--tcl)}
.k-tile .ti svg{width:72%;height:72%}
.k-tile small{display:block;font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .st{display:flex;gap:1px;justify-content:center}
.k-tile.sel{background:var(--tc);color:#fff;box-shadow:0 7px 0 var(--tcd),0 0 0 4px #fff}
.k-tile.sel small{color:rgba(255,255,255,.9)}
.k-tile.sel .ti{background:rgba(255,255,255,.3)}
.st{display:inline-flex;gap:1px;justify-content:center;align-items:center}
.k-mini-star{display:inline-block}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e3e2f2;display:block}
.k-mini-star.on svg{color:var(--gold)}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(30,30,80,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px;overflow:auto}
.k-panel{position:relative;width:min(580px,94vw);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(30,40,90,.14),0 30px 60px rgba(30,40,90,.3);animation:k-panel .34s cubic-bezier(.2,1.5,.4,1) both;overscroll-behavior:contain}
.k-panel.wide{width:min(900px,96vw)}
.k-panel h2{margin:0 0 4px;font-size:clamp(28px,6vmin,46px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(54px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars .mid svg{margin-top:-16px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}
.k-result .k-hero{width:clamp(96px,22vmin,140px);margin:-80px auto 0;display:block}
.k-panel.k-result{overflow:visible;margin-top:60px}
@media (max-height:500px){
  .k-panel{padding:16px 18px 16px;border-radius:26px}
  .k-btns{margin-top:12px}
  .k-stars svg{width:52px}
  .k-result .k-hero{width:80px;margin-top:-56px}
  .k-panel.k-result{margin-top:40px}
}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,58px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(30,40,90,.12),0 12px 24px rgba(30,40,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---- speech bubble with replay ---- */
.k-say{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 8px 6px 16px;font-weight:800;color:var(--ink);
  font-size:clamp(17px,2.8vmin,24px);box-shadow:0 5px 0 rgba(30,40,90,.12);line-height:1.1;max-width:100%}
.k-say .ibtn{width:44px;height:44px;border-radius:14px;background:var(--c1l);box-shadow:none}
.k-say .ibtn svg{width:24px;height:24px}

/* ---- tutorial hand ---- */
.k-hand{position:fixed;left:0;top:0;z-index:85;width:74px;height:74px;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.k-hand svg{width:100%;height:100%}

/* ---- decorative ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:50%;height:150%;left:15%;bottom:20%}
.k-cloud::after{width:38%;height:120%;right:14%;bottom:25%}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-panel{0%{transform:scale(.88) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-glow{0%,100%{box-shadow:0 7px 0 var(--bd),0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 7px 0 var(--bd),0 0 0 10px rgba(255,255,255,.55)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-22%) scale(.94,1.08)}75%{transform:translateY(0) scale(1.06,.94)}}
@keyframes k-float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-22px)}}
@keyframes k-drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-wiggle{animation:k-wiggle .5s ease-in-out}
.k-shake{animation:k-shake .45s ease-in-out}
.k-jump{animation:k-jump .6s cubic-bezier(.3,1.4,.5,1)}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3s ease-in-out infinite}
.k-blink{transform-box:fill-box;transform-origin:50% 50%;animation:k-blink 4.4s infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.btn.glow,.k-breathe{animation:none!important}}
</style>
<style>
:root{--c1:#8a63f0;--c1d:#6541cf;--c1l:#efe8ff;--c2:#ff6fa5;--c2d:#d9467f;--ink:#3c2f66;--ink-soft:#7a6c9e}
body{background:
  radial-gradient(ellipse 80% 50% at 50% 112%,rgba(255,255,255,.7),transparent 70%),
  linear-gradient(170deg,#c6f2e3 0%,#d8e8ff 50%,#eedfff 100%)}
@media (max-width:370px){.k-bar [data-k="full"]{display:none}}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco i{position:absolute;bottom:-70px;display:block;opacity:.55;animation:drift linear infinite}
.deco i.c{border-radius:50%}.deco i.s{border-radius:24%}
.deco i.t{clip-path:polygon(50% 4%,96% 92%,4% 92%)}
.deco i.h{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.deco i.r{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes drift{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-125vh) rotate(300deg)}}
.screen{z-index:1}
#play .k-play{z-index:1}

/* ---------- owl ---------- */
.owl{display:block;overflow:visible}
.owl .ob{transform-box:view-box;transform-origin:100px 208px}
.owl .obr{transform-box:view-box;transform-origin:100px 208px;animation:k-breathe 3.4s ease-in-out infinite}
.owl .head{transform-box:view-box;transform-origin:100px 132px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.owl .eyes{transform-box:view-box;transform-origin:100px 94px;animation:k-blink 4.3s infinite;transition:opacity .12s}
.owl .pupils{transition:transform .18s ease-out}
.owl .wL{transform-box:view-box;transform-origin:42px 108px}
.owl .wR{transform-box:view-box;transform-origin:158px 108px}
.owl .tassel{transform-box:view-box;transform-origin:136px 34px;animation:tassel 2.8s ease-in-out infinite}
.owl .beak{transform-box:view-box;transform-origin:100px 110px}
@keyframes tassel{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.owl .hap,.owl .brows{opacity:0;transition:opacity .15s}
.owl.happy .hap{opacity:1}.owl.happy .eyes{opacity:0}
.owl.hmm .brows{opacity:1}.owl.hmm .head{transform:rotate(-9deg)}
.owl.think .head{transform:rotate(7deg)}

/* ---------- token (symbol sticker) ---------- */
.tok{position:absolute;inset:8%;border-radius:50%;background:var(--t);display:grid;place-items:center;overflow:visible}
.tok .emo{font-size:var(--ef,30px);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.tok svg{width:82%;height:82%}

/* ---------- title ---------- */
#title{gap:clamp(2px,1.2vmin,12px);padding:calc(var(--bar-h) + 2px) 16px calc(16px + var(--safe-b))}
.t-hero{position:relative;width:clamp(190px,min(80vw,40vh),400px)}
.t-hero .owl{width:78%;height:auto;margin-left:22%;cursor:pointer}
.t-card{position:absolute;left:0;bottom:4%;width:46%;aspect-ratio:1;background:#fff;border-radius:18%;padding:5%;display:grid;grid-template-columns:repeat(3,1fr);gap:5%;
  box-shadow:0 8px 0 rgba(80,50,160,.14),0 14px 24px rgba(80,50,160,.14);transform:rotate(-9deg);animation:cardBob 3.6s ease-in-out infinite}
@keyframes cardBob{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-6px)}}
.t-card .tc{position:relative;border-radius:24%;background:#f3eeff}
.t-card .tc .tok{inset:6%}
.t-card .tc.q{background:#fff;box-shadow:inset 0 0 0 3px #d9cdfa}
.t-card .tc.q .tok{animation:qpop 3.2s ease-in-out infinite}
@keyframes qpop{0%,35%{transform:translateY(-120%) scale(.6);opacity:0}50%{transform:translateY(-30%) scale(1.15);opacity:1}62%,88%{transform:none;opacity:1}100%{transform:none;opacity:0}}
.t-txt{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vmin,22px)}
.k-logo{--c1d:#5b3cc4}
.k-logo .l1{color:#fff}.k-logo .l2{color:#ffd23f;font-size:1.12em}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:16px}
.t-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.qmark{display:inline-grid;place-items:center;width:1.2em;height:1.2em;border-radius:50%;background:var(--c1);color:#fff;font-size:.9em;line-height:1}
@media (min-aspect-ratio:6/5){
  #title{flex-direction:row;gap:5vw}
  .t-hero{width:min(60vh,440px)}
}

/* ---------- select ---------- */
#select{justify-content:center;gap:clamp(6px,1.6vmin,14px);padding:calc(var(--bar-h) + 4px) 14px calc(12px + var(--safe-b))}
.shelves{display:flex;flex-direction:column;gap:clamp(8px,1.8vmin,16px);width:min(max(880px,58vw),1180px,100%)}
.shelf{display:flex;align-items:stretch;gap:clamp(8px,1.4vmin,12px);background:rgba(255,255,255,.5);border-radius:28px;padding:clamp(6px,1.1vmin,10px)}

/* ---------- play ---------- */
.pbg{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.85;transition:opacity .5s}
.pbg.fade{opacity:0;transition:none}
.pbg[data-th="fruit"]{background:radial-gradient(ellipse 90% 60% at 50% 110%,rgba(255,255,255,.7),transparent 70%),linear-gradient(170deg,#ffe8c4 0%,#ffdcd6 55%,#ffd3e6 100%)}
.pbg[data-th="pet"]{background:radial-gradient(ellipse 90% 60% at 50% 110%,rgba(255,255,255,.7),transparent 70%),linear-gradient(170deg,#e3f8cf 0%,#f1f8cf 50%,#fff1c9 100%)}
.pbg[data-th="shape"]{background:radial-gradient(ellipse 90% 60% at 50% 110%,rgba(255,255,255,.7),transparent 70%),linear-gradient(170deg,#d9e7ff 0%,#e6e0ff 50%,#f3dcff 100%)}
.pbg[data-th="car"]{background:radial-gradient(ellipse 90% 60% at 50% 110%,rgba(255,255,255,.7),transparent 70%),linear-gradient(170deg,#cdeeff 0%,#dcecff 55%,#eef0d8 100%)}
.pbg[data-th="sweet"]{background:radial-gradient(ellipse 90% 60% at 50% 110%,rgba(255,255,255,.7),transparent 70%),linear-gradient(170deg,#ffe0ef 0%,#ffe6f3 45%,#fff0d4 100%)}
.pbg[data-th="sea"]{background:radial-gradient(ellipse 90% 60% at 50% 110%,rgba(255,255,255,.6),transparent 70%),linear-gradient(170deg,#c4ecff 0%,#c6efef 55%,#d4f5e2 100%)}
.pv{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;overflow:visible}
.board{position:absolute;border-radius:calc(var(--cs,60px)*.34);background:#fff;
  box-shadow:0 0 0 calc(var(--cs,60px)*.05) rgba(255,255,255,.9),0 9px 0 rgba(80,50,160,.16),0 20px 36px rgba(80,50,160,.16)}
.board.in{animation:boardIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes boardIn{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
.boxbg{position:absolute;border-radius:calc(var(--cs,60px)*.26);background:var(--bx,#f1ebff)}
.cell{position:absolute;width:var(--cs);height:var(--cs);border-radius:calc(var(--cs)*.24);background:#fff;--ef:calc(var(--cs)*.56);
  box-shadow:inset 0 calc(var(--cs)*-.05) 0 rgba(90,60,170,.09),0 1px 0 rgba(90,60,170,.06);cursor:pointer;touch-action:none;transition:background .2s,box-shadow .2s}
.cell::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;transition:background .2s,box-shadow .2s}
.cell.emp::after{content:"";position:absolute;inset:24%;border-radius:50%;border:calc(var(--cs)*.045) dashed #ddd2fa;pointer-events:none;transition:border-color .2s}
.cell.giv{background:rgba(255,255,255,.35);box-shadow:none}
.giv .tok{inset:6%;box-shadow:inset 0 calc(var(--cs)*-.05) 0 rgba(0,0,0,.07)}
.usr .tok,.hnt .tok{box-shadow:0 0 0 calc(var(--cs)*.045) #fff,0 calc(var(--cs)*.06) 0 rgba(60,40,120,.2)}
.hnt .tok{box-shadow:0 0 0 calc(var(--cs)*.045) #ffe27a,0 calc(var(--cs)*.06) 0 rgba(160,110,0,.25)}
.pin{position:absolute;right:4%;top:4%;width:17%;height:17%;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff7cf 0 18%,#ffc93c 46%,#d99400);box-shadow:0 1px 1px rgba(0,0,0,.2);pointer-events:none}
.cell.peer::before{background:rgba(255,213,74,.28)}
.cell.peer.emp::after{border-color:#f3cf6c}
.cell.sel{z-index:2}
.cell.sel::before{background:rgba(255,213,74,.5);box-shadow:inset 0 0 0 calc(var(--cs)*.07) var(--c1);animation:selp 1.1s ease-in-out infinite}
.cell.sel.emp::after{border-color:var(--c1)}
@keyframes selp{0%,100%{box-shadow:inset 0 0 0 calc(var(--cs)*.07) var(--c1)}50%{box-shadow:inset 0 0 0 calc(var(--cs)*.07) var(--c1),0 0 0 calc(var(--cs)*.08) rgba(138,99,240,.35)}}
.cell.same .tok{box-shadow:0 0 0 calc(var(--cs)*.06) #fff,0 0 0 calc(var(--cs)*.12) var(--td),0 calc(var(--cs)*.06) 0 rgba(60,40,120,.2)}
.cell.bad::before{background:rgba(255,95,95,.2);box-shadow:inset 0 0 0 calc(var(--cs)*.06) #ff6b6b}
.cell.bad .tok{box-shadow:0 0 0 calc(var(--cs)*.045) #fff,0 0 0 calc(var(--cs)*.1) #ff6b6b}
.cell.hot::before{background:rgba(138,99,240,.25);box-shadow:inset 0 0 0 calc(var(--cs)*.07) var(--c1)}
.cell.dead.emp::after{border-color:#ff9a3c;animation:k-pulse .9s ease-in-out infinite}
.cell.glow .tok{animation:cglow .8s ease-out}
@keyframes cglow{0%{filter:brightness(1)}30%{filter:brightness(1.25) drop-shadow(0 0 calc(var(--cs)*.12) #ffe27a)}100%{filter:none}}
.hflash{position:absolute;border-radius:calc(var(--cs,60px)*.28);pointer-events:none;opacity:0;background:rgba(255,107,107,.16);box-shadow:inset 0 0 0 4px rgba(255,107,107,.75)}
.hflash.on{animation:hfl 1.6s ease}
@keyframes hfl{0%{opacity:0}12%,70%{opacity:1}100%{opacity:0}}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-radius:50%}
.ghost .tok{inset:0;box-shadow:0 0 0 4px #fff,0 14px 24px rgba(60,40,120,.3)}

.owlbox{position:absolute;z-index:5;cursor:pointer;touch-action:none}
.owlbox .owl{width:100%;height:100%}
.info{position:absolute;z-index:4;pointer-events:none}
.pill{position:absolute;inset:0;margin:auto;height:max-content;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px 6px 6px;
  box-shadow:0 4px 0 rgba(80,50,160,.12);max-width:100%;transition:opacity .25s,transform .25s;width:max-content}
.pill.hide{opacity:0;transform:scale(.85)}

.pill .pic .tok{inset:0;--ef:22px}
.pbar{position:relative;flex:1 1 auto;width:clamp(50px,12vw,110px);height:14px;border-radius:999px;background:#eee7fd;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#7fe0b4,#3fcf9e);transition:width .4s cubic-bezier(.3,1.3,.5,1)}
.pill .st{flex:0 0 auto}
.info.r .pill{margin-right:0}.info.l .pill{margin-left:0}
.bubble{position:absolute;top:50%;max-width:100%;background:#fff;border-radius:20px;padding:8px 14px;font-weight:800;color:var(--ink);font-size:var(--bf,18px);line-height:1.15;
  box-shadow:0 5px 0 rgba(80,50,160,.13),0 10px 20px rgba(80,50,160,.1);opacity:0;transform:translateY(-50%) scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.2,1.6,.4,1);width:max-content}
.bubble.on{opacity:1;transform:translateY(-50%) scale(1)}
.info.r .bubble{right:10px;transform-origin:100% 50%}
.info.l .bubble{left:10px;transform-origin:0 50%}
.bubble::after{content:"";position:absolute;top:50%;width:16px;height:16px;background:#fff;transform:translateY(-50%) rotate(45deg);border-radius:3px}
.info.r .bubble::after{right:-6px}.info.l .bubble::after{left:-6px}

.tray{position:absolute;display:grid;justify-content:center;align-content:center;z-index:3}
.tbtn{position:relative;width:var(--tb);height:var(--tb);border:none;border-radius:calc(var(--tb)*.28);background:#fff;padding:0;cursor:pointer;touch-action:none;--ef:calc(var(--tb)*.45);
  box-shadow:0 calc(var(--tb)*.07) 0 rgba(80,50,160,.16),0 calc(var(--tb)*.12) calc(var(--tb)*.2) rgba(80,50,160,.1);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s}
.tbtn .tok{inset:8% 17% 26%;box-shadow:0 calc(var(--tb)*.03) 0 rgba(0,0,0,.08)}
.tbtn:active{transform:translateY(3px)}
.tbtn.on{transform:translateY(-7px) scale(1.06);box-shadow:0 0 0 calc(var(--tb)*.06) var(--td,var(--c1)),0 calc(var(--tb)*.14) calc(var(--tb)*.2) rgba(80,50,160,.25)}
.tbtn.on .tok{animation:k-wiggle .8s ease-in-out infinite}
.tbtn .dots{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:center;gap:3px;height:9px}
.tbtn .dots i{width:calc(var(--tb)*.085);height:calc(var(--tb)*.085);max-width:9px;max-height:9px;border-radius:50%;background:var(--td)}
.tbtn .ck{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#35c46a;color:#fff;display:none;place-items:center;box-shadow:0 2px 0 #1f9a4d}
.tbtn .ck svg{width:18px;height:18px}
.tbtn.full .ck{display:grid}
.tbtn.full .tok{opacity:.55}
.tbtn.er{--td:#ff8fb8;background:#fff6fa}
.tbtn.er svg.era{position:absolute;inset:12%;width:76%;height:76%}
.tbtn.inv{animation:inv .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes inv{0%,100%{transform:none}40%{transform:translateY(-9px) scale(1.06)}}
.banner{position:absolute;z-index:6;pointer-events:none;left:0;top:0;transform:translate(-50%,-50%);opacity:0}
.banner.go{animation:ban 1.7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}28%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.banner .bn{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 22px 8px 8px;font-weight:800;font-size:clamp(22px,4.4vmin,40px);color:var(--c1d);white-space:nowrap;
  box-shadow:0 7px 0 rgba(80,50,160,.16),0 16px 30px rgba(80,50,160,.2)}
.banner .bn .pic{position:relative;width:1.8em;height:1.8em}
.banner .bn .pic .tok{inset:0;--ef:1.1em}
.hintb{color:#e0a100}
.hintb svg{width:32px;height:32px}
.hintb.glow{animation:hglow 1.2s ease-in-out infinite}
@keyframes hglow{0%,100%{box-shadow:0 5px 0 rgba(30,40,90,.16),0 0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 5px 0 rgba(30,40,90,.16),0 0 0 10px rgba(255,210,63,.65)}}
.hintb .badge{background:#ffb02e!important;box-shadow:0 2px 0 #d98a00!important}

/* ---------- help overlay ---------- */
.helpp{width:min(600px,94vw)}
.helpp h2{margin-bottom:8px}
.hg{display:flex;justify-content:center;gap:clamp(10px,3vmin,22px)}

.hrw{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:12px}

.hr .mk{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 auto;transform:scale(0);transition:transform .4s cubic-bezier(.2,1.8,.4,1)}
.hr .mk svg{width:28px;height:28px}
.hr.ok .mk{background:#35c46a}.hr.no .mk{background:#ff6b6b}
.hr.lit .mk{transform:scale(1)}

.hcells{display:flex;gap:6px}

@media (max-height:520px){

}

/* ---------- collection ---------- */
#coll{justify-content:flex-start;padding:calc(var(--bar-h) + 4px) 12px calc(10px + var(--safe-b));gap:8px}

.cth{background:rgba(255,255,255,.72);border-radius:26px;padding:8px 10px 10px;box-shadow:0 4px 0 rgba(80,50,160,.08)}

.cgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.stk{position:relative;aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;min-width:0}

.acount{font-weight:800;color:var(--c1d);background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 rgba(80,50,160,.12);font-size:clamp(16px,2.6vmin,20px);white-space:nowrap}

.rw .mt .tok{inset:0;box-shadow:0 0 0 3px #fff,0 3px 6px rgba(0,0,0,.15)}
@media (max-height:500px){
  .k-panel.sres{margin-top:34px;padding-top:12px;padding-bottom:12px}

}
@media (prefers-reduced-motion:reduce){.deco i,.t-card{animation:none!important}}

<script>/* ===== BéVui Kit 5 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  if (dead.length) {
    dead.forEach(i => S.cells[i].classList.add('dead'));
    if (!S.stuck) { S.stuck = true; owlMood(owls.pOwl, 'hmm', 2200); owlSay('Ô này không còn hình nào hợp. Bé đổi thử một hình, hoặc bấm bóng đèn nhé!'); hintGlow(true); }
  } else S.stuck = false;
}

/* ---- drag & tap bindings ---- */
function cellAt(x, y) { for (let i = 0; i < S.cells.length; i++) if (Kit.inRect(x, y, S.cells[i].getBoundingClientRect(), S.cs * 0.04)) return i; return -1; }
function makeGhost(v) {
  const g = el('div', 'ghost', v === ERASE ? `<div class="tok" style="--t:#fff6fa">${ERASER_SVG}</div>` : tokHTML(S.syms[v]));
  const z = S.cs * 1.08;
  Object.assign(g.style, { width: z + 'px', height: z + 'px' }); g.style.setProperty('--ef', S.cs * 0.55 + 'px');
  $('#pv').appendChild(g); g._z = z; return g;
}
function moveGhost(g, x, y) { g.style.transform = `translate(${x - g._z / 2}px,${y - g._z * 0.62}px) scale(1.08)`; }
function setHot(k) { S.cells.forEach((c, i) => c.classList.toggle('hot', i === k)); }
function bindDrag(node, o) {
  let moved = false, ghost = null, v = null;
  Kit.drag(node, {
    can: () => !S.busy && !S.done && Kit.screen === 'play',
    start() { moved = false; v = null; Kit.hand.hide(); },
    move(e, i) {
      if (!moved && Math.hypot(i.dx, i.dy) < 10) return;
      if (!moved) {
        v = o.value(); if (v == null) return;
        moved = true; Kit.sfx.pick(); ghost = makeGhost(v); o.lift && o.lift(true);
        S.sel = -1; refreshHL(); touchIdle();
      }
      moveGhost(ghost, e.clientX, e.clientY);
      const k = cellAt(e.clientX, e.clientY);
      setHot(k >= 0 && !fixedCell(k) ? k : -1);
    },
    end(e, i) {
      setHot(-1);
      if (!moved) { if (!i.cancel) o.tap(); return; }
      const gr = ghost.getBoundingClientRect(); ghost.remove(); ghost = null; o.lift && o.lift(false);
      if (S.busy || S.done) return;
      const k = i.cancel ? -1 : cellAt(e.clientX, e.clientY);
      o.drop(k, v, gr);
    }
  });
}
function bindCell(c, i) {
  bindDrag(c, {
    value: () => (S.val[i] >= 0 && !fixedCell(i)) ? S.val[i] : null,
    lift: on => { const t = cellTok(i); if (t) t.style.opacity = on ? '.25' : ''; },
    tap: () => tapCell(i),
    drop: (k, v, gr) => {
      if (k === i) { Kit.sfx.drop(); popTok(i, gr); return; }
      if (k < 0) {
        const bd = $('#board').getBoundingClientRect();
        if (gr && !Kit.inRect(gr.left + gr.width / 2, gr.top + gr.height / 2, bd, 0)) { clearCell(i); return; }
        Kit.sfx.swish(); popTok(i, gr); return;
      }
      if (fixedCell(k)) { nope(k); Kit.sfx.swish(); popTok(i, gr); return; }
      S.val[i] = -1; renderCell(i);
      if (!place(k, v, { from: gr })) afterChange(i);
    }
  });
}
function bindTray(b, v) {
  bindDrag(b, {
    value: () => v,
    tap: () => tapTray(v),
    drop: (k, val, gr) => {
      if (k < 0) { Kit.sfx.swish(); return; }
      if (val === ERASE) { if (!fixedCell(k) && S.val[k] >= 0) clearCell(k); else nope(k); return; }
      if (fixedCell(k)) { nope(k); Kit.sfx.swish(); return; }
      place(k, val, { from: gr });
    }
  });
}

/* ---- hint ---- */
function easyCell() {
  let bestI = -1, bestC = 99;
  for (let i = 0; i < S.val.length; i++) {
    if (S.val[i] >= 0) continue;
    const m = candMask(S.G, S.val, i), c = popc(m);
    const score = c === 1 && bitv(m) === S.sol[i] ? 0 : c === 0 ? 50 : c + (m >> S.sol[i] & 1 ? 0 : 10);
    if (score < bestC || (score === bestC && Math.random() < .4)) { bestC = score; bestI = i; }
  }
  return bestI;
}
function useHint() {
  if (S.busy || S.done || Kit.screen !== 'play') return;
  touchIdle(); Kit.hand.hide();
  const wrong = S.val.map((v, i) => i).filter(i => !fixedCell(i) && S.val[i] >= 0 && S.val[i] !== S.sol[i]);
  let i, fix = false;
  if (wrong.length) { i = wrong.find(j => S.conf.has(j)); if (i == null) i = wrong[0]; fix = true; }
  else i = easyCell();
  if (i == null || i < 0) return;
  S.hints++; S.sel = -1; S.brush = -1; updTray(); updPill();
  S.busy = true;
  const tok = S.tok, hb = $('.k-bar .hintb');
  const from = hb ? hb.getBoundingClientRect() : null;
  Kit.sfx.sparkle();
  owlMood(owls.pOwl, 'think', 1200);
  const c = Kit.center(S.cells[i]); owlLookAt(owls.pOwl, c.x, c.y);
  S.cells[i].classList.add('sel');
  owlSay(fix ? 'Hình này chưa đúng chỗ, Cú đổi giúp bé nhé!' : 'Cú giúp bé một ô nhé!');
  setTimeout(() => {
    if (tok !== S.tok) return;
    if (fix) { S.hnt[i] = false; clearCell(i, { quiet: true }); }
    S.val[i] = S.sol[i]; S.hnt[i] = true;
    renderCell(i); popTok(i, from);
    note(S.val[i]); Kit.sfx.star();
    setTimeout(() => { if (tok === S.tok) Kit.burst(c.x, c.y, { n: 14, colors: ['#ffe27a', '#ffd23d', '#fff', '#ffb02e'], shape: 'star', speed: 6 }); }, 300);
    S.busy = false;
    afterChange(i, { hint: true });
  }, 650);
}
function toggleConf(btn) {
  showConf = !showConf; store.set('conf', showConf);
  btn.innerHTML = showConf ? Kit.icon('eye') : EYE_OFF; btn.classList.toggle('off', !showConf);
  btn.setAttribute('aria-label', showConf ? 'Tắt gợi ý trùng' : 'Bật gợi ý trùng');
  refreshHL(); Kit.sfx.click();
  Kit.toast(showConf ? '👁 Bật gợi ý trùng' : '🙈 Tắt gợi ý trùng');
}

/* ---- tutorial & idle ---- */
function startTut() {
  if (S.done || Kit.screen !== 'play') return;
  const i = easyCell(); if (i < 0) return;
  S.tut = 1; S.tutCell = i;
  const c = Kit.center(S.cells[i]); Kit.hand.tap(c.x, c.y);
  if (!Kit.speaking()) owlSay('Bé chạm vào ô trống này nhé!');
}
function tutHandSymbol() {
  if (S.tut !== 2 || S.sel < 0 || S.done) return;
  const b = trayBtn(S.sol[S.sel]); if (!b) return;
  const c = Kit.center(b); Kit.hand.tap(c.x, c.y);
  owlSay('Rồi chọn hình đúng ở đây!');
}
function tutHandCellFor(v) {
  if (S.tut !== 3 || S.done) return;
  const cands = S.val.map((x, i) => i).filter(i => S.val[i] < 0 && S.sol[i] === v);
  if (!cands.length) return;
  const i = cands.find(j => popc(candMask(S.G, S.val, j)) === 1) ?? cands[0];
  const c = Kit.center(S.cells[i]); Kit.hand.tap(c.x, c.y);
}
function touchIdle() {
  clearTimeout(S.idleT); clearTimeout(S.idleT2); hintGlow(S.stuck);
  const tok = S.tok;
  const ok = () => tok === S.tok && !S.busy && !S.done && Kit.screen === 'play' && !$('.k-ov');
  S.idleT = setTimeout(() => {
    if (!ok()) return;
    hintGlow(true);
    const hb = $('.k-bar .hintb'); if (hb) { const c = Kit.center(hb); owlLookAt(owls.pOwl, c.x, c.y); }
    owlMood(owls.pOwl, 'think', 1500); hoot();
  }, 16000);
  S.idleT2 = setTimeout(() => {
    if (!ok()) return;
    const i = easyCell(); if (i < 0) return;
    const c = Kit.center(S.cells[i]); Kit.hand.tap(c.x, c.y, { times: 3 });
    owlSay('Bé thử ô này xem!');
  }, 26000);
}

/* ---- win ---- */
function win() {
  S.done = true; S.busy = true; S.sel = -1; S.brush = -1; S.tut = 0; S.winAt = performance.now(); S.resAt = 0;
  clearTimers(); Kit.hand.hide(); updTray(); refreshHL();
  const tok = S.tok, L = S.lv, N = S.N, stars = starsNow();
  // save
  if ((best[L.id] || 0) < stars) { best[L.id] = stars; store.set('best', best); }
  wins[L.id] = (wins[L.id] || 0) + 1; store.set('wins', wins);
  const fresh = S.syms.filter(s => !stickers.has(s.id));
  fresh.forEach(s => stickers.add(s.id)); store.set('stk', [...stickers]);
  owlMood(owls.pOwl, 'happy', 4000); owlFlap(owls.pOwl, 3);
  Kit.sfx.great();
  const D = 2 * N - 1, step = N === 6 ? 80 : 110;
  for (let d = 0; d < D; d++) {
    setTimeout(() => {
      if (tok !== S.tok) return;
      note(d % 8);
      S.cells.forEach((c, i) => {
        if (Math.floor(i / N) + i % N !== d) return;
        c.animate([{ transform: 'none' }, { transform: 'translateY(0) scale(1.1,.88)', offset: .15 }, { transform: 'translateY(-34%) scale(.94,1.08)', offset: .45 }, { transform: 'scale(1.06,.94)', offset: .78 }, { transform: 'none' }], { duration: 560, easing: 'ease-out' });
        if (Math.random() < .5) { const p = Kit.center(c); Kit.sparkle(p.x, p.y, { n: 3, spread: S.cs * 0.3 }); }
      });
    }, 200 + d * step);
  }
  const tWave = 200 + D * step + 500;
  setTimeout(() => {
    if (tok !== S.tok) return;
    S.cells.forEach((c, i) => setTimeout(() => { if (tok === S.tok) Kit.restart(c, 'glow'); }, (i % N) * 30));
    Kit.confetti(); Kit.sfx.fanfare(); owlHop(owls.pOwl, 26);
  }, tWave);
  setTimeout(() => { if (tok === S.tok) showResult(stars, fresh); }, tWave + 1300);
}
function showResult(stars, fresh) {
  S.resAt = performance.now();
  const L = S.lv, N = S.N, idx = LEVELS.indexOf(L), nextL = LEVELS[idx + 1];
  const titles = ['', 'Hay quá!', 'Giỏi lắm!', 'Xuất sắc!'];
  const text = S.hints ? `Bé dùng ${S.hints} gợi ý` : 'Bé tự xếp, không cần gợi ý!';
  const reward = fresh.length
    ? { emoji: fresh.slice(0, 4).map(s => `<span class="mt">${tokHTML(s)}</span>`).join(''), label: `+${fresh.length} hình dán mới` }
    : { emoji: '🏆', label: `Đã xếp ${wins[L.id]} bảng ${N}×${N} ${L.name.toLowerCase()}` };
  const buttons = [{ label: 'Màn tiếp', icon: 'next', cls: 'ok', onClick: () => startBoard(L.id) }];
  if (nextL && stars >= 2) buttons.push({ label: 'Khó hơn', icon: 'trophy', cls: 'purple', onClick: () => startBoard(nextL.id) });
  buttons.push({ label: 'Chọn bảng', icon: 'grid', cls: 'white', onClick: () => leavePlay() });
  Kit.result({ cls: 'sres', hero: owlSVG('rOwl', 'happy'), title: titles[stars], stars, text, reward, say: `${titles[stars]} Bé được ${stars} sao!` + (fresh.length ? ` Bé nhận ${fresh.length} hình dán mới!` : ''), buttons });
  const ro = $('#rOwl'); if (ro) { Kit.follow($('.pupils', ro), { r: 5, ref: $('.eyes', ro) }); setTimeout(() => { owlFlap(ro, 3); owlHop(ro, 16); }, 500); setTimeout(() => ro.classList.remove('happy'), 2600); }
  const rw = $('.k-reward .emo'); if (rw && fresh.length) rw.classList.add('rw');
}

/* ================= help overlay (picture demo of the rule) ================= */
function helpGrid(kind) {
  const P = 5, g = 3.4, cs = (100 - 2 * P - 3 * g) / 4;
  let s = `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="16" fill="#fff"/>`;
  for (let R = 0; R < 4; R += 2) for (let C = 0; C < 4; C += 2) s += `<rect x="${P + C * (cs + g) - g / 2 + .6}" y="${P + R * (cs + g) - g / 2 + .6}" width="${2 * (cs + g) - 1.2}" height="${2 * (cs + g) - 1.2}" rx="6" fill="${(R / 2 + C / 2) % 2 ? '#e2f6ee' : '#efe8ff'}"/>`;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const on = kind === 'row' ? r === 1 : kind === 'col' ? c === 2 : (r < 2 && c < 2);
    s += `<rect x="${P + c * (cs + g)}" y="${P + r * (cs + g)}" width="${cs}" height="${cs}" rx="${cs * .26}" fill="${on ? '#ffd54a' : '#fff'}"/>`;
    if (on) s += `<circle cx="${P + c * (cs + g) + cs / 2}" cy="${P + r * (cs + g) + cs / 2}" r="${cs * .3}" fill="${HUE_DK[[0, 5, 2, 3][(r * 2 + c) % 4]]}"/>`;
  }
  return s + '</svg>';
}
let helpOpen = null;
function showHelp(onDone) {
  if (helpOpen) return;
  const th = S.theme && Kit.screen === 'play' ? S.theme : THEMES[0];
  const sy = S.syms && S.syms.length >= 3 && Kit.screen === 'play' ? S.syms : th.syms;
  const a = sy[0], b = sy[1], c = sy[2], d = sy[3] || th.syms.find(x => ![a, b, c].includes(x));
  const okRow = [a, b, c, d], noRow = [a, b, a, d];
  const html = `<h2>Cách chơi</h2><div class="hbody">
    <div class="hg">${['row', 'col', 'box'].map((k, i) => `<div class="hgi" data-k="${i}">${helpGrid(k)}<b>${['Hàng', 'Cột', 'Ô vuông'][i]}</b></div>`).join('')}</div>
    <div class="hrw"><div class="hr ok"><span class="mk">${Kit.icon('check')}</span><div class="hcells">${okRow.map(s => `<div class="hc">${tokHTML(s)}</div>`).join('')}</div></div>
    <div class="hr no"><span class="mk">${CROSS}</span><div class="hcells">${noRow.map((s, k) => `<div class="hc${k === 0 || k === 2 ? ' dup' : ''}">${tokHTML(s)}</div>`).join('')}</div></div></div></div>
    <div class="k-btns"><button class="btn ok big" id="hGo">${Kit.icon('check')}<span>Chơi thôi!</span></button></div>`;
  let finished = false;
  const done = skip => { if (finished) return; finished = true; helpOpen = null; stopList(); Kit.stopSpeech(); if (!skip && onDone) onDone(); };
  const m = Kit.overlay(html, { cls: 'helpp', closable: true, onClose: () => done() });
  helpOpen = { m, done };
  $('#hGo', m.panel).addEventListener('click', () => m.close());
  const P = m.panel, gi = $$('.hgi', P), ok = $('.hr.ok', P), no = $('.hr.no', P);
  const stopList = Kit.sayList(['Mỗi hàng,', 'mỗi cột,', 'mỗi ô vuông lớn,', 'chỉ có một hình giống nhau thôi!', 'Hai hình giống nhau là chưa được nhé!'], {
    rate: .92, gap: 160, silentMs: 1150,
    onEach: i => {
      if (finished) return;
      if (i < 3) { gi.forEach((g, k) => g.classList.toggle('on', k === i)); Kit.sfx.pop(); }
      else if (i === 3) { gi.forEach(g => g.classList.add('on')); ok.classList.add('lit'); $$('.tok', ok).forEach((t, k) => setTimeout(() => { if (!finished) { t.animate([{ transform: 'none' }, { transform: 'translateY(-22%) scale(1.1)' }, { transform: 'none' }], { duration: 380 }); note(k); } }, k * 140)); }
      else { no.classList.add('lit'); $$('.hc.dup .tok', no).forEach(t => t.animate([{ transform: 'none' }, { transform: 'rotate(-14deg)' }, { transform: 'rotate(12deg)' }, { transform: 'rotate(-8deg)' }, { transform: 'none' }], { duration: 600, iterations: 2 })); Kit.sfx.wobble(); }
    },
    onend: () => { if (!finished) Kit.restart($('#hGo', P), 'k-jump'); }
  });
}

/* ================= collection ================= */
function renderColl() {
  const st = $('#cstats'); st.innerHTML = '';
  [3, 4, 6].forEach(n => {
    const c = LEVELS.filter(l => l.n === n).reduce((a, l) => a + (wins[l.id] || 0), 0);
    st.insertAdjacentHTML('beforeend', `<div class="cst">${miniBoard(n, Math.round(n * n * .4), n * 5)}<span>${c} <small>bảng ${n}×${n}</small></span></div>`);
  });
  const sh = $('#cshelf'); sh.innerHTML = ''; sh.scrollTop = 0;
  THEMES.forEach(th => {
    const got = th.syms.filter(s => stickers.has(s.id)).length;
    const card = el('div', 'cth', `<h3><span class="pic">${tokHTML(th.icon)}</span>${th.name}<small>${got}/${th.syms.length}</small></h3><div class="cgrid"></div>`);
    th.syms.forEach(s => {
      const on = stickers.has(s.id), b = el('button', 'stk' + (on ? '' : ' no'), tokHTML(s));
      b.setAttribute('aria-label', on ? s.name : 'chưa có');
      b.addEventListener('click', () => {
        if (!on) { Kit.sfx.bad(); Kit.restart(b, 'k-shake'); Kit.toast(`Xếp bảng ${th.name.toLowerCase()} để nhận hình này nhé!`); return; }
        Kit.restart(b, 'jump'); note(s.k); const c = Kit.center(b); Kit.sparkle(c.x, c.y, { n: 6, spread: 26 }); Kit.say(s.name);
      });
      $('.cgrid', card).appendChild(b);
    });
    sh.appendChild(card);
  });
  Kit.bar.setMid(`<span class="acount">⭐ ${stickers.size}/${ALL_SYMS.length}</span>`);
}
Kit.onScreen('coll', { enter() { renderColl(); Kit.music.start('gentle'); } });

/* ================= play screen hooks ================= */
Kit.onScreen('play', {
  enter() {
    const hb = Kit.bar.addButton({ html: BULB + '<span class="badge hidden">0</span>', label: 'Gợi ý', cls: 'hintb', onClick: () => useHint() });
    void hb;
    const eb = Kit.bar.addButton({ html: showConf ? Kit.icon('eye') : EYE_OFF, label: showConf ? 'Tắt gợi ý trùng' : 'Bật gợi ý trùng', cls: 'eyeb' + (showConf ? '' : ' off'), onClick: () => toggleConf(eb) });
  },
  leave() { clearTimers(); Kit.hand.hide(); }
});

/* ================= keyboard (desktop): arrows move, 1..N place, Backspace/Delete/0 erase ================= */
document.addEventListener('keydown', e => {
  if (Kit.screen !== 'play' || S.busy || S.done || $('.k-ov') || !S.N) return;
  const N = S.N, k = e.key;
  if (/^Arrow/.test(k)) {
    e.preventDefault();
    let i = S.sel >= 0 ? S.sel : S.val.findIndex((v, j) => v < 0 && !fixedCell(j));
    if (i < 0) i = 0;
    else if (S.sel >= 0) { let r = Math.floor(i / N), c = i % N; if (k === 'ArrowUp') r = (r + N - 1) % N; if (k === 'ArrowDown') r = (r + 1) % N; if (k === 'ArrowLeft') c = (c + N - 1) % N; if (k === 'ArrowRight') c = (c + 1) % N; i = r * N + c; }
    S.brush = -1; updTray();
    S.sel = i; Kit.sfx.tick(); refreshHL(); touchIdle();
    return;
  }
  const d = parseInt(k, 10);
  if (d >= 1 && d <= N) { e.preventDefault(); if (S.sel >= 0 && fixedCell(S.sel)) { nope(S.sel); return; } tapTray(d - 1); return; }
  if (k === 'Backspace' || k === 'Delete' || k === '0') { e.preventDefault(); if (S.sel >= 0) tapTray(ERASE); }
});

/* ================= debug hooks for tests ================= */
window.GAME_DEBUG = {
  S, LEVELS, THEMES, geo, makePuzzle, countSol, logicSolve, bruteCount, selfCheck, candMask,
  cell: i => `#board .cell[data-i="${i}"]`, tray: v => `#tray .tbtn[data-v="${v === ERASE ? 'x' : v}"]`,
  get empties() { return S.val.map((v, i) => i).filter(i => S.val[i] < 0); },
  get stars() { return starsNow(); }, get showConf() { return showConf; }, get stickers() { return stickers.size; },
};

/* ================= boot ================= */
buildDeco();
buildTitleCard();
mountOwl($('#tHero'), 'tOwl');
mountOwl($('#owlbox'), 'pOwl');
$('#tOwl').addEventListener('pointerdown', () => { const o = owls.tOwl; hoot(); owlFlap(o, 2); owlMood(o, 'happy', 900); owlHop(o, 16); });
$('#owlbox').addEventListener('pointerdown', e => { e.preventDefault(); if (S.busy || S.done) return; hoot(); owlFlap(owls.pOwl, 1); showHelp(); });
$('#bPlay').addEventListener('click', () => Kit.go('select'));
$('#bColl').addEventListener('click', () => Kit.go('coll'));
$('#bHelp').addEventListener('click', () => showHelp());
Kit.go('title');
</script>
