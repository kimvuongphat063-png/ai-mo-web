<!DOCTYPE html>
<html lang="vi" data-game="khacloai">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#18a29a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cái Nào Khác Loại</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Kit Bé Vui 4 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','EmojiOne Color',sans-serif;
  --ink:#3a2e5c; --ink2:#6e6492;
  --c1:#6f5cff; --c1d:#4c3bd6; --c1l:#ebe7ff;
  --c2:#ff6f9f; --c2d:#d94a7c;
  --ok:#35c46a; --okd:#1f9c4f;
  --gold:#ffc83d; --goldd:#de9800;
  --warn:#ff9a52; --warnd:#e06d22;
  --bg1:#bfe3ff; --bg2:#ffe1f0;
  --sh:40,24,90;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:78px;
  --ib:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-noselect{pointer-events:none}

/* ---------- top bar ---------- */
.k-bar{position:absolute;z-index:50;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 10px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-r{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.ibtn{position:relative;width:var(--ib);height:var(--ib);flex:0 0 auto;border:none;border-radius:19px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(var(--sh),.17),0 10px 18px rgba(var(--sh),.10);
  transition:transform .12s ease,box-shadow .12s ease,background .2s,color .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(var(--sh),.17),0 4px 8px rgba(var(--sh),.08)}
.ibtn svg{width:58%;height:58%}
.ibtn.off{color:#b6aecb;background:#f4f1fa}
.ibtn.on{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(var(--sh),.12)}
.ibtn .badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}
.k-bar .k-back{color:var(--c1d)}
@media (max-width:520px),(max-height:520px){
  :root{--ib:48px;--bar-h:66px}
  .ibtn{border-radius:16px}
  .k-bar{gap:7px;padding-top:calc(8px + var(--safe-t));padding-bottom:8px;padding-left:calc(9px + var(--safe-l));padding-right:calc(9px + var(--safe-r))}
  .k-bar .k-r{gap:7px}
}
@media (max-width:359px){ :root{--ib:44px} .k-bar .k-r{gap:5px} }

/* pill for mid-bar info */
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 14px 5px 6px;min-height:44px;
  font-weight:800;font-size:clamp(17px,2.6vmin,22px);color:var(--ink);box-shadow:0 5px 0 rgba(var(--sh),.14);white-space:nowrap;max-width:100%;overflow:hidden}
.k-pill .emo{font-size:26px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--c1l)}
.k-pill svg{width:28px;height:28px;flex:0 0 auto}
.k-dots{display:flex;gap:5px;align-items:center}
.k-dots i{width:12px;height:12px;border-radius:50%;background:#e6e0f3;transition:background .3s,transform .3s}
.k-dots i.on{background:var(--gold);transform:scale(1.15);box-shadow:0 2px 0 var(--goldd)}
.k-dots i.cur{background:var(--c1);transform:scale(1.25)}
@media (max-width:420px){ .k-dots i{width:9px;height:9px} .k-dots{gap:3px} .k-pill{padding:4px 10px 4px 5px;font-size:16px} }

/* ---------- buttons ---------- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.42em;
  font:800 clamp(20px,3.5vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:56px;
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(var(--sh),.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.26);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(var(--sh),.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.2em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.7vmin,22px);min-height:50px}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.orange{--b:var(--warn);--bd:var(--warnd)}
.btn.white{--b:#fff;--bd:#d9d2ee;color:var(--c1d);text-shadow:none}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.round{width:1.9em;height:1.9em;padding:0;border-radius:50%}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.k-play{touch-action:none}
.k-below{position:absolute;left:0;right:0;bottom:0;top:var(--bar-h)}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(46px,10.5vmin,108px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .32em rgba(var(--sh),.28)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.7vmin,23px);color:var(--ink2);margin:.25em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,3.8vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1;
  text-shadow:0 .08em 0 var(--c1d)}

/* level cards (generic) */
.k-grid{display:grid;gap:14px;width:min(1000px,100%);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.k-card{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:14px 10px 12px;box-shadow:0 7px 0 rgba(var(--sh),.16),0 14px 24px rgba(var(--sh),.08);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s;font-weight:800;color:var(--ink);font-size:clamp(16px,2.5vmin,20px);line-height:1.1;text-align:center;min-height:56px}
.k-card:active,.k-card.press{transform:translateY(4px) scale(.98)}
.k-card .emo{font-size:clamp(36px,6.5vmin,54px)}
.k-card small{font-weight:700;color:var(--ink2);font-size:.82em}
.k-card .k-num{position:absolute;top:-10px;left:-6px;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--c2);color:#fff;font:800 19px/34px var(--font);box-shadow:0 3px 0 var(--c2d)}
.k-ministars{display:flex;gap:2px;justify-content:center}
.k-ministars svg{width:clamp(18px,3vmin,24px);height:auto;color:#e7e1f4}
.k-ministars svg.on{color:var(--gold);filter:drop-shadow(0 1px 0 var(--goldd))}

/* ---------- overlay / modal ---------- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:calc(12px + var(--safe-t)) 14px calc(12px + var(--safe-b));touch-action:none}
.k-ov.out{animation:k-fadeout .2s ease forwards}
.k-panel{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:34px;padding:24px 20px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(var(--sh),.14),0 30px 60px rgba(var(--sh),.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain;touch-action:pan-y}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink2);line-height:1.3}
.k-close{position:absolute!important;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-result{overflow:visible;padding-top:20px}
.k-result .k-mascot{width:clamp(96px,20vmin,140px);height:auto;margin:-70px auto 0;display:block;filter:drop-shadow(0 6px 0 rgba(var(--sh),.12))}
.k-result .k-mascot svg{width:100%;height:auto;display:block}
.k-stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:8px 0 2px}
.k-stars svg{width:clamp(56px,11vmin,86px);height:auto;transform:scale(0);color:#e9e4f5;filter:drop-shadow(0 4px 0 rgba(150,110,20,.18))}
.k-stars svg.mid{width:clamp(66px,13vmin,100px)}
.k-stars svg.show{animation:k-star .55s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.on{color:var(--gold)}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#94600a;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both;text-align:left}
.k-reward .emo,.k-reward .k-rw{font-size:46px;width:56px;height:56px;display:grid;place-items:center;animation:k-wiggle 1.2s 1.4s ease-in-out infinite;flex:0 0 auto}
.k-reward .k-rw svg{width:100%;height:100%}
@media (max-height:520px){
  .k-result .k-mascot{width:84px;margin-top:-46px}
  .k-stars svg{width:52px}.k-stars svg.mid{width:62px}
  .k-panel{padding:14px 16px 16px;border-radius:26px}
  .k-panel h2{font-size:30px}
  .k-btns{margin-top:12px}
  .k-reward{margin-top:8px;padding:6px 14px 6px 8px}.k-reward .emo,.k-reward .k-rw{font-size:34px;width:42px;height:42px}
}

/* ---------- praise / toast ---------- */
.k-praise{position:fixed;z-index:85;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,86px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-float{position:fixed;z-index:85;pointer-events:none;font-weight:800;font-size:clamp(24px,4.5vmin,40px);color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;
  transform:translate(-50%,-50%);animation:k-floatup 1s ease-out forwards;white-space:nowrap}
.k-toast{position:fixed;z-index:86;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(var(--sh),.12),0 12px 24px rgba(var(--sh),.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}

/* ---------- fx canvas ---------- */
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---------- decorative background ---------- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.32);animation:k-float 9s ease-in-out infinite}

/* ---------- mascot helpers ---------- */
.k-blink{transform-box:fill-box;transform-origin:center;animation:k-blink 4.4s infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3.2s ease-in-out infinite}
.k-pupil{transition:transform .14s ease-out}
.k-talk{animation:k-talk .32s ease-in-out infinite}

/* ---------- animations ---------- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-fadeout{to{opacity:0}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-50deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}50%{transform:scale(.9,1.1)}70%{transform:scale(1.05,.96)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-floatup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-70%) scale(1.1);opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-anim-shake{animation:k-shake .45s ease-in-out}
.k-anim-jelly{animation:k-jelly .5s ease-in-out}
.k-anim-wiggle{animation:k-wiggle .5s ease-in-out}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.k-deco i{animation:none!important}}
</style>
<style>
:root{--c1:#18a29a;--c1d:#0e7770;--c1l:#d6f3ee;--c2:#ff9a2c;--c2d:#d8730a;--ink:#45301e;--ink2:#7e6550;--sh:100,62,20;
  --card:#fffdf7;--cardd:#ecd9b8;--amber:#ffb23e;--cw:160px;--ch:176px}
body{background:linear-gradient(170deg,#fff4dc 0%,#ffe6bf 46%,#cfeee6 100%)}
body::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(rgba(255,255,255,.85) 2px,transparent 2.6px);background-size:30px 30px}
.k-bar .ibtn{color:var(--c1d)}
.k-pill .emo{background:#ffeccc}
@media (max-width:430px){.k-pill .emo{display:none}.k-pill{padding:4px 10px}}
@media (max-width:380px){.k-pill{padding:4px 8px}.k-dots i{width:7px;height:7px}}  /* 10 dots must fit the narrow bar */

/* ---------- owl mascot ---------- */
.owl .ohead{transform-box:view-box;transform-origin:100px 128px;animation:owlTilt 7s ease-in-out infinite}
.owl .tassel{transform-box:view-box;transform-origin:100px 35px;animation:tassel 2.6s ease-in-out infinite}
.owl .wl{transform-box:view-box;transform-origin:58px 118px}
.owl .wr{transform-box:view-box;transform-origin:142px 118px}
.owl .ojump{transform-box:view-box;transform-origin:100px 210px}
.owl .beak-lo{transform-box:fill-box;transform-origin:50% 0}
.owl.cheer .wl{animation:flapL .17s ease-in-out 6 alternate}
.owl.cheer .wr{animation:flapR .17s ease-in-out 6 alternate}
.owl.cheer .ojump{animation:owlHop .75s cubic-bezier(.3,1.6,.5,1)}
.owl.nod .ohead{animation:owlNod 1s ease-in-out}
.owl.oops .ohead{animation:owlHmm .8s ease-in-out}
.owl.talk .beak-lo{animation:beakT .2s ease-in-out infinite alternate}
@keyframes owlTilt{0%,38%,100%{transform:rotate(0)}46%,60%{transform:rotate(-7deg)}68%,84%{transform:rotate(5deg)}}
@keyframes owlNod{0%,100%{transform:translateY(0)}18%,58%{transform:translateY(8px) rotate(1deg)}38%,78%{transform:translateY(-3px)}}
@keyframes owlHmm{0%,100%{transform:rotate(0)}30%{transform:rotate(-11deg)}65%{transform:rotate(-8deg)}}
@keyframes flapL{to{transform:rotate(32deg)}}
@keyframes flapR{to{transform:rotate(-32deg)}}
@keyframes owlHop{0%,100%{transform:translateY(0)}35%{transform:translateY(-20px) scale(1.03,.97)}65%{transform:translateY(3px) scale(1.04,.95)}}
@keyframes beakT{to{transform:scaleY(1.7) translateY(1px)}}
@keyframes tassel{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}

/* ---------- title ---------- */
#title{padding:calc(var(--bar-h) + 4px) 16px calc(18px + var(--safe-b))}
.t-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.2vmin,12px)}
.t-owl{width:clamp(150px,27vmin,260px);cursor:pointer;filter:drop-shadow(0 8px 0 rgba(var(--sh),.08))}
.t-owl svg{width:100%;height:auto;display:block}
.t-txt{display:flex;flex-direction:column;align-items:center}
.k-logo{--c1d:#0e7770;font-size:clamp(44px,9.2vmin,96px)}
.k-logo .l2{color:var(--amber);font-size:1.06em}
.k-logo .q{display:inline-block;color:#fff;-webkit-text-stroke-color:var(--c2d);text-shadow:0 .1em 0 var(--c2d);transform:rotate(12deg);animation:k-wiggle 2.4s ease-in-out infinite;margin-left:.04em}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:clamp(10px,2.4vmin,22px)}
.t-btns .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--c2);color:#fff;font:800 16px/28px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  .t-wrap{flex-direction:row;gap:5vw}
  .t-owl{width:min(42vmin,30vw)}
  .t-btns{gap:12px;margin-top:8px}
  .k-sub{display:none}
}

<script>
/* ===== Kit Bé Vui 4 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';
  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const center = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, r }; };

  const util = { rand, randInt, pick, shuffle, clamp, lerp, wait, $, $$, el, center, seeded, hash };

  /* ---------- storage (works when blocked) ---------- */
  const mem = {};
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); if (v != null) return JSON.parse(v); } catch (e) { if ((ns + k) in mem) return mem[ns + k]; } return (ns + k) in mem ? mem[ns + k] : d; },
    set(k, v) { mem[ns + k] = v; try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { delete mem[ns + k]; try { localStorage.removeItem(ns + k); } catch (e) { } }
  });
  const shared = mkStore('bevui.');
  let store = mkStore('bevui.game.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', { sound: settings.sound, music: settings.music });

  /* ---------- audio core ---------- */
  const MUSIC_VOL = 0.2;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;

      try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return null; } }

      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.85;
      sfxBus = ctx.createGain(); sfxBus.gain.value = settings.sound ? 1 : 0;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && unlocked && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    if (unlocked) { if (ctx && ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { }); return; }
    unlocked = true;
    const c = audio(); if (!c) return;
    try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
    if (c.state === 'suspended') c.resume().catch(() => { });
    if (music.want) music.play(music.want, true);

  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { capture: true, passive: true }));

    if (document.hidden) {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { }

      if (ctx && unlocked) ctx.resume().catch(() => { });

function tapCard(i) {
  const c = G.cards[i]; if (!c) return;
  if (G.phase === 'explain') { Kit.jelly(c.card); Kit.sfx('pop'); talk(cap(nameOf(c.it, G.q.level))); return; }
  if (G.phase !== 'ask') return;
  if (i === G.q.odd) correct(i); else wrong(i);
}
function correct(i) {
  G.phase = 'busy'; clearTimeout(G.idleT); hideHand();
  const C = G.cards[i], q = G.q;
  C.card.classList.add('ok', 'isodd');
  G.cards.forEach(c => c.card.classList.remove('wob'));
  Kit.good(C.card, { say: false });
  owlMood('cheer'); hoot();
  G.found.push(q.items[q.odd]);
  T.after(720, () => {
    G.phase = 'explain'; dots();
    $('#board').classList.add('ex');
    G.cards.forEach((c, j) => { c.card.classList.remove('tried', 'hinted', 'nope'); if (j !== q.odd) c.card.classList.add('grp'); });
    $('#lbG').innerHTML = labelHTML(q.rule, q.gv); $('#lbO').innerHTML = labelHTML(q.rule, q.ov);
    layoutPlay(false);
    Kit.sfx('swoosh');
    T.after(360, () => { $('#trG').classList.add('on'); $('#trO').classList.add('on'); Kit.sfx('pop'); });
    T.after(640, () => { placeLabels(); $('#lbG').classList.add('on'); $('#lbO').classList.add('on'); Kit.sfx('sparkle'); if (q.level === 4) G.cards.forEach(c => c.card.classList.add('showl')); });
    T.after(760, () => { const ex = explain(q); setBubble(ex.text, false); owlMood('nod'); talk(ex.say); });
    T.after(1350, () => { $('#bNext span').textContent = G.qi + 1 >= N ? 'Xong' : 'Tiếp'; $('#nextW').classList.remove('hidden'); placeNext(); });
  });
}
function wrong(i) {
  const C = G.cards[i], q = G.q;
  if (!G.wrong.has(i)) { G.wrong.add(i); G.mistakes++; }
  Kit.sfx('no'); Kit.vibrate(30);
  C.card.classList.remove('nope'); void C.card.offsetWidth; C.card.classList.add('nope', 'tried');
  owlMood('oops');
  const w = whyWrong(q, i); setBubble(w.text, false); talk(w.say);
  clearTimeout(G.bubT); G.bubT = T.after(6000, () => { if (G.phase === 'ask') setBubble(promptOf(q).text, true); });
  if (G.wrong.size >= 2) T.after(1300, () => { if (G.phase !== 'ask') return; G.cards.forEach((c, j) => { if (j !== q.odd) c.card.classList.add('hinted'); }); G.cards[q.odd].card.classList.add('wob'); });
  armIdle();
}
function nextQ() {
  if (G.phase !== 'explain') return;
  G.phase = 'busy';
  $('#nextW').classList.add('hidden');
  Kit.sfx('whoosh');
  G.qi++;
  if (G.qi >= N) return finishRound();
  G.cards.forEach((c, i) => { c.cw.classList.remove('pin'); c.cw.style.animationDelay = (i * .04) + 's'; c.cw.classList.add('pout'); });
  $('#trG').classList.remove('on'); $('#trO').classList.remove('on'); $('#lbG').classList.remove('on'); $('#lbO').classList.remove('on');
  T.after(330, () => showQuestion(false));
}
function finishRound() {
  G.phase = 'done'; dots(); clearTimeout(G.idleT);
  const stars = Kit.starsFor(G.mistakes, 2, 5);
  save.stars[G.mode] = Math.max(save.stars[G.mode] || 0, stars); save.rounds++;
  const b = giveBadge(); persist();
  if (b) drawOwls();
  const btns = [{ label: 'Chơi lại', icon: 'replay', cls: 'white', fn: () => startRound(G.mode) }];
  if (G.mode < 4) btns.push({ label: 'Cấp tiếp', icon: 'next', cls: 'ok', fn: () => startRound(G.mode + 1) });
  else if (G.mode === 4) btns.push({ label: 'Trộn lẫn', icon: 'shuffle', cls: 'orange', fn: () => startRound(5) });
  btns.push({ label: 'Chọn cấp', icon: 'grid', cls: 'white', fn: goSelect });
  const extra = `<div class="found-t">Những hình khác loại bé đã tìm ra:</div><div class="found">${G.found.map((it, i) => `<span class="emo" style="animation-delay:${(.5 + i * .07).toFixed(2)}s">${it.e}</span>`).join('')}</div>`;
  T.after(250, () => Kit.result({ stars, mascot: owlSVG(save.wear), text: `Bé đã tìm ra ${N} hình khác loại!`, extra,
    reward: b ? { svg: medalSVG(b), text: 'Huy hiệu mới: ' + b.n } : null, buttons: btns }));
}
function armIdle() {
  clearTimeout(G.idleT);
  if (G.idleN >= 2) return;
  G.idleT = T.after(11000, () => { if (G.phase !== 'ask') return; G.idleN++; handDemo(); talk(promptOf(G.q).say); armIdle(); });
}
/* read the question + every card name, cards hop as they are named (works silently too) */
async function readAll() {
  if (!G.q) return;
  armIdle();
  if (G.phase === 'explain') { const ex = explain(G.q); owlMood('nod'); talk(ex.say); return; }
  const g = T.gen;
  await T.guard(talk(promptOf(G.q).say));
  for (const c of G.cards) {
    if (!T.alive(g) || G.phase !== 'ask') return;
    c.card.classList.remove('hop'); void c.card.offsetWidth; c.card.classList.add('hop');
    await T.guard(Promise.all([talk(cap(nameOf(c.it, G.q.level))), T.wait(650)]));
  }
}

/* ---------- hand demo: points at each card, "tap" ---------- */
function hideHand() { const h = $('#hand'); h.classList.add('hidden'); h.getAnimations().forEach(a => a.cancel()); }
function handDemo() {
  const h = $('#hand'), pw = $('#pw').getBoundingClientRect();
  h.classList.remove('hidden');
  const hw = h.getBoundingClientRect().width || 70;
  const pts = G.cards.map(c => { const r = c.card.getBoundingClientRect(); return { x: r.left - pw.left + r.width * .55 - hw * .45, y: r.top - pw.top + r.height * .55 }; });
  const start = { x: pw.width * .8, y: pw.height + 20 };
  const fr = [{ transform: `translate(${start.x}px,${start.y}px)`, opacity: 0, offset: 0 }];
  pts.forEach((p, k) => {
    const o = .1 + k * .2;
    fr.push({ transform: `translate(${p.x}px,${p.y}px) scale(1)`, opacity: 1, offset: o });
    fr.push({ transform: `translate(${p.x}px,${p.y + 6}px) scale(.86)`, opacity: 1, offset: o + .05 });
    fr.push({ transform: `translate(${p.x}px,${p.y}px) scale(1)`, opacity: 1, offset: o + .1 });
    T.after(3600 * (o + .05), () => { const c = G.cards[k]; if (c && G.phase === 'ask') { c.card.classList.remove('hop'); void c.card.offsetWidth; c.card.classList.add('hop'); Kit.sfx('tap'); } });
  });
  fr.push({ transform: `translate(${start.x}px,${start.y}px)`, opacity: 0, offset: 1 });
  const a = h.animate(fr, { duration: 3600, easing: 'ease-in-out' });
  a.onfinish = () => h.classList.add('hidden');
}

/* ---------- bubble text (auto-fit) ---------- */
const PIC = '<span class="pic"><i></i><i></i><i></i><i class="o"></i></span>';
function setBubble(html, pic) { $('#btx').innerHTML = `<span>${pic ? PIC : ''}<span>${html}</span></span>`; fitBubble(); const b = $('#bubble'); b.classList.remove('k-anim-jelly'); void b.offsetWidth; b.classList.add('k-anim-jelly'); }
function fitBubble() {
  const b = $('#btx'), box = $('#bubble'); if (!box.clientWidth) return;
  const cs = getComputedStyle(box), land = $('#pw').classList.contains('land');
  // free height for the text = bubble content box (minus the speaker row when the bubble is a column)
  const avail = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (land ? 52 : 0);
  b.style.maxHeight = 'none';
  let fs = clamp(Math.min(b.clientWidth / 7.2, avail / 1.6), 14, 28);
  for (let i = 0; i < 18; i++) { b.style.fontSize = fs + 'px'; if (b.scrollHeight <= avail + 1 && b.scrollWidth <= b.clientWidth + 1) break; fs -= 1; if (fs < 12) break; }
  b.style.maxHeight = '';
}

/* =========================================================
   LAYOUT — everything is placed in px inside #pw.  Cards keep their size;
   question / explanation positions are just different transforms (smooth FLIP-free motion).
   ========================================================= */
function geom() {
  const pw = $('#pw'), W = pw.clientWidth, H = pw.clientHeight;
  const land = W / H > 1.2;
  const pad = clamp(Math.min(W, H) * .03, 10, 22);
  const R = { W, H, land, pad };
  // the "Tiếp" row must fit the real .btn.big (font clamp(28px,5.6vmin,48px), ~2.2em tall + 7px shadow)
  const btnH = clamp(Math.min(innerWidth, innerHeight) * .056, 28, 48) * 2.2 + 12;
  if (land) {
    const ow = clamp(W * .2, 128, 270);
    R.ob = { x: pad, y: pad, w: ow, h: H - pad * 2 };
    const nh = Math.max(clamp(H * .2, 64, 92), btnH);
    const bx = R.ob.x + ow + pad;
    R.B = { x: bx, y: pad, w: W - bx - pad, h: H - pad * 1.5 - nh };
    R.nb = { x: bx, y: R.B.y + R.B.h, w: R.B.w, h: nh };
  } else {
    const oh = clamp(H * .19, 96, 190);
    R.ob = { x: pad, y: pad * .6, w: W - pad * 2, h: oh };
    const nh = Math.max(clamp(H * .11, 74, 104), btnH);
    const by = R.ob.y + oh + pad * .9;
    R.B = { x: pad, y: by, w: W - pad * 2, h: H - by - nh - pad * .3 };
    R.nb = { x: pad, y: R.B.y + R.B.h, w: R.B.w, h: nh };
  }
  const B = R.B;
  const g = clamp(Math.min(B.w, B.h) * .045, 10, 22);
  let cw = land ? Math.min((B.w - 3 * g) / 4, B.h / 1.05) : Math.min((B.w - g) / 2, (B.h - g) / 2 / 1.08);
  cw = Math.min(cw, 340);
  // use spare height for slightly taller cards (room for the name), never squat ones
  const ch = cw * clamp(land ? B.h / cw : (B.h - g) / 2 / cw, 1.05, land ? 1.16 : 1.22);
  Object.assign(R, { g, cw, ch });
  R.q = [];
  if (land) { const tw = 4 * cw + 3 * g, x0 = B.x + (B.w - tw) / 2, y0 = B.y + (B.h - ch) / 2; for (let i = 0; i < 4; i++) R.q.push({ x: x0 + i * (cw + g), y: y0, s: 1 }); }
  else { const tw = 2 * cw + g, th = 2 * ch + g, x0 = B.x + (B.w - tw) / 2, y0 = B.y + (B.h - th) / 2; for (let i = 0; i < 4; i++) R.q.push({ x: x0 + (i % 2) * (cw + g), y: y0 + Math.floor(i / 2) * (ch + g), s: 1 }); }
  // explanation: group tray (3 cards) + odd tray (1 card), side by side or stacked — whichever lets the cards be bigger
  // tp side/bottom padding, tt top padding (room under the label sitting on the tray border), LO label overhang above the tray
  const tp = clamp(cw * .08, 8, 18), tt = tp + 14, gi = clamp(g * .6, 6, 14), tg = clamp(g * 1.6, 20, 44), LO = 24, TV = tp + tt;
  const sRow = Math.min((B.w - 2 * gi - 4 * tp - tg) / (4 * cw), (B.h - TV - LO - 6) / ch, .95);
  const sStack = Math.min((B.w - 2 * gi - 2 * tp) / (3 * cw), (B.h - 2 * TV - tg - 2 * LO - 6) / (2 * ch), .95);
  const ex = R.ex = { row: sRow >= sStack };
  if (ex.row) {
    const s = sRow, w1 = 3 * cw * s + 2 * gi + 2 * tp, h1 = ch * s + TV, w2 = cw * s + 2 * tp;
    const x0 = B.x + (B.w - (w1 + tg + w2)) / 2, y0 = B.y + LO + (B.h - LO - h1) / 2;
    ex.gt = { x: x0, y: y0, w: w1, h: h1 }; ex.ot = { x: x0 + w1 + tg, y: y0, w: w2, h: h1 };
    ex.gp = [0, 1, 2].map(k => ({ x: x0 + tp + k * (cw * s + gi), y: y0 + tt, s })); ex.op = { x: ex.ot.x + tp, y: y0 + tt, s };
  } else {
    const s = sStack, w1 = 3 * cw * s + 2 * gi + 2 * tp, h1 = ch * s + TV;
    const s2 = Math.max(s, Math.min(s * 1.22, (B.w - 2 * tp) / cw, (B.h - h1 - tg - 2 * LO - TV - 6) / ch, .95));
    const w2 = cw * s2 + 2 * tp, h2 = ch * s2 + TV, tot = LO + h1 + tg + LO + h2;
    const y0 = B.y + (B.h - tot) / 2 + LO;
    ex.gt = { x: B.x + (B.w - w1) / 2, y: y0, w: w1, h: h1 };
    ex.ot = { x: B.x + (B.w - w2) / 2, y: y0 + h1 + tg + LO, w: w2, h: h2 };
    ex.gp = [0, 1, 2].map(k => ({ x: ex.gt.x + tp + k * (cw * s + gi), y: y0 + tt, s })); ex.op = { x: ex.ot.x + tp, y: ex.ot.y + tt, s: s2 };
  }
  return R;
}
const px = v => v.toFixed(1) + 'px';
function layoutPlay(instant) {
  if (Kit.curScreen !== 'play' || !G.q) return;
  const pw = $('#pw'), R = geom(); G.geo = R;
  pw.classList.toggle('land', R.land);
  // owl + bubble
  const o = $('#pOwl'), bb = $('#bubble'), ob = R.ob;
  if (R.land) {
    const bh = clamp(ob.h * .48, 96, 240), oh2 = ob.h - bh - 18, ow2 = Math.min(ob.w * .92, oh2 * 200 / 236);
    Object.assign(bb.style, { left: px(ob.x), top: px(ob.y), width: px(ob.w), height: px(bh) });
    Object.assign(o.style, { left: px(ob.x + (ob.w - ow2) / 2), top: px(ob.y + bh + 18 + (oh2 - ow2 * 236 / 200)), width: px(ow2), height: px(ow2 * 236 / 200) });
  } else {
    const oh = ob.h, ow = oh * 200 / 236;
    Object.assign(o.style, { left: px(ob.x - 4), top: px(ob.y), width: px(ow), height: px(oh) });
    Object.assign(bb.style, { left: px(ob.x + ow + 10), top: px(ob.y + oh * .07), width: px(ob.w - ow - 6), height: px(oh * .86) });
  }
  fitBubble();
  // cards
  const B = $('#board');
  if (instant) B.classList.add('noanim');
  B.style.setProperty('--cw', px(R.cw)); B.style.setProperty('--ch', px(R.ch));
  const exm = G.phase === 'explain' || B.classList.contains('ex');
  let k = 0;
  G.cards.forEach((c, i) => {
    const p = !exm ? R.q[i] : i === G.q.odd ? R.ex.op : R.ex.gp[k++];
    c.cs.style.transform = `translate(${px(p.x)},${px(p.y)}) scale(${p.s.toFixed(4)})`;
  });
  const setR = (n, r) => Object.assign(n.style, { left: px(r.x), top: px(r.y), width: px(r.w), height: px(r.h) });
  setR($('#trG'), R.ex.gt); setR($('#trO'), R.ex.ot);
  placeLabels(); placeNext();
  if (instant) { void B.offsetWidth; requestAnimationFrame(() => B.classList.remove('noanim')); }
}
function placeLabels() {
  const R = G.geo; if (!R) return;
  [['#lbG', R.ex.gt], ['#lbO', R.ex.ot]].forEach(([s, t]) => {
    const n = $(s), w = n.offsetWidth || 120;
    const x = clamp(t.x + t.w / 2, w / 2 + 6, R.W - w / 2 - 6);
    n.style.left = px(x); n.style.top = px(t.y);
  });
}
function placeNext() { const R = G.geo; if (!R) return; Object.assign($('#nextW').style, { left: px(R.nb.x), top: px(R.nb.y), width: px(R.nb.w), height: px(R.nb.h) }); }
Kit.onResize(() => { if (Kit.curScreen === 'play') layoutPlay(true); });

/* =========================================================
   BADGES (collection)
   ========================================================= */
function openBadges() {
  const m = Kit.modal({ cls: 'alb', html: `<div class="alb-owl">${owlSVG(save.wear)}</div><h2>Huy hiệu của bé</h2><div class="acount">${save.badges.length} / ${BADGES.length}</div><p>Chơi xong mỗi lượt 10 câu được 1 huy hiệu. Chạm vào huy hiệu để Cú đeo nhé!</p><div class="agrid"></div>` });
  const g = $('.agrid', m.panel);
  BADGES.forEach((b, i) => {
    const own = save.badges.includes(i);
    const s = el('button', 'stk' + (own ? '' : ' no') + (save.wear === i ? ' wear' : ''), `${medalSVG(b)}<span>${own ? b.n : '???'}</span>`);
    s.setAttribute('aria-label', own ? b.n : 'chưa có');
    s.addEventListener('click', () => {
      if (!own) { Kit.shake(s); Kit.sfx('no'); Kit.toast('Chơi thêm một lượt để nhận huy hiệu nhé!'); return; }
      save.wear = i; persist(); drawOwls(); Kit.jelly(s); Kit.sfx('magic');
      $$('.stk', g).forEach(x => x.classList.toggle('wear', x === s));
      $('.alb-owl', m.panel).innerHTML = owlSVG(save.wear);
      talk('Cú đeo huy hiệu ' + b.n + '. Đẹp quá!');
    });
    g.appendChild(s);
  });
}

window.__game = {
  state: () => ({ screen: Kit.curScreen, mode: G.mode, level: G.q ? G.q.level : 0, qi: G.qi, total: N, mistakes: G.mistakes, phase: G.phase,
    odd: G.q ? G.q.odd : -1, rule: G.q ? G.q.rule : '', gv: G.q ? G.q.gv : null, items: G.q ? G.q.items.map(i => i.n) : [], wrong: [...G.wrong],
    badges: save.badges.length, wear: save.wear, stars: save.stars, row: G.geo ? G.geo.ex.row : null }),
  card: i => { const c = G.cards[i]; if (!c) return null; const r = c.card.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2 }; },
  catalogue: () => KHL.ITEMS.length
};
