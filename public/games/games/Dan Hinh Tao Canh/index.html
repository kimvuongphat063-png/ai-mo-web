<!DOCTYPE html>
<html lang="vi" data-game="danhinh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5cc2ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dán Hình Tạo Cảnh</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}

/* ===== Kit v2 additions (Bộ game 2) ===== */
/* tutorial hand */
.k-hand{position:fixed;z-index:72;left:0;top:0;width:clamp(54px,9vmin,78px);height:auto;pointer-events:none;opacity:0;
  filter:drop-shadow(0 6px 6px rgba(30,10,80,.25));transition:opacity .25s;will-change:transform}
.k-hand.on{opacity:1}
.k-hand .tapring{transform-origin:22px 10px;animation:k-ring 1s ease-out infinite}
@keyframes k-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* segmented chips (Dễ / Vừa / Khó …) */
.k-seg{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(40,20,90,.12)}
.k-seg button{border:none;cursor:pointer;min-height:48px;min-width:56px;padding:0 16px;border-radius:999px;background:transparent;
  font:800 clamp(16px,2.6vmin,21px)/1 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.k-seg button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.k-seg button:active{transform:translateY(2px)}
/* tile buttons for mode / level grids */
.k-tile{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;color:var(--ink);padding:12px 10px 10px;
  box-shadow:0 7px 0 rgba(40,20,90,.16),0 12px 20px rgba(40,20,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:800 clamp(16px,2.7vmin,22px)/1.05 var(--font);transition:transform .14s,box-shadow .14s;min-height:64px;text-align:center}
.k-tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(40,20,90,.16)}
.k-tile .emo{font-size:clamp(34px,6.4vmin,54px)}
.k-tile small{font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .k-tstars{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5;display:block}
.k-mini-star.on svg{color:#ffc83d;filter:drop-shadow(0 1px 0 #e09a00)}
/* scrollable screen body under the bar */
.k-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--bar-h) + var(--safe-t) + 6px) calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l));
  display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  box-shadow:0 4px 0 rgba(40,20,90,.12);white-space:nowrap}
.k-pill .emo{font-size:1.3em}
@keyframes k-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}50%{filter:drop-shadow(0 0 14px rgba(255,220,80,.95))}}
.k-glow{animation:k-glow 1.2s ease-in-out infinite}
@keyframes k-squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}}
.k-squash{animation:k-squash .5s ease}
@keyframes k-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.k-jump{animation:k-jump .5s cubic-bezier(.3,1.5,.5,1)}
</style>
<style>
:root{--c1:#2f9bff;--c1d:#1769c9;--c1l:#e1f0ff;--c2:#ff6f91;--c2d:#d9466c;--bg1:#9fdcff;--bg2:#fff0c4;--ink:#2e3a66;--ink-soft:#66709a}
body{background:
  radial-gradient(circle at 14% 14%,rgba(255,255,255,.5) 0 70px,transparent 71px),
  radial-gradient(circle at 90% 86%,rgba(255,255,255,.4) 0 110px,transparent 111px),
  linear-gradient(172deg,var(--bg1) 0%,#cdeeff 46%,var(--bg2) 100%)}
.dots{position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(rgba(255,255,255,.7) 2px,transparent 2.6px);background-size:36px 36px}
.logo{--c1d:#1769c9}
.logo .l2{color:#ffd84d}
.k-h{--c1d:#1769c9}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.4vmin,14px);padding:calc(70px + var(--safe-t)) 16px calc(20px + var(--safe-b))}
#title>.mascot,#title>.title-txt{position:relative;z-index:1}
.floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters span{position:absolute;font-size:clamp(38px,7vmin,64px);line-height:1;animation:drift 11s ease-in-out infinite;
  filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 5px 4px rgba(30,60,120,.22))}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1))}}
.mascot{width:clamp(150px,30vmin,260px);height:auto;overflow:visible;cursor:pointer}
.mascot .eyes{transform-origin:100px 96px;animation:blink 4.4s infinite}
.mascot .look{transition:transform .15s ease-out}
.mascot .wave{transform-origin:136px 152px;animation:wave 2.6s ease-in-out infinite}
.mascot.happy .body{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-10deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-20px)}}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(6px,2vmin,18px)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #title{flex-direction:row;gap:5vw;padding-top:calc(58px + var(--safe-t))}
  #title .title-txt{display:flex;flex-direction:column;align-items:center}
  .mascot{width:34vmin}
}

/* ---------- select / gallery ---------- */
#select,#gallery{justify-content:flex-start}
.bgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vmin,18px);width:min(1000px,100%)}
.bgt{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:7px 7px 6px;box-shadow:0 7px 0 rgba(30,60,120,.16),0 12px 22px rgba(30,60,120,.10);
  display:flex;flex-direction:column;gap:4px;transition:transform .14s;color:var(--ink);font:800 clamp(17px,2.8vmin,23px)/1.1 var(--font)}
.bgt:active{transform:translateY(5px)}
.bgt .pv{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#8fd3ff}
.bgt .pv svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bgt .cap{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px}
.bgt .cap .emo{font-size:1.3em}
.bgt.cont{background:linear-gradient(160deg,#fff7d1,#fff);box-shadow:0 7px 0 #f0c54a,0 12px 22px rgba(30,60,120,.10)}
.bgt.cont .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bgt.cont .badge2{position:absolute;top:-10px;right:-8px;background:var(--ok);color:#fff;border-radius:999px;padding:5px 12px;font:800 15px/1 var(--font);box-shadow:0 3px 0 var(--okd);display:flex;gap:4px;align-items:center}
.bgt.cont .badge2 svg{width:16px;height:16px}
@media (max-aspect-ratio:1/1){.bgs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .bgs{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(580px,100%)}
  .bgt .pv{aspect-ratio:2/1}
  .bgt .cap{min-height:26px;font-size:16px}
}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,26vmin,220px),1fr));gap:14px;width:min(1000px,100%)}
.gt{position:relative;border:none;cursor:pointer;border-radius:22px;background:#fff;padding:6px;box-shadow:0 6px 0 rgba(30,60,120,.15);transition:transform .14s}
.gt:active{transform:translateY(4px)}
.gt .pv{display:block;position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#dff1ff}
.gt .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gt .pv .emo{position:absolute;left:6px;bottom:6px;font-size:22px;background:rgba(255,255,255,.85);border-radius:12px;padding:3px 5px}
.gt .del{position:absolute;top:-8px;right:-8px;width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:var(--c2d);display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(30,60,120,.18);cursor:pointer}
.gt .del svg{width:24px;height:24px}
.gt.new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;background:rgba(255,255,255,.7);border:4px dashed #fff;
  box-shadow:none;color:var(--c1d);font:800 20px/1 var(--font)}
.gt.new .plus{width:58px;height:58px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--okd)}
.gt.new .plus svg{width:34px;height:34px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-soft);font-weight:700;font-size:20px;text-align:center}
.empty .emo{font-size:64px}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(1000px,100%);padding:12px;border-radius:24px;background:rgba(255,255,255,.6)}
.medal{position:relative;width:clamp(64px,13vmin,84px);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.05}
.medal svg{width:100%;height:auto}
.mw{position:relative;width:100%}
.mw .emo{position:absolute;top:60%;left:50%;transform:translate(-50%,-50%);font-size:clamp(22px,4.4vmin,32px)}
.medal.no svg{filter:grayscale(1) opacity(.35)}
.medal.no .emo{filter:grayscale(1) opacity(.35)}
.medal.on svg{animation:k-glow 2.4s ease-in-out infinite}
.cnt{font-weight:800;color:var(--c1d);font-size:18px;background:#fff;border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 rgba(30,60,120,.12)}

/* ---------- play layout ---------- */
#play{justify-content:flex-start}
.pwrap{position:absolute;left:0;right:0;bottom:0;top:calc(var(--bar-h) + var(--safe-t));display:grid;gap:8px;
  padding:2px calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));
  grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"scene" "tools" "tray"}
#play.land .pwrap{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);grid-template-areas:"scene tray"}
#play.live .pwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"scene"}
#play.live .tray,#play.live #toolSlot{display:none}
.cell{grid-area:scene;position:relative;min-width:0;min-height:0}
#toolSlot{grid-area:tools;display:flex;justify-content:center;min-width:0}
#toolSlot:empty{display:none}
.tools{display:flex;gap:7px;align-items:center;justify-content:center;pointer-events:auto}
.tb{position:relative;width:48px;height:48px;flex:0 0 auto;border:none;border-radius:16px;background:#fff;color:var(--c1d);display:grid;place-items:center;cursor:pointer;
  font-size:26px;line-height:1;box-shadow:0 4px 0 rgba(30,60,120,.16),0 8px 14px rgba(30,60,120,.08);transition:transform .12s,opacity .2s}
.tb:active{transform:translateY(3px) scale(.96)}
.tb svg{width:28px;height:28px}
.tb[disabled]{opacity:.4;pointer-events:none}
.tb .dot{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#6b3d00;font:800 13px/22px var(--font);padding:0 5px;box-shadow:0 2px 0 var(--goldd)}
.k-bar .tools .tb{width:46px;height:46px;border-radius:15px}
@media (min-height:521px) and (min-width:900px){.k-bar .tools .tb{width:54px;height:54px;border-radius:18px;font-size:30px}}

/* ---------- tray ---------- */
.tray{grid-area:tray;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;border-radius:22px;overflow:hidden;
  box-shadow:0 6px 0 rgba(30,60,120,.14),0 10px 22px rgba(30,60,120,.10)}
.tabs{display:flex;gap:5px;padding:6px;background:#f2f6ff;flex:0 0 auto}
.tab{position:relative;flex:1 1 0;min-width:0;height:50px;border:none;border-radius:15px;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:clamp(26px,4vmin,36px);
  transition:background .15s,transform .12s}
.tab .emo{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.tab.on{background:var(--cc);box-shadow:0 4px 0 var(--ccd)}
.tab.on .emo{transform:scale(1.15)}
.tab:active{transform:translateY(2px)}
.items{--ts:66px;display:flex;gap:8px;padding:8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;background:var(--cl,#fff);flex:0 0 auto;
  scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.items::-webkit-scrollbar{display:none}
.ti{position:relative;flex:0 0 auto;width:var(--ts);height:var(--ts);border:none;border-radius:18px;background:#fff;display:grid;place-items:center;cursor:grab;padding:0;
  box-shadow:0 4px 0 rgba(30,60,120,.12);font-size:calc(var(--ts) * .62);line-height:1;transition:transform .12s}
.ti .art{width:1em;height:1em;display:grid;place-items:center;pointer-events:none}
.ti .art svg{width:100%;height:100%;overflow:visible}
.ti.sp::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff}
.ti.lift{transform:scale(.86);opacity:.5}
#play.land .tray{flex-direction:row}
#play.land .tabs{flex-direction:column;justify-content:flex-start;padding:6px 5px;overflow-y:auto;scrollbar-width:none}
#play.land .tab{flex:0 0 auto;width:50px;height:var(--tabh,48px);font-size:min(30px,calc(var(--tabh,48px) * .62))}
@media (min-height:561px){#play.land .tab{width:62px;font-size:34px}}
#play.land .items{display:grid;grid-template-columns:repeat(var(--cols,2),var(--ts));grid-auto-rows:var(--ts);align-content:start;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;flex:1 1 auto;padding:8px 8px 14px}

/* ---------- scene ---------- */
#scene{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:#8fd3ff;touch-action:none;isolation:isolate;contain:layout paint;
  box-shadow:0 0 0 4px #fff,0 8px 0 4px rgba(30,60,120,.16),0 16px 30px rgba(30,60,120,.18)}
#scene>.ly{position:absolute;inset:0;pointer-events:none}
.sky{transition:opacity .6s}
.sky.set,.sky.night,.sky.over{opacity:0;transition:none}
.stars i{position:absolute;display:block;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.8)}
.stars i.tw{animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.cel{position:absolute;left:0;top:0;will-change:transform}
.cel svg{width:100%;height:100%;display:block;overflow:visible}
#scene svg.ly{width:100%;height:100%;display:block}
.clouds{transition:transform 1s}
#scene.live .clouds{animation:cloudy 16s ease-in-out infinite alternate}
@keyframes cloudy{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.rainbow{opacity:0;transition:opacity 1.2s}
.rainbow.on{opacity:.85}
.lights{opacity:0}
#stk{z-index:6}
#glows{z-index:7;opacity:0}
#glows i{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle,rgba(255,246,170,.7) 0,rgba(255,214,80,.32) 35%,rgba(255,214,80,0) 68%);mix-blend-mode:screen}
#pcv{z-index:8;width:100%;height:100%}
#sui{z-index:9}
#sui>*{pointer-events:auto}

.stk{position:absolute;left:0;top:0;display:grid;place-items:center;pointer-events:auto;cursor:grab}
.stk .mv,.stk .rot,.stk .anim{display:grid;place-items:center}
.stk .mv{transform-origin:50% 85%}
.stk .art{width:1em;height:1em;display:grid;place-items:center;line-height:1;pointer-events:none;filter:drop-shadow(0 .04em .03em rgba(30,40,90,.28))}
.stk .art svg{width:100%;height:100%;overflow:visible}
#scene.live .stk .mv{will-change:transform}
.stk.drag{z-index:5;cursor:grabbing}
.stk.drag .art{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 .1em .08em rgba(30,40,90,.35))}
.stk.drag .anim{transform:scale(1.12) rotate(-4deg);transition:transform .15s}
.stk.gone{transition:transform .28s cubic-bezier(.5,0,.8,.4),opacity .28s;opacity:0}
.stk.born .anim{animation:born .5s cubic-bezier(.25,1.6,.45,1)}
@keyframes born{0%{transform:scale(.2)}55%{transform:scale(1.15,.88)}80%{transform:scale(.95,1.06)}100%{transform:scale(1)}}

/* tap animations (on .anim) */
.a-hop{animation:a-hop .62s cubic-bezier(.3,1.4,.5,1)}
@keyframes a-hop{0%{transform:translateY(0) scale(1)}12%{transform:translateY(0) scale(1.15,.85)}45%{transform:translateY(-55%) scale(.92,1.1)}75%{transform:translateY(0) scale(1.12,.88)}100%{transform:none}}
.a-spin{animation:a-spin .8s cubic-bezier(.4,1.3,.5,1)}
@keyframes a-spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
.a-wiggle{animation:a-wiggle .7s ease-in-out}
@keyframes a-wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg) scale(1.06)}35%{transform:rotate(12deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(6deg)}}
.a-drive{animation:a-drive .9s cubic-bezier(.4,0,.3,1)}
@keyframes a-drive{0%{transform:none}20%{transform:translateX(10%) rotate(4deg)}55%{transform:translateX(-45%) rotate(-3deg)}80%{transform:translateX(-30%)}100%{transform:none}}
.a-fly{animation:a-fly 1s ease-in-out}
@keyframes a-fly{0%{transform:none}25%{transform:translate(-25%,-45%) rotate(-12deg) scaleY(.85)}50%{transform:translate(0,-70%) rotate(0) scaleY(1.1)}75%{transform:translate(25%,-40%) rotate(12deg) scaleY(.85)}100%{transform:none}}
.a-swim{animation:a-swim 1s ease-in-out}
@keyframes a-swim{0%{transform:none}25%{transform:translateX(-25%) rotate(-10deg)}50%{transform:translate(-35%,-10%) rotate(6deg)}75%{transform:translateX(-12%) rotate(-6deg)}100%{transform:none}}
.a-float{animation:a-float 1.1s ease-in-out}
@keyframes a-float{0%,100%{transform:none}35%{transform:translateY(-30%) rotate(-6deg) scale(1.06)}70%{transform:translateY(-8%) rotate(5deg)}}
.a-glow{animation:a-glow 1s ease-in-out}
@keyframes a-glow{0%,100%{transform:none;filter:none}40%{transform:scale(1.25) rotate(-8deg);filter:drop-shadow(0 0 12px #fff27a) brightness(1.25)}70%{transform:scale(.95) rotate(4deg)}}
.a-rain{animation:a-rain .8s ease-in-out}
@keyframes a-rain{0%,100%{transform:none}20%{transform:translateX(-6%) scale(1.08,.94)}40%{transform:translateX(6%)}60%{transform:translateX(-4%)}80%{transform:translateX(3%)}}
.a-dance{animation:a-dance .9s ease-in-out}
@keyframes a-dance{0%,100%{transform:none}20%{transform:translateY(-20%) rotate(-12deg)}40%{transform:translateY(0) rotate(0) scale(1.08,.92)}60%{transform:translateY(-20%) rotate(12deg)}80%{transform:translateY(0) scale(1.08,.92)}}
.a-still{animation:a-still .5s ease}
@keyframes a-still{0%,100%{transform:none}30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.06)}}
.a-rocket{animation:a-rocket 1.3s cubic-bezier(.5,0,.5,1)}
@keyframes a-rocket{0%{transform:none}15%{transform:translateY(6%) scale(1.06,.94)}55%{transform:translate(30%,-160%) rotate(10deg)}56%{opacity:0}57%{transform:translate(-30%,120%);opacity:0}58%{opacity:1}100%{transform:none}}

/* special svg sticker parts */
.sv .fl{transform-origin:50% 0;transform-box:fill-box}
.act .sv .fl,#scene.live .sv .fl{animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.75) scaleX(1.1)}to{transform:scaleY(1.2) scaleX(.9)}}
.sv .rays{transform-origin:50px 50px}
.act .sv .rays,#scene.live .sv .rays{animation:rays 6s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.sv .drops{opacity:0}
.act .sv .drops,#scene.live .sv .drops{opacity:1;animation:drops .5s linear infinite}
@keyframes drops{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
.sv .arm{transform-box:fill-box;transform-origin:50% 90%}
.act .sv .arm,#scene.live .sv .arm{animation:armw .45s ease-in-out infinite alternate}
@keyframes armw{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.sv .eyes{transform-box:fill-box;transform-origin:50% 50%}
.act .sv .eyes{animation:blink .6s 2}

/* selection + handles */
.sel{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none!important;opacity:0;transition:opacity .15s}
.sel::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(255,255,255,.95);box-shadow:0 0 0 3px rgba(47,155,255,.35),inset 0 0 0 3px rgba(47,155,255,.25);animation:selspin 9s linear infinite}
.sel.on{opacity:1}
@keyframes selspin{to{transform:rotate(360deg)}}
.hdl{z-index:3;position:absolute;left:0;top:0;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:3px solid #fff;background:var(--hc);color:#fff;display:grid;place-items:center;
  cursor:pointer;box-shadow:0 4px 0 var(--hcd),0 6px 12px rgba(30,40,90,.25);touch-action:none;transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.hdl.on{transform:scale(1)}
.hdl:active{filter:brightness(.92)}
.hdl svg{width:28px;height:28px}
.hdl.h-plus{--hc:#36c96a;--hcd:#20a04f}.hdl.h-minus{--hc:#ff9f43;--hcd:#e07b17}.hdl.h-flip{--hc:#2f9bff;--hcd:#1769c9}.hdl.h-front{--hc:#a06bff;--hcd:#7a46e0}

/* trash */
.trash{position:absolute;left:10px;bottom:10px;width:78px;height:88px;transform:translateY(140%);transition:transform .28s cubic-bezier(.3,1.5,.5,1);pointer-events:none!important}
.trash.on{transform:none}
.trash.hot{transform:scale(1.18)}
.trash svg{width:100%;height:100%;overflow:visible}
.trash .lid{transform-origin:12px 30px;transition:transform .18s}
.trash.hot .lid{transform:rotate(-38deg) translateY(-4px)}
.trash.gulp{animation:k-squash .45s}

/* scene ui */
.pbtn{position:absolute;right:12px;bottom:12px;width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:var(--ok);color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 0 var(--okd),0 10px 20px rgba(20,60,40,.3);transition:transform .12s}
.pbtn svg{width:38px;height:38px;margin-left:4px}
.pbtn.stop{background:var(--c2);box-shadow:0 6px 0 var(--c2d),0 10px 20px rgba(80,20,40,.3)}
.pbtn.stop svg{margin-left:0}
.pbtn:active{transform:translateY(4px)}
.pbtn.nudge{animation:k-pulse 1.2s ease-in-out infinite}
.mpill{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:none;border-radius:999px;padding:5px 12px 5px 6px;min-height:48px;
  font:800 17px/1 var(--font);color:var(--ink);box-shadow:0 4px 0 rgba(30,60,120,.15);cursor:pointer;max-width:calc(100% - 20px)}
.mpill .mi{font-size:26px;width:38px;height:38px;border-radius:50%;background:#fff3c4;display:grid;place-items:center}
.mpill .ch{display:flex;align-items:center;gap:2px;white-space:nowrap;padding:2px 6px;border-radius:999px;background:#f0f4ff}
.mpill .ch .emo{font-size:20px}
.mpill .ch.ok{background:#d9f7e3;color:var(--okd)}
.mpill .bgneed{font-size:22px;opacity:.9}
.mpill.pop{animation:k-squash .45s}
.wseg{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(30,60,120,.15)}
.wseg button{width:50px;height:50px;border:none;border-radius:50%;background:transparent;font-size:28px;display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .12s}
.wseg button.on{background:var(--c1);box-shadow:0 3px 0 var(--c1d)}
.wseg button:active{transform:scale(.92)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none!important}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

/* drag ghost */
#ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;display:none;will-change:transform}
#ghost.on{display:grid;place-items:center}
#ghost .art{width:1em;height:1em;display:grid;place-items:center;line-height:1;
  filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 .12em .1em rgba(30,40,90,.35))}
#ghost .art svg{width:100%;height:100%;overflow:visible}
#ghost .wob{animation:wob .5s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

/* missions panel */
.mlist{display:flex;flex-direction:column;gap:10px;margin-top:12px;text-align:left}
.mrow{display:flex;align-items:center;gap:10px;border:none;background:#f4f8ff;border-radius:20px;padding:8px 10px;cursor:pointer;font:700 clamp(15px,2.6vmin,19px)/1.15 var(--font);color:var(--ink);
  box-shadow:0 4px 0 rgba(30,60,120,.10);text-align:left;width:100%;min-height:62px}
.mrow:active{transform:translateY(3px)}
.mrow.cur{background:#fff3c4;box-shadow:0 4px 0 #f0c54a,0 0 0 3px #ffd84d}
.mrow .mi{flex:0 0 auto;width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 3px 0 rgba(30,60,120,.1)}
.mrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mrow .need{display:flex;flex-wrap:wrap;gap:4px;font-weight:800;font-size:15px}
.mrow .need span{background:#fff;border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:3px}
.mrow .need .emo{font-size:18px}
.mrow .st{flex:0 0 auto;width:40px;height:40px}
.mrow .st svg{width:100%;height:100%}
.k-panel.mp{width:min(600px,96vw)}
.k-panel.mp h2{display:flex;align-items:center;justify-content:center;gap:8px}

/* the middle bar slot stays empty on narrow portrait screens -> single-row bar */
@media (max-width:600px) and (orientation:portrait){html.nomid{--bar-h:62px}}
@media (min-width:431px) and (max-width:600px) and (orientation:portrait) and (min-height:501px){html.nomid{--bar-h:74px}}
/* bar mid during play (landscape) */
#mid .tools{gap:6px}
@media (max-width:360px){.tb{width:44px;height:44px}.tools{gap:5px}}
</style>

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.3;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    const c = audio(); if (!c) return;
    if (!unlocked) {
      unlocked = true;
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
      if (music._want) music.start(music._want);
    }
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => { }); speech.stop(); }
    else ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + a + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.2, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 2, t, vol: vol * 0.22, dur: dur * 0.5, bus });
    tone({ f: f * 3.01, t, vol: vol * 0.07, dur: dur * 0.3, bus });
  }
  function marimba(f, t = 0, vol = 0.2, dur = 0.4, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 4, t, vol: vol * 0.16, dur: dur * 0.18, bus });
  }
  function pluck(f, t = 0, vol = 0.12, dur = 0.3, bus) { tone({ f, t, vol, dur, type: 'triangle', lp: 2200, bus }); }

  const sfx = {
    tap() { tone({ f: 700, to: 960, dur: 0.06, vol: 0.12, type: 'triangle' }); },
    click() { tone({ f: 1300, dur: 0.03, vol: 0.06, type: 'triangle' }); },
    pop() { tone({ f: 360, to: 1250, slide: 0.07, dur: 0.1, vol: 0.32 }); noise({ f: 2600, q: 0.8, dur: 0.05, vol: 0.1 }); },
    good() { bell(1046.5, 0, 0.18, 0.5); bell(1318.5, 0.09, 0.18, 0.7); },
    bad() { tone({ f: 330, to: 300, dur: 0.15, vol: 0.15, type: 'triangle', lp: 1200 }); tone({ f: 262, to: 240, t: 0.17, dur: 0.24, vol: 0.15, type: 'triangle', lp: 1000 }); },
    star() { [1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.06, 0.08, 0.35)); },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.11, 0.17, 0.6));
      [1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.5 + i * 0.05, 0.05, 0.4));
    },
    fanfare() {
      const n = [[523.25, 0], [523.25, 0.12], [523.25, 0.24], [659.25, 0.36], [783.99, 0.6], [659.25, 0.78], [783.99, 0.9], [1046.5, 1.08]];
      n.forEach(([f, t]) => { tone({ f, t, vol: 0.09, dur: 0.22, type: 'square', lp: 2600 }); bell(f, t, 0.1, 0.4); });
      [1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 1.2 + i * 0.05, 0.05, 0.5));
    },
    whoosh() { noise({ f: 400, to: 3200, q: 1.2, dur: 0.28, vol: 0.13 }); },
    pick() { tone({ f: 520, to: 800, dur: 0.08, vol: 0.14, type: 'triangle' }); },
    drop() { tone({ f: 620, to: 300, dur: 0.1, vol: 0.16 }); noise({ f: 320, q: 0.7, dur: 0.06, vol: 0.08, ft: 'lowpass' }); },
    flip() { noise({ f: 1900, to: 900, q: 0.9, dur: 0.08, vol: 0.12 }); tone({ f: 520, to: 720, dur: 0.05, vol: 0.05, type: 'triangle' }); },
    boing() { tone({ f: 170, to: 540, slide: 0.12, dur: 0.3, vol: 0.18 }); },
    chomp() { noise({ f: 650, q: 1.6, dur: 0.07, vol: 0.32, ft: 'lowpass' }); noise({ t: 0.15, f: 560, q: 1.6, dur: 0.07, vol: 0.3, ft: 'lowpass' }); },
    coin() { tone({ f: 988, dur: 0.07, vol: 0.1, type: 'square', lp: 4000 }); tone({ f: 1319, t: 0.07, dur: 0.3, vol: 0.1, type: 'square', lp: 4000 }); },
    tick() { tone({ f: 1800, dur: 0.02, vol: 0.05 }); },
    sparkle() { for (let i = 0; i < 5; i++) bell(1800 + Math.random() * 2200, i * 0.045, 0.045, 0.25); },
    swap() { tone({ f: 440, to: 660, dur: 0.07, vol: 0.1, type: 'triangle' }); tone({ f: 660, to: 440, t: 0.07, dur: 0.07, vol: 0.1, type: 'triangle' }); },
    unlock() { [784, 988, 1175, 1568].forEach((f, i) => bell(f, i * 0.07, 0.12, 0.45)); },
  };

  /* ---------- background music (tiny sequencer) ---------- */
  const songs = {
    sunny: { bpm: 112, swing: 0.08, inst: 'marimba', bars: [
      { r: 48, c: [60, 64, 67], m: [72, 0, 76, 0, 79, 0, 76, 0] }, { r: 55, c: [59, 62, 67], m: [74, 0, 0, 71, 74, 0, 79, 0] },
      { r: 57, c: [57, 60, 64], m: [76, 0, 72, 0, 69, 0, 72, 74] }, { r: 53, c: [57, 60, 65], m: [77, 0, 76, 0, 74, 0, 0, 0] },
      { r: 48, c: [60, 64, 67], m: [72, 0, 76, 0, 79, 0, 84, 0] }, { r: 55, c: [59, 62, 67], m: [83, 0, 79, 0, 74, 0, 79, 0] },
      { r: 53, c: [57, 60, 65], m: [81, 0, 79, 77, 76, 0, 74, 0] }, { r: 55, c: [59, 62, 67], m: [74, 0, 76, 0, 74, 0, 71, 0] }] },
    bouncy: { bpm: 124, swing: 0.14, inst: 'marimba', bars: [
      { r: 53, c: [60, 65, 69], m: [77, 0, 77, 0, 81, 0, 84, 0] }, { r: 50, c: [62, 65, 69], m: [81, 0, 77, 0, 74, 0, 77, 0] },
      { r: 46, c: [58, 62, 65], m: [74, 0, 77, 0, 82, 0, 81, 0] }, { r: 48, c: [60, 64, 67], m: [79, 0, 0, 0, 76, 0, 72, 0] },
      { r: 53, c: [60, 65, 69], m: [77, 0, 81, 0, 84, 0, 86, 0] }, { r: 50, c: [62, 65, 69], m: [84, 0, 81, 0, 77, 0, 74, 0] },
      { r: 46, c: [58, 62, 65], m: [74, 0, 77, 0, 79, 0, 82, 0] }, { r: 48, c: [60, 64, 67], m: [81, 0, 79, 0, 76, 0, 0, 0] }] },
    calm: { bpm: 90, swing: 0.06, inst: 'musicbox', bars: [
      { r: 55, c: [55, 59, 62], m: [83, 0, 0, 86, 83, 0, 79, 0] }, { r: 52, c: [52, 55, 59], m: [79, 0, 0, 0, 76, 0, 79, 0] },
      { r: 48, c: [48, 52, 55], m: [76, 0, 0, 79, 76, 0, 72, 0] }, { r: 50, c: [50, 54, 57], m: [74, 0, 0, 0, 0, 0, 78, 0] },
      { r: 55, c: [55, 59, 62], m: [79, 0, 83, 0, 86, 0, 91, 0] }, { r: 52, c: [52, 55, 59], m: [88, 0, 86, 0, 83, 0, 79, 0] },
      { r: 48, c: [48, 52, 55], m: [84, 0, 83, 0, 81, 0, 79, 0] }, { r: 50, c: [50, 54, 57], m: [78, 0, 76, 0, 74, 0, 0, 0] }] },
  };
  const music = {
    _want: null, _song: null, _timer: null, _step: 0, _next: 0,
    start(name) {
      const song = typeof name === 'string' ? songs[name] : name;
      this._want = song;
      if (!song || !unlocked || !ctx) return;
      if (this._song === song && this._timer) return;
      this.stop(true);
      this._song = song; this._step = 0; this._next = ctx.currentTime + 0.15;
      this._timer = setInterval(() => this._tick(), 40);
    },
    stop(keepWant) { clearInterval(this._timer); this._timer = null; this._song = null; if (!keepWant) this._want = null; },
    _tick() {
      if (!ctx || !this._song || ctx.state !== 'running') return;
      const s = this._song, e8 = 60 / s.bpm / 2;
      if (this._next < ctx.currentTime - 0.3) this._next = ctx.currentTime + 0.05;
      while (this._next < ctx.currentTime + 0.25) {
        const k = this._step % 8, bar = s.bars[Math.floor(this._step / 8) % s.bars.length];
        const t = this._next - ctx.currentTime;
        if (settings.music) {
          const B = musicBus;
          if (k === 0 || k === 4) tone({ f: mtof(k === 0 ? bar.r : bar.r + (bar.r + 7 < 60 ? 7 : -5)), t, vol: 0.2, dur: 0.4, type: 'triangle', lp: 900, bus: B });
          if (k === 2 || k === 6) bar.c.forEach((n, i) => pluck(mtof(n), t + i * 0.012, 0.045, 0.22, B));
          const m = bar.m[k];
          if (m) s.inst === 'musicbox' ? bell(mtof(m), t, 0.11, 0.7, B) : marimba(mtof(m), t, 0.16, 0.42, B);
          noise({ t, f: 7000, ft: 'highpass', q: 0.5, dur: 0.03, vol: k % 2 ? 0.035 : 0.018, bus: B });
        }
        this._next += e8 * (k % 2 === 0 ? 1 + s.swing : 1 - s.swing);
        this._step++;
      }
    },
  };
  function duck(on) {
    if (!ctx || !musicBus) return;
    const target = settings.music ? (on ? MUSIC_VOL * 0.3 : MUSIC_VOL) : 0;
    musicBus.gain.setTargetAtTime(target, ctx.currentTime, on ? 0.05 : 0.4);
  }

  /* ---------- Vietnamese voice ---------- */
  const speech = (() => {
    const synth = window.speechSynthesis;
    let voice = null, timer = null, cur = null;
    function choose() {
      if (!synth) return;
      const vs = synth.getVoices() || [];
      const vi = vs.filter(v => /^vi([-_]|$)/i.test(v.lang || '') || /vietnam/i.test(v.name || ''));
      const score = v => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 4 : 0) + (/hoaimy|linh|google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
      vi.sort((a, b) => score(b) - score(a));

let busyExp = false;

/* =====================================================================
   10. Play mode (scene comes alive), editor tools
   ===================================================================== */
const pbtn = $('#pbtn'), wsegEl = $('#wseg');
let rbT = 0, saidLive = false;
function startLive() {

  $('#play').classList.add('live'); scene.classList.add('live');
  pbtn.innerHTML = Kit.icon('stop'); pbtn.classList.add('stop'); pbtn.classList.remove('nudge'); pbtn.setAttribute('aria-label', 'Dừng lại');
  wsegEl.classList.remove('hidden');

  E.forEach(initRT);
  layout();
  sfx.unlock(); Kit.music.start('bouncy');
  const r = scene.getBoundingClientRect(); Kit.sparkle(r.left + r.width / 2, r.top + r.height / 2, { n: 10 });

}
function stopLive(quiet) {

  $('#play').classList.remove('live'); scene.classList.remove('live');

  wsegEl.classList.add('hidden'); rainbowEl.classList.remove('on'); clearTimeout(rbT);

    setTimeout(() => { o.mv.style.transition = ''; }, 480);

  if (!quiet) { sfx.swap(); Kit.music.start(SONG); }

}
function setWeather(w, quiet) {

  $$('button', wsegEl).forEach(b => b.classList.toggle('on', b.dataset.w === w));
  if (!quiet) { if (w === 'rain') VO.rain(); else if (w === 'snow') VO.snow(); else VO.sun(); }

}
$$('button', wsegEl).forEach(b => onTap(b, () => { sfx.tap(); if (weather !== b.dataset.w) setWeather(b.dataset.w); }));
onTap(pbtn, () => { if (live) stopLive(); else startLive(); });
onTap($('#mpill'), () => { sfx.tap(); openMissions(); });
tUndo.addEventListener('click', undo);

$('#tClear').addEventListener('click', () => {

  Kit.confirm({ title: 'Xoá hết hình?', text: '<span class="emo" style="font-size:54px">🗑️</span>', buttons: [{ label: 'Xoá hết', icon: 'trash', cls: 'pink', onClick: clearAll }, { label: 'Thôi', icon: 'close', cls: 'white' }] });
});

$('#tBg').addEventListener('click', () => {

/* =====================================================================
   11. Screens, layout, title, select, gallery
   ===================================================================== */
const SONG = { bpm: 100, swing: .1, inst: 'marimba', bars: [
  { r: 53, c: [65, 69, 72], m: [77, 0, 76, 0, 74, 0, 72, 0] }, { r: 48, c: [64, 67, 72], m: [76, 0, 0, 74, 72, 0, 0, 0] },
  { r: 50, c: [62, 65, 69], m: [74, 0, 72, 0, 69, 0, 72, 74] }, { r: 46, c: [62, 65, 70], m: [74, 0, 0, 0, 70, 0, 0, 0] },
  { r: 53, c: [65, 69, 72], m: [72, 0, 74, 0, 77, 0, 81, 0] }, { r: 48, c: [64, 67, 72], m: [79, 0, 77, 0, 76, 0, 72, 0] },
  { r: 46, c: [62, 65, 70], m: [74, 0, 77, 0, 76, 0, 74, 0] }, { r: 48, c: [64, 67, 72], m: [72, 0, 0, 0, 0, 0, 0, 0] }] };
const PREV = {};
const prevURL = id => PREV[id] || (PREV[id] = svgUrl(sceneSVG(id, 4 / 3, 400, 300)));
let idleH = null, tutStage = 0, galFrom = 'title';
function layout() {
  const vw = innerWidth, vh = innerHeight, land = vw > vh * 1.05;
  $('#play').classList.toggle('land', land);
  const want = (!live && screen === 'play' && (land || vw >= 600)) ? mid : toolSlot;
  if (tools.parentNode !== want) want.appendChild(tools);
  document.documentElement.classList.toggle('nomid', !mid.children.length);
  if (land) {
    const small = vh < 560;
    itemsEl.style.setProperty('--ts', small ? '58px' : '76px');
    itemsEl.style.setProperty('--cols', small ? 2 : 3);
    const barH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar-h')) || 62;
    tabsEl.style.setProperty('--tabh', clamp((vh - barH - 14 - 12 - 25) / 6, 36, 58) + 'px');
  } else itemsEl.style.setProperty('--ts', vh < 700 ? '60px' : vw >= 600 ? '76px' : '66px');

}
function relayoutScene() {
  if (screen !== 'play') return;
  const w = scene.clientWidth, h = scene.clientHeight; if (!w || !h) return;
  if (w === W && h === H && artA) return;
  W = w; H = h; U = H;
  layoutBg(); sizeCanvas(); placeAll(); applyTime(live ? hour : null);
}
if (window.ResizeObserver) new ResizeObserver(() => relayoutScene()).observe(scene);
Kit.onResize(layout);

function show(name) {
  if (screen === 'play' && name !== 'play') leavePlay();
  screen = name;
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === name));
  $('#bBack').classList.toggle('hidden', name === 'title');
  Kit.hand.hide();
  layout();
  Kit.music.start(SONG);
}
function leavePlay() {
  if (live) stopLive(true);
  saveCur(); awardTok++;
  if (idleH) { idleH.stop(); idleH = null; }
  Kit.hand.hide(); PARTS.length = 0; pg.clearRect(0, 0, W, H);
  if (TD) { TD.tile.classList.remove('lift'); TD = null; } ghost.classList.remove('on');
  $$('.flyer').forEach(f => f.remove());
  trash.classList.remove('on', 'hot'); PT.clear(); gest = null; selId = null; updSel();
}

  show('play');
  W = 0; relayoutScene();
  buildBg(); loadStickers(S.st);
  UNDO = []; tUndo.disabled = true;
  pbtn.classList.toggle('nudge', !store.get('everLive', false));
  pillTxt = ''; updPill(); saveCur(); startHints();
}
function newScene(bg) {
  const go = () => { S = { bg, st: [], slot: null, dirty: false }; activeMis = null; openPlay(); };
  if (S.st.length && S.dirty) {
    const inGal = S.slot != null && GAL.find(g => g.id === S.slot);
    if (!inGal && GAL.length >= MAXGAL) {
      Kit.confirm({ title: 'Vẽ tranh mới?', text: 'Tủ tranh đầy nên tranh đang làm sẽ không được cất.', buttons: [{ label: 'Vẽ mới', icon: 'check', cls: 'ok', onClick: go }, { label: 'Thôi', icon: 'close', cls: 'white' }] });
      return;

  }

}
function renderSelect() {
  let h = '';
  if (S.st.length) h += `<button class="bgt cont" data-cont="1"><span class="pv"><img alt="" id="contImg"></span><span class="cap"><span class="emo">✏️</span>Tranh đang làm</span><span class="badge2">${Kit.icon('play')}</span></button>`;
  h += BGS.map(b => `<button class="bgt" data-bg="${b.id}"><span class="pv"><img alt="" src="${prevURL(b.id)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></span><span class="cap"><span class="emo">${b.ico}</span>${b.name}</span></button>`).join('');
  const box = $('#bgs'); box.innerHTML = h;
  $$('.bgt', box).forEach(b => b.addEventListener('click', () => { if (b.dataset.cont) openPlay(); else newScene(b.dataset.bg); }));
  if (S.st.length) { const sc = { bg: S.bg, st: S.st.slice() }; thumb(sc, W / H || 1.4).then(src => { const im = $('#contImg'); if (im && src) im.src = src; }); }
}
function renderGallery() {

/* ---------- hints (animated hand, no reading needed) ---------- */
function startHints() {
  if (idleH) idleH.stop();
  tutStage = store.get('tut', 0) >= 2 ? 2 : 0;
  const first = () => $('#items .ti');
  const mid2 = () => { const r = scene.getBoundingClientRect(); return { x: r.left + r.width * .5, y: r.top + r.height * .55 }; };
  const hint = () => {
    if (screen !== 'play' || live || $('.k-ov') || TD || gest) return;
    if (!S.st.length) { Kit.hand.drag(first, mid2, { times: 2 }); say('Kéo hình dán vào khung cảnh nhé!'); }
    else if (!store.get('everLive', false) && S.st.length >= 3) { Kit.hand.tap(pbtn, { times: 2 }); say('Bấm nút xanh để cảnh sống dậy!'); }
    else if (tutStage < 2) { const o = E.get(S.st[S.st.length - 1].id); if (o) Kit.hand.tap(o.root, { times: 2 }); }
  };
  const my = ++awardTok;
  if (!S.st.length) setTimeout(() => { if (my === awardTok && screen === 'play' && !S.st.length) hint(); }, 800);
  idleH = Kit.idle(9000, () => { hint(); if (idleH) idleH.reset(); });
}
function tutOnAdd(o) {

  if (tutStage === 0) { tutStage = 1; setTimeout(() => { if (screen === 'play' && E.has(o.st.id) && !live && tutStage === 1 && !gest && !TD) Kit.hand.tap(o.root, { times: 2 }); }, 900); }
}
function tutOnTap() { if (tutStage === 1) { tutStage = 2; store.set('tut', 2); Kit.hand.hide(); } }

/* ---------- title: floating stickers + mascot ---------- */
(() => {
  const F2 = ['🐶', '🚗', '🌳', '🎈', '⭐', '🦋', '🐠', '🚀', '🌻', '🐱', '☁️', '🎁'];
  const P2 = [[6, 14], [80, 12], [4, 52], [88, 44], [12, 84], [80, 80], [36, 4], [58, 90], [92, 24], [28, 66], [70, 62], [50, 20]];

  const m = $('#mascot'), look = m.querySelector('.look');

    VO.giggle(1); const r = m.getBoundingClientRect(); Kit.emojiBurst(r.left + r.width / 2, r.top + r.height * .3, pick(['⭐', '🌸', '🎈', '🦋', '🐶']), 6);

/* ---------- init ---------- */
const DBG = window.__dbg = {

  get earned() { return earned.slice(); }, get gal() { return GAL.map(g => ({ id: g.id, bg: g.bg, n: g.st.length, th: !!g.th })); }, get mis() { return activeMis; },

(() => {
