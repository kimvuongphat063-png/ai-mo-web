<!DOCTYPE html>
<html lang="vi" data-game="macgi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5bb8f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mặc Gì Hôm Nay</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>/* ===== BéVui Kit 5 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','Segoe UI Symbol',sans-serif;
  --ink:#33305a; --ink-soft:#6c6896;
  --c1:#4f8cff; --c1d:#2f63d6; --c1l:#e2edff;
  --c2:#ff7a9c; --c2d:#dd4f76;
  --ok:#35c46a; --okd:#1f9a4d;
  --gold:#ffc93c; --goldd:#e19a00;
  --bad:#ff8a65;
  --bg1:#bfe3ff; --bg2:#fff1c9;
  --panel:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:76px;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-play{touch-action:none}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-right{display:flex;gap:10px;align-items:center;margin-left:auto;flex:0 0 auto}
.k-bar .k-extra{display:flex;gap:10px}
.k-bar .k-extra:empty{display:none}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(30,40,90,.16),0 10px 18px rgba(30,40,90,.10);
  transition:transform .12s ease,box-shadow .12s ease,opacity .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(30,40,90,.16),0 4px 8px rgba(30,40,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn .emo{font-size:30px}
.ibtn.off{color:#b4b2cc}
.ibtn .badge,.btn .badge{position:absolute;top:-8px;right:-8px;min-width:25px;height:25px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 15px/25px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.k-back{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(30,40,90,.12)}
.k-back:active{box-shadow:0 1px 0 var(--c1d)}
@media (max-height:500px),(max-width:430px){
  .ibtn{width:50px;height:50px;border-radius:16px}
  .ibtn svg{width:27px;height:27px}
  .k-bar,.k-bar .k-right,.k-bar .k-extra{gap:8px}
  .k-bar{padding-top:calc(8px + var(--safe-t));padding-bottom:6px}
}
/* narrow portrait: middle slot drops to its own row when it has content */
@media (max-width:600px) and (orientation:portrait){
  .k-bar{flex-wrap:wrap;row-gap:8px}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:var(--tap);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(20,30,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(20,30,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.15em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d5d9ee;color:var(--c1d);text-shadow:none}
.btn.purple{--b:#9b6bff;--bd:#7246dc}
.btn.orange{--b:#ff9a3c;--bd:#db7412}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.glow{animation:k-glow 1.3s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(42px,9.5vmin,100px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(20,30,80,.25)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.05}

/* ---- tiles (mode / level pickers) ---- */
.k-tiles{display:grid;gap:clamp(10px,2vmin,18px);width:min(1000px,100%);grid-template-columns:repeat(auto-fit,minmax(min(150px,42vw),1fr))}
.k-tile{--tc:var(--c1);--tcd:var(--c1d);--tcl:var(--c1l);position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:12px 10px 12px;
  box-shadow:0 7px 0 rgba(30,40,90,.14),0 12px 20px rgba(30,40,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:800;color:var(--ink);font-size:clamp(16px,2.6vmin,22px);line-height:1.1;text-align:center;transition:transform .15s;min-height:var(--tap)}
.k-tile:active{transform:translateY(4px) scale(.98)}
.k-tile .ti{font-size:clamp(38px,7vmin,62px);width:1.55em;height:1.55em;display:grid;place-items:center;border-radius:50%;background:var(--tcl)}
.k-tile .ti svg{width:72%;height:72%}
.k-tile small{display:block;font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .st{display:flex;gap:1px;justify-content:center}
.k-tile.sel{background:var(--tc);color:#fff;box-shadow:0 7px 0 var(--tcd),0 0 0 4px #fff}
.k-tile.sel small{color:rgba(255,255,255,.9)}
.k-tile.sel .ti{background:rgba(255,255,255,.3)}
.st{display:inline-flex;gap:1px;justify-content:center;align-items:center}
.k-mini-star{display:inline-block}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e3e2f2;display:block}
.k-mini-star.on svg{color:var(--gold)}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(30,30,80,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px;overflow:auto}
.k-panel{position:relative;width:min(580px,94vw);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(30,40,90,.14),0 30px 60px rgba(30,40,90,.3);animation:k-panel .34s cubic-bezier(.2,1.5,.4,1) both;overscroll-behavior:contain}
.k-panel.wide{width:min(900px,96vw)}
.k-panel h2{margin:0 0 4px;font-size:clamp(28px,6vmin,46px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(54px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars .mid svg{margin-top:-16px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}
.k-result .k-hero{width:clamp(96px,22vmin,140px);margin:-80px auto 0;display:block}
.k-panel.k-result{overflow:visible;margin-top:60px}
@media (max-height:500px){
  .k-panel{padding:16px 18px 16px;border-radius:26px}
  .k-btns{margin-top:12px}
  .k-stars svg{width:52px}
  .k-result .k-hero{width:80px;margin-top:-56px}
  .k-panel.k-result{margin-top:40px}
}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,58px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(30,40,90,.12),0 12px 24px rgba(30,40,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---- speech bubble with replay ---- */
.k-say{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 8px 6px 16px;font-weight:800;color:var(--ink);
  font-size:clamp(17px,2.8vmin,24px);box-shadow:0 5px 0 rgba(30,40,90,.12);line-height:1.1;max-width:100%}
.k-say .ibtn{width:44px;height:44px;border-radius:14px;background:var(--c1l);box-shadow:none}
.k-say .ibtn svg{width:24px;height:24px}

/* ---- tutorial hand ---- */
.k-hand{position:fixed;left:0;top:0;z-index:85;width:74px;height:74px;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.k-hand svg{width:100%;height:100%}

/* ---- decorative ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:50%;height:150%;left:15%;bottom:20%}
.k-cloud::after{width:38%;height:120%;right:14%;bottom:25%}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-panel{0%{transform:scale(.88) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-glow{0%,100%{box-shadow:0 7px 0 var(--bd),0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 7px 0 var(--bd),0 0 0 10px rgba(255,255,255,.55)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-22%) scale(.94,1.08)}75%{transform:translateY(0) scale(1.06,.94)}}
@keyframes k-float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-22px)}}
@keyframes k-drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-wiggle{animation:k-wiggle .5s ease-in-out}
.k-shake{animation:k-shake .45s ease-in-out}
.k-jump{animation:k-jump .6s cubic-bezier(.3,1.4,.5,1)}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3s ease-in-out infinite}
.k-blink{transform-box:fill-box;transform-origin:50% 50%;animation:k-blink 4.4s infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.btn.glow,.k-breathe{animation:none!important}}
</style>
<style>
:root{--c1:#38a4f0;--c1d:#1f7acb;--c1l:#e1f2ff;--c2:#ff7eb0;--c2d:#de4f88;--ink:#2e3a66;--ink-soft:#6c77a5;--wood:#f2c38f;--woodd:#c98b52;--woodl:#fde6c8}
body{background:linear-gradient(180deg,#8fd3ff 0%,#c4eaff 46%,#fff4d8 100%)}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco .k-cloud{animation:k-drift linear infinite}
.screen{z-index:1}
html.boot .screen.on{animation:none}

/* ---------- character ---------- */
.kid{display:block;overflow:visible;width:100%;height:100%}
.kid .kb{transform-box:view-box;transform-origin:100px 280px}
.kid .br{transform-box:view-box;transform-origin:100px 280px;animation:kbr 3.4s ease-in-out infinite}
@keyframes kbr{0%,100%{transform:scale(1,1)}50%{transform:scale(1.014,.986)}}
.kid .kh{transform-box:view-box;transform-origin:100px 126px;animation:ksway 5.5s ease-in-out infinite}
@keyframes ksway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.kid .eyes{transform-box:view-box;transform-origin:100px 86px;animation:k-blink 4.3s infinite}
.kid .pup{transition:transform .18s ease-out}
.kid .armL{transform-box:view-box;transform-origin:76px 137px;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.kid .armR{transform-box:view-box;transform-origin:124px 137px;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.kid.p-wave .armL{animation:waveL .9s ease-in-out infinite}
@keyframes waveL{0%,100%{transform:rotate(132deg)}50%{transform:rotate(162deg)}}
.kid.p-cheer .armL{transform:rotate(150deg)}
.kid.p-cheer:not(.holding) .armR{transform:rotate(-150deg)}
.kid.p-shy .armL{transform:rotate(-38deg)}.kid.p-shy .armR{transform:rotate(38deg)}
.kid.p-hips .armL{transform:rotate(-22deg)}.kid.p-hips:not(.holding) .armR{transform:rotate(22deg)}
.kid.p-shade .armL{transform:rotate(168deg) translate(6px,0)}
.kid.p-hug .armL{transform:rotate(-55deg)}.kid.p-hug .armR{transform:rotate(55deg)}
.kid.p-peace .armL{transform:rotate(128deg)}
.kid.a-jump .kb{animation:kjump .62s cubic-bezier(.3,1.3,.5,1)}
.kid.a-jumps .kb{animation:kjump .62s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes kjump{0%,100%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.08,.9)}48%{transform:translateY(-46px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.06,.94)}}
.kid.a-shiver .kb{animation:kshiver .11s linear infinite}
@keyframes kshiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
.kid.a-hop .kb{animation:khop .5s ease-in-out infinite}
@keyframes khop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) rotate(0)}80%{transform:translateY(-14px) rotate(6deg)}}
.kid.a-walk .kb{animation:kwalk .42s ease-in-out infinite}
@keyframes kwalk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.kid.a-wobble .kb{animation:kwob .5s ease-in-out infinite}
@keyframes kwob{0%,100%{transform:rotate(-7deg) translateX(-6px)}50%{transform:rotate(7deg) translateX(6px)}}
.kid.a-sway .kb{animation:kwob 1.4s ease-in-out infinite}
.kid .pop{animation:ipop .5s cubic-bezier(.2,1.8,.4,1);transform-box:fill-box;transform-origin:50% 50%}
@keyframes ipop{0%{transform:scale(.55);opacity:.3}100%{transform:scale(1);opacity:1}}
.kid .canopy{transform-box:view-box;transform-origin:114px -72px;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.kid.flip .canopy{transform:scaleY(-.85)}
.kid .hatg{transform-box:view-box;transform-origin:100px 40px}
.kid .hatg.flyaway{animation:hatfly 1.3s cubic-bezier(.3,.1,.6,1) forwards}
@keyframes hatfly{0%{transform:none}25%{transform:translate(20px,-40px) rotate(25deg)}100%{transform:translate(420px,-260px) rotate(540deg);opacity:0}}
.kid .sweat{animation:sweat 1.1s ease-in infinite;transform-box:fill-box}
@keyframes sweat{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.kid [data-slot]{cursor:pointer}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.6vmin,16px);padding:calc(var(--bar-h) + 2px) 16px calc(14px + var(--safe-b))}
.t-hero{position:relative;width:var(--th,300px);height:calc(var(--th,300px)*1.04);flex:0 0 auto}
.t-win{position:absolute;left:4%;top:0;width:92%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#bfe6ff;
  box-shadow:0 0 0 calc(var(--th,300px)*.035) #fff,0 0 0 calc(var(--th,300px)*.07) var(--wood),0 14px 30px rgba(30,60,120,.25)}
.t-win svg{width:100%;height:100%;display:block}

.cl{animation:cld 9s ease-in-out infinite alternate}.cl2{animation:cld 12s ease-in-out infinite alternate-reverse}
@keyframes cld{from{transform:translateX(-12px)}to{transform:translateX(14px)}}
.clf{animation:clf 2.6s ease-in-out infinite alternate}.clf2{animation:clf 2s ease-in-out infinite alternate-reverse}
@keyframes clf{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.bird{animation:bird 7s ease-in-out infinite alternate}
@keyframes bird{from{transform:translate(-30px,6px)}to{transform:translate(50px,-8px)}}
.rip{transform-box:fill-box;transform-origin:50% 50%;animation:rip 1.6s ease-out infinite}.rip.r2{animation-delay:-.8s}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(2);opacity:0}}
.bend{transform-box:view-box;animation:bend 1.3s ease-in-out infinite alternate}
@keyframes bend{from{transform:skewX(-3deg)}to{transform:skewX(-14deg)}}
.sock{transform-box:fill-box;transform-origin:0 50%;animation:sock .35s ease-in-out infinite alternate}
@keyframes sock{from{transform:rotate(-6deg) scaleX(.92)}to{transform:rotate(5deg) scaleX(1.04)}}
.heat{animation:heat 1.6s ease-in-out infinite}
@keyframes heat{0%{transform:translateY(6px);opacity:0}50%{opacity:.7}100%{transform:translateY(-10px);opacity:0}}
.wl{animation:wl 1.8s linear infinite}.wl.w2{animation-delay:-.9s}
@keyframes wl{0%{transform:translateX(-60px);opacity:0}30%{opacity:1}100%{transform:translateX(90px);opacity:0}}
.smoke{transform-box:fill-box;animation:smoke 2.4s ease-out infinite}
@keyframes smoke{from{transform:translateY(0) scale(.6);opacity:.8}to{transform:translateY(-30px) scale(1.6);opacity:0}}
/* play props */
.pr.ball{animation:ballb .6s cubic-bezier(.5,0,.5,1) infinite alternate}
@keyframes ballb{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120%) rotate(180deg)}}
.pr.grow{transform-origin:50% 50%;animation:k-pop .6s cubic-bezier(.2,1.6,.4,1) both}
.pr.drop{animation:k-bob 1.2s ease-in-out infinite}
.pr .raincl{animation:k-wiggle 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.pr .rainl{animation:rainl .4s linear infinite}
@keyframes rainl{from{transform:translateY(-6px);opacity:1}to{transform:translateY(10px);opacity:.2}}
.pr.snowman .sb{transform-box:fill-box;transform-origin:50% 100%;animation:k-pop .5s cubic-bezier(.2,1.7,.4,1) both}
.pr.snowman .s1{animation-delay:.1s}.pr.snowman .s2{animation-delay:.5s}.pr.snowman .s3{animation-delay:.9s}
.pr.icecream{transform-origin:50% 100%;animation:k-pop .5s cubic-bezier(.2,1.7,.4,1) both,k-wiggle 1.2s .6s ease-in-out infinite}

<script>/* ===== BéVui Kit 5 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1 };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const restart = (e, cls) => { if (!e) return; e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); };
  const center = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; };
  const inRect = (x, y, r, pad = 0) => x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  /* ---------- storage (never throws) ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { try { localStorage.removeItem(ns + k); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio core ---------- */
  const MUSIC_VOL = 0.22;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
      musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
      sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended' && !document.hidden && unlocked) ctx.resume().catch(() => { });
    return ctx;
  }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    const c = audio(); if (!c) return;
    try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { }
    if (c.state === 'suspended') c.resume().catch(() => { });
    if (music._want) music.start(music._want);
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { speech.stop(); if (ctx) ctx.suspend().catch(() => { }); }
    else if (ctx && unlocked) ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    if (!unlocked) return null;
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibDepth || 6; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + a + (o.hold || 0) + d + 0.05); }
    node.connect(g);
    if (o.pan != null && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); p.connect(bus); } else g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    if (!unlocked) return;
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    src.connect(f); f.connect(g);
    if (o.pan != null && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); p.connect(bus); } else g.connect(bus);
    src.start(t0, Math.random() * 1.2); src.stop(t0 + a + (o.hold || 0) + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.2, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus });
    tone({ f: f * 2, t, vol: vol * 0.22, dur: dur * 0.5, bus });
    tone({ f: f * 3.01, t, vol: vol * 0.07, dur: dur * 0.3, bus });
  }
  function marimba(f, t = 0, vol = 0.2, dur = 0.4, bus) { tone({ f, t, vol, dur, bus }); tone({ f: f * 4, t, vol: vol * 0.15, dur: dur * 0.16, bus }); }
  function pluck(f, t = 0, vol = 0.12, dur = 0.3, bus) { tone({ f, t, vol, dur, type: 'triangle', lp: 2200, bus }); }
  function drum(f = 140, t = 0, vol = 0.5) { tone({ f: f * 1.6, to: f * 0.55, slide: 0.12, dur: 0.28, vol, t }); noise({ t, f: 900, q: 0.6, dur: 0.06, vol: vol * 0.35, ft: 'lowpass' }); }

  const sfx = {
    tap() { tone({ f: 680, to: 940, dur: 0.06, vol: 0.11, type: 'triangle' }); },
    click() { tone({ f: 1300, dur: 0.03, vol: 0.06, type: 'triangle' }); },
    pop() { tone({ f: 360, to: 1250, slide: 0.07, dur: 0.1, vol: 0.3 }); noise({ f: 2600, q: 0.8, dur: 0.05, vol: 0.1 }); },
    good() { bell(1046.5, 0, 0.17, 0.5); bell(1318.5, 0.09, 0.17, 0.7); },
    great() { [784, 988, 1175, 1568].forEach((f, i) => bell(f, i * 0.07, 0.13, 0.5)); },
    bad() { tone({ f: 330, to: 300, dur: 0.15, vol: 0.13, type: 'triangle', lp: 1200 }); tone({ f: 262, to: 240, t: 0.17, dur: 0.24, vol: 0.13, type: 'triangle', lp: 1000 }); },
    star() { [1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.06, 0.08, 0.35)); },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.11, 0.16, 0.6));
      [1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.5 + i * 0.05, 0.05, 0.4));
    },
    fanfare() {
      const n = [[523.25, 0], [659.25, 0.13], [783.99, 0.26], [1046.5, 0.42], [783.99, 0.62], [1046.5, 0.76]];
      n.forEach(([f, t]) => { tone({ f, t, vol: 0.08, dur: 0.22, type: 'square', lp: 2600 }); bell(f, t, 0.1, 0.4); });
      [1568, 2093, 2637, 3136].forEach((f, i) => bell(f, 0.95 + i * 0.05, 0.05, 0.5));
    },
    whoosh() { noise({ f: 400, to: 3200, q: 1.2, dur: 0.28, vol: 0.12 }); },
    swish() { noise({ f: 2400, to: 700, q: 1.4, dur: 0.18, vol: 0.1 }); },
    pick() { tone({ f: 520, to: 820, dur: 0.08, vol: 0.13, type: 'triangle' }); },
    drop() { tone({ f: 620, to: 300, dur: 0.1, vol: 0.15 }); noise({ f: 320, q: 0.7, dur: 0.06, vol: 0.08, ft: 'lowpass' }); },
    snap() { tone({ f: 900, to: 1400, dur: 0.05, vol: 0.12, type: 'square', lp: 3000 }); noise({ f: 3000, q: 1, dur: 0.03, vol: 0.08 }); },
    thud() { tone({ f: 120, to: 60, dur: 0.18, vol: 0.35 }); noise({ f: 300, q: 0.5, dur: 0.08, vol: 0.12, ft: 'lowpass' }); },
    boing() { tone({ f: 170, to: 540, slide: 0.12, dur: 0.3, vol: 0.17 }); },
    squeak() { tone({ f: 900, to: 1500, slide: 0.08, dur: 0.12, vol: 0.08, type: 'triangle' }); tone({ f: 1500, to: 1100, t: 0.09, dur: 0.1, vol: 0.06, type: 'triangle' }); },
    coin() { tone({ f: 988, dur: 0.07, vol: 0.09, type: 'square', lp: 4000 }); tone({ f: 1319, t: 0.07, dur: 0.3, vol: 0.09, type: 'square', lp: 4000 }); },
    tick() { tone({ f: 1800, dur: 0.02, vol: 0.05 }); },
    sparkle() { for (let i = 0; i < 5; i++) bell(1800 + Math.random() * 2200, i * 0.045, 0.04, 0.25); },
    clap() { noise({ f: 1500, q: 0.9, dur: 0.07, vol: 0.32 }); noise({ t: 0.012, f: 2200, q: 1.2, dur: 0.05, vol: 0.18 }); },
    drum(i = 0) { drum(120 + i * 25); },
    kick() { tone({ f: 160, to: 55, slide: 0.1, dur: 0.16, vol: 0.45 }); noise({ f: 1200, q: 0.8, dur: 0.04, vol: 0.18 }); },
    cheer(dur = 1.4) { noise({ f: 1100, q: 0.5, a: 0.15, hold: dur * 0.5, dur: dur * 0.6, vol: 0.12 }); noise({ f: 2600, q: 0.7, a: 0.2, hold: dur * 0.4, dur: dur * 0.5, vol: 0.05 });
      for (let i = 0; i < 6; i++) tone({ f: rand(500, 900), to: rand(900, 1400), t: rand(0.05, dur * 0.6), dur: 0.25, vol: 0.02, type: 'triangle' }); },
    wobble() { tone({ f: 300, to: 260, dur: 0.4, vol: 0.12, type: 'triangle', vib: 9, vibDepth: 25 }); },
    yay() { tone({ f: 600, to: 900, slide: 0.15, dur: 0.25, vol: 0.09, type: 'triangle', vib: 7, vibDepth: 15 }); tone({ f: 900, to: 1200, t: 0.2, slide: 0.2, dur: 0.35, vol: 0.09, type: 'triangle', vib: 7, vibDepth: 20 }); },
  };

  /* ---------- background music (tiny 8th-note sequencer) ---------- */
  const songs = {
    happy: { bpm: 116, swing: 0.08, inst: 'marimba', bars: [
      { r: 48, c: [60, 64, 67], m: [72, 0, 74, 76, 0, 79, 0, 76] }, { r: 43, c: [59, 62, 67], m: [74, 0, 71, 0, 67, 0, 71, 74] },
      { r: 45, c: [57, 60, 64], m: [72, 0, 76, 0, 81, 0, 79, 76] }, { r: 41, c: [57, 60, 65], m: [77, 76, 74, 0, 72, 0, 0, 0] },
      { r: 48, c: [60, 64, 67], m: [76, 0, 79, 0, 84, 0, 79, 0] }, { r: 50, c: [57, 62, 65], m: [77, 0, 74, 0, 81, 0, 77, 0] },
      { r: 43, c: [59, 62, 67], m: [79, 0, 77, 76, 74, 0, 71, 0] }, { r: 48, c: [60, 64, 67], m: [72, 0, 67, 0, 72, 0, 0, 0] }] },
    gentle: { bpm: 92, swing: 0.05, inst: 'musicbox', bars: [
      { r: 43, c: [55, 59, 62], m: [79, 0, 0, 83, 86, 0, 83, 0] }, { r: 50, c: [54, 57, 62], m: [81, 0, 0, 78, 74, 0, 0, 0] },
      { r: 40, c: [55, 59, 64], m: [76, 0, 79, 0, 83, 0, 81, 79] }, { r: 48, c: [55, 60, 64], m: [76, 0, 0, 0, 72, 0, 0, 0] },
      { r: 43, c: [55, 59, 62], m: [79, 0, 83, 0, 86, 0, 91, 0] }, { r: 45, c: [57, 60, 64], m: [88, 0, 84, 0, 81, 0, 84, 0] },
      { r: 50, c: [54, 57, 62], m: [86, 0, 81, 0, 78, 0, 81, 0] }, { r: 43, c: [55, 59, 62], m: [79, 0, 0, 0, 0, 0, 0, 0] }] },
    adventure: { bpm: 104, swing: 0.06, inst: 'marimba', bars: [

function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function sh(h, k) { const [r, g, b] = hex2rgb(h); const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k); return '#' + [f(r), f(g), f(b)].map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join(''); }
const f1 = n => Math.round(n * 10) / 10;
function starPath(cx, cy, R, r, n = 5, rot = -90) {
  let d = ''; for (let i = 0; i < n * 2; i++) { const a = (rot + i * 180 / n) * Math.PI / 180, rr = i % 2 ? r : R; d += (i ? 'L' : 'M') + f1(cx + Math.cos(a) * rr) + ' ' + f1(cy + Math.sin(a) * rr); } return d + 'Z';
}
function flower(x, y, r, c, mid = '#ffe066') {
  let s = ''; for (let i = 0; i < 5; i++) { const a = (i * 72 - 90) * Math.PI / 180; s += `<circle cx="${f1(x + Math.cos(a) * r * .62)}" cy="${f1(y + Math.sin(a) * r * .62)}" r="${f1(r * .52)}" fill="${c}"/>`; }
  return s + `<circle cx="${x}" cy="${y}" r="${f1(r * .34)}" fill="${mid}"/>`;
}

const ARM = { L: { s: [76, 137], h: [58, 193] }, R: { s: [124, 137], h: [142, 193] } };
const armPt = (s, t) => { const a = ARM[s]; return [a.s[0] + (a.h[0] - a.s[0]) * t, a.s[1] + (a.h[1] - a.s[1]) * t]; };
const seg = (s, t0, t1, w, c) => { const p = armPt(s, t0), q = armPt(s, t1); return `<path d="M${f1(p[0])} ${f1(p[1])}L${f1(q[0])} ${f1(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`; };
function sleeves(len, w, c, cuff) { const o = {}; for (const s of ['L', 'R']) o['sl' + s] = seg(s, 0, len, w, c) + (cuff ? seg(s, len - .035, len, w + 1, cuff) : ''); return o; }

/* ================= ambience (synthesized, quiet, stops when leaving) ================= */
const amb = (() => {
  let timer = 0, kind = null, n = 0;
  function tick() {
    if (document.hidden || !Kit.unlocked || !Kit.settings.sound) return;
    n++;
    switch (kind) {
      case 'mua': Kit.noise({ f: 2400, q: .45, a: .25, hold: .3, dur: .5, vol: .045 }); if (Math.random() < .7) Kit.tone({ f: rand(1400, 2600), to: rand(700, 1100), dur: .05, vol: .018, type: 'sine' }); break;
      case 'gio': if (n % 2 === 0) { const f = 300 + Math.abs(Math.sin(n / 5)) * 700; Kit.noise({ f, to: f * 1.6, q: 1.2, a: .45, hold: .2, dur: .9, vol: .05 }); } break;
      case 'tuyet': case 'dong': if (n % 3 === 0) Kit.bell(rand(1800, 3200), 0, .018, .6); if (n % 4 === 0) Kit.noise({ f: 900, to: 500, q: .8, a: .5, dur: 1, vol: .02 }); break;
      case 'nang': case 'xuan': if (n % 4 === 0) { const b = rand(2300, 3000); for (let i = 0; i < 3; i++) Kit.tone({ f: b, to: b * 1.25, t: i * .11, dur: .07, vol: .025, type: 'sine' }); } break;
      case 'nong': case 'ha': if (n % 5 === 0) Kit.tone({ f: 4300, dur: 1.1, a: .2, vol: .012, type: 'sawtooth', lp: 6500, vib: 42, vibDepth: 700 }); break;
      case 'thu': if (n % 4 === 0) Kit.noise({ f: 500, to: 800, q: 1, a: .4, dur: .8, vol: .025 }); if (n % 7 === 0) Kit.tone({ f: rand(1800, 2200), dur: .2, vol: .012, type: 'triangle' }); break;
    }
  }
  return {
    start(k) { if (kind === k && timer) return; this.stop(); kind = k; if (!k || k === 'room') return; timer = setInterval(tick, 320); },
    stop() { clearInterval(timer); timer = 0; kind = null; },
  };
})();

function addPhoto(rec) {

  album.unshift(rec); if (album.length > 30) album.length = 30;
  store.set('album', album); updAlbumBadge();

function photoSVG(rec, full) {
  const room = rec.bg === 'room', w = room ? 'nang' : rec.bg;
  const kid = charInner({ ch: rec.ch, wear: rec.wear, colors: Object.assign({}, rec.colors || {}), hair: rec.hair, mood: rec.mood, pose: rec.pose }).svg;
  const d = new Date(rec.t || Date.now()), label = WX[rec.bg] ? WX[rec.bg].name : `${d.getDate()}/${d.getMonth() + 1}`;
  return `<svg ${full ? 'xmlns="http://www.w3.org/2000/svg" width="600" height="700" ' : ''}viewBox="0 0 300 350">${full ? `<defs>${DEFS}</defs>` : ''}

}
function exportPNG(rec) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { try { const c = document.createElement('canvas'); c.width = 600; c.height = 700; c.getContext('2d').drawImage(img, 0, 0, 600, 700); res(c.toDataURL('image/png')); } catch (e) { rej(e); } };

}

  Kit.bar.setMid(d);
}
function showSeason(i) {
  S.sp = i; S.tok++;
  const se = SEASONS[i], tok = S.tok;
  $('#sScene').innerHTML = sceneSVG(se.id);
  sParts.resize(); sParts.set(PTYPE[se.id]); amb.start(se.id);
  $('#sTag').textContent = se.name; $('#scard').style.setProperty('--sc', se.col); $('#sv').style.setProperty('--sc', se.col);
  mountKid($('#sKid'), 'story', { ch: S.ch, wear: se.wear[0], colors, hair: hairOf(S.ch), mood: 'happy' });
  Kit.restart($('#scard'), 'in');
  $('#lyr').innerHTML = se.lines.map(l => `<div class="ln">${l.split(' ').map(w => `<span class="w">${w}</span>`).join('')}</div>`).join('');
  $('#sPrev').classList.toggle('dis', i === 0); $('#sPrev').style.visibility = i === 0 ? 'hidden' : '';
  $('#sNext').lastChild.textContent = i === 3 ? 'Đố vui' : 'Tiếp';
  $('#sNext').classList.remove('pulse');
  storyDots(); layoutStory();
  setTimeout(() => { if (tok === S.tok) sing(); }, 700);
}
function sing() {
  S.tok++; const tok = S.tok, se = SEASONS[S.sp], k = kids.story;
  Kit.stopSpeech(); Kit.hand.hide();
  const ws = $$('#lyr .w'); ws.forEach(w => w.classList.remove('on', 'done'));
  let t = 0, j = 0;
  setPose(k, 'wave'); setAnim(k, 'a-sway');
  se.lines.forEach((line, li) => {
    const n = line.split(' ').length;
    setTimeout(() => { if (tok === S.tok) Kit.say(line, { rate: .9 }); }, t);
    for (let q = 0; q < n; q++, j++) {
      const idx = j, note = se.notes[idx % se.notes.length], at = t + q * 430;
      setTimeout(() => {
        if (tok !== S.tok) return;
        if (idx) ws[idx - 1].classList.replace('on', 'done');
        ws[idx].classList.add('on');
        Kit.bell(Kit.mtof(note), 0, .09, .5); Kit.pluck(Kit.mtof(note - 24), 0, .08, .3);
        if (q % 2 === 0) { setAnim(k, null); void k.getBoundingClientRect(); setAnim(k, 'a-jump'); }
      }, at);
    }
    t += n * 430 + 450;
  });
  setTimeout(() => {
    if (tok !== S.tok) return;
    ws.forEach(w => { w.classList.remove('on'); w.classList.add('done'); });
    setAnim(k, null); setPose(k, 'cheer'); updKid('story', { ch: S.ch, wear: se.wear[0], colors, hair: hairOf(S.ch), mood: 'joy' });
    Kit.sfx.sparkle(); $('#sNext').classList.add('pulse');
    if (rounds < 3 && S.sp === 0) { const c = Kit.center($('#sNext')); Kit.hand.tap(c.x, c.y); }
  }, t);
}
$('#sSing').addEventListener('click', () => sing());
$('#sPrev').addEventListener('click', () => { if (S.sp > 0) { Kit.sfx.swish(); showSeason(S.sp - 1); } });
$('#sNext').addEventListener('click', () => { Kit.sfx.whoosh(); if (S.sp < 3) showSeason(S.sp + 1); else startQuiz(); });
$('#sKid').addEventListener('pointerdown', () => { const k = kids.story; if (!k) return; Kit.sfx.boing(); setAnim(k, null); void k.getBoundingClientRect(); setAnim(k, 'a-jump'); });

/* ================= Bốn mùa: drag the outfit to its season ================= */
function startQuiz() {
  S.mode = 'quiz'; S.tok++; S.qWrong = 0; S.qDone = 0; S.busy = false;
  Kit.go('quiz', { back: () => { S.tok++; Kit.go('select'); } });
  Kit.music.start('happy'); amb.stop(); sParts.off();
  const qt = $('#qt'), tray = $('#qtray'); qt.innerHTML = ''; tray.innerHTML = '';
  SEASONS.forEach(se => {
    const t = el('div', 'qs', `<div class="scene">${sceneSVG(se.id, true)}</div><div class="slotk"></div><b>${se.name}</b>`);
    t.dataset.s = se.id; t.style.setProperty('--sc', se.col); qt.appendChild(t);
  });
  const chs = shuffle(CHARS.map(c => c.id));
  shuffle(SEASONS).forEach((se, i) => {
    const wear = pick(se.wear), ch = chs[i % chs.length];
    const c = el('button', 'qcard', charSVG({ ch, wear, colors, hair: hairOf(ch), mood: 'happy' }));
    c.dataset.s = se.id; c._o = { ch, wear }; c.setAttribute('aria-label', 'Bộ đồ ' + (i + 1)); c.wrong = 0;
    tray.appendChild(c); bindCard(c);
  });
  quizPips(); layoutQuiz();
  const tok = S.tok;
  setTimeout(() => {
    if (tok !== S.tok) return;
    Kit.say('Bé kéo bộ quần áo vào đúng mùa nhé!');
    if ((best.sea || 0) === 0) setTimeout(() => { if (tok === S.tok && !S.qDone) quizHint(); }, 1500);
  }, 500);
}
function quizPips() {
  const p = el('div', 'pips');
  SEASONS.forEach(se => { const done = $(`.qs[data-s="${se.id}"]`).classList.contains('done'); p.appendChild(el('i', done ? 'done' : '', wIcon(se.id) + (done ? `<span class="ps">${Kit.icon('star')}</span>` : ''))); });
  Kit.bar.setMid(p);
}
function quizHint() {
  const c = $$('#qtray .qcard:not(.gone)')[0]; if (!c) return;
  const t = $(`.qs[data-s="${c.dataset.s}"]`), a = Kit.center(c), b = Kit.center(t);
  Kit.hand.drag(a.x, a.y, b.x, b.y);
}
function qsAt(x, y) { return $$('#qt .qs:not(.done)').find(t => Kit.inRect(x, y, t.getBoundingClientRect(), 10)) || null; }
function bindCard(c) {
  let ghost = null, moved = false, ox = 0, oy = 0, r0 = null;
  Kit.drag(c, {
    can: () => !S.busy && !c.classList.contains('gone'),
    start(e) { moved = false; r0 = c.getBoundingClientRect(); ox = e.clientX - r0.left; oy = e.clientY - r0.top; Kit.hand.hide(); },
    move(e, i) {
      if (!moved && Math.hypot(i.dx, i.dy) < 8) return;
      if (!moved) {
        moved = true; Kit.sfx.pick();
        ghost = c.cloneNode(true); ghost.classList.add('ghost');
        Object.assign(ghost.style, { left: r0.left + 'px', top: r0.top + 'px', width: r0.width + 'px', height: r0.height + 'px', margin: 0 });
        $('#qv').appendChild(ghost); c.style.opacity = '.25';
      }
      ghost.style.transform = `translate(${e.clientX - ox - r0.left}px,${e.clientY - oy - r0.top}px) scale(1.08) rotate(-4deg)`;
      const t = qsAt(e.clientX, e.clientY); $$('#qt .qs').forEach(q => q.classList.toggle('hot', q === t));
    },
    end(e, i) {
      $$('#qt .qs').forEach(q => q.classList.remove('hot'));
      if (!moved) { if (!i.cancel) { Kit.sfx.squeak(); Kit.restart(c, 'k-jump'); const se = SEASONS.find(s => s.id === c.dataset.s); Kit.say(worn(c._o.wear).slice(0, 3).map(id => IT[id].name).join(', ')); void se; } return; }
      const g = ghost; ghost = null; c.style.opacity = '';
      const t = i.cancel ? null : qsAt(e.clientX, e.clientY);
      if (t && t.dataset.s === c.dataset.s) { g.remove(); placeCard(c, t); }
      else {
        const r1 = c.getBoundingClientRect();
        g.animate([{ transform: g.style.transform }, { transform: `translate(${r1.left - r0.left}px,${r1.top - r0.top}px)` }], { duration: 280, easing: 'ease-in' }).onfinish = () => g.remove();
        if (t) {
          S.qWrong++; c.wrong++; Kit.sfx.bad(); Kit.retry({ speak: false, top: '40%' }); Kit.restart(c, 'shake');
          const se = SEASONS.find(s => s.id === t.dataset.s);
          Kit.say(`Chưa đúng! Đây là ${se.name.toLowerCase()}. Bé nhìn quần áo nhé!`);
          if (c.wrong >= 2) { const right = $(`.qs[data-s="${c.dataset.s}"]`); right.classList.add('hint'); setTimeout(() => right.classList.remove('hint'), 2600); }
        } else Kit.sfx.swish();
      }
    }
  });
}
function placeCard(c, t) {
  const se = SEASONS.find(s => s.id === t.dataset.s), tok = S.tok;
  c.classList.add('gone'); t.classList.add('done'); S.qDone++;
  const slot = $('.slotk', t);
  mountKid(slot, 'q' + se.id, { ch: c._o.ch, wear: c._o.wear, colors, hair: hairOf(c._o.ch), mood: 'joy', cls: 'a-jump' });
  setPose(kids['q' + se.id], 'cheer');
  Kit.sfx.good(); Kit.praise(pick(Kit.PRAISE), { speak: false, top: '40%' });
  const p = Kit.center(t); Kit.burst(p.x, p.y, { n: 18 });
  Kit.say(se.lines[1]);
  quizPips();
  if (S.qDone >= 4) {
    S.busy = true;
    setTimeout(() => {
      if (tok !== S.tok) return;
      const stars = S.qWrong === 0 ? 3 : S.qWrong <= 2 ? 2 : 1;
      if ((best.sea || 0) < stars) { best.sea = stars; store.set('best', best); }
      rounds++; store.set('rounds', rounds);
      Kit.result({
        hero: charSVG({ ch: S.ch, wear: { top: 'vayLien', hat: 'vuongMien', held: 'bong' }, colors, hair: hairOf(S.ch), mood: 'joy', cls: 'p-cheer a-jumps' }),
        title: ['', 'Giỏi lắm!', 'Hay quá!', 'Xuất sắc!'][stars], stars,
        text: 'Xuân, hạ, thu, đông — bé biết cả bốn mùa!', say: 'Giỏi quá! Bé biết mặc quần áo cho cả bốn mùa rồi!',
        buttons: [
          { label: 'Chơi lại', icon: 'replay', cls: 'ok', onClick: () => startQuiz() },
          { label: 'Hát lại', icon: 'music', cls: 'pink', onClick: () => startStory() },
          { label: 'Trò khác', icon: 'grid', cls: 'white', onClick: () => { S.tok++; Kit.go('select'); } },
        ]
      });
    }, 1500);
  }
}

/* ================= layout ================= */
function layout() {
  const s = Kit.screen;
  if (s === 'play') layoutPlay(); else if (s === 'story') layoutStory(); else if (s === 'quiz') layoutQuiz();
  else if (s === 'select' || s === 'wsel') layoutSelect(); else if (s === 'title') layoutTitle();
}
function avail(pad = 20) { const bh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar-h')) || 70; return { W: innerWidth - pad, H: innerHeight - bh - 14, bh }; }
function layoutTitle() {
  const { W, H } = avail(32), land = W / H > 1.2;
  const th = land ? Math.min(H * .78, W * .42, 680) : Math.min(W * .76, H * .44, 560);
  $('#title').style.setProperty('--th', th + 'px');
}
const mi0 = H => H > 700 ? 150 : 118;
function layoutSelect() {
  const { W, H } = avail(28), port = W / H < 1, R = document.documentElement.style;
  const cb = clamp(Math.min((W - 3 * 14) / 4, H * (port ? .13 : .2)), 56, 150);
  const mi = port ? clamp((H - cb - 70 - 3 * 26 - 2 * 14) / 3, 60, 150) : clamp(Math.min(W / 3 * .5, H - cb - 70 - mi0(H)), 56, 230);
  R.setProperty('--cb', cb + 'px'); R.setProperty('--mi', mi + 'px'); R.setProperty('--modew', (port ? Math.min(W, 520 + Math.max(0, mi - 110) * 3) : Math.min(W, 980 + Math.max(0, mi - 150) * 4)) + 'px');
  const g = $('#wgrid'); if (!g) return;
  let bestW = 0, bc = 3;
  for (const cols of [2, 3, 6]) { const rows = Math.ceil(6 / cols), tw = Math.min((W - (cols - 1) * 14) / cols, ((H - 50 - (rows - 1) * 14) / rows - 66) * 1.6 + 16); if (tw > bestW) { bestW = tw; bc = cols; } }
  bestW = Math.min(bestW, 440);
  g.style.gridTemplateColumns = `repeat(${bc},${Math.floor(bestW)}px)`; g.style.width = 'auto'; g.style.maxWidth = 'none';
}
function layoutPlay() {
  const pv = $('#pv'), r = pv.getBoundingClientRect(); if (!r.width) return;
  const free = S.mode === 'free', W = r.width - 20, H = r.height - 12 - (parseFloat(getComputedStyle(pv).paddingBottom) - 10 || 0);
  const land = W / H > 1.15;
  pv.classList.toggle('land', land);
  const st = $('#stage'), wd = $('#ward');
  let sw, sh, ww, wh;
  if (land) { sh = H; sw = Math.min(W * (free ? .46 : .56), H * (free ? 1.05 : 1.3)); ww = Math.min(W - sw - 14, 720); wh = H; }
  else { sw = W; sh = Math.min(H * (free ? .46 : .54), W * 1.25); ww = W; wh = H - sh - 10; }
  Object.assign(st.style, { width: sw + 'px', height: sh + 'px' });
  Object.assign(wd.style, { width: ww + 'px', height: wh + 'px', flex: '0 0 auto' });
  /* character: right of the window, fully visible */
  const kw = Math.min(sh * .84 / 1.4583, sw * .62);
  const k = Math.max(sw / 400, sh / 300), x0 = (sw - 400 * k) / 2, winR = x0 + (WIN.x + WIN.w) * k;
  const roomOn = !$('#room').classList.contains('hidden');
  let cx = roomOn ? clamp(winR + kw * .2, sw * .5, sw - kw * .38) : sw * .52;
  const kb = $('#kidbox'); kb.style.setProperty('--kw', kw + 'px'); kb.style.left = cx + 'px';
  const ui = clamp(Math.min(sw, sh) * .06, 15, 24);
  st.style.setProperty('--wbf', ui + 'px'); st.style.setProperty('--gof', clamp(Math.min(sw * .06, sh * .065), 17, 30) + 'px');
  st.style.setProperty('--tb', clamp(sh / 6.2, 46, 62) + 'px'); st.style.setProperty('--tis', clamp(Math.min(sw, sh) * .16, 44, 84) + 'px');
  parts.resize();
  layoutWard();
}
function layoutWard() {
  const wd = $('#ward'); if (!wd || Kit.screen !== 'play') return;
  const ww = parseFloat(wd.style.width) - 28, wh = parseFloat(wd.style.height) - 28; if (!(ww > 0)) return;
  const n = tabList().length;
  const tw = ww - 14;
  let tb = Math.min(innerWidth > 1000 ? 74 : 64, (tw - (n - 1) * 6) / n), rows = 1;
  if (tb < 46) { rows = 2; tb = Math.min(58, (tw - (Math.ceil(n / 2) - 1) * 6) / Math.ceil(n / 2)); }
  const tabsH = rows * tb + (rows - 1) * 6 + 12;
  let palH = 0;
  const pal = $('#pal'), st = $('#stage');
  if (S.mode === 'free') {
    const np = 11; let sw = Math.min(46, (ww - (np - 1) * 6) / np), pr = 1;
    if (sw < 34) { pr = 2; sw = Math.min(46, (ww - 5 * 6) / 6); }
    palH = pr * sw + (pr - 1) * 6 + 8;
    const land = $('#pv').classList.contains('land');
    if (!land && wh - tabsH - 8 - palH < 128) {
      if (pal.parentNode !== st) st.appendChild(pal);
      palH = 0; sw = clamp((parseFloat(st.style.height) - 36 - 4 * 6) / 5, 30, 44);
      pal.style.maxWidth = ''; pal.style.margin = '';
    } else {
      if (pal.parentNode !== wd) wd.appendChild(pal);
      pal.style.maxWidth = pr === 2 ? (6 * sw + 5 * 6 + 4) + 'px' : ''; pal.style.margin = '0 auto';
    }
    $('#pv').style.setProperty('--sw', sw + 'px');
  } else if (pal.parentNode !== wd) wd.appendChild(pal);
  wd.style.setProperty('--tab', tb + 'px'); wd.style.setProperty('--tabh', tabsH + 'px');
  $('#tabs').style.maxWidth = rows === 2 ? (Math.ceil(n / 2) * (tb + 6) + 14) + 'px' : ''; $('#tabs').style.margin = '0 auto';
  const N = Math.max(1, $$('#items .wi').length), ih = wh - tabsH - 8 - palH, gap = clamp(ww * .025, 6, 12);
  let cell = 0, cols = 3;
  for (let c = 2; c <= 8; c++) { const rr = Math.ceil(N / c), s = Math.min((ww - (c - 1) * gap) / c, (ih - (rr - 1) * gap) / rr); if (s > cell + .5) { cell = s; cols = c; } }
  cell = Math.max(40, Math.min(cell, innerWidth > 1000 && innerHeight > 900 ? 230 : innerWidth > 1000 && innerHeight > 700 ? 190 : 132));
  const it = $('#items'); it.style.setProperty('--cols', cols); it.style.setProperty('--cell', Math.floor(cell) + 'px'); it.style.setProperty('--gap', gap + 'px');
}
function layoutStory() {
  const sv = $('#sv'); const { W, H } = avail(24), land = W / H > 1.15;
  sv.classList.toggle('land', land);
  let cw, ch;
  if (land) { ch = H * .9; cw = Math.min(ch * 1.15, W * .55); ch = Math.min(ch, cw / 1.0); }
  else { cw = Math.min(W, H * .64 * 1.05); ch = Math.min(cw / 1.05, H * .64); }
  sv.style.setProperty('--scw', cw + 'px'); sv.style.setProperty('--sch', ch + 'px');
  sv.style.setProperty('--lf', clamp(Math.min(land ? W * .032 : W * .055, H * (land ? .075 : .055)), 17, 46) + 'px');
  sParts.resize();
}
function layoutQuiz() {
  const qv = $('#qv'); if (!qv) return; const { W, H } = avail(20), land = W / H > 1.15, g = clamp(Math.min(W, H) * .04, 12, 20);
  let qc, qw, qh, cw, chh;
  if (land) { qc = 4; qw = Math.min((W - 3 * g) / 4, H * .5 * 1.15); qh = qw / 1.15; chh = Math.min(H - qh - 3 * g - 10, qh * 1.05); cw = chh * .74; }
  else { qc = 2; qw = Math.min((W - g) / 2, (H * .6 - g) / 2 * 1.15); qh = qw / 1.15; chh = Math.min(H - 2 * qh - 3 * g - 12, ((W - 3 * g) / 4) / .74); cw = chh * .74; }
  qv.style.setProperty('--qc', qc); qv.style.setProperty('--qw', qw + 'px'); qv.style.setProperty('--qh', qh + 'px'); qv.style.setProperty('--qg', g + 'px');
  qv.style.setProperty('--cardw', cw + 'px'); qv.style.setProperty('--cardh', chh + 'px');
}
Kit.onResize(layout);

/* ================= boot ================= */
(function deco() {
  const d = $('#deco');
  for (let i = 0; i < 5; i++) {
    const c = el('div', 'k-cloud'); const w = rand(90, 190);
    Object.assign(c.style, { width: w + 'px', height: w * .32 + 'px', top: rand(4, 70) + '%', animationDuration: rand(40, 80) + 's', animationDelay: -rand(0, 80) + 's', opacity: rand(.5, .85) });
    d.appendChild(c);
  }
})();
$('#bPlay').addEventListener('click', () => Kit.go('select'));
$('#bAlbum').addEventListener('click', () => Kit.go('album'));
$('#tKid').addEventListener('pointerdown', () => {
  const k = kids.title; if (!k) return;
  Kit.sfx.boing(); setAnim(k, null); void k.getBoundingClientRect(); setAnim(k, 'a-jump');
  Kit.say(`Chào bé! Mình là ${CH(S.ch).name}.`);
  setTimeout(() => setAnim(k, null), 700);
});
Object.assign(GAME_DEBUG, { SEASONS, startWeather, startFree, layout, get kid() { return kids.play; } });
document.documentElement.classList.add('boot');
Kit.go('title');
layoutTitle();
setTimeout(() => document.documentElement.classList.remove('boot'), 800);
</script>
