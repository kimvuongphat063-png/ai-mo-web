<!DOCTYPE html>
<html lang="vi" data-game="robot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5cb8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rô-bốt Lập Trình</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}

/* ===== Kit v2 additions (Bộ game 2) ===== */
/* tutorial hand */
.k-hand{position:fixed;z-index:72;left:0;top:0;width:clamp(54px,9vmin,78px);height:auto;pointer-events:none;opacity:0;
  filter:drop-shadow(0 6px 6px rgba(30,10,80,.25));transition:opacity .25s;will-change:transform}
.k-hand.on{opacity:1}
.k-hand .tapring{transform-origin:22px 10px;animation:k-ring 1s ease-out infinite}
@keyframes k-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* segmented chips (Dễ / Vừa / Khó …) */
.k-seg{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(40,20,90,.12)}
.k-seg button{border:none;cursor:pointer;min-height:48px;min-width:56px;padding:0 16px;border-radius:999px;background:transparent;
  font:800 clamp(16px,2.6vmin,21px)/1 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.k-seg button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.k-seg button:active{transform:translateY(2px)}
/* tile buttons for mode / level grids */
.k-tile{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;color:var(--ink);padding:12px 10px 10px;
  box-shadow:0 7px 0 rgba(40,20,90,.16),0 12px 20px rgba(40,20,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:800 clamp(16px,2.7vmin,22px)/1.05 var(--font);transition:transform .14s,box-shadow .14s;min-height:64px;text-align:center}
.k-tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(40,20,90,.16)}
.k-tile .emo{font-size:clamp(34px,6.4vmin,54px)}
.k-tile small{font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .k-tstars{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5;display:block}
.k-mini-star.on svg{color:#ffc83d;filter:drop-shadow(0 1px 0 #e09a00)}
/* scrollable screen body under the bar */
.k-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--bar-h) + var(--safe-t) + 6px) calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l));
  display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  box-shadow:0 4px 0 rgba(40,20,90,.12);white-space:nowrap}
.k-pill .emo{font-size:1.3em}
@keyframes k-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}50%{filter:drop-shadow(0 0 14px rgba(255,220,80,.95))}}
.k-glow{animation:k-glow 1.2s ease-in-out infinite}
@keyframes k-squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}}
.k-squash{animation:k-squash .5s ease}
@keyframes k-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.k-jump{animation:k-jump .5s cubic-bezier(.3,1.5,.5,1)}
</style>
<style>
:root{--c1:#3d8bff;--c1d:#2563d6;--c2:#ff6fa5;--c2d:#d9467f;--bg1:#9fdcff;--bg2:#d8f5c8;--ink:#28396b;--ink-soft:#5f6f99;--bk:56px;--rows:2}
body{background:linear-gradient(180deg,#8fd5ff 0%,#c4ecff 52%,#dff7cf 100%);transition:background .6s}
body.night{background:linear-gradient(180deg,#232b66 0%,#3d3b8f 55%,#6e58b8 100%)}
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sky .cl{position:absolute;width:150px;height:46px;border-radius:40px;background:rgba(255,255,255,.8);animation:drift 46s linear infinite}
.sky .cl::before,.sky .cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
.sky .cl::before{width:66px;height:66px;left:22px;top:-30px}.sky .cl::after{width:50px;height:50px;left:70px;top:-20px}
.sky .st{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;transition:opacity .6s}
body.night .sky .cl{opacity:0}
body.night .sky .st{opacity:.8;animation:twk 2.4s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes twk{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:.95;transform:scale(1.1)}}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.4vmin,14px);padding:calc(var(--bar-h) + 4px) 16px 20px}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floaters>*{position:absolute;animation:fl 9s ease-in-out infinite}
.floaters .fb{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);opacity:.85}
.floaters .fb svg{width:62%;height:62%;color:#fff}
.floaters .gear{width:70px;height:70px;opacity:.55}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1))}}
.floaters .gear{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mascot{width:clamp(130px,29vmin,240px);height:auto;overflow:visible;position:relative;z-index:1;cursor:pointer;touch-action:manipulation}
.title-txt{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.logo{--c1d:#2563d6}
.logo .l2{color:#ffe36e}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:clamp(8px,2vmin,18px)}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #title{flex-direction:row;gap:5vw}
  .mascot{width:34vmin}
}
/* mascot parts */
.m-body{animation:mbob 2.6s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.m-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.m-ant{transform-origin:100px 50px;animation:ant 1.8s ease-in-out infinite}
@keyframes ant{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.m-armR{transform-origin:146px 156px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.m-heart{transform-box:fill-box;transform-origin:center;animation:k-pulse 1.1s ease-in-out infinite}
.m-glow{animation:glw 1.8s ease-in-out infinite}
@keyframes glw{0%,100%{opacity:.35}50%{opacity:.9}}
.m-pupils{transition:transform .15s ease-out}
.mascot.hop .m-body{animation:mhop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes mhop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-4deg)}}
.mascot .mh{display:none}.mascot.happy .mn{display:none}.mascot.happy .mh{display:inline}

/* ---------- select ---------- */
#select .k-scroll{gap:12px}
.freebtn{display:flex;align-items:center;gap:14px;border:none;cursor:pointer;border-radius:26px;padding:10px 22px 10px 12px;background:#fff;color:var(--ink);
  font:800 clamp(20px,3.4vmin,28px)/1 var(--font);box-shadow:0 7px 0 rgba(30,60,140,.16);transition:transform .14s}
.freebtn:active{transform:translateY(5px)}
.freebtn .fic{width:62px;height:62px;border-radius:18px;background:linear-gradient(160deg,#ffd166,#ff9f43);display:grid;place-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.freebtn .fic svg{width:44px;height:44px}
.freebtn small{display:block;font-size:.6em;color:var(--ink-soft);margin-top:4px}
.world{width:min(960px,100%);background:rgba(255,255,255,.6);border-radius:26px;padding:10px clamp(8px,1.6vmin,16px) 14px;box-shadow:0 6px 0 rgba(30,60,140,.1)}
.wh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(18px,3vmin,24px);color:var(--wd)}
.wh .emo{font-size:1.3em}
.wh .ws{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:.85em;color:var(--ink-soft)}
.wh .ws svg{width:22px;height:22px;color:#ffc83d}
.lvls{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.4vmin,12px);margin-top:8px}
.lvl{position:relative;border:none;cursor:pointer;border-radius:20px;background:#fff;padding:12px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 6px 0 rgba(30,60,140,.16);transition:transform .14s;min-height:60px}
.lvl:active{transform:translateY(4px)}
.lvl .num{position:absolute;top:-9px;left:-5px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--wc);color:#fff;font:800 17px/30px var(--font);box-shadow:0 3px 0 var(--wd)}
.lvl svg.mm{width:84%;height:auto;display:block;border-radius:7px}
.lvl .st{display:flex;gap:0}
.lvl .st .k-mini-star svg{width:clamp(13px,2.4vmin,19px)}
.lvl .tl{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.lvl .tl svg{width:20px;height:20px}
@media (max-height:520px){ .lvl{padding-top:9px} .lvl svg.mm{width:62%} }
@media (max-width:520px) and (orientation:portrait){ .lvls{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px} .lvl svg.mm{width:78%} }

/* ---------- play ---------- */
#play{justify-content:flex-start}
.stage{position:absolute;left:0;right:0;bottom:0;top:calc(var(--bar-h) + var(--safe-t));display:flex;gap:8px;
  padding:4px calc(8px + var(--safe-r)) calc(8px + var(--safe-b)) calc(8px + var(--safe-l))}
.stage.por{flex-direction:column}
.stage.lan{flex-direction:row;align-items:stretch}
.bwrap{position:relative;flex:1 1 auto;min-width:0;min-height:0;display:grid;place-items:center}
.stage.lan .bwrap{flex:0 0 var(--side)}
.panel,.etools{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;min-width:0;align-items:stretch}
.stage.lan .panel,.stage.lan .etools{flex:1 1 auto;justify-content:center}

.board{position:relative;--t:60px;border-radius:calc(var(--t) * .26);box-shadow:0 10px 0 rgba(20,40,90,.16),0 16px 30px rgba(20,40,90,.18);touch-action:none}
.board.intro{animation:bin .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.board>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.ob{position:absolute;left:0;top:0;width:calc(100% / var(--W));height:calc(100% / var(--H));pointer-events:none}
.ob>svg{width:100%;height:100%;display:block;overflow:visible}
.ob.sw,.ob.lamp,.ob.wv{z-index:1}.ob.goal{z-index:2}.ob.batt,.ob.gate{z-index:3}
.intro .ob>svg{animation:obin .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--dl,0s)}
@keyframes obin{from{transform:scale(0)}to{transform:scale(1)}}
.ob.batt .bi{animation:bbob 1.8s ease-in-out infinite}
@keyframes bbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ob.batt.got>svg{transition:transform .3s,opacity .3s;transform:scale(0);opacity:0}
.ob.batt.back>svg{animation:obin .45s cubic-bezier(.2,1.6,.4,1) both}
.ob.goal .rays{transform-origin:50px 50px;animation:spin 9s linear infinite}
.ob.goal.star .sb{transform-origin:50px 52px;animation:k-pulse 1.8s ease-in-out infinite}
.ob.goal.pulse>svg{animation:gpulse .5s ease-in-out 3}
@keyframes gpulse{50%{transform:scale(1.25)}}
.ob.goal .door{transition:fill .3s}
.ob.goal.in .door{fill:#2a1b10}
.lamp .glass{fill:#c9d2ea;transition:fill .3s}.lamp .halo{opacity:0;transition:opacity .4s}.lamp .bulb{fill:#9aa6c6;transition:fill .3s}
.lamp.on .glass{fill:#ffe45c}.lamp.on .bulb{fill:#fff}.lamp.on .halo{opacity:1;animation:k-pulse 1.4s ease-in-out infinite;transform-origin:50px 46px}
.sw .btop{transition:transform .25s}.sw .led{fill:#ff5d5d;transition:fill .3s}
.sw.on .btop{transform:translateY(7px)}.sw.on .led{fill:#3ecf6e}
.gate .bars{transform-origin:50px 86px;transition:transform .5s cubic-bezier(.5,1.6,.5,1)}
.gate .led{fill:#ff5d5d;transition:fill .3s}
.gate.open .bars{transform:scaleY(.08)}.gate.open .led{fill:#3ecf6e}
.gate.rattle>svg{animation:k-shake .4s}
.blinking>svg{animation:blinkit .45s ease-in-out 5}
@keyframes blinkit{50%{transform:scale(1.3);filter:drop-shadow(0 0 8px #fff) brightness(1.3)}}
.ob.wv svg{animation:wvm 3s ease-in-out infinite}
@keyframes wvm{0%,100%{transform:translateX(-4%)}50%{transform:translateX(4%)}}
.ob.wv.void svg{animation:twk 2.6s ease-in-out infinite}

.robot{position:absolute;left:0;top:0;width:calc(100% / var(--W));height:calc(100% / var(--H));z-index:5;pointer-events:none}
.rb-sh{position:absolute;left:18%;right:18%;bottom:7%;height:16%;border-radius:50%;background:rgba(20,30,70,.22)}
.rb-hop{position:absolute;inset:4%}
.rb-rot{width:100%;height:100%}
.rb-rot>svg{width:100%;height:100%;display:block;overflow:visible;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.rbsvg .e-norm{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
.rbsvg .rb-ant{transform-box:fill-box;transform-origin:center;animation:antb 1.4s ease-in-out infinite}
@keyframes antb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(1.5px,1px) scale(1.18)}}
.rbsvg .e-happy,.rbsvg .e-oops,.rbsvg .m-sad{display:none}
.happy .rbsvg .e-norm,.oops .rbsvg .e-norm{display:none}
.happy .rbsvg .e-happy{display:inline}
.oops .rbsvg .e-oops,.oops .rbsvg .m-sad{display:inline}.oops .rbsvg .m-smile{display:none}
.bub{position:absolute;z-index:8;transform:translate(-50%,-100%);background:#fff;border-radius:16px;padding:2px 12px;font-weight:800;
  font-size:clamp(18px,calc(var(--t) * .34),30px);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.14);white-space:nowrap;pointer-events:none;
  animation:bubp .35s cubic-bezier(.2,1.6,.4,1) both;display:flex;align-items:center;gap:4px}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.below{transform:translate(-50%,0)}
.bub.below::after{top:-8px;bottom:auto;border-top:0;border-bottom:8px solid #fff}
.bub svg{width:1.4em;height:1.4em}
.bub.oops{color:#e0344f}
@keyframes bubp{from{scale:.3;opacity:0}to{scale:1;opacity:1}}

/* program strip */
.prog{position:relative;background:rgba(255,255,255,.93);border-radius:22px;padding:6px 7px;height:calc(var(--rows) * (var(--bk) + 12px) + 8px);
  overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;box-shadow:inset 0 3px 0 rgba(40,60,120,.07),0 5px 0 rgba(30,50,110,.14)}
.strip{display:flex;flex-wrap:wrap;gap:4px 5px;align-content:flex-start;align-items:center;min-height:100%}
.strip>.blk,.strip>.slot{margin:4px 0}
.blk{position:relative;flex:none;width:var(--bk);height:var(--bk);border-radius:calc(var(--bk) * .27);display:grid;place-items:center;background:var(--b);color:#fff;
  box-shadow:inset 0 -5px 0 var(--bd),0 3px 6px rgba(20,30,80,.16);touch-action:none;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s}
.blk svg{width:60%;height:60%;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.blk.F{--b:#3fa0f5;--bd:#1f78cc}.blk.L{--b:#9a6bff;--bd:#7448e0}.blk.R{--b:#ff6fa5;--bd:#d9467f}
.blk.A{--b:#ffb21e;--bd:#d98a00}.blk.P{--b:#36c96a;--bd:#1f9e4e}
.blk.newb{animation:popin .38s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popin{0%{transform:scale(.2)}100%{transform:scale(1)}}
.blk.run{transform:translateY(-4px) scale(1.1);box-shadow:inset 0 -5px 0 var(--bd),0 0 0 4px #fff,0 0 16px 6px rgba(255,214,60,.95);z-index:2}
.blk.next{box-shadow:inset 0 -5px 0 var(--bd),0 0 0 3px #fff,0 0 0 6px rgba(63,160,245,.55)}
.blk.err{box-shadow:inset 0 -5px 0 var(--bd),0 0 0 4px #ff3d5e,0 0 14px 4px rgba(255,61,94,.55);animation:k-shake .45s}
.blk.err::after{content:"!";position:absolute;top:-9px;right:-7px;width:22px;height:22px;border-radius:50%;background:#ff3d5e;color:#fff;font:800 16px/22px var(--font);text-align:center;box-shadow:0 2px 0 #c41f3d}
.blk.ghosted{opacity:.22}
.blk.wig{animation:k-wiggle .4s}
.blk.bye{animation:bye .35s ease-in forwards;animation-delay:var(--dl,0s)}
@keyframes bye{to{transform:translateY(-30px) scale(.2) rotate(30deg);opacity:0}}
.slot{flex:none;width:var(--bk);height:var(--bk);border-radius:calc(var(--bk) * .27);border:3px dashed #b9c4e0;display:grid;place-items:center;color:#b9c4e0}
.slot svg{width:42%;height:42%}
.slot.on{border-color:#3fa0f5;color:#3fa0f5;animation:slp 1.3s ease-in-out infinite}
.loop .slot.on{border-color:#ff9f1a;color:#ff9f1a}
@keyframes slp{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(.9);opacity:.5}}
.loop{position:relative;display:flex;align-items:center;gap:5px;padding:1px 4px 1px 1px;border-radius:calc(var(--bk) * .34);background:#ddf7e6;border:3px solid #36c96a;
  max-width:100%;cursor:pointer;touch-action:none}
.loop .lin{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:var(--bk)}
.loop.open{background:#fff3d4;border-color:#ffa41a;box-shadow:0 0 0 4px rgba(255,164,26,.28)}
.loop.run{box-shadow:0 0 0 4px rgba(255,214,60,.7)}
.loop.newb{animation:popin .38s cubic-bezier(.2,1.6,.4,1) both}
.loop.ghosted{opacity:.22}
.lhead{flex-direction:column;gap:0}
.lhead svg,.pal .blk.P svg{width:46%;height:46%;margin-top:-4%}
.lx{font:800 calc(var(--bk) * .36)/1 var(--font);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);margin-top:-2%}
.lhead .ldots{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.lhead .ldots i{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #36c96a}
.lhead .ldots i.on{background:#ffc83d}
.lhead.bumpn .lx{animation:k-jump .4s}
.lchk{flex:none;width:42px;height:42px;border:none;border-radius:50%;background:#36c96a;color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #1f9e4e;cursor:pointer;position:relative}
.lchk::before{content:"";position:absolute;inset:-8px}
.lchk svg{width:26px;height:26px}
.pal{position:relative;display:flex;justify-content:center;align-items:center;gap:clamp(6px,1.6vmin,14px);padding:8px;border-radius:22px;background:rgba(255,255,255,.55);
  box-shadow:0 4px 0 rgba(30,50,110,.1);transition:background .2s,box-shadow .2s;flex-wrap:nowrap}
.pal .blk{width:calc(var(--bk) * 1.06);height:calc(var(--bk) * 1.06)}
.pal .blk:active{transform:translateY(3px) scale(.96)}
.pal .blk.dis{opacity:.3;pointer-events:none;filter:grayscale(.6)}
.pal.into{background:#ffeec2;box-shadow:0 0 0 3px #ffa41a,0 4px 0 rgba(30,50,110,.1)}
.pal .into-ic{display:none;position:absolute;left:50%;top:-15px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#ffa41a;color:#fff;padding:5px;
  box-shadow:0 3px 0 #d98200;z-index:2;animation:intob 1s ease-in-out infinite}
.pal.into .into-ic{display:block}
@keyframes intob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.panel.busy .pal .blk{opacity:.45;pointer-events:none}
.panel.busy .strip{pointer-events:none}
.ctrls{display:flex;justify-content:center;gap:clamp(6px,1.4vmin,12px)}
.cb{position:relative;flex:none;width:56px;height:56px;border:none;border-radius:18px;background:#fff;color:var(--c1d);display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(30,50,110,.16);cursor:pointer;transition:transform .12s,box-shadow .12s,background .2s}
.cb svg{width:28px;height:28px}
.cb .emo{font-size:30px}
.cb:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(30,50,110,.16)}
.cb[disabled]{opacity:.4;pointer-events:none}
.cb.run{width:auto;min-width:118px;padding:0 18px 0 12px;display:flex;align-items:center;gap:6px;background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--okd);
  font:800 24px/1 var(--font);text-shadow:0 2px 0 rgba(0,0,0,.15)}
.cb.run svg{width:30px;height:30px}
.cb.run.go{animation:k-pulse 1.3s ease-in-out infinite}
.cb.run.stop{background:#ff8a3d;box-shadow:0 5px 0 #d9661c}
.cb.del{color:#ff4d6d}
.cb.arm{background:#ff4d6d;color:#fff;box-shadow:0 5px 0 #c41f3d;animation:k-pulse .7s infinite}
.cb .cap{display:none}
@media (max-width:380px){ .ctrls{gap:6px} .cb.run{min-width:0;padding:0 10px 0 8px;font-size:20px;gap:3px} .cb.run svg{width:24px;height:24px} }
@media (min-width:900px) and (min-height:700px){
  .cb:not(.run){width:auto;min-width:64px;padding:0 10px;height:60px;display:flex;flex-direction:column;justify-content:center;gap:1px}
  .cb .cap{display:block;font:700 12px/1 var(--font);color:var(--ink-soft)}
  .cb.arm .cap{color:#fff}
}

/* drag */
.dfloat{position:fixed;left:0;top:0;z-index:90;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(20,30,80,.3));transition:opacity .15s}
.dfloat.del{opacity:.5}
.caret{position:fixed;z-index:89;width:7px;border-radius:4px;background:#ff9f1a;box-shadow:0 0 10px 3px rgba(255,159,26,.7);pointer-events:none;display:none}
.trash{position:fixed;z-index:88;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:rgba(255,255,255,.9);color:#ff4d6d;display:grid;place-items:center;
  box-shadow:0 6px 0 rgba(0,0,0,.12);pointer-events:none;transform:scale(0);transition:transform .2s cubic-bezier(.2,1.6,.4,1),background .15s,color .15s}
.trash svg{width:50px;height:50px}
.trash.on{transform:scale(1)}
.trash.hot{background:#ff4d6d;color:#fff;transform:scale(1.18)}
.fly{position:fixed;left:0;top:0;z-index:91;pointer-events:none}
.fly svg{width:100%;height:100%;display:block}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 14px 4px 4px;box-shadow:0 4px 0 rgba(30,50,110,.14);font-weight:800;font-size:20px;min-height:48px}
.hud .lvn{min-width:40px;height:40px;padding:0 6px;border-radius:20px;display:grid;place-items:center;background:var(--wc,#3d8bff);color:#fff;font-size:21px;box-shadow:0 3px 0 var(--wd,#2563d6)}
.hud .tk{display:flex;align-items:center;gap:2px}
.hud .tk svg{width:32px;height:32px}
.hud .tk.full b{color:var(--okd)}
.hud .tk.bump{animation:k-jump .5s}
.hud .gi svg{width:34px;height:34px}
.fseg{margin-right:8px;padding:4px}
.fseg button{min-width:58px;min-height:44px}
.fseg svg{width:26px;height:26px}

/* free-mode editor */
.etgrid{display:grid;grid-template-columns:repeat(5,var(--bk));gap:8px;justify-content:center}
.et{width:var(--bk);height:var(--bk);border:none;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(30,50,110,.16);display:grid;place-items:center;cursor:pointer;padding:3px;
  transition:transform .12s,box-shadow .12s,background .15s}
.et svg{width:88%;height:88%;overflow:visible}
.et.on{background:#fff2c9;box-shadow:0 0 0 4px #ffa41a,0 4px 0 rgba(30,50,110,.16);transform:translateY(-3px)}
.etrow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.etrow .k-seg button{min-width:46px;padding:0 9px}
.etrow{gap:8px 10px}
.etrow .k-seg .emo{font-size:26px}
#bToProg{padding:.5em 1.1em .56em}
.edit .board{box-shadow:0 0 0 5px #ffa41a,0 10px 0 rgba(20,40,90,.16)}

/* tips */
.tipc{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.4vmin,10px);margin:6px 0 2px;flex-wrap:wrap}
.tf{position:relative;width:clamp(64px,14vmin,104px);height:clamp(64px,14vmin,104px);border-radius:20px;background:#9be36f;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.tf.wat{background:#4cc3f0}
.tf>svg,.tf>.tr{position:absolute;inset:4%;width:92%;height:92%}
.tf .tr{animation:none}
.tf .tr svg{width:100%;height:100%}
.tf .bd{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tf .bd svg{width:20px;height:20px}
.tf .bd.no{background:#ff4d6d}.tf .bd.yes{background:#36c96a}
.tipc .blk{--bk:clamp(52px,11vmin,72px);pointer-events:none}
.tipc .op{font:800 clamp(26px,5vmin,40px)/1 var(--font);color:var(--ink-soft)}
.tipc .loop{pointer-events:none}
.tip .spin90{animation:t90 2.2s ease-in-out infinite}
@keyframes t90{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
.tip .popl{animation:popl 2.2s ease-in-out infinite}
.tip .spress .btop{animation:spr 2.4s ease-in-out infinite}
.tip .spress .led{animation:sled 2.4s step-end infinite}
.tip .gopen .bars{transform-origin:50px 86px;animation:gop 2.4s ease-in-out infinite}
.tip .gopen .led{animation:sled 2.4s step-end infinite}
@keyframes spr{0%,25%{transform:translateY(0)}35%,90%{transform:translateY(7px)}100%{transform:translateY(0)}}
@keyframes sled{0%{fill:#ff5d5d}35%{fill:#3ecf6e}95%{fill:#ff5d5d}}
@keyframes gop{0%,40%{transform:scaleY(1)}55%,90%{transform:scaleY(.08)}100%{transform:scaleY(1)}}
@keyframes popl{0%,40%{transform:scale(.7);opacity:.4}60%,100%{transform:scale(1);opacity:1}}

/* result */
.k-panel.k-result{overflow:visible;margin-top:62px}
.res-bot{width:124px;height:auto;margin:-88px auto 0;display:block}
.res-n{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--ink)}
.res-n svg{width:58px;height:26px}
.res-n b{font-size:1.25em}
.res-n small{color:var(--ink-soft);font-weight:700}
@media (max-height:500px){
  .k-panel.k-result{margin-top:40px;padding:10px 18px 12px;width:min(620px,92vw)}
  .res-bot{width:84px;margin-top:-58px}
  .k-result h2{font-size:30px}
  .k-result .k-stars{margin:2px 0 0}.k-result .k-stars svg{width:46px}.k-result .k-stars svg.mid{margin-top:-8px}
  .k-result .k-btns{margin-top:10px;gap:10px}.k-result .btn{font-size:19px}
}
</style>
</head>
<body>
<div class="sky" id="sky"></div>

<header class="k-bar">

  <div class="k-mid" id="mid"></div>
  <button class="ibtn hidden" id="bHint" data-icon="hint" aria-label="Gợi ý"></button>
  <button class="ibtn" data-k="music"></button>
  <button class="ibtn" data-k="sound"></button>
  <button class="ibtn" data-k="full"></button>
</header>

<!-- TITLE -->
<section class="screen on" id="title">
  <div class="floaters" id="floaters"></div>
  <svg class="mascot" id="mascot" viewBox="0 0 200 232" aria-hidden="true"></svg>

      <button class="btn big pulse" id="bPlay" data-icon="play">Chơi</button>
      <button class="btn gold" id="bFree" data-icon="brush">Tự do</button>

</section>

<!-- SELECT -->
<section class="screen" id="select">
  <div class="k-scroll" id="selScroll">
    <button class="freebtn" id="bFree2"><span class="fic" id="freeIc"></span><span>Tự do<small>Bé tự vẽ bản đồ</small></span></button>
    <div id="worlds" style="display:contents"></div>
  </div>
</section>

<!-- PLAY -->
<section class="screen" id="play">
  <div class="stage" id="stage">
    <div class="bwrap" id="bwrap">
      <div class="board" id="board">
        <svg class="bg" id="boardBg" aria-hidden="true"></svg>
        <div id="objs"></div>
        <div class="robot" id="robot"><div class="rb-sh"></div><div class="rb-hop"><div class="rb-rot"></div></div></div>
      </div>
    </div>
    <div class="panel" id="panel">
      <div class="prog" id="progBox"><div class="strip" id="strip"></div></div>
      <div class="pal" id="pal"></div>
      <div class="ctrls">
        <button class="cb run" id="bRun" aria-label="Chạy"></button>
        <button class="cb" id="bStep" aria-label="Từng bước"></button>
        <button class="cb" id="bHome" aria-label="Quay về đầu"></button>
        <button class="cb" id="bSpeed" aria-label="Tốc độ"></button>
        <button class="cb del" id="bClear" aria-label="Xóa hết"></button>
      </div>
    </div>
    <div class="etools hidden" id="etools">
      <div class="etgrid" id="etgrid"></div>
      <div class="etrow">
        <div class="k-seg" id="sizeSeg"><button data-n="4">4×4</button><button data-n="5">5×5</button><button data-n="6">6×6</button></div>
        <div class="k-seg" id="themeSeg"><button data-t="garden"><span class="emo">🌳</span></button><button data-t="station"><span class="emo">🚀</span></button><button data-t="moon"><span class="emo">🌙</span></button></div>

  /* ---------- settings buttons ---------- */

function parseMap(rows) {

  const M = { W, H, cell: [], tasks: [], switches: [], gates: [], start: { x: 0, y: 0, d: 1 }, goal: { x: W - 1, y: H - 1 },
    taskAt: [], swAt: [], gateAt: [] };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = rows[y][x] || '.', i = y * W + x;
    M.cell[i] = ch === '#' ? 1 : ch === '~' ? 2 : ch === '=' ? 3 : 0;
    M.taskAt[i] = -1; M.swAt[i] = -1; M.gateAt[i] = -1;
    const d = '^>v<'.indexOf(ch);
    if (d >= 0) M.start = { x, y, d };
    else if (ch === '*') M.goal = { x, y };
    else if (ch === 'b' || ch === 'l') { M.taskAt[i] = M.tasks.length; M.tasks.push({ k: ch, x, y }); }
    else if (ch === 's' || ch === 'S') { M.swAt[i] = M.switches.length; M.switches.push({ x, y, p: ch === 's' ? 0 : 1 }); }
    else if (ch === 'g' || ch === 'G') { M.gateAt[i] = M.gates.length; M.gates.push({ x, y, p: ch === 'g' ? 0 : 1 }); }
  }
  M.full = (1 << M.tasks.length) - 1;
  return M;
}

// one command -> { s: newState, ev, fail, ti, p }
function simStep(M, s, c) {
  if (c === 'L' || c === 'R') return { s: { x: s.x, y: s.y, d: (s.d + (c === 'L' ? 3 : 1)) % 4, t: s.t, w: s.w }, ev: 'turn' };
  if (c === 'A') {
    const i = s.y * M.W + s.x, ti = M.taskAt[i], si = M.swAt[i];
    if (ti >= 0 && !(s.t >> ti & 1)) return { s: { x: s.x, y: s.y, d: s.d, t: s.t | 1 << ti, w: s.w }, ev: M.tasks[ti].k === 'b' ? 'batt' : 'lamp', ti };

    return { s, ev: 'none' };
  }
  // forward
  const nx = s.x + DIRS[s.d][0], ny = s.y + DIRS[s.d][1];
  if (nx < 0 || ny < 0 || nx >= M.W || ny >= M.H) return { s, ev: 'edge', fail: true };
  const j = ny * M.W + nx, cl = M.cell[j];
  if (cl === 1) return { s, ev: 'wall', fail: true };
  if (cl === 2) return { s, ev: 'water', fail: true };
  const gi = M.gateAt[j];
  if (gi >= 0 && !(s.w >> M.gates[gi].p & 1)) return { s, ev: 'gate', fail: true, gi };
  return { s: { x: nx, y: ny, d: s.d, t: s.t, w: s.w }, ev: 'move' };
}
// shortest flat command list from state s0 (BFS); null when unreachable
function solveFlat(M, s0, tools) {

  const nT = 1 << M.tasks.length;
  const enc = s => (((s.w * nT + s.t) * M.H + s.y) * M.W + s.x) * 4 + s.d;
  if (isWin(M, s0)) return [];
  const prev = new Map([[enc(s0), null]]), q = [s0];

    const s = q[qi], k = enc(s);
    for (const c of tools) {

      if (r.fail || r.ev === 'none') continue;
      const k2 = enc(r.s);
      if (prev.has(k2)) continue;
      prev.set(k2, [k, c]);
      if (isWin(M, r.s)) {
        const out = []; let kk = k2;
        while (prev.get(kk)) { const [p, cc] = prev.get(kk); out.push(cc); kk = p; }

}
// program = [{t:'F'|'L'|'R'|'A'} | {t:'P', n, body:[...]}] -> flat steps
function flatten(prog) {

  prog.forEach((it, i) => {
    if (it.t === 'P') { for (let k = 0; k < it.n; k++) it.body.forEach((b, j) => out.push({ t: b.t, id: b.id, top: i, inner: j, loop: it.id, iter: k, of: it.n })); }

}

function runProgram(M, prog, s0) {
  const steps = flatten(prog); let s = s0 || initState(M);

    const r = simStep(M, s, steps[i].t);
    if (r.fail) return { s, fail: r.ev, at: i, steps };
    s = r.s;
    if (isWin(M, s)) return { s, win: true, at: i, steps };
  }

}

function miniMap(rows, th) {
  const T = THEMES[th], H = rows.length, W = rows[0].length;
  let s = `<rect width="${W * 10}" height="${H * 10}" rx="3" fill="${T.base}"/>`;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = rows[y][x]; const X = x * 10, Y = y * 10;
    let f = (x + y) % 2 ? T.f2 : T.f1;
    if (ch === '~') f = T.hole; else if (ch === '=') f = T.bridge === 'wood' ? '#c98b52' : '#aeb8d8'; else if (ch === '#') f = th === 'station' ? '#8792bd' : th === 'moon' ? '#9b8dd0' : '#3fa63c';
    s += `<rect x="${X + .6}" y="${Y + .6}" width="8.8" height="8.8" rx="2" fill="${f}"/>`;
    if (ch === '*') s += `<circle cx="${X + 5}" cy="${Y + 5}" r="3.6" fill="#ffc83d" stroke="#e09a00" stroke-width="1"/>`;
    else if (ch === 'b') s += `<rect x="${X + 3}" y="${Y + 2}" width="4" height="6" rx="1.2" fill="#3ecf6e"/>`;
    else if (ch === 'l') s += `<circle cx="${X + 5}" cy="${Y + 5}" r="2.6" fill="#ffe45c" stroke="#4b5784" stroke-width=".8"/>`;
    else if (ch === 's' || ch === 'S') s += `<circle cx="${X + 5}" cy="${Y + 5}" r="2.6" fill="${ch === 's' ? '#ff6fa5' : '#4aa8ff'}"/>`;
    else if (ch === 'g' || ch === 'G') s += `<rect x="${X + 1.5}" y="${Y + 3}" width="7" height="4" rx="1" fill="${ch === 'g' ? '#ff6fa5' : '#4aa8ff'}"/>`;
    else if ('^>v<'.includes(ch)) s += `<circle cx="${X + 5}" cy="${Y + 5}" r="3.4" fill="#5cc8fa" stroke="#2a8bd3" stroke-width="1"/>`;

  return `<svg class="mm" viewBox="0 0 ${W * 10} ${H * 10}" aria-hidden="true">${s}</svg>`;
}

let G = null;
let uid = 0;
const nid = () => ++uid;
const dur = () => save.speed ? 270 : 460;
function later(fn, ms) { const g = G; if (!g) return 0; const t = setTimeout(() => { if (G === g) fn(); }, ms); g.timers.push(t); return t; }
function tw(ms, fn, ez) { const g = G; const p = tween(ms, fn, ez); g.tws.add(p); p.then(() => g.tws.delete(p)); return p; }
const alive = (g, tok) => G === g && g.tok === tok;

function newGame(o) {
  return Object.assign({ prog: [], openLoop: null, ver: 0, tok: 0, tws: new Set(), timers: [], edit: false, guide: false,
    rb: { x: 0, y: 0, ang: 0, sx: 1, sy: 1, lift: 0, jx: 0, sc: 1 }, ex: null }, o);
}
function endGame() {
  if (!G) return;
  const g = G; g.tok++;
  g.tws.forEach(p => p.cancel()); g.tws.clear();
  g.timers.forEach(clearTimeout);
  if (g.idle) g.idle.stop();
  hand.hide(); cancelDrag();
  $$('.bub,.fly,.dfloat').forEach(n => n.remove());
  $$('.k-ov').forEach(n => n.remove());
  Kit.stopSpeech && Kit.stopSpeech();
  G = null;
}

function startLevel(li) {
  endGame();
  const def = LEVELS[li], w = worldOf(li);
  G = newGame({ mode: 'level', li, def, rows: def.m, M: parseMap(def.m), th: w.th, goalKind: w.goal, tools: def.tools, par: def.par, world: w });
  G.ex = freshEx();
  enterPlay();
  const tips = TIPS.filter(t => !save.seen[t.k] && t.has(G.M, def)).slice(0, 2);
  const first = li === 0 && !save.seen.start;
  later(async () => {
    if (first) { G.guide = true; say('Chạm khối mũi tên để xếp đường đi cho rô-bốt, rồi bấm Chạy nhé!'); updateGuide(); return; }
    if (tips.length) { for (const t of tips) { if (!G) return; await showTip(t); } }
    else say(goalText());
  }, 650);
}
function startFree() {
  endGame();
  const f = save.free && Array.isArray(save.free.rows) && save.free.rows.length >= 4 ? save.free : { rows: ['......', '......', '......', '......', '......', '>....*'], th: 'garden' };
  G = newGame({ mode: 'free', rows: f.rows.slice(), th: THEMES[f.th] ? f.th : 'garden', tools: 'FLRAP', edit: true, tool: '#' });
  G.M = parseMap(G.rows); G.goalKind = 'star'; G.par = null;
  G.ex = freshEx();
  enterPlay();
  later(() => {
    if (!save.seen.free) { save.seen.free = 1; persist('seen'); say('Chọn đồ vật, rồi chạm vào ô để đặt. Xong thì bấm Lập trình nhé!'); hand.tap(() => $('.et[data-k="#"]'), { times: 1 }); later(() => hand.tap(() => cellCenter(2, 2), { times: 2 }), 1500); }
    else say('Bé vẽ bản đồ nhé!');
  }, 500);
}
const freshEx = () => ({ phase: 'fresh', s: initState(G.M), pc: 0, steps: [], ver: G.ver, stop: false });

function enterPlay() {
  show('play');
  document.body.classList.toggle('night', !!THEMES[G.th].night);
  $('#bHint').classList.toggle('hidden', G.mode === 'free' && G.edit);
  $('#stage').classList.toggle('edit', !!G.edit);

function dropIn() {
  const g = G, R = g.rb; R.lift = 120; R.sc = 1; rbRender();

    }

  const items = [...cont.children].filter(c => c.dataset.id);
  if (!items.length) {
    const s = $('.slot', cont), r = (s || cont).getBoundingClientRect();
    return { loop, index: 0, x: r.left + 2, y: r.top + r.height / 2 };
  }
  let best = null;
  items.forEach((c, i) => {
    const r = c.getBoundingClientRect(), cy = r.top + r.height / 2;
    const cand = [{ index: i, x: r.left - 3, y: cy }];

/* ================= execution ================= */
async function run(all) {
  if (!G || G.edit) return;
  const g = G, ex = g.ex;
  if (ex.phase === 'running') { if (all) ex.stop = true; return; }
  if (ex.phase === 'won' || ex.phase === 'rewind') return;
  if (!g.prog.length) { sfx.bad(); shakeEl($('#progBox')); hand.tap(() => $('#pal .blk'), { times: 2 }); return; }
  closeLoop();
  if (g.guide) { g.guide = false; save.seen.start = 1; persist('seen'); hand.hide(); }
  if (ex.phase === 'ended' || (ex.phase === 'paused' && ex.ver !== g.ver)) { await rewind(true); if (G !== g) return; }
  const e2 = g.ex;
  if (e2.phase === 'fresh') { e2.steps = flatten(g.prog); e2.pc = 0; e2.ver = g.ver; }
  if (!e2.steps.length) { sfx.bad(); const lp = $('#strip .loop'); shakeEl(lp || $('#progBox')); return; }
  e2.phase = 'running'; e2.stop = false; face('');
  updateCtrls(); markExec();
  const tok = ++g.tok;
  while (e2.pc < e2.steps.length) {
    const res = await execStep(g, tok, e2.steps[e2.pc]);
    if (!alive(g, tok)) return;
    e2.pc++;
    if (res === 'win') return onWin(g);
    if (res === 'fail') return onFail(g, e2.steps[e2.pc - 1]);
    if (!all || e2.stop) break;
    await wait(save.speed ? 60 : 110);
    if (!alive(g, tok)) return;
  }
  if (e2.pc >= e2.steps.length) return onEnd(g);
  e2.phase = 'paused'; updateCtrls(); markExec(); renderHUD();
}
async function execStep(g, tok, st) {
  highlight(st);
  const M = g.M, s = g.ex.s, r = simStep(M, s, st.t);
  if (r.ev === 'batt' || r.ev === 'lamp' || r.ev === 'switch') g.ex.s = r.s;
  switch (r.ev) {
    case 'move': await aMove(g, tok, r.s.x, r.s.y); break;
    case 'turn': await aTurn(g, tok, st.t); break;
    case 'batt': case 'lamp': case 'switch': case 'none': await aAct(g, tok, r); break;
    case 'water': await aTeeter(g, tok, s); break;
    default: await aBump(g, tok, s, r); break;
  }
  if (!alive(g, tok)) return 'abort';
  g.ex.s = r.s;
  if (r.fail) return 'fail';
  if (isWin(M, r.s)) return 'win';
  return 'ok';
}

  const R = G.rb, d = DIRS[((Math.round(R.ang / 90) % 4) + 4) % 4], c = cellCenter(R.x, R.y), t = tileSize();

const tf = (inner, cls = '') => `<div class="tf ${cls}">${inner}</div>`;
const op = s => `<span class="op">${s}</span>`;
const bmini = t => `<div class="blk ${t}">${blkSVG(t)}${t === 'P' ? '<b class="lx">×2</b>' : ''}</div>`;
const rbAt = (ang, cls = '') => `<div class="tr ${cls}" style="transform:rotate(${ang}deg)">${ROBOT_TOP}</div>`;
const badge = ok => `<span class="bd ${ok ? 'yes' : 'no'}">${icon(ok ? 'check' : 'close')}</span>`;
const wallTile = th => svgw(WALLS[THEMES[th].wall]);
const TIPS = [
  { k: 'loop', has: (M, d) => d.tools.includes('P'), say: 'Khối lặp lại! Các khối bên trong sẽ chạy nhiều lần. Chạm vào số để đổi số lần nhé!',
    pic: () => `<div class="loop" style="--bk:clamp(52px,11vmin,72px)"><div class="blk P lhead">${blkSVG('P')}<b class="lx">×2</b></div><div class="lin">${bmini('F')}</div></div>${op('=')}${bmini('F')}${bmini('F')}`,
    demo: () => hand.tap(() => $('#pal .blk.P'), { times: 2 }) },
  { k: 'switch', has: M => M.switches.length > 0, say: 'Đứng trên nút bấm, dùng khối phép thuật để mở cổng nhé!',
    pic: () => `${tf('<div class="tr spress">' + ART.sw(0) + '</div>')}${op('+')}${bmini('A')}${op('→')}${tf('<div class="tr gopen">' + ART.gate(0) + '</div>')}`,
    demo: () => hand.tap(() => $('#pal .blk.A'), { times: 2 }) },
  { k: 'lamp', has: M => M.tasks.some(t => t.k === 'l'), say: 'Đứng trên đèn, dùng khối phép thuật để bật đèn nhé!',
    pic: () => `${tf(ART.lamp())}${op('+')}${bmini('A')}${op('→')}${tf('<div class="tr popl">' + ART.lampOn() + '</div>')}`,
    demo: () => hand.tap(() => $('#pal .blk.A'), { times: 2 }) },
  { k: 'water', has: M => M.cell.includes(2), say: 'Rô-bốt không bơi được! Hãy đi qua cầu nhé!',
    pic: () => `${tf(rbAt(90) + badge(false), 'wat')}${tf(svgw(BRIDGES.wood) + badge(true), 'wat')}`, demo: () => pointCell(2) },
  { k: 'wall', has: M => M.cell.includes(1), say: 'Rô-bốt không đi xuyên qua được. Hãy đi vòng nhé!',
    pic: () => `${tf(rbAt(90))}${op('→')}${tf(wallTile(G ? G.th : 'garden') + badge(false))}`, demo: () => pointCell(1) },
  { k: 'batt', has: M => M.tasks.some(t => t.k === 'b'), say: 'Đứng trên cục pin, rồi dùng khối phép thuật để nhặt pin nhé!',
    pic: () => `${tf(ART.batt())}${op('+')}${bmini('A')}${op('→')}${tf('<div class="tr popl">' + ART.batt() + '</div>' + badge(true))}`,
    demo: () => hand.tap(() => $('#pal .blk.A'), { times: 2 }) },
  { k: 'turn', has: (M, d) => d.tools.includes('L'), say: 'Khối quay giúp rô-bốt đổi hướng: quay trái, hoặc quay phải!',
    pic: () => `${tf(rbAt(0))}${op('+')}${bmini('R')}${op('→')}${tf(rbAt(0, 'spin90'))}`,
    demo: () => hand.tap(() => $('#pal .blk.R'), { times: 2 }) },
];
function pointCell(kind) { // hand points at the first cell of this kind (1 wall, 2 water)
  const i = G.M.cell.indexOf(kind); if (i < 0) return;
  hand.tap(() => cellCenter(i % G.M.W, Math.floor(i / G.M.W)), { times: 2 });
}
function showTip(t) {
  return new Promise(res => {
    const g = G; if (!g) return res();
    save.seen[t.k] = 1; persist('seen');
    const m = Kit.overlay(`<div class="tip"><div class="tipc">${t.pic()}</div><div class="k-btns"><button class="btn ok big" id="tipOk">${icon('check')}</button></div></div>`);
    say(t.say); sfx.pop();
    let done = false;
    const close = () => { if (done) return; done = true; m.close(); if (G === g && t.demo) later(t.demo, 250); res(); };
    $('#tipOk', m.panel).onclick = close;
    m.ov.addEventListener('pointerdown', e => { if (e.target === m.ov) close(); });
  });
}
function updateGuide() {
  if (!G || !G.guide || G.edit) return;
  if (blockCount(G.prog) < (G.par || 2)) hand.tap(() => $('#pal .blk.F'));
  else hand.tap(() => $('#bRun'));
}
function showHint(speak) {
  if (!G || G.edit || busy() || $('.k-ov') || D) return;
  if (G.guide) { updateGuide(); return; }
  const M = G.M, r = runProgram(M, G.prog);
  if (G.openLoop) closeLoop();
  if (r.win) { hand.tap(() => $('#bRun'), { times: 3 }); if (speak) say('Bấm Chạy nào!'); return; }
  if (r.fail) {
    const st = r.steps[r.at], e = blkEl(st.id);
    if (e) { e.classList.remove('err'); void e.offsetWidth; e.classList.add('err'); scrollToActive(e); }
    hand.drag(() => blkEl(st.id), () => { const b = $('#bwrap').getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2 }; }, { times: 2 });
    if (speak) say('Khối màu đỏ làm rô-bốt bị vấp. Kéo nó ra ngoài nhé!');
    return;
  }
  const sol = solveFlat(M, r.s, G.tools);
  if (!sol || !sol.length) { hand.tap(() => $('#bHome'), { times: 2 }); return; }
  hand.tap(() => $('#pal .blk.' + sol[0]), { times: 3 });
  if (speak) say('Bé thử thêm khối ' + NAMES[sol[0]] + ' nhé!');
}
$('#bHint').onclick = () => { if (G && !G.edit) { sfx.sparkle(); showHint(true); } };

// tap the robot: it beeps and repeats the goal
$('#board').addEventListener('pointerdown', e => {
  if (!G || G.edit || busy()) return;
  const r = $('#board').getBoundingClientRect(), t = r.width / G.M.W;
  const x = Math.floor((e.clientX - r.left) / t), y = Math.floor((e.clientY - r.top) / t);
  if (x === Math.round(G.rb.x) && y === Math.round(G.rb.y)) {
    SND.beep(); const R = G.rb, g = G;
    tw(420, (k, tt) => { R.lift = Math.sin(Math.PI * tt) * 16; rbRender(); }).then(() => { if (G === g) { R.lift = 0; rbRender(); } });
    face('happy'); later(() => face(''), 900);
    say(goalText());
  }
});

/* ================= free mode editor ================= */
const ETOOLS = [
  { k: '#', a: 'Tường' }, { k: '~', a: 'Nước' }, { k: '=', a: 'Cầu' }, { k: 'b', a: 'Pin' }, { k: 'l', a: 'Đèn' },
  { k: 's', a: 'Nút bấm' }, { k: 'g', a: 'Cổng' }, { k: '*', a: 'Ngôi sao' }, { k: 'R', a: 'Rô-bốt' }, { k: '.', a: 'Tẩy' },
];
function etIcon(k) {
  const T = THEMES[G.th];
  switch (k) {
    case '#': return svgw(WALLS[T.wall]);
    case '~': return svgw(`<rect x="6" y="6" width="88" height="88" rx="18" fill="${T.hole}"/>` + (T.night ? '<circle cx="30" cy="34" r="4" fill="#fff"/><circle cx="66" cy="62" r="4" fill="#ffe27a"/>' : '<path d="M20 40q10-8 20 0t20 0M40 64q10-8 20 0t20 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>'));
    case '=': return svgw(`<rect x="6" y="6" width="88" height="88" rx="18" fill="${T.hole}"/><g transform="translate(6 6) scale(.88)">${BRIDGES[T.bridge]}</g>`);
    case 'b': return ART.batt();
    case 'l': return ART.lampOn();
    case 's': return ART.sw(0);
    case 'g': return ART.gate(0);
    case '*': return ART.star();
    case 'R': return `<div style="width:84%;height:84%;transform:rotate(90deg)">${ROBOT_TOP}</div>`;
    default: return svgw('<rect x="22" y="30" width="56" height="40" rx="10" fill="#ffb3c9" stroke="#d9467f" stroke-width="5" transform="rotate(-25 50 50)"/><path d="M30 64 54 22" stroke="#fff" stroke-width="5" opacity=".6" transform="rotate(-25 50 50)"/>');
  }
}
function renderETools() {
  const g = $('#etgrid'); g.innerHTML = '';
  ETOOLS.forEach(t => {
    const b = el('button', 'et' + (G.tool === t.k ? ' on' : ''), etIcon(t.k)); b.dataset.k = t.k; b.setAttribute('aria-label', t.a);
    b.onclick = () => { G.tool = t.k; sfx.pick(); renderETools(); };
    g.appendChild(b);
  });
  $$('#sizeSeg button').forEach(b => b.classList.toggle('on', +b.dataset.n === G.M.W));
  $$('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === G.th));
}
$$('#sizeSeg button').forEach(b => b.onclick = () => { if (G && G.mode === 'free') resizeMap(+b.dataset.n); });
$$('#themeSeg button').forEach(b => b.onclick = () => {
  if (!G || G.mode !== 'free') return;
  G.th = b.dataset.t; saveFree(); sfx.pop(); document.body.classList.toggle('night', !!THEMES[G.th].night); buildBoard(false); rbRender(); renderETools();
});
$('#bWipe').onclick = () => {
  if (!G || G.mode !== 'free') return;
  const M = G.M, rows = [];
  for (let y = 0; y < M.H; y++) { let r = ''; for (let x = 0; x < M.W; x++) r += x === M.start.x && y === M.start.y ? '>^>v<'[M.start.d + 1] : x === M.goal.x && y === M.goal.y ? '*' : '.'; rows.push(r); }
  setRows(rows); sfx.whoosh();
};
$('#bToProg').onclick = () => setEdit(false);
function saveFree() { save.free = { rows: G.rows, th: G.th }; persist('free'); }
function setRows(rows) {
  G.rows = rows; G.M = parseMap(rows); saveFree();
  G.ex = freshEx(); buildBoard(false); rbToStart(); rbRender(); renderHUD();
}
function resizeMap(n) {
  if (n === G.M.W) return;
  const old = G.rows, rows = [];
  for (let y = 0; y < n; y++) { let r = ''; for (let x = 0; x < n; x++) r += (old[y] && old[y][x]) || '.'; rows.push(r); }
  let txt = rows.join('\n');
  if (!/[\^>v<]/.test(txt)) { const a = rows[n - 1].split(''); a[0] = '>'; rows[n - 1] = a.join(''); }
  if (!rows.join('').includes('*')) { const y = rows[0][n - 1] === '.' ? 0 : 1, a = rows[y].split(''); a[n - 1] = '*'; rows[y] = a.join(''); }
  setRows(rows); sfx.pop(); layout(); renderETools();
}
function setEdit(on) {
  if (!G || G.mode !== 'free' || G.edit === on) return;
  G.tok++; G.tws.forEach(p => p.cancel()); G.tws.clear(); hand.hide();
  G.edit = on;
  if (!on) {
    G.M = parseMap(G.rows); const sol = solveFlat(G.M, initState(G.M), 'FLRA'); G.par = sol ? sol.length : null;
    if (!sol) { later(() => { say('Rô-bốt chưa có đường tới ngôi sao. Bé sửa bản đồ nhé!'); Kit.toast('🤖 ➜ ⭐ ?'); }, 300); }
    else say('Bé lập trình cho rô-bốt nhé!');
  }
  G.ex = freshEx(); G.openLoop = null;
  $('#stage').classList.toggle('edit', on);
  $('#panel').classList.toggle('hidden', on); $('#etools').classList.toggle('hidden', !on);
  $('#bHint').classList.toggle('hidden', on);
  buildBoard(false); rbToStart(); rbRender(); renderHUD(); renderStrip(); renderETools();
  sfx.swap(); layout();
}
let paintCh = null;
function cellAt(e) {
  const r = $('#board').getBoundingClientRect(), t = r.width / G.M.W;
  const x = Math.floor((e.clientX - r.left) / t), y = Math.floor((e.clientY - r.top) / t);
  return x >= 0 && y >= 0 && x < G.M.W && y < G.M.H ? { x, y } : null;
}
function paint(c, first) {
  const rows = G.rows.map(r => r.split('')), ch = rows[c.y][c.x], tool = G.tool;
  const isStart = '^>v<'.includes(ch), isGoal = ch === '*';
  if (tool === 'R') {
    if (!first) return;
    if (isStart) rows[c.y][c.x] = '^>v<'[('^>v<'.indexOf(ch) + 1) % 4];
    else if (isGoal) { sfx.bad(); return; }
    else { let d = '>'; rows.forEach(r => r.forEach((v, i) => { if ('^>v<'.includes(v)) { d = v; r[i] = '.'; } })); rows[c.y][c.x] = d; }
    SND.whirr('R');
  } else if (tool === '*') {
    if (!first || isGoal) return;
    if (isStart) { sfx.bad(); return; }
    rows.forEach(r => r.forEach((v, i) => { if (v === '*') r[i] = '.'; })); rows[c.y][c.x] = '*'; sfx.star();
  } else {
    if (isStart || isGoal) { if (first) { sfx.bad(); } return; }
    if (first) paintCh = ch === tool ? '.' : tool;
    if (ch === paintCh) return;
    rows[c.y][c.x] = paintCh;
    paintCh === '.' ? sfx.drop() : SND.add('F');
  }
  setRows(rows.map(r => r.join('')));
  const p = cellCenter(c.x, c.y); burst(p.x, p.y, { n: 6, size: 10, speed: 4 });
}
Kit.tapDrag($('#board'), {
  can: () => G && G.edit && screen === 'play',
  slop: 0,
  start: e => { hand.hide(); const c = cellAt(e); if (c) { G.lastCell = c.x + ',' + c.y; paint(c, true); } },
  move: e => { const c = cellAt(e); if (!c || !G) return; const k = c.x + ',' + c.y; if (k !== G.lastCell) { G.lastCell = k; paint(c, false); } },
  end: () => { paintCh = null; },
});
$('#board').style.touchAction = 'none';

/* ================= keyboard (desktop nicety) ================= */
document.addEventListener('keydown', e => {
  if (!G || screen !== 'play' || G.edit || $('.k-ov')) return;
  const map = { ArrowUp: 'F', ArrowLeft: 'L', ArrowRight: 'R', ' ': 'A', a: 'A' };
  if (map[e.key] && G.tools.includes(map[e.key])) { e.preventDefault(); addBlock(map[e.key], $('#pal .blk.' + map[e.key])); }
  else if (e.key === 'Enter') { e.preventDefault(); run(true); }
  else if (e.key === 'Backspace' && !busy()) {
    e.preventDefault();
    const lp = G.openLoop ? loopById(G.openLoop) : null;
    if (lp && lp.body.length) lp.body.pop(); else if (G.prog.length) { const it = G.prog.pop(); if (it.id === G.openLoop) G.openLoop = null; } else return;
    SND.poof(); progChanged();
  }
});

/* ================= test hook (read-only) ================= */
window.__dbg = {
  screen: () => screen,
  state: () => G && { mode: G.mode, li: G.li, phase: G.ex.phase, pc: G.ex.pc, s: Object.assign({}, G.ex.s), prog: JSON.parse(JSON.stringify(G.prog)), openLoop: G.openLoop, edit: !!G.edit, par: G.par, count: blockCount(G.prog), rows: G.rows.slice() },
  solution: () => G && solveFlat(G.M, initState(G.M), G.tools),
  rb: () => G && Object.assign({}, G.rb),
  levels: () => LEVELS.map(l => ({ m: l.m, tools: l.tools, par: l.par })),
};

Kit.music.start(SONG);
})();
</script>
</body>
