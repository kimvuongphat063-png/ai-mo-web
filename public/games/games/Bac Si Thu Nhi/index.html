<!DOCTYPE html>
<html lang="vi" data-game="bacsi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#22b8a8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bác Sĩ Thú Nhí</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== BéVui Kit — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#3b2f63; --ink-soft:#6f6496;
  --c1:#7b5cff; --c1d:#5b3ed9; --c1l:#e9e3ff;
  --c2:#ff6fa5; --c2d:#d9467f;
  --ok:#36c96a; --okd:#20a04f;
  --gold:#ffc83d; --goldd:#e09a00;
  --bg1:#c9b8ff; --bg2:#ffd6ec;
  --card:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.hidden{display:none!important}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(40,20,90,.16),0 10px 18px rgba(40,20,90,.10);
  transition:transform .12s ease,box-shadow .12s ease}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(40,20,90,.16),0 4px 8px rgba(40,20,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:#b3abc9}
.btn .badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 14px/26px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 15px/24px var(--font);box-shadow:0 2px 0 var(--c2d)}

/* compact bar on small screens; on narrow portrait the middle slot drops to a 2nd row */
@media (max-height:500px),(max-width:430px){
  :root{--bar-h:62px}
  .ibtn{width:46px;height:46px;border-radius:15px}
  .ibtn svg{width:26px;height:26px}
  .k-bar{gap:8px;padding-top:calc(8px + var(--safe-t))}
}
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:118px}
  .k-bar{flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  .k-bar>:first-child{margin-right:auto}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.62em 1.3em .68em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(30,10,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;
  white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(30,10,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn.big{font-size:clamp(26px,5.4vmin,46px)}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d8d0ef;color:var(--c1d);text-shadow:none}
.btn[disabled]{filter:grayscale(.7) opacity(.6);pointer-events:none}
.btn.pulse{animation:k-pulse 1.6s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.logo{margin:0;font-weight:800;text-align:center;line-height:.92;letter-spacing:.01em;color:#fff;font-size:clamp(44px,10vmin,104px);
  -webkit-text-stroke:.16em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(30,10,80,.25)}
.logo span{display:inline-block}
.subtitle{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,22,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px}
.k-panel{position:relative;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(40,20,90,.14),0 30px 60px rgba(40,20,90,.3);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,48px);line-height:1;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(56px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars svg.mid{margin-top:-14px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,60px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(40,20,90,.12),0 12px 24px rgba(40,20,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-sub{position:fixed;z-index:65;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);pointer-events:none}

/* ---- rotate hint ---- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}

/* ---- decorative background ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-deco i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.35);animation:k-float 9s ease-in-out infinite}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(10px)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.wiggle{animation:k-wiggle .5s ease-in-out}
.shake{animation:k-shake .45s ease-in-out}
.bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.btn.pulse,.k-deco i{animation:none!important}}

/* ===== Kit v2 additions (Bộ game 2) ===== */
/* tutorial hand */
.k-hand{position:fixed;z-index:72;left:0;top:0;width:clamp(54px,9vmin,78px);height:auto;pointer-events:none;opacity:0;
  filter:drop-shadow(0 6px 6px rgba(30,10,80,.25));transition:opacity .25s;will-change:transform}
.k-hand.on{opacity:1}
.k-hand .tapring{transform-origin:22px 10px;animation:k-ring 1s ease-out infinite}
@keyframes k-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* segmented chips (Dễ / Vừa / Khó …) */
.k-seg{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(40,20,90,.12)}
.k-seg button{border:none;cursor:pointer;min-height:48px;min-width:56px;padding:0 16px;border-radius:999px;background:transparent;
  font:800 clamp(16px,2.6vmin,21px)/1 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.k-seg button.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.k-seg button:active{transform:translateY(2px)}
/* tile buttons for mode / level grids */
.k-tile{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;color:var(--ink);padding:12px 10px 10px;
  box-shadow:0 7px 0 rgba(40,20,90,.16),0 12px 20px rgba(40,20,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:800 clamp(16px,2.7vmin,22px)/1.05 var(--font);transition:transform .14s,box-shadow .14s;min-height:64px;text-align:center}
.k-tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(40,20,90,.16)}
.k-tile .emo{font-size:clamp(34px,6.4vmin,54px)}
.k-tile small{font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .k-tstars{display:flex;gap:1px}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e6e0f5;display:block}
.k-mini-star.on svg{color:#ffc83d;filter:drop-shadow(0 1px 0 #e09a00)}
/* scrollable screen body under the bar */
.k-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--bar-h) + var(--safe-t) + 6px) calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l));
  display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:800;font-size:clamp(16px,2.8vmin,22px);
  box-shadow:0 4px 0 rgba(40,20,90,.12);white-space:nowrap}
.k-pill .emo{font-size:1.3em}
@keyframes k-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,220,80,0))}50%{filter:drop-shadow(0 0 14px rgba(255,220,80,.95))}}
.k-glow{animation:k-glow 1.2s ease-in-out infinite}
@keyframes k-squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.84)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}}
.k-squash{animation:k-squash .5s ease}
@keyframes k-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.k-jump{animation:k-jump .5s cubic-bezier(.3,1.5,.5,1)}
</style>
<style>
:root{--c1:#22b8a8;--c1d:#11897c;--c1l:#d7f6f1;--c2:#ff6f91;--c2d:#d9466c;--bg1:#bdf1e8;--bg2:#ffe3ee}
body{background:linear-gradient(165deg,#c4f3ea 0%,#e4f6ff 50%,#ffe3ee 100%)}
/* single-row top bar on narrow portrait (our middle pill is small) */
@media (max-width:600px) and (orientation:portrait){
  :root{--bar-h:72px}
  .k-bar{flex-wrap:nowrap}
  .k-bar .k-mid{order:0;flex-basis:auto}
}
@media (max-width:430px) and (orientation:portrait){:root{--bar-h:62px}}
.dots{position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(rgba(255,255,255,.7) 2px,transparent 2.5px);background-size:34px 34px}

/* smile pill */
.smile-ic{display:inline-block;width:1.5em;height:1.5em;flex:0 0 auto}
.smile-ic svg{width:100%;height:100%;display:block}
.spill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 16px 4px 5px;min-height:44px;font-weight:800;
  font-size:clamp(19px,3vmin,24px);box-shadow:0 4px 0 rgba(40,20,90,.12);color:#8a5a00;white-space:nowrap}
.spill .smile-ic{width:36px;height:36px}
.spill.bump{animation:k-squash .45s ease}
.spill.shake{animation:k-shake .45s ease}

/* ---------- title ---------- */
#title{gap:clamp(4px,1.4vmin,14px);padding:76px 16px 20px}
#title>*{position:relative;z-index:1}
#title>.floaters{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.floaters i{position:absolute;display:block;animation:drift 11s ease-in-out infinite;opacity:.8}
.floaters i svg{width:100%;height:100%;display:block}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-26px) rotate(calc(var(--r,0deg) * -1))}}
.mascot{width:clamp(150px,min(46vw,32vh),300px);aspect-ratio:300/390;cursor:pointer;touch-action:manipulation;position:relative}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.mascot.hop{animation:mhop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes mhop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16%) scale(1.03,.97)}}
.title-txt{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vmin,16px)}
.logo{--c1d:#0f7d72}
.logo .l2{color:#ffe36e;font-size:1.04em;-webkit-text-stroke-color:#d9466c;text-shadow:0 .1em 0 #d9466c,0 .2em .3em rgba(30,10,80,.25)}
.title-btns{display:flex;flex-direction:column;align-items:center;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (min-aspect-ratio:5/4){
  #title{flex-direction:row;gap:5vw;padding-top:calc(var(--bar-h) + 4px)}
  .mascot{width:clamp(140px,min(30vw,52vh),330px)}
}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  .title-txt{gap:6px}
  .title-btns{gap:12px}
}

/* ---------- select (waiting room) ---------- */
.seg-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.k-seg .dd{display:inline-flex;gap:2px}
.k-seg .dd i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.85}
.wr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(1100px,100%);padding-bottom:10px}
.wr{position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:8px 6px 10px;box-shadow:0 7px 0 rgba(40,20,90,.14),0 12px 20px rgba(40,20,90,.08);
  display:flex;flex-direction:column;align-items:center;gap:4px;font:800 clamp(16px,2.6vmin,20px)/1.05 var(--font);color:var(--ink);transition:transform .14s}
.wr:active{transform:translateY(5px)}
.wr .hd{width:min(140px,80%);aspect-ratio:260/250}
@media (min-width:1400px) and (min-height:900px){.wr-grid{width:min(1300px,100%)!important}.wr .hd{width:min(180px,80%)}.bk-grid{width:min(1150px,100%)!important}.bk .stk{width:min(150px,78%)}}
@media (min-width:700px){.wr-grid{grid-template-columns:repeat(5,minmax(0,1fr));width:min(1000px,100%)}}
.wr .hd svg{width:100%;height:100%;display:block}
.wr .syms{display:flex;gap:4px;justify-content:center}
.wr .syms i{width:34px;height:34px;border-radius:12px;display:grid;place-items:center}
.wr .syms svg{width:30px;height:30px}
.wr .cnt{position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:2px;font-size:15px;color:var(--c2d)}
.wr .cnt svg{width:18px;height:18px}
@media (max-height:520px){.wr .hd{width:82px}.wr{padding:6px 4px 8px}.wr-grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}}

/* ---------- play ---------- */
#play{display:none}
#play.on{display:block}
#scene{position:absolute;left:0;top:0;width:800px;height:600px;transform-origin:0 0;pointer-events:none}
#scene svg{display:block;width:100%;height:100%;overflow:visible}
#stage{position:absolute;inset:0;touch-action:none}
#bed,#pat{position:absolute;left:0;top:0;pointer-events:none}
#bed svg,#pat svg{width:100%;height:100%;display:block;overflow:visible}
#pat{will-change:transform}
#pat.dance{animation:dance .46s ease-in-out 4}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10%) rotate(-7deg)}75%{transform:translateY(-10%) rotate(7deg)}}
.bubble{position:absolute;left:0;top:0;background:#fff;border-radius:30px;box-shadow:0 6px 0 rgba(40,20,90,.12),0 14px 30px rgba(40,20,90,.16);
  display:flex;gap:10px;padding:10px 12px;align-items:flex-start;justify-content:center;pointer-events:none;transform-origin:50% 100%}
.bubble.side{transform-origin:0 50%}
.bubble.pop{animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both}
.bubble.hide{opacity:0;transform:scale(.3);transition:opacity .2s,transform .2s}
.btail{position:absolute;width:26px;height:26px;background:#fff;border-radius:4px;transform:rotate(45deg);box-shadow:5px 5px 0 rgba(40,20,90,.08)}

<script>/* ===== BéVui Kit — shared engine (audio synth, voice, fx, ui) ===== */
const Kit = (() => {
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- storage ---------- */

  /* ---------- settings buttons ---------- */

    function hide() { if (stopFn) { stopFn(); stopFn = null; } if (node) { node.classList.remove('on'); node.style.opacity = 0; } }
    function run(kind, a, b, o = {}) {
      hide(); ensure(); node.classList.add('on');
      const t0 = performance.now(), period = kind === 'tap' ? 1500 : 2400, ring = node.querySelector('.tapring');
      const step = (dt, now) => {
        const A = pt(a); if (!A) { node.style.opacity = 0; return; }

  };
})();

/* eyes follow the finger (mascot, current patient) */
let lookRAF = 0, lookPt = null;
function lookAt(svg, x, y) {
  if (!svg) return;
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  const ex = r.left + r.width * 0.5, ey = r.top + r.height * (150 / 390);
  const dx = x - ex, dy = y - ey, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 200);
  const tx = (dx / d * 3.6 * k).toFixed(2), ty = (dy / d * 3 * k).toFixed(2);
  $$('.look', svg).forEach(g => g.setAttribute('transform', `translate(${tx} ${ty})`));
}
window.addEventListener('pointermove', e => {
  lookPt = { x: e.clientX, y: e.clientY };
  if (lookRAF) return;
  lookRAF = requestAnimationFrame(() => {
    lookRAF = 0;
    if (screen === 'title') lookAt($('#mascot svg'), lookPt.x, lookPt.y);
    else if (screen === 'play' && !drag) lookAt(patEl(), lookPt.x, lookPt.y);
  });
}, { passive: true });

}

    for (let i = 0; i < 3; i++) {

      const q = spotXY('mouth', 30, -30); hearts(q.x, q.y, 3); await W8(120); if (!alive(my)) return;
    }
    goHome(a);
  },
  async generic(a, c, my) { await fly(a, toSpot(c.def.spot), 400, {}); if (!alive(my)) return; sfx.pop(); await W8(300); goHome(a); },
};
async function listen(a, my, spot, slow) {
  if (spot === 'tummy') { const s = patEl(); if (s) s.classList.remove('pose-tummy'); }
  await fly(a, toSpot(spot), 440, { rot: 0, sc: 1, anchor: { spot, dx: 0, dy: 0 } });
  if (!alive(my)) return;
  setEyes(slow ? 'closed' : 'open');
  const gap = slow ? 1150 : 760;
  for (let i = 0; i < 3; i++) {
    SND.thump(0, 1);
    const q = spotXY(spot);
    ringAt(q, 70 * pScale() + 30, '#ff7aa8'); later(200, () => ringAt(spotXY(spot), 60 * pScale() + 30, '#ff9ec4'));
    hearts(q.x, q.y - 10, 2);
    if (!slow && i < 2) later(380, () => SND.gurgle());
    await tw(gap, t => { a.sc = 1 + (t < 0.15 ? t / 0.15 : t < 0.3 ? (0.3 - t) / 0.15 : 0) * 0.12; place(a); }, ease.linear);
    if (!alive(my)) return;
  }
  setEyes(baseEyes());
  if (!slow) { const s = patEl(); if (s) s.classList.toggle('pose-tummy', pend('tummy')); }
  goHome(a);
  await W8(150);
}
function pickPlaster(my) {
  return new Promise(res => {
    const st = $('#play');
    const pk = el('div', 'picker', `<div class="pk-panel">${PLAS.map((p, i) => `<button class="pk" data-i="${i}" aria-label="Băng dán ${i + 1}"><svg viewBox="0 0 120 50">${plasterSVG(i)}</svg></button>`).join('')}</div>`);
    st.appendChild(pk); picker = pk; sfx.whoosh();
    const panel = $('.pk-panel', pk);
    showGlow('knee');
    if (LAY && LAY.side) { pk.style.alignItems = 'center'; pk.style.justifyContent = 'flex-start'; panel.style.margin = '0 0 0 ' + Math.max(12, LAY.pat.x + LAY.pat.w * 0.86) + 'px'; }
    else { pk.style.alignItems = 'flex-start'; panel.style.margin = (barBottom() + 8) + 'px 0 0'; }
    const tmo = later(6000, () => { if (picker === pk) hand.tap($('.pk', pk)); });
    $$('.pk', pk).forEach(b => b.addEventListener('click', () => {
      if (picker !== pk) return;
      clearTimeout(tmo); hand.hide();
      picker = null; pk.remove(); sfx.pop(); clearHint();
      res(+b.dataset.i);
    }));
    pk._cancel = () => res(null);
  });
}

/* --- visit flow --- */
function sayIntro(throttle) {
  if (!V) return;
  const f = throttle ? sayT : t => { lastSay = Date.now(); say(t); };
  if (V.phase === 'lolly') { f(STEP_SAY['lolly@mouth']); return; }
  const left = V.ails.filter(a => a.step < a.n).map(a => AIL[a.id].say);
  if (left.length) f(`Bác sĩ ơi! ${SP[V.sp].name} ${left.join(' và ')}.`);
}
function startPlay(sp, ails) {
  show('play', 'select');
  beginVisit(sp, ails);
}
async function beginVisit(sp, ails) {
  const my = ++round;
  cleanupPlay();
  V = newVisit(sp, ails);
  save.lastSp = sp; store.set('lastSp', sp);
  busy = true;
  $('#scene').innerHTML = sceneSVG('pl', { par: 'none' });
  $('#bed').innerHTML = `<svg viewBox="0 0 400 152" preserveAspectRatio="none">${BED}</svg>`;
  $('#pat').innerHTML = patSVG(sp, { ails: V.ails.map(a => a.id) });
  mood();
  renderBubble();
  const B = $('#bubble'); B.classList.add('hide'); B.classList.remove('pop');
  layout();
  // hop in from the left
  const P_ = $('#pat');
  const startX = -(LAY.pat.x + LAY.pat.w + 40);
  let hopN = -1;
  await tw(1300, t => {
    const x = startX * (1 - t), ph = (t * 3) % 1, k = Math.floor(t * 3);
    if (k !== hopN && k < 3) { hopN = k; SND.hop(); }
    P_.style.transform = `translate(${x.toFixed(1)}px,${(-Math.sin(ph * Math.PI) * LAY.pat.h * 0.12).toFixed(1)}px)`;
  }, ease.linear);
  if (!alive(my)) return;
  P_.style.transform = '';
  SND.land();
  await tw(320, t => { const k = Math.sin(t * Math.PI) * 0.08; P_.style.transform = `scale(${1 + k},${1 - k})`; P_.style.transformOrigin = '50% 100%'; });
  if (!alive(my)) return;
  P_.style.transform = '';
  SND.sigh(SP[sp].pitch);
  B.classList.remove('hide'); B.classList.add('pop'); sfx.pop();
  sayIntro();
  V.phase = 'treat'; mood(); updateBubble();
  busy = false;
  if (save.tut < 1) { later(700, () => { if (alive(my) && V.phase === 'treat' && !busy) hintLevel(2); }); }
  armIdle();
}
async function finishVisit(my) {
  V.phase = 'done'; busy = true; mood();
  clearHint();
  const P_ = $('#pat'), s = patEl();
  setEyes('happy'); setMouth('grin');
  P_.classList.add('dance'); SND.happy(SP[V.sp].pitch); later(300, () => SND.happy(SP[V.sp].pitch * 1.2));
  const q = spotXY('body'); hearts(q.x, q.y - 80, 10); K.sparkle(q.x, q.y - 60, { n: 12 });
  award(3, spotXY('mouth'));
  save.book[V.sp] = (save.book[V.sp] || 0) + 1; persist('book');
  save.visits++; persist('visits');
  await W8(1900);
  if (!alive(my)) return;
  P_.classList.remove('dance');
  const sp = V.sp, name = SP[sp].name, first = save.book[sp] === 1;
  K.result({
    stars: 3, title: 'Khỏe rồi!',
    top: `<div class="res-pat">${headSVG(sp, { eyes: 'happy', mouth: 'grin', cls: '' })}</div>`,
    text: `${name} cảm ơn bác sĩ! <span class="earn">+${V.earned} ${smileIc()}</span>`,
    reward: { emoji: stickerSVG(sp), label: first ? 'Sticker mới!' : 'Sticker ×' + save.book[sp] },
    say: `${name} khỏe rồi! Cảm ơn bác sĩ!`,
    buttons: [
      { label: 'Bạn tiếp theo', icon: 'next', cls: 'ok', onClick: () => nextPatient(my) },
      { label: 'Trang trí', icon: 'home', cls: 'pink', onClick: () => show('room', 'select') },
    ],
  });
}
async function nextPatient(my) {
  if (!alive(my)) return;
  busy = true;
  const P_ = $('#pat'), s = patEl();
  if (s) { s.classList.add('wave'); s.dataset.eyes = 'happy'; s.dataset.mouth = 'grin'; }
  SND.happy(SP[V.sp].pitch); say('Tạm biệt bác sĩ!');
  $('#bubble').classList.remove('pop'); $('#bubble').classList.add('hide');
  await W8(900); if (!alive(my)) return;
  const endX = innerWidth - LAY.pat.x + 40; let hopN = -1;
  await tw(1000, t => {
    const ph = (t * 3) % 1, k = Math.floor(t * 3); if (k !== hopN && k < 3) { hopN = k; SND.hop(); }
    P_.style.transform = `translate(${(endX * t).toFixed(1)}px,${(-Math.sin(ph * Math.PI) * LAY.pat.h * 0.12).toFixed(1)}px)`;
  }, ease.linear);
  if (!alive(my)) return;
  P_.style.transform = '';
  // next: prefer patients not treated yet
  const others = SP_IDS.filter(i => i !== V.sp);
  const fresh = others.filter(i => !save.book[i]);
  const nsp = pick(fresh.length ? fresh : others);
  beginVisit(nsp, rollAils(nsp, save.diff + 1));
}
function cleanupPlay() {
  tweens.forEach(p => p.cancel()); tweens.clear();
  timers.forEach(t => clearTimeout(t)); timers.clear();
  actors.forEach(a => a.el.remove()); actors.clear();
  clearTimeout(idleT); hand.hide(); hideMeter();
  $$('.tag,.ring,.token').forEach(e => e.remove());
  if (picker) { const pk = picker; picker = null; pk.remove(); if (pk._cancel) pk._cancel(); }
  parked = null; drag = null; ptrHeld = 0;
  if (selected) { const b = toolEl(selected); if (b) b.classList.remove('sel'); selected = null; }
  $$('.tool').forEach(b => b.classList.remove('out', 'hint', 'sel', 'press', 'nope'));
  busy = false;
  const P_ = $('#pat'); P_.style.transform = ''; P_.classList.remove('dance');
}
function leavePlay() {
  round++;
  cleanupPlay();
  K.stopSpeech();
  V = null;
}

/* --- debug hooks for automated tests (read-only helpers) --- */
window.__dbg = {
  get screen() { return screen; },
  state() { return V && { sp: V.sp, phase: V.phase, busy, selected, parked: !!parked, picker: !!picker, hint: V.hint, misses: V.misses, ails: V.ails.map(a => ({ id: a.id, step: a.step, n: a.n, prog: +a.prog.toFixed(2) })) }; },
  next() { const f = focus(); return f && Object.assign({ ail: f.ail ? f.ail.id : null }, f.def); },
  spot(name, dx = 0, dy = 0) { return spotXY(name, dx, dy); },
  tool(t) { const r = toolEl(t).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width }; },
  scale: () => pScale(),
  waiting: () => waiting,
  smiles: () => save.smiles,
  book: () => Object.assign({}, save.book),
  deco: () => Object.assign({}, save.deco),
  glow: () => { const s = patEl(); return !!(s && $('.glowg', s).childElementCount); },
  art: (id, o) => patSVG(id, o), toolArt: t => toolSVG(t), symArt: a => SYM[a], ids: SP_IDS, ailIds: AIL_IDS, tools: TORDER,
};

refreshPills();
})();
</script>
