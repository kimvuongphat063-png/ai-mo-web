<!DOCTYPE html>
<html lang="vi" data-game="khaoco">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffb35c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Khảo Cổ Khủng Long</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* ===== BéVui Kit 5 — shared styles ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','Segoe UI Symbol',sans-serif;
  --ink:#33305a; --ink-soft:#6c6896;
  --c1:#4f8cff; --c1d:#2f63d6; --c1l:#e2edff;
  --c2:#ff7a9c; --c2d:#dd4f76;
  --ok:#35c46a; --okd:#1f9a4d;
  --gold:#ffc93c; --goldd:#e19a00;
  --bad:#ff8a65;
  --bg1:#bfe3ff; --bg2:#fff1c9;
  --panel:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:76px;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
svg{overflow:visible}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-play{touch-action:none}

/* ---- top bar ---- */
.k-bar{position:absolute;z-index:40;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-right{display:flex;gap:10px;align-items:center;margin-left:auto;flex:0 0 auto}
.k-bar .k-extra{display:flex;gap:10px}
.k-bar .k-extra:empty{display:none}
.ibtn{position:relative;width:54px;height:54px;flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);padding:0;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(30,40,90,.16),0 10px 18px rgba(30,40,90,.10);
  transition:transform .12s ease,box-shadow .12s ease,opacity .2s}
.ibtn:active,.ibtn.press{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(30,40,90,.16),0 4px 8px rgba(30,40,90,.08)}
.ibtn svg{width:30px;height:30px}
.ibtn .emo{font-size:30px}
.ibtn.off{color:#b4b2cc}
.ibtn .badge,.btn .badge{position:absolute;top:-8px;right:-8px;min-width:25px;height:25px;padding:0 7px;border-radius:13px;background:var(--c2);color:#fff;
  font:800 15px/25px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none}
.k-back{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d),0 10px 18px rgba(30,40,90,.12)}
.k-back:active{box-shadow:0 1px 0 var(--c1d)}
@media (max-height:500px),(max-width:430px){
  .ibtn{width:50px;height:50px;border-radius:16px}
  .ibtn svg{width:27px;height:27px}
  .k-bar,.k-bar .k-right,.k-bar .k-extra{gap:8px}
  .k-bar{padding-top:calc(8px + var(--safe-t));padding-bottom:6px}
}
/* narrow portrait: middle slot drops to its own row when it has content */
@media (max-width:600px) and (orientation:portrait){
  .k-bar{flex-wrap:wrap;row-gap:8px}
  .k-bar .k-mid{order:10;flex-basis:100%}
  .k-bar .k-mid:empty{display:none}
}

/* ---- buttons ---- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  font:800 clamp(20px,3.6vmin,30px)/1 var(--font);padding:.6em 1.25em .66em;border-radius:999px;color:#fff;background:var(--b);min-height:var(--tap);
  box-shadow:0 7px 0 var(--bd),0 12px 22px rgba(20,30,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:9%;height:30%;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active,.btn.press{transform:translateY(6px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(20,30,80,.16)}
.btn svg{width:1.15em;height:1.15em;flex:0 0 auto}
.btn .emo{font-size:1.15em}
.btn.big{font-size:clamp(28px,5.6vmin,48px);padding:.55em 1.5em .62em}
.btn.small{font-size:clamp(17px,2.8vmin,22px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3d00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.white{--b:#fff;--bd:#d5d9ee;color:var(--c1d);text-shadow:none}
.btn.purple{--b:#9b6bff;--bd:#7246dc}
.btn.orange{--b:#ff9a3c;--bd:#db7412}
.btn[disabled],.btn.dis{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}
.btn.glow{animation:k-glow 1.3s ease-in-out infinite}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex;animation:k-fade .35s ease}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(42px,9.5vmin,100px);
  -webkit-text-stroke:.17em var(--c1d);paint-order:stroke fill;text-shadow:0 .1em 0 var(--c1d),0 .2em .3em rgba(20,30,80,.25)}
.k-logo span{display:inline-block}
.k-logo .l2{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.8vmin,24px);color:var(--ink-soft);margin:.2em 0 0;text-align:center}
.k-h{margin:4px 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.05}

/* ---- tiles (mode / level pickers) ---- */
.k-tiles{display:grid;gap:clamp(10px,2vmin,18px);width:min(1000px,100%);grid-template-columns:repeat(auto-fit,minmax(min(150px,42vw),1fr))}
.k-tile{--tc:var(--c1);--tcd:var(--c1d);--tcl:var(--c1l);position:relative;border:none;cursor:pointer;border-radius:26px;background:#fff;padding:12px 10px 12px;
  box-shadow:0 7px 0 rgba(30,40,90,.14),0 12px 20px rgba(30,40,90,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:800;color:var(--ink);font-size:clamp(16px,2.6vmin,22px);line-height:1.1;text-align:center;transition:transform .15s;min-height:var(--tap)}
.k-tile:active{transform:translateY(4px) scale(.98)}
.k-tile .ti{font-size:clamp(38px,7vmin,62px);width:1.55em;height:1.55em;display:grid;place-items:center;border-radius:50%;background:var(--tcl)}
.k-tile .ti svg{width:72%;height:72%}
.k-tile small{display:block;font-weight:700;color:var(--ink-soft);font-size:.78em}
.k-tile .st{display:flex;gap:1px;justify-content:center}
.k-tile.sel{background:var(--tc);color:#fff;box-shadow:0 7px 0 var(--tcd),0 0 0 4px #fff}
.k-tile.sel small{color:rgba(255,255,255,.9)}
.k-tile.sel .ti{background:rgba(255,255,255,.3)}
.st{display:inline-flex;gap:1px;justify-content:center;align-items:center}
.k-mini-star{display:inline-block}
.k-mini-star svg{width:clamp(16px,2.8vmin,22px);height:auto;color:#e3e2f2;display:block}
.k-mini-star.on svg{color:var(--gold)}

/* ---- overlay / modal ---- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(30,30,80,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:k-fade .25s ease;padding:16px;overflow:auto}
.k-panel{position:relative;width:min(580px,94vw);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border-radius:34px;padding:26px 22px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(30,40,90,.14),0 30px 60px rgba(30,40,90,.3);animation:k-panel .34s cubic-bezier(.2,1.5,.4,1) both;overscroll-behavior:contain}
.k-panel.wide{width:min(900px,96vw)}
.k-panel h2{margin:0 0 4px;font-size:clamp(28px,6vmin,46px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,3vmin,22px);font-weight:600;color:var(--ink-soft)}
.k-close{position:absolute;top:12px;right:12px;z-index:2}
.k-btns{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;margin-top:22px}
.k-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.k-stars svg{width:clamp(54px,11vmin,84px);height:auto;filter:drop-shadow(0 4px 0 rgba(160,100,0,.25));transform:scale(0)}
.k-stars svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-stars .mid svg{margin-top:-16px}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff6dc;
  border:3px dashed #f4c45a;font-weight:800;font-size:clamp(17px,3vmin,22px);color:#9a6400;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.k-reward .emo{font-size:46px;animation:k-wiggle 1.2s 1.4s ease-in-out infinite}
.k-result .k-hero{width:clamp(96px,22vmin,140px);margin:-80px auto 0;display:block}
.k-panel.k-result{overflow:visible;margin-top:60px}
@media (max-height:500px){
  .k-panel{padding:16px 18px 16px;border-radius:26px}
  .k-btns{margin-top:12px}
  .k-stars svg{width:52px}
  .k-result .k-hero{width:80px;margin-top:-56px}
  .k-panel.k-result{margin-top:40px}
}

/* ---- praise / toast ---- */
.k-praise{position:fixed;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.15em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.5vmin,58px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(30,40,90,.12),0 12px 24px rgba(30,40,90,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* ---- speech bubble with replay ---- */
.k-say{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 8px 6px 16px;font-weight:800;color:var(--ink);
  font-size:clamp(17px,2.8vmin,24px);box-shadow:0 5px 0 rgba(30,40,90,.12);line-height:1.1;max-width:100%}
.k-say .ibtn{width:44px;height:44px;border-radius:14px;background:var(--c1l);box-shadow:none}
.k-say .ibtn svg{width:24px;height:24px}

/* ---- tutorial hand ---- */
.k-hand{position:fixed;left:0;top:0;z-index:85;width:74px;height:74px;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.k-hand svg{width:100%;height:100%}

/* ---- decorative ---- */
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.k-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:50%;height:150%;left:15%;bottom:20%}
.k-cloud::after{width:38%;height:120%;right:14%;bottom:25%}

/* ---- animations ---- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-panel{0%{transform:scale(.88) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-glow{0%,100%{box-shadow:0 7px 0 var(--bd),0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 7px 0 var(--bd),0 0 0 10px rgba(255,255,255,.55)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes k-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-22%) scale(.94,1.08)}75%{transform:translateY(0) scale(1.06,.94)}}
@keyframes k-float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-22px)}}
@keyframes k-drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.k-wiggle{animation:k-wiggle .5s ease-in-out}
.k-shake{animation:k-shake .45s ease-in-out}
.k-jump{animation:k-jump .6s cubic-bezier(.3,1.4,.5,1)}
.k-bob{animation:k-bob 2.4s ease-in-out infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3s ease-in-out infinite}
.k-blink{transform-box:fill-box;transform-origin:50% 50%;animation:k-blink 4.4s infinite}
@media (prefers-reduced-motion:reduce){.k-bob,.btn.pulse,.btn.glow,.k-breathe{animation:none!important}}
</style>
<style>
:root{--c1:#ff9a3c;--c1d:#c8641a;--c1l:#ffeedd;--c2:#3fb37f;--c2d:#2a8b5f;--ink:#4b3426;--ink-soft:#8a6a55;--sky1:#ffeab2;--sky2:#ffc890}
body{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
body.z-ice{--sky1:#e6f7ff;--sky2:#a9d7f3}
body.z-volcano{--sky1:#ffd0a6;--sky2:#94597a}
body.z-beach{--sky1:#c4f0ff;--sky2:#ffe4a8}
body.z-museum{--sky1:#384e75;--sky2:#141c31}
.scene{position:absolute;left:0;right:0;bottom:0;height:min(100vh,62vw);pointer-events:none;z-index:0}
.scene svg{width:100%;height:100%;display:block;overflow:hidden}
body.z-museum .scene{display:none}
.hall{position:absolute;inset:0;pointer-events:none;z-index:0;display:none;
  background:radial-gradient(ellipse 55% 45% at 50% 32%,rgba(255,232,170,.20),rgba(255,232,170,0) 70%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 90px)}
.hall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.28));border-top:3px solid rgba(255,220,150,.08)}
body.z-museum .hall{display:block}
.screen{z-index:1}

/* ---------- mascot (baby dino explorer) ---------- */
.masc{display:block;overflow:visible}
.masc .mt{transform-box:view-box;transform-origin:84px 214px;animation:mTail 2.4s ease-in-out infinite}
.masc .mb{transform-box:view-box;transform-origin:120px 246px;animation:k-breathe 3s ease-in-out infinite}
.masc .mh{transform-box:view-box;transform-origin:120px 158px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.masc .me{transform-box:view-box;transform-origin:120px 112px;animation:k-blink 4.2s infinite}
.masc .mp{transition:transform .18s ease-out}
.masc .marm{transform-box:view-box;transform-origin:166px 178px;animation:mBrush 1.7s ease-in-out infinite}
.masc .m-o{opacity:0}.masc.happy .m-o{opacity:1}.masc.happy .m-c{opacity:0}
.masc.happy .mh{transform:rotate(-7deg)}
.masc.wow .me{animation:none;transform:scale(1.12)}
.masc.hmm .mh{transform:rotate(9deg)}
@keyframes mTail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes mBrush{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}

/* ---------- cartoon dinosaurs ---------- */
.dino{display:block;overflow:visible}
.dino .tl{transform-box:view-box;animation:dTail 2.8s ease-in-out infinite}
.dino .bd{transform-box:view-box;transform-origin:160px 206px;animation:k-breathe 3.2s ease-in-out infinite}
.dino .hd{transform-box:view-box}
.dino .ey{transform-box:fill-box;transform-origin:50% 50%;animation:k-blink 4.6s infinite}
.dino .pp{transition:transform .18s ease-out}
.dino .m-o{opacity:0}
.dino.roar .m-o{opacity:1}.dino.roar .m-c{opacity:0}
.dino.roar .hd{animation:dRoar 1.3s ease-in-out}
.dino.roar .bd{animation:dRoarB 1.3s ease-in-out}
.dino .wl{transform-box:view-box;transform-origin:152px 100px;animation:wingL 1.8s ease-in-out infinite}
.dino .wr{transform-box:view-box;transform-origin:168px 100px;animation:wingR 1.8s ease-in-out infinite}
.dino.sil{filter:brightness(0) opacity(.22)}
.dino.sil *,.dino.still *{animation:none!important}
@keyframes dTail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes dRoar{0%{transform:none}14%{transform:rotate(-13deg) scale(1.07)}72%{transform:rotate(-10deg) scale(1.07)}100%{transform:none}}
@keyframes dRoarB{0%,100%{transform:none}14%{transform:scale(1.04,.95)}72%{transform:scale(1.03,.97)}}
@keyframes wingL{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
@keyframes wingR{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}

/* ---------- bones ---------- */
.bn .bo path{fill:none;stroke:#9a7b4f;stroke-linecap:round;stroke-linejoin:round}
.bn .bo .ff{fill:#9a7b4f;stroke:#9a7b4f}
.bn .bo circle{fill:#9a7b4f}
.bn .bf path{fill:none;stroke:#fff4da;stroke-linecap:round;stroke-linejoin:round}
.bn .bf .ff{fill:#fff4da;stroke:none}
.bn .bf circle{fill:#fff4da}
.bn .bh{fill:#7d6141}
.bn .bl{fill:none;stroke:#c9a978;stroke-width:2.2;stroke-linecap:round}
.bn .bt{fill:#fff;stroke:#9a7b4f;stroke-width:1.2;stroke-linejoin:round}
.gh .bo path{stroke:rgba(255,255,255,.17)}
.gh .bo .ff,.gh .bo circle{fill:rgba(255,255,255,.17)}
.gh .bo .ff{stroke:rgba(255,255,255,.17)}
.gh .bf,.gh .bx{display:none}

/* ---------- title ---------- */
#title{gap:clamp(2px,1.2vmin,12px);padding:calc(var(--bar-h) + 2px) 16px calc(16px + var(--safe-b))}
.t-hero{position:relative;width:clamp(190px,52vmin,380px)}
.t-hero .masc{width:100%;height:auto;cursor:pointer}
.t-txt{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vmin,22px)}
.k-logo{--c1d:#8f4310}
.k-logo .l1{color:#fff}.k-logo .l2{color:#ffd23f;font-size:1.04em}
.t-btns{display:flex;flex-direction:column;align-items:center;gap:16px}
.btn .mus{width:1.25em;height:1.25em;flex:0 0 auto}
@media (min-aspect-ratio:6/5){
  #title{flex-direction:row;gap:5vw}
  .t-hero{width:min(58vh,420px)}
}

/* ---------- zone select ---------- */
#zones{justify-content:center;gap:clamp(8px,2vmin,18px);padding:calc(var(--bar-h) + 6px) 16px calc(14px + var(--safe-b))}
.k-h{--c1d:#8f4310}
.zgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2.2vmin,22px);width:min(1300px,100%,170vh)}
.zc{border:none;cursor:pointer;background:#fff;border-radius:28px;padding:9px 9px 10px;color:var(--ink);position:relative;
  box-shadow:0 8px 0 rgba(110,60,20,.16),0 14px 26px rgba(110,60,20,.12);display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .15s}
.zc:active{transform:translateY(5px)}
.zc .zt{width:100%;aspect-ratio:16/10;border-radius:20px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.04)}
.zc .zt svg{width:100%;height:100%;display:block}
.zc b{font-size:clamp(20px,3.4vmin,30px);line-height:1}
.zc .zs{display:flex;gap:2px;justify-content:center;align-items:center;min-height:26px}
.zc .zs i{width:clamp(34px,6vmin,52px);aspect-ratio:320/220;display:block}
.zc .zs svg{width:100%;height:100%}
.zc .zs .q{font-style:normal;font-weight:800;color:#d9c2a8;font-size:clamp(14px,2.4vmin,18px)}
@media (max-aspect-ratio:1/1){.zgrid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}.zc .zt{aspect-ratio:4/3}.zc .zs i{width:clamp(40px,12vw,60px)}}
@media (max-aspect-ratio:1/1) and (max-height:700px){.zc .zt{aspect-ratio:16/10}}
@media (max-height:520px) and (orientation:landscape){.zc{padding:7px 7px 8px;gap:3px}.zc .zt{aspect-ratio:16/9}}

/* ---------- top-bar progress ---------- */
.pips{display:flex;gap:5px;align-items:center;background:rgba(255,255,255,.93);padding:6px 11px;border-radius:999px;box-shadow:0 4px 0 rgba(110,60,20,.14)}
.pips i{width:32px;height:32px;border-radius:50%;background:#f1e4d6;display:grid;place-items:center;color:#cdb69c;font-style:normal;
  transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .3s,color .3s}
.pips i svg{width:22px;height:22px}
.pips i.ok{background:#ffe8a3;color:#a87a34;transform:scale(1.14)}
.pips i.it{background:#e6f2ff;color:#8fb2d6;font-weight:800;font-size:17px}
.pips i.it.ok{background:#ffe3f0}
.pips i.it svg{width:26px;height:26px}
.pips .sep{width:2px;height:22px;background:#ead9c6;border-radius:2px;margin:0 2px}
@media (max-width:380px){.pips i{width:28px;height:28px}.pips i svg{width:19px;height:19px}.pips{gap:4px;padding:5px 9px}}

/* ---------- dig ---------- */
.dv{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;margin:0 auto;max-width:1500px;display:flex;flex-direction:column;
  padding:14px 22px calc(12px + var(--safe-b));gap:18px}
.dv.land{flex-direction:row;padding:14px 14px calc(14px + var(--safe-b)) 24px;gap:22px}
.dig{position:relative;flex:1 1 auto;min-height:0;min-width:0;border-radius:18px;overflow:hidden;touch-action:none;cursor:crosshair;background:#a06a38;
  box-shadow:0 0 0 7px #b8824c,0 0 0 11px #7d5128,0 16px 30px rgba(60,30,10,.35)}
.dig canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.dig .finds,.dig .rocks{position:absolute;inset:0;pointer-events:none}
.dig .film{opacity:.55}
.dig::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:5;
  box-shadow:inset 0 9px 18px rgba(0,0,0,.22),inset 0 -4px 10px rgba(0,0,0,.1)}
.dig.t-hammer{cursor:pointer}
.strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.fp{position:absolute;left:0;top:0;transform-origin:50% 50%}
.fp svg{width:100%;height:100%;display:block;overflow:visible}
.fp.ready{animation:glint 1.1s ease-in-out infinite}
.fp.nudge{animation:nudge .4s}
@keyframes glint{0%,100%{filter:drop-shadow(0 0 1px rgba(255,236,150,.6))}50%{filter:drop-shadow(0 0 9px rgba(255,226,90,1))}}
@keyframes nudge{0%,100%{translate:0 0}30%{translate:-4px 0}60%{translate:4px 0}}
.rock{position:absolute;left:0;top:0;transform-origin:50% 60%}
.rock svg{width:100%;height:100%;display:block;overflow:visible}
.rock .ck1,.rock .ck2{opacity:0;transition:opacity .12s}
.rock.h1 .ck1,.rock.h2 .ck1,.rock.h2 .ck2{opacity:1}
.rock.bump{animation:rockBump .22s}
.rock.gone{transition:opacity .25s,scale .25s;opacity:0;scale:1.25}
@keyframes rockBump{0%,100%{scale:1 1}40%{scale:1.07 .9}}
.asmw{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;z-index:7;pointer-events:none}
.asmw .btn{pointer-events:auto}
.tools{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.6vw,20px)}
.dv.land .tools{flex-direction:column;gap:clamp(8px,2vh,16px)}
.tool{position:relative;width:var(--tb,76px);height:var(--tb,76px);border:none;border-radius:26%;background:#fff;cursor:pointer;padding:3px 0 2px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(110,60,20,.18),0 10px 18px rgba(110,60,20,.12);transition:transform .18s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s}
.tool svg{width:62%;height:62%;flex:0 0 auto;overflow:visible}
.tool b{font-size:max(13px,calc(var(--tb,76px)*.19));line-height:1.05;font-weight:800}
.tool.on{background:#ffd23f;box-shadow:0 6px 0 #d49a14,0 0 0 4px #fff,0 12px 22px rgba(110,60,20,.22);transform:translateY(-4px) scale(1.06)}
.tool.wig{animation:k-wiggle .45s 2}
.dmasc{width:calc(var(--tb,76px)*1.3);height:calc(var(--tb,76px)*1.3);flex:0 0 auto}
.dmasc .masc{width:100%;height:100%}
.dmasc.off{display:none}

/* ---------- assemble ---------- */
.av{position:absolute;left:0;right:0;top:var(--bar-h);bottom:0;margin:0 auto;max-width:1400px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  padding:4px 14px calc(12px + var(--safe-b));gap:8px}
.av.land{flex-direction:row;justify-content:center;gap:28px}
.av.land .ncard{width:var(--ncw,320px)}
.stage2{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 auto}
.frame{position:relative;width:var(--fw,320px);height:calc(var(--fw,320px)*.6875)}
.frame::before{content:"";position:absolute;inset:-8% -6% -4%;border-radius:40px;background:radial-gradient(ellipse at 50% 45%,rgba(255,238,190,.22),rgba(255,238,190,0) 68%);pointer-events:none}
.frame::after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:7%;border-radius:50%;background:rgba(0,0,0,.28);z-index:-1}
.frame>svg{position:absolute;inset:0;width:100%;height:100%}
.frame .dino{opacity:0;pointer-events:none}
.frame.alive .dino{pointer-events:auto;cursor:pointer}
.skel .real{opacity:0}
.skel .real.on{opacity:1;transform-box:fill-box;transform-origin:50% 50%;animation:snapIn .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes snapIn{0%{transform:scale(1.22)}100%{transform:scale(1)}}
.skel .slot.hot .bo path{stroke:rgba(255,214,90,.85)}
.skel .slot.hot .bo .ff,.skel .slot.hot .bo circle{fill:rgba(255,214,90,.85)}
.skel .slot.hot{animation:slotGlow .7s ease-in-out infinite}
@keyframes slotGlow{0%,100%{opacity:.75}50%{opacity:1}}
.skel .slot.wig{transform-box:fill-box;transform-origin:50% 50%;animation:k-shake .45s}
.skel.shine .real{animation:shine .9s ease-in-out}
@keyframes shine{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px #fff6c4) brightness(1.15)}}
.plaque{background:linear-gradient(#e2bd73,#b98a42);color:#fff;font-weight:800;border-radius:14px;padding:3px 20px 5px;font-size:clamp(18px,3vmin,26px);line-height:1.2;
  box-shadow:0 4px 0 #8a6128,0 8px 14px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.22);min-width:130px;text-align:center;white-space:nowrap}
.plaque.on{animation:k-pop .5s cubic-bezier(.2,1.6,.4,1)}
.tray{display:grid;grid-template-columns:repeat(var(--cols,3),var(--cs,96px));gap:var(--tg,12px);justify-content:center;align-content:center;flex:0 0 auto}
.pcard{width:var(--cs,96px);height:var(--cs,96px);border:none;border-radius:24%;background:rgba(255,255,255,.13);cursor:grab;padding:0;position:relative;display:block;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.25);transition:transform .25s,opacity .25s}
.pcard svg{position:absolute;left:10%;top:10%;width:80%;height:80%;overflow:visible;transition:opacity .15s}
.pcard.lift svg{opacity:.18}
.pcard.gone{transform:scale(0);opacity:0;pointer-events:none}
.pcard.shake{animation:k-shake .45s}
.pcard.tip{box-shadow:inset 0 0 0 3px #ffd75e,0 0 0 5px rgba(255,215,94,.35),0 6px 14px rgba(0,0,0,.25)}
.gp{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 14px 12px rgba(0,0,0,.45))}
.gp svg{width:100%;height:100%;overflow:visible;display:block}
.ncard{background:#fff;border-radius:28px;padding:14px 20px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:min(560px,100%);flex-shrink:1;min-width:0;
  box-shadow:0 8px 0 rgba(0,0,0,.2),0 18px 30px rgba(0,0,0,.25);animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both;flex:0 0 auto}
.nc-name{font-size:clamp(30px,6vmin,52px);font-weight:800;color:var(--c1d);line-height:1}
.nc-vi{font-size:clamp(18px,3vmin,25px);font-weight:800;color:var(--c2d);line-height:1.1}
.nc-fact{font-size:clamp(16px,2.6vmin,21px);font-weight:700;color:var(--ink-soft);line-height:1.25;margin-top:2px}
.nc-fact.say{color:var(--ink)}
.nc-btns{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
.nc-btns .ibtn{background:var(--c1l)}

/* ---------- museum ---------- */
#museum{justify-content:flex-start;padding:calc(var(--bar-h) + 4px) 12px calc(10px + var(--safe-b));gap:6px}
#museum .k-h{--c1d:#1d2b47;color:#ffe7a8}
.mscroll{flex:1 1 auto;overflow-y:auto;width:min(1100px,100%);padding:4px 6px 28px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.msec h3{margin:10px 6px 10px;color:#ffe7a8;font-size:clamp(20px,3.4vmin,28px);line-height:1}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,23vmin,200px),1fr));gap:14px}
.mcard{border:none;cursor:pointer;border-radius:24px;background:linear-gradient(#4a618c,#2c3b5c);padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;
  box-shadow:0 6px 0 #1b2540,0 10px 18px rgba(0,0,0,.25);position:relative;transition:transform .15s}
.mcard:active{transform:translateY(4px)}
.mcard .ped{width:100%;aspect-ratio:320/220;position:relative}
.mcard .ped::after{content:"";position:absolute;left:10%;right:10%;bottom:-2px;height:9%;border-radius:50%;background:rgba(0,0,0,.28);z-index:0}
.mcard .ped svg{position:relative;z-index:1;width:100%;height:100%}
.mcard b{font-size:clamp(15px,2.4vmin,20px);line-height:1.1}
.mcard small{font-size:clamp(12px,1.9vmin,15px);opacity:.8;font-weight:700;line-height:1.1}
.mcard .qm{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:clamp(34px,6vmin,52px);font-weight:800;color:rgba(255,255,255,.55);z-index:2}
.mcard.no{background:linear-gradient(#3a4c70,#26324e)}
.mcard.jump{animation:k-jump .6s}
.mgrid.items{grid-template-columns:repeat(auto-fill,minmax(clamp(100px,16vmin,130px),1fr))}
.icard{border:none;cursor:pointer;border-radius:22px;background:linear-gradient(#4a618c,#2c3b5c);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;
  box-shadow:0 5px 0 #1b2540;position:relative;min-height:100px}
.icard .ic{width:60%;aspect-ratio:1}
.icard .ic svg{width:100%;height:100%}
.icard span{font-weight:800;font-size:clamp(12px,1.9vmin,15px);line-height:1.1;text-align:center}
.icard.no .ic{filter:brightness(0) opacity(.25)}
.icard.no span{opacity:.5}
.icard .cnt{position:absolute;top:6px;right:8px;background:#ffd23f;color:#6b3d00;border-radius:999px;font-weight:800;font-size:13px;padding:0 7px;line-height:20px}
.icard.shake{animation:k-shake .45s}
.mcount{font-weight:800;color:#5a3a12;background:#ffe7a8;border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 rgba(0,0,0,.25);font-size:clamp(15px,2.5vmin,19px);white-space:nowrap}
.ovd{width:min(72vw,400px);margin:26px auto 0;cursor:pointer}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .k-panel.dpanel{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;align-items:center;width:min(760px,94vw)}
  .dpanel .ovd{grid-column:1;grid-row:1/span 4;width:min(38vw,300px);margin:0}
  .dpanel>:not(.ovd):not(.k-close){grid-column:2}
  .dpanel .k-btns{margin-top:12px}
}
.ovd .dino{width:100%;height:auto}
.k-panel .ovname{font-size:clamp(30px,6vmin,46px);font-weight:800;color:var(--c1d);line-height:1;margin-top:4px}
.k-panel .ovvi{font-size:clamp(18px,3vmin,24px);font-weight:800;color:var(--c2d)}
.k-result .k-hero{width:clamp(150px,34vmin,220px);margin-top:-70px}
@media (max-height:500px){
  .k-result .k-hero{width:110px;margin-top:-44px}
  .k-result .k-reward{margin-top:6px;padding:4px 14px 4px 8px}
  .k-result .k-reward .emo{font-size:34px}
  .k-result p{margin-top:2px}
}
.k-reward .emo svg{width:1.15em;height:1.15em;display:block}
.k-reward .emo .dino{width:1.6em;height:auto}
.btn .emo .mus{width:1em;height:1em;display:block}
.ovi{width:min(40vw,150px);margin:0 auto}
.ovi svg{width:100%;height:auto}
</style>
</head>

<svg id="measure" width="320" height="220" viewBox="0 0 320 220" style="position:absolute;left:-2000px;top:0;visibility:hidden" aria-hidden="true"></svg>

<script>/* ===== BéVui Kit 5 — shared engine: audio synth, music, voice, fx, ui, input ===== */
const Kit = (() => {
  'use strict';
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1 };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const restart = (e, cls) => { if (!e) return; e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); };
  const center = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; };
  const inRect = (x, y, r, pad = 0) => x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  /* ---------- storage (never throws) ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { try { localStorage.removeItem(ns + k); } catch (e) { } }
  });
  const store = mkStore('bevui.' + GAME + '.');
  const shared = mkStore('bevui.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- audio core ---------- */
  const MUSIC_VOL = 0.22;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;

/* ================= sound helpers ================= */
function roar(sp, mult = 1) {
  const R = sp.roar;
  if (!Kit.unlocked || !Kit.settings.sound) return;
  const c = Kit.audio(); if (!c || !Kit.sfxBus) return;
  const go = t0 => {
    const t = c.currentTime + .02 + t0, f = R.f, d = R.dur;
    const o = c.createOscillator(), o2 = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), lp = c.createBiquadFilter(), g = c.createGain(), g2 = c.createGain();
    o.type = R.type || 'sawtooth'; o2.type = 'square';
    if (R.glide) { o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.8, t + d * .5); o.frequency.exponentialRampToValueAtTime(f * .9, t + d); }
    else { o.frequency.setValueAtTime(f * .85, t); o.frequency.linearRampToValueAtTime(f * 1.25, t + d * .25); o.frequency.exponentialRampToValueAtTime(f * .62, t + d); }
    o2.frequency.setValueAtTime(f * .5, t); o2.frequency.exponentialRampToValueAtTime(f * .34, t + d);
    lfo.frequency.value = R.vib || 6; lg.gain.value = f * .05; lfo.connect(lg); lg.connect(o.frequency);
    lp.type = 'lowpass'; lp.Q.value = 5; lp.frequency.setValueAtTime(300, t); lp.frequency.exponentialRampToValueAtTime(R.open || 1800, t + d * .28); lp.frequency.exponentialRampToValueAtTime(240, t + d);
    const v = (R.vol || .3) * mult;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .07); g.gain.setValueAtTime(v * .9, t + d * .55); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    g2.gain.value = R.chirp ? 0.0001 : .35;
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(Kit.sfxBus);
    [o, o2, lfo].forEach(n => { n.start(t); n.stop(t + d + .05); });
  };
  try { go(0); if (R.twice) go(R.dur + .1); } catch (e) { }
  Kit.noise({ f: 700, to: 220, q: .8, ft: 'lowpass', a: .08, hold: R.dur * .3, dur: R.dur * .6, vol: R.chirp ? .05 : .14 });
}
const sTok = (hi = 0) => { Kit.tone({ f: 980 + hi * 140, to: 520, dur: .06, type: 'square', lp: 2600, vol: .11 }); Kit.noise({ f: 2600, q: 1.4, dur: .05, vol: .16 }); };
const sCrack = () => { Kit.noise({ f: 1400, to: 300, q: .7, dur: .3, vol: .3 }); Kit.sfx.thud(); setTimeout(() => Kit.noise({ f: 3000, q: 1, dur: .08, vol: .12 }), 90); };

/* ================= measuring bone pieces (bbox + sample points in species units) ================= */
function measureSp(sp) {
  if (sp.meas) return;
  const m = $('#measure');
  sp.pieces.forEach(pc => {
    m.innerHTML = `<g class="bn">${pc.svg}</g>`;
    const bb = $('.bo', m).getBBox(), pad = 7;
    pc.bb = { x: bb.x - pad, y: bb.y - pad, w: bb.width + pad * 2, h: bb.height + pad * 2 };
    pc.cx = pc.bb.x + pc.bb.w / 2; pc.cy = pc.bb.y + pc.bb.h / 2;
    let pts = [];
    $$('.bf path, .bf circle', m).forEach(e => {
      let M = null; try { M = e.getCTM(); } catch (_) { }
      const tp = (x, y) => M ? [M.a * x + M.c * y + M.e, M.b * x + M.d * y + M.f] : [x, y];
      if (e.tagName.toLowerCase() === 'circle') { pts.push(tp(+e.getAttribute('cx'), +e.getAttribute('cy'))); return; }
      if (e.classList.contains('ff')) {
        const b = e.getBBox(), st = clamp(Math.sqrt(b.width * b.height / 26), 4, 9);
        for (let x = b.x + st / 2; x < b.x + b.width; x += st) for (let y = b.y + st / 2; y < b.y + b.height; y += st) {
          let inside = true;
          try { inside = e.isPointInFill(new DOMPoint(x, y)); } catch (_) { try { const q = m.createSVGPoint(); q.x = x; q.y = y; inside = e.isPointInFill(q); } catch (__) { } }
          if (inside) pts.push(tp(x, y));
        }
      } else {
        const L = e.getTotalLength(), n = Math.max(2, Math.round(L / 7));
        for (let i = 0; i <= n; i++) { const q = e.getPointAtLength(L * i / n); pts.push(tp(q.x, q.y)); }
      }
    });
    if (pts.length > 64) { const k = pts.length / 64; pts = Array.from({ length: 64 }, (_, i) => pts[Math.floor(i * k)]); }
    if (!pts.length) pts = [[pc.cx, pc.cy]];
    pc.us = pts;
  });
  m.innerHTML = '';
  sp.meas = true;
}

  const d = $('#aDino'); Kit.follow($('.pp', d), { r: 3, ref: $('.ey', d) });
  $('#ncard').classList.add('hidden'); $('#ncFact').classList.remove('say');
  const tray = $('#tray'); tray.innerHTML = ''; tray.classList.remove('hidden');

function asmHint() {

}
function armAsmIdle() {

function mkGhost(i) {

  const g = el('div', 'gp'); g.innerHTML = `<svg class="bn" viewBox="${pc.bb.x} ${pc.bb.y} ${pc.bb.w} ${pc.bb.h}" aria-hidden="true">${pc.svg}</svg>`;
  g.style.width = w + 'px'; g.style.height = h + 'px';
  $('#av').appendChild(g);
  return { el: g, w, h, x: 0, y: 0, tf: (x, y, s) => `translate(${x - w / 2}px,${y - h / 2}px) scale(${s})` };
}
function bindCard(b, i) {
  let gh = null, moved = false, oy = 0;
  Kit.drag(b, {
    can: () => !A.done && !b.classList.contains('gone') && Kit.screen === 'asm' && A.drag == null,
    start() { moved = false; Kit.hand.hide(); A.drag = i; armAsmIdle(); },
    move(e, inf) {

      }
      gh.x = e.clientX; gh.y = e.clientY + oy; gh.el.style.transform = gh.tf(gh.x, gh.y, 1);
      const ok = okSlots(i);
      A.sp.pieces.forEach(p => { const s = slotEl(p.i); if (!s) return; const c = slotC(p.i); s.classList.toggle('hot', ok.includes(p.i) && Math.hypot(gh.x - c.x, gh.y - c.y) < snapR(c) * 1.8); });
    },
    end(e, inf) {

}
function tapCard(b, i) {
  if (A.done) return;
  Kit.sfx.pop(); Kit.restart(b, 'shake');
  const j = okSlots(i)[0]; if (j == null) return;
  hotSlot(j, 1800);
  const a = Kit.center(b), c = slotC(j);
  Kit.hand.drag(a.x, a.y, c.x, c.y, { times: 1 });

}
function dropCard(b, i, gh, cancel) {
  const x = gh.x, y = gh.y;
  let tgt = null, bd = Infinity;
  if (!cancel) for (const j of okSlots(i)) { const c = slotC(j), d = Math.hypot(x - c.x, y - c.y); if (d < snapR(c) * 1.25 && d < bd) { bd = d; tgt = j; } }

  if (!cancel) A.sp.pieces.forEach(p => { if (A.placed.has(p.i)) return; const c = slotC(p.i), d = Math.hypot(x - c.x, y - c.y); if (d < snapR(c) && d < bd) { bd = d; wrongJ = p.i; } });
  const cr = b.getBoundingClientRect(), s1 = Math.min(cr.width / gh.w, cr.height / gh.h, 1);
  gh.el.animate([{ transform: gh.tf(x, y, 1) }, { transform: gh.tf(cr.left + cr.width / 2, cr.top + cr.height / 2, s1) }], { duration: 320, easing: 'cubic-bezier(.3,1.25,.5,1)' }).onfinish = () => { gh.el.remove(); b.classList.remove('lift'); };

    const own = okSlots(i)[0]; if (own != null) setTimeout(() => hotSlot(own, 1500), 350);

}
function placeCard(b, i, j, gh) {

  Kit.sfx.snap();
  gh.el.animate([{ transform: gh.tf(gh.x, gh.y, 1) }, { transform: gh.tf(c.x, c.y, 1) }], { duration: 170, easing: 'ease-out', fill: 'forwards' }).onfinish = () => {
    gh.el.remove();
    if (tok !== S.tok) return;
    const real = $(`#frame .real[data-i="${j}"]`); if (real) real.classList.add('on');
    const s = slotEl(j); if (s) s.style.opacity = '0';
    Kit.sfx.drop(); Kit.sparkle(c.x, c.y, { n: 8, spread: Math.max(c.w, c.h) * .3 }); Kit.vibrate(15);
  };
  setTimeout(() => b.remove(), 300);
  if (A.placed.size >= A.sp.pieces.length) {
    A.done = true; clearTimeout(A.idleT); Kit.hand.hide();
    setTimeout(() => { if (tok === S.tok) comeAlive(); }, 650);
  } else {
    Kit.say(A.placed.size % 2 ? A.sp.pieces[j].n + '!' : pick(['Đúng rồi!', 'Khớp rồi!', 'Giỏi quá!', 'Tuyệt!']));

}
function comeAlive() {
  const sp = A.sp, tok = S.tok, fr = $('#frame'), sk = $('.skel', fr), d = $('#aDino');
  A.isNew = !found[sp.id];
  A.stars = A.wrong <= 1 ? 3 : A.wrong <= 3 ? 2 : 1;
  const f = found[sp.id] || { n: 0, stars: 0 };
  f.n++; f.stars = Math.max(f.stars || 0, A.stars); found[sp.id] = f; store.set('found', found);
  digs++; store.set('digs', digs);
  sk.classList.add('shine'); Kit.sfx.great();
  const fc = Kit.center(fr);
  Kit.sparkle(fc.x, fc.y, { n: 16, spread: fc.r.width * .35 });
  setTimeout(() => {
    if (tok !== S.tok) return;
    Kit.sfx.sparkle(); Kit.sfx.whoosh();

    sk.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, fill: 'forwards' });
    d.animate([{ opacity: 0, transform: 'scale(.86)', filter: 'brightness(3)' }, { opacity: 1, transform: 'scale(1.06)', filter: 'brightness(1.4)', offset: .6 }, { opacity: 1, transform: 'scale(1)', filter: 'brightness(1)' }], { duration: 1000, easing: 'ease-out', fill: 'forwards' });

}
function showName() {

Kit.onScreen('asm', { leave() { clearTimeout(A.idleT); A.drag = null; $$('.gp').forEach(g => g.remove()); } });
function layoutAsm() {
  const av = $('#av'), r = av.getBoundingClientRect(); if (!r.width || !A.sp) return;
  const W = r.width - 28, H = r.height - 16;
  const land = W / H > 1.15; av.classList.toggle('land', land);
  const named = !$('#ncard').classList.contains('hidden'), N = A.sp.pieces.length, PL = 52;
  let fw, cs, cols;
  if (land) {

}
