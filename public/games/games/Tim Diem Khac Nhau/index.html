<!DOCTYPE html>
<html lang="vi" data-game="tim-diem-khac">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17a2b8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tìm Điểm Khác Nhau</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== NhiKit 3 — shared styles (Bộ game 3) ===== */
:root{
  --font:'Baloo 2','Nunito','Segoe UI Rounded','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --ink:#2f2a55; --ink2:#6b6592;
  --c1:#4f8dff; --c1d:#2f63d8; --c1l:#e3edff;
  --c2:#ff6f9f; --c2d:#de4479;
  --ok:#35c46a; --okd:#1e9a4e;
  --gold:#ffc83a; --goldd:#e09600;
  --warn:#ff9f43; --warnd:#e07a12;
  --bg1:#a9d8ff; --bg2:#ffe3f1;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --btn:56px;
  --bar-h:76px; /* real value measured by Kit */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0}
img,svg{-webkit-user-drag:none;user-select:none}
.emo{font-family:var(--emoji);font-weight:400;line-height:1;font-style:normal}
.hidden{display:none!important}
.k-nt{touch-action:none}

/* ---------- top bar ---------- */
.k-bar{position:fixed;z-index:50;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:8px;
  padding:calc(8px + var(--st)) calc(10px + var(--sr)) 8px calc(10px + var(--sl));pointer-events:none}
.k-bar>*{pointer-events:auto}
.k-bar .k-mid{flex:1 1 auto;min-width:0;min-height:var(--btn);display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none}
.k-bar .k-mid>*{pointer-events:auto}
.k-bar .k-tools{display:flex;gap:8px;flex:0 0 auto}
.k-bar .k-left{display:flex;gap:8px;flex:0 0 auto;min-width:var(--btn)}
@media (max-width:560px) and (orientation:portrait){
  .k-bar{flex-wrap:wrap;row-gap:6px}
  .k-bar .k-mid{order:9;flex-basis:100%;min-height:0}
  .k-bar .k-mid:empty{display:none}
  .k-bar .k-left{margin-right:auto}
}
@media (max-height:440px){
  :root{--btn:52px}
  .k-bar{padding-top:calc(6px + var(--st));padding-bottom:4px}
}
.ibtn{position:relative;width:var(--btn);height:var(--btn);flex:0 0 auto;border:none;border-radius:18px;background:#fff;color:var(--c1d);
  display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 5px 0 rgba(30,20,80,.16),0 9px 16px rgba(30,20,80,.10);transition:transform .12s ease,box-shadow .12s ease,color .2s}
.ibtn svg{width:58%;height:58%}
.ibtn.press{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 rgba(30,20,80,.16),0 3px 6px rgba(30,20,80,.08)}
.ibtn.off{color:#b9b2d1}
.ibtn .badge,.btn .badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c2);color:#fff;
  font:800 14px/24px var(--font);box-shadow:0 2px 0 var(--c2d);text-shadow:none;pointer-events:none}
.ibtn.glow{animation:k-glow 1.4s ease-in-out infinite}

/* ---------- buttons ---------- */
.btn{--b:var(--c1);--bd:var(--c1d);position:relative;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  min-height:var(--btn);font:800 clamp(20px,3.4vmin,28px)/1 var(--font);padding:.55em 1.25em .62em;border-radius:999px;color:#fff;background:var(--b);
  box-shadow:0 6px 0 var(--bd),0 11px 20px rgba(30,15,80,.18);text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn::after{content:"";position:absolute;left:12%;right:12%;top:8%;height:32%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.08));pointer-events:none}
.btn.press{transform:translateY(5px) scale(.98);box-shadow:0 1px 0 var(--bd),0 3px 8px rgba(30,15,80,.15)}
.btn svg{width:1.1em;height:1.1em;flex:0 0 auto}
.btn.big{font-size:clamp(28px,5.6vmin,46px);padding:.5em 1.4em .58em}
.btn.small{font-size:clamp(17px,2.7vmin,21px)}
.btn.ok{--b:var(--ok);--bd:var(--okd)}
.btn.pink{--b:var(--c2);--bd:var(--c2d)}
.btn.gold{--b:var(--gold);--bd:var(--goldd);color:#6b3b00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.btn.warn{--b:var(--warn);--bd:var(--warnd)}
.btn.white{--b:#fff;--bd:#d9d3ee;color:var(--c1d);text-shadow:none}
.btn.round{width:var(--btn);padding:0;border-radius:50%}
.btn[disabled]{filter:grayscale(.75) opacity(.55);pointer-events:none}
.btn.pulse{animation:k-pulse 1.5s ease-in-out infinite}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.screen.on{display:flex;animation:k-fade .3s ease}
.k-logo{margin:0;font-weight:800;text-align:center;line-height:.95;letter-spacing:.01em;color:#fff;font-size:clamp(42px,9.6vmin,100px);
  -webkit-text-stroke:.15em var(--c1d);paint-order:stroke fill;text-shadow:0 .09em 0 var(--c1d),0 .17em .28em rgba(20,10,60,.25)}
.k-logo .w{display:inline-block;white-space:nowrap}
.k-logo .ch{display:inline-block;animation:k-wave 2.6s ease-in-out infinite}
.k-logo .alt{color:var(--gold)}
.k-sub{font-weight:700;font-size:clamp(16px,2.6vmin,22px);color:var(--ink2);margin:.3em 0 0;text-align:center}

/* title layout helper */
.k-title{gap:clamp(4px,1.6vmin,16px);padding:calc(var(--bar-h) + 4px) 16px calc(16px + var(--sb))}
.k-title .k-hero{position:relative;z-index:1;width:clamp(150px,34vmin,300px);height:auto;overflow:visible}
.k-title .k-ttxt{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.k-title .k-tbtns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(8px,2.2vmin,22px)}
.k-title .k-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (max-height:540px) and (min-aspect-ratio:1/1){
  .k-title{flex-direction:row;gap:5vw}
  .k-title .k-hero{width:min(38vmin,40vw)}
}

/* tiles (mode / level pickers) */
.k-pick{justify-content:flex-start;padding:calc(var(--bar-h) + 6px) calc(14px + var(--sr)) calc(18px + var(--sb)) calc(14px + var(--sl));overflow-y:auto;-webkit-overflow-scrolling:touch;gap:10px;touch-action:pan-y}
.k-h{margin:4px 0 0;font-size:clamp(22px,4vmin,34px);font-weight:800;color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;text-align:center;line-height:1.1}
.k-pick>:first-child{margin-top:auto}.k-pick>:last-child{margin-bottom:auto}
.k-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,168px),1fr));gap:14px;width:min(1040px,100%)}
.k-tile{--t:var(--c1);--td:var(--c1d);--tl:var(--c1l);position:relative;border:none;cursor:pointer;border-radius:28px;background:#fff;padding:12px 10px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;
  box-shadow:0 7px 0 rgba(30,20,80,.14),0 12px 22px rgba(30,20,80,.10);transition:transform .14s;font-weight:800;color:var(--ink);text-align:center}
.k-tile .art{width:clamp(70px,13vmin,104px);height:clamp(70px,13vmin,104px);border-radius:50%;background:var(--tl);display:grid;place-items:center;font-size:clamp(38px,7vmin,58px)}
.k-tile .art svg{width:80%;height:80%}
.k-tile .nm{font-size:clamp(18px,3vmin,24px);line-height:1.05}
.k-tile .ds{font-size:clamp(13px,2.1vmin,16px);color:var(--ink2);font-weight:700;line-height:1.1}
.k-tile .k-stars-mini{margin-top:2px}
.k-tile.press{transform:translateY(5px) scale(.98)}
.k-tile.sel{box-shadow:0 7px 0 var(--td),0 0 0 4px var(--t),0 12px 22px rgba(30,20,80,.10)}
.k-tile .tag{position:absolute;top:-8px;right:-4px;background:var(--t);color:#fff;font:800 13px/1 var(--font);padding:5px 9px;border-radius:12px;box-shadow:0 3px 0 var(--td)}
.k-tile .txt{display:flex;flex-direction:column;align-items:center;gap:2px}
@media (max-height:540px){
  .k-tile{min-height:0;flex-direction:row;justify-content:flex-start;gap:10px;padding:8px 12px;text-align:left;border-radius:22px}
  .k-tile .art{width:60px;height:60px;font-size:34px;flex:0 0 auto}
  .k-tile .txt{display:flex;flex-direction:column;align-items:flex-start}
}
.k-stars-mini{display:flex;gap:1px}
.k-stars-mini svg{width:clamp(17px,2.8vmin,22px);height:auto;color:#e5e0f3}
.k-stars-mini .on svg{color:var(--gold)}

/* ---------- overlay / modal ---------- */
.k-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(32,20,80,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:k-fade .22s ease;padding:calc(12px + var(--st)) 12px calc(12px + var(--sb))}
.k-panel{position:relative;width:min(560px,94vw);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:34px;padding:24px 20px 22px;text-align:center;
  box-shadow:0 12px 0 rgba(30,20,80,.14),0 28px 60px rgba(30,20,80,.32);animation:k-pop .45s cubic-bezier(.2,1.6,.4,1) both;overscroll-behavior:contain;touch-action:pan-y}
.k-panel h2{margin:0 0 4px;font-size:clamp(30px,6vmin,46px);line-height:1.05;color:var(--c1d)}
.k-panel p{margin:6px 0 0;font-size:clamp(17px,2.9vmin,22px);font-weight:700;color:var(--ink2)}
.k-panel .k-close{position:absolute;top:10px;right:10px}
.k-btns{display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center;margin-top:20px}
.k-result{overflow:visible}
.k-result .k-mascot{display:block;margin:-80px auto 0;width:120px;height:120px}
.k-starrow{display:flex;justify-content:center;gap:4px;margin:8px 0 2px}
.k-starrow svg{width:clamp(58px,11vmin,84px);height:auto;transform:scale(0);filter:drop-shadow(0 4px 0 rgba(160,100,0,.22))}
.k-starrow svg.mid{margin-top:-16px}
.k-starrow svg.on{animation:k-star .6s cubic-bezier(.2,1.8,.4,1) forwards}
.k-reward{display:inline-flex;align-items:center;gap:12px;margin-top:12px;padding:8px 18px 8px 10px;border-radius:22px;background:#fff6db;
  border:3px dashed #f2c158;font-weight:800;font-size:clamp(16px,2.8vmin,21px);color:#9a6200;animation:k-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both;text-align:left}
.k-reward .emo,.k-reward svg{font-size:44px;width:52px;height:52px;display:grid;place-items:center;animation:k-wiggle 1.2s 1.4s ease-in-out infinite;flex:0 0 auto}
@media (max-height:500px){
  .k-panel{padding:16px 16px 14px;border-radius:28px}
  .k-panel h2{font-size:30px}
  .k-starrow svg{width:56px}
  .k-btns{margin-top:12px}
  .k-result .k-mascot{display:none}
}

/* ---------- praise / toast / bubble / float ---------- */
.k-praise{position:fixed;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;white-space:nowrap;
  font-size:clamp(40px,9vmin,84px);color:#fff;-webkit-text-stroke:.14em var(--c2d);paint-order:stroke fill;text-shadow:0 .08em 0 var(--c2d),0 .18em .3em rgba(0,0,0,.2);
  animation:k-praise 1.35s cubic-bezier(.2,1.4,.4,1) forwards}
.k-praise.soft{-webkit-text-stroke-color:var(--c1d);text-shadow:0 .08em 0 var(--c1d),0 .18em .3em rgba(0,0,0,.2);font-size:clamp(30px,6.4vmin,58px)}
.k-toast{position:fixed;z-index:75;left:50%;bottom:calc(20px + var(--sb));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:999px;
  font-weight:800;font-size:clamp(16px,2.6vmin,21px);box-shadow:0 6px 0 rgba(30,20,80,.12),0 12px 24px rgba(30,20,80,.16);animation:k-toast 2.6s ease forwards;pointer-events:none;max-width:92vw;text-align:center}
.k-float{position:fixed;z-index:72;pointer-events:none;font-weight:800;white-space:nowrap;transform:translate(-50%,-50%);
  font-size:clamp(24px,4.6vmin,40px);color:#fff;-webkit-text-stroke:.14em var(--c1d);paint-order:stroke fill;animation:k-floatup 1.1s ease-out forwards}
.k-bubble{position:fixed;z-index:60;background:#fff;color:var(--ink);border-radius:22px;padding:8px 16px;font-weight:800;font-size:clamp(17px,2.8vmin,23px);line-height:1.15;
  box-shadow:0 5px 0 rgba(30,20,80,.12),0 10px 22px rgba(30,20,80,.14);pointer-events:none;max-width:min(78vw,420px);text-align:center;animation:k-pop .35s cubic-bezier(.2,1.6,.4,1) both}
.k-bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-10px;width:22px;height:22px;background:#fff;border-radius:4px;transform:translateX(-50%) rotate(45deg)}
.k-bubble.down::after{bottom:auto;top:-10px}
.k-bubble.out{animation:k-fadeout .25s ease forwards}
.k-hand{position:fixed;z-index:65;left:0;top:0;width:64px;height:64px;pointer-events:none;opacity:0;margin:-8px 0 0 -18px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}

/* ---------- fx canvas & deco ---------- */
.k-fx{position:fixed;inset:0;z-index:100;pointer-events:none;width:100%;height:100%}
.k-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}

/* ---------- mascot idle helpers (SVG) ---------- */
.k-blink{transform-box:fill-box;transform-origin:50% 55%;animation:k-blink 4.8s infinite}
.k-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:k-breathe 3.2s ease-in-out infinite}
.k-sway{transform-box:fill-box;transform-origin:50% 100%;animation:k-sway 3.6s ease-in-out infinite}
.k-pupil{transition:transform .14s ease-out}

/* ---------- animations ---------- */
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-fadeout{to{opacity:0;transform:translateY(-6px) scale(.96)}}
@keyframes k-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes k-star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes k-glow{0%,100%{box-shadow:0 5px 0 rgba(30,20,80,.16),0 0 0 0 rgba(255,200,58,.0)}50%{box-shadow:0 5px 0 rgba(30,20,80,.16),0 0 0 7px rgba(255,200,58,.75)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes k-wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.08em)}}
@keyframes k-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes k-jelly{0%,100%{transform:scale(1,1)}25%{transform:scale(1.14,.86)}50%{transform:scale(.92,1.1)}75%{transform:scale(1.04,.97)}}
@keyframes k-blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes k-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes k-praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-76%) scale(.9);opacity:0}}
@keyframes k-toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
@keyframes k-floatup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.1);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.k-a-wiggle{animation:k-wiggle .5s ease-in-out}
.k-a-shake{animation:k-shake .45s ease-in-out}
.k-a-jelly{animation:k-jelly .5s ease-in-out}
.k-a-bob{animation:k-bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.k-a-bob,.btn.pulse,.k-logo .ch{animation:none!important}}
</style>
<style>
:root{--c1:#17a2b8;--c1d:#0b7d8e;--c1l:#d6f5f8;--c2:#ff8a3d;--c2d:#e0661c;--ink:#263b55;--ink2:#5d7088;--bg1:#c6eef6;--bg2:#fff1d2;--mark:#ff3d7f}
body{background:linear-gradient(180deg,#c3ecf5 0%,#e3f6ee 55%,#fff0cf 100%)}
.screen{z-index:1}

/* ---------- background deco ---------- */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco .blob{position:absolute;border-radius:50%;background:#fff;opacity:.38}
.deco .dq{position:absolute;width:11vmin;height:11vmin;opacity:.16;animation:k-bob 7s ease-in-out infinite}
.deco .dq svg{width:100%;height:100%}

/* ---------- mascot (detective kitten) ---------- */
.cat{position:relative;touch-action:none}
.cat svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%}
.cat .m-tail{transform-origin:138px 198px;animation:mtail 2.8s ease-in-out infinite}
.cat .m-mag{transform-origin:148px 150px;animation:mmag 3.4s ease-in-out infinite}
.cat .m-body{transform-origin:102px 214px;animation:mbreathe 3.2s ease-in-out infinite}
.cat .m-head{transform-origin:102px 140px}
@keyframes mtail{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes mmag{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes mbreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.035)}}
.cat.jump svg{animation:mjump .75s cubic-bezier(.3,1.4,.5,1)}
@keyframes mjump{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(3%) scale(1.07,.9)}45%{transform:translateY(-16%) scale(.95,1.06)}72%{transform:translateY(0) scale(1.05,.95)}}
.cat.tilt .m-head{animation:mtilt 1.4s ease-in-out}
@keyframes mtilt{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-11deg)}}
.cat.no .m-head{animation:mno .6s ease-in-out}
@keyframes mno{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-4deg)}}
.cat.peek .m-mag{animation:mpeek 1.6s ease-in-out}
@keyframes mpeek{0%,100%{transform:rotate(0)}30%,70%{transform:translate(-30px,-4px) rotate(-14deg) scale(1.15)}}

/* ---------- title ---------- */
#title .k-hero{width:clamp(200px,40vmin,400px);cursor:pointer}
@media (orientation:portrait){#title .k-hero{width:clamp(210px,60vw,440px)}}
.hero{position:relative;aspect-ratio:300/230}
.hero .cards{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hero .cards .cl{animation:cardl 5s ease-in-out infinite;transform-origin:70px 120px}
.hero .cards .cr{animation:cardr 5s ease-in-out infinite;transform-origin:230px 120px}
@keyframes cardl{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(-8deg) translateY(-4px)}}
@keyframes cardr{0%,100%{transform:rotate(10deg)}50%{transform:rotate(7deg) translateY(-4px)}}
.hero .cards .ring{stroke-dasharray:100;stroke-dashoffset:100;animation:heroRing 5s ease-in-out infinite}
@keyframes heroRing{0%,20%{stroke-dashoffset:100}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.hero .cat{position:absolute;left:28%;width:44%;bottom:0}
#title .k-logo{font-size:clamp(42px,9vmin,92px)}

/* ---------- pick ---------- */
.diffrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.dbtn{border:none;cursor:pointer;background:#fff;border-radius:999px;padding:6px 16px 6px 8px;display:flex;align-items:center;gap:8px;font:800 clamp(18px,3vmin,24px)/1 var(--font);
  color:var(--ink);box-shadow:0 5px 0 rgba(20,60,90,.13);min-height:58px;transition:transform .12s,background .2s}
.dbtn .num{width:44px;height:44px;border-radius:50%;background:var(--c1l);color:var(--c1d);display:grid;place-items:center;font-size:26px}
.dbtn .dd{display:flex;gap:3px}
.dbtn .dd i{width:11px;height:11px;border-radius:50%;border:3px solid var(--mark);background:#fff}
.dbtn.sel{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c1d)}
.dbtn.sel .num{background:#fff}
.dbtn.sel .dd i{border-color:#fff;background:var(--mark)}
.dbtn.press{transform:translateY(4px)}
#pick .k-tiles{grid-template-columns:repeat(auto-fill,minmax(min(44%,200px),1fr));width:min(1080px,100%)}
#pick .k-tile{min-height:0;padding:10px 10px 10px}
#pick .k-tile .art{width:100%;max-width:230px;height:auto;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 4px var(--tl)}
#pick .k-tile .art svg{width:100%;height:100%;display:block}
#pick .k-tile .done{position:absolute;top:-8px;right:-6px;width:44px;height:44px}
.pick-foot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px}
@media (max-height:540px){
  #pick .k-tiles{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  #pick .k-tile .art{width:92px;height:69px;flex:0 0 auto;border-radius:12px}
  .dbtn{min-height:52px}
}

/* ---------- play ---------- */
#play{padding:0;justify-content:flex-start}
.pic{position:absolute;left:0;top:0;border-radius:20px;background:#fff;overflow:hidden;touch-action:none;cursor:pointer;
  box-shadow:0 0 0 5px #fff,0 9px 0 5px rgba(20,60,90,.13),0 16px 28px rgba(20,60,90,.16);transition:box-shadow .3s}
.pic svg{display:block;width:100%;height:100%}
.pic.in{animation:picIn .55s cubic-bezier(.2,1.4,.4,1) backwards}
.pic.win{box-shadow:0 0 0 6px var(--gold),0 9px 0 6px var(--goldd),0 16px 28px rgba(20,60,90,.16)}
@keyframes picIn{from{transform:translateY(34px) scale(.9);opacity:0}}
.mk .fw,.mk .fc{fill:none;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:mkdraw .6s ease-out forwards}
.mk .fw{stroke:#fff;stroke-width:11}
.mk .fc{stroke:var(--mark);stroke-width:6}
.mk .pp{transform-box:fill-box;transform-origin:center;animation:mkpop .7s cubic-bezier(.2,1.6,.4,1)}
.mk .pp.bump{animation:mkbump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes mkdraw{to{stroke-dashoffset:0}}
@keyframes mkpop{0%{transform:scale(.55)}60%{transform:scale(1.13)}100%{transform:scale(1)}}
@keyframes mkbump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.mk .rip{fill:rgba(255,255,255,.45);stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:rip .95s ease-out forwards}
.mk .rip2{fill:none;stroke:#8fd8ff;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:rip .95s .12s ease-out both}
@keyframes rip{0%{transform:scale(.15);opacity:1}100%{transform:scale(1.5);opacity:0}}
.mk .zone{fill:rgba(255,232,110,.30);stroke:#ffc83a;stroke-width:5;stroke-dasharray:12 10;transform-box:fill-box;transform-origin:center;animation:zone 1.6s ease-in-out 3 both}
.mk .spot{fill:rgba(255,245,170,.5);stroke:#ffe14d;stroke-width:7;transform-box:fill-box;transform-origin:center;animation:spot 1s ease-in-out 4 both;filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
@keyframes spot{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes zone{0%,100%{opacity:.2;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
.dock{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.dock>*{pointer-events:auto}
.dock.v{flex-direction:column;gap:6px}
#playCat{cursor:pointer;flex:0 0 auto}
.tip{display:flex;align-items:center;justify-content:flex-start;flex:0 0 auto;pointer-events:none!important;align-self:stretch}
.tip b{position:relative;display:block;background:#fff;border-radius:20px;padding:8px 14px;font-weight:800;color:var(--ink);line-height:1.15;text-align:center;max-width:100%;
  box-shadow:0 5px 0 rgba(20,60,90,.12),0 10px 20px rgba(20,60,90,.12);opacity:0;transform:scale(.6);transform-origin:0 50%;transition:opacity .2s,transform .3s cubic-bezier(.2,1.6,.4,1)}
.tip.on b{opacity:1;transform:scale(1)}
.tip b::after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:3px;left:-7px;top:50%;margin-top:-9px;transform:rotate(45deg)}
.dock.v .tip{order:-1;justify-content:center;align-items:flex-end;align-self:auto}
.dock.v .tip b{padding:7px 8px;border-radius:16px;transform-origin:50% 100%}
.dock.v .tip b::after{left:50%;top:auto;bottom:-7px;margin:0 0 0 -9px}
.hintb{width:68px;height:68px;padding:0;border-radius:50%;flex:0 0 auto;color:#7a4a00}
.hintb svg{width:58%;height:58%}
.hintb.glow{animation:hglow 1.2s ease-in-out infinite}
@keyframes hglow{0%,100%{box-shadow:0 6px 0 var(--goldd),0 0 0 0 rgba(255,200,58,0)}50%{box-shadow:0 6px 0 var(--goldd),0 0 0 10px rgba(255,200,58,.55)}}
.pdots{display:flex;gap:7px;background:#fff;border-radius:999px;padding:7px 12px;box-shadow:0 5px 0 rgba(20,60,90,.12);align-items:center}
.pdots i{width:30px;height:30px;border-radius:50%;background:#e3eef1;display:grid;place-items:center;transition:background .3s;box-shadow:inset 0 0 0 3px #d2e2e7}
.pdots i svg{width:72%;height:72%;color:#fff;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.8,.4,1)}

/* ---------- magnifier lens ---------- */
.lensw{position:fixed;left:0;top:0;z-index:90;pointer-events:none;will-change:transform}
.lensw .lens{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#fff;
  box-shadow:0 0 0 6px #fff,0 0 0 11px var(--c1d),0 14px 30px rgba(10,40,60,.35)}

.lensw .lh{position:absolute;width:22%;height:46%;left:84%;top:80%;border-radius:12px;background:linear-gradient(90deg,#8a5a32,#6b4426);transform-origin:50% 0;transform:rotate(-42deg);box-shadow:0 6px 10px rgba(0,0,0,.2)}
.lensw .lg{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),rgba(255,255,255,0) 32%)}
.lensw.on{animation:lensIn .22s cubic-bezier(.2,1.6,.4,1)}
@keyframes lensIn{from{opacity:0;scale:.4}}

/* ---------- collection ---------- */
#coll{gap:10px}
.coll-top{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
#collCat{width:clamp(110px,22vmin,190px)}
.starcount{background:#fff;border-radius:999px;padding:6px 18px;font-weight:800;font-size:clamp(20px,3.4vmin,28px);color:#9a6200;box-shadow:0 5px 0 rgba(20,60,90,.12);display:flex;align-items:center;gap:6px}
.starcount svg{width:1.2em;height:1.2em;color:var(--gold)}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;width:min(740px,100%)}
.stk{border:none;cursor:pointer;background:#fff;border-radius:26px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;color:var(--ink);
  box-shadow:0 6px 0 rgba(20,60,90,.12);font-size:16px;line-height:1.1;position:relative}
.stk .sart{width:100px;height:100px}
.stk .sart svg{width:100%;height:100%;overflow:visible}
.stk.no .sart{filter:grayscale(1) brightness(1.2) opacity(.28)}
.stk.no .nm{color:#9fb3ad}
.stk .cnt{position:absolute;top:-6px;right:-4px;background:var(--mark);color:#fff;font-size:15px;padding:4px 8px;border-radius:12px;box-shadow:0 2px 0 #c41f5c}
.stk .q{position:absolute;top:34px;left:50%;transform:translateX(-50%);font-size:38px;color:#b8c9cf}
.stk.pop .sart{animation:k-jelly .5s ease-in-out}
.k-reward .emo svg{width:56px;height:56px}
.k-result .k-mascot{width:150px;height:auto;margin:-104px auto 0}
.k-result .k-mascot .cat{width:150px}
.hintline{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:8px;font-weight:800;color:var(--ink2);font-size:clamp(15px,2.6vmin,19px)}
.hintline svg{width:22px;height:22px;color:var(--goldd)}
</style>

<body>
<div class="deco" aria-hidden="true" id="deco"></div>

<header class="k-bar"><div class="k-left"></div><div class="k-mid" id="mid"></div><div class="k-tools"></div></header>

<!-- TITLE -->
<section class="screen k-title on" id="title">
  <div class="k-hero hero" id="hero"></div>
  <div class="k-ttxt">
    <h1 class="k-logo" id="logo"><span class="w">Tìm Điểm</span><br><span class="w alt">Khác Nhau</span></h1>
    <div class="tag">Hai bức tranh có gì khác nhau? Cùng Miu tìm nhé!</div>
    <div class="k-tbtns">
      <button class="btn big ok pulse" id="bPlay"></button>
      <div class="k-row"><button class="btn gold" id="bColl"><span class="emo">📒</span><span>Nhãn dán</span><span class="badge hidden" id="collNew">!</span></button></div>
    </div>

</section>

</section>

<!-- COLLECTION -->

  <div class="coll-top"><div id="collCat"></div><div class="starcount" id="starCount"></div></div>
  <h2 class="k-h">Bộ nhãn dán</h2>
  <div class="stk-grid" id="stkGrid"></div>
</section>

<div class="lensw hidden" id="lensW"><div class="lh"></div><div class="lens"><svg id="lensSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"></svg></div><div class="lg"></div></div>

<script>/* ===== NhiKit 3 — shared engine (audio synth, music, voice, fx, ui, input) ===== */
const Kit = (() => {
  'use strict';
  const GAME = document.documentElement.dataset.game || 'game';

  /* ---------- utils ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const ease = {
    out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    back: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1,
  };
  /* restart a CSS animation class on an element */
  function anim(e, cls, ms = 600) { if (!e) return; e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); clearTimeout(e['_k_' + cls]); e['_k_' + cls] = setTimeout(() => e.classList.remove(cls), ms); }
  const shake = e => anim(e, 'k-a-shake', 480), wiggle = e => anim(e, 'k-a-wiggle', 520), jelly = e => anim(e, 'k-a-jelly', 520);
  const vibrate = ms => { try { if (settings.sound && navigator.vibrate) navigator.vibrate(ms); } catch (e) { } };

  /* Vietnamese number words 0..1000 */
  const DIG = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  function numVi(n) {
    n = Math.round(n);
    if (n < 0) return 'âm ' + numVi(-n);
    if (n < 10) return DIG[n];
    if (n < 20) return 'mười' + (n === 10 ? '' : ' ' + (n % 10 === 5 ? 'lăm' : DIG[n % 10]));
    if (n < 100) { const t = Math.floor(n / 10), u = n % 10; return DIG[t] + ' mươi' + (u === 0 ? '' : ' ' + (u === 1 ? 'mốt' : u === 5 ? 'lăm' : u === 4 ? 'tư' : DIG[u])); }
    if (n < 1000) { const h = Math.floor(n / 100), r = n % 100; return DIG[h] + ' trăm' + (r === 0 ? '' : r < 10 ? ' lẻ ' + DIG[r] : ' ' + numVi(r)); }
    return String(n);
  }

  /* ---------- storage ---------- */
  const mkStore = ns => ({
    get(k, d) { try { const v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { try { localStorage.removeItem(ns + k); } catch (e) { } },
  });
  const store = mkStore('bv3.' + GAME + '.');
  const shared = mkStore('bv3.');
  const settings = Object.assign({ sound: true, music: true }, shared.get('settings', {}));
  const saveSettings = () => shared.set('settings', settings);

  /* ---------- generation guard (cancels stale timers on screen change) ---------- */
  let gen = 0;
  const timers = new Set();
  function after(ms, fn) { const g = gen; const id = setTimeout(() => { timers.delete(id); if (g === gen) fn(); }, ms); timers.add(id); return id; }
  function sleep(ms) { const g = gen; return new Promise(r => { const id = setTimeout(() => { timers.delete(id); if (g === gen) r(); }, ms); timers.add(id); }); }
  function cancelAll() { gen++; timers.forEach(clearTimeout); timers.clear(); }

  /* ---------- audio ---------- */
  const MUSIC_VOL = 0.26;
  let ctx = null, master, sfxBus, musicBus, noiseBuf = null, unlocked = false;
  function audio() {
    if (!ctx) return null;
    if (ctx.state === 'suspended' && !document.hidden && unlocked) ctx.resume().catch(() => { });
    return ctx;
  }
  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
    master = ctx.createGain(); master.gain.value = 0.9;
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1;
    musicBus = ctx.createGain(); musicBus.gain.value = settings.music ? MUSIC_VOL : 0;
    sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
  }
  function unlock() {
    if (unlocked) { if (ctx && ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => { }); return; }
    unlocked = true;
    build();
    if (!ctx) return;
    try { const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) { }
    if (ctx.state === 'suspended') ctx.resume().catch(() => { });
    if (music._want) music.start(music._want);
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { speech.stop(); if (ctx) ctx.suspend().catch(() => { }); }
    else if (ctx && unlocked) ctx.resume().catch(() => { });
  });

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(o) {
    const c = audio(); if (!c) return null;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return null;
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.slide || o.dur || 0.2));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.22 : o.vol, a = o.a || 0.005, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    let node = osc;
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || 6; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + a + (o.hold || 0) + d + 0.05); }
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + d + 0.05);
    return osc;
  }
  function noise(o) {
    const c = audio(); if (!c) return;
    const bus = o.bus || sfxBus;
    if (bus === sfxBus && !settings.sound) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = c.currentTime + (o.t || 0) + 0.005;
    const src = c.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    const v = o.vol == null ? 0.18 : o.vol, a = o.a || 0.004, d = o.dur || 0.15;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + a + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a);
    if (o.hold) g.gain.setValueAtTime(v, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + (o.hold || 0) + d);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + a + (o.hold || 0) + d + 0.05);
  }
  function bell(f, t = 0, vol = 0.18, dur = 0.6, bus) {
    tone({ f, t, vol, dur, bus }); tone({ f: f * 2, t, vol: vol * 0.2, dur: dur * 0.5, bus }); tone({ f: f * 3.01, t, vol: vol * 0.06, dur: dur * 0.3, bus });
  }
  function marimba(f, t = 0, vol = 0.18, dur = 0.4, bus) { tone({ f, t, vol, dur, bus }); tone({ f: f * 4, t, vol: vol * 0.14, dur: dur * 0.16, bus }); }
  function pluck(f, t = 0, vol = 0.11, dur = 0.3, bus) { tone({ f, t, vol, dur, type: 'triangle', lp: 2200, bus }); }
  function flute(f, t = 0, vol = 0.09, dur = 0.4, bus) { tone({ f, t, vol, dur, a: 0.03, type: 'sine', vib: 5.5, vibAmt: 4, bus }); tone({ f: f * 2, t, vol: vol * 0.12, dur, a: 0.03, bus }); }

  const sfx = {
    tap() { tone({ f: 660, to: 920, dur: 0.06, vol: 0.1, type: 'triangle' }); },

/* element: name, x, y, visual radius, palette keys (1 key = no recolour), art(c), options {h:0 no hide, z:0 no resize, f:1 flip ok, b: bottom anchor for resize} */

const dots = (x0, y0, w, h, st, r, col) => { let s = `<g fill="${col}">`; for (let y = y0, j = 0; y < y0 + h; y += st, j++) for (let x = x0 + (j % 2 ? st / 2 : 0); x < x0 + w; x += st) s += `<circle cx="${x}" cy="${y}" r="${r}"/>`; return s + '</g>'; };
const TX = (t, x, y, fs, c) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}" font-weight="800" font-family="'Baloo 2',Arial,sans-serif" fill="${c}">${t}</text>`;

/* ================= RENDER ================= */
const baseState = S => ({ els: S.els.map(e => ({ c: PAL[e.p[0]], vis: true, sc: 1, fl: false })), ext: [] });
function elMarkup(e, s) {
  const tr = s.sc === 1 ? `translate(${e.x} ${e.y})${s.fl ? ' scale(-1 1)' : ''}` : `translate(${e.x} ${e.y + e.b}) scale(${(s.fl ? -1 : 1) * s.sc} ${s.sc}) translate(0 ${-e.b})`;
  return `<g transform="${tr}">${e.s(s.c)}</g>`;
}
function sceneMarkup(S, st) {
  let h = S.bg;
  S.els.forEach((e, i) => { const s = st.els[i]; if (s.vis) h += elMarkup(e, s); });
  st.ext.forEach(x => { h += `<g transform="translate(${x.x} ${x.y})">${EX[x.key].s(x.c)}</g>`; });
  return h;
}
const thumb = S => S._th || (S._th = `<svg viewBox="0 0 400 300" aria-hidden="true">${sceneMarkup(S, baseState(S))}</svg>`);
function stickerSVG(S) {
  const e = S.els[S.stk], sc = (30 / Math.max(e.r, 20)).toFixed(3), [ox, oy] = S.so || [0, 0];
  return `<svg viewBox="-50 -50 100 100" aria-hidden="true"><circle r="47" fill="#fff"/><circle r="41" fill="${S.tl}"/><g transform="translate(${ox} ${oy}) scale(${sc})">${e.s(PAL[e.p[0]])}</g><circle r="44" fill="none" stroke="${S.t}" stroke-width="3.5" stroke-dasharray="7 6"/></svg>`;
}

/* ================= PUZZLE GENERATOR ================= */
const opsOf = e => [e.p.length > 1 && 'color', e.h && 'hide', e.z && 'size', e.f && 'flip'].filter(Boolean);
const hitR = r => clamp(r * 1.05 + 4, 34, 62);
function makePuzzle(S, k) {
  for (let att = 0; att < 120; att++) {
    const base = { els: S.els.map(e => ({ c: PAL[Math.random() < 0.45 ? e.p[0] : pick(e.p.split(''))], vis: true, sc: 1, fl: e.f && e.bf !== 0 ? Math.random() < 0.5 : false })), ext: [] };
    const mod = { els: base.els.map(s => Object.assign({}, s)), ext: [] };
    const targets = shuffle([...S.els.map((e, i) => ({ i })), ...S.ex.map((x, j) => ({ j }))]);
    const used = { color: 0, hide: 0, size: 0, flip: 0, extra: 0 }, capN = Math.ceil(k / 2);
    const relax = att < 50 ? 0.95 : att < 80 ? 0.85 : att < 100 ? 0.72 : 0.6, diffs = [];
    for (const t of targets) {
      if (diffs.length >= k) break;
      let d;
      if (t.j != null) {
        if (used.extra >= (k >= 5 ? 2 : 1)) continue;
        const sl = S.ex[t.j], list = ((S.xo && S.xo[sl[2]]) || XO[sl[2]]).filter(x => !S.els.some(e => e.n === EX[x].n)), key = pick(list);
        if (!key) continue;
        d = { op: 'extra', key, x: sl[0], y: sl[1], hr: 34, n: EX[key].n };
      } else {
        const e = S.els[t.i];
        let ops = opsOf(e).filter(o => used[o] < capN);
        if (!ops.length) continue;
        const mn = Math.min(...ops.map(o => used[o]));
        ops = ops.filter(o => used[o] === mn || Math.random() < 0.35);
        const op = pick(ops);
        d = { op, i: t.i, x: e.x, y: e.y, hr: hitR(e.r), n: e.n };
        if (op === 'size') {
          const R1 = e.r * 1.5, cy = e.y + e.b * (1 - 1.5), room = e.x - R1 > -8 && e.x + R1 < 408 && cy - R1 > -8 && cy + R1 < 308;
          d.big = room && (e.r < 30 ? true : e.r > 40 ? false : Math.random() < 0.5);
          d.sc = d.big ? 1.5 : 0.6;
          if (d.big) { d.y = e.y + e.b * (1 - d.sc); d.hr = hitR(e.r * d.sc); }
        }
      }
      if (diffs.some(o => Math.hypot(o.x - d.x, o.y - d.y) < (o.hr + d.hr) * relax)) continue;
      diffs.push(d); used[d.op]++;
    }
    if (diffs.length < k) continue;
    if (att < 100 && new Set(diffs.map(d => d.op)).size < 2) continue;
    diffs.forEach(d => {
      if (d.op === 'extra') { mod.ext.push({ key: d.key, x: d.x, y: d.y, c: PAL[pick(EX[d.key].p.split(''))] }); return; }
      const s = mod.els[d.i], e = S.els[d.i];
      if (d.op === 'color') s.c = farColor(base.els[d.i].c, e.p);
      else if (d.op === 'hide') s.vis = false;
      else if (d.op === 'size') s.sc = d.sc;
      else s.fl = !s.fl;
    });
    const swap = Math.random() < 0.5;
    return { A: swap ? mod : base, B: swap ? base : mod, modSide: swap ? 'A' : 'B', diffs };
  }
  return null;
}
function descOf(d, side) {
  const here = side === R.modSide, N = cap(d.n);
  switch (d.op) {
    case 'color': return `${N} khác màu!`;
    case 'hide': return here ? `Bên này không có ${d.n}!` : `Bên kia không có ${d.n}!`;
    case 'extra': return here ? `Bên này có thêm ${d.n}!` : `Bên kia có thêm ${d.n}!`;
    case 'size': return `${N} bên này ${(here === d.big) ? 'to hơn' : 'nhỏ hơn'}!`;
    default: return `${N} quay ngược hướng!`;
  }
}

/* ---------- layout ---------- */
const AR = 4 / 3;
function layout() {
  if (Kit.current !== 'play' || !R) return;
  const ins = insets(), top = Kit.barH() + 8, sl = ins.l + 12, sr = ins.r + 12, sb = ins.b + 12;
  const W = innerWidth - sl - sr, H = innerHeight - top - sb;
  const g = clamp(Math.min(W, H) * 0.03, 12, 24), dS = clamp(Math.min(W, H) * 0.24, 74, 150);
  const opts = [
    { m: 'rowB', pw: Math.min((W - g) / 2, (H - g - dS * 0.8) * AR) },
    { m: 'rowM', pw: Math.min((W - 2 * g - Math.max(dS * 0.9, 84)) / 2, H * AR) },
    { m: 'colB', pw: Math.min(W, ((H - 2 * g - dS * 0.8) / 2) * AR) },
    { m: 'colS', pw: Math.min(W - g - Math.max(dS * 0.9, 84), ((H - g) / 2) * AR) },
  ].sort((a, b) => b.pw - a.pw);
  const m = opts[0].m, pw = Math.floor(opts[0].pw), ph = Math.floor(pw / AR);
  const A = $('#picA'), B = $('#picB'), D = $('#dock'), hb = $('#bHint'), cat = $('#playCat'), tp = $('#tip');
  const put = (e, x, y, w, h) => Object.assign(e.style, { left: Math.round(x) + 'px', top: Math.round(y) + 'px', width: Math.round(w) + 'px', height: Math.round(h) + 'px' });
  let hbS, catW;
  if (m === 'rowB' || m === 'colB') {
    const rows = m === 'rowB' ? 1 : 2, blockW = m === 'rowB' ? 2 * pw + g : pw;
    const dockH = Math.min(H - rows * ph - rows * g, 180), blockH = rows * ph + rows * g + dockH;
    const x0 = sl + (W - blockW) / 2, y0 = top + (H - blockH) / 2;
    put(A, x0, y0, pw, ph);
    if (m === 'rowB') put(B, x0 + pw + g, y0, pw, ph); else put(B, x0, y0 + ph + g, pw, ph);
    put(D, x0, y0 + rows * (ph + g), blockW, dockH); D.classList.remove('v');
    catW = Math.min(dockH * 0.9, 160); hbS = clamp(dockH * 0.62, 58, 76);
    const tw = Math.min(blockW - catW - hbS - 34, 380);
    R.tipOK = tw >= 110; tp.style.display = R.tipOK ? '' : 'none'; tp.style.width = Math.round(tw) + 'px'; tp.style.fontSize = Math.round(clamp(dockH * 0.15, 15, 21)) + 'px'; tp.style.height = Math.round(dockH) + 'px'; tp.style.maxHeight = '';
  } else {
    const dw = Math.min(m === 'rowM' ? W - 2 * pw - 2 * g : W - pw - g, 180);
    if (m === 'rowM') {
      const blockW = 2 * pw + 2 * g + dw, x0 = sl + (W - blockW) / 2, y0 = top + (H - ph) / 2;
      put(A, x0, y0, pw, ph); put(D, x0 + pw + g, y0, dw, ph); put(B, x0 + pw + g + dw + g, y0, pw, ph);
    } else {
      const blockW = pw + g + dw, x0 = sl + (W - blockW) / 2, y0 = top + (H - 2 * ph - g) / 2;
      put(A, x0, y0, pw, ph); put(B, x0, y0 + ph + g, pw, ph); put(D, x0 + pw + g, y0, dw, 2 * ph + g);
    }
    D.classList.add('v');
    const colH = m === 'rowM' ? ph : 2 * ph + g;
    hbS = clamp(dw * 0.7, 58, 76); catW = Math.min(dw * 1.02, 160, (colH - hbS - 12) / 1.12);
    const th = colH - catW * 1.12 - hbS - 20;
    R.tipOK = th >= 60 && dw >= 76; tp.style.display = R.tipOK ? '' : 'none'; tp.style.width = Math.round(dw - 2) + 'px'; tp.style.fontSize = (dw < 120 ? 14 : 16) + 'px'; tp.style.maxHeight = ''; tp.style.height = Math.round(Math.min(th, 150)) + 'px';
  }
  cat.style.width = Math.round(catW) + 'px';
  hb.style.width = hb.style.height = Math.round(hbS) + 'px';
  R.layout = m;
}

/* ---------- coordinates ---------- */
function toScreen(side, x, y) { const svg = $('#pic' + side + ' svg'); const m = svg && svg.getScreenCTM(); if (!m) return null; const p = new DOMPoint(x, y).matrixTransform(m); return { x: p.x, y: p.y }; }
function toScene(side, x, y) { const svg = $('#pic' + side + ' svg'); const m = svg && svg.getScreenCTM(); if (!m) return null; const p = new DOMPoint(x, y).matrixTransform(m.inverse()); return { x: p.x, y: p.y }; }
const pxScale = () => { const r = $('#picA').getBoundingClientRect(); return r.width / 400; };

/* ---------- input: tap / hold-to-magnify ---------- */
const P = { id: null, side: null, sx: 0, sy: 0, lx: 0, ly: 0, lens: false, timer: 0 };
const plog = (...a) => { if (window.__dbg) { (window.__plog = window.__plog || []).push(a.join(' ')); if (window.__plog.length > 14) window.__plog.shift(); } };
function bindPic(pic) {
  const side = pic.dataset.side;
  pic.addEventListener('pointerdown', e => {
    plog('down', side, e.pointerId, 'P.id=' + P.id, Math.round(e.timeStamp), R && R.busy, R && R.done);
    if (P.id !== null) return;                         // ignore extra fingers
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!R || R.done) return;
    e.preventDefault();
    stopDemo();
    Object.assign(P, { id: e.pointerId, side, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, lens: false, t0: e.timeStamp, far: false });
    try { pic.setPointerCapture(e.pointerId); } catch (er) { }
    clearTimeout(P.timer);
    const id = e.pointerId;
    P.timer = setTimeout(() => { if (P.id === id && !P.lens) startLens(side, P.lx, P.ly); }, 350);
  });
  pic.addEventListener('pointermove', e => {
    if (e.pointerId !== P.id) return;
    P.lx = e.clientX; P.ly = e.clientY;
    if (Math.hypot(e.clientX - P.sx, e.clientY - P.sy) > 14) P.far = true;
    if (P.lens) moveLens(e.clientX, e.clientY);
    else if (Math.hypot(e.clientX - P.sx, e.clientY - P.sy) > 18) { clearTimeout(P.timer); startLens(side, e.clientX, e.clientY); }
  });
  const end = (e, cancel) => {
    plog(e.type, side, e.pointerId, 'P.id=' + P.id, Math.round(e.timeStamp), 'lens=' + P.lens, 'far=' + P.far);
    if (e.pointerId !== P.id) return;
    P.id = null; clearTimeout(P.timer);
    try { pic.releasePointerCapture(e.pointerId); } catch (er) { }
    if (P.lens) {   // a short, still press that only peeked with the lens still resolves as a gentle tap (never as a wrong one)
      hideLens();
      if (!cancel && !P.far && e.timeStamp - P.t0 < 1500) tapAt(side, e.clientX, e.clientY, true);
      return;
    }
    if (!cancel) tapAt(side, e.clientX, e.clientY);
  };
  pic.addEventListener('pointerup', e => end(e, false));
  pic.addEventListener('pointercancel', e => end(e, true));
  pic.addEventListener('lostpointercapture', e => { if (e.pointerId === P.id) end(e, true); });
}
bindPic($('#picA')); bindPic($('#picB'));

/* ---------- magnifier lens ---------- */
const lensW = $('#lensW'), lensSvg = $('#lensSvg');
let lensOn = false, lensSide = 'A', lensD = 160;
function startLens(side, x, y) {
  if (!R) return;
  P.lens = true; lensOn = true; lensSide = side;
  lensSvg.innerHTML = $('#pic' + side + ' svg').innerHTML;
  lensD = Math.round(clamp(Math.min(innerWidth, innerHeight) * 0.42, 140, 230));
  lensW.style.width = lensW.style.height = lensD + 'px';

}
function moveLens(x, y) {
  if (!lensOn) return;
  const r = $('#pic' + lensSide + ' svg').getBoundingClientRect(), s = r.width / 400, w = lensD / (s * 2.2);
  const cx = clamp((x - r.left) / s, w / 2, 400 - w / 2), cy = clamp((y - r.top) / s, w / 2, 300 - w / 2);
  lensSvg.setAttribute('viewBox', `${(cx - w / 2).toFixed(1)} ${(cy - w / 2).toFixed(1)} ${w.toFixed(1)} ${w.toFixed(1)}`);
  let lx = x - lensD / 2, ly = y - lensD - 50;
  if (ly < 6) { ly = y - lensD / 2; lx = x + 60; if (lx + lensD > innerWidth - 6) lx = x - 60 - lensD; }
  lx = clamp(lx, 6, innerWidth - lensD - 6); ly = clamp(ly, 6, innerHeight - lensD - 6);

}

function stopDemo() { if (demo) { demo.stop(); demo = null; } if (lensOn && P.id === null) hideLens(); }

  save.tut.lens = 1; persist();
  const r = $('#picA').getBoundingClientRect(), pt = { x: r.left + r.width * 0.42, y: r.top + r.height * 0.55 };

  [1100, 1500, 1900].forEach((t, i) => Kit.after(t, () => { if (alive(my) && P.id === null && lensOn) moveLens(pt.x + (i + 1) * 18, pt.y - (i + 1) * 4); }));
  Kit.after(2500, () => { if (P.id === null) hideLens(); });
}

/* ---------- tap logic ---------- */
let markN = 0;
function tapAt(side, x, y, soft) {
  if (!R || R.done || R.busy) return;
  const p = toScene(side, x, y); if (!p) return;
  plog('tap', side, Math.round(p.x), Math.round(p.y), soft ? 'soft' : '');
  const near = list => { let best = null, bd = 1e9; list.forEach(d => { const dd = Math.hypot(d.x - p.x, d.y - p.y); if (dd <= d.hr + 4 && dd / d.hr < bd) { bd = dd / d.hr; best = d; } }); return best; };
  const d = near(R.diffs.filter(q => !q.found));
  if (d) return found(d, side, x, y);
  const f = near(R.diffs.filter(q => q.found));
  if (f) { $$(`[data-d="${R.diffs.indexOf(f)}"] .pp`).forEach(e => Kit.anim(e, 'bump', 520)); sfx.tap(); return; }
  if (!soft) wrong(side, p);
}
function addMark(side, d) {
  $('#pic' + side + ' .mk').insertAdjacentHTML('beforeend', `<g transform="translate(${d.x.toFixed(1)} ${d.y.toFixed(1)})" data-d="${R.diffs.indexOf(d)}"><g class="pp"><circle class="fw" r="${d.hr}" pathLength="100" transform="rotate(-90)"/><circle class="fc" r="${d.hr}" pathLength="100" transform="rotate(-90)"/></g></g>`);
}
function hintMark(side, x, y, r, cls, ms) {
  const id = 'hm' + (++markN);
  $('#pic' + side + ' .mk').insertAdjacentHTML('afterbegin', `<g id="${id}" class="hm" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle class="${cls}" r="${r.toFixed(1)}"/></g>`);
  Kit.after(ms, () => { const e = document.getElementById(id); if (e) e.remove(); });
}
const PRAISE = ['Giỏi quá!', 'Đúng rồi!', 'Tìm ra rồi!', 'Mắt tinh quá!', 'Hay lắm!', 'Tuyệt vời!', 'Siêu quá!'];
function found(d, side, x, y) {
  d.found = true; R.wrongRun = 0;
  if (R.hintD === d) R.hintD = null;
  $$('.mk .hm').forEach(e => e.remove());
  $('#bHint').classList.remove('glow');
  ['A', 'B'].forEach(s => addMark(s, d));
  ['A', 'B'].forEach(s => { const c = toScreen(s, d.x, d.y); if (c) { Kit.sparkle(c.x, c.y, { n: 8, r: 26 }); Kit.burst(c.x, c.y, { n: 10, speed: 6, size: 9, shape: 'circle', colors: ['#ff3d7f', '#ffd23f', '#ffffff'] }); /* no Kit.ring: kit fx loop can give it a negative radius */ } });
  const n = R.diffs.filter(q => q.found).length;
  sfx.good(); Kit.sfx.note(72 + [0, 4, 7, 12, 16][Math.min(4, n - 1)], 0.2, 0.12); Kit.vibrate(25);
  const dot = $$('#pdots i')[R.diffs.indexOf(d)]; if (dot) { dot.className = 'ok'; Kit.jelly(dot); }
  playCat.cheer();
  const pr = pick(PRAISE), ds = descOf(d, side);
  Kit.floatText(x, y - 24, pr);
  tip(ds, 2400);
  say(pr + ' ' + ds);
  if (!save.tut.tap) { save.tut.tap = 1; persist(); stopDemo(); }
  if (n >= R.k) finish();
  else { resetIdle(); if (n === 1 && !save.tut.lens) { const my = R.tok; Kit.after(2600, () => { if (alive(my)) lensTip(); }); } }
}
const WRONG = ['Chỗ này giống nhau mà!', 'Nhìn kỹ lại nhé!', 'Hai bên giống nhau chỗ này.'];
function wrong(side, p) {
  R.wrong++; R.wrongRun++;
  const id = 'rp' + (++markN);
  $('#pic' + side + ' .mk').insertAdjacentHTML('beforeend', `<g id="${id}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"><circle class="rip" r="22"/><circle class="rip2" r="15"/></g>`);
  setTimeout(() => { const e = document.getElementById(id); if (e) e.remove(); }, 1250);
  sfx.soft(); playCat.no();
  if (R.wrongRun === 1 || R.wrongRun % 4 === 0) { const t = pick(WRONG); tip(t, 1700); say(t); }
  if (R.wrongRun % 6 === 0) $('#bHint').classList.add('glow');

/* ---------- hints ---------- */
function resetIdle() {
  if (!R) return;
  clearTimeout(R.idleT);
  const my = R.tok;
  R.idleT = Kit.after(20000, () => { if (alive(my) && !R.done) autoHint(); });
}
function autoHint() {   // gentle: a broad glowing area that contains one difference (free, no star cost)

  const d = R.hintD && !R.hintD.found ? R.hintD : pick(left); R.hintD = d;
  const zr = clamp(d.hr * 2.1, 64, 100), a = rand(0, Math.PI * 2), off = zr * 0.4;
  let cx = clamp(d.x + Math.cos(a) * off, zr * 0.55, 400 - zr * 0.55), cy = clamp(d.y + Math.sin(a) * off, zr * 0.55, 300 - zr * 0.55);
  if (Math.hypot(cx - d.x, cy - d.y) > zr - d.hr * 0.6) { cx = d.x; cy = d.y; }
  ['A', 'B'].forEach(s => hintMark(s, cx, cy, zr, 'zone', 5200));
  R.auto++;
  $('#bHint').classList.add('glow');
  playCat.peek(); sfx.sparkle();
  tip('Miu thấy gì đó ở chỗ sáng!', 2800);
  say('Nhìn chỗ sáng sáng này nè!');
  resetIdle();
}
$('#bHint').onclick = () => {
  if (!R || R.done || R.busy) return;
  if (performance.now() - R.lastHint < 2600) { Kit.jelly($('#bHint')); return; }
  const left = R.diffs.filter(q => !q.found); if (!left.length) return;
  const d = R.hintD && !R.hintD.found ? R.hintD : pick(left); R.hintD = d;
  R.hints++; R.lastHint = performance.now();
  $('#bHint').classList.remove('glow'); stopDemo();
  $$('.mk .hm').forEach(e => e.remove());
  ['A', 'B'].forEach(s => hintMark(s, d.x, d.y, d.hr, 'spot', 4300));
  demo = Kit.hand({ at: () => toScreen(R && R.modSide || 'B', d.x, d.y) || { x: -200, y: -200 }, ms: 2700 });
  sfx.sparkle(); playCat.peek();
  tip('Ở đây nè!', 1800);
  say('Ở đây nè! Bé chạm vào chỗ sáng nhé!');
  resetIdle();
};
$('#playCat').addEventListener('pointerdown', () => {
  if (!R) return;
  const left = R.diffs.filter(q => !q.found).length;
  playCat.cheer(900); sfx.giggle();
  const t = R.done ? 'Bé giỏi quá!' : `Còn ${numVi(left)} chỗ khác nữa!`;
  tip(t, 1800); say(t);
});

/* ---------- end of round ---------- */
async function finish() {
  R.done = true; const my = R.tok;
  clearTimeout(R.idleT); stopDemo();
  $('#bHint').classList.remove('glow');
  await Kit.sleep(800); if (!alive(my)) return;
  $$('.pic').forEach(p => p.classList.add('win'));
  sfx.fanfare(); playCat.cheer(2400);
  $$('.pic').forEach(p => { const r = p.getBoundingClientRect(); Kit.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 22, speed: 10 }); });
  Kit.praise('Tìm hết rồi!', { speak: false });
  say('Bé tìm được hết rồi! Giỏi quá!');
  await Kit.sleep(1600); if (!alive(my)) return;
  showResult();
}
function showResult() {
  const S = R.S, k = R.k, h = R.hints, stars = h === 0 ? 3 : h === 1 ? 2 : 1;
  const b = save.best[S.id] || (save.best[S.id] = {});
  b[k] = Math.max(b[k] || 0, stars);
  const first = !save.stk[S.id];
  save.stk[S.id] = (save.stk[S.id] || 0) + 1;
  save.stars += stars;
  persist();
  const nextS = SCENES[(SCENES.indexOf(S) + 1) % SCENES.length];
  const res = Kit.result({
    title: stars === 3 ? 'Giỏi quá!' : stars === 2 ? 'Tuyệt vời!' : 'Bé cố gắng lắm!',
    stars, mascot: ' ',
    text: `Bé tìm được ${k} điểm khác nhau!`,
    extra: h ? `<div class="hintline">${Kit.icon('hint')}<span>Dùng ${h} gợi ý</span></div>` : '',
    reward: first ? { emoji: stickerSVG(S), label: `Nhãn dán mới: ${S.name}!` } : null,
    say: (stars === 3 ? 'Giỏi quá! ' : 'Tuyệt vời! ') + (first ? 'Bé được nhãn dán mới!' : `Bé được ${numVi(stars)} ngôi sao!`),
    buttons: [
      { label: 'Chơi lại', icon: 'replay', cls: 'ok', onClick: () => startRound(S.id) },
      { label: 'Màn tiếp', icon: 'next', cls: '', onClick: () => startRound(nextS.id) },
      { label: '', icon: 'home', cls: 'white round', onClick: () => goPick() },
    ],
  });
  const mh = $('.k-mascot', res.panel); if (mh) { const mc = new Cat(mh); mc.happy(true); setTimeout(() => mc.act('jump', 800), 500); }
  Kit.setBack(() => { res.close(); goPick(); });
}

/* ---------- sticker collection ---------- */
function goColl() {
  tok++; R = null; hideLens(); stopDemo();
  Kit.show('coll', { back: goTitle, music: 'lullaby' });
  if (!collCat) collCat = new Cat($('#collCat'));
  collCat.happy(false);
  $('#starCount').innerHTML = Kit.icon('star') + `<span>${save.stars}</span>`;
  const g = $('#stkGrid'); g.innerHTML = '';
  SCENES.forEach(S => {
    const n = save.stk[S.id] || 0, best = Math.max(0, ...Object.values(save.best[S.id] || {}));
    const b = el('button', 'stk k-press' + (n ? '' : ' no'), `<div class="sart">${stickerSVG(S)}</div>${n ? `<b class="cnt">×${n}</b>` : '<span class="q">?</span>'}<span class="nm">${S.name}</span>${n ? Kit.starsMini(best) : ''}`);
    b.dataset.scene = S.id;
    b.onclick = () => {
      if (!n) { Kit.jelly(b); say(`Chơi bức tranh ${S.name} để nhận nhãn dán nhé!`); const sid = S.id, my = tok; setTimeout(() => { if (tok === my && Kit.current === 'coll') startRound(sid); }, 900); return; }
      Kit.anim(b, 'pop', 520); sfx.sparkle(); say(S.name + '!');
      const r = b.getBoundingClientRect(); Kit.sparkle(r.left + r.width / 2, r.top + r.height * 0.4, { n: 10 });
      collCat.cheer(900);
    };
    g.appendChild(b);
  });
  const got = SCENES.filter(s => save.stk[s.id]).length;
  save.seen = SCENES.filter(s => save.stk[s.id]).map(s => s.id); persist();
  say(got ? `Bé có ${numVi(got)} nhãn dán rồi!` : 'Chơi xong một bức tranh để nhận nhãn dán nhé!');
}

/* ================= TEST HOOKS ================= */
window.__game = {
  get state() {
    if (!R) return null;
    const s = pxScale();
    return { scene: R.S.id, k: R.k, found: R.diffs.filter(d => d.found).length, busy: R.busy, done: R.done, hints: R.hints, auto: R.auto, wrong: R.wrong, lens: lensOn, mod: R.modSide, layout: R.layout,
      diffs: R.diffs.map(d => ({ op: d.op, n: d.n, found: d.found, a: toScreen('A', d.x, d.y), b: toScreen('B', d.x, d.y), r: d.hr * s })) };
  },
  free(side) {
    let best = { m: -1 };
    for (let y = 26; y < 290; y += 12) for (let x = 20; x < 390; x += 12) { const m = Math.min(...R.diffs.map(d => Math.hypot(d.x - x, d.y - y) - d.hr)); if (m > best.m) best = { x, y, m }; }
    return toScreen(side, best.x, best.y);
  },
  get save() { return JSON.parse(JSON.stringify(save)); },
  scenes: SCENES.map(s => s.id),
  gen(id, k, n = 200) { const S = SCENES.find(s => s.id === id); let fail = 0, minD = 1e9, kinds = {}; for (let i = 0; i < n; i++) { const pz = makePuzzle(S, k); if (!pz || pz.diffs.length < k) { fail++; continue; } pz.diffs.forEach((a, ai) => { kinds[a.op] = (kinds[a.op] || 0) + 1; pz.diffs.forEach((b, bi) => { if (bi > ai) minD = Math.min(minD, Math.hypot(a.x - b.x, a.y - b.y) / (a.hr + b.hr)); }); }); } return { fail, minD: +minD.toFixed(2), kinds }; },
  debug(id) {
    const S = SCENES.find(s => s.id === id);
    $('#picA svg .scn').innerHTML = sceneMarkup(S, baseState(S));
    $('#picA svg .mk').innerHTML = S.els.map((e, i) => `<circle cx="${e.x}" cy="${e.y}" r="${hitR(e.r)}" fill="none" stroke="red" stroke-width="1.5"/><text x="${e.x}" y="${e.y}" font-size="12" fill="red" font-weight="800">${i}</text>`).join('') + S.ex.map(x => `<circle cx="${x[0]}" cy="${x[1]}" r="32" fill="none" stroke="blue" stroke-dasharray="4 3" stroke-width="2"/>`).join('');
    const st = baseState(S); st.ext = S.ex.map(x => ({ key: pick((S.xo && S.xo[x[2]]) || XO[x[2]]), x: x[0], y: x[1], c: '#ff5a5f' }));
    S.els.forEach((e, i) => { if (e.f) st.els[i].fl = true; });
    $('#picB svg .scn').innerHTML = sceneMarkup(S, st); $('#picB svg .mk').innerHTML = '';
  },
};

goTitle();
})();
</script>
