<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lật thẻ con vật</title>
<link rel="stylesheet" href="style.css">
<script src="player-sdk.js"></script>
</head>
<body>
<div id="stage">
  <div id="progress"></div>
  <div id="board"></div>
  <img id="gi" class="buddy left" src="assets/gi-cheer.webp" alt="">
  <img id="shi" class="buddy right" src="assets/shi-sparkle.webp" alt="">
  <div id="overlay" class="overlay">
    <img id="overlay-art" class="art hidden" src="assets/highfive.webp" alt="">
    <div id="overlay-title" class="title">Lật thẻ con vật</div>
    <button id="go" class="big-button" aria-label="Chơi"><span class="play-icon"></span></button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
