<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fixture: dialog loop</title>
<script>
  // Test fixture: a dialog loop must not lock the native UI.
  var confirmed = 0;
  for (var i = 0; i < 50; i++) {
    alert('alert ' + i);
    if (confirm('confirm ' + i)) confirmed++;
  }
  var answer = prompt('name?');
  window.__results = { done: true, confirmed: confirmed, prompt: answer };
</script>
</head>
<body>alerts</body>
</html>
