      <stop offset="0%" stop-color="#090c14" />
      <stop offset="50%" stop-color="#131728" />
      <stop offset="100%" stop-color="#090c14" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff00" />
