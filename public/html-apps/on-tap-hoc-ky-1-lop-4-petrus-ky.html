</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="profileDialog"><div class="modal-box"><h2 id="profileTitle">Thêm người học</h2><label class="label" for="profileName">Tên bé hoặc biệt danh</label><input id="profileName" class="field" maxlength="40" autocomplete="off"><p class="tiny muted">Tên chỉ lưu trên trình duyệt của máy này.</p><p id="profileError" class="error" role="alert"></p><div class="bottom"><button class="button" data-action="closeProfile">Hủy</button><span class="spacer"></span><button class="button blue" data-action="saveProfile">Lưu hồ sơ</button></div></div></dialog><script id="embedded-state" type="application/json">e30=</script><script>/* Manually checked against the seven-page photographed review outline.

   I = Tin học (p4–7). The `a` field retains the outline's core answer.
   `quiz` is a short interactive question derived only from that answer. */
const SUBJECTS={H:{name:'Lịch sử & Địa lí',icon:'🧭',color:'#7b5ad8',pages:'1'},S:{name:'Khoa học',icon:'🔬',color:'#1b9b82',pages:'2'},T:{name:'Công nghệ',icon:'🌱',color:'#d37b24',pages:'3'},I:{name:'Tin học',icon:'💻',color:'#2875d0',pages:'4–7'}};
const SOURCE={
 H:[
 ['Trung du & miền núi','Nêu đặc điểm khí hậu của vùng Trung du và miền núi phía Bắc.','Khí hậu nhiệt đới ẩm gió mùa; mùa đông lạnh nhất cả nước; khí hậu chịu ảnh hưởng sâu sắc bởi độ cao địa hình.', ['Vùng nào có mùa đông lạnh nhất cả nước?','Trung du và miền núi phía Bắc','Đồng bằng Nam Bộ','Tây Nguyên','Duyên hải Nam Trung Bộ']],
 ['Bảo vệ thiên nhiên','Nêu một số biện pháp góp phần bảo vệ thiên nhiên và phòng, chống thiên tai ở vùng Trung du và miền núi phía Bắc.','Trồng và bảo vệ rừng; xây công trình thủy lợi; di chuyển người dân khỏi nơi có nguy cơ thiên tai; sử dụng tiết kiệm tài nguyên; giáo dục ý thức bảo vệ thiên nhiên.', ['Biện pháp nào giúp bảo vệ thiên nhiên vùng núi?','Trồng và bảo vệ rừng','Chặt rừng làm nương','Khai thác tài nguyên tùy ý','Ở lại nơi có nguy cơ lũ quét']],
 ['Ruộng bậc thang','Nêu vai trò của ruộng bậc thang đối với đời sống và sản xuất của người dân miền núi phía Bắc.','Ruộng bậc thang giúp có lương thực, hạn chế phá rừng làm nương rẫy và thu hút du lịch.', ['Ruộng bậc thang giúp người dân điều gì?','Có lương thực và hạn chế phá rừng','Làm biển rộng hơn','Tăng bão','Thay thế mọi loại rừng']],
 ['Đền Hùng','Kể tên một số công trình kiến trúc chính trong khu di tích Đền Hùng.','Đền Hạ, Đền Trung, Đền Thượng, lăng Vua Hùng, đền Quốc Tổ Lạc Long Quân, đền Tổ Mẫu Âu Cơ.', ['Công trình nào thuộc khu di tích Đền Hùng?','Đền Hạ','Tháp Rùa','Chợ Bến Thành','Cầu Rồng']],
 ['Đồng bằng Bắc Bộ','Nêu đặc điểm địa hình của vùng Đồng bằng Bắc Bộ.','Phần lớn tương đối bằng phẳng, độ cao trung bình dưới 25 m; có đồi núi thấp, chủ yếu ở phía đông bắc.', ['Địa hình Đồng bằng Bắc Bộ phần lớn như thế nào?','Tương đối bằng phẳng','Toàn núi cao','Toàn sa mạc','Toàn cao nguyên']],
 ['Đồng bằng Bắc Bộ','Nêu một số thuận lợi của vùng Đồng bằng Bắc Bộ.','Vị trí thuận lợi giao lưu, trao đổi hàng hóa; địa hình bằng phẳng thuận lợi giao thông và sản xuất; sông ngòi cung cấp nước và giao thông; vùng biển, đảo thuận lợi phát triển kinh tế biển.', ['Hệ thống sông ngòi vùng Đồng bằng Bắc Bộ đem lại thuận lợi nào?','Cung cấp nước và giao thông đường thủy','Làm mất mọi hoạt động sản xuất','Chỉ dùng để ngắm','Không ảnh hưởng đời sống']],
 ['Đê điều','Nêu vai trò của hệ thống đê ở vùng Đồng bằng Bắc Bộ.','Hệ thống đê giúp ngăn lũ lụt và trồng lúa nhiều vụ trong năm.', ['Hệ thống đê ở Đồng bằng Bắc Bộ giúp gì?','Ngăn lũ lụt','Tạo núi cao','Làm nước biển mặn hơn','Ngăn mọi dòng sông']],
 ['Người Việt cổ','Trình bày một số nét chính về đời sống tinh thần của người Việt cổ.','Thờ cúng tổ tiên và các vị thần; có tục nhuộm răng đen, ăn trầu; trong ngày hội hóa trang, vui chơi, nhảy múa.', ['Tập tục nào có trong đời sống tinh thần người Việt cổ theo đề cương?','Thờ cúng tổ tiên','Xem truyền hình','Đi tàu điện','Dùng mạng xã hội']],
 ['Hà Nội','Vì sao nói Hà Nội là trung tâm chính trị, kinh tế, văn hoá, giáo dục của đất nước?','Hà Nội là nơi đặt trụ sở cơ quan Trung ương; có nhiều nhà máy, trung tâm thương mại, ngân hàng, trường đại học, viện nghiên cứu, bảo tàng, thư viện, di tích lịch sử và giá trị văn hóa.', ['Vì sao Hà Nội là trung tâm chính trị của đất nước?','Có trụ sở các cơ quan Trung ương','Có nhiều sa mạc','Là hòn đảo','Không có trường học']],
 ['Mốc lịch sử','Kể một số sự kiện tiêu biểu trong bảng mốc thời gian của đề cương.','1010: Lý Thái Tổ dời đô ra Đại La, đổi tên Thăng Long. Cuối tháng 12/1972: chiến thắng “Điện Biên Phủ trên không”. 1999: Khuê Văn Các được chọn là biểu tượng Hà Nội. 2010: 82 bia Tiến sĩ ở Văn Miếu được UNESCO ghi danh Di sản tư liệu thế giới.', ['Năm nào vua Lý Thái Tổ dời đô về thành Đại La và đổi tên là Thăng Long?','1010','1972','1999','2010']]
 ],
 S:[
 ['Nước','Nước có những tính chất gì?','Nước không màu, không mùi, không vị, không có hình dạng nhất định; chảy từ cao xuống thấp, lan ra mọi phía, thấm qua một số vật và hòa tan một số chất.', ['Tính chất nào đúng với nước?','Không có hình dạng nhất định','Luôn có hình vuông','Không thể chảy','Không hòa tan chất nào']],
 ['Vòng tuần hoàn nước','Hãy nêu sự hình thành vòng tuần hoàn của nước trong tự nhiên.','Nước ở mặt đất, sông, hồ, biển bay hơi; hơi nước ngưng tụ thành giọt, thành mưa rơi xuống và trở lại mặt đất, sông, hồ, biển; quá trình lặp lại.', ['Sau khi bay hơi, hơi nước gặp lạnh sẽ làm gì?','Ngưng tụ thành giọt nước','Biến thành cát','Mất hẳn khỏi tự nhiên','Thành đá ngay']],
 ['Nguồn nước','Vì sao phải bảo vệ nguồn nước?','Nước bị ô nhiễm có thể gây bệnh cho con người, như đau mắt, ghẻ lở, đau bụng.', ['Vì sao cần bảo vệ nguồn nước?','Để tránh tác hại của nước ô nhiễm','Để nước đổi màu','Để không cần uống nước','Để tạo thêm rác']],
 ['Không khí','Trình bày những tính chất và thành phần của không khí.','Không khí trong suốt, không màu, không mùi, không vị, không có hình dạng nhất định; có thể bị nén hoặc giãn. Thành phần gồm ni-tơ, ô-xi, các-bô-níc; còn có hơi nước, bụi.', ['Khí nào có trong không khí theo đề cương?','Ô-xi','Vàng','Sắt nguyên khối','Đất']],

function rng(seed){let h=2166136261;for(let c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296}}
function shuffle(a,random){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function eligible(){return BANK.filter(q=>(ui.subject==='ALL'||q.subject===ui.subject)&&(ui.topic==='all'||q.topic===ui.topic))}
function buildIds(seed,limit){let pool=eligible(),r=rng(seed),out=[];if(ui.subject==='ALL'&&ui.topic==='all'){let buckets=Object.keys(SUBJECTS).map(s=>shuffle(pool.filter(q=>q.subject===s),r));while(out.length<limit&&buckets.some(a=>a.length))for(let b of buckets)if(b.length&&out.length<limit)out.push(b.shift())}else out=shuffle(pool,r).slice(0,limit);return out.map(q=>q.id)}

function answered(s,q){let a=currentAnswer(s,q);return q.kind==='match'?Array.isArray(a.matches)&&a.matches.length===4&&a.matches.every(x=>Number.isInteger(x)):q.options?Number.isInteger(a.option):Boolean(a.text?.trim())||a.self===true||a.self===false}
function score(s){let correct=0,graded=0,pending=0;for(let id of s.questionIds){let q=question(id),a=currentAnswer(s,q);if(q.kind==='match'){graded++;if(matchCorrect(a))correct++}else if(q.options){graded++;if(a.option===q.correct)correct++}else if(a.self===true||a.self===false){graded++;if(a.self)correct++}else pending++}return{correct,graded,pending,total:s.questionIds.length}}
function progressFor(subject){let ids=new Set(state.sessions.filter(s=>s.profileId===state.activeProfileId&&s.submittedAt).flatMap(s=>s.questionIds.filter(id=>question(id)?.subject===subject)));return ids.size}
function lastMistakes(){let seen=new Map();for(let s of state.sessions.filter(s=>s.profileId===state.activeProfileId&&s.submittedAt).sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt)))for(let id of s.questionIds){let q=question(id),a=currentAnswer(s,q);if(q.kind==='match')seen.set(id,!matchCorrect(a));else if(q.options)seen.set(id,a.option!==q.correct);else if(a.self!==undefined)seen.set(id,!a.self)}return [...seen].filter(([,wrong])=>wrong).map(([id])=>id)}
function profileBar(){return '<label class="label" for="profileSelect">Người học</label><div class="group"><select id="profileSelect" class="field" style="flex:1">'+(state.profiles.length?state.profiles.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===state.activeProfileId?'selected':'')+'>'+esc(p.name)+'</option>').join(''):'<option value="">Chưa có hồ sơ</option>')+'</select><button class="button small" data-action="addProfile" title="Thêm người học">＋</button></div>'}
function rail(){let topics=[...new Set(BANK.filter(q=>ui.subject==='ALL'||q.subject===ui.subject).map(q=>q.topic))];return '<aside class="rail"><section class="panel"><h2>👧 Hồ sơ học tập</h2>'+profileBar()+'<p>Tiến độ lưu trên trình duyệt này. Có thể xuất bản sao để chuyển máy.</p></section><section class="panel"><h2>1. Chọn môn</h2><div class="group">'+[['ALL','🌈 Cả 4 môn'],...Object.entries(SUBJECTS).map(([id,x])=>[id,x.icon+' '+x.name])].map(([id,label])=>'<button class="chip subject" data-subject="'+id+'" aria-pressed="'+(ui.subject===id)+'">'+esc(label)+'</button>').join('')+'</div></section><section class="panel"><h2>2. Cách học</h2><div class="group"><button class="chip" data-mode="learn" aria-pressed="'+(ui.mode==='learn')+'">📖 Học có giải thích</button><button class="chip" data-mode="exam" aria-pressed="'+(ui.mode==='exam')+'">✍️ Làm đề</button></div><p>Học: xem đáp án sau khi trả lời. Làm đề: xem đáp án sau khi nộp.</p></section><section class="panel"><h2>3. Chọn bài</h2><label class="label" for="topic">Chủ đề</label><select id="topic" class="field"><option value="all">Tất cả chủ đề</option>'+topics.map(t=>'<option value="'+esc(t)+'" '+(ui.topic===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select><div class="label" style="margin-top:12px">Số câu</div><div class="group">'+[10,15,20,'all'].map(n=>'<button class="chip" data-count="'+n+'" aria-pressed="'+(String(ui.count)===String(n))+'">'+(n==='all'?'Tất cả':n+' câu')+'</button>').join('')+'</div><p>'+eligible().length+' mục trong phạm vi đang chọn. Một lượt không lặp câu.</p></section><section class="panel"><h2>4. Bắt đầu</h2><label class="label" for="seed">Mã đề (tùy chọn)</label><input id="seed" class="field" value="'+esc(ui.seed)+'" placeholder="Ví dụ: NHA-01" maxlength="30"><p>Dùng cùng mã và cùng lựa chọn để tạo lại thứ tự câu.</p><button class="button blue" data-action="start" style="width:100%">'+(ui.mode==='learn'?'🚀 Bắt đầu học':'📝 Tạo đề luyện')+'</button></section></aside>'}
function shell(content){$('#app').innerHTML='<div class="app"><header class="header"><div class="logo"><span class="mark">📚</span><span>Góc ôn tập lớp 4<span class="header-note" style="display:block;font-weight:500;letter-spacing:0">Học kỳ I · từ đề cương 2026–2027</span></span></div><nav class="top-actions" aria-label="Điều hướng"><button class="pill '+(view==='home'?'active':'')+'" data-view="home">🏠 Trang chủ</button><button class="pill '+(view==='progress'?'active':'')+'" data-view="progress">📈 Tiến bộ</button><button class="pill '+(view==='data'?'active':'')+'" data-view="data">💾 Dữ liệu</button></nav></header><div class="layout '+(view==='home'?'':'focused')+'">'+rail()+'<main class="sheet" id="main">'+content+'</main></div><div class="footer-note">Nội dung tham chiếu: đề cương ôn tập học kỳ I lớp 4 của Trường Trung – Tiểu học Pétrus Ký, năm học 2026–2027. Câu tương tác là bản biên soạn từ ý chính; xem số trang nguồn ở mỗi câu.</div></div>'}
function home(){let profileName=profile()?.name||'bạn nhỏ';let subjectCards=Object.entries(SUBJECTS).map(([s,x])=>{let n=progressFor(s),total=countBySubject(s);return '<button class="subject-card" data-home-subject="'+s+'"><span class="icon">'+x.icon+'</span><b>'+esc(x.name)+'</b><small>'+total+' mục · đã gặp '+n+'/'+total+'</small><div class="meter"><i style="width:'+(n/total*100)+'%;background:'+x.color+'"></i></div></button>'}).join('');let unfinished=state.sessions.filter(s=>s.profileId===state.activeProfileId&&!s.submittedAt).at(-1);return '<div class="hero"><p class="eyebrow">Cùng học mỗi ngày</p><h1>Chào '+esc(profileName)+'! Hôm nay mình khám phá điều gì?</h1><p>Chọn một môn, làm vài câu rồi xem điều mình đã nhớ.</p></div><div class="stats"><div class="stat"><b>52</b><span>Mục từ đề cương</span></div><div class="stat"><b>4</b><span>Môn học</span></div><div class="stat"><b>'+state.sessions.filter(s=>s.profileId===state.activeProfileId&&s.submittedAt).length+'</b><span>Lượt đã hoàn thành</span></div></div>'+(unfinished?'<div class="notice">Bạn có một lượt chưa hoàn thành. <button class="button small" data-resume="'+esc(unfinished.id)+'">Tiếp tục</button></div>':'')+'<h2>Chọn môn để ôn</h2><div class="subject-grid">'+subjectCards+'</div><div class="notice">Các câu Lịch sử & Địa lí, Khoa học, Công nghệ được chuyển thành câu tương tác để bé luyện nhanh. Trong chế độ học, app vẫn hiện câu gốc và lời giải theo đề cương.</div>'}
function optionOrder(s,q){return shuffle(q.options.map((_,i)=>i),rng(s.seed+'|'+q.id))}
const labSteps=[
 {task:'Tạo cây thư mục Học tập với Môn học, Bài giảng và Bài tập.',action:'Tạo thư mục'},
 {task:'Đưa một bản sao Bai1.pptx từ Bài giảng sang Bài tập.',action:'Sao chép'},
 {task:'Đổi Bai_tap_toan.docx thành Toán 4A.docx.',action:'Đổi tên'},
 {task:'Đưa thư mục Tiếng Việt vào Bài tập.',action:'Di chuyển'},
 {task:'Xóa Bai1.pptx trong Bài giảng.',action:'Xóa'}
];
function labPanel(q,s,a){if(q.id!=='I18'||s.mode!=='learn')return '';let step=Math.min(5,a.labStep||0);return '<div class="panel" style="margin-top:16px;background:#f5fbff"><h3>🗂️ Mô phỏng thao tác tệp</h3><p>Chọn thao tác đúng ở mỗi bước. Đây là mô phỏng để ghi nhớ lệnh; bài thực hành thật vẫn làm trên máy tính.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"><div class="panel" style="box-shadow:none"><b>Sơ đồ thư mục tham khảo</b><p>📁 Học tập<br>　📁 Môn học<br>　　📁 Toán<br>'+(step<4?'　　📁 Tiếng Việt<br>':'')+'　📁 Bài giảng<br>'+(step<5?'　　📄 Bai1.pptx<br>':'')+'　📁 Bài tập<br>　　📄 '+(step>=3?'Toán 4A.docx':'Bai_tap_toan.docx')+(step>=2?'<br>　　📄 Bai1.pptx':'')+(step>=4?'<br>　　📁 Tiếng Việt':'')+'</p></div><div class="panel" style="box-shadow:none"><b>Bước '+(step===5?'5/5 · Hoàn thành':(step+1)+'/5')+'</b><p>'+(step===5?'Con đã ôn đủ năm thao tác trong đề cương.':esc(labSteps[step].task))+'</p>'+(step<5?'<div class="group">'+['Tạo thư mục','Sao chép','Đổi tên','Di chuyển','Xóa'].map(x=>'<button class="button small" data-lab="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>':'<span class="tag">✅ Đã hoàn thành mô phỏng</span>')+'</div></div></div>'}
function printQuestions(s,answers=false){return '<div class="print-only screen-print"><h1>'+(answers?'Đáp án đối chiếu':'Phiếu ôn tập học kỳ I · Lớp 4')+'</h1><p>Họ và tên: .................................................. Lớp: ............ Ngày: ............</p><p>Mã đề: '+esc(s.code)+' · '+esc(subjectName(s.subject))+' · '+s.questionIds.length+' câu</p>'+s.questionIds.map((id,i)=>{let q=question(id);return '<div class="print-question"><h3>Câu '+(i+1)+'. '+esc(q.quizPrompt)+'</h3>'+(answers?'<p><b>Đáp án:</b> '+esc(q.kind==='match'||!q.options?q.answer:q.options[q.correct])+'</p>':q.kind==='match'?matchLabels.map((x,j)=>'<p>'+esc(x)+' → ..................................................</p>').join(''):q.options?'<div class="print-options">'+optionOrder(s,q).map((k,j)=>'<span>'+String.fromCharCode(65+j)+'. '+esc(q.options[k])+'</span>').join('')+'</div>':'<div class="print-lines"></div><div class="print-lines"></div>')+'</div>'}).join('')+'</div>'}
function sessionPage(){let s=session();if(!s)return home();let i=Math.min(s.index,s.questionIds.length-1),q=question(s.questionIds[i]),a=currentAnswer(s,q),isLearn=s.mode==='learn',reveal=isLearn&&a.revealed;
 let opts=q.kind==='match'?'<div class="stack" style="display:grid;gap:9px">'+matchLabels.map((x,j)=>'<label class="field" style="display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center"><b>'+esc(x)+'</b><select data-match="'+j+'" class="field" '+(reveal?'disabled':'')+'><option value="">Chọn chức năng...</option>'+matchAnswers.map((y,k)=>'<option value="'+k+'" '+(a.matches?.[j]===k?'selected':'')+'>'+esc(y)+'</option>').join('')+'</select></label>').join('')+'</div>'+(isLearn&&!reveal?'<p><button class="button gold" data-action="checkMatch">Kiểm tra cách nối</button></p>':''):q.options?'<div class="answers" role="group" aria-label="Các đáp án">'+optionOrder(s,q).map((k,j)=>'<button class="answer '+(a.option===k?'selected ':'')+(reveal?(k===q.correct?'correct':a.option===k?'wrong':''):'')+'" data-option="'+k+'" '+(reveal?'disabled':'')+'><b>'+String.fromCharCode(65+j)+'</b><span>'+esc(q.options[k])+'</span></button>').join('')+'</div>':'<label class="label" for="freeAnswer">Câu trả lời của con</label><textarea id="freeAnswer" class="free-answer" placeholder="Con viết ý chính ở đây. Có thể để trống nếu muốn tập trả lời miệng.">'+esc(a.text||'')+'</textarea>';
 let feedback=reveal?'<div class="feedback '+((q.kind==='match'&&!matchCorrect(a))||(q.kind!=='match'&&q.options&&a.option!==q.correct)?'bad':'')+'"><h3>'+(!q.options?'Đối chiếu ý chính':q.kind==='match'?(matchCorrect(a)?'Nối đúng rồi!':'Cùng xem lại nhé'):a.option===q.correct?'Chính xác!':'Cùng xem lại nhé')+'</h3><p>'+esc(q.answer)+'</p>'+(q.kind==='practice'?' <p>Đây là hướng dẫn đối chiếu. Bài thao tác trên máy cần người lớn hoặc giáo viên xem sản phẩm.</p>':'')+(!q.options?'<div class="group" style="margin-top:12px"><button class="button small green" data-self="true">✅ Con đã nắm được</button><button class="button small" data-self="false">🔁 Con cần ôn lại</button></div>':'')+'</div>':'';
 let nav=s.questionIds.map((id,n)=>'<button class="navdot '+(n===i?'current ':answered(s,question(id))?'done':'')+'" data-jump="'+n+'" aria-label="Đến câu '+(n+1)+'">'+(n+1)+'</button>').join('');
 return '<div class="screen-actions"><div class="worksheet-head"><div><p class="eyebrow">'+(isLearn?'Học có giải thích':'Đề luyện tập')+' · '+esc(subjectName(s.subject))+'</p><h1>Câu '+(i+1)+' / '+s.questionIds.length+'</h1><p>Mã đề '+esc(s.code)+' · Bắt đầu '+formatTime(s.startedAt)+'</p></div><span class="count-tag">'+(isLearn?'📖 Học':'✍️ Làm đề')+'</span></div><div class="progress" role="progressbar" aria-valuenow="'+(i+1)+'" aria-valuemin="1" aria-valuemax="'+s.questionIds.length+'"><i style="width:'+((i+1)/s.questionIds.length*100)+'%"></i></div><div class="question-nav">'+nav+'</div><div class="question-meta"><span class="tag">'+SUBJECTS[q.subject].icon+' '+esc(SUBJECTS[q.subject].name)+'</span><span class="tag">'+esc(q.topic)+'</span><span class="tag page">PDF trang '+q.page+' · câu '+q.number+'</span></div><h2 class="prompt">'+esc(q.quizPrompt)+'</h2>'+(isLearn&&q.quizPrompt!==q.sourcePrompt?'<p class="source-line">Câu trong đề cương: '+esc(q.sourcePrompt)+'</p>':'')+opts+labPanel(q,s,a)+(isLearn&&!q.options&&!reveal?'<p><button class="button gold" data-action="reveal">👀 Xem ý chính</button></p>':'')+feedback+'<div class="bottom"><button class="button" data-action="prev" '+(i===0?'disabled':'')+'>← Câu trước</button><span class="spacer"></span><button class="button" data-action="printQuestions">🖨️ In đề</button>'+(i===s.questionIds.length-1?'<button class="button green" data-action="finish">'+(isLearn?'Hoàn thành':'Nộp bài')+'</button>':'<button class="button blue" data-action="next">Câu tiếp →</button>')+'</div><p class="tiny muted">'+(isLearn?'Chọn đáp án để xem lời giải ngay.':'Đáp án chỉ hiện sau khi nộp bài. Câu tự luận và thực hành cần tự đối chiếu.')+'</p></div>'+printQuestions(s)}
function resultsPage(){let s=session();if(!s||!s.submittedAt)return home();let r=score(s),percent=r.graded?Math.round(r.correct/r.graded*100):0,ungraded=s.questionIds.filter(id=>!question(id).options&&currentAnswer(s,question(id)).self===undefined).length;return '<div class="hero"><p class="eyebrow">Đã hoàn thành</p><h1>Con đã đi hết '+s.questionIds.length+' câu!</h1><p>Hãy xem lời giải và lưu lại những câu muốn ôn thêm.</p></div><div class="result-score"><div class="score-circle"><div><b>'+r.correct+'/'+r.graded+'</b><small>câu đã đánh giá</small></div></div><div><h2 style="margin:0">'+percent+'% trong các câu đã đánh giá</h2><p>'+ungraded+' câu tự luận/thực hành chưa tự đánh giá. Câu chưa trả lời được tính là chưa đúng.</p><p class="tiny muted">Mã đề '+esc(s.code)+' · '+formatTime(s.submittedAt)+'</p></div></div><div class="bottom screen-actions"><button class="button" data-action="printAnswers">🖨️ In đáp án</button><button class="button blue" data-action="retryMistakes">🔁 Ôn câu sai</button><button class="button" data-view="home">🏠 Về trang chủ</button></div><h2>Đối chiếu từng câu</h2>'+s.questionIds.map((id,i)=>{let q=question(id),a=currentAnswer(s,q),correct=q.kind==='match'?matchCorrect(a):q.options?a.option===q.correct:a.self===true,pending=!q.options&&a.self===undefined,answerText=q.kind==='match'?(a.matches?.map((v,j)=>matchLabels[j]+' → '+(matchAnswers[v]||'Chưa chọn')).join('; ')||'Chưa nối'):q.options?(a.option===undefined?'Chưa chọn':q.options[a.option]):(a.text||'Chưa ghi câu trả lời');return '<article class="review-item '+(pending?'':correct?'good':'needs')+'"><h3>Câu '+(i+1)+'. '+esc(q.sourcePrompt)+'</h3><p class="tiny muted">'+SUBJECTS[q.subject].icon+' '+esc(SUBJECTS[q.subject].name)+' · PDF trang '+q.page+' · '+esc(q.topic)+'</p><p><b>Con trả lời:</b> '+esc(answerText)+'</p><p><b>Ý chính theo đề cương:</b> '+esc(q.answer)+'</p>'+(q.options?'<span class="tag">'+(correct?'✅ Đúng':'🔁 Cần ôn')+'</span>':'<div class="group screen-actions"><button class="button small green" data-self-result="'+esc(id)+':true">✅ Đạt ý chính</button><button class="button small" data-self-result="'+esc(id)+':false">🔁 Cần ôn</button>'+(pending?' <span class="tiny muted">Chờ tự đánh giá</span>':' <span class="tag">'+(correct?'Đã đạt':'Cần ôn')+'</span>')+'</div>')+'</article>'}).join('')+printQuestions(s,true)}
function progressPage(){let ss=state.sessions.filter(s=>s.profileId===state.activeProfileId&&s.submittedAt).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt)),wrong=lastMistakes();return '<div class="hero"><p class="eyebrow">Nhật ký học tập</p><h1>Mỗi ngày một bước tiến</h1><p>Điểm mạnh và câu cần ôn được lưu riêng cho từng người học trên máy này.</p></div><div class="stats"><div class="stat"><b>'+ss.length+'</b><span>Lượt hoàn thành</span></div><div class="stat"><b>'+new Set(ss.flatMap(s=>s.questionIds)).size+'</b><span>Mục đã gặp</span></div><div class="stat"><b>'+wrong.length+'</b><span>Câu cần ôn</span></div></div><div class="bottom screen-actions"><button class="button blue" data-action="retryMistakes" '+(!wrong.length?'disabled':'')+'>🔁 Ôn câu cần nhớ</button></div><h2>Theo môn</h2><div class="subject-grid">'+Object.entries(SUBJECTS).map(([k,v])=>'<div class="subject-card" style="cursor:default"><span class="icon">'+v.icon+'</span><b>'+esc(v.name)+'</b><small>Đã gặp '+progressFor(k)+' / '+countBySubject(k)+' mục</small><div class="meter"><i style="width:'+(progressFor(k)/countBySubject(k)*100)+'%;background:'+v.color+'"></i></div></div>').join('')+'</div><h2 style="margin-top:25px">Các lượt gần đây</h2>'+(ss.length?ss.slice(0,30).map(s=>{let r=score(s);return '<div class="history-row"><span><b>'+esc(subjectName(s.subject))+'</b><small class="muted"> · '+(s.mode==='exam'?'Làm đề':'Học')+' · '+s.questionIds.length+' câu · '+formatTime(s.submittedAt)+'</small></span><span><b>'+r.correct+'/'+r.graded+'</b> <button class="button small" data-result="'+esc(s.id)+'">Xem</button></span></div>'}).join(''):'<div class="notice">Chưa có lượt hoàn thành. Hãy bắt đầu một bài ôn nhé.</div>')}
function dataPage(){return '<div class="hero"><p class="eyebrow">Dữ liệu trên thiết bị</p><h1>Giữ lại hành trình học</h1><p>Tải bản sao sau vài buổi học, đặc biệt trước khi xóa dữ liệu trình duyệt.</p></div><div class="panel" style="margin-bottom:16px"><h2>💾 Sao lưu và chuyển máy</h2><div class="group"><button class="button blue" data-action="backup">Tải bản sao JSON</button><button class="button" data-action="saveHtml">Tải HTML kèm tiến độ</button><button class="button" data-action="exportCsv">Tải lịch sử CSV</button></div><p>Bản HTML kèm tiến độ chứa dữ liệu tại thời điểm tải. Mở file đó trên máy khác để học tiếp; không cần API.</p></div><div class="panel" style="margin-bottom:16px"><h2>📂 Khôi phục</h2><label class="label" for="restoreFile">Chọn bản sao JSON của app này</label><input type="file" id="restoreFile" class="field" accept=".json,application/json"><p>Khôi phục thay thế các hồ sơ và lịch sử hiện tại sau khi anh/chị xác nhận.</p></div><div class="panel" style="margin-bottom:16px"><h2>👨‍👩‍👧 Hồ sơ người học</h2>'+state.profiles.map(p=>'<div class="history-row"><b>'+esc(p.name)+'</b><span class="group"><button class="button small" data-rename="'+esc(p.id)+'">Đổi tên</button><button class="button small" data-delete-profile="'+esc(p.id)+'">Xóa</button></span></div>').join('')+'<p><button class="button gold" data-action="addProfile">＋ Thêm hồ sơ</button></p></div><div class="panel"><h2>🧹 Bắt đầu lại</h2><p>Chỉ dùng khi đã sao lưu và muốn xóa toàn bộ tiến độ trên trình duyệt này.</p><button class="button red" data-action="clear">Xóa toàn bộ dữ liệu</button></div>'}
function sharePanel(){return typeof navigator!=='undefined'&&typeof File!=='undefined'&&typeof navigator.share==='function'&&typeof navigator.canShare==='function'?'<div class="panel" style="margin-top:16px"><h2>📱 Chia sẻ bản sao trên điện thoại</h2><p>Nếu trình duyệt hỗ trợ, chọn “Lưu vào Tệp/Files” trong bảng chia sẻ để giữ tiến độ. Nút tải ở trên vẫn dùng được.</p><div class="group"><button class="button blue" data-action="shareBackup">Chia sẻ JSON</button><button class="button" data-action="shareHtml">Chia sẻ HTML kèm tiến độ</button></div></div>':''}
function mobileStorageNote(){return '<div class="notice">Nếu mở file trực tiếp từ ứng dụng Files trên iPhone/iPad, việc lưu tiến độ tùy thuộc chế độ mở file. Sau mỗi buổi học, hãy tải hoặc chia sẻ bản sao JSON/HTML kèm tiến độ. Nếu nút làm bài không chạy, hãy mở app trong trình duyệt đầy đủ.</div>'}
function render(){let content=view==='home'?home():view==='session'?sessionPage():view==='result'?resultsPage():view==='progress'?progressPage():dataPage()+mobileStorageNote()+sharePanel();shell(content)}
function persist(){state.updatedAt=now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notice('Không lưu được tiến độ. Hãy sao lưu JSON.')}}
function newSession(ids,mode,subject,seed){if(!profile()){openProfileDialog();return false}if(!ids.length){notice('Chưa có câu phù hợp với lựa chọn này.');return false}if(state.sessions.length>=2000){notice('Đã đạt giới hạn 2.000 lượt trên máy này. Hãy sao lưu JSON hoặc HTML kèm tiến độ, rồi bắt đầu lại trong mục Dữ liệu.');return false}let s={id:uid(),profileId:state.activeProfileId,mode,subject,seed,code:'PK4-'+subject+'-'+ids.length+'-'+seed.slice(0,18),questionIds:ids,answers:{},index:0,startedAt:now(),submittedAt:null};state.sessions.push(s);sessionId=s.id;view='session';save();window.scrollTo(0,0);return true}
function start(){let n=ui.count==='all'?eligible().length:Math.min(ui.count,eligible().length);let seed=ui.seed.trim()||Math.random().toString(36).slice(2,8).toUpperCase();newSession(buildIds(seed,n),ui.mode,ui.subject,seed)}
function changeAnswer(s,q,patch,redraw=true){s.answers[q.id]={...currentAnswer(s,q),...patch};if(redraw)save();else persist()}
function finish(){let s=session();if(!s)return;let unanswered=s.questionIds.filter(id=>!answered(s,question(id))).length;if(s.mode==='exam'&&unanswered&&!confirm('Còn '+unanswered+' câu chưa trả lời. Nộp bài ngay?'))return;s.submittedAt=now();view='result';save();window.scrollTo(0,0)}
function retryMistakes(){let ids=lastMistakes();if(!ids.length){notice('Chưa có câu cần ôn.');return}newSession(ids,'learn','ALL',Math.random().toString(36).slice(2,8).toUpperCase())}
function openProfileDialog(id=''){let p=state.profiles.find(x=>x.id===id);$('#profileTitle').textContent=p?'Đổi tên hồ sơ':'Thêm người học';$('#profileName').value=p?.name||'';$('#profileDialog').dataset.edit=id;$('#profileError').textContent='';$('#profileDialog').showModal();$('#profileName').focus()}
function saveProfile(){let n=$('#profileName').value.trim();if(!n||n.length>40){$('#profileError').textContent='Nhập tên từ 1 đến 40 kí tự.';return}let id=$('#profileDialog').dataset.edit;if(id){state.profiles.find(p=>p.id===id).name=n}else{if(state.profiles.length>=30){$('#profileError').textContent='Tối đa 30 hồ sơ.';return}id=uid();state.profiles.push({id,name:n})}state.activeProfileId=id;$('#profileDialog').close();save()}
function download(name,type,body){let file=new Blob([body],{type}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body?.appendChild?.(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove?.()},30000)}
function backup(){download('on-tap-lop-4-sao-luu.json','application/json;charset=utf-8',JSON.stringify(state,null,2))}
function htmlWithProgress(){let doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(state))));return '<!doctype html>\n'+doc.outerHTML}
function saveHtml(){download('on-tap-lop-4-kem-tien-do.html','text/html;charset=utf-8',htmlWithProgress())}
async function shareFile(name,type,body){if(typeof navigator==='undefined'||typeof File==='undefined'||typeof navigator.canShare!=='function'||typeof navigator.share!=='function'){notice('Trình duyệt này chưa hỗ trợ chia sẻ file. Hãy dùng nút Tải bản sao.');return}let file=new File([body],name,{type}),data={files:[file],title:'Góc ôn tập lớp 4'};if(!navigator.canShare({files:[file]})){notice('Không chia sẻ được file này. Hãy dùng nút Tải bản sao.');return}try{await navigator.share(data)}catch(err){if(err?.name!=='AbortError')notice('Chia sẻ chưa thành công. Hãy dùng nút Tải bản sao.')}
}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportCsv(){let rows=[['Người học','Thời điểm','Chế độ','Môn','Mã đề','Số câu','Đúng','Đã đánh giá','Chờ đánh giá']];for(let s of state.sessions.filter(s=>s.submittedAt)){let r=score(s);rows.push([state.profiles.find(p=>p.id===s.profileId)?.name||'',s.submittedAt,s.mode,subjectName(s.subject),s.code,r.total,r.correct,r.graded,r.pending])}download('on-tap-lop-4-lich-su.csv','text/csv;charset=utf-8',csv(rows))}
async function restore(file){if(file.size>8e6)throw Error('Bản sao vượt 8 MB.');let x=JSON.parse(await file.text());if(!valid(x))throw Error('File không phải bản sao hợp lệ của app.');if(!confirm('Thay thế toàn bộ hồ sơ và tiến độ trên máy này?'))return;state=x;view='home';sessionId='';save();notice('Đã khôi phục bản sao.')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-view],[data-subject],[data-mode],[data-count],[data-home-subject],[data-action],[data-option],[data-jump],[data-self],[data-self-result],[data-resume],[data-result],[data-rename],[data-delete-profile]');if(!b)return;let d=b.dataset;if(d.view){view=d.view;render();window.scrollTo(0,0);return}if(d.subject){ui.subject=d.subject;ui.topic='all';render();return}if(d.homeSubject){ui.subject=d.homeSubject;ui.topic='all';render();$('#seed')?.focus();return}if(d.mode){ui.mode=d.mode;render();return}if(d.count){ui.count=d.count==='all'?'all':Number(d.count);render();return}if(d.resume){sessionId=d.resume;view='session';render();return}if(d.result){sessionId=d.result;view='result';render();return}if(d.rename){openProfileDialog(d.rename);return}if(d.deleteProfile){let p=state.profiles.find(x=>x.id===d.deleteProfile);if(p&&confirm('Xóa hồ sơ '+p.name+' và toàn bộ lịch sử của bé?')){state.profiles=state.profiles.filter(x=>x.id!==p.id);state.sessions=state.sessions.filter(s=>s.profileId!==p.id);state.activeProfileId=state.profiles[0]?.id||'';save()}return}if(d.option!==undefined){let s=session(),q=question(s.questionIds[s.index]);if(!s.submittedAt)changeAnswer(s,q,{option:Number(d.option),revealed:s.mode==='learn'});return}if(d.jump!==undefined){let s=session();s.index=Number(d.jump);save();return}if(d.self!==undefined){let s=session(),q=question(s.questionIds[s.index]);changeAnswer(s,q,{self:d.self==='true',revealed:true});return}if(d.selfResult){let [id,value]=d.selfResult.split(':');let s=session(),q=question(id);if(s.submittedAt)changeAnswer(s,q,{self:value==='true'});return}let a=d.action;if(a==='addProfile')openProfileDialog();else if(a==='start')start();else if(a==='reveal'){let s=session(),q=question(s.questionIds[s.index]);changeAnswer(s,q,{revealed:true})}else if(a==='prev'||a==='next'){let s=session();s.index=Math.max(0,Math.min(s.questionIds.length-1,s.index+(a==='next'?1:-1)));save();window.scrollTo(0,0)}else if(a==='finish')finish();else if(a==='retryMistakes')retryMistakes();else if(a==='backup')backup();else if(a==='saveHtml')saveHtml();else if(a==='exportCsv')exportCsv();else if(a==='printQuestions'||a==='printAnswers')window.print();else if(a==='saveProfile')saveProfile();else if(a==='closeProfile')$('#profileDialog').close();else if(a==='clear'&&confirm('Xóa toàn bộ hồ sơ và tiến độ trên máy này? Hãy sao lưu trước khi tiếp tục.')){state=blank();view='home';sessionId='';save()}});
document.addEventListener('input',e=>{if(e.target.id==='seed')ui.seed=e.target.value;if(e.target.id==='freeAnswer'){let s=session(),q=question(s.questionIds[s.index]);changeAnswer(s,q,{text:e.target.value},false)}});
document.addEventListener('change',e=>{if(e.target.id==='topic'){ui.topic=e.target.value;render()}if(e.target.id==='profileSelect'){state.activeProfileId=e.target.value;view='home';save()}if(e.target.id==='restoreFile'&&e.target.files?.[0]){let f=e.target.files[0];restore(f).catch(err=>notice(err.message||String(err))).finally(()=>{e.target.value=''})}});
document.addEventListener('change',e=>{if(e.target.dataset.match!==undefined){let s=session(),q=question(s.questionIds[s.index]),a=currentAnswer(s,q),matches=Array.isArray(a.matches)?[...a.matches]:[null,null,null,null];matches[Number(e.target.dataset.match)]=e.target.value===''?null:Number(e.target.value);changeAnswer(s,q,{matches},false)}});
document.addEventListener('click',e=>{if(e.target.closest('[data-action="checkMatch"]')){let s=session(),q=question(s.questionIds[s.index]);if(!answered(s,q)){notice('Hãy nối đủ bốn nút lệnh trước khi kiểm tra.');return}changeAnswer(s,q,{revealed:true})}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-lab]');if(!b)return;let s=session(),q=question(s.questionIds[s.index]);if(q.id!=='I18'||s.mode!=='learn')return;let a=currentAnswer(s,q),step=a.labStep||0;if(step>=labSteps.length)return;if(b.dataset.lab!==labSteps[step].action){notice('Thử lại nhé: đọc kĩ yêu cầu của bước này.');return}changeAnswer(s,q,{labStep:step+1});if(step+1===labSteps.length)notice('Con đã hoàn thành mô phỏng năm thao tác!')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='profileName')saveProfile()});
document.addEventListener('click',e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(a==='shareBackup')shareFile('on-tap-lop-4-sao-luu.json','application/json',JSON.stringify(state,null,2));if(a==='shareHtml')shareFile('on-tap-lop-4-kem-tien-do.html','text/html',htmlWithProgress())});
render();



</script></body></html>
