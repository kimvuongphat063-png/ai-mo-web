function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ đầy. Hãy tải bản sao JSON hoặc HTML.')}render();return true}
const actualCost=id=>payments(id).filter(p=>p.state!=='Hủy').reduce((n,p)=>n+p.amount,0);
function monthStats(id){let c=db.costs.filter(x=>x.monthId===id),revenue=db.revenues.filter(x=>x.monthId===id&&x.state!=='Hủy').reduce((n,x)=>n+x.amount,0),budget=c.reduce((n,x)=>n+x.budget,0),spent=c.reduce((n,x)=>n+actualCost(x.id),0),result=revenue-spent,margin=revenue?Math.round(result/revenue*1000)/10:null;return {revenue,budget,spent,result,margin,costs:c.length,payments:db.payments.filter(p=>p.state!=='Hủy'&&c.some(x=>x.id===p.costId)).length}}
function costWarning(c){let actual=actualCost(c.id),w=[];if(!c.budget&&actual>0)w.push('Chưa có dự toán');else if(c.budget&&actual/c.budget*100>db.settings.overBudget)w.push('Vượt dự toán');if(payments(c.id).some(p=>p.state!=='Hủy'&&p.proof==='Chưa'))w.push('Thiếu chứng từ');if(payments(c.id).some(p=>p.state!=='Hủy'&&p.proof==='Không rõ'))w.push('Chưa đối chiếu chứng từ');return w}
function monthWarning(m){let s=monthStats(m.id),w=[];if(s.revenue&&s.margin<db.settings.minMargin)w.push('Biên vận hành thấp');if(db.costs.some(c=>c.monthId===m.id&&costWarning(c).length))w.push('Có hạng mục cần xem');return w}
function summary(){let a=db.months.map(m=>monthStats(m.id));return {months:a.length,revenue:a.reduce((n,x)=>n+x.revenue,0),budget:a.reduce((n,x)=>n+x.budget,0),spent:a.reduce((n,x)=>n+x.spent,0),result:a.reduce((n,x)=>n+x.result,0),alerts:db.costs.filter(c=>costWarning(c).length).length}}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Tháng theo dõi</small><strong>${s.months}</strong></div><div><small>Doanh thu đã nhập</small><strong>${money(s.revenue)}</strong></div><div><small>Dự toán chi</small><strong>${money(s.budget)}</strong></div><div><small>Chi thực tế</small><strong>${money(s.spent)}</strong></div><div><small>Chênh lệch vận hành*</small><strong>${money(s.result)}</strong></div></div>`}
function home(){let alerts=db.costs.filter(c=>costWarning(c).length).sort((a,b)=>month(b.monthId).period.localeCompare(month(a.monthId).period)).slice(0,8);return `<div class="hero"><span>🏢 AI MỞ · QUẢN TRỊ TRUNG TÂM</span><h1>Chi phí vận hành theo tháng</h1><p>Đặt dự toán từng hạng mục, ghi chi thực tế và xem chênh lệch vận hành.</p><div class="hero-actions">${btn('＋ Tạo tháng','newMonth','primary')}${btn('＋ Ghi khoản chi','newPayment')}</div></div>${metrics()}${panel('📍 Quy trình nhanh',`<ol><li>Tạo tháng, nhập các khoản doanh thu thực nhận.</li><li>Đặt dự toán cho từng hạng mục chi phí.</li><li>Ghi mỗi lần chi thực tế vào hạng mục, kèm người nhận và chứng từ.</li><li>Đối chiếu dự toán, báo cáo và chốt tháng khi đã rà xong.</li></ol><p class="muted">* Chênh lệch vận hành = doanh thu đã nhập − chi phí vận hành đã nhập. Chưa bao gồm khoản khác chưa ghi, thuế và các điều chỉnh kế toán.</p>`)}<div class="two">${panel('📅 Các tháng',db.months.length?db.months.slice().sort((a,b)=>b.period.localeCompare(a.period)).slice(0,8).map(m=>{let s=monthStats(m.id);return `<div class="mini"><button class="link" data-act="openMonth" data-id="${esc(m.id)}">${fmtPeriod(m.period)}</button><small>${m.state} · thu ${money(s.revenue)} · chi ${money(s.spent)} · còn ${money(s.result)}</small></div>`}).join(''):'<p class="muted">Chưa có tháng. Tạo tháng để bắt đầu.</p>')}${panel('⚠️ Hạng mục cần xem',alerts.length?alerts.map(c=>`<div class="mini"><button class="link" data-act="openMonth" data-id="${esc(c.monthId)}">${esc(c.title)}</button><small>${fmtPeriod(month(c.monthId).period)} · ${costWarning(c).join(', ')}</small></div>`).join(''):'<p class="success">Chưa có cảnh báo.</p>')}</div>`}
function monthsPage(){return `<div class="page-head"><div><h1>📅 Kỳ quản trị</h1><p>Mỗi tháng có doanh thu, dự toán, chi thực tế và tình trạng chốt riêng.</p></div>${btn('＋ Tạo tháng','newMonth','primary')}</div>${panel('Theo tháng',`<div class="table-wrap"><table><thead><tr><th>Tháng</th><th>Doanh thu</th><th>Dự toán chi</th><th>Chi thực tế</th><th>Chênh lệch</th><th>Biên vận hành</th><th>Tình trạng</th><th>Cảnh báo</th></tr></thead><tbody>${db.months.slice().sort((a,b)=>a.period.localeCompare(b.period)).map(m=>{let s=monthStats(m.id);return `<tr><td><button class="link" data-act="openMonth" data-id="${esc(m.id)}">${fmtPeriod(m.period)}</button></td><td>${money(s.revenue)}</td><td>${money(s.budget)}</td><td>${money(s.spent)}</td><td><b>${money(s.result)}</b></td><td>${s.margin===null?'—':s.margin+'%'}</td><td>${m.state}</td><td>${monthWarning(m).length?`<span class="pill red">${esc(monthWarning(m).join('; '))}</span>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có tháng.</td></tr>'}</tbody></table></div>`)}`}
function detail(){let m=month(selected);if(!m){page='months';return monthsPage()}let s=monthStats(m.id),costs=db.costs.filter(c=>c.monthId===m.id),rev=db.revenues.filter(r=>r.monthId===m.id).sort((a,b)=>a.date.localeCompare(b.date)),pay=db.payments.filter(p=>cost(p.costId)?.monthId===m.id).sort((a,b)=>a.date.localeCompare(b.date)),hist=db.audit.filter(a=>a.monthId===m.id).sort((a,b)=>b.at.localeCompare(a.at));return `<div class="page-head"><div><button class="link" data-act="months">← Các tháng</button><h1>🏢 ${fmtPeriod(m.period)}</h1><p>${m.state}${m.note?' · '+esc(m.note):''}</p></div><div class="actions no-print">${m.state==='Đang theo dõi'?btn('＋ Doanh thu','newRevenue','primary',m.id)+btn('＋ Hạng mục','newCost','',m.id)+btn('＋ Chi thực tế','newPayment','',m.id)+btn('Chốt tháng','closeMonth','',m.id):btn('Mở lại tháng','reopenMonth','',m.id)}${btn('🖨️ In','print')}${btn('Xóa tháng','deleteMonth','danger',m.id)}</div></div><div class="metrics"><div><small>Doanh thu</small><strong>${money(s.revenue)}</strong></div><div><small>Dự toán chi</small><strong>${money(s.budget)}</strong></div><div><small>Chi thực tế</small><strong>${money(s.spent)}</strong></div><div><small>Chênh lệch</small><strong>${money(s.result)}</strong></div><div><small>Biên vận hành</small><strong>${s.margin===null?'—':s.margin+'%'}</strong></div></div>${panel('💰 Doanh thu đã ghi',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Nguồn thu</th><th>Số tiền</th><th>Ghi chú</th></tr></thead><tbody>${rev.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.source)}</td><td>${money(r.amount)}</td><td>${esc(r.note||'—')}<small>${r.state}</small>${m.state==='Đang theo dõi'&&r.state!=='Hủy'?btn('Hủy phiếu','voidRevenue','small danger',r.id):''}</td></tr>`).join('')||'<tr><td colspan="4">Chưa có doanh thu.</td></tr>'}</tbody></table></div>`)}${panel('📋 Hạng mục dự toán',`<div class="table-wrap"><table><thead><tr><th>Nhóm</th><th>Hạng mục</th><th>Dự toán</th><th>Thực tế</th><th>Chênh lệch</th><th>Thực tế / dự toán</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${costs.map(c=>{let a=actualCost(c.id),w=costWarning(c);return `<tr><td>${esc(c.category)}</td><td>${esc(c.title)}</td><td>${money(c.budget)}</td><td>${money(a)}</td><td>${money(a-c.budget)}</td><td>${c.budget?Math.round(a/c.budget*1000)/10+'%':'—'}</td><td>${w.length?`<span class="pill red">${esc(w.join('; '))}</span>`:'—'}</td><td class="no-print">${m.state==='Đang theo dõi'?btn('Chi','newPayment','small',c.id)+btn('Sửa dự toán','editBudget','small',c.id):''}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có hạng mục. Thêm dự toán trước khi ghi chi.</td></tr>'}</tbody></table></div>`)}${panel('🧾 Các lần chi thực tế',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Hạng mục</th><th>Số tiền</th><th>Người nhận</th><th>Chứng từ</th><th>Ghi chú</th></tr></thead><tbody>${pay.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(cost(p.costId).title)}</td><td>${money(p.amount)}</td><td>${esc(p.payee||'—')}</td><td>${esc(p.proof)}<small>${esc(p.proofCode||'')}</small></td><td>${esc(p.note||'—')}<small>${p.state}</small>${m.state==='Đang theo dõi'&&p.state!=='Hủy'?btn('Hủy phiếu','voidPayment','small danger',p.id):''}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có chi thực tế.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký',hist.length?`<div class="timeline">${hist.map(a=>`<div><b>${esc(a.action)}</b> · ${fmtDate(a.at.slice(0,10))}<p>${esc(a.reason||'—')}</p></div>`).join('')}</div>`:'<p class="muted">Chưa có thay đổi.</p>')}`}
function costsPage(){let a=db.costs.filter(c=>(!periodFilter||month(c.monthId).period===periodFilter)&&(!categoryFilter||c.category===categoryFilter)&&(!search||[c.title,c.category].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))).sort((a,b)=>month(b.monthId).period.localeCompare(month(a.monthId).period));return `<div class="page-head"><div><h1>🧾 Hạng mục chi phí</h1><p>Dự toán nằm trên hạng mục; thực tế là tổng các lần chi có chứng từ.</p></div>${btn('＋ Thêm hạng mục','newCost','primary')}</div><div class="card"><div class="filters"><label>Tìm kiếm<input id="search" value="${esc(search)}" placeholder="Tên hoặc nhóm…"></label><label>Tháng<select id="periodFilter"><option value="">Tất cả</option>${db.months.map(m=>`<option value="${m.period}" ${periodFilter===m.period?'selected':''}>${fmtPeriod(m.period)}</option>`).join('')}</select></label><label>Nhóm<select id="categoryFilter"><option value="">Tất cả</option>${CATS.map(c=>`<option ${categoryFilter===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="table-wrap"><table><thead><tr><th>Tháng</th><th>Nhóm / hạng mục</th><th>Dự toán</th><th>Thực tế</th><th>Chênh lệch</th><th>Cảnh báo</th></tr></thead><tbody>${a.map(c=>`<tr><td><button class="link" data-act="openMonth" data-id="${esc(c.monthId)}">${fmtPeriod(month(c.monthId).period)}</button></td><td>${esc(c.category)}<small>${esc(c.title)}</small></td><td>${money(c.budget)}</td><td>${money(actualCost(c.id))}</td><td>${money(actualCost(c.id)-c.budget)}</td><td>${esc(costWarning(c).join('; ')||'—')}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có hạng mục phù hợp.</td></tr>'}</tbody></table></div></div>`}
function reports(){let a=db.months.slice().sort((x,y)=>x.period.localeCompare(y.period));return `<div class="page-head"><div><h1>📊 Báo cáo vận hành</h1><p>Chênh lệch chỉ dựa trên doanh thu và chi phí vận hành đã ghi trong app.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo tháng',`<div class="table-wrap"><table><thead><tr><th>Tháng</th><th>Doanh thu</th><th>Dự toán chi</th><th>Chi thực tế</th><th>Chênh lệch</th><th>Biên</th></tr></thead><tbody>${a.map(m=>{let s=monthStats(m.id);return `<tr><td>${fmtPeriod(m.period)}</td><td>${money(s.revenue)}</td><td>${money(s.budget)}</td><td>${money(s.spent)}</td><td>${money(s.result)}</td><td>${s.margin===null?'—':s.margin+'%'}</td></tr>`}).join('')||'<tr><td colspan="6">Chưa có kỳ.</td></tr>'}</tbody></table></div>`)}${panel('Theo nhóm chi',`<div class="table-wrap"><table><thead><tr><th>Nhóm</th><th>Hạng mục</th><th>Dự toán</th><th>Thực tế</th><th>Chênh lệch</th></tr></thead><tbody>${CATS.map(cat=>{let c=db.costs.filter(x=>x.category===cat);return `<tr><td>${esc(cat)}</td><td>${c.length}</td><td>${money(c.reduce((n,x)=>n+x.budget,0))}</td><td>${money(c.reduce((n,x)=>n+actualCost(x.id),0))}</td><td>${money(c.reduce((n,x)=>n+actualCost(x.id)-x.budget,0))}</td></tr>`}).join('')}</tbody></table></div>`)}${panel('Hạng mục cần xem',`<div class="table-wrap"><table><thead><tr><th>Tháng</th><th>Hạng mục</th><th>Thực tế</th><th>Dự toán</th><th>Lưu ý</th></tr></thead><tbody>${db.costs.filter(c=>costWarning(c).length).map(c=>`<tr><td>${fmtPeriod(month(c.monthId).period)}</td><td>${esc(c.title)}</td><td>${money(actualCost(c.id))}</td><td>${money(c.budget)}</td><td>${esc(costWarning(c).join('; '))}</td></tr>`).join('')||'<tr><td colspan="5">Không có hạng mục cần xem.</td></tr>'}</tbody></table></div>`)}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngưỡng quản trị',`<form id="settingsForm" class="form-grid"><label>Biên vận hành mong muốn tối thiểu (%)<input name="minMargin" type="number" min="0" max="100" step="0.1" value="${db.settings.minMargin}" required></label><label>Nhắc khi thực tế / dự toán lớn hơn (%)<input name="overBudget" type="number" min="0" max="1000" step="0.1" value="${db.settings.overBudget}" required></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="note">Mặc định từ mẫu: biên 30%, nhắc khi chi phí vượt 110% dự toán. Đây là ngưỡng quản trị, không phải quy định thuế hay kết luận kế toán.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu và chuyển máy',`<p>Dữ liệu lưu trong trình duyệt này. HTML gốc không mang số đã nhập trên máy khác. Hãy tải JSON hoặc HTML kèm dữ liệu để chuyển máy.</p><div class="actions">${btn('⬇️ Tải JSON','exportJson')}${btn('⬇️ Tải HTML kèm dữ liệu','exportHtml','primary')}${btn('⬇️ Excel 5 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Mẫu nguồn',`<p>Mẫu có 6 tháng doanh thu và 20 hạng mục chi. Dự toán lặp ở nhiều dòng cùng nhóm, một số tháng không đủ nhóm chi; chỉ dùng đối chiếu công thức, không xem là kết quả kinh doanh đầy đủ.</p>${btn('Nạp mẫu nguồn (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ dữ liệu app này trên thiết bị.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Quy trình',`<ol><li>Tạo tháng theo định dạng năm-tháng, ví dụ 2026-11.</li><li>Ghi doanh thu thực tế theo ngày và nguồn.</li><li>Lập dự toán cho từng hạng mục thuộc nhóm chi phí; mỗi hạng mục có thể có nhiều lần chi thực tế.</li><li>Ghi lần chi với ngày, số tiền, người nhận và tình trạng chứng từ.</li><li>Xem chênh lệch, cảnh báo, rồi chốt tháng. Chỉ mở lại khi có lý do.</li></ol>`)}${panel('Cách tính và giới hạn',`<p>Chi thực tế tháng = tổng các lần chi đã ghi. Chênh lệch vận hành = doanh thu đã ghi − chi thực tế. Biên = chênh lệch / doanh thu khi doanh thu > 0. Tỷ lệ hạng mục = thực tế / dự toán khi dự toán > 0.</p><p>App không tự lấy dữ liệu học phí, lương giáo viên, thuế, chi phí dạy học hoặc các khoản ngoài sổ. Cần nhập đủ khoản liên quan trước khi dùng để ra quyết định.</p>`)}`}
function render(){let map={home:['Tổng quan',home],months:['Các tháng',monthsPage],detail:['Chi tiết tháng',detail],costs:['Hạng mục',costsPage],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,l,v='',type='text',opts=null){return `<label class="${type==='textarea'?'full':''}">${l}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(v)}</textarea>`:opts?`<select name="${n}">${opts.map(o=>{let key=Array.isArray(o)?o[0]:o,label=Array.isArray(o)?o[1]:o;return `<option value="${esc(key)}" ${key===v?'selected':''}>${esc(label)}</option>`}).join('')}</select>`:`<input name="${n}" type="${type}" value="${esc(v)}" ${type==='number'?'step="1" min="0"':''} ${['period','date','source','title','budget','amount'].includes(n)?'required':''}>`}</label>`}
function openModal(kind,ref=''){draft={kind,ref};let f='';if(kind==='month')f=field('period','Tháng (năm-tháng)',periodNow(),'month')+field('note','Ghi chú','','textarea');else if(kind==='revenue'){let opts=db.months.filter(m=>m.state==='Đang theo dõi').map(m=>[m.id,fmtPeriod(m.period)]),id=ref||opts[0]?.[0]||'';f=field('monthId','Tháng',id,'text',opts)+field('date','Ngày thu',month(id)?.period+'-01'||today(),'date')+field('amount','Số tiền','', 'number')+field('source','Nguồn doanh thu','')+field('note','Ghi chú','','textarea')}else if(kind==='cost'){let opts=db.months.filter(m=>m.state==='Đang theo dõi').map(m=>[m.id,fmtPeriod(m.period)]),id=ref||opts[0]?.[0]||'';f=field('monthId','Tháng',id,'text',opts)+field('category','Nhóm chi','Thuê mặt bằng','text',CATS)+field('title','Tên hạng mục','')+field('budget','Dự toán (đồng)','0','number')+field('note','Ghi chú','','textarea')}else{let opts=db.costs.filter(c=>month(c.monthId)?.state==='Đang theo dõi'&&(!ref||c.id===ref||c.monthId===ref)).map(c=>[c.id,fmtPeriod(month(c.monthId).period)+' · '+c.title]),id=ref&&cost(ref)?ref:opts[0]?.[0]||'';f=field('costId','Hạng mục',id,'text',opts)+field('date','Ngày chi',month(cost(id)?.monthId)?.period+'-01'||today(),'date')+field('amount','Số tiền','', 'number')+field('payee','Người nhận / nhà cung cấp','')+field('proof','Đã có chứng từ','Có','text',PROOFS)+field('proofCode','Mã chứng từ','')+field('note','Ghi chú','','textarea')}$('#modalTitle').textContent={month:'Tạo tháng',revenue:'Ghi doanh thu',cost:'Tạo hạng mục dự toán',payment:'Ghi chi thực tế'}[kind];$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function error(s){$('#formError').textContent=s}function audit(action,reason,monthId=''){db.audit.push({id:uid(),action,reason,monthId,at:new Date().toISOString()})}
function submit(){let f=new FormData($('#itemForm')),x={id:uid()};for(let [k,v] of f)x[k]=String(v).trim();let kind=draft.kind;if(kind==='month'){if(!periodOK(x.period)||db.months.some(m=>m.period===x.period)){error('Tháng không hợp lệ hoặc đã tồn tại.');return}x.state='Đang theo dõi';db.months.push(x);audit('Tạo tháng',fmtPeriod(x.period),x.id);selected=x.id}else if(kind==='revenue'){x.amount=Number(x.amount);let m=month(x.monthId);if(!m||m.state!=='Đang theo dõi'||!dateOK(x.date)||x.date.slice(0,7)!==m.period||!Number.isSafeInteger(x.amount)||x.amount<=0||!x.source){error('Chọn tháng đang mở, ngày đúng tháng, số tiền dương và nguồn thu.');return}x.state='Hợp lệ';x.voidReason='';db.revenues.push(x);audit('Ghi doanh thu',x.source+' · '+money(x.amount),m.id);selected=m.id}else if(kind==='cost'){x.budget=Number(x.budget);let m=month(x.monthId);if(!m||m.state!=='Đang theo dõi'||!CATS.includes(x.category)||!x.title||!Number.isSafeInteger(x.budget)||x.budget<0){error('Chọn tháng đang mở, nhóm, tên hạng mục và dự toán không âm.');return}db.costs.push(x);audit('Tạo hạng mục',x.title+' · '+money(x.budget),m.id);selected=m.id}else{ x.amount=Number(x.amount);let c=cost(x.costId),m=month(c?.monthId);if(!c||!m||m.state!=='Đang theo dõi'||!dateOK(x.date)||x.date.slice(0,7)!==m.period||!Number.isSafeInteger(x.amount)||x.amount<=0||!PROOFS.includes(x.proof)){error('Chọn hạng mục tháng đang mở, ngày đúng tháng và số tiền dương.');return}x.state='Hợp lệ';x.voidReason='';db.payments.push(x);audit('Ghi chi thực tế',c.title+' · '+money(x.amount),m.id);selected=m.id}let err=validate(db);if(err){let list=kind==='month'?db.months:kind==='revenue'?db.revenues:kind==='cost'?db.costs:db.payments;list.pop();db.audit.pop();error(err);return}$('#editor').close();page='detail';save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'chi-phi-van-hanh-sao-luu.json')}function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'chi-phi-van-hanh-kem-du-lieu.html')}
const HM=['ID','Tháng','Tình trạng','Ghi chú'],HR=['ID','ID tháng','Ngày','Số tiền','Nguồn thu','Ghi chú','Tình trạng','Lý do hủy'],HC=['ID','ID tháng','Nhóm','Hạng mục','Dự toán','Ghi chú'],HP=['ID','ID hạng mục','Ngày','Số tiền','Người nhận','Chứng từ','Mã chứng từ','Ghi chú','Tình trạng','Lý do hủy'],HA=['ID','Hành động','Lý do','ID tháng','Thời điểm'];
function sheets(){return [{name:'Thang',rows:[HM,...db.months.map(m=>[m.id,m.period,m.state,m.note])]},{name:'Doanh thu',rows:[HR,...db.revenues.map(r=>[r.id,r.monthId,r.date,r.amount,r.source,r.note,r.state,r.voidReason])]},{name:'Du toan',rows:[HC,...db.costs.map(c=>[c.id,c.monthId,c.category,c.title,c.budget,c.note])]},{name:'Chi thuc te',rows:[HP,...db.payments.map(p=>[p.id,p.costId,p.date,p.amount,p.payee,p.proof,p.proofCode,p.note,p.state,p.voidReason])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.monthId,a.at])]}]}function exportExcel(){download(Excel.workbook(sheets()),'chi-phi-van-hanh.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Thang',HM],['Doanh thu',HR],['Du toan',HC],['Chi thuc te',HP],['Nhat ky',HA]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng mẫu năm sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.months=b['Thang'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),period:String(r[1]),state:String(r[2]),note:String(r[3]||'')}));x.revenues=b['Doanh thu'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),monthId:String(r[1]),date:String(r[2]),amount:Number(r[3]),source:String(r[4]),note:String(r[5]||''),state:String(r[6]),voidReason:String(r[7]||'')}));x.costs=b['Du toan'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),monthId:String(r[1]),category:String(r[2]),title:String(r[3]),budget:Number(r[4]),note:String(r[5]||'')}));x.payments=b['Chi thuc te'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),costId:String(r[1]),date:String(r[2]),amount:Number(r[3]),payee:String(r[4]||''),proof:String(r[5]),proofCode:String(r[6]||''),note:String(r[7]||''),state:String(r[8]),voidReason:String(r[9]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),monthId:String(r[3]||''),at:String(r[4])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.months.length} tháng?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),year=new Date().getFullYear(),map=new Map();for(let r of COST_SAMPLE.th){let mm=Number(r[0].replace(/\D/g,'')),id=uid(),period=year+'-'+String(mm).padStart(2,'0');map.set(r[0],id);x.months.push({id,period,state:'Đang theo dõi',note:'Dữ liệu minh họa; nguồn không ghi năm.'});x.revenues.push({id:uid(),monthId:id,date:period+'-01',amount:r[1],source:'Doanh thu tháng theo mẫu nguồn',note:'Nguồn chỉ có tổng tháng, không có ngày thu thực.',state:'Hợp lệ',voidReason:''})}for(let [i,r] of COST_SAMPLE.cp.entries()){let mid=map.get(r[0]),period=monthFromSample(mid,x.months),id=uid();x.costs.push({id,monthId:mid,category:r[1],title:r[1]+' · dòng mẫu '+(i+1),budget:r[3],note:'Dự toán theo từng dòng nguồn; có thể lặp cùng nhóm trong tháng.'});x.payments.push({id:uid(),costId:id,date:period+'-01',amount:r[2],payee:'',proof:'Không rõ',proofCode:'',note:'Ngày và chứng từ không có trong nguồn; đây là ngày minh họa.',state:'Hợp lệ',voidReason:''})}let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
function monthFromSample(id,months){return months.find(m=>m.id===id)?.period||''}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;if(k==='newMonth')openModal('month');else if(k==='newRevenue'){if(!db.months.some(m=>m.state==='Đang theo dõi')){alert('Tạo hoặc mở tháng trước khi ghi doanh thu.');return}openModal('revenue',id)}else if(k==='newCost'){if(!db.months.some(m=>m.state==='Đang theo dõi')){alert('Tạo hoặc mở tháng trước khi lập dự toán.');return}openModal('cost',id)}else if(k==='newPayment'){if(!db.costs.some(c=>month(c.monthId)?.state==='Đang theo dõi'&&(!id||c.id===id||c.monthId===id))){alert('Tạo hạng mục dự toán cho tháng này trước khi ghi chi.');return}openModal('payment',id)}else if(k==='openMonth'){selected=id;page='detail';render()}else if(k==='months'){page='months';render()}else if(k==='editBudget'){let c=cost(id),m=month(c?.monthId);if(!m||m.state!=='Đang theo dõi')return;let value=prompt('Dự toán mới (đồng):',String(c.budget));if(value===null)return;let amount=Number(value);if(!Number.isSafeInteger(amount)||amount<0){alert('Dự toán phải là số nguyên không âm.');return}let reason=prompt('Lý do sửa dự toán:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do sửa.');return}let old=c.budget;c.budget=amount;audit('Sửa dự toán',c.title+' · '+money(old)+' → '+money(amount)+' · '+reason.trim(),m.id);save()}else if(k==='voidRevenue'||k==='voidPayment'){let row=k==='voidRevenue'?db.revenues.find(r=>r.id===id):db.payments.find(p=>p.id===id),m=month(k==='voidRevenue'?row?.monthId:cost(row?.costId)?.monthId);if(!row||!m||m.state!=='Đang theo dõi'||row.state==='Hủy')return;let reason=prompt('Lý do hủy phiếu:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do hủy.');return}row.state='Hủy';row.voidReason=reason.trim();audit(k==='voidRevenue'?'Hủy doanh thu':'Hủy khoản chi',money(row.amount)+' · '+reason.trim(),m.id);save()}else if(k==='closeMonth'){let m=month(id);if(confirm(`Chốt ${fmtPeriod(m.period)}? Không thể ghi mới cho đến khi mở lại.`)){m.state='Đã chốt';audit('Chốt tháng','Đã rà soát số liệu',id);save()}}else if(k==='reopenMonth'){let m=month(id),reason=prompt('Lý do mở lại tháng:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do mở lại.');return}m.state='Đang theo dõi';audit('Mở lại tháng',reason.trim(),id);save()}else if(k==='deleteMonth'){let m=month(id);if(db.revenues.some(r=>r.monthId===id)||db.costs.some(c=>c.monthId===id)){alert('Tháng đã có số liệu, không thể xóa.');return}if(confirm(`Xóa ${fmtPeriod(m.period)}?`)){db.months=db.months.filter(x=>x.id!==id);audit('Xóa tháng',m.period,id);page='months';save()}}else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),minMargin=Number(f.get('minMargin')),overBudget=Number(f.get('overBudget'));if(!Number.isFinite(minMargin)||minMargin<0||minMargin>100||!Number.isFinite(overBudget)||overBudget<0||overBudget>1000){alert('Ngưỡng không hợp lệ.');return}db.settings={minMargin,overBudget};save()}else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let p=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(p,p)}if(e.target.id==='periodFilter'){periodFilter=e.target.value;render()}if(e.target.id==='categoryFilter'){categoryFilter=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.name==='monthId'&&draft?.kind==='revenue')$('[name="date"]').value=month(e.target.value).period+'-01';if(e.target.name==='costId'&&draft?.kind==='payment')$('[name="date"]').value=month(cost(e.target.value).monthId).period+'-01'});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
window.CenterCostApp={getDB:()=>clone(db),validate,monthStats,costWarning,summary,loadSample,encode,decode,sheets,importFile};
