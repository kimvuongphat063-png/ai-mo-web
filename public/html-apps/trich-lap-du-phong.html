<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trích lập dự phòng · AI Mở</title><style>:root{font-family:'Segoe UI',Arial,sans-serif;color:#223142;background:#eaf0f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4ba4c8;outline-offset:2px}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.rail{background:#263745;color:white;padding:23px 15px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:22px;margin-bottom:26px}.brand small{display:block;font-size:12px;font-weight:400;color:#bcd1dc}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dce9ee;text-align:left;padding:12px;border-radius:10px;font-weight:700}.nav button.active{background:#b86c45;color:white}.note-side{font-size:12px;color:#c3d3d8;line-height:1.6;margin-top:28px}.main{min-width:0;padding:28px clamp(15px,3vw,46px);max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;color:#58717d;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}.hero{background:linear-gradient(120deg,#263745,#3b5b67);color:white;border-radius:24px;padding:32px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.6fr);gap:25px;box-shadow:0 10px 30px #22314219}.eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;color:#ffbd94;text-transform:uppercase}.hero h1{font-size:clamp(28px,3vw,44px);line-height:1.1;max-width:600px;margin:12px 0}.hero p{color:#d7e5e8;line-height:1.55;max-width:650px}.hero-stat{border:1px solid #7593a0;border-radius:18px;background:#ffffff15;padding:20px;align-self:end}.hero-stat strong{display:block;font-size:clamp(24px,2.6vw,39px);margin-top:10px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.btn{border:1px solid #b9cdd3;background:white;color:#244452;border-radius:10px;padding:10px 14px;font-weight:750;min-height:42px}.btn.primary{background:#bd734a;color:white;border-color:#bd734a}.btn.dark{background:#284c5d;color:white;border-color:#284c5d}.btn.warn{color:#ac4736;border-color:#e2b9ae}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card,.panel{background:white;border:1px solid #d4e0e4;border-radius:17px;padding:18px}.card{border-top:4px solid #79b9cd}.card:nth-child(2){border-color:#e6bc9a;border-top-color:#bb744b}.card:nth-child(3){border-top-color:#9bb9c5}.card:nth-child(4){border-top-color:#d69b8a}.label{font-size:12px;font-weight:800;color:#5b7380;text-transform:uppercase;letter-spacing:.05em}.value{font-size:clamp(19px,2vw,27px);font-weight:850;line-height:1.2;margin:12px 0 4px;overflow-wrap:anywhere}.muted{color:#627b87;font-size:13px}.panel{margin:14px 0}.panel h2{font-size:21px;margin:0 0 12px}.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}.toolbar input{min-width:200px;flex:1;max-width:370px}.field,input,select{border:1px solid #b9cbd2;border-radius:9px;padding:9px 11px;background:white;color:#253b47;min-width:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{background:#ecf2f3;text-align:left;color:#536f79;font-size:12px}.table td,.table th{padding:10px;border-bottom:1px solid #e5edef;vertical-align:top}.table td.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums}.badge{display:inline-block;border-radius:99px;padding:4px 8px;background:#e5f2f3;color:#245465;font-size:12px;font-weight:700}.badge.alert{background:#fff0e8;color:#9a4d32}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hint{background:#fff6e9;border-left:4px solid #ba754c;padding:12px 15px;border-radius:9px;line-height:1.55}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid label{display:grid;gap:5px;font-weight:700;font-size:13px}.formgrid label.wide{grid-column:1/-1}.empty{padding:40px;text-align:center;color:#66808b}.mobile-nav{display:none}dialog{border:0;border-radius:18px;box-shadow:0 25px 80px #172d3c55;width:min(640px,calc(100vw - 26px));padding:24px}dialog::backdrop{background:#122a38a8}dialog h2{margin:0 0 18px}dialog .actions{justify-content:flex-end}.error{color:#a12e23;font-size:13px;min-height:20px;margin-top:8px}.hide{display:none!important}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:190px minmax(0,1fr)}.hero{grid-template-columns:1fr}.hero-stat{max-width:400px}}@media(max-width:700px){.shell{display:block}.rail{display:none}.mobile-nav{display:flex;gap:5px;background:#263745;padding:10px;overflow-x:auto;white-space:nowrap}.mobile-nav button{border:0;border-radius:9px;padding:10px 12px;background:transparent;color:white;font-weight:700;flex:none}.mobile-nav button.active{background:#d0926c}.main{padding:16px 13px}.top{font-size:10px}.hero{padding:23px 18px;border-radius:18px}.hero h1{font-size:29px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:13px}.value{font-size:18px}.grid2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}@media(max-width:410px){.cards{grid-template-columns:1fr}.hero-stat{padding:14px}}@media print{.rail,.mobile-nav,.actions,.toolbar button,.top{display:none!important}.shell{display:block}.main{padding:0}.hero{color:#223142;background:white;box-shadow:none;border:1px solid #ccc}.hero p{color:#223142}.panel,.card{break-inside:avoid}body{background:white}}
</style></head><body><div class="shell"><aside class="rail"><div class="brand">▤ AI Mở<small>Dự phòng & đánh giá rủi ro</small></div><nav class="nav" id="nav"></nav><div class="note-side">Bản HTML độc lập · Chạy offline<br>Dữ liệu lưu trên trình duyệt này. Hãy sao lưu trước khi chuyển máy.</div></aside><div><div class="mobile-nav" id="mobileNav"></div><main class="main"><div class="top"><span>Sổ dự phòng / Bảng rà soát</span><span id="status">Đang tải</span></div><div id="screen"></div></main></div></div><dialog id="editor"><h2 id="dialogTitle"></h2><form id="entryForm"><div class="formgrid" id="formFields"></div><div class="error" id="formError" role="alert"></div><div class="actions"><button type="button" class="btn" id="cancel">Hủy</button><button class="btn primary">Lưu thông tin</button></div></form></dialog><script id="embedded" type="application/json">e30=</script><script>const KEY='ai-mo-provisions-v1',VERSION=1;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n||0)+' đ';const num=n=>Number(n)||0;const uid=()=>crypto.randomUUID?.()||'id-'+Date.now()+'-'+Math.random();const today=()=>new Date().toISOString().slice(0,10);const dayOffset=n=>{let x=new Date();x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};const dateOK=s=>/^\d{4}-\d\d-\d\d$/.test(s)&&!Number.isNaN(Date.parse(s+'T00:00:00Z'));const days=(a,b)=>Math.floor((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000);const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);const ratesDefault=[{days:180,rate:30},{days:365,rate:50},{days:730,rate:70},{days:1095,rate:100}];
function blank(){return{version:VERSION,settings:{asof:today(),rates:structuredClone(ratesDefault),company:'Đơn vị của bạn'},receivables:[],inventory:[],snapshots:[]}}
function sample(){let d=blank();let a=[['Công ty An Phát','HD-0101',-100,120000000,0,'Bình thường'],['Công ty Bình Minh','HD-0120',-200,250000000,50000000,'Bình thường'],['Cửa hàng Lộc Tài','HD-0098',-420,80000000,0,'Bình thường'],['Công ty Hưng Phát','HD-0044',-800,150000000,20000000,'Bình thường'],['Công ty Đại Việt','HD-0010',-1200,60000000,0,'Bình thường'],['Công ty Thiên Long','HD-0150',-300,90000000,0,'Khách hàng đã phá sản, mất tích, đang bị truy tố']];d.receivables=a.map((r,i)=>({id:'SRC-R'+(i+1),customer:r[0],ref:r[1],due:dayOffset(r[2]),balance:r[3],received:r[4],special:r[5]!=='Bình thường',note:r[5],source:i+1}));let b=[['H001','Điện thoại model cũ',40,5000000,4200000],['H002','Máy tính bảng',25,6500000,6800000],['H003','Phụ kiện tồn lâu',300,150000,90000],['H004','Hàng thời trang mùa cũ',500,220000,110000]];d.inventory=b.map((r,i)=>({id:'SRC-I'+(i+1),code:r[0],name:r[1],qty:r[2],cost:r[3],nrv:r[4],source:i+1}));return d}
function valid(d){if(!d||d.version!==VERSION||!d.settings||!dateOK(d.settings.asof)||!Array.isArray(d.settings.rates)||d.settings.rates.length!==4||!Array.isArray(d.receivables)||!Array.isArray(d.inventory)||!Array.isArray(d.snapshots))return false;let ids=new Set(),refs=new Set();for(let r of d.receivables){if(!r.id||ids.has(r.id)||!r.customer?.trim()||!r.ref?.trim()||refs.has(r.ref.toUpperCase())||!dateOK(r.due)||![r.balance,r.received].every(Number.isFinite)||r.balance<0||r.received<0||r.received>r.balance)return false;ids.add(r.id);refs.add(r.ref.toUpperCase())}ids.clear();refs.clear();for(let r of d.inventory){if(!r.id||ids.has(r.id)||!r.code?.trim()||refs.has(r.code.toUpperCase())||!r.name?.trim()||![r.qty,r.cost,r.nrv].every(Number.isFinite)||r.qty<0||r.cost<0||r.nrv<0)return false;ids.add(r.id);refs.add(r.code.toUpperCase())}let prev=-1;for(let x of d.settings.rates){if(!Number.isInteger(x.days)||x.days<=prev||x.days<0||!Number.isFinite(x.rate)||x.rate<0||x.rate>100)return false;prev=x.days}return true}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(valid(x))return x}catch{}try{let x=JSON.parse(decodeURIComponent(escape(atob($('#embedded').textContent.trim()))));if(valid(x))return x}catch{}return sample()}let db=load(),page='home',search='';function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function reserve(r){let age=Math.max(0,days(db.settings.asof,r.due));let atRisk=Math.max(0,r.balance-r.received);let bracket=[...db.settings.rates].reverse().find(x=>age>=x.days);let rate=r.special?100:bracket?.rate||0;return{age,atRisk,rate,amount:Math.round(atRisk*rate/100),group:r.special?'Trường hợp đặc biệt':bracket?`Quá hạn ≥ ${bracket.days} ngày`:'Dưới ngưỡng'}}
function stock(r){let book=r.qty*r.cost,write=Math.round(r.qty*Math.max(0,r.cost-r.nrv));return{book,write,net:book-write}}
function totals(){return{receivable:sum(db.receivables,r=>reserve(r).atRisk),debt:sum(db.receivables,r=>reserve(r).amount),inventory:sum(db.inventory,r=>stock(r).book),stock:sum(db.inventory,r=>stock(r).write)}}
const navItems=[['home','◈ Tổng quan'],['debt','▤ Nợ phải thu'],['stock','▥ Hàng tồn kho'],['report','◫ Báo cáo'],['settings','⚙ Giả định'],['data','↧ Dữ liệu'],['guide','? Hướng dẫn']];function nav(){let n=navItems.map(([p,l])=>`<button data-page="${p}" class="${page===p?'active':''}">${l}</button>`).join('');$('#nav').innerHTML=n;$('#mobileNav').innerHTML=n}const card=(l,v,s='')=>`<div class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="muted">${s}</div></div>`;const panel=(h,b)=>`<section class="panel"><h2>${h}</h2>${b}</section>`;
function home(){let t=totals(),risk=db.receivables.map(r=>({...r,...reserve(r)})).filter(r=>r.amount).sort((a,b)=>b.amount-a.amount).slice(0,5);return `<section class="hero"><div><div class="eyebrow">AI Mở · Sổ ước tính rủi ro</div><h1>Nhìn rõ khoản cần dự phòng.</h1><p>Đối chiếu tuổi nợ, số tiền còn rủi ro và giá trị hàng tồn có thể thu hồi. Mọi tỷ lệ là giả định có thể chỉnh để phục vụ rà soát nội bộ.</p><div class="actions"><button class="btn primary" data-act="newDebt">+ Thêm khoản phải thu</button><button class="btn" data-act="newStock">+ Thêm hàng tồn</button></div></div><div class="hero-stat"><span>TỔNG DỰ PHÒNG ƯỚC TÍNH</span><strong>${fmt(t.debt+t.stock)}</strong><small>Ngày báo cáo ${esc(db.settings.asof)}</small></div></section><div class="cards">${card('Số dư còn rủi ro',fmt(t.receivable),db.receivables.length+' khoản')}${card('Dự phòng phải thu',fmt(t.debt),'Theo bậc tuổi nợ')}${card('Giá gốc hàng tồn',fmt(t.inventory),db.inventory.length+' mặt hàng')}${card('Giảm giá hàng tồn',fmt(t.stock),'Giá gốc so với giá trị thuần')}</div>${panel('Khoản cần rà soát trước',risk.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Khách hàng</th><th>Hồ sơ</th><th>Nhóm</th><th class="num">Ước tính</th></tr></thead><tbody>${risk.map(r=>`<tr><td>${esc(r.customer)}</td><td>${esc(r.ref)}</td><td><span class="badge alert">${esc(r.group)}</span></td><td class="num"><b>${fmt(r.amount)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có khoản nào theo giả định hiện tại.</div>')}<div class="hint">Dữ liệu mẫu dùng để thử app. Kết quả không tự xác nhận đủ điều kiện kế toán hay thuế; cần kiểm tra hồ sơ và quy định hiện hành.</div>`}
function tableDebt(){let rows=db.receivables.filter(r=>(r.customer+' '+r.ref).toLowerCase().includes(search));return `${panel('Sổ nợ phải thu',`<div class="toolbar"><input id="search" placeholder="Tìm khách hàng hoặc số hồ sơ" value="${esc(search)}"><button class="btn primary" data-act="newDebt">+ Thêm khoản</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Khách hàng / hồ sơ</th><th>Đến hạn</th><th class="num">Số dư rủi ro</th><th>Tuổi nợ</th><th class="num">Tỷ lệ</th><th class="num">Dự phòng</th><th></th></tr></thead><tbody>${rows.map(r=>{let v=reserve(r);return`<tr><td><b>${esc(r.customer)}</b><br><span class="muted">${esc(r.ref)}</span></td><td>${esc(r.due)}</td><td class="num">${fmt(v.atRisk)}</td><td>${v.age} ngày<br><span class="badge ${v.amount?'alert':''}">${esc(v.group)}</span></td><td class="num">${v.rate}%</td><td class="num"><b>${fmt(v.amount)}</b></td><td><button class="btn" data-act="editDebt" data-id="${r.id}">Sửa</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Chưa có khoản phù hợp.</td></tr>'}</tbody></table></div>`)}`}
function tableStock(){let rows=db.inventory.filter(r=>(r.name+' '+r.code).toLowerCase().includes(search));return panel('Hàng tồn kho cần đánh giá',`<div class="toolbar"><input id="search" placeholder="Tìm mã hoặc tên hàng" value="${esc(search)}"><button class="btn primary" data-act="newStock">+ Thêm mặt hàng</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Hàng hóa</th><th class="num">Số lượng</th><th class="num">Giá gốc/đv</th><th class="num">Giá trị thuần/đv</th><th class="num">Giá gốc</th><th class="num">Giảm giá</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="muted">${esc(r.code)}</span></td><td class="num">${r.qty}</td><td class="num">${fmt(r.cost)}</td><td class="num">${fmt(r.nrv)}</td><td class="num">${fmt(stock(r).book)}</td><td class="num"><b>${fmt(stock(r).write)}</b></td><td><button class="btn" data-act="editStock" data-id="${r.id}">Sửa</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa có mặt hàng phù hợp.</td></tr>'}</tbody></table></div>`) }
function report(){let t=totals();return `<div class="grid2">${panel('Tổng hợp ngày '+esc(db.settings.asof),`<div class="label">Nợ phải thu</div><div class="value">${fmt(t.debt)}</div><div class="label">Giảm giá hàng tồn</div><div class="value">${fmt(t.stock)}</div><hr><div class="label">Tổng ước tính</div><div class="value">${fmt(t.debt+t.stock)}</div><div class="actions"><button class="btn dark" data-act="snapshot">Chốt ảnh kỳ này</button><button class="btn" data-act="print">In báo cáo</button></div>`)}${panel('Lịch sử ảnh kỳ',db.snapshots.length?db.snapshots.slice().reverse().map(s=>`<div class="card" style="margin:8px 0"><b>${esc(s.asof)}</b><div class="muted">${fmt(s.debt+s.stock)} · ${s.receivableCount} khoản / ${s.inventoryCount} mặt hàng<br>Bậc: ${s.rates.map(x=>x.days+' ngày '+x.rate+'%').join('; ')}</div></div>`).join(''):'<div class="empty">Chưa chốt ảnh kỳ. Bấm nút bên trái sau khi rà soát.</div>')}</div><div class="hint">Ảnh kỳ lưu số tổng và bậc áp dụng tại thời điểm chốt. Chỉnh giả định hiện tại không làm thay đổi ảnh kỳ cũ.</div>`}
function settings(){return panel('Ngày báo cáo và bậc ước tính',`<form id="settingsForm"><div class="formgrid"><label>Ngày báo cáo<input name="asof" type="date" value="${esc(db.settings.asof)}" required></label><label>Tên đơn vị<input name="company" value="${esc(db.settings.company)}" required></label>${db.settings.rates.map((x,i)=>`<label>Bậc ${i+1}: từ ngày<input name="days${i}" type="number" min="0" step="1" value="${x.days}" required></label><label>Bậc ${i+1}: tỷ lệ %<input name="rate${i}" type="number" min="0" max="100" step="0.01" value="${x.rate}" required></label>`).join('')}</div><div class="actions"><button class="btn primary">Lưu giả định</button></div><div id="settingsError" class="error"></div></form><p class="hint">Bậc mẫu từ file tham chiếu: 180/365/730/1095 ngày và 30/50/70/100%. Cần người phụ trách kiểm tra quy định, chứng từ và căn cứ định giá trước khi sử dụng số liệu.</p>`)}
function dataView(){return panel('Dữ liệu và sao lưu',`<p>Dữ liệu lưu trên trình duyệt của máy này. Sao chép file HTML gốc sang máy khác không mang theo dữ liệu mới. Hãy tải HTML kèm dữ liệu hoặc JSON.</p><div class="actions"><button class="btn dark" data-act="exportJSON">Tải JSON</button><button class="btn dark" data-act="exportHTML">Tải HTML kèm dữ liệu</button><button class="btn" data-act="exportCSV">Tải CSV mở bằng Excel</button><button class="btn" data-act="importJSON">Khôi phục JSON</button><button class="btn warn" data-act="sample">Nạp lại mẫu</button><button class="btn warn" data-act="clear">Xóa dữ liệu</button></div><input id="jsonFile" type="file" accept=".json,application/json" class="hide"><p class="muted">Mẫu nguồn: 6 khoản nợ và 4 mặt hàng. Việc nạp mẫu hoặc xóa sẽ thay toàn bộ dữ liệu hiện có sau xác nhận.</p>`)}
function guide(){return panel('Quy trình sử dụng',`<ol><li>Chọn ngày báo cáo và xem bậc tuổi nợ tại Giả định.</li><li>Ghi từng khoản phải thu với số dư, tiền đã thu và ngày đến hạn.</li><li>Ghi từng mặt hàng với số lượng, giá gốc và giá trị thuần ước tính.</li><li>Xem báo cáo, chốt ảnh kỳ để giữ lại tổng và giả định tại thời điểm rà soát.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu trước khi đổi máy.</li></ol><p class="hint">Nợ: số rủi ro = số dư − đã thu; dự phòng = số rủi ro × tỷ lệ theo tuổi. Trường hợp đặc biệt trong mẫu = 100%. Hàng tồn: max(0, giá gốc đơn vị − giá trị thuần đơn vị) × số lượng. Đây là phép tính tham khảo, không tự thay thẩm định hay phê duyệt.</p>`)}
function render(){nav();$('#screen').innerHTML=({home,debt:tableDebt,stock:tableStock,report,settings,data:dataView,guide}[page]||home)();$('#status').textContent='Đã lưu trên thiết bị';}
let editing=null;function openForm(kind,id){editing={kind,id};let r=kind==='debt'?db.receivables.find(x=>x.id===id):db.inventory.find(x=>x.id===id);r=r||{};$('#dialogTitle').textContent=(id?'Sửa ':'Thêm ')+(kind==='debt'?'khoản phải thu':'hàng tồn');$('#formFields').innerHTML=kind==='debt'?`<label>Khách hàng<input name="customer" required value="${esc(r.customer||'')}"></label><label>Số hồ sơ/hóa đơn<input name="ref" required value="${esc(r.ref||'')}"></label><label>Ngày đến hạn<input name="due" type="date" required value="${esc(r.due||today())}"></label><label>Số dư phải thu (đ)<input name="balance" type="number" min="0" step="1" required value="${r.balance??0}"></label><label>Đã thu (đ)<input name="received" type="number" min="0" step="1" required value="${r.received??0}"></label><label>Tình trạng đặc biệt<select name="special"><option value="0">Không</option><option value="1" ${r.special?'selected':''}>Có, cần kiểm tra hồ sơ</option></select></label><label class="wide">Ghi chú căn cứ<input name="note" value="${esc(r.note||'')}"></label>`:`<label>Mã hàng<input name="code" required value="${esc(r.code||'')}"></label><label>Tên hàng<input name="name" required value="${esc(r.name||'')}"></label><label>Số lượng<input name="qty" type="number" min="0" step="0.001" required value="${r.qty??0}"></label><label>Giá gốc đơn vị (đ)<input name="cost" type="number" min="0" step="1" required value="${r.cost??0}"></label><label>Giá trị thuần đơn vị (đ)<input name="nrv" type="number" min="0" step="1" required value="${r.nrv??0}"></label>`;$('#formError').textContent='';$('#editor').showModal()}
function download(name,blob){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function jsonBlob(){return new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'})}function exportHTML(){let content=document.documentElement.outerHTML;let encoded=btoa(unescape(encodeURIComponent(JSON.stringify(db))));content=content.replace(/(<script id="embedded" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encoded+'$2');download('trich-lap-du-phong-kem-du-lieu.html',new Blob(['<!doctype html>'+content],{type:'text/html;charset=utf-8'}))}function csv(){let lines=[['Loại','Mã/Hồ sơ','Tên','Giá trị gốc/Số rủi ro','Dự phòng'],...db.receivables.map(r=>['Phải thu',r.ref,r.customer,reserve(r).atRisk,reserve(r).amount]),...db.inventory.map(r=>['Hàng tồn',r.code,r.name,stock(r).book,stock(r).write])];return '\ufeff'+lines.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-act]');if(!b)return;if(b.dataset.page){page=b.dataset.page;search='';render();scrollTo(0,0);return}let a=b.dataset.act,id=b.dataset.id;if(a==='newDebt'||a==='editDebt')openForm('debt',id);else if(a==='newStock'||a==='editStock')openForm('stock',id);else if(a==='print')print();else if(a==='snapshot'){let t=totals();db.snapshots.push({id:uid(),asof:db.settings.asof,debt:t.debt,stock:t.stock,receivableCount:db.receivables.length,inventoryCount:db.inventory.length,rates:structuredClone(db.settings.rates)});save()}else if(a==='exportJSON')download('trich-lap-du-phong.json',jsonBlob());else if(a==='exportHTML')exportHTML();else if(a==='exportCSV')download('trich-lap-du-phong.csv',new Blob([csv()],{type:'text/csv;charset=utf-8'}));else if(a==='importJSON')$('#jsonFile').click();else if(a==='sample'&&confirm('Thay toàn bộ dữ liệu bằng mẫu?')){db=sample();save()}else if(a==='clear'&&confirm('Xóa toàn bộ dữ liệu?')&&confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.')){db=blank();save()}});
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),v=k=>String(f.get(k)||'').trim(),n=k=>Number(f.get(k)),kind=editing.kind,id=editing.id;try{let a=kind==='debt'?db.receivables:db.inventory;let r=kind==='debt'?{id:id||uid(),customer:v('customer'),ref:v('ref'),due:v('due'),balance:n('balance'),received:n('received'),special:v('special')==='1',note:v('note'),source:null}:{id:id||uid(),code:v('code'),name:v('name'),qty:n('qty'),cost:n('cost'),nrv:n('nrv'),source:null};let old=a.findIndex(x=>x.id===id);let next=structuredClone(db);let target=kind==='debt'?next.receivables:next.inventory;if(old>=0)target[old]=r;else target.push(r);if(!valid(next))throw Error('Kiểm tra mã trùng, ngày, số tiền, số lượng và tiền đã thu không vượt số dư.');db=next;$('#editor').close();save()}catch(err){$('#formError').textContent=err.message}});$('#cancel').onclick=()=>$('#editor').close();$('#settingsFormDummy')?.remove();document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();let f=new FormData(e.target),rates=[0,1,2,3].map(i=>({days:Number(f.get('days'+i)),rate:Number(f.get('rate'+i))}));let next=structuredClone(db);next.settings={asof:String(f.get('asof')),company:String(f.get('company')).trim(),rates};if(!valid(next)||!next.settings.company){$('#settingsError').textContent='Kiểm tra thứ tự bậc ngày tăng dần và tỷ lệ 0–100%.';return}db=next;save()});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value.toLowerCase();let p=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(p,p)}});document.addEventListener('change',async e=>{if(e.target.id!=='jsonFile')return;try{let x=JSON.parse(await e.target.files[0].text());if(!valid(x))throw Error('Sai phiên bản hoặc dữ liệu không hợp lệ.');if(confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu?')){db=x;page='home';save()}}catch(err){alert('Không khôi phục được: '+err.message)}e.target.value=''});render();
</script></body></html>
