<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ chứng từ còn thiếu · AI Mở</title><style>:root{font-family:"Segoe UI",Arial,sans-serif;color:#192549;background:#eef1fa;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #bcc7e0;border-radius:12px;background:white;color:#192549;padding:10px 14px;font-weight:700}button:hover{border-color:#354ebe}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f4bf43;outline-offset:2px}.primary{background:#334caa;color:#fff;border-color:#334caa}.danger{color:#a83942}.brand{display:flex;gap:10px;align-items:center;min-width:165px}.brand b,.brand small{display:block}.brand small{font-size:12px;color:#b3c2e3}.icon{width:40px;height:40px;display:grid;place-items:center;background:#f5bd3b;color:#172342;border-radius:11px;font-size:21px}header{background:#172342;color:white;display:flex;align-items:center;gap:22px;padding:16px max(22px,calc((100vw - 1300px)/2));border-bottom:5px solid #f5bd3b}nav{display:flex;gap:6px;overflow:auto}nav button{white-space:nowrap;border:0;background:transparent;color:white;padding:10px 12px}nav button.active{background:#f5bd3b;color:#172342}main{max-width:1280px;margin:26px auto;padding:0 20px 50px}.hero{background:linear-gradient(115deg,#e2e9ff,#fff9e9);border:1px solid #c9d2e7;border-radius:24px;padding:30px;display:flex;justify-content:space-between;gap:24px;align-items:center}.eyebrow{font-size:12px;letter-spacing:.15em;color:#6e56a3;font-weight:800;text-transform:uppercase}h1{font-size:clamp(29px,4vw,50px);line-height:1.08;margin:12px 0;letter-spacing:-.035em}h2{margin:0 0 15px;font-size:23px}.hero p{max-width:630px;line-height:1.55}.hero-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.notice{background:#fff8e4;border-left:4px solid #e6a900;padding:12px 16px;border-radius:8px;margin:18px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.metric,.panel{background:white;border:1px solid #d4dcec;border-radius:18px;padding:20px}.metric small{display:block;color:#667493;font-weight:700}.metric strong{font-size:25px;display:block;margin:7px 0}.metric.warn{border-top:4px solid #dc8d27}.metric.late{border-top:4px solid #c74858}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{min-width:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #bfcbe0;border-radius:10px;background:#fff;padding:10px 11px;color:#192549;min-width:0}.toolbar input{flex:1;min-width:180px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:750px}td,th{text-align:left;padding:11px 9px;border-bottom:1px solid #e2e7f0;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#647293}tr:hover td{background:#f7f9ff}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e9f3e9;color:#215e3d;font-size:12px;font-weight:700}.badge.late{background:#ffe8e7;color:#a83d42}.badge.wait{background:#fff0d2;color:#855f06}.rowactions{display:flex;gap:5px}.rowactions button{padding:5px 8px;font-size:12px}.list{display:grid;gap:8px}.list article{border-left:4px solid #e4aa2a;padding:10px;background:#f5f7fc;border-radius:8px}.list article b,.list article small{display:block}.list article small{color:#67728c;margin-top:3px}.empty{padding:30px;color:#667493;text-align:center}.bar{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e2e7f0;padding:9px 0}.bar span:last-child{font-weight:700}.hint{color:#667493;line-height:1.5}dialog{border:0;border-radius:20px;padding:0;width:min(680px,calc(100vw - 28px));box-shadow:0 20px 80px #0a173b66}dialog::backdrop{background:#14203a99}dialog form{padding:24px}#fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field textarea{min-height:65px}#err{color:#a83942;min-height:20px}footer{display:flex;justify-content:flex-end;gap:8px}input[type=file]{display:none}@media(max-width:850px){header{display:block;padding:12px}.brand{margin-bottom:10px}nav{width:100%}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{padding:0 13px;margin:16px auto}.hero{display:block;padding:22px}.hero-actions{justify-content:flex-start}.metrics{gap:8px}.metric{padding:14px}.metric strong{font-size:20px;overflow-wrap:anywhere}#fields{grid-template-columns:1fr}.field.full{grid-column:auto}}@media print{header,.hero-actions,.toolbar,.rowactions,dialog{display:none!important}body{background:white}main{max-width:none;margin:0}.panel,.metric,.hero{break-inside:avoid;box-shadow:none}}
</style></head><body><header><div class="brand"><span class="icon">▤</span><span><b>AI Mở</b><small>Hồ sơ chứng từ</small></span></div><nav id="nav"></nav></header><main id="app"></main><dialog id="dlg"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><p id="err" role="alert"></p><footer><button type="button" id="cancel">Hủy</button><button class="primary">Lưu hồ sơ</button></footer></form></dialog><input type="file" id="import" accept=".json" hidden><script id="embedded" type="application/json">{}</script><script>const SOURCE=[["@-40", "Mua vật tư sửa chữa văn phòng", 8000000, "Tiền mặt", "Hóa đơn", "Nguyễn Văn An", "@-20", "Chưa bổ sung"], ["@-35", "Chi phí tiếp khách", 3000000, "Tiền mặt", "Hóa đơn", "Trần Thị Bình", "@-15", "Đã bổ sung"], ["@-25", "Thuê xe vận chuyển hàng", 12000000, "Chuyển khoản", "Hợp đồng", "Lê Văn Cường", "@-5", "Chưa bổ sung"], ["@-18", "Mua thiết bị văn phòng", 25000000, "Chuyển khoản", "Biên bản nghiệm thu", "Phạm Thị Dung", "@10", "Chưa bổ sung"], ["@-12", "Chi phí quảng cáo", 9000000, "Chuyển khoản", "Chứng từ thanh toán", "Hoàng Văn Em", "@8", "Chưa bổ sung"], ["@-6", "Chi phí công tác", 4000000, "Tiền mặt", "Bảng kê", "Vũ Thị Hà", "@3", "Chưa bổ sung"], ["@-3", "Mua văn phòng phẩm", 2000000, "Tiền mặt", "Đủ chứng từ", "Nguyễn Văn An", "", "Đã bổ sung"]];</script><script>const KEY='ai-mo-missing-documents-v1',TYPES=['Đủ chứng từ','Hóa đơn','Hợp đồng','Biên bản nghiệm thu','Chứng từ thanh toán','Bảng kê'],PAY=['Chuyển khoản','Tiền mặt'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Math.round(n||0).toLocaleString('vi-VN')+' đ',day=()=>new Date().toISOString().slice(0,10),addDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},dateOK=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s+'T12:00:00Z')),uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),copy=x=>JSON.parse(JSON.stringify(x));
const blank=()=>({version:1,asof:day(),cashLimit:5000000,records:[],events:[]});function sample(){let x=blank();x.records=SOURCE.map((r,i)=>({id:'SRC-'+(i+1),date:addDays(Number(r[0].slice(1))),description:r[1],amount:r[2],payment:r[3],missing:r[4],owner:r[5],due:r[6]?addDays(Number(r[6].slice(1))):'',status:r[7],note:'Dữ liệu mẫu gốc, dòng '+(i+1),source:i+1,history:[]}));return x}
function valid(x){if(!x||x.version!==1||!dateOK(x.asof)||!Number.isFinite(x.cashLimit)||x.cashLimit<0||!Array.isArray(x.records)||!Array.isArray(x.events))return false;let ids=new Set();return x.records.every(r=>{if(!r.id||ids.has(r.id))return false;ids.add(r.id);return dateOK(r.date)&&(!r.due||dateOK(r.due))&&typeof r.description==='string'&&r.description.trim()&&Number.isFinite(r.amount)&&r.amount>=0&&PAY.includes(r.payment)&&TYPES.includes(r.missing)&&['Chưa bổ sung','Đã bổ sung'].includes(r.status)&&Array.isArray(r.history)})}
let db=(()=>{try{let a=JSON.parse(localStorage.getItem(KEY));if(valid(a))return a}catch{}try{let a=JSON.parse($('#embedded').textContent);if(valid(a))return a}catch{}return sample()})(),page='board',search='',filter='all',editing='';function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function daysLate(r){return r.status==='Đã bổ sung'||!r.due?0:Math.max(0,Math.floor((Date.parse(db.asof+'T12:00:00Z')-Date.parse(r.due+'T12:00:00Z'))/86400000))}const open=r=>r.status!=='Đã bổ sung'&&r.missing!=='Đủ chứng từ', flagged=r=>open(r)&&r.payment==='Tiền mặt'&&r.amount>=db.cashLimit;function stats(){let a=db.records;return{all:a.length,open:a.filter(open).length,late:a.filter(r=>daysLate(r)>0).length,amount:a.filter(open).reduce((v,r)=>v+r.amount,0),flag:a.filter(flagged).length}}
const navs=[['board','◈ Tổng quan'],['records','▤ Sổ chứng từ'],['reports','▥ Báo cáo'],['settings','⚙ Cài đặt'],['data','↧ Dữ liệu'],['guide','? Hướng dẫn']];function hero(title,desc){return `<section class="hero"><div><div class="eyebrow">AI Mở · Sổ theo dõi chứng từ</div><h1>${title}</h1><p>${desc}</p></div><div class="hero-actions"><button class="primary" data-act="new">+ Thêm khoản hồ sơ</button><button data-page="records">Xem sổ →</button></div></section>`}function metric(label,value,sub,cls=''){return `<div class="metric ${cls}"><small>${label}</small><strong>${value}</strong><small>${sub}</small></div>`}function status(r){return r.status==='Đã bổ sung'?'<span class="badge">Đã bổ sung</span>':daysLate(r)>0?`<span class="badge late">Trễ ${daysLate(r)} ngày</span>`:'<span class="badge wait">Chờ bổ sung</span>'}function board(){let s=stats(),a=db.records.filter(open).sort((x,y)=>(x.due||'9999').localeCompare(y.due||'9999'));return hero('Chứng từ thiếu, rõ người xử lý.','Ghi từng hồ sơ, theo dõi hạn bổ sung và giữ lịch sử mỗi lần cập nhật.')+`<div class="notice">Đang xem dữ liệu mẫu nguồn. Tạo bộ dữ liệu riêng ở mục Dữ liệu trước khi nhập nghiệp vụ thật. Ngưỡng tiền mặt chỉ là cảnh báo nội bộ.</div><div class="metrics">${metric('Khoản chưa hoàn tất',s.open,s.all+' khoản trong sổ','warn')}${metric('Trễ hạn',s.late,'Theo ngày báo cáo '+esc(db.asof),'late')}${metric('Giá trị chờ hồ sơ',money(s.amount),'Chưa đủ chứng từ')}${metric('Cờ tiền mặt',s.flag,'Theo ngưỡng cài đặt')}</div><div class="grid"><section class="panel"><h2>Việc cần xử lý trước</h2><div class="list">${a.slice(0,8).map(r=>`<article><b>${esc(r.description)} · ${money(r.amount)}</b><small>${esc(r.owner||'Chưa giao')} · hạn ${esc(r.due||'Chưa đặt')} · ${esc(r.missing)} · ${daysLate(r)>0?'Trễ '+daysLate(r)+' ngày':'Đang theo dõi'}</small></article>`).join('')||'<div class="empty">Không có khoản nào chờ hồ sơ.</div>'}</div></section><section class="panel"><h2>Tình trạng</h2>${TYPES.slice(1).map(t=>`<div class="bar"><span>${esc(t)}</span><span>${db.records.filter(r=>open(r)&&r.missing===t).length}</span></div>`).join('')}<p class="hint">Đánh dấu “Đã bổ sung” khi đã nhận đủ chứng từ và ghi chú nơi lưu bản gốc. Dữ liệu này chỉ hỗ trợ theo dõi nội bộ.</p></section></div>`}
function records(){let a=db.records.filter(r=>(filter==='all'||filter==='open'&&open(r)||filter==='late'&&daysLate(r)>0||filter==='done'&&r.status==='Đã bổ sung')&&[r.description,r.owner,r.missing].join(' ').toLowerCase().includes(search.toLowerCase()));return `<section class="panel"><h1>Sổ chứng từ</h1><div class="toolbar"><input id="search" placeholder="Tìm nghiệp vụ, người phụ trách, chứng từ..." value="${esc(search)}"><select id="filter"><option value="all">Tất cả</option><option value="open" ${filter==='open'?'selected':''}>Chưa đủ</option><option value="late" ${filter==='late'?'selected':''}>Trễ hạn</option><option value="done" ${filter==='done'?'selected':''}>Đã bổ sung</option></select><button class="primary" data-act="new">+ Thêm khoản</button></div><div class="tablewrap"><table><thead><tr><th>Ngày · nghiệp vụ</th><th>Số tiền · thanh toán</th><th>Thiếu · phụ trách</th><th>Hạn · tình trạng</th><th>Thao tác</th></tr></thead><tbody>${a.map(r=>`<tr><td><b>${esc(r.description)}</b><br><small>${esc(r.date)}</small></td><td>${money(r.amount)}<br><small>${esc(r.payment)}${flagged(r)?' · Cờ rà soát':''}</small></td><td>${esc(r.missing)}<br><small>${esc(r.owner||'Chưa giao')}</small></td><td>${esc(r.due||'Chưa đặt')}<br>${status(r)}</td><td><div class="rowactions"><button data-act="edit" data-id="${esc(r.id)}">Sửa</button><button data-act="toggle" data-id="${esc(r.id)}">${r.status==='Đã bổ sung'?'Mở lại':'Hoàn tất'}</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Không có hồ sơ phù hợp.</td></tr>'}</tbody></table></div></section>`}
function reports(){let s=stats();return hero('Báo cáo hồ sơ.','Xem tiền và số khoản còn thiếu theo từng loại, người phụ trách và tình trạng.')+`<div class="metrics">${metric('Tổng khoản',s.all,'')}${metric('Chưa đủ',s.open,'')}${metric('Trễ hạn',s.late,'')}${metric('Giá trị chưa đủ',money(s.amount),'')}</div><div class="grid"><section class="panel"><h2>Theo loại chứng từ còn thiếu</h2>${TYPES.slice(1).map(t=>{let a=db.records.filter(r=>open(r)&&r.missing===t);return `<div class="bar"><span>${esc(t)} · ${a.length} khoản</span><span>${money(a.reduce((v,r)=>v+r.amount,0))}</span></div>`}).join('')}</section><section class="panel"><h2>Theo người phụ trách</h2>${[...new Set(db.records.map(r=>r.owner||'Chưa giao'))].map(o=>{let a=db.records.filter(r=>open(r)&&(r.owner||'Chưa giao')===o);return `<div class="bar"><span>${esc(o)} · ${a.length}</span><span>${money(a.reduce((v,r)=>v+r.amount,0))}</span></div>`}).join('')}</section></div><p><button onclick="window.print()">In báo cáo</button> <button data-act="excel">Xuất Excel</button></p>`}
function settings(){return `<section class="panel"><h1>Cài đặt</h1><form id="settingsForm"><div class="field"><label>Ngày báo cáo</label><input name="asof" type="date" value="${esc(db.asof)}" required></div><div class="field"><label>Ngưỡng tiền mặt để nhắc rà soát (đ)</label><input name="cashLimit" type="number" min="0" step="1" value="${db.cashLimit}" required></div><p class="hint">Ngưỡng chỉ điều khiển cờ nhắc nội bộ; không xác nhận chi phí hợp lệ hay điều kiện khấu trừ thuế.</p><button class="primary">Lưu cài đặt</button></form></section>`}
function dataPage(){return `<section class="panel"><h1>Dữ liệu và sao lưu</h1><p class="hint">Dữ liệu tự lưu trong trình duyệt của thiết bị hiện tại. Sao chép file HTML gốc không mang theo tiến độ; dùng JSON hoặc HTML kèm dữ liệu để chuyển máy.</p><div class="toolbar"><button data-act="json">Tải JSON</button><button data-act="html">Tải HTML kèm dữ liệu</button><button data-act="import">Khôi phục JSON</button><button data-act="excel">Xuất Excel</button><button data-act="clear" class="danger">Bắt đầu dữ liệu trống</button><button data-act="sample">Nạp lại mẫu</button></div><h2>Nhật ký gần đây</h2><div class="list">${db.events.slice(-15).reverse().map(e=>`<article><b>${esc(e.action)}</b><small>${esc(e.at)} · ${esc(e.detail)}</small></article>`).join('')||'<div class="empty">Chưa có thay đổi nào.</div>'}</div></section>`}function guide(){return `<section class="panel"><h1>Cách sử dụng</h1><ol><li>Ở Sổ chứng từ, thêm mỗi khoản thiếu hồ sơ thành một dòng, giao người phụ trách và hạn.</li><li>Lọc “Trễ hạn” để gọi nhắc; cập nhật ghi chú khi nhận thêm tài liệu.</li><li>Khi đủ hồ sơ, đổi tình trạng thành “Đã bổ sung”. Nhật ký giữ lần cập nhật.</li><li>Xem báo cáo theo loại, người phụ trách; sao lưu JSON hoặc HTML kèm dữ liệu thường xuyên.</li></ol><p class="notice">Đây là sổ theo dõi nội bộ. Nội dung chứng từ và việc tuân thủ thuế phải được kiểm tra theo quy định hiện hành.</p></section>`}
function render(){let n=$('#nav');n.innerHTML=navs.map(([k,t])=>`<button data-page="${k}" class="${k===page?'active':''}">${t}</button>`).join('');$('#app').innerHTML=({board,records,reports,settings,data:dataPage,guide}[page]||board)()}
function field(name,label,type,value,opts){let control=opts?`<select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}">${esc(value||'')}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value||'')}" ${type==='number'?'min="0" step="1"':''}>`;return `<div class="field ${name==='description'||name==='note'?'full':''}"><label>${label}</label>${control}</div>`}function form(id=''){editing=id;let r=db.records.find(x=>x.id===id)||{date:day(),description:'',amount:'',payment:PAY[0],missing:TYPES[1],owner:'',due:'',status:'Chưa bổ sung',note:''};$('#formTitle').textContent=id?'Sửa khoản hồ sơ':'Thêm khoản hồ sơ';$('#fields').innerHTML=field('date','Ngày phát sinh','date',r.date)+field('description','Nội dung nghiệp vụ *','text',r.description)+field('amount','Số tiền (đ) *','number',r.amount)+field('payment','Hình thức thanh toán','',r.payment,PAY)+field('missing','Chứng từ còn thiếu','',r.missing,TYPES)+field('owner','Người phụ trách','text',r.owner)+field('due','Hạn bổ sung','date',r.due)+field('status','Tình trạng','',r.status,['Chưa bổ sung','Đã bổ sung'])+field('note','Ghi chú / nơi lưu bản gốc','textarea',r.note);$('#err').textContent='';$('#dlg').showModal()}
function log(action,detail){db.events.push({at:new Date().toISOString(),action,detail})}$('#form').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f),amount=Number(v.amount);if(!dateOK(v.date)||!v.description.trim()||!Number.isFinite(amount)||amount<0||!Number.isInteger(amount)||v.due&&!dateOK(v.due)){ $('#err').textContent='Kiểm tra ngày, nội dung và số tiền nguyên không âm.';return}if(v.due&&v.due<v.date){$('#err').textContent='Hạn bổ sung phải từ ngày phát sinh trở đi.';return}v.amount=amount;let old=db.records.find(r=>r.id===editing);if(old){let h=old.history||[];h.push({at:new Date().toISOString(),status:v.status,note:v.note});Object.assign(old,v,{history:h});log('Cập nhật hồ sơ',v.description)}else{db.records.push({...v,id:uid(),history:[{at:new Date().toISOString(),status:v.status,note:v.note}]});log('Thêm hồ sơ',v.description)}$('#dlg').close();save()});$('#cancel').onclick=()=>$('#dlg').close();$('#settingsForm')?.addEventListener('submit',()=>{});
document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();let f=new FormData(e.target),v=Number(f.get('cashLimit'));if(!dateOK(f.get('asof'))||!Number.isInteger(v)||v<0)return alert('Cài đặt không hợp lệ.');db.asof=f.get('asof');db.cashLimit=v;log('Cập nhật cài đặt','Ngày '+db.asof);save()});
function download(name,text,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function excel(){let rows=[['Ngày','Nội dung','Số tiền','Thanh toán','Chứng từ thiếu','Phụ trách','Hạn','Tình trạng','Trễ ngày','Ghi chú'],...db.records.map(r=>[r.date,r.description,r.amount,r.payment,r.missing,r.owner,r.due,r.status,daysLate(r),r.note])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download('so-chung-tu.csv',csv,'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-act]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}let a=b.dataset.act,id=b.dataset.id;if(a==='new')form();if(a==='edit')form(id);if(a==='toggle'){let r=db.records.find(x=>x.id===id);if(!r)return;r.status=r.status==='Đã bổ sung'?'Chưa bổ sung':'Đã bổ sung';r.history.push({at:new Date().toISOString(),status:r.status,note:'Đổi nhanh tình trạng'});log('Đổi tình trạng',r.description+' · '+r.status);save()}if(a==='json')download('ho-so-chung-tu.json',JSON.stringify(db,null,2),'application/json');if(a==='html'){let h=document.documentElement.outerHTML.replace(/<script id="embedded" type="application\/json">[\s\S]*?<\/script>/,`<script id="embedded" type="application/json">${JSON.stringify(db).replaceAll('<','\\u003c')}<\/script>`);download('ho-so-chung-tu-co-du-lieu.html','<!doctype html>'+h,'text/html;charset=utf-8')}if(a==='import')$('#import').click();if(a==='excel')excel();if(a==='clear'&&confirm('Xóa dữ liệu hiện tại? Hãy sao lưu trước.')&&confirm('Xác nhận xóa toàn bộ hồ sơ?')){db=blank();save()}if(a==='sample'&&confirm('Nạp lại mẫu sẽ thay dữ liệu hiện tại?')){db=sample();save()}});$('#import').addEventListener('change',async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!valid(v))throw Error('Dữ liệu không hợp lệ hoặc sai phiên bản.');if(confirm('Thay toàn bộ dữ liệu hiện tại?')){db=v;save()}}catch(x){alert(x.message)}e.target.value=''});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let t=$('#search');t.focus();t.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}});render();
</script></body></html>
