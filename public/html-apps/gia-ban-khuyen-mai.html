function productErrors(p,list=data.products,oldId=null){let e=[];if(!String(p.code||'').trim())e.push('Thiếu mã sản phẩm.');if(list.some(x=>x.id!==oldId&&x.code===p.code))e.push('Mã sản phẩm đã tồn tại.');if(!String(p.name||'').trim())e.push('Thiếu tên sản phẩm.');for(let [key,label,type] of PRODUCT_FIELDS){let v=p[key];if(['money','quantity'].includes(type)&&(!integer(v)||Number(v)<0))e.push(label+' phải là số nguyên không âm.');if(type==='percent'&&(!number(v)||Number(v)<0||Number(v)>100||(key==='feePct'&&Number(v)>=100)))e.push(label+' phải ở khoảng hợp lệ.')}return e}
function scenarioErrors(s,list=data.scenarios,oldId=null){let e=[];if(!String(s.name||'').trim())e.push('Thiếu tên phương án.');if(!data.products.some(p=>p.code===s.productCode))e.push('Sản phẩm không tồn tại.');if(!['percent','amount'].includes(s.discountKind))e.push('Kiểu giảm không hợp lệ.');if(!number(s.discountValue)||Number(s.discountValue)<0)e.push('Mức giảm không hợp lệ.');if(s.discountKind==='percent'&&Number(s.discountValue)>100)e.push('Giảm % không vượt 100.');if(s.discountKind==='amount'&&!integer(s.discountValue))e.push('Giảm tiền phải là số nguyên đồng.');let product=data.products.find(p=>p.code===s.productCode);if(s.discountKind==='amount'&&product&&Number(s.discountValue)>Number(product.listPrice))e.push('Giảm tiền không vượt giá niêm yết.');if(!number(s.feePct)||Number(s.feePct)<0||Number(s.feePct)>=100)e.push('Phí % phải từ 0 đến dưới 100.');if(!integer(s.feeFixed)||Number(s.feeFixed)<0)e.push('Phí cố định không hợp lệ.');if(!integer(s.qty)||Number(s.qty)<0)e.push('Số lượng không hợp lệ.');return e}
function validateState(x){let previous=data,errors=settingsErrors(x.settings);data=x;try{if(x.products.length>500)errors.push('Quá 500 sản phẩm.');if(x.scenarios.length>1000)errors.push('Quá 1000 phương án.');for(let kind of ['products','scenarios']){let ids=new Set();for(let r of x[kind]){if(!r.id||ids.has(r.id))errors.push(kind+': ID thiếu hoặc trùng.');ids.add(r.id);errors.push(...(kind==='products'?productErrors(r,x.products,r.id):scenarioErrors(r,x.scenarios,r.id)).map(t=>(r.code||r.name||kind)+': '+t))}}}finally{data=previous}return errors}
function persist(){data.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Trình duyệt không lưu được dữ liệu. Hãy tải HTML kèm dữ liệu hoặc sao lưu JSON.')}render()}
function formatPct(v){return v===null?'—':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:1})+'%'}
function minPriceAtTarget(cost,feePct,feeFixed,kind,discount,target){if(feePct+target>=100||(kind==='percent'&&discount>=100))return null;const enough=list=>{let net=kind==='percent'?Math.round(list*(1-discount/100)):Math.max(0,list-discount),fee=Math.round(net*feePct/100)+feeFixed;return net>0&&net-cost-fee>=net*target/100-1e-9};let hi=Math.max(1,cost+feeFixed+discount);while(!enough(hi)&&hi<1e12)hi*=2;if(!enough(hi))return null;let lo=0;while(lo<hi){let mid=Math.floor((lo+hi)/2);if(enough(mid))hi=mid;else lo=mid+1}return lo}
function calculate(product,promo=null){let list=Number(product.listPrice)||0,cost=(Number(product.cost)||0)+(Number(product.other)||0),kind=promo?.discountKind||'percent',discount=Number(promo?.discountValue??product.discount)||0,feePct=Number(promo?.feePct??product.feePct)||0,feeFixed=Number(promo?.feeFixed??product.feeFixed)||0,qty=Number(promo?.qty??product.qty)||0,target=Number(data.settings.target)||0;
  let net=kind==='percent'?Math.round(list*(1-discount/100)):Math.max(0,list-discount),fee=Math.round(net*feePct/100)+feeFixed,profit=net-cost-fee,margin=net>0?profit/net*100:null,breakEvenList=minPriceAtTarget(cost,feePct,feeFixed,kind,discount,0),minList=minPriceAtTarget(cost,feePct,feeFixed,kind,discount,target),maxDiscount=null;
  if(list>0&&feePct+target<100){let enough=d=>{let price=Math.round(list*(1-d/100)),costFee=Math.round(price*feePct/100)+feeFixed;return price>0&&price-cost-costFee>=price*target/100-1e-9};if(enough(0)){let lo=0,hi=1000;while(lo<hi){let mid=Math.ceil((lo+hi)/2);if(enough(mid/10))lo=mid;else hi=mid-1}maxDiscount=lo/10}}
  let warnings=[];if(!Number.isSafeInteger(net)||!Number.isSafeInteger(fee)||!Number.isSafeInteger(profit*qty))warnings.push('Số tiền vượt giới hạn chính xác.');if(net===0)warnings.push('Giá sau giảm bằng 0.');if(profit<0)warnings.push('Bán lỗ.');else if(margin!==null&&margin<target-0.00001)warnings.push('Dưới biên lãi mục tiêu.');if(feePct+target>=100)warnings.push('Phí % cộng mục tiêu ≥ 100%, không thể tính giá mục tiêu.');if(qty===0)warnings.push('Số lượng dự kiến bằng 0.');return {...product,discountKind:kind,discountValue:discount,feePct,feeFixed,qty,net,costAll:cost,fee,profit,margin,breakEvenList,minList,maxDiscount,total:profit*qty,warnings};
}
function computedProducts(){return data.products.map(p=>calculate(p))}
function computedScenarios(){return data.scenarios.map(s=>{let p=data.products.find(x=>x.code===s.productCode);return p?{...calculate(p,s),id:s.id,scenarioName:s.name,productCode:s.productCode}:null}).filter(Boolean)}
function sum(rows,key){return rows.reduce((a,r)=>a+(Number(r[key])||0),0)}

function productTable(rows){if(!rows.length)return '<div class="empty">Chưa có sản phẩm trong danh sách.</div>';return '<div class="table-wrap"><table><thead><tr><th>Mã / sản phẩm</th><th class="num">Giá niêm yết</th><th class="num">Giảm</th><th class="num">Giá sau giảm</th><th class="num">Hòa vốn</th><th class="num">Lãi / SP</th><th class="num">Biên lãi</th><th class="num">Giá tối thiểu</th><th class="num">Tổng lãi dự kiến</th><th>Trạng thái</th><th class="no-print">Mở</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.code)+'</b><br>'+esc(r.name)+'</td><td class="num">'+money(r.listPrice)+'</td><td class="num">'+formatPct(r.discount)+'</td><td class="num">'+money(r.net)+'</td><td class="num">'+(r.breakEvenList===null?'—':money(r.breakEvenList))+'</td><td class="num '+(r.profit<0?'bad':'good')+'">'+money(r.profit)+'</td><td class="num">'+formatPct(r.margin)+'</td><td class="num">'+(r.minList===null?'Không tính được':money(r.minList))+'</td><td class="num">'+money(r.total)+'</td><td>'+pill(r)+'</td><td class="no-print"><button class="btn small" data-action="detail" data-id="'+esc(r.id)+'">Chi tiết</button></td></tr>').join('')+'</tbody></table></div>'}

function updateSimResult(){let p=data.products.find(x=>x.code===sim.productCode),target=$('#simResult');if(!p||!target)return;let s={...sim,productCode:p.code},errors=scenarioErrors({...s,name:s.name||'Tính thử'});if(errors.length){$('#simError').textContent=errors.join(' ');target.innerHTML='';return}$('#simError').textContent='';let base=calculate(p),r=calculate(p,s),delta=r.profit-base.profit;target.innerHTML='<div class="grid">'+metric('Giá sau giảm',money(r.net),'Giá niêm yết '+money(p.listPrice))+metric('Lãi / sản phẩm',money(r.profit),'Chênh với giá đang lưu: '+money(delta),r.profit<0?'bad':'good')+metric('Biên lãi',formatPct(r.margin),'Mục tiêu '+formatPct(data.settings.target),r.margin!==null&&r.margin<data.settings.target?'warn':'good')+metric('Tổng lãi dự kiến',money(r.total),r.qty+' sản phẩm')+'</div><p class="hint">Hòa vốn ở giá niêm yết: '+(r.breakEvenList===null?'không tính được':money(r.breakEvenList))+' · Giá niêm yết tối thiểu đạt mục tiêu: '+(r.minList===null?'không tính được':money(r.minList))+' · Giảm tối đa tại giá hiện tại: '+(r.maxDiscount===null?'Không đạt mục tiêu dù không giảm':formatPct(r.maxDiscount))+'</p>'+(r.warnings.length?'<p class="notice bad">'+esc(r.warnings.join(' · '))+'</p>':'')}

function dataPage(){return hero('Dữ liệu & sao lưu','App chạy offline và lưu dữ liệu trên trình duyệt của máy đang dùng.')+'<div class="card"><h2>Xuất dữ liệu</h2><div class="toolbar"><button class="btn primary" data-action="saveHtml">Tải HTML kèm dữ liệu</button><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="excel">Xuất bộ Excel</button><button class="btn" data-action="reportCsv">Xuất báo cáo CSV</button></div><p class="muted">Sau mỗi lần thay đổi, tải lại bản HTML mới nhất nếu muốn mang cả dữ liệu sang máy khác.</p></div><div class="card"><h2>Nhập và khôi phục</h2><div class="toolbar"><label class="btn file">Khôi phục JSON<input type="file" accept=".json,application/json" data-import="json"></label><label class="btn file">Nhập bộ Excel<input type="file" accept=".xlsx" data-import="xlsx"></label><button class="btn" data-action="demo">Nạp dữ liệu mẫu</button><button class="btn danger" data-action="clear">Xóa dữ liệu</button></div><p class="hint">Khôi phục JSON, nhập bộ Excel hoặc nạp mẫu sẽ thay dữ liệu hiện tại. Hãy sao lưu trước.</p></div><div class="card"><h2>CSV từng bảng</h2><div class="grid">'+[['products','Sản phẩm',data.products.length],['scenarios','Phương án khuyến mãi',data.scenarios.length]].map(([k,label,count])=>'<div class="metric"><b>'+label+'</b><p>'+count+' dòng</p><button class="btn small" data-action="csv" data-kind="'+k+'">Xuất CSV</button> <label class="btn small file">Nhập CSV<input type="file" accept=".csv,text/csv" data-import="'+k+'"></label></div>').join('')+'</div></div>'}
function render(){let labels={overview:'Tổng quan',products:'Sản phẩm',simulator:'Tính thử nhanh',scenarios:'Phương án khuyến mãi',issues:'Cần kiểm tra',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=labels[page];$('#topSub').textContent=(data.settings.company||'Chưa đặt tên đơn vị')+' · mục tiêu '+formatPct(data.settings.target);$$('[data-page]',$('.side-nav')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=page==='overview'?overview():page==='products'?productsPage():page==='simulator'?simForm():page==='scenarios'?scenariosPage():page==='issues'?issuesPage():page==='report'?reportPage():page==='settings'?settingsPage():page==='data'?dataPage():guidePage();if(page==='products')$('#sort').value=sortKey;if(page==='simulator')updateSimResult()}
function navigate(p){page=p;filter='';sortKey='code';sortDir=1;if(p==='simulator'&&!sim.productCode&&data.products.length)selectSimProduct(data.products[0].code);render();window.scrollTo(0,0)}
function field(kind,[key,label,type],value){let opts=type==='product'?data.products.map(p=>[p.code,p.code+' · '+p.name]):type==='discountKind'?[['percent','Giảm %'],['amount','Giảm tiền']]:null;return '<div class="field"><label for="f-'+key+'">'+esc(label)+'</label>'+(opts?'<select id="f-'+key+'" name="'+key+'">'+opts.map(([v,t])=>'<option value="'+esc(v)+'" '+(value[key]===v?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>':'<input id="f-'+key+'" name="'+key+'" type="'+(['money','percent','quantity','number'].includes(type)?'number':'text')+'" '+(['money','quantity'].includes(type)?'min="0" step="1"':['percent','number'].includes(type)?'min="0" step="0.01"':'')+' value="'+esc(value[key]??'')+'">')+'</div>'}
function openEditor(kind,id=null){if(kind==='scenarios'&&!data.products.length){alert('Hãy thêm sản phẩm trước.');return}let row=id?data[kind].find(x=>x.id===id):null;if(id&&!row)return;editing={kind,id};let defaults=kind==='products'?{cost:0,other:0,listPrice:0,discount:0,feePct:0,feeFixed:0,qty:0}:{productCode:focusProduct||data.products[0].code,discountKind:'percent',discountValue:0,feePct:0,feeFixed:0,qty:1};$('#modalTitle').textContent=(row?'Sửa ':'Thêm ')+(kind==='products'?'sản phẩm':'phương án');$('#modalFields').innerHTML=(kind==='products'?PRODUCT_FIELDS:SCENARIO_FIELDS).map(f=>field(kind,f,{...defaults,...row})).join('');$('#modalError').textContent='';$('#editor').showModal();$('#modalFields input')?.focus()}
function saveEditor(){let {kind,id}=editing,fields=kind==='products'?PRODUCT_FIELDS:SCENARIO_FIELDS,row={};for(let [key,,type] of fields){let raw=$('[name="'+key+'"]',$('#modalFields')).value.trim();row[key]=['money','percent','quantity','number'].includes(type)?raw===''?'':Number(raw):raw}let old=id?data[kind].find(x=>x.id===id):null,errors=kind==='products'?productErrors(row,data.products,id):scenarioErrors(row,data.scenarios,id);if(old&&kind==='products'&&old.code!==row.code&&data.scenarios.some(s=>s.productCode===old.code))errors.push('Mã sản phẩm đang được phương án tham chiếu; cần giữ nguyên.');if(!old&&data[kind].length>=(kind==='products'?500:1000))errors.push('Đã đạt giới hạn số dòng.');if(errors.length){$('#modalError').textContent=errors.join(' ');return}if(old)Object.assign(old,row);else data[kind].push({id:uid(),...row});$('#editor').close();persist()}
function deleteRow(kind,id){let row=data[kind].find(x=>x.id===id);if(!row)return;if(kind==='products'&&data.scenarios.some(s=>s.productCode===row.code)){alert('Sản phẩm đang được phương án tham chiếu. Hãy xử lý phương án trước.');return}if(!confirm('Xóa '+(kind==='products'?'sản phẩm ':'phương án ')+(row.code||row.name)+'?'))return;data[kind]=data[kind].filter(x=>x.id!==id);persist()}
function detail(id){let r=computedProducts().find(x=>x.id===id);if(!r)return;focusProduct=r.code;page='products';render();let wrap=document.createElement('section');wrap.className='card';wrap.id='detail';wrap.innerHTML='<div class="toolbar"><h2 class="grow">'+esc(r.code)+' · '+esc(r.name)+'</h2><button class="btn" data-action="edit" data-kind="products" data-id="'+esc(r.id)+'">Sửa</button><button class="btn danger" data-action="delete" data-kind="products" data-id="'+esc(r.id)+'">Xóa</button><button class="btn primary" data-action="simulate" data-code="'+esc(r.code)+'">Tính thử khuyến mãi</button></div><div class="grid">'+metric('Giá sau giảm',money(r.net),'Niêm yết '+money(r.listPrice)+' · giảm '+formatPct(r.discount))+metric('Giá vốn + chi phí',money(r.costAll),'Phí bán hàng '+money(r.fee))+metric('Lãi / sản phẩm',money(r.profit),'Biên lãi '+formatPct(r.margin),r.profit<0?'bad':'good')+metric('Tổng lãi dự kiến',money(r.total),r.qty+' sản phẩm')+'</div><p class="hint">Giá niêm yết hòa vốn: '+(r.breakEvenList===null?'không tính được':money(r.breakEvenList))+' · Giá niêm yết tối thiểu để đạt '+formatPct(data.settings.target)+': '+(r.minList===null?'không tính được':money(r.minList))+' · Giảm tối đa tại giá hiện tại: '+(r.maxDiscount===null?'không đạt mục tiêu dù không giảm':formatPct(r.maxDiscount))+'</p>'+(r.warnings.length?'<p class="notice bad">'+esc(r.warnings.join(' · '))+'</p>':'');$('#screen').prepend(wrap);wrap.scrollIntoView({behavior:'smooth',block:'start'})}
function selectSimProduct(code){let p=data.products.find(x=>x.code===code);if(!p)return;sim={name:'',productCode:code,discountKind:'percent',discountValue:p.discount,feePct:p.feePct,feeFixed:p.feeFixed,qty:p.qty}}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(rows){return '\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportCSV(kind){let fields=kind==='products'?PRODUCT_FIELDS:SCENARIO_FIELDS;download('gia-ban-'+kind+'.csv','text/csv;charset=utf-8',csv([fields.map(f=>f[1]),...data[kind].map(r=>fields.map(f=>r[f[0]]))]))}
function reportCSV(){let rows=computedProducts();download('gia-ban-bao-cao.csv','text/csv;charset=utf-8',csv([['Mã','Tên sản phẩm','Giá vốn','Chi phí khác','Giá niêm yết','Giảm %','Phí %','Phí cố định','Số lượng','Giá sau giảm','Hòa vốn niêm yết','Lãi / SP','Biên lãi %','Giá niêm yết tối thiểu','Giảm tối đa %','Tổng lãi dự kiến','Cảnh báo'],...rows.map(r=>[r.code,r.name,r.cost,r.other,r.listPrice,r.discount,r.feePct,r.feeFixed,r.qty,r.net,r.breakEvenList??'',r.profit,r.margin??'',r.minList??'',r.maxDiscount??'',r.total,r.warnings.join('; ')])]))}
function excelExport(){let sheets=[{name:'Cài đặt',rows:[['Thông số','Giá trị'],['Tên đơn vị',data.settings.company],['Ngày báo cáo',data.settings.asof],['Biên lãi mục tiêu (%)',data.settings.target]]},{name:'Sản phẩm',rows:[PRODUCT_FIELDS.map(f=>f[1]),...data.products.map(r=>PRODUCT_FIELDS.map(([key])=>r[key]))]},{name:'Phương án',rows:[SCENARIO_FIELDS.map(f=>f[1]),...data.scenarios.map(r=>SCENARIO_FIELDS.map(([key])=>r[key]))]},{name:'Báo cáo',rows:[['Mã','Tên','Giá sau giảm','Lãi / SP','Biên lãi %','Giá tối thiểu','Tổng lãi dự kiến','Cảnh báo'],...computedProducts().map(r=>[r.code,r.name,r.net,r.profit,r.margin??'',r.minList??'',r.total,r.warnings.join('; ')])]}],blob=Excel.workbook(sheets),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gia-ban-khuyen-mai-bo-du-lieu.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download('gia-ban-khuyen-mai-sao-luu.json','application/json;charset=utf-8',JSON.stringify(data,null,2))}
function saveHtml(){let copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(data))));download('ai-mo-gia-ban-khuyen-mai-kem-du-lieu.html','text/html;charset=utf-8','<!doctype html>\n'+copy.outerHTML)}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV thiếu dấu nháy đóng.');if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(v=>v!==''))}
function rowsToRecords(rows,fields,kind){if(!rows||fields.some((f,i)=>rows[0]?.[i]!==f[1]))throw Error('Thiếu sheet/cột '+kind+' đúng mẫu.');return rows.slice(1).filter(row=>row.some(v=>v!==''&&v!==undefined&&v!==null)).map(row=>{let r={id:uid()};fields.forEach(([key,,type],i)=>r[key]=['money','percent','quantity','number'].includes(type)?row[i]===''?'':Number(row[i]):String(row[i]??'').trim());return r})}
async function importCSV(kind,file){let rows=parseCSV(await file.text()),fields=kind==='products'?PRODUCT_FIELDS:SCENARIO_FIELDS,proposed=rowsToRecords(rows,fields,kind),candidate={...data,[kind]:[...data[kind],...proposed]},errors=validateState(candidate);if(errors.length)throw Error('CSV có '+errors.length+' lỗi: '+errors.slice(0,6).join(' '));if(!proposed.length)throw Error('Không có dòng dữ liệu.');if(!confirm('Thêm '+proposed.length+' dòng '+kind+' đã kiểm tra?'))return;data=candidate;persist();alert('Đã nhập '+proposed.length+' dòng.')}
function workbookToState(book){let settings=book['Cài đặt'];if(!settings||settings[0]?.[0]!=='Thông số'||settings[0]?.[1]!=='Giá trị')throw Error('Sheet Cài đặt không đúng mẫu.');let s=Object.fromEntries(settings.slice(1).map(r=>[String(r[0]),r[1]])),candidate=empty();candidate.settings={company:String(s['Tên đơn vị']??''),asof:String(s['Ngày báo cáo']??''),target:s['Biên lãi mục tiêu (%)']};candidate.products=rowsToRecords(book['Sản phẩm'],PRODUCT_FIELDS,'Sản phẩm');candidate.scenarios=rowsToRecords(book['Phương án'],SCENARIO_FIELDS,'Phương án');let errors=validateState(candidate);if(errors.length)throw Error('Excel có '+errors.length+' lỗi: '+errors.slice(0,6).join(' '));return candidate}
function sample(){let d=empty();d.settings={company:'Cửa hàng Minh Họa',asof:today(),target:20};d.products=[['SP01','Áo thun cotton',65000,8000,159000,0,300],['SP02','Quần jeans nam',180000,12000,390000,10,120],['SP03','Váy hoa nữ',120000,10000,289000,15,150],['SP04','Túi xách da',210000,15000,450000,20,60],['SP05','Giày thể thao',260000,20000,520000,25,80],['SP06','Mũ lưỡi trai',25000,5000,79000,30,200],['SP07','Dây nịt da',55000,6000,119000,0,90]].map(a=>({id:uid(),code:a[0],name:a[1],cost:a[2],other:a[3],listPrice:a[4],discount:a[5],feePct:0,feeFixed:0,qty:a[6]}));return d}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){navigate(b.dataset.page);return}let action=b.dataset.action,kind=b.dataset.kind,id=b.dataset.id;if(action==='new')openEditor(kind);if(action==='edit')openEditor(kind,id);if(action==='delete')deleteRow(kind,id);if(action==='detail')detail(id);if(action==='simulate'){selectSimProduct(b.dataset.code);navigate('simulator')}if(action==='sortdir'){sortDir*=-1;render()}if(action==='csv')exportCSV(kind);if(action==='reportCsv')reportCSV();if(action==='excel')excelExport();if(action==='backup')backup();if(action==='saveHtml')saveHtml();if(action==='print')window.print();if(action==='saveSettings'){let raw=$('#s-target').value,s={company:$('#s-company').value.trim(),asof:$('#s-asof').value,target:raw===''?'':Number(raw)},errors=settingsErrors(s);if(errors.length){$('#settingsError').textContent=errors.join(' ');return}data.settings=s;persist()}if(action==='saveScenario'){let s={...sim,name:sim.name.trim()},errors=scenarioErrors(s);if(data.scenarios.length>=1000)errors.push('Đã đủ 1000 phương án.');if(errors.length){$('#simError').textContent=errors.join(' ');return}data.scenarios.push({id:uid(),...s});persist();navigate('scenarios')}if(action==='demo'){if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng dữ liệu mẫu?'))return;data=sample();persist();navigate('overview')}if(action==='clear'){if(!confirm('Xóa toàn bộ sản phẩm và phương án? Hãy sao lưu trước.'))return;data=empty();persist();navigate('overview')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;let pos=e.target.selectionStart;render();let input=$('#search');input.focus();input.setSelectionRange(pos,pos)}if(e.target.id?.startsWith('sim-')){let key=e.target.id.slice(4);sim[key]=['discountValue','feePct','feeFixed','qty'].includes(key)?e.target.value===''?'':Number(e.target.value):e.target.value;updateSimResult()}});
document.addEventListener('change',async e=>{if(e.target.id==='sort'){sortKey=e.target.value;render()}if(e.target.id==='sim-productCode'){selectSimProduct(e.target.value);render()}if(e.target.id==='sim-discountKind'){sim.discountKind=e.target.value;render()}if(e.target.dataset.import){let kind=e.target.dataset.import,file=e.target.files[0];if(!file)return;try{if(kind==='json'){let x=clean(JSON.parse(await file.text()));if(!x)throw Error('File không đúng ứng dụng hoặc phiên bản.');let errors=validateState(x);if(errors.length)throw Error('Bản sao lưu có '+errors.length+' lỗi: '+errors.slice(0,5).join(' '));if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu?'))return;data=x;persist();alert('Đã khôi phục.')}else if(kind==='xlsx'){let x=workbookToState(await Excel.read(file));if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng '+x.products.length+' sản phẩm và '+x.scenarios.length+' phương án?'))return;data=x;persist();alert('Đã nhập bộ Excel.')}else await importCSV(kind,file)}catch(err){alert(err.message)}finally{e.target.value=''}}});
$('#modalClose').onclick=$('#modalCancel').onclick=()=>$('#editor').close();$('#modalSave').onclick=saveEditor;$('#quickPrint').onclick=()=>window.print();render();

</script></body></html>
