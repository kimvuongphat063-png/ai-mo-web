<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bảng tổng hợp GTGT · AI Mở</title><style>:root{font-family:'Segoe UI',Arial,sans-serif;color:#173c31;background:#f8f6ed}*{box-sizing:border-box}body{margin:0;overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}header{background:#123c31;color:white;padding:14px max(16px,calc((100vw - 1200px)/2));display:flex;align-items:center;gap:25px;border-bottom:5px solid #d5aa4e}header b{white-space:nowrap;font-size:20px}header small{font-size:11px;color:#cce1d4}nav{display:flex;gap:4px;overflow:auto}nav button{border:0;background:transparent;color:#e9f0e8;padding:10px;white-space:nowrap;border-radius:8px;font-weight:700}nav button.active{background:#e9d39d;color:#123c31}main{max-width:1200px;margin:auto;padding:24px 16px 60px}.hero{background:#e9eddf;border:1px solid #c8d7c9;border-radius:20px;padding:28px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}.eyebrow{color:#9c7034;font-weight:800;letter-spacing:.13em;font-size:11px;text-transform:uppercase}h1{font-size:clamp(27px,4vw,42px);letter-spacing:-.04em;line-height:1.07;margin:9px 0}p{line-height:1.5}.hero p{color:#5b7364}.hero aside{background:#123c31;color:white;padding:23px;border-radius:15px}.hero aside strong{display:block;font-size:clamp(24px,3vw,34px);overflow-wrap:anywhere}.hero aside small{color:#d4e6d9}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.btn{background:white;color:#1c4236;border:1px solid #b7cbbd;border-radius:8px;padding:9px 13px;font-weight:700}.btn.primary{background:#d7aa49;border-color:#d7aa49}.btn.danger{color:#a74734}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e39c64;outline-offset:2px}.notice{background:#fff4da;padding:12px 15px;border-left:4px solid #d7aa49;border-radius:8px;margin:16px 0;color:#654c31}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.metric,.panel{background:#fff;border:1px solid #dbe4d8;border-radius:14px;padding:17px;min-width:0}.metric span{font-size:12px;font-weight:800;color:#5b7565;text-transform:uppercase}.metric strong{display:block;font-size:clamp(19px,2.3vw,26px);margin-top:8px;overflow-wrap:anywhere}.metric.warn{border-top:4px solid #c7664d}.metric.good{border-top:4px solid #4c9977}.panel{margin:15px 0}.panel h2{margin:0 0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:740px}th,td{border-bottom:1px solid #e5ece4;padding:9px;text-align:left}th{background:#f0f4ec;color:#526c5d;font-size:12px;text-transform:uppercase}td.num,th.num{text-align:right;white-space:nowrap}.badge{border-radius:5px;background:#eaf3e8;padding:4px 6px;font-size:12px}.badge.warn{background:#ffede2;color:#a64234}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:12px;font-weight:700}.field input,.field select{min-height:42px;padding:9px;border:1px solid #bacdbd;border-radius:7px;width:100%}.error,#error{color:#a54332;font-weight:700}.muted{color:#657d6b}.rowbtn{white-space:nowrap}.rowbtn button{border:0;background:#e9f2e9;border-radius:6px;padding:6px}.rowbtn button:last-child{color:#a54332}dialog{border:0;border-radius:14px;padding:24px;box-shadow:0 20px 70px #123c3166;width:min(650px,calc(100vw - 22px))}dialog::backdrop{background:#112e2888}@media(max-width:760px){header{display:block;padding:10px 12px}nav{margin-top:8px}.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:14px 12px 50px}.hero{padding:20px}.grid,.formgrid{grid-template-columns:1fr}.metric strong{font-size:23px}}@media print{header,.actions,.rowbtn,.notice{display:none!important}main{padding:0;max-width:none}.hero{border:0}.hero aside{background:white;color:black;border:1px solid #ccc}.panel,.metric{break-inside:avoid}.tablewrap{overflow:visible}table{min-width:0}}
</style></head><body><header><b>▦ AI Mở <small>· Tổng hợp GTGT</small></b><nav id="nav"></nav></header><main id="app"></main><dialog id="editor"><h2 id="editorTitle"></h2><form id="editForm"><div id="fields" class="formgrid"></div><p id="error" role="alert"></p><div class="actions"><button class="btn primary" type="submit">Lưu</button><button type="button" class="btn" id="close">Đóng</button></div></form></dialog><input id="upload" type="file" accept=".json,application/json" hidden><script id="embedded" type="application/json">e30=</script><script>const KEY='ai-mo-vat-return-v1',VERSION=1,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Math.round(n||0).toLocaleString('vi-VN')+' đ',today=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),round=n=>Math.round(n),sum=(a,f)=>a.reduce((v,x)=>v+f(x),0);
const dOff=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const SAMPLE_IN=[[-25,'0001201','Công ty Hòa Phát',200000000,10,'Chuyển khoản'],[-20,'0000458','Công ty An Bình',45000000,8,'Chuyển khoản'],[-15,'0003320','Cửa hàng Minh Tâm',4000000,10,'Tiền mặt'],[-12,'0007781','Công ty Viễn Thông A',12000000,10,'Tiền mặt'],[-8,'0002114','Hộ nông sản Tân Phát',30000000,5,'Chuyển khoản'],[-3,'0005509','Công ty Vận tải Nam',18000000,10,'Chuyển khoản']];
const SAMPLE_OUT=[[-26,'A000101','Công ty Thành Đạt',320000000,10],[-18,'A000102','Công ty Lộc Phát',150000000,8],[-10,'A000103','Cửa hàng Ngọc Mai',60000000,8],[-4,'A000104','Công ty Hưng Thịnh',210000000,10],[-2,'A000105','Khách xuất khẩu',90000000,0]];
const blank=()=>({version:VERSION,settings:{business:'Đơn vị mẫu',period:'Kỳ tham khảo',carry:10000000,cashLimit:5000000},invoices:[]});
function sample(){let d=blank();SAMPLE_IN.forEach((x,i)=>d.invoices.push({id:'IN'+i,kind:'in',date:dOff(x[0]),number:x[1],partner:x[2],net:x[3],rate:x[4],payment:x[5],note:'Dòng mẫu gốc '+(i+1)}));SAMPLE_OUT.forEach((x,i)=>d.invoices.push({id:'OUT'+i,kind:'out',date:dOff(x[0]),number:x[1],partner:x[2],net:x[3],rate:x[4],payment:'',note:'Dòng mẫu gốc '+(i+1)}));return d}
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;let d=new Date(v+'T12:00:00Z');return !Number.isNaN(+d)&&d.toISOString().slice(0,10)===v}
function validate(d){if(!d||d.version!==VERSION||!d.settings||!Array.isArray(d.invoices))return'Dữ liệu sai phiên bản.';if(!Number.isFinite(d.settings.carry)||d.settings.carry<0||!Number.isFinite(d.settings.cashLimit)||d.settings.cashLimit<0)return'Tham số không hợp lệ.';let ids=new Set(),nums=new Set();for(let x of d.invoices){let nk=x.kind+'|'+String(x.number).toUpperCase();if(!x.id||ids.has(x.id)||!['in','out'].includes(x.kind)||!validDate(x.date)||!String(x.number).trim()||!String(x.partner).trim()||nums.has(nk)||!Number.isFinite(x.net)||x.net<0||!Number.isFinite(x.rate)||x.rate<0||x.rate>100)return'Hóa đơn không hợp lệ hoặc trùng số trong cùng loại.';ids.add(x.id);nums.add(nk)}return''}
function decode(){try{return JSON.parse(decodeURIComponent(escape(atob($('#embedded').textContent.trim()))))}catch{return null}}
let db=(()=>{try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(!validate(d))return d}catch{}let e=decode();return !validate(e)?e:sample()})(),page='home',editing=null;
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
const tax=x=>round(x.net*x.rate/100),total=x=>x.net+tax(x),flag=x=>x.kind==='in'&&x.payment==='Tiền mặt'&&total(x)>=db.settings.cashLimit;
function summary(){let inn=db.invoices.filter(x=>x.kind==='in'),out=db.invoices.filter(x=>x.kind==='out'),input=sum(inn,tax),flagged=sum(inn.filter(flag),tax),deduct=input-flagged,output=sum(out,tax),balance=output-deduct-db.settings.carry;return{inn,out,input,flagged,deduct,output,pay:Math.max(0,balance),next:Math.max(0,-balance),sales:sum(out,x=>x.net),purchases:sum(inn,x=>x.net)}}
const navItems=[['home','▦ Tổng quan'],['in','↙ Đầu vào'],['out','↗ Đầu ra'],['report','▤ Đối chiếu'],['settings','⚙ Cài đặt'],['data','↧ Dữ liệu'],['help','? Hướng dẫn']];
function notice(){return '<div class="notice"><b>Bảng tổng hợp tham khảo.</b> Mẫu gốc có 6 hóa đơn đầu vào và 5 đầu ra. Ngưỡng tiền mặt là quy tắc rà soát nội bộ có thể sửa, không phải kết luận khấu trừ hay tờ khai chính thức. Hãy đối chiếu chứng từ và quy định hiện hành.</div>'}
const metric=(label,value,tone='',sub='')=>`<div class="metric ${tone}"><span>${esc(label)}</span><strong>${money(value)}</strong><small class="muted">${esc(sub)}</small></div>`;
function hero(){let s=summary();return `<section class="hero"><div><div class="eyebrow">AI Mở · Bảng tổng hợp GTGT</div><h1>Rõ từng hóa đơn.<br>Rõ từng khoản thuế.</h1><p>Ghi đầu vào, đầu ra và đối chiếu thuế theo dữ liệu đã nhập. Cảnh báo những khoản cần kiểm tra trước khi lập hồ sơ thật.</p><div class="actions"><button class="btn primary" data-action="new" data-kind="in">+ Ghi đầu vào</button><button class="btn" data-action="new" data-kind="out">+ Ghi đầu ra</button></div></div><aside><small>CHÊNH LỆCH TẠM TÍNH SAU CHUYỂN KỲ TRƯỚC</small><strong>${money(s.pay||-s.next)}</strong><small>${s.pay?'Số dương theo dữ liệu đã nhập':s.next?'Số âm, chuyển kỳ sau theo phép tính':'Cân bằng'} · ${db.invoices.length} hóa đơn</small></aside></section>`}
function home(){let s=summary();return hero()+notice()+`<div class="grid">${metric('Thuế đầu ra',s.output,'warn',s.out.length+' hóa đơn')}${metric('Đầu vào theo hóa đơn',s.input,'',s.inn.length+' hóa đơn')}${metric('Đầu vào đưa vào đối chiếu',s.deduct,'good','Đã tách cờ tiền mặt')}${metric('Khoản cần kiểm tra',s.flagged,'warn','Theo ngưỡng đã đặt')}${metric('Kỳ trước chuyển sang',db.settings.carry,'','Tham số chỉnh được')}${metric('Chuyển kỳ sau',s.next,'good','Theo phép tính mẫu')}</div><section class="panel"><h2>Luồng công việc</h2><p>① Kiểm tra đầu vào và đầu ra → ② Rà cảnh báo thanh toán → ③ Đối chiếu kỳ này → ④ Sao lưu dữ liệu.</p><div class="actions"><button class="btn" data-page="in">Xem đầu vào</button><button class="btn" data-page="report">Mở đối chiếu</button><button class="btn" data-page="data">Sao lưu</button></div></section>`}
function table(kind){let rows=db.invoices.filter(x=>x.kind===kind).sort((a,b)=>b.date.localeCompare(a.date)),label=kind==='in'?'đầu vào':'đầu ra';return `<div class="eyebrow">SỔ HÓA ĐƠN</div><h1>Hóa đơn ${label}</h1><p class="muted">Mỗi số hóa đơn chỉ được ghi một lần trong cùng loại. Cột cảnh báo là quy tắc nội bộ.</p><div class="actions"><button class="btn primary" data-action="new" data-kind="${kind}">+ Thêm hóa đơn</button><button class="btn" data-action="csv">Xuất CSV</button></div><section class="panel tablewrap">${rows.length?`<table><thead><tr><th>Ngày · Số</th><th>Đối tác</th><th class="num">Tiền hàng</th><th>Thuế suất</th><th class="num">Thuế</th><th class="num">Tổng</th><th>Rà soát</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}<br><b>${esc(x.number)}</b></td><td>${esc(x.partner)}</td><td class="num">${money(x.net)}</td><td>${x.rate}%</td><td class="num">${money(tax(x))}</td><td class="num">${money(total(x))}</td><td>${flag(x)?'<span class="badge warn">Tiền mặt từ ngưỡng</span>':x.kind==='in'?'<span class="badge">Xem chứng từ</span>':'—'}</td><td class="rowbtn"><button data-action="edit" data-id="${x.id}">Sửa</button> <button data-action="delete" data-id="${x.id}">Xóa</button></td></tr>`).join('')}</tbody></table>`:'<div class="muted">Chưa có hóa đơn.</div>'}</section>`}
function report(){let s=summary();return `<div class="eyebrow">BẢNG ĐỐI CHIẾU NỘI BỘ</div><h1>Tổng hợp theo dữ liệu đã nhập</h1>${notice()}<div class="grid">${metric('Doanh thu chưa thuế',s.sales)}${metric('Mua vào chưa thuế',s.purchases)}${metric('Thuế đầu ra',s.output,'warn')}${metric('Thuế đầu vào',s.input)}${metric('Cờ tiền mặt',s.flagged,'warn')}${metric('Đầu vào đối chiếu',s.deduct,'good')}${metric('Thuế kỳ trước',db.settings.carry)}${metric('Số dương tạm tính',s.pay,'warn')}${metric('Số âm chuyển kỳ sau',s.next,'good')}</div><section class="panel"><h2>Công thức đối chiếu</h2><p>Chênh lệch = thuế đầu ra − (thuế đầu vào sau khi tách cờ tiền mặt) − thuế kỳ trước chuyển sang. Dương: số dự kiến phải xem xét nộp. Âm: số dự kiến chuyển kỳ sau.</p><div class="actions"><button class="btn primary" data-action="print">In báo cáo</button><button class="btn" data-action="csv">Xuất CSV</button></div></section>`}
function settings(){return `<div class="eyebrow">THAM SỐ NỘI BỘ</div><h1>Thiết lập kỳ rà soát</h1>${notice()}<section class="panel"><h2>Thông số đang dùng</h2><form id="settingsForm" class="formgrid"><div class="field"><label>Đơn vị</label><input name="business" value="${esc(db.settings.business)}" required></div><div class="field"><label>Tên kỳ</label><input name="period" value="${esc(db.settings.period)}" required></div><div class="field"><label>Thuế kỳ trước chuyển sang (đ)</label><input name="carry" type="number" min="0" step="1" value="${db.settings.carry}" required></div><div class="field"><label>Ngưỡng tiền mặt để gắn cờ (đ)</label><input name="cashLimit" type="number" min="0" step="1" value="${db.settings.cashLimit}" required></div><div><button class="btn primary">Lưu tham số</button></div></form></section>`}
function dataView(){return `<div class="eyebrow">SỞ HỮU DỮ LIỆU</div><h1>Sao lưu và chuyển máy</h1><section class="panel"><p>Dữ liệu tự lưu trong trình duyệt này. Chép file HTML gốc sang máy khác <b>không</b> mang theo dữ liệu đã nhập. Hãy tải HTML kèm dữ liệu hoặc JSON.</p><div class="actions"><button class="btn primary" data-action="json">Tải JSON</button><button class="btn" data-action="html">Tải HTML kèm dữ liệu</button><button class="btn" data-action="import">Nhập JSON</button><button class="btn" data-action="csv">Xuất CSV mở Excel</button><button class="btn danger" data-action="clear">Xóa và bắt đầu mới</button><button class="btn" data-action="sample">Nạp lại mẫu</button></div></section>`}
function help(){return `<div class="eyebrow">HƯỚNG DẪN</div><h1>Rà soát trong 4 bước</h1><section class="panel"><ol><li>Chọn kỳ và tham số ở Cài đặt.</li><li>Ghi hóa đơn đầu vào và đầu ra; số, đối tác, tiền hàng và thuế suất.</li><li>Xem cờ cảnh báo và đối chiếu hóa đơn, thanh toán thực tế.</li><li>Xem báo cáo, in hoặc xuất; sao lưu trước khi đổi máy.</li></ol><p>Mức 0/5/8/10% trong mẫu gốc chỉ là dữ liệu thử. App không tạo tờ khai điện tử chính thức hay tự xác minh điều kiện khấu trừ.</p></section>`}
function render(){let h={home,in:()=>table('in'),out:()=>table('out'),report,settings,data:dataView,help};$('#nav').innerHTML=navItems.map(([k,v])=>`<button data-page="${k}" class="${page===k?'active':''}">${v}</button>`).join('');$('#app').innerHTML=h[page]();document.title='Tổng hợp GTGT · '+db.settings.business}
function field(label,name,value,type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function openEditor(kind,id){editing={kind,id};let x=id?db.invoices.find(a=>a.id===id):null;$('#editorTitle').textContent=(id?'Sửa':'Ghi')+' hóa đơn '+(kind==='in'?'đầu vào':'đầu ra');$('#fields').innerHTML=field('Ngày hóa đơn','date',x?.date||today(),'date','required')+field('Số hóa đơn','number',x?.number||'','text','required maxlength="40"')+field('Đối tác','partner',x?.partner||'','text','required maxlength="150"')+field('Giá trị chưa thuế (đ)','net',x?.net||0,'number','required min="0" step="1"')+field('Thuế suất (%)','rate',x?.rate??10,'number','required min="0" max="100" step="0.01"')+(kind==='in'?`<div class="field"><label>Thanh toán</label><select name="payment"><option ${x?.payment==='Chuyển khoản'?'selected':''}>Chuyển khoản</option><option ${x?.payment==='Tiền mặt'?'selected':''}>Tiền mặt</option></select></div>`:'')+field('Ghi chú','note',x?.note||'');$('#error').textContent='';$('#editor').showModal()}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportHTML(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#embedded').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(db))));download('ai-mo-gtgt-kem-du-lieu.html','<!doctype html>'+clone.outerHTML,'text/html;charset=utf-8')}
function exportCSV(){let rows=[['Loại','Ngày','Số','Đối tác','Tiền hàng','Thuế suất','Thuế','Tổng','Thanh toán','Cờ rà soát'],...db.invoices.map(x=>[x.kind==='in'?'Đầu vào':'Đầu ra',x.date,x.number,x.partner,x.net,x.rate,tax(x),total(x),x.payment,flag(x)?'Tiền mặt từ ngưỡng':''])];download('ai-mo-bang-ke-gtgt.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}let a=b.dataset.action,id=b.dataset.id;if(a==='new')openEditor(b.dataset.kind);if(a==='edit'){let x=db.invoices.find(v=>v.id===id);if(x)openEditor(x.kind,id)}if(a==='delete'){if(confirm('Xóa hóa đơn này?')){db.invoices=db.invoices.filter(x=>x.id!==id);persist()}}if(a==='print')window.print();if(a==='json')download('ai-mo-gtgt.json',JSON.stringify(db,null,2),'application/json');if(a==='html')exportHTML();if(a==='csv')exportCSV();if(a==='import')$('#upload').click();if(a==='clear'&&confirm('Xóa toàn bộ dữ liệu đang lưu?')){db=blank();persist()}if(a==='sample'&&confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại?')){db=sample();persist()}});
$('#editForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),x={id:editing.id||uid(),kind:editing.kind,date:String(f.get('date')),number:String(f.get('number')||'').trim(),partner:String(f.get('partner')||'').trim(),net:Number(f.get('net')),rate:Number(f.get('rate')),payment:String(f.get('payment')||''),note:String(f.get('note')||'').trim()},d=structuredClone(db);d.invoices=editing.id?d.invoices.map(v=>v.id===editing.id?x:v):[...d.invoices,x];let err=validate(d);if(err){$('#error').textContent=err;return}db=d;$('#editor').close();page=x.kind;persist()});$('#close').onclick=()=>$('#editor').close();
document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();let f=new FormData(e.target),d=structuredClone(db);d.settings={business:String(f.get('business')||'').trim(),period:String(f.get('period')||'').trim(),carry:Number(f.get('carry')),cashLimit:Number(f.get('cashLimit'))};let err=validate(d);if(!d.settings.business||!d.settings.period||err){alert(err||'Nhập tên đơn vị và kỳ.');return}db=d;persist()});
$('#upload').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text()),err=validate(d);if(err)throw Error(err);if(confirm('Nhập JSON sẽ thay dữ liệu hiện tại. Tiếp tục?')){db=d;page='home';persist()}}catch(err){alert('Không nhập được: '+err.message)}e.target.value=''};render();
</script></body></html>
