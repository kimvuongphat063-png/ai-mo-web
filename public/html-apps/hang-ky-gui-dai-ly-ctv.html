function partnerTotals(p){let bs=db.batches.filter(b=>b.partnerId===p.id),ps=db.payments.filter(x=>x.partnerId===p.id),a={batches:bs.length,received:0,sold:0,returned:0,onHand:0,sales:0,commission:0,due:0,paid:ps.reduce((n,x)=>n+x.amount,0)};for(let b of bs){let v=batchTotals(b);a.received+=b.received;a.sold+=b.sold;a.returned+=b.returned;a.onHand+=v.onHand;a.sales+=v.sales;a.commission+=v.commission;a.due+=v.due}a.balance=a.due-a.paid;a.warning=a.balance>db.settings.threshold?'Vượt ngưỡng công nợ':a.balance<0?'Nộp vượt phải nộp':'';return a}

function closeModal(){modal=null;$('#editor').close()}
const v=k=>$('#f_'+k)?.value.trim()||'';
function saveModal(){if(!modal)return;let{type,id}=modal,x={},error='';if(type==='partner'){x={code:v('code'),name:v('name'),phone:v('phone'),type:v('type'),rate:Number(v('rate')),active:v('active')==='true',note:v('note')};if(!x.code||/\s/.test(x.code)||!x.name)error='Cần mã không có dấu cách và tên CTV/đại lý.';else if(db.partners.some(p=>p.id!==id&&p.code.toLowerCase()===x.code.toLowerCase()))error='Mã đối tác đã có.';else if(!Number.isFinite(x.rate)||x.rate<0||x.rate>100)error='Hoa hồng phải từ 0 đến 100%.'}if(type==='batch'){x={date:v('date'),code:v('code'),partnerId:v('partnerId'),product:v('product'),received:amount(v('received')),sold:amount(v('sold')),returned:amount(v('returned')),price:amount(v('price')),rate:Number(v('rate')),note:v('note')};if(!validDate(x.date)||!x.code||!partner(x.partnerId)||!x.product)error='Cần ngày, mã lô, đối tác và tên sản phẩm.';else if(db.batches.some(b=>b.id!==id&&b.code.toLowerCase()===x.code.toLowerCase()))error='Mã lô đã có.';else if(![x.received,x.sold,x.returned,x.price].every(validMoney)||x.received===0||x.sold+x.returned>x.received)error='Số lượng hoặc giá không hợp lệ; đã bán + trả không được vượt số nhận.';else if(!Number.isFinite(x.rate)||x.rate<0||x.rate>100)error='Tỷ lệ hoa hồng phải từ 0–100%.'}if(type==='payment'){x={date:v('date'),partnerId:v('partnerId'),amount:amount(v('amount')),method:v('method'),reference:v('reference'),note:v('note')};if(!validDate(x.date)||!partner(x.partnerId))error='Cần ngày hợp lệ và CTV/đại lý.';else if(!validMoney(x.amount)||x.amount===0)error='Số tiền phải là số nguyên lớn hơn 0.';else if(!['Chuyển khoản','Tiền mặt','Khác'].includes(x.method))error='Hình thức không hợp lệ.'}if(error){$('#modalError').textContent=error;return}let list=type==='partner'?db.partners:type==='batch'?db.batches:db.payments;if(id)Object.assign(list.find(z=>z.id===id),x);else list.push({id:uid(),...x});closeModal();save()}
function sampleData(){let d=blank(),anchor=SAMPLE.asof;d.settings.asof=anchor;d.settings.threshold=SAMPLE.threshold;d.partners=SAMPLE.partners.map(([code,name,phone,rate],i)=>({id:'sample-p-'+i,code,name,phone,type:'CTV',rate,active:true,note:''}));let at=offset=>{let x=new Date(anchor+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+offset);return x.toISOString().slice(0,10)};d.batches=SAMPLE.batches.map(([offset,code,product,received,sold,returned,price],i)=>{let p=d.partners.find(p=>p.code===code);return{id:'sample-b-'+i,date:at(offset),code:'KG'+String(i+1).padStart(4,'0'),partnerId:p.id,product,received,sold,returned,price,rate:p.rate,note:'Dữ liệu mẫu từ app gốc'}});d.payments=SAMPLE.payments.map(([offset,code,amount,method],i)=>({id:'sample-pay-'+i,date:at(offset),partnerId:d.partners.find(p=>p.code===code).id,amount,method,reference:'MẪU-'+(i+1),note:'Dữ liệu mẫu từ app gốc'}));return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function print(){window.print()}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('hang-ky-gui-dai-ly-ctv-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Ngày','Mã lô','Mã CTV','Tên CTV','Sản phẩm','SL nhận','SL bán','SL trả','Còn giữ','Giá bán','Hoa hồng %','Doanh số','Hoa hồng','Phải nộp']];for(let b of db.batches){let p=partner(b.partnerId),t=batchTotals(b);rows.push([b.date,b.code,p?.code,p?.name,b.product,b.received,b.sold,b.returned,t.onHand,b.price,b.rate,t.sales,t.commission,t.due])}let text='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('hang-ky-gui-dai-ly-ctv.csv',text,'text/csv;charset=utf-8')}
function excelExport(){let partners=[['Mã','Tên','Điện thoại','Hoa hồng (%)','Loại','Trạng thái'],...db.partners.map(p=>[p.code,p.name,p.phone,p.rate,p.type,p.active===false?'Tạm ngừng':'Hoạt động'])],batches=[['Ngày','CTV','Sản phẩm','SL nhận','SL đã bán','SL trả lại','Giá bán lẻ','Hoa hồng áp dụng (%)','Mã lô','Ghi chú'],...db.batches.map(b=>[b.date,partner(b.partnerId)?.code||'',b.product,b.received,b.sold,b.returned,b.price,b.rate,b.code,b.note])],payments=[['Ngày','CTV','Số tiền nộp','Hình thức','Tham chiếu','Ghi chú'],...db.payments.map(p=>[p.date,partner(p.partnerId)?.code||'',p.amount,p.method,p.reference,p.note])],blob=Excel.workbook([{name:'Doi tac',rows:partners},{name:'Ky gui',rows:batches},{name:'Thanh toan',rows:payments}]),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hang-ky-gui-dai-ly-ctv.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');if(validDate(x))return x}return ''}
function sheetRows(rows,header){let i=rows.findIndex(r=>String(r?.[0]??'').trim().toLocaleLowerCase('vi')===header.toLocaleLowerCase('vi'));return i<0?[]:rows.slice(i+1)}
function parsedExcel(sheets){let pr=sheetRows(sheets['Doi tac']||sheets['Cộng tác viên, đại lý']||[],'Mã'),br=sheetRows(sheets['Ky gui']||sheets['Giao dịch ký gửi']||[],'Ngày'),rr=sheetRows(sheets['Thanh toan']||sheets['Thanh toán']||[],'Ngày');if(!pr.length)throw Error('Thiếu bảng đối tác.');let d=blank(),codes=new Set();for(let [j,r] of pr.entries()){if(!String(r[0]??'').trim()&&!String(r[1]??'').trim())continue;let code=String(r[0]??'').trim(),name=String(r[1]??'').trim(),rate=Number(r[3]||0);if(!code||!name||!Number.isFinite(rate)||rate<0||rate>100||codes.has(code.toLowerCase()))throw Error('Đối tác dòng '+(j+2)+' sai mã/tên/hoa hồng hoặc bị trùng.');codes.add(code.toLowerCase());d.partners.push({id:uid(),code,name,phone:String(r[2]??'').trim(),rate,type:String(r[4]??'CTV').trim()||'CTV',active:String(r[5]??'Hoạt động').trim()!=='Tạm ngừng',note:''})}let ownBatch=!!sheets['Ky gui'];for(let [j,r] of br.entries()){if(!String(r[0]??'').trim()&&!String(r[1]??'').trim())continue;let date=parseDate(r[0]),p=d.partners.find(p=>p.code===String(r[1]??'').trim()),product=String(r[2]??'').trim(),received=amount(r[3]||0),sold=amount(r[4]||0),returned=amount(r[5]||0),price=amount(r[6]||0),rate=ownBatch?Number(r[7]):p?.rate,code=ownBatch?String(r[8]??'').trim():'KG'+String(j+1).padStart(4,'0');if(!date||!p||!product||!validMoney(received)||received===0||!validMoney(sold)||!validMoney(returned)||sold+returned>received||!validMoney(price)||!Number.isFinite(rate)||rate<0||rate>100)throw Error('Lô ký gửi dòng '+(j+2)+' không hợp lệ.');d.batches.push({id:uid(),date,code:code||'KG'+String(j+1).padStart(4,'0'),partnerId:p.id,product,received,sold,returned,price,rate,note:ownBatch?String(r[9]??'').trim():'Nhập từ Excel gốc'})}for(let [j,r] of rr.entries()){if(!String(r[0]??'').trim()&&!String(r[1]??'').trim())continue;let date=parseDate(r[0]),p=d.partners.find(p=>p.code===String(r[1]??'').trim()),value=amount(r[2]||0),method=String(r[3]??'Chuyển khoản').trim();if(!date||!p||!validMoney(value)||value===0)throw Error('Khoản nộp dòng '+(j+2)+' không hợp lệ.');d.payments.push({id:uid(),date,partnerId:p.id,amount:value,method,reference:String(r[4]??'').trim(),note:String(r[5]??'').trim()})}if(!validBackup(d))throw Error('Bảng Excel không hợp lệ sau chuyển đổi.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let candidate=parsedExcel(await Excel.read(file));if(!confirm('Nhập '+candidate.partners.length+' đối tác, '+candidate.batches.length+' lô và '+candidate.payments.length+' khoản nộp sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu JSON trước. Tiếp tục?'))return;db=candidate;scope='all';save()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('hang-ky-gui-dai-ly-ctv-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.partners.length||db.batches.length||db.payments.length){if(!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();scope='all';save()}if(a==='clear'){if(confirm('Xóa toàn bộ CTV, lô ký gửi và khoản đã nộp trên trình duyệt này?')){db=blank();scope='all';save()}}if(a==='deleteRecord'){if(confirm('Xóa vĩnh viễn bản ghi này?')){if(modal.type==='batch')db.batches=db.batches.filter(x=>x.id!==modal.id);else db.payments=db.payments.filter(x=>x.id!==modal.id);closeModal();save()}}if(a==='settings'){let as=v('asof'),threshold=amount(v('threshold'));if(as&&!validDate(as)||!validMoney(threshold)){alert('Ngày hoặc ngưỡng công nợ không hợp lệ.');return}db.settings={...db.settings,company:v('company'),asof:as,threshold};save()}});
document.addEventListener('change',e=>{if(e.target.id==='scope'){scope=e.target.value;render()}if(e.target.id==='f_partnerId'&&modal?.type==='batch'&&!modal.id){let p=partner(e.target.value);if(p)$('#f_rate').value=p.rate}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let x=JSON.parse(await file.text());if(!validBackup(x))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=x;scope='all';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
