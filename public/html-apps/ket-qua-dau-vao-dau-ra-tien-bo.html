function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let e=validate(db);if(e){alert('Không lưu được: '+e);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ máy đã đầy; hãy sao lưu JSON hoặc HTML kèm dữ liệu.')}render();return true}
const student=id=>db.students.find(s=>s.id===id);
const tests=id=>db.tests.filter(t=>t.studentId===id).sort((a,b)=>a.date.localeCompare(b.date));
const latest=(id,stage)=>tests(id).filter(t=>t.stage===stage).at(-1)||null;
function result(id){let s=student(id),a=latest(id,'Đầu vào'),m=latest(id,'Giữa kỳ'),z=latest(id,'Đầu ra');let gain=a&&z?Math.round((z.score-a.score)*10)/10:null;let status=!z?'Chưa đánh giá':z.score>=s.target?'Đạt mục tiêu':'Chưa đạt mục tiêu';let warning=gain!==null&&gain<=0?'Chưa có tiến bộ':z&&z.score>s.target+db.settings.above&&gain>=db.settings.gain?'Gợi ý nâng lớp':m&&a&&m.score<a.score?'Giữa kỳ giảm điểm':'';return {a,m,z,gain,status,warning}}
function btn(label,act,kind='',id=''){return `<button type="button" class="btn ${kind}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function summary(){let complete=db.students.filter(s=>result(s.id).z),achieved=complete.filter(s=>result(s.id).status==='Đạt mục tiêu'),noGain=db.students.filter(s=>result(s.id).gain!==null&&result(s.id).gain<=0),allGain=complete.filter(s=>result(s.id).gain!==null);let avg=allGain.length?Math.round(allGain.reduce((n,s)=>n+result(s.id).gain,0)/allGain.length*10)/10:null;return {students:db.students.length,assessments:db.tests.length,complete:complete.length,achieved:achieved.length,notAchieved:complete.length-achieved.length,noGain:noGain.length,avg}}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Học viên</small><strong>${s.students}</strong></div><div><small>Lần đánh giá</small><strong>${s.assessments}</strong></div><div><small>Đã có điểm đầu ra</small><strong>${s.complete}</strong></div><div><small>Đạt mục tiêu</small><strong>${s.achieved}</strong></div><div><small>Tiến bộ TB*</small><strong>${s.avg===null?'—':(s.avg>0?'+':'')+fmt(s.avg)}</strong></div></div>`}
function home(){let attention=db.students.filter(s=>['Chưa có tiến bộ','Giữa kỳ giảm điểm'].includes(result(s.id).warning)||result(s.id).status==='Chưa đạt mục tiêu'),follow=db.followups.filter(f=>f.status!=='Hoàn thành').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return `<div class="hero"><span>📈 AI MỞ · THEO DÕI HỌC TẬP</span><h1>Kết quả đầu vào, đầu ra & tiến bộ</h1><p>Xem học viên đã tiến bộ đến đâu, ai cần hỗ trợ và mục tiêu khóa học đã đạt chưa.</p><div class="hero-actions">${btn('＋ Thêm học viên','newStudent','primary')}${btn('📋 Xem danh sách','students')}</div></div>${metrics()}${panel('📍 Bắt đầu nhanh',`<ol><li>Thêm hồ sơ học viên, lớp và mục tiêu trên thang 10.</li><li>Ghi điểm đầu vào, giữa kỳ, đầu ra theo ngày. Có thể ghi nhiều lần để theo dõi quá trình.</li><li>Đọc báo cáo từng em, tạo việc hỗ trợ rồi xem báo cáo theo lớp.</li></ol><p class="muted">* Tiến bộ trung bình chỉ tính học viên có cả điểm đầu vào và đầu ra. Dữ liệu thật bắt đầu trống; mẫu nguồn chỉ nạp khi chọn.</p>`)}<div class="two">${panel('🔔 Cần quan tâm',attention.length?attention.slice(0,8).map(s=>`<div class="mini"><button class="link" data-act="openStudent" data-id="${esc(s.id)}">${esc(s.name)}</button><small>${esc(s.className)} · ${esc(result(s.id).warning||result(s.id).status)}</small></div>`).join(''):'<p class="success">Chưa có học viên được đánh dấu cần quan tâm.</p>')}${panel('🗓️ Việc hỗ trợ đang mở',follow.length?follow.slice(0,8).map(f=>`<div class="mini"><button class="link" data-act="openStudent" data-id="${esc(f.studentId)}">${esc(student(f.studentId).name)}</button><small>${esc(f.action)} · hạn ${fmtDate(f.due)} · ${f.status}</small></div>`).join(''):'<p class="muted">Chưa có việc hỗ trợ đang mở.</p>')}</div>`}
function filtered(){return db.students.filter(s=>(!search||[s.code,s.name,s.className,s.subject,s.parent].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))&&(!classFilter||s.className===classFilter)&&(!outcomeFilter||result(s.id).status===outcomeFilter)).sort((a,b)=>a.name.localeCompare(b.name,'vi'))}
function studentsPage(){let classes=[...new Set(db.students.map(s=>s.className))].sort((a,b)=>a.localeCompare(b,'vi'));return `<div class="page-head"><div><h1>👩‍🎓 Học viên & kết quả</h1><p>Mỗi hồ sơ có nhiều lần đánh giá và một mục tiêu riêng.</p></div>${btn('＋ Thêm học viên','newStudent','primary')}</div><div class="card"><div class="filters"><label>Tìm học viên<input id="search" value="${esc(search)}" placeholder="Tên, mã, lớp…"></label><label>Lớp<select id="classFilter"><option value="">Tất cả</option>${classes.map(c=>`<option ${classFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Kết quả<select id="outcomeFilter"><option value="">Tất cả</option>${['Chưa đánh giá','Đạt mục tiêu','Chưa đạt mục tiêu'].map(v=>`<option ${outcomeFilter===v?'selected':''}>${v}</option>`).join('')}</select></label></div><p class="muted">${filtered().length} / ${db.students.length} học viên</p><div class="table-wrap"><table><thead><tr><th>Học viên</th><th>Lớp / môn</th><th>Đầu vào</th><th>Giữa kỳ</th><th>Đầu ra</th><th>Mục tiêu</th><th>Tiến bộ</th><th>Kết quả</th><th></th></tr></thead><tbody>${filtered().map(s=>{let r=result(s.id);return `<tr><td><button class="link" data-act="openStudent" data-id="${esc(s.id)}">${esc(s.name)}</button><small>${esc(s.code)}</small></td><td>${esc(s.className)}<small>${esc(s.subject||'—')}</small></td><td>${r.a?fmt(r.a.score):'—'}</td><td>${r.m?fmt(r.m.score):'—'}</td><td>${r.z?fmt(r.z.score):'—'}</td><td>${fmt(s.target)}</td><td>${r.gain===null?'—':(r.gain>0?'+':'')+fmt(r.gain)}</td><td><span class="pill ${r.status==='Đạt mục tiêu'?'green':r.status==='Chưa đánh giá'?'amber':'red'}">${r.status}</span>${r.warning?`<small>${esc(r.warning)}</small>`:''}</td><td>${btn('Xem','openStudent','small',s.id)}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Chưa có học viên phù hợp.</td></tr>'}</tbody></table></div></div>`}
function chart(id){let t=tests(id).filter(x=>x.stage!=='Bổ sung');if(!t.length)return '<p class="muted">Chưa có điểm để vẽ tiến trình.</p>';let w=620,h=180,pts=t.map((x,i)=>({x:t.length===1?60:50+i*(w-100)/(t.length-1),y:155-x.score*13,z:x}));return `<div class="chart-scroll"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Biểu đồ điểm theo thời gian">${[0,5,10].map(v=>`<line x1="35" y1="${155-v*13}" x2="600" y2="${155-v*13}" stroke="#dfe6f2"/><text x="8" y="${160-v*13}" font-size="12">${v}</text>`).join('')}<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#315ee8" stroke-width="3"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="6" fill="#315ee8"/><text x="${p.x+8}" y="${p.y-8}" font-size="12" fill="#17233d">${fmt(p.z.score)}</text>`).join('')}</svg></div><div class="chart-key">${t.map(x=>`<span>${fmtDate(x.date)} · ${esc(x.stage)}: <b>${fmt(x.score)}</b></span>`).join('')}</div>`}
function detail(){let s=student(selected);if(!s){page='students';return studentsPage()}let r=result(s.id),t=tests(s.id),f=db.followups.filter(x=>x.studentId===s.id).sort((a,b)=>b.date.localeCompare(a.date)),a=db.audit.filter(x=>x.studentId===s.id).sort((x,y)=>y.at.localeCompare(x.at));return `<div class="page-head"><div><button class="link" data-act="students">← Danh sách học viên</button><h1>👩‍🎓 ${esc(s.name)}</h1><p>${esc(s.code)} · ${esc(s.className)} · ${esc(s.subject||'Chưa ghi môn')}</p></div><div class="actions">${btn('＋ Ghi điểm','newTest','primary',s.id)}${btn('＋ Việc hỗ trợ','newFollow','',s.id)}${btn('Sửa hồ sơ','editStudent','',s.id)}${btn('🖨️ In cho phụ huynh','print')} ${btn('Xóa hồ sơ','deleteStudent','danger',s.id)}</div></div><div class="metrics"><div><small>Đầu vào</small><strong>${r.a?fmt(r.a.score):'—'}</strong></div><div><small>Giữa kỳ</small><strong>${r.m?fmt(r.m.score):'—'}</strong></div><div><small>Đầu ra</small><strong>${r.z?fmt(r.z.score):'—'}</strong></div><div><small>Mục tiêu</small><strong>${fmt(s.target)}</strong></div><div><small>Tiến bộ</small><strong>${r.gain===null?'—':(r.gain>0?'+':'')+fmt(r.gain)}</strong></div></div><div class="two">${panel('🎯 Kết quả',`<p><span class="pill ${r.status==='Đạt mục tiêu'?'green':r.status==='Chưa đánh giá'?'amber':'red'}">${r.status}</span> ${r.warning?`<span class="pill red">${esc(r.warning)}</span>`:''}</p><p>Tiến bộ được tính từ lần <b>đầu vào mới nhất</b> đến lần <b>đầu ra mới nhất</b>. Khi chưa có đủ hai mốc, app không kết luận.</p><p><b>Phụ huynh:</b> ${esc(s.parent||'—')} · ${esc(s.phone||'—')}</p><p><b>Ghi chú hồ sơ:</b> ${esc(s.note||'—')}</p>`)}${panel('📈 Đường học tập',chart(s.id))}</div>${panel('📝 Các lần đánh giá',`<div class="actions no-print">${btn('＋ Thêm lần đánh giá','newTest','primary',s.id)}</div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Mốc</th><th>Bài / hình thức</th><th>Điểm /10</th><th>Nhận xét</th><th></th></tr></thead><tbody>${t.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.stage)}</td><td>${esc(x.title||'—')}</td><td><b>${fmt(x.score)}</b></td><td>${esc(x.comment||'—')}</td><td class="no-print">${btn('Sửa','editTest','small',x.id)} ${btn('Xóa','deleteTest','small danger',x.id)}</td></tr>`).join('')||'<tr><td colspan="6">Chưa ghi điểm.</td></tr>'}</tbody></table></div>`)}${panel('🤝 Kế hoạch hỗ trợ',`<div class="actions no-print">${btn('＋ Thêm việc','newFollow','primary',s.id)}</div><div class="table-wrap"><table><thead><tr><th>Ngày lập</th><th>Việc cần làm</th><th>Phụ trách</th><th>Hạn</th><th>Tình trạng</th><th></th></tr></thead><tbody>${f.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.action)}</td><td>${esc(x.owner||'—')}</td><td>${fmtDate(x.due)}</td><td>${esc(x.status)}</td><td class="no-print">${btn('Sửa','editFollow','small',x.id)} ${btn('Xóa','deleteFollow','small danger',x.id)}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có kế hoạch hỗ trợ.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký thay đổi',a.length?`<div class="timeline">${a.map(x=>`<div><b>${esc(x.action)}</b> · ${fmtDate(x.at.slice(0,10))}<p>${esc(x.reason||'—')}</p></div>`).join('')}</div>`:'<p class="muted">Chưa có thay đổi.</p>')}`}
function reports(){let classes=[...new Set(db.students.map(s=>s.className))].sort((a,b)=>a.localeCompare(b,'vi'));return `<div class="page-head"><div><h1>📊 Báo cáo theo lớp</h1><p>Chỉ kết luận đạt mục tiêu khi có điểm đầu ra; tiến bộ cần đủ đầu vào và đầu ra.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Tổng hợp từng lớp',`<div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Học viên</th><th>Đã có đầu ra</th><th>Đạt / chưa đạt</th><th>Tiến bộ TB*</th><th>Chưa tiến bộ</th></tr></thead><tbody>${classes.map(c=>{let a=db.students.filter(s=>s.className===c),z=a.filter(s=>result(s.id).z),g=z.filter(s=>result(s.id).gain!==null),av=g.length?g.reduce((n,s)=>n+result(s.id).gain,0)/g.length:null;return `<tr><td>${esc(c)}</td><td>${a.length}</td><td>${z.length}</td><td>${z.filter(s=>result(s.id).status==='Đạt mục tiêu').length} / ${z.filter(s=>result(s.id).status==='Chưa đạt mục tiêu').length}</td><td>${av===null?'—':fmt(av)}</td><td>${g.filter(s=>result(s.id).gain<=0).length}</td></tr>`}).join('')||'<tr><td colspan="6">Chưa có lớp.</td></tr>'}</tbody></table></div><p class="note">* Trung bình từ các học viên có đủ hai điểm mốc, không tự thay điểm còn thiếu bằng 0.</p>`)}${panel('Học viên cần theo dõi',`<div class="table-wrap"><table><thead><tr><th>Học viên</th><th>Lớp</th><th>Tình trạng</th><th>Cảnh báo</th><th>Việc hỗ trợ mở</th></tr></thead><tbody>${db.students.filter(s=>{let r=result(s.id);return r.warning||r.status==='Chưa đạt mục tiêu'}).map(s=>{let r=result(s.id);return `<tr><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td>${r.status}</td><td>${esc(r.warning||'—')}</td><td>${db.followups.filter(f=>f.studentId===s.id&&f.status!=='Hoàn thành').length}</td></tr>`}).join('')||'<tr><td colspan="5">Chưa có học viên cần theo dõi.</td></tr>'}</tbody></table></div>`)}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngưỡng tham khảo',`<form id="settingsForm" class="form-grid"><label>Tên cơ sở<input name="org" value="${esc(db.settings.org)}" maxlength="120"></label><label>Vượt mục tiêu hơn (điểm)<input name="above" type="number" min="0" max="10" step="0.1" value="${db.settings.above}" required></label><label>Tiến bộ từ (điểm)<input name="gain" type="number" min="0" max="10" step="0.1" value="${db.settings.gain}" required></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="muted">Nguồn gốc gợi ý nâng lớp khi điểm đầu ra <b>lớn hơn</b> mục tiêu + ngưỡng và mức tăng <b>ít nhất bằng</b> ngưỡng tiến bộ. Gợi ý không thay đánh giá của giáo viên. Thang điểm phiên bản này là 0–10.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu và chuyển máy',`<p>Điểm số và thông tin phụ huynh được lưu trên thiết bị này. Sao chép HTML gốc sang máy khác không mang dữ liệu đã nhập. Dùng JSON hoặc HTML kèm dữ liệu để chuyển máy; giữ các file này riêng tư.</p><div class="actions">${btn('⬇️ Tải JSON','exportJson')}${btn('⬇️ Tải HTML kèm dữ liệu','exportHtml','primary')}${btn('⬇️ Excel 4 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Mẫu nguồn',`<p>Mẫu gốc gồm 20 học viên, đủ ba mốc điểm, 10 em đạt mục tiêu. Chỉ dùng minh họa; tên và điểm mẫu cần thay bằng hồ sơ thực tế.</p>${btn('Nạp 20 học viên mẫu (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Chỉ xóa dữ liệu của app này trên thiết bị đang dùng.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Quy trình cho giáo viên và quản lý',`<ol><li>Tạo hồ sơ và mục tiêu khóa học cho từng học viên.</li><li>Ghi điểm đầu vào theo ngày; ghi giữa kỳ và đầu ra khi có bài đánh giá thực.</li><li>Mỗi lần nhập điểm có nhận xét, phương pháp đánh giá và tiêu chí nếu cần.</li><li>Xem biểu đồ, trao đổi với phụ huynh, lập việc hỗ trợ cho học viên cần quan tâm.</li><li>Sao lưu trước khi chuyển máy hoặc nhập file Excel.</li></ol>`)}${panel('Cách đọc kết quả',`<p>Tiến bộ = điểm đầu ra mới nhất − điểm đầu vào mới nhất, làm tròn một chữ số. Đạt mục tiêu khi điểm đầu ra ≥ mục tiêu. Chưa có đầu ra thì kết quả là “Chưa đánh giá”. Điểm giữa kỳ giảm so với đầu vào là tín hiệu sớm, không phải kết luận cuối khóa.</p><p>Thang 0–10 dùng theo file nguồn. Nếu môn học dùng thang khác, cần quy đổi trước khi nhập và ghi rõ cách quy đổi trong hồ sơ.</p>`)}`}
function render(){let map={home:['Tổng quan',home],students:['Học viên',studentsPage],detail:['Hồ sơ',detail],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];$('#topOrg').textContent=db.settings.org||'AI Mở · App offline';document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===page))}
function field(name,label,value='',type='text',options=null){return `<label class="${type==='textarea'?'full':''}">${label}${type==='textarea'?`<textarea name="${name}" rows="3" maxlength="1500">${esc(value)}</textarea>`:options?`<select name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" max="10" step="0.1"':''} ${['code','name','className','target','studentId','date','stage','score','action'].includes(name)?'required':''}>`}</label>`}
function modalOpen(kind,id='',studentId=''){draft={kind,id,studentId,before:id?clone(kind==='student'?student(id):kind==='test'?db.tests.find(t=>t.id===id):db.followups.find(f=>f.id===id)):null};let x=draft.before||{},fields='';if(kind==='student'){fields=field('code','Mã học viên',x.code||'')+field('name','Họ tên',x.name||'')+field('className','Lớp / khóa',x.className||'')+field('subject','Môn học',x.subject||'')+field('target','Điểm mục tiêu /10',x.target??7,'number')+field('parent','Phụ huynh',x.parent||'')+field('phone','Điện thoại',x.phone||'')+field('note','Ghi chú hồ sơ',x.note||'','textarea')}else if(kind==='test'){let sid=x.studentId||studentId;fields=field('studentId','Học viên',sid,'text',db.students.map(s=>s.id))+field('date','Ngày đánh giá',x.date||today(),'date')+field('stage','Mốc đánh giá',x.stage||'Đầu vào','text',STAGES)+field('score','Điểm /10',x.score??'','number')+field('title','Bài / hình thức đánh giá',x.title||'')+field('rubric','Tiêu chí hoặc thang chấm',x.rubric||'','textarea')+field('comment','Nhận xét và việc cần cải thiện',x.comment||'','textarea')}else{fields=field('date','Ngày lập',x.date||today(),'date')+field('action','Việc hỗ trợ',x.action||'','textarea')+field('owner','Người phụ trách',x.owner||'')+field('due','Hạn dự kiến',x.due||'','date')+field('status','Tình trạng',x.status||'Cần làm','text',['Cần làm','Đang làm','Hoàn thành'])+field('note','Ghi chú kết quả',x.note||'','textarea')}$('#modalTitle').textContent=kind==='student'?(id?'Sửa học viên':'Thêm học viên'):kind==='test'?(id?'Sửa lần đánh giá':'Ghi lần đánh giá'):(id?'Sửa việc hỗ trợ':'Thêm việc hỗ trợ');$('#formFields').innerHTML=fields;$('#formError').textContent='';$('#editor').showModal();if(kind==='test'){let sel=$('[name="studentId"]');for(let o of sel.options)o.textContent=student(o.value)?.name||o.value}}
function submit(){let f=new FormData($('#itemForm')),kind=draft.kind,id=draft.id||uid(),x={id};for(let [k,v] of f)x[k]=String(v).trim();if(kind==='student'){x.target=Number(x.target);x.code=x.code.toUpperCase();if(!x.code||!x.name||!x.className||!Number.isFinite(x.target)||x.target<0||x.target>10||db.students.some(s=>s.code===x.code&&s.id!==id)){error('Cần mã không trùng, tên, lớp và mục tiêu từ 0–10.');return}if(x.phone&&!/^[0-9+().\s-]{8,30}$/.test(x.phone)){error('Số điện thoại không hợp lệ.');return}let old=student(id);if(old)Object.assign(old,x);else db.students.push(x)}else if(kind==='test'){x.score=Number(x.score);if(!student(x.studentId)||!dateOK(x.date)||!STAGES.includes(x.stage)||String(f.get('score')).trim()===''||!Number.isFinite(x.score)||x.score<0||x.score>10){error('Chọn học viên, ngày, mốc và điểm 0–10.');return}let old=db.tests.find(t=>t.id===id);if(old)Object.assign(old,x);else db.tests.push(x)}else{ x.studentId=draft.studentId||draft.before?.studentId;x.action=String(x.action||'').trim();if(!student(x.studentId)||!dateOK(x.date)||x.due&&!dateOK(x.due)||!x.action||!['Cần làm','Đang làm','Hoàn thành'].includes(x.status)){error('Điền ngày, việc hỗ trợ và tình trạng hợp lệ.');return}let old=db.followups.find(t=>t.id===id);if(old)Object.assign(old,x);else db.followups.push(x)}let sid=kind==='student'?id:kind==='test'?x.studentId:x.studentId;db.audit.push({id:uid(),studentId:sid,action:(draft.before?'Sửa ':'Thêm ')+(kind==='student'?'hồ sơ':kind==='test'?'điểm đánh giá':'việc hỗ trợ'),reason:kind==='test'?`${x.stage}: ${fmt(x.score)}/10 · ${x.comment||'Chưa ghi nhận xét'}`:kind==='student'?'Cập nhật hồ sơ':x.action,at:new Date().toISOString()});let e=validate(db);if(e){let list=kind==='student'?db.students:kind==='test'?db.tests:db.followups;if(draft.before)Object.assign(list.find(y=>y.id===id),draft.before);else list.splice(list.findIndex(y=>y.id===id),1);db.audit.pop();error(e);return}$('#editor').close();selected=sid;page='detail';save()}
function error(s){$('#formError').textContent=s}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'ket-qua-tien-bo-sao-luu.json')}
function exportHtml(){let s=encode(db),doc='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([doc],{type:'text/html;charset=utf-8'}),'ket-qua-tien-bo-kem-du-lieu.html')}
const HS=['ID','Mã','Tên','Lớp','Môn','Mục tiêu','Phụ huynh','Điện thoại','Ghi chú'],HT=['ID','ID học viên','Ngày','Mốc','Điểm','Bài đánh giá','Tiêu chí','Nhận xét'],HF=['ID','ID học viên','Ngày','Việc hỗ trợ','Người phụ trách','Hạn','Tình trạng','Ghi chú'],HA=['ID','ID học viên','Thao tác','Nội dung','Thời điểm'];
function sheets(){return [{name:'Hoc vien',rows:[HS,...db.students.map(s=>[s.id,s.code,s.name,s.className,s.subject,s.target,s.parent,s.phone,s.note])]},{name:'Danh gia',rows:[HT,...db.tests.map(t=>[t.id,t.studentId,t.date,t.stage,t.score,t.title,t.rubric,t.comment])]},{name:'Ho tro',rows:[HF,...db.followups.map(f=>[f.id,f.studentId,f.date,f.action,f.owner,f.due,f.status,f.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.studentId,a.action,a.reason,a.at])]}]}
function exportExcel(){download(Excel.workbook(sheets()),'ket-qua-tien-bo.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Hoc vien',HS],['Danh gia',HT],['Ho tro',HF],['Nhat ky',HA]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng mẫu bốn sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.students=b['Hoc vien'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),name:String(r[2]),className:String(r[3]),subject:String(r[4]||''),target:Number(r[5]),parent:String(r[6]||''),phone:String(r[7]||''),note:String(r[8]||'')}));x.tests=b['Danh gia'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),studentId:String(r[1]),date:String(r[2]),stage:String(r[3]),score:Number(r[4]),title:String(r[5]||''),rubric:String(r[6]||''),comment:String(r[7]||'')}));x.followups=b['Ho tro'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),studentId:String(r[1]),date:String(r[2]),action:String(r[3]),owner:String(r[4]||''),due:String(r[5]||''),status:String(r[6]),note:String(r[7]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),studentId:String(r[1]),action:String(r[2]),reason:String(r[3]||''),at:String(r[4])}))}let e=validate(x);if(e)throw Error(e);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.students.length} học viên từ file?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu app hiện tại. Tiếp tục?'))return;let x=empty();for(let [i,r] of PROGRESS_SAMPLE.kq.entries()){let id=uid();x.students.push({id,code:'MAU-'+String(i+1).padStart(3,'0'),name:r[0],className:r[1],subject:'',target:r[5],parent:'',phone:'',note:'Dữ liệu minh họa từ file tham chiếu.'});for(let [j,stage] of ['Đầu vào','Giữa kỳ','Đầu ra'].entries())x.tests.push({id:uid(),studentId:id,date:['2026-01-01','2026-02-01','2026-03-01'][j],stage,score:r[j+2],title:'Điểm mẫu nguồn',rubric:'',comment:'Dữ liệu minh họa; ngày đánh giá được đặt để thể hiện thứ tự vì nguồn không có ngày.'})}let e=validate(x);if(e){alert(e);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;if(k==='newStudent')modalOpen('student');else if(k==='editStudent')modalOpen('student',id);else if(k==='newTest')modalOpen('test','',id);else if(k==='editTest')modalOpen('test',id);else if(k==='newFollow')modalOpen('follow','',id);else if(k==='editFollow')modalOpen('follow',id);else if(k==='openStudent'){selected=id;page='detail';render()}else if(k==='students'){page='students';render()}else if(k==='deleteTest'||k==='deleteFollow'){let isTest=k==='deleteTest',list=isTest?db.tests:db.followups,rec=list.find(x=>x.id===id);if(confirm('Xóa mục này?')){list.splice(list.indexOf(rec),1);db.audit.push({id:uid(),studentId:rec.studentId,action:isTest?'Xóa điểm đánh giá':'Xóa việc hỗ trợ',reason:isTest?`${rec.stage}: ${fmt(rec.score)}/10`:rec.action,at:new Date().toISOString()});save()}}else if(k==='deleteStudent'){let s=student(id);if(confirm(`Xóa hồ sơ “${s.name}”, mọi lần đánh giá và việc hỗ trợ?`)){db.students=db.students.filter(x=>x.id!==id);db.tests=db.tests.filter(x=>x.studentId!==id);db.followups=db.followups.filter(x=>x.studentId!==id);db.audit=db.audit.filter(x=>x.studentId!==id);page='students';save()}}else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),above=Number(f.get('above')),gain=Number(f.get('gain'));if(![above,gain].every(v=>Number.isFinite(v)&&v>=0&&v<=10)){alert('Ngưỡng phải từ 0 đến 10.');return}db.settings={org:String(f.get('org')||'').trim().slice(0,120),above,gain};save()}else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app trên thiết bị này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}if(e.target.id==='classFilter'){classFilter=e.target.value;render()}if(e.target.id==='outcomeFilter'){outcomeFilter=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
window.ProgressApp={getDB:()=>clone(db),validate,result,summary,loadSample,encode,decode,sheets,importFile};
</script></body></html>
