function blank(){return{version:VERSION,cats:SAMPLE.cats.map(c=>({...c})),tx:[],settings:{family:'Gia đình của tôi'}}}
function valid(d){if(!d||d.version!==VERSION||!Array.isArray(d.cats)||!Array.isArray(d.tx)||!d.settings)return false;const names=new Map(),ids=new Set();for(const c of d.cats){if(!c.id||!c.name||!['Thu','Chi'].includes(c.type)||!Number.isFinite(c.budget)||c.budget<0||names.has(c.name.toLowerCase()))return false;names.set(c.name.toLowerCase(),c.type)}for(const t of d.tx){if(!t.id||ids.has(t.id)||!dateOK(t.date)||!['Thu','Chi'].includes(t.type)||names.get(String(t.cat).toLowerCase())!==t.type||!Number.isInteger(t.amount)||t.amount<=0)return false;ids.add(t.id)}return true}
function embedded(){try{return JSON.parse(decodeURIComponent(escape(atob($('#embedded').textContent.trim()))))}catch{return null}}
let data=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(valid(x))return x}catch{}let e=embedded();return valid(e)?e:{version:VERSION,cats:SAMPLE.cats.map(c=>({...c})),tx:SAMPLE.tx.map(t=>({...t})),settings:{family:'Gia đình Nguyễn Văn An',sample:true}}})();
let page='home',ym='2026-11',search='',editing=null,monthNow=()=>new Date().toISOString().slice(0,7);
function save(){localStorage.setItem(KEY,JSON.stringify(data));$('#save').textContent='Đã lưu trên thiết bị · '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});render()}
const txMonth=(m=ym)=>data.tx.filter(t=>t.date.slice(0,7)===m),total=(xs,type)=>xs.filter(t=>t.type===type).reduce((a,t)=>a+t.amount,0),catSum=(xs,c)=>xs.filter(t=>t.cat===c).reduce((a,t)=>a+t.amount,0);
function numbers(m=ym){let x=txMonth(m),income=total(x,'Thu'),expense=total(x,'Chi'),saving=catSum(x,SAVING);return{income,expense,saving,consumption:expense-saving,balance:income-expense,free:income-expense+saving}}
const NAV=[['home','⌂ Tổng quan'],['ledger','▤ Giao dịch'],['budget','◫ Hạn mức'],['year','▥ 12 tháng'],['data','↧ Dữ liệu'],['guide','? Hướng dẫn']];
function nav(){ $('#nav').innerHTML=NAV.map(([k,l])=>`<button class="nav-btn ${page===k?'active':''}" data-go="${k}">${l}</button>`).join('')}
function sampleNote(){return data.settings.sample?'<div class="sample"><strong>Đang xem dữ liệu mẫu nguồn.</strong> Mẫu tạo đến tháng 11/2026 để xem cách vận hành. Vào Dữ liệu để bắt đầu sổ riêng; hãy sao lưu trước khi đổi thiết bị.</div>':''}
function monthFilter(){return`<div class="filters"><label>Tháng <input id="month" type="month" value="${ym}"></label></div>`}
function metric(label,value,sub,kind=''){return`<div class="metric ${kind}"><small>${label}</small><strong>${value}</strong><p>${sub}</p></div>`}
function budgetBars(){let x=txMonth(),cs=data.cats.filter(c=>c.type==='Chi'&&c.budget>0).map(c=>({...c,spent:catSum(x,c.name)})).sort((a,b)=>b.spent/b.budget-a.spent/a.budget);return cs.map(c=>{let p=c.spent/c.budget;return`<div class="bar"><div><strong>${esc(c.name)}</strong><br><span class="note">${fmt(c.spent)} / ${fmt(c.budget)}</span></div><div class="track"><div class="fill ${c.name===SAVING?'ok':p>=.9?'warn':''}" style="width:${Math.min(p*100,100)}%"></div></div><strong class="${p>1&&c.name!==SAVING?'negative':''}">${Math.round(p*100)}%</strong></div>`}).join('')||'<div class="empty">Chưa đặt hạn mức.</div>'}
function recent(){let xs=[...txMonth()].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);return xs.length?xs.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.cat)}<div class="note">${esc(t.note)}</div></td><td><span class="tag ${t.type==='Chi'?'chi':''}">${t.type}</span></td><td class="money ${t.type==='Chi'?'negative':'positive'}">${t.type==='Chi'?'-':'+'}${fmt(t.amount)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Tháng này chưa có giao dịch.</td></tr>'}
function home(){let n=numbers();return`${sampleNote()}<div class="hero"><div><div class="eyebrow">AI MỞ · NHẬT KÝ GIA ĐÌNH</div><h1>Biết tiền đi đâu.<br>Chủ động cho điều quan trọng.</h1><p>Ghi từng khoản thu chi, xem tiền chi tiêu và khoản đã chuyển sang tiết kiệm trong cùng một trang.</p><div class="row"><button class="btn primary" data-act="newChi">+ Ghi khoản chi</button><button class="btn blue" data-act="newThu">+ Ghi khoản thu</button></div></div><div class="hero-stat"><small>Còn lại sau thu chi · ${ym}</small><strong>${fmt(n.balance)}</strong><span>Tiết kiệm đã ghi: ${fmt(n.saving)}</span></div></div><div class="section-head"><h1>Tháng ${ym.slice(5)}/${ym.slice(0,4)}</h1>${monthFilter()}</div><div class="metrics">${metric('Thu nhập',fmt(n.income),'Tổng các khoản thu','good')}${metric('Chi ra',fmt(n.expense),'Gồm khoản chuyển tiết kiệm','cost')}${metric('Đã tiết kiệm',fmt(n.saving),'Tách khỏi tiêu dùng','saving')}${metric('Tiêu dùng thực',fmt(n.consumption),'Chi ra trừ khoản tiết kiệm','balance')}</div><div class="two"><section class="panel"><h2>Hạn mức tháng này</h2>${budgetBars()}<button class="btn light" data-go="budget">Xem mọi danh mục →</button></section><section class="panel"><h2>Giao dịch gần đây</h2><div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Khoản</th><th>Loại</th><th>Số tiền</th></tr></thead><tbody>${recent()}</tbody></table></div></section></div>`}
function ledger(){let xs=[...txMonth()].filter(t=>(t.cat+' '+t.note+' '+t.date).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return`<div class="section-head"><div><div class="eyebrow">SỔ NHẬT KÝ</div><h1>Giao dịch</h1><p>Ghi ngay sau khi thu hoặc chi; số liệu tổng hợp tự cập nhật.</p></div><div class="row"><button class="btn primary" data-act="newChi">+ Khoản chi</button><button class="btn blue" data-act="newThu">+ Khoản thu</button></div></div>${sampleNote()}<div class="panel"><div class="filters">${monthFilter()}<input id="search" type="search" placeholder="Tìm danh mục, ghi chú..." value="${esc(search)}"></div><div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Loại</th><th>Danh mục & ghi chú</th><th>Số tiền</th><th>Thao tác</th></tr></thead><tbody>${xs.map(t=>`<tr><td>${esc(t.date)}</td><td><span class="tag ${t.type==='Chi'?'chi':''}">${t.type}</span></td><td><strong>${esc(t.cat)}</strong><div class="note">${esc(t.note)}</div></td><td class="money ${t.type==='Chi'?'negative':'positive'}">${t.type==='Chi'?'-':'+'}${fmt(t.amount)}</td><td><div class="actions"><button class="tiny" data-act="edit" data-id="${esc(t.id)}">Sửa</button><button class="tiny" data-act="delete" data-id="${esc(t.id)}">Xóa</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Không có giao dịch phù hợp.</td></tr>'}</tbody></table></div></div>`}
function budget(){let xs=txMonth();return`<div class="section-head"><div><div class="eyebrow">KẾ HOẠCH THÁNG</div><h1>Hạn mức theo danh mục</h1><p>Tiết kiệm là mục tiêu chuyển tiền; các khoản khác là mức chi cần theo dõi.</p></div><button class="btn primary" data-act="newCat">+ Danh mục</button></div>${sampleNote()}<div class="panel">${monthFilter()}<div class="table-wrap"><table class="table"><thead><tr><th>Danh mục</th><th>Loại</th><th>Hạn mức</th><th>Thực tế</th><th>Đánh giá</th><th></th></tr></thead><tbody>${data.cats.map(c=>{let s=catSum(xs,c.name),p=c.budget?s/c.budget:0,status=c.type==='Thu'?'Thu nhập':c.name===SAVING?(s>=c.budget?'Đạt mục tiêu':'Chưa đạt mục tiêu'):!c.budget?'Chưa đặt mức':p>1?'Vượt mức':p>=.9?'Sắp hết':'Trong mức';return`<tr><td><strong>${esc(c.name)}</strong></td><td><span class="tag ${c.type==='Chi'?'chi':''}">${c.type}</span></td><td class="money">${c.type==='Chi'?fmt(c.budget):'—'}</td><td class="money">${fmt(s)}</td><td>${status}</td><td><button class="tiny" data-act="editCat" data-id="${esc(c.id)}">Sửa</button></td></tr>`}).join('')}</tbody></table></div><p class="note">Giới hạn trong file nguồn là số tham khảo theo tháng, có thể chỉnh cho gia đình mình.</p></div>`}
function year(){let y=ym.slice(0,4),rows=Array.from({length:12},(_,i)=>{let m=y+'-'+String(i+1).padStart(2,'0'),n=numbers(m);return{m,...n}}),sum=k=>rows.reduce((a,r)=>a+r[k],0);return`<div class="section-head"><div><div class="eyebrow">GÓC NHÌN CẢ NĂM</div><h1>12 tháng · ${y}</h1><p>So sánh thu, tiêu dùng, khoản tiết kiệm và tiền còn lại.</p></div>${monthFilter()}</div><div class="metrics">${metric('Thu cả năm',fmt(sum('income')),'12 tháng','good')}${metric('Tiêu dùng',fmt(sum('consumption')),'Không gồm tiết kiệm','cost')}${metric('Tiết kiệm',fmt(sum('saving')),'Chuyển sang tích lũy','saving')}${metric('Còn lại',fmt(sum('balance')),'Thu trừ toàn bộ chi','balance')}</div><div class="panel"><h2>Bảng 12 tháng</h2><div class="table-wrap"><table class="table"><thead><tr><th>Tháng</th><th>Thu</th><th>Tiêu dùng</th><th>Tiết kiệm</th><th>Còn lại</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r.m.slice(5)}</strong></td><td class="money">${fmt(r.income)}</td><td class="money">${fmt(r.consumption)}</td><td class="money">${fmt(r.saving)}</td><td class="money ${r.balance<0?'negative':''}">${fmt(r.balance)}</td></tr>`).join('')}</tbody></table></div></div>`}

function guide(){return`<div class="section-head"><div><div class="eyebrow">CÁCH SỬ DỤNG</div><h1>5 bước giữ sổ dễ hiểu</h1></div></div><div class="panel"><ol><li>Vào <strong>Dữ liệu</strong> và chọn bắt đầu sổ trống khi dùng thật.</li><li>Thêm khoản thu hoặc chi ở Tổng quan; chọn đúng danh mục.</li><li>Đặt hạn mức chi trong mục Hạn mức. Tiết kiệm là khoản chuyển tích lũy, vẫn ghi là Chi theo dữ liệu nguồn.</li><li>Xem tháng và 12 tháng để biết mức tiêu dùng và số tiền còn lại.</li><li>Tải JSON hoặc HTML kèm dữ liệu thường xuyên, đặc biệt trước khi đổi máy.</li></ol><p class="note">App là sổ cá nhân, không kết nối tài khoản ngân hàng và không đồng bộ tự động.</p></div>`}
function render(){nav();$('#view').innerHTML=({home,ledger,budget,year,data:dataPage,guide}[page]||home)()}
function field(label,name,type,value='',opts=''){return`<div class="field"><label for="f-${name}">${label}</label>${type==='select'?`<select name="${name}" id="f-${name}">${opts}</select>`:type==='textarea'?`<textarea name="${name}" id="f-${name}">${esc(value)}</textarea>`:`<input name="${name}" id="f-${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="1"':''}>`}</div>`}
function openForm(kind,id=''){editing={kind,id};let t=data.tx.find(x=>x.id===id),c=data.cats.find(x=>x.id===id),fields='';if(kind==='tx'){let type=t?.type||'Chi',cats=data.cats.filter(x=>x.type===type);fields=field('Ngày *','date','date',t?.date||today())+field('Loại *','type','select',type,['Thu','Chi'].map(x=>`<option ${x===type?'selected':''}>${x}</option>`).join(''))+field('Danh mục *','cat','select',t?.cat||'',cats.map(x=>`<option ${x.name===t?.cat?'selected':''}>${esc(x.name)}</option>`).join(''))+field('Số tiền (đ) *','amount','number',t?.amount||'')+field('Ghi chú','note','textarea',t?.note||'');$('#formTitle').textContent=id?'Sửa giao dịch':'Ghi giao dịch '+type.toLowerCase()}else{fields=field('Tên danh mục *','name','text',c?.name||'')+field('Loại *','type','select',c?.type||'Chi',['Thu','Chi'].map(x=>`<option ${x===c?.type?'selected':''}>${x}</option>`).join(''))+field('Hạn mức mỗi tháng (đ)','budget','number',c?.budget||0);$('#formTitle').textContent=id?'Sửa danh mục':'Thêm danh mục'}$('#fields').innerHTML=fields;$('#error').textContent='';$('#editor').showModal();if(kind==='tx')$('#f-type').addEventListener('change',()=>{let opts=data.cats.filter(x=>x.type===$('#f-type').value).map(x=>`<option>${esc(x.name)}</option>`).join('');$('#f-cat').innerHTML=opts})}
function submit(e){e.preventDefault();let f=new FormData(e.target),get=k=>String(f.get(k)||'').trim(),before=JSON.stringify(data);try{if(editing.kind==='tx'){let date=get('date'),type=get('type'),cat=get('cat'),amount=Number(get('amount'));if(!dateOK(date)||!['Thu','Chi'].includes(type)||!data.cats.some(x=>x.name===cat&&x.type===type)||!Number.isInteger(amount)||amount<=0)throw Error('Kiểm tra ngày, danh mục và số tiền nguyên dương.');let t=data.tx.find(x=>x.id===editing.id);if(t)Object.assign(t,{date,type,cat,amount,note:get('note')});else data.tx.push({id:uid(),date,type,cat,amount,note:get('note')})}else{let name=get('name'),type=get('type'),budget=Number(get('budget'));if(!name||!['Thu','Chi'].includes(type)||!Number.isInteger(budget)||budget<0||data.cats.some(x=>x.id!==editing.id&&x.name.toLowerCase()===name.toLowerCase()))throw Error('Tên phải duy nhất và hạn mức là số nguyên không âm.');let c=data.cats.find(x=>x.id===editing.id);if(c){if(c.type!==type&&data.tx.some(t=>t.cat===c.name))throw Error('Danh mục đã có giao dịch, không thể đổi loại.');data.tx.forEach(t=>{if(t.cat===c.name)t.cat=name});Object.assign(c,{name,type,budget})}else data.cats.push({id:uid(),name,type,budget})}if(!valid(data))throw Error('Dữ liệu chưa hợp lệ.');delete data.settings.sample;$('#editor').close();save()}catch(err){data=JSON.parse(before);$('#error').textContent=err.message}}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportHTML(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#embedded').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(data))));download('So-thu-chi-gia-dinh-co-du-lieu.html','<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8')}
function exportCSV(){let rows=[['Ngày','Loại','Danh mục','Số tiền','Ghi chú'],...data.tx.map(t=>[t.date,t.type,t.cat,t.amount,t.note])],csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download('So-thu-chi-gia-dinh.csv',csv,'text/csv;charset=utf-8')}
function act(x,id){if(x==='newChi'||x==='newThu'){openForm('tx');$('#f-type').value=x==='newChi'?'Chi':'Thu';$('#f-type').dispatchEvent(new Event('change'));return}if(x==='edit')return openForm('tx',id);if(x==='newCat')return openForm('cat');if(x==='editCat')return openForm('cat',id);if(x==='delete'){let t=data.tx.find(t=>t.id===id);if(!t||!confirm('Xóa giao dịch '+t.cat+' · '+fmt(t.amount)+'?'))return;data.tx=data.tx.filter(x=>x.id!==id);delete data.settings.sample;save();return}if(x==='exportJSON')return download('So-thu-chi-gia-dinh.json',JSON.stringify(data,null,2),'application/json');if(x==='exportHTML')return exportHTML();if(x==='exportCSV')return exportCSV();if(x==='print')return window.print();if(x==='restore')return $('#restoreFile').click();if(x==='clear'){if(confirm('Bắt đầu sổ trống? Dữ liệu hiện tại sẽ bị thay thế.')){data=blank();ym=monthNow();save()}return}if(x==='sample'){if(confirm('Nạp mẫu nguồn sẽ thay dữ liệu hiện tại?')){data={version:VERSION,cats:SAMPLE.cats.map(c=>({...c})),tx:SAMPLE.tx.map(t=>({...t})),settings:{family:'Gia đình Nguyễn Văn An',sample:true}};ym='2026-11';save()}}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-act]');if(!b)return;if(b.dataset.go){page=b.dataset.go;render();scrollTo(0,0)}else act(b.dataset.act,b.dataset.id)});document.addEventListener('change',e=>{if(e.target.id==='month'){ym=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)}});$('#form').addEventListener('submit',submit);$('#cancel').addEventListener('click',()=>$('#editor').close());$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!valid(x))throw Error('File không đúng định dạng hoặc dữ liệu lỗi.');if(confirm('Thay toàn bộ dữ liệu hiện tại bằng file này?')){data=x;save()}}catch(err){alert(err.message)}e.target.value=''});render();
</script></body></html>
