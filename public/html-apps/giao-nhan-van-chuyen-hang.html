function settings(){return `<div class="page-head"><h1>Ngày đối chiếu</h1></div>${panel('Cài đặt thời điểm tính trễ',`<form id="settingsForm"><label>Ngày đối chiếu<input name="asof" type="date" required value="${E(db.settings.asof)}"></label>${button('Lưu ngày đối chiếu','saveSettings','primary')}</form><p class="note">Chuyến chưa giao tính trễ từ hạn giao đến ngày này. Chuyến đã giao tính theo ngày giao thực tế.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>Dữ liệu & sao lưu</h1></div><div class="grid-two">${panel('Xuất dữ liệu',`<p>Chuyến được lưu trong trình duyệt trên thiết bị đang dùng.</p><div class="actions">${button('Xuất JSON','json','primary')}${button('HTML kèm dữ liệu','html')}${button('Excel đối chiếu','excel')}</div>`)}${panel('Nhập & mẫu',`<p>Nhập JSON thay toàn bộ dữ liệu. Mẫu chứa đúng 20 chuyến tham chiếu.</p><div class="actions">${button('Nhập JSON','import')}${button('Nạp dữ liệu mẫu','sample')}${button('Xóa dữ liệu','clear','danger')}</div>`)}</div>${panel('Phiên bản',`<p>Phiên bản dữ liệu ${VER} · ${db.trips.length} chuyến · ${db.events.length} sự kiện. Sao chép HTML gốc sang máy khác không tự mang theo dữ liệu trình duyệt; hãy xuất HTML kèm dữ liệu hoặc JSON.</p>`)}`}
function guide(){return `<div class="page-head"><h1>Hướng dẫn</h1></div>${panel('Quy trình 5 bước',`<ol><li>Lập chuyến, nhập khách, địa chỉ, đơn vị vận chuyển, ngày xuất và hạn giao.</li><li>Khi hàng rời kho, nhấn <b>Xuất hàng</b>. App chuyển chuyến sang Đang giao.</li><li>Ghi nhận Giao thành công cùng ngày giao, người nhận và mã chứng từ; hoặc Giao lỗi cùng lý do.</li><li>Nếu giao lỗi, chọn Giao lại và tiếp tục theo dõi; mọi diễn biến nằm trong dòng thời gian.</li><li>Xem báo cáo theo đơn vị vận chuyển và xuất bản sao lưu.</li></ol>`)}${panel('Công thức gốc',`<p><b>Chi phí/km</b> = chi phí chuyến ÷ khoảng cách, làm tròn đồng. <b>Ngày trễ</b> = ngày giao thực tế − hạn nếu Đã giao; ngày đối chiếu − hạn nếu chưa giao, tối thiểu 0. Trạng thái Giao lỗi ưu tiên cảnh báo xử lý và số ngày trễ 0 theo file nguồn.</p><p>App dùng cho theo dõi nội bộ, không xác thực chứng từ giao hàng bên ngoài.</p>`)}`}
function render(){let views={home,trips:tripsPage,detail,reports,settings,data:dataPage,guide};$('#screen').innerHTML=(views[page]||home)();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='detail'&&b.dataset.page==='trips'))}
function fld(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${E(value)}" ${extra}></label>`}
function textArea(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1500">${E(value)}</textarea></label>`}
function form(kind,key=''){draft={kind,key};let t=trip(key)||{},title='',fields='';if(kind==='trip'){title=key?'Sửa hồ sơ chuyến':'Tạo chuyến vận chuyển';fields=fld('Mã chuyến *','code',t.code||`GN${String(db.trips.length+1).padStart(3,'0')}`,'text','required maxlength="50"')+fld('Ngày xuất hàng *','shipDate',t.shipDate||today(),'date','required')+fld('Khách hàng *','customer',t.customer,'text','required maxlength="160"')+fld('Nơi giao *','address',t.address,'text','required maxlength="240"')+fld('Đơn vị vận chuyển *','carrier',t.carrier,'text','required maxlength="160"')+fld('Khoảng cách km *','km',t.km??0,'number','required min="0" step="0.01"')+fld('Chi phí vận chuyển ₫ *','cost',t.cost??0,'number','required min="0" step="1"')+fld('Hạn giao *','deadline',t.deadline||today(),'date','required')+textArea('Ghi chú','note',t.note)}else if(kind==='complete'){title='Giao thành công · '+t.code;fields=fld('Ngày giao thực tế *','date',today(),'date',`required min="${t.shipDate}"`)+fld('Người nhận *','recipient',t.recipient,'text','required maxlength="120"')+fld('Mã chứng từ/POD','proof',t.proof,'text','maxlength="120"')+textArea('Ghi chú giao hàng','detail','')}else if(kind==='fail'){title='Ghi giao lỗi · '+t.code;fields=fld('Ngày ghi nhận *','date',today(),'date',`required min="${t.shipDate}"`)+textArea('Lý do giao lỗi *','detail','')}else if(kind==='note'){title='Thêm diễn biến · '+t.code;fields=fld('Ngày *','date',today(),'date','required')+textArea('Nội dung *','detail','')}$('#modalTitle').textContent=title;$('#formFields').innerHTML=fields;$('#formError').textContent='';$('#editor').showModal()}
function val(f,k){return String(new FormData(f).get(k)||'').trim()}
function submit(e){e.preventDefault();let f=e.target,prior=JSON.parse(JSON.stringify(db)),{kind,key}=draft;try{if(kind==='trip'){let code=val(f,'code'),shipDate=val(f,'shipDate'),deadline=val(f,'deadline'),customer=val(f,'customer'),address=val(f,'address'),carrier=val(f,'carrier'),km=Number(val(f,'km')),cost=Number(val(f,'cost'));if(!code||!customer||!address||!carrier||!validDate(shipDate)||!validDate(deadline)||deadline<shipDate||!Number.isFinite(km)||km<0||!Number.isSafeInteger(cost)||cost<0)throw Error('Kiểm tra mã, ngày, khách, nơi giao, quãng đường và chi phí.');if(db.trips.some(t=>t.id!==key&&t.code.toUpperCase()===code.toUpperCase()))throw Error('Mã chuyến đã tồn tại.');let obj={code,shipDate,deadline,customer,address,carrier,km,cost,note:val(f,'note')};let t=trip(key);if(t){if(t.delivered&&shipDate>t.delivered)throw Error('Ngày xuất không được sau ngày giao.');Object.assign(t,obj);event(t,'Điều chỉnh',today(),'Sửa hồ sơ chuyến')}else{t={id:id(),...obj,state:'Chờ giao',delivered:'',recipient:'',proof:'',sourceRow:null};db.trips.push(t);event(t,'Tạo chuyến',shipDate,'Đã lập hồ sơ')}chosen=t.id;page='detail'}
else if(kind==='complete'){let t=trip(key),date=val(f,'date'),recipient=val(f,'recipient');if(!validDate(date)||date<t.shipDate||!recipient)throw Error('Cần ngày giao hợp lệ và người nhận.');t.state='Đã giao';t.delivered=date;t.recipient=recipient;t.proof=val(f,'proof');event(t,'Giao thành công',date,[recipient,t.proof,val(f,'detail')].filter(Boolean).join(' · '));chosen=key;page='detail'}
else if(kind==='fail'){let t=trip(key),date=val(f,'date'),detail=val(f,'detail');if(!validDate(date)||date<t.shipDate||!detail)throw Error('Cần ngày và lý do giao lỗi.');t.state='Giao lỗi';t.delivered='';event(t,'Giao lỗi',date,detail);chosen=key;page='detail'}
else if(kind==='note'){let t=trip(key),date=val(f,'date'),detail=val(f,'detail');if(!validDate(date)||!detail)throw Error('Cần ngày và nội dung diễn biến.');event(t,'Ghi chú',date,detail);chosen=key;page='detail'}
let v=validate(db);if(v)throw Error(v);$('#editor').close();draft=null;save()}catch(err){db=prior;$('#formError').textContent=err.message}}
function fileDownload(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){fileDownload(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'giao-nhan-van-chuyen-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);fileDownload(new Blob([h],{type:'text/html;charset=utf-8'}),'giao-nhan-van-chuyen-kem-du-lieu.html')}
function sheets(){return [{name:'ChuyenHang',rows:[['Mã chuyến','Ngày xuất','Khách hàng','Nơi giao','Đơn vị vận chuyển','Km','Chi phí','Chi phí/km','Hạn giao','Ngày giao','Trạng thái','Trễ ngày','Cảnh báo','Người nhận','Chứng từ'],...db.trips.map(t=>[t.code,t.shipDate,t.customer,t.address,t.carrier,t.km,t.cost,costPerKm(t),t.deadline,t.delivered,t.state,late(t),flags(t).join('; '),t.recipient,t.proof])]},{name:'DienBien',rows:[['Mã chuyến','Ngày','Sự kiện','Chi tiết','Thời điểm ghi'],...db.events.map(v=>[trip(v.tripId).code,v.date,v.kind,v.detail,v.at])]},{name:'DonViVanChuyen',rows:[['Đơn vị','Số chuyến','Đã giao','Giao lỗi','Km','Chi phí'],...[...new Set(db.trips.map(t=>t.carrier))].map(k=>{let a=db.trips.filter(t=>t.carrier===k);return [k,a.length,a.filter(t=>t.state==='Đã giao').length,a.filter(t=>t.state==='Giao lỗi').length,a.reduce((n,t)=>n+t.km,0),a.reduce((n,t)=>n+t.cost,0)]})]},{name:'NhatKy',rows:[['Thời điểm','Chuyến','Thao tác','Chi tiết'],...db.audit.map(a=>[a.at,trip(a.tripId)?.code||'',a.action,a.detail])]},{name:'CaiDat',rows:[['Ngày đối chiếu'],[db.settings.asof]]}]}
function exportExcel(){fileDownload(Excel.workbook(sheets()),'giao-nhan-van-chuyen-bao-cao.xlsx')}
function sampleData(){let x=empty();function offset(z){let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(z.slice(1)));return d.toLocaleDateString('sv-SE')}for(let [i,r] of SHIPPING_SAMPLE.gn.entries()){let t={id:id(),shipDate:offset(r[0]),code:r[1],customer:r[2],address:r[3],carrier:r[4],km:r[5],cost:r[6],deadline:offset(r[7]),delivered:r[8]?offset(r[8]):'',state:r[9],recipient:'',proof:'',note:'Mẫu tham chiếu; nguồn chưa có người nhận/chứng từ.',sourceRow:i+1};x.trips.push(t);x.events.push({id:id(),tripId:t.id,kind:'Tạo chuyến',date:t.shipDate,detail:'Dữ liệu mẫu gốc · dòng '+(i+1),at:new Date().toISOString()})}return x}
function action(a,key=''){if(['home','trips','reports','settings','data','guide'].includes(a)){page=a;render();return}if(a==='open'){chosen=key;page='detail';render();return}if(a==='newTrip')return form('trip');if(a==='editTrip')return form('trip',key);if(a==='completeTrip')return form('complete',key);if(a==='failTrip')return form('fail',key);if(a==='addNote')return form('note',key);if(a==='startTrip'||a==='retryTrip'){let t=trip(key);if(!t)return;let d=prompt('Ngày bắt đầu giao (YYYY-MM-DD):',today());if(!d)return;if(!validDate(d)||d<t.shipDate)return alert('Ngày không hợp lệ hoặc trước ngày xuất.');t.state='Đang giao';event(t,a==='startTrip'?'Xuất hàng':'Giao lại',d,'Bắt đầu vận chuyển');chosen=key;page='detail';save();return}if(a==='print')return print();if(a==='saveSettings'){let d=$('#settingsForm').elements.asof.value;if(!validDate(d))return alert('Ngày không hợp lệ.');db.settings.asof=d;save();return}if(a==='json')return exportJSON();if(a==='html')return exportHTML();if(a==='excel')return exportExcel();if(a==='import')return $('#jsonFile').click();if(a==='sample'){if(db.trips.length&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=sampleData(),v=validate(x);if(v)return alert(v);db=x;page='home';save();return}if(a==='clear'){if(!confirm('Xóa toàn bộ dữ liệu?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='home';save()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)action(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submit);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),v=validate(x);if(v)throw Error(v);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=x;page='home';save()}catch(err){alert('Không nhập được JSON: '+err.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{if(e.target.id==='stateFilter'){stateFilter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}});render();
</script></body></html>
