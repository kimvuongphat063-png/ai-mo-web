function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sample(){let r=rng(11);return{version:1,sample:true,settings:{company:'AI Mở Studio',year:2027,month:3,groups:[...GROUPS]},lines:SAMPLE_LINES.map((x,i)=>{let plan=Array(12).fill(null),actual=Array(12).fill(null);for(let [m,v] of Object.entries(x[4]))plan[+m]=v;let line={id:'SRC-'+String(i+1).padStart(2,'0'),type:x[0],group:GROUPS[x[1]],name:x[2],monthly:x[3],plan,actual};for(let m=0;m<3;m++){let p=planned(line,m);actual[m]=p?Math.round(p*(.88+r()*.26)/1e5)*1e5:0}return line})}}
function blank(){return{version:1,sample:false,settings:{company:'',year:new Date().getFullYear(),month:new Date().getMonth()+1,groups:[...GROUPS]},lines:[]}}
const deep=o=>JSON.parse(JSON.stringify(o));
function validate(raw){if(!raw||raw.version!==1||!raw.settings||!Array.isArray(raw.lines))throw Error('Tệp không đúng định dạng Ngân sách năm v1.');let s=raw.settings;if(typeof s.company!=='string'||s.company.length>160||!Number.isInteger(s.year)||s.year<2000||s.year>2100||!Number.isInteger(s.month)||s.month<1||s.month>12||!Array.isArray(s.groups)||s.groups.length>100||s.groups.some(g=>typeof g!=='string'||!g.trim()||g.length>80))throw Error('Cài đặt trong tệp không hợp lệ.');if(raw.lines.length>5000)throw Error('Tệp có quá nhiều khoản mục.');let ids=new Set();for(let l of raw.lines){if(!l||typeof l.id!=='string'||!l.id||ids.has(l.id)||!['Thu','Chi'].includes(l.type)||typeof l.group!=='string'||typeof l.name!=='string'||!l.name.trim()||l.name.length>160||!Number.isSafeInteger(l.monthly)||l.monthly<0||!Array.isArray(l.plan)||!Array.isArray(l.actual)||l.plan.length!==12||l.actual.length!==12)throw Error('Có khoản mục không hợp lệ hoặc trùng mã.');ids.add(l.id);for(let v of [...l.plan,...l.actual])if(v!==null&&(!Number.isSafeInteger(v)||v<0||v>1e15))throw Error('Có số tiền tháng không hợp lệ.')}return deep(raw)}
function decode(t){return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t),c=>c.charCodeAt(0))))}
function encode(o){let bytes=new TextEncoder().encode(JSON.stringify(o)),parts=[];for(let i=0;i<bytes.length;i+=8192)parts.push(String.fromCharCode(...bytes.subarray(i,i+8192)));return btoa(parts.join(''))}
function embedded(){try{let s=document.getElementById('embedded-state').textContent.trim();return s&&s!=='e30='?validate(decode(s)):null}catch{return null}}

let page='home',search='',typeFilter='all',editId=null,editMode='plan';

const money=n=>new Intl.NumberFormat('vi-VN').format(n||0)+' ₫';
const short=n=>{let a=Math.abs(n||0);return a>=1e9?(n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ':a>=1e6?(n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' triệu':money(n)};
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const sum=a=>a.reduce((n,v)=>n+(v||0),0);
function planned(l,m){return l.plan[m]===null?l.monthly:l.plan[m]}
const actual=(l,m)=>l.actual[m];
function totals(to=db.settings.month){let out={thuPlan:0,chiPlan:0,thuActual:0,chiActual:0,yearThu:0,yearChi:0};for(let l of db.lines){let key=l.type==='Thu'?'Thu':'Chi';out['year'+key]+=sum(MONTHS.map(m=>planned(l,m-1)));out[l.type==='Thu'?'thuPlan':'chiPlan']+=sum(MONTHS.slice(0,to).map(m=>planned(l,m-1)));out[l.type==='Thu'?'thuActual':'chiActual']+=sum(MONTHS.slice(0,to).map(m=>actual(l,m-1)))}return out}
function row(l,to=db.settings.month){let planYear=sum(MONTHS.map(m=>planned(l,m-1))),planTo=sum(MONTHS.slice(0,to).map(m=>planned(l,m-1))),actTo=sum(MONTHS.slice(0,to).map(m=>actual(l,m-1))),entered=l.actual.slice(0,to).some(v=>v!==null);let state=!entered?'Chưa nhập thực tế':l.type==='Chi'&&planTo&&actTo/planTo>1.01?'Vượt kế hoạch':l.type==='Thu'&&planTo&&actTo/planTo<.9?'Thu chưa đạt':l.type==='Chi'&&planTo&&actTo/planTo<.8?'Chi thấp hơn KH':'Trong kế hoạch';return{l,planYear,planTo,actTo,entered,diff:actTo-planTo,state}}
function monthly(){let acc=0;return MONTHS.map(m=>{let ls=db.lines,thu=ls.filter(l=>l.type==='Thu'),chi=ls.filter(l=>l.type==='Chi'),tp=sum(thu.map(l=>planned(l,m-1))),cp=sum(chi.map(l=>planned(l,m-1))),has=ls.some(l=>l.actual[m-1]!==null),ta=has?sum(thu.map(l=>actual(l,m-1))):null,ca=has?sum(chi.map(l=>actual(l,m-1))):null;if(has)acc+=ta-ca;return{m,tp,cp,ta,ca,planNet:tp-cp,actualNet:has?ta-ca:null,acc:has?acc:null}})}
function persist(){try{localStorage.setItem(AB_KEY,JSON.stringify(db));$('#saveStatus').textContent='Đã lưu trên thiết bị';return true}catch{$('#saveStatus').textContent='Chưa lưu được · hãy tải JSON';notify('Bộ nhớ trình duyệt chưa lưu được. Hãy tải JSON để giữ dữ liệu.');return false}}

function home(){let t=totals(),rows=db.lines.map(l=>row(l)).filter(r=>r.state==='Vượt kế hoạch'||r.state==='Thu chưa đạt');let months=monthly(),max=Math.max(1,...months.map(r=>Math.max(r.tp,r.ta||0)));let bars=months.map(r=>`<div class="chart-month"><i class="bar plan" style="height:${Math.max(1,r.tp/max*100)}%" title="T${r.m} kế hoạch thu ${money(r.tp)}"></i><i class="bar actual" style="height:${Math.max(1,(r.ta||0)/max*100)}%" title="T${r.m} thực tế thu ${r.ta===null?'chưa nhập':money(r.ta)}"></i><label>T${r.m}</label></div>`).join('');return `${banner()}<section class="hero"><div><div class="eyebrow">BẢNG ĐIỀU HÀNH · LẬP KẾ HOẠCH → THEO DÕI</div><h1>Ngân sách rõ từng tháng.<br>Quyết định vững cả năm.</h1><p>Ghi từng khoản thu chi, so kế hoạch với thực tế và nhìn ngay nơi cần điều chỉnh.</p><div class="actions"><button class="btn primary" data-act="newPlan">＋ Thêm khoản mục</button><button class="btn" data-page="actual">Nhập thực tế tháng ${db.settings.month} →</button></div></div><div class="hero-number"><span>Tiền dư lũy kế T1–T${db.settings.month}</span><b>${short(t.thuActual-t.chiActual)}</b><small>Kế hoạch ${short(t.thuPlan-t.chiPlan)}</small></div></section><div class="kpis">${kpi('Thu thực tế',short(t.thuActual),`KH ${short(t.thuPlan)} · ${pct(t.thuActual,t.thuPlan)}`)}${kpi('Chi thực tế',short(t.chiActual),`KH ${short(t.chiPlan)} · ${pct(t.chiActual,t.chiPlan)}`)}${kpi('Dư kế hoạch cả năm',short(t.yearThu-t.yearChi),`Thu ${short(t.yearThu)} · Chi ${short(t.yearChi)}`)}${kpi('Khoản cần xem',rows.length,`${db.lines.length} khoản mục trong kế hoạch`)}</div><div class="grid2"><div class="card"><div class="card-head"><h2>Thu theo tháng</h2><button class="btn small" data-page="months">Xem 12 tháng</button></div><div class="chart">${bars}</div><div class="legend"><span><i style="background:#d0a9d8"></i>Kế hoạch</span><span><i style="background:#55bea5"></i>Thực tế</span></div></div><div class="card"><div class="card-head"><h2>Cần xem ngay</h2><button class="btn small" data-page="compare">Mở đối chiếu</button></div><div class="flag-list">${rows.length?rows.slice(0,7).map(r=>`<div class="flag"><div><strong>${esc(r.l.name)}</strong><small>${esc(r.l.group)}</small></div>${statePill(r.state)}</div>`).join(''):'<div class="empty">Chưa có khoản nào vượt chi hoặc hụt thu theo ngưỡng.</div>'}</div></div></div>`}

function settingsPage(){let s=db.settings;return `${title('Thiết lập ngân sách','Thông tin này dùng cho năm và các kỳ báo cáo. Đổi năm không tự chuyển dữ liệu sang năm khác.')}<div class="grid2"><div class="card"><h2>Thông tin đơn vị và kỳ xem</h2><form id="settingsForm" class="form-grid"><label class="field">Tên đơn vị<input name="company" maxlength="160" value="${esc(s.company)}"></label><label class="field">Năm ngân sách<input name="year" type="number" min="2000" max="2100" value="${s.year}" required></label><label class="field">Tháng đang xem<select name="month">${MONTHS.map(m=>`<option value="${m}" ${m===s.month?'selected':''}>Tháng ${m}</option>`).join('')}</select></label><div style="align-self:end"><button class="btn primary" type="submit">Lưu thiết lập</button></div></form></div><div class="card"><h2>Nhóm khoản mục</h2><p class="muted">Sửa danh sách nhóm cho khoản mục mới; nhóm của dòng cũ được giữ nguyên.</p><div class="chips">${s.groups.map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div><form id="groupForm" class="actions" style="margin-top:18px"><input name="group" maxlength="80" placeholder="Tên nhóm mới" required style="border:1px solid #cfc5d3;border-radius:10px;padding:10px;min-width:0;flex:1"><button class="btn mint" type="submit">＋ Thêm nhóm</button></form><p class="error" id="groupError"></p></div></div>`}
function dataPage(){return `${title('Dữ liệu và sao lưu','Mỗi trình duyệt trên mỗi thiết bị lưu dữ liệu riêng. Tải bản sao trước khi xóa hoặc chuyển máy.')}<div class="grid2"><div class="card"><h2>Sao lưu và chuyển máy</h2><p>File JSON dùng để khôi phục trong app. File HTML kèm dữ liệu mở ngay trên máy khác và mang theo bộ dữ liệu tại thời điểm tải.</p><div class="actions"><button class="btn primary" data-act="json">Tải JSON</button><button class="btn mint" data-act="html">Tải HTML kèm dữ liệu</button><button class="btn" data-act="import">Khôi phục JSON</button><button class="btn" data-act="excel">Xuất Excel</button></div><p class="note" style="margin-top:18px">Chỉ sao chép file HTML gốc sẽ không mang theo dữ liệu đã nhập trong trình duyệt. Hãy dùng “Tải HTML kèm dữ liệu” hoặc JSON.</p></div><div class="card"><h2>Bắt đầu bộ dữ liệu riêng</h2><p>${db.sample?'Bộ hiện tại là dữ liệu mẫu gốc để tham khảo.':'Bộ hiện tại là dữ liệu bạn đang nhập.'} Chức năng xóa sẽ thay toàn bộ dữ liệu hiện tại.</p><div class="actions"><button class="btn" data-act="sample">Nạp lại 18 khoản mẫu</button><button class="btn danger" data-act="clear">Tạo bộ dữ liệu trống</button></div><p class="muted" style="margin-top:22px">${db.lines.length} khoản mục · lưu theo khóa phiên bản ${AB_KEY}</p></div></div>`}
function guide(){return `${title('Hướng dẫn sử dụng','Quy trình 5 bước để dùng ngân sách năm trong thực tế.')}<div class="grid2"><div class="card"><h2>Quy trình</h2><ol style="line-height:1.8;padding-left:22px"><li>Vào Thiết lập ghi tên đơn vị, năm và tháng muốn xem.</li><li>Vào Kế hoạch năm: nhập khoản thu, chi; đặt mức tháng và số riêng cho tháng ngoại lệ.</li><li>Vào Thực tế: nhập số phát sinh cho từng tháng. Để trống nếu tháng chưa có số liệu; ghi 0 nếu đã chốt tháng mà không phát sinh.</li><li>Vào So sánh: xem khoản chi vượt, khoản thu hụt và tỷ lệ thực hiện lũy kế.</li><li>Vào 12 tháng: xem biến động dòng tiền, in hoặc xuất Excel; sao lưu JSON/HTML khi chuyển máy.</li></ol></div><div class="card"><h2>Quy ước tính</h2><p><b>Kế hoạch tháng</b> = mức đều hàng tháng, trừ khi có số tháng riêng. Khác app gốc, số riêng bằng 0 được hiểu là 0 thật.</p><p><b>Chênh lệch</b> = thực tế − kế hoạch. Cảnh báo chi vượt khi tỷ lệ >101%; thu hụt khi tỷ lệ <90%.</p><p><b>Tháng thực tế</b> chỉ hiện sau khi đã nhập ít nhất một khoản của tháng. Các khoản còn trống không tự được coi là số 0 khi xem từng dòng.</p><p class="note">App hoạt động offline và không gọi API. Số liệu là công cụ quản trị, cần người phụ trách kiểm tra chứng từ và quy tắc kế toán áp dụng.</p></div></div>`}
function render(){nav();$('#statusTitle').textContent=`${db.settings.company||'Đơn vị chưa đặt tên'} · ${db.settings.year}`;$('#screen').innerHTML=({home,plan,actual:actualPage,compare,months:monthsPage,settings:settingsPage,data:dataPage,guide})[page]();if(!$('#saveStatus').textContent.includes('Chưa lưu'))$('#saveStatus').textContent='Đã lưu trên thiết bị'}
function field(label,name,value,type='text',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function openEditor(mode,id){editMode=mode;editId=id||null;let l=db.lines.find(x=>x.id===id);if(mode==='actual'&&!l)return;$('#modalTitle').textContent=mode==='actual'?`Thực tế: ${l.name}`:l?'Sửa khoản mục kế hoạch':'Thêm khoản mục kế hoạch';let fields='';if(mode==='plan'){fields=`<div class="form-grid"><label class="field">Loại<select name="type"><option value="Chi" ${l?.type==='Chi'?'selected':''}>Chi</option><option value="Thu" ${l?.type==='Thu'?'selected':''}>Thu</option></select></label><label class="field">Nhóm<select name="group">${db.settings.groups.map(g=>`<option value="${esc(g)}" ${l?.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select></label>${field('Tên khoản mục','name',l?.name||'','text','required maxlength="160"')}${field('Mức đều mỗi tháng (₫)','monthly',l?.monthly??0,'number','required min="0" max="1000000000000000" step="1"')}</div><h3 style="margin:20px 0 10px">Ngoại lệ từng tháng</h3><p class="muted">Bật “Số riêng” ở tháng cần khác mức đều; 0 là giá trị hợp lệ.</p><div class="month-grid">${MONTHS.map(m=>`<div class="month-cell"><label>Tháng ${m}</label><input name="plan${m}" type="number" min="0" max="1000000000000000" step="1" value="${l?.plan[m-1]??0}" ${l?.plan[m-1]===null||!l?'disabled':''}><label class="switch"><input type="checkbox" name="override${m}" ${l?.plan[m-1]!==null&&l?'checked':''}> Số riêng</label></div>`).join('')}</div>`}else fields=`<p class="note">Để trống nếu chưa có số liệu. Nhập <b>0</b> để xác nhận tháng đã ghi nhận nhưng không phát sinh.</p><div class="month-grid">${MONTHS.map(m=>`<div class="month-cell"><label>Tháng ${m} · KH ${short(planned(l,m-1))}</label><input name="actual${m}" type="number" min="0" max="1000000000000000" step="1" placeholder="Chưa nhập" value="${l.actual[m-1]??''}"></div>`).join('')}</div>`;$('#modalFields').innerHTML=fields;$('#modalError').textContent='';$('#deleteItem').hidden=!l||mode==='actual';$('#editor').showModal()}
function amount(v,allowBlank=false){if(allowBlank&&v==='')return null;let n=Number(v);if(v===''||!Number.isSafeInteger(n)||n<0||n>1e15)throw Error('Số tiền phải là số nguyên từ 0 đến 1.000.000.000.000.000.');return n}
function submitEditor(e){e.preventDefault();let f=e.target,d=new FormData(f);try{if(editMode==='plan'){let name=String(d.get('name')||'').trim(),type=d.get('type'),group=d.get('group');if(!name||name.length>160||!['Thu','Chi'].includes(type)||!db.settings.groups.includes(group))throw Error('Vui lòng kiểm tra tên, loại và nhóm.');if(db.lines.some(l=>l.id!==editId&&l.type===type&&l.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi')))throw Error('Tên khoản mục đã có trong cùng loại.');let monthly=amount(d.get('monthly'));let plan=MONTHS.map(m=>d.has('override'+m)?amount(d.get('plan'+m)):null);if(editId){let l=db.lines.find(x=>x.id===editId);Object.assign(l,{name,type,group,monthly,plan})}else db.lines.push({id:'L-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),name,type,group,monthly,plan,actual:Array(12).fill(null)});}else{let l=db.lines.find(x=>x.id===editId);l.actual=MONTHS.map(m=>amount(String(d.get('actual'+m)??''),true))}db.sample=false;persist();$('#editor').close();render();notify('Đã lưu thay đổi.')}catch(err){$('#modalError').textContent=err.message}}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function fileName(ext){return `AI-Mo-Ngan-Sach-${db.settings.year}.${ext}`}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),fileName('json'));notify('Đã tải JSON.')}
function exportHTML(){let copy=document.documentElement.outerHTML,encoded=encode(db);copy=copy.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encoded+'$2');download(new Blob(['<!doctype html>\n'+copy],{type:'text/html;charset=utf-8'}),fileName('html'));notify('Đã tải HTML kèm dữ liệu.')}
function exportExcel(){let rows=[['Loại','Nhóm','Khoản mục','Mức tháng',...MONTHS.map(m=>'KH T'+m),'KH cả năm',...MONTHS.map(m=>'TT T'+m)],...db.lines.map(l=>[l.type,l.group,l.name,l.monthly,...MONTHS.map(m=>planned(l,m-1)),sum(MONTHS.map(m=>planned(l,m-1))),...l.actual.map(v=>v===null?'':v)])],compareRows=[['Loại','Nhóm','Khoản mục','KH cả năm','KH lũy kế','TT lũy kế','Chênh lệch','Đánh giá'],...db.lines.map(l=>{let r=row(l);return[l.type,l.group,l.name,r.planYear,r.planTo,r.entered?r.actTo:'',r.entered?r.diff:'',r.state]})],monthRows=[['Tháng','Thu KH','Chi KH','Dư KH','Thu TT','Chi TT','Dư TT','Dư lũy kế'],...monthly().map(r=>[r.m,r.tp,r.cp,r.planNet,r.ta??'',r.ca??'',r.actualNet??'',r.acc??''])];download(Excel.workbook([{name:'Ke hoach',rows},{name:'So sanh',rows:compareRows},{name:'12 thang',rows:monthRows}]),fileName('xlsx'));notify('Đã xuất Excel 3 sheet.')}
async function importJSON(file){try{if(!file)return;if(file.size>5e6)throw Error('Tệp lớn quá 5 MB.');let next=validate(JSON.parse(await file.text()));if(!confirm(`Khôi phục ${next.lines.length} khoản mục? Dữ liệu hiện tại sẽ được thay thế.`))return;setData(next);notify('Đã khôi phục JSON.')}catch(err){notify('Lỗi: '+err.message)}}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){setPage(p.dataset.page);return}let a=e.target.closest('[data-act]');if(!a)return;switch(a.dataset.act){case'newPlan':openEditor('plan');break;case'editPlan':openEditor('plan',a.dataset.id);break;case'editActual':openEditor('actual',a.dataset.id);break;case'print':print();break;case'json':exportJSON();break;case'html':exportHTML();break;case'excel':exportExcel();break;case'import':$('#jsonInput').click();break;case'sample':if(confirm('Nạp lại dữ liệu mẫu và thay thế dữ liệu hiện tại?')){setData(sample());notify('Đã nạp dữ liệu mẫu.')}break;case'clear':if(confirm('Tạo bộ dữ liệu trống? Toàn bộ dữ liệu hiện tại sẽ bị thay thế.')){setData(blank());notify('Đã tạo bộ dữ liệu trống.')}break}});
document.addEventListener('change',e=>{if(e.target.matches('[name^="override"]')){let input=e.target.closest('.month-cell').querySelector('input[type="number"]');input.disabled=!e.target.checked}if(e.target.id==='monthSwitch'){db.settings.month=+e.target.value;persist();render()}if(e.target.id==='typeFilter'){typeFilter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}});
$('#settingsForm')?.addEventListener('submit',()=>{});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();let d=new FormData(e.target),year=Number(d.get('year')),month=Number(d.get('month')),company=String(d.get('company')||'').trim();if(!Number.isInteger(year)||year<2000||year>2100||!Number.isInteger(month)||month<1||month>12||company.length>160){notify('Năm, tháng hoặc tên đơn vị chưa hợp lệ.');return}Object.assign(db.settings,{year,month,company});db.sample=false;persist();render();notify('Đã lưu thiết lập.')}if(e.target.id==='groupForm'){e.preventDefault();let v=String(new FormData(e.target).get('group')||'').trim();if(!v||v.length>80||db.settings.groups.some(g=>g.toLocaleLowerCase('vi')===v.toLocaleLowerCase('vi'))){$('#groupError').textContent='Tên nhóm rỗng, quá dài hoặc đã có.';return}db.settings.groups.push(v);db.sample=false;persist();render();notify('Đã thêm nhóm.')}});
$('#itemForm').addEventListener('submit',submitEditor);
$('#closeEditor').addEventListener('click',()=>$('#editor').close());
$('#deleteItem').addEventListener('click',()=>{let l=db.lines.find(x=>x.id===editId);if(l&&confirm(`Xóa “${l.name}” cùng toàn bộ số thực tế?`)){db.lines=db.lines.filter(x=>x.id!==editId);db.sample=false;persist();$('#editor').close();render();notify('Đã xóa khoản mục.')}});
$('#jsonInput').addEventListener('change',e=>{importJSON(e.target.files[0]);e.target.value=''});
render();
</script></body></html>
