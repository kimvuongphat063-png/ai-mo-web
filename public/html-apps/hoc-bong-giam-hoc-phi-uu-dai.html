function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ đầy. Hãy tải JSON hoặc HTML kèm dữ liệu.')}render();return true}
const discount=a=>Math.round(a.tuition*a.rate/100),payable=a=>a.tuition-discount(a);
function termStats(id){let t=term(id),all=db.awards.filter(a=>a.termId===id),approved=all.filter(a=>a.state==='Đã duyệt'),pending=all.filter(a=>a.state==='Chờ duyệt'),committed=approved.reduce((n,a)=>n+discount(a),0);return {budget:t.budget,committed,remaining:t.budget-committed,pending:pending.reduce((n,a)=>n+discount(a),0),approved:approved.length,requests:all.length,tuition:approved.reduce((n,a)=>n+a.tuition,0),payable:approved.reduce((n,a)=>n+payable(a),0)}}
function summary(){let a=db.terms.map(t=>termStats(t.id));return {terms:db.terms.length,policies:db.policies.length,requests:db.awards.length,approved:a.reduce((n,x)=>n+x.approved,0),budget:a.reduce((n,x)=>n+x.budget,0),committed:a.reduce((n,x)=>n+x.committed,0),remaining:a.reduce((n,x)=>n+x.remaining,0),pending:a.reduce((n,x)=>n+x.pending,0)}}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Hồ sơ đã duyệt</small><strong>${s.approved}</strong></div><div><small>Học phí gốc đã duyệt</small><strong>${money(db.awards.filter(a=>a.state==='Đã duyệt').reduce((n,a)=>n+a.tuition,0))}</strong></div><div><small>Đã cam kết giảm</small><strong>${money(s.committed)}</strong></div><div><small>Ngân sách còn</small><strong>${money(s.remaining)}</strong></div><div><small>Đề nghị đang chờ</small><strong>${money(s.pending)}</strong></div></div>`}
function home(){let pending=db.awards.filter(a=>a.state==='Chờ duyệt').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8),alerts=db.policies.filter(p=>p.rate>db.settings.maxRate);return `<div class="hero"><span>🎓 AI MỞ · ƯU ĐÃI HỌC PHÍ</span><h1>Học bổng & giảm học phí</h1><p>Xét ưu đãi có căn cứ, giữ đúng mức giảm tại ngày duyệt và theo dõi ngân sách.</p><div class="hero-actions">${btn('＋ Tạo hồ sơ ưu đãi','newAward','primary')}${btn('📋 Xem chính sách','policies')}</div></div>${metrics()}${panel('📍 Bắt đầu nhanh',`<ol><li>Tạo kỳ ưu đãi với ngân sách được duyệt.</li><li>Thêm chính sách và tỷ lệ giảm. Công bố điều kiện rõ ràng trước khi xét.</li><li>Lập hồ sơ học viên: học phí gốc, khóa học, chính sách và căn cứ xét.</li><li>Duyệt hồ sơ có người duyệt; app kiểm tra trùng học viên/khóa và ngân sách.</li><li>In phiếu, xem báo cáo, sao lưu để chuyển máy.</li></ol><p class="muted">Học phí phải đóng là số sau giảm, <b>không phải tiền đã thu</b>. App này chưa đồng bộ với sổ học phí.</p>`)}<div class="two">${panel('⏳ Chờ duyệt',pending.length?pending.map(a=>`<div class="mini"><button class="link" data-act="openAward" data-id="${esc(a.id)}">${esc(a.studentName)}</button><small>${esc(a.course)} · đề nghị giảm ${money(discount(a))} · ${fmtDate(a.date)}</small></div>`).join(''):'<p class="success">Không có hồ sơ chờ duyệt.</p>')}${panel('⚠️ Chính sách vượt ngưỡng nội bộ',alerts.length?alerts.map(p=>`<div class="mini"><button class="link" data-act="policies">${esc(p.name)}</button><small>${fmtPct(p.rate)} > ${fmtPct(db.settings.maxRate)}</small></div>`).join(''):'<p class="muted">Chưa có chính sách vượt ngưỡng.</p>')}</div>`}
function termsPage(){return `<div class="page-head"><div><h1>🗓️ Kỳ & ngân sách ưu đãi</h1><p>Ngân sách chỉ trừ khi hồ sơ chuyển sang Đã duyệt.</p></div>${btn('＋ Tạo kỳ','newTerm','primary')}</div>${panel('Các kỳ',`<div class="table-wrap"><table><thead><tr><th>Kỳ</th><th>Khoảng ngày</th><th>Ngân sách</th><th>Đã cam kết</th><th>Chờ duyệt</th><th>Còn lại</th><th>Trạng thái</th><th></th></tr></thead><tbody>${db.terms.map(t=>{let s=termStats(t.id);return `<tr><td><b>${esc(t.name)}</b><small>${esc(t.code)}</small></td><td>${fmtDate(t.start)} – ${fmtDate(t.end)}</td><td>${money(s.budget)}</td><td>${money(s.committed)}</td><td>${money(s.pending)}</td><td>${money(s.remaining)}</td><td>${t.state}</td><td>${btn('Xem','openTerm','small',t.id)}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có kỳ.</td></tr>'}</tbody></table></div>`)}`}
function termDetail(){let t=term(selected);if(!t){page='terms';return termsPage()}let s=termStats(t.id),a=db.awards.filter(x=>x.termId===t.id);return `<div class="page-head"><div><button class="link" data-act="terms">← Các kỳ</button><h1>🗓️ ${esc(t.name)}</h1><p>${fmtDate(t.start)} – ${fmtDate(t.end)} · ${t.state}</p></div><div class="actions no-print">${t.state==='Đang mở'?btn('＋ Hồ sơ','newAward','primary',t.id)+btn('Chốt kỳ','closeTerm','',t.id):btn('Mở lại kỳ','reopenTerm','',t.id)}${btn('Điều chỉnh ngân sách','editBudget','',t.id)}${btn('🖨️ In','print')}${btn('Xóa','deleteTerm','danger',t.id)}</div></div><div class="metrics"><div><small>Ngân sách</small><strong>${money(s.budget)}</strong></div><div><small>Đã cam kết</small><strong>${money(s.committed)}</strong></div><div><small>Còn lại</small><strong>${money(s.remaining)}</strong></div><div><small>Chờ duyệt</small><strong>${money(s.pending)}</strong></div><div><small>Đã duyệt</small><strong>${s.approved}</strong></div></div>${panel('📋 Hồ sơ trong kỳ',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Học viên / khóa</th><th>Chính sách</th><th>Học phí gốc</th><th>Giảm</th><th>Phải đóng*</th><th>Tình trạng</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.studentName)}<small>${esc(x.course)}</small></td><td>${esc(policy(x.policyId)?.name||'—')} · ${fmtPct(x.rate)}</td><td>${money(x.tuition)}</td><td>${money(discount(x))}</td><td>${money(payable(x))}</td><td>${x.state}</td><td>${btn('Xem','openAward','small',x.id)}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có hồ sơ.</td></tr>'}</tbody></table></div><p class="note">* Số phải đóng theo ưu đãi, chưa phản ánh đã nộp hay còn nợ.</p>`)}`}
function policiesPage(){return `<div class="page-head"><div><h1>🏷️ Chính sách ưu đãi</h1><p>Tỷ lệ trong hồ sơ đã lập được giữ riêng, không đổi khi sửa chính sách.</p></div>${btn('＋ Thêm chính sách','newPolicy','primary')}</div>${panel('Danh sách chính sách',`<div class="table-wrap"><table><thead><tr><th>Mã / tên</th><th>Loại</th><th>Mức giảm</th><th>Đã duyệt</th><th>Tổng giảm</th><th>Trạng thái</th><th>Lưu ý</th><th></th></tr></thead><tbody>${db.policies.map(p=>{let a=db.awards.filter(x=>x.policyId===p.id&&x.state==='Đã duyệt');return `<tr><td><b>${esc(p.name)}</b><small>${esc(p.code)}</small></td><td>${esc(p.type)}</td><td>${fmtPct(p.rate)}</td><td>${a.length}</td><td>${money(a.reduce((n,x)=>n+discount(x),0))}</td><td>${p.active?'Đang dùng':'Ngừng dùng'}</td><td>${p.rate>db.settings.maxRate?`<span class="pill red">Vượt ngưỡng nội bộ</span>`:'—'}</td><td>${btn('Sửa','editPolicy','small',p.id)} ${btn(p.active?'Ngừng':'Bật','togglePolicy','small',p.id)}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có chính sách.</td></tr>'}</tbody></table></div>`)}${panel('Điều kiện áp dụng',db.policies.length?db.policies.map(p=>`<div class="mini"><b>${esc(p.name)}</b><small>${esc(p.conditions||'Chưa ghi điều kiện — cần bổ sung trước khi dùng thật.')}</small></div>`).join(''):'<p class="muted">Thêm chính sách và mô tả điều kiện.</p>')}`}
function filtered(){return db.awards.filter(a=>(!search||[a.studentCode,a.studentName,a.course,a.className,policy(a.policyId)?.name].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))&&(!termFilter||a.termId===termFilter)&&(!stateFilter||a.state===stateFilter)).sort((a,b)=>b.date.localeCompare(a.date))}
function awardsPage(){return `<div class="page-head"><div><h1>👩‍🎓 Hồ sơ ưu đãi</h1><p>Ghi đề nghị, xét duyệt rồi mới tính vào ngân sách.</p></div>${btn('＋ Thêm hồ sơ','newAward','primary')}</div><div class="card"><div class="filters"><label>Tìm kiếm<input id="search" value="${esc(search)}" placeholder="Học viên, khóa, chính sách…"></label><label>Kỳ<select id="termFilter"><option value="">Tất cả</option>${db.terms.map(t=>`<option value="${esc(t.id)}" ${termFilter===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Tình trạng<select id="stateFilter"><option value="">Tất cả</option>${STATES.map(s=>`<option ${stateFilter===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="table-wrap"><table><thead><tr><th>Học viên</th><th>Kỳ / khóa</th><th>Chính sách</th><th>Học phí gốc</th><th>Giảm</th><th>Phải đóng</th><th>Trạng thái</th><th></th></tr></thead><tbody>${filtered().map(a=>`<tr><td><button class="link" data-act="openAward" data-id="${esc(a.id)}">${esc(a.studentName)}</button><small>${esc(a.studentCode)} · ${esc(a.className||'')}</small></td><td>${esc(term(a.termId)?.name||'—')}<small>${esc(a.course)}</small></td><td>${esc(policy(a.policyId)?.name||'—')} · ${fmtPct(a.rate)}</td><td>${money(a.tuition)}</td><td>${money(discount(a))}</td><td>${money(payable(a))}</td><td><span class="pill ${a.state==='Đã duyệt'?'green':'amber'}">${a.state}</span></td><td>${btn('Xem','openAward','small',a.id)}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có hồ sơ phù hợp.</td></tr>'}</tbody></table></div></div>`}

function reports(){let a=db.terms.slice();return `<div class="page-head"><div><h1>📊 Báo cáo ưu đãi</h1><p>Chỉ hồ sơ Đã duyệt được tính vào số tiền cam kết và ngân sách.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo kỳ',`<div class="table-wrap"><table><thead><tr><th>Kỳ</th><th>Ngân sách</th><th>Đã cam kết</th><th>Còn lại</th><th>Hồ sơ chờ</th><th>Học phí phải đóng*</th></tr></thead><tbody>${a.map(t=>{let s=termStats(t.id);return `<tr><td>${esc(t.name)}</td><td>${money(s.budget)}</td><td>${money(s.committed)}</td><td>${money(s.remaining)}</td><td>${money(s.pending)}</td><td>${money(s.payable)}</td></tr>`}).join('')||'<tr><td colspan="6">Chưa có kỳ.</td></tr>'}</tbody></table></div>`)}${panel('Theo chính sách',`<div class="table-wrap"><table><thead><tr><th>Chính sách</th><th>Hồ sơ duyệt</th><th>Học phí gốc</th><th>Tổng giảm</th><th>Phải đóng*</th></tr></thead><tbody>${db.policies.map(p=>{let a=db.awards.filter(x=>x.policyId===p.id&&x.state==='Đã duyệt');return `<tr><td>${esc(p.name)}</td><td>${a.length}</td><td>${money(a.reduce((n,x)=>n+x.tuition,0))}</td><td>${money(a.reduce((n,x)=>n+discount(x),0))}</td><td>${money(a.reduce((n,x)=>n+payable(x),0))}</td></tr>`}).join('')||'<tr><td colspan="5">Chưa có chính sách.</td></tr>'}</tbody></table></div><p class="note">* Số phải đóng chưa trừ khoản học viên đã thanh toán.</p>`)}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngưỡng xét duyệt nội bộ',`<form id="settingsForm" class="form-grid"><label>Nhắc khi tỷ lệ chính sách vượt (%)<input name="maxRate" type="number" min="0" max="100" step="0.1" value="${db.settings.maxRate}" required></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="note">Mặc định mẫu là 50%. Chính sách vượt ngưỡng vẫn có thể được duyệt nếu người duyệt ghi lý do; ngân sách kỳ vẫn phải đủ.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu và chuyển máy',`<p>Thay đổi lưu trong trình duyệt của máy này. File HTML gốc không tự mang dữ liệu đã nhập. Dùng JSON hoặc HTML kèm dữ liệu để chuyển máy và giữ riêng thông tin học viên.</p><div class="actions">${btn('⬇️ Tải JSON','exportJson')}${btn('⬇️ Tải HTML kèm dữ liệu','exportHtml','primary')}${btn('⬇️ Excel 4 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Mẫu nguồn',`<p>6 chính sách, 20 hồ sơ đã áp dụng; học phí gốc 39,1 triệu, giảm 5,92 triệu. Ngân sách kỳ mẫu 20 triệu còn 14,08 triệu. Nạp mẫu sẽ thay dữ liệu hiện tại.</p>${btn('Nạp mẫu nguồn','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ dữ liệu app trên thiết bị hiện tại.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Quy trình',`<ol><li>Tạo kỳ ưu đãi với ngày bắt đầu/kết thúc và ngân sách.</li><li>Thêm chính sách, mô tả điều kiện, tỷ lệ giảm; chỉ để chính sách đang dùng khi tiếp nhận hồ sơ.</li><li>Lập hồ sơ cho một học viên và một khóa học; nhập học phí gốc, căn cứ xét.</li><li>Gửi duyệt. Người phụ trách ghi tên và lý do trước khi duyệt; app chặn trùng học viên/khóa trong kỳ và chặn vượt ngân sách.</li><li>In phiếu, báo cáo và sao lưu. Nếu hủy duyệt, tiền giảm được trả lại ngân sách và lịch sử vẫn còn.</li></ol>`)}${panel('Công thức & phạm vi',`<p>Số giảm = làm tròn học phí gốc × tỷ lệ tại lúc lập hồ sơ / 100. Phải đóng = học phí gốc − số giảm. Ngân sách còn = ngân sách kỳ − tổng giảm của hồ sơ Đã duyệt.</p><p>Mỗi hồ sơ dùng một chính sách. Nếu cơ sở cho cộng dồn nhiều ưu đãi, cần một quy tắc riêng được duyệt trước khi nhập. App này chưa xác nhận đã thu tiền hoặc hóa đơn.</p>`)}`}
function render(){let map={home:['Tổng quan',home],terms:['Kỳ ưu đãi',termsPage],termDetail:['Chi tiết kỳ',termDetail],policies:['Chính sách',policiesPage],awards:['Hồ sơ',awardsPage],awardDetail:['Chi tiết hồ sơ',awardDetail],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,l,v='',type='text',opts=null){return `<label class="${type==='textarea'?'full':''}">${l}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(v)}</textarea>`:opts?`<select name="${n}">${opts.map(o=>{let key=Array.isArray(o)?o[0]:o,label=Array.isArray(o)?o[1]:o;return `<option value="${esc(key)}" ${key===v?'selected':''}>${esc(label)}</option>`}).join('')}</select>`:`<input name="${n}" type="${type}" value="${esc(v)}" ${type==='number'?'step="0.1" min="0"':''} ${['code','name','start','end','budget','studentCode','studentName','course','date','tuition'].includes(n)?'required':''}>`}</label>`}
function openModal(kind,id='',ref=''){let before=id?clone(kind==='policy'?policy(id):kind==='award'?award(id):null):null;draft={kind,id,ref,before};let x=before||{},f='';if(kind==='term'){f=field('code','Mã kỳ','')+field('name','Tên kỳ','')+field('start','Từ ngày',today(),'date')+field('end','Đến ngày',today(),'date')+field('budget','Ngân sách (đồng)',0,'number')+field('note','Ghi chú','','textarea')}else if(kind==='policy'){f=field('code','Mã chính sách',x.code||'')+field('name','Tên chính sách',x.name||'')+field('type','Loại',x.type||'Học bổng','text',TYPES)+field('rate','Tỷ lệ giảm (%)',x.rate??0,'number')+field('conditions','Điều kiện áp dụng',x.conditions||'','textarea')+field('note','Ghi chú',x.note||'','textarea')}else{let terms=db.terms.filter(t=>t.state==='Đang mở').map(t=>[t.id,t.name]),policies=db.policies.filter(p=>p.active||p.id===x.policyId).map(p=>[p.id,p.code+' · '+p.name+' · '+fmtPct(p.rate)]),tid=x.termId||ref||terms[0]?.[0]||'',pid=x.policyId||policies[0]?.[0]||'';f=field('termId','Kỳ ưu đãi',tid,'text',terms)+field('date','Ngày đề nghị',x.date||today(),'date')+field('studentCode','Mã học viên',x.studentCode||'')+field('studentName','Họ tên học viên',x.studentName||'')+field('className','Lớp',x.className||'')+field('course','Khóa học',x.course||'')+field('tuition','Học phí gốc (đồng)',x.tuition??'','number')+field('policyId','Chính sách',pid,'text',policies)+field('evidence','Căn cứ / minh chứng',x.evidence||'','textarea')}$('#modalTitle').textContent=kind==='term'?'Tạo kỳ ưu đãi':kind==='policy'?(id?'Sửa chính sách':'Thêm chính sách'):(id?'Sửa hồ sơ':'Lập hồ sơ ưu đãi');$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function error(s){$('#formError').textContent=s}function audit(action,reason,awardId='',termId=''){db.audit.push({id:uid(),action,reason,awardId,termId,at:new Date().toISOString()})}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let kind=draft.kind;if(kind==='term'){x.code=x.code.toUpperCase();x.budget=Number(x.budget);x.state='Đang mở';if(!x.code||!x.name||!dateOK(x.start)||!dateOK(x.end)||x.end<x.start||!Number.isSafeInteger(x.budget)||x.budget<0||db.terms.some(t=>t.code===x.code)){error('Mã kỳ không trùng, ngày hợp lệ và ngân sách không âm là bắt buộc.');return}db.terms.push(x);audit('Tạo kỳ',x.name,'',x.id);selected=x.id;page='termDetail'}else if(kind==='policy'){x.code=x.code.toUpperCase();x.rate=Number(x.rate);let old=policy(x.id);if(!x.code||!x.name||!TYPES.includes(x.type)||!Number.isFinite(x.rate)||x.rate<0||x.rate>100||db.policies.some(p=>p.code===x.code&&p.id!==x.id)){error('Mã không trùng, tên, loại và tỷ lệ 0–100% là bắt buộc.');return}x.active=old?.active??true;if(old)Object.assign(old,x);else db.policies.push(x);audit(old?'Sửa chính sách':'Thêm chính sách',x.name);page='policies'}else{x.studentCode=x.studentCode.toUpperCase();x.tuition=Number(x.tuition);let t=term(x.termId),p=policy(x.policyId),old=award(x.id);if(!t||t.state!=='Đang mở'||!p||!p.active||!dateOK(x.date)||x.date<t.start||x.date>t.end||!x.studentCode||!x.studentName||!x.course||!Number.isSafeInteger(x.tuition)||x.tuition<=0){error('Kỳ đang mở, ngày trong kỳ, học viên, khóa, học phí và chính sách đang dùng là bắt buộc.');return}if(old&&old.state!=='Nháp'&&old.state!=='Chờ duyệt'){error('Hồ sơ đã quyết định không sửa trực tiếp.');return}x.rate=p.rate;x.state=old?.state||'Nháp';x.approvedBy='';x.approvedAt='';x.reason='';if(old)Object.assign(old,x);else db.awards.push(x);audit(old?'Sửa hồ sơ':'Lập hồ sơ',x.studentName+' · '+p.code,x.id,x.termId);selected=x.id;page='awardDetail'}let err=validate(db);if(err){let list=kind==='term'?db.terms:kind==='policy'?db.policies:db.awards;if(draft.before)Object.assign(list.find(z=>z.id===x.id),draft.before);else list.splice(list.findIndex(z=>z.id===x.id),1);db.audit.pop();error(err);return}$('#editor').close();save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'hoc-bong-uu-dai-sao-luu.json')}function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'hoc-bong-uu-dai-kem-du-lieu.html')}
const HT=['ID','Mã kỳ','Tên kỳ','Từ ngày','Đến ngày','Ngân sách','Tình trạng','Ghi chú'],HP=['ID','Mã chính sách','Tên','Loại','Tỷ lệ','Đang dùng','Điều kiện','Ghi chú'],HA=['ID','ID kỳ','Ngày','Mã học viên','Tên học viên','Lớp','Khóa','Học phí gốc','ID chính sách','Tỷ lệ chụp','Minh chứng','Tình trạng','Người duyệt','Thời điểm duyệt','Lý do'],HH=['ID','Hành động','Lý do','ID hồ sơ','ID kỳ','Thời điểm'];
function sheets(){return [{name:'Ky uu dai',rows:[HT,...db.terms.map(t=>[t.id,t.code,t.name,t.start,t.end,t.budget,t.state,t.note])]},{name:'Chinh sach',rows:[HP,...db.policies.map(p=>[p.id,p.code,p.name,p.type,p.rate,p.active?'Có':'Không',p.conditions,p.note])]},{name:'Ho so',rows:[HA,...db.awards.map(a=>[a.id,a.termId,a.date,a.studentCode,a.studentName,a.className,a.course,a.tuition,a.policyId,a.rate,a.evidence,a.state,a.approvedBy,a.approvedAt,a.reason])]},{name:'Nhat ky',rows:[HH,...db.audit.map(h=>[h.id,h.action,h.reason,h.awardId,h.termId,h.at])]}]}function exportExcel(){download(Excel.workbook(sheets()),'hoc-bong-uu-dai.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Ky uu dai',HT],['Chinh sach',HP],['Ho so',HA],['Nhat ky',HH]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng mẫu bốn sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.terms=b['Ky uu dai'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),name:String(r[2]),start:String(r[3]),end:String(r[4]),budget:Number(r[5]),state:String(r[6]),note:String(r[7]||'')}));x.policies=b['Chinh sach'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),name:String(r[2]),type:String(r[3]),rate:Number(r[4]),active:String(r[5])==='Có',conditions:String(r[6]||''),note:String(r[7]||'')}));x.awards=b['Ho so'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),termId:String(r[1]),date:String(r[2]),studentCode:String(r[3]),studentName:String(r[4]),className:String(r[5]||''),course:String(r[6]),tuition:Number(r[7]),policyId:String(r[8]),rate:Number(r[9]),evidence:String(r[10]||''),state:String(r[11]),approvedBy:String(r[12]||''),approvedAt:String(r[13]||''),reason:String(r[14]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),awardId:String(r[3]||''),termId:String(r[4]||''),at:String(r[5])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.terms.length} kỳ và ${x.awards.length} hồ sơ?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today(),shift=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')},termId=uid(),map=new Map();x.terms.push({id:termId,code:'MAU-KY',name:'Kỳ ưu đãi mẫu',start:shift('@-60'),end:today(),budget:20000000,state:'Đang mở',note:'Thời gian suy ra để trình bày ngày mẫu tương đối.'});for(let r of SCHOLAR_SAMPLE.cs){let id=uid();map.set(r[0],id);x.policies.push({id,code:r[0],name:r[1],type:r[2],rate:r[3],active:true,conditions:'Mẫu nguồn chưa ghi điều kiện chi tiết.',note:'Chỉ dùng minh họa.'})}for(let [i,r] of SCHOLAR_SAMPLE.ap.entries())x.awards.push({id:uid(),termId,date:shift(r[0]),studentCode:'MAU-'+String(i+1).padStart(3,'0'),studentName:r[1],className:'',course:'Khóa học mẫu',tuition:r[2],policyId:map.get(r[3]),rate:x.policies.find(p=>p.id===map.get(r[3])).rate,evidence:'Nguồn không có minh chứng xét duyệt.',state:'Đã duyệt',approvedBy:'Mẫu nguồn',approvedAt:new Date().toISOString(),reason:'Dữ liệu minh họa từ file tham chiếu; không phải phê duyệt thực.'});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;if(k==='newTerm')openModal('term');else if(k==='newPolicy')openModal('policy');else if(k==='editPolicy')openModal('policy',id);else if(k==='newAward'){if(!db.terms.some(t=>t.state==='Đang mở')||!db.policies.some(p=>p.active)){alert('Tạo kỳ đang mở và chính sách đang dùng trước.');return}openModal('award','',id)}else if(k==='editAward')openModal('award',id);else if(k==='openTerm'){selected=id;page='termDetail';render()}else if(k==='openAward'){selected=id;page='awardDetail';render()}else if(['terms','awards','policies'].includes(k)){page=k;render()}else if(k==='togglePolicy'){let p=policy(id);p.active=!p.active;audit(p.active?'Bật chính sách':'Ngừng chính sách',p.code);save()}else if(k==='submitAward'){let a=award(id);if(a.state==='Nháp'){a.state='Chờ duyệt';audit('Gửi duyệt',a.studentName,a.id,a.termId);save()}}else if(k==='approveAward'){let a=award(id),t=term(a.termId),name=prompt('Tên người duyệt:');if(name===null)return;if(!name.trim()){alert('Cần người duyệt.');return}let reason=prompt('Căn cứ / lý do duyệt:');if(reason===null)return;if(!reason.trim()){alert('Cần ghi căn cứ duyệt.');return}if(a.rate>db.settings.maxRate&&!reason.trim()){alert('Cần lý do cho tỷ lệ vượt ngưỡng.');return}if(db.awards.some(x=>x.id!==a.id&&x.termId===a.termId&&x.state==='Đã duyệt'&&x.studentCode===a.studentCode&&x.course.toLocaleLowerCase('vi')===a.course.toLocaleLowerCase('vi'))){alert('Học viên đã có ưu đãi được duyệt cho khóa này trong kỳ.');return}if(discount(a)>termStats(t.id).remaining){alert('Ngân sách kỳ không đủ để duyệt hồ sơ.');return}a.state='Đã duyệt';a.approvedBy=name.trim();a.approvedAt=new Date().toISOString();a.reason=reason.trim();audit('Duyệt ưu đãi',a.studentName+' · '+money(discount(a))+' · '+reason.trim(),a.id,a.termId);save()}else if(k==='rejectAward'||k==='cancelAward'){let a=award(id),reason=prompt(k==='rejectAward'?'Lý do từ chối:':'Lý do hủy duyệt:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}a.state=k==='rejectAward'?'Từ chối':'Hủy';a.reason=reason.trim();audit(k==='rejectAward'?'Từ chối':'Hủy duyệt',a.studentName+' · '+reason.trim(),a.id,a.termId);save()}else if(k==='editBudget'){let t=term(id),v=prompt('Ngân sách mới (đồng):',String(t.budget));if(v===null)return;let n=Number(v);if(!Number.isSafeInteger(n)||n<termStats(id).committed){alert('Ngân sách phải là số nguyên và không nhỏ hơn số đã duyệt.');return}let reason=prompt('Lý do điều chỉnh ngân sách:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}let old=t.budget;t.budget=n;audit('Điều chỉnh ngân sách',money(old)+' → '+money(n)+' · '+reason.trim(),'',id);save()}else if(k==='closeTerm'||k==='reopenTerm'){let t=term(id),reason=k==='reopenTerm'?prompt('Lý do mở lại kỳ:'):'Đã kết thúc xét duyệt';if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}t.state=k==='closeTerm'?'Đã chốt':'Đang mở';audit(k==='closeTerm'?'Chốt kỳ':'Mở lại kỳ',reason.trim(),'',id);save()}else if(k==='deleteTerm'){let t=term(id);if(db.awards.some(a=>a.termId===id)){alert('Kỳ đã có hồ sơ, không thể xóa.');return}if(confirm('Xóa kỳ này?')){db.terms=db.terms.filter(x=>x.id!==id);audit('Xóa kỳ',t.code,'',id);page='terms';save()}}else if(k==='saveSettings'){let n=Number(new FormData($('#settingsForm')).get('maxRate'));if(!Number.isFinite(n)||n<0||n>100){alert('Ngưỡng phải từ 0 đến 100%.');return}db.settings.maxRate=n;save()}else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let n=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(n,n)}if(e.target.id==='termFilter'){termFilter=e.target.value;render()}if(e.target.id==='stateFilter'){stateFilter=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
window.ScholarApp={getDB:()=>clone(db),validate,discount,payable,termStats,summary,loadSample,encode,decode,sheets,importFile};
</script></body></html>
