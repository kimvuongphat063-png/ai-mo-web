const BY_ID=new Map(BANK.map(q=>[q.id,q]));
const SUBJECTS={math:'Toán',viet:'Tiếng Việt',english:'Tiếng Anh',mathen:'Toán bằng tiếng Anh'};
const SUBJECT_ORDER=['math','viet','english','mathen'];
const $=(s,root=document)=>root.querySelector(s),$$=(s,root=document)=>[...root.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const localDay=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const day=()=>localDay(Date.now()),KEY='ai-mo-daily-review-v2',APP='ai-mo-daily-review',SCHEMA=2;
const empty=()=>({app:APP,schema:SCHEMA,updatedAt:0,profiles:[{id:'student-1',name:'Học sinh',grade:1}],activeProfile:'student-1',attempts:[],mastery:{},session:null});
const clean=x=>x&&x.app===APP&&x.schema===SCHEMA&&Array.isArray(x.profiles)&&Array.isArray(x.attempts)&&x.mastery&&typeof x.mastery==='object'?x:null;
function embedded(){try{return clean(JSON.parse(decodeURIComponent(escape(atob($('#embedded-state').textContent.trim())))))}catch{return null}}
function local(){try{return clean(JSON.parse(localStorage.getItem(KEY)||'null'))}catch{return null}}
let data=(()=>{let a=embedded(),b=local();return(b?.updatedAt||0)>(a?.updatedAt||0)?b:a||b||empty()})();
if(!data.profiles.length)data=empty();if(!data.profiles.some(p=>p.id===data.activeProfile))data.activeProfile=data.profiles[0].id;
let page='home',subject='all',topic='all',mode='learn',detailAttempt=null,editing=null,ticker=null;
const profile=()=>data.profiles.find(p=>p.id===data.activeProfile)||data.profiles[0];
const norm=v=>String(v??'').normalize('NFC').trim().replace(/\s+/g,' ').toLocaleLowerCase('vi');
function save(){data.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Trình duyệt không lưu được tiến độ. Hãy tải HTML kèm dữ liệu hoặc sao lưu JSON.')}render()}
function hash(s){let h=2166136261;for(let c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function ordered(a,seed){return [...a].sort((x,y)=>hash(seed+x.id)-hash(seed+y.id))}
function options(q){return ordered((q.choices||[]).map((v,i)=>({id:String(i),value:String(v)})),data.session?.seed||day()+q.id)}
function available(grade){return SUBJECT_ORDER.filter(s=>BANK.some(q=>q.grade===grade&&q.subject===s))}
function topics(grade,sub){return [...new Set(BANK.filter(q=>q.grade===grade&&(sub==='all'||q.subject===sub)).map(q=>q.topic))].sort((a,b)=>a.localeCompare(b,'vi'))}
function pool(){let g=profile().grade;return BANK.filter(q=>q.grade===g&&(subject==='all'||q.subject===subject)&&(topic==='all'||q.topic===topic))}
function mastery(){return data.mastery[profile().id]||{}}
function stateOf(q){return mastery()[q.id]||null}
function priority(q){let s=stateOf(q);return s?.lastWrong?0:s?.due&&s.due<=Date.now()?1:!s?2:3}
function queue(source,seed){let groups=SUBJECT_ORDER.map(s=>ordered(source.filter(q=>q.subject===s),seed+s).sort((a,b)=>priority(a)-priority(b))).filter(a=>a.length),result=[];while(result.length<10&&groups.some(a=>a.length))for(let a of groups){if(a.length&&result.length<10)result.push(a.shift())}return result}
function dueQuestions(){return BANK.filter(q=>q.grade===profile().grade&&stateOf(q)?.due<=Date.now())}
function wrongQuestions(){return BANK.filter(q=>q.grade===profile().grade&&stateOf(q)?.lastWrong)}
function start(review=''){if(data.session&&!data.session.ended&&!confirm('Buổi học đang làm sẽ được thay bằng buổi mới. Tiếp tục?'))return;let source=review==='wrong'?wrongQuestions():review==='due'?dueQuestions():pool();if(!source.length){alert(review==='wrong'?'Chưa có câu sai cần ôn.':review==='due'?'Chưa có câu đến hạn ôn.':'Chưa có bài cho lựa chọn này.');return}let seed=day()+'|'+profile().id+'|'+subject+'|'+topic+'|'+data.attempts.length+'|'+review,items=queue(source,seed);data.session={id:uid(),profileId:profile().id,grade:profile().grade,subject,topic,mode,review,seed,ids:items.map(x=>x.id),answers:{},checked:{},parts:{},index:0,startedAt:Date.now(),deadline:Date.now()+600000,ended:false};page='play';save();startTimer()}
function current(){return BY_ID.get(data.session?.ids[data.session.index])}
function answer(value){let s=data.session;if(!s||s.ended)return;let q=current();if(s.mode==='learn'&&s.checked[q.id])return;s.answers[q.id]=String(value);if(s.mode==='learn')s.checked[q.id]=true;save()}
function chooseTile(index){let s=data.session,q=current();if(!s||s.ended||s.mode==='learn'&&s.checked[q.id])return;let parts=s.parts[q.id]||[];if(parts.includes(index))return;parts.push(index);s.parts[q.id]=parts;s.answers[q.id]=parts.map(i=>q.tokens[i]).join('');save()}
function correct(q,answer){return norm(q.a)===norm(answer)}
function finish(){let s=data.session;if(!s||s.ended)return;s.ended=true;clearInterval(ticker);let score=0,details=[];data.mastery[s.profileId]||={};let map=data.mastery[s.profileId];for(let id of s.ids){let q=BY_ID.get(id),isCorrect=correct(q,s.answers[id]);if(isCorrect)score++;let old=map[id]||{streak:0,interval:0};let streak=isCorrect?old.streak+1:0,interval=isCorrect?[1,3,7,14,30][Math.min(streak-1,4)]:0;map[id]={streak,interval,lastWrong:!isCorrect,due:Date.now()+interval*86400000,lastAt:Date.now(),seen:(old.seen||0)+1,correct:(old.correct||0)+(isCorrect?1:0)};details.push({id,answer:s.answers[id]||'',correct:isCorrect})}let attempt={id:s.id,profileId:s.profileId,grade:s.grade,subject:s.subject,topic:s.topic,mode:s.mode,review:s.review,at:new Date().toISOString(),seconds:Math.min(600,Math.max(0,Math.round((Date.now()-s.startedAt)/1000))),score,total:s.ids.length,details};data.attempts.unshift(attempt);data.attempts=data.attempts.slice(0,300);if(s.profileId===data.activeProfile){page='result';detailAttempt=attempt.id}save()}
function startTimer(){clearInterval(ticker);ticker=setInterval(()=>{let s=data.session;if(!s||s.ended){clearInterval(ticker);return}let left=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));let el=$('#timer');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left===0)finish()},500)}
function timeLeft(){let left=Math.max(0,Math.ceil((data.session.deadline-Date.now())/1000));return String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}
function hero(title,desc){return '<div class="hero"><small>AI MỞ · HỌC CÙNG CON OFFLINE</small><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>'}
function metric(label,value,sub='',tone=''){return '<div class="metric"><small>'+esc(label)+'</small><strong class="'+tone+'">'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>'}
function attempts(){return data.attempts.filter(a=>a.profileId===profile().id)}
function streak(){let dates=new Set(attempts().map(a=>localDay(a.at))),now=new Date(),n=0;if(!dates.has(day()))now.setDate(now.getDate()-1);while(dates.has(localDay(now))){n++;now.setDate(now.getDate()-1)}return n}
function home(){let p=profile(),a=attempts(),latest=a[0],due=dueQuestions().length,wrong=wrongQuestions().length,todayDone=a.filter(x=>localDay(x.at)===day()).length;return hero('Ôn bài 10 phút mỗi ngày','Một buổi ngắn, có lời giải, câu sai và lịch ôn lại riêng cho từng học sinh.')+'<div class="card"><div class="toolbar"><h2 class="grow">Xin chào, '+esc(p.name)+' · lớp '+p.grade+'</h2><button class="btn" data-page="profiles">Đổi học sinh</button></div><div class="grid">'+metric('Buổi hôm nay',String(todayDone),todayDone?'Đã luyện hôm nay':'Bắt đầu một buổi 10 phút')+metric('Chuỗi ngày học',streak()+' ngày','Mỗi ngày có ít nhất một buổi')+metric('Câu sai cần ôn',String(wrong),'Ưu tiên trong buổi tiếp theo',wrong?'warn':'good')+metric('Câu đến hạn',String(due),'Luyện để nhớ lâu')+'</div><div class="toolbar" style="margin-top:18px"><button class="btn primary" data-page="bank">Chọn bài 10 phút</button>'+(data.session&&!data.session.ended&&data.session.profileId===p.id?'<button class="btn" data-action="resume">Tiếp tục buổi đang học</button>':'')+(wrong?'<button class="btn" data-action="reviewWrong">Ôn câu sai</button>':'')+(due?'<button class="btn" data-action="reviewDue">Ôn đến hạn</button>':'')+'</div></div><div class="grid two"><div class="card"><h2>Môn có ở lớp '+p.grade+'</h2><div class="grid">'+available(p.grade).map(s=>'<button class="btn subject-card" type="button" data-quick-subject="'+s+'"><b>'+SUBJECTS[s]+'</b><br><span class="mini">'+BANK.filter(q=>q.grade===p.grade&&q.subject===s).length+' mục luyện · Chọn môn này →</span></button>').join('')+'</div></div><div class="card"><h2>Buổi gần nhất</h2>'+(latest?'<p><b>'+latest.score+'/'+latest.total+' câu đúng</b> · '+new Date(latest.at).toLocaleString('vi-VN')+'</p><p>'+esc(latest.subject==='all'?'Nhiều môn':SUBJECTS[latest.subject])+' · '+(latest.mode==='learn'?'Luyện có lời giải':'Thử thách')+'</p><button class="btn" data-action="viewAttempt" data-id="'+esc(latest.id)+'">Xem lời giải</button>':'<div class="empty">Chưa có buổi học. Bắt đầu hôm nay nhé.</div>')+'</div></div>'}
function bankPage(){let p=profile(),subjects=available(p.grade),list=pool(),ts=topics(p.grade,subject);return hero('Chọn bài ôn','Lớp '+p.grade+' · chọn môn và chủ đề có sẵn; mỗi buổi tối đa 10 câu trong 10 phút.')+'<div class="card"><h2>1. Môn học</h2><div class="grid"><button type="button" class="btn subject-card '+(subject==='all'?'primary':'')+'" aria-pressed="'+(subject==='all')+'" data-subject="all">Trộn các môn<br><span class="mini">'+BANK.filter(q=>q.grade===p.grade).length+' mục</span></button>'+subjects.map(s=>'<button type="button" class="btn subject-card '+(subject===s?'primary':'')+'" aria-pressed="'+(subject===s)+'" data-subject="'+s+'">'+SUBJECTS[s]+'<br><span class="mini">'+BANK.filter(q=>q.grade===p.grade&&q.subject===s).length+' mục</span></button>').join('')+'</div></div><div class="card"><h2>2. Chủ đề</h2><div class="toolbar"><button class="btn '+(topic==='all'?'primary':'')+'" data-topic="all">Tổng hợp</button>'+ts.map(t=>'<button class="btn '+(topic===t?'primary':'')+'" data-topic="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div><p class="muted">Có '+list.length+' mục phù hợp. Một buổi không lặp câu.</p></div><div class="card"><h2>3. Cách làm</h2><div class="toolbar"><button class="btn '+(mode==='learn'?'primary':'')+'" data-mode="learn">Luyện có lời giải từng câu</button><button class="btn '+(mode==='exam'?'primary':'')+'" data-mode="exam">Thử thách, xem lời giải cuối buổi</button></div><p class="hint">Đồng hồ 10 phút chạy theo thời gian thực. Nếu rời trang rồi quay lại, buổi đang làm vẫn được giữ trên máy này.</p><button class="btn primary" data-action="start">Bắt đầu '+Math.min(10,list.length)+' câu</button></div>'}
function play(){let s=data.session;if(!s)return home();let q=current();if(!q)return '<div class="card">Không tìm thấy câu hỏi trong phiên này.</div>';let answer=s.answers[q.id]||'',checked=!!s.checked[q.id],isCorrect=correct(q,answer),opts='';if(q.kind==='choice')opts='<div class="choice-grid">'+options(q).map(o=>'<button class="btn '+(answer===o.value?'chosen ':'')+(checked&&o.value===q.a?'correct':checked&&answer===o.value&&!isCorrect?'wrong':'')+'" data-answer="'+esc(o.value)+'" '+(checked?'disabled':'')+'>'+esc(o.value)+'</button>').join('')+'</div>';if(q.kind==='fill')opts='<div class="field"><label for="freeAnswer">Gõ đáp án</label><input id="freeAnswer" value="'+esc(answer)+'" '+(checked?'disabled':'')+' autocomplete="off"></div><p><button class="btn" data-action="answerText" '+(checked?'disabled':'')+'>Lưu câu trả lời</button></p>';if(q.kind==='tiles'){let parts=s.parts[q.id]||[];opts='<p>Đã ghép: <b>'+esc(answer||'…')+'</b></p><div class="toolbar">'+q.tokens.map((t,i)=>'<button class="btn" data-tile="'+i+'" '+(parts.includes(i)||checked?'disabled':'')+'>'+esc(t.trim())+'</button>').join('')+'</div><button class="btn small" data-action="resetTiles" '+(checked?'disabled':'')+'>Ghép lại</button>'}return hero('Buổi ôn 10 phút','Lớp '+s.grade+' · '+(s.subject==='all'?'Nhiều môn':SUBJECTS[s.subject])+' · '+(s.mode==='learn'?'Có lời giải từng câu':'Thử thách'))+'<div class="card"><div class="quiz-head"><span class="badge">Câu '+(s.index+1)+' / '+s.ids.length+'</span><span class="badge">'+SUBJECTS[q.subject]+' · '+esc(q.topic)+'</span><span class="timer" id="timer">'+timeLeft()+'</span></div><div class="progress" style="margin-top:14px"><i style="width:'+(Object.keys(s.answers).length/s.ids.length*100)+'%"></i></div><h2 class="quiz-q">'+esc(q.q)+'</h2>'+opts+(s.mode==='learn'&&checked?'<div class="quiz-feedback '+(isCorrect?'':'bad')+'"><b>'+(isCorrect?'Đúng rồi!':'Đáp án: '+esc(q.a))+'</b><p>'+esc(q.explain)+'</p></div>':'')+'<div class="toolbar" style="margin-top:18px">'+(s.mode==='learn'&&!checked&&answer?'<button class="btn primary" data-action="check">Kiểm tra câu này</button>':'')+'<button class="btn" data-action="next">Câu tiếp</button><button class="btn" data-action="finish">Nộp bài</button></div><div class="dotnav">'+s.ids.map((id,i)=>'<button class="btn small '+(i===s.index?'active':s.answers[id]?'done':'')+'" data-index="'+i+'">'+(i+1)+'</button>').join('')+'</div></div>'}
function result(){let a=data.attempts.find(x=>x.id===detailAttempt)||data.attempts[0];if(!a)return home();return hero('Kết quả: '+a.score+'/'+a.total+' câu đúng','Buổi học '+new Date(a.at).toLocaleString('vi-VN')+' · '+Math.ceil(a.seconds/60)+' phút')+'<div class="card"><div class="toolbar"><button class="btn primary" data-page="bank">Chọn bài tiếp</button><button class="btn" data-page="wrong">Ôn câu sai</button><button class="btn" data-action="print">In kết quả</button></div><div class="grid">'+metric('Đúng',String(a.score))+metric('Cần ôn',String(a.total-a.score))+metric('Thời gian',Math.floor(a.seconds/60)+' phút '+a.seconds%60+' giây')+'</div></div>'+a.details.map((d,i)=>{let q=BY_ID.get(d.id);return '<div class="card"><span class="badge '+(d.correct?'ok':'loss')+'">Câu '+(i+1)+' · '+(d.correct?'Đúng':'Cần ôn')+'</span><h2>'+esc(q?.q||d.id)+'</h2><p>Em trả lời: <b>'+esc(d.answer||'Bỏ trống')+'</b></p><p>Đáp án: <b>'+esc(q?.a||'')+'</b></p><p class="muted">'+esc(q?.explain||'')+'</p></div>'}).join('')}
function wrongPage(){let wrong=wrongQuestions(),due=dueQuestions();return hero('Ôn câu sai','Câu trả lời sai được ưu tiên cho lần ôn tiếp theo; câu đúng sẽ được lên lịch ôn sau.')+'<div class="card"><div class="toolbar"><h2 class="grow">'+wrong.length+' câu sai · '+due.length+' câu đến hạn</h2><button class="btn primary" data-action="reviewWrong" '+(!wrong.length?'disabled':'')+'>Ôn câu sai</button><button class="btn" data-action="reviewDue" '+(!due.length?'disabled':'')+'>Ôn đến hạn</button></div>'+(wrong.length?wrong.slice(0,40).map(q=>'<div class="review-row"><b>'+SUBJECTS[q.subject]+' · '+esc(q.topic)+'</b><p>'+esc(q.q)+'</p><span class="muted">Đáp án: '+esc(q.a)+'</span></div>').join(''):'<div class="empty">Chưa có câu sai. Em hãy bắt đầu một buổi học.</div>')+(wrong.length>40?'<p class="muted">Hiển thị 40/'+wrong.length+' câu.</p>':'')+'</div>'}
function progressPage(){let a=attempts(),all=a.flatMap(x=>x.details),correct=all.filter(x=>x.correct).length,days=Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-13+i);let key=localDay(d);return {day:key,count:a.filter(x=>localDay(x.at)===key).length}});return hero('Tiến bộ của '+profile().name,'Kết quả từng buổi, độ chính xác theo môn và nhịp học trong 14 ngày.')+'<div class="card"><div class="grid">'+metric('Số buổi',String(a.length))+metric('Tỷ lệ đúng',all.length?Math.round(correct/all.length*100)+'%':'—',correct+'/'+all.length+' câu')+metric('Chuỗi ngày',streak()+' ngày')+metric('Câu đã gặp',String(Object.keys(mastery()).length))+'</div></div><div class="grid two"><div class="card"><h2>14 ngày gần đây</h2><div class="chart">'+days.map(d=>'<div class="barcol" title="'+d.day+' · '+d.count+' buổi"><div class="bar" style="height:'+Math.max(3,Math.min(120,d.count*35))+'px"></div><small>'+d.day.slice(8)+'</small></div>').join('')+'</div></div><div class="card"><h2>Theo môn</h2>'+SUBJECT_ORDER.filter(s=>BANK.some(q=>q.grade===profile().grade&&q.subject===s)).map(s=>{let items=all.filter(x=>BY_ID.get(x.id)?.subject===s),n=items.filter(x=>x.correct).length;return '<div class="check"><span>'+SUBJECTS[s]+' · '+items.length+' câu đã làm</span><b>'+(items.length?Math.round(n/items.length*100)+'%':'—')+'</b></div>'}).join('')+'</div></div><div class="card"><div class="toolbar"><h2 class="grow">Lịch sử buổi học</h2><button class="btn" data-action="historyCsv">Xuất CSV</button></div>'+(a.length?'<div class="table-wrap"><table><thead><tr><th>Ngày giờ</th><th>Lớp</th><th>Môn</th><th>Chế độ</th><th class="num">Kết quả</th><th class="no-print">Mở</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+new Date(x.at).toLocaleString('vi-VN')+'</td><td>'+x.grade+'</td><td>'+esc(x.subject==='all'?'Nhiều môn':SUBJECTS[x.subject])+'</td><td>'+esc(x.mode==='learn'?'Luyện':'Thử thách')+'</td><td class="num">'+x.score+'/'+x.total+'</td><td class="no-print"><button class="btn small" data-action="viewAttempt" data-id="'+esc(x.id)+'">Chi tiết</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Chưa có buổi học.</div>')+'</div>'}
function profilesPage(){return hero('Học sinh trong gia đình','Mỗi em có lớp, lịch sử và câu sai riêng trên thiết bị này.')+'<div class="card"><div class="toolbar"><h2 class="grow">'+data.profiles.length+' hồ sơ</h2><button class="btn primary" data-action="newProfile">+ Thêm học sinh</button></div><div class="grid">'+data.profiles.map(p=>'<div class="profile-chip '+(p.id===data.activeProfile?'active':'')+'"><h3>'+esc(p.name)+' · lớp '+p.grade+'</h3><p>'+data.attempts.filter(a=>a.profileId===p.id).length+' buổi học</p><button class="btn small" data-action="selectProfile" data-id="'+esc(p.id)+'">'+(p.id===data.activeProfile?'Đang chọn':'Chọn')+'</button> <button class="btn small" data-action="editProfile" data-id="'+esc(p.id)+'">Sửa</button> <button class="btn small danger" data-action="deleteProfile" data-id="'+esc(p.id)+'" '+(data.profiles.length===1?'disabled':'')+'>Xóa</button></div>').join('')+'</div></div>'}
function dataPage(){return hero('Dữ liệu & sao lưu','Không cần tài khoản hoặc API. Dữ liệu học nằm trong trình duyệt của máy này.')+'<div class="card"><h2>Lưu và xuất</h2><div class="toolbar"><button class="btn primary" data-action="saveHtml">Tải HTML kèm tiến độ</button><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="historyCsv">Xuất lịch sử CSV</button></div><p class="muted">Sau buổi học mới, tải lại bản HTML mới nếu muốn mang tiến độ sang máy khác.</p></div><div class="card"><h2>Khôi phục hoặc làm mới</h2><div class="toolbar"><label class="btn file">Khôi phục JSON<input type="file" accept=".json,application/json" data-import="json"></label><button class="btn danger" data-action="clearProgress">Xóa tiến độ học sinh đang chọn</button><button class="btn danger" data-action="clearAll">Xóa toàn bộ dữ liệu</button></div><p class="hint">Xóa tiến độ hoặc khôi phục sẽ thay dữ liệu đang lưu. Hãy sao lưu trước.</p></div><div class="card"><h2>Nguồn nội dung</h2><p>Ngân hàng hiện có '+BANK.length+' mục: Toán tiếng Việt lớp 1–5 do AI Mở biên soạn; Ghép vần/Chính tả lớp 1–3, Tiếng Anh lớp 3–9 và Toán bằng tiếng Anh lớp 3–5 được chuyển từ các file tham chiếu của Thầy Đạt Tin Học. Có thêm từ vựng chủ đề do AI Mở biên soạn.</p></div>'}
function helpPage(){let grades=Array.from({length:9},(_,i)=>i+1);return hero('Cách sử dụng','Phụ huynh chọn lớp, môn và theo dõi tiến bộ của con trên cùng một máy.')+'<div class="grid two"><div class="card"><h2>5 bước</h2><ol><li>Tạo hồ sơ từng học sinh và chọn đúng lớp.</li><li>Vào Chọn bài, chọn môn/chủ đề hoặc trộn các môn.</li><li>Luyện có lời giải ngay hoặc thử thách xem kết quả cuối buổi.</li><li>Ôn câu sai và câu đến hạn từ trang Hôm nay.</li><li>Sao lưu JSON hoặc tải HTML kèm tiến độ sau khi học.</li></ol></div><div class="card"><h2>Thời gian và dữ liệu</h2><p>Mỗi buổi lấy tối đa 10 câu, thời gian tối đa 10 phút. Buổi đang làm được lưu trên máy; đồng hồ vẫn chạy khi rời trang. Lịch sử lưu tối đa 300 buổi cho cả gia đình.</p><p>Đáp án gõ được so sánh không phân biệt chữ hoa/thường và khoảng trắng thừa; dấu tiếng Việt vẫn được giữ.</p></div></div><div class="card"><h2>Phạm vi theo lớp</h2><div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Môn hiện có</th><th class="num">Số mục</th></tr></thead><tbody>'+grades.map(g=>'<tr><td>Lớp '+g+'</td><td>'+available(g).map(s=>SUBJECTS[s]).join(', ')+'</td><td class="num">'+BANK.filter(q=>q.grade===g).length+'</td></tr>').join('')+'</tbody></table></div><p class="muted">Nội dung cần giáo viên hoặc người phụ trách chuyên môn rà trước khi phát hành rộng. App không khẳng định bao phủ toàn bộ chương trình của từng lớp.</p></div>'}
function render(){let titles={home:'Hôm nay',bank:'Chọn bài',play:'Buổi ôn 10 phút',result:'Kết quả',wrong:'Ôn câu sai',progress:'Tiến bộ',profiles:'Học sinh',data:'Dữ liệu & sao lưu',help:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$('#topSub').textContent=profile().name+' · lớp '+profile().grade;$$('[data-page]',$('.side-nav')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=page==='home'?home():page==='bank'?bankPage():page==='play'?play():page==='result'?result():page==='wrong'?wrongPage():page==='progress'?progressPage():page==='profiles'?profilesPage():page==='data'?dataPage():helpPage()}
function navigate(p){page=p;if(p==='bank'&&!available(profile().grade).includes(subject)){subject='all';topic='all'}render();window.scrollTo(0,0)}
const renderScreen=render;
render=function(){renderScreen();if(page==='play'&&data.session?.index===data.session.ids.length-1){let next=$('[data-action="next"]');if(next)next.textContent='Xem kết quả'}};
function openProfile(id=null){let p=id?data.profiles.find(x=>x.id===id):null;editing={kind:'profile',id};$('#modalTitle').textContent=p?'Sửa học sinh':'Thêm học sinh';$('#modalFields').innerHTML='<div class="field"><label for="p-name">Tên học sinh</label><input id="p-name" maxlength="40" value="'+esc(p?.name||'')+'"></div><div class="field"><label for="p-grade">Lớp</label><select id="p-grade">'+Array.from({length:9},(_,i)=>'<option value="'+(i+1)+'" '+((p?.grade||1)===i+1?'selected':'')+'>Lớp '+(i+1)+'</option>').join('')+'</select></div>';$('#modalError').textContent='';$('#editor').showModal();$('#p-name').focus()}
function saveProfile(){let name=$('#p-name').value.trim(),grade=Number($('#p-grade').value);if(!name||name.length>40){$('#modalError').textContent='Nhập tên học sinh từ 1 đến 40 ký tự.';return}if(!Number.isInteger(grade)||grade<1||grade>9){$('#modalError').textContent='Chọn lớp từ 1 đến 9.';return}if(data.profiles.some(x=>x.id!==editing.id&&x.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi'))){$('#modalError').textContent='Tên học sinh đã có.';return}if(editing.id){let p=data.profiles.find(x=>x.id===editing.id);p.name=name;p.grade=grade}else{if(data.profiles.length>=10){$('#modalError').textContent='Tối đa 10 học sinh trên một file.';return}let p={id:uid(),name,grade};data.profiles.push(p);data.activeProfile=p.id}$('#editor').close();subject='all';topic='all';page='profiles';save()}
function deleteProfile(id){if(data.profiles.length<2)return;let p=data.profiles.find(x=>x.id===id);if(!p)return;if(!confirm('Xóa hồ sơ '+p.name+' cùng toàn bộ lịch sử và câu sai của em?'))return;data.profiles=data.profiles.filter(x=>x.id!==id);data.attempts=data.attempts.filter(x=>x.profileId!==id);delete data.mastery[id];if(data.session?.profileId===id)data.session=null;if(data.activeProfile===id)data.activeProfile=data.profiles[0].id;subject='all';topic='all';save()}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(rows){return '\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function historyCsv(){let rows=[['Học sinh','Ngày giờ','Lớp','Môn','Chế độ','Câu hỏi','Trả lời','Đáp án','Đúng']];for(let a of data.attempts){let p=data.profiles.find(x=>x.id===a.profileId);for(let d of a.details){let q=BY_ID.get(d.id);rows.push([p?.name||'',a.at,a.grade,SUBJECTS[q?.subject]||'',a.mode,q?.q||'',d.answer,q?.a||'',d.correct?'Có':'Không'])}}download('on-bai-lich-su.csv','text/csv;charset=utf-8',csv(rows))}
function backup(){download('on-bai-10-phut-sao-luu.json','application/json;charset=utf-8',JSON.stringify(data,null,2))}
function saveHtml(){let copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(data))));download('ai-mo-on-bai-10-phut-kem-tien-do.html','text/html;charset=utf-8','<!doctype html>\n'+copy.outerHTML)}
function validateState(x){if(!x.profiles.length||x.profiles.length>10||!x.profiles.some(p=>p.id===x.activeProfile))return 'Danh sách học sinh không hợp lệ.';let ids=new Set();for(let p of x.profiles){if(!p.id||ids.has(p.id)||!p.name||!Number.isInteger(p.grade)||p.grade<1||p.grade>9)return 'Hồ sơ học sinh không hợp lệ.';ids.add(p.id)}if(x.attempts.length>300)return 'Lịch sử vượt giới hạn.';for(let a of x.attempts){if(!ids.has(a.profileId)||!Array.isArray(a.details)||!a.details.every(d=>BY_ID.has(d.id)))return 'Lịch sử bài làm có dữ liệu không hợp lệ.'}if(x.session&&!ids.has(x.session.profileId))return 'Phiên học không hợp lệ.';return ''}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-quick-subject],[data-subject],[data-topic],[data-mode],[data-answer],[data-tile],[data-index]');if(!b)return;if(b.dataset.quickSubject){subject=b.dataset.quickSubject;topic='all';navigate('bank');return}if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.subject){subject=b.dataset.subject;topic='all';render();return}if(b.dataset.topic){topic=b.dataset.topic;render();return}if(b.dataset.mode){mode=b.dataset.mode;render();return}if(b.dataset.answer!==undefined){answer(b.dataset.answer);return}if(b.dataset.tile!==undefined){chooseTile(Number(b.dataset.tile));return}if(b.dataset.index!==undefined){data.session.index=Number(b.dataset.index);save();return}let a=b.dataset.action;if(a==='start')start();if(a==='reviewWrong')start('wrong');if(a==='reviewDue')start('due');if(a==='resume'){if(data.session?.deadline<=Date.now())finish();else{page='play';render();startTimer()}}if(a==='answerText'){let value=$('#freeAnswer')?.value;if(!value?.trim()){alert('Hãy nhập đáp án.');return}answer(value)}if(a==='resetTiles'){let q=current();data.session.parts[q.id]=[];delete data.session.answers[q.id];save()}if(a==='check'){let s=data.session,q=current();if(!s.answers[q.id]){alert('Hãy trả lời trước.');return}s.checked[q.id]=true;save()}if(a==='next'){let s=data.session;if(s.index>=s.ids.length-1)finish();else{s.index++;save()}}if(a==='finish'){if(confirm('Nộp bài và xem kết quả?'))finish()}if(a==='viewAttempt'){detailAttempt=b.dataset.id;page='result';render()}if(a==='newProfile')openProfile();if(a==='editProfile')openProfile(b.dataset.id);if(a==='deleteProfile')deleteProfile(b.dataset.id);if(a==='selectProfile'){data.activeProfile=b.dataset.id;subject='all';topic='all';save();navigate('home')}if(a==='historyCsv')historyCsv();if(a==='backup')backup();if(a==='saveHtml')saveHtml();if(a==='print')window.print();if(a==='clearProgress'){let p=profile();if(!confirm('Xóa lịch sử và câu sai của '+p.name+'?'))return;data.attempts=data.attempts.filter(x=>x.profileId!==p.id);delete data.mastery[p.id];if(data.session?.profileId===p.id)data.session=null;save()}if(a==='clearAll'){if(!confirm('Xóa tất cả hồ sơ và tiến độ học trên máy này?'))return;data=empty();subject='all';topic='all';page='home';save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='freeAnswer'){e.preventDefault();$('#screen [data-action="answerText"]')?.click()}});
document.addEventListener('change',async e=>{if(e.target.dataset.import==='json'){let file=e.target.files[0];if(!file)return;try{let x=clean(JSON.parse(await file.text()));if(!x)throw Error('File không đúng ứng dụng hoặc phiên bản.');let error=validateState(x);if(error)throw Error(error);if(!confirm('Thay toàn bộ hồ sơ và tiến độ hiện có bằng bản sao lưu?'))return;data=x;subject='all';topic='all';page='home';save();alert('Đã khôi phục dữ liệu.')}catch(err){alert(err.message)}finally{e.target.value=''}}});
$('#modalClose').onclick=$('#modalCancel').onclick=()=>$('#editor').close();$('#modalSave').onclick=saveProfile;$('#quickPrint').onclick=()=>window.print();
if(data.session&&!data.session.ended){if(data.session.deadline<=Date.now())finish();else startTimer()}
render();



</script></body></html>
