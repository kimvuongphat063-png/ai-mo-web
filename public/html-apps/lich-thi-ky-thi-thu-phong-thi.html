function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!Array.isArray(x.exams)||!Array.isArray(x.candidates)||!Array.isArray(x.audit))return 'Cấu trúc hoặc phiên bản không hợp lệ.';if(!Number.isFinite(x.settings.passMin)||x.settings.passMin<0||x.settings.passMin>10||!Number.isFinite(x.settings.lowRate)||x.settings.lowRate<0||x.settings.lowRate>100)return 'Cài đặt không hợp lệ.';let ids=new Set(),codes=new Set();for(let e of x.exams){if(!e.id||ids.has(e.id)||!e.code||codes.has(e.code.toUpperCase())||!dateOK(e.date)||!SHIFTS.includes(e.shift)||!STATES.includes(e.state)||!['Tổng hợp','Danh sách'].includes(e.mode)||!e.room||!e.className||!e.title||!Number.isInteger(e.capacity)||e.capacity<0||e.capacity>10000||!Number.isInteger(e.registered)||e.registered<0||e.registered>10000||!Number.isInteger(e.passed)||e.passed<0||e.passed>e.registered||e.avg!==null&&(!Number.isFinite(e.avg)||e.avg<0||e.avg>10)||e.mode==='Tổng hợp'&&e.state==='Đã chấm'&&e.avg===null||e.state!=='Đã chấm'&&(e.passed!==0||e.avg!==null))return 'Buổi thi không hợp lệ; kiểm tra trạng thái và kết quả.';for(let k of ['title','className','room','inv1','inv2','note','reason'])if(String(e[k]||'').length>1200)return 'Nội dung buổi thi quá dài.';ids.add(e.id);codes.add(e.code.toUpperCase())}let cids=new Set(),pairs=new Set();for(let c of x.candidates){let pair=c.examId+'|'+c.code.toUpperCase();if(!c.id||cids.has(c.id)||!ids.has(c.examId)||!c.code||pairs.has(pair)||!c.name||!CSTATES.includes(c.state)||c.state==='Đã chấm'&&(!Number.isFinite(c.score)||c.score<0||c.score>10)||c.state!=='Đã chấm'&&c.score!==null)return 'Thí sinh không hợp lệ hoặc trùng mã trong buổi thi.';cids.add(c.id);pairs.add(pair);if(x.exams.find(e=>e.id===c.examId).mode!=='Danh sách')return 'Buổi thi tổng hợp không có danh sách thí sinh.'}for(let e of x.exams.filter(e=>e.mode==='Danh sách')){let c=x.candidates.filter(c=>c.examId===e.id);if(e.registered!==c.length||e.registered>e.capacity&&e.capacity>0||e.state==='Đã chấm'&&c.some(v=>v.state==='Dự thi'))return 'Danh sách thí sinh chưa khớp sức chứa hoặc tình trạng chấm.'}let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!ids.has(a.examId)||!a.action||!a.at)return 'Nhật ký không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let e=validate(db);if(e){alert('Không lưu được: '+e);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ đầy. Hãy tải bản sao JSON hoặc HTML.')}render();return true}
const exam=id=>db.exams.find(e=>e.id===id),roster=id=>db.candidates.filter(c=>c.examId===id);
function norm(s){return String(s||'').trim().toLocaleLowerCase('vi').replace(/\s+/g,' ')}
function conflicts(e){if(e.state==='Hủy')return [];let out=[];if(e.inv1&&e.inv2&&norm(e.inv1)===norm(e.inv2))out.push('Hai giám thị của cùng một buổi trùng tên');for(let x of db.exams){if(x.id===e.id||x.state==='Hủy'||x.date!==e.date||x.shift!==e.shift)continue;if(norm(x.room)===norm(e.room))out.push('Trùng phòng với '+x.code);let a=[e.inv1,e.inv2].map(norm).filter(Boolean),b=[x.inv1,x.inv2].map(norm).filter(Boolean);if(a.some(v=>b.includes(v)))out.push('Trùng giám thị với '+x.code)}return [...new Set(out)]}
function numbers(e){if(e.mode==='Danh sách'){let c=roster(e.id),graded=c.filter(x=>x.state==='Đã chấm'),passed=graded.filter(x=>x.score>=db.settings.passMin).length,avg=graded.length?Math.round(graded.reduce((n,x)=>n+x.score,0)/graded.length*10)/10:null;return {registered:c.length,graded:graded.length,passed,avg,rate:e.state==='Đã chấm'&&graded.length?Math.round(passed/graded.length*1000)/10:null}}return {registered:e.registered,graded:e.state==='Đã chấm'?e.registered:0,passed:e.state==='Đã chấm'?e.passed:0,avg:e.state==='Đã chấm'?e.avg:null,rate:e.state==='Đã chấm'&&e.registered?Math.round(e.passed/e.registered*1000)/10:null}}
function warnings(e){let a=conflicts(e),n=numbers(e);if(e.capacity&&n.registered>e.capacity)a.push('Vượt sức chứa');if(e.state==='Đã chấm'&&n.rate!==null&&n.rate<db.settings.lowRate)a.push('Tỷ lệ đạt thấp');if(e.state==='Chưa thi'&&e.date<today())a.push('Đã qua ngày thi, cần cập nhật');return a}
function summary(){let graded=db.exams.filter(e=>e.state==='Đã chấm'),reg=db.exams.filter(e=>e.state!=='Hủy').reduce((n,e)=>n+numbers(e).registered,0),p=graded.reduce((n,e)=>n+numbers(e).passed,0),g=graded.reduce((n,e)=>n+numbers(e).graded,0);return {exams:db.exams.length,upcoming:db.exams.filter(e=>e.state==='Chưa thi').length,graded:graded.length,registered:reg,passed:p,gradedCount:g,rate:g?Math.round(p/g*1000)/10:null,conflicts:db.exams.filter(e=>conflicts(e).length).length}}
function btn(label,act,kind='',id=''){return `<button type="button" class="btn ${kind}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Buổi thi</small><strong>${s.exams}</strong></div><div><small>Chưa thi</small><strong>${s.upcoming}</strong></div><div><small>Lượt thí sinh*</small><strong>${s.registered}</strong></div><div><small>Lượt đạt đã chấm</small><strong>${s.passed}</strong></div><div><small>Trùng lịch</small><strong>${s.conflicts}</strong></div></div>`}
function home(){let near=db.exams.filter(e=>e.state==='Chưa thi'&&e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,7),warn=db.exams.filter(e=>warnings(e).length).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);return `<div class="hero"><span>📝 AI MỞ · TỔ CHỨC KỲ THI</span><h1>Lịch thi, phòng thi & kết quả</h1><p>Lập lịch, tránh trùng phòng và giám thị, chấm điểm rồi xem tỷ lệ đạt rõ ràng.</p><div class="hero-actions">${btn('＋ Tạo buổi thi','newExam','primary')}${btn('📅 Xem lịch','calendar')}</div></div>${metrics()}${panel('📌 Quy trình nhanh',`<ol><li>Tạo buổi thi với ngày, ca, phòng, lớp, giám thị và số thí sinh dự kiến.</li><li>Kiểm tra cảnh báo trước khi công bố lịch. Nếu theo danh sách, thêm thí sinh vào từng buổi.</li><li>Sau kỳ thi, chuyển sang Chờ chấm rồi nhập kết quả. Chỉ buổi Đã chấm mới có tỷ lệ đạt.</li><li>Sao lưu dữ liệu và in lịch hoặc báo cáo.</li></ol><p class="muted">* Số thí sinh là lượt đăng ký theo buổi, không phải số người duy nhất. Dữ liệu thực bắt đầu trống.</p>`)}<div class="two">${panel('🔔 Cần xử lý',warn.length?warn.map(e=>`<div class="mini"><button class="link" data-act="openExam" data-id="${esc(e.id)}">${esc(e.title)}</button><small>${fmtDate(e.date)} · ${esc(e.shift)} · ${warnings(e).map(esc).join(', ')}</small></div>`).join(''):'<p class="success">Chưa có cảnh báo.</p>')}${panel('🗓️ Sắp tới',near.length?near.map(e=>`<div class="mini"><button class="link" data-act="openExam" data-id="${esc(e.id)}">${esc(e.title)}</button><small>${fmtDate(e.date)} · ${esc(e.shift)} · ${esc(e.room)} · ${esc(e.className)}</small></div>`).join(''):'<p class="muted">Chưa có buổi thi sắp tới.</p>')}</div>`}
function filtered(){return db.exams.filter(e=>(!search||[e.code,e.title,e.className,e.room,e.inv1,e.inv2].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))&&(!classFilter||e.className===classFilter)&&(!statusFilter||e.state===statusFilter)).sort((a,b)=>a.date.localeCompare(b.date)||a.shift.localeCompare(b.shift))}
function examsPage(){let classes=[...new Set(db.exams.map(e=>e.className))].sort((a,b)=>a.localeCompare(b,'vi'));return `<div class="page-head"><div><h1>📋 Danh sách buổi thi</h1><p>Mở từng buổi để xem phân phòng, thí sinh, kết quả và lịch sử.</p></div>${btn('＋ Tạo buổi thi','newExam','primary')}</div><div class="card"><div class="filters"><label>Tìm kiếm<input id="search" value="${esc(search)}" placeholder="Mã, lớp, phòng, giám thị…"></label><label>Lớp<select id="classFilter"><option value="">Tất cả</option>${classes.map(c=>`<option ${classFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Tình trạng<select id="statusFilter"><option value="">Tất cả</option>${STATES.map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></label></div><p class="muted">${filtered().length} / ${db.exams.length} buổi</p><div class="table-wrap"><table><thead><tr><th>Ngày / ca</th><th>Buổi thi / lớp</th><th>Phòng</th><th>Giám thị</th><th>Thí sinh</th><th>Đạt</th><th>Tỷ lệ</th><th>Tình trạng</th><th>Cảnh báo</th></tr></thead><tbody>${filtered().map(e=>{let n=numbers(e),w=warnings(e);return `<tr><td>${fmtDate(e.date)}<small>${esc(e.shift)}</small></td><td><button class="link" data-act="openExam" data-id="${esc(e.id)}">${esc(e.title)}</button><small>${esc(e.code)} · ${esc(e.className)}</small></td><td>${esc(e.room)}</td><td>${esc(e.inv1||'—')}<small>${esc(e.inv2||'')}</small></td><td>${n.registered}</td><td>${e.state==='Đã chấm'?n.passed:'—'}</td><td>${n.rate===null?'—':fmt(n.rate)+'%'}</td><td><span class="pill ${e.state==='Đã chấm'?'green':'amber'}">${e.state}</span></td><td>${w.length?`<span class="pill red">${esc(w.join('; '))}</span>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Chưa có buổi thi phù hợp.</td></tr>'}</tbody></table></div></div>`}
function detail(){let e=exam(selected);if(!e){page='exams';return examsPage()}let n=numbers(e),w=warnings(e),a=db.audit.filter(x=>x.examId===e.id).sort((a,b)=>b.at.localeCompare(a.at));return `<div class="page-head"><div><button class="link" data-act="exams">← Danh sách buổi thi</button><h1>📝 ${esc(e.title)}</h1><p>${esc(e.code)} · ${esc(e.className)} · ${fmtDate(e.date)} · ${esc(e.shift)}</p></div><div class="actions no-print">${btn('Sửa buổi thi','editExam','primary',e.id)}${e.mode==='Danh sách'?btn('＋ Thí sinh','newCandidate','',e.id):''}${btn('🖨️ In phiếu','print')}${btn('Xóa','deleteExam','danger',e.id)}</div></div><div class="metrics"><div><small>Phòng</small><strong>${esc(e.room)}</strong></div><div><small>Thí sinh</small><strong>${n.registered}${e.capacity?' / '+e.capacity:''}</strong></div><div><small>Đã chấm</small><strong>${n.graded}</strong></div><div><small>Đạt</small><strong>${e.state==='Đã chấm'?n.passed:'—'}</strong></div><div><small>Tỷ lệ đạt</small><strong>${n.rate===null?'—':fmt(n.rate)+'%'}</strong></div></div><div class="two">${panel('🧭 Tổ chức thi',`<p><b>Tình trạng:</b> ${esc(e.state)} · <b>Chế độ:</b> ${esc(e.mode)}</p><p><b>Giám thị 1:</b> ${esc(e.inv1||'—')}</p><p><b>Giám thị 2:</b> ${esc(e.inv2||'—')}</p><p><b>Ghi chú:</b> ${esc(e.note||'—')}</p><p><b>Lý do điều chỉnh:</b> ${esc(e.reason||'—')}</p>`)}${panel('🔔 Kiểm tra',(w.length?`<ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="success">Không có cảnh báo theo dữ liệu hiện tại.</p>')+`<p class="note">Trùng phòng/giám thị xét mọi buổi không hủy cùng ngày và ca. Tỷ lệ đạt chỉ hiển thị sau khi chấm.</p>` )}</div>${e.mode==='Danh sách'?panel('👩‍🎓 Danh sách thí sinh',`<div class="actions no-print">${btn('＋ Thêm thí sinh','newCandidate','primary',e.id)}</div><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Họ tên</th><th>Tình trạng</th><th>Điểm /10</th><th>Đạt</th><th>Ghi chú</th><th></th></tr></thead><tbody>${roster(e.id).map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${esc(c.state)}</td><td>${c.score===null?'—':fmt(c.score)}</td><td>${c.score===null?'—':c.score>=db.settings.passMin?'Đạt':'Chưa đạt'}</td><td>${esc(c.note||'—')}</td><td class="no-print">${btn('Sửa','editCandidate','small',c.id)} ${btn('Xóa','deleteCandidate','small danger',c.id)}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có thí sinh.</td></tr>'}</tbody></table></div><p class="note">Ngưỡng đạt ${fmt(db.settings.passMin)}/10. Khi thay ngưỡng, kết quả danh sách được tính lại; ghi rõ ngưỡng đã công bố trước khi sử dụng thật.</p>`):panel('📊 Kết quả tổng hợp',e.state==='Đã chấm'?`<p><b>Đạt:</b> ${n.passed} / ${n.registered} thí sinh · <b>Điểm TB:</b> ${fmt(n.avg)}/10 · <b>Tỷ lệ:</b> ${fmt(n.rate)}%</p>`:'<p class="muted">Chưa có kết quả đã chấm. Sửa buổi thi để nhập số đạt và điểm trung bình.</p>')}${panel('🕘 Nhật ký thay đổi',a.length?`<div class="timeline">${a.map(x=>`<div><b>${esc(x.action)}</b> · ${fmtDate(x.at.slice(0,10))}<p>${esc(x.reason)}</p></div>`).join('')}</div>`:'<p class="muted">Chưa có thay đổi.</p>')}`}
function calendar(){let groups=[...new Set(db.exams.map(e=>e.date.slice(0,7)))].sort();return `<div class="page-head"><div><h1>🗓️ Lịch thi theo tháng</h1><p>Mỗi thẻ thể hiện ngày, ca, phòng, lớp và trạng thái.</p></div>${btn('＋ Tạo buổi thi','newExam','primary')}</div>${groups.map(g=>panel('Tháng '+g.slice(5)+'/'+g.slice(0,4),`<div class="calendar-list">${db.exams.filter(e=>e.date.startsWith(g)).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<button data-act="openExam" data-id="${esc(e.id)}"><b>${fmtDate(e.date)} · ${esc(e.shift)}</b><span>${esc(e.title)} · ${esc(e.className)}</span><small>${esc(e.room)} · ${esc(e.state)}${conflicts(e).length?' · ⚠️ Trùng lịch':''}</small></button>`).join('')}</div>`)).join('')||panel('Chưa có lịch','Tạo buổi thi để bắt đầu.')}`}
function reports(){let classes=[...new Set(db.exams.map(e=>e.className))].sort((a,b)=>a.localeCompare(b,'vi')),rooms=[...new Set(db.exams.map(e=>e.room))].sort((a,b)=>a.localeCompare(b,'vi'));return `<div class="page-head"><div><h1>📊 Báo cáo kỳ thi</h1><p>Kết quả chỉ tính buổi Đã chấm; thí sinh là lượt theo buổi.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo lớp',`<div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Buổi</th><th>Lượt thí sinh</th><th>Đã chấm</th><th>Lượt đạt</th><th>Tỷ lệ đạt*</th></tr></thead><tbody>${classes.map(c=>{let a=db.exams.filter(e=>e.className===c&&e.state!=='Hủy'),g=a.filter(e=>e.state==='Đã chấm'),n=g.reduce((s,e)=>s+numbers(e).graded,0),p=g.reduce((s,e)=>s+numbers(e).passed,0);return `<tr><td>${esc(c)}</td><td>${a.length}</td><td>${a.reduce((s,e)=>s+numbers(e).registered,0)}</td><td>${n}</td><td>${p}</td><td>${n?fmt(Math.round(p/n*1000)/10)+'%':'—'}</td></tr>`}).join('')||'<tr><td colspan="6">Chưa có lớp.</td></tr>'}</tbody></table></div><p class="note">* Mẫu số chỉ gồm thí sinh đã có kết quả, không tính buổi chưa chấm.</p>`)}${panel('Theo phòng',`<div class="table-wrap"><table><thead><tr><th>Phòng</th><th>Số buổi</th><th>Lượt thí sinh</th><th>Buổi trùng lịch</th></tr></thead><tbody>${rooms.map(r=>{let a=db.exams.filter(e=>e.room===r&&e.state!=='Hủy');return `<tr><td>${esc(r)}</td><td>${a.length}</td><td>${a.reduce((n,e)=>n+numbers(e).registered,0)}</td><td>${a.filter(e=>conflicts(e).some(x=>x.startsWith('Trùng phòng'))).length}</td></tr>`}).join('')||'<tr><td colspan="4">Chưa có phòng.</td></tr>'}</tbody></table></div>`)}${panel('Cảnh báo cần xử lý',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Buổi thi</th><th>Cảnh báo</th></tr></thead><tbody>${db.exams.filter(e=>warnings(e).length).map(e=>`<tr><td>${fmtDate(e.date)} · ${esc(e.shift)}</td><td>${esc(e.title)} · ${esc(e.room)}</td><td>${esc(warnings(e).join('; '))}</td></tr>`).join('')||'<tr><td colspan="3">Không có cảnh báo.</td></tr>'}</tbody></table></div>`)}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngưỡng đánh giá',`<form id="settingsForm" class="form-grid"><label>Tên cơ sở<input name="org" value="${esc(db.settings.org)}" maxlength="120"></label><label>Điểm đạt danh sách /10<input name="passMin" type="number" min="0" max="10" step="0.1" value="${db.settings.passMin}" required></label><label>Cảnh báo tỷ lệ đạt dưới (%)<input name="lowRate" type="number" min="0" max="100" step="0.1" value="${db.settings.lowRate}" required></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="note">Ngưỡng danh sách áp dụng lại cho các điểm cá nhân khi thay đổi; nếu đã công bố kết quả chính thức, cần lưu bản sao và thống nhất ngưỡng trước khi sửa.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu và chuyển máy',`<p>HTML gốc không mang dữ liệu đã nhập từ trình duyệt khác. Tải JSON hoặc HTML kèm dữ liệu để chuyển máy. Dữ liệu thí sinh cần được giữ riêng tư.</p><div class="actions">${btn('⬇️ Tải JSON','exportJson')}${btn('⬇️ Tải HTML kèm dữ liệu','exportHtml','primary')}${btn('⬇️ Excel 3 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Mẫu nguồn',`<p>20 buổi, 343 lượt thí sinh, 169 lượt đạt trong 14 buổi có kết quả. Sáu buổi còn lại được coi là chưa thi thay vì 0% đạt. Mẫu chỉ dùng thử.</p>${btn('Nạp mẫu nguồn (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ dữ liệu app này trên thiết bị hiện tại.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Lập lịch và tổ chức',`<ol><li>Tạo buổi thi theo ngày/ca, lớp, phòng, hai giám thị và sức chứa.</li><li>Chọn Tổng hợp nếu chỉ có số lượng; chọn Danh sách nếu muốn chấm từng thí sinh. Không đổi chế độ khi đã có thí sinh.</li><li>App không cho lưu lịch trùng phòng hoặc trùng bất kỳ giám thị nào cùng ngày và ca. Hủy buổi sẽ giải phóng lịch.</li><li>Sau thi chọn Chờ chấm, rồi ghi kết quả và chuyển Đã chấm.</li><li>Kiểm tra báo cáo và sao lưu định kỳ.</li></ol>`)}${panel('Cách tính',`<p>Ở chế độ Tổng hợp: tỷ lệ đạt = số đạt / số thí sinh đăng ký khi buổi đã chấm. Ở chế độ Danh sách: tỷ lệ đạt = số thí sinh đạt / số đã chấm; thí sinh vắng không tính vào mẫu số. Nếu chưa chấm, tỷ lệ hiển thị “—”.</p><p>Điểm trung bình danh sách = trung bình của những người Đã chấm. Kết quả kỳ thi thật và chứng chỉ cần tuân theo quy chế của đơn vị tổ chức; app này chỉ hỗ trợ quản lý nội bộ.</p>`)}`}
function render(){let map={home:['Tổng quan',home],exams:['Buổi thi',examsPage],detail:['Chi tiết',detail],calendar:['Lịch thi',calendar],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];$('#topOrg').textContent=db.settings.org||'AI Mở · App offline';document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(name,label,value='',type='text',opts=null){return `<label class="${type==='textarea'?'full':''}">${label}${type==='textarea'?`<textarea name="${name}" rows="3" maxlength="1200">${esc(value)}</textarea>`:opts?`<select name="${name}">${opts.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="0.1"':''} ${['code','date','room','className','title','name','score'].includes(name)?'required':''}>`}</label>`}
function openModal(kind,id='',examId=''){let before=id?clone(kind==='exam'?exam(id):db.candidates.find(c=>c.id===id)):null;draft={kind,id,examId,before};let x=before||{},f='';if(kind==='exam'){f=field('code','Mã buổi thi',x.code||'')+field('title','Tên kỳ thi / bài thi',x.title||'')+field('date','Ngày thi',x.date||today(),'date')+field('shift','Ca',x.shift||'Sáng','text',SHIFTS)+field('room','Phòng thi',x.room||'')+field('capacity','Sức chứa phòng (0 = chưa rõ)',x.capacity??0,'number')+field('className','Lớp thi',x.className||'')+field('inv1','Giám thị 1',x.inv1||'')+field('inv2','Giám thị 2',x.inv2||'')+field('mode','Cách ghi kết quả',x.mode||'Tổng hợp','text',['Tổng hợp','Danh sách'])+field('state','Tình trạng',x.state||'Chưa thi','text',STATES)+field('registered','Số thí sinh đăng ký (Tổng hợp)',x.registered??0,'number')+field('passed','Số đạt (chỉ khi Đã chấm)',x.passed??0,'number')+field('avg','Điểm TB /10 (chỉ khi Đã chấm)',x.avg??'','number')+field('reason','Lý do điều chỉnh lịch / kết quả',x.reason||'','textarea')+field('note','Ghi chú',x.note||'','textarea')}else{f=field('code','Mã thí sinh',x.code||'')+field('name','Họ tên',x.name||'')+field('state','Tình trạng',x.state||'Dự thi','text',CSTATES)+field('score','Điểm /10 (nếu Đã chấm)',x.score??'','number')+field('note','Ghi chú',x.note||'','textarea')}$('#modalTitle').textContent=kind==='exam'?(id?'Sửa buổi thi':'Tạo buổi thi'):(id?'Sửa thí sinh':'Thêm thí sinh');$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function error(s){$('#formError').textContent=s}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();if(draft.kind==='exam'){let old=exam(draft.id);x.capacity=Number(x.capacity);x.registered=Number(x.registered);x.passed=Number(x.passed);x.avg=x.avg===''?null:Number(x.avg);x.code=x.code.toUpperCase();if(!x.code||!x.title||!dateOK(x.date)||!SHIFTS.includes(x.shift)||!x.room||!x.className||!STATES.includes(x.state)||!['Tổng hợp','Danh sách'].includes(x.mode)||!Number.isInteger(x.capacity)||x.capacity<0||!Number.isInteger(x.registered)||x.registered<0||x.registered>10000){error('Điền mã, tên, ngày, ca, phòng, lớp và số lượng hợp lệ.');return}if(db.exams.some(e=>e.code===x.code&&e.id!==x.id)){error('Mã buổi thi đã tồn tại.');return}if(old?.mode==='Danh sách'&&x.mode!=='Danh sách'&&roster(x.id).length){error('Cần xóa hết danh sách thí sinh trước khi đổi sang Tổng hợp.');return}if(x.mode==='Danh sách'){x.registered=roster(x.id).length;x.passed=0;x.avg=null;if(x.state==='Đã chấm'&&roster(x.id).some(c=>c.state==='Dự thi')){error('Cần chấm hoặc đánh dấu vắng cho toàn bộ thí sinh.');return}}else{if(x.state==='Đã chấm'){if(!Number.isInteger(x.passed)||x.passed<0||x.passed>x.registered||x.avg===null||x.avg<0||x.avg>10){error('Khi Đã chấm, nhập số đạt không vượt số đăng ký và điểm TB 0–10.');return}}else{x.passed=0;x.avg=null}}if(x.capacity&&x.registered>x.capacity){error('Số thí sinh vượt sức chứa phòng.');return}let c=conflicts(x);if(c.length){error(c.join('; ')+'. Chọn phòng, ca hoặc giám thị khác.');return}if(old&&!x.reason){error('Nhập lý do khi sửa lịch hoặc kết quả.');return}if(old)Object.assign(old,x);else db.exams.push(x);db.audit.push({id:uid(),examId:x.id,action:old?'Sửa buổi thi':'Tạo buổi thi',reason:x.reason||'Lập lịch ban đầu',at:new Date().toISOString()});let err=validate(db);if(err){if(old)Object.assign(old,draft.before);else db.exams=db.exams.filter(e=>e.id!==x.id);db.audit.pop();error(err);return}selected=x.id}else{let e=exam(draft.examId||draft.before?.examId),old=db.candidates.find(c=>c.id===draft.id);if(!e||e.mode!=='Danh sách'){error('Buổi thi không dùng danh sách.');return}x.examId=e.id;x.code=x.code.toUpperCase();x.score=x.score===''?null:Number(x.score);if(!x.code||!x.name||!CSTATES.includes(x.state)||db.candidates.some(c=>c.examId===e.id&&c.code===x.code&&c.id!==x.id)||x.state==='Đã chấm'&&(x.score===null||!Number.isFinite(x.score)||x.score<0||x.score>10)){error('Mã không trùng, tên, tình trạng và điểm 0–10 cần hợp lệ.');return}if(x.state!=='Đã chấm')x.score=null;if(old)Object.assign(old,x);else db.candidates.push(x);e.registered=roster(e.id).length;if(e.capacity&&e.registered>e.capacity){if(old)Object.assign(old,draft.before);else db.candidates=db.candidates.filter(c=>c.id!==x.id);e.registered=roster(e.id).length;error('Danh sách vượt sức chứa phòng.');return}if(e.state==='Đã chấm'&&x.state==='Dự thi'){if(old)Object.assign(old,draft.before);else db.candidates=db.candidates.filter(c=>c.id!==x.id);e.registered=roster(e.id).length;error('Buổi đã chấm không thể còn thí sinh Dự thi.');return}db.audit.push({id:uid(),examId:e.id,action:old?'Sửa thí sinh':'Thêm thí sinh',reason:x.code+' · '+x.name+' · '+x.state,at:new Date().toISOString()});let err=validate(db);if(err){if(old)Object.assign(old,draft.before);else db.candidates=db.candidates.filter(c=>c.id!==x.id);e.registered=roster(e.id).length;db.audit.pop();error(err);return}selected=e.id}$('#editor').close();page='detail';save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'lich-thi-sao-luu.json')}function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'lich-thi-kem-du-lieu.html')}
const HE=['ID','Mã','Tên kỳ thi','Ngày','Ca','Phòng','Sức chứa','Lớp','Giám thị 1','Giám thị 2','Cách ghi','Tình trạng','Đăng ký','Đạt','Điểm TB','Lý do','Ghi chú'],HC=['ID','ID buổi','Mã thí sinh','Tên','Tình trạng','Điểm','Ghi chú'],HA=['ID','ID buổi','Hành động','Lý do','Thời điểm'];
function sheets(){return [{name:'Buoi thi',rows:[HE,...db.exams.map(e=>[e.id,e.code,e.title,e.date,e.shift,e.room,e.capacity,e.className,e.inv1,e.inv2,e.mode,e.state,e.registered,e.passed,e.avg??'',e.reason,e.note])]},{name:'Thi sinh',rows:[HC,...db.candidates.map(c=>[c.id,c.examId,c.code,c.name,c.state,c.score??'',c.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.examId,a.action,a.reason,a.at])]}]}function exportExcel(){download(Excel.workbook(sheets()),'lich-thi-phong-thi.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Buoi thi',HE],['Thi sinh',HC],['Nhat ky',HA]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng mẫu ba sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.exams=b['Buoi thi'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),title:String(r[2]),date:String(r[3]),shift:String(r[4]),room:String(r[5]),capacity:Number(r[6]),className:String(r[7]),inv1:String(r[8]||''),inv2:String(r[9]||''),mode:String(r[10]),state:String(r[11]),registered:Number(r[12]),passed:Number(r[13]),avg:r[14]===''||r[14]===null?null:Number(r[14]),reason:String(r[15]||''),note:String(r[16]||'')}));x.candidates=b['Thi sinh'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),examId:String(r[1]),code:String(r[2]),name:String(r[3]),state:String(r[4]),score:r[5]===''||r[5]===null?null:Number(r[5]),note:String(r[6]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),examId:String(r[1]),action:String(r[2]),reason:String(r[3]||''),at:String(r[4])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.exams.length} buổi thi?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp 20 buổi mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today(),shiftDate=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};for(let [i,r] of EXAM_SAMPLE.thi.entries())x.exams.push({id:uid(),code:'MAU-'+String(i+1).padStart(3,'0'),date:shiftDate(r[0]),shift:r[1],room:r[2],className:r[3],inv1:r[4],inv2:r[5],capacity:0,registered:r[6],passed:i<14?r[7]:0,avg:i<14?r[8]:null,state:i<14?'Đã chấm':'Chưa thi',mode:'Tổng hợp',title:'Kỳ thi thử '+r[3],reason:'Dữ liệu minh họa từ file nguồn',note:i<14?'Kết quả mẫu nguồn':'Nguồn ghi 0; coi là chưa thi/chưa chấm vì ngày nằm tương lai.'});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;if(k==='newExam')openModal('exam');else if(k==='editExam')openModal('exam',id);else if(k==='newCandidate')openModal('candidate','',id);else if(k==='editCandidate')openModal('candidate',id);else if(k==='openExam'){selected=id;page='detail';render()}else if(k==='exams'||k==='calendar'){page=k;render()}else if(k==='deleteCandidate'){let c=db.candidates.find(c=>c.id===id),ex=exam(c.examId);if(confirm('Xóa thí sinh này?')){db.candidates=db.candidates.filter(v=>v.id!==id);ex.registered=roster(ex.id).length;db.audit.push({id:uid(),examId:ex.id,action:'Xóa thí sinh',reason:c.code+' · '+c.name,at:new Date().toISOString()});save()}}else if(k==='deleteExam'){let ex=exam(id);if(confirm(`Xóa buổi “${ex.title}” cùng danh sách và nhật ký?`)){db.exams=db.exams.filter(v=>v.id!==id);db.candidates=db.candidates.filter(v=>v.examId!==id);db.audit=db.audit.filter(v=>v.examId!==id);page='exams';save()}}else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),passMin=Number(f.get('passMin')),lowRate=Number(f.get('lowRate'));if(!Number.isFinite(passMin)||passMin<0||passMin>10||!Number.isFinite(lowRate)||lowRate<0||lowRate>100){alert('Ngưỡng không hợp lệ.');return}db.settings={org:String(f.get('org')||'').trim().slice(0,120),passMin,lowRate};save()}else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}if(e.target.id==='classFilter'){classFilter=e.target.value;render()}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
window.ExamApp={getDB:()=>clone(db),validate,conflicts,numbers,warnings,summary,loadSample,encode,decode,sheets,importFile};
</script></body></html>
