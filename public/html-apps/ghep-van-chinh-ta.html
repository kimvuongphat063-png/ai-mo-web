onst esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').normalize('NFC').trim().toLocaleLowerCase('vi');let grade=1,kind='all',run=null,section='home',clock=null;const labels={all:'Tổng hợp',choice:'Chọn tiếng đúng',tiles:'Ghép âm và vần',fill:'Gõ từ đúng'};function pool(){return ITEMS.filter(x=>x.g===grade&&(kind==='all'||x.kind===kind))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function el(tag,attrs={},text=''){let e=document.createElement(tag);Object.assign(e,attrs);e.textContent=text;return e}function mark(i){return !!run.answers[i]&&norm(run.answers[i])===norm(run.items[i].a)}function left(){return Math.max(0,Math.ceil((run.deadline-Date.now())/1000))}function finish(){if(!run||run.ended)return;run.ended=true;clearInterval(clock);let correct=run.items.filter((_,i)=>mark(i)).length;run.items.forEach((x,i)=>{if(!mark(i))state.wrong=[...new Set([...state.wrong,x.id])];else state.wrong=state.wrong.filter(id=>id!==x.id)});state.history.unshift({at:new Date().toISOString(),grade,kind,mode:run.mode,correct,total:run.items.length});state.history=state.history.slice(0,100);save();render()}function start(mode,review=false){let list=review?state.wrong.map(id=>ITEMS[id]).filter(Boolean):pool();if(!list.length){alert('Chưa có câu sai để ôn.');return}run={items:shuffle(list).slice(0,mode==='exam'?10:15),answers:{},index:0,checked:{},parts:{},mode,ended:false,deadline:Date.now()+180000};section='play';if(mode==='exam'){clock=setInterval(()=>{if(!run||run.ended){clearInterval(clock);return}let t=$('#timer');if(t)t.textContent=left();if(!left())finish()},500)}render()}function answer(value){if(run.ended||run.checked[run.index])return;run.answers[run.index]=value;if(run.mode==='learn')run.checked[run.index]=true;render()}function chooseTile(i){let q=run.items[run.index],p=run.parts[q.id]||[];if(p.includes(i))return;p.push(i);run.parts[q.id]=p;run.answers[run.index]=p.map(j=>q.tokens[j]).join('');render()}function viewHome(){let n=pool().length;return '<div class="hero"><small>AI MỞ · HỌC CÙNG CON</small><h2>Ghép vần & Chính tả 1–3</h2><p>Chọn lớp, luyện âm và vần, nhận biết cách viết đúng, ôn lại câu sai.</p></div><div class="card"><div class="section"><h3>1. Chọn lớp</h3><div class="row">'+[1,2,3].map(g=>'<button class="btn '+(g===grade?'primary':'')+'" data-grade="'+g+'">Lớp '+g+'</button>').join('')+'</div></div><div class="section"><h3>2. Chọn dạng bài</h3><div class="grid">'+Object.entries(labels).map(([k,v])=>'<button class="pick tile '+(k===kind?'active':'')+'" data-kind="'+k+'">'+v+'<small>'+ITEMS.filter(x=>x.g===grade&&(k==='all'||x.kind===k)).length+' mục luyện</small></button>').join('')+'</div></div><div class="section"><h3>3. Bắt đầu</h3><div class="row"><button class="btn primary" data-start="learn">Luyện có lời giải</button><button class="btn" data-start="exam">Thử thách 3 phút</button></div><p class="muted">Dạng đã chọn có '+n+' mục. Luyện từng câu để xem giải thích ngay; thử thách lấy tối đa 10 câu.</p></div></div><div class="card"><h2>Nhớ nhanh</h2><p>Âm đầu đứng trước vần: <b>ch + ăn → chăn</b>. Thanh ngang không có dấu; các thanh khác có dấu như <b>mà, má, mả, mã, mạ</b>.</p></div>'}function viewPlay(){if(run.ended){let correct=run.items.filter((_,i)=>mark(i)).length;return '<div class="hero"><h2>Kết quả: '+correct+'/'+run.items.length+' câu đúng</h2><p>Đọc lời giải cho từng câu bên dưới.</p></div><div class="card actions"><button class="btn primary" data-review="1">Luyện lại câu sai</button> <button class="btn" data-nav="home">Chọn bài khác</button></div>'+run.items.map((q,i)=>'<div class="card"><span class="tag">Câu '+(i+1)+'</span><h3>'+esc(q.q)+'</h3><p>Em trả lời: '+esc(run.answers[i]||'Bỏ trống')+'</p><p class="'+(mark(i)?'good':'bad')+'">Đáp án: <b>'+esc(q.a)+'</b></p><p>'+esc(q.explain)+'</p></div>').join('')}let q=run.items[run.index],i=run.index,locked=run.checked[i],opts='';if(q.kind==='choice')opts='<div class="grid">'+q.choices.map(a=>'<button class="pick" data-answer="'+esc(a)+'">'+esc(a)+'</button>').join('')+'</div>';if(q.kind==='tiles'){let p=run.parts[q.id]||[];opts='<p>Đã ghép: <b>'+esc(p.map(j=>q.tokens[j]).join(''))+'</b></p><div class="row">'+q.tokens.map((t,j)=>'<button class="pick" data-tile="'+j+'" '+(p.includes(j)?'disabled':'')+'>'+esc(t)+'</button>').join('')+'</div><button class="btn" data-reset="1">Ghép lại</button>'}if(q.kind==='fill')opts='<label for="free">Gõ câu trả lời</label><p><input id="free" type="text" autocomplete="off" value="'+esc(run.answers[i]||'')+'"></p><button class="btn" data-free="1">Lưu câu trả lời</button>';return '<div class="card"><div class="row"><span class="tag">Câu '+(i+1)+'/'+run.items.length+'</span><span class="tag">'+labels[q.kind]+'</span>'+(run.mode==='exam'?'<span class="tag">Còn <b id="timer">'+left()+'</b> giây</span>':'')+'</div><div class="bar"><i style="width:'+Math.round(Object.keys(run.answers).length/run.items.length*100)+'%"></i></div><h2>'+esc(q.q)+'</h2>'+opts+(locked?'<div class="feedback '+(mark(i)?'good':'bad')+'"><b>'+(mark(i)?'Đúng rồi!':'Đáp án: '+esc(q.a))+'</b><p>'+esc(q.explain)+'</p></div>':'')+'<div class="row dots">'+run.items.map((_,j)=>'<button class="btn '+(j===i?'primary':'')+'" data-jump="'+j+'">'+(j+1)+'</button>').join('')+'</div><p class="row actions">'+(run.mode==='learn'&&!locked?'<button class="btn primary" data-check="1">Kiểm tra câu này</button>':'')+'<button class="btn" data-jump="'+Math.min(i+1,run.items.length-1)+'">Câu tiếp</button><button class="btn" data-submit="1">Nộp bài</button></p></div>'}function viewWrong(){let list=state.wrong.map(id=>ITEMS[id]).filter(Boolean);return '<div class="hero"><h2>Sổ câu sai</h2><p>'+list.length+' câu cần ôn lại.</p></div><div class="card">'+(list.length?'<button class="btn primary" data-review="1">Luyện lại câu sai</button>'+list.map(q=>'<p><b>Lớp '+q.g+':</b> '+esc(q.q)+' — '+esc(q.a)+'</p>').join(''):'<p>Chưa có câu sai. Hãy bắt đầu một bài luyện.</p>')+'</div>'}function viewHistory(){let h=state.history;return '<div class="hero"><h2>Tiến độ và lịch sử</h2><p>'+h.length+' lượt luyện đã lưu trên máy này.</p></div><div class="card">'+(h.length?'<div class="grid"><div><span class="muted">Tỷ lệ đúng trung bình</span><div class="stat">'+Math.round(100*h.reduce((s,x)=>s+x.correct/x.total,0)/h.length)+'%</div></div><div><span class="muted">Lượt luyện</span><div class="stat">'+h.length+'</div></div></div><table><tr><th>Ngày</th><th>Lớp</th><th>Dạng</th><th>Đúng</th></tr>'+h.map(x=>'<tr><td>'+new Date(x.at).toLocaleDateString('vi-VN')+'</td><td>'+x.grade+'</td><td>'+esc(labels[x.kind])+'</td><td>'+x.correct+'/'+x.total+'</td></tr>').join('')+'</table>':'<p>Chưa có lượt luyện nào.</p>')+'</div>'}function viewHelp(){return '<div class="hero"><h2>Cách sử dụng</h2></div><div class="card"><ol><li>Chọn lớp và dạng bài.</li><li>Chọn Luyện có lời giải để xem giải thích sau mỗi câu.</li><li>Chọn Thử thách 3 phút để tự làm, rồi xem kết quả cuối bài.</li><li>Vào Sổ câu sai để ôn lại những câu chưa đúng.</li><li>Sao lưu JSON trước khi đổi máy hoặc xóa dữ liệu trình duyệt.</li></ol></div>'}function viewData(){return '<div class="hero"><h2>Dữ liệu và sao lưu</h2><p>Dữ liệu nằm trong trình duyệt của máy này. Không gọi API.</p></div><div class="card"><div class="row"><button class="btn primary" data-backup="1">Tải bản sao lưu JSON</button><label class="btn file">Khôi phục JSON<input id="restore" type="file" accept=".json,application/json" hidden></label><button class="btn" data-clear="1">Xóa dữ liệu</button></div><p id="status" role="status"></p></div>'}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===section));$('#screen').innerHTML=section==='home'?viewHome():section==='play'?viewPlay():section==='wrong'?viewWrong():section==='history'?viewHistory():section==='help'?viewHelp():viewData();$('#screen').querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{grade=Number(b.dataset.grade);render()});$('#screen').querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});$('#screen').querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));$('#screen').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>start('learn',true));$('#screen').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));$('#screen').querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>chooseTile(Number(b.dataset.tile)));$('#screen').querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{run.parts[run.items[run.index].id]=[];run.answers[run.index]='';render()});$('#screen').querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>answer($('#free').value));$('#screen').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{run.index=Number(b.dataset.jump);render()});$('#screen').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{if(!run.answers[run.index]){alert('Hãy trả lời câu hỏi trước.');return}run.checked[run.index]=true;render()});$('#screen').querySelectorAll('[data-submit]').forEach(b=>b.onclick=finish);$('#screen').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;render()});let backup=$('[data-backup]');if(backup)backup.onclick=()=>{let blob=new Blob([JSON.stringify({app:'aimo-spelling',schema:2,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='ghep-van-chinh-ta-sao-luu.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};let restore=$('#restore');if(restore)restore.onchange=async()=>{try{let x=JSON.parse(await restore.files[0].text());if(x.app!=='aimo-spelling'||x.schema!==2||!Array.isArray(x.data.history)||!Array.isArray(x.data.wrong))throw Error('File không đúng ứng dụng hoặc phiên bản.');if(confirm('Thay lịch sử hiện tại bằng bản sao lưu?')){state=x.data;save();render()}}catch(e){$('#status').textContent=e.message}};let clear=$('[data-clear]');if(clear)clear.onclick=()=>{if(confirm('Xóa lịch sử và sổ câu sai trên máy?')){state={history:[],wrong:[]};save();render()}}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(section==='play'&&run&&!run.ended&&Object.keys(run.answers).length&&!confirm('Thoát sẽ bỏ bài đang làm. Tiếp tục?'))return;clearInterval(clock);section=b.dataset.nav;render()});render();
const previousRenderForFiles=render;
render=function(){previousRenderForFiles();if(section==='data'){let row=$('#screen .card .row');if(row){let saveButton=el('button',{className:'btn'},'Tải HTML kèm dữ liệu');saveButton.onclick=()=>{let copy=document.documentElement.cloneNode(true);let embedded=copy.querySelector('#embedded-state');embedded.textContent=btoa(unescape(encodeURIComponent(JSON.stringify(state))));let blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=document.title.includes('Tiếng Anh')?'luyen-tieng-anh-du-lieu.html':'ghep-van-chinh-ta-du-lieu.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};row.insertBefore(saveButton,row.firstChild);let note=el('p',{className:'muted'},'Sau mỗi buổi học, tải lại bản HTML này để mang dữ liệu sang máy khác. Dữ liệu mới vẫn được tự lưu trong trình duyệt đang dùng.');row.after(note)}}if(section==='history'&&state.history.length){let card=$('#screen .card');let csvButton=el('button',{className:'btn'},'Xuất lịch sử CSV');csvButton.onclick=()=>{let rows=[['Thời gian','Lớp','Dạng bài','Chế độ','Số đúng','Tổng câu'],...state.history.map(x=>[x.at,x.grade,labels[x.kind]||x.kind,x.mode,x.correct,x.total])];let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download=document.title.includes('Tiếng Anh')?'lich-su-tieng-anh.csv':'lich-su-ghep-van.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};card.insertBefore(csvButton,card.firstChild);let printButton=el('button',{className:'btn'},'In báo cáo');printButton.style.marginLeft='8px';printButton.onclick=()=>window.print();card.insertBefore(printButton,csvButton.nextSibling)}};render();
