let db=empty(),page='home',selected='',search='',typeFilter='',alertOnly=false,draft=null;
const teacher=id=>db.teachers.find(x=>x.id===id),certificate=id=>db.certificates.find(x=>x.id===id),contract=id=>db.contracts.find(x=>x.id===id);
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!Number.isInteger(x.settings.remind)||x.settings.remind<0||x.settings.remind>3650||!Array.isArray(x.teachers)||!Array.isArray(x.certificates)||!Array.isArray(x.contracts)||!Array.isArray(x.audit))return 'Cấu trúc hoặc cài đặt không hợp lệ.';let ids=new Set(),codes=new Set();for(let t of x.teachers){if(!t.id||ids.has(t.id)||!t.code||codes.has(t.code.toUpperCase())||!t.name||!TYPES.includes(t.type)||!TEACHER_STATES.includes(t.state)||String(t.name).length>120||String(t.phone||'').length>30||String(t.note||'').length>1200)return 'Hồ sơ giáo viên không hợp lệ hoặc trùng mã.';ids.add(t.id);codes.add(t.code.toUpperCase())}let cids=new Set();for(let c of x.certificates){if(!c.id||cids.has(c.id)||!ids.has(c.teacherId)||!c.name||!TERMS.includes(c.term)||c.term==='Có hạn'&&!dateOK(c.expires)||c.term==='Không thời hạn'&&c.expires||c.issued&&!dateOK(c.issued)||c.issued&&c.expires&&c.issued>c.expires||!DOC_STATES.includes(c.state)||!VERIFICATIONS.includes(c.verification)||String(c.note||'').length>1200)return 'Chứng chỉ không hợp lệ.';cids.add(c.id)}let hids=new Set();for(let c of x.contracts){if(!c.id||hids.has(c.id)||!ids.has(c.teacherId)||!TERMS.includes(c.term)||c.term==='Có hạn'&&!dateOK(c.ends)||c.term==='Không thời hạn'&&c.ends||c.starts&&!dateOK(c.starts)||c.starts&&c.ends&&c.starts>c.ends||!DOC_STATES.includes(c.state)||String(c.note||'').length>1200)return 'Hợp đồng không hợp lệ.';hids.add(c.id)}let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ đầy. Hãy tải bản sao JSON hoặc HTML.')}render();return true}
function docDays(d){let expiry=d.expires??d.ends;return d.term==='Có hạn'&&expiry?days(expiry,db.settings.asof):null}
function docWarning(d){if(d.state!=='Đang dùng')return '';let n=docDays(d);return n===null?'':n<0?'Đã hết hạn':n<=db.settings.remind?'Sắp đến hạn':''}
function teacherWarnings(t){if(t.state!=='Đang hợp tác')return [];let a=[];for(let c of db.certificates.filter(c=>c.teacherId===t.id&&docWarning(c)))a.push({kind:'Chứng chỉ',title:c.name,days:docDays(c),warning:docWarning(c),id:c.id});for(let c of db.contracts.filter(c=>c.teacherId===t.id&&docWarning(c)))a.push({kind:'Hợp đồng',title:c.number||'Hợp đồng',days:docDays(c),warning:docWarning(c),id:c.id});return a.sort((x,y)=>x.days-y.days)}
function summary(){let active=db.teachers.filter(t=>t.state==='Đang hợp tác'),expCert=db.certificates.filter(c=>teacher(c.teacherId)?.state==='Đang hợp tác'&&docWarning(c)==='Đã hết hạn'),expContract=db.contracts.filter(c=>teacher(c.teacherId)?.state==='Đang hợp tác'&&docWarning(c)==='Đã hết hạn'),soon=db.certificates.filter(c=>teacher(c.teacherId)?.state==='Đang hợp tác'&&docWarning(c)==='Sắp đến hạn').length+db.contracts.filter(c=>teacher(c.teacherId)?.state==='Đang hợp tác'&&docWarning(c)==='Sắp đến hạn').length;return {teachers:db.teachers.length,adjunct:db.teachers.filter(t=>t.type==='Thỉnh giảng').length,active:active.length,expiredCertificates:expCert.length,expiredContracts:expContract.length,soon}}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Giáo viên</small><strong>${s.teachers}</strong></div><div><small>Thỉnh giảng</small><strong>${s.adjunct}</strong></div><div><small>Chứng chỉ quá hạn</small><strong>${s.expiredCertificates}</strong></div><div><small>Hợp đồng quá hạn</small><strong>${s.expiredContracts}</strong></div><div><small>Tài liệu sắp hạn</small><strong>${s.soon}</strong></div></div>`}
function home(){let all=db.teachers.flatMap(t=>teacherWarnings(t).map(w=>({...w,teacher:t}))).sort((a,b)=>a.days-b.days);return `<div class="hero"><span>👩‍🏫 AI MỞ · HỒ SƠ NHÂN SỰ</span><h1>Giáo viên, chứng chỉ & hợp đồng</h1><p>Theo dõi hồ sơ đang dùng, nhắc trước hạn và giữ lịch sử gia hạn.</p><div class="hero-actions">${btn('＋ Thêm giáo viên','newTeacher','primary')}${btn('📋 Xem danh sách','teachers')}</div></div>${metrics()}${panel('📍 Bắt đầu nhanh',`<ol><li>Thêm giáo viên, môn giảng dạy và hình thức hợp tác.</li><li>Ghi riêng từng chứng chỉ, hợp đồng và ngày hết hạn; “Không thời hạn” không bị nhắc hạn.</li><li>Khi có bản mới, thêm hồ sơ mới rồi đánh dấu bản cũ “Đã thay thế”.</li><li>Rà cảnh báo, in danh sách và sao lưu định kỳ.</li></ol><p class="muted">Ngày báo cáo và số ngày nhắc trước được đặt tại Cài đặt. App chỉ theo dõi thông tin người dùng nhập.</p>`)}${panel('⏰ Hạn cần xử lý',all.length?all.slice(0,14).map(x=>`<div class="mini"><button class="link" data-act="openTeacher" data-id="${esc(x.teacher.id)}">${esc(x.teacher.name)}</button><small>${esc(x.kind)} · ${esc(x.title)} · ${x.warning} (${x.days} ngày)</small></div>`).join(''):'<p class="success">Chưa có chứng chỉ hoặc hợp đồng đang dùng cần nhắc hạn.</p>')}`}
function filtered(){return db.teachers.filter(t=>(!search||[t.code,t.name,t.type,t.subjects,t.degree,t.phone].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))&&(!typeFilter||t.type===typeFilter)&&(!alertOnly||teacherWarnings(t).length)).sort((a,b)=>a.name.localeCompare(b.name,'vi'))}
function teachersPage(){return `<div class="page-head"><div><h1>👩‍🏫 Danh sách giáo viên</h1><p>Mỗi giáo viên có thể có nhiều chứng chỉ và hợp đồng theo thời gian.</p></div>${btn('＋ Thêm giáo viên','newTeacher','primary')}</div><div class="card"><div class="filters"><label>Tìm kiếm<input id="search" value="${esc(search)}" placeholder="Tên, mã, môn…"></label><label>Hình thức<select id="typeFilter"><option value="">Tất cả</option>${TYPES.map(v=>`<option ${typeFilter===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Cảnh báo<select id="alertOnly"><option value="0" ${!alertOnly?'selected':''}>Tất cả</option><option value="1" ${alertOnly?'selected':''}>Cần xử lý</option></select></label></div><p class="muted">${filtered().length} / ${db.teachers.length} giáo viên</p><div class="table-wrap"><table><thead><tr><th>Giáo viên</th><th>Hình thức</th><th>Môn</th><th>Trình độ</th><th>Chứng chỉ đang dùng</th><th>Hợp đồng đang dùng</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${filtered().map(t=>{let w=teacherWarnings(t);return `<tr><td><button class="link" data-act="openTeacher" data-id="${esc(t.id)}">${esc(t.name)}</button><small>${esc(t.code)} · ${esc(t.state)}</small></td><td>${esc(t.type)}</td><td>${esc(t.subjects||'—')}</td><td>${esc(t.degree||'—')}</td><td>${db.certificates.filter(c=>c.teacherId===t.id&&c.state==='Đang dùng').length}</td><td>${db.contracts.filter(c=>c.teacherId===t.id&&c.state==='Đang dùng').length}</td><td>${w.length?`<span class="pill red">${w.length} hạn cần xem</span>`:'—'}</td><td>${btn('Xem','openTeacher','small',t.id)}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có giáo viên phù hợp.</td></tr>'}</tbody></table></div></div>`}
function teacherDetail(){let t=teacher(selected);if(!t){page='teachers';return teachersPage()}let cert=db.certificates.filter(c=>c.teacherId===t.id).sort((a,b)=>(b.expires||'9999').localeCompare(a.expires||'9999')),contracts=db.contracts.filter(c=>c.teacherId===t.id).sort((a,b)=>(b.ends||'9999').localeCompare(a.ends||'9999')),hist=db.audit.filter(a=>a.teacherId===t.id).sort((a,b)=>b.at.localeCompare(a.at)),w=teacherWarnings(t);return `<div class="page-head"><div><button class="link" data-act="teachers">← Danh sách</button><h1>👩‍🏫 ${esc(t.name)}</h1><p>${esc(t.code)} · ${esc(t.type)} · ${esc(t.state)}</p></div><div class="actions no-print">${btn('＋ Chứng chỉ','newCertificate','primary',t.id)}${btn('＋ Hợp đồng','newContract','',t.id)}${btn('Sửa hồ sơ','editTeacher','',t.id)}${btn('🖨️ In','print')}${btn('Xóa','deleteTeacher','danger',t.id)}</div></div><div class="metrics"><div><small>Chứng chỉ</small><strong>${cert.length}</strong></div><div><small>Hợp đồng</small><strong>${contracts.length}</strong></div><div><small>Đã quá hạn</small><strong>${w.filter(x=>x.days<0).length}</strong></div><div><small>Sắp hạn</small><strong>${w.filter(x=>x.days>=0).length}</strong></div><div><small>Nhắc trước</small><strong>${db.settings.remind} ngày</strong></div></div><div class="two">${panel('ℹ️ Hồ sơ',`<p><b>Môn:</b> ${esc(t.subjects||'—')}</p><p><b>Trình độ / bằng cấp:</b> ${esc(t.degree||'—')}</p><p><b>Điện thoại:</b> ${esc(t.phone||'—')}</p><p><b>Email:</b> ${esc(t.email||'—')}</p><p><b>Ghi chú:</b> ${esc(t.note||'—')}</p>`)}${panel('⏰ Hạn cần xử lý',w.length?`<ul>${w.map(x=>`<li>${esc(x.kind)}: ${esc(x.title)} — ${x.warning} (${x.days} ngày)</li>`).join('')}</ul>`:'<p class="success">Không có tài liệu đang dùng cần nhắc hạn.</p>')}</div>${panel('🎓 Chứng chỉ chuyên môn',`<div class="actions no-print">${btn('＋ Thêm chứng chỉ','newCertificate','primary',t.id)}</div><div class="table-wrap"><table><thead><tr><th>Chứng chỉ</th><th>Đơn vị / số</th><th>Ngày cấp</th><th>Hết hạn</th><th>Đối chiếu</th><th>Trạng thái</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${cert.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.issuer||'—')}<small>${esc(c.number||'')}</small></td><td>${fmtDate(c.issued)}</td><td>${c.term==='Không thời hạn'?'Không thời hạn':fmtDate(c.expires)}</td><td>${esc(c.verification)}</td><td>${esc(c.state)}</td><td>${docWarning(c)||'—'}</td><td class="no-print">${c.state==='Đang dùng'?btn('Sửa','editCertificate','small',c.id)+btn('Thay thế','replaceCertificate','small',c.id):''}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có chứng chỉ.</td></tr>'}</tbody></table></div>`)}${panel('📄 Hợp đồng',`<div class="actions no-print">${btn('＋ Thêm hợp đồng','newContract','primary',t.id)}</div><div class="table-wrap"><table><thead><tr><th>Số / hình thức</th><th>Bắt đầu</th><th>Kết thúc</th><th>Tham chiếu hồ sơ</th><th>Trạng thái</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${contracts.map(c=>`<tr><td>${esc(c.number||'Chưa ghi số')}<small>${esc(c.arrangement||'')}</small></td><td>${fmtDate(c.starts)}</td><td>${c.term==='Không thời hạn'?'Không thời hạn':fmtDate(c.ends)}</td><td>${esc(c.docRef||'—')}</td><td>${esc(c.state)}</td><td>${docWarning(c)||'—'}</td><td class="no-print">${c.state==='Đang dùng'?btn('Sửa','editContract','small',c.id)+btn('Thay thế','replaceContract','small',c.id):''}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có hợp đồng.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký hồ sơ',hist.length?`<div class="timeline">${hist.map(a=>`<div><b>${esc(a.action)}</b> · ${fmtDate(a.at.slice(0,10))}<p>${esc(a.reason||'—')}</p></div>`).join('')}</div>`:'<p class="muted">Chưa có thay đổi.</p>')}`}
function deadlines(){let docs=[...db.certificates.map(c=>({id:c.id,teacherId:c.teacherId,kind:'Chứng chỉ',title:c.name,expiry:c.expires,warning:docWarning(c),days:docDays(c),state:c.state})),...db.contracts.map(c=>({id:c.id,teacherId:c.teacherId,kind:'Hợp đồng',title:c.number||'Hợp đồng',expiry:c.ends,warning:docWarning(c),days:docDays(c),state:c.state}))].filter(x=>teacher(x.teacherId)?.state==='Đang hợp tác'&&x.state==='Đang dùng').sort((a,b)=>(a.days??Infinity)-(b.days??Infinity));return `<div class="page-head"><div><h1>⏰ Hạn chứng chỉ & hợp đồng</h1><p>Ngày báo cáo ${fmtDate(db.settings.asof)}; nhắc trước ${db.settings.remind} ngày. Các hạn được hiển thị riêng, không che nhau.</p></div>${btn('🖨️ In danh sách','print')}</div>${panel('Tài liệu đang dùng',`<div class="table-wrap"><table><thead><tr><th>Giáo viên</th><th>Loại</th><th>Tài liệu</th><th>Hết hạn</th><th>Còn ngày</th><th>Tình trạng</th></tr></thead><tbody>${docs.map(x=>`<tr><td><button class="link" data-act="openTeacher" data-id="${esc(x.teacherId)}">${esc(teacher(x.teacherId).name)}</button></td><td>${x.kind}</td><td>${esc(x.title)}</td><td>${x.expiry?fmtDate(x.expiry):'Không thời hạn'}</td><td>${x.days===null?'—':x.days}</td><td>${x.warning?`<span class="pill red">${x.warning}</span>`:'Còn hiệu lực theo hạn nhập'}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có tài liệu đang dùng.</td></tr>'}</tbody></table></div>`)}`}
function reports(){let subjects=[...new Set(db.teachers.flatMap(t=>t.subjects.split(',').map(x=>x.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'vi'));return `<div class="page-head"><div><h1>📊 Báo cáo nhân sự</h1><p>Đếm theo hồ sơ đã nhập; không tự kết luận điều kiện hành nghề hoặc tiêu chuẩn chương trình.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo hình thức',`<div class="table-wrap"><table><thead><tr><th>Hình thức</th><th>Giáo viên</th><th>Đang hợp tác</th><th>Có hạn cần xử lý</th></tr></thead><tbody>${TYPES.map(v=>{let a=db.teachers.filter(t=>t.type===v);return `<tr><td>${v}</td><td>${a.length}</td><td>${a.filter(t=>t.state==='Đang hợp tác').length}</td><td>${a.filter(t=>teacherWarnings(t).length).length}</td></tr>`}).join('')}</tbody></table></div>`)}${panel('Theo môn đã ghi',`<div class="table-wrap"><table><thead><tr><th>Môn</th><th>Số giáo viên</th><th>Thỉnh giảng</th></tr></thead><tbody>${subjects.map(v=>{let a=db.teachers.filter(t=>t.subjects.split(',').map(x=>x.trim()).includes(v));return `<tr><td>${esc(v)}</td><td>${a.length}</td><td>${a.filter(t=>t.type==='Thỉnh giảng').length}</td></tr>`}).join('')||'<tr><td colspan="3">Chưa ghi môn.</td></tr>'}</tbody></table></div>`)}${panel('Các hạn cần xử lý',`<div class="table-wrap"><table><thead><tr><th>Giáo viên</th><th>Tài liệu</th><th>Hết hạn</th><th>Cảnh báo</th></tr></thead><tbody>${db.teachers.flatMap(t=>teacherWarnings(t).map(w=>`<tr><td>${esc(t.name)}</td><td>${esc(w.kind)} · ${esc(w.title)}</td><td>${w.days} ngày</td><td>${w.warning}</td></tr>`)).join('')||'<tr><td colspan="4">Không có hạn cần xử lý.</td></tr>'}</tbody></table></div>`)}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngày báo cáo & ngưỡng nhắc',`<form id="settingsForm" class="form-grid"><label>Ngày báo cáo<input name="asof" type="date" value="${esc(db.settings.asof)}" required></label><label>Nhắc trước hạn (ngày)<input name="remind" type="number" min="0" max="3650" step="1" value="${db.settings.remind}" required></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="note">Mặc định mẫu là 45 ngày. Hết hạn khi ngày kết thúc trước ngày báo cáo; sắp hạn khi còn từ 0 đến ngưỡng ngày.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu và chuyển máy',`<p>Dữ liệu giáo viên lưu trong trình duyệt trên thiết bị này. Sao chép HTML gốc không mang thông tin mới đã nhập. Dùng JSON hoặc HTML kèm dữ liệu để chuyển máy; giữ file sao lưu riêng tư.</p><div class="actions">${btn('⬇️ Tải JSON','exportJson')}${btn('⬇️ Tải HTML kèm dữ liệu','exportHtml','primary')}${btn('⬇️ Excel 4 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Mẫu nguồn',`<p>20 giáo viên, 20 chứng chỉ và 20 hợp đồng. Mẫu gốc dùng ngày tương đối theo ngày mở; 4 chứng chỉ và 4 hợp đồng quá hạn. Tên chứng chỉ/hợp đồng chỉ là nội dung mẫu, chưa xác minh tính hiệu lực.</p>${btn('Nạp mẫu nguồn (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ dữ liệu app này trên thiết bị.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn sử dụng</h1></div>${panel('Quy trình hồ sơ',`<ol><li>Tạo hồ sơ giáo viên, môn dạy và hình thức hợp tác.</li><li>Ghi từng chứng chỉ với đơn vị cấp, số, ngày cấp, hạn và tình trạng đã đối chiếu.</li><li>Ghi từng hợp đồng với số, ngày bắt đầu/kết thúc hoặc không thời hạn.</li><li>Khi gia hạn, tạo chứng chỉ/hợp đồng mới rồi đánh dấu bản cũ “Đã thay thế” với lý do. Bản cũ vẫn còn để tra cứu.</li><li>Đặt ngày báo cáo, xem hạn sắp tới, in và sao lưu.</li></ol>`)}${panel('Cách hiểu cảnh báo',`<p>Ngày còn lại = ngày hết hạn − ngày báo cáo. Số âm là đã quá hạn, từ 0 đến ngưỡng là sắp hạn. App hiển thị mọi hạn đang dùng của giáo viên còn hợp tác; không ưu tiên một hạn rồi che hạn khác.</p><p>“Không thời hạn” là lựa chọn do người nhập khai báo. App không xác thực bản gốc chứng chỉ/hợp đồng và không kết luận người dạy đủ điều kiện theo một chương trình cụ thể.</p>`)}`}
function render(){let map={home:['Tổng quan',home],teachers:['Giáo viên',teachersPage],detail:['Hồ sơ',teacherDetail],deadlines:['Nhắc hạn',deadlines],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,l,v='',type='text',opts=null){return `<label class="${type==='textarea'?'full':''}">${l}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(v)}</textarea>`:opts?`<select name="${n}">${opts.map(o=>{let key=Array.isArray(o)?o[0]:o,label=Array.isArray(o)?o[1]:o;return `<option value="${esc(key)}" ${key===v?'selected':''}>${esc(label)}</option>`}).join('')}</select>`:`<input name="${n}" type="${type}" value="${esc(v)}" ${['code','name'].includes(n)?'required':''}>`}</label>`}
function openModal(kind,id='',teacherId=''){let before=id?clone(kind==='teacher'?teacher(id):kind==='certificate'?certificate(id):contract(id)):null;draft={kind,id,teacherId,before};let x=before||{},f='';if(kind==='teacher'){f=field('code','Mã giáo viên',x.code||'')+field('name','Họ tên',x.name||'')+field('type','Hình thức',x.type||'Thỉnh giảng','text',TYPES)+field('state','Trạng thái hợp tác',x.state||'Đang hợp tác','text',TEACHER_STATES)+field('subjects','Môn giảng dạy (cách nhau dấu phẩy)',x.subjects||'')+field('degree','Trình độ / bằng cấp',x.degree||'')+field('phone','Điện thoại',x.phone||'')+field('email','Email',x.email||'')+field('note','Ghi chú',x.note||'','textarea')+(id?field('reason','Lý do sửa','', 'textarea'):'')}else if(kind==='certificate'){f=field('name','Tên chứng chỉ',x.name||'')+field('issuer','Đơn vị cấp',x.issuer||'')+field('number','Số chứng chỉ',x.number||'')+field('issued','Ngày cấp',x.issued||'','date')+field('term','Thời hạn',x.term||'Có hạn','text',TERMS)+field('expires','Ngày hết hạn (nếu có hạn)',x.expires||'','date')+field('verification','Đối chiếu bản gốc',x.verification||'Chưa đối chiếu','text',VERIFICATIONS)+field('docRef','Mã / vị trí file tham chiếu',x.docRef||'')+field('note','Ghi chú',x.note||'','textarea')+(id?field('reason','Lý do sửa','', 'textarea'):'')}else{f=field('number','Số hợp đồng',x.number||'')+field('arrangement','Hình thức / phạm vi',x.arrangement||'')+field('starts','Ngày bắt đầu',x.starts||'','date')+field('term','Thời hạn',x.term||'Có hạn','text',TERMS)+field('ends','Ngày kết thúc (nếu có hạn)',x.ends||'','date')+field('docRef','Mã / vị trí file tham chiếu',x.docRef||'')+field('note','Ghi chú',x.note||'','textarea')+(id?field('reason','Lý do sửa','', 'textarea'):'')}$('#modalTitle').textContent=kind==='teacher'?(id?'Sửa giáo viên':'Thêm giáo viên'):kind==='certificate'?(id?'Sửa chứng chỉ':'Thêm chứng chỉ'):(id?'Sửa hợp đồng':'Thêm hợp đồng');$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function error(s){$('#formError').textContent=s}function audit(action,reason,teacherId=''){db.audit.push({id:uid(),action,reason,teacherId,at:new Date().toISOString()})}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let kind=draft.kind,old=draft.before;if(old&&!x.reason){error('Cần lý do khi sửa hồ sơ đã lưu.');return}if(kind==='teacher'){x.code=x.code.toUpperCase();if(!x.code||!x.name||!TYPES.includes(x.type)||!TEACHER_STATES.includes(x.state)||db.teachers.some(t=>t.code===x.code&&t.id!==x.id)){error('Mã giáo viên không trùng, tên, hình thức và trạng thái là bắt buộc.');return}delete x.reason;if(old)Object.assign(teacher(x.id),x);else db.teachers.push(x);audit(old?'Sửa giáo viên':'Thêm giáo viên',(f.get('reason')||'')+' · '+x.name,x.id);selected=x.id}else if(kind==='certificate'){x.teacherId=old?.teacherId||draft.teacherId;x.state=old?.state||'Đang dùng';if(!teacher(x.teacherId)||!x.name||!TERMS.includes(x.term)||x.term==='Có hạn'&&!dateOK(x.expires)||x.issued&&!dateOK(x.issued)||x.issued&&x.expires&&x.issued>x.expires){error('Tên, thời hạn và ngày chứng chỉ không hợp lệ.');return}if(x.term==='Không thời hạn')x.expires='';if(old&&old.state!=='Đang dùng'){error('Bản đã thay thế không sửa trực tiếp.');return}delete x.reason;if(old)Object.assign(certificate(x.id),x);else db.certificates.push(x);audit(old?'Sửa chứng chỉ':'Thêm chứng chỉ',(f.get('reason')||'')+' · '+x.name,x.teacherId);selected=x.teacherId}else{x.teacherId=old?.teacherId||draft.teacherId;x.state=old?.state||'Đang dùng';if(!teacher(x.teacherId)||!TERMS.includes(x.term)||x.term==='Có hạn'&&!dateOK(x.ends)||x.starts&&!dateOK(x.starts)||x.starts&&x.ends&&x.starts>x.ends){error('Thời hạn và ngày hợp đồng không hợp lệ.');return}if(x.term==='Không thời hạn')x.ends='';if(old&&old.state!=='Đang dùng'){error('Bản đã thay thế không sửa trực tiếp.');return}delete x.reason;if(old)Object.assign(contract(x.id),x);else db.contracts.push(x);audit(old?'Sửa hợp đồng':'Thêm hợp đồng',(f.get('reason')||'')+' · '+(x.number||'Hợp đồng'),x.teacherId);selected=x.teacherId}let err=validate(db);if(err){let list=kind==='teacher'?db.teachers:kind==='certificate'?db.certificates:db.contracts;if(old)Object.assign(list.find(y=>y.id===x.id),old);else list.splice(list.findIndex(y=>y.id===x.id),1);db.audit.pop();error(err);return}$('#editor').close();page='detail';save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'giao-vien-ho-so-sao-luu.json')}function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'giao-vien-ho-so-kem-du-lieu.html')}
const HT=['ID','Mã','Tên','Hình thức','Trạng thái','Môn','Trình độ','Điện thoại','Email','Ghi chú'],HC=['ID','ID giáo viên','Tên','Đơn vị cấp','Số','Ngày cấp','Thời hạn','Hết hạn','Đối chiếu','Trạng thái','Tham chiếu file','Ghi chú'],HH=['ID','ID giáo viên','Số hợp đồng','Hình thức','Bắt đầu','Thời hạn','Kết thúc','Trạng thái','Tham chiếu file','Ghi chú'],HA=['ID','Hành động','Lý do','ID giáo viên','Thời điểm'];
function sheets(){return [{name:'Giao vien',rows:[HT,...db.teachers.map(t=>[t.id,t.code,t.name,t.type,t.state,t.subjects,t.degree,t.phone,t.email,t.note])]},{name:'Chung chi',rows:[HC,...db.certificates.map(c=>[c.id,c.teacherId,c.name,c.issuer,c.number,c.issued,c.term,c.expires,c.verification,c.state,c.docRef,c.note])]},{name:'Hop dong',rows:[HH,...db.contracts.map(c=>[c.id,c.teacherId,c.number,c.arrangement,c.starts,c.term,c.ends,c.state,c.docRef,c.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.teacherId,a.at])]}]}function exportExcel(){download(Excel.workbook(sheets()),'giao-vien-thinh-giang.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Giao vien',HT],['Chung chi',HC],['Hop dong',HH],['Nhat ky',HA]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng mẫu bốn sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.teachers=b['Giao vien'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),name:String(r[2]),type:String(r[3]),state:String(r[4]),subjects:String(r[5]||''),degree:String(r[6]||''),phone:String(r[7]||''),email:String(r[8]||''),note:String(r[9]||'')}));x.certificates=b['Chung chi'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),teacherId:String(r[1]),name:String(r[2]),issuer:String(r[3]||''),number:String(r[4]||''),issued:String(r[5]||''),term:String(r[6]),expires:String(r[7]||''),verification:String(r[8]),state:String(r[9]),docRef:String(r[10]||''),note:String(r[11]||'')}));x.contracts=b['Hop dong'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),teacherId:String(r[1]),number:String(r[2]||''),arrangement:String(r[3]||''),starts:String(r[4]||''),term:String(r[5]),ends:String(r[6]||''),state:String(r[7]),docRef:String(r[8]||''),note:String(r[9]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),teacherId:String(r[3]||''),at:String(r[4])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.teachers.length} giáo viên?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today(),date=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};for(let [i,r] of TEACHER_SAMPLE.gv.entries()){let id=uid();x.teachers.push({id,code:'MAU-'+String(i+1).padStart(3,'0'),name:r[0],type:r[1],subjects:r[2],degree:r[3],phone:'',email:'',state:'Đang hợp tác',note:'Dữ liệu mẫu chưa có liên hệ và hồ sơ xác minh.'});x.certificates.push({id:uid(),teacherId:id,name:r[4],issuer:'',number:'',issued:'',term:'Có hạn',expires:date(r[5]),verification:'Chưa đối chiếu',state:'Đang dùng',docRef:'',note:'Ngày hết hạn tương đối theo ngày nạp mẫu.'});x.contracts.push({id:uid(),teacherId:id,number:'',arrangement:r[1],starts:'',term:'Có hạn',ends:date(r[6]),state:'Đang dùng',docRef:'',note:'Nguồn chỉ có ngày kết thúc, không có số hoặc ngày bắt đầu.'})}let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;if(k==='newTeacher')openModal('teacher');else if(k==='editTeacher')openModal('teacher',id);else if(k==='newCertificate')openModal('certificate','',id);else if(k==='editCertificate')openModal('certificate',id);else if(k==='newContract')openModal('contract','',id);else if(k==='editContract')openModal('contract',id);else if(k==='openTeacher'){selected=id;page='detail';render()}else if(k==='teachers'){page='teachers';render()}else if(k==='replaceCertificate'||k==='replaceContract'){let d=k==='replaceCertificate'?certificate(id):contract(id),reason=prompt('Lý do đánh dấu đã thay thế (ví dụ số hồ sơ mới):');if(reason===null)return;if(!reason.trim()){alert('Cần lý do thay thế.');return}d.state='Đã thay thế';audit(k==='replaceCertificate'?'Thay thế chứng chỉ':'Thay thế hợp đồng',reason.trim(),d.teacherId);save()}else if(k==='deleteTeacher'){let t=teacher(id);if(db.certificates.some(c=>c.teacherId===id)||db.contracts.some(c=>c.teacherId===id)){alert('Giáo viên đã có chứng chỉ hoặc hợp đồng; hãy đổi trạng thái Ngừng hợp tác thay vì xóa.');return}if(confirm(`Xóa giáo viên “${t.name}”?`)){db.teachers=db.teachers.filter(x=>x.id!==id);audit('Xóa giáo viên',t.code,id);page='teachers';save()}}else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),asof=String(f.get('asof')),remind=Number(f.get('remind'));if(!dateOK(asof)||!Number.isInteger(remind)||remind<0||remind>3650){alert('Ngày báo cáo hoặc số ngày nhắc không hợp lệ.');return}db.settings={asof,remind};save()}else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let n=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(n,n)}if(e.target.id==='typeFilter'){typeFilter=e.target.value;render()}if(e.target.id==='alertOnly'){alertOnly=e.target.value==='1';render()}});
document.addEventListener('change',e=>{if(e.target.name==='term'&&draft?.kind==='certificate'&&e.target.value==='Không thời hạn')$('[name="expires"]').value='';if(e.target.name==='term'&&draft?.kind==='contract'&&e.target.value==='Không thời hạn')$('[name="ends"]').value=''});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
window.AdjunctApp={getDB:()=>clone(db),validate,summary,teacherWarnings,docDays,loadSample,encode,decode,sheets,importFile};
</script></body></html>
