const validDate=s=>/^\d{4}-\d\d-\d\d$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s;
const month=s=>String(s||'').slice(0,7),fmt=s=>s?`${s.slice(8)}/${s.slice(5,7)}/${s.slice(0,4)}`:'—',num=n=>Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:2}),money=n=>Math.round(Number(n||0)).toLocaleString('vi-VN')+' ₫';
const offset=s=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};
const empty=()=>({app:APP,version:VERSION,settings:{asof:today(),loiMax:5},rates:[],workers:[],entries:[],audit:[]});
let db=empty(),page='home',selected='',filterMonth=month(today()),filterWorker='all',filterState='all',search='',draft=null;
const worker=wid=>db.workers.find(w=>w.id===wid),rate=rid=>db.rates.find(r=>r.id===rid),entry=eid=>db.entries.find(e=>e.id===eid);
const included=e=>e.state==='Đã duyệt'||e.state==='Mẫu gốc',earning=e=>Math.round(e.good*e.price);
const workerEntries=(w,m='all')=>db.entries.filter(e=>e.workerId===w.id&&included(e)&&(m==='all'||month(e.date)===m));
function workerStats(w,m='all'){let a=workerEntries(w,m),good=a.reduce((n,e)=>n+e.good,0),bad=a.reduce((n,e)=>n+e.bad,0),pay=a.reduce((n,e)=>n+earning(e),0);return {rows:a.length,good,bad,pay,rate:good+bad?Math.round(bad/(good+bad)*10000)/100:0,warning:good+bad>0&&bad/(good+bad)*100>db.settings.loiMax}}
function summary(m='all'){let a=db.entries.filter(e=>included(e)&&(m==='all'||month(e.date)===m));return {workers:db.workers.length,rows:a.length,good:a.reduce((n,e)=>n+e.good,0),bad:a.reduce((n,e)=>n+e.bad,0),pay:a.reduce((n,e)=>n+earning(e),0),pending:db.entries.filter(e=>e.state==='Chờ duyệt'&&(m==='all'||month(e.date)===m)).length,warnings:db.workers.filter(w=>workerStats(w,m).warning).length}}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!validDate(x.settings.asof)||!Number.isFinite(x.settings.loiMax)||x.settings.loiMax<0||x.settings.loiMax>100||!Array.isArray(x.rates)||!Array.isArray(x.workers)||!Array.isArray(x.entries)||!Array.isArray(x.audit))return 'Cấu trúc dữ liệu hoặc cài đặt không hợp lệ.';
 let ids=new Set(),stages=new Set();for(let r of x.rates){if(!r.id||ids.has(r.id)||!r.stage||stages.has(r.stage.toLocaleLowerCase('vi'))||!Number.isSafeInteger(r.price)||r.price<0||String(r.note||'').length>1000)return 'Đơn giá công đoạn không hợp lệ hoặc trùng tên.';ids.add(r.id);stages.add(r.stage.toLocaleLowerCase('vi'))}
 ids=new Set();let codes=new Set();for(let w of x.workers){if(!w.id||ids.has(w.id)||!w.code||codes.has(w.code.toUpperCase())||!w.name||String(w.note||'').length>1000)return 'Công nhân thiếu hoặc trùng mã.';ids.add(w.id);codes.add(w.code.toUpperCase())}
 ids=new Set();let combos=new Set();for(let e of x.entries){let combo=e.date+'|'+e.workerId+'|'+e.rateId;if(!e.id||ids.has(e.id)||!x.workers.some(w=>w.id===e.workerId)||!x.rates.some(r=>r.id===e.rateId)||!validDate(e.date)||!Number.isSafeInteger(e.good)||e.good<0||!Number.isSafeInteger(e.bad)||e.bad<0||e.good+e.bad===0||!Number.isSafeInteger(e.price)||e.price<0||!['Mẫu gốc','Chờ duyệt','Đã duyệt','Hủy'].includes(e.state)||!Number.isSafeInteger(e.sourceIndex)||e.sourceIndex<0||String(e.note||'').length>1200)return 'Dòng sản lượng không hợp lệ.';ids.add(e.id);if(e.state!=='Hủy'){if(combos.has(combo))return 'Trùng ngày, công nhân và công đoạn.';combos.add(combo)}}
 ids=new Set();for(let a of x.audit){if(!a.id||ids.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';ids.add(a.id)}return ''}
function sampleData(){let x=empty();for(let [stage,price] of PIECE_SAMPLE.dg)x.rates.push({id:id(),stage,price,note:'Đơn giá mẫu gốc'});for(let [code,name] of PIECE_SAMPLE.cn)x.workers.push({id:id(),code,name,note:'Công nhân mẫu gốc'});PIECE_SAMPLE.gh.forEach(([d,code,stage,good,bad],i)=>{let w=x.workers.find(w=>w.code===code),r=x.rates.find(r=>r.stage===stage);x.entries.push({id:id(),date:offset(d),workerId:w.id,rateId:r.id,good,bad,price:r.price,state:'Mẫu gốc',sourceIndex:i+1,approvedBy:'',note:'Dữ liệu mẫu tham chiếu; không có ngày duyệt trong nguồn.'})});return x}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function embedded(){try{let s=$('#embedded-state').textContent.trim();return s==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
try{let e=embedded(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let v=validate(db);if(v){alert(v);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ không lưu được. Hãy tải bản sao JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,detail,ref=''){db.audit.push({id:id(),at:new Date().toISOString(),action,detail,ref})}
function btn(label,action,cls='',key=''){return `<button type="button" class="btn ${cls}" data-act="${action}" ${key?`data-id="${E(key)}"`:''}>${label}</button>`}
function panel(title,body,cls=''){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}
function stateTag(s){return `<span class="state ${s==='Đã duyệt'?'ok':s==='Mẫu gốc'?'source':s==='Chờ duyệt'?'wait':'cancel'}">${E(s)}</span>`}
function workerCard(w){let x=workerStats(w,filterMonth);return `<button class="worker-card" data-act="openWorker" data-id="${E(w.id)}"><span class="avatar">${E(w.name.slice(0,1).toUpperCase())}</span><span class="worker-main"><b>${E(w.name)}</b><small>${E(w.code)} · ${x.rows} phiếu việc</small></span><span class="worker-pay">${money(x.pay)}<small>${num(x.good)} đạt · ${num(x.bad)} lỗi</small></span>${x.warning?'<em>Kiểm tra lỗi</em>':''}</button>`}
function header(title,subtitle,actions=''){return `<div class="page-head"><div><span class="eyebrow">AI MỞ · XƯỞNG SẢN XUẤT</span><h1>${title}</h1><p>${subtitle}</p></div><div class="actions">${actions}</div></div>`}
function home(){let s=summary(filterMonth),workers=db.workers.slice().sort((a,b)=>workerStats(b,filterMonth).pay-workerStats(a,filterMonth).pay);return `${header('Mỗi công đoạn rõ giá. Mỗi phiếu việc rõ tiền.','Ghi sản lượng đạt và lỗi theo công nhân; đối chiếu tiền công trước khi xác nhận.',btn('＋ Ghi sản lượng','newEntry','primary')+btn('Xem sổ phiếu','entries'))}<div class="work-canvas"><aside class="pay-summary"><span>THÁNG ĐANG XEM</span><input id="homeMonth" type="month" value="${E(filterMonth)}" aria-label="Tháng xem lương"><div class="pay-total">${money(s.pay)}</div><p>Tiền công sản phẩm ghi nhận</p><div class="summary-grid"><div><b>${num(s.good)}</b><small>Sản phẩm đạt</small></div><div><b>${num(s.bad)}</b><small>Sản phẩm lỗi</small></div><div><b>${s.pending}</b><small>Chờ duyệt</small></div><div><b>${s.warnings}</b><small>Người cần xem lỗi</small></div></div><p class="hint">Chỉ dòng mẫu gốc và dòng đã duyệt vào tổng. Đây là tiền công theo sản phẩm, chưa phải bảng lương cuối cùng.</p></aside><section class="worker-board"><div class="section-head"><div><small>01 / DANH SÁCH CÔNG NHÂN</small><h2>Chọn người để xem phiếu lương</h2></div>${btn('＋ Công nhân','newWorker')}</div>${workers.length?workers.map(workerCard).join(''):'<div class="empty">Chưa có công nhân. Thêm thủ công hoặc nạp dữ liệu mẫu ở mục Dữ liệu.</div>'}</section></div><div class="secondary-grid">${panel('⏳ Phiếu chờ duyệt',db.entries.filter(e=>e.state==='Chờ duyệt').slice(0,8).map(e=>`<div class="mini"><button class="link" data-act="openEntry" data-id="${E(e.id)}">${E(worker(e.workerId).name)} · ${E(rate(e.rateId).stage)}</button><span>${fmt(e.date)} · ${num(e.good)} đạt · ${money(earning(e))}</span></div>`).join('')||'<p class="empty">Không có phiếu chờ duyệt.</p>')}${panel('🧾 Quy tắc tính',`<p><b>Tiền công = sản phẩm đạt × đơn giá công đoạn tại lúc ghi.</b> Sản phẩm lỗi được theo dõi tỷ lệ và không cộng vào tiền công sản phẩm.</p><p>Cảnh báo khi tỷ lệ lỗi của công nhân vượt ${num(db.settings.loiMax)}% (ngưỡng nội bộ chỉnh được).</p>`)}</div>`}
function entriesPage(){let a=db.entries.filter(e=>(filterState==='all'||e.state===filterState)&&(filterWorker==='all'||e.workerId===filterWorker)&&(filterMonth==='all'||month(e.date)===filterMonth)&&(!search||[worker(e.workerId)?.name,worker(e.workerId)?.code,rate(e.rateId)?.stage].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))).sort((a,b)=>b.date.localeCompare(a.date));return `${header('Sổ phiếu việc','Một lượt ghi nhận là một công nhân tại một công đoạn trong một ngày.',btn('＋ Ghi sản lượng','newEntry','primary'))}${panel('Lọc và đối chiếu',`<div class="filters"><label>Tháng<input type="month" id="entryMonth" value="${filterMonth==='all'?'':E(filterMonth)}"></label><label>Công nhân<select id="entryWorker"><option value="all">Tất cả</option>${db.workers.map(w=>`<option value="${E(w.id)}" ${filterWorker===w.id?'selected':''}>${E(w.code)} · ${E(w.name)}</option>`).join('')}</select></label><label>Trạng thái<select id="entryState"><option value="all">Tất cả</option>${['Mẫu gốc','Chờ duyệt','Đã duyệt','Hủy'].map(s=>`<option ${filterState===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Tìm<input id="entrySearch" value="${E(search)}" placeholder="Tên, mã, công đoạn"></label></div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Công nhân</th><th>Công đoạn</th><th>Đạt</th><th>Lỗi</th><th>Đơn giá chụp</th><th>Tiền công</th><th>Trạng thái</th><th></th></tr></thead><tbody>${a.map(e=>`<tr><td>${fmt(e.date)}</td><td><button class="link" data-act="openWorker" data-id="${E(e.workerId)}">${E(worker(e.workerId).name)}</button></td><td>${E(rate(e.rateId).stage)}</td><td>${num(e.good)}</td><td>${num(e.bad)}</td><td>${money(e.price)}</td><td><b>${money(earning(e))}</b></td><td>${stateTag(e.state)}</td><td>${btn('Xem','openEntry','small',e.id)}</td></tr>`).join('')||'<tr><td colspan="9">Không có phiếu phù hợp.</td></tr>'}</tbody></table></div>`)}`}
function workersPage(){return `${header('Công nhân & phiếu lương','Xem sản lượng, tỷ lệ lỗi và tiền công theo người.',btn('＋ Công nhân','newWorker','primary'))}<div class="tiles">${db.workers.map(w=>{let x=workerStats(w,filterMonth);return `<button class="worker-tile" data-act="openWorker" data-id="${E(w.id)}"><small>${E(w.code)}</small><h2>${E(w.name)}</h2><strong>${money(x.pay)}</strong><span>${num(x.good)} đạt · ${num(x.bad)} lỗi · ${num(x.rate)}% lỗi</span>${x.warning?'<em>Vượt ngưỡng lỗi</em>':''}</button>`}).join('')||'<div class="empty">Chưa có công nhân.</div>'}</div>`}
function workerPage(){let w=worker(selected);if(!w){page='workers';return workersPage()}let x=workerStats(w,filterMonth),a=workerEntries(w,filterMonth).sort((a,b)=>a.date.localeCompare(b.date));return `${header(E(w.name),`${E(w.code)} · Phiếu tiền công tháng ${E(filterMonth)} · ${x.rows} lượt`,btn('＋ Ghi sản lượng','newEntry','primary',w.id)+btn('🖨️ In phiếu lương','print'))}<div class="payslip"><div class="payslip-top"><div><small>PHIẾU TIỀN CÔNG SẢN PHẨM</small><h2>${E(w.name)}</h2><span>${E(w.code)} · ${E(filterMonth)}</span></div><div><small>TỔNG TIỀN GHI NHẬN</small><strong>${money(x.pay)}</strong><span>Chưa gồm các khoản lương/khấu trừ khác</span></div></div><div class="payslip-stats"><div>${num(x.good)}<small>Sản phẩm đạt</small></div><div>${num(x.bad)}<small>Sản phẩm lỗi</small></div><div>${num(x.rate)}%<small>Tỷ lệ lỗi</small></div><div>${x.rows}<small>Phiếu việc</small></div></div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Công đoạn</th><th>Đạt</th><th>Lỗi</th><th>Đơn giá</th><th>Thành tiền</th><th></th></tr></thead><tbody>${a.map(e=>`<tr><td>${fmt(e.date)}</td><td>${E(rate(e.rateId).stage)}</td><td>${num(e.good)}</td><td>${num(e.bad)}</td><td>${money(e.price)}</td><td>${money(earning(e))}</td><td>${btn('Xem','openEntry','small',e.id)}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có lượt đã duyệt trong tháng.</td></tr>'}</tbody></table></div><div class="signature"><span>Người lập bảng<br><br>..........................</span><span>Người lao động đối chiếu<br><br>..........................</span></div></div>${panel('Ghi chú',`<p>${E(w.note||'—')}</p><p>Ngưỡng cảnh báo lỗi: ${num(db.settings.loiMax)}%. ${x.warning?'Tỷ lệ lỗi đang vượt ngưỡng nội bộ.':'Tỷ lệ lỗi hiện không vượt ngưỡng.'}</p><div class="actions">${btn('Sửa hồ sơ','editWorker','',w.id)}</div>`)}`}
function entryPage(){let e=entry(selected);if(!e){page='entries';return entriesPage()}let w=worker(e.workerId),r=rate(e.rateId),rati=e.good+e.bad?Math.round(e.bad/(e.good+e.bad)*10000)/100:0;return `${header('Phiếu việc · '+E(w.code),`${fmt(e.date)} · ${E(w.name)} · ${E(r.stage)}`,btn('🖨️ In phiếu','print'))}<div class="jobticket"><div class="ticket-head"><span>AI MỞ · PHIẾU GHI NHẬN SẢN LƯỢNG</span>${stateTag(e.state)}</div><div class="ticket-grid"><div><small>Công nhân</small><strong>${E(w.name)}</strong></div><div><small>Công đoạn</small><strong>${E(r.stage)}</strong></div><div><small>Sản phẩm đạt</small><strong>${num(e.good)}</strong></div><div><small>Sản phẩm lỗi</small><strong>${num(e.bad)}</strong></div><div><small>Đơn giá đã chụp</small><strong>${money(e.price)}</strong></div><div><small>Tỷ lệ lỗi dòng</small><strong>${num(rati)}%</strong></div></div><div class="ticket-total"><span>Đạt × đơn giá</span><b>${money(earning(e))}</b></div><p><b>Ghi chú:</b> ${E(e.note||'—')}</p>${e.sourceIndex?`<p><b>Dòng mẫu nguồn:</b> ${e.sourceIndex}</p>`:''}${e.approvedBy?`<p><b>Người duyệt:</b> ${E(e.approvedBy)}</p>`:''}<div class="actions no-print">${e.state==='Chờ duyệt'?btn('Duyệt phiếu','approveEntry','primary',e.id)+btn('Sửa','editEntry','',e.id)+btn('Hủy','cancelEntry','danger',e.id):''}${e.state==='Đã duyệt'?btn('Hủy có lý do','cancelEntry','danger',e.id):''}</div></div>${panel('Lịch sử',db.audit.filter(a=>a.ref===e.id).slice().reverse().map(a=>`<div class="mini"><b>${E(a.action)}</b><span>${E(a.detail)} · ${E(a.at.slice(0,16).replace('T',' '))}</span></div>`).join('')||'<p class="empty">Dòng mẫu không có lịch sử duyệt riêng.</p>')}`}
function ratesPage(){return `${header('Đơn giá công đoạn','Giá hiện tại dùng cho phiếu mới. Phiếu cũ giữ đơn giá đã chụp.',btn('＋ Thêm công đoạn','newRate','primary'))}<div class="rates-grid">${db.rates.map(r=>`<div class="rate-card"><span>ĐƠN GIÁ / SẢN PHẨM ĐẠT</span><h2>${E(r.stage)}</h2><strong>${money(r.price)}</strong><p>${E(r.note||'—')}</p>${btn('Sửa giá hiện tại','editRate','',r.id)}</div>`).join('')||'<div class="empty">Chưa có đơn giá. Thêm công đoạn trước khi ghi sản lượng.</div>'}</div>`}
function reportsPage(){let s=summary(filterMonth),rows=db.workers.map(w=>({w,x:workerStats(w,filterMonth)})),stages=db.rates.map(r=>{let a=db.entries.filter(e=>e.rateId===r.id&&included(e)&&month(e.date)===filterMonth);return {r,good:a.reduce((n,e)=>n+e.good,0),bad:a.reduce((n,e)=>n+e.bad,0),pay:a.reduce((n,e)=>n+earning(e),0)}});return `${header('Báo cáo tiền công','Tổng hợp theo người và công đoạn trong tháng đã chọn.',btn('⬇ Xuất Excel','exportExcel','primary')+btn('🖨️ In báo cáo','print'))}<div class="report-toolbar"><label>Tháng báo cáo<input type="month" id="reportMonth" value="${E(filterMonth)}"></label><b>${money(s.pay)}</b><span>${num(s.good)} đạt · ${num(s.bad)} lỗi · ${s.pending} phiếu chờ duyệt</span></div><div class="report-columns">${panel('Theo công nhân',`<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Họ tên</th><th>Đạt</th><th>Lỗi</th><th>Tỷ lệ lỗi</th><th>Tiền công</th></tr></thead><tbody>${rows.map(({w,x})=>`<tr><td>${E(w.code)}</td><td><button class="link" data-act="openWorker" data-id="${E(w.id)}">${E(w.name)}</button></td><td>${num(x.good)}</td><td>${num(x.bad)}</td><td>${num(x.rate)}%</td><td><b>${money(x.pay)}</b></td></tr>`).join('')}</tbody></table></div>`)}${panel('Theo công đoạn',`<div class="table-wrap"><table><thead><tr><th>Công đoạn</th><th>Đạt</th><th>Lỗi</th><th>Tiền công</th></tr></thead><tbody>${stages.map(({r,good,bad,pay})=>`<tr><td>${E(r.stage)}</td><td>${num(good)}</td><td>${num(bad)}</td><td><b>${money(pay)}</b></td></tr>`).join('')}</tbody></table></div>`)}</div>${panel('Cần đối chiếu',`<p>${s.warnings} công nhân vượt ngưỡng tỷ lệ lỗi ${num(db.settings.loiMax)}% trong tháng. Đây là tín hiệu cần kiểm tra chất lượng/đào tạo, không phải khoản phạt hay khấu trừ lương.</p><p>Đơn giá chụp theo từng phiếu; tổng sản phẩm đạt × giá hiện tại của công đoạn có thể không bằng tổng tiền công lịch sử sau khi đổi giá.</p>`)}`}
function settingsPage(){return `${header('Ngưỡng nội bộ','Tùy chỉnh ngày đối chiếu và tỷ lệ lỗi để nhắc kiểm tra.')}${panel('Cài đặt cảnh báo',`<form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input type="date" name="asof" required value="${E(db.settings.asof)}"></label><label>Tỷ lệ lỗi cảnh báo (%)<input type="number" name="loiMax" min="0" max="100" step="0.01" required value="${db.settings.loiMax}"></label><div class="full">${btn('Lưu ngưỡng','saveSettings','primary')}</div></form><p class="note">Mẫu gốc đặt ngưỡng 5%. Đây là ngưỡng quản trị nội bộ, không tự khấu trừ tiền công.</p>`)}`}
function dataPage(){return `${header('Dữ liệu & sao lưu','Dữ liệu nhập tay lưu trên trình duyệt của máy đang mở.')}<div class="secondary-grid">${panel('Xuất bản sao',`<p>JSON và HTML kèm dữ liệu dùng để chuyển máy hoặc khôi phục toàn bộ thông tin.</p><div class="actions">${btn('⬇ JSON đầy đủ','exportJSON','primary')}${btn('⬇ HTML kèm dữ liệu','exportHTML')}${btn('⬇ Excel đối chiếu','exportExcel')}</div>`)}${panel('Nhập & mẫu',`<p>Nạp JSON hoặc mẫu sẽ thay toàn bộ dữ liệu hiện tại. Hãy xuất bản sao trước.</p><div class="actions">${btn('⬆ Nhập JSON','importJSON')}${btn('Nạp 5 giá, 6 người, 20 dòng mẫu','loadSample')}${btn('Xóa dữ liệu','clearData','danger')}</div>`)}</div>${panel('Phiên bản & phạm vi',`<p>Dữ liệu v${VERSION}: ${db.rates.length} công đoạn, ${db.workers.length} công nhân, ${db.entries.length} phiếu việc. Excel chỉ để xem và đối soát, không nhập ngược.</p><p>Tệp HTML gốc chép sang máy khác không chứa dữ liệu đã nhập trong localStorage. Dùng nút HTML kèm dữ liệu hoặc JSON để mang theo dữ liệu.</p>`)}`}
function guidePage(){return `${header('Cách sử dụng','Từ đơn giá đến phiếu tiền công theo công nhân.')}${panel('Quy trình 6 bước',`<ol><li>Thêm công đoạn và đơn giá hiện tại.</li><li>Thêm công nhân có mã riêng.</li><li>Ghi sản lượng đạt và lỗi theo ngày, người, công đoạn; app chụp đơn giá tại lúc ghi.</li><li>Kiểm tra phiếu chờ duyệt; sửa trước khi duyệt hoặc hủy có lý do.</li><li>Xem phiếu tiền công theo công nhân và tháng; in để đối chiếu.</li><li>Xuất JSON/HTML kèm dữ liệu sau mỗi kỳ quan trọng.</li></ol>`)}${panel('Công thức và giới hạn',`<p><b>Tiền công sản phẩm = số đạt × đơn giá công đoạn chụp trên phiếu.</b> Tỷ lệ lỗi công nhân = tổng lỗi / (tổng đạt + tổng lỗi) × 100, làm tròn 2 chữ số. Chỉ các phiếu đã duyệt và dòng mẫu gốc đi vào tổng.</p><p>Sản phẩm lỗi không được cộng vào tiền công sản phẩm trong mô hình nguồn. App không tính lương thời gian, phụ cấp, thuế, bảo hiểm hay khoản khấu trừ khác và không thay bảng lương chính thức.</p><p>Dữ liệu mẫu gốc không có lịch sử duyệt; các dòng mẫu mang trạng thái “Mẫu gốc”, không tự tạo người duyệt.</p>`)}`}
function render(){let views={home,entries:entriesPage,workers:workersPage,worker:workerPage,entry:entryPage,rates:ratesPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML=(views[page]||home)();all('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='worker'&&b.dataset.page==='workers'||page==='entry'&&b.dataset.page==='entries'))}
function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${E(value)}" ${extra}></label>`}
function area(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" maxlength="1200" rows="3">${E(value)}</textarea></label>`}
function selectField(label,name,items,selected){return `<label>${label}<select name="${name}" required>${items.map(([v,t])=>`<option value="${E(v)}" ${v===selected?'selected':''}>${E(t)}</option>`).join('')}</select></label>`}
function showForm(kind,key=''){let title='',body='';draft={kind,key};if(kind==='rate'){let r=rate(key)||{};title=key?'Sửa giá công đoạn':'Thêm công đoạn';body=field('Tên công đoạn *','stage',r.stage,'text','required maxlength="100"')+field('Đơn giá mỗi sản phẩm đạt (₫) *','price',r.price??0,'number','required min="0" step="1"')+area('Ghi chú','note',r.note)}
 else if(kind==='worker'){let w=worker(key)||{};title=key?'Sửa hồ sơ công nhân':'Thêm công nhân';body=field('Mã công nhân *','code',w.code,'text','required maxlength="40"')+field('Họ và tên *','name',w.name,'text','required maxlength="160"')+area('Ghi chú','note',w.note)}
 else if(kind==='entry'){let e=entry(key)||{},wid=e.workerId||(!key&&worker(selected)?selected:db.workers[0]?.id),rid=e.rateId||db.rates[0]?.id;if(!db.workers.length||!db.rates.length){alert('Cần có công nhân và đơn giá công đoạn trước khi ghi sản lượng.');return}title=key?'Sửa phiếu chờ duyệt':'Ghi sản lượng';body=field('Ngày ghi *','date',e.date||today(),'date','required')+selectField('Công nhân *','workerId',db.workers.map(w=>[w.id,w.code+' · '+w.name]),wid)+selectField('Công đoạn *','rateId',db.rates.map(r=>[r.id,r.stage+' · '+money(r.price)]),rid)+field('Sản phẩm đạt *','good',e.good??0,'number','required min="0" step="1"')+field('Sản phẩm lỗi *','bad',e.bad??0,'number','required min="0" step="1"')+area('Ghi chú/biên bản','note',e.note)}
 $('#modalTitle').textContent=title;$('#formFields').innerHTML=body;$('#formError').textContent='';$('#editor').showModal()}
const val=(f,n)=>String(new FormData(f).get(n)||'').trim(),number=(f,n)=>Number(val(f,n));
function submitForm(ev){ev.preventDefault();let f=ev.target,{kind,key}=draft,before=copy(db);try{if(kind==='rate'){let r=rate(key),stage=val(f,'stage'),price=number(f,'price');if(!stage||!Number.isSafeInteger(price)||price<0)throw Error('Kiểm tra tên và đơn giá.');if(db.rates.some(x=>x.id!==key&&x.stage.toLocaleLowerCase('vi')===stage.toLocaleLowerCase('vi')))throw Error('Công đoạn đã có.');if(r){Object.assign(r,{stage,price,note:val(f,'note')})}else{r={id:id(),stage,price,note:val(f,'note')};db.rates.push(r)}audit(key?'Sửa giá':'Thêm công đoạn',r.stage,r.id);page='rates'}
 else if(kind==='worker'){let w=worker(key),code=val(f,'code'),name=val(f,'name');if(!code||!name)throw Error('Cần mã và họ tên.');if(db.workers.some(x=>x.id!==key&&x.code.toUpperCase()===code.toUpperCase()))throw Error('Mã công nhân đã có.');if(w)Object.assign(w,{code,name,note:val(f,'note')});else{w={id:id(),code,name,note:val(f,'note')};db.workers.push(w)}audit(key?'Sửa công nhân':'Thêm công nhân',code,w.id);selected=w.id;page='worker'}
 else if(kind==='entry'){let e=entry(key),date=val(f,'date'),wid=val(f,'workerId'),rid=val(f,'rateId'),good=number(f,'good'),bad=number(f,'bad');if(!validDate(date)||!worker(wid)||!rate(rid)||!Number.isSafeInteger(good)||good<0||!Number.isSafeInteger(bad)||bad<0||good+bad===0)throw Error('Kiểm tra ngày, công nhân, công đoạn và số lượng.');if(db.entries.some(x=>x.id!==key&&x.state!=='Hủy'&&x.date===date&&x.workerId===wid&&x.rateId===rid))throw Error('Cùng ngày, công nhân và công đoạn đã có phiếu.');let obj={date,workerId:wid,rateId:rid,good,bad,price:rate(rid).price,note:val(f,'note')};if(e){Object.assign(e,obj)}else{e={id:id(),...obj,state:'Chờ duyệt',sourceIndex:0,approvedBy:''};db.entries.push(e)}audit(key?'Sửa phiếu':'Ghi phiếu',`${worker(wid).code} · ${rate(rid).stage} · ${num(good)} đạt`,e.id);selected=e.id;page='entry'}
 let err=validate(db);if(err)throw Error(err);$('#editor').close();draft=null;save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'luong-san-pham-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'luong-san-pham-kem-du-lieu.html')}
function sheets(){let months=[...new Set(db.entries.filter(included).map(e=>month(e.date)))].sort();return [{name:'DonGia',rows:[['Công đoạn','Giá hiện tại','Ghi chú'],...db.rates.map(r=>[r.stage,r.price,r.note])]},{name:'CongNhan',rows:[['Mã','Họ tên','Ghi chú'],...db.workers.map(w=>[w.code,w.name,w.note])]},{name:'PhieuViec',rows:[['Ngày','Mã CN','Công nhân','Công đoạn','Đạt','Lỗi','Đơn giá chụp','Tiền công','Trạng thái','Dòng nguồn','Người duyệt','Ghi chú'],...db.entries.map(e=>[e.date,worker(e.workerId).code,worker(e.workerId).name,rate(e.rateId).stage,e.good,e.bad,e.price,earning(e),e.state,e.sourceIndex,e.approvedBy,e.note])]},{name:'TheoThang',rows:[['Tháng','Mã CN','Họ tên','Phiếu việc','Đạt','Lỗi','Tỷ lệ lỗi %','Tiền công'],...months.flatMap(m=>db.workers.map(w=>{let x=workerStats(w,m);return [m,w.code,w.name,x.rows,x.good,x.bad,x.rate,x.pay]}))]},{name:'NhatKy',rows:[['Thời điểm','Thao tác','Chi tiết','Tham chiếu'],...db.audit.map(a=>[a.at,a.action,a.detail,a.ref])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Ngưỡng tỷ lệ lỗi %'],[db.settings.asof,db.settings.loiMax]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'luong-san-pham-doi-chieu.xlsx')}
function act(action,key=''){if(['home','entries','workers','rates','reports','settings','data','guide'].includes(action)){page=action;render();return}if(action==='openWorker'){selected=key;page='worker';render();return}if(action==='openEntry'){selected=key;page='entry';render();return}if(action==='newRate'||action==='editRate')return showForm('rate',action==='editRate'?key:'');if(action==='newWorker'||action==='editWorker')return showForm('worker',action==='editWorker'?key:'');if(action==='newEntry'||action==='editEntry')return showForm('entry',action==='editEntry'?key:'');if(action==='approveEntry'){let e=entry(key);if(!e||e.state!=='Chờ duyệt')return;let who=prompt('Người duyệt phiếu:');if(!who?.trim())return;e.state='Đã duyệt';e.approvedBy=who.trim();audit('Duyệt phiếu',who.trim(),key);save();return}if(action==='cancelEntry'){let e=entry(key);if(!e||!['Chờ duyệt','Đã duyệt'].includes(e.state))return;let reason=prompt('Lý do hủy phiếu (giữ lịch sử):');if(!reason?.trim())return;e.state='Hủy';audit('Hủy phiếu',reason.trim(),key);save();return}if(action==='print')return print();
 if(action==='saveSettings'){let f=$('#settingsForm'),asof=f.elements.asof.value,loiMax=Number(f.elements.loiMax.value);if(!validDate(asof)||!Number.isFinite(loiMax)||loiMax<0||loiMax>100)return alert('Ngày hoặc ngưỡng không hợp lệ.');db.settings={asof,loiMax};audit('Đổi ngưỡng',`Tỷ lệ lỗi ${num(loiMax)}%`);save();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if((db.entries.length||db.workers.length||db.rates.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện có. Hãy sao lưu trước. Tiếp tục?'))return;let x=sampleData(),err=validate(x);if(err)return alert('Mẫu không hợp lệ: '+err);db=x;filterMonth=month(today());page='home';save();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên trình duyệt này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='home';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});
$('#itemForm').addEventListener('submit',submitForm);$('#cancelModal').addEventListener('click',()=>$('#editor').close());
$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện có. Tiếp tục?'))return;db=x;page='home';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});
document.addEventListener('change',e=>{if(e.target.id==='homeMonth'||e.target.id==='reportMonth'){filterMonth=e.target.value||month(today());render()}if(e.target.id==='entryMonth'){filterMonth=e.target.value||'all';render()}if(e.target.id==='entryWorker'){filterWorker=e.target.value;render()}if(e.target.id==='entryState'){filterState=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='entrySearch'){let pos=e.target.selectionStart;search=e.target.value;render();let q=$('#entrySearch');q.focus();q.setSelectionRange(pos,pos)}});
render();
</script></body></html>
