function sample(){let d=blank();d.settings=structuredClone(SOURCE.sourceSettings);d.events=[];let q=0,s=SOURCE.sample;for(let i=0;i<s.weeks;i++){let week=i+1,rcpt=week===3?s.week3Receipt:s.weeklyReceipt,pay=week===5?s.week5Payment:s.weeklyPayment;d.events.push({id:'source-'+(++q),code:'DT'+String(q).padStart(3,'0'),date:dayAdd(d.settings.start,i*7+s.receiptDayOffset),flow:'Thu',group:'Thu khách hàng',description:'Thu công nợ khách tuần '+week,amount:rcpt,status:'Dự kiến',prob:week===3?s.week3Probability:100,source:'Kế hoạch đã trao đổi',owner:'Kế toán',note:''});d.events.push({id:'source-'+(++q),code:'DT'+String(q).padStart(3,'0'),date:dayAdd(d.settings.start,i*7+s.paymentDayOffset),flow:'Chi',group:week===5?'Mua tài sản':'Nhà cung cấp',description:'Chi theo lịch tuần '+week,amount:pay,status:'Dự kiến',prob:100,source:'Kế hoạch đã trao đổi',owner:'Kế toán',note:''})}d.events.push({id:'source-overdue',...structuredClone(s.overdue),note:''});return d}
function valid(d){if(!d||d.version!==1||!d.settings||!Array.isArray(d.events)||d.events.length>1000)return false;let s=d.settings;if(typeof s.company!=='string'||s.company.length>300||!dateOK(s.start)||!dateOK(s.asof)||!safe(s.opening)||!safe(s.minimum)||!SCENARIOS.includes(s.scenario)||!Number.isFinite(s.inFactor)||s.inFactor<0||s.inFactor>1||!Number.isFinite(s.outFactor)||s.outFactor<0||s.outFactor>3||!Number.isSafeInteger(s.delay)||s.delay<0||s.delay>90||!safe(s.tolerance))return false;let ids=new Set(),codes=new Set();for(let x of d.events){if(!x||typeof x.id!=='string'||!x.id||ids.has(x.id)||typeof x.code!=='string'||!x.code.trim()||x.code.length>60||codes.has(x.code.toLocaleLowerCase('vi'))||!dateOK(x.date)||!FLOWS.includes(x.flow)||!STATUSES.includes(x.status)||typeof x.group!=='string'||x.group.length>120||typeof x.description!=='string'||x.description.length>350||!safe(x.amount)||x.amount<1||!Number.isInteger(x.prob)||x.prob<0||x.prob>100||typeof x.source!=='string'||x.source.length>300||typeof x.owner!=='string'||x.owner.length>120||typeof x.note!=='string'||x.note.length>1000)return false;ids.add(x.id);codes.add(x.code.toLocaleLowerCase('vi'))}return true}
function project(x,s,scenario=s.scenario){let planned=x.status==='Dự kiến',conservative=scenario==='Thận trọng',effectiveDate=planned&&conservative&&x.flow==='Thu'&&x.date>=s.start?dayAdd(x.date,s.delay):x.date,effectiveAmount=x.status==='Hủy'?0:Math.round(x.amount*(x.status==='Thực tế'?1:x.flow==='Thu'?x.prob/100*(conservative?s.inFactor:1):conservative?s.outFactor:1)),week=Math.floor(dayDiff(effectiveDate,s.start)/7)+1;if(week<1||week>13||(planned&&x.date<s.start))week=0;let warnings=[];if(!x.group||!x.description||!x.source||!x.owner)warnings.push('Thiếu nội dung / nguồn / phụ trách');if(x.status==='Thực tế'&&x.date>s.asof)warnings.push('Thực tế sau ngày cập nhật');if(planned&&x.date<s.start)warnings.push('Dự kiến quá hạn trước tuần 1');if(x.status!=='Hủy'&&week===0)warnings.push('Ngoài cửa sổ 13 tuần');return{...x,effectiveDate,effectiveAmount,week,warnings,stage:warnings.length?'Cần rà soát':x.status==='Hủy'?'Đã hủy':x.status==='Thực tế'?'Thực tế':'Dự kiến'}}
function weeks(d,scenario=d.settings.scenario){let s=d.settings,r=d.events.map(x=>project(x,s,scenario)),out=[];for(let i=1;i<=13;i++){let matched=r.filter(x=>x.week===i),opening=i===1?s.opening:out[i-2].closing,inflow=sum(matched.filter(x=>x.flow==='Thu'),x=>x.effectiveAmount),outflow=sum(matched.filter(x=>x.flow==='Chi'),x=>x.effectiveAmount),closing=opening+inflow-outflow;out.push({week:i,start:dayAdd(s.start,(i-1)*7),end:dayAdd(s.start,i*7-1),opening,inflow,outflow,net:inflow-outflow,closing,gap:Math.max(s.minimum-closing,0),count:matched.length,status:closing<0?'Âm tiền':closing<s.minimum?'Dưới mức tối thiểu':'Đủ mức tối thiểu'})}return out}
function summary(d,scenario=d.settings.scenario){let w=weeks(d,scenario),r=d.events.map(x=>project(x,d.settings,scenario));return{weeks:w,lowest:Math.min(...w.map(x=>x.closing)),funding:Math.max(...w.map(x=>x.gap)),short:w.filter(x=>x.gap>0).length,issues:r.filter(x=>x.warnings.length).length,outside:r.filter(x=>x.status!=='Hủy'&&!x.week).length,end:w[12].closing}}
function encode(d){return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');return valid(d)?d:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim());let db=valid(embedded)?embedded:stored()||blank(),page='dashboard',query='',filter='all',weekPick=1,modal=null;
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Trình duyệt không lưu được. Hãy tải JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(a,b)=>'<div class="hero"><h1>'+esc(a)+'</h1><p>'+esc(b)+'</p></div>';
const metric=(a,b,c='')=>'<div class="metric"><small>'+esc(a)+'</small><strong>'+esc(b)+'</strong><div class="sub">'+esc(c)+'</div></div>';
const empty=t=>'<div class="empty">'+esc(t)+'</div>';
const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty('Chưa có dữ liệu phù hợp.');
const opt=(v,l,c)=>'<option value="'+esc(v)+'" '+(String(v)===String(c)?'selected':'')+'>'+esc(l)+'</option>';
const field=(k,label,type,value='',opts='')=>'<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value??'')+'">')+'</div>';
const v=k=>$('#f_'+k)?.value.trim()||'';
const badge=(text,tone='')=>'<span class="badge '+tone+'">'+esc(text)+'</span>';
const statusTone=x=>x.status==='Thực tế'?'ok':x.status==='Hủy'?'':'alert';
const weekTone=x=>x.closing<0?'loss':x.gap>0?'alert':'ok';
function chart(w){let min=Math.min(0,...w.map(x=>x.closing)),max=Math.max(db.settings.minimum,...w.map(x=>x.closing),1),height=118;return'<div class="cash-chart" role="img" aria-label="Tiền cuối từng tuần; màu đỏ khi âm hoặc dưới mức tối thiểu">'+w.map(x=>{let top=Math.max(3,Math.round((Math.max(0,x.closing)-Math.max(0,min))/(max-Math.max(0,min)||1)*height)),neg=x.closing<0;return'<button class="barcol '+(x.gap>0?'negative':'')+'" data-action="week" data-week="'+x.week+'" title="Tuần '+x.week+': '+esc(money(x.closing))+'"><span class="bar" style="height:'+top+'px'+(neg?';background:#bd3542':'')+'"></span><small>T'+x.week+'</small></button>'}).join('')+'</div><p class="muted">Chạm vào cột để xem chi tiết tuần. Đường cảnh báo so theo mức tiền tối thiểu trong bảng tuần.</p>'}
function dashboard(){let a=summary(db),w=a.weeks,issues=db.events.map(x=>project(x,db.settings)).filter(x=>x.warnings.length);return hero('💧 Dự báo dòng tiền 13 tuần','Nhìn sớm tuần thiếu tiền và khoản cần xác nhận trước khi ra quyết định.')+'<section class="card"><div class="toolbar"><span class="steps"><span>① Nhập tiền đầu kỳ</span><span>② Ghi lịch thu chi</span><span>③ Xem tuần thiếu</span></span><span class="grow"></span><button class="btn primary" data-new="event">+ Thêm khoản thu / chi</button></div><div class="grid">'+metric('Tiền cuối tuần 13',money(a.end))+metric('Thấp nhất',money(a.lowest))+metric('Nhu cầu bù lớn nhất',money(a.funding),'MAX phần thiếu của 13 tuần')+metric('Tuần dưới mức tối thiểu',a.short+'/13')+metric('Khoản cần rà soát',a.issues)+'</div><p class="notice">Cửa sổ: '+date(db.settings.start)+' – '+date(w[12].end)+' · '+esc(db.settings.scenario)+' · Ngày cập nhật '+date(db.settings.asof)+'. Tiền đầu tuần 1 chỉ cộng một lần; tuần sau lấy tiền cuối tuần trước.</p></section><div class="split"><section class="card"><h2>Tiền cuối mỗi tuần</h2>'+chart(w)+'</section><section class="card"><h2>⚠️ Việc cần xử lý</h2>'+(issues.length?issues.slice(0,8).map(x=>'<div class="check"><span><b>'+esc(x.code)+' · '+esc(x.description||x.group)+'</b><small>'+esc(x.warnings.join('; '))+'</small></span><button class="btn small" data-edit="event" data-id="'+esc(x.id)+'">Mở</button></div>').join(''):empty('Không có khoản cảnh báo.'))+'</section></div>'}
function eventRow(x){return'<tr><td><b>'+esc(x.code)+'</b></td><td>'+date(x.date)+'</td><td>'+badge(x.flow,x.flow==='Thu'?'ok':'alert')+'</td><td>'+esc(x.description||'—')+'<small class="row-note">'+esc(x.group)+'</small></td><td class="num">'+money(x.amount)+'</td><td>'+badge(x.status,statusTone(x))+'</td><td class="num">'+(x.flow==='Thu'?x.prob+'%':'—')+'</td><td>'+date(x.effectiveDate)+'</td><td class="num">'+money(x.effectiveAmount)+'</td><td>'+esc(x.week?('Tuần '+x.week):'Ngoài kỳ')+'</td><td>'+esc(x.warnings.join('; ')||'—')+'</td><td><button class="btn small" data-edit="event" data-id="'+esc(x.id)+'">Chi tiết / sửa</button></td></tr>'}
function eventPage(){let r=db.events.map(x=>project(x,db.settings)).filter(x=>[x.code,x.group,x.description,x.source,x.owner].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).filter(x=>filter==='issues'?x.warnings.length:filter==='outside'?!x.week&&x.status!=='Hủy':filter==='within'?x.week>0:filter==='actual'?x.status==='Thực tế':true).sort((a,b)=>a.date.localeCompare(b.date)||a.code.localeCompare(b.code));return hero('📒 Sổ thu chi dự báo','Một khoản một dòng; cập nhật Dự kiến thành Thực tế, tránh tạo giao dịch trùng.')+'<section class="card"><div class="toolbar"><input id="search" class="search" placeholder="Tìm mã, nội dung, nhóm, phụ trách..." value="'+esc(query)+'"><select id="filterPick">'+[['all','Tất cả'],['issues','Cần rà soát'],['within','Trong 13 tuần'],['outside','Ngoài kỳ'],['actual','Thực tế']].map(([k,l])=>opt(k,l,filter)).join('')+'</select><span class="grow"></span><button class="btn primary" data-new="event">+ Thêm khoản</button><button class="btn" data-action="excel">↓ Excel</button></div><p class="muted">'+r.length+' / '+db.events.length+' khoản. Số tiền theo kịch bản được làm tròn từng khoản.</p>'+table(['Mã','Ngày gốc','Thu/chi','Nội dung','Giá trị','Tình trạng','Xác suất thu','Ngày kịch bản','Số tiền dự báo','Tuần','Cảnh báo',''],r.map(eventRow))+'</section>'}

function forecastPage(){let a=summary(db),w=a.weeks;return hero('📅 Bảng dòng tiền 13 tuần','Tiền đầu kỳ → thu → chi → cuối kỳ; mỗi tuần nối với tuần trước.')+'<section class="card"><div class="toolbar"><button class="btn" data-action="print">🖨️ In bảng</button><button class="btn" data-action="excel">↓ Excel</button><span class="grow"></span><span>'+esc(db.settings.scenario)+' · '+date(db.settings.start)+'</span></div><div class="grid">'+metric('Tổng thu trong cửa sổ',money(sum(w,x=>x.inflow)))+metric('Tổng chi trong cửa sổ',money(sum(w,x=>x.outflow)))+metric('Cuối tuần 13',money(a.end))+metric('Cần bù lớn nhất',money(a.funding))+'</div><p class="notice">Nhu cầu bù lấy <b>mức thiếu lớn nhất</b> so với tiền tối thiểu; không cộng 13 mức thiếu vì sẽ đếm lặp.</p>'+table(['Tuần','Từ – đến','Đầu tuần','Thu','Chi','Thuần','Cuối tuần','Thiếu so tối thiểu','Trạng thái'],w.map(weekRow))+'</section>'}
function detailPage(){let w=weeks(db)[weekPick-1],r=db.events.map(x=>project(x,db.settings)).filter(x=>x.week===weekPick).sort((a,b)=>a.effectiveDate.localeCompare(b.effectiveDate));return hero('🔎 Chi tiết tuần '+weekPick,'Nguồn tạo số thu, chi và số dư cuối của tuần đã chọn.')+'<section class="card"><div class="toolbar"><label>Chọn tuần <select id="weekPick">'+Array.from({length:13},(_,i)=>opt(i+1,'Tuần '+(i+1),weekPick)).join('')+'</select></label><span class="grow"></span><button class="btn" data-action="print">🖨️ In chi tiết</button></div><p>'+date(w.start)+' – '+date(w.end)+'</p><div class="grid">'+metric('Đầu tuần',money(w.opening))+metric('Thu',money(w.inflow))+metric('Chi',money(w.outflow))+metric('Cuối tuần',money(w.closing))+metric('Thiếu so tối thiểu',money(w.gap))+'</div>'+table(['Ngày hiệu lực','Mã','Chiều','Nội dung','Nguồn / căn cứ','Tình trạng','Số tiền dự báo'],r.map(x=>'<tr><td>'+date(x.effectiveDate)+'</td><td><button class="link-button" data-edit="event" data-id="'+esc(x.id)+'">'+esc(x.code)+'</button></td><td>'+esc(x.flow)+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.source)+'</td><td>'+esc(x.status)+'</td><td class="num">'+money(x.effectiveAmount)+'</td></tr>'))+'</section>'}

function settingsPage(){let s=db.settings;return hero('⚙️ Thiết lập dự báo','Cửa sổ 13 tuần, mức tiền cần giữ và giả định kịch bản.')+'<section class="card"><div class="formgrid">'+field('company','Tên đơn vị','text',s.company)+field('start','Ngày đầu tuần 1','date',s.start)+field('asof','Ngày cập nhật','date',s.asof)+field('opening','Tiền sẵn có trước tuần 1 (đ)','number',s.opening)+field('minimum','Mức tiền tối thiểu (đ)','number',s.minimum)+field('scenario','Kịch bản đang xem','select','',SCENARIOS.map(x=>opt(x,x,s.scenario)).join(''))+field('inFactor','Hệ số thu thận trọng (0–1)','number',s.inFactor)+field('outFactor','Hệ số chi thận trọng (0–3)','number',s.outFactor)+field('delay','Lùi thu dự kiến (ngày)','number',s.delay)+field('tolerance','Ngưỡng kiểm tra nội bộ (đ)','number',s.tolerance)+'</div><p><button class="btn primary" data-action="settings">Lưu thiết lập</button></p><p class="notice">Tiền đầu tuần 1 là tiền thực sự dùng được trước ngày bắt đầu. Khi đổi ngày bắt đầu, cần xác định lại số tiền đầu kỳ và rà các khoản ngoài cửa sổ.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & chuyển máy','Sao lưu trước khi đổi máy hoặc sửa dữ liệu lớn.')+'<section class="card"><div class="grid">'+metric('Khoản thu chi',db.events.length)+metric('Tổng Thu dự kiến',money(sum(db.events.filter(x=>x.flow==='Thu'&&x.status!=='Hủy'),x=>x.amount)))+metric('Tổng Chi dự kiến',money(sum(db.events.filter(x=>x.flow==='Chi'&&x.status!=='Hủy'),x=>x.amount)))+'</div><p class="notice">File HTML gốc không mang dữ liệu anh nhập trong trình duyệt. Tải HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excel">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV</button></div><p class="muted">Excel có 5 sheet: ThuChi, CaiDat, DuBao13Tuan, SoSanh, CanRaSoat. Nhập Excel lấy hai sheet đầu.</p></section><section class="card"><h2>27 khoản mẫu gốc</h2><p>13 tuần × 2 khoản, cộng một khoản thu quá hạn trước tuần 1. Chỉ nạp khi chọn và xác nhận thay thế.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn','Dự báo tiền dùng được, không phải báo cáo lãi lỗ.')+'<section class="card"><ol><li>Nhập ngày tuần 1, tiền sẵn có trước ngày đó và mức tiền tối thiểu.</li><li>Thêm từng khoản thu/chi gồm VAT, ngày dự kiến, nguồn, phụ trách và trạng thái.</li><li>Thu Dự kiến dùng số tiền × xác suất thu; Chi Dự kiến giữ toàn bộ nghĩa vụ.</li><li>Chọn kịch bản Thận trọng để giảm thu, tăng chi và lùi lịch thu dự kiến. Thực tế không đổi theo kịch bản.</li><li>Xem tuần thiếu tiền; mở chi tiết để biết khoản nào tạo ra số dư. Rà khoản quá hạn và ngoài kỳ.</li><li>Định kỳ cập nhật Dự kiến thành Thực tế, sao lưu JSON hoặc HTML kèm dữ liệu.</li></ol><p class="notice">Nhu cầu bù là mức thiếu lớn nhất trong 13 tuần; app chưa tự thêm khoản vay. Không dùng lợi nhuận để thay thế số dư tiền. Dự báo phụ thuộc các giả định và dữ liệu anh nhập.</p></section>'}
function render(){let titles={dashboard:'Tổng quan',events:'Sổ thu chi',forecast:'Dự báo 13 tuần',detail:'Chi tiết tuần',scenarios:'So sánh kịch bản',issues:'Cần rà soát',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,events:eventPage,forecast:forecastPage,detail:detailPage,scenarios:scenarioPage,issues:issuesPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Dự báo dòng tiền')+'</b> · '+esc(titles[page])+' · '+date(db.settings.start)+'</div>'+views[page]()}
function openModal(key=''){let old=db.events.find(x=>x.id===key)||{},defaults={code:'',date:db.settings.start,flow:'Thu',group:'',description:'',amount:'',status:'Dự kiến',prob:100,source:'',owner:'',note:''},x={...defaults,...old};modal={key};$('#modalTitle').textContent=(key?'Sửa':'Thêm')+' khoản thu / chi';$('#modalError').textContent='';$('#modalFields').innerHTML=field('code','Mã khoản *','text',x.code)+field('date','Ngày dự kiến / thực hiện *','date',x.date)+field('flow','Chiều tiền *','select','',FLOWS.map(z=>opt(z,z,x.flow)).join(''))+field('group','Nhóm thu chi','text',x.group)+field('description','Nội dung','textarea',x.description)+field('amount','Số tiền gồm VAT (đ) *','number',x.amount)+field('status','Tình trạng','select','',STATUSES.map(z=>opt(z,z,x.status)).join(''))+field('prob','Xác suất thu (0–100%)','number',x.prob)+field('source','Nguồn / căn cứ','text',x.source)+field('owner','Phụ trách','text',x.owner)+field('note','Ghi chú','textarea',x.note);$('#deleteModal').hidden=!key;$('#editor').showModal()}
function closeModal(){$('#editor').close();modal=null}
function saveModal(){let old=db.events.find(x=>x.id===modal?.key),x={id:old?.id||uid(),code:v('code'),date:v('date'),flow:v('flow'),group:v('group'),description:v('description'),amount:num(v('amount')),status:v('status'),prob:num(v('prob')),source:v('source'),owner:v('owner'),note:v('note')},d=structuredClone(db);d.events=old?d.events.map(a=>a.id===old.id?x:a):[...d.events,x];if(!valid(d)){$('#modalError').textContent='Kiểm tra mã không trùng, ngày, số tiền nguyên dương, xác suất 0–100 và độ dài nội dung.';return}if(x.status==='Thực tế'&&x.date>d.settings.asof&&!confirm('Ngày thực tế sau ngày cập nhật dự báo. Vẫn lưu để rà soát?'))return;if(!x.description||!x.source||!x.owner){if(!confirm('Khoản còn thiếu nội dung, nguồn hoặc phụ trách. Lưu và đưa vào danh sách cần rà soát?'))return}db=d;closeModal();save()}
function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('du-bao-dong-tien-13-tuan-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){let s=db.settings,w=weeks(db),b=summary(db,'Cơ sở'),c=summary(db,'Thận trọng'),r=db.events.map(x=>project(x,s));return[{name:'ThuChi',rows:[['id','code','date','flow','group','description','amount','status','prob','source','owner','note'],...db.events.map(x=>[x.id,x.code,x.date,x.flow,x.group,x.description,x.amount,x.status,x.prob,x.source,x.owner,x.note])]},{name:'CaiDat',rows:[['key','value'],...Object.entries(s)]},{name:'DuBao13Tuan',rows:[['Tuần','Từ ngày','Đến ngày','Tiền đầu tuần','Thu','Chi','Thuần','Tiền cuối tuần','Thiếu so tối thiểu','Trạng thái'],...w.map(x=>[x.week,x.start,x.end,x.opening,x.inflow,x.outflow,x.net,x.closing,x.gap,x.status])]},{name:'SoSanh',rows:[['Tuần','Cuối cơ sở','Thiếu cơ sở','Cuối thận trọng','Thiếu thận trọng'],...b.weeks.map((x,i)=>[x.week,x.closing,x.gap,c.weeks[i].closing,c.weeks[i].gap])]},{name:'CanRaSoat',rows:[['Mã','Ngày','Chiều','Nội dung','Giá trị','Ngày kịch bản','Tiền kịch bản','Tuần','Cảnh báo'],...r.filter(x=>x.warnings.length).map(x=>[x.code,x.date,x.flow,x.description,x.amount,x.effectiveDate,x.effectiveAmount,x.week,x.warnings.join('; ')])]}]}
function parsedExcel(sheets){let rows=sheets.ThuChi,settings=sheets.CaiDat;if(!Array.isArray(rows)||!Array.isArray(settings)||rows[0]?.join('|')!=='id|code|date|flow|group|description|amount|status|prob|source|owner|note'||settings[0]?.join('|')!=='key|value')throw Error('Excel không đúng mẫu xuất của app.');let d=blank();for(let [k,val] of settings.slice(1)){if(!Object.hasOwn(d.settings,k))continue;d.settings[k]=['opening','minimum','inFactor','outFactor','delay','tolerance'].includes(k)?Number(val):String(val??'')}d.events=rows.slice(1).filter(r=>r.some(x=>String(x??'').trim())).map(r=>({id:String(r[0]??''),code:String(r[1]??''),date:String(r[2]??''),flow:String(r[3]??''),group:String(r[4]??''),description:String(r[5]??''),amount:Number(r[6]),status:String(r[7]??''),prob:Number(r[8]),source:String(r[9]??''),owner:String(r[10]??''),note:String(r[11]??'')}));if(!valid(d))throw Error('Excel có dữ liệu thiếu, trùng hoặc không hợp lệ.');return d}
function csv(){let rows=[['Mã','Ngày','Thu/Chi','Nhóm','Nội dung','Số tiền','Tình trạng','Xác suất thu','Nguồn','Phụ trách','Ngày kịch bản','Tiền kịch bản','Tuần','Cảnh báo'],...db.events.map(x=>{let p=project(x,db.settings);return[x.code,x.date,x.flow,x.group,x.description,x.amount,x.status,x.prob,x.source,x.owner,p.effectiveDate,p.effectiveAmount,p.week,p.warnings.join('; ')]})];download('du-bao-dong-tien-13-tuan.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='du-bao-dong-tien-13-tuan.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal();return}if(b.dataset.edit){openModal(b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')window.print();if(a==='week'){weekPick=Number(b.dataset.week);page='detail';render()}if(a==='backup')download('du-bao-dong-tien-13-tuan.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv();if(a==='sample'&&confirm('Nạp 27 khoản mẫu sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?')){db=sample();save()}if(a==='clear'&&confirm('Xóa toàn bộ dữ liệu dự báo trên trình duyệt này?')){db=blank();save()}if(a==='settings'){let d=structuredClone(db),s=d.settings;s.company=v('company');s.start=v('start');s.asof=v('asof');s.opening=num(v('opening'));s.minimum=num(v('minimum'));s.scenario=v('scenario');s.inFactor=ratio(v('inFactor'));s.outFactor=ratio(v('outFactor'));s.delay=num(v('delay'));s.tolerance=num(v('tolerance'));if(!valid(d)){alert('Cài đặt không hợp lệ. Kiểm tra ngày, số tiền, hệ số thu 0–1, hệ số chi 0–3 và ngày lùi 0–90.');return}if((s.start!==db.settings.start||s.opening!==db.settings.opening)&&db.events.length&&!confirm('Đổi cửa sổ hoặc tiền đầu kỳ sẽ tính lại toàn bộ 13 tuần. Anh đã xác định lại số tiền sẵn có trước ngày mới?'))return;db=d;save()}if(a==='deleteRecord'&&modal?.key){if(!confirm('Xóa vĩnh viễn khoản này? Dự báo sẽ tính lại.'))return;db.events=db.events.filter(x=>x.id!==modal.key);closeModal();save()}});
document.addEventListener('change',e=>{if(e.target.id==='filterPick'){filter=e.target.value;render()}if(e.target.id==='weekPick'){weekPick=Number(e.target.value);render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(pos,pos)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();




</script></body></html>
