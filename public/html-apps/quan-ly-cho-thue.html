function dueCount(c,at){if(at<c.start)return 0;let end=at<c.end?at:c.end;return Math.min(monthsDiff(c.start,end)+1,monthsDiff(c.start,c.end)+1)}
function blank(){return{version:1,updatedAt:Date.now(),settings:{asof:'',warnDays:45,company:''},assets:[],contracts:[],payments:[]}}
function validBackup(x){if(!x||x.version!==1||!x.settings||x.settings.asof&&!validDate(x.settings.asof)||!Number.isSafeInteger(x.settings.warnDays)||x.settings.warnDays<0||x.settings.warnDays>365||typeof x.settings.company!=='string'||x.settings.company.length>160||!Array.isArray(x.assets)||!Array.isArray(x.contracts)||!Array.isArray(x.payments)||x.assets.length>10000||x.contracts.length>50000||x.payments.length>100000)return false;let ids=new Set(),codes=new Set();for(let a of x.assets){if(!a||typeof a.id!=='string'||!a.id||ids.has(a.id)||typeof a.code!=='string'||!a.code||codes.has(a.code.toLowerCase())||typeof a.name!=='string'||!a.name||!TYPES.includes(a.type)||typeof a.location!=='string'||typeof a.note!=='string')return false;ids.add(a.id);codes.add(a.code.toLowerCase())}let cids=new Set();codes.clear();for(let c of x.contracts){if(!c||typeof c.id!=='string'||!c.id||cids.has(c.id)||typeof c.code!=='string'||!c.code||codes.has(c.code.toLowerCase())||!ids.has(c.assetId)||typeof c.tenant!=='string'||!c.tenant||typeof c.phone!=='string'||typeof c.note!=='string'||!validDate(c.start)||!validDate(c.end)||c.end<c.start||!validMoney(c.rate)||!validMoney(c.depositExpected)||!Number.isSafeInteger(c.rate*dueCount(c,c.end)))return false;cids.add(c.id);codes.add(c.code.toLowerCase())}let pids=new Set();for(let p of x.payments){if(!p||typeof p.id!=='string'||!p.id||pids.has(p.id)||!cids.has(p.contractId)||!validDate(p.date)||!KINDS.includes(p.kind)||!validMoney(p.amount)||p.amount===0||typeof p.method!=='string'||typeof p.reference!=='string'||typeof p.note!=='string')return false;pids.add(p.id)}let byAsset=new Map();for(let c of x.contracts){let list=byAsset.get(c.assetId)||[];list.push(c);byAsset.set(c.assetId,list)}for(let list of byAsset.values()){list.sort((a,b)=>a.start.localeCompare(b.start));for(let i=1;i<list.length;i++)if(list[i].start<=list[i-1].end)return false}let deposits=new Map();for(let p of x.payments){let delta=p.kind==='depositIn'||p.kind==='openingDeposit'?p.amount:p.kind==='depositOut'?-p.amount:0;deposits.set(p.contractId,(deposits.get(p.contractId)||0)+delta)}if([...deposits.values()].some(n=>n<0))return false;return true}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return validBackup(x)?x:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim()),saved=stored();
let db=validBackup(embedded)&&(!saved||(embedded.updatedAt||0)>=(saved.updatedAt||0))?embedded:saved||blank(),page='dashboard',query='',filter='all',modal=null;
const asof=()=>db.settings.asof||today(),asset=id=>db.assets.find(a=>a.id===id),contract=id=>db.contracts.find(c=>c.id===id),payment=id=>db.payments.find(p=>p.id===id);
const assetName=id=>asset(id)?.name||'—',contractName=id=>contract(id)?.code||'—';
function contractTotals(c,at=asof()){let ps=db.payments.filter(p=>p.contractId===c.id),rentPaid=ps.filter(p=>p.kind==='rent'||p.kind==='openingRent').reduce((n,p)=>n+p.amount,0),depositIn=ps.filter(p=>p.kind==='depositIn'||p.kind==='openingDeposit').reduce((n,p)=>n+p.amount,0),depositOut=ps.filter(p=>p.kind==='depositOut').reduce((n,p)=>n+p.amount,0),periods=dueCount(c,at),due=periods*c.rate,balance=due-rentPaid,depositHeld=depositIn-depositOut,daysLeft=days(c.end,at),active=c.start<=at&&at<=c.end,alerts=[];if(balance>0)alerts.push('Còn nợ tiền thuê');if(balance<0)alerts.push('Thu trước / thu vượt');if(daysLeft<0)alerts.push('Hợp đồng đã hết hạn');else if(daysLeft<=db.settings.warnDays)alerts.push('Sắp hết hạn hợp đồng');if(depositHeld<0)alerts.push('Cọc trả vượt tiền nhận');else if(depositHeld<c.depositExpected)alerts.push('Cọc giữ thấp hơn thỏa thuận');return{periods,due,rentPaid,balance,depositIn,depositOut,depositHeld,daysLeft,active,alerts}}
function totals(){let a={contracts:db.contracts.length,assets:db.assets.length,active:0,monthly:0,due:0,rentPaid:0,balance:0,depositHeld:0,expiring:0};for(let c of db.contracts){let t=contractTotals(c);if(t.active){a.active++;a.monthly+=c.rate}a.due+=t.due;a.rentPaid+=t.rentPaid;a.balance+=t.balance;a.depositHeld+=t.depositHeld;if(t.daysLeft>=0&&t.daysLeft<=db.settings.warnDays)a.expiring++}return a}
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(h,s)=>'<div class="hero"><h1>'+esc(h)+'</h1><p>'+esc(s)+'</p></div>';
const metric=(name,value,sub='')=>'<div class="metric"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>';
const badge=(s,kind='')=>'<span class="badge '+kind+'">'+esc(s)+'</span>';
const empty=s=>'<div class="empty">'+esc(s)+'</div>';
const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty('Chưa có dữ liệu phù hợp.');
const option=(v,label,selected)=>'<option value="'+esc(v)+'" '+(String(v)===String(selected)?'selected':'')+'>'+esc(label)+'</option>';
const options=(list,selected)=>list.map(x=>option(x,x,selected)).join('');
function field(k,label,type,value='',opts=''){return '<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" '+(type==='number'?'min="0" step="1"':'')+' value="'+esc(value??'')+'">')+'</div>'}
const v=k=>$('#f_'+k)?.value.trim()||'';
function nextCode(prefix,items){let n=Math.max(0,...items.map(x=>x.code?.startsWith(prefix)&&/^\d+$/.test(x.code.slice(prefix.length))?Number(x.code.slice(prefix.length)):0));return prefix+String(n+1).padStart(3,'0')}
function nextDue(c,at=asof()){if(at<c.start)return c.start;if(at>=c.end)return'';let n=dueCount(c,at);for(let i=1;i<=70&&addDays(at,i)<=c.end;i++)if(dueCount(c,addDays(at,i))>n)return addDays(at,i);return''}
function contractRow(c){let t=contractTotals(c);return '<tr><td><b>'+esc(c.code)+'</b><br><small>'+esc(assetName(c.assetId))+'</small></td><td>'+esc(c.tenant)+'<br><small>'+esc(c.phone)+'</small></td><td>'+date(c.start)+' → '+date(c.end)+'</td><td class="num">'+money(c.rate)+'</td><td>'+t.periods+'</td><td class="num">'+money(t.due)+'</td><td class="num">'+money(t.rentPaid)+'</td><td class="num"><b>'+money(t.balance)+'</b></td><td class="num">'+money(t.depositHeld)+'</td><td>'+(t.alerts.length?t.alerts.map(a=>badge(a,a.includes('nợ')||a.includes('hết hạn')?'late':'due')).join('<br>'):badge('Bình thường','ok'))+'</td><td><button class="btn small" data-edit="contract" data-id="'+esc(c.id)+'">Sửa</button></td></tr>'}
function dashboard(){let t=totals(),needs=db.contracts.map(c=>({c,t:contractTotals(c)})).filter(x=>x.t.alerts.length).sort((a,b)=>b.t.balance-a.t.balance);return hero('🏠 Quản lý cho thuê','Theo dõi tài sản, hợp đồng, tiền thuê phải thu và khoản cọc đang giữ.')+'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn primary" data-new="contract">+ Hợp đồng thuê</button><button class="btn" data-new="payment">+ Ghi khoản thu</button></div><div class="grid">'+metric('Hợp đồng còn hiệu lực',t.active+' / '+t.contracts)+metric('Giá thuê tháng đang hoạt động',money(t.monthly))+metric('Phải thu lũy kế',money(t.due))+metric('Đã thu tiền thuê',money(t.rentPaid))+metric('Còn nợ / thu trước',money(t.balance))+metric('Cọc đang giữ',money(t.depositHeld))+metric('Sắp hết hạn',t.expiring)+'</div><p class="notice">Tiền cọc theo dõi riêng, không tính là tiền thuê đã thu. Còn nợ âm nghĩa là khách đã trả trước hoặc trả vượt tiền thuê đến kỳ.</p></section><div class="split"><section class="card"><h2>⚠️ Cần xử lý</h2>'+(needs.length?needs.slice(0,10).map(x=>'<div class="check"><span><b>'+esc(x.c.code)+' · '+esc(x.c.tenant)+'</b><small>'+esc(x.t.alerts.join(' · '))+'</small></span><strong>'+money(x.t.balance)+'</strong></div>').join(''):empty('Chưa có hợp đồng cần xử lý.'))+'</section><section class="card"><h2>📅 Kỳ thu sắp tới</h2>'+(db.contracts.filter(c=>nextDue(c)).sort((a,b)=>nextDue(a).localeCompare(nextDue(b))).slice(0,8).map(c=>'<div class="check"><span><b>'+esc(c.code)+' · '+esc(c.tenant)+'</b><small>'+esc(assetName(c.assetId))+'</small></span><strong>'+date(nextDue(c))+'</strong></div>').join('')||empty('Không có kỳ thu sắp tới.'))+'</section></div><section class="card"><h2>Đối chiếu hợp đồng</h2>'+table(['Mã / tài sản','Khách thuê','Thời hạn','Giá tháng','Kỳ đến','Phải thu','Đã thu','Còn nợ','Cọc giữ','Cảnh báo',''],db.contracts.map(contractRow))+'</section>'}
function duePage(){let rows=db.contracts.map(c=>({c,t:contractTotals(c),next:nextDue(c)})).sort((a,b)=>(b.t.balance>0)-(a.t.balance>0)||a.t.daysLeft-b.t.daysLeft);return hero('🔔 Kỳ thu & cảnh báo','Phải thu lũy kế theo ngày báo cáo; nhắc công nợ và hợp đồng sắp hết hạn.')+'<section class="card"><p class="notice">Ngày báo cáo <b>'+date(asof())+'</b>. Mỗi hợp đồng bắt đầu tính một kỳ ở ngày bắt đầu; số kỳ dừng ở hạn kết thúc. Tiền thu được đối chiếu lũy kế, chưa phân bổ tự động cho từng kỳ.</p>'+table(['Hợp đồng / khách','Kỳ đã đến','Ngày tăng kỳ kế','Phải thu','Đã thu','Còn nợ','Còn hiệu lực','Cảnh báo',''],rows.map(({c,t,next})=>'<tr><td><b>'+esc(c.code)+'</b><br>'+esc(c.tenant)+'</td><td>'+t.periods+'</td><td>'+date(next)+'</td><td class="num">'+money(t.due)+'</td><td class="num">'+money(t.rentPaid)+'</td><td class="num">'+money(t.balance)+'</td><td>'+t.daysLeft+' ngày</td><td>'+esc(t.alerts.join(' · ')||'—')+'</td><td><button class="btn small" data-edit="contract" data-id="'+esc(c.id)+'">Mở</button></td></tr>'))+'</section>'}
function contractsPage(){let cs=db.contracts.filter(c=>[c.code,c.tenant,c.phone,assetName(c.assetId)].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>b.start.localeCompare(a.start));return hero('📄 Hợp đồng thuê','Giữ nguyên giá tháng, thời hạn và tiền cọc của từng hợp đồng để đối chiếu lịch sử.')+'<section class="card"><div class="toolbar filters"><input id="search" class="search" placeholder="Tìm mã, khách, tài sản..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="contract">+ Hợp đồng</button><button class="btn" data-action="excelExport">↓ Excel</button></div><p class="muted">'+cs.length+' / '+db.contracts.length+' hợp đồng.</p>'+table(['Mã / tài sản','Khách thuê','Thời hạn','Giá tháng','Kỳ đến','Phải thu','Đã thu','Còn nợ','Cọc giữ','Cảnh báo',''],cs.map(contractRow))+'</section>'}
function assetsPage(){let rows=db.assets.filter(a=>[a.code,a.name,a.type,a.location].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));return hero('🏠 Tài sản cho thuê','Quản lý mặt bằng, xe, thiết bị và kiểm tra khoảng thời gian đã có hợp đồng.')+'<section class="card"><div class="toolbar filters"><input id="search" class="search" placeholder="Tìm mã, tài sản, địa điểm..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="asset">+ Tài sản</button></div>'+table(['Mã','Tài sản','Loại','Địa điểm','Hợp đồng','Trạng thái hôm nay',''],rows.map(a=>{let cs=db.contracts.filter(c=>c.assetId===a.id),current=cs.find(c=>c.start<=asof()&&asof()<=c.end);return '<tr><td><b>'+esc(a.code)+'</b></td><td>'+esc(a.name)+'</td><td>'+esc(a.type)+'</td><td>'+esc(a.location||'—')+'</td><td>'+cs.length+'</td><td>'+(current?badge('Đang cho thuê','due'):badge('Chưa có hợp đồng hiện hành','ok'))+'</td><td><button class="btn small" data-edit="asset" data-id="'+esc(a.id)+'">Sửa</button></td></tr>'}))+'</section>'}
function paymentsPage(){let ps=db.payments.filter(p=>[contractName(p.contractId),contract(p.contractId)?.tenant,p.method,p.reference].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>b.date.localeCompare(a.date));return hero('💰 Khoản thu & tiền cọc','Ghi từng khoản thu tiền thuê, nhận cọc và hoàn cọc; giữ khoản “đã thu trước” của mẫu tách biệt.')+'<section class="card"><div class="toolbar filters"><input id="search" class="search" placeholder="Tìm hợp đồng, khách, tham chiếu..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="payment">+ Khoản thu / hoàn</button><button class="btn" data-action="excelExport">↓ Excel</button></div>'+table(['Ngày','Hợp đồng','Loại khoản','Số tiền','Hình thức','Tham chiếu','Ghi chú',''],ps.map(p=>'<tr><td>'+date(p.date)+'</td><td><b>'+esc(contractName(p.contractId))+'</b><br>'+esc(contract(p.contractId)?.tenant||'')+'</td><td>'+esc(KIND_LABEL[p.kind])+'</td><td class="num"><b>'+money(p.amount)+'</b></td><td>'+esc(p.method)+'</td><td>'+esc(p.reference||'—')+'</td><td>'+esc(p.note)+'</td><td><button class="btn small" data-edit="payment" data-id="'+esc(p.id)+'">Sửa</button></td></tr>'))+'</section>'}
function reportsPage(){
  let t=totals();
  let months=[...new Set(db.payments.filter(p=>['rent','depositIn','depositOut'].includes(p.kind)).map(p=>p.date.slice(0,7)))].sort().reverse();
  let contractRows=db.contracts.map(c=>{let x=contractTotals(c);return '<tr><td>'+esc(c.code)+'</td><td>'+esc(c.tenant)+'</td><td class="num">'+money(x.due)+'</td><td class="num">'+money(x.rentPaid)+'</td><td class="num">'+money(x.balance)+'</td><td class="num">'+money(x.depositHeld)+'</td></tr>'});
  let monthRows=months.map(m=>{let ps=db.payments.filter(p=>p.date.startsWith(m));let r=ps.filter(p=>p.kind==='rent').reduce((n,p)=>n+p.amount,0);let di=ps.filter(p=>p.kind==='depositIn').reduce((n,p)=>n+p.amount,0);let out=ps.filter(p=>p.kind==='depositOut').reduce((n,p)=>n+p.amount,0);return '<tr><td>'+esc(m)+'</td><td class="num">'+money(r)+'</td><td class="num">'+money(di)+'</td><td class="num">'+money(out)+'</td><td class="num">'+money(r+di-out)+'</td></tr>'});
  return hero('📈 Báo cáo cho thuê','Đối chiếu hợp đồng lũy kế và dòng tiền thực ghi sau khi bắt đầu dùng app.')
    +'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn" data-action="print">🖨️ In báo cáo</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="csv">↓ CSV</button></div><div class="grid">'
    +metric('Phải thu lũy kế',money(t.due))+metric('Đã thu lũy kế',money(t.rentPaid))+metric('Còn nợ / thu trước',money(t.balance))+metric('Cọc đang giữ',money(t.depositHeld))
    +'</div><p class="notice">Khoản “đã thu trước khi dùng app” và “cọc từ dữ liệu gốc” được tính trong số dư lũy kế, nhưng không đưa vào dòng tiền theo tháng vì không biết ngày thu thật.</p>'
    +table(['Hợp đồng','Khách thuê','Phải thu','Đã thu','Còn nợ','Cọc giữ'],contractRows)
    +'</section><section class="card"><h2>Tiền thực ghi theo tháng</h2>'
    +table(['Tháng','Thu thuê','Nhận cọc','Trả cọc','Tiền vào ròng'],monthRows)+'</section>'
}
function settingsPage(){return hero('⚙️ Cài đặt','Ngày báo cáo và số ngày nhắc trước khi hợp đồng hết hạn.')+'<section class="card"><div class="formgrid">'+field('company','Tên đơn vị','text',db.settings.company)+field('asof','Ngày báo cáo (trống = hôm nay)','date',db.settings.asof)+field('warnDays','Cảnh báo trước khi hết hạn (ngày)','number',db.settings.warnDays)+'</div><p><button class="btn primary" data-action="settings">Lưu cài đặt</button></p><p class="notice">Đổi ngày báo cáo sẽ tính lại kỳ đến hạn, công nợ và cảnh báo. Giá thuê từng hợp đồng không tự thay đổi.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Sao lưu trước khi nạp mẫu, nhập Excel hoặc chuyển sang máy khác.')+'<section class="card"><div class="grid">'+metric('Tài sản',db.assets.length)+metric('Hợp đồng',db.contracts.length)+metric('Khoản thu / cọc',db.payments.length)+'</div><p class="notice warn">Sao chép file HTML gốc sang PC khác không mang theo dữ liệu lưu trong trình duyệt. Hãy tải HTML kèm dữ liệu hoặc JSON.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV hợp đồng</button></div><p class="muted">JSON và HTML kèm dữ liệu giữ toàn bộ liên kết tài sản, hợp đồng, khoản thu và cài đặt. Excel ba sheet có thể nhập lại vào app.</p></section><section class="card"><h2>Dữ liệu mẫu từ file gốc</h2><p>5 hợp đồng được tạo thành 5 tài sản, 5 số dư đã thu và 5 khoản cọc đang giữ. Các ngày hợp đồng tương đối với ngày nạp mẫu.</p><button class="btn" data-action="sample">Nạp 5 hợp đồng mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa toàn bộ dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn sử dụng','Từ tạo tài sản đến theo dõi hợp đồng, thu tiền và trả cọc.')+'<section class="card"><h2>Quy trình</h2><ol><li>Thêm tài sản: mặt bằng, xe, thiết bị hoặc loại khác.</li><li>Tạo hợp đồng với khách thuê, giá tháng, thời hạn và số cọc thỏa thuận. App chặn hợp đồng trùng thời gian trên cùng tài sản.</li><li>Ghi từng khoản: thu tiền thuê, nhận cọc hoặc trả cọc. Tiền cọc không được cộng vào tiền thuê.</li><li>Xem kỳ thu và cảnh báo, đối chiếu số đã thu với chứng từ thực tế.</li><li>Sao lưu JSON định kỳ; dùng HTML kèm dữ liệu khi chuyển máy.</li></ol></section><section class="card"><h2>Cách tính và giới hạn</h2><p>Số kỳ đến hạn = số tháng tròn từ ngày bắt đầu đến ngày báo cáo + 1, tối đa bằng số tháng tròn của thời hạn hợp đồng + 1; trước ngày bắt đầu là 0. Phải thu = số kỳ × giá tháng. Còn nợ = phải thu − đã thu tiền thuê. Tiền cọc đang giữ = cọc đã nhận − cọc đã trả.</p><p class="notice warn">Với hợp đồng bắt đầu ngày 29–31, phép đếm tháng của file gốc có thể tăng nhiều kỳ cùng một ngày sau tháng ngắn. Hãy kiểm tra điều khoản đến hạn trên hợp đồng thực tế. App không tính thuế, hóa đơn, phí phạt, lãi chậm trả hoặc chỉ số điện nước.</p></section>'}
function render(){let names={dashboard:'Tổng quan',due:'Kỳ thu & cảnh báo',contracts:'Hợp đồng thuê',assets:'Tài sản',payments:'Khoản thu & cọc',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Sổ cho thuê')+'</b> · '+esc(names[page])+' · Ngày báo cáo: '+date(asof())+'</div>'+({dashboard,due:duePage,contracts:contractsPage,assets:assetsPage,payments:paymentsPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage})[page]()}
function openModal(type,id=''){let old=type==='asset'?asset(id):type==='contract'?contract(id):payment(id);old=old||{};modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+({asset:'tài sản',contract:'hợp đồng',payment:'khoản thu / cọc'}[type]);let html='';if(type==='asset')html=field('code','Mã tài sản *','text',old.code||nextCode('TS',db.assets))+field('name','Tên tài sản *','text',old.name||'')+field('type','Loại tài sản','select','',options(TYPES,old.type||TYPES[0]))+field('location','Địa điểm / mô tả','text',old.location||'')+field('note','Ghi chú','textarea',old.note||'');if(type==='contract'){let opts='<option value="">Chọn tài sản</option>'+db.assets.map(a=>option(a.id,a.code+' · '+a.name,old.assetId)).join('');html=field('code','Mã hợp đồng *','text',old.code||nextCode('HD',db.contracts))+field('assetId','Tài sản *','select','',opts)+field('tenant','Khách thuê *','text',old.tenant||'')+field('phone','Điện thoại','tel',old.phone||'')+field('rate','Giá thuê / tháng (đ)','number',old.rate??0)+field('depositExpected','Cọc theo thỏa thuận (đ)','number',old.depositExpected??0)+field('start','Ngày bắt đầu','date',old.start||today())+field('end','Ngày kết thúc','date',old.end||'')+field('note','Ghi chú điều khoản / chứng từ','textarea',old.note||'');html+='<p class="wide notice">Giá thuê và cọc được lưu trong hợp đồng. Khoản đã thu/cọc đã nhận ghi riêng ở màn hình Khoản thu & cọc.</p>'}if(type==='payment'){let opts='<option value="">Chọn hợp đồng</option>'+db.contracts.map(c=>option(c.id,c.code+' · '+c.tenant,old.contractId)).join('');html=field('contractId','Hợp đồng *','select','',opts)+field('date','Ngày ghi nhận','date',old.date||today())+field('kind','Loại khoản','select','',KINDS.filter(k=>id||k==='rent'||k==='depositIn'||k==='depositOut').map(k=>option(k,KIND_LABEL[k],old.kind||'rent')).join(''))+field('amount','Số tiền (đ)','number',old.amount??0)+field('method','Hình thức','select','',options(['Chuyển khoản','Tiền mặt','Khác','Số dư đầu kỳ'],old.method||'Chuyển khoản'))+field('reference','Mã chứng từ / tham chiếu','text',old.reference||'')+field('note','Ghi chú','textarea',old.note||'')}if(id)html+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bản ghi này</button></div>';$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function overlap(x,id){return db.contracts.some(c=>c.id!==id&&c.assetId===x.assetId&&x.start<=c.end&&c.start<=x.end)}
function saveModal(){if(!modal)return;let{type,id}=modal,x={},error='';if(type==='asset'){x={code:v('code'),name:v('name'),type:v('type'),location:v('location'),note:v('note')};if(!x.code||!x.name||!TYPES.includes(x.type)||x.code.length>60||x.name.length>160)error='Cần mã, tên và loại tài sản hợp lệ.';else if(db.assets.some(a=>a.id!==id&&a.code.toLowerCase()===x.code.toLowerCase()))error='Mã tài sản đã có.'}if(type==='contract'){x={code:v('code'),assetId:v('assetId'),tenant:v('tenant'),phone:v('phone'),rate:amount(v('rate')),depositExpected:amount(v('depositExpected')),start:v('start'),end:v('end'),note:v('note')};if(!x.code||!asset(x.assetId)||!x.tenant||!validDate(x.start)||!validDate(x.end)||x.end<x.start)error='Cần mã, tài sản, khách thuê và thời hạn hợp lệ.';else if(db.contracts.some(c=>c.id!==id&&c.code.toLowerCase()===x.code.toLowerCase()))error='Mã hợp đồng đã có.';else if(!validMoney(x.rate)||!validMoney(x.depositExpected)||x.rate===0||!Number.isSafeInteger(x.rate*dueCount(x,x.end)))error='Giá thuê hoặc tiền cọc không hợp lệ.';else if(overlap(x,id))error='Tài sản đã có hợp đồng trùng khoảng thời gian này.'}if(type==='payment'){x={contractId:v('contractId'),date:v('date'),kind:v('kind'),amount:amount(v('amount')),method:v('method'),reference:v('reference'),note:v('note')};if(!contract(x.contractId)||!validDate(x.date)||!KINDS.includes(x.kind))error='Cần hợp đồng, ngày và loại khoản hợp lệ.';else if(!validMoney(x.amount)||x.amount===0)error='Số tiền phải là số nguyên dương.';else if(x.kind==='depositOut'){let ps=db.payments.filter(p=>p.contractId===x.contractId&&p.id!==id),held=ps.reduce((n,p)=>n+(p.kind==='depositIn'||p.kind==='openingDeposit'?p.amount:p.kind==='depositOut'?-p.amount:0),0);if(x.amount>held)error='Tiền hoàn cọc vượt số cọc đang giữ.'}}if(error){$('#modalError').textContent=error;return}let candidate={...db,assets:db.assets.slice(),contracts:db.contracts.slice(),payments:db.payments.slice()};let list=type==='asset'?candidate.assets:type==='contract'?candidate.contracts:candidate.payments;if(id){let i=list.findIndex(z=>z.id===id);list[i]={...list[i],...x}}else list.push({id:uid(),...x});if(!validBackup(candidate)){$('#modalError').textContent='Thay đổi tạo dữ liệu không hợp lệ (trùng kỳ thuê, cọc âm hoặc liên kết thiếu).';return}db=candidate;closeModal();save()}
function sampleData(anchor=today()){let d=blank(),at=n=>addDays(anchor,Number(n.slice(1)));for(let [i,[code,name,tenant,rate,start,end,deposit,rentPaid]] of SOURCE.contracts.entries()){let a={id:'sample-asset-'+i,code:'TS'+String(i+1).padStart(3,'0'),name,type:/xe/i.test(name)?'Xe':/máy/i.test(name)?'Thiết bị':'Mặt bằng',location:'',note:'Tạo từ hợp đồng mẫu gốc'};d.assets.push(a);let c={id:'sample-contract-'+i,code,assetId:a.id,tenant,phone:'',rate,start:at(start),end:at(end),depositExpected:deposit,note:'Dữ liệu mẫu từ file gốc'};d.contracts.push(c);if(rentPaid)d.payments.push({id:'sample-rent-'+i,contractId:c.id,date:anchor,kind:'openingRent',amount:rentPaid,method:'Số dư đầu kỳ',reference:'MẪU-'+code,note:'Đã thu theo số dư file gốc; không biết ngày thu thật'});if(deposit)d.payments.push({id:'sample-deposit-'+i,contractId:c.id,date:anchor,kind:'openingDeposit',amount:deposit,method:'Số dư đầu kỳ',reference:'MẪU-'+code,note:'Cọc theo file gốc; không biết ngày nhận thật'})}return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('quan-ly-cho-thue-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Mã hợp đồng','Tài sản','Khách thuê','Giá tháng','Bắt đầu','Kết thúc','Kỳ đến','Phải thu','Đã thu','Còn nợ','Cọc thỏa thuận','Cọc giữ']];for(let c of db.contracts){let t=contractTotals(c);rows.push([c.code,assetName(c.assetId),c.tenant,c.rate,c.start,c.end,t.periods,t.due,t.rentPaid,t.balance,c.depositExpected,t.depositHeld])}let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('quan-ly-cho-thue-hop-dong.csv',body,'text/csv;charset=utf-8')}
function excelSheets(){return[
  {name:'Tai san',rows:[['Mã tài sản','Tên tài sản','Loại','Địa điểm','Ghi chú'],...db.assets.map(a=>[a.code,a.name,a.type,a.location,a.note])]},
  {name:'Hop dong',rows:[['Mã hợp đồng','Mã tài sản','Khách thuê','Điện thoại','Giá thuê tháng','Ngày bắt đầu','Ngày kết thúc','Cọc thỏa thuận','Ghi chú'],...db.contracts.map(c=>[c.code,asset(c.assetId)?.code||'',c.tenant,c.phone,c.rate,c.start,c.end,c.depositExpected,c.note])]},
  {name:'Khoan thu',rows:[['Mã hợp đồng','Ngày','Loại khoản','Số tiền','Hình thức','Tham chiếu','Ghi chú'],...db.payments.map(p=>[contract(p.contractId)?.code||'',p.date,p.kind,p.amount,p.method,p.reference,p.note])]}
]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='quan-ly-cho-thue.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){let ar=sheets['Tai san'],cr=sheets['Hop dong'],pr=sheets['Khoan thu'];if(!ar||!cr||!pr||ar[0]?.[0]!=='Mã tài sản'||cr[0]?.[0]!=='Mã hợp đồng'||pr[0]?.[0]!=='Mã hợp đồng')throw Error('Cần workbook ba sheet do app này xuất.');let d=blank();for(let [i,r] of ar.slice(1).entries()){if(!String(r[0]??'').trim())continue;d.assets.push({id:uid(),code:String(r[0]).trim(),name:String(r[1]??'').trim(),type:String(r[2]??'').trim(),location:String(r[3]??'').trim(),note:String(r[4]??'').trim()})}for(let [i,r] of cr.slice(1).entries()){if(!String(r[0]??'').trim())continue;let a=d.assets.find(x=>x.code===String(r[1]??'').trim());if(!a)throw Error('Hợp đồng dòng '+(i+2)+' thiếu tài sản.');d.contracts.push({id:uid(),code:String(r[0]).trim(),assetId:a.id,tenant:String(r[2]??'').trim(),phone:String(r[3]??'').trim(),rate:amount(r[4]),start:parseDate(r[5]),end:parseDate(r[6]),depositExpected:amount(r[7]),note:String(r[8]??'').trim()})}for(let [i,r] of pr.slice(1).entries()){if(!String(r[0]??'').trim())continue;let c=d.contracts.find(x=>x.code===String(r[0]??'').trim());if(!c)throw Error('Khoản thu dòng '+(i+2)+' thiếu hợp đồng.');d.payments.push({id:uid(),contractId:c.id,date:parseDate(r[1]),kind:String(r[2]??'').trim(),amount:amount(r[3]),method:String(r[4]??'').trim(),reference:String(r[5]??'').trim(),note:String(r[6]??'').trim()})}if(!validBackup(d))throw Error('Bảng Excel chứa mã trùng, ngày hoặc số tiền không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập '+d.assets.length+' tài sản, '+d.contracts.length+' hợp đồng và '+d.payments.length+' khoản thu/cọc sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('quan-ly-cho-thue-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.assets.length||db.contracts.length||db.payments.length){if(!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();save()}if(a==='clear'){if(confirm('Xóa toàn bộ tài sản, hợp đồng và khoản thu trên trình duyệt này?')){db=blank();save()}}if(a==='deleteRecord'){let{type,id}=modal;if(type==='asset'&&db.contracts.some(c=>c.assetId===id)){ $('#modalError').textContent='Tài sản đã có hợp đồng; không thể xóa.';return}if(type==='contract'&&db.payments.some(p=>p.contractId===id)){ $('#modalError').textContent='Hợp đồng đã có khoản thu/cọc; không thể xóa.';return}if(confirm('Xóa vĩnh viễn bản ghi này?')){let list=type==='asset'?db.assets:type==='contract'?db.contracts:db.payments;list.splice(list.findIndex(x=>x.id===id),1);closeModal();save()}}if(a==='settings'){let as=v('asof'),wd=amount(v('warnDays')),company=v('company');if(as&&!validDate(as)||!Number.isSafeInteger(wd)||wd<0||wd>365||company.length>160){alert('Ngày báo cáo, ngưỡng cảnh báo hoặc tên đơn vị không hợp lệ.');return}db.settings={asof:as,warnDays:wd,company};save()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
