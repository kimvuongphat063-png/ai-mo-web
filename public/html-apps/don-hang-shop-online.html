function dashboard(){let os=db.orders.filter(o=>scope==='all'||o.date.slice(0,7)===scope),t=totals(os),worst=os.filter(o=>o.status==='Hoàn hàng').slice(-5).reverse(),loss=os.filter(o=>o.status==='Đã giao'&&calc(o).profit<0).sort((a,b)=>calc(a).profit-calc(b).profit);let ch=aggregate(os,o=>o.channelName),returnRate=t.count?Math.round((t['Hoàn hàng']||0)/t.count*1000)/10:0;return hero('Đơn hàng Shop Online','Một nơi theo dõi đơn nhiều sản phẩm, phí kênh bán, hoàn hàng và lãi quản trị.')+'<div class="card"><div class="toolbar">'+scopePicker()+'<span class="grow"></span><button class="btn primary" data-new="order">+ Tạo đơn hàng</button></div><div class="grid">'+metric('Đã giao',t['Đã giao']||0,t.count+' đơn trong kỳ')+metric('Doanh thu đã giao',money(t.revenue))+metric('Phí kênh',money(t.fee))+metric('Lãi ước tính',money(t.profit),'Đã tính chi phí hoàn hàng')+metric('Đang giao',t['Đang giao']||0)+metric('Hoàn hàng',t['Hoàn hàng']||0,returnRate+'% tổng đơn')+metric('Đơn giao bị lỗ',loss.length)+'</div><p class="notice">Lãi quản trị từ dữ liệu đã nhập. Đơn đang giao và hủy chưa ghi doanh thu; hoàn hàng ghi chi phí vận chuyển hai chiều và phí hoàn. Chưa tự đối soát khoản tiền sàn chuyển về.</p></div><div class="grid two"><section class="card"><h2>🛍️ Theo kênh bán</h2>'+bars(ch,'profit')+'</section><section class="card"><h2>↩️ Đơn hoàn gần đây</h2>'+(worst.length?worst.map(o=>'<div class="check"><span><b>'+esc(o.no)+'</b> · '+esc(o.customer)+'<small>'+date(o.date)+' · '+esc(o.channelName)+'</small></span><strong class="bad">'+money(calc(o).profit)+'</strong></div>').join(''):empty('Chưa có đơn hoàn.'))+'</section></div><section class="card"><h2>⚠️ Đơn đã giao nhưng lỗ</h2>'+(loss.length?orderTable(loss.slice(0,10)):empty('Không có đơn đã giao bị lỗ trong kỳ.'))+'</section><section class="card"><h2>Đơn gần đây</h2>'+orderTable(os.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))+'</section>'}
function orderTable(os){return table(['Ngày / mã đơn','Khách hàng','Kênh','Sản phẩm','Trạng thái','Doanh thu','Lãi','Thao tác'],os.map(o=>{let c=calc(o);return '<tr><td><b>'+esc(o.no)+'</b><br><small>'+date(o.date)+'</small></td><td>'+esc(o.customer||'—')+'<br><small>'+esc(o.phone||'')+'</small></td><td>'+esc(o.channelName)+'</td><td>'+o.items.map(i=>esc(i.sku)+' × '+i.qty).join('<br>')+'</td><td>'+badge(o.status)+'</td><td class="num">'+money(c.revenue)+'</td><td class="num '+(c.profit<0?'bad':'good')+'">'+money(c.profit)+'</td><td><button class="btn small" data-edit="order" data-id="'+esc(o.id)+'">Chi tiết / sửa</button></td></tr>'}))}
function ordersPage(){return hero('📦 Đơn hàng','Tạo đơn nhiều dòng sản phẩm và theo dõi trạng thái giao, hoàn, hủy.')+'<section class="card"><div class="toolbar filters"><input class="search" id="search" placeholder="Tìm mã, khách, SKU..." value="'+esc(query)+'">'+scopePicker()+'<select id="statusFilter"><option value="all">Mọi trạng thái</option>'+['Đã giao','Đang giao','Hoàn hàng','Hủy'].map(s=>'<option '+(statusFilter===s?'selected':'')+'>'+s+'</option>').join('')+'</select><span class="grow"></span><button class="btn primary" data-new="order">+ Đơn mới</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Excel</button><button class="btn" data-action="csv">↓ CSV</button></div>'+orderTable(filtered())+'</section>'}
function productsPage(){let a=db.products.filter(p=>[p.sku,p.name].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));return hero('🏷️ Sản phẩm','Giá vốn và giá bán mặc định. Mỗi đơn giữ bản chụp giá tại lúc lập.')+'<section class="card"><div class="toolbar"><input class="search" id="search" placeholder="Tìm SKU, tên sản phẩm..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="product">+ Sản phẩm</button></div>'+table(['SKU','Tên sản phẩm','Giá vốn','Giá bán','Lãi gộp / sp','Trạng thái',''],a.map(p=>'<tr><td><b>'+esc(p.sku)+'</b></td><td>'+esc(p.name)+'</td><td class="num">'+money(p.cost)+'</td><td class="num">'+money(p.price)+'</td><td class="num">'+money(p.price-p.cost)+'</td><td>'+badge(p.active===false?'Tạm ngừng':'Hoạt động')+'</td><td><button class="btn small" data-edit="product" data-id="'+esc(p.id)+'">Sửa</button></td></tr>'))+'</section>'}
function channelsPage(){return hero('🛍️ Kênh bán','Phí phần trăm trên doanh thu dòng hàng, cộng phí cố định một lần mỗi đơn.')+'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn primary" data-new="channel">+ Kênh bán</button></div>'+table(['Kênh','Phí (%)','Phí cố định / đơn','Trạng thái',''],db.channels.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td class="num">'+c.feeRate+'%</td><td class="num">'+money(c.fixedFee)+'</td><td>'+badge(c.active===false?'Tạm ngừng':'Hoạt động')+'</td><td><button class="btn small" data-edit="channel" data-id="'+esc(c.id)+'">Sửa</button></td></tr>'))+'</section>'}
function customerRows(){let m=new Map();for(let o of db.orders){let k=o.phone.trim()||'name:'+o.customer.trim().toLocaleLowerCase('vi');if(!k||k==='name:')continue;let x=m.get(k)||{name:o.customer,phone:o.phone,orders:0,delivered:0,returns:0,spend:0,last:''};x.orders++;x.delivered+=o.status==='Đã giao'?1:0;x.returns+=o.status==='Hoàn hàng'?1:0;x.spend+=calc(o).revenue;if(o.date>=x.last){x.last=o.date;x.name=o.customer}m.set(k,x)}return [...m.values()].sort((a,b)=>b.last.localeCompare(a.last))}
function customersPage(){let rows=customerRows().filter(x=>[x.name,x.phone].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));return hero('👥 Khách hàng','Đếm theo mã đơn duy nhất, gom bằng số điện thoại; cảnh báo khách từng hoàn hàng.')+'<section class="card"><div class="toolbar"><input class="search" id="search" placeholder="Tìm tên hoặc điện thoại..." value="'+esc(query)+'"></div>'+table(['Khách hàng','Điện thoại','Số đơn','Đã giao','Hoàn hàng','Doanh thu','Gần nhất','Gợi ý'],rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.phone||'—')+'</td><td>'+x.orders+'</td><td>'+x.delivered+'</td><td>'+x.returns+'</td><td class="num">'+money(x.spend)+'</td><td>'+date(x.last)+'</td><td>'+(x.returns?'<span class="badge loss">Từng hoàn</span>':x.delivered>=2?'<span class="badge ok">Mua lại</span>':'—')+'</td></tr>'))+'<p class="notice">Khách không có số điện thoại được tạm gom theo tên, có thể trùng người. Đây là gợi ý chăm sóc, không phải xác minh danh tính.</p></section>'}
function aggregate(os,key){let m=new Map();for(let o of os){let k=key(o),x=m.get(k)||{name:k,orders:0,revenue:0,profit:0,returns:0};x.orders++;let c=calc(o);x.revenue+=c.revenue;x.profit+=c.profit;x.returns+=o.status==='Hoàn hàng'?1:0;m.set(k,x)}return [...m.values()].sort((a,b)=>b.revenue-a.revenue)}
function bars(a,k){if(!a.length)return empty('Chưa có dữ liệu.');let top=Math.max(1,...a.map(x=>Math.abs(x[k])));return '<div class="bars">'+a.slice(0,8).map(x=>'<div class="barline"><span>'+esc(x.name)+'</span><span class="track"><i style="width:'+Math.max(2,Math.abs(x[k])/top*100)+'%"></i></span><b class="num">'+money(x[k])+'</b></div>').join('')+'</div>'}
function reportsPage(){let os=db.orders.filter(o=>scope==='all'||o.date.slice(0,7)===scope),t=totals(os),byMonth=aggregate(db.orders,o=>o.date.slice(0,7)),byChannel=aggregate(os,o=>o.channelName);let lines=[];for(let o of os){if(o.status!=='Đã giao')continue;let c=calc(o);for(let i of o.items){let rev=i.qty*i.price-i.discount;lines.push({name:i.sku+' · '+i.name,date:o.date,status:o.status,channelName:o.channelName,items:[],revenue:rev,profit:rev-i.qty*i.cost-Math.round(rev*o.feeRate/100)})}}let byProduct=new Map();for(let l of lines){let x=byProduct.get(l.name)||{name:l.name,orders:0,revenue:0,profit:0};x.orders++;x.revenue+=l.revenue;x.profit+=l.profit;byProduct.set(l.name,x)}return hero('📈 Báo cáo','Doanh thu theo ngày đơn; lợi nhuận là ước tính sau giá vốn, phí kênh và vận chuyển.')+'<section class="card"><div class="toolbar">'+scopePicker()+'<span class="grow"></span><button class="btn" data-action="csv">↓ Xuất CSV đơn hàng</button></div><div class="grid">'+metric('Tổng đơn',t.count)+metric('Đã giao',t['Đã giao']||0)+metric('Doanh thu',money(t.revenue))+metric('Lãi ròng ước tính',money(t.profit))+'</div></section><div class="grid two"><section class="card"><h2>Theo tháng</h2>'+reportTable(byMonth)+'</section><section class="card"><h2>Theo kênh</h2>'+reportTable(byChannel)+'</section></div><section class="card"><h2>Theo sản phẩm đã giao</h2>'+table(['Sản phẩm','Dòng bán','Doanh thu hàng','Lãi dòng trước vận chuyển / phí cố định'],[...byProduct.values()].sort((a,b)=>b.revenue-a.revenue).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.orders+'</td><td class="num">'+money(x.revenue)+'</td><td class="num">'+money(x.profit)+'</td></tr>'))+'<p class="notice warn">Bảng sản phẩm phân bổ phí phần trăm theo dòng; không phân bổ phí cố định, phí vận chuyển hoặc phí hoàn. Xem lãi chính thức trong bảng đơn và kênh.</p></section>'}
function reportTable(a){return table(['Nhóm','Đơn','Doanh thu','Lãi','Hoàn'],a.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+x.orders+'</td><td class="num">'+money(x.revenue)+'</td><td class="num">'+money(x.profit)+'</td><td>'+x.returns+'</td></tr>'))}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Sao lưu định kỳ và chuyển dữ liệu sang máy khác bằng file HTML kèm dữ liệu.')+'<section class="card"><h2>Trạng thái dữ liệu</h2><div class="grid">'+metric('Sản phẩm',db.products.length)+metric('Kênh',db.channels.length)+metric('Đơn hàng',db.orders.length)+'</div><p class="notice warn">File HTML gốc không mang theo dữ liệu nhập trên trình duyệt này. Muốn dùng trên PC khác, tải “HTML kèm dữ liệu” hoặc sao lưu JSON rồi khôi phục ở máy kia.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Xuất Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV đơn hàng</button></div><p class="muted">JSON và HTML kèm dữ liệu giữ đầy đủ bản chụp giá/phí của từng đơn. Excel dùng để trao đổi bảng đơn, sẽ đọc lại giá và phí từ danh mục hiện tại khi nhập.</p></section><section class="card"><h2>Dữ liệu mẫu tham chiếu</h2><p>Mẫu gồm 8 sản phẩm, 6 kênh, 74 đơn / 112 dòng đơn từ app tham chiếu. Dữ liệu mẫu được nạp theo lựa chọn; không tự trộn vào sổ thật.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Thiết lập và làm mới</h2><label class="field">Phí hoàn mặc định (đ)<input id="returnFee" type="number" min="0" step="1" value="'+db.settings.returnFee+'"></label><p><button class="btn" data-action="settings">Lưu thiết lập</button></p><p class="notice">Phí hoàn mặc định chỉ áp dụng cho đơn mới. Đơn đã lập giữ phí đã lưu.</p><button class="btn danger" data-action="clear">Xóa toàn bộ dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Cách dùng','Quy trình bán hàng và giải thích công thức đối chiếu với app gốc.')+'<section class="card"><h2>5 bước sử dụng</h2><ol><li>Tạo sản phẩm (SKU, giá vốn, giá bán) và kênh bán (phí phần trăm, phí cố định).</li><li>Tạo đơn hàng, thêm một hoặc nhiều dòng, nhập khách, phí vận chuyển và trạng thái.</li><li>Cập nhật trạng thái khi giao xong hoặc hoàn; app giữ giá và phí của đơn tại thời điểm lưu.</li><li>Đối chiếu lãi theo đơn, kênh, tháng và khách hàng.</li><li>Sao lưu JSON; tải HTML kèm dữ liệu để mở trên máy khác.</li></ol></section><section class="card"><h2>Cách tính</h2><p><b>Đã giao:</b> doanh thu mỗi dòng = số lượng × đơn giá − giảm giá dòng; dòng đầu cộng tiền ship khách trả. Phí sàn = làm tròn(doanh thu từng dòng × tỷ lệ phí) + phí cố định một lần mỗi đơn. Lãi = tổng doanh thu − tổng giá vốn − tổng phí sàn − ship shop trả.</p><p><b>Hoàn hàng:</b> lãi = −(2 × ship shop trả + phí hoàn). <b>Đang giao / hủy:</b> tạm tính 0. Giá, giá vốn và phí kênh được chụp vào đơn khi lập, sửa danh mục sau đó không làm đổi lịch sử.</p><p class="notice warn">Đây là lãi quản trị theo dữ liệu đã nhập, chưa gồm phí quảng cáo, chi phí nhân sự, thuế, khoản sàn giữ/đối soát và các khoản ngoài đơn. Dùng app “Tính lãi thật từng đơn” khi cần sổ chi phí và dòng tiền chi tiết hơn.</p></section>'}
function render(){let names={dashboard:'Tổng quan',orders:'Đơn hàng',products:'Sản phẩm',channels:'Kênh bán',customers:'Khách hàng',reports:'Báo cáo',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=({dashboard,orders:ordersPage,products:productsPage,channels:channelsPage,customers:customersPage,reports:reportsPage,data:dataPage,guide:guidePage})[page]()}
function field(k,label,type,value='',opts=''){return '<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value)+'" '+(type==='number'?'step="'+(k==='feeRate'?'0.01':'1')+'" min="0"':'')+'>')+'</div>'}
function option(v,t,selected){return '<option value="'+esc(v)+'" '+(String(v)===String(selected)?'selected':'')+'>'+esc(t)+'</option>'}
function nextNo(){let n=Math.max(0,...db.orders.map(o=>/^DH\d+$/.test(o.no)?Number(o.no.slice(2)):0));return 'DH'+String(n+1).padStart(4,'0')}
function itemRow(i={}){let options='<option value="">Chọn sản phẩm hoặc nhập tay</option>'+db.products.filter(p=>p.active!==false||p.id===i.productId).map(p=>option(p.id,p.sku+' · '+p.name,i.productId)).join('');return '<div class="item-row" data-item="'+esc(i.id||uid())+'"><div class="field"><label>Sản phẩm</label><select data-i="productId">'+options+'</select></div><div class="field"><label>SKU / tên hàng</label><input data-i="sku" aria-label="SKU" placeholder="SKU" value="'+esc(i.sku||'')+'"><input data-i="name" aria-label="Tên hàng" placeholder="Tên hàng" value="'+esc(i.name||'')+'"></div><div class="field"><label>Số lượng</label><input data-i="qty" type="number" min="1" step="1" value="'+esc(i.qty??1)+'"></div><div class="field"><label>Giá / vốn / giảm (đ)</label><input data-i="price" type="number" min="0" step="1" value="'+esc(i.price??0)+'" aria-label="Giá bán" placeholder="Giá bán"><input data-i="cost" type="number" min="0" step="1" value="'+esc(i.cost??0)+'" aria-label="Giá vốn" placeholder="Giá vốn"><input data-i="discount" type="number" min="0" step="1" value="'+esc(i.discount??0)+'" aria-label="Giảm giá dòng" placeholder="Giảm giá"></div><button type="button" data-action="removeItem" title="Bỏ dòng">✕</button></div>'}
function openModal(type,id=''){let old=type==='product'?product(id):type==='channel'?channel(id):order(id);old=old||{};modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+({product:'sản phẩm',channel:'kênh bán',order:'đơn hàng'}[type]);let html='';if(type==='product')html='<div class="formgrid">'+field('sku','SKU','text',old.sku||'')+field('name','Tên sản phẩm','text',old.name||'')+field('cost','Giá vốn (đ)','number',old.cost??0)+field('price','Giá bán (đ)','number',old.price??0)+field('active','Trạng thái','select','',option('true','Hoạt động',String(old.active!==false))+option('false','Tạm ngừng',String(old.active!==false)))+'</div>';if(type==='channel')html='<div class="formgrid">'+field('name','Tên kênh','text',old.name||'')+field('feeRate','Phí kênh (%)','number',old.feeRate??0)+field('fixedFee','Phí cố định / đơn (đ)','number',old.fixedFee??0)+field('active','Trạng thái','select','',option('true','Hoạt động',String(old.active!==false))+option('false','Tạm ngừng',String(old.active!==false)))+'</div>';if(type==='order'){let co=channel(old.channelId),channelOpts='<option value="">Chọn kênh</option>'+db.channels.filter(c=>c.active!==false||c.id===old.channelId).map(c=>option(c.id,c.name+' · '+c.feeRate+'% + '+money(c.fixedFee),old.channelId)).join('');html='<div class="formgrid">'+field('date','Ngày đơn','date',old.date||today())+field('no','Mã đơn','text',old.no||nextNo())+field('channelId','Kênh bán','select','',channelOpts)+field('status','Trạng thái','select','',['Đang giao','Đã giao','Hoàn hàng','Hủy'].map(s=>option(s,s,old.status||'Đang giao')).join(''))+field('customer','Tên khách','text',old.customer||'')+field('phone','Số điện thoại','text',old.phone||'')+field('province','Tỉnh / thành','text',old.province||'')+field('shipCust','Ship khách trả (đ)','number',old.shipCust??0)+field('shipShop','Ship shop trả (đ)','number',old.shipShop??0)+field('returnFee','Phí hoàn (đ)','number',old.returnFee??db.settings.returnFee)+field('note','Ghi chú','textarea',old.note||'')+'</div><h3>Dòng sản phẩm</h3><p class="muted">Giá bán và giá vốn tự lấy khi chọn sản phẩm, có thể sửa riêng cho đơn.</p><div class="order-items" id="orderItems">'+(old.items||[{}]).map(itemRow).join('')+'</div><p><button class="btn small" data-action="addItem" type="button">+ Thêm dòng</button></p><p class="notice">Phí kênh áp dụng theo mức tại lúc tạo đơn; khi sửa đơn, mức phí đã lưu được giữ nguyên. Muốn áp dụng mức mới, tạo đơn mới.</p>';if(id)html+='<p><button class="btn danger small" data-action="deleteOrder" type="button">Xóa đơn này</button></p>'}$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function readItems(){return $$('.item-row').map(row=>({id:row.dataset.item,productId:row.querySelector('[data-i="productId"]').value,sku:row.querySelector('[data-i="sku"]').value.trim(),name:row.querySelector('[data-i="name"]').value.trim(),qty:Number(row.querySelector('[data-i="qty"]').value),price:num(row.querySelector('[data-i="price"]').value),cost:num(row.querySelector('[data-i="cost"]').value),discount:num(row.querySelector('[data-i="discount"]').value)}))}
function value(k){return $('#f_'+k)?.value.trim()||''}
function saveModal(){let {type,id}=modal||{};if(!type)return;let error='',x={};if(type==='product'){x={sku:value('sku').toUpperCase(),name:value('name'),cost:num(value('cost')),price:num(value('price')),active:value('active')==='true'};if(!x.sku||!x.name)error='Cần SKU và tên sản phẩm.';else if(db.products.some(p=>p.id!==id&&p.sku.toLowerCase()===x.sku.toLowerCase()))error='SKU đã tồn tại.';else if(!validMoney(x.cost)||!validMoney(x.price))error='Giá vốn và giá bán phải là số nguyên không âm.'}if(type==='channel'){x={name:value('name'),feeRate:Number(value('feeRate')),fixedFee:num(value('fixedFee')),active:value('active')==='true'};if(!x.name)error='Cần tên kênh.';else if(db.channels.some(c=>c.id!==id&&c.name.toLowerCase()===x.name.toLowerCase()))error='Tên kênh đã tồn tại.';else if(!Number.isFinite(x.feeRate)||x.feeRate<0||x.feeRate>100||!validMoney(x.fixedFee))error='Phí kênh phải từ 0–100%, phí cố định là số nguyên không âm.'}if(type==='order'){let old=order(id),c=channel(value('channelId'));x={date:value('date'),no:value('no'),channelId:value('channelId'),channelName:old?.channelName||c?.name||'',status:value('status'),customer:value('customer'),phone:value('phone'),province:value('province'),shipCust:num(value('shipCust')),shipShop:num(value('shipShop')),returnFee:num(value('returnFee')),note:value('note'),feeRate:old?.feeRate??c?.feeRate??0,feeFixed:old?.feeFixed??c?.fixedFee??0,items:readItems()};if(!validDate(x.date)||!x.no||!c)error='Cần ngày hợp lệ, mã đơn và kênh bán.';else if(db.orders.some(o=>o.id!==id&&o.no.toLowerCase()===x.no.toLowerCase()))error='Mã đơn đã tồn tại.';else if(!['Đã giao','Đang giao','Hoàn hàng','Hủy'].includes(x.status))error='Trạng thái không hợp lệ.';else if(![x.shipCust,x.shipShop,x.returnFee].every(validMoney))error='Phí vận chuyển / hoàn phải là số nguyên không âm.';else if(!x.items.length)error='Cần ít nhất một dòng sản phẩm.';else if(x.items.some(i=>!i.sku||!i.name||!Number.isSafeInteger(i.qty)||i.qty<1||i.qty>100000||![i.price,i.cost,i.discount].every(validMoney)||i.discount>i.price*i.qty))error='Kiểm tra SKU, số lượng, giá, vốn và giảm giá từng dòng.';if(old&&old.channelId!==x.channelId){x.channelName=c.name;x.feeRate=c.feeRate;x.feeFixed=c.fixedFee}}if(error){$('#modalError').textContent=error;return}let list=type==='product'?db.products:type==='channel'?db.channels:db.orders;if(id)Object.assign(list.find(z=>z.id===id),x);else list.push({id:uid(),...x});closeModal();persist()}
function sampleData(){let d=blank();d.settings.returnFee=SOURCE.returnFee;d.products=SOURCE.products.map(([sku,name,cost,price])=>({id:'p-'+sku,sku,name,cost,price,active:true}));d.channels=SOURCE.channels.map(([name,feeRate,fixedFee],j)=>({id:'c-'+j,name,feeRate,fixedFee,active:true}));let m=new Map();for(let l of SOURCE.lines){let o=m.get(l.no);if(!o){let c=d.channels.find(c=>c.name===l.channel);o={id:'o-'+l.no,no:l.no,date:l.date,channelId:c.id,channelName:c.name,customer:l.customer,phone:l.phone,province:l.province,status:l.status,shipCust:l.shipCust,shipShop:l.shipShop,feeRate:c.feeRate,feeFixed:c.fixedFee,returnFee:SOURCE.returnFee,note:'Dữ liệu mẫu từ app gốc',items:[]};m.set(l.no,o)}let p=d.products.find(p=>p.sku===l.sku);o.items.push({id:uid(),productId:p.id,sku:p.sku,name:p.name,qty:l.qty,price:l.price||p.price,cost:p.cost,discount:l.discount})}d.orders=[...m.values()];return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function csv(){let rows=[['Ngày','Mã đơn','Kênh','Khách','Điện thoại','Tỉnh','Trạng thái','SKU','Sản phẩm','Số lượng','Giá bán','Giá vốn','Giảm giá','Ship khách','Ship shop','Phí kênh %','Phí cố định','Phí hoàn','Doanh thu đơn','Lãi đơn']];for(let o of db.orders){let c=calc(o);for(let [j,i] of o.items.entries())rows.push([o.date,o.no,o.channelName,o.customer,o.phone,o.province,o.status,i.sku,i.name,i.qty,i.price,i.cost,i.discount,j?0:o.shipCust,j?0:o.shipShop,o.feeRate,j?0:o.feeFixed,j?0:o.returnFee,j?'':c.revenue,j?'':c.profit])}let s='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('don-hang-shop-online.csv',s,'text/csv;charset=utf-8')}
function excelExport(){let products=[['SKU','Tên sản phẩm','Giá vốn','Giá bán'],...db.products.map(p=>[p.sku,p.name,p.cost,p.price])],channels=[['Kênh bán','Phí sàn (%)','Phí cố định / đơn'],...db.channels.map(c=>[c.name,c.feeRate,c.fixedFee])],orders=[['Ngày','Mã đơn','Kênh bán','Tên khách','Điện thoại','Tỉnh','Mã SP','SL','Giá bán','Giảm giá','Ship khách trả','Ship shop trả','Trạng thái']];for(let o of db.orders)for(let [j,i] of o.items.entries())orders.push([o.date,o.no,o.channelName,o.customer,o.phone,o.province,i.sku,i.qty,i.price,i.discount,j?0:o.shipCust,j?0:o.shipShop,o.status]);let blob=Excel.workbook([{name:'San pham',rows:products},{name:'Kenh ban',rows:channels},{name:'Don hang',rows:orders}]),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='don-hang-shop-online.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function parseSheetDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');if(validDate(x))return x}return ''}
function parsedExcel(sheets){let pRows=sheets['San pham']||sheets['Sản phẩm']||[],cRows=sheets['Kenh ban']||sheets['Kênh bán']||[],oRows=sheets['Don hang']||sheets['Đơn hàng']||[];if(oRows.length<2)throw Error('Không tìm thấy bảng Don hang hoặc bảng chưa có dòng dữ liệu.');let products=db.products.map(x=>({...x})),channels=db.channels.map(x=>({...x}));for(let [j,r] of pRows.slice(1).entries()){let sku=String(r[0]??'').trim().toUpperCase();if(!sku)continue;let cost=num(r[2]),price=num(r[3]);if(!validMoney(cost)||!validMoney(price)||!String(r[1]??'').trim())throw Error('Sản phẩm dòng '+(j+2)+' không hợp lệ.');let old=products.find(x=>x.sku.toUpperCase()===sku);if(old)Object.assign(old,{name:String(r[1]).trim(),cost,price});else products.push({id:uid(),sku,name:String(r[1]).trim(),cost,price,active:true})}for(let [j,r] of cRows.slice(1).entries()){let name=String(r[0]??'').trim();if(!name)continue;let feeRate=Number(r[1]),fixedFee=num(r[2]);if(!Number.isFinite(feeRate)||feeRate<0||feeRate>100||!validMoney(fixedFee))throw Error('Kênh dòng '+(j+2)+' không hợp lệ.');let old=channels.find(x=>x.name.toLowerCase()===name.toLowerCase());if(old)Object.assign(old,{feeRate,fixedFee});else channels.push({id:uid(),name,feeRate,fixedFee,active:true})}let groups=new Map();for(let [j,r] of oRows.slice(1).entries()){if(!String(r[1]??'').trim()&&!String(r[6]??'').trim())continue;let date=parseSheetDate(r[0]),no=String(r[1]??'').trim(),cn=String(r[2]??'').trim(),sku=String(r[6]??'').trim().toUpperCase(),c=channels.find(x=>x.name.toLowerCase()===cn.toLowerCase()),p=products.find(x=>x.sku.toUpperCase()===sku),qty=Number(r[7]),price=num(r[8]),discount=num(r[9]),shipCust=num(r[10]),shipShop=num(r[11]),status=String(r[12]??'Đã giao').trim();if(!date||!no||!c||!p||!Number.isSafeInteger(qty)||qty<1||qty>100000||![price,discount,shipCust,shipShop].every(validMoney)||!['Đã giao','Đang giao','Hoàn hàng','Hủy'].includes(status))throw Error('Đơn hàng dòng '+(j+2)+' thiếu hoặc sai ngày/mã/kênh/SKU/số lượng/tiền/trạng thái.');if(price===0)price=p.price;if(discount>price*qty)throw Error('Giảm giá vượt tiền hàng ở dòng '+(j+2)+'.');let o=groups.get(no);if(!o){o={id:uid(),no,date,channelId:c.id,channelName:c.name,customer:String(r[3]??'').trim(),phone:String(r[4]??'').trim(),province:String(r[5]??'').trim(),status,shipCust,shipShop,feeRate:c.feeRate,feeFixed:c.fixedFee,returnFee:db.settings.returnFee,note:'Nhập từ Excel',items:[]};groups.set(no,o)}else if(o.date!==date||o.channelId!==c.id||o.status!==status)throw Error('Các dòng cùng mã đơn '+no+' không thống nhất ngày/kênh/trạng thái.');else{o.shipCust+=shipCust;o.shipShop+=shipShop}o.items.push({id:uid(),productId:p.id,sku:p.sku,name:p.name,qty,price,cost:p.cost,discount})}let orders=[...groups.values()];if(!orders.length)throw Error('Không có đơn hợp lệ.');let result={version:1,updatedAt:Date.now(),settings:{...db.settings},products,channels,orders};if(!validBackup(result))throw Error('Dữ liệu Excel không hợp lệ sau khi chuyển đổi.');return result}
async function excelImport(file){if(file.size>20_000_000)throw Error('File Excel quá lớn.');let sheets=await Excel.read(file),candidate=parsedExcel(sheets);if(!confirm('Nhập '+candidate.orders.length+' đơn từ Excel sẽ THAY THẾ toàn bộ đơn hiện có. Danh mục sản phẩm/kênh trùng tên hoặc SKU cũng được cập nhật. Nên sao lưu JSON trước. Tiếp tục?'))return;db=candidate;scope='all';persist()}
function portable(){let html=document.documentElement.outerHTML,base=encode(db);html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+base+'$2');download('don-hang-shop-online-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='addItem')$('#orderItems').insertAdjacentHTML('beforeend',itemRow());if(a==='removeItem'){if($$('.item-row').length<=1){$('#modalError').textContent='Đơn cần ít nhất một sản phẩm.';return}b.closest('.item-row').remove()}if(a==='deleteOrder'){if(confirm('Xóa vĩnh viễn đơn này?')){db.orders=db.orders.filter(o=>o.id!==modal.id);closeModal();persist()}}if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('don-hang-shop-online-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.orders.length||db.products.length||db.channels.length){if(!confirm('Nạp mẫu sẽ THAY THẾ toàn bộ dữ liệu đang có. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();scope='all';persist()}if(a==='clear'){if(confirm('Xóa toàn bộ đơn hàng, sản phẩm và kênh trên trình duyệt này?')){db=blank();scope='all';persist()}}if(a==='settings'){let n=num($('#returnFee').value);if(!validMoney(n)){alert('Phí hoàn không hợp lệ.');return}db.settings.returnFee=n;persist()}});
document.addEventListener('change',e=>{if(e.target.id==='scope'){scope=e.target.value;render()}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}if(e.target.matches('[data-i="productId"]')){let p=product(e.target.value),row=e.target.closest('.item-row');if(p){for(let k of ['sku','name','price','cost'])row.querySelector('[data-i="'+k+'"]').value=p[k]}}if(e.target.id==='f_channelId'&&modal?.type==='order'&&!modal.id){let c=channel(e.target.value);if(c)$('#modalError').textContent='Phí '+c.feeRate+'% + '+money(c.fixedFee)+' mỗi đơn sẽ được lưu theo đơn này.'}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let a=e.target.selectionStart;query=e.target.value;render();let t=$('#search');if(t){t.focus();t.setSelectionRange(a,a)}}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let x=JSON.parse(await file.text());if(!validBackup(x))throw Error('File không đúng định dạng hoặc dữ liệu không hợp lệ.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=x;scope='all';persist()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
