function stock(m,source=db){return round2(m.baseStock+source.movements.filter(x=>x.materialId===m.id).reduce((n,x)=>n+x.delta,0)+source.receipts.filter(x=>source.orders.some(o=>o.id===x.orderId&&o.materialId===m.id)).reduce((n,x)=>n+x.qty,0))}
function onOrder(m,source=db){return round2(m.baseOrdered+source.orders.filter(o=>o.materialId===m.id&&(o.state==='Đã đặt'||o.state==='Đã nhận')).reduce((n,o)=>n+Math.max(0,o.qty-received(o.id,source)),0))}
function calc(m,source=db){let available=stock(m,source),pending=onOrder(m,source),daysSupply=m.daily>0?round1(available/m.daily):null,point=Math.round(m.daily*m.lead+m.safety),need=round2(Math.max(0,point-(available+pending))),cost=Math.round(need*m.price);let risk=daysSupply!==null&&daysSupply<m.lead&&available+pending<point;return {available,pending,daysSupply,point,need,cost,risk}}
function arrivalRisk(m){let v=calc(m),eta=db.orders.filter(o=>o.materialId===m.id&&o.state==='Đã đặt'&&o.eta).map(o=>days(o.eta,db.settings.asof));return v.daysSupply!==null&&eta.length>0&&Math.min(...eta)>v.daysSupply}
function alerts(m){let v=calc(m),a=[];if(v.risk)a.push('Nguy cơ thiếu trước thời gian giao');if(arrivalRisk(m))a.push('Đơn có lịch về đầu tiên sau số ngày đủ dùng hiện tại');if(db.orders.some(o=>o.materialId===m.id&&o.state==='Đã đặt'&&o.eta&&days(o.eta,db.settings.asof)<0))a.push('Đơn mua quá ngày dự kiến về');if(v.need>0)a.push('Đến điểm đặt hàng: cần đặt thêm');return a}
function summary(){let v=db.materials.map(m=>calc(m));return {materials:db.materials.length,toBuy:v.filter(x=>x.need>0).length,risk:v.filter(x=>x.risk).length,units:round2(v.reduce((n,x)=>n+x.need,0)),cost:v.reduce((n,x)=>n+x.cost,0),openOrders:db.orders.filter(o=>o.state==='Đã đặt').length}}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!Array.isArray(x.materials)||!Array.isArray(x.orders)||!Array.isArray(x.receipts)||!Array.isArray(x.movements)||!Array.isArray(x.audit))return 'Cấu trúc hoặc cài đặt không hợp lệ.';
 let mids=new Set(),codes=new Set();for(let m of x.materials){if(!m.id||mids.has(m.id)||!m.code||codes.has(m.code.toUpperCase())||!m.name||!m.unit||[m.baseStock,m.baseOrdered,m.daily,m.lead,m.safety,m.price].some(v=>!Number.isFinite(v)||v<0)||!Number.isInteger(m.lead)||!Number.isSafeInteger(m.price)||String(m.note||'').length>1200)return 'Nguyên liệu không hợp lệ hoặc trùng mã.';mids.add(m.id);codes.add(m.code.toUpperCase())}
 let oids=new Set(),ocodes=new Set();for(let o of x.orders){if(!o.id||oids.has(o.id)||!mids.has(o.materialId)||!o.code||ocodes.has(o.code.toUpperCase())||!Number.isFinite(o.qty)||o.qty<=0||!Number.isSafeInteger(o.price)||o.price<0||!PO_STATES.includes(o.state)||!dateOK(o.created)||o.placed&&!dateOK(o.placed)||o.eta&&!dateOK(o.eta)||o.placed&&o.placed<o.created||o.placed&&o.eta&&o.eta<o.placed||['Đã đặt','Đã nhận'].includes(o.state)&&!o.placed||o.state==='Nháp'&&o.placed||String(o.note||'').length>1200)return 'Đề nghị/đơn mua không hợp lệ hoặc trùng mã.';oids.add(o.id);ocodes.add(o.code.toUpperCase())}
 let rids=new Set(),rcount={};for(let r of x.receipts){let o=x.orders.find(y=>y.id===r.orderId);if(!r.id||rids.has(r.id)||!o||!Number.isFinite(r.qty)||r.qty<=0||!dateOK(r.date)||o.placed&&r.date<o.placed||String(r.note||'').length>1200)return 'Phiếu nhận hàng không hợp lệ.';rids.add(r.id);rcount[r.orderId]=(rcount[r.orderId]||0)+r.qty}
 for(let o of x.orders){let got=round2(rcount[o.id]||0);if(got>o.qty+0.001||got>0&&['Nháp','Hủy'].includes(o.state)||got===o.qty&&o.state==='Đã đặt'||got<o.qty&&o.state==='Đã nhận')return 'Số nhận hoặc trạng thái đơn mua không hợp lệ.'}
 let vids=new Set();for(let v of x.movements){if(!v.id||vids.has(v.id)||!mids.has(v.materialId)||!Number.isFinite(v.delta)||v.delta===0||!dateOK(v.date)||!v.reason||String(v.reason).length>500)return 'Điều chỉnh tồn không hợp lệ.';vids.add(v.id)}
 for(let m of x.materials)if(stock(m,x)<-0.001)return 'Tồn kho hiện tại không được âm.';
 let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ không lưu được. Hãy tải JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,reason,materialId='',orderId=''){db.audit.push({id:uid(),action,reason,materialId,orderId,at:new Date().toISOString()})}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function cards(){let s=summary();return `<div class="metrics"><div><small>Nguyên liệu</small><strong>${s.materials}</strong></div><div><small>Loại cần đặt</small><strong>${s.toBuy}</strong></div><div><small>Nguy cơ thiếu</small><strong>${s.risk}</strong></div><div><small>Đơn vị cần đặt*</small><strong>${qty(s.units)}</strong></div><div><small>Tiền mua dự kiến</small><strong>${money(s.cost)}</strong></div></div><p class="note">* Tổng số lượng chỉ để tham khảo nếu các nguyên liệu có đơn vị tính khác nhau.</p>`}
function home(){let a=db.materials.filter(m=>calc(m).need>0).sort((a,b)=>calc(b).cost-calc(a).cost);return `<div class="hero"><span>🌿 AI MỞ · MUA NGUYÊN LIỆU</span><h1>Mua đúng lúc, giữ tồn an toàn</h1><p>Theo dõi tồn kho, hàng đã đặt chưa về, mức tiêu hao và đề nghị mua theo từng nguyên liệu.</p><div class="hero-actions">${btn('＋ Thêm nguyên liệu','newMaterial','primary')}${btn('🧾 Danh sách cần mua','buyList')}</div></div>${cards()}${panel('🧭 Quy trình nhanh','<ol><li>Nhập tồn hiện có, hàng đang về, tiêu hao/ngày, thời gian giao và tồn an toàn.</li><li>Xem điểm đặt hàng và số cần đặt; lập đề nghị mua từ gợi ý.</li><li>Đánh dấu đã đặt; khi nhận hàng, ghi từng lần nhận để cập nhật tồn và số đang về.</li><li>Ghi tiêu hao/điều chỉnh tồn có lý do, rồi sao lưu dữ liệu.</li></ol>')}${panel('🚨 Việc mua ưu tiên',a.length?a.map(m=>{let v=calc(m);return `<div class="mini"><button class="link" data-act="openMaterial" data-id="${esc(m.id)}">${esc(m.code)} · ${esc(m.name)}</button><small>${v.risk?'⚠️ Nguy cơ thiếu · ':''}cần ${qty(v.need)} ${esc(m.unit)} · dự kiến ${money(v.cost)}</small></div>`}).join(''):'<p class="success">Chưa có nguyên liệu cần đặt theo công thức hiện tại.</p>')}`}
function materialsPage(){let a=db.materials.filter(m=>(filter==='all'||filter==='buy'&&calc(m).need>0||filter==='risk'&&calc(m).risk)&&(!query||[m.code,m.name,m.unit,m.supplier].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))).sort((a,b)=>a.code.localeCompare(b.code,'vi'));return `<div class="page-head"><div><h1>🌿 Nguyên liệu</h1><p>Điểm đặt hàng = tiêu hao/ngày × thời gian giao + tồn an toàn.</p></div>${btn('＋ Thêm nguyên liệu','newMaterial','primary')}</div><div class="card"><div class="filters"><label>Tìm nguyên liệu<input id="search" value="${esc(query)}" placeholder="Mã, tên, nhà cung cấp"></label><label>Lọc<select id="materialFilter"><option value="all" ${filter==='all'?'selected':''}>Tất cả</option><option value="buy" ${filter==='buy'?'selected':''}>Cần đặt</option><option value="risk" ${filter==='risk'?'selected':''}>Nguy cơ thiếu</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Nguyên liệu</th><th>Tồn hiện có</th><th>Đã đặt chưa về</th><th>Đủ dùng</th><th>Điểm đặt</th><th>Cần đặt</th><th>Tiền dự kiến</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${a.map(m=>{let v=calc(m);return `<tr><td><button class="link" data-act="openMaterial" data-id="${esc(m.id)}">${esc(m.code)}</button><small>${esc(m.name)} · ${esc(m.unit)}</small></td><td>${qty(v.available)}</td><td>${qty(v.pending)}</td><td>${v.daysSupply===null?'Không tiêu hao':qty(v.daysSupply)+' ngày'}</td><td>${qty(v.point)}</td><td>${qty(v.need)}</td><td>${money(v.cost)}</td><td>${alerts(m).length?`<span class="pill ${v.risk?'red':'amber'}">${esc(v.risk?'Nguy cơ thiếu':'Cần đặt')}</span>`:'—'}</td><td>${btn('Xem','openMaterial','small',m.id)}</td></tr>`}).join('')||'<tr><td colspan="9">Chưa có nguyên liệu phù hợp.</td></tr>'}</tbody></table></div></div>`}
function materialDetail(){let m=material(selected);if(!m){page='materials';return materialsPage()}let v=calc(m),po=db.orders.filter(o=>o.materialId===m.id).sort((a,b)=>b.created.localeCompare(a.created)),movement=db.movements.filter(x=>x.materialId===m.id).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-head"><div><button class="link" data-act="materials">← Nguyên liệu</button><h1>🌿 ${esc(m.code)} · ${esc(m.name)}</h1><p>${esc(m.unit)} · ${esc(m.supplier||'Chưa ghi nhà cung cấp')}</p></div><div class="actions no-print">${btn('＋ Đề nghị mua','newPO','primary',m.id)}${btn('± Điều chỉnh tồn','newMovement','',m.id)}${btn('Sửa nguyên liệu','editMaterial','',m.id)}${btn('🖨️ In','print')}</div></div><div class="metrics"><div><small>Tồn hiện có</small><strong>${qty(v.available)} ${esc(m.unit)}</strong></div><div><small>Đã đặt chưa về</small><strong>${qty(v.pending)}</strong></div><div><small>Đủ dùng</small><strong>${v.daysSupply===null?'—':qty(v.daysSupply)+' ngày'}</strong></div><div><small>Điểm đặt hàng</small><strong>${qty(v.point)}</strong></div><div><small>Gợi ý đặt thêm</small><strong>${qty(v.need)}</strong></div></div><div class="two">${panel('📐 Cơ sở tính',`<dl><dt>Tồn gốc</dt><dd>${qty(m.baseStock)} ${esc(m.unit)}</dd><dt>Đã đặt gốc chưa về</dt><dd>${qty(m.baseOrdered)} ${esc(m.unit)}</dd><dt>Tiêu hao mỗi ngày</dt><dd>${qty(m.daily)} ${esc(m.unit)}</dd><dt>Thời gian giao</dt><dd>${m.lead} ngày lịch</dd><dt>Tồn an toàn</dt><dd>${qty(m.safety)} ${esc(m.unit)}</dd><dt>Giá mua dự kiến</dt><dd>${money(m.price)}/${esc(m.unit)}</dd><dt>Tiền gợi ý đặt</dt><dd><b>${money(v.cost)}</b></dd></dl><p class="muted">Giá trong đề nghị/đơn mua được chụp riêng lúc tạo; sửa giá nguyên liệu không đổi đơn cũ.</p>`)}${panel('🚨 Cảnh báo',alerts(m).length?`<ul>${alerts(m).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Cần đặt:</b> ${qty(v.need)} ${esc(m.unit)} · ${money(v.cost)}</p>`:'<p class="success">Chưa cần đặt thêm theo số đang nhập.</p><p class="muted">Hàng đang về gốc không có ngày dự kiến. Cảnh báo là tín hiệu quản trị, không xác nhận chắc chắn ngày hàng đến.</p>')}</div>${panel('🧾 Đề nghị & đơn mua',`<div class="actions no-print">${btn('＋ Tạo đề nghị','newPO','primary',m.id)}</div><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Ngày</th><th>Số lượng</th><th>Đã nhận</th><th>Còn về</th><th>Đơn giá</th><th>Ngày dự kiến</th><th>Trạng thái</th><th></th></tr></thead><tbody>${po.map(o=>`<tr><td><button class="link" data-act="openPO" data-id="${esc(o.id)}">${esc(o.code)}</button></td><td>${fmt(o.created)}</td><td>${qty(o.qty)}</td><td>${qty(received(o.id))}</td><td>${qty(o.qty-received(o.id))}</td><td>${money(o.price)}</td><td>${fmt(o.eta)}</td><td>${esc(o.state)}</td><td>${btn('Xem','openPO','small',o.id)}</td></tr>`).join('')||'<tr><td colspan="9">Chưa có đề nghị hoặc đơn mua.</td></tr>'}</tbody></table></div>`)}${panel('📦 Lịch sử điều chỉnh tồn',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Thay đổi</th><th>Lý do</th></tr></thead><tbody>${movement.map(x=>`<tr><td>${fmt(x.date)}</td><td>${x.delta>0?'+':''}${qty(x.delta)} ${esc(m.unit)}</td><td>${esc(x.reason)}</td></tr>`).join('')||'<tr><td colspan="3">Chưa có điều chỉnh tồn.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký',db.audit.filter(a=>a.materialId===m.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có nhật ký.</p>')}`}
function ordersPage(){let arr=db.orders.slice().sort((a,b)=>b.created.localeCompare(a.created));return `<div class="page-head"><div><h1>🧾 Đề nghị & đơn mua</h1><p>Nháp chưa cộng vào hàng đang về; đơn đã đặt được tính.</p></div>${btn('＋ Tạo đề nghị','newPO','primary')}</div>${panel('Danh sách',`<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Nguyên liệu</th><th>Nhà cung cấp</th><th>Ngày đề nghị</th><th>Số lượng</th><th>Đã nhận</th><th>Giá trị chụp</th><th>Dự kiến về</th><th>Trạng thái</th><th></th></tr></thead><tbody>${arr.map(o=>{let m=material(o.materialId);return `<tr><td><button class="link" data-act="openPO" data-id="${esc(o.id)}">${esc(o.code)}</button></td><td>${esc(m?.code||'—')} · ${esc(m?.name||'—')}</td><td>${esc(o.supplier||'—')}</td><td>${fmt(o.created)}</td><td>${qty(o.qty)} ${esc(m?.unit||'')}</td><td>${qty(received(o.id))}</td><td>${money(o.qty*o.price)}</td><td>${fmt(o.eta)}</td><td>${esc(o.state)}</td><td>${btn('Xem','openPO','small',o.id)}</td></tr>`}).join('')||'<tr><td colspan="10">Chưa có đề nghị mua.</td></tr>'}</tbody></table></div>`)}`}
function poDetail(){let o=purchase(selected);if(!o){page='orders';return ordersPage()}let m=material(o.materialId),got=received(o.id),rr=receiptsFor(o.id).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="page-head"><div><button class="link" data-act="orders">← Đơn mua</button><h1>🧾 ${esc(o.code)}</h1><p>${esc(m.code)} · ${esc(m.name)} · ${esc(o.state)}</p></div><div class="actions no-print">${o.state==='Nháp'?btn('Sửa đề nghị','editPO','',o.id)+btn('Đánh dấu đã đặt','placePO','primary',o.id)+btn('Hủy đề nghị','cancelPO','danger',o.id):''}${o.state==='Đã đặt'?btn('＋ Nhận hàng','newReceipt','primary',o.id)+btn('Sửa ngày giao','editEta','',o.id)+(got===0?btn('Hủy đơn','cancelPO','danger',o.id):''):''}${btn('🖨️ In','print')}</div></div><div class="metrics"><div><small>Đặt mua</small><strong>${qty(o.qty)} ${esc(m.unit)}</strong></div><div><small>Đã nhận</small><strong>${qty(got)}</strong></div><div><small>Còn chưa về</small><strong>${qty(o.qty-got)}</strong></div><div><small>Đơn giá chụp</small><strong>${money(o.price)}</strong></div><div><small>Giá trị đơn</small><strong>${money(o.qty*o.price)}</strong></div></div>${panel('ℹ️ Thông tin đơn',`<dl><dt>Nhà cung cấp</dt><dd>${esc(o.supplier||'—')}</dd><dt>Ngày đề nghị</dt><dd>${fmt(o.created)}</dd><dt>Ngày đặt</dt><dd>${fmt(o.placed)}</dd><dt>Dự kiến về</dt><dd>${fmt(o.eta)}</dd><dt>Ghi chú</dt><dd>${esc(o.note||'—')}</dd></dl><p class="muted">Hàng được cộng tồn khi ghi nhận phiếu về. Số đặt chưa về giảm theo từng lần nhận.</p>`)}${panel('📦 Các lần nhận hàng',`<div class="actions no-print">${o.state==='Đã đặt'?btn('＋ Nhận hàng','newReceipt','primary',o.id):''}</div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Số lượng</th><th>Chứng từ</th><th>Ghi chú</th><th></th></tr></thead><tbody>${rr.map(r=>`<tr><td>${fmt(r.date)}</td><td>${qty(r.qty)} ${esc(m.unit)}</td><td>${esc(r.doc||'—')}</td><td>${esc(r.note||'—')}</td><td class="no-print">${btn('Sửa','editReceipt','small',r.id)}</td></tr>`).join('')||'<tr><td colspan="5">Chưa nhận hàng.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký đơn',db.audit.filter(a=>a.orderId===o.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có thay đổi.</p>')}`}
function buyList(){let arr=db.materials.filter(m=>calc(m).need>0).sort((a,b)=>calc(b).cost-calc(a).cost),s=summary();return `<div class="page-head"><div><h1>🛒 Danh sách cần mua</h1><p>Gợi ý theo tồn hiện có + hàng đã đặt chưa về tại ngày ${fmt(db.settings.asof)}.</p></div>${btn('🖨️ In danh sách','print')}</div>${cards()}${panel('Ưu tiên mua',`<div class="table-wrap"><table><thead><tr><th>Nguyên liệu</th><th>ĐVT</th><th>Tồn</th><th>Đang về</th><th>Điểm đặt</th><th>Cần đặt</th><th>Giá</th><th>Tiền dự kiến</th><th>Nguy cơ</th><th></th></tr></thead><tbody>${arr.map(m=>{let v=calc(m);return `<tr><td>${esc(m.code)} · ${esc(m.name)}</td><td>${esc(m.unit)}</td><td>${qty(v.available)}</td><td>${qty(v.pending)}</td><td>${qty(v.point)}</td><td>${qty(v.need)}</td><td>${money(m.price)}</td><td>${money(v.cost)}</td><td>${v.risk?'Có':'—'}</td><td class="no-print">${btn('Lập đề nghị','newPO','small',m.id)}</td></tr>`}).join('')||'<tr><td colspan="10">Chưa có nguyên liệu cần đặt.</td></tr>'}<tr><th colspan="7">Tổng tiền dự kiến</th><th>${money(s.cost)}</th><th colspan="2"></th></tr></tbody></table></div><p class="note">Danh sách là gợi ý. Hàng đã đặt gốc chưa có ngày về, không thể suy ra chắc chắn ngày hết hàng.</p>`)}`}

function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Công thức và cách dùng',`<ol><li>Thêm nguyên liệu và nhập tồn kho, hàng đã đặt chưa về, tiêu hao mỗi ngày, thời gian giao, tồn an toàn và giá.</li><li>Ngày đủ dùng = tồn hiện có ÷ tiêu hao/ngày, làm tròn một chữ số; nếu không tiêu hao, app ghi “Không tiêu hao”.</li><li>Điểm đặt hàng = tiêu hao/ngày × thời gian giao + tồn an toàn, làm tròn đơn vị. Gợi ý đặt thêm = max(0, điểm đặt − tồn hiện có − hàng đang về).</li><li>Tạo đề nghị mua, rà số lượng/đơn giá, đánh dấu đã đặt. Khi nhận hàng, nhập từng lần; tồn tăng và hàng đang về giảm.</li><li>Nếu “đã đặt chưa về” là số gốc không có đơn chi tiết, dùng nút “Nhận hàng đang về gốc” trên trang nguyên liệu để giảm số đang về và tăng tồn có nhật ký.</li><li>Ghi tiêu hao hoặc điều chỉnh tồn bằng số âm/dương có lý do. Sao lưu dữ liệu định kỳ.</li></ol>`)}${panel('Giới hạn',`<p>Hàng đã đặt gốc là một số tổng không có ngày dự kiến. Công thức nguy cơ thiếu là tín hiệu nội bộ theo mức tiêu hao trung bình; app cảnh báo thêm nếu đơn có lịch về sau số ngày đủ dùng. Chưa xét biến động nhu cầu, hàng bị khóa hoặc công suất sản xuất. Chi phí là dự kiến theo đơn giá nhập, không phải giá mua đã quyết toán.</p>`)}`}

function sheets(){return [{name:'Nguyen lieu',rows:[HM,...db.materials.map(m=>[m.id,m.code,m.name,m.unit,m.supplier,m.baseStock,m.baseOrdered,m.daily,m.lead,m.safety,m.price,m.note])]},{name:'Don mua',rows:[HO,...db.orders.map(o=>[o.id,o.materialId,o.code,o.supplier,o.qty,o.price,o.created,o.placed,o.eta,o.state,o.note])]},{name:'Nhan hang',rows:[HR,...db.receipts.map(r=>[r.id,r.orderId,r.date,r.qty,r.doc,r.note])]},{name:'Dieu chinh',rows:[HV,...db.movements.map(v=>[v.id,v.materialId,v.date,v.delta,v.reason])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.materialId,a.orderId,a.at])]},{name:'Cai dat',rows:[HC,[db.settings.asof]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'ke-hoach-mua-nguyen-lieu.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Nguyen lieu',HM],['Don mua',HO],['Nhan hang',HR],['Dieu chinh',HV],['Nhat ky',HA],['Cai dat',HC]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng 6 sheet do app xuất.');x=empty();x.settings.asof=String(b['Cai dat'][1]?.[0]);x.materials=b['Nguyen lieu'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),name:String(r[2]),unit:String(r[3]),supplier:String(r[4]||''),baseStock:Number(r[5]),baseOrdered:Number(r[6]),daily:Number(r[7]),lead:Number(r[8]),safety:Number(r[9]),price:Number(r[10]),note:String(r[11]||'')}));x.orders=b['Don mua'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),materialId:String(r[1]),code:String(r[2]),supplier:String(r[3]||''),qty:Number(r[4]),price:Number(r[5]),created:String(r[6]),placed:String(r[7]||''),eta:String(r[8]||''),state:String(r[9]),note:String(r[10]||'')}));x.receipts=b['Nhan hang'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),orderId:String(r[1]),date:String(r[2]),qty:Number(r[3]),doc:String(r[4]||''),note:String(r[5]||'')}));x.movements=b['Dieu chinh'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),materialId:String(r[1]),date:String(r[2]),delta:Number(r[3]),reason:String(r[4])}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),materialId:String(r[3]||''),orderId:String(r[4]||''),at:String(r[5])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.materials.length} nguyên liệu?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty();for(let r of PROCUREMENT_SAMPLE.nl)x.materials.push({id:uid(),code:r[0],name:r[1],unit:'đơn vị',supplier:'',baseStock:r[2],baseOrdered:r[3],daily:r[4],lead:r[5],safety:r[6],price:r[7],note:'Nguồn mẫu chưa ghi ĐVT, nhà cung cấp hoặc lịch hàng đang về.'});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;
 if(k==='newMaterial')openModal('material');else if(k==='editMaterial')openModal('material',id);else if(k==='newPO')openModal('po','',id);else if(k==='editPO')openModal('po',id);else if(k==='newReceipt')openModal('receipt','',id);else if(k==='editReceipt'){let r=db.receipts.find(y=>y.id===id);openModal('receipt',id,r.orderId)}else if(k==='newMovement')openModal('movement','',id);else if(k==='receiveBaseline')openModal('baseline','',id);
 else if(k==='openMaterial'){selected=id;page='material';render()}else if(k==='openPO'){selected=id;page='po';render()}else if(k==='materials'){page='materials';render()}else if(k==='buyList'){page='buy';render()}else if(k==='orders'){page='orders';render()}
 else if(k==='placePO'){let o=purchase(id);if(o.state!=='Nháp')return;if(!o.supplier||!o.eta){alert('Cần nhà cung cấp và ngày dự kiến về trước khi đánh dấu đã đặt.');return}if(o.created>today()||o.eta<today()){alert('Ngày đề nghị không được ở tương lai và ngày dự kiến về không được trước hôm nay.');return}let reason=prompt('Mã xác nhận / ghi chú đặt mua:');if(reason===null)return;if(!reason.trim()){alert('Cần ghi chú đặt mua.');return}o.placed=today();o.state='Đã đặt';audit('Đánh dấu đã đặt',reason.trim(),o.materialId,o.id);save()}
 else if(k==='cancelPO'){let o=purchase(id);if(received(o.id)>0){alert('Đơn đã nhận một phần; không thể hủy trực tiếp.');return}let reason=prompt('Lý do hủy đề nghị/đơn:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do hủy.');return}o.state='Hủy';audit('Hủy đơn mua',reason.trim(),o.materialId,o.id);save()}
 else if(k==='editEta'){let o=purchase(id),v=prompt('Ngày về dự kiến mới (YYYY-MM-DD):',o.eta);if(v===null)return;if(!dateOK(v)||o.placed&&v<o.placed){alert('Ngày dự kiến không hợp lệ.');return}let reason=prompt('Lý do đổi ngày về:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}let prev=o.eta;o.eta=v;audit('Sửa ngày dự kiến',fmt(prev)+' → '+fmt(v)+' · '+reason.trim(),o.materialId,o.id);save()}
 else if(k==='saveSettings'){let asof=String(new FormData($('#settingsForm')).get('asof'));if(!dateOK(asof)){alert('Ngày báo cáo không hợp lệ.');return}db.settings.asof=asof;save()}
 else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let n=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(n,n)}});
document.addEventListener('change',e=>{if(e.target.id==='materialFilter'){filter=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();
$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};
$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};
render();window.ProcurementApp={getDB:()=>clone(db),validate,summary,calc,alerts,arrivalRisk,stock,onOrder,received,loadSample,encode,decode,sheets,importFile};
</script></body></html>
