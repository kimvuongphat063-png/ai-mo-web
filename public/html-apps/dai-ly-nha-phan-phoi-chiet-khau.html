function dashboard(){let s=sums(),r=stats().sort((a,b)=>b.gross-a.gross);return hero('Đại lý & nhà phân phối','Chiết khấu, công nợ, chỉ tiêu quý và thưởng theo chính sách công ty.')+'<div class="card"><div class="toolbar">'+periodPicker()+'<span class="grow"></span><button class="btn primary" data-page="orders">+ Ghi đơn hàng</button></div><div class="grid metrics">'+metric('Doanh số niêm yết',money(s.gross),s.orderCount+' đơn')+metric('Sau chiết khấu',money(s.due))+metric('Đã thanh toán',money(s.paid))+metric('Còn nợ',money(s.debt))+metric('Thưởng dự kiến',money(s.bonus))+metric('Đại lý vượt hạn mức',s.over)+'</div>'+(scope==='all'?'<p class="hint">Thưởng ở phạm vi toàn bộ lịch sử chỉ để đối chiếu công thức file gốc. Khi vận hành, chọn từng quý để tính thưởng theo chỉ tiêu quý.</p>':'')+'</div><div class="grid two"><div class="card"><h2>Doanh số theo đại lý</h2>'+ (r.length?r.map(x=>'<div class="statline"><span>'+esc(x.name)+'<small class="muted"> · '+esc(x.code)+'</small></span><b>'+money(x.gross)+'</b></div><div class="bar"><i style="width:'+Math.min(100,x.gross/(r[0]?.gross||1)*100)+'%"></i></div>').join(''):emptyRow())+'</div><div class="card"><h2>Cảnh báo công nợ</h2>'+ (r.filter(x=>x.warn).length?r.filter(x=>x.warn).map(x=>'<div class="statline"><span><b>'+esc(x.name)+'</b><small class="muted"> · '+esc(x.warn)+'</small></span><strong>'+money(x.debt)+'</strong></div>').join(''):emptyRow('Không có đại lý vượt hạn mức hoặc thanh toán thừa.'))+'</div></div><div class="card"><h2>Đối chiếu đại lý</h2>'+resultTable()+'</div>'}
function resultTable(q=scope){return table([['Đại lý'],['Khu vực'],['Đơn','num'],['Doanh số','num'],['Sau CK','num'],['Đã trả','num'],['Công nợ','num'],['Đạt chỉ tiêu','num'],['Thưởng','num'],['Cảnh báo']],stats(q).map(r=>'<tr><td><b>'+esc(r.name)+'</b><small>'+esc(r.code)+'</small></td><td>'+esc(r.area||'—')+'</td><td class="num">'+r.orderCount+'</td><td class="num">'+money(r.gross)+'</td><td class="num">'+money(r.due)+'</td><td class="num">'+money(r.paid)+'</td><td class="num">'+money(r.debt)+'</td><td class="num">'+pct(r.attain)+'</td><td class="num">'+money(r.bonus)+'</td><td>'+(r.warn?badge(r.warn,'warn'):'—')+'</td></tr>'))}
function dealersPage(){let a=db.dealers.filter(x=>[x.code,x.name,x.area,x.phone].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));return hero('Danh mục đại lý','Mức chiết khấu và hạn mức theo từng đại lý; đơn đã lập giữ tỷ lệ chiết khấu tại thời điểm tạo.')+'<div class="card"><div class="toolbar"><input id="search" placeholder="Tìm mã, tên, khu vực..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="dealer">+ Thêm đại lý</button></div>'+table([['Mã'],['Đại lý'],['Khu vực'],['Liên hệ'],['Chiết khấu','num'],['Hạn mức nợ','num'],['Chỉ tiêu quý','num'],['Trạng thái'],['']],a.map(x=>'<tr><td>'+esc(x.code)+'</td><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.area||'—')+'</td><td>'+esc(x.phone||'—')+'</td><td class="num">'+pct(x.discount)+'</td><td class="num">'+money(x.limit)+'</td><td class="num">'+money(x.target)+'</td><td>'+badge(x.active?'Hoạt động':'Tạm ngừng',x.active?'':'warn')+'</td><td class="actions"><button class="btn small" data-edit="dealer:'+esc(x.id)+'">Sửa</button><button class="btn small danger" data-delete="dealer:'+esc(x.id)+'">Xóa</button></td></tr>'))+'</div>'}
function ordersPage(){let a=db.orders.filter(o=>inScope(o.date)&&[o.code,dealer(o.dealerId)?.name,o.customer].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>b.date.localeCompare(a.date));return hero('Đơn hàng đại lý','Theo dõi giá niêm yết, chiết khấu đã chốt theo đơn và số còn phải thu.')+'<div class="card"><div class="toolbar">'+periodPicker()+'<input id="search" placeholder="Tìm mã đơn, đại lý, khách..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="order">+ Thêm đơn</button></div>'+table([['Ngày'],['Mã đơn'],['Đại lý'],['Khách'],['Niêm yết','num'],['CK','num'],['Sau CK','num'],['Đã trả','num'],['Còn nợ','num'],['']],a.map(o=>'<tr><td>'+date(o.date)+'</td><td><b>'+esc(o.code)+'</b></td><td>'+esc(dealer(o.dealerId)?.name||'—')+'</td><td>'+esc(o.customer||'—')+'</td><td class="num">'+money(o.listValue)+'</td><td class="num">'+pct(o.discount)+'</td><td class="num">'+money(net(o))+'</td><td class="num">'+money(paid(o))+'</td><td class="num">'+money(net(o)-paid(o))+'</td><td class="actions"><button class="btn small" data-edit="order:'+esc(o.id)+'">Sửa</button><button class="btn small danger" data-delete="order:'+esc(o.id)+'">Xóa</button></td></tr>'))+'</div>'}
function paymentsPage(){let a=db.payments.filter(p=>{let o=order(p.orderId);return o&&inScope(o.date)&&[o.code,dealer(o.dealerId)?.name,p.reference].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))}).sort((a,b)=>b.date.localeCompare(a.date));return hero('Thanh toán & công nợ','Mỗi khoản thu gắn với một đơn, có ngày, phương thức và mã tham chiếu.')+'<div class="card"><div class="toolbar">'+periodPicker()+'<input id="search" placeholder="Tìm đại lý, mã đơn, tham chiếu..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="payment">+ Ghi thanh toán</button></div>'+table([['Ngày thu'],['Đại lý'],['Đơn'],['Số tiền','num'],['Phương thức'],['Mã tham chiếu'],['Ghi chú'],['']],a.map(p=>{let o=order(p.orderId);return '<tr><td>'+date(p.date)+'</td><td>'+esc(dealer(o.dealerId)?.name||'—')+'</td><td>'+esc(o.code)+'</td><td class="num">'+money(p.amount)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.reference||'—')+'</td><td>'+esc(p.note||'')+'</td><td class="actions"><button class="btn small" data-edit="payment:'+esc(p.id)+'">Sửa</button><button class="btn small danger" data-delete="payment:'+esc(p.id)+'">Xóa</button></td></tr>'}))+'</div>'}
function quartersPage(){let q=scope;return hero('Chỉ tiêu & thưởng quý','Chỉ tiêu và tỷ lệ thưởng có thể đặt riêng cho từng đại lý, từng quý.')+'<div class="card"><div class="toolbar">'+periodPicker()+'<span class="grow"></span><button class="btn primary" data-new="plan">+ Thiết lập chỉ tiêu</button></div><p class="hint">Thưởng dự kiến = giá trị sau chiết khấu trong quý × tỷ lệ thưởng, chỉ khi doanh số niêm yết đạt chỉ tiêu quý. Đây là chính sách nội bộ, không tự sinh khoản phải trả hoặc chứng từ.</p>'+resultTable(q)+'</div><div class="card"><h2>Thiết lập riêng</h2>'+table([['Quý'],['Đại lý'],['Chỉ tiêu','num'],['Tỷ lệ thưởng','num'],['Ghi chú'],['']],db.plans.slice().sort((a,b)=>b.quarter.localeCompare(a.quarter)).map(p=>'<tr><td>'+esc(p.quarter)+'</td><td>'+esc(dealer(p.dealerId)?.name||'—')+'</td><td class="num">'+money(p.target)+'</td><td class="num">'+pct(p.bonusRate)+'</td><td>'+esc(p.note||'')+'</td><td class="actions"><button class="btn small" data-edit="plan:'+esc(p.id)+'">Sửa</button><button class="btn small danger" data-delete="plan:'+esc(p.id)+'">Xóa</button></td></tr>'))+'</div>'}
function reportsPage(){let s=sums();return hero('Báo cáo phân phối','Xem theo quý hoặc toàn bộ lịch sử; in và xuất bảng Excel để lưu hồ sơ quản trị.')+'<div class="card"><div class="toolbar">'+periodPicker()+'<span class="grow"></span><button class="btn" data-action="print">In báo cáo</button><button class="btn primary" data-action="reportXlsx">Xuất Excel</button></div><div class="grid metrics">'+metric('Doanh số',money(s.gross))+metric('Sau chiết khấu',money(s.due))+metric('Đã thu',money(s.paid))+metric('Công nợ',money(s.debt))+metric('Thưởng dự kiến',money(s.bonus))+'</div></div><div class="card"><h2>Chi tiết theo đại lý</h2>'+resultTable()+'</div>'}
function dataPage(){return hero('Dữ liệu & sao lưu','Lưu an toàn và chuyển dữ liệu giữa các máy bằng file tải về.')+'<div class="grid two"><div class="card"><h2>Xuất & sao lưu</h2><div class="toolbar"><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="saveHtml">Tải HTML kèm dữ liệu</button><button class="btn" data-action="allXlsx">Xuất Excel tất cả</button><button class="btn" data-action="ordersCsv">Xuất CSV đơn</button></div><p class="muted">Bản HTML kèm dữ liệu ưu tiên dữ liệu bên trong file khi mở. Sao lưu JSON nên giữ riêng để khôi phục.</p></div><div class="card"><h2>Nhập & khôi phục</h2><div class="formgrid"><label class="field">Khôi phục JSON<input type="file" id="restore" accept=".json,application/json"></label><label class="field">Nhập đại lý CSV/XLSX<input type="file" id="importDealers" accept=".csv,.xlsx"></label><label class="field">Nhập đơn CSV/XLSX<input type="file" id="importOrders" accept=".csv,.xlsx"></label></div><p class="muted">Nhập đại lý trước, rồi nhập đơn. Mã đại lý phải khớp; mã đơn không được trùng.</p></div></div><div class="card"><h2>Dữ liệu mẫu gốc</h2><p>6 đại lý và 20 đơn từ file tham chiếu. Chỉ nạp khi các sổ đang trống; thanh toán của mẫu được ghi thành khoản thu tương ứng từng đơn.</p><button class="btn primary" data-action="sample">Nạp mẫu</button></div><div class="card"><h2>Cài đặt chung</h2><div class="formgrid"><label class="field">Tên đơn vị<input id="company" value="'+esc(db.settings.company)+'"></label><label class="field">Tỷ lệ thưởng mặc định (%)<input id="bonusRate" type="number" min="0" max="100" step="0.01" value="'+db.settings.bonusRate+'"></label></div><p><button class="btn" data-action="settings">Lưu cài đặt</button></p><p class="hint">Mức thưởng và chiết khấu do doanh nghiệp thiết lập. File không tự lập hóa đơn hay quyết định nghĩa vụ thuế.</p></div><div class="card"><h2>Xóa dữ liệu trên trình duyệt này</h2><button class="btn danger" data-action="clear">Xóa toàn bộ</button></div>'}
function guidePage(){return hero('Hướng dẫn sử dụng','Quy trình từ thiết lập đại lý đến đối soát công nợ và thưởng.')+'<div class="card"><h2>Quy trình đề xuất</h2><ol><li>Nhập đại lý, mức chiết khấu mặc định, hạn mức công nợ và chỉ tiêu quý.</li><li>Thiết lập chỉ tiêu và tỷ lệ thưởng riêng cho quý khi chính sách khác mức mặc định.</li><li>Nhập từng đơn theo giá niêm yết. App chụp tỷ lệ chiết khấu vào đơn để giữ lịch sử.</li><li>Ghi khoản thanh toán theo từng đơn; đối chiếu công nợ và khoản thanh toán vượt.</li><li>Chọn đúng quý để xem mức đạt chỉ tiêu, thưởng dự kiến và xuất báo cáo.</li><li>Sao lưu JSON định kỳ; tải HTML kèm dữ liệu khi cần chuyển sang máy khác.</li></ol></div><div class="card"><h2>Cách tính</h2><p>Giá sau chiết khấu = làm tròn(giá niêm yết × (1 − tỷ lệ chiết khấu/100)). Công nợ = giá sau chiết khấu − tổng khoản đã thanh toán. Tỷ lệ đạt chỉ tiêu = doanh số niêm yết / chỉ tiêu × 100. Khi đạt chỉ tiêu, thưởng dự kiến = làm tròn(tổng sau chiết khấu × tỷ lệ thưởng/100).</p><p>Phạm vi “Toàn bộ lịch sử” dùng để đối chiếu số gốc. Để vận hành theo quý, chọn quý tương ứng. Khoản thanh toán gắn với đơn, nên báo cáo theo quý của đơn ngay cả khi ngày thu nằm ở quý khác.</p><p class="hint">Thanh toán thừa được hiển thị là công nợ âm để đối soát; app không tự phân bổ số thừa sang đơn khác.</p></div>'}
function render(){let names={dashboard:'Tổng quan',dealers:'Đại lý',orders:'Đơn hàng',payments:'Thanh toán',quarters:'Chỉ tiêu & thưởng',reports:'Báo cáo',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]',$('.nav')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=({dashboard,dealers:dealersPage,orders:ordersPage,payments:paymentsPage,quarters:quartersPage,reports:reportsPage,data:dataPage,guide:guidePage})[page]()}
const specs={
 dealer:{title:'Đại lý / nhà phân phối',fields:[['code','Mã đại lý','text'],['name','Tên đại lý','text'],['area','Khu vực','text'],['phone','Điện thoại','text'],['discount','Chiết khấu mặc định (%)','number'],['limit','Hạn mức công nợ','number'],['target','Chỉ tiêu doanh số quý','number'],['active','Trạng thái','active']]},
 order:{title:'Đơn hàng',fields:[['date','Ngày đơn','date'],['code','Mã đơn','text'],['dealerId','Đại lý','dealer'],['customer','Khách hàng / diễn giải','text'],['listValue','Giá niêm yết','number'],['discount','Chiết khấu đơn (%)','number'],['note','Ghi chú','textarea']]},
 payment:{title:'Khoản thanh toán',fields:[['date','Ngày thu','date'],['orderId','Đơn hàng','order'],['amount','Số tiền','number'],['method','Phương thức','method'],['reference','Mã tham chiếu','text'],['note','Ghi chú','textarea']]},
 plan:{title:'Chỉ tiêu & thưởng quý',fields:[['quarter','Quý','quarter'],['dealerId','Đại lý','dealer'],['target','Chỉ tiêu niêm yết','number'],['bonusRate','Tỷ lệ thưởng (%)','number'],['note','Ghi chú','textarea']]}
};
function options(type,value){let a=type==='dealer'?db.dealers.map(x=>[x.id,x.code+' · '+x.name]):type==='order'?db.orders.map(o=>[o.id,o.code+' · '+(dealer(o.dealerId)?.name||'')+' · '+money(net(o)-paid(o))+' còn nợ']):type==='active'?[['true','Hoạt động'],['false','Tạm ngừng']]:type==='method'?[['Chuyển khoản','Chuyển khoản'],['Tiền mặt','Tiền mặt'],['Khác','Khác']]:[];return '<option value="">Chọn...</option>'+a.map(([v,t])=>'<option value="'+esc(v)+'" '+(String(v)===String(value)?'selected':'')+'>'+esc(t)+'</option>').join('')}
function nextOrderCode(){let n=Math.max(0,...db.orders.map(o=>/^DL-\d+$/.test(o.code)?+o.code.slice(3):0));return 'DL-'+String(n+1).padStart(4,'0')}
function openModal(type,id=''){let list=db[type==='dealer'?'dealers':type==='order'?'orders':type==='payment'?'payments':'plans'],old=list.find(x=>x.id===id)||{},data={date:today(),code:type==='order'?nextOrderCode():'',quarter:scope==='all'?currentQuarter():scope,discount:0,limit:0,target:0,bonusRate:db.settings.bonusRate,active:true,method:'Chuyển khoản',...old};if(type==='order'&&!id&&db.dealers.length)data.dealerId=db.dealers[0].id,data.discount=db.dealers[0].discount;if(type==='payment'&&!id&&db.orders.length)data.orderId=db.orders[0].id;if(type==='plan'&&!id&&db.dealers.length)data.dealerId=db.dealers[0].id,data.target=db.dealers[0].target;if(type==='dealer'&&!id)data.discount=0;modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+specs[type].title;$('#fields').innerHTML=specs[type].fields.map(([k,label,t])=>'<label class="field '+(t==='textarea'?'wide':'')+'">'+esc(label)+(t==='dealer'||t==='order'||t==='active'||t==='method'?'<select data-field="'+k+'">'+options(t,data[k])+'</select>':t==='textarea'?'<textarea data-field="'+k+'">'+esc(data[k]||'')+'</textarea>':'<input data-field="'+k+'" type="'+(t==='quarter'?'text':t)+'" '+(t==='number'?'step="any" min="0"':'')+' value="'+esc(data[k]??'')+'">')+'</label>').join('');$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function formValue(){let out={};$$('[data-field]',$('#fields')).forEach(el=>out[el.dataset.field]=el.value);return out}
function numeric(v){let n=Number(String(v).trim().replace(/\s/g,'').replace(/\./g,'').replace(',','.'));return n}
function validMoney(v){return Number.isSafeInteger(v)&&v>=0&&v<=1e12}
function validateRecord(type,v,id=''){
 if(type==='dealer'){
  v.code=String(v.code||'').trim();v.name=String(v.name||'').trim();v.discount=Number(v.discount);v.limit=numeric(v.limit);v.target=numeric(v.target);v.active=v.active==='true'||v.active===true;
  if(!v.code||!v.name)return 'Cần nhập mã và tên đại lý.';
  if(db.dealers.some(x=>x.id!==id&&x.code.toLowerCase()===v.code.toLowerCase()))return 'Mã đại lý đã có.';
  if(!Number.isFinite(v.discount)||v.discount<0||v.discount>100||!validMoney(v.limit)||!validMoney(v.target))return 'Chiết khấu, hạn mức hoặc chỉ tiêu không hợp lệ.';
 }
 if(type==='order'){
  v.code=String(v.code||'').trim();v.listValue=numeric(v.listValue);v.discount=Number(v.discount);
  if(!validDate(v.date)||!v.code||!dealer(v.dealerId))return 'Cần ngày hợp lệ, mã đơn và đại lý.';
  if(db.orders.some(x=>x.id!==id&&x.code.toLowerCase()===v.code.toLowerCase()))return 'Mã đơn đã có.';
  if(!validMoney(v.listValue)||!Number.isFinite(v.discount)||v.discount<0||v.discount>100)return 'Giá trị hoặc chiết khấu không hợp lệ.';
  if(id){let already=db.payments.filter(p=>p.orderId===id).reduce((a,p)=>a+p.amount,0);let old=order(id);if(old.dealerId!==v.dealerId&&already)return 'Đơn đã thu tiền: không được đổi đại lý. Hãy xử lý khoản thu trước.';if(already>Math.round(v.listValue*(1-v.discount/100))&&!confirm('Giá mới nhỏ hơn số đã thu. Số thừa sẽ hiện là công nợ âm. Tiếp tục?'))return 'Đã hủy sửa đơn.'}
 }
 if(type==='payment'){
  v.amount=numeric(v.amount);let o=order(v.orderId);
  if(!validDate(v.date)||!o)return 'Cần ngày hợp lệ và đơn hàng.';
  if(!validMoney(v.amount)||v.amount===0)return 'Số tiền phải lớn hơn 0 và không vượt 1.000 tỷ.';
  if(!['Chuyển khoản','Tiền mặt','Khác'].includes(v.method))return 'Phương thức không hợp lệ.';
  let other=db.payments.filter(p=>p.orderId===v.orderId&&p.id!==id).reduce((a,p)=>a+p.amount,0);
  if(other+v.amount>net(o)&&!confirm('Tổng thu vượt giá sau chiết khấu. Số thừa sẽ hiện là công nợ âm. Tiếp tục?'))return 'Đã hủy ghi khoản thu.';
 }
 if(type==='plan'){
  v.target=numeric(v.target);v.bonusRate=Number(v.bonusRate);
  if(!/^\d{4}-Q[1-4]$/.test(v.quarter)||!dealer(v.dealerId))return 'Quý hoặc đại lý không hợp lệ.';
  if(!validMoney(v.target)||!Number.isFinite(v.bonusRate)||v.bonusRate<0||v.bonusRate>100)return 'Chỉ tiêu hoặc tỷ lệ thưởng không hợp lệ.';
  if(db.plans.some(x=>x.id!==id&&x.quarter===v.quarter&&x.dealerId===v.dealerId))return 'Đại lý đã có chỉ tiêu trong quý này.';
 }
 return '';
}
function saveModal(){if(!modal)return;let {type,id}=modal,v=formValue(),error=validateRecord(type,v,id);if(error){$('#modalError').textContent=error;return}let list=db[type==='dealer'?'dealers':type==='order'?'orders':type==='payment'?'payments':'plans'];if(id)Object.assign(list.find(x=>x.id===id),v);else list.push({id:uid(),...v});closeModal();save()}
function deleteRecord(type,id){let list=db[type==='dealer'?'dealers':type==='order'?'orders':type==='payment'?'payments':'plans'],x=list.find(z=>z.id===id);if(!x)return;if(type==='dealer'&&(db.orders.some(o=>o.dealerId===id)||db.plans.some(p=>p.dealerId===id))){alert('Đại lý đã có dữ liệu. Chuyển trạng thái Tạm ngừng thay vì xóa.');return}if(type==='order'&&db.payments.some(p=>p.orderId===id)){alert('Đơn đã có khoản thu. Xóa hoặc điều chỉnh khoản thu trước.');return}if(!confirm('Xóa '+specs[type].title.toLowerCase()+' này?'))return;db[type==='dealer'?'dealers':type==='order'?'orders':type==='payment'?'payments':'plans']=list.filter(z=>z.id!==id);save()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-delete],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;if(page==='quarters'&&scope==='all')scope=currentQuarter();query='';render();window.scrollTo(0,0);return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){let [t,id]=b.dataset.edit.split(':');openModal(t,id);return}if(b.dataset.delete){let [t,id]=b.dataset.delete.split(':');deleteRecord(t,id);return}let a=b.dataset.action;if(a==='close')closeModal();else if(a==='save')saveModal();else if(a==='print')window.print();else if(a==='backup')backup();else if(a==='saveHtml')saveHtml();else if(a==='allXlsx')exportAll();else if(a==='reportXlsx')exportReport();else if(a==='ordersCsv')download('ai-mo-dai-ly-don-hang.csv','text/csv;charset=utf-8',csvRows(orderSheet()));else if(a==='sample')loadSample();else if(a==='settings'){let bonusRate=Number($('#bonusRate').value);if(!Number.isFinite(bonusRate)||bonusRate<0||bonusRate>100){alert('Tỷ lệ thưởng phải trong khoảng 0–100%.');return}db.settings.bonusRate=bonusRate;db.settings.company=$('#company').value.trim();save();alert('Đã lưu cài đặt.')}else if(a==='clear'&&confirm('Xóa toàn bộ dữ liệu trên trình duyệt này? Hãy sao lưu trước khi tiếp tục.')){db=empty();scope='all';page='dashboard';save()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let start=e.target.selectionStart,end=e.target.selectionEnd;render();let el=$('#search');el?.focus();el?.setSelectionRange(start,end)}});
document.addEventListener('change',e=>{if(e.target.id==='scope'){scope=e.target.value;render()}if(e.target.dataset.field==='dealerId'&&modal?.type==='order'&&!modal.id){let x=dealer(e.target.value);if(x)$('#fields [data-field="discount"]').value=x.discount}if(['restore','importDealers','importOrders'].includes(e.target.id)&&e.target.files?.[0]){let f=e.target.files[0];({restore:restoreFile,importDealers,importOrders})[e.target.id](f).catch(err=>alert(err.message||String(err))).finally(()=>{e.target.value=''})}});
function download(name,type,content){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download('ai-mo-dai-ly-sao-luu.json','application/json;charset=utf-8',JSON.stringify(db,null,2))}
function saveHtml(){let doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(db))));download('ai-mo-dai-ly-kem-du-lieu.html','text/html;charset=utf-8','<!doctype html>\n'+doc.outerHTML)}
function validBackup(x){
 if(!shape(x)||typeof x.settings!=='object'||x.dealers.length>1000||x.orders.length>50000||x.payments.length>100000||x.plans.length>10000||[...x.dealers,...x.orders,...x.payments,...x.plans].some(z=>!z||typeof z!=='object')||!Number.isFinite(+x.settings.bonusRate)||x.settings.bonusRate<0||x.settings.bonusRate>100)return false;
 let unique=(a,k)=>new Set(a.map(z=>String(z[k]||'').toLowerCase())).size===a.length;
 if(!unique(x.dealers,'id')||!unique(x.dealers,'code')||!unique(x.orders,'id')||!unique(x.orders,'code')||!unique(x.payments,'id')||!unique(x.plans,'id'))return false;
 let ids=new Set(x.dealers.map(z=>z.id)),oIds=new Set(x.orders.map(z=>z.id));
 for(let d of x.dealers)if(!d.id||!d.code||!d.name||!Number.isFinite(+d.discount)||d.discount<0||d.discount>100||!validMoney(+d.limit)||!validMoney(+d.target))return false;
 for(let o of x.orders)if(!o.id||!o.code||!ids.has(o.dealerId)||!validDate(o.date)||!validMoney(+o.listValue)||!Number.isFinite(+o.discount)||o.discount<0||o.discount>100)return false;
 for(let p of x.payments)if(!p.id||!oIds.has(p.orderId)||!validDate(p.date)||!validMoney(+p.amount)||p.amount===0||!['Chuyển khoản','Tiền mặt','Khác'].includes(p.method))return false;
 let seen=new Set();for(let p of x.plans){let k=p.dealerId+'|'+p.quarter;if(!p.id||!ids.has(p.dealerId)||!/^\d{4}-Q[1-4]$/.test(p.quarter)||!validMoney(+p.target)||!Number.isFinite(+p.bonusRate)||p.bonusRate<0||p.bonusRate>100||seen.has(k))return false;seen.add(k)}
 return true;
}
async function restoreFile(file){if(file.size>15e6)throw Error('File sao lưu vượt 15 MB.');let x=JSON.parse(await file.text());if(!validBackup(x))throw Error('File sao lưu không đúng cấu trúc hoặc dữ liệu không hợp lệ.');if(!confirm('Khôi phục sẽ thay thế toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=x;scope='all';page='dashboard';save();alert('Đã khôi phục dữ liệu.')}
function csvRows(rows){return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function parseCSV(text){text=String(text).replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);return rows}
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseMoney(v){if(typeof v==='number')return v;let s=String(v??'').trim().replace(/[₫đ\s]/gi,'');if(/^\d{1,3}(?:\.\d{3})+(?:,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^\d+,\d+$/.test(s))s=s.replace(',','.');return s===''?0:Number(s)}
function parseDate(v){if(typeof v==='number'&&v>20000&&v<100000)return new Date(Date.UTC(1899,11,30)+v*86400000).toISOString().slice(0,10);let s=String(v??'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
async function readRows(file){if(file.size>10e6)throw Error('File nhập vượt 10 MB.');return file.name.toLowerCase().endsWith('.xlsx')?Object.values(await Excel.read(file))[0]||[]:parseCSV(await file.text())}
function columns(header,map){let h=header.map(norm),out={};for(let [key,names] of Object.entries(map))out[key]=h.findIndex(x=>names.includes(x));return out}
async function importDealers(file){let rows=await readRows(file);if(rows.length<2)throw Error('File cần tiêu đề và dữ liệu.');let ix=columns(rows[0],{code:['ma','madaily'],name:['tendaily','ten','daily'],area:['khuvuc','kv'],discount:['chietkhau','chietkhaupct','ck'],limit:['hanmuccongno','hanmuc'],target:['chitieudoanhsoquy','chitieu'],phone:['dienthoai','sdt']});if(ix.code<0||ix.name<0)throw Error('Thiếu cột Mã hoặc Tên đại lý.');let items=[],seen=new Set();for(let r of rows.slice(1)){if(!r.some(x=>String(x??'').trim()))continue;let g=k=>ix[k]<0?'':r[ix[k]]??'',x={code:String(g('code')).trim(),name:String(g('name')).trim(),area:String(g('area')).trim(),phone:String(g('phone')).trim(),discount:parseMoney(String(g('discount')).replace('%','')),limit:parseMoney(g('limit')),target:parseMoney(g('target')),active:true};if(!x.code||!x.name||!Number.isFinite(x.discount)||x.discount<0||x.discount>100||!validMoney(x.limit)||!validMoney(x.target))throw Error('Đại lý dòng '+(items.length+2)+' không hợp lệ.');if(seen.has(x.code.toLowerCase()))throw Error('Mã đại lý trùng trong file: '+x.code);seen.add(x.code.toLowerCase());items.push(x)}if(!items.length)throw Error('Không có đại lý hợp lệ.');if(db.dealers.length+items.filter(x=>!db.dealers.some(d=>d.code.toLowerCase()===x.code.toLowerCase())).length>1000)throw Error('Vượt 1.000 đại lý.');if(!confirm('Nhập '+items.length+' đại lý? Mã đã có sẽ cập nhật thông tin mặc định; đơn cũ giữ tỷ lệ chiết khấu đã chụp.'))return;for(let x of items){let d=db.dealers.find(y=>y.code.toLowerCase()===x.code.toLowerCase());if(d)Object.assign(d,x);else db.dealers.push({id:uid(),...x})}save();alert('Đã nhập '+items.length+' đại lý.')}
async function importOrders(file){let rows=await readRows(file);if(rows.length<2)throw Error('File cần tiêu đề và dữ liệu.');let ix=columns(rows[0],{date:['ngay','ngaydon'],dealer:['madaily','daily','ten daily','dailyname'],code:['madon','madonhang'],customer:['khachhang','khach'],value:['giatriniemyet','giatridon','giatri','niemyet'],discount:['chietkhau','ck','tylechietkhau'],paid:['dathanhtoan','datra']});if(ix.date<0||ix.dealer<0||ix.value<0)throw Error('Thiếu Ngày, Đại lý hoặc Giá trị niêm yết.');let items=[],payItems=[],seen=new Set(db.orders.map(o=>o.code.toLowerCase()));let next=Math.max(0,...db.orders.map(o=>/^DL-\d+$/.test(o.code)?+o.code.slice(3):0));for(let r of rows.slice(1)){if(!r.some(x=>String(x??'').trim()))continue;let g=k=>ix[k]<0?'':r[ix[k]]??'',day=parseDate(g('date')),who=String(g('dealer')).trim(),d=db.dealers.find(z=>z.code.toLowerCase()===who.toLowerCase()||z.name.toLowerCase()===who.toLowerCase()),code=String(g('code')).trim()||'DL-'+String(++next).padStart(4,'0'),value=parseMoney(g('value')),discount=ix.discount<0||String(g('discount')).trim()===''?d?.discount:parseMoney(String(g('discount')).replace('%','')),paidVal=ix.paid<0||String(g('paid')).trim()===''?0:parseMoney(g('paid'));if(!validDate(day)||!d||!code||!validMoney(value)||!Number.isFinite(discount)||discount<0||discount>100||!validMoney(paidVal))throw Error('Đơn '+code+' không hợp lệ: ngày, đại lý, giá trị, chiết khấu hoặc số đã trả.');if(seen.has(code.toLowerCase()))throw Error('Trùng mã đơn '+code);seen.add(code.toLowerCase());let id=uid();items.push({id,date:day,code,dealerId:d.id,customer:String(g('customer')).trim(),listValue:value,discount,note:''});if(paidVal)payItems.push({id:uid(),date:day,orderId:id,amount:paidVal,method:'Khác',reference:'Nhập từ file',note:''})}if(!items.length)throw Error('Không có đơn hợp lệ.');if(db.orders.length+items.length>50000||db.payments.length+payItems.length>100000)throw Error('Vượt giới hạn dữ liệu.');if(!confirm('Nhập '+items.length+' đơn và '+payItems.length+' khoản đã trả?'))return;db.orders.push(...items);db.payments.push(...payItems);save();alert('Đã nhập '+items.length+' đơn.')}
function loadSample(){if(db.dealers.length||db.orders.length||db.payments.length||db.plans.length){alert('Chỉ nạp mẫu khi các sổ đang trống.');return}if(!confirm('Nạp 6 đại lý và 20 đơn mẫu từ file gốc?'))return;db.dealers=SAMPLE.dl.map(r=>({id:uid(),code:r[0],name:r[1],area:r[2],phone:'',discount:r[3],limit:r[4],target:r[5],active:true}));db.orders=SAMPLE.don.map((r,i)=>({id:uid(),date:addDays(today(),Number(r[0].slice(1))),dealerId:db.dealers.find(d=>d.code===r[1]).id,code:'DL-'+String(i+1).padStart(4,'0'),customer:'',listValue:r[2],discount:db.dealers.find(d=>d.code===r[1]).discount,note:''}));db.payments=SAMPLE.don.map((r,i)=>r[3]>0?{id:uid(),date:db.orders[i].date,orderId:db.orders[i].id,amount:r[3],method:'Khác',reference:'Dữ liệu mẫu gốc',note:''}:null).filter(Boolean);db.settings.bonusRate=1;scope='all';save()}
function dealerSheet(){return [['Mã','Tên đại lý','Khu vực','Chiết khấu (%)','Hạn mức công nợ','Chỉ tiêu doanh số quý','Điện thoại','Trạng thái'],...db.dealers.map(d=>[d.code,d.name,d.area,d.discount,d.limit,d.target,d.phone,d.active?'Hoạt động':'Tạm ngừng'])]}
function orderSheet(os=db.orders){return [['Ngày','Mã đại lý','Mã đơn','Khách hàng','Giá trị niêm yết','Chiết khấu (%)','Giá sau chiết khấu','Đã thanh toán','Còn nợ','Ghi chú'],...os.map(o=>[o.date,dealer(o.dealerId)?.code||'',o.code,o.customer,o.listValue,o.discount,net(o),paid(o),net(o)-paid(o),o.note])]}

function exportAll(){download('ai-mo-dai-ly-toan-bo.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',Excel.workbook([{name:'Đại lý',rows:dealerSheet()},{name:'Đơn hàng',rows:orderSheet()},{name:'Thanh toán',rows:paymentSheet()},{name:'Chỉ tiêu quý',rows:[['Quý','Mã đại lý','Chỉ tiêu','Tỷ lệ thưởng','Ghi chú'],...db.plans.map(p=>[p.quarter,dealer(p.dealerId)?.code||'',p.target,p.bonusRate,p.note])]}]))}
