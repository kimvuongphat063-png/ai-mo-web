function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function summaryCards(t){return `<div class="metrics"><div><small>Doanh thu</small><strong>${money(t.revenue)}</strong></div><div><small>Lãi gộp</small><strong>${money(t.gross)}</strong></div><div><small>Lãi trước thuế</small><strong>${money(t.profit)}</strong></div><div><small>Dòng tiền thuần</small><strong>${money(t.net)}</strong></div><div><small>Số dư tiền mô phỏng</small><strong>${money(t.closingCash)}</strong></div></div>`}
function barChart(rows,field,title){let max=Math.max(1,...rows.map(m=>Math.abs(field==='profit'?metrics(m).profit:field==='net'?metrics(m).net:m.revenue)));return panel(title,rows.length?`<div class="bars">${rows.map(m=>{let value=field==='profit'?metrics(m).profit:field==='net'?metrics(m).net:m.revenue;return `<div><span>${esc(periodLabel(m.period))}</span><b>${money(value)}</b><i style="width:${Math.max(1,Math.abs(value)/max*100)}%;background:${value<0?'#d94450':'#315ee8'}"></i></div>`}).join('')}</div>`:'<p class="muted">Chưa có số liệu để vẽ biểu đồ.</p>')}
function home(){let rows=ordered(),t=totals(),recent=rows.slice(-6);return `<div class="hero"><span>📊 AI MỞ · BÁO CÁO QUẢN TRỊ</span><h1>Doanh thu · Lãi · Tiền</h1><p>Xem sức khỏe kinh doanh theo tháng, giải thích chênh lệch giữa lãi và dòng tiền, rà các ngưỡng cần chú ý.</p><div class="hero-actions">${btn('＋ Thêm tháng số liệu','newMonth','primary')}${btn('📋 Xem các tháng','months')}</div></div>${summaryCards(t)}${panel('📍 Đọc nhanh',`<p><b>${t.months}</b> tháng đã nhập · <b>${t.alerts}</b> tháng có cảnh báo · Biên lãi gộp toàn kỳ <b>${t.margin===null?'—':pct(t.margin)}</b>.</p><p class="muted">Số dư tiền = số dư đầu kỳ do người dùng nhập + tổng dòng tiền thuần của các tháng đã nhập. Không phải số dư đã đối chiếu ngân hàng.</p>`)}<div class="two">${barChart(recent,'revenue','📈 Doanh thu gần nhất')}${barChart(recent,'profit','📉 Lãi trước thuế gần nhất')}</div>${panel('⚠️ Tháng cần chú ý',rows.flatMap(m=>warnings(m).map(w=>`<div class="mini"><button class="link" data-act="openMonth" data-id="${esc(m.id)}">${esc(periodLabel(m.period))}</button><small>${esc(w)}</small></div>`)).join('')||'<p class="success">Chưa có cảnh báo theo ngưỡng từng tháng.</p>')}`}
function tableRows(rows){let bal=balances();return `<div class="table-wrap"><table><thead><tr><th>Kỳ</th><th>Trạng thái</th><th>Doanh thu</th><th>Lãi gộp</th><th>Biên gộp</th><th>Lãi trước thuế</th><th>Dòng tiền</th><th>Số dư tiền*</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${rows.map(m=>{let v=metrics(m),w=warnings(m);return `<tr><td><button class="link" data-act="openMonth" data-id="${esc(m.id)}">${esc(periodLabel(m.period))}</button></td><td>${esc(m.state)}</td><td>${money(m.revenue)}</td><td>${money(v.gross)}</td><td>${v.margin===null?'—':pct(v.margin)}</td><td>${money(v.profit)}</td><td>${money(v.net)}</td><td>${money(bal[m.id])}</td><td>${w.length?`<span class="pill red">${w.length} cảnh báo</span>`:'—'}</td><td>${btn('Xem','openMonth','small',m.id)}</td></tr>`}).join('')||'<tr><td colspan="10">Chưa có tháng số liệu.</td></tr>'}</tbody></table></div><p class="note">* Số dư mô phỏng từ các tháng đã nhập; nếu thiếu kỳ, chuỗi tiền không đầy đủ.</p>`}
function monthsPage(){let years=[...new Set(db.months.map(m=>m.period.slice(0,4)))].sort(),rr=ordered().filter(m=>yearFilter==='all'||m.period.startsWith(yearFilter));return `<div class="page-head"><div><h1>📅 Số liệu theo tháng</h1><p>Nhập sáu số gốc. App tính lãi, biên gộp và dòng tiền.</p></div>${btn('＋ Thêm tháng','newMonth','primary')}</div>${panel('Bộ lọc',`<label>Năm <select id="yearFilter"><option value="all">Tất cả</option>${years.map(y=>`<option value="${esc(y)}" ${yearFilter===y?'selected':''}>${esc(y)}</option>`).join('')}</select></label>`)}${summaryCards(totals(rr))}${panel('Chi tiết theo tháng',tableRows(rr))}`}
function monthDetail(){let m=row(selected);if(!m){page='months';return monthsPage()}let v=metrics(m),w=warnings(m),balance=balances()[m.id];return `<div class="page-head"><div><button class="link" data-act="months">← Các tháng</button><h1>📊 ${esc(periodLabel(m.period))}</h1><p>${esc(m.state)} · Mục tiêu ${money(m.target)} · Biên tối thiểu ${pct(m.minMargin)}</p></div><div class="actions no-print">${m.state==='Nháp'?btn('Sửa số liệu','editMonth','primary',m.id)+btn('Chốt tháng','closeMonth','',m.id):btn('Mở lại để sửa','reopenMonth','',m.id)}${btn('🖨️ In','print')}</div></div><div class="metrics"><div><small>Doanh thu</small><strong>${money(m.revenue)}</strong></div><div><small>Lãi gộp</small><strong>${money(v.gross)}</strong></div><div><small>Lãi trước thuế</small><strong>${money(v.profit)}</strong></div><div><small>Dòng tiền thuần</small><strong>${money(v.net)}</strong></div><div><small>Số dư tiền mô phỏng</small><strong>${money(balance)}</strong></div></div><div class="two">${panel('📑 Kết quả kinh doanh',`<dl><dt>Doanh thu</dt><dd>${money(m.revenue)}</dd><dt>Giá vốn</dt><dd>${money(m.cogs)}</dd><dt>Lãi gộp</dt><dd>${money(v.gross)}</dd><dt>Biên lãi gộp</dt><dd>${v.margin===null?'Không tính khi doanh thu = 0':pct(v.margin)}</dd><dt>Chi phí bán hàng</dt><dd>${money(m.selling)}</dd><dt>Chi phí quản lý</dt><dd>${money(m.admin)}</dd><dt>Lãi trước thuế</dt><dd><b>${money(v.profit)}</b></dd></dl>`)}${panel('💵 Thu chi tiền',`<dl><dt>Tiền thu vào</dt><dd>${money(m.cashIn)}</dd><dt>Tiền chi ra</dt><dd>${money(m.cashOut)}</dd><dt>Dòng tiền thuần</dt><dd><b>${money(v.net)}</b></dd></dl><p class="muted">Lãi và dòng tiền là hai chỉ số khác nhau. App không tự suy ra một chỉ số từ chỉ số còn lại.</p>`)}</div>${panel('⚠️ Điểm cần xem',w.length?`<ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="success">Không có cảnh báo theo ngưỡng đã ghi ở tháng này.</p>')}${panel('🔎 Nguồn và giải thích',`<p><b>Tham chiếu sổ sách:</b> ${esc(m.sourceRef||'Chưa nhập')}</p><p><b>Ghi chú quản trị:</b> ${esc(m.note||'—')}</p><p><b>Công thức:</b> Lãi gộp = doanh thu − giá vốn; lãi trước thuế = lãi gộp − chi phí bán hàng − chi phí quản lý; dòng tiền = thu vào − chi ra.</p>`)}${panel('🕘 Nhật ký',db.audit.filter(a=>a.monthId===m.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có thay đổi.</p>')}`}
function reports(){let all=ordered(),years=[...new Set(all.map(m=>m.period.slice(0,4)))].sort(),t=totals();return `<div class="page-head"><div><h1>📊 Báo cáo giám đốc</h1><p>Tổng hợp từ các tháng đã nhập, ngày xem ${esc(db.settings.asof)}.</p></div>${btn('🖨️ In báo cáo','print')}</div>${summaryCards(t)}${panel('Tổng kết toàn kỳ',`<dl><dt>Số tháng</dt><dd>${t.months}</dd><dt>Doanh thu</dt><dd>${money(t.revenue)}</dd><dt>Giá vốn</dt><dd>${money(t.cogs)}</dd><dt>Chi phí bán hàng</dt><dd>${money(t.selling)}</dd><dt>Chi phí quản lý</dt><dd>${money(t.admin)}</dd><dt>Lãi trước thuế</dt><dd>${money(t.profit)}</dd><dt>Biên lãi gộp toàn kỳ</dt><dd>${t.margin===null?'—':pct(t.margin)}</dd><dt>Tiền thu / chi</dt><dd>${money(t.cashIn)} / ${money(t.cashOut)}</dd><dt>Tiền đầu / cuối mô phỏng</dt><dd>${money(db.settings.openingCash)} / ${money(t.closingCash)}</dd></dl>`)}${panel('Theo năm',`<div class="table-wrap"><table><thead><tr><th>Năm</th><th>Tháng có dữ liệu</th><th>Doanh thu</th><th>Lãi gộp</th><th>Lãi trước thuế</th><th>Biên gộp</th><th>Dòng tiền thuần</th><th>Tháng cảnh báo</th></tr></thead><tbody>${years.map(y=>{let q=totals(all.filter(m=>m.period.startsWith(y)));return `<tr><td>${esc(y)}</td><td>${q.months}/12</td><td>${money(q.revenue)}</td><td>${money(q.gross)}</td><td>${money(q.profit)}</td><td>${q.margin===null?'—':pct(q.margin)}</td><td>${money(q.net)}</td><td>${q.alerts}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có số liệu.</td></tr>'}</tbody></table></div>`)}${panel('So sánh theo tháng',tableRows(all))}<div class="two">${barChart(all,'revenue','Doanh thu từng tháng')}${barChart(all,'net','Dòng tiền thuần từng tháng')}</div>`}
function scenario(){let m=row(selected)||ordered().at(-1);return `<div class="page-head"><div><h1>🧮 Thử kịch bản</h1><p>Tăng/giảm đầu vào để xem tác động; kết quả không ghi vào sổ.</p></div></div>${m?panel('Kỳ cơ sở',`<label>Chọn tháng<select id="scenarioMonth">${ordered().map(x=>`<option value="${esc(x.id)}" ${x.id===m.id?'selected':''}>${esc(periodLabel(x.period))}</option>`).join('')}</select></label><div class="form-grid"><label>Thay đổi doanh thu (%)<input id="simRevenue" type="number" step="0.1" value="0"></label><label>Thay đổi giá vốn (%)<input id="simCogs" type="number" step="0.1" value="0"></label><label>Thay đổi chi phí bán hàng (%)<input id="simSelling" type="number" step="0.1" value="0"></label><label>Thay đổi tiền thu vào (%)<input id="simCashIn" type="number" step="0.1" value="0"></label></div><div class="actions">${btn('Tính kịch bản','calculateScenario','primary')}</div><div id="scenarioResult"></div><p class="note">Chi phí quản lý và tiền chi ra giữ nguyên. Thay đổi doanh thu không tự làm thay đổi tiền thu; nhập thay đổi tiền thu riêng để phản ánh giả định.</p>`):panel('Chưa có số liệu','<p>Hãy thêm ít nhất một tháng số liệu trước khi thử kịch bản.</p>')}`}
function calculateScenario(){let m=row($('#scenarioMonth').value);if(!m)return;let vals=['simRevenue','simCogs','simSelling','simCashIn'].map(id=>Number($('#'+id).value));if(vals.some(v=>!Number.isFinite(v)||v<-100||v>1000)){alert('Tỷ lệ cần từ -100% đến 1000%.');return}let [a,b,c,d]=vals,base=metrics(m),revenue=Math.round(m.revenue*(1+a/100)),cogs=Math.round(m.cogs*(1+b/100)),selling=Math.round(m.selling*(1+c/100)),cashIn=Math.round(m.cashIn*(1+d/100)),newM={...m,revenue,cogs,selling,cashIn},v=metrics(newM);$('#scenarioResult').innerHTML=`<div class="metrics" style="margin-top:20px"><div><small>Lãi trước thuế gốc</small><strong>${money(base.profit)}</strong></div><div><small>Lãi trước thuế kịch bản</small><strong>${money(v.profit)}</strong></div><div><small>Chênh lệch lãi</small><strong>${money(v.profit-base.profit)}</strong></div><div><small>Dòng tiền gốc</small><strong>${money(base.net)}</strong></div><div><small>Dòng tiền kịch bản</small><strong>${money(v.net)}</strong></div></div><p><b>Biên gộp kịch bản:</b> ${v.margin===null?'—':pct(v.margin)} · <b>Cảnh báo:</b> ${warnings(newM).map(esc).join('; ')||'Không có'}</p>`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Mặc định cho tháng mới',`<form id="settingsForm" class="form-grid"><label>Ngày báo cáo<input name="asof" type="date" value="${esc(db.settings.asof)}"></label><label>Mục tiêu doanh thu (₫)<input name="target" type="number" min="0" step="1" value="${db.settings.target}"></label><label>Biên gộp tối thiểu (%)<input name="minMargin" type="number" min="0" max="100" step="0.1" value="${db.settings.minMargin}"></label><label>Tiền đầu kỳ (₫)<input name="openingCash" type="number" step="1" value="${db.settings.openingCash}"></label><div>${btn('💾 Lưu cài đặt','saveSettings','primary')}</div></form><p class="muted">Mục tiêu và ngưỡng biên được chụp khi tạo tháng; thay đổi mặc định không sửa các tháng cũ. Tiền đầu kỳ dùng cho mô phỏng số dư toàn chuỗi.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu / khôi phục',`<p>Dữ liệu lưu trong trình duyệt này. Sao chép file HTML gốc sang máy khác không chuyển dữ liệu đã nhập; dùng JSON hoặc HTML kèm dữ liệu.</p><div class="actions">${btn('⬇️ JSON','exportJson','primary')}${btn('⬇️ HTML kèm dữ liệu','exportHtml')}${btn('⬇️ Excel 2 sheet','exportExcel')}${btn('⬆️ Nhập JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Mẫu tham chiếu',`<p>6 tháng mẫu, doanh thu 5,46 tỷ, lãi gộp 1,96 tỷ, lãi trước thuế 685 triệu, dòng tiền thuần 210 triệu. Nguồn chỉ ghi “Tháng 1–6” mà không ghi năm; app đặt năm hiện tại khi nạp và gắn nhãn mẫu để tránh hiểu là dữ liệu thật.</p>${btn('Nạp mẫu (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa dữ liệu app này khỏi trình duyệt.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Quy trình số liệu',`<ol><li>Đặt mục tiêu doanh thu, biên gộp tối thiểu và số dư tiền đầu kỳ.</li><li>Thêm mỗi tháng một dòng; nhập doanh thu, giá vốn, hai nhóm chi phí và thu/chi tiền thực tế.</li><li>Ghi mã sổ hoặc vị trí hồ sơ nguồn và ghi chú để đối chiếu sau.</li><li>Xem đồng thời mọi cảnh báo; rà xu hướng, thử kịch bản và in báo cáo.</li><li>Khi số liệu đã được rà, chốt tháng. Muốn sửa phải mở lại có lý do.</li><li>Sao lưu JSON/HTML kèm dữ liệu định kỳ.</li></ol>`)}${panel('Cách đọc',`<p><b>Lãi gộp</b> = doanh thu − giá vốn. <b>Lãi trước thuế</b> = lãi gộp − chi phí bán hàng − chi phí quản lý. <b>Biên gộp</b> = lãi gộp / doanh thu khi doanh thu lớn hơn 0. <b>Dòng tiền thuần</b> = tiền thu vào − tiền chi ra.</p><p>Đây là báo cáo quản trị nội bộ từ dữ liệu nhập, không thay thế báo cáo tài chính hoặc quyết toán chính thức. Số dư tiền là mô phỏng theo các tháng đã nhập, cần đối chiếu sổ quỹ và ngân hàng.</p>`)}`}
function render(){let map={home:['Tổng quan',home],months:['Theo tháng',monthsPage],detail:['Chi tiết tháng',monthDetail],reports:['Báo cáo',reports],scenario:['Kịch bản',scenario],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,label,value='',type='text'){return `<label class="${type==='textarea'?'full':''}">${label}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(value)}</textarea>`:`<input name="${n}" type="${type}" value="${esc(value)}" ${type==='number'?'step="1" min="0"':''} ${n==='period'?'required':''}>`}</label>`}
function openModal(id=''){let old=id?clone(row(id)):null;if(old?.state==='Đã chốt'){alert('Cần mở lại tháng trước khi sửa.');return}draft={id,before:old};let m=old||{},f=field('period','Kỳ tháng (YYYY-MM)',m.period||today().slice(0,7),'month');for(let k of FIELDS)f+=field(k,LABELS[k]+' (₫)',m[k]??0,'number');f+=field('target','Mục tiêu doanh thu (₫)',m.target??db.settings.target,'number')+field('minMargin','Biên gộp tối thiểu (%)',m.minMargin??db.settings.minMargin,'number')+field('sourceRef','Mã sổ / hồ sơ nguồn',m.sourceRef||'')+field('note','Ghi chú quản trị',m.note||'','textarea');if(id)f+=field('reason','Lý do sửa','', 'textarea');$('#modalTitle').textContent=id?'Sửa số liệu tháng':'Thêm số liệu tháng';$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let old=draft.before;if(old&&!x.reason){$('#formError').textContent='Cần ghi lý do sửa tháng đã lưu.';return}x.target=Number(x.target);x.minMargin=Number(x.minMargin);for(let k of FIELDS)x[k]=Number(x[k]);x.state=old?.state||'Nháp';if(!monthOK(x.period)||db.months.some(m=>m.period===x.period&&m.id!==x.id)||!Number.isSafeInteger(x.target)||x.target<0||!Number.isFinite(x.minMargin)||x.minMargin<0||x.minMargin>100||FIELDS.some(k=>!Number.isSafeInteger(x[k])||x[k]<0)){$('#formError').textContent='Kỳ không trùng, số tiền không âm và biên từ 0–100% là bắt buộc.';return}let backup=clone(db);delete x.reason;if(old)Object.assign(row(x.id),x);else db.months.push(x);audit(old?'Sửa tháng':'Thêm tháng',(f.get('reason')||'')+' · '+x.period,x.id);let err=validate(db);if(err){db=backup;$('#formError').textContent=err;return}$('#editor').close();selected=x.id;page='detail';save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'bao-cao-quan-tri-sao-luu.json')}
function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'bao-cao-quan-tri-kem-du-lieu.html')}
const HM=['ID','Kỳ','Doanh thu','Giá vốn','Chi phí bán hàng','Chi phí quản lý','Tiền thu vào','Tiền chi ra','Mục tiêu','Biên tối thiểu','Trạng thái','Nguồn','Ghi chú'],HA=['ID','Hành động','Lý do','ID tháng','Thời điểm'];
function sheets(){return [{name:'Theo thang',rows:[HM,...ordered().map(m=>[m.id,m.period,m.revenue,m.cogs,m.selling,m.admin,m.cashIn,m.cashOut,m.target,m.minMargin,m.state,m.sourceRef,m.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.monthId,a.at])]}]}
function exportExcel(){download(Excel.workbook(sheets()),'bao-cao-quan-tri-giam-doc.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file);for(let [n,h] of [['Theo thang',HM],['Nhat ky',HA]])if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng hai sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.months=b['Theo thang'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),period:String(r[1]),revenue:Number(r[2]),cogs:Number(r[3]),selling:Number(r[4]),admin:Number(r[5]),cashIn:Number(r[6]),cashOut:Number(r[7]),target:Number(r[8]),minMargin:Number(r[9]),state:String(r[10]),sourceRef:String(r[11]||''),note:String(r[12]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),monthId:String(r[3]||''),at:String(r[4])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.months.length} tháng?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),year=today().slice(0,4);for(let [i,r] of MANAGER_SAMPLE.ps.entries())x.months.push({id:uid(),period:`${year}-${String(i+1).padStart(2,'0')}`,revenue:r[1],cogs:r[2],selling:r[3],admin:r[4],cashIn:r[5],cashOut:r[6],target:900000000,minMargin:35,state:'Nháp',sourceRef:'Mẫu gốc: '+r[0]+' (không ghi năm)',note:'Năm chỉ là giả định hiển thị khi nạp mẫu; không phải kỳ thực tế đã xác minh.'});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;
 if(k==='newMonth')openModal();else if(k==='editMonth')openModal(id);else if(k==='openMonth'){selected=id;page='detail';render()}else if(k==='months'){page='months';render()}
 else if(k==='closeMonth'||k==='reopenMonth'){let m=row(id),reason=prompt(k==='closeMonth'?'Ghi người rà soát / lý do chốt tháng:':'Ghi lý do mở lại tháng:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}m.state=k==='closeMonth'?'Đã chốt':'Nháp';audit(k==='closeMonth'?'Chốt tháng':'Mở lại tháng',reason.trim(),id);save()}
 else if(k==='calculateScenario')calculateScenario();else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),asof=String(f.get('asof')),target=Number(f.get('target')),minMargin=Number(f.get('minMargin')),openingCash=Number(f.get('openingCash'));if(!dateOK(asof)||!Number.isSafeInteger(target)||target<0||!Number.isFinite(minMargin)||minMargin<0||minMargin>100||!Number.isSafeInteger(openingCash)){alert('Cài đặt không hợp lệ.');return}db.settings={asof,target,minMargin,openingCash};save()}
 else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}
});
document.addEventListener('change',e=>{if(e.target.id==='yearFilter'){yearFilter=e.target.value;render()}if(e.target.id==='scenarioMonth'){selected=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();
$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};
$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};
render();window.ManagementApp={getDB:()=>clone(db),validate,metrics,warnings,totals,balances,loadSample,encode,decode,sheets,importFile};
</script></body></html>
