function previous(x,r){let rm=room(r.roomId,x),prior=x.reads.filter(z=>z.roomId===r.roomId&&z.ym<r.ym).sort((a,b)=>b.ym.localeCompare(a.ym))[0];return{e:prior?.e??rm?.e0??0,w:prior?.w??rm?.w0??0}}
function paidFor(x,id){return x.payments.filter(p=>p.readId===id).reduce((n,p)=>n+p.amount,0)}
function calc(x,r){let old=previous(x,r),s=r.snapshot,kwh=r.e-old.e,m3=r.w-old.w,eAmt=kwh*s.ePrice,wAmt=s.wMode==='Theo người'?s.people*s.wPrice:m3*s.wPrice,fixed=s.trash+(s.wifi==='Có'?s.wifiFee:0),total=s.rent+eAmt+wAmt+fixed+r.extra,paid=paidFor(x,r.id);return{oldE:old.e,oldW:old.w,kwh,m3,eAmt,wAmt,fixed,rent:s.rent,total,paid,owe:total-paid}}
function validBackup(x){if(!x||x.version!==1||!x.settings||!Array.isArray(x.rooms)||!Array.isArray(x.reads)||!Array.isArray(x.payments)||x.rooms.length>10000||x.reads.length>120000||x.payments.length>200000)return false;let s=x.settings;if(!['company','owner','bank'].every(k=>typeof s[k]==='string'&&s[k].length<=300)||![s.ePrice,s.wPrice,s.trash,s.wifi].every(validMoney)||!['Theo khối','Theo người'].includes(s.wMode)||!Number.isInteger(s.dueDay)||s.dueDay<1||s.dueDay>28)return false;let ids=new Set(),codes=new Set();for(let r of x.rooms){if(!r||typeof r.id!=='string'||!r.id||ids.has(r.id)||typeof r.code!=='string'||!r.code||codes.has(r.code.toLowerCase())||typeof r.name!=='string'||!r.name||typeof r.phone!=='string'||typeof r.note!=='string'||r.moveIn&&!validDate(r.moveIn)||![r.rent,r.deposit,r.e0,r.w0].every(validMoney)||!Number.isSafeInteger(r.people)||r.people<1||r.people>100||!['Có','Không'].includes(r.wifi)||typeof r.active!=='boolean')return false;ids.add(r.id);codes.add(r.code.toLowerCase())}let rids=new Set(),pairs=new Set();for(let r of x.reads){if(!r||typeof r.id!=='string'||!r.id||rids.has(r.id)||!ids.has(r.roomId)||!validYm(r.ym)||pairs.has(r.roomId+'|'+r.ym)||![r.e,r.w].every(validMoney)||!validSigned(r.extra)||!r.snapshot)return false;let q=r.snapshot;if(!['tenant','wifi','wMode'].every(k=>typeof q[k]==='string')||!['Có','Không'].includes(q.wifi)||!['Theo khối','Theo người'].includes(q.wMode)||![q.rent,q.people,q.ePrice,q.wPrice,q.trash,q.wifiFee].every(validMoney)||q.people<1)return false;rids.add(r.id);pairs.add(r.roomId+'|'+r.ym)}let pids=new Set();for(let p of x.payments){if(!p||typeof p.id!=='string'||!p.id||pids.has(p.id)||!rids.has(p.readId)||!validDate(p.date)||!validMoney(p.amount)||p.amount===0||typeof p.method!=='string'||typeof p.reference!=='string'||typeof p.note!=='string')return false;pids.add(p.id)}for(let r of x.reads){let c=calc(x,r);if(c.kwh<0||c.m3<0||c.total<0||!Number.isSafeInteger(c.total))return false}return true}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return validBackup(x)?x:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim()),saved=stored();
let db=validBackup(embedded)&&(!saved||(embedded.updatedAt||0)>=(saved.updatedAt||0))?embedded:saved||blank(),page='dashboard',month=today().slice(0,7),query='',billId='',modal=null;
const rname=id=>room(id)?.name||'—',rcode=id=>room(id)?.code||'—';
const dataAt=ym=>db.reads.filter(r=>r.ym===ym).map(r=>({r,c:calc(db,r),room:room(r.roomId)}));
function summaryAt(ym){return db.rooms.map(r=>{let item=dataAt(ym).find(x=>x.r.roomId===r.id);return{room:r,item,due:item?.c.total||0,paid:item?.c.paid||0,owe:item?.c.owe||0,status:!item?'Chưa ghi điện nước':item.c.owe>0?'Còn nợ':item.c.owe<0?'Thu vượt':'Đã thu đủ'}})}
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(h,s)=>'<div class="hero"><h1>'+esc(h)+'</h1><p>'+esc(s)+'</p></div>';
const metric=(name,value,sub='')=>'<div class="metric"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>';
const badge=(s,k='')=>'<span class="badge '+k+'">'+esc(s)+'</span>';
const empty=s=>'<div class="empty">'+esc(s)+'</div>';
const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty('Chưa có dữ liệu phù hợp.');
const opt=(v,label,selected)=>'<option value="'+esc(v)+'" '+(String(v)===String(selected)?'selected':'')+'>'+esc(label)+'</option>';
const options=(list,selected)=>list.map(x=>opt(x,x,selected)).join('');
function field(k,label,type,value='',opts=''){return '<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value??'')+'">')+'</div>'}
const v=k=>$('#f_'+k)?.value.trim()||'';
const monthPick=()=>'<label class="field">Tháng <input type="month" id="monthPick" value="'+esc(month)+'"></label>';
function nextCode(){let n=Math.max(0,...db.rooms.map(r=>/^P\d+$/.test(r.code)?Number(r.code.slice(1)):0));return'P'+String(n+1).padStart(3,'0')}
function snapshot(r){let s=db.settings;return{tenant:r.name,rent:r.rent,people:r.people,wifi:r.wifi,ePrice:s.ePrice,wMode:s.wMode,wPrice:s.wPrice,trash:s.trash,wifiFee:s.wifi}}
function dashboard(){let rows=summaryAt(month),due=rows.reduce((n,x)=>n+x.due,0),paid=rows.reduce((n,x)=>n+x.paid,0),unread=rows.filter(x=>x.room.active&&!x.item),debt=rows.filter(x=>x.owe>0);return hero('🏘️ Quản lý nhà trọ','Ghi chỉ số, tính tiền, thu từng đợt và in phiếu báo cho từng phòng.')+'<section class="card"><div class="toolbar filters">'+monthPick()+'<span class="grow"></span><button class="btn primary" data-new="read">+ Ghi điện nước</button><button class="btn" data-new="payment">+ Thu tiền</button></div><div class="grid">'+metric('Phòng đang quản lý',db.rooms.length)+metric('Phải thu tháng',money(due))+metric('Đã thu',money(paid))+metric('Còn nợ',money(due-paid))+metric('Chưa ghi điện nước',unread.length)+metric('Phòng còn nợ',debt.length)+'</div><p class="notice">Chọn tháng để xem tiến độ thu tiền. Tiền cọc chỉ theo dõi ở hồ sơ phòng, không tính vào hóa đơn tháng.</p></section><div class="split"><section class="card"><h2>⚠️ Việc cần làm</h2>'+(debt.length||unread.length?debt.map(x=>'<div class="check"><span><b>'+esc(x.room.code)+' · '+esc(x.room.name)+'</b><small>Còn nợ tháng '+month+'</small></span><strong>'+money(x.owe)+'</strong></div>').join('')+unread.map(x=>'<div class="check"><span><b>'+esc(x.room.code)+' · '+esc(x.room.name)+'</b><small>Chưa ghi điện nước</small></span></div>').join(''):empty('Đã ghi và thu đủ cho các phòng.'))+'</section><section class="card"><h2>📋 Quy trình tháng</h2><ol><li>Chọn tháng và kiểm tra danh sách phòng.</li><li>Ghi chỉ số điện, nước mới cho từng phòng.</li><li>Đối chiếu tiền phòng và các phí; ghi khoản đã thu.</li><li>In phiếu báo tiền phòng và sao lưu dữ liệu.</li></ol></section></div><section class="card"><h2>Tổng hợp nhanh</h2>'+summaryTable(rows)+'</section>'}
function summaryTable(rows){return table(['Phòng','Người thuê','Phải thu','Đã thu','Còn nợ','Tình trạng',''],rows.map(x=>'<tr><td><b>'+esc(x.room.code)+'</b></td><td>'+esc(x.room.name)+'</td><td class="num">'+money(x.due)+'</td><td class="num">'+money(x.paid)+'</td><td class="num">'+money(x.owe)+'</td><td>'+badge(x.status,x.owe>0?'late':!x.item?'due':'ok')+'</td><td>'+(x.item?'<button class="btn small" data-bill="'+esc(x.item.r.id)+'">Phiếu báo</button>':'<button class="btn small" data-new="read">Ghi chỉ số</button>')+'</td></tr>'))}
function roomsPage(){let rows=db.rooms.filter(r=>[r.code,r.name,r.phone].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>a.code.localeCompare(b.code));return hero('🏠 Phòng & người thuê','Thông tin phòng, người đại diện, giá phòng, tiền cọc và chỉ số đầu kỳ.')+'<section class="card"><div class="toolbar filters"><input id="search" class="search" placeholder="Tìm phòng, người thuê, điện thoại..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="room">+ Thêm phòng</button></div>'+table(['Phòng','Người thuê','Vào ở','Giá phòng','Người','Cọc','Wifi','Điện đầu','Nước đầu','Trạng thái',''],rows.map(r=>'<tr><td><b>'+esc(r.code)+'</b></td><td>'+esc(r.name)+'<br><small>'+esc(r.phone)+'</small></td><td>'+date(r.moveIn)+'</td><td class="num">'+money(r.rent)+'</td><td>'+r.people+'</td><td class="num">'+money(r.deposit)+'</td><td>'+esc(r.wifi)+'</td><td>'+r.e0+'</td><td>'+r.w0+'</td><td>'+badge(r.active?'Đang ở':'Tạm ngừng',r.active?'ok':'')+'</td><td><button class="btn small" data-edit="room" data-id="'+esc(r.id)+'">Sửa</button></td></tr>'))+'</section>'}
function readRow(x){let{r,c,room:rm}=x;return '<tr><td>'+esc(r.ym)+'</td><td><b>'+esc(rm?.code||'')+'</b><br><small>'+esc(r.snapshot.tenant)+'</small></td><td>'+c.oldE+' → '+r.e+'<br><small>'+c.kwh+' kWh</small></td><td class="num">'+money(c.eAmt)+'</td><td>'+c.oldW+' → '+r.w+'<br><small>'+c.m3+' m³</small></td><td class="num">'+money(c.wAmt)+'</td><td class="num">'+money(c.rent)+'</td><td class="num">'+money(c.fixed+r.extra)+'</td><td class="num"><b>'+money(c.total)+'</b></td><td class="num">'+money(c.paid)+'</td><td class="num">'+money(c.owe)+'</td><td><button class="btn small" data-edit="read" data-id="'+esc(r.id)+'">Sửa</button> <button class="btn small" data-bill="'+esc(r.id)+'">Phiếu</button></td></tr>'}
function readsPage(){let rows=dataAt(month).sort((a,b)=>a.room.code.localeCompare(b.room.code)),unread=db.rooms.filter(r=>r.active&&!rows.some(x=>x.r.roomId===r.id));return hero('⚡ Ghi điện nước','Mỗi phòng mỗi tháng một dòng; chỉ số cũ lấy từ tháng trước hoặc lúc nhận phòng.')+'<section class="card"><div class="toolbar filters">'+monthPick()+'<span class="grow"></span><button class="btn primary" data-new="read">+ Ghi chỉ số</button><button class="btn" data-action="excelExport">↓ Excel</button></div>'+(unread.length?'<p class="notice warn">Chưa ghi: '+unread.map(r=>esc(r.code)).join(', ')+'</p>':'<p class="notice">Đã ghi đủ cho các phòng đang hoạt động.</p>')+'<p class="muted">Đơn giá và tiền phòng được lưu tại lúc lập dòng ghi. Sửa cài đặt sau này không đổi hóa đơn cũ.</p>'+table(['Tháng','Phòng','Điện cũ → mới','Tiền điện','Nước cũ → mới','Tiền nước','Tiền phòng','Phí & điều chỉnh','Tổng','Đã thu','Còn nợ',''],rows.map(readRow))+'</section>'}
function paymentsPage(){let ps=db.payments.filter(p=>{let r=read(p.readId),rm=room(r?.roomId);return[rm?.code,rm?.name,p.reference,p.method].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))}).sort((a,b)=>b.date.localeCompare(a.date));return hero('💰 Thu tiền nhiều đợt','Mỗi lần khách trả tiền là một chứng từ; tiền đã thu của tháng tự cộng theo phòng.')+'<section class="card"><div class="toolbar filters"><input id="search" class="search" placeholder="Tìm phòng, người thuê, tham chiếu..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="payment">+ Ghi khoản thu</button></div>'+table(['Ngày thu','Tháng / phòng','Người thuê','Số tiền','Hình thức','Tham chiếu','Ghi chú',''],ps.map(p=>{let r=read(p.readId),rm=room(r?.roomId);return '<tr><td>'+date(p.date)+'</td><td>'+esc(r?.ym||'')+' · <b>'+esc(rm?.code||'')+'</b></td><td>'+esc(r?.snapshot.tenant||'')+'</td><td class="num"><b>'+money(p.amount)+'</b></td><td>'+esc(p.method)+'</td><td>'+esc(p.reference||'—')+'</td><td>'+esc(p.note)+'</td><td><button class="btn small" data-edit="payment" data-id="'+esc(p.id)+'">Sửa</button></td></tr>'}))+'</section>'}
function summaryPage(){let rows=summaryAt(month),due=rows.reduce((n,x)=>n+x.due,0),paid=rows.reduce((n,x)=>n+x.paid,0);return hero('📋 Tổng hợp thu tiền','Từng phòng: phải thu, đã thu, còn nợ trong tháng.')+'<section class="card"><div class="toolbar filters">'+monthPick()+'<span class="grow"></span><button class="btn" data-action="print">🖨️ In bảng</button><button class="btn" data-action="csv">↓ CSV</button></div><div class="grid">'+metric('Phải thu',money(due))+metric('Đã thu',money(paid))+metric('Còn nợ',money(due-paid))+metric('Chưa ghi',rows.filter(x=>!x.item).length)+'</div>'+summaryTable(rows)+'</section>'}
function billPage(){let rows=dataAt(month).sort((a,b)=>a.room.code.localeCompare(b.room.code));if(!rows.length)return hero('🧾 Phiếu báo tiền phòng','Chọn tháng và phòng để xem phiếu.')+'<section class="card"><div class="toolbar">'+monthPick()+'</div>'+empty('Tháng này chưa ghi điện nước. Hãy nhập chỉ số trước.')+'</section>';if(!rows.some(x=>x.r.id===billId))billId=rows[0].r.id;let x=rows.find(x=>x.r.id===billId),{r,c,room:rm}=x,s=r.snapshot;return hero('🧾 Phiếu báo tiền phòng','Xem trước và in phiếu từng phòng.')+'<section class="card"><div class="toolbar filters">'+monthPick()+'<select id="billPick" aria-label="Chọn phòng">'+rows.map(x=>opt(x.r.id,x.room.code+' · '+x.r.snapshot.tenant,x.r.id===billId?billId:'' )).join('')+'</select><span class="grow"></span><button class="btn primary" data-action="print">🖨️ In phiếu</button></div><div class="bill"><h2>PHIẾU BÁO TIỀN PHÒNG THÁNG '+esc(month.slice(5))+'/'+esc(month.slice(0,4))+'</h2><p><b>'+esc(db.settings.company||'Nhà trọ')+'</b><br>Phòng: <b>'+esc(rm.code)+'</b> · Người thuê: <b>'+esc(s.tenant)+'</b></p>'+table(['Khoản thu','Chỉ số cũ','Chỉ số mới','Số dùng','Thành tiền'],['<tr><td>Tiền phòng</td><td></td><td></td><td></td><td class="num">'+money(c.rent)+'</td></tr>','<tr><td>Điện ('+money(s.ePrice)+'/kWh)</td><td>'+c.oldE+'</td><td>'+r.e+'</td><td>'+c.kwh+'</td><td class="num">'+money(c.eAmt)+'</td></tr>','<tr><td>Nước ('+esc(s.wMode)+')</td><td>'+c.oldW+'</td><td>'+r.w+'</td><td>'+(s.wMode==='Theo người'?s.people:c.m3)+'</td><td class="num">'+money(c.wAmt)+'</td></tr>','<tr><td>Rác, wifi</td><td></td><td></td><td></td><td class="num">'+money(c.fixed)+'</td></tr>','<tr><td>Phụ thu / giảm trừ</td><td></td><td></td><td></td><td class="num">'+money(r.extra)+'</td></tr>'])+'<p class="totline">Tổng cộng: '+money(c.total)+'</p><p>Đã thu: '+money(c.paid)+' · <b>Còn phải nộp: '+money(Math.max(0,c.owe))+'</b></p><p><b>Bằng chữ:</b> '+esc(docSo(Math.max(0,c.owe)))+'</p><p>Hạn nộp: ngày '+db.settings.dueDay+' của tháng kế tiếp. Chuyển khoản: <b>'+esc(db.settings.bank||'Chưa cài đặt')+'</b>. Nội dung: '+esc(rm.code)+' T'+esc(month.slice(5))+'</p><p>'+esc(db.settings.owner)+'</p></div></section>'}
function reportsPage(){let months=[...new Set(db.reads.map(r=>r.ym))].sort().reverse();return hero('📈 Báo cáo nhà trọ','Tổng tiền phòng, điện, nước, phí và khoản đã thu theo từng tháng.')+'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn" data-action="print">🖨️ In báo cáo</button><button class="btn" data-action="excelExport">↓ Excel</button></div><p class="notice">Số “đã thu” gắn theo hóa đơn tháng; ngày thực nhận nằm trong sổ Thu tiền. Hóa đơn lưu đơn giá tại lúc lập.</p>'+table(['Tháng','Số phòng ghi','Tiền phòng','Tiền điện','Tiền nước','Phí & điều chỉnh','Phải thu','Đã thu','Còn nợ'],months.map(m=>{let xs=dataAt(m),sum=f=>xs.reduce((n,x)=>n+f(x),0);return '<tr><td>'+esc(m)+'</td><td>'+xs.length+'</td><td class="num">'+money(sum(x=>x.c.rent))+'</td><td class="num">'+money(sum(x=>x.c.eAmt))+'</td><td class="num">'+money(sum(x=>x.c.wAmt))+'</td><td class="num">'+money(sum(x=>x.c.fixed+x.r.extra))+'</td><td class="num">'+money(sum(x=>x.c.total))+'</td><td class="num">'+money(sum(x=>x.c.paid))+'</td><td class="num">'+money(sum(x=>x.c.owe))+'</td></tr>'}))+'</section>'}
function settingsPage(){let s=db.settings;return hero('⚙️ Cài đặt','Thông tin chủ nhà, tài khoản nhận tiền và đơn giá áp dụng cho hóa đơn mới.')+'<section class="card"><div class="formgrid">'+field('company','Tên nhà trọ','text',s.company)+field('owner','Chủ nhà – điện thoại','text',s.owner)+field('bank','Tài khoản nhận tiền','text',s.bank)+field('ePrice','Giá điện (đ/kWh)','number',s.ePrice)+field('wMode','Cách tính nước','select','',options(['Theo khối','Theo người'],s.wMode))+field('wPrice','Giá nước (đ/m³ hoặc đ/người)','number',s.wPrice)+field('trash','Rác, vệ sinh (đ/phòng)','number',s.trash)+field('wifi','Wifi (đ/phòng)','number',s.wifi)+field('dueDay','Hạn nộp tháng kế tiếp (ngày 1–28)','number',s.dueDay)+'</div><p><button class="btn primary" data-action="settings">Lưu cài đặt</button></p><p class="notice">Hóa đơn đã lập giữ đơn giá và số người tại thời điểm lập. Muốn sửa hóa đơn cũ, mở dòng ghi điện nước và nhập lại các thông số sau khi kiểm tra chứng từ.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Giữ bản sao trước khi nạp mẫu, nhập Excel hoặc chuyển máy.')+'<section class="card"><div class="grid">'+metric('Phòng',db.rooms.length)+metric('Dòng điện nước',db.reads.length)+metric('Lần thu tiền',db.payments.length)+'</div><p class="notice warn">Sao chép file HTML gốc sang máy khác không chuyển dữ liệu lưu trên trình duyệt. Hãy tải HTML kèm dữ liệu hoặc JSON.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV tổng hợp</button></div><p class="muted">Excel có bốn sheet: phòng, điện nước, thu tiền và cài đặt.</p></section><section class="card"><h2>Mẫu đối chiếu từ app gốc</h2><p>8 phòng, 22 dòng ghi điện nước trong ba tháng và các khoản đã thu theo cách sinh mẫu của file gốc. Mẫu chỉ nạp khi anh chọn.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa toàn bộ dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn sử dụng','Một quy trình rõ ràng cho chủ nhà trọ mỗi tháng.')+'<section class="card"><h2>5 bước</h2><ol><li>Cài giá điện, cách tính nước, phí rác, wifi và tài khoản nhận tiền.</li><li>Khai từng phòng cùng người thuê, giá phòng và chỉ số điện nước đầu kỳ.</li><li>Cuối tháng ghi một dòng chỉ số mới cho mỗi phòng. App tự lấy chỉ số cũ.</li><li>Ghi từng lần khách thanh toán, kể cả trả nhiều đợt; xem tổng hợp công nợ.</li><li>Mở Phiếu báo, chọn phòng, in hoặc lưu PDF; sao lưu dữ liệu định kỳ.</li></ol></section><section class="card"><h2>Công thức & giới hạn</h2><p>Điện dùng = điện mới − điện cũ. Nước dùng = nước mới − nước cũ. Tiền nước có thể theo khối hoặc theo số người. Tổng = tiền phòng + điện + nước + rác + wifi + phụ thu/giảm trừ. Còn nợ = tổng − đã thu.</p><p>App chặn chỉ số mới thấp hơn chỉ số cũ và một phòng có hai dòng ghi cùng tháng. Hóa đơn cũ giữ giá và người thuê tại lúc lập. Tiền cọc chỉ lưu trong hồ sơ phòng, chưa có sổ hoàn cọc. Dữ liệu khách thuê và khoản thu cần bảo vệ khi sao lưu.</p></section>'}
function render(){let names={dashboard:'Tổng quan',rooms:'Phòng & người thuê',reads:'Ghi điện nước',payments:'Thu tiền',summary:'Tổng hợp tháng',bill:'Phiếu báo tiền phòng',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Nhà trọ')+'</b> · '+esc(names[page])+' · Tháng '+esc(month)+'</div>'+({dashboard,rooms:roomsPage,reads:readsPage,payments:paymentsPage,summary:summaryPage,bill:billPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage})[page]()}
function openModal(type,id=''){let old=type==='room'?room(id):type==='read'?read(id):db.payments.find(p=>p.id===id);old=old||{};modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+({room:'phòng / người thuê',read:'dòng điện nước',payment:'khoản thu'}[type]);let html='';if(type==='room')html=field('code','Mã phòng *','text',old.code||nextCode())+field('name','Người thuê (đại diện) *','text',old.name||'')+field('phone','Điện thoại','tel',old.phone||'')+field('moveIn','Ngày vào ở','date',old.moveIn||today())+field('rent','Giá phòng / tháng (đ)','number',old.rent??0)+field('people','Số người','number',old.people??1)+field('deposit','Tiền cọc (đ)','number',old.deposit??0)+field('wifi','Dùng wifi','select','',options(['Có','Không'],old.wifi||'Có'))+field('e0','Chỉ số điện lúc nhận phòng','number',old.e0??0)+field('w0','Chỉ số nước lúc nhận phòng','number',old.w0??0)+field('active','Trạng thái','select','',opt('true','Đang ở',String(old.active!==false))+opt('false','Tạm ngừng',String(old.active!==false)))+field('note','Ghi chú','textarea',old.note||'');if(type==='read'){let opts='<option value="">Chọn phòng</option>'+db.rooms.filter(r=>r.active||r.id===old.roomId).map(r=>opt(r.id,r.code+' · '+r.name,old.roomId)).join('');html=field('ym','Tháng','month',old.ym||month)+field('roomId','Phòng *','select','',opts)+field('e','Chỉ số điện mới','number',old.e??0)+field('w','Chỉ số nước mới','number',old.w??0)+field('extra','Phụ thu / giảm trừ (có thể âm)','number',old.extra??0);html+='<p class="wide notice">Tiền phòng và đơn giá của hóa đơn được chụp khi lập. Khi sửa chỉ số tháng trước, app kiểm tra lại chuỗi chỉ số các tháng sau.</p>'}if(type==='payment'){let opts='<option value="">Chọn hóa đơn tháng</option>'+db.reads.map(r=>opt(r.id,r.ym+' · '+rcode(r.roomId)+' · '+r.snapshot.tenant,old.readId)).join('');html=field('readId','Hóa đơn *','select','',opts)+field('date','Ngày thu','date',old.date||today())+field('amount','Số tiền đã thu (đ)','number',old.amount??0)+field('method','Hình thức','select','',options(['Chuyển khoản','Tiền mặt','Khác','Số dư mẫu'],old.method||'Chuyển khoản'))+field('reference','Mã phiếu thu / giao dịch','text',old.reference||'')+field('note','Ghi chú','textarea',old.note||'')}if(id)html+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bản ghi này</button></div>';$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){if(!modal)return;let{type,id}=modal,x={},error='';if(type==='room'){x={code:v('code'),name:v('name'),phone:v('phone'),moveIn:v('moveIn'),rent:amount(v('rent')),people:amount(v('people')),deposit:amount(v('deposit')),wifi:v('wifi'),e0:amount(v('e0')),w0:amount(v('w0')),active:v('active')==='true',note:v('note')};if(!x.code||!x.name||/\s/.test(x.code)||!validDate(x.moveIn)||![x.rent,x.deposit,x.e0,x.w0].every(validMoney)||!Number.isSafeInteger(x.people)||x.people<1||x.people>100)error='Thông tin phòng, người thuê, giá hoặc chỉ số đầu kỳ không hợp lệ.';else if(db.rooms.some(r=>r.id!==id&&r.code.toLowerCase()===x.code.toLowerCase()))error='Mã phòng đã có.'}if(type==='read'){x={ym:v('ym'),roomId:v('roomId'),e:amount(v('e')),w:amount(v('w')),extra:amount(v('extra'))};if(!validYm(x.ym)||!room(x.roomId)||![x.e,x.w].every(validMoney)||!validSigned(x.extra))error='Cần tháng, phòng và chỉ số hợp lệ.';else if(db.reads.some(r=>r.id!==id&&r.roomId===x.roomId&&r.ym===x.ym))error='Phòng đã có dòng ghi tháng này.';x.snapshot=id?read(id).snapshot:snapshot(room(x.roomId))}if(type==='payment'){x={readId:v('readId'),date:v('date'),amount:amount(v('amount')),method:v('method'),reference:v('reference'),note:v('note')};if(!read(x.readId)||!validDate(x.date)||!validMoney(x.amount)||x.amount===0)error='Hóa đơn, ngày thu hoặc số tiền không hợp lệ.'}if(error){$('#modalError').textContent=error;return}let candidate={...db,rooms:db.rooms.slice(),reads:db.reads.slice(),payments:db.payments.slice()},list=type==='room'?candidate.rooms:type==='read'?candidate.reads:candidate.payments;if(id){let i=list.findIndex(z=>z.id===id);list[i]={...list[i],...x}}else list.push({id:uid(),...x});if(!validBackup(candidate)){$('#modalError').textContent='Thay đổi làm chỉ số giảm, tổng tiền âm hoặc dữ liệu liên kết không hợp lệ.';return}db=candidate;closeModal();save()}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const randInt=(r,a,b)=>a+Math.floor(r()*(b-a+1));
function sampleData(anchor=today()){let d=blank(),cur=anchor.slice(0,7),prev=ymAdd(cur,-1),prev2=ymAdd(cur,-2),r=rng(13);d.settings={...d.settings,...SOURCE.settings,company:'Nhà trọ An Phát',owner:'Cô Lan – 0912.xxx.xxx',bank:'0123456789 – Vietcombank – NGUYEN THI LAN'};SOURCE.rooms.forEach((x,i)=>d.rooms.push({id:'sample-room-'+i,code:x[0],name:x[1],phone:'09'+String(1000111+i*111111).slice(0,8),moveIn:ymAdd(cur,-(6+i*2))+'-0'+(1+i%8),rent:x[2],people:x[3],deposit:x[2],wifi:x[4],e0:x[5],w0:x[6],active:true,note:'Dữ liệu mẫu từ file gốc'}));let state={};for(let rm of d.rooms)state[rm.code]={e:rm.e0,w:rm.w0};for(let [mi,ym] of [prev2,prev,cur].entries())for(let [i,rm] of d.rooms.entries()){if(mi===2&&i%3===2)continue;let st=state[rm.code];st.e+=randInt(r,90,190);st.w+=randInt(r,3,12);let s=d.settings,rd={id:'sample-read-'+ym+'-'+rm.code,ym,roomId:rm.id,e:st.e,w:st.w,extra:0,snapshot:{tenant:rm.name,rent:rm.rent,people:rm.people,wifi:rm.wifi,ePrice:s.ePrice,wMode:s.wMode,wPrice:s.wPrice,trash:s.trash,wifiFee:s.wifi}};d.reads.push(rd)}for(let rd of d.reads){let i=d.rooms.findIndex(x=>x.id===rd.roomId);if(rd.ym!==cur&&!(rd.ym===prev&&i%4===3)){let total=calc(d,rd).total,paidDate=rd.ym===prev2?ymAdd(rd.ym,1)+'-03':cur+'-0'+Math.min(Number(anchor.slice(8))||1,3);d.payments.push({id:'sample-pay-'+rd.id,readId:rd.id,date:paidDate,amount:total,method:'Số dư mẫu',reference:'MẪU-'+rd.ym+'-'+d.rooms[i].code,note:'Đã thu theo dữ liệu mẫu gốc'})}}return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('quan-ly-nha-tro-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Tháng','Phòng','Người thuê','Phải thu','Đã thu','Còn nợ']];for(let x of summaryAt(month))rows.push([month,x.room.code,x.room.name,x.due,x.paid,x.owe]);let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('nha-tro-tong-hop-'+month+'.csv',body,'text/csv;charset=utf-8')}

  {name:'Phong',rows:[['Mã phòng','Người thuê','Điện thoại','Ngày vào ở','Giá phòng','Số người','Tiền cọc','Wifi','Điện đầu','Nước đầu','Hoạt động','Ghi chú'],...db.rooms.map(r=>[r.code,r.name,r.phone,r.moveIn,r.rent,r.people,r.deposit,r.wifi,r.e0,r.w0,r.active?'Có':'Không',r.note])]},
  {name:'Dien nuoc',rows:[['Tháng','Mã phòng','Điện mới','Nước mới','Phụ thu','Tên chụp','Giá phòng chụp','Người chụp','Wifi chụp','Giá điện chụp','Cách tính nước','Giá nước chụp','Phí rác chụp','Phí wifi chụp'],...db.reads.map(r=>[r.ym,rcode(r.roomId),r.e,r.w,r.extra,r.snapshot.tenant,r.snapshot.rent,r.snapshot.people,r.snapshot.wifi,r.snapshot.ePrice,r.snapshot.wMode,r.snapshot.wPrice,r.snapshot.trash,r.snapshot.wifiFee])]},
  {name:'Thu tien',rows:[['Tháng','Mã phòng','Ngày thu','Số tiền','Hình thức','Tham chiếu','Ghi chú'],...db.payments.map(p=>{let r=read(p.readId);return[r.ym,rcode(r.roomId),p.date,p.amount,p.method,p.reference,p.note]})]},
  {name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]}
]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='quan-ly-nha-tro.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){let ar=sheets['Phong'],br=sheets['Dien nuoc'],cr=sheets['Thu tien'];if(!ar||!br||!cr||ar[0]?.[0]!=='Mã phòng'||br[0]?.[0]!=='Tháng'||cr[0]?.[0]!=='Tháng')throw Error('Cần workbook do app này xuất, có ba bảng Phong, Dien nuoc, Thu tien.');let d=blank();for(let row of ar.slice(1)){if(!String(row[0]??'').trim())continue;d.rooms.push({id:uid(),code:String(row[0]).trim(),name:String(row[1]??'').trim(),phone:String(row[2]??'').trim(),moveIn:parseDate(row[3]),rent:amount(row[4]),people:amount(row[5]),deposit:amount(row[6]),wifi:String(row[7]??'').trim(),e0:amount(row[8]),w0:amount(row[9]),active:String(row[10]??'Có').trim()==='Có',note:String(row[11]??'').trim()})}for(let row of br.slice(1)){if(!String(row[0]??'').trim())continue;let rm=d.rooms.find(x=>x.code===String(row[1]??'').trim());if(!rm)throw Error('Dòng điện nước thiếu phòng.');d.reads.push({id:uid(),ym:String(row[0]).trim(),roomId:rm.id,e:amount(row[2]),w:amount(row[3]),extra:amount(row[4]),snapshot:{tenant:String(row[5]??'').trim(),rent:amount(row[6]),people:amount(row[7]),wifi:String(row[8]??'').trim(),ePrice:amount(row[9]),wMode:String(row[10]??'').trim(),wPrice:amount(row[11]),trash:amount(row[12]),wifiFee:amount(row[13])}})}for(let row of cr.slice(1)){if(!String(row[0]??'').trim())continue;let rm=d.rooms.find(x=>x.code===String(row[1]??'').trim()),rd=d.reads.find(x=>x.roomId===rm?.id&&x.ym===String(row[0]).trim());if(!rd)throw Error('Khoản thu thiếu hóa đơn tháng.');d.payments.push({id:uid(),readId:rd.id,date:parseDate(row[2]),amount:amount(row[3]),method:String(row[4]??'').trim(),reference:String(row[5]??'').trim(),note:String(row[6]??'').trim()})}if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));for(let k of ['company','owner','bank','wMode'])if(raw[k]!==undefined)d.settings[k]=String(raw[k]);for(let k of ['ePrice','wPrice','trash','wifi','dueDay'])if(raw[k]!==undefined)d.settings[k]=amount(raw[k])}if(!validBackup(d))throw Error('Bảng Excel có mã trùng, chỉ số giảm hoặc giá trị không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập '+d.rooms.length+' phòng, '+d.reads.length+' dòng điện nước và '+d.payments.length+' khoản thu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-bill],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}if(b.dataset.bill){billId=b.dataset.bill;month=read(billId).ym;page='bill';render();return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('quan-ly-nha-tro-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.rooms.length||db.reads.length||db.payments.length){if(!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();save()}if(a==='clear'){if(confirm('Xóa toàn bộ phòng, điện nước và khoản thu trên trình duyệt này?')){db=blank();save()}}if(a==='deleteRecord'){let{type,id}=modal;if(type==='room'&&db.reads.some(r=>r.roomId===id)){ $('#modalError').textContent='Phòng đã có hóa đơn; không thể xóa.';return}if(type==='read'&&db.payments.some(p=>p.readId===id)){ $('#modalError').textContent='Hóa đơn đã có khoản thu; không thể xóa.';return}if(confirm('Xóa vĩnh viễn bản ghi này?')){let list=type==='room'?db.rooms:type==='read'?db.reads:db.payments;list.splice(list.findIndex(x=>x.id===id),1);closeModal();save()}}if(a==='settings'){let s={company:v('company'),owner:v('owner'),bank:v('bank'),ePrice:amount(v('ePrice')),wMode:v('wMode'),wPrice:amount(v('wPrice')),trash:amount(v('trash')),wifi:amount(v('wifi')),dueDay:amount(v('dueDay'))};let candidate={...db,settings:s};if(!validBackup(candidate)){alert('Cài đặt có giá trị không hợp lệ.');return}db=candidate;save()}});
document.addEventListener('change',e=>{if(e.target.id==='monthPick'&&validYm(e.target.value)){month=e.target.value;billId='';render()}if(e.target.id==='billPick'){billId=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
