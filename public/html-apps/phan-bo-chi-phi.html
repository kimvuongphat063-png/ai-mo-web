function allocIn(x,ym){let i=mIdx(ym)-mIdx(x.start.slice(0,7));if(i<0||i>=x.months)return 0;let base=Math.round(x.amount/x.months);return i===x.months-1?x.amount-base*(x.months-1):base}
function evaluate(x,ym){let i=mIdx(ym)-mIdx(x.start.slice(0,7)),done=Math.max(0,Math.min(x.months,i+1)),base=Math.round(x.amount/x.months),cum=done===x.months?x.amount:done*base,left=x.months-done;return{...x,base,month:allocIn(x,ym),cum,remain:x.amount-cum,left,end:addM(x.start.slice(0,7),x.months-1),status:done===0?'Chưa bắt đầu':left===0?'Đã phân bổ hết':left<=2?'Sắp hết ('+left+' tháng)':'Đang phân bổ'}}
const rowsAt=(d,ym)=>d.items.map(x=>evaluate(x,ym));
const schedule=x=>Array.from({length:x.months},(_,i)=>{let ym=addM(x.start.slice(0,7),i);return{ym,amount:allocIn(x,ym),cum:i===x.months-1?x.amount:(i+1)*Math.round(x.amount/x.months),remain:i===x.months-1?0:x.amount-(i+1)*Math.round(x.amount/x.months)}});
function matrix(d,year){let rows=d.items.map(x=>{let vals=Array.from({length:12},(_,i)=>allocIn(x,year+'-'+String(i+1).padStart(2,'0')));return{...x,vals,total:sum(vals,v=>v)}}),tot=Array.from({length:12},(_,i)=>sum(rows,r=>r.vals[i])),accounts=d.settings.accounts.map(a=>({account:a,vals:Array.from({length:12},(_,i)=>sum(rows.filter(r=>r.account===a),r=>r.vals[i]))}));return{rows,tot,accounts,total:sum(tot,v=>v)}}
function entries(d,ym){let rows=rowsAt(d,ym),out=[];for(let account of d.settings.accounts)for(let type of TYPES){let amount=sum(rows.filter(x=>x.account===account&&x.type===type),x=>x.month);if(amount)out.push({account,credit:type===TYPES[0]?'153':'242',type,amount,description:'Phân bổ '+(type===TYPES[0]?'công cụ dụng cụ':'chi phí trả trước')+' tháng '+ym})}return out}
function encode(d){return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');return valid(d)?d:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim());let db=valid(embedded)?embedded:stored()||blank(),page='dashboard',month=today().slice(0,7),query='',chosen='',modal=null;

function matrixPage(){let y=month.slice(0,4),m=matrix(db,y),heads=['Mã','Khoản','TK',...Array.from({length:12},(_,i)=>'T'+(i+1)),'Cả năm'],total={code:'TỔNG',name:'',account:'',vals:m.tot,total:m.total};return hero('📅 Bảng phân bổ 12 tháng','Từng khoản và tổng theo tài khoản chi phí trong năm '+y+'.')+'<section class="card"><div class="toolbar">'+pick()+'<span class="grow"></span><button class="btn" data-action="print">🖨️ In bảng</button><button class="btn" data-action="excel">↓ Excel</button></div><h2>Từng khoản</h2>'+table(heads,matrixRows([...m.rows,total]))+'</section><section class="card"><h2>Theo tài khoản chi phí</h2>'+table(heads,matrixRows(m.accounts))+'</section>'}

function excelSheets(){let y=month.slice(0,4),m=matrix(db,y),e=entries(db,month);return[{name:'DanhMuc',rows:[['id','code','name','type','start','amount','months','account','note'],...db.items.map(x=>[x.id,x.code,x.name,x.type,x.start,x.amount,x.months,x.account,x.note])]},{name:'TaiKhoan',rows:[['account'],...db.settings.accounts.map(x=>[x])]},{name:'CaiDat',rows:[['key','value'],...['company','address','phone','taxCode'].map(k=>[k,db.settings[k]])]},{name:'Bang12Thang',rows:[['Mã','Khoản','TK',...Array.from({length:12},(_,i)=>'T'+(i+1)),'Cả năm'],...m.rows.map(x=>[x.code,x.name,x.account,...x.vals,x.total]),['TỔNG','','',...m.tot,m.total]]},{name:'ButToanThang',rows:[['Diễn giải','TK Nợ','TK Có','Số tiền'],...e.map(x=>[x.description,x.account,x.credit,x.amount])] } ]}
function parsedExcel(sheets){let rows=sheets.DanhMuc,acc=sheets.TaiKhoan,settings=sheets.CaiDat;if(!Array.isArray(rows)||!Array.isArray(acc)||!Array.isArray(settings)||rows[0]?.join('|')!=='id|code|name|type|start|amount|months|account|note'||acc[0]?.[0]!=='account'||settings[0]?.join('|')!=='key|value')throw Error('Excel không đúng mẫu xuất của app.');let d=blank();d.settings.accounts=acc.slice(1).map(r=>String(r[0]??''));for(let [k,val] of settings.slice(1))if(['company','address','phone','taxCode'].includes(k))d.settings[k]=String(val??'');d.items=rows.slice(1).filter(r=>r.some(x=>String(x??'').trim())).map(r=>({id:String(r[0]??''),code:String(r[1]??''),name:String(r[2]??''),type:String(r[3]??''),start:String(r[4]??''),amount:Number(r[5]),months:Number(r[6]),account:String(r[7]??''),note:String(r[8]??'')}));if(!valid(d))throw Error('Excel có dữ liệu thiếu, trùng hoặc không hợp lệ.');return d}
function csv(){let rows=[['Mã','Tên khoản','Loại','Bắt đầu','Giá trị','Số tháng','TK chi phí','Mức tháng','Kết thúc','Lũy kế','Còn lại','Tháng này','Trạng thái'],...rowsAt(db,month).map(x=>[x.code,x.name,x.type,x.start,x.amount,x.months,x.account,x.base,x.end,x.cum,x.remain,x.month,x.status])];download('phan-bo-chi-phi.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal();return}if(b.dataset.edit){openModal(b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')window.print();if(a==='schedule'){chosen=b.dataset.id;page='schedule';render()}if(a==='backup')download('phan-bo-chi-phi.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel'){let url=URL.createObjectURL(Excel.workbook(excelSheets())),link=document.createElement('a');link.href=url;link.download='phan-bo-chi-phi.xlsx';link.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv();if(a==='sample'&&confirm('Nạp 9 khoản mẫu sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?')){db=sample();month=today().slice(0,7);save()}if(a==='clear'&&confirm('Xóa toàn bộ dữ liệu phân bổ trên trình duyệt này?')){db=blank();chosen='';save()}if(a==='settings'){let d=structuredClone(db);for(let k of ['company','address','phone','taxCode'])d.settings[k]=v(k);if(!valid(d)){alert('Thông tin đơn vị quá dài hoặc không hợp lệ.');return}db=d;save()}if(a==='accounts'){let d=structuredClone(db);d.settings.accounts=$('#accountsText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!valid(d)){alert('Tài khoản phải gồm 3–10 chữ số, không trùng; không xóa TK đang dùng.');return}db=d;save()}if(a==='deleteRecord'&&modal?.key){if(!confirm('Xóa vĩnh viễn khoản này? Các lịch và bút toán sẽ tính lại.'))return;db.items=db.items.filter(x=>x.id!==modal.key);closeModal();save()}});
document.addEventListener('change',e=>{if(e.target.id==='monthPick'&&monthOK(e.target.value)){month=e.target.value;render()}if(e.target.id==='itemPick'){chosen=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();

</script></body></html>
