function validate(x){if(!x||x.version!==VERSION||!x.settings||!Array.isArray(x.suppliers)||!Array.isArray(x.tickets)||!Array.isArray(x.payments)||!Array.isArray(x.audit))return'Dữ liệu không đúng phiên bản.';let ids=new Set(),codes=new Set();for(let s of x.suppliers){if(!s.id||!s.code||!s.name||ids.has(s.id)||codes.has(s.code.toUpperCase()))return'Hồ sơ nhà cung cấp trùng hoặc thiếu.';ids.add(s.id);codes.add(s.code.toUpperCase())}ids.clear();codes.clear();for(let t of x.tickets){if(!t.id||!t.code||ids.has(t.id)||codes.has(t.code.toUpperCase())||!x.suppliers.some(s=>s.id===t.supplierId)||!dateOK(t.date)||!GOODS.includes(t.good)&&!String(t.good||'').trim()||!Number.isFinite(t.gross)||t.gross<=0||!Number.isFinite(t.impurity)||t.impurity<0||t.impurity>=100||!Number.isFinite(t.price)||t.price<0)return'Phiếu cân có dữ liệu không hợp lệ.';ids.add(t.id);codes.add(t.code.toUpperCase())}ids.clear();for(let p of x.payments){if(!p.id||ids.has(p.id)||!x.tickets.some(t=>t.id===p.ticketId)||!dateOK(p.date)||!Number.isFinite(p.amount)||p.amount<=0)return'Khoản thanh toán không hợp lệ.';ids.add(p.id)}if(!Number.isFinite(x.settings.threshold)||x.settings.threshold<0||!dateOK(x.settings.asof))return'Cài đặt không hợp lệ.';return''}
const dateOK=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;let d=new Date(s+'T00:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===s};
function embedded(){try{return JSON.parse(decodeURIComponent(escape(atob($('#embedded-state').textContent.trim()))))}catch{return null}}
let db=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&!validate(x))return x}catch{}let x=embedded();return x&&!validate(x)?x:sample()})(),page='board',selected='',query='',draft=null;
function persist(){localStorage.setItem(KEY,JSON.stringify(db));$('#saveStatus').textContent='Đã lưu trên thiết bị · '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});render()}
function audit(action,detail){db.audit.unshift({at:new Date().toISOString(),action,detail})}
function supplier(id){return db.suppliers.find(s=>s.id===id)}function ticket(id){return db.tickets.find(t=>t.id===id)}
const net=t=>t.gross*(1-t.impurity/100),amount=t=>round(net(t)*t.price),paid=t=>db.payments.filter(p=>p.ticketId===t.id).reduce((n,p)=>n+p.amount,0),debt=t=>amount(t)-paid(t),active=()=>db.tickets.filter(t=>t.status!=='Hủy'),sum=(a,f)=>a.reduce((n,x)=>n+f(x),0);
const ticketsFor=s=>active().filter(t=>t.supplierId===s.id),supplierDebt=s=>sum(ticketsFor(s),debt),supplierValue=s=>sum(ticketsFor(s),amount),supplierPaid=s=>sum(ticketsFor(s),paid);
function stats(){let ts=active();return{count:ts.length,suppliers:db.suppliers.length,gross:sum(ts,t=>t.gross),net:sum(ts,net),value:sum(ts,amount),paid:sum(ts,paid),signed:sum(ts,debt),due:sum(ts,t=>Math.max(0,debt(t))),over:sum(ts,t=>Math.max(0,-debt(t))),warn:db.suppliers.filter(s=>supplierDebt(s)>db.settings.threshold).length}}
function nav(){let links=[['board','◈ Tổng quan'],['tickets','▤ Phiếu cân'],['suppliers','♟ Nhà cung cấp'],['payments','↗ Thanh toán'],['reports','▦ Báo cáo'],['settings','⚙ Cài đặt'],['data','⇅ Dữ liệu'],['guide','? Hướng dẫn']];let h=links.map(([id,label])=>`<button class="nav" data-page="${id}" ${page===id?'aria-current="page"':''}>${label}</button>`).join('');$('#railNav').innerHTML=h;$('#mobileNav').innerHTML=h}
function hero(kicker,title,sub,glyph='◫'){return`<header class="hero"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div><div class="hero-glyph" aria-hidden="true">${glyph}</div></header>`}
function metric(label,value,sub='',em=false){return`<div class="metric ${em?'em':''}"><div class="label">${label}</div><strong>${value}</strong><small>${sub}</small></div>`}
function section(title,sub='',actions=''){return`<div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function actions(){return`<button class="btn primary" data-act="newTicket">＋ Lập phiếu cân</button><button class="btn" data-act="newPayment">↗ Ghi thanh toán</button>`}
function bars(rows,val){let max=Math.max(1,...rows.map(val));return rows.map(r=>`<div class="bar-row"><span>${esc(r[0])}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,val(r)/max*100)}%"></div></div><span class="bar-val">${money(val(r))}</span></div>`).join('')||'<div class="empty">Chưa có dữ liệu.</div>'}
function board(){let st=stats(),by=GOODS.map(g=>[g,sum(active().filter(t=>t.good===g),amount)]),alerts=active().filter(t=>debt(t)<0),top=db.suppliers.map(s=>[s.code+' · '+s.name,supplierDebt(s)]).sort((a,b)=>b[1]-a[1]).slice(0,5);return hero('AI MỞ · THU MUA NÔNG SẢN & VẬT LIỆU','Cân rõ từng phiếu.<br>Biết rõ từng khoản nợ.','Ghi khối lượng cân, tạp chất, đơn giá và thanh toán. Mỗi phiếu tự tính khối lượng thực và thành tiền.','⚖')+`<div class="actions" style="margin-bottom:23px">${actions()}<button class="btn" data-page="reports">Xem báo cáo ↗</button></div><div class="cards">${metric('Tổng tiền thu mua',money(st.value),`${st.count} phiếu cân`,true)}${metric('Đã thanh toán',money(st.paid),`${db.payments.length} lượt trả`)}${metric('Còn phải trả',money(st.due),'Tổng nợ dương từng phiếu')}${metric('Trả vượt',money(st.over),`${alerts.length} phiếu cần đối chiếu`)}</div><div class="grid-2"><div class="panel"><h3>Giá trị theo mặt hàng</h3>${bars(by,r=>r[1])}</div><div class="panel"><h3>Công nợ theo nhà cung cấp</h3>${top.map(r=>`<div class="k-line"><span>${esc(r[0])}</span><strong>${money(r[1])}</strong></div>`).join('')||'<div class="empty">Chưa có nhà cung cấp.</div>'}</div></div><div style="height:15px"></div><div class="panel"><h3>Điểm cần xử lý</h3>${st.over?`<div class="note">${alerts.length} phiếu mẫu hoặc phiếu nhập đã trả vượt thành tiền. Khoản trả vượt được tách riêng; hãy đối chiếu chứng từ trước khi xử lý.</div>`:'<div class="note">Không có phiếu trả vượt.</div>'}${st.warn?`<p style="margin:12px 0 0">${st.warn} nhà cung cấp vượt ngưỡng công nợ nội bộ.</p>`:''}</div>`}
function searchbar(placeholder){return`<div class="toolbar"><input id="search" type="search" placeholder="${placeholder}" value="${esc(query)}" aria-label="Tìm kiếm"><button class="btn" data-act="clearSearch">Xóa tìm</button></div>`}
function ticketTable(rows){return`<div class="table-wrap"><table class="tbl"><thead><tr><th>Phiếu / ngày</th><th>Nhà cung cấp</th><th>Mặt hàng</th><th class="num">Cân / thực</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th><th class="num">Đã trả</th><th class="num">Còn nợ</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td><strong>${esc(t.code)}</strong><br><span class="muted">${esc(t.date)}</span></td><td>${esc(supplier(t.supplierId)?.name)}</td><td>${esc(t.good)}<br><span class="muted">Tạp chất ${fmt(t.impurity)}%</span></td><td class="num">${fmt(t.gross)} / <strong>${fmt(net(t))}</strong> kg</td><td class="num">${money(t.price)}</td><td class="num strong">${money(amount(t))}</td><td class="num">${money(paid(t))}</td><td class="num">${debt(t)<0?`<span class="pill bad">Vượt ${money(-debt(t))}</span>`:debt(t)>0?`<span class="pill warn">${money(debt(t))}</span>`:'<span class="pill">Đủ</span>'}</td><td><button class="btn small" data-act="viewTicket" data-id="${t.id}">Xem</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Chưa có phiếu phù hợp. Hãy lập phiếu cân đầu tiên.</td></tr>'}</tbody></table></div>`}
function tickets(){let rows=active().filter(t=>(t.code+' '+t.good+' '+supplier(t.supplierId)?.name).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return hero('SỔ PHIẾU CÂN','Mỗi lần cân là một phiếu','Khối lượng thực = cân × (1 − tạp chất%). Đơn giá được lưu ngay trên phiếu để lịch sử không đổi.','▤')+section('Danh sách phiếu',`${rows.length} phiếu đang hiển thị`,`<button class="btn primary" data-act="newTicket">＋ Lập phiếu cân</button>`)+searchbar('Tìm mã phiếu, nhà cung cấp, mặt hàng...')+ticketTable(rows)}
function suppliers(){let rows=db.suppliers.filter(s=>(s.code+' '+s.name+' '+s.phone).toLowerCase().includes(query.toLowerCase()));return hero('ĐỐI TÁC CUNG ỨNG','Biết mình đang mua từ ai','Tổng mua, khoản đã trả và công nợ được tổng hợp từ từng phiếu cân.','♟')+section('Nhà cung cấp',`${rows.length} hồ sơ`,`<button class="btn primary" data-act="newSupplier">＋ Thêm nhà cung cấp</button>`)+searchbar('Tìm mã, tên, số điện thoại...')+`<div class="table-wrap"><table class="tbl"><thead><tr><th>Mã & tên</th><th>Liên hệ</th><th class="num">Phiếu</th><th class="num">Khối lượng thực</th><th class="num">Tổng mua</th><th class="num">Đã trả</th><th class="num">Công nợ ký</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><strong>${esc(s.code)}</strong><br>${esc(s.name)}</td><td>${esc(s.phone||'—')}</td><td class="num">${ticketsFor(s).length}</td><td class="num">${fmt(sum(ticketsFor(s),net))} kg</td><td class="num">${money(supplierValue(s))}</td><td class="num">${money(supplierPaid(s))}</td><td class="num">${supplierDebt(s)>db.settings.threshold?`<span class="pill bad">${money(supplierDebt(s))}</span>`:money(supplierDebt(s))}</td><td><button class="btn small" data-act="editSupplier" data-id="${s.id}">Sửa</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Chưa có nhà cung cấp.</td></tr>'}</tbody></table></div><p class="muted" style="font-size:12px">Công nợ ký có thể âm khi phiếu đã trả vượt. Ngưỡng cảnh báo chỉ là ngưỡng quản trị nội bộ.</p>`}
function payments(){let rows=db.payments.filter(p=>{let t=ticket(p.ticketId);return(t?.code+' '+supplier(t?.supplierId)?.name+' '+p.reference).toLowerCase().includes(query.toLowerCase())}).sort((a,b)=>b.date.localeCompare(a.date));return hero('DÒNG TIỀN THU MUA','Theo dõi từng lần trả','Một phiếu cân có thể thanh toán nhiều lần. Dữ liệu mẫu gốc được giữ đúng số đã trả ban đầu.','↗')+section('Nhật ký thanh toán',`${rows.length} khoản`,`<button class="btn primary" data-act="newPayment">＋ Ghi thanh toán</button>`)+searchbar('Tìm mã phiếu, nhà cung cấp, tham chiếu...')+`<div class="table-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Phiếu</th><th>Nhà cung cấp</th><th>Phương thức</th><th>Tham chiếu</th><th class="num">Số tiền</th><th>Ghi chú</th></tr></thead><tbody>${rows.map(p=>{let t=ticket(p.ticketId);return`<tr><td>${esc(p.date)}</td><td><button class="btn small" data-act="viewTicket" data-id="${t?.id}">${esc(t?.code)}</button></td><td>${esc(supplier(t?.supplierId)?.name)}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td><td class="num strong">${money(p.amount)}</td><td>${esc(p.note)}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Chưa có khoản thanh toán.</td></tr>'}</tbody></table></div>`}
function reports(){let st=stats(),goods=[...new Set([...GOODS,...active().map(t=>t.good)])],byGoods=goods.map(g=>({name:g,rows:active().filter(t=>t.good===g)})),bySup=db.suppliers.map(s=>({name:s.name,rows:ticketsFor(s)}));let table=arr=>`<div class="table-wrap"><table class="tbl"><thead><tr><th>Nhóm</th><th class="num">Phiếu</th><th class="num">Khối lượng thực</th><th class="num">Thành tiền</th><th class="num">Đã trả</th><th class="num">Công nợ ký</th></tr></thead><tbody>${arr.map(g=>`<tr><td>${esc(g.name)}</td><td class="num">${g.rows.length}</td><td class="num">${fmt(sum(g.rows,net))} kg</td><td class="num">${money(sum(g.rows,amount))}</td><td class="num">${money(sum(g.rows,paid))}</td><td class="num strong">${money(sum(g.rows,debt))}</td></tr>`).join('')}</tbody></table></div>`;return hero('BÁO CÁO THU MUA','Từ phiếu cân đến công nợ','Đối chiếu theo mặt hàng và từng nhà cung cấp. Các khoản trả vượt được nhìn riêng.','▦')+`<div class="actions" style="margin-bottom:19px"><button class="btn" data-act="print">⎙ In báo cáo</button><button class="btn green" data-act="exportExcel">↓ Xuất Excel</button></div><div class="cards">${metric('Phiếu cân',fmt(st.count),`${st.suppliers} nhà cung cấp`)}${metric('Khối lượng thực',fmt(st.net)+' kg',`Cân ban đầu ${fmt(st.gross)} kg`)}${metric('Công nợ ký',money(st.signed),'Có thể gồm khoản trả vượt',true)}${metric('Trả vượt',money(st.over),'Cần đối chiếu')}</div><div class="panel"><h3>Theo mặt hàng</h3>${table(byGoods)}</div><div style="height:15px"></div><div class="panel"><h3>Theo nhà cung cấp</h3>${table(bySup)}</div>`}
function settings(){return hero('QUY TẮC NỘI BỘ','Ngưỡng cảnh báo & thông tin','Ngưỡng nợ chỉ phục vụ quản trị, không đánh giá điều kiện pháp lý hay thuế.','⚙')+`<div class="panel" style="max-width:760px"><form id="settingsForm" class="form-grid"><div class="field span2"><label for="company">Tên đơn vị</label><input id="company" name="company" value="${esc(db.settings.company)}" maxlength="100"></div><div class="field"><label for="asof">Ngày đối chiếu</label><input type="date" id="asof" name="asof" value="${esc(db.settings.asof)}"></div><div class="field"><label for="threshold">Cảnh báo nợ NCC vượt (đồng)</label><input type="number" id="threshold" name="threshold" min="0" step="1" value="${db.settings.threshold}"></div><div class="span2"><button type="submit" class="btn primary">Lưu cài đặt</button></div></form></div><div style="height:15px"></div><div class="note">File gốc có ghi chú về chứng từ và thuế. App này chỉ theo dõi phiếu cân, thanh toán và công nợ; không tự kết luận khoản mua hợp lệ hay thay chứng từ kế toán.</div>`}
function dataPage(){return hero('DỮ LIỆU TRÊN THIẾT BỊ','Sao lưu trước khi chuyển máy','File HTML tải về có thể kèm dữ liệu hiện tại. Chỉ sao chép file HTML gốc sẽ không chuyển dữ liệu đã nhập trong trình duyệt.','⇅')+`<div class="grid-equal"><div class="panel"><h3>Sao lưu & chia sẻ</h3><p class="muted">Tải JSON để khôi phục sau này, hoặc HTML kèm dữ liệu để mở trên máy khác.</p><div class="data-buttons"><button class="btn green" data-act="exportJSON">↓ Sao lưu JSON</button><button class="btn" data-act="exportHTML">↓ HTML kèm dữ liệu</button><button class="btn" data-act="importJSON">↑ Nhập JSON</button><button class="btn" data-act="exportExcel">↓ Xuất Excel</button></div></div><div class="panel"><h3>Dữ liệu tham chiếu</h3><p class="muted">Mẫu gốc: 4 nhà cung cấp, 7 phiếu cân. Nạp lại mẫu sẽ thay toàn bộ dữ liệu đang có.</p><div class="data-buttons"><button class="btn" data-act="loadSample">Nạp lại mẫu gốc</button><button class="btn danger" data-act="clearData">Xóa dữ liệu hiện tại</button></div></div></div><div style="height:15px"></div><div class="panel"><h3>Nhật ký thay đổi</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>Thời điểm</th><th>Thao tác</th><th>Nội dung</th></tr></thead><tbody>${db.audit.slice(0,50).map(a=>`<tr><td>${esc(a.at.slice(0,19).replace('T',' '))}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Chưa có thay đổi.</td></tr>'}</tbody></table></div></div>`}
function guide(){return hero('HƯỚNG DẪN','Bắt đầu trong vài phút','Bản app tự chạy bằng trình duyệt, không cần tài khoản hay Internet.','?')+`<div class="panel guide"><h3>Quy trình thu mua</h3><ol><li>Vào <b>Nhà cung cấp</b> để tạo mã, tên và thông tin liên hệ.</li><li>Vào <b>Phiếu cân</b>: chọn nhà cung cấp, nhập ngày, mặt hàng, khối lượng cân, tỷ lệ tạp chất và đơn giá mỗi kg.</li><li>App tính <b>khối lượng thực = khối lượng cân × (1 − tỷ lệ tạp chất)</b>. Thành tiền làm tròn đến đồng. Đơn giá nằm trên phiếu, thay đổi giao dịch sau không làm đổi phiếu cũ.</li><li>Vào <b>Thanh toán</b> để ghi từng lần trả. Công nợ = thành tiền − đã trả. Không ghi thêm vượt thành tiền; hai phiếu mẫu gốc trả vượt được giữ nguyên và gắn cảnh báo.</li><li>Xem <b>Báo cáo</b> theo mặt hàng, nhà cung cấp; sao lưu tại <b>Dữ liệu</b>.</li></ol><div class="note">Dữ liệu mẫu chỉ minh họa cách hoạt động. Kiểm tra phiếu cân, biên nhận và chứng từ thực tế khi dùng cho hoạt động kinh doanh.</div></div>`}
function receipt(){let t=ticket(selected);if(!t){page='tickets';return tickets()}let s=supplier(t.supplierId),ps=db.payments.filter(p=>p.ticketId===t.id);return hero('CHI TIẾT PHIẾU CÂN',esc(t.code),`${esc(s?.name)} · ${esc(t.date)}`,'⚖')+`<div class="actions" style="margin-bottom:17px"><button class="btn" data-page="tickets">← Danh sách phiếu</button><button class="btn primary" data-act="payTicket" data-id="${t.id}">↗ Ghi thanh toán</button><button class="btn" data-act="print">⎙ In phiếu</button>${!t.sourceRow&&ps.length===0?`<button class="btn danger" data-act="voidTicket" data-id="${t.id}">Hủy phiếu</button>`:''}</div><div class="grid-2"><div class="panel receipt"><h3>PHIẾU CÂN THU MUA</h3><div class="line"><span>Đơn vị</span><strong>${esc(db.settings.company)}</strong></div><div class="line"><span>Mã phiếu</span><strong>${esc(t.code)}</strong></div><div class="line"><span>Ngày</span><strong>${esc(t.date)}</strong></div><div class="line"><span>Nhà cung cấp</span><strong>${esc(s?.name)} (${esc(s?.code)})</strong></div><div class="line"><span>Mặt hàng</span><strong>${esc(t.good)}</strong></div><div class="line"><span>Khối lượng cân</span><strong>${fmt(t.gross)} kg</strong></div><div class="line"><span>Tạp chất/độ ẩm</span><strong>${fmt(t.impurity)}%</strong></div><div class="line"><span>Khối lượng thực</span><strong>${fmt(net(t))} kg</strong></div><div class="line"><span>Đơn giá</span><strong>${money(t.price)}/kg</strong></div><div class="line"><span>Thành tiền</span><strong>${money(amount(t))}</strong></div><div class="line"><span>Đã trả</span><strong>${money(paid(t))}</strong></div><div class="line"><span>${debt(t)<0?'Trả vượt':'Còn nợ'}</span><strong>${money(Math.abs(debt(t)))}</strong></div>${t.note?`<p class="muted" style="margin:10px 0 0">${esc(t.note)}</p>`:''}</div><div class="panel"><h3>Các lần thanh toán</h3>${ps.map(p=>`<div class="k-line"><span>${esc(p.date)} · ${esc(p.method)}<br><span class="muted">${esc(p.reference)}</span></span><strong>${money(p.amount)}</strong></div>`).join('')||'<div class="empty">Chưa có thanh toán.</div>'}${debt(t)<0?'<div class="note">Số đã trả vượt thành tiền. Cần đối chiếu và xử lý riêng, không tự cấn trừ sang phiếu khác.</div>':''}</div></div>`}
function render(){nav();let views={board,tickets,suppliers,payments,reports,settings,data:dataPage,guide,receipt};$('#screen').innerHTML=(views[page]||board)();$('#saveStatus').textContent='Đã lưu trên thiết bị'}
function ffield(label,name,type='text',value='',extra='',full=false){return`<div class="field ${full?'span2':''}"><label for="f-${name}">${label}</label>${type==='textarea'?`<textarea id="f-${name}" name="${name}" ${extra}>${esc(value)}</textarea>`:`<input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}</div>`}
function select(label,name,options,selected=''){return`<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}" required>${options.map(([v,t])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
function form(kind,id=''){draft={kind,id};let fields='',title='';if(kind==='supplier'){let s=supplier(id)||{};title=id?'Sửa nhà cung cấp':'Thêm nhà cung cấp';fields=ffield('Mã nhà cung cấp *','code','text',s.code||'','required maxlength="24"')+ffield('Tên nhà cung cấp *','name','text',s.name||'','required maxlength="100"')+ffield('Số điện thoại','phone','tel',s.phone||'','maxlength="30"')+ffield('Địa chỉ','address','text',s.address||'','maxlength="180"')+ffield('Ghi chú','note','textarea',s.note||'','maxlength="500"',true)}else if(kind==='ticket'){title='Lập phiếu cân';fields=ffield('Mã phiếu *','code','text','PC-'+String(db.tickets.length+1).padStart(3,'0'),'required maxlength="30"')+ffield('Ngày cân *','date','date',today(),'required')+select('Nhà cung cấp *','supplierId',db.suppliers.map(s=>[s.id,s.code+' · '+s.name]))+ffield('Mặt hàng *','good','text','','required maxlength="100" list="goodsList"')+`<datalist id="goodsList">${GOODS.map(g=>`<option value="${esc(g)}"></option>`).join('')}</datalist>`+ffield('Khối lượng cân (kg) *','gross','number','','required min="0.001" step="0.001"')+ffield('Tạp chất/độ ẩm (%) *','impurity','number','0','required min="0" max="99.999" step="0.001"')+ffield('Đơn giá mỗi kg (đ) *','price','number','','required min="0" step="1"')+ffield('Ghi chú','note','textarea','','maxlength="500"',true)}else if(kind==='payment'){title='Ghi thanh toán';let ts=active();fields=select('Phiếu cân *','ticketId',ts.map(t=>[t.id,t.code+' · '+supplier(t.supplierId)?.name]),id)+ffield('Ngày trả *','date','date',today(),'required')+ffield('Số tiền (đ) *','amount','number','','required min="1" step="1"')+select('Phương thức','method',[['Chuyển khoản','Chuyển khoản'],['Tiền mặt','Tiền mặt'],['Khác','Khác']])+ffield('Tham chiếu','reference','text','','maxlength="100"')+ffield('Ghi chú','note','textarea','','maxlength="500"',true)}$('#modalTitle').textContent=title;$('#formFields').innerHTML=fields;$('#formError').textContent='';$('#editor').showModal()}
const fv=(f,k)=>String(new FormData(f).get(k)||'').trim(),fn=(f,k)=>Number(fv(f,k));
function submit(e){e.preventDefault();let f=e.target,{kind,id}=draft,before=copy(db);try{if(kind==='supplier'){let code=fv(f,'code'),name=fv(f,'name');if(!code||!name||db.suppliers.some(s=>s.id!==id&&s.code.toUpperCase()===code.toUpperCase()))throw Error('Mã đã tồn tại hoặc thiếu mã/tên.');let s=supplier(id);if(s)Object.assign(s,{code,name,phone:fv(f,'phone'),address:fv(f,'address'),note:fv(f,'note')});else db.suppliers.push({id:uid(),code,name,phone:fv(f,'phone'),address:fv(f,'address'),note:fv(f,'note'),sourceRow:null});audit(id?'Sửa NCC':'Thêm NCC',code);page='suppliers'}else if(kind==='ticket'){let code=fv(f,'code'),date=fv(f,'date'),sid=fv(f,'supplierId'),good=fv(f,'good'),gross=fn(f,'gross'),impurity=fn(f,'impurity'),price=fn(f,'price');if(!code||db.tickets.some(t=>t.code.toUpperCase()===code.toUpperCase())||!dateOK(date)||!supplier(sid)||!good||!Number.isFinite(gross)||gross<=0||!Number.isFinite(impurity)||impurity<0||impurity>=100||!Number.isFinite(price)||price<0)throw Error('Kiểm tra mã phiếu duy nhất, ngày, nhà cung cấp, khối lượng, tỷ lệ và đơn giá.');let t={id:uid(),code,date,supplierId:sid,good,gross,impurity,price,note:fv(f,'note'),status:'Đã ghi',sourceRow:null};db.tickets.push(t);audit('Lập phiếu cân',code+' · '+money(amount(t)));selected=t.id;page='receipt'}else if(kind==='payment'){let t=ticket(fv(f,'ticketId')),date=fv(f,'date'),value=fn(f,'amount');if(!t||t.status==='Hủy'||!dateOK(date)||!Number.isFinite(value)||value<=0||!Number.isInteger(value))throw Error('Kiểm tra phiếu, ngày và số tiền nguyên dương.');if(value>Math.max(0,debt(t)))throw Error('Số tiền vượt khoản còn phải trả của phiếu. Phiếu mẫu trả vượt cần đối chiếu riêng.');db.payments.push({id:uid(),ticketId:t.id,date,amount:value,method:fv(f,'method'),reference:fv(f,'reference'),note:fv(f,'note'),sourceRow:null});audit('Thanh toán',t.code+' · '+money(value));selected=t.id;page='receipt'}let err=validate(db);if(err)throw Error(err);$('#editor').close();draft=null;persist()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'thu-mua-sao-luu.json')}
function exportHTML(){let data=btoa(unescape(encodeURIComponent(JSON.stringify(db)))),html='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+data+b);download(new Blob([html],{type:'text/html;charset=utf-8'}),'thu-mua-kem-du-lieu.html')}
function sheets(){return[{name:'NhaCungCap',rows:[['Mã','Tên','Điện thoại','Địa chỉ','Số phiếu','Tổng mua','Đã trả','Công nợ ký'],...db.suppliers.map(s=>[s.code,s.name,s.phone,s.address,ticketsFor(s).length,supplierValue(s),supplierPaid(s),supplierDebt(s)])]},{name:'PhieuCan',rows:[['Mã phiếu','Ngày','Mã NCC','Mặt hàng','Cân kg','Tạp chất %','Thực kg','Đơn giá','Thành tiền','Đã trả','Công nợ','Trạng thái','Dòng mẫu'],...db.tickets.map(t=>[t.code,t.date,supplier(t.supplierId)?.code,t.good,t.gross,t.impurity,net(t),t.price,amount(t),paid(t),debt(t),t.status,t.sourceRow||''])]},{name:'ThanhToan',rows:[['Ngày','Mã phiếu','Số tiền','Phương thức','Tham chiếu','Ghi chú'],...db.payments.map(p=>[p.date,ticket(p.ticketId)?.code,p.amount,p.method,p.reference,p.note])]},{name:'NhatKy',rows:[['Thời điểm','Thao tác','Nội dung'],...db.audit.map(a=>[a.at,a.action,a.detail])]}]}
function exportExcel(){download(Excel.workbook(sheets()),'quan-ly-thu-mua.xlsx')}
function act(action,id=''){if(['board','tickets','suppliers','payments','reports','settings','data','guide'].includes(action)){page=action;query='';render();return}if(action==='viewTicket'){selected=id;page='receipt';render();return}if(action==='newSupplier'||action==='editSupplier')return form('supplier',action==='editSupplier'?id:'');if(action==='newTicket'){if(!db.suppliers.length){alert('Hãy thêm nhà cung cấp trước.');page='suppliers';render();return}return form('ticket')}if(action==='newPayment'||action==='payTicket'){if(!active().length)return alert('Hãy lập phiếu cân trước.');return form('payment',action==='payTicket'?id:'')}if(action==='clearSearch'){query='';render();return}if(action==='print'){window.print();return}if(action==='voidTicket'){let t=ticket(id);if(!t||t.sourceRow||db.payments.some(p=>p.ticketId===id))return alert('Phiếu mẫu hoặc phiếu đã thanh toán không thể hủy.');let reason=prompt('Nhập lý do hủy phiếu:');if(!reason?.trim())return;t.status='Hủy';audit('Hủy phiếu',t.code+' · '+reason.trim());page='tickets';persist();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if(!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=sample();page='board';persist();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên trình duyệt này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='board';persist()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submit);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=x;page='board';persist()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let t=$('#search');t.focus();t.setSelectionRange(pos,pos)}});document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();let f=e.target,threshold=fn(f,'threshold'),asof=fv(f,'asof');if(!Number.isFinite(threshold)||threshold<0||!Number.isInteger(threshold)||!dateOK(asof))return alert('Kiểm tra ngày và ngưỡng nợ không âm.');db.settings={company:fv(f,'company')||'Đơn vị thu mua',asof,threshold};audit('Cập nhật cài đặt','Ngưỡng '+money(threshold));persist()});render();
</script></body></html>
