function stockCalc(x,s){let book=round3(s.opening+s.incoming-s.used),loss=round3(book-s.actual),lossPct=s.used>0?loss/s.used*100:0,lossValue=loss*s.unitCost,actualValue=s.actual*s.unitCost,warnings=[];if(book<0)warnings.push('Dùng vượt lượng có trong sổ');if(lossPct>x.settings.lossThreshold)warnings.push('Hao hụt vượt mức cho phép');if(loss<0)warnings.push('Tồn thực tế lớn hơn sổ: kiểm tra nhập kho');return{book,loss,lossPct,lossValue,actualValue,warnings}}
const saleTotal=s=>s.cash+s.qr+s.card;
function validBackup(x){if(!x||x.version!==1||!x.settings||typeof x.settings.company!=='string'||x.settings.company.length>160||!Number.isFinite(x.settings.lossThreshold)||x.settings.lossThreshold<0||x.settings.lossThreshold>100||!Array.isArray(x.materials)||!Array.isArray(x.stocks)||!Array.isArray(x.sales)||!Array.isArray(x.expenses)||x.materials.length>10000||x.stocks.length>100000||x.sales.length>100000||x.expenses.length>100000)return false;let mids=new Set(),codes=new Set();for(let m of x.materials){if(!m||typeof m.id!=='string'||!m.id||mids.has(m.id)||typeof m.code!=='string'||!m.code||codes.has(m.code.toLowerCase())||typeof m.name!=='string'||!m.name||typeof m.unit!=='string'||!m.unit||typeof m.note!=='string'||!validMoney(m.unitCost)||typeof m.active!=='boolean')return false;mids.add(m.id);codes.add(m.code.toLowerCase())}let ids=new Set(),pairs=new Set();for(let s of x.stocks){if(!s||typeof s.id!=='string'||!s.id||ids.has(s.id)||!mids.has(s.materialId)||!validYm(s.ym)||pairs.has(s.ym+'|'+s.materialId)||![s.opening,s.incoming,s.used,s.actual].every(validQty)||!validMoney(s.unitCost)||typeof s.note!=='string'||!Number.isSafeInteger(Math.round(s.actual*s.unitCost)))return false;ids.add(s.id);pairs.add(s.ym+'|'+s.materialId)}ids.clear();pairs.clear();for(let s of x.sales){if(!s||typeof s.id!=='string'||!s.id||ids.has(s.id)||!validDate(s.date)||!SHIFTS.includes(s.shift)||pairs.has(s.date+'|'+s.shift)||![s.cash,s.qr,s.card].every(validMoney)||!Number.isSafeInteger(saleTotal(s))||s.cashCount!==null&&!validMoney(s.cashCount)||typeof s.note!=='string')return false;ids.add(s.id);pairs.add(s.date+'|'+s.shift)}ids.clear();for(let e of x.expenses){if(!e||typeof e.id!=='string'||!e.id||ids.has(e.id)||!validDate(e.date)||!CATS.includes(e.category)||typeof e.description!=='string'||!e.description||!validMoney(e.amount)||e.amount===0||typeof e.method!=='string'||typeof e.note!=='string')return false;ids.add(e.id)}return true}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return validBackup(x)?x:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim()),saved=stored();
let db=validBackup(embedded)&&(!saved||(embedded.updatedAt||0)>=(saved.updatedAt||0))?embedded:saved||blank(),page='dashboard',month=today().slice(0,7),query='',modal=null;
const materialName=id=>material(id)?.name||'—';
const atMonth=(items,key='date')=>items.filter(x=>String(x[key]).startsWith(month));
const monthSales=()=>atMonth(db.sales).reduce((n,x)=>n+saleTotal(x),0);
const monthExpenses=()=>atMonth(db.expenses).reduce((n,x)=>n+x.amount,0);
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(h,s)=>'<div class="hero"><h1>'+esc(h)+'</h1><p>'+esc(s)+'</p></div>';
const metric=(name,value,sub='')=>'<div class="metric"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>';
const badge=(s,k='')=>'<span class="badge '+k+'">'+esc(s)+'</span>';
const empty=s=>'<div class="empty">'+esc(s)+'</div>';
const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty('Chưa có dữ liệu phù hợp.');

function saleRow(s){let total=saleTotal(s),variance=s.cashCount===null?null:s.cashCount-s.cash;return '<tr><td>'+date(s.date)+'</td><td>'+esc(s.shift)+'</td><td class="num">'+money(s.cash)+'</td><td class="num">'+money(s.qr)+'</td><td class="num">'+money(s.card)+'</td><td class="num"><b>'+money(total)+'</b></td><td class="num">'+(variance===null?'—':money(variance))+'</td><td>'+esc(s.note)+'</td><td><button class="btn small" data-edit="sale" data-id="'+esc(s.id)+'">Sửa</button></td></tr>'}
function stockRow(s){let c=stockCalc(db,s);return '<tr><td><b>'+esc(material(s.materialId)?.code||'')+'</b><br>'+esc(materialName(s.materialId))+'</td><td>'+esc(material(s.materialId)?.unit||'')+'</td><td class="num">'+num(s.opening)+'</td><td class="num">'+num(s.incoming)+'</td><td class="num">'+num(s.used)+'</td><td class="num">'+num(c.book)+'</td><td class="num">'+num(s.actual)+'</td><td class="num">'+num(c.loss)+'</td><td class="num">'+(Math.round(c.lossPct*100)/100)+'%</td><td class="num">'+money(c.lossValue)+'</td><td>'+(c.warnings.length?c.warnings.map(w=>badge(w,'late')).join('<br>'):badge('Trong mức','ok'))+'</td><td><button class="btn small" data-edit="stock" data-id="'+esc(s.id)+'">Sửa</button></td></tr>'}
function dashboard(){let sales=monthSales(),expenses=monthExpenses(),stocks=atMonth(db.stocks,'ym'),warns=stocks.map(s=>({s,c:stockCalc(db,s)})).filter(x=>x.c.warnings.length),loss=stocks.reduce((n,s)=>n+stockCalc(db,s).lossValue,0),data=atMonth(db.sales);return hero('☕ Quán cà phê & nhà hàng','Theo dõi doanh thu ca, chi phí vận hành và hao hụt nguyên liệu.')+'<section class="card"><div class="toolbar filters">'+monthPick()+'<span class="grow"></span><button class="btn primary" data-new="sale">+ Chốt doanh thu ca</button><button class="btn" data-new="stock">+ Kiểm kê</button></div><div class="grid">'+metric('Doanh thu tháng',money(sales),data.length+' ca đã ghi')+metric('Chi phí tháng',money(expenses))+metric('Lãi tạm tính',money(sales-expenses),'Doanh thu − chi phí đã nhập')+metric('Giá trị hao hụt',money(loss))+metric('Nguyên liệu cần kiểm tra',warns.length)+metric('Tồn thực tế',money(stocks.reduce((n,s)=>n+stockCalc(db,s).actualValue,0)))+'</div><p class="notice warn">Lãi tạm tính chỉ lấy doanh thu trừ khoản chi đã nhập; không tự tính giá vốn bán ra, khấu hao, thuế hay chi phí còn thiếu. Giá trị hao hụt là chỉ tiêu kiểm kê riêng, không tự trừ thêm để tránh đếm trùng với chi phí.</p></section><div class="split"><section class="card"><h2>⚠️ Hao hụt cần rà soát</h2>'+(warns.length?warns.map(x=>'<div class="check"><span><b>'+esc(materialName(x.s.materialId))+'</b><small>'+esc(x.c.warnings.join(' · '))+'</small></span><strong>'+num(x.c.loss)+'</strong></div>').join(''):empty('Không có nguyên liệu vượt ngưỡng tháng này.'))+'</section><section class="card"><h2>💳 Doanh thu theo phương thức</h2>'+table(['Tiền mặt','QR / chuyển khoản','Ví / thẻ'],['<tr><td class="num">'+money(data.reduce((n,s)=>n+s.cash,0))+'</td><td class="num">'+money(data.reduce((n,s)=>n+s.qr,0))+'</td><td class="num">'+money(data.reduce((n,s)=>n+s.card,0))+'</td></tr>'])+'</section></div><section class="card"><h2>Ca đã ghi gần đây</h2>'+table(['Ngày','Ca','Tiền mặt','QR','Ví/thẻ','Tổng','Chênh quỹ','Ghi chú',''],data.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(saleRow))+'</section>'}
function salesPage(){let rows=atMonth(db.sales).filter(s=>[s.date,s.shift,s.note].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>b.date.localeCompare(a.date)),sum=rows.reduce((a,s)=>{a.cash+=s.cash;a.qr+=s.qr;a.card+=s.card;return a},{cash:0,qr:0,card:0});return hero('💳 Doanh thu theo ca','Ghi tiền mặt, QR/chuyển khoản và ví/thẻ riêng cho mỗi ca.')+'<section class="card"><div class="toolbar filters">'+monthPick()+'<input id="search" class="search" placeholder="Tìm ngày, ca, ghi chú..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="sale">+ Chốt ca</button><button class="btn" data-action="excelExport">↓ Excel</button></div><div class="grid">'+metric('Tiền mặt',money(sum.cash))+metric('QR / chuyển khoản',money(sum.qr))+metric('Ví / thẻ',money(sum.card))+metric('Tổng doanh thu',money(sum.cash+sum.qr+sum.card))+'</div><p class="notice">Có thể nhập tiền mặt đếm thực tế để thấy chênh lệch với doanh thu tiền mặt theo sổ. Không cho trùng ngày và ca.</p>'+table(['Ngày','Ca','Tiền mặt','QR','Ví/thẻ','Tổng','Chênh quỹ','Ghi chú',''],rows.map(saleRow))+'</section>'}

function materialsPage(){let rows=db.materials.filter(m=>[m.code,m.name,m.unit].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>a.code.localeCompare(b.code));return hero('📦 Danh mục nguyên liệu','Mã, đơn vị tính và giá vốn mặc định. Mỗi lần kiểm kê lưu giá vốn tại kỳ đó.')+'<section class="card"><div class="toolbar filters"><input id="search" class="search" placeholder="Tìm mã, tên, đơn vị..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-new="material">+ Nguyên liệu</button></div>'+table(['Mã','Tên nguyên liệu','ĐVT','Giá vốn mặc định','Số kỳ kiểm kê','Trạng thái',''],rows.map(m=>'<tr><td><b>'+esc(m.code)+'</b></td><td>'+esc(m.name)+'</td><td>'+esc(m.unit)+'</td><td class="num">'+money(m.unitCost)+'</td><td>'+db.stocks.filter(s=>s.materialId===m.id).length+'</td><td>'+badge(m.active?'Đang dùng':'Tạm ngừng',m.active?'ok':'')+'</td><td><button class="btn small" data-edit="material" data-id="'+esc(m.id)+'">Sửa</button></td></tr>'))+'</section>'}
function stockPage(){let rows=atMonth(db.stocks,'ym').sort((a,b)=>(material(a.materialId)?.code||'').localeCompare(material(b.materialId)?.code||'')),warnings=rows.filter(s=>stockCalc(db,s).warnings.length);return hero('⚖️ Kiểm kê & hao hụt','So sánh tồn theo sổ với số kiểm kê thực tế cho từng nguyên liệu, từng tháng.')+'<section class="card"><div class="toolbar filters">'+monthPick()+'<span class="grow"></span><button class="btn primary" data-new="stock">+ Kiểm kê</button><button class="btn" data-action="excelExport">↓ Excel</button></div><div class="grid">'+metric('Nguyên liệu đã kiểm',rows.length)+metric('Cần rà soát',warnings.length)+metric('Giá trị hao hụt',money(rows.reduce((n,s)=>n+stockCalc(db,s).lossValue,0)))+metric('Giá trị tồn thực tế',money(rows.reduce((n,s)=>n+stockCalc(db,s).actualValue,0)))+'</div><p class="notice">Tồn sổ = tồn đầu + nhập − dùng định lượng. Hao hụt = tồn sổ − tồn thực tế. Tỷ lệ hao hụt = hao hụt / lượng dùng × 100% (nếu dùng = 0, hiển thị 0%). Tồn thực tế lớn hơn sổ được cảnh báo để kiểm tra nhập kho.</p>'+table(['Nguyên liệu','ĐVT','Tồn đầu','Nhập','Dùng','Tồn sổ','Tồn thực','Hao hụt','Tỷ lệ','Giá trị','Cảnh báo',''],rows.map(stockRow))+'</section>'}
function reportsPage(){let months=[...new Set([...db.sales.map(x=>x.date.slice(0,7)),...db.expenses.map(x=>x.date.slice(0,7)),...db.stocks.map(x=>x.ym)])].sort().reverse(),byShift=SHIFTS.map(s=>({name:s,rows:atMonth(db.sales).filter(x=>x.shift===s)})),byCat=CATS.map(c=>({name:c,rows:atMonth(db.expenses).filter(x=>x.category===c)}));return hero('📈 Báo cáo kinh doanh','Doanh thu, chi phí và lãi tạm tính theo tháng, ca và nhóm chi.')+'<section class="card"><div class="toolbar filters">'+monthPick()+'<span class="grow"></span><button class="btn" data-action="print">🖨️ In báo cáo</button><button class="btn" data-action="excelExport">↓ Excel</button></div><div class="grid">'+metric('Doanh thu',money(monthSales()))+metric('Chi phí',money(monthExpenses()))+metric('Lãi tạm tính',money(monthSales()-monthExpenses()))+'</div><p class="notice warn">Chỉ tiêu lãi tạm tính chưa phải lợi nhuận kế toán. Không tự hạch toán giá vốn món đã bán, thuế, khấu hao hoặc khoản chưa ghi.</p></section><div class="split"><section class="card"><h2>Doanh thu theo ca</h2>'+table(['Ca','Số lượt','Tiền mặt','QR','Ví/thẻ','Tổng'],byShift.map(g=>'<tr><td>'+esc(g.name)+'</td><td>'+g.rows.length+'</td><td class="num">'+money(g.rows.reduce((n,x)=>n+x.cash,0))+'</td><td class="num">'+money(g.rows.reduce((n,x)=>n+x.qr,0))+'</td><td class="num">'+money(g.rows.reduce((n,x)=>n+x.card,0))+'</td><td class="num">'+money(g.rows.reduce((n,x)=>n+saleTotal(x),0))+'</td></tr>'))+'</section><section class="card"><h2>Chi phí theo nhóm</h2>'+table(['Nhóm','Số khoản','Số tiền'],byCat.map(g=>'<tr><td>'+esc(g.name)+'</td><td>'+g.rows.length+'</td><td class="num">'+money(g.rows.reduce((n,x)=>n+x.amount,0))+'</td></tr>'))+'</section></div><section class="card"><h2>Xu hướng theo tháng</h2>'+table(['Tháng','Doanh thu','Chi phí','Lãi tạm tính','Giá trị hao hụt'],months.map(m=>{let sa=db.sales.filter(x=>x.date.startsWith(m)).reduce((n,x)=>n+saleTotal(x),0),ex=db.expenses.filter(x=>x.date.startsWith(m)).reduce((n,x)=>n+x.amount,0),loss=db.stocks.filter(x=>x.ym===m).reduce((n,x)=>n+stockCalc(db,x).lossValue,0);return '<tr><td>'+esc(m)+'</td><td class="num">'+money(sa)+'</td><td class="num">'+money(ex)+'</td><td class="num">'+money(sa-ex)+'</td><td class="num">'+money(loss)+'</td></tr>'}))+'</section>'}

function dataPage(){return hero('💾 Dữ liệu & sao lưu','Sao lưu trước khi nạp mẫu, nhập Excel hoặc chuyển máy.')+'<section class="card"><div class="grid">'+metric('Nguyên liệu',db.materials.length)+metric('Kỳ kiểm kê',db.stocks.length)+metric('Ca doanh thu',db.sales.length)+metric('Khoản chi',db.expenses.length)+'</div><p class="notice warn">Sao chép file HTML gốc sang máy khác không mang theo dữ liệu trình duyệt. Hãy tải HTML kèm dữ liệu hoặc JSON.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV doanh thu</button></div><p class="muted">Workbook Excel của app gồm 5 sheet: nguyên liệu, kiểm kê, doanh thu, chi phí, cài đặt.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>8 nguyên liệu, 7 ca doanh thu và 7 khoản chi từ file tham chiếu. Mẫu chỉ nạp khi chọn.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa toàn bộ dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn sử dụng','Theo dõi quán theo ba sổ gốc: nguyên liệu, doanh thu ca và chi phí.')+'<section class="card"><h2>Quy trình mỗi ngày và mỗi tháng</h2><ol><li>Khai danh mục nguyên liệu và giá vốn mặc định.</li><li>Cuối mỗi ca ghi tiền mặt, QR/chuyển khoản và ví/thẻ. Có thể nhập tiền mặt đếm được để xem chênh quỹ.</li><li>Ghi từng khoản chi với đúng ngày, nhóm và nội dung.</li><li>Cuối tháng ghi tồn đầu, nhập, dùng theo định lượng và tồn kiểm kê từng nguyên liệu.</li><li>Xem báo cáo tháng và các cảnh báo hao hụt; sao lưu dữ liệu.</li></ol></section><section class="card"><h2>Cách tính và giới hạn</h2><p>Tồn sổ = tồn đầu + nhập − dùng định lượng. Hao hụt = tồn sổ − tồn thực. Giá trị hao hụt = hao hụt × giá vốn/đơn vị. Tỷ lệ hao hụt = hao hụt ÷ lượng dùng × 100% khi lượng dùng > 0. Doanh thu ca = tiền mặt + QR + ví/thẻ. Lãi tạm tính = doanh thu đã ghi − chi phí đã ghi.</p><p class="notice warn">App này là sổ quản trị, chưa có bán từng món/POS, công thức món hay thuế. Chi nguyên liệu là dòng tiền chi; giá trị hao hụt không tự trừ vào lãi tạm tính để tránh đếm trùng.</p></section>'}
function render(){let names={dashboard:'Tổng quan',sales:'Doanh thu ca',expenses:'Chi phí',materials:'Nguyên liệu',stock:'Kiểm kê & hao hụt',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Quán cà phê / nhà hàng')+'</b> · '+esc(names[page])+' · Tháng '+esc(month)+'</div>'+({dashboard,sales:salesPage,expenses:expensesPage,materials:materialsPage,stock:stockPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage})[page]()}
function openModal(type,id=''){let old=type==='material'?material(id):db[type==='stock'?'stocks':type==='sale'?'sales':'expenses'].find(x=>x.id===id);old=old||{};modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+({material:'nguyên liệu',stock:'kỳ kiểm kê',sale:'doanh thu ca',expense:'khoản chi'}[type]);let h='';if(type==='material')h=field('code','Mã nguyên liệu *','text',old.code||nextCode())+field('name','Tên nguyên liệu *','text',old.name||'')+field('unit','Đơn vị tính *','text',old.unit||'')+field('unitCost','Giá vốn / ĐVT (đ)','number',old.unitCost??0)+field('active','Trạng thái','select','',opt('true','Đang dùng',String(old.active!==false))+opt('false','Tạm ngừng',String(old.active!==false)))+field('note','Ghi chú','textarea',old.note||'');if(type==='stock'){let opts='<option value="">Chọn nguyên liệu</option>'+db.materials.filter(m=>m.active||m.id===old.materialId).map(m=>opt(m.id,m.code+' · '+m.name,old.materialId)).join('');h=field('ym','Tháng kiểm kê','month',old.ym||month)+field('materialId','Nguyên liệu *','select','',opts)+field('opening','Tồn đầu kỳ','number',old.opening??0)+field('incoming','Nhập trong kỳ','number',old.incoming??0)+field('used','Dùng theo định lượng','number',old.used??0)+field('actual','Tồn kiểm kê thực tế','number',old.actual??0)+field('unitCost','Giá vốn áp dụng / ĐVT (đ)','number',old.unitCost??(db.materials[0]?.unitCost||0))+field('note','Ghi chú kiểm kê','textarea',old.note||'');h+='<p class="wide notice">Số lượng có thể nhập tối đa 3 chữ số thập phân. Giá vốn được lưu trong kỳ kiểm kê.</p>'}if(type==='sale')h=field('date','Ngày bán','date',old.date||today())+field('shift','Ca','select','',options(SHIFTS,old.shift||'Sáng'))+field('cash','Tiền mặt (đ)','number',old.cash??0)+field('qr','QR / chuyển khoản (đ)','number',old.qr??0)+field('card','Ví / thẻ (đ)','number',old.card??0)+field('cashCount','Tiền mặt đếm thực tế (tùy chọn)','number',old.cashCount??'')+field('note','Ghi chú ca','textarea',old.note||'');if(type==='expense')h=field('date','Ngày chi','date',old.date||today())+field('category','Nhóm chi phí','select','',options(CATS,old.category||CATS[0]))+field('description','Nội dung *','text',old.description||'')+field('amount','Số tiền (đ)','number',old.amount??0)+field('method','Thanh toán','select','',options(['Tiền mặt','Chuyển khoản','Khác'],old.method||'Tiền mặt'))+field('note','Ghi chú','textarea',old.note||'');if(id)h+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bản ghi này</button></div>';$('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){if(!modal)return;let{type,id}=modal,x={},error='';if(type==='material'){x={code:v('code'),name:v('name'),unit:v('unit'),unitCost:amount(v('unitCost')),active:v('active')==='true',note:v('note')};if(!x.code||!x.name||!x.unit||!validMoney(x.unitCost)||db.materials.some(m=>m.id!==id&&m.code.toLowerCase()===x.code.toLowerCase()))error='Mã, tên, đơn vị, giá vốn không hợp lệ hoặc mã bị trùng.'}if(type==='stock'){x={ym:v('ym'),materialId:v('materialId'),opening:qty(v('opening')),incoming:qty(v('incoming')),used:qty(v('used')),actual:qty(v('actual')),unitCost:amount(v('unitCost')),note:v('note')};if(!validYm(x.ym)||!material(x.materialId)||![x.opening,x.incoming,x.used,x.actual].every(validQty)||!validMoney(x.unitCost))error='Tháng, nguyên liệu, số lượng hoặc giá vốn không hợp lệ.';else if(db.stocks.some(s=>s.id!==id&&s.ym===x.ym&&s.materialId===x.materialId))error='Nguyên liệu đã có kiểm kê tháng này.'}if(type==='sale'){x={date:v('date'),shift:v('shift'),cash:amount(v('cash')),qr:amount(v('qr')),card:amount(v('card')),cashCount:v('cashCount')===''?null:amount(v('cashCount')),note:v('note')};if(!validDate(x.date)||!SHIFTS.includes(x.shift)||![x.cash,x.qr,x.card].every(validMoney)||x.cashCount!==null&&!validMoney(x.cashCount))error='Ngày, ca hoặc số tiền không hợp lệ.';else if(db.sales.some(s=>s.id!==id&&s.date===x.date&&s.shift===x.shift))error='Ca này đã có doanh thu.'}if(type==='expense'){x={date:v('date'),category:v('category'),description:v('description'),amount:amount(v('amount')),method:v('method'),note:v('note')};if(!validDate(x.date)||!CATS.includes(x.category)||!x.description||!validMoney(x.amount)||x.amount===0)error='Ngày, nhóm, nội dung hoặc số tiền không hợp lệ.'}if(error){$('#modalError').textContent=error;return}let d={...db,materials:db.materials.slice(),stocks:db.stocks.slice(),sales:db.sales.slice(),expenses:db.expenses.slice()},list=d[type==='material'?'materials':type==='stock'?'stocks':type==='sale'?'sales':'expenses'];if(id){let i=list.findIndex(a=>a.id===id);list[i]={...list[i],...x}}else list.push({id:uid(),...x});if(!validBackup(d)){$('#modalError').textContent='Thay đổi làm dữ liệu liên kết hoặc số tiền không hợp lệ.';return}db=d;closeModal();save()}
function sampleData(anchor=today()){let d=blank();d.settings.lossThreshold=SOURCE.lossThreshold;for(let [i,[code,name,unit,cost,opening,incoming,used,actual]] of SOURCE.materials.entries()){let m={id:'sample-material-'+i,code,name,unit,unitCost:cost,active:true,note:'Dữ liệu mẫu từ file gốc'};d.materials.push(m);d.stocks.push({id:'sample-stock-'+i,ym:anchor.slice(0,7),materialId:m.id,opening,incoming,used,actual,unitCost:cost,note:'Kiểm kê mẫu từ file gốc'})}for(let [i,[offset,shift,cash,qr,card]] of SOURCE.sales.entries())d.sales.push({id:'sample-sale-'+i,date:addDays(anchor,Number(offset.slice(1))),shift,cash,qr,card,cashCount:null,note:'Doanh thu ca mẫu'});for(let [i,[offset,category,description,value]] of SOURCE.expenses.entries())d.expenses.push({id:'sample-expense-'+i,date:addDays(anchor,Number(offset.slice(1))),category,description,amount:value,method:'Khác',note:'Chi phí mẫu'});return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('quan-ly-quan-ca-phe-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Ngày','Ca','Tiền mặt','QR / chuyển khoản','Ví / thẻ','Tổng doanh thu','Tiền mặt đếm','Chênh lệch']];for(let s of atMonth(db.sales))rows.push([s.date,s.shift,s.cash,s.qr,s.card,saleTotal(s),s.cashCount??'',s.cashCount===null?'':s.cashCount-s.cash]);let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('quan-ca-phe-doanh-thu-'+month+'.csv',body,'text/csv;charset=utf-8')}
function excelSheets(){return[
  {name:'Nguyen lieu',rows:[['Mã','Tên','ĐVT','Giá vốn','Hoạt động','Ghi chú'],...db.materials.map(m=>[m.code,m.name,m.unit,m.unitCost,m.active?'Có':'Không',m.note])]},
  {name:'Kiem ke',rows:[['Tháng','Mã nguyên liệu','Tồn đầu','Nhập','Dùng','Tồn thực','Giá vốn chụp','Ghi chú'],...db.stocks.map(s=>[s.ym,material(s.materialId)?.code||'',s.opening,s.incoming,s.used,s.actual,s.unitCost,s.note])]},
  {name:'Doanh thu',rows:[['Ngày','Ca','Tiền mặt','QR','Ví thẻ','Tiền mặt đếm','Ghi chú'],...db.sales.map(s=>[s.date,s.shift,s.cash,s.qr,s.card,s.cashCount??'',s.note])]},
  {name:'Chi phi',rows:[['Ngày','Nhóm','Nội dung','Số tiền','Thanh toán','Ghi chú'],...db.expenses.map(e=>[e.date,e.category,e.description,e.amount,e.method,e.note])]},
  {name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]}
]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='quan-ly-quan-ca-phe.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){let ar=sheets['Nguyen lieu'],br=sheets['Kiem ke'],cr=sheets['Doanh thu'],dr=sheets['Chi phi'];if(!ar||!br||!cr||!dr||ar[0]?.[0]!=='Mã'||br[0]?.[0]!=='Tháng'||cr[0]?.[0]!=='Ngày'||dr[0]?.[0]!=='Ngày')throw Error('Cần workbook của app này với bốn bảng dữ liệu.');let d=blank();for(let r of ar.slice(1)){if(!String(r[0]??'').trim())continue;d.materials.push({id:uid(),code:String(r[0]).trim(),name:String(r[1]??'').trim(),unit:String(r[2]??'').trim(),unitCost:amount(r[3]),active:String(r[4]??'Có').trim()==='Có',note:String(r[5]??'').trim()})}for(let r of br.slice(1)){if(!String(r[0]??'').trim())continue;let m=d.materials.find(x=>x.code===String(r[1]??'').trim());if(!m)throw Error('Kiểm kê thiếu nguyên liệu.');d.stocks.push({id:uid(),ym:String(r[0]).trim(),materialId:m.id,opening:qty(r[2]),incoming:qty(r[3]),used:qty(r[4]),actual:qty(r[5]),unitCost:amount(r[6]),note:String(r[7]??'').trim()})}for(let r of cr.slice(1)){if(!String(r[0]??'').trim())continue;d.sales.push({id:uid(),date:parseDate(r[0]),shift:String(r[1]??'').trim(),cash:amount(r[2]),qr:amount(r[3]),card:amount(r[4]),cashCount:r[5]===''||r[5]===undefined?null:amount(r[5]),note:String(r[6]??'').trim()})}for(let r of dr.slice(1)){if(!String(r[0]??'').trim())continue;d.expenses.push({id:uid(),date:parseDate(r[0]),category:String(r[1]??'').trim(),description:String(r[2]??'').trim(),amount:amount(r[3]),method:String(r[4]??'').trim(),note:String(r[5]??'').trim()})}if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));if(raw.company!==undefined)d.settings.company=String(raw.company);if(raw.lossThreshold!==undefined)d.settings.lossThreshold=Number(raw.lossThreshold)}if(!validBackup(d))throw Error('Excel có mã trùng, ngày, số lượng hoặc số tiền không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập '+d.materials.length+' nguyên liệu, '+d.stocks.length+' kiểm kê, '+d.sales.length+' ca và '+d.expenses.length+' khoản chi sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('quan-ca-phe-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.materials.length||db.stocks.length||db.sales.length||db.expenses.length){if(!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();save()}if(a==='clear'){if(confirm('Xóa toàn bộ nguyên liệu, kiểm kê, doanh thu và chi phí trên trình duyệt này?')){db=blank();save()}}if(a==='deleteRecord'){let{type,id}=modal;if(type==='material'&&db.stocks.some(s=>s.materialId===id)){$('#modalError').textContent='Nguyên liệu đã có kỳ kiểm kê; không thể xóa.';return}if(confirm('Xóa vĩnh viễn bản ghi này?')){let list=db[type==='material'?'materials':type==='stock'?'stocks':type==='sale'?'sales':'expenses'];list.splice(list.findIndex(x=>x.id===id),1);closeModal();save()}}if(a==='settings'){let company=v('company'),lossThreshold=Number(v('lossThreshold'));let candidate={...db,settings:{company,lossThreshold}};if(!validBackup(candidate)){alert('Tên quán hoặc ngưỡng hao hụt không hợp lệ.');return}db=candidate;save()}});
document.addEventListener('change',e=>{if(e.target.id==='monthPick'&&validYm(e.target.value)){month=e.target.value;render()}if(e.target.id==='f_materialId'&&modal?.type==='stock'&&!modal.id){let m=material(e.target.value);if(m)$('#f_unitCost').value=m.unitCost}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
