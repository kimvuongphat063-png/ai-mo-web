function guidePage(){return hero('❔ Hướng dẫn và giới hạn','Sổ quản trị giúp chủ hộ tách quỹ và ước tính kết quả, không thay sổ kế toán theo quy định.')+'<section class="card"><ol><li>Nhập quỹ đầu kỳ trước giao dịch đầu tiên và ngày báo cáo.</li><li>Ghi từng khoản bán hàng, nhập hàng, chi phí, góp vốn và rút về gia đình.</li><li>Kiểm tra số quỹ chạy sau từng dòng với tiền/quỹ thực tế. Nếu âm, kiểm tra số đầu kỳ và giao dịch còn thiếu.</li><li>Kiểm kê hàng đầu/cuối kỳ theo giá vốn nếu muốn ước tính giá vốn và lãi.</li><li>In báo cáo, sao lưu JSON hoặc HTML kèm dữ liệu trước khi đổi máy.</li></ol><p class="notice">Công thức nguồn trừ toàn bộ tiền nhập hàng, nên chưa phản ánh hàng còn tồn. Lãi ước tính sau tồn kho vẫn chưa xét hao hụt, khấu hao, thuế và các khoản chưa nhập.</p></section><section class="card"><h2>Nguồn đối chiếu</h2><p>File gốc: '+esc(REF.source)+'. Bộ Tài chính công bố <a href="https://www.mof.gov.vn/bo-tai-chinh/thong-tin-tham-dinh-gia/huong-dan-ke-toan-cho-ho-va-ca-nhan-kinh-doanh-tu-nam-2026" target="_blank" rel="noopener noreferrer">hướng dẫn kế toán hộ, cá nhân kinh doanh theo TT152/2025/TT-BTC</a>. Liên kết cần mạng; app chạy offline.</p></section>'}
const views={dashboard,ledger:ledgerPage,inventory:inventoryPage,report:reportPage,monthly:monthlyPage,settings:settingsPage,data:dataPage,guide:guidePage},titles={dashboard:'Tổng quan',ledger:'Sổ thu chi',inventory:'Kiểm kê tồn kho',report:'Báo cáo',monthly:'Theo tháng',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};
function render(){$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML='<div class="print-head">'+esc(db.settings.shop)+' · '+esc(titles[page])+' · '+esc(db.settings.asof)+'</div>'+views[page]()}
function openModal(id=''){let old=db.items.find(x=>x.id===id)||{},x={date:localDate(),description:'',kind:KINDS[0],amount:0,evidence:'',...old};modal={id};$('#modalTitle').textContent=id?'Sửa giao dịch':'Ghi giao dịch';$('#modalFields').innerHTML=FIELDS.map(([k,l,t])=>field(k,l,t,x[k],t==='kind'?KINDS:[])).join('');$('#modalError').textContent='';$('#deleteModal').hidden=!id;$('#editor').showModal()}
function saveModal(){let x={id:modal.id||crypto.randomUUID()},d=clone(db);for(let[k,,t]of FIELDS){let v=$('#f_'+k).value.trim();x[k]=t==='number'?v===''?NaN:Number(v):v}let i=d.items.findIndex(y=>y.id===modal.id);if(i>=0)d.items[i]=x;else d.items.push(x);if(!valid(d)){$('#modalError').textContent='Nhập ngày, nội dung, loại và số tiền nguyên dương; kiểm tra tổng tiền.';return}db=d;$('#editor').close();modal=null;persist()}
function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+enc(db)+'$2');download('so-von-loi-nhuan-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function sheets(){let c=calc(db),keys=['id',...FIELDS.map(x=>x[0])],months=[...new Set(c.rows.map(x=>x.date.slice(0,7)))].sort();return[{name:'GiaoDich',rows:[keys,...db.items.map(x=>keys.map(k=>x[k]))]},{name:'CaiDat',rows:[['key','value'],...Object.entries(db.settings).map(([k,v])=>[k,v??''])]},{name:'TongHop',rows:[['Loại','Số dòng','Số tiền'],...KINDS.map(k=>[k,c.rows.filter(x=>x.kind===k).length,c.totals[k]]),['Quỹ cuối','',c.cash],['Chênh lệch nguồn','',c.proxy],['Lãi sau tồn kho ước tính','',c.estimate??'']]},{name:'TheoThang',rows:[['Tháng',...KINDS,'Chênh lệch nguồn'],...months.map(m=>{let r=c.rows.filter(x=>x.date.startsWith(m)),values=KINDS.map(k=>r.filter(x=>x.kind===k).reduce((a,x)=>a+x.amount,0));return[m,...values,values[0]-values[1]-values[2]]})]}]}
function parseSheets(s){let rows=s.GiaoDich,settings=s.CaiDat,keys=['id',...FIELDS.map(x=>x[0])];if(!Array.isArray(rows)||rows[0]?.join('|')!==keys.join('|')||!Array.isArray(settings)||settings[0]?.join('|')!=='key|value')throw Error('Excel không đúng mẫu do app xuất');let d=blank();for(let[k,v]of settings.slice(1)){if(!Object.hasOwn(d.settings,k))continue;if(['opening','stockOpen','stockClose'].includes(k)){if(v===''||v==null){d.settings[k]=k==='opening'?NaN:null}else if(typeof v==='number'&&int(v))d.settings[k]=v;else throw Error('Giá trị cài đặt '+k+' không hợp lệ')}else d.settings[k]=String(v??'')}d.items=rows.slice(1).filter(r=>r.some(v=>String(v??'').trim())).map(r=>Object.fromEntries(keys.map((k,i)=>{if(k==='amount'){if(typeof r[i]!=='number'||!int(r[i]))throw Error('Số tiền giao dịch không hợp lệ');return[k,r[i]]}return[k,String(r[i]??'').trim()]})));if(!valid(d))throw Error('Excel có ngày, loại, nội dung hoặc số tiền không hợp lệ');return d}
function csv(){let c=calc(db),rows=[['Ngày','Nội dung','Loại','Số tiền','Thu quỹ','Chi quỹ','Quỹ sau dòng','Chứng từ'],...c.rows.map(x=>[x.date,x.description,x.kind,x.amount,x.incoming,x.outgoing,x.balance,x.evidence])],cell=z=>{let s=String(z??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};download('so-von-loi-nhuan.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal();return}if(b.dataset.edit){openModal(b.dataset.edit);return}let a=b.dataset.action;if(a==='close'){$('#editor').close();modal=null}if(a==='saveModal')saveModal();if(a==='deleteRecord'&&modal?.id&&confirm('Xóa giao dịch này và tính lại quỹ?')){db.items=db.items.filter(x=>x.id!==modal.id);$('#editor').close();modal=null;persist()}if(a==='print')window.print();if(a==='settings'){let d=clone(db),v=$('#f_opening').value.trim();if(v===''){alert('Nhập quỹ đầu kỳ; dùng 0 nếu không có.');return}d.settings={...d.settings,shop:$('#f_shop').value.trim(),asof:$('#f_asof').value,opening:Number(v)};if(!valid(d)){alert('Cài đặt không hợp lệ.');return}if(d.settings.asof!==db.settings.asof&&d.settings.stockClose!==null){if(!confirm('Đổi ngày báo cáo sẽ bỏ số tồn cuối kỳ đã nhập vì mốc kiểm kê thay đổi. Tiếp tục?'))return;d.settings.stockClose=null}db=d;persist()}if(a==='inventory'){let d=clone(db);for(let k of ['stockOpen','stockClose']){let v=$('#f_'+k).value.trim();d.settings[k]=v===''?null:Number(v)}if(!valid(d)){alert('Số tồn kho phải là số nguyên không âm hoặc để trống.');return}db=d;persist()}if(a==='sample'&&confirm('Nạp mẫu sẽ thay thế dữ liệu hiện tại. Tiếp tục?')){db=sample();persist()}if(a==='clear'&&confirm('Xóa dữ liệu trên trình duyệt này?')){db=blank();persist()}if(a==='backup')download('so-von-loi-nhuan.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')download('so-von-loi-nhuan.xlsx',Excel.workbook(sheets()),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv()});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='kindFilter'){kindFilter=e.target.value;render()}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30000000)throw Error('File quá lớn');let d=JSON.parse(await f.text());if(!valid(d))throw Error('Sai cấu trúc hoặc phiên bản');if(!confirm('Khôi phục sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;db=d;persist()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20000000)throw Error('File quá lớn');let d=parseSheets(await Excel.read(f));if(!confirm('Nhập Excel sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;db=d;persist()}catch(err){alert('Không nhập được Excel: '+err.message)}});
window.__CAPITAL_TEST__={blank,sample,valid,calc,sheets,parseSheets,enc,dec,setDB:d=>{db=d;render()},getDB:()=>db,renderPage:p=>{page=p;render()}};
render();
})();
</script></body></html>
