function state(l){let o=occupied(l);return o>l.capacity?'Chứa vượt sức chứa':percent(l)>=db.settings.near?'Gần đầy':o===0?'Vị trí trống':''}
function stats(){let capacity=db.locations.reduce((n,l)=>n+l.capacity,0),used=db.locations.reduce((n,l)=>n+occupied(l),0);return {locations:db.locations.length,placements:db.placements.length,capacity,used,free:round2(capacity-used),near:db.locations.filter(l=>['Gần đầy','Chứa vượt sức chứa'].includes(state(l))).length,empty:db.locations.filter(l=>occupied(l)===0).length}}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!validDate(x.settings.asof)||!Number.isFinite(x.settings.near)||x.settings.near<0||x.settings.near>100||!Array.isArray(x.locations)||!Array.isArray(x.placements)||!Array.isArray(x.movements)||!Array.isArray(x.audit))return 'Cấu trúc hoặc cài đặt không hợp lệ.';
 let ls=new Set(),codes=new Set();for(let l of x.locations){if(!l.id||ls.has(l.id)||!l.code||codes.has(l.code.toUpperCase())||!l.zone||!Number.isFinite(l.capacity)||l.capacity<0||String(l.note||'').length>1200)return 'Vị trí thiếu, sai hoặc trùng mã.';ls.add(l.id);codes.add(l.code.toUpperCase())}
 let ps=new Set();for(let p of x.placements){if(!p.id||ps.has(p.id)||!ls.has(p.locationId)||!p.name||!validDate(p.date)||!Number.isFinite(p.opening)||p.opening<0||String(p.note||'').length>1200)return 'Dòng hàng không hợp lệ.';ps.add(p.id)}
 let ms=new Set();for(let m of x.movements){if(!m.id||ms.has(m.id)||!validDate(m.date)||!['transfer','out'].includes(m.type)||!ps.has(m.fromId)||m.type==='transfer'&&!ps.has(m.toId)||m.type==='out'&&m.toId||!Number.isFinite(m.qty)||m.qty<=0||!m.reason)return 'Giao dịch kho không hợp lệ.';if(m.type==='transfer'){let a=x.placements.find(p=>p.id===m.fromId),b=x.placements.find(p=>p.id===m.toId);if(a.name!==b.name||a.locationId===b.locationId)return 'Chuyển vị trí phải cùng hàng hóa và khác ô.'}ms.add(m.id)}
 for(let p of x.placements){let q=p.opening+x.movements.reduce((n,m)=>n+(m.toId===p.id?m.qty:0)-(m.fromId===p.id?m.qty:0),0);if(q<-.001)return 'Số lượng hàng tại ô không được âm.'}
 for(let l of x.locations){let q=x.placements.filter(p=>p.locationId===l.id).reduce((n,p)=>n+p.opening+x.movements.reduce((sum,m)=>sum+(m.toId===p.id?m.qty:0)-(m.fromId===p.id?m.qty:0),0),0);if(q>l.capacity+.001&&!l.sourceOver)return 'Vượt sức chứa vị trí.'}
 let logs=new Set();for(let a of x.audit){if(!a.id||logs.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';logs.add(a.id)}return ''}
function b64(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function embedded(){try{let t=$('#embedded-state').textContent.trim();return t==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(t))))}catch{return null}}
try{let e=embedded(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let v=validate(db);if(v){alert(v);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu vào bộ nhớ trình duyệt. Hãy xuất JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,detail,ref=''){db.audit.push({id:uid(),at:new Date().toISOString(),action,detail,ref})}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body,cls=''){return `<section class="panel ${cls}"><h2>${title}</h2>${body}</section>`}
function locCard(l){let o=occupied(l),p=percent(l),s=state(l),names=db.placements.filter(x=>x.locationId===l.id&&quantity(x)>0).map(x=>x.name);return `<button class="bin ${s==='Chứa vượt sức chứa'?'overflow':s==='Gần đầy'?'near':o===0?'empty':''}" data-act="openLocation" data-id="${esc(l.id)}"><span class="bin-top"><b>${esc(l.code)}</b><span>${num(p)}%</span></span><span class="bin-zone">${esc(l.zone)}</span><span class="meter"><i style="width:${Math.min(100,p)}%"></i></span><strong>${num(o)} / ${num(l.capacity)}</strong><small>${names.length?esc([...new Set(names)].slice(0,3).join(' · ')):'Ô trống — sẵn sàng nhập'}</small><span class="bin-state">${esc(s||'Đang sử dụng')}</span></button>`}
function mapPage(){let s=stats(),zones=[...new Set(db.locations.map(l=>l.zone))].sort(),ll=db.locations.filter(l=>(zone==='all'||l.zone===zone)&&(!query||[l.code,l.zone,...db.placements.filter(p=>p.locationId===l.id).map(p=>p.name)].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))));return `<div class="intro"><div><span class="eyebrow">AI MỞ · SƠ ĐỒ KHO</span><h1>Mỗi ô rõ hàng. Mỗi lượt rõ chỗ.</h1><p>Nhìn sức chứa theo khu, tìm ngay hàng đang đặt và chuyển ô khi cần.</p></div><div class="intro-actions">${btn('＋ Nhập hàng','newPlacement','primary')}${btn('＋ Tạo ô','newLocation')}</div></div><div class="ribbon"><div><span>TỔNG SỨC CHỨA</span><b>${num(s.capacity)}</b></div><div><span>ĐANG CHỨA</span><b>${num(s.used)}</b></div><div><span>CÒN TRỐNG</span><b>${num(s.free)}</b></div><div><span>GẦN ĐẦY / VƯỢT</span><b>${s.near}</b></div></div><div class="workspace"><aside class="zone-rail"><h2>🧭 Khu vực</h2><button data-act="setZone" data-id="all" class="${zone==='all'?'active':''}">Tất cả <b>${db.locations.length}</b></button>${zones.map(z=>`<button data-act="setZone" data-id="${esc(z)}" class="${zone===z?'active':''}">${esc(z)} <b>${db.locations.filter(l=>l.zone===z).length}</b></button>`).join('')}<div class="rail-note"><b>Quy tắc sức chứa</b><p>Đang chứa = tổng lượng hàng ở ô. Từ ${num(db.settings.near)}% hiển thị gần đầy; thao tác mới không được vượt sức chứa.</p></div></aside><div class="map-board"><div class="board-head"><div><h2>▦ Mặt bằng vị trí</h2><p>${ll.length} ô đang hiển thị · chọn một ô để xem hàng</p></div><label class="search-label">Tìm ô hoặc hàng<input id="mapSearch" value="${esc(query)}" placeholder="KE-A-01, sữa bột…"></label></div>${ll.length?`<div class="bin-grid">${ll.map(locCard).join('')}</div>`:'<div class="empty-state">Chưa có vị trí phù hợp. Tạo ô mới hoặc nạp mẫu tham chiếu.</div>'}</div></div><p class="footnote">Số lượng tổng hợp có thể gộp nhiều loại hàng; sức chứa trong file mẫu là đơn vị quy ước, cần quy đổi phù hợp cách quản lý kho thực tế.</p>`}
function locationsPage(){return `<div class="heading"><div><h1>▦ Danh mục ô kệ</h1><p>Sức chứa và tỷ lệ sử dụng theo từng vị trí.</p></div>${btn('＋ Tạo ô','newLocation','primary')}</div>${panel('Các vị trí',`<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Khu</th><th>Sức chứa</th><th>Đang chứa</th><th>Còn trống</th><th>Sử dụng</th><th>Tình trạng</th><th></th></tr></thead><tbody>${db.locations.map(l=>`<tr><td><button class="link" data-act="openLocation" data-id="${esc(l.id)}">${esc(l.code)}</button></td><td>${esc(l.zone)}</td><td>${num(l.capacity)}</td><td>${num(occupied(l))}</td><td>${num(free(l))}</td><td>${num(percent(l))}%</td><td>${esc(state(l)||'Đang sử dụng')}</td><td>${btn('Xem','openLocation','small',l.id)}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có vị trí.</td></tr>'}</tbody></table></div>`)}`}
function locationPage(){let l=getLocation(selected);if(!l){page='map';return mapPage()}let pp=db.placements.filter(p=>p.locationId===l.id);return `<div class="heading"><div><button class="link" data-act="map">← Sơ đồ kho</button><h1>${esc(l.code)} <em>${esc(l.zone)}</em></h1><p>${esc(l.note||'Vị trí lưu trữ trong kho')}</p></div><div class="actions">${btn('＋ Nhập vào ô','newPlacement','primary',l.id)}${btn('Sửa ô','editLocation','',l.id)}${btn('🖨️ In','print')}</div></div><div class="detail-band"><div><small>ĐANG CHỨA</small><b>${num(occupied(l))}</b></div><div><small>SỨC CHỨA</small><b>${num(l.capacity)}</b></div><div><small>CÒN TRỐNG</small><b>${num(free(l))}</b></div><div><small>ĐỘ LẤP ĐẦY</small><b>${num(percent(l))}%</b></div></div>${panel('📦 Hàng trong ô',`<div class="table-wrap"><table><thead><tr><th>Hàng hóa</th><th>Ngày đặt</th><th>Ban đầu</th><th>Hiện tại</th><th>Tuổi đặt hàng</th><th>Ghi chú</th><th></th></tr></thead><tbody>${pp.map(p=>`<tr><td><button class="link" data-act="openPlacement" data-id="${esc(p.id)}">${esc(p.name)}</button></td><td>${fmt(p.date)}</td><td>${num(p.opening)}</td><td><b>${num(quantity(p))}</b></td><td>${Math.max(0,days(db.settings.asof,p.date))} ngày</td><td>${esc(p.note||'—')}</td><td>${btn('Xem','openPlacement','small',p.id)}</td></tr>`).join('')||'<tr><td colspan="7">Ô đang trống.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký liên quan',db.audit.filter(a=>a.ref===l.id||pp.some(p=>p.id===a.ref)).slice().reverse().map(a=>`<div class="event"><b>${esc(a.action)}</b><span>${esc(a.detail)}</span><small>${esc(a.at.slice(0,16).replace('T',' '))}</small></div>`).join('')||'<p>Chưa có nhật ký.</p>')}`}
function placementsPage(){let pp=db.placements.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="heading"><div><h1>📦 Hàng trong kho</h1><p>Chọn một dòng để xem vị trí và lịch sử di chuyển.</p></div>${btn('＋ Nhập hàng','newPlacement','primary')}</div>${panel('Danh sách hàng đã đặt',`<div class="table-wrap"><table><thead><tr><th>Ngày đặt</th><th>Hàng hóa</th><th>Vị trí</th><th>Ban đầu</th><th>Hiện tại</th><th>Tuổi</th><th></th></tr></thead><tbody>${pp.map(p=>`<tr><td>${fmt(p.date)}</td><td>${esc(p.name)}</td><td>${esc(getLocation(p.locationId).code)}</td><td>${num(p.opening)}</td><td>${num(quantity(p))}</td><td>${Math.max(0,days(db.settings.asof,p.date))} ngày</td><td>${btn('Chi tiết','openPlacement','small',p.id)}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có hàng.</td></tr>'}</tbody></table></div>`)}`}
function placementPage(){let p=placement(selected);if(!p){page='placements';return placementsPage()}let l=getLocation(p.locationId),mov=db.movements.filter(m=>m.fromId===p.id||m.toId===p.id);return `<div class="heading"><div><button class="link" data-act="placements">← Hàng trong kho</button><h1>${esc(p.name)}</h1><p>${esc(l.code)} · ${esc(l.zone)} · đặt ${fmt(p.date)}</p></div><div class="actions">${quantity(p)>0?btn('⇄ Chuyển ô','transfer','primary',p.id)+btn('↗ Xuất kho','out','',p.id):''}${btn('🖨️ In','print')}</div></div><div class="detail-band"><div><small>LƯỢNG BAN ĐẦU</small><b>${num(p.opening)}</b></div><div><small>ĐANG Ở Ô</small><b>${num(quantity(p))}</b></div><div><small>Ô CÒN TRỐNG</small><b>${num(free(l))}</b></div><div><small>NGÀY ĐẶT</small><b>${fmt(p.date)}</b></div></div>${panel('🧾 Thông tin',`<p>${esc(p.note||'Chưa có ghi chú.')}</p><p class="footnote">Dòng mẫu gốc mang số lượng hiện tại tại thời điểm nạp mẫu; ngày và chứng từ phát sinh trước đó không có trong nguồn.</p>`)}${panel('🔄 Lịch sử di chuyển',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Loại</th><th>Số lượng</th><th>Từ / đến</th><th>Chứng từ</th><th>Lý do</th></tr></thead><tbody>${mov.map(m=>`<tr><td>${fmt(m.date)}</td><td>${m.type==='transfer'?'Chuyển ô':'Xuất kho'}</td><td>${num(m.qty)}</td><td>${m.type==='transfer'?`${esc(getLocation(placement(m.fromId).locationId).code)} → ${esc(getLocation(placement(m.toId).locationId).code)}`:esc(l.code)+' → ra kho'}</td><td>${esc(m.doc||'—')}</td><td>${esc(m.reason)}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có phát sinh mới.</td></tr>'}</tbody></table></div>`)}`}
function reportsPage(){let s=stats(),zones=[...new Set(db.locations.map(l=>l.zone))];return `<div class="heading"><div><h1>▥ Báo cáo kho</h1><p>Đối chiếu sức chứa, hàng đang đặt và vị trí cần xem.</p></div>${btn('⬇ Excel','exportExcel','primary')}</div><div class="report-pills"><div><small>Sức chứa</small><b>${num(s.capacity)}</b></div><div><small>Đang chứa</small><b>${num(s.used)}</b></div><div><small>Còn trống</small><b>${num(s.free)}</b></div><div><small>Gần đầy / vượt</small><b>${s.near}</b></div></div><div class="report-grid">${panel('Theo khu',`<div class="table-wrap"><table><thead><tr><th>Khu</th><th>Ô</th><th>Sức chứa</th><th>Đang chứa</th><th>Còn trống</th></tr></thead><tbody>${zones.map(z=>{let a=db.locations.filter(l=>l.zone===z),cap=a.reduce((n,l)=>n+l.capacity,0),used=a.reduce((n,l)=>n+occupied(l),0);return `<tr><td>${esc(z)}</td><td>${a.length}</td><td>${num(cap)}</td><td>${num(used)}</td><td>${num(cap-used)}</td></tr>`}).join('')||'<tr><td colspan="5">Chưa có dữ liệu.</td></tr>'}</tbody></table></div>`)}${panel('Ô cần xem',db.locations.filter(l=>state(l)==='Gần đầy'||state(l)==='Chứa vượt sức chứa').map(l=>`<div class="event"><button class="link" data-act="openLocation" data-id="${esc(l.id)}">${esc(l.code)}</button><span>${esc(state(l))} · ${num(occupied(l))}/${num(l.capacity)} (${num(percent(l))}%)</span></div>`).join('')||'<p>Chưa có ô gần đầy hoặc vượt sức chứa.</p>')}</div>${panel('Theo vị trí',`<div class="table-wrap"><table><thead><tr><th>Vị trí</th><th>Khu</th><th>Sức chứa</th><th>Đang chứa</th><th>Trống</th><th>Tỷ lệ</th><th>Cảnh báo</th></tr></thead><tbody>${db.locations.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.zone)}</td><td>${num(l.capacity)}</td><td>${num(occupied(l))}</td><td>${num(free(l))}</td><td>${num(percent(l))}%</td><td>${esc(state(l)||'—')}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có ô.</td></tr>'}</tbody></table></div>`)}<p class="footnote">Tỷ lệ sử dụng = đang chứa ÷ sức chứa × 100, làm tròn 1 chữ số. Sức chứa là đơn vị quy ước trong file tham chiếu; hàng có kích cỡ khác nhau cần quy đổi trước khi sử dụng thực tế.</p>`}
function settingsPage(){return `<div class="heading"><h1>⚙ Cài đặt</h1></div>${panel('Ngày đối chiếu và ngưỡng gần đầy',`<form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input type="date" name="asof" required value="${esc(db.settings.asof)}"></label><label>Gần đầy từ (%)<input type="number" name="near" min="0" max="100" step="0.1" required value="${db.settings.near}"></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="footnote">Nguồn dùng ngưỡng gần đầy mặc định 90%. Cài đặt mới áp dụng cảnh báo hiện tại, không thay đổi lịch sử.</p>`)}`}
function dataPage(){return `<div class="heading"><h1>↧ Dữ liệu và sao lưu</h1></div><div class="report-grid">${panel('Tải bản sao',`<p>Dữ liệu nhập lưu trên trình duyệt của máy hiện tại. Xuất JSON hoặc HTML kèm dữ liệu trước khi đổi máy.</p><div class="actions">${btn('⬇ JSON đầy đủ','exportJSON','primary')}${btn('⬇ HTML kèm dữ liệu','exportHTML')}${btn('⬇ Excel đối chiếu','exportExcel')}</div>`)}${panel('Nhập và mẫu',`<p>Nhập JSON thay toàn bộ dữ liệu hiện có. Mẫu tham chiếu gồm 8 vị trí và 20 dòng hàng.</p><div class="actions">${btn('⬆ Nhập JSON','importJSON')}${btn('Nạp mẫu','loadSample')}${btn('Xóa toàn bộ','clearData','danger')}</div>`)}</div>${panel('Phiên bản',`<p>Dữ liệu v${VERSION} · ${db.locations.length} vị trí · ${db.placements.length} dòng hàng · ${db.movements.length} giao dịch mới.</p><p>Không có API hoặc đồng bộ qua mạng. Tệp Excel chỉ dùng để xem và đối soát; khôi phục đầy đủ bằng JSON hoặc HTML kèm dữ liệu.</p>`)}`}
function guidePage(){return `<div class="heading"><h1>? Cách sử dụng</h1></div>${panel('Quy trình',`<ol><li>Tạo mã ô kệ, khu và sức chứa quy ước.</li><li>Nhập hàng vào một ô, ghi ngày, số lượng và ghi chú.</li><li>Mở ô hoặc dòng hàng để xem lượng hiện tại và lịch sử.</li><li>Chuyển hàng sang ô khác hoặc xuất khỏi kho; app chặn xuất quá lượng đang có và nhập/chuyển làm vượt sức chứa.</li><li>Xem sơ đồ, lọc theo khu, tìm hàng và xuất báo cáo.</li><li>Sao lưu JSON/HTML kèm dữ liệu sau các đợt cập nhật quan trọng.</li></ol>`)}${panel('Công thức và giới hạn',`<p><b>Đang chứa:</b> tổng lượng ở vị trí. <b>Còn trống:</b> sức chứa − đang chứa. <b>Tỷ lệ sử dụng:</b> đang chứa / sức chứa × 100, làm tròn 1 chữ số. <b>Gần đầy:</b> tỷ lệ ≥ ngưỡng cài đặt, mặc định 90%.</p><p>App độc lập, không đồng bộ tự động với app tồn kho khác. Không lưu điều kiện bảo quản; hàng cần bảo quản đặc thù phải theo quy trình riêng. Ngày đặt chỉ cho biết tuổi dòng hàng, không phải hạn dùng.</p>`)}`}
function render(){let views={map:mapPage,locations:locationsPage,location:locationPage,placements:placementsPage,placement:placementPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML=(views[page]||mapPage)();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='location'&&b.dataset.page==='locations'||page==='placement'&&b.dataset.page==='placements'))}
function input(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(label,name,items,current=''){return `<label>${label}<select name="${name}" required>${items.map(([v,t])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function area(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1200">${esc(value)}</textarea></label>`}
function form(kind,id=''){draft={kind,id};let title='',fields='';if(kind==='location'){let l=getLocation(id)||{};title=id?'Sửa vị trí':'Tạo vị trí';fields=input('Mã ô *','code',l.code,'text','required maxlength="50"')+input('Khu *','zone',l.zone,'text','required maxlength="80"')+input('Sức chứa *','capacity',l.capacity??0,'number','required min="0" step="0.01"')+area('Ghi chú','note',l.note)}else if(kind==='placement'){if(!db.locations.length)return alert('Tạo vị trí trước khi nhập hàng.');title='Nhập hàng vào ô';fields=input('Ngày đặt *','date',today(),'date','required')+input('Hàng hóa *','name','','text','required maxlength="160"')+select('Vị trí *','locationId',db.locations.map(l=>[l.id,`${l.code} · ${l.zone} · còn ${num(free(l))}`]),id||db.locations[0].id)+input('Số lượng *','opening',1,'number','required min="0.01" step="0.01"')+area('Chứng từ / ghi chú','note','')}else if(kind==='transfer'){let p=placement(id),from=getLocation(p.locationId);title='Chuyển '+p.name;fields=`<p class="full hint">Đang ở ${esc(from.code)}: ${num(quantity(p))}. Chọn ô còn đủ sức chứa.</p>`+input('Ngày chuyển *','date',today(),'date','required')+select('Ô đến *','locationId',db.locations.filter(l=>l.id!==from.id).map(l=>[l.id,`${l.code} · ${l.zone} · còn ${num(free(l))}`]))+input('Số lượng *','qty',Math.min(1,quantity(p)),'number','required min="0.01" step="0.01"')+input('Chứng từ','doc','','text','maxlength="100"')+area('Lý do *','reason','')}else if(kind==='out'){let p=placement(id);title='Xuất '+p.name;fields=`<p class="full hint">Hiện có ${num(quantity(p))} ở ${esc(getLocation(p.locationId).code)}.</p>`+input('Ngày xuất *','date',today(),'date','required')+input('Số lượng *','qty',Math.min(1,quantity(p)),'number','required min="0.01" step="0.01"')+input('Chứng từ','doc','','text','maxlength="100"')+area('Lý do *','reason','')}$('#dialogTitle').textContent=title;$('#formFields').innerHTML=fields;$('#formError').textContent='';$('#editor').showModal()}
function fval(f,k){return String(new FormData(f).get(k)||'').trim()}
function submit(e){e.preventDefault();let f=e.target,{kind,id}=draft,before=copy(db);try{if(kind==='location'){let code=fval(f,'code'),zone=fval(f,'zone'),capacity=Number(fval(f,'capacity')),l=getLocation(id);if(!code||!zone||!Number.isFinite(capacity)||capacity<0)throw Error('Kiểm tra mã, khu và sức chứa.');if(db.locations.some(z=>z.id!==id&&z.code.toUpperCase()===code.toUpperCase()))throw Error('Mã vị trí đã tồn tại.');if(l){if(capacity<occupied(l)-.001)throw Error('Sức chứa mới nhỏ hơn lượng đang có.');Object.assign(l,{code,zone,capacity,note:fval(f,'note')})}else{l={id:uid(),code,zone,capacity,note:fval(f,'note'),sourceOver:false};db.locations.push(l)}audit(id?'Sửa vị trí':'Tạo vị trí',code,l.id);selected=l.id;page='location'}else if(kind==='placement'){let locationId=fval(f,'locationId'),l=getLocation(locationId),name=fval(f,'name'),date=fval(f,'date'),opening=Number(fval(f,'opening'));if(!l||!name||!validDate(date)||!Number.isFinite(opening)||opening<=0)throw Error('Kiểm tra ngày, hàng, vị trí và số lượng.');if(opening>free(l)+.001)throw Error('Ô không đủ sức chứa.');let p={id:uid(),locationId,name,date,opening,note:fval(f,'note')};db.placements.push(p);audit('Nhập hàng',`${name}: ${num(opening)} vào ${l.code}`,p.id);selected=p.id;page='placement'}else if(kind==='transfer'||kind==='out'){let p=placement(id),qty=Number(fval(f,'qty')),date=fval(f,'date'),reason=fval(f,'reason'),doc=fval(f,'doc');if(!p||!validDate(date)||!Number.isFinite(qty)||qty<=0||!reason)throw Error('Cần ngày, số lượng và lý do hợp lệ.');if(qty>quantity(p)+.001)throw Error('Số lượng vượt hàng hiện có.');let m={id:uid(),type:kind==='transfer'?'transfer':'out',fromId:id,toId:'',date,qty,doc,reason};if(kind==='transfer'){let l=getLocation(fval(f,'locationId'));if(!l||l.id===p.locationId)throw Error('Chọn ô đích khác ô hiện tại.');if(qty>free(l)+.001)throw Error('Ô đích không đủ sức chứa.');let dest={id:uid(),locationId:l.id,name:p.name,date,opening:0,note:`Chuyển từ ${getLocation(p.locationId).code}${doc?' · '+doc:''}`};db.placements.push(dest);m.toId=dest.id;audit('Chuyển ô',`${p.name}: ${num(qty)} từ ${getLocation(p.locationId).code} sang ${l.code} · ${reason}`,id);selected=dest.id}else{audit('Xuất kho',`${p.name}: ${num(qty)} từ ${getLocation(p.locationId).code} · ${reason}`,id);selected=id}db.movements.push(m);page='placement'}let v=validate(db);if(v)throw Error(v);$('#editor').close();draft=null;save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'vi-tri-hang-trong-kho-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+b64(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'vi-tri-hang-trong-kho-kem-du-lieu.html')}
function sheets(){return [{name:'ViTri',rows:[['Mã','Khu','Sức chứa','Đang chứa','Còn trống','Tỷ lệ %','Cảnh báo','Ghi chú'],...db.locations.map(l=>[l.code,l.zone,l.capacity,occupied(l),free(l),percent(l),state(l),l.note])]},{name:'HangTrongKho',rows:[['Ngày đặt','Hàng hóa','Vị trí','Số ban đầu','Số hiện tại','Ghi chú'],...db.placements.map(p=>[p.date,p.name,getLocation(p.locationId).code,p.opening,quantity(p),p.note])]},{name:'DiChuyen',rows:[['Ngày','Loại','Hàng hóa','Từ','Đến','Số lượng','Chứng từ','Lý do'],...db.movements.map(m=>{let p=placement(m.fromId);return [m.date,m.type==='transfer'?'Chuyển ô':'Xuất kho',p.name,getLocation(p.locationId).code,m.toId?getLocation(placement(m.toId).locationId).code:'',m.qty,m.doc,m.reason]})]},{name:'NhatKy',rows:[['Thời điểm','Thao tác','Chi tiết','Tham chiếu'],...db.audit.map(a=>[a.at,a.action,a.detail,a.ref])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Ngưỡng gần đầy %'],[db.settings.asof,db.settings.near]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'vi-tri-hang-trong-kho-bao-cao.xlsx')}
function sampleDB(){let x=blank();for(let [code,zone,capacity] of WAREHOUSE_SAMPLE.vt)x.locations.push({id:uid(),code,zone,capacity,note:'Vị trí mẫu tham chiếu',sourceOver:false});for(let [relative,name,code,opening] of WAREHOUSE_SAMPLE.hh){let l=x.locations.find(l=>l.code===code);x.placements.push({id:uid(),locationId:l.id,name,date:offset(relative),opening,note:'Dòng mẫu từ file gốc; chưa có chứng từ phát sinh.'})}return x}
function action(act,id=''){if(['map','locations','placements','reports','settings','data','guide'].includes(act)){page=act;render();return}if(act==='setZone'){zone=id;page='map';render();return}if(act==='openLocation'){selected=id;page='location';render();return}if(act==='openPlacement'){selected=id;page='placement';render();return}if(act==='newLocation')return form('location');if(act==='editLocation')return form('location',id);if(act==='newPlacement')return form('placement',id);if(act==='transfer'||act==='out')return form(act,id);if(act==='print')return print();if(act==='saveSettings'){let f=$('#settingsForm'),asof=f.elements.asof.value,near=Number(f.elements.near.value);if(!validDate(asof)||!Number.isFinite(near)||near<0||near>100)return alert('Cài đặt không hợp lệ.');db.settings={asof,near};audit('Đổi cài đặt',`Ngày ${asof}, ngưỡng ${near}%`);save();return}if(act==='exportJSON')return exportJSON();if(act==='exportHTML')return exportHTML();if(act==='exportExcel')return exportExcel();if(act==='importJSON')return $('#jsonFile').click();if(act==='loadSample'){if((db.locations.length||db.placements.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện có. Tiếp tục?'))return;let x=sampleDB(),err=validate(x);if(err)return alert('Mẫu không hợp lệ: '+err);db=x;page='map';zone='all';save();return}if(act==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên trình duyệt này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=blank();page='map';zone='all';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)action(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submit);$('#closeDialog').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),v=validate(x);if(v)throw Error(v);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện có. Tiếp tục?'))return;db=x;zone='all';page='map';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('input',e=>{if(e.target.id==='mapSearch'){let pos=e.target.selectionStart;query=e.target.value;render();let a=$('#mapSearch');a.focus();a.setSelectionRange(pos,pos)}});render();

</script></body></html>
