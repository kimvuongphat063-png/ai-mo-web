const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const validDate=s=>/^\d{4}-\d\d-\d\d$/.test(s)&&!Number.isNaN(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
const date=s=>s?String(s).split('-').reverse().join('/'):'—';
const days=(a,b)=>Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000);
const addDays=(s,n)=>{let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const blank=()=>({version:1,updatedAt:Date.now(),settings:{asof:'',company:''},appointments:[]});
function validRecord(a){return a&&typeof a.id==='string'&&!!a.id&&validDate(a.date)&&SLOTS.includes(a.slot)&&typeof a.customer==='string'&&!!a.customer.trim()&&a.customer.length<=160&&PURPOSES.includes(a.purpose)&&typeof a.owner==='string'&&!!a.owner.trim()&&a.owner.length<=160&&STATUSES.includes(a.status)&&RESULTS.includes(a.result)&&(!a.followUp||validDate(a.followUp))&&(!a.time||/^([01]\d|2[0-3]):[0-5]\d$/.test(a.time))&&['phone','location','note','nextAction'].every(k=>typeof a[k]==='string'&&a[k].length<=2000)&&typeof a.followUpDone==='boolean'&&(!a.parentId||typeof a.parentId==='string')}
function validBackup(x){if(!x||x.version!==1||!x.settings||typeof x.settings.company!=='string'||x.settings.company.length>160||x.settings.asof&&!validDate(x.settings.asof)||!Array.isArray(x.appointments)||x.appointments.length>50000)return false;let ids=new Set();for(let a of x.appointments){if(!validRecord(a)||ids.has(a.id))return false;ids.add(a.id)}return x.appointments.every(a=>!a.parentId||ids.has(a.parentId))}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return validBackup(x)?x:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim()),saved=stored();
let db=validBackup(embedded)&&(!saved||(embedded.updatedAt||0)>=(saved.updatedAt||0))?embedded:saved||blank(),page='dashboard',query='',statusFilter='all',ownerFilter='all',modalId='',followParent='';
const asof=()=>db.settings.asof||today();
const rec=id=>db.appointments.find(a=>a.id===id);
function warnings(a,at=asof()){let v=[];if(a.status==='Chưa gặp'&&days(at,a.date)>0)v.push('Quá ngày hẹn chưa gặp');if(a.status==='Đã gặp'&&a.result==='Chưa có')v.push('Đã gặp chưa ghi kết quả');if(a.result==='Hẹn gặp lại'&&a.followUp&&!a.followUpDone&&days(at,a.followUp)>0)v.push('Quá hẹn gặp lại');if(a.status==='Hoãn'&&!a.followUp&&!a.followUpDone)v.push('Hoãn chưa đặt lịch mới');if(a.result==='Hẹn gặp lại'&&!a.followUp&&!a.followUpDone)v.push('Cần đặt ngày hẹn tiếp');return v}
function task(a,at=asof()){let w=warnings(a,at);if(w.includes('Quá ngày hẹn chưa gặp'))return{rank:0,label:'Quá hẹn '+days(at,a.date)+' ngày',kind:'late',due:a.date};if(w.includes('Quá hẹn gặp lại'))return{rank:1,label:'Hẹn tiếp quá '+days(at,a.followUp)+' ngày',kind:'late',due:a.followUp};if(w.includes('Đã gặp chưa ghi kết quả'))return{rank:2,label:'Chưa ghi kết quả',kind:'due',due:a.date};if(w.includes('Hoãn chưa đặt lịch mới')||w.includes('Cần đặt ngày hẹn tiếp'))return{rank:3,label:w[0],kind:'due',due:a.date};if(a.result==='Hẹn gặp lại'&&a.followUp&&!a.followUpDone&&days(at,a.followUp)===0)return{rank:4,label:'Hẹn tiếp hôm nay',kind:'next',due:a.followUp};if(a.status==='Chưa gặp'&&days(at,a.date)===0)return{rank:5,label:'Gặp hôm nay',kind:'next',due:a.date};if(a.result==='Hẹn gặp lại'&&a.followUp&&!a.followUpDone&&days(at,a.followUp)<0)return{rank:6,label:'Hẹn tiếp sắp tới',kind:'next',due:a.followUp};if(a.status==='Chưa gặp'&&days(at,a.date)<0)return{rank:7,label:'Lịch sắp tới',kind:'next',due:a.date};return null}
function tasks(){return db.appointments.map(a=>({a,t:task(a)})).filter(x=>x.t).sort((x,y)=>x.t.rank-y.t.rank||x.t.due.localeCompare(y.t.due)||x.a.slot.localeCompare(y.a.slot))}
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(h,s)=>'<div class="hero"><h1>'+esc(h)+'</h1><p>'+esc(s)+'</p></div>';
const metric=(name,value,sub='')=>'<div class="metric"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>';

function dateLine(a){return date(a.date)+' · '+esc(a.time||a.slot)}
function row(a){let w=warnings(a),t=task(a);return '<tr><td><b>'+date(a.date)+'</b><br>'+esc(a.time||a.slot)+'</td><td><b>'+esc(a.customer)+'</b><br><small>'+esc(a.phone||'')+'</small></td><td>'+esc(a.purpose)+'<br><small>'+esc(a.location||'')+'</small></td><td>'+esc(a.owner)+'</td><td>'+badge(a.status,a.status==='Đã gặp'?'done':a.status==='Hủy'?'':'next')+'</td><td>'+badge(a.result,a.result==='Chốt đơn'?'done':'')+'</td><td>'+date(a.followUp)+(a.followUpDone?' ✓':'')+'</td><td>'+(w.length?w.map(s=>badge(s,'late')).join('<br>'):t?badge(t.label,t.kind):'—')+'</td><td><button class="btn small" data-edit="'+esc(a.id)+'">Sửa</button></td></tr>'}
function agendaCard(a,t){return '<div class="agenda-item"><div><b>'+date(t.due)+'</b><small>'+esc(a.time||a.slot)+'</small></div><div><strong>'+esc(a.customer)+'</strong> '+badge(t.label,t.kind)+'<small>'+esc(a.purpose)+' · '+esc(a.owner)+(a.location?' · '+esc(a.location):'')+'</small>'+(a.nextAction?'<small>Việc tiếp: '+esc(a.nextAction)+'</small>':'')+'</div><div class="actions no-print"><button class="btn small" data-edit="'+esc(a.id)+'">Cập nhật</button>'+(a.followUp&&!a.followUpDone?'<button class="btn small" data-follow="'+esc(a.id)+'">Tạo lịch tiếp</button>':'')+'</div></div>'}

function agendaPage(){let list=tasks();return hero('🔔 Việc cần làm','Ưu tiên lịch quá hạn, buổi gặp chưa ghi kết quả và các lần hẹn tiếp.')+'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn primary" data-new="1">+ Lịch mới</button><button class="btn" data-action="print">In danh sách</button></div><div class="grid">'+metric('Quá hẹn ban đầu',list.filter(x=>x.t.rank===0).length)+metric('Quá hẹn tiếp',list.filter(x=>x.t.rank===1).length)+metric('Thiếu kết quả / lịch mới',list.filter(x=>x.t.rank===2||x.t.rank===3).length)+metric('Hôm nay',list.filter(x=>x.t.rank===4||x.t.rank===5).length)+'</div>'+(list.length?list.map(x=>agendaCard(x.a,x.t)).join(''):empty('Chưa có việc cần nhắc. Hãy thêm lịch hẹn đầu tiên.'))+'</section>'}

function appointmentsPage(){let owners=[...new Set(db.appointments.map(a=>a.owner))].sort((a,b)=>a.localeCompare(b,'vi')),list=db.appointments.filter(a=>(statusFilter==='all'||a.status===statusFilter)&&(ownerFilter==='all'||a.owner===ownerFilter)&&[a.customer,a.phone,a.owner,a.purpose,a.location,a.note].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>b.date.localeCompare(a.date)||SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot));return hero('📋 Tất cả lịch hẹn','Tìm, lọc, cập nhật tình trạng và kết quả của từng buổi gặp.')+'<section class="card"><div class="toolbar filters"><input id="search" class="search" placeholder="Tìm khách, sale, địa điểm..." value="'+esc(query)+'" aria-label="Tìm lịch hẹn"><select id="statusFilter" aria-label="Lọc tình trạng">'+opt('all','Mọi tình trạng',statusFilter)+selectOptions(STATUSES,statusFilter)+'</select><select id="ownerFilter" aria-label="Lọc người phụ trách">'+opt('all','Mọi người phụ trách',ownerFilter)+selectOptions(owners,ownerFilter)+'</select><span class="grow"></span><button class="btn primary" data-new="1">+ Lịch mới</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="csv">↓ CSV</button></div><p class="muted">Đang hiển thị '+list.length+' / '+db.appointments.length+' lịch hẹn.</p>'+table(['Ngày','Khách hàng','Mục đích','Phụ trách','Trạng thái','Kết quả','Hẹn tiếp','Nhắc việc',''],list.map(row))+'</section>'}

function guidePage(){return hero('❔ Hướng dẫn sử dụng','Một lịch hẹn, một kết quả, một việc tiếp theo rõ ràng.')+'<section class="card"><h2>Quy trình</h2><ol><li>Tạo lịch gặp: ngày, buổi/giờ, khách, mục đích và sale phụ trách.</li><li>Trước buổi gặp, mở “Việc cần làm” để xem lịch hôm nay và lịch quá hạn.</li><li>Sau buổi gặp, chọn “Đã gặp”, ghi kết quả và ngày hẹn tiếp nếu có.</li><li>Với kết quả “Hẹn gặp lại”, dùng “Tạo lịch tiếp” để mở lịch mới; lịch cũ vẫn được giữ.</li><li>Định kỳ sao lưu JSON hoặc HTML kèm dữ liệu.</li></ol></section><section class="card"><h2>Quy tắc nhắc việc</h2><p>Quá ngày hẹn chưa gặp = tình trạng “Chưa gặp” và ngày hẹn trước ngày báo cáo. Đã gặp chưa có kết quả = “Đã gặp” nhưng kết quả “Chưa có”. Quá hẹn gặp lại = kết quả “Hẹn gặp lại”, có ngày hẹn tiếp đã qua và chưa đánh dấu đã xử lý. App cũng nhắc lịch “Hoãn” chưa có ngày mới.</p><p>Nhắc việc xuất hiện khi mở file hoặc cập nhật dữ liệu. Không có thông báo tự bật khi app đang đóng, không gửi SMS/Zalo/email. Thông tin khách hàng chỉ nằm trong trình duyệt hoặc bản sao lưu anh tự tải; cần bảo vệ các file này.</p></section>'}
function render(){let names={dashboard:'Tổng quan',agenda:'Việc cần làm',calendar:'Lịch 30 ngày',appointments:'Tất cả lịch hẹn',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Lịch hẹn gặp khách')+'</b> · '+esc(names[page])+' · Ngày báo cáo: '+date(asof())+'</div>'+({dashboard,agenda:agendaPage,calendar:calendarPage,appointments:appointmentsPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage})[page]()}
function openModal(id='',parentId=''){let old=id?rec(id):{},parent=parentId?rec(parentId):null;if(id&&!old)return;modalId=id;followParent=parentId;$('#modalTitle').textContent=parent?'Tạo lịch hẹn tiếp':id?'Cập nhật lịch hẹn':'Tạo lịch hẹn';let a=old||{},html=field('date','Ngày hẹn *','date',a.date||parent?.followUp||today())+field('slot','Buổi *','select','',selectOptions(SLOTS,a.slot||parent?.slot||'Sáng'))+field('time','Giờ cụ thể (nếu có)','time',a.time||'')+field('customer','Khách hàng *','text',a.customer||parent?.customer||'')+field('phone','Điện thoại','tel',a.phone||parent?.phone||'')+field('purpose','Mục đích *','select','',selectOptions(PURPOSES,a.purpose||parent?.purpose||PURPOSES[0]))+field('owner','Người phụ trách *','text',a.owner||parent?.owner||'')+field('location','Địa điểm / hình thức gặp','text',a.location||parent?.location||'')+field('status','Tình trạng','select','',selectOptions(STATUSES,a.status||'Chưa gặp'))+field('result','Kết quả','select','',selectOptions(RESULTS,a.result||'Chưa có'))+field('followUp','Ngày hẹn tiếp theo','date',a.followUp||'')+field('followUpDone','Hẹn tiếp đã xử lý?','select','',opt('false','Chưa',String(a.followUpDone||false))+opt('true','Đã xử lý',String(a.followUpDone||false)))+field('nextAction','Việc cần làm tiếp','text',a.nextAction||'')+field('note','Ghi chú buổi gặp','textarea',a.note||'');if(id)html+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa lịch hẹn này</button></div>';$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modalId='';followParent='';$('#editor').close()}
function saveModal(){let x={date:v('date'),slot:v('slot'),time:v('time'),customer:v('customer'),phone:v('phone'),purpose:v('purpose'),owner:v('owner'),location:v('location'),status:v('status'),result:v('result'),followUp:v('followUp'),followUpDone:v('followUpDone')==='true',nextAction:v('nextAction'),note:v('note'),parentId:followParent||rec(modalId)?.parentId||''},error='';if(!validDate(x.date)||!x.customer||!x.owner)error='Cần ngày hợp lệ, tên khách và người phụ trách.';else if(!validRecord({id:modalId||'new',...x}))error='Có trường không hợp lệ hoặc quá dài.';else if(x.status!=='Đã gặp'&&x.result!=='Chưa có')error='Chỉ ghi kết quả khi tình trạng là “Đã gặp”.';else if(x.result==='Hẹn gặp lại'&&!x.followUp&&!x.followUpDone)error='Hẹn gặp lại cần ngày hẹn tiếp.';else if(x.followUpDone&&!x.followUp)error='Cần ngày hẹn tiếp trước khi đánh dấu đã xử lý.';if(error){$('#modalError').textContent=error;return}if(modalId)Object.assign(rec(modalId),x);else{let a={id:uid(),...x};db.appointments.push(a);if(followParent){let p=rec(followParent);if(p)p.followUpDone=true}}closeModal();save()}
function sampleData(anchor=today()){let d=blank();d.settings.asof='';d.appointments=SOURCE.appointments.map(([offset,slot,customer,purpose,owner,status,result,follow],i)=>({id:'sample-appointment-'+(i+1),date:addDays(anchor,Number(offset.slice(1))),slot,time:'',customer,phone:'',purpose,owner,location:'',status,result,followUp:follow?addDays(anchor,Number(follow.slice(1))):'',followUpDone:false,nextAction:'',note:'Dữ liệu mẫu từ file gốc',parentId:''}));return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('lich-hen-gap-khach-nhac-viec-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Ngày hẹn','Buổi','Giờ','Khách hàng','Điện thoại','Mục đích','Phụ trách','Địa điểm','Tình trạng','Kết quả','Ngày hẹn tiếp','Đã xử lý hẹn tiếp','Việc tiếp','Ghi chú'],...db.appointments.map(a=>[a.date,a.slot,a.time,a.customer,a.phone,a.purpose,a.owner,a.location,a.status,a.result,a.followUp,a.followUpDone?'Có':'Không',a.nextAction,a.note])];let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('lich-hen-gap-khach-nhac-viec.csv',body,'text/csv;charset=utf-8')}
function excelRows(){return [['Mã nội bộ','Ngày hẹn','Buổi','Giờ','Khách hàng','Điện thoại','Mục đích','Người phụ trách','Địa điểm','Tình trạng','Kết quả','Ngày hẹn tiếp','Đã xử lý hẹn tiếp','Việc tiếp','Ghi chú','Mã lịch trước'],...db.appointments.map(a=>[a.id,a.date,a.slot,a.time,a.customer,a.phone,a.purpose,a.owner,a.location,a.status,a.result,a.followUp,a.followUpDone?'Có':'Không',a.nextAction,a.note,a.parentId])]}
function excelExport(){let blob=Excel.workbook([{name:'Lich hen',rows:excelRows()}]),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lich-hen-gap-khach-nhac-viec.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){let rows=sheets['Lich hen'];if(!rows||String(rows[0]?.[0]??'').trim()!=='Mã nội bộ')throw Error('Cần file Excel do app này xuất, sheet “Lich hen”.');let d=blank(),ids=new Set();for(let [i,r] of rows.slice(1).entries()){if(!r.some(x=>String(x??'').trim()))continue;let a={id:String(r[0]??'').trim(),date:parseDate(r[1]),slot:String(r[2]??'').trim(),time:String(r[3]??'').trim(),customer:String(r[4]??'').trim(),phone:String(r[5]??'').trim(),purpose:String(r[6]??'').trim(),owner:String(r[7]??'').trim(),location:String(r[8]??'').trim(),status:String(r[9]??'').trim(),result:String(r[10]??'').trim(),followUp:r[11]?parseDate(r[11]):'',followUpDone:String(r[12]??'Không').trim()==='Có',nextAction:String(r[13]??'').trim(),note:String(r[14]??'').trim(),parentId:String(r[15]??'').trim()};if(!validRecord(a)||ids.has(a.id))throw Error('Lịch dòng '+(i+2)+' không hợp lệ hoặc trùng mã.');ids.add(a.id);d.appointments.push(a)}if(!validBackup(d))throw Error('Liên kết lịch trước không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập '+d.appointments.length+' lịch hẹn sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-follow],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal();return}if(b.dataset.edit){openModal(b.dataset.edit);return}if(b.dataset.follow){openModal('',b.dataset.follow);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('lich-hen-gap-khach-nhac-viec-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.appointments.length&&!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sampleData();save()}if(a==='clear'){if(confirm('Xóa toàn bộ lịch hẹn trên trình duyệt này?')){db=blank();save()}}if(a==='deleteRecord'){let linked=db.appointments.some(x=>x.parentId===modalId);if(linked){$('#modalError').textContent='Lịch này đã có lịch hẹn tiếp liên kết; không thể xóa. Có thể sửa hoặc giữ để đối chiếu.';return}if(confirm('Xóa vĩnh viễn lịch hẹn này?')){db.appointments=db.appointments.filter(x=>x.id!==modalId);closeModal();save()}}if(a==='settings'){let as=v('asof'),company=v('company');if(as&&!validDate(as)||company.length>160){alert('Ngày báo cáo hoặc tên đơn vị không hợp lệ.');return}db.settings={asof:as,company};save()}});
document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}if(e.target.id==='ownerFilter'){ownerFilter=e.target.value;render()}if(e.target.id==='f_status'&&e.target.value!=='Đã gặp')$('#f_result').value='Chưa có';if(e.target.id==='f_result'&&e.target.value!=='Hẹn gặp lại')$('#f_followUpDone').value='false'});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
