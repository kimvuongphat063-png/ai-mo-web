function blank(){return{version:1,updatedAt:Date.now(),settings:{brand:'',roasMin:3,cplMax:250000,grossMargin:40},rows:[]}}
function metrics(rows){let m={spend:0,impressions:0,clicks:0,leads:0,orders:0,revenue:0};for(let r of rows){m.spend+=r.spend;m.impressions+=r.impressions;m.clicks+=r.clicks;m.leads+=r.leads;m.orders+=r.orders;m.revenue+=r.revenue}return m}
function derived(m,settings){return{ctr:rate(m.clicks*100,m.impressions),cpc:rate(m.spend,m.clicks),cpl:rate(m.spend,m.leads),close:rate(m.orders*100,m.leads),cpa:rate(m.spend,m.orders),roas:rate(m.revenue,m.spend),aov:rate(m.revenue,m.orders),contribution:m.revenue*settings.grossMargin/100-m.spend}}
function warnings(row,settings){let m=derived(row,settings),out=[];if(row.spend>0&&row.leads===0)out.push('Chi tiền, chưa có khách');if(m.roas!==null&&m.roas<settings.roasMin)out.push('ROAS dưới mục tiêu');if(m.cpl!==null&&m.cpl>settings.cplMax)out.push('CPL trên ngưỡng');if(row.orders>0&&row.revenue===0)out.push('Có đơn, doanh thu bằng 0');return out}
function validBackup(d){if(!d||d.version!==1||!d.settings||typeof d.settings.brand!=='string'||d.settings.brand.length>160||!Number.isFinite(d.settings.roasMin)||d.settings.roasMin<0||d.settings.roasMin>1000||!safe(d.settings.cplMax)||!Number.isFinite(d.settings.grossMargin)||d.settings.grossMargin<0||d.settings.grossMargin>100||!Array.isArray(d.rows)||d.rows.length>100000)return false;let ids=new Set();for(let r of d.rows){if(!r||typeof r.id!=='string'||!r.id||ids.has(r.id)||!validDate(r.date)||!CHANNELS.includes(r.channel)||typeof r.campaign!=='string'||r.campaign.length>160||typeof r.note!=='string'||r.note.length>2000||![r.spend,r.impressions,r.clicks,r.leads,r.orders,r.revenue].every(safe)||r.clicks>r.impressions||r.leads>r.clicks||r.orders>r.leads)return false;ids.add(r.id)}return true}
function sampleData(anchor=today()){let d=blank();for(let [i,[offset,channel,spend,impressions,clicks,leads,orders,revenue]] of SOURCE.qc.entries())d.rows.push({id:'sample-'+i,date:addDays(anchor,Number(offset.slice(1))),channel,campaign:'',spend,impressions,clicks,leads,orders,revenue,note:'Dữ liệu mẫu từ file gốc'});return d}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return validBackup(x)?x:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim()),saved=stored();
let db=validBackup(embedded)&&(!saved||(embedded.updatedAt||0)>=(saved.updatedAt||0))?embedded:saved||blank(),page='dashboard',query='',filter={from:'',to:'',channel:'all'},modal=null;
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(h,s)=>'<div class="hero"><h1>'+esc(h)+'</h1><p>'+esc(s)+'</p></div>';
const metric=(name,value,sub='')=>'<div class="metric"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>';
const badge=(s,k='')=>'<span class="badge '+k+'">'+esc(s)+'</span>';
const empty=s=>'<div class="empty">'+esc(s)+'</div>';
const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty('Chưa có dữ liệu phù hợp.');
const opt=(v,label,selected)=>'<option value="'+esc(v)+'" '+(String(v)===String(selected)?'selected':'')+'>'+esc(label)+'</option>';
const options=(list,selected)=>list.map(x=>opt(x,x,selected)).join('');
function field(k,label,type,value='',opts=''){return '<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value??'')+'">')+'</div>'}
const v=k=>$('#f_'+k)?.value.trim()||'';
function scoped(){return db.rows.filter(r=>(!filter.from||r.date>=filter.from)&&(!filter.to||r.date<=filter.to)&&(filter.channel==='all'||r.channel===filter.channel))}
function filterBar(){return '<div class="toolbar filters no-print"><label>Từ <input id="filterFrom" type="date" value="'+esc(filter.from)+'"></label><label>Đến <input id="filterTo" type="date" value="'+esc(filter.to)+'"></label><label>Kênh <select id="filterChannel">'+opt('all','Tất cả',filter.channel)+options(CHANNELS,filter.channel)+'</select></label><button class="btn small" data-action="resetFilter">Bỏ lọc</button></div>'}
const ratioText=m=>m===null?'—':fixed(m,2)+'×';
const moneyOrDash=m=>m===null?'—':money(Math.round(m));
function kpis(rows){let m=metrics(rows),d=derived(m,db.settings);return '<div class="grid">'+metric('Chi phí quảng cáo',money(m.spend))+metric('Doanh thu quy gán',money(m.revenue))+metric('ROAS',ratioText(d.roas),'Mục tiêu ≥ '+fixed(db.settings.roasMin,2)+'×')+metric('Khách tiềm năng',number(m.leads))+metric('Đơn chốt',number(m.orders))+metric('CPL',moneyOrDash(d.cpl),'Ngưỡng ≤ '+money(db.settings.cplMax))+metric('CPA',moneyOrDash(d.cpa))+metric('Đóng góp ước tính',money(Math.round(d.contribution)),'Biên gộp giả định '+fixed(db.settings.grossMargin,0)+'%')+'</div>'}
function rowHTML(r){let d=derived(r,db.settings),w=warnings(r,db.settings);return '<tr><td>'+showDate(r.date)+'</td><td><b>'+esc(r.channel)+'</b><br><small>'+esc(r.campaign||'Chưa gắn chiến dịch')+'</small></td><td class="num">'+money(r.spend)+'</td><td class="num">'+number(r.impressions)+'</td><td class="num">'+number(r.clicks)+'</td><td class="num">'+number(r.leads)+'</td><td class="num">'+number(r.orders)+'</td><td class="num">'+money(r.revenue)+'</td><td class="num">'+pct(r.clicks,r.impressions)+'</td><td class="num">'+moneyOrDash(d.cpl)+'</td><td class="num">'+ratioText(d.roas)+'</td><td>'+(w.length?w.map(x=>badge(x,'late')).join('<br>'):'—')+'</td><td><button class="btn small" data-edit="'+esc(r.id)+'">Sửa</button></td></tr>'}
function summaryTable(items,label){return table([label,'Dòng','Chi phí','Hiển thị','Nhấp','Khách','Đơn','Doanh thu','CTR','CPC','CPL','Tỷ lệ chốt','CPA','ROAS','Đóng góp ước tính'],items.map(([name,rows])=>{let m=metrics(rows),d=derived(m,db.settings);return'<tr><td><b>'+esc(name)+'</b></td><td class="num">'+rows.length+'</td><td class="num">'+money(m.spend)+'</td><td class="num">'+number(m.impressions)+'</td><td class="num">'+number(m.clicks)+'</td><td class="num">'+number(m.leads)+'</td><td class="num">'+number(m.orders)+'</td><td class="num">'+money(m.revenue)+'</td><td class="num">'+pct(m.clicks,m.impressions)+'</td><td class="num">'+moneyOrDash(d.cpc)+'</td><td class="num">'+moneyOrDash(d.cpl)+'</td><td class="num">'+pct(m.orders,m.leads,1)+'</td><td class="num">'+moneyOrDash(d.cpa)+'</td><td class="num">'+ratioText(d.roas)+'</td><td class="num">'+money(Math.round(d.contribution))+'</td></tr>'}))}
function grouped(rows,by){let map=new Map();for(let r of rows){let k=by(r);if(!map.has(k))map.set(k,[]);map.get(k).push(r)}return[...map.entries()]}
function bars(items){let max=Math.max(1,...items.map(x=>x[1]));return '<div class="checks">'+items.map(([name,value])=>'<div><div class="toolbar" style="margin:0"><b>'+esc(name)+'</b><span class="grow"></span><strong>'+money(value)+'</strong></div><div style="height:10px;background:#e9edfa;border-radius:20px;overflow:hidden"><div style="width:'+Math.max(0,Math.min(100,value/max*100))+'%;height:100%;background:#5171d9"></div></div></div>').join('')+'</div>'}
function dashboard(){let rows=scoped(),m=metrics(rows),d=derived(m,db.settings),alerts=rows.filter(r=>warnings(r,db.settings).length),channels=CHANNELS.map(c=>[c,metrics(rows.filter(r=>r.channel===c)).revenue]);return hero('📣 Hiệu quả quảng cáo','Một nơi đối chiếu tiền quảng cáo, khách tiềm năng, đơn hàng và doanh thu.')+'<section class="card">'+filterBar()+'<div class="toolbar"><span class="grow"></span><button class="btn primary" data-action="new">+ Ghi số liệu</button></div>'+kpis(rows)+'<p class="notice">Chỉ số kỳ lọc tính từ tổng chi phí, tổng lượt và tổng doanh thu. Doanh thu là số anh quy gán cho quảng cáo; app không tự kiểm chứng nguồn đơn hàng.</p></section><div class="split"><section class="card"><h2>Phễu chuyển đổi</h2><div class="funnel"><div class="step"><small>Hiển thị</small><strong>'+number(m.impressions)+'</strong></div><div class="step"><small>Nhấp · CTR</small><strong>'+number(m.clicks)+'</strong><small>'+pct(m.clicks,m.impressions)+'</small></div><div class="step"><small>Khách · CPL</small><strong>'+number(m.leads)+'</strong><small>'+moneyOrDash(d.cpl)+'</small></div><div class="step"><small>Đơn · chốt</small><strong>'+number(m.orders)+'</strong><small>'+pct(m.orders,m.leads,1)+'</small></div></div></section><section class="card"><h2>Doanh thu theo kênh</h2>'+bars(channels)+'</section></div><section class="card"><h2>🔔 Dòng cần xem</h2>'+(alerts.length?table(['Ngày','Kênh / chiến dịch','Chi phí','Doanh thu','ROAS','Cảnh báo'],alerts.slice(0,8).map(r=>'<tr><td>'+showDate(r.date)+'</td><td>'+esc(r.channel)+'<br><small>'+esc(r.campaign)+'</small></td><td class="num">'+money(r.spend)+'</td><td class="num">'+money(r.revenue)+'</td><td class="num">'+ratio(r.revenue,r.spend)+'</td><td>'+warnings(r,db.settings).map(x=>badge(x,'late')).join('<br>')+'</td></tr>')):empty('Không có dòng cảnh báo trong kỳ lọc.'))+'</section>'}
function recordsPage(){let rows=scoped().filter(r=>[r.channel,r.campaign,r.note].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>b.date.localeCompare(a.date)||a.channel.localeCompare(b.channel));return hero('🗂️ Nhật ký quảng cáo','Mỗi ngày hoặc mỗi chiến dịch một dòng; đủ chi phí, lượt, khách, đơn và doanh thu.')+'<section class="card">'+filterBar()+'<div class="toolbar filters"><input id="search" class="search" placeholder="Tìm chiến dịch, kênh, ghi chú..." value="'+esc(query)+'"><span class="grow"></span><button class="btn primary" data-action="new">+ Dòng quảng cáo</button><button class="btn" data-action="excelExport">↓ Excel</button></div><p class="muted">'+rows.length+' / '+db.rows.length+' dòng. Có thể để trống tên chiến dịch cho dữ liệu chỉ biết theo kênh.</p>'+table(['Ngày','Kênh / chiến dịch','Chi phí','Hiển thị','Nhấp','Khách','Đơn','Doanh thu','CTR','CPL','ROAS','Cảnh báo',''],rows.map(rowHTML))+'</section>'}
function alertsPage(){let rows=scoped().filter(r=>warnings(r,db.settings).length).sort((a,b)=>b.date.localeCompare(a.date));return hero('🔔 Dòng cần xem','Ngưỡng ROAS và CPL do anh đặt tại Cài đặt; cảnh báo là tín hiệu để kiểm tra.')+'<section class="card">'+filterBar()+'<div class="toolbar"><span class="grow"></span><button class="btn" data-action="settingsPage">⚙️ Đổi ngưỡng</button></div><p class="notice warn">Một dòng có thể đồng thời có nhiều cảnh báo. ROAS không đo lợi nhuận; cần xét biên gộp và chất lượng đơn hàng.</p>'+table(['Ngày','Kênh / chiến dịch','Chi phí','Hiển thị','Nhấp','Khách','Đơn','Doanh thu','CTR','CPL','ROAS','Cảnh báo',''],rows.map(rowHTML))+'</section>'}
function channelsPage(){let rows=scoped(),items=CHANNELS.map(c=>[c,rows.filter(r=>r.channel===c)]);return hero('📡 So sánh kênh','So sánh theo tổng số liệu trong kỳ lọc; tỷ lệ tính lại từ tổng, không lấy trung bình tỷ lệ từng dòng.')+'<section class="card">'+filterBar()+'<div class="toolbar"><span class="grow"></span><button class="btn" data-action="print">🖨️ In</button></div>'+summaryTable(items,'Kênh')+'</section>'}
function campaignsPage(){let rows=scoped(),items=grouped(rows,r=>r.campaign||'Chưa gắn chiến dịch').sort((a,b)=>metrics(b[1]).spend-metrics(a[1]).spend);return hero('🎯 Theo chiến dịch','Gắn cùng tên chiến dịch cho nhiều ngày để xem chi phí, khách, đơn và doanh thu cộng dồn.')+'<section class="card">'+filterBar()+'<p class="notice">20 dòng mẫu gốc không có tên chiến dịch, nên được nhóm trong “Chưa gắn chiến dịch”.</p>'+summaryTable(items,'Chiến dịch')+'</section>'}
function periodsPage(){let rows=scoped(),items=grouped(rows,r=>r.date.slice(0,7)).sort((a,b)=>b[0].localeCompare(a[0]));return hero('🗓️ Theo tháng','Theo dõi xu hướng chi phí, khách, đơn, ROAS và đóng góp ước tính.')+'<section class="card">'+filterBar()+summaryTable(items,'Tháng')+'</section>'}
function settingsPage(){return hero('⚙️ Mục tiêu & cài đặt','Đặt ngưỡng riêng theo biên lợi nhuận và mục tiêu quảng cáo của anh.')+'<section class="card"><div class="formgrid">'+field('brand','Tên doanh nghiệp / dự án','text',db.settings.brand)+field('roasMin','ROAS tối thiểu (lần)','number',db.settings.roasMin)+field('cplMax','CPL tối đa (đ)','number',db.settings.cplMax)+field('grossMargin','Biên gộp giả định (%)','number',db.settings.grossMargin)+'</div><p><button class="btn primary" data-action="settings">Lưu mục tiêu</button></p><p class="notice">Đóng góp ước tính = doanh thu quy gán × biên gộp giả định − chi phí quảng cáo. Chưa gồm chi phí khác, hoàn đơn, thuế và sai lệch quy gán. Điểm hòa vốn ước tính theo biên gộp hiện tại: <b>'+(db.settings.grossMargin>0?fixed(100/db.settings.grossMargin,2)+'×':'—')+'</b>.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Dữ liệu nằm trong trình duyệt đang mở; sao lưu trước khi nhập hoặc chuyển máy.')+'<section class="card"><div class="grid">'+metric('Dòng quảng cáo',db.rows.length)+metric('Kênh có dữ liệu',new Set(db.rows.map(r=>r.channel)).size)+metric('Chiến dịch có tên',new Set(db.rows.map(r=>r.campaign).filter(Boolean)).size)+'</div><p class="notice warn">Bản HTML gốc không tự mang dữ liệu đã lưu. Dùng HTML kèm dữ liệu hoặc JSON để chuyển thiết bị.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV</button></div><p class="muted">Workbook Excel có 3 sheet: dữ liệu, cài đặt, hướng dẫn.</p></section><section class="card"><h2>20 dòng mẫu gốc</h2><p>Mẫu gồm Facebook, Google, TikTok, Zalo và Khác, lấy từ file tham chiếu. Ngày được đặt tương đối theo ngày nạp mẫu giống app gốc.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Cách sử dụng','Đọc nhanh ý nghĩa các chỉ số trước khi ra quyết định tăng hoặc giảm ngân sách.')+'<section class="card"><h2>Quy trình</h2><ol><li>Chọn một cách ghi nhất quán: mỗi ngày một dòng hoặc mỗi chiến dịch mỗi ngày một dòng.</li><li>Nhập số từ nền tảng quảng cáo: chi phí, hiển thị, nhấp, khách tiềm năng.</li><li>Ghi đơn và doanh thu đã quy gán theo cùng cửa sổ thời gian; tránh đếm một đơn cho hai kênh.</li><li>Đặt mục tiêu ROAS, trần CPL và biên gộp ở Cài đặt.</li><li>Xem tổng quan, so sánh kênh/chiến dịch/tháng, rà dòng cảnh báo rồi sao lưu.</li></ol><h2>Công thức</h2><p>CTR = nhấp / hiển thị; CPC = chi phí / nhấp; CPL = chi phí / khách; tỷ lệ chốt = đơn / khách; CPA = chi phí / đơn; ROAS = doanh thu / chi phí quảng cáo. Mẫu số bằng 0 thì hiển thị “—”.</p><h2>Giới hạn</h2><p>App không kết nối tài khoản quảng cáo hay tự chứng minh doanh thu đến từ quảng cáo. ROAS là doanh thu/chi phí quảng cáo, không phải lợi nhuận. Dữ liệu khách hàng cá nhân không được nhập vào app này.</p></section>'}
function render(){let names={dashboard:'Tổng quan',records:'Nhật ký quảng cáo',alerts:'Cần xem',channels:'Theo kênh',campaigns:'Theo chiến dịch',periods:'Theo tháng',settings:'Mục tiêu & cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,records:recordsPage,alerts:alertsPage,channels:channelsPage,campaigns:campaignsPage,periods:periodsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.brand||'Hiệu quả quảng cáo')+'</b> · '+esc(names[page])+' · '+showDate(today())+'</div>'+views[page]()}
function openModal(id=''){
  let old=db.rows.find(r=>r.id===id)||{};modal={id};$('#modalTitle').textContent=id?'Sửa số liệu quảng cáo':'Ghi số liệu quảng cáo';
  let h=field('date','Ngày báo cáo *','date',old.date||today())+field('channel','Kênh *','select','',options(CHANNELS,old.channel||CHANNELS[0]))+field('campaign','Tên chiến dịch (nếu có)','text',old.campaign||'')+field('spend','Chi phí quảng cáo (đ)','number',old.spend??0)+field('impressions','Lượt hiển thị','number',old.impressions??0)+field('clicks','Lượt nhấp','number',old.clicks??0)+field('leads','Khách để lại thông tin','number',old.leads??0)+field('orders','Đơn chốt','number',old.orders??0)+field('revenue','Doanh thu quy gán (đ)','number',old.revenue??0)+field('note','Ghi chú nguồn số liệu / thay đổi','textarea',old.note||'');
  h+='<p class="wide notice">Giữ cùng cách quy gán doanh thu qua các kỳ. Khách ≤ nhấp ≤ hiển thị; đơn ≤ khách.</p>';
  if(id)h+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa dòng này</button></div>';
  $('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal();
}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){
  if(!modal)return;let id=modal.id,x={date:v('date'),channel:v('channel'),campaign:v('campaign'),spend:int(v('spend')),impressions:int(v('impressions')),clicks:int(v('clicks')),leads:int(v('leads')),orders:int(v('orders')),revenue:int(v('revenue')),note:v('note')};
  if(!validDate(x.date)||!CHANNELS.includes(x.channel)||x.campaign.length>160||x.note.length>2000||![x.spend,x.impressions,x.clicks,x.leads,x.orders,x.revenue].every(safe)){$('#modalError').textContent='Ngày, kênh hoặc các số liệu không hợp lệ.';return}
  if(x.clicks>x.impressions||x.leads>x.clicks||x.orders>x.leads){$('#modalError').textContent='Kiểm tra phễu: nhấp ≤ hiển thị, khách ≤ nhấp, đơn ≤ khách.';return}
  let d={...db,rows:db.rows.slice()};if(id){let i=d.rows.findIndex(r=>r.id===id);d.rows[i]={...d.rows[i],...x}}else d.rows.push({id:uid(),...x});
  if(!validBackup(d)){$('#modalError').textContent='Dữ liệu không hợp lệ hoặc vượt giới hạn.';return}db=d;closeModal();save();
}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('hieu-qua-quang-cao-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Ngày','Kênh','Chiến dịch','Chi phí','Hiển thị','Nhấp','Khách','Đơn','Doanh thu','Ghi chú']];for(let r of db.rows)rows.push([r.date,r.channel,r.campaign,r.spend,r.impressions,r.clicks,r.leads,r.orders,r.revenue,r.note]);let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('hieu-qua-quang-cao.csv',body,'text/csv;charset=utf-8')}
function excelSheets(){return[
  {name:'Du lieu quang cao',rows:[['Mã dòng','Ngày','Kênh','Chiến dịch','Chi phí','Hiển thị','Nhấp','Khách','Đơn','Doanh thu','Ghi chú'],...db.rows.map(r=>[r.id,r.date,r.channel,r.campaign,r.spend,r.impressions,r.clicks,r.leads,r.orders,r.revenue,r.note])]},
  {name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]},
  {name:'Huong dan',rows:[['Chỉ số','Công thức'],['CTR','Nhấp / hiển thị'],['CPC','Chi phí / nhấp'],['CPL','Chi phí / khách'],['Tỷ lệ chốt','Đơn / khách'],['CPA','Chi phí / đơn'],['ROAS','Doanh thu / chi phí quảng cáo'],['Đóng góp ước tính','Doanh thu × biên gộp giả định − chi phí quảng cáo']]}
]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='hieu-qua-quang-cao.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){let sheet=sheets['Du lieu quang cao'];if(!sheet||sheet[0]?.[0]!=='Mã dòng')throw Error('Cần workbook do app xuất, có sheet Dữ liệu quảng cáo.');let d=blank();for(let r of sheet.slice(1)){if(!String(r[0]??'').trim())continue;d.rows.push({id:String(r[0]).trim(),date:parseDate(r[1]),channel:String(r[2]??'').trim(),campaign:String(r[3]??'').trim(),spend:int(r[4]),impressions:int(r[5]),clicks:int(r[6]),leads:int(r[7]),orders:int(r[8]),revenue:int(r[9]),note:String(r[10]??'').trim()})}if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));if(raw.brand!==undefined)d.settings.brand=String(raw.brand);if(raw.roasMin!==undefined)d.settings.roasMin=decimal(raw.roasMin);if(raw.cplMax!==undefined)d.settings.cplMax=int(raw.cplMax);if(raw.grossMargin!==undefined)d.settings.grossMargin=decimal(raw.grossMargin)}if(!validBackup(d))throw Error('Excel có ngày, kênh, số liệu phễu hoặc mục tiêu không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{
  let b=e.target.closest('[data-page],[data-edit],[data-action]');if(!b)return;
  if(b.dataset.page){page=b.dataset.page;query='';render();return}
  if(b.dataset.edit){openModal(b.dataset.edit);return}
  let a=b.dataset.action;
  if(a==='new')openModal();if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();
  if(a==='backup')download('hieu-qua-quang-cao-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();
  if(a==='sample'){if(db.rows.length&&!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sampleData();filter={from:'',to:'',channel:'all'};save()}
  if(a==='clear'){if(confirm('Xóa toàn bộ dữ liệu quảng cáo trên trình duyệt này?')){db=blank();save()}}
  if(a==='deleteRecord'&&modal?.id&&confirm('Xóa vĩnh viễn dòng này?')){db.rows=db.rows.filter(r=>r.id!==modal.id);closeModal();save()}
  if(a==='settings'){let d={...db,settings:{brand:v('brand'),roasMin:decimal(v('roasMin')),cplMax:int(v('cplMax')),grossMargin:decimal(v('grossMargin'))}};if(!validBackup(d)){alert('ROAS, CPL hoặc biên gộp không hợp lệ.');return}db=d;save()}
  if(a==='settingsPage'){page='settings';render()}if(a==='resetFilter'){filter={from:'',to:'',channel:'all'};render()}
});
document.addEventListener('change',e=>{if(e.target.id==='filterFrom'||e.target.id==='filterTo'||e.target.id==='filterChannel'){let next={from:$('#filterFrom').value,to:$('#filterTo').value,channel:$('#filterChannel').value};if(next.from&&next.to&&next.from>next.to){alert('Ngày bắt đầu phải trước hoặc bằng ngày kết thúc.');render();return}filter=next;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
