function renderList(kind){let a=filtered(rows(kind)),title=kind==='out'?'Hóa đơn đầu ra':'Hóa đơn đầu vào',all=rows(kind);return `<div class="page-head"><div><div class="eyebrow">SỔ HÓA ĐƠN / ${kind==='out'?'BÁN RA':'MUA VÀO'}</div><h1>${title}</h1><p>${all.length} hóa đơn · ${all.filter(x=>x.warning).length} dòng có cờ rà soát.</p></div><div class="btnrow">${btn('＋ Thêm hóa đơn',kind==='out'?'newOut':'newIn','primary')}${btn('↓ Excel','exportExcel')}</div></div>${kind==='inn'?'<div class="hint" style="margin-bottom:16px">“Thuế đầu vào theo quy tắc” chỉ là kết quả mô phỏng với ngưỡng tiền mặt đã cài. Trạng thái khấu trừ thực tế cần kiểm tra riêng.</div>':''}${toolsBar(kind)}${panel(title,table(invoiceHeaders,a.map(invoiceRow).join(''),'Không có hóa đơn phù hợp bộ lọc.')+`<div class="table-foot"><span>Hiển thị ${a.length}/${all.length} dòng · Cột rộng có thể cuộn ngang trên điện thoại.</span><span>Tiền hàng: ${M(sum(a,x=>x.net))} · Thuế: ${M(sum(a,x=>x.tax))}</span></div>`)}<p class="notice">Dòng đỏ nhạt có cờ rà soát. Hóa đơn trùng trong dữ liệu mẫu vẫn tham gia tổng hợp giống file gốc, nên cần giải quyết trước khi dùng báo cáo.</p>`}
function renderWarnings(){let a=filtered(current().warnings);return `<div class="page-head"><div><div class="eyebrow">KIỂM TRA CHỨNG TỪ</div><h1>Hóa đơn cần xem</h1><p>${current().warnings.length} dòng có ít nhất một cờ cảnh báo nội bộ.</p></div>${btn('↓ Excel','exportExcel')}</div><div class="warning" style="margin-bottom:17px">Cờ chỉ giúp tìm dòng cần kiểm tra: trùng số, năm, MST theo độ dài, thiếu thuế suất, tiền mặt từ ngưỡng đặt trong app. Cờ không thay thế xác minh hóa đơn hoặc kết luận thuế.</div>${toolsBar('all')}${panel('Danh sách cần đối chiếu',table([{label:'Loại'},...invoiceHeaders],a.map(x=>`<tr><td><span class="chip ${x.kind==='out'?'':'good'}">${x.kind==='out'?'Đầu ra':'Đầu vào'}</span></td>${invoiceRow(x).replace(/^<tr[^>]*>/,'').replace(/<\/tr>$/,'')}</tr>`).join(''),'Không có hóa đơn phù hợp bộ lọc.'))}`}
const reportHeaders=[{label:'Kỳ'},{label:'Bán ra',num:true},{label:'Thuế đầu ra',num:true},{label:'Mua vào',num:true},{label:'Đầu vào theo quy tắc',num:true},{label:'Thuế gắn cờ',num:true},{label:'Chênh lệch',num:true}];
function reportRows(a){return a.map(x=>`<tr><td><strong>${H(x.label)}</strong></td><td class="num">${M(x.rev)}</td><td class="num">${M(x.tOut)}</td><td class="num">${M(x.buy)}</td><td class="num">${M(x.tIn)}</td><td class="num">${M(x.tFlag)}</td><td class="num"><strong>${M(x.difference)}</strong></td></tr>`).join('')}
function renderReport(){let p=periods(),rates=[...new Set([...db.settings.rates,...db.out.map(x=>x.rate),...db.inn.map(x=>x.rate)].filter(rateOk).map(Number))].sort((a,b)=>a-b),s=current();return `<div class="page-head"><div><div class="eyebrow">TỔNG HỢP SỐ LIỆU</div><h1>Báo cáo GTGT tham khảo</h1><p>Năm ${H(db.settings.year)} · từ hóa đơn đang lưu trên máy.</p></div><div class="btnrow">${btn('↓ Excel','exportExcel','primary')}${btn('⎙ In báo cáo','print')}</div></div><div class="warning" style="margin-bottom:18px">Số chênh lệch = thuế đầu ra − đầu vào theo quy tắc mẫu, chưa phải số phải nộp hay được khấu trừ pháp lý. Số liệu có thể gồm hóa đơn cần kiểm tra và hóa đơn trùng. Đối chiếu trước khi kê khai.</div>${panel('12 tháng',table(reportHeaders,reportRows(p.months)))}${panel('Bốn quý và cả năm',table(reportHeaders,reportRows([...p.quarters,p.year])))}${panel('Theo thuế suất',table([{label:'Thuế suất'},{label:'Tiền hàng bán ra',num:true},{label:'Thuế đầu ra',num:true},{label:'Tiền hàng mua vào',num:true},{label:'Thuế đầu vào trên HĐ',num:true}],rates.map(r=>{let o=s.outYear.filter(x=>+x.rate===r),i=s.inYear.filter(x=>+x.rate===r);return `<tr><td>${r}%</td><td class="num">${M(sum(o,x=>x.net))}</td><td class="num">${M(sum(o,x=>x.tax))}</td><td class="num">${M(sum(i,x=>x.net))}</td><td class="num">${M(sum(i,x=>x.tax))}</td></tr>`}).join('')))}`}
function renderSettings(){return `<div class="page-head"><div><div class="eyebrow">THÔNG SỐ NỘI BỘ</div><h1>Thiết lập bảng kê</h1><p>Điều chỉnh các quy tắc mô phỏng và năm báo cáo.</p></div></div><div class="split"><section class="panel"><h2>Thông tin & quy tắc</h2><form id="settingsForm" class="form-grid"><div class="field wide"><label for="company">Tên đơn vị</label><input id="company" name="company" value="${H(db.settings.company)}"></div><div class="field"><label for="year">Năm đang xem</label><input id="year" name="year" type="number" min="2000" max="2100" value="${H(db.settings.year)}" required></div><div class="field"><label for="cashLimit">Ngưỡng tiền mặt để gắn cờ (₫)</label><input id="cashLimit" name="cashLimit" type="number" min="0" step="1" value="${H(db.settings.cashLimit)}" required><small>Giá trị mặc định theo file mẫu, không phải khẳng định quy định hiện hành.</small></div><div class="field wide"><label for="rates">Danh sách thuế suất cho chọn nhanh (%)</label><input id="rates" name="rates" value="${H(db.settings.rates.join(', '))}" required><small>Ví dụ: 0, 5, 8, 10. Đây là tùy chọn nhập liệu, không tự áp thuế suất cho sản phẩm.</small></div><div class="field wide">${btn('Lưu thiết lập','saveSettings','primary','type="submit"')}</div><p id="settingsError" class="form-error wide" role="alert"></p></form></section>${panel('Quy tắc cảnh báo',`<div class="step"><b>1</b><div>Năm hóa đơn khác năm đang xem</div></div><div class="step"><b>2</b><div>Thiếu thuế suất hoặc trùng ký hiệu và số trong cùng chiều</div></div><div class="step"><b>3</b><div>MST trống/sai độ dài 10 hoặc 13 ký tự (đầu vào); đầu ra chỉ cảnh báo nếu có MST nhưng độ dài khác</div></div><div class="step"><b>4</b><div>Đầu vào thanh toán tiền mặt với tổng từ ngưỡng cài đặt</div></div><p class="notice">Nhiều cờ có thể xuất hiện trên cùng hóa đơn. Đây là kiểm tra dữ liệu cơ bản, không xác thực mã số thuế, chữ ký số hay trạng thái hóa đơn trên hệ thống phát hành.</p>`)}</div>`}
function renderData(){let s=current();return `<div class="page-head"><div><div class="eyebrow">AN TOÀN DỮ LIỆU</div><h1>Dữ liệu & sao lưu</h1><p>Dữ liệu nằm trong trình duyệt và thiết bị đang dùng.</p></div></div><div class="data-grid">${panel('Xuất bản sao',`<p class="notice">Sao chép file HTML gốc sang máy khác sẽ không chuyển dữ liệu đã nhập. Hãy tải JSON hoặc HTML kèm dữ liệu để mang sang máy khác.</p><div class="btnrow">${btn('↓ JSON đầy đủ','exportJSON','primary')}${btn('↓ HTML kèm dữ liệu','exportHTML')}${btn('↓ Excel nhiều sheet','exportExcel')}</div><p class="small muted" style="margin:14px 0 0">Hiện có ${s.out.length} đầu ra, ${s.inn.length} đầu vào. Tệp Excel gồm hóa đơn và báo cáo; dùng JSON để khôi phục đầy đủ thiết lập.</p>`)}${panel('Nhập & bắt đầu mới',`<p class="notice">Nhập JSON/Excel hoặc nạp lại mẫu sẽ thay dữ liệu hiện tại. App hỏi xác nhận trước khi thay.</p><div class="btnrow">${btn('↑ Nhập JSON','importJSON')}${btn('↑ Nhập Excel từ app','importExcel')}${btn('Nạp lại mẫu gốc','loadSample')}${btn('Xóa để dùng thật','clearData','danger')}</div><p class="small muted" style="margin:14px 0 0">Excel nhập phải theo cấu trúc workbook do app này xuất. Dòng lỗi bị chặn và không thay dữ liệu đang dùng.</p>`)}</div>`}
function renderGuide(){return `<div class="page-head"><div><div class="eyebrow">HƯỚNG DẪN NGẮN</div><h1>Bắt đầu với bảng kê</h1></div></div><div class="report-grid">${panel('Quy trình 4 bước','<div class="step"><b>1</b><div><strong>Xóa mẫu</strong><br>Vào Dữ liệu → Xóa để dùng thật.</div></div><div class="step"><b>2</b><div><strong>Thiết lập</strong><br>Chọn năm, danh sách thuế suất để nhập và ngưỡng rà soát nội bộ.</div></div><div class="step"><b>3</b><div><strong>Nhập hóa đơn</strong><br>Thêm đầu ra và đầu vào, ghi số/ký hiệu/MST/tiền hàng/thuế suất/thanh toán.</div></div><div class="step"><b>4</b><div><strong>Đối chiếu</strong><br>Xem hóa đơn có cờ, đối chiếu chứng từ rồi xuất báo cáo và sao lưu.</div></div>')}${panel('Cần hiểu trước khi dùng','<p class="notice">App tính thuế từng hóa đơn bằng tiền hàng × thuế suất, làm tròn đồng; tổng hợp theo năm/tháng/quý. Quy tắc tiền mặt là giả định từ file tham chiếu. App không kết nối cổng hóa đơn, không xác minh tình trạng pháp lý và không lập tờ khai chính thức.</p><p class="notice">Trên iPhone/iPad/Android có thể mở HTML bằng trình duyệt hỗ trợ file cục bộ. Nếu trình duyệt không giữ localStorage, hãy dùng HTML kèm dữ liệu sau mỗi phiên để bảo toàn sổ.</p>')}${panel('Dữ liệu mẫu nguồn',`<p class="notice">Mẫu gốc hiện có <strong>9 hóa đơn đầu ra</strong> và <strong>13 hóa đơn đầu vào</strong>; các cảnh báo cố ý để thử chức năng rà soát. Ngày mẫu phụ thuộc ngày tạo file gốc.</p><p class="notice">Nguồn: DatTinHoc_PhanMem_BangKeHoaDonDienTu-nh.html, phần sampleDB, evalList, summary.</p>`)}</div>`}
function render(){let labels={board:'Tổng quan',out:'Đầu ra',inn:'Đầu vào',warnings:'Cần kiểm tra',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu',guide:'Hướng dẫn'};$$('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});let html={board:renderBoard,out:()=>renderList('out'),inn:()=>renderList('inn'),warnings:renderWarnings,report:renderReport,settings:renderSettings,data:renderData,guide:renderGuide}[page]();$('#screen').innerHTML=html;document.title=labels[page]+' · Bảng kê hóa đơn điện tử · AI Mở'}
function openEditor(kind,id=null){editing={kind,id};let x=id?db[kind].find(a=>a.id===id):{date:TODAY(),serial:'',no:'',mst:'',name:'',net:'',rate:db.settings.rates.at(-1)??10,pay:'Chuyển khoản'};if(!x)return;$('#modalTitle').textContent=(id?'Sửa':'Thêm')+' hóa đơn '+(kind==='out'?'đầu ra':'đầu vào');$('#formFields').innerHTML=`<div class="field"><label>Ngày hóa đơn *</label><input name="date" type="date" value="${H(x.date)}" required></div><div class="field"><label>Ký hiệu</label><input name="serial" value="${H(x.serial)}" placeholder="C26TAA"></div><div class="field"><label>Số hóa đơn *</label><input name="no" value="${H(x.no)}" required></div><div class="field"><label>MST ${kind==='out'?'người mua':'người bán'}${kind==='inn'?' *':''}</label><input name="mst" value="${H(x.mst)}" inputmode="numeric" ${kind==='inn'?'required':''}></div><div class="field wide"><label>Tên ${kind==='out'?'người mua':'người bán'}</label><input name="name" value="${H(x.name)}"></div><div class="field"><label>Tiền hàng trước thuế (₫) *</label><input name="net" type="number" min="1" step="1" value="${H(x.net)}" required></div><div class="field"><label>Thuế suất (%) *</label><select name="rate">${db.settings.rates.map(r=>`<option value="${r}" ${+x.rate===r?'selected':''}>${r}%</option>`).join('')}</select></div>${kind==='inn'?`<div class="field wide"><label>Hình thức thanh toán</label><select name="pay"><option ${x.pay==='Chuyển khoản'?'selected':''}>Chuyển khoản</option><option ${x.pay==='Tiền mặt'?'selected':''}>Tiền mặt</option></select></div>`:''}<div class="field wide"><small>Kiểm tra trùng số được thực hiện trước khi lưu. Cờ khác hiển thị sau khi lưu.</small></div>`;$('#formError').textContent='';$('#editor').showModal()}
function saveEditor(){let f=$('#itemForm'),a=Object.fromEntries(new FormData(f)),kind=editing.kind;let x={id:editing.id||uid(),date:a.date,serial:String(a.serial||'').trim(),no:String(a.no||'').trim(),mst:String(a.mst||'').replace(/\s/g,''),name:String(a.name||'').trim(),net:+a.net,rate:+a.rate,...(kind==='inn'?{pay:a.pay}:{})};let fail='';if(!cleanDate(x.date))fail='Ngày hóa đơn không hợp lệ.';else if(!x.no)fail='Cần nhập số hóa đơn.';else if(!Number.isSafeInteger(x.net)||x.net<=0)fail='Tiền hàng phải là số nguyên dương.';else if(!Number.isFinite(x.rate)||x.rate<0||x.rate>100)fail='Thuế suất không hợp lệ.';else if(kind==='inn'&&!x.mst)fail='Cần nhập MST người bán.';else if(db[kind].some(y=>y.id!==x.id&&String(y.serial||'').trim().toUpperCase()===x.serial.toUpperCase()&&String(y.no||'').trim()===x.no))fail='Ký hiệu và số hóa đơn này đã có trong cùng bảng.';if(fail){$('#formError').textContent=fail;return}let i=db[kind].findIndex(y=>y.id===x.id);if(i>=0){x.source=db[kind][i].source||'';db[kind][i]=x}else db[kind].unshift(x);db.meta.sample=false;$('#editor').close();save();notice('Đã lưu hóa đơn.')}
function saveSettings(){let f=$('#settingsForm'),a=Object.fromEntries(new FormData(f)),year=+a.year,limit=+a.cashLimit,rates=String(a.rates||'').split(/[,;\s]+/).filter(Boolean).map(Number);let fail='';if(!Number.isInteger(year)||year<2000||year>2100)fail='Năm phải trong khoảng 2000–2100.';else if(!Number.isSafeInteger(limit)||limit<0)fail='Ngưỡng phải là số nguyên không âm.';else if(!rates.length||rates.some(x=>!Number.isFinite(x)||x<0||x>100))fail='Thuế suất phải là số từ 0 đến 100, cách nhau bằng dấu phẩy.';if(fail){$('#settingsError').textContent=fail;return}db.settings={...db.settings,company:String(a.company||'').trim(),year,cashLimit:limit,rates:[...new Set(rates)].sort((x,y)=>x-y)};save();notice('Đã cập nhật quy tắc nội bộ. Hóa đơn cũ giữ nguyên thuế suất đã nhập.')}
function sheets(){let p=periods(),s=current(),row=x=>[x.date,x.serial,x.no,x.mst,x.name,x.net,x.rate,x.tax,x.total,x.kind==='inn'?x.pay:'',x.kind==='inn'?x.internalInputTax:'',x.warning,x.source||''];let head=['Ngày','Ký hiệu','Số hóa đơn','MST','Đối tác','Tiền hàng','Thuế suất (%)','Tiền thuế','Tổng thanh toán','Thanh toán','Đầu vào theo quy tắc','Cảnh báo','Dòng mẫu'];let rep=x=>[x.label,x.rev,x.tOut,x.buy,x.tIn,x.tFlag,x.difference];return [{name:'DauRa',rows:[head,...s.out.map(row)]},{name:'DauVao',rows:[head,...s.inn.map(row)]},{name:'TheoThang',rows:[['Kỳ','Bán ra','Thuế đầu ra','Mua vào','Đầu vào theo quy tắc','Thuế gắn cờ','Chênh lệch'],...p.months.map(rep)]},{name:'TheoQuy',rows:[['Kỳ','Bán ra','Thuế đầu ra','Mua vào','Đầu vào theo quy tắc','Thuế gắn cờ','Chênh lệch'],...p.quarters.map(rep),rep(p.year)]},{name:'CanKiemTra',rows:[['Loại',...head],...s.warnings.map(x=>[x.kind==='out'?'Đầu ra':'Đầu vào',...row(x)])]},{name:'CaiDat',rows:[['Tên đơn vị','Năm','Ngưỡng tiền mặt nội bộ','Thuế suất tùy chọn'],[db.settings.company,db.settings.year,db.settings.cashLimit,db.settings.rates.join(', ')]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'bang-ke-hoa-don-'+db.settings.year+'.xlsx')}
function exportJSON(){downloadText(JSON.stringify(db,null,2),'bang-ke-hoa-don-'+db.settings.year+'.json','application/json')}
function exportHTML(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#embedded-state').textContent=encode(db);let path='<!doctype html>\n'+clone.outerHTML;downloadText(path,'bang-ke-hoa-don-kem-du-lieu.html','text/html')}
async function importJSON(file){try{if(file.size>12e6)throw Error('File vượt 12 MB.');let x=JSON.parse(await file.text()),err=validateData(x);if(err)throw Error(err);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=x;save();notice('Đã khôi phục từ JSON.')}catch(e){notice('Không nhập được JSON: '+e.message,'error')}}
async function importExcel(file){try{let book=await Excel.read(file),out=[],inn=[];for(let [kind,name,target] of [['out','DauRa',out],['inn','DauVao',inn]]){let sheet=book[name];if(!sheet||sheet[0]?.[0]!=='Ngày'||sheet[0]?.[2]!=='Số hóa đơn')throw Error('Workbook không đúng mẫu xuất của app.');for(let [idx,r] of sheet.slice(1).entries()){if(r.every(v=>v===''||v==null))continue;let x={id:uid(),date:String(r[0]||''),serial:String(r[1]||''),no:String(r[2]||''),mst:String(r[3]||''),name:String(r[4]||''),net:+r[5],rate:r[6]===''?'':+r[6],source:String(r[12]||'')};if(kind==='inn')x.pay=String(r[9]||'Chuyển khoản');target.push(x)}}let x={version:1,settings:COPY(db.settings),out,inn,meta:{sample:false}},err=validateData(x);if(err)throw Error(err);if(!confirm(`Nhập ${out.length} đầu ra và ${inn.length} đầu vào từ Excel? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;save();notice('Đã nhập Excel. Hãy kiểm tra báo cáo và cảnh báo.')}catch(e){notice('Không nhập được Excel: '+e.message,'error')}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;filters={search:'',year:'all',status:'all',pay:'all'};render();window.scrollTo(0,0);return}let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;if(a==='newOut'||a==='newIn')openEditor(a==='newOut'?'out':'inn');else if(a==='edit')openEditor(b.dataset.kind,b.dataset.id);else if(a==='delete'){let kind=b.dataset.kind,x=db[kind].find(y=>y.id===b.dataset.id);if(x&&confirm(`Xóa hóa đơn ${x.serial||''} ${x.no}?`)){db[kind]=db[kind].filter(y=>y.id!==x.id);save();notice('Đã xóa hóa đơn.')}}else if(a==='exportJSON')exportJSON();else if(a==='exportHTML')exportHTML();else if(a==='exportExcel')exportExcel();else if(a==='print')window.print();else if(a==='importJSON')$('#jsonFile').click();else if(a==='importExcel')$('#excelFile').click();else if(a==='loadSample'&&confirm('Nạp lại mẫu gốc sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?')){db=sampleData();save();notice('Đã nạp dữ liệu mẫu.')}else if(a==='clearData'&&confirm('Xóa toàn bộ dữ liệu hiện tại để bắt đầu sổ mới?')){db=emptyData();save();notice('Đã tạo sổ trống.')}});
document.addEventListener('submit',e=>{if(e.target.id==='itemForm'){e.preventDefault();saveEditor()}else if(e.target.id==='settingsForm'){e.preventDefault();saveSettings()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.search=e.target.value;let focus=e.target.selectionStart;render();$('#search')?.focus();$('#search')?.setSelectionRange(focus,focus)}});
document.addEventListener('change',e=>{let k={yearFilter:'year',statusFilter:'status',payFilter:'pay'}[e.target.id];if(k){filters[k]=e.target.value;render()}});
$('#closeModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=async e=>{let file=e.target.files[0];if(file)await importJSON(file);e.target.value=''};$('#excelFile').onchange=async e=>{let file=e.target.files[0];if(file)await importExcel(file);e.target.value=''};
load();
</script></body></html>
