function reportPage(){let r=report(db),t=trial(db);return hero('📈 Kết quả kinh doanh rút gọn','Phân tích quản trị từ các tài khoản mẫu trong kỳ '+period()+'.')+'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn" data-action="print">🖨️ In báo cáo</button><button class="btn" data-action="excel">↓ Excel</button></div><p class="notice warn">Nếu đã ghi bút toán kết chuyển cuối kỳ, doanh thu/chi phí phát sinh và kết quả rút gọn có thể khác cách trình bày mong muốn. Đây không phải bộ báo cáo tài chính chính thức.</p></section><div class="split"><section class="card"><h2>Kết quả kinh doanh</h2>'+table(['Chỉ tiêu','Số tiền'],r.lines.map((x,i)=>'<tr><td><b>'+esc(x[0])+'</b></td><td class="num">'+money(x[1])+'</td></tr>'))+'</section><section class="card"><h2>Cân đối tóm tắt</h2>'+bal('Tài sản / nguồn vốn',r.assets,r.sources)+'<div class="check"><span>Nợ phải trả</span><b>'+money(r.liabilities)+'</b></div><div class="check"><span>Vốn chủ sở hữu</span><b>'+money(r.equity)+'</b></div><div class="check"><span>Thu nhập/chi phí chưa kết chuyển</span><b>'+money(r.temporary)+'</b></div><div class="check"><span>Dòng lỗi bị loại</span><b>'+t.excluded.length+'</b></div></section></div>'}
function settingsPage(){let s=db.settings;return hero('⚙️ Kỳ báo cáo & đơn vị','Chọn kỳ và khai số dư đầu kỳ phù hợp với ngày bắt đầu kỳ.')+'<section class="card"><div class="formgrid">'+field('company','Tên đơn vị','text',s.company)+field('address','Địa chỉ','text',s.address)+field('phone','Điện thoại','text',s.phone)+field('taxCode','Mã số thuế','text',s.taxCode)+field('from','Từ ngày','date',s.from)+field('to','Đến ngày','date',s.to)+'</div><p><button class="btn primary" data-action="settings">Lưu kỳ và đơn vị</button></p><p class="notice warn">Đổi kỳ báo cáo chỉ lọc bút toán; app không tự chuyển số dư đầu kỳ. Hãy cập nhật số dư đầu kỳ ở Hệ thống tài khoản trước khi dùng báo cáo kỳ mới.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Chuyển máy bằng HTML kèm dữ liệu hoặc JSON; Excel dùng để xem và nhập lại.')+'<section class="card"><div class="grid">'+metric('Tài khoản',db.accounts.length)+metric('Bút toán',db.journal.length)+metric('Trong kỳ',analyzed(db).filter(j=>j.inPeriod).length)+'</div><p class="notice warn">Dữ liệu nhập nằm trong trình duyệt. Chép file HTML gốc sẽ không mang theo dữ liệu đã nhập.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excel">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV nhật ký</button></div><p class="muted">Excel gồm sheet tài khoản, nhật ký, cài đặt, cân đối và kết quả rút gọn.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>71 tài khoản, 9 số dư đầu kỳ, 15 bút toán; có một dòng nhập nhầm để thử cảnh báo.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn','Quy trình ghi sổ Nợ/Có và rà cân đối.')+'<section class="card"><ol><li>Chọn kỳ báo cáo và khai số dư đầu kỳ đúng thời điểm.</li><li>Rà danh mục tài khoản; thêm tài khoản cấp 1 nếu cần.</li><li>Ghi từng cặp Nợ/Có bằng một dòng nhật ký. Tài khoản chi tiết như 1121 được gom theo 3 số đầu.</li><li>Sửa dòng cảnh báo; dòng lỗi không được cộng vào cân đối.</li><li>Kiểm tra tổng Nợ/Có đầu kỳ, phát sinh và cuối kỳ; đối chiếu chứng từ trước khi in.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu sau mỗi đợt nhập.</li></ol><p>App chỉ hỗ trợ sổ quản trị/ôn luyện nghiệp vụ. Danh mục tài khoản trong file tham chiếu có thể khác chế độ doanh nghiệp đang áp dụng; báo cáo kết quả rút gọn không thay thế báo cáo tài chính.</p></section>'}
function render(){let titles={dashboard:'Tổng quan',journal:'Nhật ký chung',accounts:'Hệ thống tài khoản',trial:'Cân đối số phát sinh',report:'Kết quả rút gọn',settings:'Kỳ & đơn vị',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,journal:journalPage,accounts:accountsPage,trial:trialPage,report:reportPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Nhật ký chung')+'</b> · '+esc(titles[page])+' · '+period()+'</div>'+views[page]()}
function openModal(kind,key=''){let old=(kind==='account'?db.accounts:db.journal).find(x=>x.id===key)||{};modal={kind,key};$('#modalTitle').textContent=(key?'Sửa ':'Thêm ')+(kind==='account'?'tài khoản':'bút toán');let h='';if(kind==='account')h=field('no','Số TK cấp 1 (3 chữ số) *','text',old.no)+field('name','Tên tài khoản *','text',old.name)+field('type','Loại','select','',TYPES.map(x=>opt(x,x,old.type||TYPES[0])).join(''))+field('openD','Dư đầu kỳ Nợ (đ)','number',old.openD??0)+field('openC','Dư đầu kỳ Có (đ)','number',old.openC??0);else h=field('date','Ngày *','date',old.date||today())+field('voucher','Số chứng từ','text',old.voucher)+field('description','Diễn giải','textarea',old.description)+field('debit','TK Nợ *','text',old.debit)+field('credit','TK Có *','text',old.credit)+field('amount','Số tiền (đ) *','number',old.amount??0)+'<p class="wide notice">Có thể nhập tài khoản chi tiết (ví dụ 1121); báo cáo cộng theo 3 số đầu. TK Nợ và Có phải khác nhau.</p>';if(key)h+='<div class="wide"><button type="button" class="btn danger small" data-action="deleteRecord">Xóa bản ghi</button></div>';$('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){if(!modal)return;let{kind,key}=modal,x={},error='';if(kind==='account'){x={no:v('no'),name:v('name'),type:v('type'),openD:num(v('openD')),openC:num(v('openC'))};if(!/^\d{3}$/.test(x.no)||!x.name||x.name.length>200||!TYPES.includes(x.type)||!safe(x.openD)||!safe(x.openC)||x.openD&&x.openC)error='Số TK phải có 3 chữ số; chỉ nhập dư Nợ hoặc Có.';if(db.accounts.some(a=>a.id!==key&&a.no===x.no))error='Số TK đã có.';let old=db.accounts.find(a=>a.id===key);if(old&&old.no!==x.no&&db.journal.some(j=>root(j.debit)===old.no||root(j.credit)===old.no))error='TK đã có bút toán; không thể đổi số hiệu.'}else{x={date:v('date'),voucher:v('voucher'),description:v('description'),debit:v('debit'),credit:v('credit'),amount:num(v('amount'))};let nos=new Set(db.accounts.map(a=>a.no));if(!dateOK(x.date)||x.voucher.length>100||x.description.length>1000||!/^\d{3,10}$/.test(x.debit)||!/^\d{3,10}$/.test(x.credit)||!safe(x.amount)||x.amount===0)error='Kiểm tra ngày, TK Nợ/Có và số tiền dương.';if(x.debit===x.credit)error='TK Nợ và Có không thể trùng nhau.';if(!nos.has(root(x.debit))||!nos.has(root(x.credit)))error='TK cấp 1 chưa có trong Hệ thống tài khoản.'}if(error){$('#modalError').textContent=error;return}let d=structuredClone(db),arr=kind==='account'?d.accounts:d.journal;if(key)Object.assign(arr.find(z=>z.id===key),x);else arr.push({id:uid(),...x});if(!valid(d)){$('#modalError').textContent='Dữ liệu không hợp lệ.';return}db=d;closeModal();save()}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('nhat-ky-chung-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){let t=trial(db),r=report(db);return[{name:'Tai khoan',rows:[['Mã nội bộ','Số TK','Tên TK','Loại','Dư Nợ đầu','Dư Có đầu'],...db.accounts.map(a=>[a.id,a.no,a.name,a.type,a.openD,a.openC])]},{name:'Nhat ky',rows:[['Mã nội bộ','Ngày','Chứng từ','Diễn giải','TK Nợ','TK Có','Số tiền'],...db.journal.map(j=>[j.id,j.date,j.voucher,j.description,j.debit,j.credit,j.amount])]},{name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]},{name:'Can doi',rows:[['Số TK','Tên TK','Dư Nợ đầu','Dư Có đầu','PS Nợ','PS Có','Dư Nợ cuối','Dư Có cuối'],...t.rows.filter(a=>a.openD||a.openC||a.psD||a.psC).map(a=>[a.no,a.name,a.openD,a.openC,a.psD,a.psC,a.endD,a.endC]),[],['Tổng','',t.total.openD,t.total.openC,t.total.psD,t.total.psC,t.total.endD,t.total.endC]]},{name:'KQKD rut gon',rows:[['Chỉ tiêu','Số tiền'],...r.lines]}]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='nhat-ky-chung-can-doi.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(x){if(typeof x==='number'){let d=new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000);return d.toISOString().slice(0,10)}let s=String(x??'').trim();if(dateOK(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let d=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return dateOK(d)?d:''}return''}
function parsedExcel(s){if(s['Tai khoan']?.[0]?.[0]!=='Mã nội bộ'||s['Nhat ky']?.[0]?.[0]!=='Mã nội bộ')throw Error('Cần file Excel do app xuất có sheet Tài khoản và Nhật ký.');let d=blank();d.accounts=s['Tai khoan'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),no:String(r[1]),name:String(r[2]??''),type:String(r[3]??''),openD:num(r[4]),openC:num(r[5])}));d.journal=s['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),date:parseDate(r[1]),voucher:String(r[2]??''),description:String(r[3]??''),debit:String(r[4]??''),credit:String(r[5]??''),amount:num(r[6])}));if(s['Cai dat']){let raw=Object.fromEntries(s['Cai dat'].slice(1).filter(r=>r[0]).map(r=>[String(r[0]),r[1]]));for(let k of Object.keys(d.settings))if(raw[k]!==undefined)d.settings[k]=['from','to'].includes(k)?parseDate(raw[k]):String(raw[k])}if(!valid(d))throw Error('Excel có tài khoản, ngày, số tiền hoặc kỳ không hợp lệ.');return d}
function csv(){let rows=[['Ngày','Chứng từ','Diễn giải','TK Nợ','TK Có','Số tiền','Cảnh báo','Trong kỳ'],...analyzed(db).map(j=>[j.date,j.voucher,j.description,j.debit,j.credit,j.amount,j.warning,j.inPeriod?'Có':'Không'])];download('nhat-ky-chung.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')window.print();if(a==='excel')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv();if(a==='backup')download('nhat-ky-chung.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(!confirm('Nạp mẫu sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sample();save()}if(a==='clear'){if(confirm('Xóa toàn bộ dữ liệu nhật ký và đặt lại danh mục TK?')){db=blank();save()}}if(a==='settings'){let d=structuredClone(db);for(let k of ['company','address','phone','taxCode','from','to'])d.settings[k]=v(k);if(!valid(d)){alert('Kỳ hoặc thông tin đơn vị không hợp lệ.');return}db=d;save()}if(a==='deleteRecord'&&modal?.key){let{kind,key}=modal,old=kind==='account'?db.accounts.find(x=>x.id===key):null;if(old&&db.journal.some(j=>root(j.debit)===old.no||root(j.credit)===old.no)){$('#modalError').textContent='Tài khoản đã có bút toán; không thể xóa.';return}if(!confirm('Xóa vĩnh viễn bản ghi này?'))return;let list=kind==='account'?'accounts':'journal';db[list]=db[list].filter(x=>x.id!==key);closeModal();save()}});
document.addEventListener('change',e=>{if(e.target.id==='journalFilter'){filter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
