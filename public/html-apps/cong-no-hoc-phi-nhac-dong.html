function remindersPage(){let todo=activeAccounts().filter(a=>balance(a)>0&&['Sắp đến hạn','Đến hạn','Quá hạn','Quá hạn lâu'].includes(state(a))).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)),logs=[...db.reminders].sort((a,b)=>b.date.localeCompare(a.date));return hero('Nhắc đóng & nhật ký','Ưu tiên hồ sơ sắp đến hạn và quá hạn; người phụ trách tự liên hệ rồi ghi kết quả.')+`<div class="grid">${metric('Cần nhắc',num(todo.length),'Sắp hạn, đến hạn hoặc quá hạn')}${metric('Quá hạn lâu',num(todo.filter(a=>state(a)==='Quá hạn lâu').length),'Từ '+db.settings.strongAfter+' ngày')}${metric('Lượt liên hệ đã ghi',num(logs.length),'Không đồng nghĩa đã thu tiền')}</div><div class="card"><div class="toolbar"><h2>Hàng đợi cần nhắc</h2><span class="grow"></span>${button('⚙️ Ngưỡng nhắc','goSettings')}</div>${accountTable(todo)}</div><div class="card"><h2>Nhật ký liên hệ gần đây</h2>${logs.length?`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Học viên</th><th>Kênh</th><th>Kết quả</th><th>Hẹn lại</th><th>Ghi chú</th></tr></thead><tbody>${logs.slice(0,150).map(r=>`<tr><td>${date(r.date)}</td><td><button class="link" data-open="${esc(r.accountId)}">${esc(account(r.accountId)?.name||'?')}</button></td><td>${esc(r.channel)}</td><td>${esc(r.outcome)}</td><td>${date(r.nextDate)}</td><td>${esc(r.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có lần nhắc nào được ghi.</div>'}</div>`}
function agingBucket(a){let b=balance(a);if(b<=0)return'';let d=age(a);return d===0?'Chưa quá hạn':d<=7?'1–7 ngày':d<=30?'8–30 ngày':d<=60?'31–60 ngày':'Trên 60 ngày'}
function reportPage(){let t=totals(),list=activeAccounts(),byClass=[...new Set(list.map(a=>a.className||'Chưa ghi lớp'))].sort((a,b)=>a.localeCompare(b,'vi')),aging=['Chưa quá hạn','1–7 ngày','8–30 ngày','31–60 ngày','Trên 60 ngày'],methods=METHODS.map(m=>({name:m,amount:db.payments.filter(p=>!p.voidedAt&&p.date<=asof()&&p.method===m).reduce((n,p)=>n+p.amount,0)}));return hero('Báo cáo học phí','Tách khoản phải thu, tín dụng đóng vượt và số thu theo kênh tại ngày '+date(asof())+'.')+`<div class="grid metrics">${metric('Phải đóng',money(t.due))}${metric('Đã đóng',money(t.received))}${metric('Còn phải thu',money(t.receivable))}${metric('Đóng vượt',money(t.credit))}${metric('Số dư bù trừ',money(t.net))}</div><div class="card"><h2>Theo lớp</h2><div class="table-wrap"><table class="report-table"><thead><tr><th>Lớp</th><th>Hồ sơ</th><th>Phải đóng</th><th>Đã đóng</th><th>Phải thu</th><th>Đóng vượt</th></tr></thead><tbody>${byClass.map(c=>{let x=list.filter(a=>(a.className||'Chưa ghi lớp')===c);return`<tr><td>${esc(c)}</td><td>${x.length}</td><td class="num">${money(x.reduce((n,a)=>n+expected(a),0))}</td><td class="num">${money(x.reduce((n,a)=>n+paid(a),0))}</td><td class="num">${money(x.reduce((n,a)=>n+Math.max(0,balance(a)),0))}</td><td class="num">${money(x.reduce((n,a)=>n+Math.max(0,-balance(a)),0))}</td></tr>`}).join('')}</tbody></table></div></div><div class="grid two"><div class="card"><h2>Tuổi nợ</h2>${aging.map(k=>{let x=list.filter(a=>agingBucket(a)===k);return`<div class="check"><span>${k} · ${x.length} hồ sơ</span><b>${money(x.reduce((n,a)=>n+Math.max(0,balance(a)),0))}</b></div>`}).join('')}</div><div class="card"><h2>Đã đóng theo hình thức</h2>${methods.map(m=>`<div class="check"><span>${esc(m.name)}</span><b>${money(m.amount)}</b></div>`).join('')}</div></div><div class="hint">Báo cáo là sổ quản trị học phí của các hồ sơ đã mở tính đến ngày báo cáo. Không tự suy ra doanh thu kế toán, hóa đơn hoặc tình trạng chuyển khoản ngân hàng.</div><div class="toolbar no-print">${button('⬇️ Xuất Excel','exportExcel','primary')}${button('🖨️ In báo cáo','print')}</div>`}
function settingsPage(){return hero('Cài đặt','Điều chỉnh ngày báo cáo, ngưỡng nhắc và nội dung nhắc tham khảo.')+`<div class="card"><h2>Thông số</h2><div class="formgrid"><div class="field"><label for="org">Tên đơn vị</label><input id="org" maxlength="120" value="${esc(db.settings.org)}" placeholder="Tên trung tâm"></div><div class="field"><label for="asof">Ngày báo cáo (để trống = hôm nay)</label><input id="asof" type="date" value="${esc(db.settings.asof)}"></div><div class="field"><label for="soonDays">Nhắc sắp hạn trước bao nhiêu ngày</label><input id="soonDays" type="number" min="0" max="90" value="${db.settings.soonDays}"></div><div class="field"><label for="strongAfter">Quá hạn lâu từ bao nhiêu ngày</label><input id="strongAfter" type="number" min="1" max="365" value="${db.settings.strongAfter}"></div><div class="field full"><label for="template">Mẫu nội dung nhắc</label><textarea id="template" maxlength="2000">${esc(db.settings.template)}</textarea><small>Dùng: {org}, {name}, {class}, {balance}, {due}. App chỉ sao chép nội dung.</small></div></div><div class="toolbar" style="margin-top:15px">${button('Lưu cài đặt','saveSettings','primary')}</div></div><div class="hint">Ngày báo cáo chỉ tính các hồ sơ đã mở và các lần đóng không bị hủy có ngày không sau ngày đó. Mức “quá hạn lâu” bắt đầu từ đúng số ngày đã đặt.</div>`}
function dataPage(){return hero('Dữ liệu & sao lưu','Bắt đầu bằng dữ liệu trống; nạp mẫu 10 hồ sơ/20 lần đóng khi cần xem thử.')+`<div class="card"><h2>Xuất và nhập</h2><div class="data-actions">${button('⬇️ Sao lưu JSON','backup','primary')}${button('⬇️ HTML kèm dữ liệu','portable')}${button('⬆️ Khôi phục JSON','restore')}${button('⬇️ Xuất Excel 4 sheet','exportExcel')}${button('⬆️ Nhập Excel 4 sheet','importExcel')}</div><p class="muted">Excel gồm Hồ sơ, Lần đóng, Nhật ký nhắc, Điều chỉnh. Khi nhập lại, giữ nguyên tên sheet và cột của file do app xuất; app kiểm tra liên kết trước khi thay dữ liệu hiện tại.</p></div><div class="card"><h2>Dữ liệu mẫu từ file tham chiếu</h2><p>10 hồ sơ học phí, 20 lần đóng. Ngày mẫu dạng <code>@±n</code> được đặt tương đối theo ngày nạp. Một số tiền trong nguồn có sai số dấu phẩy động; app làm tròn đến đồng.</p>${button('Nạp dữ liệu mẫu','loadDemo')}</div><div class="card"><h2>Xóa dữ liệu trên thiết bị</h2><p>Xóa toàn bộ hồ sơ, các lần đóng, nhật ký nhắc và cài đặt trong trình duyệt này.</p>${button('Xóa toàn bộ dữ liệu','clear','danger')}</div><div class="hint">HTML gốc chép sang máy khác không mang dữ liệu đã nhập. JSON, Excel và HTML kèm dữ liệu chứa tên, số điện thoại và học phí ở dạng đọc được; lưu ở nơi anh kiểm soát.</div>`}
function guidePage(){return hero('Cách dùng','Theo dõi một khoản học phí từ lúc mở hồ sơ đến khi thu đủ hoặc xử lý đóng vượt.')+`<div class="card"><h2>Quy trình</h2><ol><li>Tạo <b>Hồ sơ học phí</b> với mã, học viên, lớp, học phí khóa, giảm học phí và hạn đóng.</li><li>Ghi mỗi lần phụ huynh đóng vào <b>Các lần đóng</b>. Nếu ghi sai, hủy dòng có lý do rồi tạo dòng đúng; lịch sử vẫn còn.</li><li>Xem <b>Nhắc đóng</b>, sao chép nội dung tham khảo và tự liên hệ. Sau đó ghi kênh, kết quả và ngày hẹn lại.</li><li>Xem báo cáo theo lớp, tuổi nợ và hình thức đóng; sao lưu JSON/Excel/HTML định kỳ.</li></ol></div><div class="grid two"><div class="card"><h2>Cách tính</h2><p>Phải đóng = làm tròn đến đồng của học phí khóa × (1 − giảm học phí / 100).</p><p>Đã đóng = tổng các lần đóng hợp lệ có ngày không sau ngày báo cáo.</p><p>Còn phải thu = tổng số dư dương. Đóng vượt = tổng trị tuyệt đối của các số dư âm. Hai khoản được trình bày riêng.</p><p>Ngày quá hạn = số ngày từ sau hạn đóng đến ngày báo cáo, chỉ khi còn phải thu.</p></div><div class="card"><h2>Phạm vi</h2><p>File tham chiếu có 10 hồ sơ và 20 lần đóng. Bản này bổ sung tách khoản đóng vượt, hủy lần ghi sai có lý do, nhật ký nhắc và ngày báo cáo.</p><p>App không gửi tin nhắn, không đối soát ngân hàng, không lập hóa đơn và không tự tính nghĩa vụ thuế.</p></div></div>`}
const titles={dashboard:'Tổng quan',accounts:'Hồ sơ học phí',accountDetail:'Chi tiết học phí',payments:'Các lần đóng',reminders:'Nhắc đóng & nhật ký',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};
function render(){let view={dashboard,accounts:accountsPage,accountDetail,payments:paymentsPage,reminders:remindersPage,report:reportPage,settings:settingsPage,data:dataPage,guide:guidePage}[page]||dashboard;$('#screen').innerHTML=view();$('#topTitle').textContent=titles[page]||'Tổng quan';$('#topSub').textContent=db.settings.org||'Công nợ học phí và nhắc đóng';$$('.side-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='accountDetail'&&b.dataset.page==='accounts')))}
function field(label,key,value,type='text',extra=''){return`<div class="field"><label for="f_${key}">${esc(label)}</label><input id="f_${key}" data-field="${key}" type="${type}" value="${esc(value??'')}" ${extra}></div>`}
function select(label,key,value,items){return`<div class="field"><label for="f_${key}">${esc(label)}</label><select id="f_${key}" data-field="${key}">${items.map(x=>`<option ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function area(label,key,value){return`<div class="field full"><label for="f_${key}">${esc(label)}</label><textarea id="f_${key}" data-field="${key}" maxlength="1000">${esc(value||'')}</textarea></div>`}
function accountSelect(value){return`<div class="field full"><label for="f_accountId">Hồ sơ học phí *</label><select id="f_accountId" data-field="accountId">${db.accounts.map(a=>`<option value="${esc(a.id)}" ${value===a.id?'selected':''}>${esc(a.code)} · ${esc(a.name)} · ${esc(a.className)}</option>`).join('')}</select></div>`}
function showModal(kind,id=''){draftKind=kind;let existing=kind==='account'?account(id):null;draft=existing?clone(existing):null;let title='',fields='';if(kind==='account'){if(!draft)draft={id:null,code:nextCode(),name:'',className:'',fee:0,discount:0,openDate:today(),dueDate:today(),parent:'',phone:'',note:''};title=(id?'Sửa':'Thêm')+' hồ sơ học phí';fields=field('Mã hồ sơ *','code',draft.code,'text','maxlength="30" required')+field('Tên học viên *','name',draft.name,'text','maxlength="120" required')+field('Lớp / khóa học','className',draft.className,'text','maxlength="100"')+field('Học phí khóa *','fee',draft.fee,'number','min="0" step="1"')+field('Giảm học phí (%)','discount',draft.discount,'number','min="0" max="100" step="0.01"')+field('Ngày mở khoản *','openDate',draft.openDate,'date')+field('Hạn đóng *','dueDate',draft.dueDate,'date')+field('Người liên hệ','parent',draft.parent,'text','maxlength="120"')+field('Điện thoại','phone',draft.phone,'tel','maxlength="24"')+area('Ghi chú','note',draft.note)+(id?area('Lý do điều chỉnh (cần nếu đổi học phí, giảm hoặc hạn)','changeReason',''):'')}else if(kind==='payment'){if(!db.accounts.length){alert('Hãy tạo hồ sơ học phí trước.');return}draft={accountId:id&&account(id)?id:accountId&&account(accountId)?accountId:db.accounts[0].id,date:today(),amount:0,method:'Chuyển khoản',reference:'',note:''};title='Ghi lần đóng học phí';fields=accountSelect(draft.accountId)+field('Ngày đóng *','date',draft.date,'date')+field('Số tiền *','amount',draft.amount,'number','min="1" step="1"')+select('Hình thức','method',draft.method,METHODS)+field('Mã giao dịch / phiếu thu','reference','','text','maxlength="100"')+area('Ghi chú','note','')}else if(kind==='reminder'){if(!db.accounts.length){alert('Hãy tạo hồ sơ học phí trước.');return}draft={accountId:id&&account(id)?id:accountId&&account(accountId)?accountId:db.accounts[0].id,date:today(),channel:'Điện thoại',outcome:'Đã nhắc',nextDate:'',note:''};title='Ghi nhật ký nhắc đóng';fields=accountSelect(draft.accountId)+field('Ngày liên hệ *','date',draft.date,'date')+select('Kênh liên hệ','channel',draft.channel,CHANNELS)+select('Kết quả','outcome',draft.outcome,OUTCOMES)+field('Hẹn lại ngày','nextDate','','date')+area('Ghi chú','note','')}$('#modalTitle').textContent=title;$('#modalFields').innerHTML=fields;$('#modalError').textContent='';$('#editor').showModal()}
function modalError(msg){$('#modalError').textContent=msg;return false}
function collect(){let o={};$$('[data-field]',$('#modalFields')).forEach(x=>o[x.dataset.field]=x.value.trim());return o}
function saveModal(){let f=collect();if(draftKind==='account'){let code=f.code.toUpperCase(),fee=Number(f.fee),discount=Number(f.discount);if(!/^[A-Z0-9_-]{2,30}$/.test(code))return modalError('Mã cần 2–30 ký tự A–Z, số, _ hoặc -.');if(db.accounts.some(a=>a.code===code&&a.id!==draft.id))return modalError('Mã hồ sơ đã tồn tại.');if(!f.name||f.name.length>120)return modalError('Nhập tên học viên tối đa 120 ký tự.');if(!Number.isInteger(fee)||fee<0||fee>1e11)return modalError('Học phí cần là số nguyên không âm.');if(!Number.isFinite(discount)||discount<0||discount>100||Math.abs(discount*100-Math.round(discount*100))>1e-6)return modalError('Giảm học phí từ 0 đến 100%, tối đa hai chữ số thập phân.');if(!validDate(f.openDate)||!validDate(f.dueDate)||f.dueDate<f.openDate)return modalError('Ngày mở khoản/hạn đóng không hợp lệ; hạn không được trước ngày mở.');if(f.phone&&!/^[0-9+().\s-]{8,24}$/.test(f.phone))return modalError('Số điện thoại cần 8–24 ký tự hợp lệ.');if(draft.id&&f.openDate!==draft.openDate)return modalError('Ngày mở khoản không sửa sau khi tạo; hãy tạo hồ sơ mới nếu cần.');let a={id:draft.id||uid(),code,name:f.name,className:f.className.slice(0,100),fee,discount,openDate:f.openDate,dueDate:f.dueDate,parent:f.parent.slice(0,120),phone:f.phone,note:f.note.slice(0,1000)};if(draft.id){let old=account(draft.id),changed=old.fee!==fee||old.discount!==discount||old.dueDate!==a.dueDate;if(changed&&!f.changeReason)return modalError('Hãy ghi lý do điều chỉnh học phí, giảm hoặc hạn đóng.');if(changed)db.changes.push({id:uid(),accountId:old.id,date:today(),before:{fee:old.fee,discount:old.discount,dueDate:old.dueDate},after:{fee,discount,dueDate:a.dueDate},reason:f.changeReason.slice(0,1000),createdAt:stamp()});Object.assign(old,a)}else db.accounts.push(a);accountId=a.id;page='accountDetail'}else if(draftKind==='payment'){let a=account(f.accountId),amount=Number(f.amount);if(!a)return modalError('Chọn hồ sơ học phí hợp lệ.');if(!validDate(f.date)||f.date<a.openDate||f.date>today())return modalError('Ngày đóng cần từ ngày mở khoản đến hôm nay.');if(!Number.isInteger(amount)||amount<=0||amount>1e11)return modalError('Số tiền cần là số nguyên dương.');if(!METHODS.includes(f.method))return modalError('Hình thức đóng không hợp lệ.');let duplicate=db.payments.find(p=>!p.voidedAt&&(f.reference&&p.reference===f.reference||p.accountId===a.id&&p.date===f.date&&p.amount===amount&&p.method===f.method));if(duplicate&&!confirm('Đã có lần đóng trùng mã giao dịch hoặc cùng học viên, ngày, số tiền và hình thức. Vẫn lưu?'))return;let current=balance(a,today());if(amount>Math.max(0,current)&&!confirm(`Lần đóng ${money(amount)} sẽ làm hồ sơ ${a.code} đóng vượt. Vẫn lưu?`))return;db.payments.push({id:uid(),accountId:a.id,date:f.date,amount,method:f.method,reference:f.reference.slice(0,100),note:f.note.slice(0,1000),voidedAt:'',voidReason:'',createdAt:stamp()});accountId=a.id;page='accountDetail'}else if(draftKind==='reminder'){let a=account(f.accountId);if(!a)return modalError('Chọn hồ sơ học phí hợp lệ.');if(!validDate(f.date)||f.date<a.openDate||f.date>today())return modalError('Ngày liên hệ cần từ ngày mở khoản đến hôm nay.');if(f.nextDate&&(!validDate(f.nextDate)||f.nextDate<f.date))return modalError('Ngày hẹn lại không được trước ngày liên hệ.');if(!CHANNELS.includes(f.channel)||!OUTCOMES.includes(f.outcome))return modalError('Kênh hoặc kết quả không hợp lệ.');db.reminders.push({id:uid(),accountId:a.id,date:f.date,channel:f.channel,outcome:f.outcome,nextDate:f.nextDate,note:f.note.slice(0,1000),createdAt:stamp()});accountId=a.id;page='accountDetail'}$('#editor').close();draft=null;save()}

function printReceipt(id){let p=db.payments.find(x=>x.id===id&&!x.voidedAt),a=p&&account(p.accountId);if(!a)return;let rows=[['Mã hồ sơ',a.code],['Học viên',a.name],['Lớp',a.className||'—'],['Ngày đóng',date(p.date)],['Số tiền',money(p.amount)],['Hình thức',p.method],['Mã giao dịch',p.reference||'—'],['Ghi chú',p.note||'—']];$('#receiptPrint').innerHTML=`<div class="receipt-head"><p>${esc(db.settings.org||'Đơn vị quản lý học phí')}</p><h1>BIÊN NHẬN ĐÓNG HỌC PHÍ</h1><p>Mã biên nhận nội bộ: ${esc(p.id)}</p></div>${rows.map(([label,value])=>`<div class="receipt-row"><span>${esc(label)}</span><b>${esc(value)}</b></div>`).join('')}<p class="receipt-note">Biên nhận nội bộ theo dữ liệu đã nhập. Hãy đối chiếu sổ quỹ hoặc ngân hàng trước khi xác nhận thanh toán. Không thay thế hóa đơn.</p>`;document.body.classList.add('receipt-mode');let done=()=>document.body.classList.remove('receipt-mode');window.addEventListener('afterprint',done,{once:true});window.print();setTimeout(done,2000)}
function voidPayment(id){let p=db.payments.find(x=>x.id===id);if(!p||p.voidedAt)return;let reason=prompt('Lý do hủy lần đóng này (giữ dòng trong sổ):','');if(!reason)return;reason=reason.trim();if(!reason||reason.length>1000){alert('Lý do cần từ 1 đến 1.000 ký tự.');return}if(!confirm(`Hủy lần đóng ${money(p.amount)} ngày ${date(p.date)}?`))return;p.voidedAt=stamp();p.voidReason=reason;save()}
function deleteAccount(){let a=account(accountId);if(!a)return;if(db.payments.some(p=>p.accountId===a.id)||db.reminders.some(r=>r.accountId===a.id)||db.changes.some(h=>h.accountId===a.id)){alert('Không thể xóa hồ sơ đã có lần đóng, nhật ký nhắc hoặc điều chỉnh. Hãy giữ hồ sơ để đối chiếu.');return}if(!confirm(`Xóa hồ sơ ${a.code} · ${a.name}?`))return;db.accounts=db.accounts.filter(x=>x.id!==a.id);page='accounts';save()}
async function copyReminder(){let a=account(accountId);if(!a)return;let text=reminderText(a);try{await navigator.clipboard.writeText(text);alert('Đã sao chép nội dung. Hãy kiểm tra trước khi tự gửi.')}catch{let el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();let ok=document.execCommand('copy');el.remove();alert(ok?'Đã sao chép nội dung.':'Không tự sao chép được. Hãy chọn và chép nội dung trên màn hình.')}}
function downloadBlob(blob,name){let link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.append(link);link.click();setTimeout(()=>{URL.revokeObjectURL(url);link.remove()},30000)}
function backup(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'cong-no-hoc-phi.json')}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');downloadBlob(new Blob(['<!doctype html>\n'+html],{type:'text/html;charset=utf-8'}),'cong-no-hoc-phi-kem-du-lieu.html')}
const AHEAD=['Mã hồ sơ','Họ tên học viên','Lớp','Học phí khóa','Giảm học phí (%)','Ngày mở khoản','Hạn đóng','Người liên hệ','Điện thoại','Ghi chú'];
const PHEAD=['Mã lần đóng','Ngày đóng','Mã hồ sơ','Số tiền','Hình thức','Mã giao dịch','Ghi chú','Hủy lúc','Lý do hủy','Tạo lúc'];
const RHEAD=['Mã lần nhắc','Ngày liên hệ','Mã hồ sơ','Kênh','Kết quả','Hẹn lại','Ghi chú','Tạo lúc'];
const CHEAD=['Mã điều chỉnh','Ngày','Mã hồ sơ','Học phí cũ','Giảm cũ (%)','Hạn cũ','Học phí mới','Giảm mới (%)','Hạn mới','Lý do','Tạo lúc'];
function exportExcel(){let sheets=[{name:'Ho so',rows:[AHEAD,...db.accounts.map(a=>[a.code,a.name,a.className,a.fee,a.discount,a.openDate,a.dueDate,a.parent,a.phone,a.note])]},{name:'Lan dong',rows:[PHEAD,...db.payments.map(p=>[p.id,p.date,account(p.accountId)?.code||'',p.amount,p.method,p.reference,p.note,p.voidedAt,p.voidReason,p.createdAt])]},{name:'Nhat ky nhac',rows:[RHEAD,...db.reminders.map(r=>[r.id,r.date,account(r.accountId)?.code||'',r.channel,r.outcome,r.nextDate,r.note,r.createdAt])]},{name:'Dieu chinh',rows:[CHEAD,...db.changes.map(h=>[h.id,h.date,account(h.accountId)?.code||'',h.before.fee,h.before.discount,h.before.dueDate,h.after.fee,h.after.discount,h.after.dueDate,h.reason,h.createdAt])]}];downloadBlob(Excel.workbook(sheets),'cong-no-hoc-phi.xlsx')}
function sheetDate(v){if(typeof v==='number'&&Number.isFinite(v))return new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toISOString().slice(0,10);return String(v||'').trim()}
function fromExcel(book){let aa=book['Ho so'],pp=book['Lan dong'],rr=book['Nhat ky nhac'],cc=book['Dieu chinh'];if(!aa||!pp||!rr||!cc)throw Error('Thiếu một trong bốn sheet của app.');let same=(a,b)=>b.every((x,i)=>String(a?.[i]??'').trim()===x);if(!same(aa[0],AHEAD)||!same(pp[0],PHEAD)||!same(rr[0],RHEAD)||!same(cc[0],CHEAD))throw Error('Tên cột không khớp file mẫu do app xuất.');let x=empty(),ref=new Map();x.settings=clone(db.settings);for(let [i,r] of aa.slice(1).entries()){if(!String(r[0]??'').trim())continue;let code=String(r[0]).trim().toUpperCase();if(ref.has(code))throw Error('Trùng mã hồ sơ ở dòng '+(i+2));let a={id:uid(),code,name:String(r[1]??'').trim(),className:String(r[2]??''),fee:Number(r[3]),discount:Number(r[4]),openDate:sheetDate(r[5]),dueDate:sheetDate(r[6]),parent:String(r[7]??''),phone:String(r[8]??''),note:String(r[9]??'')};x.accounts.push(a);ref.set(code,a)}for(let [i,r] of pp.slice(1).entries()){if(!String(r[0]??'').trim())continue;let a=ref.get(String(r[2]??'').trim().toUpperCase());if(!a)throw Error('Lần đóng dòng '+(i+2)+' tham chiếu mã hồ sơ không có.');x.payments.push({id:String(r[0]),date:sheetDate(r[1]),accountId:a.id,amount:Number(r[3]),method:String(r[4]??''),reference:String(r[5]??''),note:String(r[6]??''),voidedAt:String(r[7]??''),voidReason:String(r[8]??''),createdAt:String(r[9]||stamp())})}for(let [i,r] of rr.slice(1).entries()){if(!String(r[0]??'').trim())continue;let a=ref.get(String(r[2]??'').trim().toUpperCase());if(!a)throw Error('Nhật ký nhắc dòng '+(i+2)+' tham chiếu mã hồ sơ không có.');x.reminders.push({id:String(r[0]),date:sheetDate(r[1]),accountId:a.id,channel:String(r[3]??''),outcome:String(r[4]??''),nextDate:sheetDate(r[5]),note:String(r[6]??''),createdAt:String(r[7]||stamp())})}for(let [i,r] of cc.slice(1).entries()){if(!String(r[0]??'').trim())continue;let a=ref.get(String(r[2]??'').trim().toUpperCase());if(!a)throw Error('Điều chỉnh dòng '+(i+2)+' tham chiếu mã hồ sơ không có.');x.changes.push({id:String(r[0]),date:sheetDate(r[1]),accountId:a.id,before:{fee:Number(r[3]),discount:Number(r[4]),dueDate:sheetDate(r[5])},after:{fee:Number(r[6]),discount:Number(r[7]),dueDate:sheetDate(r[8])},reason:String(r[9]??''),createdAt:String(r[10]||stamp())})}let err=validate(x);if(err)throw Error(err);return x}
function loadDemo(){if((db.accounts.length||db.payments.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),ref=new Map();for(let row of TUITION_SAMPLE.hv){let a={id:uid(),code:row[0],name:row[1],className:row[2],fee:row[3],discount:row[4],openDate:addDays(today(),-60),dueDate:addDays(today(),Number(String(row[5]).replace('@',''))),parent:'',phone:'',note:''};x.accounts.push(a);ref.set(a.code,a.id)}for(let row of TUITION_SAMPLE.thu)x.payments.push({id:uid(),date:addDays(today(),Number(String(row[0]).replace('@',''))),accountId:ref.get(row[1]),amount:Math.round(row[2]),method:row[3],reference:'',note:'Dữ liệu mẫu gốc',voidedAt:'',voidReason:'',createdAt:stamp()});x.settings=clone(db.settings);db=x;page='dashboard';save()}
function saveSettings(){let org=$('#org').value.trim(),as=$('#asof').value,soon=Number($('#soonDays').value),strong=Number($('#strongAfter').value),template=$('#template').value.trim();if(org.length>120||as&&!validDate(as)||!Number.isInteger(soon)||soon<0||soon>90||!Number.isInteger(strong)||strong<1||strong>365||!template||template.length>2000){alert('Kiểm tra tên đơn vị, ngày báo cáo, ngưỡng nhắc và mẫu nội dung.');return}db.settings={org,asof:as,soonDays:soon,strongAfter:strong,template};save()}
function act(name){if(name==='newAccount')showModal('account');else if(name==='editAccount')showModal('account',accountId);else if(name==='newPayment')showModal('payment',accountId);else if(name==='newReminder')showModal('reminder',accountId);else if(name==='goAccounts'){page='accounts';render()}else if(name==='goSettings'){page='settings';render()}else if(name==='deleteAccount')deleteAccount();else if(name==='copyReminder')copyReminder();else if(name==='exportExcel')exportExcel();else if(name==='importExcel')$('#excelFile').click();else if(name==='backup')backup();else if(name==='portable')portable();else if(name==='restore')$('#jsonFile').click();else if(name==='loadDemo')loadDemo();else if(name==='clear'){if(!confirm('Xóa toàn bộ hồ sơ, lần đóng và nhật ký trên trình duyệt này?'))return;db=empty();page='dashboard';save()}else if(name==='saveSettings')saveSettings();else if(name==='print')window.print()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-open],[data-void],[data-receipt]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0)}else if(b.dataset.open){accountId=b.dataset.open;page='accountDetail';render();window.scrollTo(0,0)}else if(b.dataset.void)voidPayment(b.dataset.void);else if(b.dataset.receipt)printReceipt(b.dataset.receipt);else if(b.dataset.action)act(b.dataset.action)});
$('#modalSave').addEventListener('click',saveModal);$('#modalClose').addEventListener('click',()=>$('#editor').close());$('#modalCancel').addEventListener('click',()=>$('#editor').close());$('#quickPrint').addEventListener('click',()=>window.print());
document.addEventListener('change',e=>{if(e.target.id==='classFilter'){classFilter=e.target.value;render()}else if(e.target.id==='stateFilter'){stateFilter=e.target.value;render()}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();let x=$('#search');x?.focus();x?.setSelectionRange(pos,pos)},250)}});
$('#jsonFile').addEventListener('change',async e=>{let file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>20e6){alert('File JSON vượt 20 MB.');return}try{let x=JSON.parse(await file.text()),err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.accounts.length} hồ sơ, ${x.payments.length} lần đóng trong file?`))return;db=x;page='dashboard';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files?.[0];e.target.value='';if(!file)return;try{let book=await Excel.read(file),x=fromExcel(book);if(!confirm(`Nhập Excel sẽ thay dữ liệu bằng ${x.accounts.length} hồ sơ, ${x.payments.length} lần đóng và ${x.reminders.length} lần nhắc. Tiếp tục?`))return;db=x;page='dashboard';save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
