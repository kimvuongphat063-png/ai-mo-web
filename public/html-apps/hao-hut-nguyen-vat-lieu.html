const fmt=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'—',num=n=>Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:2}),money=n=>Math.round(Number(n||0)).toLocaleString('vi-VN')+' ₫';
const round=(n,p=2)=>{let f=10**p;return Math.sign(n||0)*Math.floor(Math.abs(n||0)*f+.5)/f};
const validDate=d=>/^\d{4}-\d\d-\d\d$/.test(d)&&!isNaN(Date.parse(d))&&new Date(d+'T12:00:00').toISOString().slice(0,10)===d;
const blank=()=>({app:APP,version:VERSION,settings:{asof:today(),maxHH:3,company:''},materials:[],rows:[],audit:[]});
let db=blank(),page='home',selected='',filter='all',search='',draft=null;
function material(id){return db.materials.find(m=>m.id===id)}
function record(id){return db.rows.find(r=>r.id===id)}
function calc(r){let expected=round(r.products*r.standard,2),delta=round(r.actual-expected,2),rate=expected>0?round(delta/expected*100,2):0,value=round(delta*r.price,0),flag=expected===0&&r.actual>0?'check':rate>r.limit?'over':delta<0?'under':'ok';return {expected,delta,rate,value,flag}}
function status(r){return r.reviewedBy?'Đã xử lý':'Chờ xử lý'}
function total(){let over=db.rows.filter(r=>calc(r).flag==='over'),under=db.rows.filter(r=>calc(r).flag==='under'),positive=db.rows.filter(r=>calc(r).delta>0),negative=db.rows.filter(r=>calc(r).delta<0);return {rows:db.rows.length,over:over.length,under:under.length,unreviewed:over.filter(r=>!r.reviewedBy).length,loss:positive.reduce((a,r)=>a+calc(r).value,0),saving:negative.reduce((a,r)=>a+Math.abs(calc(r).value),0),signed:db.rows.reduce((a,r)=>a+calc(r).value,0)}}
function byMaterial(){return db.materials.map(m=>{let rows=db.rows.filter(r=>r.materialId===m.id),over=rows.filter(r=>calc(r).flag==='over').length,loss=rows.filter(r=>calc(r).value>0).reduce((a,r)=>a+calc(r).value,0),signed=rows.reduce((a,r)=>a+calc(r).value,0);return {m,rows:rows.length,over,loss,signed}})}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!validDate(x.settings.asof)||!Number.isFinite(x.settings.maxHH)||x.settings.maxHH<0||x.settings.maxHH>100||!Array.isArray(x.materials)||!Array.isArray(x.rows)||!Array.isArray(x.audit))return 'Cấu trúc hoặc cài đặt không hợp lệ.';let mids=new Set(),names=new Set();for(let m of x.materials){if(!m.id||mids.has(m.id)||!m.name||names.has(m.name.trim().toLocaleLowerCase('vi'))||!m.unit||!Number.isFinite(m.standard)||m.standard<=0||!Number.isSafeInteger(m.price)||m.price<0)return 'Danh mục vật tư lỗi hoặc trùng tên.';mids.add(m.id);names.add(m.name.trim().toLocaleLowerCase('vi'))}let ids=new Set();for(let r of x.rows){if(!r.id||ids.has(r.id)||!mids.has(r.materialId)||!validDate(r.date)||!Number.isInteger(r.products)||r.products<0||!Number.isFinite(r.standard)||r.standard<=0||!Number.isFinite(r.actual)||r.actual<0||!Number.isSafeInteger(r.price)||r.price<0||!Number.isFinite(r.limit)||r.limit<0||r.limit>100||String(r.note||'').length>2000||String(r.reason||'').length>2000||String(r.action||'').length>2000||r.reviewedBy&&!r.reason||r.reviewedBy&&!r.reviewedAt)return 'Dòng sử dụng hoặc biên bản xử lý không hợp lệ.';ids.add(r.id)}let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.action||!a.at)return 'Nhật ký không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let s=$('#embedded-state').textContent.trim();return s==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
try{let embedded=decode(),local=JSON.parse(localStorage.getItem(KEY)||'null');if(embedded&&!validate(embedded))db=embedded;else if(local&&!validate(local))db=local}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ trình duyệt không lưu được; hãy xuất JSON hoặc HTML kèm dữ liệu.')}render();return true}
function log(action,detail='',rowId=''){db.audit.push({id:uid(),action,detail,rowId,at:new Date().toISOString()})}
function sample(){let x=blank(),off=s=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')},names=[...new Set(MATERIAL_WASTE_SAMPLE.hh.map(r=>r[1]))];for(let name of names){let first=MATERIAL_WASTE_SAMPLE.hh.find(r=>r[1]===name);x.materials.push({id:uid(),name,unit:'đơn vị',standard:first[3],price:first[5],note:'Nguồn không ghi đơn vị; vui lòng sửa theo thực tế.'})}MATERIAL_WASTE_SAMPLE.hh.forEach((a,i)=>{let [date,name,products,standard,actual,price]=a,m=x.materials.find(m=>m.name===name);x.rows.push({id:uid(),date:off(date),materialId:m.id,products,standard,actual,price,limit:3,order:'',shift:'',note:'Dữ liệu mẫu nguồn, dòng '+(i+1),reason:'',action:'',reviewedBy:'',reviewedAt:'',sourceRow:i+1})});return x}
function button(label,action,kind='',id=''){return `<button type="button" class="btn ${kind}" data-act="${action}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function card(title,content){return `<section class="card"><h2>${title}</h2>${content}</section>`}
function flagBadge(c){return `<span class="badge ${c.flag==='over'?'high':c.flag==='check'?'draft':c.flag==='under'?'low':'ok'}">${c.flag==='over'?'Vượt ngưỡng':c.flag==='check'?'Có dùng, chưa có sản lượng':c.flag==='under'?'Dùng ít hơn định mức':'Trong ngưỡng'}</span>`}
function kpis(){let s=total();return `<div class="metrics"><div class="metric"><small>Dòng ghi nhận</small><strong>${s.rows}</strong><span>${db.materials.length} vật tư</span></div><div class="metric bad"><small>Vượt ngưỡng cho phép</small><strong>${s.over}</strong><span>${s.unreviewed} dòng chờ xử lý</span></div><div class="metric warn"><small>Chi phí vượt định mức</small><strong>${money(s.loss)}</strong><span>Chỉ cộng phần hao hụt dương</span></div><div class="metric good"><small>Giá trị tiết kiệm</small><strong>${money(s.saving)}</strong><span>Phần dùng dưới định mức</span></div></div>`}
function home(){let s=total(),top=db.rows.filter(r=>calc(r).flag==='over'&&!r.reviewedBy).sort((a,b)=>calc(b).value-calc(a).value),groups=byMaterial(),max=Math.max(1,...groups.map(g=>g.loss));return `<section class="hero"><div class="hero-content"><span class="eyebrow">AI MỞ / XƯỞNG SẢN XUẤT</span><h1>Kiểm soát từng phần hao hụt</h1><p>Đối chiếu số sản phẩm, định mức và lượng vật tư thực dùng. Xem ngay khoản vượt mức cần tìm nguyên nhân.</p><div class="actions">${button('＋ Ghi lượt sử dụng','newRow','primary')}${button('Xem các dòng cần xử lý','review')}</div></div><div class="hero-art"><div><strong>${s.over}</strong><small>dòng vượt ngưỡng</small></div></div></section>${kpis()}<div class="grid-two">${card('Các bước tính cho một dòng',`<div class="flow"><div><small>1. Sản lượng</small><strong>Số sản phẩm</strong></div><div><small>2. Định mức</small><strong>× Mức / SP</strong></div><div><small>3. Thực dùng</small><strong>So chênh lệch</strong></div></div><p class="note">Hao hụt = thực dùng − định mức. Giá trị có dấu; dashboard tách riêng chi phí vượt và tiết kiệm.</p>`)}${card('Cần xử lý trước',top.length?top.slice(0,7).map(r=>`<div class="mini"><button class="link" data-act="openRow" data-id="${esc(r.id)}">${esc(material(r.materialId).name)} · ${fmt(r.date)}</button><small>Vượt ${num(calc(r).delta)} ${esc(material(r.materialId).unit)} · ${money(calc(r).value)} · ${num(calc(r).rate)}%</small></div>`).join(''):'<p class="success-text">Không có dòng vượt ngưỡng chưa xử lý.</p>')}</div>${card('Giá trị hao hụt dương theo vật tư',`<div class="bar-list">${groups.filter(g=>g.rows).map(g=>`<div class="bar-row"><span>${esc(g.m.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(g.loss?2:0,round(g.loss/max*100,0))}%"></div></div><b>${money(g.loss)}</b></div>`).join('')||'<p>Chưa có dữ liệu.</p>'}</div>`)}<p class="note">Ngưỡng mặc định ${num(db.settings.maxHH)}% là quy định nội bộ, không phải mức pháp lý. Thay đổi ngưỡng chỉ áp dụng cho dòng ghi mới; từng dòng lưu ảnh chụp ngưỡng, đơn giá và định mức.</p>`}
function homeWorkbench(){let s=total(),top=db.rows.filter(r=>['over','check'].includes(calc(r).flag)&&!r.reviewedBy).sort((a,b)=>calc(b).value-calc(a).value),groups=byMaterial(),max=Math.max(1,...groups.map(g=>g.loss));return `<section class="wb-intro"><div><span class="eyebrow">AI MỞ / KIỂM SOÁT XƯỞNG</span><h1>Bàn làm việc hao hụt vật tư</h1><p>Nhập số thực dùng, xem chênh lệch và xử lý đúng dòng phát sinh vượt mức.</p><div class="actions">${button('＋ Ghi lượt sử dụng','newRow','primary')}${button('Mở nhật ký','rows')}</div></div><div class="wb-highlight"><small>CẦN TÌM NGUYÊN NHÂN</small><strong>${s.unreviewed}</strong><span>dòng vượt ngưỡng chưa xử lý</span></div></section><section class="process-strip" aria-label="Công thức tính hao hụt"><div><small>01 · SẢN LƯỢNG</small><strong>Số sản phẩm</strong></div><div><small>02 · ĐỊNH MỨC</small><strong>× Mức cho 1 SP</strong></div><div><small>03 · ĐỐI CHIẾU</small><strong>Thực dùng − định mức</strong></div><div><small>04 · QUYẾT ĐỊNH</small><strong>Tỷ lệ & chi phí</strong></div></section><div class="workbench"><div class="wb-main">${card('🚨 Ưu tiên xử lý',top.length?top.slice(0,8).map(r=>{let c=calc(r);return `<div class="mini wb-row"><button class="link" data-act="openRow" data-id="${esc(r.id)}">${esc(material(r.materialId).name)} · ${fmt(r.date)}</button><span>${num(c.delta)} ${esc(material(r.materialId).unit)} · ${money(c.value)} · ${flagBadge(c)}</span></div>`}).join(''):'<p class="success-text">Không có dòng cần xử lý.</p>')}${card('Giá trị hao hụt dương theo vật tư',`<div class="bar-list">${groups.filter(g=>g.rows).map(g=>`<div class="bar-row"><span>${esc(g.m.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(g.loss?2:0,round(g.loss/max*100,0))}%"></div></div><b>${money(g.loss)}</b></div>`).join('')||'<p>Chưa có dữ liệu.</p>'}</div>`)}</div><aside class="wb-side"><h2>Chỉ số hôm nay</h2>${kpis()}<p class="note">Ngưỡng mặc định ${num(db.settings.maxHH)}% là quy định nội bộ. Đơn giá, ngưỡng và định mức được lưu tại từng dòng.</p></aside></div>`}
function tableRows(rows){return `<div class="table-wrap"><table><thead><tr><th>Ngày / ca</th><th>Vật tư</th><th>Sản phẩm</th><th>Định mức / SP</th><th>Theo định mức</th><th>Thực dùng</th><th>Chênh lệch</th><th>Tỷ lệ</th><th>Giá trị có dấu</th><th>Cảnh báo</th><th>Xử lý</th></tr></thead><tbody>${rows.map(r=>{let c=calc(r),m=material(r.materialId);return `<tr><td><button class="link" data-act="openRow" data-id="${esc(r.id)}">${fmt(r.date)}</button><small>${esc(r.shift||'—')}</small></td><td><b>${esc(m.name)}</b><small>${esc(m.unit)} · ${esc(r.order||'chưa gắn lệnh')}</small></td><td class="num">${num(r.products)}</td><td class="num">${num(r.standard)}</td><td class="num">${num(c.expected)}</td><td class="num">${num(r.actual)}</td><td class="num ${c.delta>0?'danger-text':c.delta<0?'success-text':''}">${num(c.delta)}</td><td class="num">${num(c.rate)}%</td><td class="num">${money(c.value)}</td><td>${flagBadge(c)}</td><td><span class="badge ${r.reviewedBy?'review':'draft'}">${status(r)}</span></td></tr>`}).join('')||'<tr><td class="empty" colspan="11">Chưa có dòng phù hợp. Hãy ghi một lượt sử dụng hoặc nạp dữ liệu mẫu.</td></tr>'}</tbody></table></div>`}
function rowsPage(review=false){let rows=db.rows.filter(r=>{let c=calc(r),match=!search||[material(r.materialId)?.name,r.order,r.shift,r.note].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi'));return match&&(review?['over','check'].includes(c.flag)&&!r.reviewedBy:filter==='all'||filter===c.flag||filter==='unreviewed'&&!r.reviewedBy)}).sort((a,b)=>b.date.localeCompare(a.date)||b.sourceRow-a.sourceRow);return `<div class="page-head"><div><h1>${review?'🚨 Hàng chờ xử lý':'▤ Nhật ký sử dụng vật tư'}</h1><p>${review?'Các dòng vượt ngưỡng hoặc có sử dụng khi sản lượng bằng 0 cần nguyên nhân và người xác nhận.':'Mỗi dòng lưu định mức, giá và ngưỡng tại thời điểm ghi.'}</p></div><div class="actions">${button('＋ Ghi lượt sử dụng','newRow','primary')}${button('In bảng','print')}</div></div>${review?'':`<div class="card"><div class="filters"><label>Tìm vật tư / lệnh / ghi chú<input id="search" value="${esc(search)}" placeholder="Vải cotton, LSX-01…"></label><label>Lọc cảnh báo<select id="filter"><option value="all" ${filter==='all'?'selected':''}>Tất cả</option><option value="over" ${filter==='over'?'selected':''}>Vượt ngưỡng</option><option value="under" ${filter==='under'?'selected':''}>Dùng ít hơn</option><option value="ok" ${filter==='ok'?'selected':''}>Trong ngưỡng</option><option value="unreviewed" ${filter==='unreviewed'?'selected':''}>Chưa xử lý</option></select></label></div>${tableRows(rows)}</div>`}${review?card('Cần xác minh',tableRows(rows)):''}<p class="note">Dòng chưa xử lý vẫn được tính vào báo cáo. Bấm vào ngày để xem công thức và ghi nguyên nhân.</p>`}
function rowDetail(){let r=record(selected);if(!r){page='rows';return rowsPage()}let m=material(r.materialId),c=calc(r);return `<div class="page-head"><div><button class="link" data-act="rows">← Nhật ký</button><h1>${esc(m.name)} · ${fmt(r.date)}</h1><p>${esc(r.order||'Chưa gắn lệnh')} · ${esc(r.shift||'Chưa ghi ca')} · ${flagBadge(c)}</p></div><div class="actions">${!r.reviewedBy?button('Sửa dòng','editRow','',r.id)+button('Xác nhận xử lý','reviewRow','primary',r.id):button('Mở lại có lý do','reopenRow','',r.id)}${!r.reviewedBy?button('Xóa dòng','deleteRow','danger',r.id):''}${button('In biên bản','print')}</div></div><div class="metrics"><div class="metric"><small>Theo định mức</small><strong>${num(c.expected)}</strong><span>${esc(m.unit)}</span></div><div class="metric"><small>Thực dùng</small><strong>${num(r.actual)}</strong><span>${esc(m.unit)}</span></div><div class="metric ${c.delta>0?'bad':'good'}"><small>Hao hụt / tiết kiệm</small><strong>${num(c.delta)}</strong><span>${esc(m.unit)}</span></div><div class="metric ${c.flag==='over'?'warn':''}"><small>Tỷ lệ so định mức</small><strong>${num(c.rate)}%</strong><span>Giới hạn ${num(r.limit)}%</span></div></div><div class="detail-grid">${card('Căn cứ ghi nhận',`<dl class="kv"><dt>Vật tư</dt><dd>${esc(m.name)} (${esc(m.unit)})</dd><dt>Sản lượng</dt><dd>${num(r.products)} sản phẩm</dd><dt>Định mức / SP</dt><dd>${num(r.standard)} ${esc(m.unit)}</dd><dt>Đơn giá chụp</dt><dd>${money(r.price)} / ${esc(m.unit)}</dd><dt>Lệnh / ca</dt><dd>${esc(r.order||'—')} / ${esc(r.shift||'—')}</dd><dt>Ghi chú</dt><dd>${esc(r.note||'—')}</dd><dt>Vị trí nguồn mẫu</dt><dd>${r.sourceRow?'Dòng '+r.sourceRow:'Tự nhập'}</dd></dl>`)}${card('Cách tính',`<div class="formula">${num(r.products)} × ${num(r.standard)} = <b>${num(c.expected)}</b> ${esc(m.unit)}<br>${num(r.actual)} − ${num(c.expected)} = <b>${num(c.delta)}</b> ${esc(m.unit)}<br>${num(c.delta)} ÷ ${num(c.expected)} × 100 = <b>${num(c.rate)}%</b><br>${num(c.delta)} × ${money(r.price)} = <b>${money(c.value)}</b></div><p class="note">Giá trị âm biểu thị dùng dưới định mức, cần kiểm tra số liệu trước khi kết luận tiết kiệm. Nếu sản lượng bằng 0, tỷ lệ tạm hiển thị 0% và cần đối chiếu riêng.</p>`)}</div>${card('Nguyên nhân & biện pháp',`<dl class="kv"><dt>Tình trạng</dt><dd>${status(r)}</dd><dt>Nguyên nhân</dt><dd>${esc(r.reason||'Chưa ghi')}</dd><dt>Hành động</dt><dd>${esc(r.action||'Chưa ghi')}</dd><dt>Người xác nhận</dt><dd>${esc(r.reviewedBy||'—')}</dd><dt>Ngày xác nhận</dt><dd>${r.reviewedAt?fmt(r.reviewedAt):'—'}</dd></dl>`)}${card('Nhật ký thay đổi',db.audit.filter(a=>a.rowId===r.id).slice().reverse().map(a=>`<div class="timeline"><b>${esc(a.action)}</b><p>${esc(a.detail||'—')} · ${esc(a.at.slice(0,16).replace('T',' '))}</p></div>`).join('')||'<p>Chưa có nhật ký.</p>')}`}
function materialsPage(){let groups=byMaterial();return `<div class="page-head"><div><h1>◫ Danh mục nguyên vật liệu</h1><p>Giá và định mức ở danh mục là giá trị gợi ý cho dòng ghi mới.</p></div>${button('＋ Thêm vật tư','newMaterial','primary')}</div>${card('Định mức & tổng hợp',`<div class="table-wrap"><table><thead><tr><th>Vật tư</th><th>Đơn vị</th><th>Định mức / SP</th><th>Đơn giá gợi ý</th><th>Số dòng</th><th>Vượt ngưỡng</th><th>Chi phí vượt</th><th>Giá trị có dấu</th><th></th></tr></thead><tbody>${groups.map(g=>`<tr><td><b>${esc(g.m.name)}</b><small>${esc(g.m.note||'')}</small></td><td>${esc(g.m.unit)}</td><td class="num">${num(g.m.standard)}</td><td class="num">${money(g.m.price)}</td><td class="num">${g.rows}</td><td class="num">${g.over}</td><td class="num">${money(g.loss)}</td><td class="num">${money(g.signed)}</td><td>${button('Sửa','editMaterial','small',g.m.id)}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">Chưa có danh mục vật tư.</td></tr>'}</tbody></table></div>`)}<p class="note">Đơn vị của 6 vật tư mẫu được ghi chung là “đơn vị” vì file gốc không nêu đơn vị. Hãy sửa theo quy trình xưởng trước khi nhập lượt dùng; đơn vị sẽ khóa sau khi đã phát sinh dữ liệu.</p>`}
function reportPage(){let s=total(),groups=byMaterial(),max=Math.max(1,...groups.map(g=>g.loss));return `<div class="page-head"><div><h1>▥ Báo cáo phân tích hao hụt</h1><p>Ngưỡng được giữ riêng trên từng dòng, số liệu có dấu và tách khoản vượt khỏi khoản tiết kiệm.</p></div><div class="actions">${button('⬇ Excel 4 bảng','exportExcel','primary')}${button('In báo cáo','print')}</div></div>${kpis()}<div class="grid-two">${card('Theo vật tư',`<div class="bar-list">${groups.filter(g=>g.rows).map(g=>`<div class="bar-row"><span>${esc(g.m.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(g.loss?2:0,round(g.loss/max*100,0))}%"></div></div><b>${money(g.loss)}</b></div>`).join('')||'<p>Chưa có dữ liệu.</p>'}</div>`)}${card('Tách phần vượt và dưới định mức',`<dl class="kv"><dt>Chi phí hao hụt dương</dt><dd>${money(s.loss)}</dd><dt>Giá trị dùng dưới định mức</dt><dd>− ${money(s.saving)}</dd><dt>Giá trị có dấu</dt><dd>${money(s.signed)}</dd><dt>Dòng vượt ngưỡng</dt><dd>${s.over}</dd><dt>Chưa xử lý</dt><dd>${s.unreviewed}</dd></dl><p class="note">Không cộng số lượng vật tư khác đơn vị thành một tổng; chỉ cộng giá trị tiền theo từng dòng.</p>`)}</div>${card('Chi tiết theo nguyên vật liệu',`<div class="table-wrap"><table><thead><tr><th>Vật tư</th><th>Số dòng</th><th>Vượt ngưỡng</th><th>Chi phí vượt</th><th>Giá trị có dấu</th></tr></thead><tbody>${groups.map(g=>`<tr><td>${esc(g.m.name)}</td><td>${g.rows}</td><td>${g.over}</td><td>${money(g.loss)}</td><td>${money(g.signed)}</td></tr>`).join('')}</tbody></table></div>`)}`}
function settingsPage(){return `<div class="page-head"><div><h1>⚙ Cài đặt xưởng</h1><p>Ngưỡng mới chỉ dùng cho dòng ghi tiếp theo.</p></div></div>${card('Thông số báo cáo & giới hạn',`<form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input type="date" name="asof" required value="${esc(db.settings.asof)}"></label><label>Hao hụt cho phép (%)<input type="number" name="maxHH" min="0" max="100" step="0.01" required value="${db.settings.maxHH}"></label><label>Tên đơn vị / xưởng<input name="company" maxlength="160" value="${esc(db.settings.company)}" placeholder="Xưởng may A"></label><div class="full">${button('Lưu cài đặt','saveSettings','primary')}</div></form><p class="note">Ngưỡng ${num(db.settings.maxHH)}% là lựa chọn quản lý nội bộ. App không tự xác định hạn mức pháp luật.</p>`)}`}
function dataPage(){return `<div class="page-head"><div><h1>↧ Dữ liệu & sao lưu</h1><p>Chuyển thiết bị bằng tệp HTML kèm dữ liệu hoặc JSON.</p></div></div><div class="grid-two">${card('Xuất bản sao',`<p>Thông tin tự lưu trên trình duyệt hiện tại. Bản HTML gốc không tự mang theo dữ liệu phát sinh.</p><div class="actions">${button('⬇ JSON đầy đủ','exportJSON','primary')}${button('⬇ HTML kèm dữ liệu','exportHTML')}${button('⬇ Excel đối chiếu','exportExcel')}</div>`)}${card('Khôi phục & dữ liệu mẫu',`<p>Nhập JSON hoặc nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Hãy sao lưu trước.</p><div class="actions">${button('⬆ Nhập JSON','importJSON')}${button('Nạp 20 dòng mẫu','loadSample')}${button('Xóa dữ liệu','clearData','danger')}</div>`)}</div>${card('Tình trạng hiện tại',`<p>${db.materials.length} vật tư · ${db.rows.length} dòng sử dụng · ${db.audit.length} sự kiện nhật ký. Phiên bản dữ liệu ${VERSION}. Không dùng máy chủ, tài khoản hay API.</p>`)}`}
function guidePage(){return `<div class="page-head"><h1>? Hướng dẫn sử dụng</h1></div>${card('Làm theo 5 bước',`<ol><li>Thêm hoặc sửa nguyên vật liệu, đơn vị, định mức và đơn giá gợi ý.</li><li>Ghi một dòng sử dụng cho mỗi vật tư và đợt sản xuất: ngày, số sản phẩm, lượng thực dùng. Có thể gắn lệnh và ca.</li><li>Xem chênh lệch, tỷ lệ và giá trị trên màn hình chi tiết. Dòng vượt ngưỡng nằm trong Hàng chờ xử lý.</li><li>Ghi nguyên nhân, biện pháp và người xác nhận. Nếu số liệu sai, mở lại có lý do để sửa.</li><li>Xuất JSON/HTML kèm dữ liệu để sao lưu; Excel dùng để báo cáo và đối chiếu.</li></ol>`)}${card('Ý nghĩa các số',`<p><b>Theo định mức</b> = sản phẩm × định mức / sản phẩm. <b>Hao hụt</b> = thực dùng − theo định mức. <b>Tỷ lệ</b> = hao hụt ÷ theo định mức × 100. <b>Giá trị có dấu</b> = hao hụt × đơn giá.</p><p>Giá trị âm là dùng dưới định mức, chưa đủ để kết luận tiết kiệm; cần kiểm tra cách đếm sản phẩm, đơn vị đo, tồn cuối ca và chất lượng. Dòng sản lượng 0 cần rà soát riêng vì tỷ lệ sẽ hiển thị 0%.</p><p>Định mức, đơn giá và ngưỡng được lưu riêng từng dòng, không thay đổi khi sửa danh mục/cài đặt sau này.</p>`)}`}
function render(){let views={home:homeWorkbench,rows:()=>rowsPage(false),review:()=>rowsPage(true),detail:rowDetail,materials:materialsPage,report:reportPage,settings:settingsPage,data:dataPage,guide:guidePage},title={home:'Tổng quan',rows:'Nhật ký sử dụng',review:'Hàng chờ xử lý',detail:'Chi tiết dòng',materials:'Nguyên vật liệu',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu',guide:'Hướng dẫn'};$('#screen').innerHTML=(views[page]||homeWorkbench)();$('#topTitle').textContent=(title[page]||'Tổng quan').toUpperCase();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='detail'&&b.dataset.page==='rows'))}
function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function area(label,name,value='',required=false){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="2000" ${required?'required':''}>${esc(value)}</textarea></label>`}
function selectField(label,name,items,value){return `<label>${label}<select name="${name}" required>${items.map(([k,text])=>`<option value="${esc(k)}" ${k===value?'selected':''}>${esc(text)}</option>`).join('')}</select></label>`}
function showForm(kind,id=''){draft={kind,id};let title='',content='';if(kind==='material'){let m=material(id)||{};title=id?'Sửa nguyên vật liệu':'Thêm nguyên vật liệu';content=field('Tên vật tư *','name',m.name,'text','required maxlength="160"')+field('Đơn vị đo *','unit',m.unit||'đơn vị','text','required maxlength="40"')+field('Định mức / sản phẩm *','standard',m.standard??1,'number','required min="0.0001" step="0.0001"')+field('Đơn giá gợi ý (₫) *','price',m.price??0,'number','required min="0" step="1"')+area('Ghi chú','note',m.note)}else if(kind==='row'){let r=record(id)||{},m=material(r.materialId)||db.materials[0];if(!m){alert('Hãy thêm nguyên vật liệu trước.');return}title=id?'Sửa dòng sử dụng':'Ghi lượt sử dụng';content=field('Ngày *','date',r.date||today(),'date','required')+selectField('Nguyên vật liệu *','materialId',db.materials.map(m=>[m.id,m.name+' · '+m.unit]),r.materialId||m.id)+field('Số sản phẩm làm ra *','products',r.products??0,'number','required min="0" step="1"')+field('Định mức / sản phẩm *','standard',r.standard??m.standard,'number','required min="0.0001" step="0.0001"')+field('Số lượng thực dùng *','actual',r.actual??0,'number','required min="0" step="0.01"')+field('Đơn giá (₫) *','price',r.price??m.price,'number','required min="0" step="1"')+field('Ngưỡng cho phép (%) *','limit',r.limit??db.settings.maxHH,'number','required min="0" max="100" step="0.01"')+field('Lệnh sản xuất','order',r.order,'text','maxlength="100"')+field('Ca / tổ sản xuất','shift',r.shift,'text','maxlength="100"')+area('Ghi chú hiện trường','note',r.note)}else if(kind==='review'){let r=record(id);title='Ghi nguyên nhân & xác nhận';content=field('Người xác nhận *','reviewedBy',r.reviewedBy,'text','required maxlength="100"')+field('Ngày xác nhận *','reviewedAt',r.reviewedAt||today(),'date','required')+area('Nguyên nhân *','reason',r.reason,true)+area('Biện pháp / kết luận','action',r.action)}$('#modalTitle').textContent=title;$('#formFields').innerHTML=content;$('#formError').textContent='';$('#editor').showModal()}
function get(form,key){return String(new FormData(form).get(key)||'').trim()}
function numberFrom(form,key){return Number(get(form,key))}
function submitForm(e){e.preventDefault();let f=e.target,{kind,id}=draft,before=clone(db);try{if(kind==='material'){let name=get(f,'name'),unit=get(f,'unit'),standard=numberFrom(f,'standard'),price=numberFrom(f,'price');if(!name||!unit||!Number.isFinite(standard)||standard<=0||!Number.isSafeInteger(price)||price<0)throw Error('Tên, đơn vị, định mức hoặc đơn giá không hợp lệ.');if(db.materials.some(m=>m.id!==id&&m.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi')))throw Error('Tên vật tư đã có.');let m=material(id);if(m&&m.unit!==unit&&db.rows.some(r=>r.materialId===m.id))throw Error('Không thể đổi đơn vị của vật tư đã phát sinh; hãy tạo vật tư mới.');if(m)Object.assign(m,{name,unit,standard,price,note:get(f,'note')});else{m={id:uid(),name,unit,standard,price,note:get(f,'note')};db.materials.push(m)}log(id?'Sửa vật tư':'Thêm vật tư',name);page='materials'}else if(kind==='row'){let r=record(id),date=get(f,'date'),materialId=get(f,'materialId'),products=numberFrom(f,'products'),standard=numberFrom(f,'standard'),actual=numberFrom(f,'actual'),price=numberFrom(f,'price'),limit=numberFrom(f,'limit');if(!validDate(date)||!material(materialId)||!Number.isInteger(products)||products<0||!Number.isFinite(standard)||standard<=0||!Number.isFinite(actual)||actual<0||!Number.isSafeInteger(price)||price<0||!Number.isFinite(limit)||limit<0||limit>100)throw Error('Kiểm tra ngày, vật tư, sản lượng và các số nhập.');let obj={date,materialId,products,standard,actual,price,limit,order:get(f,'order'),shift:get(f,'shift'),note:get(f,'note')};if(r){if(r.reviewedBy)throw Error('Dòng đã xác nhận cần mở lại trước khi sửa.');Object.assign(r,obj)}else{r={id:uid(),...obj,reason:'',action:'',reviewedBy:'',reviewedAt:'',sourceRow:null};db.rows.push(r)}log(id?'Sửa dòng sử dụng':'Ghi lượt sử dụng',material(materialId).name,r.id);selected=r.id;page='detail'}else if(kind==='review'){let r=record(id),reviewedBy=get(f,'reviewedBy'),reviewedAt=get(f,'reviewedAt'),reason=get(f,'reason');if(!reviewedBy||!reason||!validDate(reviewedAt)||reviewedAt<r.date)throw Error('Cần tên người xác nhận, ngày hợp lệ và nguyên nhân.');Object.assign(r,{reviewedBy,reviewedAt,reason,action:get(f,'action')});log('Xác nhận xử lý',reason,r.id);selected=r.id;page='detail'}let v=validate(db);if(v)throw Error(v);$('#editor').close();draft=null;save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'hao-hut-vat-tu-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'hao-hut-vat-tu-kem-du-lieu.html')}
function sheets(){
 const usage=[['Ngày','Vật tư','Đơn vị','Sản lượng','Định mức/SP','Theo định mức','Thực dùng','Chênh lệch','Tỷ lệ %','Đơn giá chụp','Giá trị có dấu','Ngưỡng %','Cảnh báo','Lệnh','Ca','Ghi chú','Dòng mẫu']];
 for(const r of db.rows){const c=calc(r),m=material(r.materialId);usage.push([r.date,m.name,m.unit,r.products,r.standard,c.expected,r.actual,c.delta,c.rate,r.price,c.value,r.limit,c.flag==='over'?'Vượt ngưỡng':c.flag==='check'?'Có dùng, chưa có sản lượng':c.flag==='under'?'Dùng dưới định mức':'Trong ngưỡng',r.order,r.shift,r.note,r.sourceRow||''])}
 return [
  {name:'SuDung',rows:usage},
  {name:'VatTu',rows:[['Vật tư','Đơn vị','Định mức gợi ý','Đơn giá gợi ý','Ghi chú'],...db.materials.map(m=>[m.name,m.unit,m.standard,m.price,m.note])]},
  {name:'XuLy',rows:[['Ngày','Vật tư','Nguyên nhân','Hành động','Người xác nhận','Ngày xác nhận','Tình trạng'],...db.rows.map(r=>[r.date,material(r.materialId).name,r.reason,r.action,r.reviewedBy,r.reviewedAt,status(r)])]},
  {name:'TongHop',rows:[['Vật tư','Số dòng','Vượt ngưỡng','Chi phí vượt','Giá trị có dấu'],...byMaterial().map(g=>[g.m.name,g.rows,g.over,g.loss,g.signed]),['TỔNG',db.rows.length,total().over,total().loss,total().signed]]}
 ]
}
function exportExcel(){download(Excel.workbook(sheets()),'hao-hut-vat-tu-bao-cao.xlsx')}
function act(action,id){if(['home','rows','review','materials','report','settings','data','guide'].includes(action)){page=action;render();return}if(action==='openRow'){selected=id;page='detail';render();return}if(action==='newMaterial'||action==='editMaterial')return showForm('material',action==='editMaterial'?id:'');if(action==='newRow'||action==='editRow')return showForm('row',action==='editRow'?id:'');if(action==='reviewRow')return showForm('review',id);if(action==='reopenRow'){let reason=prompt('Lý do mở lại dòng đã xác nhận:');if(!reason?.trim())return;let r=record(id);r.reviewedBy='';r.reviewedAt='';r.reason='';r.action='';log('Mở lại dòng',reason.trim(),id);save();return}if(action==='deleteRow'){let r=record(id);if(!r||r.reviewedBy)return alert('Chỉ xóa được dòng chưa xác nhận.');if(!confirm('Xóa dòng sử dụng này?'))return;db.rows=db.rows.filter(x=>x.id!==id);log('Xóa dòng sử dụng',material(r.materialId).name+' · '+r.date);page='rows';save();return}if(action==='print')return print();if(action==='saveSettings'){let f=$('#settingsForm'),asof=f.elements.asof.value,maxHH=Number(f.elements.maxHH.value),company=f.elements.company.value.trim();if(!validDate(asof)||!Number.isFinite(maxHH)||maxHH<0||maxHH>100)return alert('Ngày hoặc ngưỡng không hợp lệ.');db.settings={asof,maxHH,company};log('Đổi cài đặt','Ngưỡng '+maxHH+'%');save();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if((db.rows.length||db.materials.length)&&!confirm('Nạp mẫu thay toàn bộ dữ liệu hiện tại. Anh đã sao lưu?'))return;let x=sample(),err=validate(x);if(err)return alert(err);db=x;page='home';save();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên thiết bị này?')||!confirm('Xác nhận xóa lần cuối.'))return;db=blank();page='home';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}else if(e.target.name==='materialId'&&draft?.kind==='row'&&!draft.id){let m=material(e.target.value),f=$('#itemForm');if(m){f.elements.standard.value=m.standard;f.elements.price.value=m.price}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let p=e.target.selectionStart;search=e.target.value;render();let f=$('#search');f.focus();f.setSelectionRange(p,p)}});
$('#itemForm').addEventListener('submit',submitForm);$('#cancelModal').addEventListener('click',()=>$('#editor').close());
$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm('Nhập bản sao sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=x;page='home';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});render();






</script></body></html>
