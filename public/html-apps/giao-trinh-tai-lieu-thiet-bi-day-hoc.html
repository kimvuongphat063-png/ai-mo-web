function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ đầy. Hãy tải JSON hoặc HTML kèm dữ liệu.')}render();return true}
const itemIssues=id=>db.issues.filter(x=>x.itemId===id),returned=id=>db.returns.filter(x=>x.issueId===id).reduce((n,x)=>n+x.qty,0),outstanding=id=>{let a=issue(id);return a?.mode==='Cho mượn'?a.qty-returned(id):0};
function calc(id){let a=item(id),issued=itemIssues(id),loan=issued.filter(x=>x.mode==='Cho mượn').reduce((n,x)=>n+outstanding(x.id),0),given=issued.filter(x=>x.mode==='Cấp hẳn').reduce((n,x)=>n+x.qty,0),delta=db.adjustments.filter(x=>x.itemId===id).reduce((n,x)=>n+x.delta,0),stock=a.opening+delta-loan-given;return {stock,loan,given,delta,issued:issued.reduce((n,x)=>n+x.qty,0),recovered:db.returns.filter(x=>issue(x.issueId)?.itemId===id).reduce((n,x)=>n+x.qty,0)}}
function warnings(a){let c=calc(a.id),out=[];if(c.stock<0)out.push('Tồn kho âm '+Math.abs(c.stock));else if(c.stock<=a.min)out.push('Tồn thấp ≤ '+a.min);let overdue=itemIssues(a.id).filter(x=>x.mode==='Cho mượn'&&x.due&&x.due<today()&&outstanding(x.id)>0);if(overdue.length)out.push(overdue.length+' lượt mượn quá hạn');return out}
function summary(){let c=db.items.map(a=>calc(a.id));return {items:db.items.length,opening:db.items.reduce((n,x)=>n+x.opening,0),stock:c.reduce((n,x)=>n+x.stock,0),loan:c.reduce((n,x)=>n+x.loan,0),given:c.reduce((n,x)=>n+x.given,0),low:db.items.filter(a=>warnings(a).length).length}}
function btn(label,action,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${action}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Mặt hàng</small><strong>${s.items}</strong></div><div><small>Còn trong kho</small><strong>${fmt(s.stock)}</strong></div><div><small>Đang cho mượn</small><strong>${fmt(s.loan)}</strong></div><div><small>Đã cấp hẳn</small><strong>${fmt(s.given)}</strong></div><div><small>Cần chú ý</small><strong>${s.low}</strong></div></div>`}
function home(){let w=db.items.filter(a=>warnings(a).length),due=db.issues.filter(x=>x.mode==='Cho mượn'&&x.due&&x.due<today()&&outstanding(x.id)>0).sort((a,b)=>a.due.localeCompare(b.due));return `<div class="hero"><span>📦 AI MỞ · QUẢN LÝ HỌC LIỆU</span><h1>Giáo trình, tài liệu & thiết bị</h1><p>Biết còn bao nhiêu trong kho, lớp nào đang mượn và vật tư nào cần bổ sung.</p><div class="hero-actions">${btn('＋ Thêm mặt hàng','newItem','primary')}${btn('↗️ Cấp cho lớp','newIssue')}</div></div>${metrics()}${panel('📍 Bắt đầu nhanh',`<ol><li>Thêm mặt hàng với số lượng tồn ban đầu và mức cảnh báo tối thiểu.</li><li>Nhập thêm hoặc điều chỉnh kho bằng phiếu có lý do.</li><li>Khi cấp cho lớp, chọn “Cho mượn” để theo dõi thu hồi hoặc “Cấp hẳn” cho tài liệu phát đi.</li><li>Thu hồi từng phần theo ngày, xem cảnh báo và báo cáo.</li></ol><p class="muted">Dữ liệu sử dụng thật bắt đầu trống. Mẫu nguồn chỉ nạp khi chủ động chọn.</p>`)}<div class="two">${panel('⚠️ Mặt hàng cần chú ý',w.length?w.slice(0,8).map(a=>`<div class="mini"><button class="link" data-act="openItem" data-id="${esc(a.id)}">${esc(a.name)}</button><small>${esc(a.code)} · ${warnings(a).join(', ')}</small></div>`).join(''):'<p class="success">Chưa có cảnh báo.</p>')}${panel('⏰ Mượn quá hạn',due.length?due.slice(0,8).map(x=>`<div class="mini"><button class="link" data-act="openItem" data-id="${esc(x.itemId)}">${esc(item(x.itemId).name)}</button><small>${esc(x.className)} · còn ${outstanding(x.id)} · hạn ${dateShow(x.due)}</small></div>`).join(''):'<p class="muted">Chưa có lượt mượn quá hạn.</p>')}</div>`}
function filtered(){return db.items.filter(a=>(!search||[a.code,a.name,a.type,a.unit,a.note].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))&&(!typeFilter||a.type===typeFilter)&&(!alertOnly||warnings(a).length)).sort((a,b)=>a.code.localeCompare(b.code,'vi'))}
function itemsPage(){return `<div class="page-head"><div><h1>📚 Danh mục học liệu</h1><p>Tồn kho tự tính từ tồn ban đầu, nhập/xuất và cấp phát.</p></div>${btn('＋ Thêm mặt hàng','newItem','primary')}</div><div class="card"><div class="filters"><label>Tìm mặt hàng<input id="search" value="${esc(search)}" placeholder="Mã, tên, loại…"></label><label>Loại<select id="typeFilter"><option value="">Tất cả</option>${TYPES.map(v=>`<option ${typeFilter===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Chỉ cảnh báo<select id="alertOnly"><option value="0" ${!alertOnly?'selected':''}>Tất cả</option><option value="1" ${alertOnly?'selected':''}>Cần chú ý</option></select></label></div><p class="muted">${filtered().length} / ${db.items.length} mặt hàng</p><div class="table-wrap"><table><thead><tr><th>Mặt hàng</th><th>Loại</th><th>Tồn đầu</th><th>Điều chỉnh</th><th>Đang mượn</th><th>Cấp hẳn</th><th>Còn kho</th><th>Tối thiểu</th><th>Cảnh báo</th></tr></thead><tbody>${filtered().map(a=>{let c=calc(a.id),w=warnings(a);return `<tr><td><button class="link" data-act="openItem" data-id="${esc(a.id)}">${esc(a.name)}</button><small>${esc(a.code)} · ${esc(a.unit||'đơn vị')}</small></td><td>${esc(a.type)}</td><td>${a.opening}</td><td>${c.delta}</td><td>${c.loan}</td><td>${c.given}</td><td><b>${c.stock}</b></td><td>${a.min}</td><td>${w.length?`<span class="pill red">${esc(w.join('; '))}</span>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Chưa có mặt hàng phù hợp.</td></tr>'}</tbody></table></div></div>`}
function detail(){let a=item(selected);if(!a){page='items';return itemsPage()}let c=calc(a.id),is=itemIssues(a.id).sort((x,y)=>y.date.localeCompare(x.date)),ad=db.adjustments.filter(x=>x.itemId===a.id).sort((x,y)=>y.date.localeCompare(x.date)),w=warnings(a);return `<div class="page-head"><div><button class="link" data-act="items">← Danh mục</button><h1>📦 ${esc(a.name)}</h1><p>${esc(a.code)} · ${esc(a.type)} · ${esc(a.unit||'đơn vị')}</p></div><div class="actions no-print">${btn('＋ Cấp cho lớp','newIssue','primary',a.id)}${btn('＋ Nhập / điều chỉnh','newAdjustment','',a.id)}${btn('Sửa mặt hàng','editItem','',a.id)}${btn('🖨️ In','print')}${btn('Xóa','deleteItem','danger',a.id)}</div></div><div class="metrics"><div><small>Tồn ban đầu</small><strong>${a.opening}</strong></div><div><small>Nhập / điều chỉnh</small><strong>${c.delta}</strong></div><div><small>Đang ở lớp</small><strong>${c.loan}</strong></div><div><small>Đã cấp hẳn</small><strong>${c.given}</strong></div><div><small>Còn trong kho</small><strong>${c.stock}</strong></div></div><div class="two">${panel('ℹ️ Thông tin',`<p><b>Mức tối thiểu:</b> ${a.min} ${esc(a.unit||'')}</p><p><b>Ghi chú:</b> ${esc(a.note||'—')}</p><p><b>Tổng lượt cấp:</b> ${c.issued}; <b>đã thu hồi:</b> ${c.recovered}</p>`)}${panel('⚠️ Cảnh báo',w.length?`<ul>${w.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'<p class="success">Không có cảnh báo.</p>')}</div>${panel('↗️ Cấp phát & mượn',`<div class="actions no-print">${btn('＋ Cấp / cho mượn','newIssue','primary',a.id)}</div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Lớp</th><th>Hình thức</th><th>Cấp</th><th>Đã thu</th><th>Còn mượn</th><th>Hạn</th><th></th></tr></thead><tbody>${is.map(x=>`<tr><td>${dateShow(x.date)}</td><td>${esc(x.className)}<small>${esc(x.person||'')}</small></td><td>${esc(x.mode)}</td><td>${x.qty}</td><td>${x.mode==='Cho mượn'?returned(x.id):'—'}</td><td>${outstanding(x.id)}</td><td>${dateShow(x.due)}</td><td class="no-print">${x.mode==='Cho mượn'&&outstanding(x.id)>0?btn('↙️ Thu hồi','newReturn','small',x.id):''} ${!db.returns.some(r=>r.issueId===x.id)?btn('Xóa','deleteIssue','small danger',x.id):''}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có lượt cấp.</td></tr>'}</tbody></table></div>`)}${panel('↙️ Nhật ký thu hồi',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Lớp</th><th>Số lượng</th><th>Người nhận</th><th>Ghi chú</th></tr></thead><tbody>${db.returns.filter(r=>issue(r.issueId)?.itemId===a.id).sort((x,y)=>y.date.localeCompare(x.date)).map(r=>`<tr><td>${dateShow(r.date)}</td><td>${esc(issue(r.issueId).className)}</td><td>${r.qty}</td><td>${esc(r.person||'—')}</td><td>${esc(r.note||'—')}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có thu hồi.</td></tr>'}</tbody></table></div>`)}${panel('📥 Nhập / điều chỉnh kho',`<div class="actions no-print">${btn('＋ Ghi phiếu','newAdjustment','primary',a.id)}</div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Thay đổi</th><th>Lý do</th><th>Người ghi</th></tr></thead><tbody>${ad.map(x=>`<tr><td>${dateShow(x.date)}</td><td>${x.delta>0?'+':''}${x.delta}</td><td>${esc(x.reason)}</td><td>${esc(x.person||'—')}</td></tr>`).join('')||'<tr><td colspan="4">Chưa có điều chỉnh.</td></tr>'}</tbody></table></div>`)}`}
function issuesPage(){let a=db.issues.slice().sort((x,y)=>y.date.localeCompare(x.date));return `<div class="page-head"><div><h1>↗️ Cấp phát cho lớp</h1><p>Phân biệt vật tư cho mượn và cấp hẳn.</p></div>${btn('＋ Tạo phiếu cấp','newIssue','primary')}</div>${panel('Tất cả lượt cấp',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Mặt hàng</th><th>Lớp</th><th>Hình thức</th><th>Cấp</th><th>Thu hồi</th><th>Còn mượn</th><th>Hạn</th></tr></thead><tbody>${a.map(x=>`<tr><td>${dateShow(x.date)}</td><td><button class="link" data-act="openItem" data-id="${esc(x.itemId)}">${esc(item(x.itemId).name)}</button></td><td>${esc(x.className)}</td><td>${esc(x.mode)}</td><td>${x.qty}</td><td>${x.mode==='Cho mượn'?returned(x.id):'—'}</td><td>${outstanding(x.id)}</td><td>${dateShow(x.due)}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có lượt cấp.</td></tr>'}</tbody></table></div>`)}`}
function reports(){let types=[...new Set(db.items.map(x=>x.type))];return `<div class="page-head"><div><h1>📊 Báo cáo học liệu</h1><p>Số lượng là đơn vị vật lý theo từng mặt hàng; chỉ cộng cùng đơn vị khi diễn giải.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo loại',`<div class="table-wrap"><table><thead><tr><th>Loại</th><th>Mặt hàng</th><th>Tồn đầu</th><th>Nhập / chỉnh</th><th>Đang mượn</th><th>Cấp hẳn</th><th>Còn kho</th></tr></thead><tbody>${types.map(t=>{let a=db.items.filter(x=>x.type===t);return `<tr><td>${esc(t)}</td><td>${a.length}</td><td>${a.reduce((n,x)=>n+x.opening,0)}</td><td>${a.reduce((n,x)=>n+calc(x.id).delta,0)}</td><td>${a.reduce((n,x)=>n+calc(x.id).loan,0)}</td><td>${a.reduce((n,x)=>n+calc(x.id).given,0)}</td><td>${a.reduce((n,x)=>n+calc(x.id).stock,0)}</td></tr>`}).join('')||'<tr><td colspan="7">Chưa có mặt hàng.</td></tr>'}</tbody></table></div><p class="note">Tổng theo loại chỉ để rà soát số lượng, không phải giá trị tiền tệ.</p>`)}${panel('Mặt hàng cần bổ sung hoặc đối chiếu',`<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Mặt hàng</th><th>Còn kho</th><th>Tối thiểu</th><th>Cảnh báo</th></tr></thead><tbody>${db.items.filter(a=>warnings(a).length).map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${calc(a.id).stock}</td><td>${a.min}</td><td>${esc(warnings(a).join('; '))}</td></tr>`).join('')||'<tr><td colspan="5">Không có cảnh báo.</td></tr>'}</tbody></table></div>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu và chuyển máy',`<p>Thay đổi lưu trong trình duyệt của máy này. File HTML gốc không mang dữ liệu đã nhập. Dùng JSON hoặc HTML kèm dữ liệu để chuyển máy.</p><div class="actions">${btn('⬇️ Tải JSON','exportJson')}${btn('⬇️ Tải HTML kèm dữ liệu','exportHtml','primary')}${btn('⬇️ Excel 5 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Mẫu nguồn',`<p>8 mặt hàng, tồn đầu 370, 20 lượt cấp 272 và 5 dòng thu hồi tổng 25. Mẫu gốc có mặt hàng GT-04 âm 7; app giữ nguyên để đối chiếu và cảnh báo, còn thao tác cấp mới sẽ bị chặn nếu vượt kho.</p>${btn('Nạp mẫu nguồn (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ dữ liệu app này trên thiết bị hiện tại.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn sử dụng</h1></div>${panel('Quy trình',`<ol><li>Nhập danh mục và số lượng tồn đầu. Sau khi có giao dịch, tồn đầu được khóa để tránh thay đổi lịch sử.</li><li>Nhập thêm hoặc điều chỉnh kho bằng phiếu có lý do; xuất hủy ghi số âm.</li><li>Chọn Cho mượn nếu cần thu hồi; nhập hạn để app nhắc quá hạn. Chọn Cấp hẳn cho tài liệu phát đi hoặc tiêu hao.</li><li>Thu hồi từng phần theo ngày, kiểm tra số còn tại lớp.</li><li>In báo cáo và sao lưu định kỳ.</li></ol>`)}${panel('Quy tắc tồn kho',`<p>Còn kho = tồn đầu + nhập/điều chỉnh − đang cho mượn − đã cấp hẳn. Đang cho mượn = tổng cấp mượn − tổng thu hồi. Cảnh báo tồn thấp khi còn kho ≤ mức tối thiểu; thao tác thật không cho cấp quá tồn.</p><p>Mẫu nguồn coi mọi lượt cấp là mượn để bảo toàn công thức nguồn, dù giáo trình phát cho học viên thường nên ghi là Cấp hẳn. Người dùng cần chọn đúng nghiệp vụ khi nhập dữ liệu thật.</p>`)}`}
function render(){let map={home:['Tổng quan',home],items:['Danh mục',itemsPage],detail:['Chi tiết',detail],issues:['Cấp phát',issuesPage],reports:['Báo cáo',reports],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,l,v='',type='text',opts=null){return `<label class="${type==='textarea'?'full':''}">${l}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(v)}</textarea>`:opts?`<select name="${n}">${opts.map(o=>{let key=Array.isArray(o)?o[0]:o,label=Array.isArray(o)?o[1]:o;return `<option value="${esc(key)}" ${key===v?'selected':''}>${esc(label)}</option>`}).join('')}</select>`:`<input name="${n}" type="${type}" value="${esc(v)}" ${type==='number'?'step="1"':''} ${['code','name','date','className','qty','delta','reason'].includes(n)?'required':''}>`}</label>`}
function openModal(kind,id='',ref=''){let before=kind==='item'&&id?clone(item(id)):null;draft={kind,id,ref,before};let a=before||{},f='';if(kind==='item'){f=field('code','Mã',a.code||'')+field('name','Tên học liệu / thiết bị',a.name||'')+field('type','Loại',a.type||'Giáo trình','text',TYPES)+field('unit','Đơn vị',a.unit||'quyển')+field('opening','Tồn ban đầu',a.opening??0,'number')+field('min','Tồn tối thiểu',a.min??0,'number')+field('note','Ghi chú',a.note||'','textarea')}else if(kind==='issue'){let opts=db.items.map(x=>[x.id,x.code+' · '+x.name]);f=field('date','Ngày cấp',today(),'date')+field('itemId','Mặt hàng',ref||db.items[0]?.id||'','text',opts)+field('className','Lớp / nơi nhận','')+field('person','Người nhận','')+field('qty','Số lượng',1,'number')+field('mode','Hình thức','Cho mượn','text',MODES)+field('due','Hạn thu hồi (nếu mượn)','','date')+field('note','Ghi chú','','textarea')}else if(kind==='return'){let i=issue(ref);f=field('date','Ngày thu hồi',today(),'date')+field('qty',`Số lượng thu hồi (còn ${outstanding(ref)})`,outstanding(ref),'number')+field('person','Người nhận lại','')+field('note','Tình trạng / ghi chú','','textarea')}else{let opts=db.items.map(x=>[x.id,x.code+' · '+x.name]);f=field('date','Ngày phiếu',today(),'date')+field('itemId','Mặt hàng',ref||db.items[0]?.id||'','text',opts)+field('delta','Số lượng thay đổi (+ nhập, − xuất)','1','number')+field('reason','Lý do','')+field('person','Người ghi','')+field('note','Ghi chú','','textarea')}$('#modalTitle').textContent={item:id?'Sửa mặt hàng':'Thêm mặt hàng',issue:'Cấp cho lớp',return:'Thu hồi',adjustment:'Nhập / điều chỉnh kho'}[kind];$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function error(s){$('#formError').textContent=s}function audit(action,reason,ref){db.audit.push({id:uid(),action,reason,ref,at:new Date().toISOString()})}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let kind=draft.kind;if(kind==='item'){x.code=x.code.toUpperCase();x.opening=Number(x.opening);x.min=Number(x.min);if(!x.code||!x.name||!TYPES.includes(x.type)||!Number.isInteger(x.opening)||x.opening<0||!Number.isInteger(x.min)||x.min<0||db.items.some(a=>a.code===x.code&&a.id!==x.id)){error('Mã không trùng, tên, loại và số lượng nguyên không âm là bắt buộc.');return}let old=item(x.id);if(old&&old.opening!==x.opening&&(itemIssues(x.id).length||db.adjustments.some(z=>z.itemId===x.id))){error('Tồn đầu đã khóa vì có giao dịch. Dùng phiếu nhập / điều chỉnh kho.');return}if(old){let diff=x.opening-old.opening,now=calc(x.id).stock;if(now+diff<0){error('Thay đổi tồn đầu sẽ làm kho âm.');return}Object.assign(old,x)}else db.items.push(x);audit(old?'Sửa mặt hàng':'Thêm mặt hàng',x.code,x.id);selected=x.id}else if(kind==='issue'){x.qty=Number(x.qty);let a=item(x.itemId);if(!a||!dateOK(x.date)||!x.className||!Number.isInteger(x.qty)||x.qty<=0||!MODES.includes(x.mode)||x.due&&!dateOK(x.due)||x.mode==='Cấp hẳn'&&x.due){error('Chọn mặt hàng, ngày, lớp, hình thức và số lượng hợp lệ. Cấp hẳn không có hạn thu hồi.');return}if(x.qty>calc(a.id).stock){error('Không đủ hàng trong kho. Còn '+calc(a.id).stock+', cần '+x.qty+'.');return}db.issues.push(x);audit('Cấp cho lớp',a.code+' · '+x.className+' · '+x.qty+' · '+x.mode,x.id);selected=a.id}else if(kind==='return'){x.issueId=draft.ref;x.qty=Number(x.qty);let i=issue(x.issueId);if(!i||i.mode!=='Cho mượn'||!dateOK(x.date)||x.date<i.date||!Number.isInteger(x.qty)||x.qty<=0||x.qty>outstanding(i.id)){error('Ngày thu không trước ngày cấp; số thu phải từ 1 đến số còn mượn.');return}db.returns.push(x);audit('Thu hồi',item(i.itemId).code+' · '+i.className+' · '+x.qty,i.id);selected=i.itemId}else{ x.delta=Number(x.delta);let a=item(x.itemId);if(!a||!dateOK(x.date)||!Number.isInteger(x.delta)||x.delta===0||!x.reason){error('Chọn mặt hàng, ngày, số nguyên khác 0 và lý do.');return}if(calc(a.id).stock+x.delta<0){error('Điều chỉnh này làm kho âm.');return}db.adjustments.push(x);audit('Điều chỉnh kho',a.code+' · '+x.delta+' · '+x.reason,x.id);selected=a.id}let err=validate(db);if(err){let list=kind==='item'?db.items:kind==='issue'?db.issues:kind==='return'?db.returns:db.adjustments;if(kind==='item'&&draft.before)Object.assign(item(x.id),draft.before);else list.splice(list.findIndex(z=>z.id===x.id),1);db.audit.pop();error(err);return}$('#editor').close();page='detail';save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'hoc-lieu-thiet-bi-sao-luu.json')}function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'hoc-lieu-thiet-bi-kem-du-lieu.html')}
const HI=['ID','Mã','Tên','Loại','Đơn vị','Tồn đầu','Tồn tối thiểu','Ghi chú'],HX=['ID','Ngày','ID mặt hàng','Lớp','Người nhận','Số lượng','Hình thức','Hạn','Ghi chú'],HR=['ID','ID lượt cấp','Ngày','Số thu','Người nhận lại','Ghi chú'],HD=['ID','ID mặt hàng','Ngày','Thay đổi','Lý do','Người ghi','Ghi chú'],HA=['ID','Thao tác','Lý do','Tham chiếu','Thời điểm'];
function sheets(){return [{name:'Mat hang',rows:[HI,...db.items.map(a=>[a.id,a.code,a.name,a.type,a.unit,a.opening,a.min,a.note])]},{name:'Cap phat',rows:[HX,...db.issues.map(a=>[a.id,a.date,a.itemId,a.className,a.person,a.qty,a.mode,a.due,a.note])]},{name:'Thu hoi',rows:[HR,...db.returns.map(a=>[a.id,a.issueId,a.date,a.qty,a.person,a.note])]},{name:'Dieu chinh',rows:[HD,...db.adjustments.map(a=>[a.id,a.itemId,a.date,a.delta,a.reason,a.person,a.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.ref,a.at])]}]}function exportExcel(){download(Excel.workbook(sheets()),'hoc-lieu-thiet-bi.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Mat hang',HI],['Cap phat',HX],['Thu hoi',HR],['Dieu chinh',HD],['Nhat ky',HA]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng mẫu năm sheet do app xuất.');x=empty();x.items=b['Mat hang'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),name:String(r[2]),type:String(r[3]),unit:String(r[4]||''),opening:Number(r[5]),min:Number(r[6]),note:String(r[7]||'')}));x.issues=b['Cap phat'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),date:String(r[1]),itemId:String(r[2]),className:String(r[3]),person:String(r[4]||''),qty:Number(r[5]),mode:String(r[6]),due:String(r[7]||''),note:String(r[8]||'')}));x.returns=b['Thu hoi'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),issueId:String(r[1]),date:String(r[2]),qty:Number(r[3]),person:String(r[4]||''),note:String(r[5]||'')}));x.adjustments=b['Dieu chinh'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),itemId:String(r[1]),date:String(r[2]),delta:Number(r[3]),reason:String(r[4]),person:String(r[5]||''),note:String(r[6]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),ref:String(r[3]||''),at:String(r[4])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.items.length} mặt hàng?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today(),date=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')},map=new Map();for(let r of MATERIAL_SAMPLE.vt){let id=uid();map.set(r[0],id);x.items.push({id,code:r[0],name:r[1],type:r[2],unit:'đơn vị',opening:r[3],min:r[4],note:'Dữ liệu minh họa từ nguồn; cần rà soát lớp và loại cấp.'})}for(let r of MATERIAL_SAMPLE.cap){let id=uid(),d=date(r[0]);x.issues.push({id,date:d,itemId:map.get(r[1]),className:r[2],person:'',qty:r[3],mode:'Cho mượn',due:'',note:'Mẫu gốc không phân biệt cấp hẳn và cho mượn.'});if(r[4])x.returns.push({id:uid(),issueId:id,date:d,qty:r[4],person:'',note:'Ngày thu hồi minh họa: nguồn chỉ có tổng số đã thu hồi.'})}x.sample=true;let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;if(k==='newItem')openModal('item');else if(k==='editItem')openModal('item',id);else if(k==='newIssue'){if(!db.items.length){alert('Thêm mặt hàng trước khi cấp.');return}openModal('issue','',id)}else if(k==='newReturn')openModal('return','',id);else if(k==='newAdjustment'){if(!db.items.length){alert('Thêm mặt hàng trước khi điều chỉnh.');return}openModal('adjustment','',id)}else if(k==='openItem'){selected=id;page='detail';render()}else if(k==='items'){page='items';render()}else if(k==='deleteIssue'){let x=issue(id);if(db.returns.some(r=>r.issueId===id)){alert('Lượt đã có thu hồi nên không xóa trực tiếp.');return}if(confirm('Xóa lượt cấp này?')){db.issues=db.issues.filter(z=>z.id!==id);audit('Xóa lượt cấp',item(x.itemId).code+' · '+x.className+' · '+x.qty,id);save()}}else if(k==='deleteItem'){let x=item(id);if(db.issues.some(z=>z.itemId===id)||db.adjustments.some(z=>z.itemId===id)){alert('Mặt hàng đã có giao dịch; không thể xóa.');return}if(confirm(`Xóa mặt hàng “${x.name}”?`)){db.items=db.items.filter(z=>z.id!==id);audit('Xóa mặt hàng',x.code,id);page='items';save()}}else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}if(e.target.id==='typeFilter'){typeFilter=e.target.value;render()}if(e.target.id==='alertOnly'){alertOnly=e.target.value==='1';render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
window.MaterialsApp={getDB:()=>clone(db),validate,calc,summary,warnings,loadSample,encode,decode,sheets,importFile};
</script></body></html>
