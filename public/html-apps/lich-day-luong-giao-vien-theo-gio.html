const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};

const validMonth=s=>/^\d{4}-(0[1-9]|1[0-2])$/.test(String(s));

const empty=()=>({app:APP_ID,version:VERSION,teachers:[],sessions:[],batches:[],payments:[],settings:{org:'',assistFactor:0.5,subFactor:1,maxHours:4}});
const teacher=id=>db.teachers.find(t=>t.id===id),session=id=>db.sessions.find(s=>s.id===id),batch=id=>db.batches.find(b=>b.id===id);
const amount=s=>Math.round(Number(s.hours)*Number(s.rate)*Number(s.factor));
const payable=s=>s.state==='Đã dạy'?amount(s):0;
const paid=(bid,tid)=>sum(db.payments.filter(p=>p.batchId===bid&&p.teacherId===tid),p=>p.amount);
const item=(bid,tid)=>batch(bid)?.items.find(x=>x.teacherId===tid);

function validate(x){
 if(!x||x.app!==APP_ID||x.version!==VERSION||!Array.isArray(x.teachers)||!Array.isArray(x.sessions)||!Array.isArray(x.batches)||!Array.isArray(x.payments)||!x.settings)return 'Sai cấu trúc hoặc phiên bản sao lưu.';
 let codes=new Set(),ids=new Set();for(let t of x.teachers){if(!t.id||ids.has(t.id))return 'Trùng ID giáo viên.';ids.add(t.id);let c=String(t.code||'').toUpperCase();if(!/^[A-Z0-9_-]{2,24}$/.test(c)||codes.has(c))return 'Mã giáo viên không hợp lệ hoặc trùng.';codes.add(c);if(!String(t.name||'').trim()||!Number.isFinite(Number(t.rate))||Number(t.rate)<0)return 'Tên hoặc đơn giá giáo viên không hợp lệ.'}
 let sid=new Set();for(let s of x.sessions){if(!s.id||sid.has(s.id)||!ids.has(s.teacherId)||!validDate(s.date)||!TYPES.includes(s.type)||!STATES.includes(s.state)||!String(s.className||'').trim())return 'Buổi dạy có thông tin hoặc liên kết không hợp lệ.';sid.add(s.id);if(!Number.isFinite(Number(s.hours))||s.hours<=0||s.hours>24||!Number.isFinite(Number(s.rate))||s.rate<0||!Number.isFinite(Number(s.factor))||s.factor<0||s.factor>5||!Number.isFinite(Number(s.amount))||s.amount!==amount(s))return 'Giờ dạy hoặc thành tiền buổi dạy không hợp lệ.';if(s.lockedBatchId&&s.state!=='Đã dạy')return 'Chỉ buổi đã dạy mới được chốt.'}
 let bid=new Set(),periods=new Set(),locked=new Set();for(let b of x.batches){if(!b.id||bid.has(b.id)||!validMonth(b.period)||periods.has(b.period)||!Array.isArray(b.items))return 'Kỳ lương không hợp lệ hoặc bị trùng.';bid.add(b.id);periods.add(b.period);let tids=new Set();for(let it of b.items){if(!ids.has(it.teacherId)||tids.has(it.teacherId)||!Array.isArray(it.sessionIds))return 'Dòng chốt lương không hợp lệ.';tids.add(it.teacherId);let records=it.sessionIds.map(id=>x.sessions.find(s=>s.id===id));if(records.some(s=>!s||s.teacherId!==it.teacherId||s.date.slice(0,7)!==b.period||s.state!=='Đã dạy'||s.lockedBatchId!==b.id||locked.has(s.id)))return 'Buổi dạy trong kỳ lương không khớp.';records.forEach(s=>locked.add(s.id));if(it.hours!==sum(records,s=>s.hours)||it.gross!==sum(records,s=>s.amount))return 'Tổng chốt lương không khớp buổi dạy.'}}for(let s of x.sessions)if(s.lockedBatchId&&!bid.has(s.lockedBatchId))return 'Buổi dạy trỏ đến kỳ lương không tồn tại.';
 let pid=new Set(),totals=new Map();for(let p of x.payments){if(!p.id||pid.has(p.id)||!bid.has(p.batchId)||!ids.has(p.teacherId)||!validDate(p.date)||!Number.isSafeInteger(p.amount)||p.amount<=0)return 'Khoản thanh toán không hợp lệ.';pid.add(p.id);let b=x.batches.find(b=>b.id===p.batchId);if(!b.items.some(i=>i.teacherId===p.teacherId))return 'Khoản thanh toán không thuộc kỳ lương.';let k=p.batchId+'|'+p.teacherId;totals.set(k,(totals.get(k)||0)+p.amount)}for(let [k,v] of totals){let [b,t]=k.split('|'),it=x.batches.find(x=>x.id===b).items.find(x=>x.teacherId===t);if(v>it.gross)return 'Thanh toán vượt tổng lương đã chốt.'}
 for(let k of ['assistFactor','subFactor'])if(!Number.isFinite(Number(x.settings[k]))||x.settings[k]<0||x.settings[k]>5)return 'Hệ số cài đặt không hợp lệ.';if(!Number.isFinite(Number(x.settings.maxHours))||x.settings.maxHours<=0||x.settings.maxHours>24)return 'Ngưỡng cảnh báo giờ không hợp lệ.';return '';
}
function decode(){try{let b=$('#embedded-state').textContent.trim();return b&&b!=='e30='?JSON.parse(decodeURIComponent(escape(atob(b)))):null}catch{return null}}

function saveModal(){if(!draft)return;let f=collect(),k=draft.kind,id=draft.id;if(k==='teacher'){let code=f.code.toUpperCase(),rate=Number(f.rate);if(!/^[A-Z0-9_-]{2,24}$/.test(code)||db.teachers.some(t=>t.code===code&&t.id!==id))return modalError('Mã giáo viên cần 2–24 ký tự A–Z, số, _ hoặc - và không trùng.');if(!f.name||f.name.length>120)return modalError('Nhập tên giáo viên tối đa 120 ký tự.');if(!Number.isSafeInteger(rate)||rate<0||rate>1e9)return modalError('Đơn giá giờ cần là số đồng nguyên từ 0 đến 1 tỷ.');let x={id:id||uid(),code,name:f.name,rate,phone:f.phone.slice(0,30),active:f.active==='1',note:f.note.slice(0,1000)};if(id)Object.assign(teacher(id),x);else db.teachers.push(x);page='teachers'}else if(k==='session'){let t=teacher(f.teacherId),hours=Number(f.hours),rate=Number(f.rate),factor=Number(f.factor);if(!t)return modalError('Chọn giáo viên hợp lệ.');if(!validDate(f.date)||!f.className||f.className.length>120||!TYPES.includes(f.type)||!STATES.includes(f.state))return modalError('Kiểm tra ngày, lớp, loại và tình trạng.');if(!Number.isFinite(hours)||hours<=0||hours>24||Math.round(hours*4)!==hours*4)return modalError('Số giờ phải trên 0, tối đa 24 và theo bước 0,25 giờ.');if(!Number.isSafeInteger(rate)||rate<0||rate>1e9||!Number.isFinite(factor)||factor<0||factor>5)return modalError('Đơn giá hoặc hệ số không hợp lệ.');if(f.start&&f.end&&f.end<=f.start)return modalError('Giờ kết thúc phải sau giờ bắt đầu.');if(db.batches.some(b=>b.period===f.date.slice(0,7))&&!id)return modalError('Tháng này đã chốt lương; không thêm buổi mới vào kỳ đã khóa.');if(id&&db.batches.some(b=>b.period===f.date.slice(0,7)))return modalError('Không chuyển buổi sang tháng đã chốt.');let x={id:id||uid(),date:f.date,teacherId:f.teacherId,className:f.className,type:f.type,start:f.start,end:f.end,hours,rate,factor,state:f.state,amount:Math.round(hours*rate*factor),note:f.note.slice(0,1000),lockedBatchId:''};if(id)Object.assign(session(id),x);else db.sessions.push(x);page='schedule'}el function closePeriod(){if(!validMonth(filterPeriod))return alert('Chọn tháng hợp lệ.');if(db.batches.some(b=>b.period===filterPeriod))return alert('Tháng này đã chốt.');let ss=db.sessions.filter(s=>s.date.slice(0,7)===filterPeriod&&s.state==='Đã dạy'&&!s.lockedBatchId);if(!ss.length)return alert('Chưa có buổi “Đã dạy” để chốt.');let groups=new Map();for(let s of ss){let a=groups.get(s.teacherId)||[];a.push(s);groups.set(s.teacherId,a)}let items=[...groups].map(([teacherId,a])=>({teacherId,sessionIds:a.map(s=>s.id),hours:sum(a,s=>s.hours),gross:sum(a,s=>s.amount)}));if(!confirm(`Chốt ${filterPeriod}: ${ss.length} buổi, ${items.length} giáo viên, tổng ${money(sum(items,i=>i.gross))}? Sau khi chốt, các buổi này sẽ khóa sửa.`))return;let b={id:uid(),period:filterPeriod,closedAt:stamp(),items,note:''};db.batches.push(b);ss.forEach(s=>s.lockedBatchId=b.id);save()}

function exportExcel(){let sheets=[{name:'Giao vien',rows:[HEAD_T,...db.teachers.map(t=>[t.code,t.name,t.rate,t.phone,t.active?'Có':'Không',t.note])]},{name:'Buoi day',rows:[HEAD_S,...db.sessions.map(s=>[s.id,s.date,teacher(s.teacherId)?.code||'',s.className,s.type,s.start,s.end,s.hours,s.rate,s.factor,s.state,s.amount,s.note,s.lockedBatchId])]},{name:'Ky luong',rows:[HEAD_B,...db.batches.flatMap(b=>b.items.map(i=>[b.id,b.period,b.closedAt,teacher(i.teacherId)?.code||'',i.sessionIds.join(';'),i.hours,i.gross,b.note]))]},{name:'Thanh toan',rows:[HEAD_P,...db.payments.map(p=>[p.id,p.batchId,teacher(p.teacherId)?.code||'',p.date,p.amount,p.method,p.note])]}];download(Excel.workbook(sheets),'lich-day-luong-giao-vien.xlsx')}
function fromExcel(book){let ts=book['Giao vien'],ss=book['Buoi day'],bs=book['Ky luong'],ps=book['Thanh toan'];if(!ts||!ss||!bs||!ps)throw Error('Thiếu một trong 4 sheet của app.');let same=(r,h)=>h.every((x,i)=>String(r?.[i]??'')===x);if(!same(ts[0],HEAD_T)||!same(ss[0],HEAD_S)||!same(bs[0],HEAD_B)||!same(ps[0],HEAD_P))throw Error('Tên cột Excel không khớp file do app xuất.');let x=empty(),map=new Map();x.settings=clone(db.settings);for(let r of ts.slice(1)){if(!String(r[0]||'').trim())continue;let t={id:uid(),code:String(r[0]).trim(),name:String(r[1]||'').trim(),rate:Number(r[2]),phone:String(r[3]||''),active:String(r[4])==='Có',note:String(r[5]||'')};x.teachers.push(t);map.set(t.code,t.id)}for(let r of ss.slice(1)){if(!String(r[0]||'').trim())continue;x.sessions.push({id:String(r[0]),date:String(r[1]),teacherId:map.get(String(r[2]))||'',className:String(r[3]||''),type:String(r[4]||''),start:String(r[5]||''),end:String(r[6]||''),hours:Number(r[7]),rate:Number(r[8]),factor:Number(r[9]),state:String(r[10]||''),amount:Number(r[11]),note:String(r[12]||''),lockedBatchId:String(r[13]||'')})}let byBatch=new Map();for(let r of bs.slice(1)){if(!String(r[0]||'').trim())continue;let id=String(r[0]),b=byBatch.get(id);if(!b){b={id,period:String(r[1]),closedAt:String(r[2]),items:[],note:String(r[7]||'')};byBatch.set(id,b);x.batches.push(b)}if(b.period!==String(r[1])||b.closedAt!==String(r[2]))throw Error('Một mã kỳ có nhiều thông tin khác nhau.');b.items.push({teacherId:map.get(String(r[3]))||'',sessionIds:String(r[4]||'').split(';').filter(Boolean),hours:Number(r[5]),gross:Number(r[6])})}for(let r of ps.slice(1)){if(!String(r[0]||'').trim())continue;x.payments.push({id:String(r[0]),batchId:String(r[1]),teacherId:map.get(String(r[2]))||'',date:String(r[3]),amount:Number(r[4]),method:String(r[5]||''),note:String(r[6]||'')})}let err=validate(x);if(err)throw Error(err);return x}
function act(name,d){if(name==='newTeacher')showModal('teacher');else if(name==='editTeacher')showModal('teacher',d.id);else if(name==='deleteTeacher'){let t=teacher(d.id);if(db.sessions.some(s=>s.teacherId===d.id)||db.batches.some(b=>b.items.some(i=>i.teacherId===d.id)))return alert('Giáo viên đang có buổi dạy/kỳ lương, không thể xóa. Hãy chuyển trạng thái “Ngừng dạy”.');if(confirm('Xóa giáo viên '+t.name+'?')){db.teachers=db.teachers.filter(x=>x.id!==d.id);save()}}else if(name==='newSession')showModal('session');else if(name==='editSession'){let s=session(d.id);if(s.lockedBatchId)return alert('Buổi đã chốt lương không thể sửa.');showModal('session',d.id)}else if(name==='deleteSession'){let s=session(d.id);if(s.lockedBatchId)return alert('Buổi đã chốt lương không thể xóa.');if(confirm('Xóa buổi dạy này?')){db.sessions=db.sessions.filter(x=>x.id!==d.id);save()}}else if(name==='newPayment')showModal('payment','',{bid:d.bid,tid:d.tid});else if(name==='deletePayment'){if(confirm('Xóa khoản thanh toán này? Hãy đối chiếu chứng từ trước khi xóa.')){db.payments=db.payments.filter(p=>p.id!==d.id);save()}}else if(name==='closePeriod')closePeriod();else if(name==='goSchedule'){page='schedule';render()}else if(name==='goPayroll'){page='payroll';filterPeriod=month();render()}else if(name==='clearFilters'){query='';filterState='';filterTeacher='';filterPeriod='';render()}else if(name==='allPeriods'){filterPeriod='';render()}else if(name==='saveSettings'){let org=$('#f_org').value.trim(),assistFactor=Number($('#f_assistFactor').value),subFactor=Number($('#f_subFactor').value),maxHours=Number($('#f_maxHours').value);if(org.length>120||[assistFactor,subFactor].some(n=>!Number.isFinite(n)||n<0||n>5)||!Number.isFinite(maxHours)||maxHours<=0||maxHours>24)return alert('Tên đơn vị tối đa 120 ký tự; hệ số 0–5; ngưỡng giờ trên 0 đến 24.');db.settings={org,assistFactor,subFactor,maxHours};save()}else if(name==='backup')backup();else if(name==='portable')portable();else if(name==='exportExcel')exportExcel();else if(name==='restore')$('#jsonFile').click();else if(name==='importExcel')$('#excelFile').click();else if(name==='loadDemo')loadDemo();else if(name==='clear'){if(confirm('Xóa toàn bộ giáo viên, buổi dạy, kỳ lương và thanh toán trên thiết bị này?')){db=empty();page='dashboard';save()}}else if(name==='print')window.print()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}let b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='periodFilter'||e.target.id==='payPeriod'||e.target.id==='reportPeriod'){filterPeriod=e.target.value;render()}else if(e.target.id==='teacherFilter'){filterTeacher=e.target.value;render()}else if(e.target.id==='stateFilter'){filterState=e.target.value;render()}else if(draft?.kind==='session'&&e.target.id==='f_type'){let f=e.target.value;$('#f_factor').value=f==='Trợ giảng'?db.settings.assistFactor:f==='Dạy thay'?db.settings.subFactor:1}else if(draft?.kind==='session'&&e.target.id==='f_teacherId'){$('#f_rate').value=teacher(e.target.value)?.rate??0}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let el=$('#screen');let p=el.querySelector('.table-wrap');if(page==='schedule'&&p){p.outerHTML=table(['Ngày / giờ','Giáo viên / lớp','Loại','Giờ','Đơn giá','Hệ số','Thành tiền','Tình trạng','Thao tác'],sessionRows(activeRows().slice(0,200)),'Không có buổi phù hợp.')}}});
$('#modalSave').addEventListener('click',saveModal);$('#modalClose').addEventListener('click',()=>$('#editor').close());$('#modalCancel').addEventListener('click',()=>$('#editor').close());$('#quickPrint').addEventListener('click',()=>window.print());
$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>15e6)throw Error('File JSON vượt 15 MB.');let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm(`Khôi phục ${x.teachers.length} giáo viên, ${x.sessions.length} buổi, ${x.batches.length} kỳ lương và ${x.payments.length} khoản thanh toán? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{let x=fromExcel(await Excel.read(f));if(!confirm(`Nhập ${x.teachers.length} giáo viên, ${x.sessions.length} buổi, ${x.batches.length} kỳ lương và ${x.payments.length} khoản thanh toán từ Excel? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
window.__TEACHER_SCHEDULE_TEST__={empty,validate,amount,loadDemo,closePeriod,fromExcel,getDB:()=>db,setDB:x=>{db=x;render()},go:p=>{page=p;render()}};
render();
</script></body></html>
