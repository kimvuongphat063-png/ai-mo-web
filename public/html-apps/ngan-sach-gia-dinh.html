function categoryErrors(c,oldId=null){let e=[];if(!String(c.name||'').trim())e.push('Thiếu tên danh mục.');if(!['Thu','Chi','Tiết kiệm'].includes(c.type))e.push('Loại danh mục không hợp lệ.');if(!integer(c.defaultPlan)||Number(c.defaultPlan)<0)e.push('Kế hoạch phải là số nguyên không âm.');if(db.categories.some(x=>x.id!==oldId&&x.name.toLocaleLowerCase('vi')===String(c.name||'').toLocaleLowerCase('vi')))e.push('Tên danh mục đã tồn tại.');return e}
function transactionErrors(t){let e=[],cat=db.categories.find(c=>c.id===t.categoryId);if(!dateOK(t.date))e.push('Ngày không hợp lệ.');if(!cat)e.push('Danh mục không tồn tại.');if(!integer(t.amount)||Number(t.amount)<=0)e.push('Số tiền phải là số nguyên dương.');if(cat?.type==='Tiết kiệm'&&!['Gửi','Rút'].includes(t.flow))e.push('Chọn Gửi hoặc Rút.');if(cat?.type!=='Tiết kiệm'&&t.flow)e.push('Gửi/Rút chỉ dùng cho tiết kiệm.');if(cat?.type!=='Tiết kiệm'&&t.goalId)e.push('Chỉ giao dịch tiết kiệm được gắn mục tiêu.');if(t.goalId&&!db.goals.some(g=>g.id===t.goalId))e.push('Mục tiêu không tồn tại.');return e}
function goalErrors(g,oldId=null){let e=[];if(!String(g.name||'').trim())e.push('Thiếu tên mục tiêu.');if(!integer(g.target)||Number(g.target)<=0)e.push('Số tiền mục tiêu phải dương.');if(!integer(g.opening)||Number(g.opening)<0)e.push('Số dư ban đầu không hợp lệ.');if(!dateOK(g.deadline))e.push('Hạn hoàn thành không hợp lệ.');if(db.goals.some(x=>x.id!==oldId&&x.name.toLocaleLowerCase('vi')===String(g.name||'').toLocaleLowerCase('vi')))e.push('Tên mục tiêu đã tồn tại.');return e}
function planErrors(p){let e=[];if(!monthOK(p.month))e.push('Tháng kế hoạch không hợp lệ.');if(!db.categories.some(c=>c.id===p.categoryId))e.push('Danh mục kế hoạch không tồn tại.');if(!integer(p.amount)||Number(p.amount)<0)e.push('Kế hoạch phải là số nguyên không âm.');return e}
function validateState(x){let previous=db,errors=settingsErrors(x.settings);db=x;try{if(x.categories.length>40)errors.push('Quá 40 danh mục.');if(x.transactions.length>10000)errors.push('Quá 10.000 giao dịch.');if(x.goals.length>50)errors.push('Quá 50 mục tiêu.');if(x.plans.length>5000)errors.push('Quá 5.000 giá trị kế hoạch.');for(let kind of ['categories','transactions','plans','goals']){let ids=new Set();for(let r of x[kind]){if(!r.id||ids.has(r.id))errors.push(kind+': ID thiếu hoặc trùng.');ids.add(r.id);errors.push(...(kind==='categories'?categoryErrors(r,r.id):kind==='transactions'?transactionErrors(r):kind==='plans'?planErrors(r):goalErrors(r,r.id)).map(s=>kind+': '+s))}}let planKeys=new Set();for(let p of x.plans){let key=p.month+'|'+p.categoryId;if(planKeys.has(key))errors.push('Trùng kế hoạch '+key);planKeys.add(key)}if(x.closedMonths.some(m=>!monthOK(m))||new Set(x.closedMonths).size!==x.closedMonths.length)errors.push('Danh sách tháng đã chốt không hợp lệ.')}finally{db=previous}return errors}
function persist(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Trình duyệt không lưu được dữ liệu. Hãy tải HTML kèm dữ liệu hoặc sao lưu JSON.')}render()}
function cat(id){return db.categories.find(c=>c.id===id)}
function plan(catId,month){let override=db.plans.find(p=>p.categoryId===catId&&p.month===month);return override?Number(override.amount):Number(cat(catId)?.defaultPlan)||0}
function signedSaving(t){return t.flow==='Rút'?-Number(t.amount):Number(t.amount)}
function actual(catId,month){return db.transactions.filter(t=>t.categoryId===catId&&t.date.startsWith(month)).reduce((a,t)=>a+(cat(catId)?.type==='Tiết kiệm'?signedSaving(t):Number(t.amount)),0)}
function monthTotals(month){let rows=db.transactions.filter(t=>t.date.startsWith(month)),income=0,expense=0,saving=0;for(let t of rows){let type=cat(t.categoryId)?.type;if(type==='Thu')income+=Number(t.amount);else if(type==='Chi')expense+=Number(t.amount);else if(type==='Tiết kiệm')saving+=signedSaving(t)}let available=income-expense-saving,rate=income?(saving+Math.max(available,0))/income*100:null;return {income,expense,saving,available,rate,count:rows.length}}
function budgetRows(month){return db.categories.map(c=>{let planned=plan(c.id,month),spent=actual(c.id,month),left=planned-spent,ratio=planned?spent/planned*100:null,status='';if(c.type==='Chi')status=planned===0?(spent>0?'Chưa đặt hạn mức':'Chưa đặt'):spent>planned?'Vượt ngân sách':spent>=.9*planned?'Sắp hết':'Trong mức';if(c.type==='Tiết kiệm')status=planned===0?'Chưa đặt mục tiêu':spent>=planned?'Đạt mục tiêu':'Chưa đạt mục tiêu';if(c.type==='Thu')status=planned>0?spent>=planned?'Đạt kế hoạch':'Dưới kế hoạch':'';return {...c,planned,spent,left,ratio,status}})}
function yearRows(year){let acc=0;return Array.from({length:12},(_,i)=>{let month=year+'-'+String(i+1).padStart(2,'0'),t=monthTotals(month),p={income:0,expense:0,saving:0};for(let c of db.categories)p[c.type==='Thu'?'income':c.type==='Chi'?'expense':'saving']+=plan(c.id,month);acc+=t.available;return {month,plan:p,...t,acc,closed:db.closedMonths.includes(month)}})}
function goalValue(g){let net=db.transactions.filter(t=>t.goalId===g.id).reduce((a,t)=>a+signedSaving(t),0),current=Number(g.opening)+net,remaining=Math.max(0,Number(g.target)-current),pct=Number(g.target)?current/Number(g.target)*100:0;return {...g,net,current,remaining,pct,status:current>=Number(g.target)?'Đã đạt':g.deadline<today()?'Quá hạn':'Đang thực hiện'}}
function metric(label,value,sub='',tone=''){return '<div class="metric"><small>'+esc(label)+'</small><strong class="'+tone+'">'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>'}
function hero(title,desc){return '<div class="hero"><small>AI MỞ · QUẢN LÝ GIA ĐÌNH OFFLINE</small><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>'}
function pct(v){return v===null?'—':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:1})+'%'}
function badge(s){return '<span class="badge '+(/Vượt|Quá hạn|Chưa đạt/.test(s)?'loss':/Sắp hết|Dưới kế hoạch|Chưa đặt/.test(s)?'alert':'ok')+'">'+esc(s||'—')+'</span>'}
function monthSelector(){return '<label class="field"><span class="mini">Tháng đang xem</span><input id="monthSelect" type="month" value="'+esc(selectedMonth)+'"></label>'}
function progress(value,total,over=false){return '<div class="progress '+(over?'over':'')+'"><i style="width:'+Math.max(0,Math.min(100,total?value/total*100:0))+'%"></i></div>'}
function overview(){let t=monthTotals(selectedMonth),rows=budgetRows(selectedMonth),issues=rows.filter(r=>r.type==='Chi'&&['Vượt ngân sách','Sắp hết','Chưa đặt hạn mức'].includes(r.status)),goals=db.goals.map(goalValue),top=[...rows].filter(r=>r.type==='Chi'&&r.spent>0).sort((a,b)=>b.spent-a.spent).slice(0,6);return hero('Ngân sách gia đình theo mục tiêu','Ghi thu chi, giữ hạn mức và xem mục tiêu tiết kiệm có tiến triển đến đâu.')+'<div class="card"><div class="toolbar"><h2 class="grow">Tổng quan tháng '+esc(selectedMonth)+'</h2>'+monthSelector()+'<button class="btn primary" data-action="new" data-kind="transactions">+ Ghi giao dịch</button></div><div class="grid">'+metric('Tổng thu',money(t.income),t.count+' giao dịch trong tháng','good')+metric('Chi sinh hoạt',money(t.expense),'Không gồm chuyển tiết kiệm')+metric('Chuyển tiết kiệm ròng',money(t.saving),'Gửi trừ rút')+metric('Còn lại sau chi & tiết kiệm',money(t.available),'Có thể phân bổ tiếp',t.available<0?'bad':'good')+metric('Tỷ lệ có thể để dành',pct(t.rate),'(Đã tiết kiệm + còn dương) / tổng thu')+'</div></div><div class="grid two"><div class="card"><h2>Hạn mức cần chú ý</h2>'+(issues.length?issues.map(r=>'<div class="check"><span>'+esc(r.name)+'<br><span class="mini">'+money(r.spent)+' / '+money(r.planned)+'</span></span>'+badge(r.status)+'</div>').join(''):'<div class="notice good">Chưa có khoản chi nào vượt hoặc gần hết hạn mức.</div>')+'<p><button class="btn" data-page="monthly">Xem báo cáo tháng</button></p></div><div class="card"><h2>Mục tiêu tiết kiệm</h2>'+(goals.length?goals.slice(0,5).map(g=>'<div class="check"><span>'+esc(g.name)+'<br><span class="mini">'+money(g.current)+' / '+money(g.target)+'</span>'+progress(g.current,g.target,g.current>g.target)+'</span>'+badge(g.status)+'</div>').join(''):'<div class="empty">Chưa có mục tiêu. Thêm một mục tiêu cụ thể để theo dõi.</div>')+'<p><button class="btn" data-page="goals">Mở mục tiêu</button></p></div></div><div class="card"><h2>Chi nhiều nhất tháng này</h2>'+(top.length?top.map(r=>'<div class="check"><span>'+esc(r.name)+'</span><b>'+money(r.spent)+'</b></div>').join(''):'<div class="empty">Chưa có giao dịch chi.</div>')+'</div>'}
function transactionTable(rows){if(!rows.length)return '<div class="empty">Chưa có giao dịch trong danh sách.</div>';return '<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Loại</th><th>Danh mục</th><th class="num">Số tiền</th><th>Mục tiêu</th><th>Ghi chú</th><th class="no-print">Thao tác</th></tr></thead><tbody>'+rows.map(t=>{let c=cat(t.categoryId),g=db.goals.find(g=>g.id===t.goalId);return '<tr><td>'+esc(t.date)+'</td><td>'+esc(c?.type==='Tiết kiệm'?'Tiết kiệm · '+t.flow:c?.type||'—')+'</td><td>'+esc(c?.name||'—')+'</td><td class="num">'+money(t.amount)+'</td><td>'+esc(g?.name||'—')+'</td><td>'+esc(t.note||'—')+'</td><td class="no-print"><button class="btn small" data-action="edit" data-kind="transactions" data-id="'+esc(t.id)+'">Sửa</button> <button class="btn small danger" data-action="delete" data-kind="transactions" data-id="'+esc(t.id)+'">Xóa</button></td></tr>'}).join('')+'</tbody></table></div>'}
function transactionsPage(){let rows=db.transactions.filter(t=>t.date.startsWith(selectedMonth)&&[t.note,cat(t.categoryId)?.name,t.amount].some(v=>String(v||'').toLocaleLowerCase('vi').includes(filter.toLocaleLowerCase('vi')))).sort((a,b)=>b.date.localeCompare(a.date));return hero('Nhật ký thu chi','Mỗi lần thu, chi, gửi hoặc rút tiết kiệm ghi một dòng có ngày và danh mục.')+'<div class="card"><div class="toolbar"><button class="btn primary" data-action="new" data-kind="transactions">+ Thêm giao dịch</button>'+monthSelector()+'<input id="search" class="search grow" placeholder="Tìm danh mục, ghi chú, số tiền..." value="'+esc(filter)+'"><button class="btn" data-action="csv" data-kind="transactions">Xuất CSV</button><label class="btn file">Nhập CSV<input type="file" accept=".csv,text/csv" data-import="transactions"></label></div><p class="muted">'+rows.length+' giao dịch tháng '+selectedMonth+' · dữ liệu được cộng theo ngày giao dịch.</p>'+transactionTable(rows)+'</div>'}
function categoriesPage(){let rows=budgetRows(selectedMonth);return hero('Danh mục & hạn mức','Sửa nhóm thu, chi và tiết kiệm; đặt kế hoạch mặc định theo tháng, rồi chỉnh riêng tháng đặc biệt.')+'<div class="card"><div class="toolbar"><button class="btn primary" data-action="new" data-kind="categories">+ Thêm danh mục</button>'+monthSelector()+'<button class="btn" data-action="csv" data-kind="categories">Xuất CSV</button><label class="btn file">Nhập CSV<input type="file" accept=".csv,text/csv" data-import="categories"></label></div><p class="muted">'+rows.length+'/40 danh mục. Tên có thể đổi mà không làm mất liên kết giao dịch vì app dùng mã nội bộ ổn định.</p><div class="table-wrap"><table><thead><tr><th>Danh mục</th><th>Loại</th><th class="num">Kế hoạch tháng</th><th class="num">Thực tế</th><th class="num">Còn lại / chênh</th><th>Trạng thái</th><th class="no-print">Thao tác</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.type)+'</td><td class="num">'+money(r.planned)+'</td><td class="num">'+money(r.spent)+'</td><td class="num">'+money(r.left)+'</td><td>'+badge(r.status)+'</td><td class="no-print"><button class="btn small" data-action="edit" data-kind="categories" data-id="'+esc(r.id)+'">Sửa</button> <button class="btn small" data-action="annual" data-id="'+esc(r.id)+'">12 tháng</button> <button class="btn small danger" data-action="delete" data-kind="categories" data-id="'+esc(r.id)+'">Xóa</button></td></tr>').join('')+'</tbody></table></div></div>'}
function planPage(){let year=selectedMonth.slice(0,4),rows=yearRows(year);return hero('Kế hoạch 12 tháng','Mỗi danh mục có mức mặc định; tháng đặc biệt có thể đặt số riêng để dự kiến thưởng, học phí, du lịch.')+'<div class="card"><div class="toolbar"><h2 class="grow">Năm '+year+'</h2>'+monthSelector()+'<button class="btn" data-action="excel">Xuất bộ Excel</button></div><div class="table-wrap"><table><thead><tr><th>Danh mục</th><th>Loại</th>'+Array.from({length:12},(_,i)=>'<th class="num">T'+(i+1)+'</th>').join('')+'<th class="num">Cả năm</th><th class="no-print">Sửa</th></tr></thead><tbody>'+db.categories.map(c=>{let vals=Array.from({length:12},(_,i)=>plan(c.id,year+'-'+String(i+1).padStart(2,'0')));return '<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.type)+'</td>'+vals.map(v=>'<td class="num">'+money(v)+'</td>').join('')+'<td class="num"><b>'+money(vals.reduce((a,b)=>a+b,0))+'</b></td><td class="no-print"><button class="btn small" data-action="annual" data-id="'+esc(c.id)+'">Chỉnh</button></td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><h2>Kế hoạch tổng theo tháng</h2><div class="table-wrap"><table><thead><tr><th>Tháng</th><th class="num">Thu dự kiến</th><th class="num">Chi dự kiến</th><th class="num">Tiết kiệm dự kiến</th><th class="num">Còn lại dự kiến</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.month)+'</td><td class="num">'+money(r.plan.income)+'</td><td class="num">'+money(r.plan.expense)+'</td><td class="num">'+money(r.plan.saving)+'</td><td class="num">'+money(r.plan.income-r.plan.expense-r.plan.saving)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function goalCards(){return db.goals.map(goalValue).map(g=>'<div class="goal-card"><div class="toolbar"><h3 class="grow">'+esc(g.name)+'</h3>'+badge(g.status)+'</div><p><b>'+money(g.current)+'</b> / '+money(g.target)+'</p>'+progress(g.current,g.target,g.current>g.target)+'<p class="mini">Đã có ban đầu '+money(g.opening)+' · giao dịch ròng '+money(g.net)+' · còn thiếu '+money(g.remaining)+' · hạn '+esc(g.deadline)+'</p><button class="btn small" data-action="edit" data-kind="goals" data-id="'+esc(g.id)+'">Sửa</button> <button class="btn small danger" data-action="delete" data-kind="goals" data-id="'+esc(g.id)+'">Xóa</button></div>').join('')}
function goalsPage(){let unassigned=db.transactions.filter(t=>cat(t.categoryId)?.type==='Tiết kiệm'&&!t.goalId).reduce((a,t)=>a+signedSaving(t),0);return hero('Mục tiêu tiết kiệm','Đặt số tiền và hạn hoàn thành; các lần gửi/rút gắn mục tiêu sẽ cập nhật tiến độ.')+'<div class="card"><div class="toolbar"><h2 class="grow">'+db.goals.length+' mục tiêu</h2><button class="btn primary" data-action="new" data-kind="goals">+ Thêm mục tiêu</button><button class="btn" data-action="csv" data-kind="goals">Xuất CSV</button><label class="btn file">Nhập CSV<input type="file" accept=".csv,text/csv" data-import="goals"></label></div><p class="hint">Tiết kiệm chưa gắn mục tiêu: '+money(unassigned)+'. Khi ghi giao dịch tiết kiệm, chọn mục tiêu để số tiền được cộng vào tiến độ.</p><div class="grid">'+(db.goals.length?goalCards():'<div class="empty">Chưa có mục tiêu.</div>')+'</div></div>'}
function monthReport(){let t=monthTotals(selectedMonth),rows=budgetRows(selectedMonth);return hero('Báo cáo tháng '+selectedMonth,'So sánh kế hoạch với thực tế từng danh mục, xem hạn mức còn lại và khoản cần điều chỉnh.')+'<div class="card"><div class="toolbar"><h2 class="grow">'+esc(db.settings.family||'Chưa đặt tên gia đình')+'</h2>'+monthSelector()+'<button class="btn" data-action="reportCsv">Xuất CSV</button><button class="btn primary" data-action="print">In báo cáo</button></div><div class="grid">'+metric('Tổng thu',money(t.income),'Kế hoạch '+money(rows.filter(r=>r.type==='Thu').reduce((a,r)=>a+r.planned,0)))+metric('Chi sinh hoạt',money(t.expense),'Kế hoạch '+money(rows.filter(r=>r.type==='Chi').reduce((a,r)=>a+r.planned,0)))+metric('Tiết kiệm ròng',money(t.saving),'Kế hoạch '+money(rows.filter(r=>r.type==='Tiết kiệm').reduce((a,r)=>a+r.planned,0)))+metric('Còn lại',money(t.available),'Sau chi và tiết kiệm',t.available<0?'bad':'good')+'</div></div><div class="card"><h2>Từng danh mục</h2><div class="table-wrap"><table><thead><tr><th>Danh mục</th><th>Loại</th><th class="num">Kế hoạch</th><th class="num">Thực tế</th><th class="num">Chênh lệch</th><th class="num">% thực hiện</th><th>Trạng thái</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.type)+'</td><td class="num">'+money(r.planned)+'</td><td class="num">'+money(r.spent)+'</td><td class="num">'+money(r.spent-r.planned)+'</td><td class="num">'+pct(r.ratio)+'</td><td>'+badge(r.status)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function yearlyPage(){let year=selectedMonth.slice(0,4),rows=yearRows(year);return hero('Tổng hợp năm '+year,'Thu, chi, tiết kiệm, tiền còn lại và lũy kế qua 12 tháng. Tháng chưa chốt được đánh dấu riêng.')+'<div class="card"><div class="toolbar"><h2 class="grow">Diễn biến 12 tháng</h2>'+monthSelector()+'<button class="btn" data-action="yearCsv">Xuất CSV</button><button class="btn primary" data-action="print">In báo cáo</button></div><div class="grid">'+metric('Tổng thu',money(sum(rows,'income')))+metric('Tổng chi',money(sum(rows,'expense')))+metric('Tiết kiệm ròng',money(sum(rows,'saving')))+metric('Còn lại cả năm',money(sum(rows,'available')))+'</div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Tháng</th><th class="num">Thu</th><th class="num">Chi</th><th class="num">Tiết kiệm</th><th class="num">Còn lại</th><th class="num">Lũy kế</th><th>Kế hoạch còn lại</th><th>Trạng thái</th><th class="no-print">Chốt</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.month)+'</b></td><td class="num">'+money(r.income)+'</td><td class="num">'+money(r.expense)+'</td><td class="num">'+money(r.saving)+'</td><td class="num '+(r.available<0?'bad':'')+'">'+money(r.available)+'</td><td class="num">'+money(r.acc)+'</td><td>'+money(r.plan.income-r.plan.expense-r.plan.saving)+'</td><td>'+badge(r.closed?'Đã chốt':r.count?'Đang ghi':'Chưa ghi')+'</td><td class="no-print"><button class="btn small" data-action="toggleClose" data-month="'+r.month+'">'+(r.closed?'Mở lại':'Chốt tháng')+'</button></td></tr>').join('')+'</tbody></table></div></div><p class="muted">Chốt tháng chỉ đánh dấu đã soát; vẫn có thể mở lại để sửa giao dịch. Số lũy kế bắt đầu từ 0 đầu năm, chưa cộng số dư tiền mặt/ngân hàng đầu năm.</p>'}

function fieldMarkup(kind,[key,label,type],value){let opts=type==='type'?['Thu','Chi','Tiết kiệm'].map(v=>[v,v]):type==='category'?db.categories.map(c=>[c.id,c.type+' · '+c.name]):type==='flow'?[['Gửi','Gửi tiết kiệm'],['Rút','Rút tiết kiệm']]:type==='goal'?[['','Không gắn mục tiêu'],...db.goals.map(g=>[g.id,g.name])]:null;return '<div class="field" data-field="'+key+'"><label for="f-'+key+'">'+esc(label)+'</label>'+(opts?'<select id="f-'+key+'" name="'+key+'">'+opts.map(([v,t])=>'<option value="'+esc(v)+'" '+(value[key]===v?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>':'<input id="f-'+key+'" name="'+key+'" type="'+(type==='money'?'number':type)+'" '+(type==='money'?'min="0" step="1" inputmode="numeric"':'')+' value="'+esc(value[key]??'')+'">')+'</div>'}

function openEditor(kind,id=null){if(kind==='transactions'&&!db.categories.length){alert('Hãy tạo danh mục trước.');return}let row=id?db[kind].find(x=>x.id===id):null;if(id&&!row)return;editing={kind,id};let defaults=kind==='categories'?{type:'Chi',defaultPlan:0}:kind==='transactions'?{date:today(),categoryId:db.categories.find(c=>c.type==='Chi')?.id||db.categories[0].id,amount:'',flow:'Gửi',goalId:'',note:''}:{target:'',opening:0,deadline:today()};$('#modalTitle').textContent=(row?'Sửa ':'Thêm ')+(kind==='categories'?'danh mục':kind==='transactions'?'giao dịch':'mục tiêu');$('#modalFields').innerHTML=(kind==='categories'?CATEGORY_FIELDS:kind==='transactions'?TX_FIELDS:GOAL_FIELDS).map(f=>fieldMarkup(kind,f,{...defaults,...row})).join('');$('#modalError').textContent='';$('#editor').showModal();if(kind==='transactions')syncTxFields();$('#modalFields input')?.focus()}
function openAnnual(catId){let c=cat(catId);if(!c)return;let year=selectedMonth.slice(0,4);editing={kind:'annual',catId,year};$('#modalTitle').textContent='Kế hoạch 12 tháng · '+c.name+' · '+year;$('#modalFields').innerHTML=Array.from({length:12},(_,i)=>{let month=year+'-'+String(i+1).padStart(2,'0');return '<div class="field"><label for="a-'+i+'">Tháng '+(i+1)+'</label><input id="a-'+i+'" type="number" min="0" step="1" value="'+plan(catId,month)+'"></div>'}).join('');$('#modalError').textContent='';$('#editor').showModal();$('#a-0').focus()}
function saveEditor(){if(!editing)return;if(editing.kind==='annual'){let {catId,year}=editing,values=Array.from({length:12},(_,i)=>$('#a-'+i).value);if(values.some(v=>!integer(v)||Number(v)<0)){$('#modalError').textContent='Mỗi tháng cần số nguyên không âm.';return}let proposed=db.plans.filter(p=>!(p.categoryId===catId&&p.month.startsWith(year+'-')));values.forEach((v,i)=>{let amount=Number(v),month=year+'-'+String(i+1).padStart(2,'0');if(amount!==Number(cat(catId).defaultPlan))proposed.push({id:uid(),categoryId:catId,month,amount})});if(proposed.length>5000){$('#modalError').textContent='Đã vượt giới hạn 5.000 ô kế hoạch.';return}db.plans=proposed;$('#editor').close();persist();return}
  let {kind,id}=editing,fields=kind==='categories'?CATEGORY_FIELDS:kind==='transactions'?TX_FIELDS:GOAL_FIELDS,row={};for(let [key,,type] of fields){let input=$('[name="'+key+'"]',$('#modalFields')),raw=input.disabled?'':input.value.trim();row[key]=type==='money'?raw===''?'':Number(raw):raw}if(kind==='transactions'&&cat(row.categoryId)?.type!=='Tiết kiệm'){row.flow='';row.goalId=''}let old=id?db[kind].find(x=>x.id===id):null,errors=kind==='categories'?categoryErrors(row,id):kind==='transactions'?transactionErrors(row):goalErrors(row,id);if(kind==='categories'&&old&&old.type!==row.type&&db.transactions.some(t=>t.categoryId===old.id))errors.push('Danh mục đã có giao dịch, không thể đổi loại.');if(!old&&db[kind].length>=(kind==='categories'?40:kind==='goals'?50:10000))errors.push('Đã đạt giới hạn dòng.');if(errors.length){$('#modalError').textContent=errors.join(' ');return}if(old)Object.assign(old,row);else db[kind].push({id:uid(),...row});$('#editor').close();persist()}
function deleteRow(kind,id){let row=db[kind].find(x=>x.id===id);if(!row)return;if(kind==='categories'&&(db.transactions.some(t=>t.categoryId===id)||db.plans.some(p=>p.categoryId===id))){alert('Danh mục đang có giao dịch hoặc kế hoạch. Hãy xử lý các dòng liên quan trước.');return}if(kind==='goals'&&db.transactions.some(t=>t.goalId===id)){alert('Mục tiêu đang có giao dịch tiết kiệm. Hãy bỏ liên kết giao dịch trước.');return}if(!confirm('Xóa '+(row.name||row.date)+'?'))return;db[kind]=db[kind].filter(x=>x.id!==id);persist()}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV thiếu dấu nháy đóng.');if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(v=>v!==''))}
function excelDate(v){if(typeof v==='number'&&Number.isFinite(v))return new Date(Date.UTC(1899,11,30)+v*86400000).toISOString().slice(0,10);return String(v??'').trim()}
function recordsFromRows(kind,rows,target){let h=HEADERS[kind];if(!rows||h.some((v,i)=>rows[0]?.[i]!==v))throw Error('Tiêu đề '+kind+' không đúng mẫu.');let output=[];for(let [i,row] of rows.slice(1).entries()){if(!row.some(v=>v!==''&&v!==undefined&&v!==null))continue;if(kind==='categories')output.push({id:uid(),name:String(row[0]??'').trim(),type:String(row[1]??'').trim(),defaultPlan:row[2]===''?'':Number(row[2])});if(kind==='goals')output.push({id:uid(),name:String(row[0]??'').trim(),target:row[1]===''?'':Number(row[1]),opening:row[2]===''?'':Number(row[2]),deadline:excelDate(row[3])});if(kind==='transactions'){let c=target.categories.find(c=>c.name===String(row[1]??'').trim()),g=target.goals.find(g=>g.name===String(row[4]??'').trim());output.push({id:uid(),date:excelDate(row[0]),categoryId:c?.id||'',amount:row[2]===''?'':Number(row[2]),flow:String(row[3]??'').trim(),goalId:row[4]?g?.id||'invalid':'',note:String(row[5]??'').trim()})}}return output}
function workbookToState(book){let settings=book['Cài đặt'];if(!settings||settings[0]?.[0]!=='Thông số')throw Error('Thiếu sheet Cài đặt đúng mẫu.');let s=Object.fromEntries(settings.slice(1).map(r=>[String(r[0]),r[1]])),x=empty();x.settings={family:String(s['Tên gia đình']??''),month:String(s['Tháng mặc định']??'')};x.closedMonths=String(s['Tháng đã chốt']??'').split(';').filter(Boolean);x.categories=recordsFromRows('categories',book['Danh mục'],x);x.goals=recordsFromRows('goals',book['Mục tiêu'],x);let planRows=book['Kế hoạch'];if(!planRows||planRows[0]?.join('|')!=='Tháng|Danh mục|Số tiền')throw Error('Sheet Kế hoạch không đúng mẫu.');x.plans=planRows.slice(1).filter(r=>r.some(v=>v!==''&&v!==undefined&&v!==null)).map(r=>({id:uid(),month:String(r[0]??''),categoryId:x.categories.find(c=>c.name===String(r[1]??''))?.id||'',amount:r[2]===''?'':Number(r[2])}));x.transactions=recordsFromRows('transactions',book['Giao dịch'],x);let errors=validateState(x);if(errors.length)throw Error('Bộ Excel có '+errors.length+' lỗi: '+errors.slice(0,6).join(' '));return x}
async function importCSV(kind,file){let rows=parseCSV(await file.text()),x={...db,[kind]:db[kind].map(r=>({...r}))},incoming=recordsFromRows(kind,rows,x),count=0;for(let r of incoming){if(kind==='categories'||kind==='goals'){let old=x[kind].find(v=>v.name.toLocaleLowerCase('vi')===r.name.toLocaleLowerCase('vi'));if(old){if(kind==='categories'&&old.type!==r.type&&x.transactions.some(t=>t.categoryId===old.id))throw Error('Không thể đổi loại danh mục '+old.name+' vì đã có giao dịch.');Object.assign(old,{...r,id:old.id});count++;continue}}if(kind==='transactions'&&x.transactions.some(t=>t.date===r.date&&t.categoryId===r.categoryId&&t.amount===r.amount&&t.flow===r.flow&&t.goalId===r.goalId&&t.note===r.note))continue;x[kind].push(r);count++}let errors=validateState(x);if(errors.length)throw Error('CSV có '+errors.length+' lỗi: '+errors.slice(0,6).join(' '));if(!count)throw Error('Không có dòng mới hoặc thay đổi để nhập.');if(!confirm('Nhập '+count+' dòng '+kind+' đã kiểm tra (trùng tên danh mục/mục tiêu sẽ cập nhật)?'))return;db=x;persist();alert('Đã nhập '+count+' dòng.')}
function demo(){let x=empty();x.settings.family='Gia đình Minh Họa';let y=selectedMonth.slice(0,4),previous=new Date(Number(y),Number(selectedMonth.slice(5))-2,1),months=[previous.getFullYear()+'-'+String(previous.getMonth()+1).padStart(2,'0'),selectedMonth];let id=(name)=>x.categories.find(c=>c.name===name).id;x.goals=[{id:uid(),name:'Quỹ học tập cho con',target:30000000,opening:8000000,deadline:(Number(y)+1)+'-06-30'},{id:uid(),name:'Quỹ dự phòng',target:50000000,opening:10000000,deadline:(Number(y)+1)+'-12-31'}];for(let month of months){let rows=[['05','Lương',22000000,'','Lương tháng'],['10','Lương',15000000,'','Lương thứ hai'],['06','Nhà ở, điện nước, internet',3500000,'','Tiền nhà'],['12','Nhà ở, điện nước, internet',1200000,'','Điện nước mạng'],['08','Con cái, học tập',2800000,'','Học phí'],['09','Đi lại, xăng xe',1200000,'','Đi lại'],['14','Mua sắm',950000,'','Đồ dùng'],['07','Tiết kiệm, đầu tư',3000000,'Gửi','Quỹ dự phòng'],['18','Tiết kiệm, đầu tư',2000000,'Gửi','Quỹ học tập cho con']];for(let [day,name,amount,flow,note] of rows){x.transactions.push({id:uid(),date:month+'-'+day,categoryId:id(name),amount,flow,goalId:flow?x.goals.find(g=>g.name===note)?.id||'':'',note:flow?'Chuyển vào '+note:note})}for(let day of [2,5,9,13,17,22])x.transactions.push({id:uid(),date:month+'-'+String(day).padStart(2,'0'),categoryId:id('Ăn uống, đi chợ'),amount:750000+day*10000,flow:'',goalId:'',note:'Đi chợ'});x.transactions.push({id:uid(),date:month+'-20',categoryId:id('Giải trí, du lịch'),amount:650000,flow:'',goalId:'',note:'Cuối tuần'})}x.settings.month=selectedMonth;return x}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){navigate(b.dataset.page);return}let a=b.dataset.action,kind=b.dataset.kind,id=b.dataset.id;if(a==='new')openEditor(kind);if(a==='edit')openEditor(kind,id);if(a==='delete')deleteRow(kind,id);if(a==='annual')openAnnual(id);if(a==='toggleClose'){let month=b.dataset.month;if(db.closedMonths.includes(month))db.closedMonths=db.closedMonths.filter(m=>m!==month);else if(confirm('Đánh dấu đã soát tháng '+month+'?'))db.closedMonths.push(month);persist()}if(a==='csv')exportCSV(kind);if(a==='reportCsv')reportCSV();if(a==='yearCsv')yearCSV();if(a==='excel')excelExport();if(a==='backup')backup();if(a==='saveHtml')saveHtml();if(a==='print')window.print();if(a==='saveSettings'){let s={family:$('#s-family').value.trim(),month:$('#s-month').value},errors=settingsErrors(s);if(errors.length){$('#settingsError').textContent=errors.join(' ');return}db.settings=s;selectedMonth=s.month;persist()}if(a==='demo'){if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng dữ liệu mẫu?'))return;db=demo();persist();navigate('overview')}if(a==='clear'){if(!confirm('Xóa toàn bộ giao dịch, kế hoạch riêng, mục tiêu và tháng đã chốt? Giữ danh mục/hạn mức mặc định.'))return;db.transactions=[];db.plans=[];db.goals=[];db.closedMonths=[];persist();navigate('overview')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;let pos=e.target.selectionStart;render();let el=$('#search');el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id==='monthSelect'){if(!monthOK(e.target.value))return;selectedMonth=e.target.value;db.settings.month=selectedMonth;persist()}if(e.target.name==='categoryId')syncTxFields();if(e.target.dataset.import){let kind=e.target.dataset.import,file=e.target.files[0];if(!file)return;try{if(kind==='json'){let x=clean(JSON.parse(await file.text()));if(!x)throw Error('File không đúng ứng dụng hoặc phiên bản.');let errors=validateState(x);if(errors.length)throw Error('Bản sao lưu có '+errors.length+' lỗi: '+errors.slice(0,5).join(' '));if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu?'))return;db=x;selectedMonth=db.settings.month;persist();alert('Đã khôi phục.')}else if(kind==='xlsx'){let x=workbookToState(await Excel.read(file));if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng '+x.transactions.length+' giao dịch?'))return;db=x;selectedMonth=db.settings.month;persist();alert('Đã nhập bộ Excel.')}else await importCSV(kind,file)}catch(err){alert(err.message)}finally{e.target.value=''}}});
