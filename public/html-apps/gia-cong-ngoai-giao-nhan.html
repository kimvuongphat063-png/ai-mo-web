function metrics(o){let sent=o.openSent+dispatches(o.id).reduce((a,e)=>a+e.qty,0),good=o.openGood+receipts(o.id).reduce((a,e)=>a+e.good,0),defect=o.openDefect+receipts(o.id).reduce((a,e)=>a+e.defect,0),paid=o.openPaid+payments(o.id).reduce((a,e)=>a+e.amount*(e.kind==='Hoàn tiền'?-1:1),0),remaining=sent-good-defect,earned=Math.round(good*o.rate),balance=earned-paid,defectPct=good?defect/good*100:0,overdue=remaining>0?Math.max(0,dayDiff(db.settings.asof,o.due)):0;return {sent,good,defect,paid,remaining,earned,balance,defectPct,overdue}}
function state(o){let m=metrics(o);if(m.remaining<0)return 'Lệch số liệu';if(m.remaining===0)return 'Đã nhận đủ';if(m.overdue>0)return 'Trễ hạn';if(m.good+m.defect>0)return 'Nhận một phần';return 'Chờ nhận'}
function warnings(o){let m=metrics(o),w=[];if(m.remaining<0)w.push(`Số nhận vượt số giao ${number(-m.remaining)}: cần đối chiếu hồ sơ nguồn`);if(m.overdue>0)w.push(`Trễ hạn nhận ${m.overdue} ngày`);if(m.balance<0)w.push(`Đã trả vượt tiền gia công ${money(-m.balance)}`);if(m.good>0&&m.defectPct>db.settings.defectThreshold)w.push(`Tỷ lệ lỗi ${number(m.defectPct)}% vượt ngưỡng ${number(db.settings.defectThreshold)}%`);return w}
function totals(){let rows=db.orders.map(metrics);return {orders:rows.length,sent:rows.reduce((n,m)=>n+m.sent,0),good:rows.reduce((n,m)=>n+m.good,0),defect:rows.reduce((n,m)=>n+m.defect,0),remaining:rows.reduce((n,m)=>n+m.remaining,0),earned:rows.reduce((n,m)=>n+m.earned,0),paid:rows.reduce((n,m)=>n+m.paid,0),balance:rows.reduce((n,m)=>n+m.balance,0),late:db.orders.filter(o=>metrics(o).overdue>0).length,highDefect:db.orders.filter(o=>warnings(o).some(w=>w.startsWith('Tỷ lệ'))).length}}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!Number.isFinite(x.settings.defectThreshold)||x.settings.defectThreshold<0||x.settings.defectThreshold>100||!Array.isArray(x.orders)||!Array.isArray(x.dispatches)||!Array.isArray(x.receipts)||!Array.isArray(x.payments)||!Array.isArray(x.audit))return 'Cấu trúc/cài đặt không hợp lệ.';
 let ids=new Set(),codes=new Set();for(let o of x.orders){if(!o.id||ids.has(o.id)||!o.code||codes.has(o.code.toUpperCase())||!o.partner||!o.product||!dateOK(o.date)||!dateOK(o.due)||o.due<o.date||!Number.isFinite(o.openSent)||o.openSent<=0||!Number.isFinite(o.openGood)||o.openGood<0||!Number.isFinite(o.openDefect)||o.openDefect<0||!Number.isSafeInteger(o.rate)||o.rate<0||!Number.isSafeInteger(o.openPaid)||o.openPaid<0||String(o.note||'').length>1500)return 'Lệnh gia công không hợp lệ hoặc trùng mã.';ids.add(o.id);codes.add(o.code.toUpperCase())}
 let all=new Set();for(let e of x.dispatches){if(!e.id||all.has(e.id)||!ids.has(e.orderId)||!dateOK(e.date)||!Number.isFinite(e.qty)||e.qty<=0||!e.reason)return 'Giao bổ sung không hợp lệ.';all.add(e.id)}for(let e of x.receipts){if(!e.id||all.has(e.id)||!ids.has(e.orderId)||!dateOK(e.date)||!Number.isFinite(e.good)||e.good<0||!Number.isFinite(e.defect)||e.defect<0||e.good+e.defect<=0)return 'Lượt nhận không hợp lệ.';all.add(e.id)}for(let e of x.payments){if(!e.id||all.has(e.id)||!ids.has(e.orderId)||!dateOK(e.date)||!Number.isSafeInteger(e.amount)||e.amount<=0||!['Thanh toán','Hoàn tiền'].includes(e.kind))return 'Thanh toán không hợp lệ.';all.add(e.id)}
 for(let o of x.orders){let sent=o.openSent+x.dispatches.filter(e=>e.orderId===o.id).reduce((n,e)=>n+e.qty,0),received=o.openGood+o.openDefect+x.receipts.filter(e=>e.orderId===o.id).reduce((n,e)=>n+e.good+e.defect,0),paid=o.openPaid+x.payments.filter(e=>e.orderId===o.id).reduce((n,e)=>n+(e.kind==='Hoàn tiền'?-e.amount:e.amount),0);if(received>sent+.001&&(!o.sourceOverReceived||received-sent>Math.max(0,o.openGood+o.openDefect-o.openSent)+.001))return 'Số nhận đạt và lỗi vượt lượng đã giao.';if(paid<0)return 'Tiền đã thanh toán không được âm.';if(x.dispatches.concat(x.receipts,x.payments).some(e=>e.orderId===o.id&&e.date<o.date))return 'Giao dịch không được trước ngày lập lệnh.'}
 for(let a of x.audit){if(!a.id||all.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';all.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên thiết bị. Hãy xuất JSON hoặc HTML kèm dữ liệu.')}render();return true}
function log(action,note='',orderId=''){db.audit.push({id:uid(),at:new Date().toISOString(),action,note,orderId})}
const btn=(label,action,cls='',id='')=>`<button type="button" class="btn ${cls}" data-act="${action}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`;
const badge=s=>`<span class="badge ${s==='Đã nhận đủ'?'done':s==='Trễ hạn'?'late':s==='Lệch số liệu'?'anomaly':s==='Nhận một phần'?'partial':'waiting'}">${esc(s)}</span>`;
const panel=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;
function home(){let t=totals(),late=db.orders.filter(o=>metrics(o).overdue>0).sort((a,b)=>metrics(b).overdue-metrics(a).overdue),need=db.orders.filter(o=>metrics(o).remaining>0).sort((a,b)=>a.due.localeCompare(b.due));return `<section class="masthead"><div><div class="eyebrow">◈ BẢNG ĐIỀU PHỐI GIA CÔNG NGOÀI</div><h1>Giao rõ. Nhận đủ.<br>Thanh toán đúng.</h1><p>Mỗi lệnh đi từ giao hàng đến nhận đạt, ghi lỗi và đối chiếu tiền gia công. Mở lệnh để xem toàn bộ lịch sử.</p><div class="buttons">${btn('＋ Lập lệnh gia công','newOrder','primary')}${btn('Xem sổ lệnh','orders','soft')}</div></div><div class="mast-stat"><span>GIÁ TRỊ GIA CÔNG ĐÃ GHI NHẬN</span><strong>${money(t.earned)}</strong><small>${t.orders} lệnh · ${number(t.good)} đơn vị nhận đạt</small></div></section><div class="kpis"><div><small>Đã giao</small><b>${number(t.sent)}</b><span>đơn vị</span></div><div><small>Nhận đạt</small><b>${number(t.good)}</b><span>đơn vị</span></div><div><small>Hàng lỗi</small><b>${number(t.defect)}</b><span>đơn vị</span></div><div><small>Chưa nhận</small><b>${number(t.remaining)}</b><span>đơn vị</span></div><div><small>Còn phải trả*</small><b>${money(t.balance)}</b><span>theo đơn giá từng lệnh</span></div></div><div class="duo">${panel('⏳ Sắp đến hạn & trễ hạn',need.length?need.slice(0,8).map(o=>{let m=metrics(o);return `<div class="rowlink"><button class="textlink" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)} · ${esc(o.product)}</button><div>${badge(state(o))}<small>${esc(o.partner)} · còn ${number(m.remaining)} · hạn ${dateFmt(o.due)}</small></div></div>`}).join(''):'<p class="empty">Không có hàng đang chờ nhận.</p>')}${panel('⚠️ Cần xử lý',late.length?late.slice(0,7).map(o=>`<div class="rowlink"><button class="textlink" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)}</button><div><strong>${metrics(o).overdue} ngày trễ</strong><small>${esc(o.partner)} · ${number(metrics(o).remaining)} còn chưa nhận</small></div></div>`).join(''):'<p class="empty">Không có lệnh trễ hạn nhận.</p>')}</div><p class="footnote">* Số dư có thể âm khi đã trả trước/vượt giá trị hàng đạt; xem từng lệnh để đối chiếu. Tổng lượng gộp nhiều sản phẩm chỉ dùng để tham khảo. Nếu mẫu có lệnh nhận vượt giao, tổng “chưa nhận” đã bù cả số âm; hãy xem cảnh báo từng lệnh.</p>`}
function ordersPage(){let rows=db.orders.filter(o=>(filter==='all'||state(o)===filter)&&(!query||[o.code,o.partner,o.product].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="heading"><div><div class="eyebrow">SỔ THEO DÕI</div><h1>📒 Lệnh gia công</h1><p>Lọc theo tiến độ, mở lệnh để ghi nhận và thanh toán từng lần.</p></div>${btn('＋ Lập lệnh mới','newOrder','primary')}</div><section class="panel"><div class="filters"><label>Tìm mã lệnh, đối tác, sản phẩm<input id="search" placeholder="Ví dụ: GC-001, xưởng may…" value="${esc(query)}"></label><label>Tình trạng<select id="filter"><option value="all" ${filter==='all'?'selected':''}>Tất cả</option>${['Chờ nhận','Nhận một phần','Trễ hạn','Đã nhận đủ','Lệch số liệu'].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="tablewrap"><table><thead><tr><th>Lệnh / đối tác</th><th>Sản phẩm</th><th>Ngày giao</th><th>Hạn nhận</th><th>Giao</th><th>Đạt / lỗi</th><th>Chưa nhận</th><th>Tiền gia công</th><th>Đã trả</th><th>Còn trả</th><th>Cảnh báo</th></tr></thead><tbody>${rows.map(o=>{let m=metrics(o),w=warnings(o);return `<tr><td><button class="textlink" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)}</button><small>${esc(o.partner)}</small>${badge(state(o))}</td><td>${esc(o.product)}</td><td>${dateFmt(o.date)}</td><td>${dateFmt(o.due)}</td><td>${number(m.sent)}</td><td>${number(m.good)} / ${number(m.defect)}</td><td><b>${number(m.remaining)}</b></td><td>${money(m.earned)}</td><td>${money(m.paid)}</td><td>${money(m.balance)}</td><td>${w.length?`<span class="warn">${w.length} cần xem</span>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="11" class="empty">Chưa có lệnh phù hợp. Tạo lệnh đầu tiên để bắt đầu.</td></tr>'}</tbody></table></div></section>`}
function detail(){let o=order(selected);if(!o){page='orders';return ordersPage()}let m=metrics(o),w=warnings(o),hist=[...dispatches(o.id).map(e=>({...e,kind:'Giao bổ sung'})),...receipts(o.id).map(e=>({...e,kind:'Nhận hàng'})),...payments(o.id).map(e=>({...e,kind:e.kind}))].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="heading"><div><button class="textlink back" data-act="orders">← Sổ lệnh</button><div class="eyebrow">HỒ SƠ GIA CÔNG · ${esc(o.code)}</div><h1>${esc(o.product)}</h1><p>${esc(o.partner)} · giao ${dateFmt(o.date)} · hạn nhận ${dateFmt(o.due)} · ${badge(state(o))}</p></div><div class="buttons no-print">${btn('＋ Giao thêm','newDispatch','soft',o.id)}${btn('📥 Nhận hàng','newReceipt','primary',o.id)}${btn('💳 Thanh toán','newPayment','soft',o.id)}${btn('Sửa thông tin','editOrder','ghost',o.id)}${btn('🖨 In hồ sơ','print','ghost')}</div></div><div class="flow"><div><span>01 · ĐÃ GIAO</span><b>${number(m.sent)}</b><small>đơn vị</small></div><div><span>02 · ĐÃ NHẬN ĐẠT</span><b>${number(m.good)}</b><small>đơn vị</small></div><div><span>03 · HÀNG LỖI</span><b>${number(m.defect)}</b><small>tỷ lệ ${number(m.defectPct)}% trên hàng đạt</small></div><div><span>04 · CHƯA NHẬN</span><b>${number(m.remaining)}</b><small>đơn vị</small></div></div><div class="duo">${panel('🧾 Đối chiếu thanh toán',`<dl><dt>Đơn giá gia công</dt><dd>${money(o.rate)}</dd><dt>Tiền gia công</dt><dd>${money(m.earned)}</dd><dt>Đã thanh toán</dt><dd>${money(m.paid)}</dd><dt>${m.balance<0?'Đã trả trước/vượt':'Còn phải trả'}</dt><dd><b>${money(Math.abs(m.balance))}</b></dd></dl><p class="footnote">Tiền gia công = số nhận đạt × đơn giá lưu trên lệnh. Hàng lỗi không tính vào tiền gia công.</p>`)}${panel('⚑ Kiểm soát & thông tin',`<p>${w.length?w.map(x=>`<span class="alertline">${esc(x)}</span>`).join(''):'<span class="okay">Không có cảnh báo theo ngày báo cáo hiện tại.</span>'}</p><dl><dt>Đối tác</dt><dd>${esc(o.partner)}</dd><dt>Mã lệnh</dt><dd>${esc(o.code)}</dd><dt>Ngày giao</dt><dd>${dateFmt(o.date)}</dd><dt>Hạn nhận</dt><dd>${dateFmt(o.due)}</dd><dt>Ghi chú</dt><dd>${esc(o.note||'—')}</dd></dl>`)}</div>${panel('📦 Số liệu đầu kỳ từ hồ sơ',`<div class="opening"><div><small>Giao ban đầu</small><b>${number(o.openSent)}</b></div><div><small>Nhận đạt đã ghi</small><b>${number(o.openGood)}</b></div><div><small>Lỗi đã ghi</small><b>${number(o.openDefect)}</b></div><div><small>Đã trả đã ghi</small><b>${money(o.openPaid)}</b></div></div><p class="footnote">Số liệu mẫu gốc không có ngày riêng cho từng lần nhận/chi tiền. App giữ ở đầu kỳ, không tự tạo ngày giao dịch giả.</p>`)}${panel('🕘 Nhật ký giao · nhận · thanh toán',hist.length?`<div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Loại</th><th>Giao thêm</th><th>Nhận đạt</th><th>Hàng lỗi</th><th>Thanh toán</th><th>Chứng từ</th><th>Ghi chú</th></tr></thead><tbody>${hist.map(e=>`<tr><td>${dateFmt(e.date)}</td><td>${esc(e.kind)}</td><td>${e.qty?number(e.qty):'—'}</td><td>${e.good?number(e.good):'—'}</td><td>${e.defect?number(e.defect):'—'}</td><td>${e.amount?money(e.amount):'—'}</td><td>${esc(e.doc||'—')}</td><td>${esc(e.reason||e.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Chưa có phát sinh mới sau số liệu đầu kỳ.</p>')}${panel('🖋 Nhật ký chỉnh sửa',db.audit.filter(a=>a.orderId===o.id).slice().reverse().map(a=>`<div class="rowlink"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.note||'—')}</small></div>`).join('')||'<p class="empty">Chưa có nhật ký.</p>')}`}
function reportsPage(){let t=totals(),partners=[...new Set(db.orders.map(o=>o.partner))].map(p=>{let oo=db.orders.filter(o=>o.partner===p),mm=oo.map(metrics);return {name:p,orders:oo.length,good:mm.reduce((n,m)=>n+m.good,0),defect:mm.reduce((n,m)=>n+m.defect,0),remaining:mm.reduce((n,m)=>n+m.remaining,0),earned:mm.reduce((n,m)=>n+m.earned,0),balance:mm.reduce((n,m)=>n+m.balance,0)}}).sort((a,b)=>b.balance-a.balance);return `<div class="heading"><div><div class="eyebrow">BẢNG ĐIỀU HÀNH</div><h1>📊 Báo cáo gia công</h1><p>Ngày đối chiếu: ${dateFmt(db.settings.asof)} · ngưỡng lỗi ${number(db.settings.defectThreshold)}%</p></div>${btn('⬇ Tải Excel','exportExcel','primary')}</div><div class="kpis"><div><small>Số lệnh</small><b>${t.orders}</b></div><div><small>Chưa nhận</small><b>${number(t.remaining)}</b></div><div><small>Tiền gia công</small><b>${money(t.earned)}</b></div><div><small>Còn phải trả</small><b>${money(t.balance)}</b></div><div><small>Lệnh trễ</small><b>${t.late}</b></div></div>${panel('🤝 Theo đối tác',`<div class="tablewrap"><table><thead><tr><th>Đối tác</th><th>Lệnh</th><th>Nhận đạt</th><th>Lỗi</th><th>Còn nhận</th><th>Tiền gia công</th><th>Còn phải trả</th></tr></thead><tbody>${partners.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.orders}</td><td>${number(p.good)}</td><td>${number(p.defect)}</td><td>${number(p.remaining)}</td><td>${money(p.earned)}</td><td>${money(p.balance)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa có dữ liệu.</td></tr>'}</tbody></table></div>`)}<div class="duo">${panel('⚠️ Cảnh báo cần xử lý',db.orders.filter(o=>warnings(o).length).map(o=>`<div class="rowlink"><button class="textlink" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)}</button><small>${esc(warnings(o).join('; '))}</small></div>`).join('')||'<p class="empty">Không có cảnh báo.</p>')}${panel('💰 Đối tác có số dư',partners.map(p=>`<div class="barrow"><span>${esc(p.name)}</span><b>${money(p.balance)}</b><i style="width:${Math.max(2,Math.round(Math.max(0,p.balance)/Math.max(1,...partners.map(x=>Math.max(0,x.balance)))*100))}%"></i></div>`).join('')||'<p class="empty">Chưa có đối tác.</p>')}</div><p class="footnote">Số dư âm là tiền trả trước/vượt tiền gia công, không tự động bù trừ giữa các lệnh. Chỉ dùng theo dõi nội bộ.</p>`}
function dataPage(){return `<div class="heading"><h1>💾 Dữ liệu & sao lưu</h1></div><div class="duo">${panel('Xuất dữ liệu',`<p>Dữ liệu đang nằm trên thiết bị/trình duyệt này. Xuất bản sao trước khi đổi máy hoặc xóa dữ liệu trình duyệt.</p><div class="buttons">${btn('⬇ JSON đầy đủ','exportJSON','primary')}${btn('⬇ HTML kèm dữ liệu','exportHTML','soft')}${btn('⬇ Excel báo cáo','exportExcel','soft')}</div>`)}${panel('Nhập & mẫu tham chiếu',`<p>Nhập JSON sẽ thay toàn bộ dữ liệu hiện tại. Mẫu tham chiếu có 20 lệnh.</p><div class="buttons">${btn('⬆ Nhập JSON','importJSON','soft')}${btn('Nạp 20 lệnh mẫu','loadSample','soft')}${btn('Xóa dữ liệu','clearData','danger')}</div>`)}</div>${panel('Tình trạng hiện tại',`<p>${db.orders.length} lệnh · ${db.dispatches.length} lượt giao bổ sung · ${db.receipts.length} lượt nhận · ${db.payments.length} giao dịch tiền · phiên bản dữ liệu ${VERSION}.</p><p>File HTML gốc không mang theo dữ liệu lưu trong trình duyệt. Hãy tải <b>HTML kèm dữ liệu</b> khi cần chuyển sang máy khác.</p>`)}`}
function settingsPage(){return `<div class="heading"><h1>⚙ Cài đặt cảnh báo</h1></div>${panel('Tham số đối chiếu',`<form id="settingsForm" class="formgrid"><label>Ngày báo cáo<input name="asof" type="date" required value="${esc(db.settings.asof)}"></label><label>Ngưỡng cảnh báo lỗi (%)<input name="defectThreshold" type="number" min="0" max="100" step="0.1" required value="${db.settings.defectThreshold}"></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="footnote">Tỷ lệ lỗi = số lỗi / số nhận đạt × 100, theo công thức file tham chiếu. Thay đổi ngày báo cáo sẽ cập nhật số ngày trễ.</p>`)}`}
function guidePage(){return `<div class="heading"><h1>❔ Cách sử dụng</h1></div>${panel('Quy trình làm việc',`<ol><li>Lập lệnh: mã, đối tác, sản phẩm, ngày giao, hạn nhận, số giao, đơn giá.</li><li>Khi giao thêm, mở hồ sơ và bấm <b>Giao thêm</b>; nhập số lượng và lý do.</li><li>Khi nhận hàng, ghi riêng số đạt và lỗi, ngày, chứng từ. App chặn tổng nhận vượt tổng giao.</li><li>Ghi thanh toán từng lần. Trường hợp đối tác hoàn tiền, chọn <b>Hoàn tiền</b>.</li><li>Xem cảnh báo quá hạn, lỗi cao và thanh toán vượt; in hồ sơ hoặc tải báo cáo.</li><li>Xuất JSON hoặc HTML kèm dữ liệu định kỳ để sao lưu.</li></ol>`)}${panel('Công thức & giới hạn',`<p><b>Còn chưa nhận:</b> số giao − số nhận đạt − số lỗi. <b>Tiền gia công:</b> nhận đạt × đơn giá gia công của lệnh. <b>Còn phải trả:</b> tiền gia công − tiền đã trả. <b>Ngày trễ:</b> ngày báo cáo − hạn nhận, chỉ khi còn chưa nhận.</p><p>Hàng lỗi được tính là đã nhận nhưng không được tính tiền gia công theo công thức nguồn. Việc xử lý hoặc giao lại hàng lỗi cần chứng từ, thỏa thuận và giao bổ sung mới.</p><p>App phục vụ theo dõi nội bộ, không thay hợp đồng, hóa đơn hoặc hồ sơ kế toán.</p>`)}`}
function render(){let views={home,orders:ordersPage,detail,reports:reportsPage,data:dataPage,settings:settingsPage,guide:guidePage};$('#screen').innerHTML=(views[page]||home)();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='detail'&&b.dataset.page==='orders'))}
const field=(label,name,value='',type='text',extra='')=>`<label>${label}<input name="${name}" value="${esc(value)}" type="${type}" ${extra}></label>`;
const area=(label,name,value='')=>`<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1500">${esc(value)}</textarea></label>`;
const choose=(label,name,items)=>`<label>${label}<select name="${name}">${items.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`;
function showForm(kind,id=''){let t='',f='';draft={kind,id};if(kind==='order'){let o=order(id)||{};t=id?'Sửa lệnh gia công':'Lập lệnh gia công';f=field('Mã lệnh *','code',o.code||`GC-${String(db.orders.length+1).padStart(3,'0')}`,'text','required maxlength="50"')+field('Đối tác gia công *','partner',o.partner,'text','required maxlength="160"')+field('Sản phẩm *','product',o.product,'text','required maxlength="160"')+field('Ngày giao *','date',o.date||today(),'date','required')+field('Hạn nhận *','due',o.due||today(),'date','required')+field('Số giao ban đầu *','openSent',o.openSent??1,'number',`required min="0.01" step="0.01" ${id?'readonly':''}`)+field('Đơn giá gia công (₫) *','rate',o.rate??0,'number',`required min="0" step="1" ${id&&(receipts(id).length||o.openGood)?'readonly':''}`)+area('Ghi chú / điều khoản','note',o.note)}
 else if(kind==='dispatch'){let o=order(id);t='Giao bổ sung · '+o.code;f=`<p class="full hint">Đã giao ${number(metrics(o).sent)}. Ghi thêm sẽ tăng số còn cần nhận.</p>`+field('Ngày giao thêm *','date',today(),'date',`required min="${o.date}"`)+field('Số lượng *','qty',1,'number','required min="0.01" step="0.01"')+field('Số chứng từ','doc','','text','maxlength="100"')+area('Lý do / ghi chú *','reason','')}
 else if(kind==='receipt'){let o=order(id),m=metrics(o);t='Nhận hàng · '+o.code;f=`<p class="full hint">Còn chưa nhận: ${number(m.remaining)}. Hàng đạt được tính tiền; hàng lỗi tính là đã nhận nhưng không tính tiền.</p>`+field('Ngày nhận *','date',today(),'date',`required min="${o.date}"`)+field('Số nhận đạt *','good',m.remaining,'number','required min="0" step="0.01"')+field('Số hàng lỗi *','defect',0,'number','required min="0" step="0.01"')+field('Số chứng từ','doc','','text','maxlength="100"')+field('Người nhận','actor','','text','maxlength="100"')+area('Ghi chú','note','')}
 else if(kind==='payment'){let o=order(id),m=metrics(o);t='Thanh toán · '+o.code;f=`<p class="full hint">Tiền gia công ${money(m.earned)} · đã trả ${money(m.paid)} · còn phải trả ${money(m.balance)}. Có thể ghi tiền ứng trước; app sẽ cảnh báo trả vượt.</p>`+field('Ngày *','date',today(),'date',`required min="${o.date}"`)+choose('Loại giao dịch','payKind',['Thanh toán','Hoàn tiền'])+field('Số tiền (₫) *','amount',Math.max(m.balance,0),'number','required min="1" step="1"')+field('Chứng từ','doc','','text','maxlength="100"')+field('Phương thức','method','','text','maxlength="100"')+area('Ghi chú','note','')}
 $('#modalTitle').textContent=t;$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
const val=(f,n)=>String(new FormData(f).get(n)||'').trim(),num=(f,n)=>Number(val(f,n));
function handleForm(e){e.preventDefault();let f=e.target,{kind,id}=draft,before=clone(db);try{if(kind==='order'){let o=order(id),code=val(f,'code'),date=val(f,'date'),due=val(f,'due'),rate=num(f,'rate'),openSent=num(f,'openSent');if(!code||!val(f,'partner')||!val(f,'product')||!dateOK(date)||!dateOK(due)||due<date||!Number.isSafeInteger(rate)||rate<0||!Number.isFinite(openSent)||openSent<=0)throw Error('Kiểm tra mã, đối tác, sản phẩm, ngày, lượng giao và đơn giá.');if(db.orders.some(x=>x.id!==id&&x.code.toUpperCase()===code.toUpperCase()))throw Error('Mã lệnh đã tồn tại.');if(o){if((o.openGood>0||receipts(id).length)&&rate!==o.rate)throw Error('Đơn giá đã dùng để tính hàng nhận; không thể thay đổi.');Object.assign(o,{code,partner:val(f,'partner'),product:val(f,'product'),date,due,rate,note:val(f,'note')})}else{o={id:uid(),code,partner:val(f,'partner'),product:val(f,'product'),date,due,openSent,openGood:0,openDefect:0,rate,openPaid:0,note:val(f,'note')};db.orders.push(o)}log(id?'Sửa lệnh':'Lập lệnh',o.code,o.id);selected=o.id;page='detail'}
 else if(kind==='dispatch'){let o=order(id),date=val(f,'date'),qty=num(f,'qty'),reason=val(f,'reason');if(!dateOK(date)||date<o.date||!Number.isFinite(qty)||qty<=0||!reason)throw Error('Cần ngày, số lượng và lý do giao thêm.');db.dispatches.push({id:uid(),orderId:id,date,qty,doc:val(f,'doc'),reason});log('Giao bổ sung',`${number(qty)} · ${reason}`,id);selected=id;page='detail'}
 else if(kind==='receipt'){let o=order(id),date=val(f,'date'),good=num(f,'good'),defect=num(f,'defect');if(!dateOK(date)||date<o.date||!Number.isFinite(good)||good<0||!Number.isFinite(defect)||defect<0||good+defect<=0)throw Error('Ngày hoặc lượng nhận không hợp lệ.');if(good+defect>metrics(o).remaining+.001)throw Error('Tổng nhận đạt và lỗi vượt số chưa nhận.');db.receipts.push({id:uid(),orderId:id,date,good,defect,doc:val(f,'doc'),actor:val(f,'actor'),note:val(f,'note')});log('Nhận hàng',`Đạt ${number(good)}, lỗi ${number(defect)}`,id);selected=id;page='detail'}
 else if(kind==='payment'){let o=order(id),date=val(f,'date'),amount=num(f,'amount'),payKind=val(f,'payKind');if(!dateOK(date)||date<o.date||!Number.isSafeInteger(amount)||amount<=0||!['Thanh toán','Hoàn tiền'].includes(payKind))throw Error('Ngày, loại giao dịch hoặc số tiền không hợp lệ.');if(payKind==='Hoàn tiền'&&amount>metrics(o).paid)throw Error('Hoàn tiền vượt số đã trả.');db.payments.push({id:uid(),orderId:id,date,amount,kind:payKind,doc:val(f,'doc'),method:val(f,'method'),note:val(f,'note')});log(payKind,money(amount),id);selected=id;page='detail'}let err=validate(db);if(err)throw Error(err);$('#editor').close();draft=null;save()}catch(ex){db=before;$('#formError').textContent=ex.message}}
function sampleData(){let x=empty(),offset=s=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};for(let r of OUTSOURCING_SAMPLE.gc){x.orders.push({id:uid(),date:offset(r[0]),code:r[1],partner:r[2],product:r[3],openSent:r[4],openGood:r[5],openDefect:r[6],rate:r[7],openPaid:r[8],due:offset(r[9]),note:'Số liệu mẫu từ file gốc; ngày nhận và ngày thanh toán riêng không được cung cấp.',sourceOverReceived:r[5]+r[6]>r[4]})}return x}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'gia-cong-ngoai-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'gia-cong-ngoai-kem-du-lieu.html')}
function sheets(){return [{name:'LenhGiaCong',rows:[['Mã lệnh','Ngày giao','Đối tác','Sản phẩm','Giao','Nhận đạt','Lỗi','Chưa nhận','Đơn giá','Tiền gia công','Đã trả','Còn trả','Hạn nhận','Trễ ngày','Cảnh báo'],...db.orders.map(o=>{let m=metrics(o);return [o.code,o.date,o.partner,o.product,m.sent,m.good,m.defect,m.remaining,o.rate,m.earned,m.paid,m.balance,o.due,m.overdue,warnings(o).join('; ')]})]},{name:'GiaoThem',rows:[['Mã lệnh','Ngày','Số lượng','Chứng từ','Lý do'],...db.dispatches.map(e=>[order(e.orderId).code,e.date,e.qty,e.doc,e.reason])]},{name:'NhanHang',rows:[['Mã lệnh','Ngày','Nhận đạt','Hàng lỗi','Chứng từ','Người nhận','Ghi chú'],...db.receipts.map(e=>[order(e.orderId).code,e.date,e.good,e.defect,e.doc,e.actor,e.note])]},{name:'ThanhToan',rows:[['Mã lệnh','Ngày','Loại','Số tiền','Chứng từ','Phương thức','Ghi chú'],...db.payments.map(e=>[order(e.orderId).code,e.date,e.kind,e.amount,e.doc,e.method,e.note])]},{name:'NhatKy',rows:[['Thời điểm','Lệnh','Thao tác','Ghi chú'],...db.audit.map(a=>[a.at,order(a.orderId)?.code||'',a.action,a.note])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Ngưỡng lỗi %'],[db.settings.asof,db.settings.defectThreshold]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'gia-cong-ngoai-bao-cao.xlsx')}
function act(action,id){if(['home','orders','reports','data','settings','guide'].includes(action)){page=action;render();return}if(action==='openOrder'){selected=id;page='detail';render();return}if(action==='newOrder'||action==='editOrder')return showForm('order',action==='editOrder'?id:'');if(action==='newDispatch')return showForm('dispatch',id);if(action==='newReceipt')return showForm('receipt',id);if(action==='newPayment')return showForm('payment',id);if(action==='print')return print();if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if(db.orders.length&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;let x=sampleData(),err=validate(x);if(err)return alert('Mẫu không hợp lệ: '+err);db=x;page='home';save();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên thiết bị này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='home';save();return}if(action==='saveSettings'){let f=$('#settingsForm'),asof=f.elements.asof.value,defectThreshold=Number(f.elements.defectThreshold.value);if(!dateOK(asof)||!Number.isFinite(defectThreshold)||defectThreshold<0||defectThreshold>100)return alert('Cài đặt không hợp lệ.');db.settings={asof,defectThreshold};save()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',handleForm);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let x=JSON.parse(await file.text()),err=validate(x);if(err)throw Error(err);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=x;page='home';save()}catch(ex){alert('Không nhập được: '+ex.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}});render();



</script></body></html>
