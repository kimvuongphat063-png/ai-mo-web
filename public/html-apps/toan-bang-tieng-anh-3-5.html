function ordered(list,seed){function hash(t){let h=2166136261;for(let c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}return [...list].sort((a,b)=>hash(seed+a.id)-hash(seed+b.id))}
function start(review=''){
 let current=session();if(current&&!current.ended&&!confirm('Thay buổi học đang làm bằng buổi mới?'))return;
 let source=review==='wrong'?wrong():review==='due'?due():pool();if(!source.length){alert('Chưa có câu phù hợp để luyện.');return}
 let seed=day(Date.now())+'|'+data.activeProfile+'|'+data.history.length+'|'+review+'|'+data.choice.kind+'|'+data.choice.topic,items=ordered(source,seed).sort((a,b)=>rank(a)-rank(b)).slice(0,data.choice.mode==='exam'?10:8);
 data.sessions[data.activeProfile]={id:uid(),profileId:data.activeProfile,grade:profile().grade,mode:data.choice.mode,kind:data.choice.kind,topic:data.choice.topic,review,ids:items.map(q=>q.id),index:0,answers:{},checked:{},startedAt:Date.now(),deadline:Date.now()+180000,ended:false,seed};
 page='play';save(true);window.scrollTo(0,0)
}
function currentQuestion(){let s=session();return BY_ID.get(s?.ids[s.index])}
function left(){return Math.max(0,Math.ceil((session().deadline-Date.now())/1000))}
function options(q){return ordered((q.kind==='truth'?['Đúng','Sai']:q.c).map((v,i)=>({id:'o'+i,value:v})),session().seed+q.id)}
function answer(value){let s=session(),q=currentQuestion();if(!s||s.ended||s.checked[q.id])return;if(s.mode==='exam'&&!left()){finish();return}s.answers[q.id]=String(value);if(s.mode==='learn')s.checked[q.id]=true;save(true)}
function play(){
 let s=session();if(!s)return hero('Chưa có buổi học','Chọn lớp và dạng bài để bắt đầu.')+'<div class="card"><button class="btn primary" data-page="home">Chọn bài</button></div>';
 if(s.ended){detailId=s.id;return result()}
 let q=currentQuestion();if(!q)return '<div class="card">Không tìm thấy câu hỏi.</div>';let given=s.answers[q.id]||'',checked=!!s.checked[q.id],choices='';
 if(q.kind==='choice'||q.kind==='truth')choices='<div class="choices">'+options(q).map(o=>'<button class="btn '+(given===o.value?'chosen ':'')+(checked&&o.value===q.a?'correct':checked&&given===o.value&&!correct(q,given)?'incorrect':'')+'" data-answer="'+esc(o.value)+'" '+(checked?'disabled':'')+'>'+esc(o.value)+'</button>').join('')+'</div>';
 else choices='<div class="field"><label for="numberAnswer">Điền số vào đáp án</label><input id="numberAnswer" inputmode="decimal" autocomplete="off" value="'+esc(given)+'" '+(checked?'disabled':'')+'></div><div class="toolbar" style="margin-top:10px"><button class="btn primary" data-action="answerNumber" '+(checked?'disabled':'')+'>Lưu câu trả lời</button></div>';
 let n=Object.keys(s.answers).length;
 return hero('Buổi học · lớp '+s.grade,(s.mode==='exam'?'Thử thách 3 phút':'Luyện có lời giải')+' · '+KIND[s.kind]+' · '+TOPIC[s.topic])+
 '<div class="card"><div class="toolbar"><span class="badge">Câu '+(s.index+1)+' / '+s.ids.length+'</span><span class="badge">'+esc(KIND[q.kind])+'</span><span class="badge">'+esc(TOPIC[q.topic])+'</span>'+(s.mode==='exam'?'<span class="timer" id="timer">Còn '+left()+' giây</span>':'')+'</div><div class="barline"><i style="width:'+Math.round(100*n/s.ids.length)+'%"></i></div><h2 class="question">'+esc(q.p)+'</h2><div class="toolbar no-print"><button class="btn" data-action="speak">🔊 Nghe đề</button><button class="btn" data-action="speakSlow">Nghe chậm</button><button class="btn" data-action="stopSpeak">Dừng</button></div>'+choices+
 (s.mode==='learn'&&checked?'<div class="feedback '+(correct(q,given)?'':'bad')+'" role="status"><b>'+(correct(q,given)?'Chính xác!':'Đáp án: '+esc(q.a))+'</b><p>'+esc(q.e)+'</p></div>':'')+
 '<div class="toolbar no-print" style="margin-top:17px">'+(s.mode==='learn'&&given&&!checked?'<button class="btn primary" data-action="check">Kiểm tra câu này</button>':'')+'<button class="btn" data-action="next">'+(s.index===s.ids.length-1?'Xem kết quả':'Câu tiếp')+'</button><button class="btn" data-action="submit">Nộp bài</button></div><div class="dotnav no-print">'+s.ids.map((qid,i)=>'<button class="btn small '+(i===s.index?'active':s.answers[qid]?'done':'')+'" data-index="'+i+'" aria-label="Câu '+(i+1)+'">'+(i+1)+'</button>').join('')+'</div></div>';
}
function finish(){let s=session();if(!s||s.ended)return;s.ended=true;clearInterval(timer);timer=null;let detail=[],score=0;data.mastery[s.profileId]||={};let states=data.mastery[s.profileId];for(let id of s.ids){let q=BY_ID.get(id),ok=correct(q,s.answers[id]);if(ok)score++;let old=states[id]||{streak:0,seen:0},streak=ok?old.streak+1:0,days=ok?[1,3,7,14,30][Math.min(streak-1,4)]:0;states[id]={seen:old.seen+1,streak,wrong:!ok,due:Date.now()+days*86400000};detail.push({id,answer:s.answers[id]||'',correct:ok})}
 data.history.unshift({id:s.id,profileId:s.profileId,grade:s.grade,mode:s.mode,kind:s.kind,topic:s.topic,review:s.review,at:new Date().toISOString(),seconds:Math.min(180,Math.round((Date.now()-s.startedAt)/1000)),score,total:s.ids.length,detail});data.history=data.history.slice(0,500);detailId=s.id;page='result';save(true)}
function tick(){clearInterval(timer);let s=session();if(!s||s.ended||s.mode!=='exam')return;timer=setInterval(()=>{let x=session();if(!x||x.ended){clearInterval(timer);return}if(Date.now()>=x.deadline){finish();return}let t=$('#timer');if(t)t.textContent='Còn '+left()+' giây'},400)}
function result(){let r=data.history.find(x=>x.id===detailId)||history()[0];if(!r)return hero('Chưa có kết quả','Hãy bắt đầu một buổi học.');return hero('Kết quả '+r.score+'/'+r.total+' câu đúng','Lớp '+r.grade+' · '+new Date(r.at).toLocaleString('vi-VN'))+
 '<div class="card"><div class="grid">'+metric('Đúng',String(r.score))+metric('Cần ôn',String(r.total-r.score))+metric('Thời gian',r.seconds+' giây')+'</div><div class="toolbar no-print" style="margin-top:17px"><button class="btn primary" data-page="home">Chọn bài tiếp</button><button class="btn" data-action="reviewWrong">Ôn câu sai</button><button class="btn" data-action="print">In kết quả</button></div></div>'+
 r.detail.map((d,i)=>{let q=BY_ID.get(d.id);return '<div class="card"><span class="badge '+(d.correct?'ok':'loss')+'">Câu '+(i+1)+' · '+(d.correct?'Đúng':'Cần ôn')+'</span><h2>'+esc(q?.p||d.id)+'</h2><p>Em trả lời: <b>'+esc(d.answer||'Bỏ trống')+'</b></p><p>Đáp án: <b>'+esc(q?.a||'')+'</b></p><p class="muted">'+esc(q?.e||'')+'</p></div>'}).join('')}
function wrongPage(){let w=wrong(),d=due();return hero('Ôn câu sai',w.length+' câu sai · '+d.length+' câu đến hạn ôn')+'<div class="card"><div class="toolbar"><button class="btn primary" data-action="reviewWrong" '+(w.length?'':'disabled')+'>Luyện câu sai</button><button class="btn" data-action="reviewDue" '+(d.length?'':'disabled')+'>Luyện câu đến hạn</button></div>'+(w.length?w.slice(0,60).map(q=>'<div class="check"><span><b>'+esc(KIND[q.kind])+' · '+esc(TOPIC[q.topic])+'</b><br>'+esc(q.p)+'</span><span>'+esc(q.a)+'</span></div>').join(''):'<div class="empty">Chưa có câu sai. Hãy luyện một buổi trước.</div>')+(w.length>60?'<p class="muted">Đang hiện 60/'+w.length+' câu.</p>':'')+'</div>'}
function progress(){
 let rows=history(),all=rows.flatMap(x=>x.detail),hits=all.filter(x=>x.correct).length,last=rows.slice(0,14).reverse();
 return hero('Tiến bộ của '+profile().name,'Kết quả theo dạng bài, lịch sử và nhịp học.')+
 '<div class="card"><div class="grid">'+metric('Lượt luyện',String(rows.length))+metric('Tỷ lệ đúng',all.length?Math.round(100*hits/all.length)+'%':'—',hits+'/'+all.length+' câu')+metric('Mục từng gặp',String(Object.keys(mastery()).length))+metric('Câu cần ôn',String(wrong().length))+'</div></div>'+
 '<div class="grid two"><div class="card"><h2>14 lượt gần nhất</h2>'+(last.length?'<div class="mini-chart">'+last.map(x=>'<div title="'+new Date(x.at).toLocaleString('vi-VN')+' · '+x.score+'/'+x.total+'"><i style="height:'+Math.max(2,110*x.score/x.total)+'px"></i><small>'+x.score+'/'+x.total+'</small></div>').join('')+'</div>':'<div class="empty">Chưa có buổi học.</div>')+'</div><div class="card"><h2>Theo dạng bài</h2>'+['choice','number','truth'].map(k=>{let a=all.filter(x=>BY_ID.get(x.id)?.kind===k),n=a.filter(x=>x.correct).length;return '<div class="check"><span>'+KIND[k]+' · '+a.length+' câu</span><b>'+(a.length?Math.round(100*n/a.length)+'%':'—')+'</b></div>'}).join('')+'</div></div>'+
 '<div class="card"><div class="toolbar"><h2 class="grow">Lịch sử</h2><button class="btn" data-action="csv">Xuất CSV</button></div>'+(rows.length?'<div class="table-wrap"><table><thead><tr><th>Ngày giờ</th><th>Lớp</th><th>Dạng</th><th>Chế độ</th><th class="num">Kết quả</th><th></th></tr></thead><tbody>'+rows.slice(0,200).map(x=>'<tr><td>'+new Date(x.at).toLocaleString('vi-VN')+'</td><td>'+x.grade+'</td><td>'+esc(KIND[x.kind])+'</td><td>'+(x.mode==='exam'?'Thử thách':'Luyện')+'</td><td class="num">'+x.score+'/'+x.total+'</td><td><button class="btn small" data-view="'+esc(x.id)+'">Xem</button></td></tr>').join('')+'</tbody></table></div>'+(rows.length>200?'<p class="muted">Hiển thị 200/'+rows.length+' buổi. Xuất CSV để xem đủ.</p>':''):'<div class="empty">Chưa có lượt luyện.</div>')+'</div>';
}
function glossary(){return hero('Từ khóa Toán tiếng Anh','Đọc nghĩa trước khi làm bài; có thể nghe phát âm bằng giọng sẵn trên máy.')+'<div class="card"><div class="toolbar"><input class="search" id="wordSearch" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt" aria-label="Tìm từ khóa"></div><div class="glossary" id="wordList">'+wordList('')+'</div></div><div class="card"><h2>Mẹo đọc đề</h2><p>Đọc câu hỏi cuối trước: <b>How many</b> hỏi số lượng, <b>How much</b> hỏi giá trị. Sau đó tìm từ chỉ phép tính: <b>in all</b> thường là cộng, <b>left</b> là trừ, <b>each</b> có thể là nhân, <b>shared equally</b> là chia.</p></div>'}
function wordList(query){let k=query.trim().toLocaleLowerCase('vi');return WORDS.filter(([a,b])=>!k||a.includes(k)||b.toLocaleLowerCase('vi').includes(k)).map(([a,b])=>'<div><b>'+esc(a)+'</b><span>'+esc(b)+'</span><p><button class="btn small" data-say="'+esc(a)+'" aria-label="Nghe '+esc(a)+'">🔊 Nghe</button></p></div>').join('')||'<p>Không có từ phù hợp.</p>'}
function speak(text,slow=false){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){alert('Trình duyệt này chưa hỗ trợ giọng đọc.');return}let voices=speechSynthesis.getVoices().filter(v=>/^en(?:-|$)/i.test(v.lang)),voice=voices.find(v=>v.lang.toLowerCase()==='en-us')||voices[0];speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=voice?.lang||'en-US';if(voice)u.voice=voice;u.rate=slow?.75:.95;speechSynthesis.speak(u)}
function profiles(){return hero('Học sinh trong gia đình','Mỗi em có lớp, lịch sử, câu sai và buổi đang làm riêng.')+'<div class="card"><div class="toolbar"><h2 class="grow">'+data.profiles.length+' hồ sơ</h2><button class="btn primary" data-action="newProfile">+ Thêm học sinh</button></div><div class="grid">'+data.profiles.map(p=>'<div class="profile-card '+(p.id===data.activeProfile?'active':'')+'"><h3>'+esc(p.name)+' · lớp '+p.grade+'</h3><p>'+data.history.filter(x=>x.profileId===p.id).length+' buổi học</p><div class="toolbar"><button class="btn small" data-action="selectProfile" data-id="'+esc(p.id)+'">'+(p.id===data.activeProfile?'Đang chọn':'Chọn')+'</button><button class="btn small" data-action="editProfile" data-id="'+esc(p.id)+'">Sửa</button><button class="btn small danger" data-action="deleteProfile" data-id="'+esc(p.id)+'" '+(data.profiles.length===1?'disabled':'')+'>Xóa</button></div></div>').join('')+'</div></div>'}
function dataPage(){return hero('Dữ liệu & sao lưu','Dữ liệu học nằm trên thiết bị này; không cần tài khoản hay API.')+'<div class="card"><h2>Lưu và mang sang máy khác</h2><div class="toolbar"><button class="btn primary" data-action="saveHtml">Tải HTML kèm tiến độ</button><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="csv">Xuất lịch sử CSV</button></div><p class="muted">Sau khi học thêm, tải lại HTML kèm tiến độ hoặc sao lưu JSON mới.</p></div><div class="card"><h2>Khôi phục và làm mới</h2><div class="toolbar"><label class="btn file">Khôi phục JSON<input type="file" accept=".json,application/json" data-import="json"></label><button class="btn danger" data-action="clearProfile">Xóa tiến độ học sinh đang chọn</button><button class="btn danger" data-action="clearAll">Xóa toàn bộ dữ liệu</button></div><p class="hint">Khôi phục sẽ thay dữ liệu hiện có. Hãy sao lưu trước.</p></div><div class="card"><h2>Nguồn bài</h2><p>180 bài toán gốc từ HTML Toán bằng Tiếng Anh 3–5 anh cung cấp, mở thành 540 mục gồm trắc nghiệm, điền số và đúng/sai. Bản gốc có 90 mệnh đề đúng và 90 mệnh đề sai.</p></div>'}
function guide(){return hero('Cách sử dụng','Đọc đề, nhận diện phép tính, làm bài và xem cách giải.')+'<div class="grid two"><div class="card"><h2>6 bước</h2><ol><li>Chọn đúng hồ sơ và lớp 3, 4 hoặc 5.</li><li>Chọn dạng bài, chủ đề hoặc để Tổng hợp.</li><li>Dùng Luyện có lời giải để học từng câu.</li><li>Chọn Thử thách 3 phút để tự làm tối đa 10 câu.</li><li>Ôn câu sai và câu đến hạn trong trang Ôn câu sai.</li><li>Xem tiến bộ, sao lưu JSON hoặc tải HTML kèm dữ liệu.</li></ol></div><div class="card"><h2>Cách chấm</h2><p>Mỗi đáp án đúng được 1 điểm. Điền số chấp nhận dấu chấm hoặc dấu phẩy thập phân; không chấp nhận chữ hay đơn vị. Bài đúng/sai hỏi mệnh đề “Proposed answer”.</p><p>Câu đúng được hẹn ôn sau 1, 3, 7, 14 hoặc 30 ngày; câu sai được ưu tiên trong lần học sau.</p></div></div><div class="card"><h2>Giọng đọc và phạm vi</h2><p>Nút nghe dùng giọng đọc có sẵn trong trình duyệt/máy, không gửi dữ liệu đến LLM. Nếu máy chưa có giọng tiếng Anh thì chất lượng và khả năng phát âm có thể khác nhau.</p><p>Nội dung và lời giải nên được giáo viên rà trước khi phát hành rộng.</p></div>'}
function render(){let titles={home:'Chọn bài',play:'Buổi đang học',result:'Kết quả',wrong:'Ôn câu sai',progress:'Tiến bộ',glossary:'Từ khóa Toán',profiles:'Học sinh',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$('#topSub').textContent=profile().name+' · lớp '+profile().grade+' · offline';$$('[data-page]',$('.side-nav')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=page==='home'?home():page==='play'?play():page==='result'?result():page==='wrong'?wrongPage():page==='progress'?progress():page==='glossary'?glossary():page==='profiles'?profiles():page==='data'?dataPage():guide();tick()}
function openProfile(id=null){editing=id;let p=id?data.profiles.find(x=>x.id===id):null;$('#modalTitle').textContent=p?'Sửa học sinh':'Thêm học sinh';$('#p-name').value=p?.name||'';$('#p-grade').value=String(p?.grade||3);$('#modalError').textContent='';$('#editor').showModal();$('#p-name').focus()}
function saveProfile(){let name=$('#p-name').value.trim(),grade=Number($('#p-grade').value);if(!name||name.length>40){$('#modalError').textContent='Tên cần dài từ 1 đến 40 ký tự.';return}if(![3,4,5].includes(grade)){ $('#modalError').textContent='Chọn lớp 3, 4 hoặc 5.';return}if(data.profiles.some(p=>p.id!==editing&&p.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi'))){$('#modalError').textContent='Tên học sinh đã có.';return}if(editing){let p=data.profiles.find(x=>x.id===editing);p.name=name;p.grade=grade}else{if(data.profiles.length>=10){$('#modalError').textContent='Tối đa 10 học sinh.';return}let p={id:uid(),name,grade};data.profiles.push(p);data.activeProfile=p.id}$('#editor').close();data.choice={kind:'all',topic:'all',mode:'learn'};page='profiles';save(true)}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(){let rows=[['Học sinh','Ngày giờ','Lớp','Dạng','Chủ đề','Chế độ','Câu hỏi','Trả lời','Đáp án','Đúng']];for(let a of data.history){let p=data.profiles.find(x=>x.id===a.profileId);for(let d of a.detail){let q=BY_ID.get(d.id);rows.push([p?.name||'',a.at,a.grade,KIND[q?.kind]||'',TOPIC[q?.topic]||'',a.mode,q?.p||'',d.answer,q?.a||'',d.correct?'Có':'Không'])}}return '\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function backup(){download('ai-mo-toan-tieng-anh-sao-luu.json','application/json;charset=utf-8',JSON.stringify(data,null,2))}
function saveHtml(){let copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(data))));download('ai-mo-toan-tieng-anh-kem-tien-do.html','text/html;charset=utf-8','<!doctype html>\n'+copy.outerHTML)}
function validate(x){if(!shape(x)||!x.profiles.length||x.profiles.length>10||x.history.length>500||!x.profiles.some(p=>p.id===x.activeProfile))return false;let ids=new Set();for(let p of x.profiles){if(!p.id||ids.has(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name.length>40||![3,4,5].includes(p.grade))return false;ids.add(p.id)}for(let a of x.history){if(!ids.has(a.profileId)||!Number.isFinite(Date.parse(a.at))||!Array.isArray(a.detail)||!a.detail.every(d=>BY_ID.has(d.id)))return false}for(let [pid,s] of Object.entries(x.sessions)){if(!ids.has(pid)||!s||!Array.isArray(s.ids)||s.ids.length>10||!s.ids.every(id=>BY_ID.has(id))||!Number.isInteger(s.index)||s.index<0||s.index>=s.ids.length)return false}return true}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-grade],[data-kind],[data-topic],[data-mode],[data-answer],[data-index],[data-view],[data-say]');if(!b)return;
 if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return}
 if(b.dataset.grade){let g=Number(b.dataset.grade);if(session()&&!session().ended&&!confirm('Đổi lớp khi đang làm bài? Buổi đang làm vẫn giữ theo lớp cũ.'))return;profile().grade=g;data.choice.topic='all';page='home';save(true);return}
 if(b.dataset.kind){data.choice.kind=b.dataset.kind;data.choice.topic='all';save(true);return}
 if(b.dataset.topic){data.choice.topic=b.dataset.topic;save(true);return}
 if(b.dataset.mode){data.choice.mode=b.dataset.mode;save(true);return}
 if(b.dataset.answer!==undefined){answer(b.dataset.answer);return}
 if(b.dataset.index!==undefined){let s=session();if(!s||s.ended)return;s.index=Number(b.dataset.index);save(true);return}
 if(b.dataset.view){detailId=b.dataset.view;page='result';render();return}
 if(b.dataset.say){speak(b.dataset.say);return}
 let a=b.dataset.action;
 if(a==='start')start();if(a==='reviewWrong')start('wrong');if(a==='reviewDue')start('due');
 if(a==='resume'){let s=session();if(s?.mode==='exam'&&s.deadline<=Date.now())finish();else{page='play';render()}}
 if(a==='answerNumber'){let v=$('#numberAnswer')?.value.trim();if(!v){alert('Hãy nhập một số.');return}answer(v)}
 if(a==='check'){let s=session(),q=currentQuestion();if(!s.answers[q.id]){alert('Hãy trả lời câu này trước.');return}s.checked[q.id]=true;save(true)}
 if(a==='next'){let s=session();if(s.index===s.ids.length-1)finish();else{s.index++;save(true)}}
 if(a==='submit'){if(confirm('Nộp bài và xem kết quả?'))finish()}
 if(a==='speak')speak(currentQuestion()?.p);if(a==='speakSlow')speak(currentQuestion()?.p,true);if(a==='stopSpeak'&&'speechSynthesis'in window)speechSynthesis.cancel();
 if(a==='newProfile')openProfile();if(a==='editProfile')openProfile(b.dataset.id);if(a==='saveProfile')saveProfile();if(a==='closeModal')$('#editor').close();
 if(a==='selectProfile'){data.activeProfile=b.dataset.id;data.choice={kind:'all',topic:'all',mode:'learn'};page='home';save(true)}
 if(a==='deleteProfile'){let p=data.profiles.find(x=>x.id===b.dataset.id);if(!p||data.profiles.length<2)return;if(!confirm('Xóa hồ sơ '+p.name+' cùng lịch sử và câu sai?'))return;data.profiles=data.profiles.filter(x=>x.id!==p.id);data.history=data.history.filter(x=>x.profileId!==p.id);delete data.mastery[p.id];delete data.sessions[p.id];if(data.activeProfile===p.id)data.activeProfile=data.profiles[0].id;save(true)}
 if(a==='backup')backup();if(a==='csv')download('ai-mo-toan-tieng-anh-lich-su.csv','text/csv;charset=utf-8',csv());if(a==='saveHtml')saveHtml();if(a==='print')window.print();
 if(a==='clearProfile'){let p=profile();if(!confirm('Xóa tiến độ của '+p.name+'?'))return;data.history=data.history.filter(x=>x.profileId!==p.id);delete data.mastery[p.id];delete data.sessions[p.id];page='home';save(true)}
 if(a==='clearAll'){if(!confirm('Xóa toàn bộ học sinh và tiến độ trên máy này?'))return;data=blank();page='home';save(true)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='numberAnswer'){e.preventDefault();$('#screen [data-action="answerNumber"]')?.click()}});
document.addEventListener('input',e=>{if(e.target.id==='wordSearch')$('#wordList').innerHTML=wordList(e.target.value)});
document.addEventListener('change',async e=>{if(e.target.dataset.import!=='json')return;let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!validate(x))throw Error('File sao lưu không đúng ứng dụng hoặc dữ liệu không hợp lệ.');if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu?'))return;data=x;page='home';save(true);alert('Đã khôi phục dữ liệu.')}catch(err){alert(err.message)}finally{e.target.value=''}});
if(session()?.mode==='exam'&&!session().ended&&session().deadline<=Date.now())finish();
render();
</script></body></html>
