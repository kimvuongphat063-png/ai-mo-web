function settingsPage(){return hero('⚙️ Cài đặt','Tên đơn vị, ngày xem và thời gian nhắc trước hạn.')+'<section class="card"><div class="formgrid">'+field('company','Tên đơn vị','text',db.settings.company)+field('asof','Ngày xem (trống = hôm nay)','date',db.settings.asof)+field('remindContract','Nhắc hợp đồng trước (ngày)','number',db.settings.remindContract)+field('remindPayment','Nhắc thanh toán trước (ngày)','number',db.settings.remindPayment)+'</div><p><button class="btn primary" data-action="settings">Lưu cài đặt</button></p><p class="notice">Ngày xem chỉ đổi cảnh báo; không sửa các ngày trên hợp đồng và khoản thanh toán.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Sao lưu trước khi nạp mẫu, nhập Excel hoặc chuyển máy.')+'<section class="card"><div class="grid">'+metric('Hợp đồng',db.contracts.length)+metric('Đợt thanh toán',db.installments.length)+metric('Khoản đã trả/thu',db.payments.length)+'</div><p class="notice warn">File HTML gốc không tự mang dữ liệu lưu trên trình duyệt. Dùng HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV hợp đồng</button></div><p class="muted">Excel gồm 4 sheet: hợp đồng, đợt, lần thanh toán và cài đặt.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>14 hợp đồng/giấy tờ, 11 đợt và 6 khoản đã thanh toán. Ngày mẫu được dời tương đối như app gốc để luôn có dữ liệu sắp hạn khi thử.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Cách sử dụng','Theo dõi từng hồ sơ, hạn hiệu lực, đợt và lần trả/thu thực tế.')+'<section class="card"><h2>Quy trình</h2><ol><li>Tạo hợp đồng hoặc giấy tờ, nhập ngày ký, hiệu lực, hết hạn và người phụ trách.</li><li>Chọn chiều Thu, Chi hoặc Theo dõi. Đây là phân loại quản trị để báo cáo.</li><li>Thêm các đợt thanh toán có hạn và số tiền riêng.</li><li>Khi thanh toán, ghi từng khoản vào đợt; app cộng số đã trả/thu và tính phần còn lại.</li><li>Mỗi sáng mở Cần xử lý để xem hợp đồng sắp hết hạn và đợt chưa thanh toán.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu định kỳ.</li></ol><h2>Lưu ý</h2><p>Cờ “Tự gia hạn” chỉ tạo nhắc xác nhận khi quá hạn, không tự kéo dài ngày kết thúc. Mẫu nguồn không cho biết hình thức thanh toán nên các khoản mẫu ghi “Không rõ từ mẫu gốc”. App không lưu bản scan hợp đồng và không đưa ra kết luận pháp lý về hiệu lực hoặc nghĩa vụ.</p></section>'}
function render(){let names={dashboard:'Tổng quan',reminders:'Cần xử lý',contracts:'Hợp đồng & giấy tờ',installments:'Đợt thanh toán',payments:'Lần thanh toán',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,reminders:remindersPage,contracts:contractsPage,installments:installmentsPage,payments:paymentsPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Theo dõi hợp đồng')+'</b> · '+esc(names[page])+' · '+showDate(asof())+'</div>'+views[page]()}
function openModal(type,id='',target=''){
  if(type==='installment'&&!db.contracts.length){alert('Hãy tạo hợp đồng trước.');return}
  if(type==='payment'&&!db.installments.length){alert('Hãy tạo đợt thanh toán trước.');return}
  if(type==='payment'&&!id&&!db.installments.some(i=>remaining(db,i)>0)){alert('Tất cả các đợt đã thanh toán đủ.');return}
  let list=db[{contract:'contracts',installment:'installments',payment:'payments'}[type]],old=list.find(x=>x.id===id)||{};modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+({contract:'hợp đồng / giấy tờ',installment:'đợt thanh toán',payment:'khoản trả / thu'}[type]);let h='';
  if(type==='contract')h=field('no','Số / mã hợp đồng *','text',old.no||'')+field('type','Loại','select','',options(TYPES,old.type||TYPES[0]))+field('partner','Đối tác / người liên quan *','text',old.partner||'')+field('owner','Người phụ trách','text',old.owner||'')+field('description','Nội dung','textarea',old.description||'')+field('signed','Ngày ký','date',old.signed||today())+field('effective','Ngày hiệu lực','date',old.effective||today())+field('end','Ngày hết hạn (để trống nếu không thời hạn)','date',old.end||'')+field('value','Giá trị hợp đồng (đ)','number',old.value??0)+field('direction','Chiều tiền','select','',options(DIRECTIONS,old.direction||defaultDirection(old.type||TYPES[0])))+field('autoRenew','Tự gia hạn trong điều khoản?','select','',opt('no','Không',old.autoRenew?'yes':'no')+opt('yes','Có',old.autoRenew?'yes':'no'))+field('note','Ghi chú','textarea',old.note||'');
  if(type==='installment')h=field('contractId','Hợp đồng *','select','',contractOpts(old.contractId||target))+field('seq','Số thứ tự đợt *','number',old.seq??1)+field('due','Ngày đến hạn *','date',old.due||today())+field('amount','Số tiền phải thanh toán (đ)','number',old.amount??0)+field('note','Ghi chú điều khoản / mốc','textarea',old.note||'');
  if(type==='payment')h=field('installmentId','Đợt thanh toán *','select','',installmentOpts(old.installmentId||target))+field('date','Ngày trả / thu *','date',old.date||today())+field('amount','Số tiền (đ)','number',old.amount??0)+field('method','Hình thức','select','',options(METHODS,old.method||METHODS[0]))+field('reference','Mã chứng từ / giao dịch','text',old.reference||'')+field('note','Ghi chú','textarea',old.note||'');
  if(id)h+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bản ghi này</button></div>';
  $('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal();
}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){
  if(!modal)return;let{type,id}=modal,x={},error='';
  if(type==='contract'){x={no:v('no'),type:v('type'),partner:v('partner'),description:v('description'),signed:v('signed'),effective:v('effective'),end:v('end'),value:int(v('value')),owner:v('owner'),direction:v('direction'),autoRenew:v('autoRenew')==='yes',note:v('note')};if(!x.no||!TYPES.includes(x.type)||!x.partner||x.signed&&!validDate(x.signed)||x.effective&&!validDate(x.effective)||x.end&&!validDate(x.end)||x.effective&&x.end&&x.effective>x.end||!safe(x.value)||!DIRECTIONS.includes(x.direction))error='Số, đối tác, ngày, giá trị hoặc chiều tiền không hợp lệ.';if(db.contracts.some(c=>c.id!==id&&c.no.toLocaleLowerCase('vi')===x.no.toLocaleLowerCase('vi')))error='Số hợp đồng đã có.'}
  if(type==='installment'){x={contractId:v('contractId'),seq:int(v('seq')),due:v('due'),amount:int(v('amount')),note:v('note')};if(!contract(x.contractId)||!Number.isSafeInteger(x.seq)||x.seq<1||x.seq>1000||!validDate(x.due)||!safe(x.amount)||x.amount===0)error='Hợp đồng, số đợt, ngày hoặc số tiền không hợp lệ.';if(db.installments.some(i=>i.id!==id&&i.contractId===x.contractId&&i.seq===x.seq))error='Số thứ tự đợt bị trùng trong hợp đồng.'}
  if(type==='payment'){x={installmentId:v('installmentId'),date:v('date'),amount:int(v('amount')),method:v('method'),reference:v('reference'),note:v('note')};if(!installment(x.installmentId)||!validDate(x.date)||!safe(x.amount)||x.amount===0||!METHODS.includes(x.method))error='Đợt, ngày, số tiền hoặc hình thức không hợp lệ.'}
  if(error){$('#modalError').textContent=error;return}let key={contract:'contracts',installment:'installments',payment:'payments'}[type],d={...db,[key]:db[key].slice()},list=d[key];if(id){let i=list.findIndex(a=>a.id===id);list[i]={...list[i],...x}}else list.push({id:uid(),...x});
  if(!validBackup(d)){$('#modalError').textContent='Dữ liệu trùng, sai liên kết hoặc tổng đã thanh toán vượt số tiền của đợt.';return}db=d;closeModal();save();
}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('theo-doi-hop-dong-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Số HĐ','Loại','Đối tác','Nội dung','Ngày ký','Hiệu lực','Hết hạn','Giá trị','Người phụ trách','Tự gia hạn','Chiều','Đã lên lịch','Đã trả/thu','Còn của đợt','Trạng thái']];for(let c of db.contracts){let s=contractStats(db,c);rows.push([c.no,c.type,c.partner,c.description,c.signed,c.effective,c.end,c.value,c.owner,c.autoRenew?'Có':'Không',c.direction,s.scheduled,s.paid,s.due,status(db,c)])}let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('theo-doi-hop-dong.csv',body,'text/csv;charset=utf-8')}
function excelSheets(){return[
  {name:'Hop dong',rows:[['Mã dòng','Số HĐ','Loại','Đối tác','Nội dung','Ngày ký','Hiệu lực','Hết hạn','Giá trị','Phụ trách','Tự gia hạn','Chiều','Ghi chú'],...db.contracts.map(c=>[c.id,c.no,c.type,c.partner,c.description,c.signed,c.effective,c.end,c.value,c.owner,c.autoRenew?'Có':'Không',c.direction,c.note])]},
  {name:'Dot thanh toan',rows:[['Mã đợt','Mã HĐ','Thứ tự','Đến hạn','Số tiền','Ghi chú'],...db.installments.map(i=>[i.id,i.contractId,i.seq,i.due,i.amount,i.note])]},
  {name:'Lan thanh toan',rows:[['Mã khoản','Mã đợt','Ngày','Số tiền','Hình thức','Chứng từ','Ghi chú'],...db.payments.map(p=>[p.id,p.installmentId,p.date,p.amount,p.method,p.reference,p.note])]},
  {name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]}
]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='theo-doi-hop-dong.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
const optionalDate=v=>String(v??'').trim()?(parseDate(v)||'INVALID'):'';
function parsedExcel(sheets){for(let [name,head] of [['Hop dong','Mã dòng'],['Dot thanh toan','Mã đợt'],['Lan thanh toan','Mã khoản']])if(!sheets[name]||sheets[name][0]?.[0]!==head)throw Error('Cần workbook do app xuất với ba bảng liên kết.');let d=blank();
  for(let r of sheets['Hop dong'].slice(1)){if(!String(r[0]??'').trim())continue;d.contracts.push({id:String(r[0]).trim(),no:String(r[1]??'').trim(),type:String(r[2]??'').trim(),partner:String(r[3]??'').trim(),description:String(r[4]??''),signed:optionalDate(r[5]),effective:optionalDate(r[6]),end:optionalDate(r[7]),value:int(r[8]),owner:String(r[9]??''),autoRenew:String(r[10]??'').trim()==='Có',direction:String(r[11]??'').trim(),note:String(r[12]??'')})}
  for(let r of sheets['Dot thanh toan'].slice(1)){if(!String(r[0]??'').trim())continue;d.installments.push({id:String(r[0]).trim(),contractId:String(r[1]??'').trim(),seq:int(r[2]),due:parseDate(r[3]),amount:int(r[4]),note:String(r[5]??'')})}
  for(let r of sheets['Lan thanh toan'].slice(1)){if(!String(r[0]??'').trim())continue;d.payments.push({id:String(r[0]).trim(),installmentId:String(r[1]??'').trim(),date:parseDate(r[2]),amount:int(r[3]),method:String(r[4]??'').trim(),reference:String(r[5]??''),note:String(r[6]??'')})}
  if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));if(raw.company!==undefined)d.settings.company=String(raw.company);if(raw.asof!==undefined)d.settings.asof=optionalDate(raw.asof);if(raw.remindContract!==undefined)d.settings.remindContract=int(raw.remindContract);if(raw.remindPayment!==undefined)d.settings.remindPayment=int(raw.remindPayment)}
  if(!validBackup(d))throw Error('Excel có mã trùng, sai liên kết, ngày hoặc khoản thanh toán vượt đợt.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{
  let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;
  if(b.dataset.page){page=b.dataset.page;query='';render();return}
  if(b.dataset.new){openModal(b.dataset.new,'',b.dataset.target||'');return}
  if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}
  let a=b.dataset.action;
  if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();
  if(a==='backup')download('theo-doi-hop-dong-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();
  if(a==='sample'){if((db.contracts.length||db.installments.length||db.payments.length)&&!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sampleData();save()}
  if(a==='clear'){if(confirm('Xóa toàn bộ hợp đồng, đợt và khoản thanh toán trên trình duyệt này?')){db=blank();save()}}
  if(a==='deleteRecord'&&modal?.id){let{type,id}=modal;if(type==='contract'&&db.installments.some(i=>i.contractId===id)||type==='installment'&&db.payments.some(p=>p.installmentId===id)){$('#modalError').textContent='Bản ghi có dữ liệu liên kết; không thể xóa.';return}if(confirm('Xóa vĩnh viễn bản ghi này?')){let key={contract:'contracts',installment:'installments',payment:'payments'}[type];db[key]=db[key].filter(x=>x.id!==id);closeModal();save()}}
  if(a==='settings'){let d={...db,settings:{company:v('company'),asof:v('asof'),remindContract:int(v('remindContract')),remindPayment:int(v('remindPayment'))}};if(!validBackup(d)){alert('Tên đơn vị, ngày hoặc số ngày nhắc không hợp lệ.');return}db=d;save()}
});
document.addEventListener('change',e=>{if(e.target.id==='filterType'){filterType=e.target.value;render()}if(e.target.id==='f_type'&&modal?.type==='contract')$('#f_direction').value=defaultDirection(e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
