const life=l=>days(l.expiry,db.settings.asof),group=l=>life(l)<0?'Đã hết hạn':life(l)<=db.settings.d1?'Sắp hết hạn':life(l)<=db.settings.d2?'Cần đẩy bán':'Còn dài';
const warnings=l=>{let a=[],b=balance(l),d=life(l);if(b>0&&d<0)a.push('Đã hết hạn còn tồn: xử lý');if(b>0&&d>=0&&d<=db.settings.d1)a.push('Sắp hết hạn: xuất trước');if(b<0)a.push('Xuất vượt số nhập');if(l.hold)a.push('Đang cách ly');return a};
const sourceWarning=l=>{let b=balance(l),d=life(l);return b>0&&d<0?'Đã hết hạn còn tồn: xử lý':b>0&&d<=db.settings.d1?'Sắp hết hạn: xuất trước':b<0?'Xuất vượt số nhập':''};
function summary(){let a=db.lots;return {lots:a.length,stock:a.reduce((n,l)=>n+balance(l),0),value:a.reduce((n,l)=>n+balance(l)*l.cost,0),expired:a.filter(l=>balance(l)>0&&life(l)<0).length,soon:a.filter(l=>balance(l)>0&&life(l)>=0&&life(l)<=db.settings.d1).length,push:a.filter(l=>balance(l)>0&&life(l)>db.settings.d1&&life(l)<=db.settings.d2).length,long:a.filter(l=>balance(l)>0&&life(l)>db.settings.d2).length,held:a.filter(l=>l.hold&&balance(l)>0).length,negative:a.filter(l=>balance(l)<0).length}}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!Number.isInteger(x.settings.d1)||!Number.isInteger(x.settings.d2)||x.settings.d1<0||x.settings.d2<=x.settings.d1||x.settings.d2>3650||!Array.isArray(x.lots)||!Array.isArray(x.events)||!Array.isArray(x.audit))return 'Cấu trúc hoặc ngưỡng hạn dùng không hợp lệ.';
 let ids=new Set(),codes=new Set();for(let l of x.lots){if(!l.id||ids.has(l.id)||!l.code||codes.has(l.code.toUpperCase())||!l.name||!dateOK(l.entry)||!dateOK(l.expiry)||l.expiry<l.entry||!Number.isFinite(l.received)||l.received<=0||!Number.isFinite(l.issued)||l.issued<0||!Number.isSafeInteger(l.cost)||l.cost<0||!l.location||typeof l.hold!=='boolean'||String(l.note||'').length>1200)return 'Lô thiếu thông tin, trùng mã hoặc số không hợp lệ.';ids.add(l.id);codes.add(l.code.toUpperCase())}
 let eids=new Set();for(let e of x.events){let l=x.lots.find(t=>t.id===e.lotId);if(!e.id||eids.has(e.id)||!l||!['Nhập thêm','Xuất kho','Hủy hàng'].includes(e.type)||!dateOK(e.date)||e.date<l.entry||!Number.isFinite(e.qty)||e.qty<=0||!e.reason||String(e.reason).length>1200)return 'Giao dịch kho không hợp lệ.';eids.add(e.id)}
 for(let l of x.lots){let b=l.received-l.issued;for(let e of x.events.filter(e=>e.lotId===l.id)){b+=e.type==='Nhập thêm'?e.qty:-e.qty;if(b<-.001&&!l.source) return 'Giao dịch tạo tồn âm.'}if(b<-.001&&!l.source)return 'Tồn lô không được âm.'}
 let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function embedded(){try{let s=$('#embedded-state').textContent.trim();return s==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
try{let h=embedded(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(h&&!validate(h))db=h;else if(l&&!validate(l))db=l}catch{}
function save(){let v=validate(db);if(v){alert('Không lưu: '+v);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ trình duyệt không lưu được. Hãy tải JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,detail,lid=''){db.audit.push({id:id(),at:new Date().toISOString(),action,detail,lotId:lid})}
function button(t,a,cls='',lid=''){return `<button type="button" class="btn ${cls}" data-act="${a}" ${lid?`data-id="${E(lid)}"`:''}>${t}</button>`}
function badge(l){let g=group(l);return `<span class="badge ${g==='Đã hết hạn'?'expired':g==='Sắp hết hạn'?'soon':g==='Cần đẩy bán'?'push':'long'}">${E(g)}</span>`}
function lotCard(l){let b=balance(l),d=life(l);return `<button class="lot-card" data-act="openLot" data-id="${E(l.id)}"><span class="lot-card-top"><b>${E(l.code)} · ${E(l.name)}</b>${badge(l)}</span><span class="lot-card-mid"><strong>${qty(b)}</strong><small>đơn vị tồn · ${E(l.location)}</small></span><span class="lot-card-bottom"><span>HSD ${fmt(l.expiry)} · ${d<0?`quá ${qty(-d)} ngày`:`còn ${qty(d)} ngày`}</span><span>${money(b*l.cost)}</span></span>${l.hold?'<em>⛔ Đang cách ly</em>':''}</button>`}
function home(){let s=summary(),queue=db.lots.filter(l=>balance(l)>0).sort((a,b)=>a.expiry.localeCompare(b.expiry));return `<div class="masthead"><div><span class="eyebrow">AI MỞ · KHO HÀNG CÓ HẠN DÙNG</span><h1>Xuất đúng lô.<br>Giữ đúng hạn.</h1><p>Ưu tiên FEFO: lô có hạn gần nhất đứng trước. Lô quá hạn được tách để kiểm tra và xử lý.</p><div class="actions">${button('＋ Nhập lô mới','newLot','primary')}${button('Mở sổ lô','lots')}</div></div><div class="masthead-side"><span>GIÁ TRỊ TỒN GHI NHẬN</span><strong>${money(s.value)}</strong><small>${qty(s.stock)} đơn vị · ${s.lots} lô</small></div></div><section class="bands"><button data-act="setFilter" data-id="expired" class="band expired"><span>01 · CÁCH LY / XỬ LÝ</span><strong>${s.expired}</strong><small>lô đã hết hạn còn tồn</small></button><button data-act="setFilter" data-id="soon" class="band soon"><span>02 · XUẤT TRƯỚC</span><strong>${s.soon}</strong><small>lô còn ≤ ${db.settings.d1} ngày</small></button><button data-act="setFilter" data-id="push" class="band push"><span>03 · ĐẨY BÁN</span><strong>${s.push}</strong><small>lô còn ≤ ${db.settings.d2} ngày</small></button><button data-act="setFilter" data-id="long" class="band long"><span>04 · BẢO QUẢN</span><strong>${s.long}</strong><small>lô còn hạn dài hơn</small></button></section><div class="workbench"><section class="queue"><div class="section-head"><div><span class="eyebrow dark">FEFO · THỨ TỰ ƯU TIÊN</span><h2>Hàng cần xem trước</h2></div>${button('Xem toàn bộ','lots')}</div>${queue.length?queue.slice(0,12).map((l,i)=>`<div class="queue-row"><span class="rank">${String(i+1).padStart(2,'0')}</span><div><button class="text-link" data-act="openLot" data-id="${E(l.id)}">${E(l.code)} · ${E(l.name)}</button><small>${E(l.location)} · tồn ${qty(balance(l))} · ${l.hold?'đang cách ly':life(l)<0?'quá hạn':'còn '+qty(life(l))+' ngày'}</small></div>${badge(l)}</div>`).join(''):'<p class="empty">Chưa có lô tồn để sắp thứ tự FEFO.</p>'}</section><aside class="guide-panel"><span class="eyebrow dark">QUY TẮC THAO TÁC</span><h2>Chọn đúng đường đi</h2><ol><li><b>Hết hạn:</b> kiểm tra, cách ly hoặc ghi hủy; không xuất bán.</li><li><b>Còn hạn ngắn:</b> xem tồn theo hàng hóa và ưu tiên xuất lô hết hạn sớm nhất.</li><li><b>Xuất kho:</b> ghi số lượng, ngày, chứng từ; app giữ lịch sử và chặn vượt tồn.</li></ol><p>Ngày đối chiếu: <b>${fmt(db.settings.asof)}</b>. Dữ liệu chỉ lưu trên thiết bị này cho đến khi xuất bản sao.</p></aside></div>`}
function lotsPage(){let a=db.lots.filter(l=>filter==='all'||filter==='expired'&&balance(l)>0&&life(l)<0||filter==='soon'&&balance(l)>0&&life(l)>=0&&life(l)<=db.settings.d1||filter==='push'&&balance(l)>0&&life(l)>db.settings.d1&&life(l)<=db.settings.d2||filter==='long'&&balance(l)>0&&life(l)>db.settings.d2||filter==='held'&&l.hold||filter==='negative'&&balance(l)<0).filter(l=>!search||[l.code,l.name,l.location].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.expiry.localeCompare(b.expiry));return `<div class="page-head"><div><span class="eyebrow dark">TRA CỨU & THAO TÁC</span><h1>Sổ lô hạn dùng</h1><p>${a.length} lô phù hợp · sắp theo hạn gần nhất</p></div>${button('＋ Nhập lô','newLot','primary')}</div><div class="filterbar"><label>Tìm mã, hàng, vị trí<input id="lotSearch" value="${E(search)}" placeholder="LOT-001, Sữa bột…"></label><label>Nhóm hạn<select id="lotFilter"><option value="all" ${filter==='all'?'selected':''}>Tất cả</option>${[['expired','Đã hết hạn'],['soon','Sắp hết hạn'],['push','Cần đẩy bán'],['long','Còn dài'],['held','Đang cách ly'],['negative','Tồn âm cần đối chiếu']].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="lot-grid">${a.map(lotCard).join('')||'<div class="empty">Không có lô phù hợp. Hãy đổi bộ lọc hoặc nhập lô mới.</div>'}</div>`}
function detail(){let l=lot(selected);if(!l){page='lots';return lotsPage()}let b=balance(l),d=life(l),related=db.lots.filter(x=>x.name.toLowerCase()===l.name.toLowerCase()&&x.id!==l.id&&balance(x)>0&&life(x)>=0&&!x.hold).sort((a,b)=>a.expiry.localeCompare(b.expiry));return `<div class="page-head"><div><button class="text-link" data-act="lots">← Sổ lô</button><h1>${E(l.code)} · ${E(l.name)}</h1><p>Nhập ${fmt(l.entry)} · ${E(l.location)} · ${badge(l)} ${l.hold?'<span class="badge held">Đang cách ly</span>':''}</p></div><div class="actions">${button('Sửa thông tin','editLot','',l.id)}${b>0?button('Xuất kho','issue','primary',l.id):''}${button('Nhập thêm','receive','',l.id)}${b>0?button('Hủy hàng','dispose','danger',l.id):''}${button(l.hold?'Bỏ cách ly':'Cách ly','toggleHold','',l.id)}${button('🖨 In','print')}</div></div><div class="detail-layout"><section class="detail-main"><div class="detail-hero"><div><span class="eyebrow">HẠN SỬ DỤNG</span><strong>${fmt(l.expiry)}</strong><span>${d<0?`Quá ${qty(-d)} ngày`:`Còn ${qty(d)} ngày`}</span></div><div><span class="eyebrow">TỒN LÔ HIỆN TẠI</span><strong>${qty(b)}</strong><span>${money(b*l.cost)}</span></div></div><section class="paper"><h2>📦 Dòng vật tư & đối chiếu</h2><dl><dt>Đã nhập theo file gốc / đầu kỳ</dt><dd>${qty(l.received)}</dd><dt>Đã xuất theo file gốc / đầu kỳ</dt><dd>${qty(l.issued)}</dd><dt>Đơn giá vốn một đơn vị</dt><dd>${money(l.cost)}</dd><dt>Vị trí</dt><dd>${E(l.location)}</dd><dt>Ghi chú</dt><dd>${E(l.note||'—')}</dd></dl>${warnings(l).length?`<div class="alert">${warnings(l).map(E).join(' · ')}</div>`:'<p class="success">Chưa có cảnh báo tại ngày đối chiếu.</p>'}${l.source?'<p class="note">Hai số nhập/xuất đầu kỳ lấy từ file mẫu; nguồn không có ngày từng lượt xuất. Các phát sinh mới hiển thị riêng bên dưới.</p>':''}</section><section class="paper"><h2>🕘 Nhật ký phát sinh</h2><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Loại</th><th>Số lượng</th><th>Chứng từ</th><th>Lý do / người thực hiện</th></tr></thead><tbody>${eventsFor(l.id).map(e=>`<tr><td>${fmt(e.date)}</td><td>${E(e.type)}</td><td>${qty(e.qty)}</td><td>${E(e.doc||'—')}</td><td>${E(e.reason)}<small>${E(e.actor||'')}</small></td></tr>`).join('')||'<tr><td colspan="5">Chưa có giao dịch mới.</td></tr>'}</tbody></table></div></section><section class="paper"><h2>📝 Nhật ký kiểm soát</h2>${db.audit.filter(a=>a.lotId===l.id).slice().reverse().map(a=>`<div class="audit-row"><b>${E(a.action)}</b><small>${E(a.at.slice(0,16).replace('T',' '))} · ${E(a.detail)}</small></div>`).join('')||'<p>Chưa có ghi chú.</p>'}</section></section><aside class="detail-side"><section class="paper"><h2>↗ FEFO cùng mặt hàng</h2>${related.length?related.slice(0,8).map(x=>`<div class="small-row"><button class="text-link" data-act="openLot" data-id="${E(x.id)}">${E(x.code)}</button><span>${fmt(x.expiry)} · tồn ${qty(balance(x))}</span></div>`).join(''):'<p>Chưa có lô cùng mặt hàng còn hạn.</p>'}<p class="note">Xuất lô có hạn gần nhất trước. Lô hết hạn/cách ly không nằm trong gợi ý.</p></section><section class="paper"><h2>🧭 Bước tiếp theo</h2><p>${d<0?'Lô đã quá hạn: đối chiếu hàng thực tế, cách ly và ghi nhận hủy khi có chứng từ.':d<=db.settings.d1?'Lô gần hạn: ưu tiên kiểm tra và xuất trước theo FEFO.':'Lô còn hạn: theo dõi cùng các lô khác của mặt hàng.'}</p></section></aside></div>`}
function reports(){let s=summary(),groups=['Đã hết hạn','Sắp hết hạn','Cần đẩy bán','Còn dài'];return `<div class="page-head"><div><span class="eyebrow dark">BÁO CÁO QUẢN TRỊ</span><h1>Hạn dùng & giá trị tồn</h1><p>Ngày đối chiếu ${fmt(db.settings.asof)} · ${s.lots} lô · ${money(s.value)}</p></div>${button('⬇ Excel','exportExcel','primary')}</div><section class="bands report-bands">${groups.map((g,i)=>{let a=db.lots.filter(l=>group(l)===g&&balance(l)>0);return `<div class="band ${['expired','soon','push','long'][i]}"><span>${g.toUpperCase()}</span><strong>${a.length}</strong><small>${money(a.reduce((n,l)=>n+balance(l)*l.cost,0))}</small></div>`}).join('')}</section><div class="report-grid"><section class="paper"><h2>📊 Theo mặt hàng</h2><div class="table-wrap"><table><thead><tr><th>Mặt hàng</th><th>Số lô</th><th>Tồn*</th><th>Giá trị</th><th>Hạn gần nhất</th></tr></thead><tbody>${[...new Set(db.lots.map(l=>l.name))].map(n=>{let a=db.lots.filter(l=>l.name===n),v=a.reduce((k,l)=>k+balance(l)*l.cost,0);return `<tr><td>${E(n)}</td><td>${a.length}</td><td>${qty(a.reduce((k,l)=>k+balance(l),0))}</td><td>${money(v)}</td><td>${fmt(a.map(l=>l.expiry).sort()[0])}</td></tr>`}).join('')||'<tr><td colspan="5">Chưa có dữ liệu.</td></tr>'}</tbody></table></div><p class="note">* Tồn theo mặt hàng chỉ có ý nghĩa khi các lô dùng cùng đơn vị.</p></section><section class="paper"><h2>⚠️ Cần kiểm tra</h2>${db.lots.filter(l=>warnings(l).length).sort((a,b)=>a.expiry.localeCompare(b.expiry)).map(l=>`<div class="small-row"><button class="text-link" data-act="openLot" data-id="${E(l.id)}">${E(l.code)} · ${E(l.name)}</button><span>${E(warnings(l).join('; '))}</span></div>`).join('')||'<p>Không có cảnh báo.</p>'}</section></div>`}
function settings(){return `<div class="page-head"><h1>⚙️ Ngày đối chiếu & ngưỡng</h1></div><section class="paper"><form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input type="date" name="asof" value="${E(db.settings.asof)}" required></label><label>Sắp hết hạn trong (ngày)<input type="number" name="d1" value="${db.settings.d1}" min="0" max="3650" required></label><label>Cần đẩy bán trong (ngày)<input type="number" name="d2" value="${db.settings.d2}" min="1" max="3650" required></label><div class="full">${button('Lưu ngưỡng','saveSettings','primary')}</div></form><p class="note">Mặc định theo file gốc: 30 và 90 ngày. Đây là quy tắc quản trị nội bộ, anh có thể thay theo hàng hóa.</p></section>`}
function dataPage(){return `<div class="page-head"><h1>💾 Sao lưu dữ liệu</h1></div><div class="report-grid"><section class="paper"><h2>Xuất bản sao</h2><p>App lưu cục bộ trên trình duyệt hiện tại. Tải một trong hai bản sao để mang sang máy khác hoặc phòng khi xóa dữ liệu trình duyệt.</p><div class="actions">${button('⬇ JSON đầy đủ','exportJSON','primary')}${button('⬇ HTML kèm dữ liệu','exportHTML')}${button('⬇ Excel báo cáo','exportExcel')}</div></section><section class="paper"><h2>Nhập & dữ liệu mẫu</h2><p>Nhập JSON hoặc nạp mẫu sẽ thay toàn bộ dữ liệu đang có. Hãy xuất bản sao trước.</p><div class="actions">${button('⬆ Nhập JSON','importJSON')}${button('Nạp 20 lô mẫu','loadSample')}${button('Xóa dữ liệu','clearData','danger')}</div></section></div><section class="paper"><h2>Phiên bản dữ liệu</h2><p>v${VERSION} · ${db.lots.length} lô · ${db.events.length} giao dịch mới · ${db.audit.length} ghi chép kiểm soát. Không cần API, mạng hoặc tài khoản.</p></section>`}
function guide(){return `<div class="page-head"><h1>❔ Cách dùng</h1></div><div class="report-grid"><section class="paper"><h2>Quy trình hằng ngày</h2><ol><li>Nhập lô với mã, hàng, ngày nhập, hạn dùng, số lượng, vị trí và giá vốn.</li><li>Ở màn đầu, xem thứ tự FEFO. Mở lô gần hạn nhất còn hàng.</li><li>Xuất kho từng lần, ghi ngày, số lượng và chứng từ. App chặn vượt tồn, lô quá hạn hoặc đang cách ly.</li><li>Lô hết hạn: cách ly, kiểm tra thực tế, rồi ghi hủy hàng có lý do/chứng từ.</li><li>Xuất JSON hoặc HTML kèm dữ liệu sau mỗi đợt nhập liệu.</li></ol></section><section class="paper"><h2>Cách tính từ file gốc</h2><p><b>Tồn:</b> nhập − xuất; phát sinh mới cộng/trừ theo nhật ký. <b>Giá trị tồn:</b> tồn × giá vốn của lô. <b>Số ngày còn hạn:</b> HSD − ngày đối chiếu.</p><p>Đã hết hạn: dưới 0 ngày. Sắp hết hạn: từ 0 đến ${db.settings.d1} ngày. Cần đẩy bán: trên ${db.settings.d1} đến ${db.settings.d2} ngày. Còn dài: trên ${db.settings.d2} ngày.</p><p class="note">Các số nhập/xuất của mẫu gốc không có chứng từ riêng trong file tham chiếu. App giữ là số đầu kỳ, không tạo sự kiện giả.</p></section></div>`}
function render(){let views={home,lots:lotsPage,detail,reports,settings,data:dataPage,guide};$('#screen').innerHTML=(views[page]||home)();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='detail'&&b.dataset.page==='lots'))}
function input(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${E(value)}" ${extra}></label>`}
function area(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1200">${E(value)}</textarea></label>`}
function showForm(kind,lid=''){draft={kind,lid};let title='',fields='';if(kind==='lot'){let l=lot(lid)||{};title=lid?'Sửa hồ sơ lô':'Nhập lô mới';fields=input('Mã lô *','code',l.code,'text','required maxlength="60"')+input('Mặt hàng *','name',l.name,'text','required maxlength="160"')+input('Ngày nhập *','entry',l.entry||today(),'date',`required ${lid?'readonly':''}`)+input('Hạn dùng *','expiry',l.expiry||addDays(today(),180),'date','required')+input('Số nhập ban đầu *','received',l.received??1,'number',`required min="0.01" step="0.01" ${lid?'readonly':''}`)+input('Giá vốn/đơn vị *','cost',l.cost??0,'number',`required min="0" step="1" ${lid?'readonly':''}`)+input('Vị trí *','location',l.location,'text','required maxlength="100"')+area('Ghi chú','note',l.note)}else{let l=lot(lid);title=kind==='receive'?'Nhập thêm vào lô':kind==='issue'?'Xuất kho từ lô':'Hủy hàng hết hạn/hư hỏng';fields=`<p class="full note">${E(l.code)} · ${E(l.name)} · tồn ${qty(balance(l))} · HSD ${fmt(l.expiry)}. ${l.hold?'Lô đang cách ly.':''}</p>`+input('Ngày giao dịch *','date',today(),'date',`required min="${l.entry}"`)+input('Số lượng *','qty',1,'number',`required min="0.01" step="0.01" ${kind==='receive'?'':`max="${Math.max(0,balance(l))}"`}`)+input('Số chứng từ','doc','','text','maxlength="100"')+input('Người thực hiện','actor','','text','maxlength="100"')+area('Lý do / diễn giải *','reason','')}
 $('#modalTitle').textContent=title;$('#formFields').innerHTML=fields;$('#formError').textContent='';$('#editor').showModal()}
const val=(f,k)=>String(new FormData(f).get(k)||'').trim(),num=(f,k)=>Number(val(f,k));
function submit(e){e.preventDefault();let f=e.target,before=clone(db);try{let {kind,lid}=draft;if(kind==='lot'){let l=lot(lid),code=val(f,'code'),name=val(f,'name'),entry=val(f,'entry'),expiry=val(f,'expiry'),received=num(f,'received'),cost=num(f,'cost'),location=val(f,'location'),note=val(f,'note');if(!code||!name||!location||!dateOK(entry)||!dateOK(expiry)||expiry<entry||!Number.isFinite(received)||received<=0||!Number.isSafeInteger(cost)||cost<0)throw Error('Kiểm tra mã, tên, ngày, số lượng, giá và vị trí.');if(db.lots.some(x=>x.id!==lid&&x.code.toUpperCase()===code.toUpperCase()))throw Error('Mã lô đã có.');if(l){if(expiry<l.entry)throw Error('Hạn dùng trước ngày nhập.');Object.assign(l,{code,name,expiry,location,note})}else{l={id:id(),code,name,entry,expiry,received,issued:0,cost,location,note,hold:false,source:false};db.lots.push(l)}audit(lid?'Sửa hồ sơ':'Nhập lô',code,l.id);selected=l.id;page='detail'}else{let l=lot(lid),date=val(f,'date'),quantity=num(f,'qty'),reason=val(f,'reason');if(!dateOK(date)||date<l.entry||!Number.isFinite(quantity)||quantity<=0||!reason)throw Error('Ngày, số lượng và lý do phải hợp lệ.');if(kind!=='receive'&&quantity>balance(l)+.001)throw Error('Số lượng vượt tồn hiện tại.');if(kind==='issue'&&(l.hold||date>l.expiry))throw Error('Lô đang cách ly hoặc đã hết hạn ở ngày xuất; không thể xuất bán.');if(kind==='receive'&&date>l.expiry)throw Error('Không nhập bổ sung lô đã hết hạn.');let type=kind==='receive'?'Nhập thêm':kind==='issue'?'Xuất kho':'Hủy hàng';db.events.push({id:id(),lotId:lid,type,date,qty:quantity,doc:val(f,'doc'),actor:val(f,'actor'),reason});audit(type,`${qty(quantity)} · ${reason}`,lid);selected=lid;page='detail'}let err=validate(db);if(err)throw Error(err);$('#editor').close();draft=null;save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'lo-hang-han-dung-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'lo-hang-han-dung-kem-du-lieu.html')}
function sheets(){return [{name:'DanhSachLo',rows:[['Mã lô','Hàng hóa','Ngày nhập','Hạn dùng','Vị trí','Nhập đầu kỳ','Xuất đầu kỳ','Tồn hiện tại','Giá vốn','Giá trị tồn','Số ngày còn','Nhóm','Cảnh báo','Cách ly'],...db.lots.map(l=>[l.code,l.name,l.entry,l.expiry,l.location,l.received,l.issued,balance(l),l.cost,balance(l)*l.cost,life(l),group(l),warnings(l).join('; '),l.hold?'Có':'Không'])]},{name:'PhatSinh',rows:[['Mã lô','Ngày','Loại','Số lượng','Chứng từ','Người thực hiện','Lý do'],...db.events.map(e=>[lot(e.lotId).code,e.date,e.type,e.qty,e.doc,e.actor,e.reason])]},{name:'NhatKy',rows:[['Thời điểm','Mã lô','Thao tác','Chi tiết'],...db.audit.map(a=>[a.at,lot(a.lotId)?.code||'',a.action,a.detail])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Sắp hết hạn','Cần đẩy bán'],[db.settings.asof,db.settings.d1,db.settings.d2]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'lo-hang-han-dung-bao-cao.xlsx')}
function sample(){let x=empty(),offset=s=>addDays(today(),Number(s.slice(1)));for(let row of EXPIRY_LOTS_SAMPLE.lo){let [entry,code,name,received,issued,expiry,location,cost]=row;x.lots.push({id:id(),entry:offset(entry),code,name,received,issued,expiry:offset(expiry),location,cost,note:'Dữ liệu mẫu tham chiếu',hold:false,source:true})}return x}
function act(action,lid=''){if(['home','lots','reports','settings','data','guide'].includes(action)){page=action;render();return}if(action==='openLot'){selected=lid;page='detail';render();return}if(action==='setFilter'){filter=lid;page='lots';render();return}if(action==='newLot'||action==='editLot')return showForm('lot',action==='editLot'?lid:'');if(['issue','receive','dispose'].includes(action))return showForm(action,lid);if(action==='toggleHold'){let l=lot(lid),reason=prompt(l.hold?'Lý do bỏ cách ly:':'Lý do cách ly lô:');if(!reason?.trim())return;l.hold=!l.hold;audit(l.hold?'Cách ly lô':'Bỏ cách ly',reason.trim(),lid);save();return}if(action==='print')return print();if(action==='saveSettings'){let f=$('#settingsForm'),asof=f.elements.asof.value,d1=Number(f.elements.d1.value),d2=Number(f.elements.d2.value);if(!dateOK(asof)||!Number.isInteger(d1)||!Number.isInteger(d2)||d1<0||d2<=d1||d2>3650)return alert('Ngày/ngưỡng không hợp lệ.');db.settings={asof,d1,d2};save();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if(db.lots.length&&!confirm('Mẫu sẽ thay toàn bộ dữ liệu. Hãy sao lưu trước. Tiếp tục?'))return;let x=sample(),v=validate(x);if(v)return alert(v);db=x;page='home';save();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên thiết bị?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='home';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submit);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),v=validate(x);if(v)throw Error(v);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện có. Tiếp tục?'))return;db=x;page='home';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{if(e.target.id==='lotFilter'){filter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='lotSearch'){let pos=e.target.selectionStart;search=e.target.value;render();let q=$('#lotSearch');q.focus();q.setSelectionRange(pos,pos)}});render();
</script></body></html>
