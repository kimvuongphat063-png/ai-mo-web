function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!Number.isInteger(x.settings.warnDays)||x.settings.warnDays<0||x.settings.warnDays>365||!Number.isFinite(x.settings.defectLimit)||x.settings.defectLimit<0||x.settings.defectLimit>100||!Array.isArray(x.orders)||!Array.isArray(x.stages)||!Array.isArray(x.updates)||!Array.isArray(x.audit))return 'Cấu trúc hoặc cài đặt không hợp lệ.';
 let ids=new Set(),codes=new Set();for(let o of x.orders){if(!o.id||ids.has(o.id)||!o.code||codes.has(o.code.toUpperCase())||!o.product||!Number.isSafeInteger(o.qty)||o.qty<1||!dateOK(o.deadline)||!ORDER_STATES.includes(o.state)||String(o.note||'').length>1200)return 'Lệnh sản xuất không hợp lệ hoặc trùng mã.';ids.add(o.id);codes.add(o.code.toUpperCase())}
 let sids=new Set(),pairs=new Set(),stageById={};for(let s of x.stages){let pair=s.orderId+'|'+s.name;if(!s.id||sids.has(s.id)||!ids.has(s.orderId)||!STAGES.includes(s.name)||pairs.has(pair)||!Number.isSafeInteger(s.baseDone)||s.baseDone<0||!Number.isSafeInteger(s.baseDefects)||s.baseDefects<0||s.baseDefects>s.baseDone||s.start&&!dateOK(s.start)||!STATES.includes(s.state)||!Number.isFinite(s.limit)||s.limit<0||s.limit>100||String(s.note||'').length>1200)return 'Công đoạn không hợp lệ.';sids.add(s.id);pairs.add(pair);stageById[s.id]=s}
 for(let o of x.orders)for(let name of STAGES)if(!pairs.has(o.id+'|'+name))return 'Mỗi lệnh cần đủ 5 công đoạn.';
 let uids=new Set(),totals={};for(let u of x.updates){if(!u.id||uids.has(u.id)||!sids.has(u.stageId)||!dateOK(u.date)||!Number.isSafeInteger(u.done)||u.done<0||!Number.isSafeInteger(u.defects)||u.defects<0||u.defects>u.done||String(u.note||'').length>1200)return 'Nhật ký sản lượng không hợp lệ.';uids.add(u.id);let t=totals[u.stageId]||{done:0,defects:0};t.done+=u.done;t.defects+=u.defects;totals[u.stageId]=t}
 for(let o of x.orders){let arr=STAGES.map(n=>x.stages.find(s=>s.orderId===o.id&&s.name===n));let previous=o.qty;for(let s of arr){let done=s.baseDone+(totals[s.id]?.done||0),defects=s.baseDefects+(totals[s.id]?.defects||0);if(done>o.qty||done>previous||defects>done)return 'Sản lượng công đoạn vượt số lệnh hoặc công đoạn trước.';previous=done}}
 let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký chỉnh sửa không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được vào bộ nhớ. Hãy tải JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,reason,orderId='',stageId=''){db.audit.push({id:uid(),action,reason,orderId,stageId,at:new Date().toISOString()})}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function cards(){let s=summary();return `<div class="metrics"><div><small>Lệnh sản xuất</small><strong>${s.orders}</strong></div><div><small>Số lượng theo lệnh</small><strong>${s.qty.toLocaleString('vi-VN')}</strong></div><div><small>Đã đóng gói</small><strong>${s.packed.toLocaleString('vi-VN')}</strong></div><div><small>Lượt lỗi công đoạn</small><strong>${s.defects.toLocaleString('vi-VN')}</strong></div><div><small>Lệnh có lỗi cao</small><strong>${s.highDefect}</strong></div></div>`}
function home(){let arr=db.orders.filter(o=>o.state!=='Hủy').sort((a,b)=>a.deadline.localeCompare(b.deadline));return `<div class="hero"><span>🏭 AI MỞ · TIẾN ĐỘ XƯỞNG</span><h1>Lệnh sản xuất theo công đoạn</h1><p>Đi theo từng bước từ Cắt đến Đóng gói, theo dõi sản lượng, lỗi và hạn hoàn thành.</p><div class="hero-actions">${btn('＋ Tạo lệnh sản xuất','newOrder','primary')}${btn('📋 Xem danh sách','orders')}</div></div>${cards()}${panel('📍 Quy trình sử dụng','<ol><li>Tạo lệnh với sản phẩm, số lượng và hạn.</li><li>Nhập sản lượng theo từng công đoạn bằng nhật ký theo ngày.</li><li>Rà lỗi vượt ngưỡng, lượng qua bước trước và số đã đóng gói.</li><li>In báo cáo và sao lưu dữ liệu.</li></ol>')}${panel('⏰ Cần theo dõi',arr.flatMap(o=>orderWarnings(o).map(w=>`<div class="mini"><button class="link" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)} · ${esc(o.product)}</button><small>${esc(w)} · hạn ${fmt(o.deadline)}</small></div>`)).join('')||'<p class="success">Chưa có cảnh báo theo ngưỡng hiện tại.</p>')}`}
function ordersPage(){let arr=db.orders.filter(o=>(filter==='all'||filter==='alert'&&orderWarnings(o).length||filter===o.state)&&(!query||[o.code,o.product].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))).sort((a,b)=>a.deadline.localeCompare(b.deadline));return `<div class="page-head"><div><h1>🏭 Lệnh sản xuất</h1><p>Tiến độ lệnh tính từ công đoạn cuối: Đóng gói.</p></div>${btn('＋ Tạo lệnh','newOrder','primary')}</div><div class="card"><div class="filters"><label>Tìm mã / sản phẩm<input id="search" value="${esc(query)}" placeholder="LSX01, áo sơ mi..."></label><label>Trạng thái<select id="stateFilter"><option value="all" ${filter==='all'?'selected':''}>Tất cả</option><option value="alert" ${filter==='alert'?'selected':''}>Có cảnh báo</option>${ORDER_STATES.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="table-wrap"><table><thead><tr><th>Lệnh</th><th>Trạng thái</th><th>Hạn</th><th>Số lượng</th><th>Đã đóng gói</th><th>Tiến độ</th><th>Lượt lỗi</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${arr.map(o=>{let s=orderStats(o),w=orderWarnings(o);return `<tr><td><button class="link" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)}</button><small>${esc(o.product)}</small></td><td>${esc(o.state)}</td><td>${fmt(o.deadline)}</td><td>${o.qty.toLocaleString('vi-VN')}</td><td>${s.packed.toLocaleString('vi-VN')}</td><td>${pct(s.progress)}</td><td>${s.defects.toLocaleString('vi-VN')}</td><td>${w.length?`<span class="pill red">${w.length} cảnh báo</span>`:'—'}</td><td>${btn('Xem','openOrder','small',o.id)}</td></tr>`}).join('')||'<tr><td colspan="9">Chưa có lệnh phù hợp.</td></tr>'}</tbody></table></div></div>`}
function orderDetail(){let o=order(selected);if(!o){page='orders';return ordersPage()}let v=orderStats(o),w=orderWarnings(o),ss=stagesFor(o.id);return `<div class="page-head"><div><button class="link" data-act="orders">← Danh sách</button><h1>🏭 ${esc(o.code)} · ${esc(o.product)}</h1><p>${esc(o.state)} · Hạn ${fmt(o.deadline)} · còn ${v.toDue} ngày</p></div><div class="actions no-print">${btn('Sửa lệnh','editOrder','primary',o.id)}${btn('Đổi trạng thái','changeOrderState','',o.id)}${btn('🖨️ In phiếu','print')}</div></div><div class="metrics"><div><small>Số lượng lệnh</small><strong>${o.qty.toLocaleString('vi-VN')}</strong></div><div><small>Đã đóng gói</small><strong>${v.packed.toLocaleString('vi-VN')}</strong></div><div><small>Chưa đóng gói</small><strong>${v.remaining.toLocaleString('vi-VN')}</strong></div><div><small>Tiến độ</small><strong>${pct(v.progress)}</strong></div><div><small>Lượt lỗi</small><strong>${v.defects.toLocaleString('vi-VN')}</strong></div></div>${panel('⚠️ Cảnh báo và ghi chú',`<p><b>Ngày báo cáo:</b> ${fmt(db.settings.asof)} · <b>Ghi chú:</b> ${esc(o.note||'—')}</p>${w.length?`<ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="success">Chưa có cảnh báo.</p>'}<p class="muted">Tổng lỗi cộng theo công đoạn là số lượt lỗi được ghi; một sản phẩm có thể bị tính ở nhiều công đoạn.</p>`)}${panel('🧩 Năm công đoạn',`<div class="table-wrap"><table><thead><tr><th>Thứ tự</th><th>Công đoạn</th><th>Trạng thái</th><th>Đã hoàn thành</th><th>Lỗi</th><th>Tỷ lệ lỗi</th><th>Ngày bắt đầu</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${ss.map((s,i)=>{let z=stageStats(s);return `<tr><td>${i+1}</td><td><button class="link" data-act="openStage" data-id="${esc(s.id)}">${esc(s.name)}</button></td><td>${esc(s.state)}</td><td>${z.done.toLocaleString('vi-VN')}</td><td>${z.defects.toLocaleString('vi-VN')}</td><td>${z.rate===null?'—':pct(z.rate)}</td><td>${fmt(s.start)}</td><td>${stageWarnings(s).join('; ')||'—'}</td><td>${btn('Xem','openStage','small',s.id)}</td></tr>`}).join('')}</tbody></table></div>`)}${panel('📊 Dòng sản lượng qua các bước',`<div class="bars">${ss.map(s=>{let z=stageStats(s);return `<div><span>${esc(s.name)}</span><b>${z.done.toLocaleString('vi-VN')} / ${o.qty.toLocaleString('vi-VN')}</b><i style="width:${Math.max(1,z.done/o.qty*100)}%"></i></div>`}).join('')}</div>`)}${panel('🕘 Nhật ký lệnh',db.audit.filter(a=>a.orderId===o.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có nhật ký.</p>')}`}
function stageDetail(){let s=stage(activeStage);if(!s){page='orders';return ordersPage()}let o=order(s.orderId),z=stageStats(s),arr=updatesFor(s.id).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="page-head"><div><button class="link" data-act="openOrder" data-id="${esc(o.id)}">← ${esc(o.code)}</button><h1>🧩 ${esc(s.name)}</h1><p>${esc(o.product)} · ${esc(s.state)} · bắt đầu ${fmt(s.start)}</p></div><div class="actions no-print">${btn('＋ Ghi sản lượng','newUpdate','primary',s.id)}${btn('Sửa công đoạn','editStage','',s.id)}${btn('🖨️ In','print')}</div></div><div class="metrics"><div><small>Số lượng lệnh</small><strong>${o.qty.toLocaleString('vi-VN')}</strong></div><div><small>Hoàn thành bước này</small><strong>${z.done.toLocaleString('vi-VN')}</strong></div><div><small>Lượt lỗi</small><strong>${z.defects.toLocaleString('vi-VN')}</strong></div><div><small>Tỷ lệ lỗi</small><strong>${z.rate===null?'—':pct(z.rate)}</strong></div><div><small>Ngưỡng cảnh báo</small><strong>${pct(s.limit)}</strong></div></div>${panel('ℹ️ Thông tin',`<p><b>Người phụ trách:</b> ${esc(s.owner||'—')}</p><p><b>Ghi chú:</b> ${esc(s.note||'—')}</p><p><b>Số gốc/đầu kỳ:</b> ${s.baseDone.toLocaleString('vi-VN')} hoàn thành, ${s.baseDefects.toLocaleString('vi-VN')} lỗi. Phần tăng sau đó nằm trong nhật ký bên dưới.</p>${stageWarnings(s).map(x=>`<p class="error">⚠️ ${esc(x)}</p>`).join('')}`)}${panel('🧾 Nhật ký sản lượng',`<div class="actions no-print">${btn('＋ Ghi sản lượng','newUpdate','primary',s.id)}</div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Hoàn thành thêm</th><th>Lỗi thêm</th><th>Ghi chú</th><th></th></tr></thead><tbody>${arr.map(u=>`<tr><td>${fmt(u.date)}</td><td>${u.done.toLocaleString('vi-VN')}</td><td>${u.defects.toLocaleString('vi-VN')}</td><td>${esc(u.note||'—')}</td><td class="no-print">${btn('Sửa','editUpdate','small',u.id)}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có lượt cập nhật mới.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký thay đổi',db.audit.filter(a=>a.stageId===s.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có thay đổi.</p>')}`}
function reports(){let a=db.orders.filter(o=>o.state!=='Hủy'),s=summary();return `<div class="page-head"><div><h1>📊 Báo cáo tiến độ</h1><p>Tại ngày ${fmt(db.settings.asof)} · 5 công đoạn chuẩn.</p></div>${btn('🖨️ In báo cáo','print')}</div>${cards()}${panel('Theo công đoạn',`<div class="table-wrap"><table><thead><tr><th>Công đoạn</th><th>Số dòng</th><th>Hoàn thành</th><th>Lượt lỗi</th><th>Tỷ lệ lỗi gộp</th><th>Vượt ngưỡng</th></tr></thead><tbody>${STAGES.map(n=>{let ss=a.flatMap(o=>stagesFor(o.id)).filter(x=>x.name===n),done=ss.reduce((v,x)=>v+stageStats(x).done,0),def=ss.reduce((v,x)=>v+stageStats(x).defects,0),high=ss.filter(x=>stageWarnings(x).length).length;return `<tr><td>${esc(n)}</td><td>${ss.length}</td><td>${done.toLocaleString('vi-VN')}</td><td>${def.toLocaleString('vi-VN')}</td><td>${done?pct(Math.round(def/done*10000)/100):'—'}</td><td>${high}</td></tr>`}).join('')}</tbody></table></div>`)}${panel('Theo lệnh',`<div class="table-wrap"><table><thead><tr><th>Lệnh</th><th>Sản phẩm</th><th>Số lượng</th><th>Đã đóng gói</th><th>Còn lại</th><th>Tiến độ</th><th>Lượt lỗi</th><th>Hạn</th></tr></thead><tbody>${a.map(o=>{let v=orderStats(o);return `<tr><td>${esc(o.code)}</td><td>${esc(o.product)}</td><td>${o.qty.toLocaleString('vi-VN')}</td><td>${v.packed.toLocaleString('vi-VN')}</td><td>${v.remaining.toLocaleString('vi-VN')}</td><td>${pct(v.progress)}</td><td>${v.defects.toLocaleString('vi-VN')}</td><td>${fmt(o.deadline)}</td></tr>`}).join('')}<tr><th colspan="2">Tổng</th><th>${s.qty.toLocaleString('vi-VN')}</th><th>${s.packed.toLocaleString('vi-VN')}</th><th>${(s.qty-s.packed).toLocaleString('vi-VN')}</th><th>—</th><th>${s.defects.toLocaleString('vi-VN')}</th><th>—</th></tr></tbody></table></div>`)}${panel('Việc cần xem',a.flatMap(o=>orderWarnings(o).map(w=>`<div class="mini"><button class="link" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)} · ${esc(o.product)}</button><small>${esc(w)}</small></div>`)).join('')||'<p class="success">Chưa có cảnh báo.</p>')}`}

function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Quy trình',`<ol><li>Tạo lệnh với mã, sản phẩm, lượng và hạn. App tạo sẵn 5 công đoạn Cắt → May → Ủi → Kiểm tra → Đóng gói.</li><li>Mở từng công đoạn và ghi nhật ký sản lượng, lỗi theo ngày. Một lần cập nhật không vượt lượng đã qua công đoạn trước.</li><li>Kiểm tra tỷ lệ lỗi; ngưỡng do xưởng đặt và lưu trên từng công đoạn.</li><li>Đã đóng gói là đầu ra của công đoạn cuối; tổng lượt lỗi cộng theo 5 bước, có thể gồm cùng một sản phẩm nhiều lần.</li><li>Rà hạn, in báo cáo, sao lưu dữ liệu thường xuyên.</li></ol>`)}${panel('Giới hạn',`<p>App theo dõi nội bộ. Chưa phân bổ ca làm, máy, nguyên liệu, thời gian chờ hoặc hàng tái chế. Trạng thái “Hoàn thành” do người dùng ghi, độc lập với số lượng vì mẫu nguồn cũng dùng cách này. Không tự đồng bộ với các app BOM, kế hoạch đơn hàng hoặc kiểm tra chất lượng lô.</p>`)}`}
function render(){let map={home:['Tổng quan',home],orders:['Lệnh sản xuất',ordersPage],detail:['Chi tiết lệnh',orderDetail],stage:['Công đoạn',stageDetail],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,label,value='',type='text',options=null){return `<label class="${type==='textarea'?'full':''}">${label}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(value)}</textarea>`:options?`<select name="${n}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${n}" type="${type==='decimal'?'number':type}" value="${esc(value)}" ${type==='number'?'min="0" step="1"':type==='decimal'?'min="0" max="100" step="0.01"':''} ${['code','product'].includes(n)?'required':''}>`}</label>`}
function openModal(kind,id='',parentId=''){let old=id?clone(kind==='order'?order(id):kind==='stage'?stage(id):db.updates.find(u=>u.id===id)):null;draft={kind,id,parentId,before:old};let x=old||{},f='';if(kind==='order')f=field('code','Mã lệnh',x.code||'')+field('product','Sản phẩm',x.product||'')+field('qty','Số lượng lệnh',x.qty??100,'number')+field('deadline','Hạn hoàn thành',x.deadline||today(),'date')+field('note','Ghi chú',x.note||'','textarea');
 else if(kind==='stage')f=field('start','Ngày bắt đầu',x.start||'','date')+field('state','Trạng thái',x.state||'Chưa làm','text',STATES)+field('limit','Ngưỡng lỗi (%)',x.limit??db.settings.defectLimit,'decimal')+field('owner','Người phụ trách',x.owner||'')+field('note','Ghi chú',x.note||'','textarea');
 else f=field('date','Ngày cập nhật',x.date||today(),'date')+field('done','Số hoàn thành thêm',x.done??0,'number')+field('defects','Số lỗi thêm',x.defects??0,'number')+field('note','Ghi chú',x.note||'','textarea');
 if(id)f+=field('reason','Lý do sửa','','textarea');$('#modalTitle').textContent=kind==='order'?(id?'Sửa lệnh':'Tạo lệnh'):kind==='stage'?'Sửa công đoạn':(id?'Sửa lượt cập nhật':'Ghi sản lượng');$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let kind=draft.kind,old=draft.before,backup=clone(db);if(old&&!x.reason){$('#formError').textContent='Cần lý do khi sửa hồ sơ đã lưu.';return}
 if(kind==='order'){x.code=x.code.toUpperCase();x.qty=Number(x.qty);x.state=old?.state||'Đang sản xuất';if(!x.code||!x.product||!Number.isSafeInteger(x.qty)||x.qty<1||!dateOK(x.deadline)||db.orders.some(o=>o.code===x.code&&o.id!==x.id)){$('#formError').textContent='Mã không trùng, tên, số lượng dương và hạn hợp lệ là bắt buộc.';return}delete x.reason;if(old)Object.assign(order(x.id),x);else{db.orders.push(x);for(let name of STAGES)db.stages.push({id:uid(),orderId:x.id,name,baseDone:0,baseDefects:0,start:'',state:'Chưa làm',limit:db.settings.defectLimit,owner:'',note:''})}audit(old?'Sửa lệnh':'Tạo lệnh',(f.get('reason')||'')+' · '+x.code,x.id);selected=x.id;page='detail'}
 else if(kind==='stage'){x.orderId=old.orderId;x.name=old.name;x.baseDone=old.baseDone;x.baseDefects=old.baseDefects;x.limit=Number(x.limit);if(x.start&&!dateOK(x.start)||!STATES.includes(x.state)||!Number.isFinite(x.limit)||x.limit<0||x.limit>100){$('#formError').textContent='Ngày, trạng thái hoặc ngưỡng lỗi không hợp lệ.';return}delete x.reason;Object.assign(stage(x.id),x);audit('Sửa công đoạn',(f.get('reason')||'')+' · '+x.name,x.orderId,x.id);activeStage=x.id;page='stage'}
 else{x.stageId=old?.stageId||draft.parentId;x.done=Number(x.done);x.defects=Number(x.defects);let st=stage(x.stageId),o=st&&order(st.orderId);if(!st||!o||o.state==='Hủy'||st.state==='Hoàn thành'&&!old||!dateOK(x.date)||!Number.isSafeInteger(x.done)||x.done<0||!Number.isSafeInteger(x.defects)||x.defects<0||x.defects>x.done||x.done===0&&x.defects===0){$('#formError').textContent='Lệnh/công đoạn phải đang mở; ngày và số lượng cần hợp lệ, có thay đổi thực tế.';return}delete x.reason;if(old)Object.assign(db.updates.find(u=>u.id===x.id),x);else{db.updates.push(x);if(st.state==='Chưa làm')st.state='Đang làm'}audit(old?'Sửa sản lượng':'Ghi sản lượng',(f.get('reason')||'')+' · +'+x.done+' hoàn thành, +'+x.defects+' lỗi',o.id,st.id);activeStage=st.id;page='stage'}
 let err=validate(db);if(err){db=backup;$('#formError').textContent=err;return}$('#editor').close();save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'lenh-san-xuat-sao-luu.json')}
function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'lenh-san-xuat-kem-du-lieu.html')}
const HO=['ID','Mã','Sản phẩm','Số lượng','Hạn','Trạng thái','Ghi chú'],HS=['ID','ID lệnh','Công đoạn','Số gốc hoàn thành','Số gốc lỗi','Bắt đầu','Trạng thái','Ngưỡng lỗi','Phụ trách','Ghi chú'],HU=['ID','ID công đoạn','Ngày','Hoàn thành thêm','Lỗi thêm','Ghi chú'],HA=['ID','Hành động','Lý do','ID lệnh','ID công đoạn','Thời điểm'],HC=['Ngày báo cáo','Nhắc trước ngày','Ngưỡng lỗi mặc định'];
function sheets(){return [{name:'Lenh',rows:[HO,...db.orders.map(o=>[o.id,o.code,o.product,o.qty,o.deadline,o.state,o.note])]},{name:'Cong doan',rows:[HS,...db.stages.map(s=>[s.id,s.orderId,s.name,s.baseDone,s.baseDefects,s.start,s.state,s.limit,s.owner,s.note])]},{name:'San luong',rows:[HU,...db.updates.map(u=>[u.id,u.stageId,u.date,u.done,u.defects,u.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.orderId,a.stageId,a.at])]},{name:'Cai dat',rows:[HC,[db.settings.asof,db.settings.warnDays,db.settings.defectLimit]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'lenh-san-xuat-cong-doan.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Lenh',HO],['Cong doan',HS],['San luong',HU],['Nhat ky',HA],['Cai dat',HC]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng 5 sheet do app xuất.');x=empty();x.settings={asof:String(b['Cai dat'][1]?.[0]),warnDays:Number(b['Cai dat'][1]?.[1]),defectLimit:Number(b['Cai dat'][1]?.[2])};x.orders=b['Lenh'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),product:String(r[2]),qty:Number(r[3]),deadline:String(r[4]),state:String(r[5]),note:String(r[6]||'')}));x.stages=b['Cong doan'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),orderId:String(r[1]),name:String(r[2]),baseDone:Number(r[3]),baseDefects:Number(r[4]),start:String(r[5]||''),state:String(r[6]),limit:Number(r[7]),owner:String(r[8]||''),note:String(r[9]||'')}));x.updates=b['San luong'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),stageId:String(r[1]),date:String(r[2]),done:Number(r[3]),defects:Number(r[4]),note:String(r[5]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),orderId:String(r[3]||''),stageId:String(r[4]||''),at:String(r[5])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.orders.length} lệnh?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today(),relative=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')},ids={};for(let r of STAGE_SAMPLE.lenh){let id=uid();ids[r[0]]=id;x.orders.push({id,code:r[0],product:r[1],qty:r[2],deadline:relative(r[3]),state:'Đang sản xuất',note:'Mẫu nguồn; hạn tương đối theo ngày nạp.'})}for(let r of STAGE_SAMPLE.cd)x.stages.push({id:uid(),orderId:ids[r[0]],name:r[1],baseDone:r[2],baseDefects:r[3],start:relative(r[4]),state:r[5],limit:2.5,owner:'',note:'Số hoàn thành và lỗi gốc; không có lịch sử từng ngày.'});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;
 if(k==='newOrder')openModal('order');else if(k==='editOrder')openModal('order',id);else if(k==='editStage')openModal('stage',id);else if(k==='newUpdate'){if(stage(id).state==='Hoàn thành')alert('Công đoạn đã đánh dấu Hoàn thành. Hãy sửa trạng thái và ghi lý do trước khi thêm sản lượng.');else openModal('update','',id)}else if(k==='editUpdate'){let u=db.updates.find(x=>x.id===id);openModal('update',id,u.stageId)}
 else if(k==='openOrder'){selected=id;page='detail';render()}else if(k==='openStage'){activeStage=id;page='stage';render()}else if(k==='orders'){page='orders';render()}
 else if(k==='changeOrderState'){let o=order(id),list=ORDER_STATES.map((s,i)=>`${i+1}. ${s}`).join('\n'),v=prompt(`Chọn số trạng thái:\n${list}`);if(v===null)return;let next=ORDER_STATES[Number(v)-1];if(!next){alert('Trạng thái không hợp lệ.');return}let reason=prompt('Lý do đổi trạng thái:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}let old=o.state;o.state=next;audit('Đổi trạng thái lệnh',old+' → '+next+' · '+reason.trim(),id);save()}
 else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),asof=String(f.get('asof')),warnDays=Number(f.get('warnDays')),defectLimit=Number(f.get('defectLimit'));if(!dateOK(asof)||!Number.isInteger(warnDays)||warnDays<0||warnDays>365||!Number.isFinite(defectLimit)||defectLimit<0||defectLimit>100){alert('Cài đặt không hợp lệ.');return}db.settings={asof,warnDays,defectLimit};save()}
 else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let n=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(n,n)}});
document.addEventListener('change',e=>{if(e.target.id==='stateFilter'){filter=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();
$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};
$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};
render();window.StageApp={getDB:()=>clone(db),validate,summary,stageStats,orderStats,orderWarnings,stageWarnings,loadSample,encode,decode,sheets,importFile};
</script></body></html>
