function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được vào bộ nhớ trình duyệt. Hãy tải JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,reason='',eventId=''){db.audit.push({id:uid(),action,reason,eventId,at:new Date().toISOString()})}
function regs(eid){return db.registrations.filter(r=>r.eventId===eid)}
function paid(rid){return db.payments.filter(p=>p.registrationId===rid).reduce((s,p)=>s+p.amount,0)}
function stats(e){let rr=regs(e.id),due=rr.reduce((s,r)=>s+r.fee,0),received=rr.reduce((s,r)=>s+paid(r.id),0);return {registered:rr.length,due,received,remaining:due-received,noConsent:rr.filter(r=>r.consent!=='Đã đồng ý').length,noInsurance:rr.filter(r=>r.insurance!=='Có').length,days:days(e.date,db.settings.asof),seats:e.capacity-rr.length}}
function warnings(e){let s=stats(e),w=[];if(s.seats<0)w.push('Vượt sức chứa '+(-s.seats));if(e.state==='Đang nhận đăng ký'||e.state==='Đã chốt danh sách'){if(s.days>=0&&s.days<=db.settings.remind){if(s.noConsent)w.push(s.noConsent+' học sinh chưa có đồng ý của phụ huynh');if(s.noInsurance)w.push(s.noInsurance+' học sinh chưa có bảo hiểm')}if(s.days<0)w.push('Ngày tổ chức đã qua nhưng chưa đóng hoạt động')}return w}
function summary(){let ss=db.events.map(stats);return {events:db.events.length,students:db.registrations.length,due:ss.reduce((n,s)=>n+s.due,0),received:ss.reduce((n,s)=>n+s.received,0),remaining:ss.reduce((n,s)=>n+s.remaining,0),noConsent:ss.reduce((n,s)=>n+s.noConsent,0),noInsurance:ss.reduce((n,s)=>n+s.noInsurance,0)}}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Hoạt động</small><strong>${s.events}</strong></div><div><small>Học sinh đăng ký</small><strong>${s.students}</strong></div><div><small>Đã thu</small><strong>${money(s.received)}</strong></div><div><small>Còn phải thu</small><strong>${money(s.remaining)}</strong></div><div><small>Chưa đồng ý</small><strong>${s.noConsent}</strong></div></div>`}
function home(){let upcoming=db.events.filter(e=>e.state==='Đang nhận đăng ký'||e.state==='Đã chốt danh sách').sort((a,b)=>a.date.localeCompare(b.date));return `<div class="hero"><span>🚌 AI MỞ · QUẢN LÝ NGOẠI KHÓA</span><h1>Hoạt động, đăng ký & thu tiền</h1><p>Chuẩn bị danh sách học sinh, theo dõi từng lần nộp và rà sự đồng ý của phụ huynh trước ngày tổ chức.</p><div class="hero-actions">${btn('＋ Tạo hoạt động','newEvent','primary')}${btn('📋 Xem hoạt động','events')}</div></div>${metrics()}${panel('🧭 Quy trình nhanh','<ol><li>Tạo hoạt động và mức thu cho mỗi học sinh.</li><li>Đăng ký học sinh; ghi tình trạng đồng ý và bảo hiểm theo hồ sơ thực tế.</li><li>Ghi từng lần thu, đối chiếu còn thiếu và kiểm tra danh sách trước khi chốt.</li><li>In danh sách, lưu bản sao và hoàn thành hoạt động.</li></ol>')}${panel('⏰ Hoạt động cần xem',upcoming.length?upcoming.map(e=>{let s=stats(e),w=warnings(e);return `<div class="mini"><button class="link" data-act="openEvent" data-id="${esc(e.id)}">${esc(e.code)} · ${esc(e.name)}</button><small>${fmt(e.date)} · ${s.registered}/${e.capacity} học sinh · còn ${money(s.remaining)}${w.length?' · ⚠️ '+esc(w.join('; ')):''}</small></div>`}).join(''):'<p class="muted">Chưa có hoạt động mở. Hãy tạo hoạt động đầu tiên hoặc nạp mẫu ở Dữ liệu.</p>')}`}
function eventsPage(){let arr=db.events.filter(e=>!query||[e.code,e.name,e.place].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="page-head"><div><h1>🚌 Hoạt động ngoại khóa</h1><p>Chọn một hoạt động để xem danh sách, khoản thu và tình trạng chuẩn bị.</p></div>${btn('＋ Tạo hoạt động','newEvent','primary')}</div><div class="card"><label>Tìm theo mã, tên, địa điểm<input id="search" value="${esc(query)}" placeholder="Ví dụ NK-01"></label><div class="table-wrap"><table><thead><tr><th>Hoạt động</th><th>Ngày, địa điểm</th><th>Trạng thái</th><th>Đăng ký</th><th>Phải thu</th><th>Đã thu</th><th>Còn thu</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${arr.map(e=>{let s=stats(e),w=warnings(e);return `<tr><td><button class="link" data-act="openEvent" data-id="${esc(e.id)}">${esc(e.name)}</button><small>${esc(e.code)} · ${money(e.fee)}/học sinh</small></td><td>${fmt(e.date)}<small>${esc(e.place||'—')}</small></td><td>${esc(e.state)}</td><td>${s.registered}/${e.capacity}</td><td>${money(s.due)}</td><td>${money(s.received)}</td><td>${money(s.remaining)}</td><td>${w.length?`<span class="pill red">${w.length} việc cần xem</span>`:'—'}</td><td>${btn('Xem','openEvent','small',e.id)}</td></tr>`}).join('')||'<tr><td colspan="9">Chưa có hoạt động phù hợp.</td></tr>'}</tbody></table></div></div>`}
function detail(){let e=event(selected);if(!e){page='events';return eventsPage()}let rr=regs(e.id),s=stats(e),w=warnings(e);return `<div class="page-head"><div><button class="link" data-act="events">← Hoạt động</button><h1>🚌 ${esc(e.name)}</h1><p>${esc(e.code)} · ${fmt(e.date)} · ${esc(e.place||'Chưa ghi địa điểm')}</p></div><div class="actions no-print">${btn('＋ Đăng ký học sinh','newRegistration','primary',e.id)}${btn('Sửa hoạt động','editEvent','',e.id)}${btn('Đổi trạng thái','changeState','',e.id)}${btn('🖨️ In danh sách','print')}</div></div><div class="metrics"><div><small>Đăng ký</small><strong>${s.registered}/${e.capacity}</strong></div><div><small>Phải thu</small><strong>${money(s.due)}</strong></div><div><small>Đã thu</small><strong>${money(s.received)}</strong></div><div><small>Còn thu</small><strong>${money(s.remaining)}</strong></div><div><small>Ngày còn lại</small><strong>${s.days}</strong></div></div><div class="two">${panel('ℹ️ Thông tin',`<p><b>Mức thu:</b> ${money(e.fee)}/học sinh đăng ký mới</p><p><b>Sức chứa:</b> ${e.capacity}</p><p><b>Trạng thái:</b> ${esc(e.state)}</p><p><b>Ghi chú:</b> ${esc(e.note||'—')}</p><p class="muted">Mức thu được ghi tại lúc đăng ký; sửa mức thu hoạt động không đổi hồ sơ đã lập.</p>`)}${panel('🛡️ Kiểm tra trước khi đi',`<p>Chưa đồng ý: <b>${s.noConsent}</b> · Chưa có bảo hiểm: <b>${s.noInsurance}</b></p>${w.length?`<ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="success">Không có cảnh báo theo ngày báo cáo hiện tại.</p>'}<p class="muted">Trạng thái ở đây do người nhập khai báo; hãy đối chiếu hồ sơ và điều kiện tổ chức thực tế.</p>`)}</div>${panel('👧 Danh sách học sinh đăng ký',`<div class="actions no-print">${btn('＋ Đăng ký học sinh','newRegistration','primary',e.id)}</div><div class="table-wrap"><table><thead><tr><th>Học sinh</th><th>Phụ huynh</th><th>Mức thu</th><th>Đã nộp</th><th>Còn thiếu</th><th>Đồng ý</th><th>Bảo hiểm</th><th></th></tr></thead><tbody>${rr.map(r=>`<tr><td><button class="link" data-act="openRegistration" data-id="${esc(r.id)}">${esc(r.student)}</button><small>${esc(r.className||'—')}</small></td><td>${esc(r.parent||'—')}<small>${esc(r.phone||'')}</small></td><td>${money(r.fee)}</td><td>${money(paid(r.id))}</td><td>${money(r.fee-paid(r.id))}</td><td>${esc(r.consent)}</td><td>${esc(r.insurance)}</td><td class="no-print">${btn('Xem','openRegistration','small',r.id)}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có học sinh đăng ký.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký hoạt động',db.audit.filter(a=>a.eventId===e.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có thay đổi.</p>')}`}
function registrationPage(){let r=registration(selected);if(!r){page='events';return eventsPage()}let e=event(r.eventId),pp=db.payments.filter(p=>p.registrationId===r.id).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="page-head"><div><button class="link" data-act="openEvent" data-id="${esc(e.id)}">← ${esc(e.name)}</button><h1>👧 ${esc(r.student)}</h1><p>${esc(r.className||'Chưa ghi lớp')} · ${esc(e.code)}</p></div><div class="actions no-print">${btn('＋ Ghi khoản thu','newPayment','primary',r.id)}${btn('Sửa đăng ký','editRegistration','',r.id)}${btn('🖨️ In hồ sơ','print')}</div></div><div class="metrics"><div><small>Phải thu</small><strong>${money(r.fee)}</strong></div><div><small>Đã nộp</small><strong>${money(paid(r.id))}</strong></div><div><small>Còn thiếu</small><strong>${money(r.fee-paid(r.id))}</strong></div><div><small>Phụ huynh</small><strong>${esc(r.consent)}</strong></div><div><small>Bảo hiểm</small><strong>${esc(r.insurance)}</strong></div></div><div class="two">${panel('ℹ️ Thông tin đăng ký',`<p><b>Phụ huynh:</b> ${esc(r.parent||'—')} · ${esc(r.phone||'—')}</p><p><b>Đồng ý:</b> ${esc(r.consent)} · ${esc(r.consentRef||'Chưa ghi bằng chứng')}</p><p><b>Bảo hiểm:</b> ${esc(r.insurance)} · ${esc(r.insuranceRef||'Chưa ghi tham chiếu')}</p><p><b>Ngày đăng ký:</b> ${fmt(r.created)}</p><p><b>Ghi chú:</b> ${esc(r.note||'—')}</p>`)}${panel('📌 Việc cần hoàn tất',`<ul>${r.consent!=='Đã đồng ý'?'<li>Xin và lưu xác nhận đồng ý của phụ huynh.</li>':''}${r.insurance!=='Có'?'<li>Kiểm tra hồ sơ bảo hiểm.</li>':''}${r.fee>paid(r.id)?`<li>Thu còn thiếu ${money(r.fee-paid(r.id))}.</li>`:''}${r.consent==='Đã đồng ý'&&r.insurance==='Có'&&r.fee===paid(r.id)?'<li>Không còn mục cần bổ sung trong app.</li>':''}</ul>`)}</div>${panel('💳 Lịch sử thu tiền',`<div class="actions no-print">${btn('＋ Ghi khoản thu','newPayment','primary',r.id)}</div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Số tiền</th><th>Cách thu</th><th>Chứng từ</th><th>Ghi chú</th><th></th></tr></thead><tbody>${pp.map(p=>`<tr><td>${fmt(p.date)}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.receipt||'—')}</td><td>${esc(p.note||'—')}</td><td class="no-print">${p.method==='Số dư mẫu gốc'?'Mẫu':btn('Sửa','editPayment','small',p.id)}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có khoản thu.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký',db.audit.filter(a=>a.registrationId===r.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có nhật ký riêng.</p>')}`}
function reports(){let s=summary();return `<div class="page-head"><div><h1>📊 Báo cáo ngoại khóa</h1><p>Trạng thái tại ngày ${fmt(db.settings.asof)}.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo hoạt động',`<div class="table-wrap"><table><thead><tr><th>Hoạt động</th><th>Đăng ký</th><th>Phải thu</th><th>Đã thu</th><th>Còn thu</th><th>Chưa đồng ý</th><th>Chưa bảo hiểm</th></tr></thead><tbody>${db.events.map(e=>{let z=stats(e);return `<tr><td>${esc(e.code)} · ${esc(e.name)}</td><td>${z.registered}</td><td>${money(z.due)}</td><td>${money(z.received)}</td><td>${money(z.remaining)}</td><td>${z.noConsent}</td><td>${z.noInsurance}</td></tr>`}).join('')}<tr><th>Tổng</th><th>${s.students}</th><th>${money(s.due)}</th><th>${money(s.received)}</th><th>${money(s.remaining)}</th><th>${s.noConsent}</th><th>${s.noInsurance}</th></tr></tbody></table></div>`)}${panel('Danh sách cần theo dõi',db.events.flatMap(e=>regs(e.id).filter(r=>r.consent!=='Đã đồng ý'||r.insurance!=='Có'||paid(r.id)<r.fee).map(r=>`<div class="mini"><button class="link" data-act="openRegistration" data-id="${esc(r.id)}">${esc(r.student)}</button><small>${esc(e.code)} · ${r.consent==='Đã đồng ý'?'':'Chưa đồng ý · '}${r.insurance==='Có'?'':'Chưa bảo hiểm · '}Còn ${money(r.fee-paid(r.id))}</small></div>`)).join('')||'<p class="success">Không còn hồ sơ thiếu trong dữ liệu hiện tại.</p>')}`}

function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu và sao lưu</h1></div>${panel('Sao lưu & khôi phục',`<p>App lưu dữ liệu trên trình duyệt hiện tại. Gửi file HTML gốc sang máy khác không chuyển theo dữ liệu đã nhập. Dùng HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="actions">${btn('⬇️ Tải JSON','exportJson','primary')}${btn('⬇️ HTML kèm dữ liệu','exportHtml')}${btn('⬇️ Excel 4 sheet','exportExcel')}${btn('⬆️ Nhập JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Dữ liệu tham khảo',`<p>Mẫu gốc có 4 hoạt động và 20 học sinh, 6.660.000 ₫ phải thu, 5.540.000 ₫ đã nộp. Ngày hoạt động mẫu được tính tương đối từ ngày nạp. Các khoản đã nộp được giữ thành dòng “Số dư mẫu gốc” vì nguồn không có ngày/biên nhận từng lần thu.</p>${btn('Nạp mẫu (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ dữ liệu của app này trên trình duyệt.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn sử dụng</h1></div>${panel('Từ lập hoạt động đến chốt danh sách',`<ol><li>Tạo hoạt động: ngày, địa điểm, mức thu và sức chứa.</li><li>Thêm học sinh. Mức thu được ghi tại thời điểm đăng ký.</li><li>Ghi phụ huynh đồng ý/bảo hiểm theo bằng chứng có thật; lưu mã hoặc vị trí hồ sơ tham chiếu.</li><li>Thu tiền theo từng lần, ghi chứng từ, không cho thu vượt mức phải thu.</li><li>Trước ngày tổ chức, xem danh sách thiếu đồng ý, bảo hiểm và tiền. Chốt danh sách rồi in.</li><li>Sau hoạt động, đổi trạng thái hoàn thành và sao lưu dữ liệu.</li></ol>`)}${panel('Giới hạn',`<p>App chỉ hỗ trợ theo dõi nội bộ. Không tự xác minh sự đồng ý của phụ huynh, bảo hiểm, an toàn chuyến đi hoặc nghĩa vụ pháp lý. Không gửi thông báo khi đóng file. Không đồng bộ giữa thiết bị.</p>`)}`}
function render(){let map={home:['Tổng quan',home],events:['Hoạt động',eventsPage],detail:['Chi tiết hoạt động',detail],registration:['Hồ sơ đăng ký',registrationPage],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}

function openModal(kind,id='',parentId=''){
 let old=id?clone(kind==='event'?event(id):kind==='registration'?registration(id):db.payments.find(p=>p.id===id)):null;
 draft={kind,id,parentId,before:old};let x=old||{},f='';
 if(kind==='event')f=field('code','Mã hoạt động',x.code||'')+field('name','Tên hoạt động',x.name||'')+field('date','Ngày tổ chức',x.date||today(),'date')+field('place','Địa điểm',x.place||'')+field('fee','Mức thu mỗi học sinh (₫)',x.fee??0,'number')+field('capacity','Sức chứa tối đa',x.capacity??30,'number')+field('note','Ghi chú',x.note||'','textarea');
 if(kind==='registration')f=field('student','Tên học sinh',x.student||'')+field('className','Lớp',x.className||'')+field('parent','Tên phụ huynh',x.parent||'')+field('phone','Điện thoại phụ huynh',x.phone||'')+field('created','Ngày đăng ký',x.created||today(),'date')+field('fee','Mức thu cho học sinh (₫)',x.fee??event(parentId)?.fee??0,'number')+field('consent','Phụ huynh đồng ý',x.consent||'Chưa đồng ý','text',CONSENT)+field('consentRef','Mã/vị trí bằng chứng đồng ý',x.consentRef||'')+field('insurance','Bảo hiểm',x.insurance||'Chưa','text',INSURANCE)+field('insuranceRef','Mã/vị trí hồ sơ bảo hiểm',x.insuranceRef||'')+field('note','Ghi chú',x.note||'','textarea');
 if(kind==='payment')f=field('date','Ngày thu',x.date||today(),'date')+field('amount','Số tiền thu (₫)',x.amount??Math.max(0,registration(parentId)?.fee-paid(parentId)),'number')+field('method','Cách thu',x.method||'Tiền mặt','text',['Tiền mặt','Chuyển khoản','Khác'])+field('receipt','Mã chứng từ',x.receipt||'')+field('note','Ghi chú',x.note||'','textarea');
 if(id)f+=field('reason','Lý do sửa hồ sơ đã lưu','','textarea');
 $('#modalTitle').textContent=kind==='event'?(id?'Sửa hoạt động':'Tạo hoạt động'):kind==='registration'?(id?'Sửa đăng ký':'Đăng ký học sinh'):(id?'Sửa khoản thu':'Ghi khoản thu');$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal();
}
function formError(t){$('#formError').textContent=t}
function submit(){
 let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let kind=draft.kind,old=draft.before,backup=clone(db);
 if(old&&!x.reason){formError('Cần ghi lý do khi sửa hồ sơ đã lưu.');return}
 if(kind==='event'){
  x.code=x.code.toUpperCase();x.fee=Number(x.fee);x.capacity=Number(x.capacity);x.state=old?.state||'Đang nhận đăng ký';
  if(!x.code||!x.name||!dateOK(x.date)||!Number.isInteger(x.fee)||x.fee<0||!Number.isInteger(x.capacity)||x.capacity<1||db.events.some(e=>e.code===x.code&&e.id!==x.id)){formError('Mã không trùng, tên, ngày, mức thu và sức chứa hợp lệ là bắt buộc.');return}
  if(old&&x.capacity<regs(x.id).length){formError('Sức chứa mới không được nhỏ hơn số đã đăng ký.');return}
  delete x.reason;if(old)Object.assign(event(x.id),x);else db.events.push(x);audit(old?'Sửa hoạt động':'Tạo hoạt động',(f.get('reason')||'')+' · '+x.name,x.id);selected=x.id;page='detail';
 }else if(kind==='registration'){
  x.eventId=old?.eventId||draft.parentId;x.fee=Number(x.fee);let e=event(x.eventId);
  if(!e||!x.student||!dateOK(x.created)||!Number.isInteger(x.fee)||x.fee<0||!CONSENT.includes(x.consent)||!INSURANCE.includes(x.insurance)){formError('Tên, ngày, mức thu, đồng ý và bảo hiểm cần hợp lệ.');return}
  if(!old&&(e.state!=='Đang nhận đăng ký'||regs(e.id).length>=e.capacity)){formError('Hoạt động đã chốt hoặc hết chỗ.');return}
  if(!old&&regs(e.id).some(r=>r.student.toLocaleLowerCase('vi')===x.student.toLocaleLowerCase('vi'))){formError('Tên học sinh đã đăng ký trong hoạt động này.');return}
  if(old&&x.fee<paid(x.id)){formError('Mức thu không được thấp hơn số đã nộp.');return}
  delete x.reason;if(old)Object.assign(registration(x.id),x);else db.registrations.push(x);audit(old?'Sửa đăng ký':'Thêm đăng ký',(f.get('reason')||'')+' · '+x.student,e.id);db.audit.at(-1).registrationId=x.id;selected=x.id;page='registration';
 }else{
  x.registrationId=old?.registrationId||draft.parentId;x.amount=Number(x.amount);let r=registration(x.registrationId),e=r&&event(r.eventId);
  if(!r||!dateOK(x.date)||!Number.isInteger(x.amount)||x.amount<=0||!['Tiền mặt','Chuyển khoản','Khác'].includes(x.method)){formError('Ngày, số tiền dương và cách thu cần hợp lệ.');return}
  if((paid(r.id)-(old?.amount||0)+x.amount)>r.fee){formError('Số thu vượt mức phải thu của học sinh.');return}
  delete x.reason;if(old)Object.assign(db.payments.find(p=>p.id===x.id),x);else db.payments.push(x);audit(old?'Sửa khoản thu':'Ghi khoản thu',(f.get('reason')||'')+' · '+money(x.amount)+' · '+r.student,e.id);db.audit.at(-1).registrationId=r.id;selected=r.id;page='registration';
 }
 let err=validate(db);if(err){db=backup;formError(err);return}$('#editor').close();save()
}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'ngoai-khoa-sao-luu.json')}
function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'ngoai-khoa-kem-du-lieu.html')}
const HE=['ID','Mã','Tên','Ngày','Địa điểm','Mức thu','Sức chứa','Trạng thái','Ghi chú'],HR=['ID','ID hoạt động','Học sinh','Lớp','Phụ huynh','Điện thoại','Ngày đăng ký','Mức thu','Đồng ý','Bằng chứng đồng ý','Bảo hiểm','Hồ sơ bảo hiểm','Ghi chú'],HP=['ID','ID đăng ký','Ngày','Số tiền','Cách thu','Chứng từ','Ghi chú'],HA=['ID','Hành động','Lý do','ID hoạt động','ID đăng ký','Thời điểm'];
function sheets(){return [{name:'Hoat dong',rows:[HE,...db.events.map(e=>[e.id,e.code,e.name,e.date,e.place,e.fee,e.capacity,e.state,e.note])]},{name:'Dang ky',rows:[HR,...db.registrations.map(r=>[r.id,r.eventId,r.student,r.className,r.parent,r.phone,r.created,r.fee,r.consent,r.consentRef,r.insurance,r.insuranceRef,r.note])]},{name:'Thu tien',rows:[HP,...db.payments.map(p=>[p.id,p.registrationId,p.date,p.amount,p.method,p.receipt,p.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.eventId,a.registrationId||'',a.at])]}]}
function exportExcel(){download(Excel.workbook(sheets()),'ngoai-khoa-dang-ky-thu-tien.xlsx')}
async function importFile(kind,file){try{
 let x;if(kind==='json')x=JSON.parse(await file.text());else{
  let b=await Excel.read(file),defs=[['Hoat dong',HE],['Dang ky',HR],['Thu tien',HP],['Nhat ky',HA]];
  for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng bốn sheet do app xuất.');
  x=empty();x.settings=clone(db.settings);
  x.events=b['Hoat dong'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),name:String(r[2]),date:String(r[3]),place:String(r[4]||''),fee:Number(r[5]),capacity:Number(r[6]),state:String(r[7]),note:String(r[8]||'')}));
  x.registrations=b['Dang ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),eventId:String(r[1]),student:String(r[2]),className:String(r[3]||''),parent:String(r[4]||''),phone:String(r[5]||''),created:String(r[6]),fee:Number(r[7]),consent:String(r[8]),consentRef:String(r[9]||''),insurance:String(r[10]),insuranceRef:String(r[11]||''),note:String(r[12]||'')}));
  x.payments=b['Thu tien'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),registrationId:String(r[1]),date:String(r[2]),amount:Number(r[3]),method:String(r[4]),receipt:String(r[5]||''),note:String(r[6]||'')}));
  x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),eventId:String(r[3]||''),registrationId:String(r[4]||''),at:String(r[5])}));
 }
 let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.events.length} hoạt động và ${x.registrations.length} học sinh?`))return;db=x;page='home';save();
}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp dữ liệu mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today(),rel=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')},ids={};
 for(let r of EXTRA_SAMPLE.sk){let id=uid();ids[r[0]]=id;x.events.push({id,code:r[0],name:r[1],date:rel(r[2]),place:r[3],fee:r[4],capacity:r[5],state:'Đang nhận đăng ký',note:'Ngày tổ chức tương đối theo ngày nạp mẫu.'})}
 for(let r of EXTRA_SAMPLE.hs){let id=uid(),ev=x.events.find(e=>e.id===ids[r[1]]);x.registrations.push({id,eventId:ev.id,student:r[0],className:'',parent:'',phone:'',created:base,fee:ev.fee,consent:r[3],consentRef:'',insurance:r[4],insuranceRef:'',note:'Trạng thái mẫu chưa kèm hồ sơ chứng minh.'});if(r[2])x.payments.push({id:uid(),registrationId:id,date:base,amount:r[2],method:'Số dư mẫu gốc',receipt:'',note:'Số dư tổng từ mẫu, ngày thu thật chưa biết.'})}
 let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;
 if(k==='newEvent')openModal('event');else if(k==='editEvent')openModal('event',id);else if(k==='newRegistration')openModal('registration','',id);else if(k==='editRegistration'){let r=registration(id);openModal('registration',id,r.eventId)}else if(k==='newPayment')openModal('payment','',id);else if(k==='editPayment'){let p=db.payments.find(y=>y.id===id);openModal('payment',id,p.registrationId)}
 else if(k==='openEvent'){selected=id;page='detail';render()}else if(k==='openRegistration'){selected=id;page='registration';render()}else if(k==='events'){page='events';render()}
 else if(k==='changeState'){let x=event(id),choices=EVENT_STATES.map((s,i)=>`${i+1}. ${s}`).join('\n'),v=prompt(`Chọn số trạng thái mới:\n${choices}`);if(v===null)return;let next=EVENT_STATES[Number(v)-1];if(!next){alert('Số trạng thái không hợp lệ.');return}if(next==='Đã chốt danh sách'&&(stats(x).noConsent||stats(x).noInsurance)){if(!confirm('Danh sách còn học sinh chưa có đồng ý hoặc bảo hiểm. Vẫn chốt danh sách?'))return}let reason=prompt('Lý do / ghi chú đổi trạng thái:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}let prev=x.state;x.state=next;audit('Đổi trạng thái',prev+' → '+next+' · '+reason.trim(),id);save()}
 else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),asof=String(f.get('asof')),remind=Number(f.get('remind'));if(!dateOK(asof)||!Number.isInteger(remind)||remind<0||remind>365){alert('Ngày báo cáo hoặc số ngày nhắc không hợp lệ.');return}db.settings={asof,remind};save()}
 else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let n=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(n,n)}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();
$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};
$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};
render();
window.ExtraApp={getDB:()=>clone(db),validate,summary,stats,warnings,paid,loadSample,encode,decode,sheets,importFile};
