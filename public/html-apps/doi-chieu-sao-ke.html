function sample(anchor=today()){let d=blank(),ym=anchor.slice(0,7),top=Number(anchor.slice(8)),dd=n=>ym+'-'+String(Math.max(1,Math.min(n,top))).padStart(2,'0');d.settings={company:'Công ty TNHH An Phát',accountName:'TK Vietcombank',mode:MODES[0],tolerance:0,openBank:100000000,openBook:100000000};d.bank=SOURCE.bank.map((x,i)=>({id:'bank-'+i,date:dd(x[0]),description:x[1],inAmt:x[2],outAmt:x[3],handled:false,reason:''}));d.book=SOURCE.book.map((x,i)=>({id:'book-'+i,date:dd(x[0]),voucher:x[1],description:x[2],thu:x[3],chi:x[4],handled:false,reason:''}));return d}
function valid(d){if(!d||d.version!==1||!d.settings||typeof d.settings.company!=='string'||d.settings.company.length>300||typeof d.settings.accountName!=='string'||d.settings.accountName.length>300||!MODES.includes(d.settings.mode)||!Number.isSafeInteger(d.settings.tolerance)||d.settings.tolerance<0||d.settings.tolerance>365||!safe(d.settings.openBank)||!safe(d.settings.openBook)||!Array.isArray(d.bank)||!Array.isArray(d.book)||!Array.isArray(d.matches)||d.bank.length>100000||d.book.length>100000||d.matches.length>100000)return false;let ids=new Set();for(let x of d.bank){if(!x||typeof x.id!=='string'||!x.id||ids.has(x.id)||!dateOK(x.date)||typeof x.description!=='string'||x.description.length>1000||!safe(x.inAmt)||!safe(x.outAmt)||(x.inAmt>0)===(x.outAmt>0)||typeof x.handled!=='boolean'||typeof x.reason!=='string'||x.reason.length>1000||x.handled&&!x.reason.trim())return false;ids.add(x.id)}for(let x of d.book){if(!x||typeof x.id!=='string'||!x.id||ids.has(x.id)||!dateOK(x.date)||typeof x.voucher!=='string'||x.voucher.length>100||typeof x.description!=='string'||x.description.length>1000||!safe(x.thu)||!safe(x.chi)||(x.thu>0)===(x.chi>0)||typeof x.handled!=='boolean'||typeof x.reason!=='string'||x.reason.length>1000||x.handled&&!x.reason.trim())return false;ids.add(x.id)}let usedB=new Set(),usedK=new Set();for(let m of d.matches){let b=d.bank.find(x=>x.id===m?.bankId),k=d.book.find(x=>x.id===m?.bookId);if(!m||typeof m.id!=='string'||!m.id||ids.has(m.id)||!b||!k||b.handled||k.handled||usedB.has(b.id)||usedK.has(k.id)||sideKind(b)!==sideKind(k)||sideValue(b)!==sideValue(k)||typeof m.note!=='string'||m.note.length>500)return false;ids.add(m.id);usedB.add(b.id);usedK.add(k.id)}return true}
const bankBy=(key,d=db)=>d.bank.find(x=>x.id===key),bookBy=(key,d=db)=>d.book.find(x=>x.id===key);
function matchState(d){let usedB=new Set(d.matches.map(m=>m.bankId)),usedK=new Set(d.matches.map(m=>m.bookId));let bank=d.bank.filter(x=>!x.handled&&!usedB.has(x.id)),book=d.book.filter(x=>!x.handled&&!usedK.has(x.id)),suggestions=[],chosen=new Set();for(let b of bank.slice().sort((a,z)=>a.date.localeCompare(z.date)||a.id.localeCompare(z.id))){let eligible=book.filter(k=>!chosen.has(k.id)&&sideKind(k)===sideKind(b)&&sideValue(k)===sideValue(b)).map(k=>({k,delta:Math.abs(days(b.date,k.date))})).filter(x=>d.settings.mode==='Chỉ số tiền'||x.delta<=d.settings.tolerance).sort((x,y)=>x.delta-y.delta||x.k.date.localeCompare(y.k.date)||x.k.id.localeCompare(y.k.id));if(eligible.length){let x=eligible[0];suggestions.push({bankId:b.id,bookId:x.k.id,delta:x.delta,ambiguous:eligible.filter(z=>z.delta===x.delta).length>1});chosen.add(x.k.id)}}return{bank,book,suggestions,unpairedBank:bank.filter(b=>!suggestions.some(x=>x.bankId===b.id)),unpairedBook:book.filter(k=>!suggestions.some(x=>x.bookId===k.id))}}
function summary(d){let state=matchState(d),bankEnd=d.settings.openBank+sum(d.bank,sign),bookEnd=d.settings.openBook+sum(d.book,sign),diff=bankEnd-bookEnd,netBank=sum(state.bank,sign),netBook=sum(state.book,sign),handledBank=sum(d.bank.filter(x=>x.handled),sign),handledBook=sum(d.book.filter(x=>x.handled),sign),handled=handledBank-handledBook,unexplained=diff-(netBank-netBook)-handled;return{...state,bankEnd,bookEnd,diff,netBank,netBook,handled,unexplained,openingDifference:d.settings.openBank-d.settings.openBook,bankIn:sum(d.bank,x=>x.inAmt),bankOut:sum(d.bank,x=>x.outAmt),bookIn:sum(d.book,x=>x.thu),bookOut:sum(d.book,x=>x.chi)}}
function encode(d){return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');return valid(d)?d:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim());let db=valid(embedded)?embedded:stored()||blank(),page='dashboard',query='',modal=null;
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy tải bản sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}

const empty=t=>'<div class="empty">'+esc(t)+'</div>';

const opt=(value,label,current)=>'<option value="'+esc(value)+'" '+(String(value)===String(current)?'selected':'')+'>'+esc(label)+'</option>';
const field=(k,label,type,value='',opts='')=>'<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value??'')+'">')+'</div>';
const v=k=>$('#f_'+k)?.value.trim()||'';
const actions=(side,key)=>'<button class="btn small" data-edit="'+side+'" data-id="'+esc(key)+'">Sửa</button>';
const status=(x,side)=>{let m=db.matches.find(z=>(side==='bank'?z.bankId:z.bookId)===x.id);return x.handled?'Đã xử lý':m?'Đã xác nhận':'Chưa xác nhận'};
function dashboard(){let s=summary(db),total=db.bank.length+db.book.length,confirmed=db.matches.length*2,ratio=total?Math.round(confirmed/total*100):0;return hero('🏦 Đối chiếu sao kê ngân hàng','Ghép dòng sao kê với sổ tiền gửi và giải thích chênh lệch số dư.')+'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn primary" data-page="review">Xem '+s.suggestions.length+' gợi ý khớp</button><button class="btn" data-page="unmatched">Khoản cần xử lý</button></div><div class="grid">'+metric('Đã xác nhận',db.matches.length+' cặp',ratio+'% tổng dòng')+metric('Gợi ý chờ duyệt',s.suggestions.length)+metric('Sao kê chưa xác nhận',s.bank.length)+metric('Sổ chưa xác nhận',s.book.length)+metric('Chênh lệch số dư',money(s.diff))+'</div><p class="notice">Gợi ý dựa trên chiều tiền, số tiền và ngày theo cài đặt; chưa được coi là đã khớp đến khi anh xác nhận. Nội dung giao dịch không dùng để tự quyết định ghép.</p></section><div class="split"><section class="card"><h2>⚖️ Giải thích chênh lệch</h2><div class="check"><span>Số dư cuối sao kê</span><b>'+money(s.bankEnd)+'</b></div><div class="check"><span>Số dư cuối sổ</span><b>'+money(s.bookEnd)+'</b></div><div class="check"><span>Chỉ có ở sao kê (vào − ra)</span><b>'+money(s.netBank)+'</b></div><div class="check"><span>Chỉ có ở sổ (thu − chi)</span><b>'+money(s.netBook)+'</b></div><div class="check"><span>Đã đánh dấu xử lý (chênh lệch ròng)</span><b>'+money(s.handled)+'</b></div><div class="check"><span><b>Chưa giải thích</b><small>Thường là chênh lệch số dư đầu nếu các cặp đã xác nhận cùng chiều và cùng tiền.</small></span><strong>'+money(s.unexplained)+'</strong></div></section><section class="card"><h2>Quy trình đối chiếu</h2><ol><li>Nhập số dư đầu và hai danh sách.</li><li>Rà gợi ý, xác nhận đúng cặp hoặc ghép thủ công.</li><li>Xử lý các khoản chỉ có ở một bên, ghi lý do.</li><li>Đối chiếu số dư cuối và xuất báo cáo.</li></ol><p class="notice warn">Khoản gộp/tách hoặc lệch số tiền phải xử lý tay qua chứng từ; app không tự bù trừ.</p></section></div>'}

function dataPage(){return hero('💾 Dữ liệu & nhập nhanh','Sao lưu trước khi nhập nhiều dòng hoặc chuyển máy.')+'<section class="card"><div class="grid">'+metric('Dòng sao kê',db.bank.length)+metric('Dòng sổ',db.book.length)+metric('Cặp xác nhận',db.matches.length)+'</div><p class="notice warn">File HTML gốc không tự mang dữ liệu nhập trong trình duyệt. Dùng HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excel">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập lại Excel</button><button class="btn" data-action="csvBank">↓ CSV sao kê</button><button class="btn" data-action="csvBook">↓ CSV sổ</button></div><p class="muted">Excel có 4 sheet dữ liệu và 1 sheet báo cáo. Nhập lại Excel thay thế toàn bộ dữ liệu; dán nhiều dòng chỉ thêm vào danh sách chọn.</p></section><section class="card"><h2>Dán nhiều dòng từ Excel</h2><div class="toolbar"><label>Nhập vào <select id="pasteSide">'+opt('bank','Sao kê ngân hàng','bank')+opt('book','Sổ sách','bank')+'</select></label></div><p class="muted">Sao kê: Ngày [Tab] Nội dung [Tab] Tiền vào [Tab] Tiền ra. Sổ: Ngày [Tab] Số chứng từ [Tab] Diễn giải [Tab] Thu [Tab] Chi. Ngày YYYY-MM-DD hoặc DD/MM/YYYY. Tiền nguyên đồng, ví dụ 1250000 hoặc 1.250.000. Có thể dùng dấu chấm phẩy thay Tab.</p><textarea id="pasteText" class="letter" rows="9" placeholder="02/11/2026&#9;Khách chuyển khoản&#9;25000000&#9;0"></textarea><p><button class="btn primary" data-action="pasteImport">Kiểm tra và nhập dòng</button></p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>12 dòng sao kê, 12 dòng sổ và số dư đầu 100 triệu đồng mỗi bên. Mẫu chỉ nạp khi chọn.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Cách sử dụng','Đối chiếu hai bên từng dòng, xác nhận cặp và giải thích chênh lệch.')+'<section class="card"><ol><li>Nhập số dư đầu của sao kê và sổ sách ở Cài đặt.</li><li>Nhập dòng sao kê và dòng sổ riêng, từng dòng chỉ có một chiều tiền.</li><li>Xem gợi ý khớp; kiểm tra nội dung và xác nhận từng cặp. Có thể ghép thủ công cùng chiều và cùng tiền.</li><li>Khoản chỉ có ở sao kê có thể ghi thêm vào sổ; khoản đã xử lý phải ghi lý do.</li><li>Soát chênh lệch số dư, in báo cáo và sao lưu dữ liệu.</li></ol><p>App chỉ so khớp 1–1 theo chiều tiền, số tiền và ngày tùy cài đặt. Không tự hiểu diễn giải, không tự xử lý khoản gộp/tách hay chứng từ sai số tiền. Đối chiếu với sao kê gốc trước khi chốt.</p></section>'}
function render(){let titles={dashboard:'Tổng quan',review:'Duyệt cặp khớp',unmatched:'Khoản cần xử lý',bank:'Sao kê ngân hàng',book:'Sổ tiền gửi',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,review:reviewPage,unmatched:unmatchedPage,bank:bankPage,book:bookPage,report:reportPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Đối chiếu sao kê')+'</b> · '+esc(titles[page])+' · '+esc(db.settings.accountName)+'</div>'+views[page]()}
function openModal(kind,key='',side=''){let old=kind==='resolve'?(side==='bank'?bankBy(key):bookBy(key)):(kind==='bank'?bankBy(key):bookBy(key));old=old||{};modal={kind,key,side};$('#modalTitle').textContent=kind==='resolve'?'Đánh dấu đã xử lý':(key?'Sửa ':'Thêm ')+(kind==='bank'?'dòng sao kê':'dòng sổ');let h='';if(kind==='bank')h=field('date','Ngày *','date',old.date||today())+field('description','Nội dung','textarea',old.description)+field('inAmt','Tiền vào (đ)','number',old.inAmt??0)+field('outAmt','Tiền ra (đ)','number',old.outAmt??0);if(kind==='book')h=field('date','Ngày *','date',old.date||today())+field('voucher','Số chứng từ','text',old.voucher)+field('description','Diễn giải','textarea',old.description)+field('thu','Thu (đ)','number',old.thu??0)+field('chi','Chi (đ)','number',old.chi??0);if(kind==='resolve')h='<p class="wide notice warn">Đã xử lý chỉ bỏ qua dòng này khi ghép; dòng vẫn tham gia tính số dư cuối. Ghi lý do để sau này đối chiếu.</p>'+field('reason','Lý do xử lý *','textarea',old.reason);if(key&&kind!=='resolve')h+='<div class="wide"><button type="button" class="btn danger small" data-action="deleteRecord">Xóa dòng này</button></div>';$('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){if(!modal)return;let{kind,key,side}=modal,x={},error='';if(kind==='resolve'){let reason=v('reason');if(!reason||reason.length>1000){$('#modalError').textContent='Cần ghi lý do xử lý.';return}let d=structuredClone(db),rec=(side==='bank'?d.bank:d.book).find(z=>z.id===key);rec.handled=true;rec.reason=reason;if(!valid(d)){$('#modalError').textContent='Dòng đã được ghép hoặc dữ liệu sai.';return}db=d;closeModal();save();return}if(kind==='bank'){x={date:v('date'),description:v('description'),inAmt:num(v('inAmt')),outAmt:num(v('outAmt'))};if(!dateOK(x.date)||x.description.length>1000||!safe(x.inAmt)||!safe(x.outAmt)||(x.inAmt>0)===(x.outAmt>0))error='Chọn ngày và nhập đúng một chiều tiền vào hoặc ra.'}else{x={date:v('date'),voucher:v('voucher'),description:v('description'),thu:num(v('thu')),chi:num(v('chi'))};if(!dateOK(x.date)||x.voucher.length>100||x.description.length>1000||!safe(x.thu)||!safe(x.chi)||(x.thu>0)===(x.chi>0))error='Chọn ngày và nhập đúng một chiều Thu hoặc Chi.'}let old=kind==='bank'?bankBy(key):bookBy(key),linked=db.matches.some(m=>(kind==='bank'?m.bankId:m.bookId)===key);if(linked&&old&&(sideValue(old)!==sideValue(x)||sideKind(old)!==sideKind(x)))error='Dòng đã ghép: bỏ ghép trước khi đổi chiều hoặc số tiền.';if(error){$('#modalError').textContent=error;return}let d=structuredClone(db),arr=kind==='bank'?d.bank:d.book;if(key)Object.assign(arr.find(z=>z.id===key),x);else arr.push({id:uid(),...x,handled:false,reason:''});if(!valid(d)){$('#modalError').textContent='Dữ liệu không hợp lệ.';return}db=d;closeModal();save()}
function confirmPair(bankId,bookId,note=''){let b=bankBy(bankId),k=bookBy(bookId);if(!b||!k||b.handled||k.handled||db.matches.some(m=>m.bankId===bankId||m.bookId===bookId)||sideKind(b)!==sideKind(k)||sideValue(b)!==sideValue(k)){alert('Hai dòng không thể ghép: kiểm tra chiều tiền, số tiền hoặc liên kết cũ.');return false}let d=structuredClone(db);d.matches.push({id:uid(),bankId,bookId,note});if(!valid(d)){alert('Liên kết không hợp lệ.');return false}db=d;save();return true}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('doi-chieu-sao-ke-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){let s=summary(db);return[{name:'Sao ke',rows:[['Mã nội bộ','Ngày','Nội dung','Tiền vào','Tiền ra','Đã xử lý','Lý do'],...db.bank.map(x=>[x.id,x.date,x.description,x.inAmt,x.outAmt,String(x.handled),x.reason])]},{name:'So sach',rows:[['Mã nội bộ','Ngày','Chứng từ','Diễn giải','Thu','Chi','Đã xử lý','Lý do'],...db.book.map(x=>[x.id,x.date,x.voucher,x.description,x.thu,x.chi,String(x.handled),x.reason])]},{name:'Ghep cap',rows:[['Mã liên kết','Mã sao kê','Mã sổ','Ghi chú'],...db.matches.map(m=>[m.id,m.bankId,m.bookId,m.note])]},{name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]},{name:'Tong hop',rows:[['Chỉ tiêu','Số tiền / số dòng'],['Số dư sao kê',s.bankEnd],['Số dư sổ',s.bookEnd],['Chênh lệch',s.diff],['Chưa xác nhận sao kê',s.bank.length],['Chưa xác nhận sổ',s.book.length],['Chênh từ sao kê',s.netBank],['Chênh từ sổ',-s.netBook],['Đã xử lý',s.handled],['Chưa giải thích',s.unexplained]]}]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='doi-chieu-sao-ke.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(x){if(typeof x==='number'){let d=new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000);return d.toISOString().slice(0,10)}let s=String(x??'').trim();if(dateOK(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let d=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return dateOK(d)?d:''}return''}
function parsedExcel(s){if(s['Sao ke']?.[0]?.[0]!=='Mã nội bộ'||s['So sach']?.[0]?.[0]!=='Mã nội bộ'||s['Ghep cap']?.[0]?.[0]!=='Mã liên kết')throw Error('Cần file Excel do app xuất có đủ Sao kê, Sổ sách và Ghép cặp.');let d=blank();d.bank=s['Sao ke'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),date:parseDate(r[1]),description:String(r[2]??''),inAmt:num(r[3]),outAmt:num(r[4]),handled:String(r[5]).toLowerCase()==='true',reason:String(r[6]??'')}));d.book=s['So sach'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),date:parseDate(r[1]),voucher:String(r[2]??''),description:String(r[3]??''),thu:num(r[4]),chi:num(r[5]),handled:String(r[6]).toLowerCase()==='true',reason:String(r[7]??'')}));d.matches=s['Ghep cap'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),bankId:String(r[1]??''),bookId:String(r[2]??''),note:String(r[3]??'')}));if(s['Cai dat']){let raw=Object.fromEntries(s['Cai dat'].slice(1).filter(r=>r[0]).map(r=>[String(r[0]),r[1]]));for(let k of Object.keys(d.settings))if(raw[k]!==undefined)d.settings[k]=['tolerance','openBank','openBook'].includes(k)?num(raw[k]):String(raw[k])}if(!valid(d))throw Error('Excel có ngày, số tiền, lý do hoặc liên kết không hợp lệ.');return d}
function csv(side){let rows=side==='bank'?[['Ngày','Nội dung','Tiền vào','Tiền ra','Đã xử lý','Lý do'],...db.bank.map(x=>[x.date,x.description,x.inAmt,x.outAmt,x.handled?'Có':'Không',x.reason])]:[['Ngày','Số CT','Diễn giải','Thu','Chi','Đã xử lý','Lý do'],...db.book.map(x=>[x.date,x.voucher,x.description,x.thu,x.chi,x.handled?'Có':'Không',x.reason])];download(side==='bank'?'sao-ke.csv':'so-tien-gui.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function moneyText(x){let s=String(x??'').trim();if(!s)return 0;if(!/^-?(?:\d+|\d{1,3}(?:[.,]\d{3})+)$/.test(s))return NaN;let n=Number(s.replace(/[.,]/g,''));return Number.isSafeInteger(n)?n:NaN}
function parsePaste(text,side){let lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim()),rows=[];if(lines.length>5000)throw Error('Tối đa 5.000 dòng một lượt.');for(let [i,line] of lines.entries()){let cells=line.split(line.includes('\t')?'\t':';').map(x=>x.trim()),dt=parseDate(cells[0]);if(!dt&&i===0)continue;if(!dt)throw Error('Dòng '+(i+1)+': ngày không hợp lệ.');if(side==='bank'){if(cells.length<4)throw Error('Dòng '+(i+1)+': cần 4 cột sao kê.');let inside=moneyText(cells[2]),outside=moneyText(cells[3]);if(inside<0&&outside===0){outside=-inside;inside=0}if(!safe(inside)||!safe(outside)||(inside>0)===(outside>0))throw Error('Dòng '+(i+1)+': nhập một chiều tiền vào hoặc ra.');rows.push({id:uid(),date:dt,description:cells[1],inAmt:inside,outAmt:outside,handled:false,reason:''})}else{if(cells.length<5)throw Error('Dòng '+(i+1)+': cần 5 cột sổ.');let thu=moneyText(cells[3]),chi=moneyText(cells[4]);if(!safe(thu)||!safe(chi)||(thu>0)===(chi>0))throw Error('Dòng '+(i+1)+': nhập một chiều Thu hoặc Chi.');rows.push({id:uid(),date:dt,voucher:cells[1],description:cells[2],thu,chi,handled:false,reason:''})}}if(!rows.length)throw Error('Không có dòng dữ liệu hợp lệ.');let d=structuredClone(db);d[side].push(...rows);if(!valid(d))throw Error('Dữ liệu quá dài hoặc không hợp lệ.');return rows}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')window.print();if(a==='backup')download('doi-chieu-sao-ke.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='csvBank')csv('bank');if(a==='csvBook')csv('book');if(a==='sample'){if(!confirm('Nạp mẫu sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sample();save()}if(a==='clear'){if(confirm('Xóa toàn bộ sao kê, sổ, cặp ghép và cài đặt trên trình duyệt này?')){db=blank();save()}}if(a==='settings'){let d=structuredClone(db);d.settings={company:v('company'),accountName:v('accountName'),mode:v('mode'),tolerance:num(v('tolerance')),openBank:num(v('openBank')),openBook:num(v('openBook'))};if(!valid(d)){alert('Cài đặt không hợp lệ.');return}db=d;save()}if(a==='confirmPair')confirmPair(b.dataset.bank,b.dataset.book,'Xác nhận gợi ý');if(a==='manualPair'){let bid=$('#manualBank')?.value,kid=$('#manualBook')?.value;if(bid&&kid)confirmPair(bid,kid,'Ghép thủ công');else alert('Chọn một dòng ở mỗi bên.')}if(a==='confirmAll'){let list=matchState(db).suggestions.filter(x=>!x.ambiguous);if(!list.length){alert('Không có gợi ý rõ ràng để xác nhận.');return}if(!confirm('Xác nhận '+list.length+' cặp gợi ý rõ ràng? Hãy rà nội dung trước.'))return;let d=structuredClone(db);for(let x of list)d.matches.push({id:uid(),bankId:x.bankId,bookId:x.bookId,note:'Xác nhận gợi ý'});if(!valid(d)){alert('Liên kết không hợp lệ.');return}db=d;save()}if(a==='unlink'){if(!confirm('Bỏ ghép cặp này?'))return;db.matches=db.matches.filter(m=>m.id!==b.dataset.id);save()}if(a==='resolve')openModal('resolve',b.dataset.id,b.dataset.side);if(a==='undoResolve'){let rec=b.dataset.side==='bank'?bankBy(b.dataset.id):bookBy(b.dataset.id);if(!rec)return;if(!confirm('Mở lại dòng này để đối chiếu?'))return;rec.handled=false;rec.reason='';save()}if(a==='toBook'){let bank=bankBy(b.dataset.id);if(!bank||bank.handled||db.matches.some(m=>m.bankId===bank.id))return;if(!confirm('Tạo dòng sổ từ khoản sao kê này và xác nhận liên kết? Hãy kiểm tra chứng từ gốc trước.'))return;let k={id:uid(),date:bank.date,voucher:'ĐC-'+String(db.book.length+1).padStart(3,'0'),description:bank.description,thu:bank.inAmt,chi:bank.outAmt,handled:false,reason:''},d=structuredClone(db);d.book.push(k);d.matches.push({id:uid(),bankId:bank.id,bookId:k.id,note:'Bổ sung sổ từ sao kê'});if(!valid(d)){alert('Không thể tạo dòng sổ.');return}db=d;save()}if(a==='pasteImport'){try{let side=$('#pasteSide').value,rows=parsePaste($('#pasteText').value,side);if(!confirm('Thêm '+rows.length+' dòng vào '+(side==='bank'?'sao kê':'sổ sách')+'? Kiểm tra tránh nhập trùng.'))return;db[side].push(...rows);save()}catch(err){alert('Không nhập được: '+err.message)}}if(a==='deleteRecord'&&modal?.key){let{kind,key}=modal;if(db.matches.some(m=>(kind==='bank'?m.bankId:m.bookId)===key)){$('#modalError').textContent='Dòng đã ghép; bỏ ghép trước khi xóa.';return}if(!confirm('Xóa vĩnh viễn dòng này?'))return;db[kind]=db[kind].filter(x=>x.id!==key);closeModal();save()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
