inish);$('#screen').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;render()});let backup=$('[data-backup]');if(backup)backup.onclick=()=>{let blob=new Blob([JSON.stringify({app:'aimo-english',schema:2,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='luyen-tieng-anh-sao-luu.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};let restore=$('#restore');if(restore)restore.onchange=async()=>{try{let x=JSON.parse(await restore.files[0].text());if(x.app!=='aimo-english'||x.schema!==2||!Array.isArray(x.data.history)||!Array.isArray(x.data.wrong))throw Error('File không đúng ứng dụng hoặc phiên bản.');if(confirm('Thay lịch sử hiện tại bằng bản sao lưu?')){state=x.data;save();render()}}catch(e){$('#status').textContent=e.message}};let clear=$('[data-clear]');if(clear)clear.onclick=()=>{if(confirm('Xóa lịch sử và sổ câu sai trên máy?')){state={history:[],wrong:[]};save();render()}}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(section==='play'&&run&&!run.ended&&Object.keys(run.answers).length&&!confirm('Thoát sẽ bỏ bài đang làm. Tiếp tục?'))return;clearInterval(clock);section=b.dataset.nav;render()});render();
const vocabData=[["family","mother","mẹ"],["family","father","bố"],["family","sister","chị/em gái"],["family","brother","anh/em trai"],["family","grandmother","bà"],["family","grandfather","ông"],["family","parent","cha hoặc mẹ"],["family","baby","em bé"],["school","teacher","giáo viên"],["school","student","học sinh"],["school","book","quyển sách"],["school","pencil","bút chì"],["school","desk","bàn học"],["school","classroom","phòng học"],["school","lesson","bài học"],["school","schoolbag","cặp sách"],["food","rice","cơm"],["food","bread","bánh mì"],["food","milk","sữa"],["food","apple","quả táo"],["food","banana","quả chuối"],["food","water","nước"],["food","egg","quả trứng"],["food","fish","cá"],["family","aunt","cô/dì"],["family","uncle","chú/bác/cậu"],["family","cousin","anh/chị/em họ"],["family","daughter","con gái"],["family","son","con trai"],["family","wife","vợ"],["family","husband","chồng"],["family","relative","họ hàng"],["school","notebook","vở ghi"],["school","eraser","cục tẩy"],["school","ruler","thước kẻ"],["school","library","thư viện"],["school","homework","bài tập về nhà"],["school","subject","môn học"],["school","exam","bài kiểm tra"],["school","timetable","thời khóa biểu"],["food","vegetable","rau"],["food","fruit","trái cây"],["food","chicken","thịt gà"],["food","noodle","mì/bún"],["food","breakfast","bữa sáng"],["food","dinner","bữa tối"],["food","hungry","đói"],["food","delicious","ngon"]];const topicNames={family:'Gia đình',school:'Trường học',food:'Đồ ăn'};let selectedTopic='family';const originalRender=render;render=function(){if(section!=='vocab'){originalRender();return}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===section));const list=vocabData.filter(x=>x[0]===selectedTopic);$('#screen').innerHTML='<div class="hero"><h2>Từ vựng theo chủ đề</h2><p>Chọn nhóm từ, nghe phát âm và tự kiểm tra nghĩa.</p></div><div class="card"><h2>Chọn chủ đề</h2><div class="row">'+Object.entries(topicNames). document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(section==='play'&&run&&!run.ended&&Object.keys(run.answers).length&&!confirm('Thoát sẽ bỏ bài đang làm. Tiếp tục?'))return;clearInterval(clock);section=b.dataset.nav;render()});render();

render=function(){previousRenderForFiles();if(section==='data'){let row=$('#screen .card .row');if(row){let saveButton=el('button',{className:'btn'},'Tải HTML kèm dữ liệu');saveButton.onclick=()=>{let copy=document.documentElement.cloneNode(true);let embedded=copy.querySelector('#embedded-state');embedded.textContent=btoa(unescape(encodeURIComponent(JSON.stringify(state))));let blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=document.title.includes('Tiếng Anh')?'luyen-tieng-anh-du-lieu.html':'ghep-van-chinh-ta-du-lieu.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};row.insertBefore(saveButton,row.firstChild);let note=el('p',{className:'muted'},'Sau mỗi buổi học, tải lại bản HTML này để mang dữ liệu sang máy khác. Dữ liệu mới vẫn được tự lưu trong trình duyệt đang dùng.');row.after(note)}}if(section==='history'&&state.history.length){let card=$('#screen .card');let csvButton=el('button',{className:'btn'},'Xuất lịch sử CSV');csvButton.onclick=()=>{let rows=[['Thời gian','Lớp','Dạng bài','Chế độ','Số đúng','Tổng câu'],...state.history.map(x=>[x.at,x.grade,labels[x.kind]||x.kind,x.mode,x.correct,x.total])];let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download=document.title.includes('Tiếng Anh')?'lich-su-tieng-anh.csv':'lich-su-ghep-van.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};card.insertBefore(csvButton,card.firstChild);let printButton=el('button',{className:'btn'},'In báo cáo');printButton.style.marginLeft='8px';printButton.onclick=()=>window.print();card.insertBefore(printButton,csvButton.nextSibling)}};render();
