const initial=()=>({app:APP,version:VER,settings:{asof:today(),org:'Xưởng sản xuất'},tools:[],loans:[],events:[]});
let db=initial(),page='home',selected='',search='',loanFilter='all',formMode='',formId='';
const tool=id=>db.tools.find(x=>x.id===id),loan=id=>db.loans.find(x=>x.id===id),loanRows=id=>db.loans.filter(x=>x.toolId===id);
const overdue=l=>l.state==='Đang mượn'?Math.max(0,days(db.settings.asof,l.due)):l.returnDate?Math.max(0,days(l.returnDate,l.due)):0;
const active=id=>loanRows(id).filter(l=>l.state==='Đang mượn');
const totalVal=()=>db.tools.reduce((n,t)=>n+t.value,0);
function stats(){let open=db.loans.filter(l=>l.state==='Đang mượn');return {tools:db.tools.length,loans:db.loans.length,open:open.length,over:open.filter(l=>overdue(l)>0).length,value:totalVal(),available:db.tools.filter(t=>!active(t.id).length).length,conflict:db.tools.filter(t=>active(t.id).length>1).length}}
function overlap(id){let a=loanRows(id).slice().sort((x,y)=>x.borrowDate.localeCompare(y.borrowDate)),pairs=[];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){let end=a[i].state==='Đã trả'?a[i].returnDate:'9999-12-31';if(a[j].borrowDate<=end)pairs.push([a[i],a[j]])}return pairs}
function validate(x){if(!x||x.app!==APP||x.version!==VER||!x.settings||!dateOK(x.settings.asof)||!Array.isArray(x.tools)||!Array.isArray(x.loans)||!Array.isArray(x.events))return 'Cấu trúc dữ liệu không hợp lệ.';let ids=new Set(),codes=new Set();for(let t of x.tools){if(!t.id||ids.has(t.id)||!t.code||codes.has(t.code.toUpperCase())||!t.name||!t.type||!Number.isSafeInteger(t.value)||t.value<0||String(t.note||'').length>1200)return 'Dụng cụ trùng mã hoặc dữ liệu không hợp lệ.';ids.add(t.id);codes.add(t.code.toUpperCase())}let lids=new Set();for(let l of x.loans){if(!l.id||lids.has(l.id)||!ids.has(l.toolId)||!l.borrower||!dateOK(l.borrowDate)||!dateOK(l.due)||l.due<l.borrowDate||!['Đang mượn','Đã trả'].includes(l.state)||l.state==='Đã trả'&&(!dateOK(l.returnDate)||l.returnDate<l.borrowDate)||l.state==='Đang mượn'&&l.returnDate||String(l.note||'').length>1200)return 'Lượt mượn/trả không hợp lệ.';lids.add(l.id)}let eids=new Set();for(let e of x.events){if(!e.id||eids.has(e.id)||!e.at||!e.action||e.toolId&&!ids.has(e.toolId)||e.loanId&&!lids.has(e.loanId))return 'Nhật ký không hợp lệ.';eids.add(e.id)}return ''}
function b64(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function embedded(){try{let v=$('#embedded-state').textContent.trim();return v==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(v))))}catch{return null}}
try{let e=embedded(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert(err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy xuất JSON hoặc HTML kèm dữ liệu.')}render();return true}
function log(action,reason='',toolId='',loanId=''){db.events.push({id:uid(),at:new Date().toISOString(),action,reason,toolId,loanId})}
const btn=(label,act,cls='',id='')=>`<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`;
const card=(head,content,cls='')=>`<section class="card ${cls}"><h2>${head}</h2>${content}</section>`;
function status(l){if(l.state==='Đã trả')return `<span class="tag green">Đã trả${overdue(l)?` · trễ ${overdue(l)} ngày`:''}</span>`;return overdue(l)?`<span class="tag red">Quá hạn ${overdue(l)} ngày</span>`:`<span class="tag amber">Đang mượn</span>`}
function shelfCard(t){let a=active(t.id),ov=a.some(l=>overdue(l)>0),conf=a.length>1;return `<article class="shelf-item"><div class="shelf-mark">${esc((t.type||'D').slice(0,1).toUpperCase())}</div><div class="shelf-main"><small>${esc(t.type)} · ${esc(t.code)}</small><h3>${esc(t.name)}</h3><p>${a.length?`<b>${esc(a.map(l=>l.borrower).join(', '))}</b> đang giữ`:'Đang sẵn trong kho'}</p><span class="tag ${conf?'red':ov?'red':a.length?'amber':'green'}">${conf?'Nhiều lượt đang mượn':ov?'Quá hạn':a.length?'Đang mượn':'Sẵn sàng'}</span></div><button class="btn ghost" data-act="openTool" data-id="${esc(t.id)}">Xem hồ sơ →</button></article>`}
function home(){let s=stats(),urgent=db.loans.filter(l=>l.state==='Đang mượn'&&overdue(l)>0).sort((a,b)=>overdue(b)-overdue(a));return `<div class="workspace-head"><div><span class="eyebrow">AI MỞ · TỦ DỤNG CỤ XƯỞNG</span><h1>Ai đang giữ dụng cụ nào?</h1><p>Cho mượn, nhận trả và đối chiếu thời hạn trên cùng một bàn làm việc.</p></div><div class="action-stack">${btn('＋ Ghi lượt mượn','newLoan','primary')}${btn('＋ Thêm dụng cụ','newTool')}</div></div><div class="workbench"><aside class="urgent-tray"><div class="tray-head"><span>KHAY CẦN XỬ LÝ</span><strong>${s.over}</strong></div><h2>Lượt quá hạn</h2>${urgent.length?urgent.slice(0,6).map(l=>`<button class="tray-row" data-act="openLoan" data-id="${esc(l.id)}"><b>${esc(tool(l.toolId).code)} · ${esc(l.borrower)}</b><span>Quá ${overdue(l)} ngày · hạn ${fmt(l.due)}</span></button>`).join(''):'<p class="empty">Chưa có lượt quá hạn.</p>'}<button class="text-link" data-act="loans">Mở sổ mượn trả →</button></aside><div class="shelf-zone"><div class="section-title"><div><span class="eyebrow">TỦ DỤNG CỤ</span><h2>${s.available} sẵn sàng / ${s.tools} đang quản lý</h2></div>${btn('Xem danh mục','tools','small')}</div><div class="shelf-grid">${db.tools.length?db.tools.slice(0,8).map(shelfCard).join(''):'<div class="empty">Tủ đang trống. Thêm dụng cụ hoặc nạp dữ liệu mẫu.</div>'}</div></div></div><div class="ledger-strip"><div><small>TỔNG LƯỢT MƯỢN</small><strong>${s.loans}</strong></div><div><small>ĐANG MƯỢN</small><strong>${s.open}</strong></div><div><small>QUÁ HẠN</small><strong>${s.over}</strong></div><div><small>GIÁ TRỊ QUẢN LÝ</small><strong>${money(s.value)}</strong></div></div>${s.conflict?`<p class="notice">Có ${s.conflict} dụng cụ được ghi cho nhiều người đang mượn; cần đối chiếu biên bản.</p>`:''}`}
function toolsPage(){return `<div class="page-head"><div><span class="eyebrow">TỦ DỤNG CỤ</span><h1>Danh mục & người giữ</h1><p>Giá trị là giá trị quản lý theo file nguồn, không tính khấu hao.</p></div>${btn('＋ Thêm dụng cụ','newTool','primary')}</div><div class="shelf-grid full">${db.tools.map(shelfCard).join('')||'<div class="empty">Chưa có dụng cụ.</div>'}</div>`}

function reportsPage(){let s=stats(),byType=[...new Set(db.tools.map(t=>t.type))].map(type=>({type,tools:db.tools.filter(t=>t.type===type)}));return `<div class="page-head"><div><span class="eyebrow">BÁO CÁO NỘI BỘ</span><h1>Trách nhiệm & tài sản</h1><p>Ngày đối chiếu ${fmt(db.settings.asof)}.</p></div>${btn('⬇ Excel','exportExcel','primary')}</div><div class="ledger-strip"><div><small>DỤNG CỤ</small><strong>${s.tools}</strong></div><div><small>ĐANG GIỮ</small><strong>${s.open}</strong></div><div><small>QUÁ HẠN</small><strong>${s.over}</strong></div><div><small>GIÁ TRỊ</small><strong>${money(s.value)}</strong></div></div><div class="report-grid">${card('Theo loại',byType.map(g=>`<div class="bar-row"><span>${esc(g.type)}</span><i style="width:${Math.max(4,g.tools.length/(s.tools||1)*100)}%"></i><b>${g.tools.length} · ${money(g.tools.reduce((n,t)=>n+t.value,0))}</b></div>`).join('')||'<p>Chưa có dữ liệu.</p>')}${card('Cần đối chiếu',db.tools.filter(t=>overlap(t.id).length||active(t.id).length>1).map(t=>`<div class="list-row"><button class="text-link" data-act="openTool" data-id="${esc(t.id)}">${esc(t.code)} · ${esc(t.name)}</button><small>${overlap(t.id).length} cặp lịch sử chồng</small></div>`).join('')||'<p>Không có lịch sử chồng.</p>')}</div>${card('Lượt đang mượn',loanTable(db.loans.filter(l=>l.state==='Đang mượn').sort((a,b)=>overdue(b)-overdue(a))))}`}

function openForm(mode,id=''){formMode=mode;formId=id;let title='',content='';if(mode==='newTool'||mode==='editTool'){let t=tool(id)||{};title=id?'Sửa hồ sơ dụng cụ':'Thêm dụng cụ';content=input('Mã dụng cụ *','code',t.code,'text','required maxlength="40"')+input('Tên dụng cụ *','name',t.name,'text','required maxlength="160"')+input('Loại *','type',t.type,'text','required maxlength="100"')+input('Giá trị quản lý (₫) *','value',t.value??0,'number','required min="0" step="1"')+textarea('Ghi chú','note',t.note)}
else if(mode==='newLoan'){title='Ghi lượt mượn';let available=db.tools.filter(t=>!active(t.id).length);content=`<label>Dụng cụ *<select name="toolId" required>${available.map(t=>`<option value="${esc(t.id)}" ${t.id===id?'selected':''}>${esc(t.code)} · ${esc(t.name)}</option>`).join('')}</select></label>`+input('Người mượn *','borrower','','text','required maxlength="120"')+input('Ngày mượn *','borrowDate',today(),'date','required')+input('Hạn trả *','due',today(),'date','required')+input('Người giao','lender','','text','maxlength="120"')+input('Tình trạng lúc giao','conditionOut','Bình thường','text','maxlength="160"')+textarea('Ghi chú bàn giao','note','')}
else if(mode==='returnLoan'){let l=loan(id),t=tool(l.toolId);title='Nhận trả '+t.code;content=`<p class="wide note">Người đang giữ: <b>${esc(l.borrower)}</b> · hạn ${fmt(l.due)}.</p>`+input('Ngày trả *','returnDate',today(),'date',`required min="${l.borrowDate}"`)+input('Người nhận lại *','receiver','','text','required maxlength="120"')+input('Tình trạng lúc trả *','conditionIn','Bình thường','text','required maxlength="160"')+textarea('Ghi chú trả','note',l.note)}
else if(mode==='extendLoan'){let l=loan(id);title='Gia hạn '+tool(l.toolId).code;content=`<p class="wide note">Hạn cũ: ${fmt(l.due)} · ${esc(l.borrower)}.</p>`+input('Hạn mới *','due',l.due,'date',`required min="${l.due}"`)+textarea('Lý do gia hạn *','reason','')}
$('#dialogTitle').textContent=title;$('#formFields').innerHTML=content;$('#formError').textContent='';$('#editor').showModal()}
const val=(f,n)=>String(new FormData(f).get(n)||'').trim();
function submitForm(e){e.preventDefault();let old=clone(db),f=e.target;try{if(formMode==='newTool'||formMode==='editTool'){let existing=tool(formId),code=val(f,'code'),name=val(f,'name'),type=val(f,'type'),value=Number(val(f,'value'));if(!code||!name||!type||!Number.isSafeInteger(value)||value<0)throw Error('Kiểm tra mã, tên, loại và giá trị.');if(db.tools.some(t=>t.id!==formId&&t.code.toUpperCase()===code.toUpperCase()))throw Error('Mã dụng cụ đã có.');let v={code,name,type,value,note:val(f,'note')};if(existing)Object.assign(existing,v);else{existing={id:uid(),...v};db.tools.push(existing)}log(formId?'Sửa dụng cụ':'Thêm dụng cụ',code,existing.id);selected=existing.id;page='tool'}
else if(formMode==='newLoan'){let toolId=val(f,'toolId'),t=tool(toolId),borrowDate=val(f,'borrowDate'),due=val(f,'due'),borrower=val(f,'borrower');if(!t||!borrower||!dateOK(borrowDate)||!dateOK(due)||due<borrowDate)throw Error('Chọn dụng cụ, người mượn, ngày và hạn hợp lệ.');if(active(toolId).length)throw Error('Dụng cụ đang được mượn. Cần nhận trả trước khi ghi lượt mới.');if(loanRows(toolId).some(l=>l.state==='Đã trả'&&borrowDate<l.returnDate&&due>l.borrowDate))throw Error('Khoảng ngày mượn chồng lượt đã trả trước đó; hãy kiểm tra lại.');let l={id:uid(),toolId,borrowDate,due,borrower,lender:val(f,'lender'),conditionOut:val(f,'conditionOut'),conditionIn:'',receiver:'',returnDate:'',state:'Đang mượn',note:val(f,'note'),sourceIndex:null};db.loans.push(l);log('Bàn giao mượn',`${borrower} · hạn ${due}`,toolId,l.id);selected=l.id;page='loan'}
else if(formMode==='returnLoan'){let l=loan(formId),returnDate=val(f,'returnDate'),receiver=val(f,'receiver'),conditionIn=val(f,'conditionIn');if(!l||l.state!=='Đang mượn'||!dateOK(returnDate)||returnDate<l.borrowDate||!receiver||!conditionIn)throw Error('Cần ngày trả, người nhận và tình trạng hợp lệ.');Object.assign(l,{returnDate,receiver,conditionIn,note:val(f,'note'),state:'Đã trả'});log('Nhận trả',`${receiver} · ${conditionIn}`,l.toolId,l.id);selected=l.id;page='loan'}
else if(formMode==='extendLoan'){let l=loan(formId),due=val(f,'due'),reason=val(f,'reason');if(!l||l.state!=='Đang mượn'||!dateOK(due)||due<=l.due||!reason)throw Error('Hạn mới phải sau hạn cũ và cần lý do.');let prev=l.due;l.due=due;log('Gia hạn',`${prev} → ${due}: ${reason}`,l.toolId,l.id);selected=l.id;page='loan'}
let err=validate(db);if(err)throw Error(err);$('#editor').close();save()}catch(err){db=old;$('#formError').textContent=err.message}}
function sampleDB(){let x=initial(),offset=v=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(v.slice(1)));return d.toLocaleDateString('sv-SE')};for(let t of TOOL_SAMPLE.dc)x.tools.push({id:uid(),code:t[0],name:t[1],type:t[2],value:Math.round(t[3]),note:'Dữ liệu mẫu tham chiếu'});for(let k=0;k<TOOL_SAMPLE.mt.length;k++){let r=TOOL_SAMPLE.mt[k],t=x.tools.find(t=>t.code===r[1]);x.loans.push({id:uid(),toolId:t.id,borrowDate:offset(r[0]),due:offset(r[3]),borrower:r[2],lender:'',conditionOut:'',conditionIn:'',receiver:'',returnDate:r[4]?offset(r[4]):'',state:r[5],note:'Lượt mượn từ file tham chiếu',sourceIndex:k+1})}return x}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'khuon-mau-dung-cu-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+b64(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'khuon-mau-dung-cu-kem-du-lieu.html')}
function sheets(){return [{name:'DungCu',rows:[['Mã','Tên','Loại','Giá trị','Đang mượn','Tổng lượt','Chồng thời gian'],...db.tools.map(t=>[t.code,t.name,t.type,t.value,active(t.id).length,loanRows(t.id).length,overlap(t.id).length])]},{name:'LuotMuonTra',rows:[['Mã dụng cụ','Người mượn','Ngày mượn','Hạn trả','Ngày trả','Tình trạng','Quá hạn ngày','Tình trạng giao','Tình trạng trả','Người giao','Người nhận','Ghi chú','Dòng mẫu'],...db.loans.map(l=>[tool(l.toolId).code,l.borrower,l.borrowDate,l.due,l.returnDate,l.state,overdue(l),l.conditionOut,l.conditionIn,l.lender,l.receiver,l.note,l.sourceIndex??''])]},{name:'NhatKy',rows:[['Thời điểm','Thao tác','Lý do','Mã dụng cụ','Người mượn'],...db.events.map(e=>[e.at,e.action,e.reason,tool(e.toolId)?.code||'',loan(e.loanId)?.borrower||''])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Đơn vị'],[db.settings.asof,db.settings.org]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'khuon-mau-dung-cu-bao-cao.xlsx')}
function action(act,id){if(['home','tools','loans','reports','settings','data','guide'].includes(act)){page=act;render();return}if(act==='openTool'){selected=id;page='tool';render();return}if(act==='openLoan'){selected=id;page='loan';render();return}if(['newTool','editTool','newLoan','returnLoan','extendLoan'].includes(act)){if(act==='newLoan'&&!db.tools.length)return alert('Hãy thêm dụng cụ trước.');if(act==='newLoan'&&id&&active(id).length)return alert('Dụng cụ đang được mượn. Cần nhận trả trước.');if(act==='newLoan'&&!db.tools.some(t=>!active(t.id).length))return alert('Chưa có dụng cụ sẵn để mượn.');return openForm(act,id)}if(act==='print')return print();if(act==='exportJSON')return exportJSON();if(act==='exportHTML')return exportHTML();if(act==='exportExcel')return exportExcel();if(act==='importJSON')return $('#jsonFile').click();if(act==='sample'){if((db.tools.length||db.loans.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu. Hãy sao lưu trước. Tiếp tục?'))return;let x=sampleDB(),err=validate(x);if(err)return alert('Mẫu lỗi: '+err);db=x;page='home';save();return}if(act==='clear'){if(!confirm('Xóa toàn bộ dữ liệu trên máy này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=initial();page='home';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)action(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submitForm);$('#closeDialog').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm('Nhập JSON sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;db=x;page='home';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{if(e.target.id==='loanFilter'){loanFilter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let p=e.target.selectionStart;search=e.target.value;render();let q=$('#search');q.focus();q.setSelectionRange(p,p)}});document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();let f=e.target,asof=val(f,'asof'),org=val(f,'org');if(!dateOK(asof)||!org)return alert('Ngày hoặc tên đơn vị không hợp lệ.');db.settings={asof,org};save()}});render();
</script></body></html>
