function valid(d){if(!d||d.version!==1||!d.settings||typeof d.settings.company!=='string'||d.settings.company.length>200||!dateOK(d.settings.start)||d.settings.start<'2026-01-01'||!REVIEW.includes(d.settings.reviewed))return false;for(let k of Object.keys(fields)){if(!Array.isArray(d[k])||d[k].length>5000)return false;let ids=new Set(),codes=new Set();for(let x of d[k]){if(!x||typeof x.id!=='string'||!x.id||ids.has(x.id))return false;ids.add(x.id);for(let[f,,type]of fields[k]){let z=x[f];if(type==='number'){if(!integer(z))return false}else if(typeof z!=='string'||z.length>2000)return false}if(k!=='maps'){if(!x.code.trim()||codes.has(x.code))return false;codes.add(x.code)}else if(!RULES.some(r=>r[0]===x.rule)||!APPROVAL.includes(x.approval))return false}}for(let k of ['sources','maps'])for(let side of ['debit','credit'])if(!Number.isSafeInteger(d[k].reduce((a,x)=>a+x[side],0)))return false;return true}

function mapsPage(){let c=compute(db);return hero('🧩 Ghép chuyển và duyệt','Một nguồn có thể chia thành nhiều dòng; dòng chờ duyệt không được tính vào số dư đích.')+'<section class="card">'+toolbar('maps')+table(['Nguồn / TK cũ','TK mới','Nợ chuyển','Có chuyển','Quy tắc','Duyệt','Trạng thái',''],filter(c.maps).map(x=>'<tr><td><b>'+esc(x.source)+'</b><span class="row-note">'+esc(x.old)+'</span></td><td>'+esc(x.target)+'</td><td class="num">'+vnd(x.debit)+'</td><td class="num">'+vnd(x.credit)+'</td><td>'+esc(x.rule)+'</td><td>'+esc(x.approval)+'</td><td>'+badge(x.status)+'<span class="row-note">'+esc(x.reasons.join('; '))+'</span></td><td>'+edit('maps',x.id)+'</td></tr>'))+'</section>'}
function outputPage(){let c=compute(db);return hero('📘 Số dư mới tạm tính','Chỉ gồm các dòng ghép đã duyệt, có người duyệt và căn cứ.')+'<section class="card">'+(c.ready?'<p class="notice good">Đã qua kiểm tra số học và xác nhận phạm vi.</p>':'<p class="notice bad">Chưa đủ điều kiện bàn giao. Xem Đối chiếu & bàn giao.</p>')+table(['TK mới','Tên tài khoản','Dư Nợ mới','Dư Có mới'],c.output.map(x=>'<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.name)+'</td><td class="num">'+vnd(x.debit)+'</td><td class="num">'+vnd(x.credit)+'</td></tr>'))+'</section>'}
function checkPage(){let c=compute(db);return hero('✅ Đối chiếu & bàn giao','Kiểm tra số học, dòng ghép và phạm vi chính sách trước khi dùng số dư đầu kỳ.')+'<section class="card"><h2>'+esc(db.settings.company||'Chưa đặt tên đơn vị')+' · '+esc(db.settings.start)+'</h2><p class="notice '+(c.ready?'good':'bad')+'">'+(c.ready?'Đủ điều kiện đối chiếu trong mô hình; người có thẩm quyền vẫn cần phê duyệt hồ sơ.':'Cần xử lý trước bàn giao. Bảng số dư mới vẫn là tạm tính.')+'</p>'+table(['Chỉ tiêu','Dư Nợ','Dư Có'],[['Nguồn cũ',c.oldD,c.oldC],['Đã chuyển đủ điều kiện',c.newD,c.newC],['Còn lại (âm = vượt)',c.oldD-c.newD,c.oldC-c.newC]].map(([n,d,cr])=>'<tr><td>'+esc(n)+'</td><td class="num">'+vnd(d)+'</td><td class="num">'+vnd(cr)+'</td></tr>'))+'<p>'+c.unmatched+' nguồn chưa khớp · '+c.invalid+' ghép chưa đủ điều kiện · '+c.issues.length+' cảnh báo.</p></section><section class="card"><h2>Danh sách cần xử lý</h2>'+table(['Loại','Mã','Lý do',''],c.issues.map(x=>'<tr><td>'+esc(x.kind)+'</td><td>'+esc(x.code)+'</td><td>'+esc(x.reason)+'</td><td>'+(x.id?edit(x.kind==='Nguồn'?'sources':'maps',x.id):'')+'</td></tr>'))+'</section><div class="signatures"><div>Người lập<br><br><br>(Ký, ghi rõ họ tên)</div><div>Kế toán trưởng<br><br><br>(Ký, ghi rõ họ tên)</div></div><button class="btn no-print" data-action="print">🖨️ In đối chiếu</button>'}
function catalogPage(){return hero('🗂️ Danh mục TK mới','31 tài khoản khởi tạo theo file gốc; đây chưa phải toàn bộ Phụ lục II.')+'<section class="card">'+toolbar('catalog')+table(['Mã TK','Tên tài khoản',''],filter(db.catalog).map(x=>'<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.name)+'</td><td>'+edit('catalog',x.id)+'</td></tr>'))+'</section>'}
function rulesPage(){return hero('📚 Quy tắc tham chiếu','Gợi ý ghép tài khoản theo file nguồn. Căn cứ nghiệp vụ từng khoản phải được kiểm tra riêng.')+'<section class="card">'+table(['Mã','Tình huống','TK cũ','TK mới','Điều kiện cần xác minh'],RULES.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td></tr>'))+'</section>'}
function field(k,label,type,value='',options=[]){return'<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(options.length?'<select id="f_'+k+'">'+options.map(([v,l])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value)+'" '+(type==='number'?'step="1"':'')+'>')+'</div>'}
function settingsPage(){let s=db.settings;return hero('⚙️ Đơn vị và thời điểm áp dụng','Xác nhận phạm vi chỉ sau khi kiểm tra hồ sơ chuyển đổi và chính sách riêng.')+'<section class="card"><div class="formgrid">'+field('company','Tên đơn vị','text',s.company)+field('start','Ngày đầu năm tài chính áp dụng','date',s.start)+field('reviewed','Đã rà soát Điều 29–31 và chính sách riêng','select',s.reviewed,REVIEW.map(x=>[x,x]))+'</div><p class="notice">Ngày áp dụng từ 01/01/2026. Xác nhận phạm vi không thay thế phê duyệt của kế toán trưởng.</p><button class="btn primary" data-action="settings">Lưu thiết lập</button></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Dữ liệu lưu trên trình duyệt. File HTML gốc không mang theo nội dung đã nhập sang thiết bị khác.')+'<section class="card"><h2>Sao lưu và chuyển máy</h2><div class="toolbar"><button class="btn primary" data-action="backup">↓ JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excel">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV</button></div><p>Excel gồm 6 sheet: Số dư cũ, Ghép chuyển, TK mới, Cài đặt, Kết quả, Đối chiếu. App nhập lại 4 sheet dữ liệu đầu từ file do app xuất.</p></section><section class="card"><h2>Mẫu gốc để thử</h2><p>9 nguồn, 10 dòng ghép, 31 TK mới. Trong 10 dòng ghép có một dòng R0 chờ duyệt; mẫu chưa được xác nhận phạm vi. Nạp mẫu sẽ thay dữ liệu đang có.</p><button class="btn" data-action="sample">Nạp mẫu gốc</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn và phạm vi','Dùng để chuẩn bị số dư đầu kỳ theo TT99, với hồ sơ đối chiếu từng dòng.')+'<section class="card"><ol><li>Nhập số dư cũ ở cấp chi tiết/đối tượng; không cộng lặp tài khoản tổng và chi tiết.</li><li>Thêm tài khoản mới cần dùng vào danh mục, sau đó ghép từng phần Nợ/Có của nguồn sang đích.</li><li>Chọn quy tắc, ghi căn cứ và người duyệt. Chỉ đổi sang “Đã duyệt” khi đủ hồ sơ.</li><li>Kiểm tra số dư mới, chênh lệch nguồn–đích và các cảnh báo; xác nhận phạm vi chính sách ở Cài đặt.</li><li>In bảng bàn giao và sao lưu JSON hoặc HTML kèm dữ liệu để chuyển máy.</li></ol><p class="notice">App không tự tính hồi tố, thuế hoãn lại, số so sánh và đầy đủ BCTC. R0/R9 là phương án theo hồ sơ, không chứng minh tính phù hợp chỉ bằng mã tài khoản.</p></section><section class="card"><h2>Văn bản tham chiếu</h2>'+REF.SOURCES.map(([name,description,url])=>'<p><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(name)+'</a> · '+esc(description)+'</p>').join('')+'<p class="muted">Liên kết cần mạng để mở; app vẫn chạy offline.</p></section>'}
const views={dashboard,sources:sourcesPage,maps:mapsPage,output:outputPage,check:checkPage,catalog:catalogPage,rules:rulesPage,settings:settingsPage,data:dataPage,guide:guidePage},titles={dashboard:'Tổng quan',sources:'Số dư cũ',maps:'Ghép & duyệt',output:'Số dư mới',check:'Đối chiếu & bàn giao',catalog:'TK mới',rules:'Quy tắc',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};
function render(){$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML='<div class="print-head">'+esc(db.settings.company)+' · '+esc(titles[page])+' · '+esc(db.settings.start)+'</div>'+views[page]()}
function openModal(k,id=''){let old=db[k].find(x=>x.id===id)||{},base=k==='sources'?{code:'',old:'',name:'',debit:0,credit:0}:k==='maps'?{source:db.sources[0]?.code||'',target:db.catalog[0]?.code||'',debit:0,credit:0,rule:'R0',approval:'Chờ duyệt',reviewer:'',basis:''}:{code:'',name:''},x={...base,...old};modal={k,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+titles[k].toLowerCase();let c=compute(db),ev=id?(k==='sources'?c.sources:k==='maps'?c.maps:db.catalog).find(y=>y.id===id):null;$('#modalFields').innerHTML=(ev?.reasons?.length?'<p class="wide notice bad">'+esc(ev.reasons.join('; '))+'</p>':'')+fields[k].map(([key,label,type])=>field(key,label,type,x[key],type==='source'?db.sources.map(y=>[y.code,y.code+' · '+y.old+' · '+y.name]):type==='target'?db.catalog.map(y=>[y.code,y.code+' · '+y.name]):type==='rule'?RULES.map(y=>[y[0],y[0]+' · '+y[1]]):type==='approval'?APPROVAL.map(y=>[y,y]):[])).join('');$('#modalError').textContent='';$('#deleteModal').hidden=!id;$('#editor').showModal()}
function readModal(){let x={id:modal.id||crypto.randomUUID()};for(let[k,,type]of fields[modal.k]){let raw=$('#f_'+k).value.trim();x[k]=type==='number'?raw===''?NaN:Number(raw):raw}return x}
function saveModal(){let x=readModal(),d=clone(db),k=modal.k,i=d[k].findIndex(y=>y.id===modal.id),prior=i>=0?d[k][i]:null;if(prior&&k==='sources'&&x.code!==prior.code&&d.maps.some(y=>y.source===prior.code)){showError('Mã nguồn đang được ghép; cần giữ mã hoặc xử lý ghép trước.');return}if(prior&&k==='catalog'&&x.code!==prior.code&&d.maps.some(y=>y.target===prior.code)){showError('Mã TK đang được ghép; cần giữ mã hoặc xử lý ghép trước.');return}if(i>=0)d[k][i]=x;else d[k].push(x);if(!valid(d)){showError('Kiểm tra mã trùng, ô bắt buộc, số tiền nguyên không âm và lựa chọn.');return}if(k==='maps'){let e=evalMap(x,d);if(['Nguồn thiếu / trùng mã','TK mới thiếu / trùng mã','Sai mã quy tắc','Số tiền chuyển chưa hợp lệ','Không khớp cặp tài khoản/quy tắc'].includes(e.status)){showError(e.status);return}}db=d;$('#editor').close();modal=null;persist()}
function showError(s){$('#modalError').textContent=s}
function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+enc(db)+'$2');download('chuyen-doi-tt99-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
const names={sources:'SoDuCu',maps:'GhepChuyen',catalog:'TKMoi'};
function sheets(){let c=compute(db),out=[];for(let k of ['sources','maps','catalog'])out.push({name:names[k],rows:[['id',...fields[k].map(f=>f[0])],...db[k].map(x=>[x.id,...fields[k].map(f=>x[f[0]])])]});out.push({name:'CaiDat',rows:[['key','value'],...Object.entries(db.settings)]});out.push({name:'KetQua',rows:[['TK mới','Tên TK','Dư Nợ','Dư Có'],...c.output.map(x=>[x.code,x.name,x.debit,x.credit])]});out.push({name:'DoiChieu',rows:[['Chỉ tiêu','Dư Nợ','Dư Có'],['Nguồn cũ',c.oldD,c.oldC],['Đã chuyển',c.newD,c.newC],['Còn lại',c.oldD-c.newD,c.oldC-c.newC]]});return out}
function excelValue(raw,type,label){if(type==='number'){if(typeof raw!=='number'||!integer(raw))throw Error(label+': nhập số nguyên không âm; dùng 0 nếu không có');return raw}return String(raw??'').trim()}
function parseSheets(s){let d=blank();for(let k of ['sources','maps','catalog']){let rows=s[names[k]],keys=['id',...fields[k].map(f=>f[0])];if(!Array.isArray(rows)||rows[0]?.join('|')!==keys.join('|'))throw Error('Thiếu/sai sheet '+names[k]);d[k]=rows.slice(1).filter(r=>r.some(v=>String(v??'').trim())).map(r=>Object.fromEntries(keys.map((key,i)=>[key,excelValue(r[i],fields[k].find(f=>f[0]===key)?.[2],names[k]+' dòng '+(i+1))])))}let rows=s.CaiDat;if(!Array.isArray(rows)||rows[0]?.join('|')!=='key|value')throw Error('Thiếu/sai sheet Cài đặt');for(let[key,value]of rows.slice(1))if(Object.hasOwn(d.settings,key))d.settings[key]=String(value??'');if(!valid(d))throw Error('Dữ liệu Excel sai cấu trúc, trùng mã hoặc số tiền');return d}
function csv(){let c=compute(db),rows=[['Loại','Mã nguồn','TK cũ','TK mới','Nợ','Có','Quy tắc','Duyệt','Trạng thái'],...c.sources.map(x=>['Nguồn',x.code,x.old,'',x.debit,x.credit,'','',x.status]),...c.maps.map(x=>['Ghép',x.source,x.old,x.target,x.debit,x.credit,x.rule,x.approval,x.status])],cell=z=>{let s=String(z??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};download('chuyen-doi-tt99.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){let[k,id]=b.dataset.edit.split(':');openModal(k,id);return}let a=b.dataset.action;if(a==='close'){$('#editor').close();modal=null}if(a==='saveModal')saveModal();if(a==='deleteRecord'&&modal?.id){let k=modal.k,x=db[k].find(y=>y.id===modal.id);if(k==='sources'&&db.maps.some(y=>y.source===x.code)||k==='catalog'&&db.maps.some(y=>y.target===x.code)){showError('Dòng đang được tham chiếu; xử lý các dòng ghép trước.');return}if(!confirm('Xóa dòng này và tính lại kết quả?'))return;db[k]=db[k].filter(y=>y.id!==modal.id);$('#editor').close();modal=null;persist()}if(a==='print')window.print();if(a==='settings'){let d=clone(db);d.settings={company:$('#f_company').value.trim(),start:$('#f_start').value,reviewed:$('#f_reviewed').value};if(!valid(d)){alert('Kiểm tra ngày áp dụng từ 01/01/2026.');return}db=d;persist()}if(a==='sample'&&confirm('Nạp mẫu sẽ thay thế toàn bộ dữ liệu hiện tại. Tiếp tục?')){db=sample();persist()}if(a==='clear'&&confirm('Xóa dữ liệu trên trình duyệt này?')){db=blank();persist()}if(a==='backup')download('chuyen-doi-tt99.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')download('chuyen-doi-tt99.xlsx',Excel.workbook(sheets()),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv()});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30000000)throw Error('File quá lớn');let d=JSON.parse(await f.text());if(!valid(d))throw Error('Sai cấu trúc hoặc phiên bản');if(!confirm('Khôi phục sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;db=d;persist()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20000000)throw Error('File quá lớn');let d=parseSheets(await Excel.read(f));if(!confirm('Nhập Excel sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;db=d;persist()}catch(err){alert('Không nhập được Excel: '+err.message)}});
window.__TT99_TEST__={blank,sample,valid,evalMap,compute,sheets,parseSheets,enc,dec,setDB:d=>{db=d;render()},getDB:()=>db,renderPage:p=>{page=p;render()}};
render();
})();
</script></body></html>
