const order=id=>db.orders.find(x=>x.id===id);
const selected=()=>period(periodId)||db.periods[0]||null;
const findPeriod=d=>db.periods.find(p=>p.start<=d&&d<=p.end);
function save(redraw=true){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Trình duyệt không lưu được. Hãy sao lưu JSON hoặc tải HTML kèm dữ liệu.')}if(redraw)render()}
function net(o){return o.status==='Hoàn thành'?Math.round(Number(o.value||0)*Number(o.rate||0)/100):0}
function ordersIn(p,partnerId=''){return db.orders.filter(o=>o.date>=p.start&&o.date<=p.end&&(!partnerId||o.partnerId===partnerId))}
function manualTax(p,x){return db.withholds.find(w=>w.periodId===p.id&&w.partnerId===x.id)}
function calc(p,x){
 if(p.locked&&p.snapshot){let r=p.snapshot.results.find(y=>y.partnerId===x.id);if(r)return r}
 let list=ordersIn(p,x.id),completed=list.filter(o=>o.status==='Hoàn thành'),sales=completed.reduce((n,o)=>n+Number(o.value),0),commission=completed.reduce((n,o)=>n+net(o),0),w=manualTax(p,x);
 let tax=commission===0?0:db.settings.taxMode==='sample'?(commission>=db.settings.threshold?Math.round(commission*db.settings.taxRate/100):0):w?.amount??null;
 return{partnerId:x.id,code:x.code,name:x.name,count:completed.length,sales,commission,tax,net:tax===null?null:commission-tax};
}
function results(p){return db.partners.filter(x=>x.active!==false||ordersIn(p,x.id).length||manualTax(p,x)).map(x=>calc(p,x))}
const paid=(p,x)=>db.payouts.filter(q=>q.periodId===p.id&&q.partnerId===x.id).reduce((n,q)=>n+q.amount,0);
function nextCode(){let n=Math.max(0,...db.orders.map(o=>/^DH-\d+$/.test(o.code)?Number(o.code.slice(3)):0));return 'DH-'+String(n+1).padStart(4,'0')}
function nextPeriod(){let d=new Date();for(let i=0;i<240;i++){let start=iso(new Date(d.getFullYear(),d.getMonth(),1)),end=iso(new Date(d.getFullYear(),d.getMonth()+1,0));if(!db.periods.some(p=>start<=p.end&&end>=p.start))return{name:'Tháng '+String(d.getMonth()+1)+'/'+d.getFullYear(),start,end};d.setMonth(d.getMonth()+1)}return{name:'Kỳ mới',start:today(),end:today()}}
const hero=(title,sub)=>'<div class="hero"><small>AI MỞ · ĐỐI SOÁT AFFILIATE OFFLINE</small><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div>';
const metric=(label,value,note='')=>'<div class="metric"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(note)+'</div></div>';
const badge=(s,tone='')=>'<span class="badge '+tone+'">'+esc(s)+'</span>';
function picker(){let p=selected();return '<label class="picker-label">Kỳ tính <select id="periodPicker">'+db.periods.map(q=>'<option value="'+esc(q.id)+'" '+(q.id===p?.id?'selected':'')+'>'+esc(q.name)+' · '+date(q.start)+'–'+date(q.end)+(q.locked?' · Đã chốt':'')+'</option>').join('')+'</select></label>'}
function sums(p){let a=results(p);return{count:a.reduce((n,r)=>n+r.count,0),sales:a.reduce((n,r)=>n+r.sales,0),commission:a.reduce((n,r)=>n+r.commission,0),tax:a.reduce((n,r)=>n+(r.tax||0),0),net:a.reduce((n,r)=>n+(r.net||0),0),paid:db.payouts.filter(q=>q.periodId===p.id).reduce((n,q)=>n+q.amount,0),missing:a.filter(r=>r.commission>0&&r.tax===null).length}}

function guidePage(){return hero('Hướng dẫn sử dụng','Quản lý CTV, đơn hàng, đối soát hoa hồng và các khoản đã chi.')+'<div class="grid two"><div class="card"><h2>Quy trình 8 bước</h2><ol><li>Tạo kỳ tính theo tháng hoặc khoảng ngày riêng.</li><li>Thêm CTV và tỷ lệ hoa hồng mặc định.</li><li>Nhập đơn của CTV; tỷ lệ được lưu vào đơn khi tạo.</li><li>Đánh dấu đơn Hoàn thành hoặc Hoàn trả.</li><li>Chọn chế độ khấu trừ và xác nhận số từng CTV nếu dùng thủ công.</li><li>Rà bảng đối soát và chốt kỳ để giữ số đã duyệt.</li><li>Ghi nhận các khoản đã chi sau khi chốt.</li><li>Xuất Excel, in/PDF và sao lưu JSON định kỳ.</li></ol></div><div class="card"><h2>Cách tính</h2><p>Hoa hồng từng đơn = làm tròn(giá trị đơn × tỷ lệ đơn / 100) nếu đơn Hoàn thành; đơn Hoàn trả = 0. Tổng hoa hồng là tổng các đơn trong kỳ.</p><p>Chế độ mô phỏng file gốc: nếu tổng hoa hồng của CTV đạt ngưỡng đã nhập thì khấu trừ tạm tính = làm tròn(tổng hoa hồng × tỷ lệ). Chế độ thủ công: người phụ trách nhập số đã xác nhận, kể cả 0.</p><p>Thực nhận = hoa hồng − khấu trừ. Còn chi = thực nhận − đã chi. Kỳ đã chốt dùng kết quả chụp lại, không tự đổi khi sửa cài đặt hoặc tỷ lệ CTV.</p></div></div>'}
function field(k,label,value='',type='text',attrs=''){return '<label class="field"><span>'+esc(label)+'</span><input id="f-'+k+'" type="'+type+'" value="'+esc(value)+'" '+attrs+'></label>'}
function select(k,label,opts,value){return '<label class="field"><span>'+esc(label)+'</span><select id="f-'+k+'">'+opts.map(o=>{let val=typeof o==='string'?o:o.value,lab=typeof o==='string'?o:o.label;return '<option value="'+esc(val)+'" '+(String(val)===String(value)?'selected':'')+'>'+esc(lab)+'</option>'}).join('')+'</select></label>'}
function openModal(kind,id=''){
 let p=selected();if(!id&&kind==='order'&&!db.partners.some(x=>x.active)){alert('Hãy thêm CTV đang hoạt động trước.');return}if(kind==='payout'&&(!p?.locked||!results(p).some(r=>r.net>paid(p,partner(r.partnerId))))){alert('Kỳ chưa chốt hoặc không còn tiền để chi.');return}
 modalKind=kind;editingId=id;let title='',body='',o;
 if(kind==='partner'){o=id?partner(id):{code:'CTV-'+String(Math.max(0,...db.partners.map(x=>/^CTV-\d+$/.test(x.code)?Number(x.code.slice(4)):0))+1).padStart(2,'0'),name:'',rate:0,phone:'',channel:'',taxId:'',active:true};title=id?'Sửa CTV':'Thêm CTV';body=field('code','Mã CTV *',o.code)+field('name','Họ và tên *',o.name)+field('rate','Tỷ lệ mặc định (%)',o.rate,'number','min="0" max="100" step="0.01"')+field('phone','Điện thoại',o.phone,'tel')+field('channel','Kênh / nhóm giới thiệu',o.channel)+field('taxId','Mã số thuế (nếu có)',o.taxId)+select('active','Trạng thái',[{value:'yes',label:'Đang làm'},{value:'no',label:'Ngừng theo dõi'}],o.active?'yes':'no')}
 if(kind==='period'){o=id?period(id):nextPeriod();title=id?'Sửa kỳ':'Tạo kỳ';body=field('name','Tên kỳ *',o.name)+field('start','Từ ngày *',o.start,'date')+field('end','Đến ngày *',o.end,'date')}
 if(kind==='order'){o=id?order(id):{date:p&&p.start<=today()&&today()<=p.end?today():p?.start||today(),code:nextCode(),partnerId:db.partners.find(x=>x.active)?.id||'',customer:'',value:0,rate:db.partners.find(x=>x.active)?.rate||0,status:'Hoàn thành',note:''};title=id?'Sửa đơn':'Thêm đơn';body=field('date','Ngày *',o.date,'date')+field('code','Mã đơn *',o.code)+select('partnerId','CTV *',db.partners.filter(x=>x.active||x.id===o.partnerId).map(x=>({value:x.id,label:x.code+' · '+x.name})),o.partnerId)+field('customer','Khách hàng',o.customer)+field('value','Giá trị đơn (đ) *',o.value,'number','min="0" step="1"')+field('rate','Tỷ lệ của đơn (%)',o.rate,'number','min="0" max="100" step="0.01"')+select('status','Tình trạng',['Hoàn thành','Hoàn trả'],o.status)+field('note','Ghi chú',o.note)}
 if(kind==='withhold'){o=id?db.withholds.find(x=>x.id===id):{partnerId:db.partners.find(x=>x.active)?.id||'',amount:0,note:''};title=id?'Sửa khấu trừ':'Xác nhận khấu trừ';body=select('partnerId','CTV *',results(p).filter(r=>r.commission>0).map(r=>({value:r.partnerId,label:r.code+' · '+r.name+' · HH '+money(r.commission)})),o.partnerId)+field('amount','Số khấu trừ đã xác nhận (đ)',o.amount,'number','min="0" step="1"')+field('note','Căn cứ / ghi chú',o.note)}
 if(kind==='payout'){o={date:today(),partnerId:results(p).find(r=>r.net>paid(p,partner(r.partnerId)))?.partnerId||'',amount:0,method:'Chuyển khoản',note:''};title='Ghi khoản chi';body=field('date','Ngày chi *',o.date,'date')+select('partnerId','CTV *',results(p).filter(r=>r.net>paid(p,partner(r.partnerId))).map(r=>({value:r.partnerId,label:r.code+' · '+r.name+' · còn '+money(r.net-paid(p,partner(r.partnerId)))})),o.partnerId)+field('amount','Số tiền (đ) *',o.amount,'number','min="1" step="1"')+select('method','Hình thức',['Chuyển khoản','Tiền mặt','Khác'],o.method)+field('note','Ghi chú',o.note)}
 $('#modalTitle').textContent=title;$('#modalFields').innerHTML=body;$('#modalError').textContent='';$('#editor').showModal();
}
const fv=k=>$('#f-'+k)?.value.trim()??'';
function closeModal(){$('#editor').close();modalKind='';editingId=''}
function saveModal(){
 let kind=modalKind,id=editingId,p=selected(),error='';
 if(kind==='partner'){let code=fv('code'),name=fv('name'),rate=Number(fv('rate')),phone=fv('phone'),channel=fv('channel'),taxId=fv('taxId'),active=fv('active')==='yes';if(!code||!name||!Number.isFinite(rate)||rate<0||rate>100)error='Mã, tên hoặc tỷ lệ không hợp lệ.';else if(db.partners.some(x=>x.id!==id&&x.code.toLowerCase()===code.toLowerCase()))error='Mã CTV đã tồn tại.';else if(id)Object.assign(partner(id),{code,name,rate,phone,channel,taxId,active});else if(db.partners.length>=500)error='Tối đa 500 CTV.';else db.partners.push({id:uid(),code,name,rate,phone,channel,taxId,active})}
 if(kind==='period'){let name=fv('name'),start=fv('start'),end=fv('end');if(!name||!validDate(start)||!validDate(end)||end<start)error='Tên hoặc khoảng ngày không hợp lệ.';else if(db.periods.some(x=>x.id!==id&&start<=x.end&&end>=x.start))error='Khoảng ngày chồng với kỳ khác.';else if(id){let x=period(id);if(x.locked)error='Kỳ đã chốt không thể sửa.';else if(ordersIn(x).some(o=>o.date<start||o.date>end))error='Có đơn nằm ngoài khoảng mới.';else Object.assign(x,{name,start,end})}else if(db.periods.length>=200)error='Tối đa 200 kỳ.';else{let x={id:uid(),name,start,end,locked:false,snapshot:null};db.periods.push(x);periodId=x.id}}
 if(kind==='order'){let day=fv('date'),code=fv('code'),partnerId=fv('partnerId'),customer=fv('customer'),value=Number(fv('value')),rate=Number(fv('rate')),status=fv('status'),note=fv('note'),target=findPeriod(day),old=id?order(id):null,oldPeriod=old?findPeriod(old.date):null;if(!validDate(day)||!code||!partner(partnerId)||!['Hoàn thành','Hoàn trả'].includes(status))error='Ngày, mã, CTV hoặc tình trạng không hợp lệ.';else if(!Number.isSafeInteger(value)||value<0||value>1e12||!Number.isFinite(rate)||rate<0||rate>100)error='Giá trị hoặc tỷ lệ đơn không hợp lệ.';else if(!target||target.id!==p?.id||target.locked||oldPeriod?.locked)error='Ngày đơn phải trong kỳ đang mở.';else if(db.orders.some(x=>x.id!==id&&x.code.toLowerCase()===code.toLowerCase()))error='Mã đơn đã tồn tại.';else if(id)Object.assign(old,{date:day,code,partnerId,customer,value,rate,status,note});else if(db.orders.length>=20000)error='Tối đa 20.000 đơn.';else db.orders.push({id:uid(),date:day,code,partnerId,customer,value,rate,status,note})}
 if(kind==='withhold'){let partnerId=fv('partnerId'),amount=Number(fv('amount')),note=fv('note'),r=partner(partnerId)?calc(p,partner(partnerId)):null;if(!p||p.locked||db.settings.taxMode!=='manual')error='Kỳ hoặc chế độ khấu trừ không cho sửa.';else if(!r||r.commission<=0||!Number.isSafeInteger(amount)||amount<0||amount>r.commission)error='CTV hoặc số khấu trừ không hợp lệ.';else if(db.withholds.some(x=>x.id!==id&&x.periodId===p.id&&x.partnerId===partnerId))error='CTV đã có số khấu trừ trong kỳ.';else if(id)Object.assign(db.withholds.find(x=>x.id===id),{partnerId,amount,note});else db.withholds.push({id:uid(),periodId:p.id,partnerId,amount,note})}
 if(kind==='payout'){let day=fv('date'),partnerId=fv('partnerId'),amount=Number(fv('amount')),method=fv('method'),note=fv('note'),r=partner(partnerId)?calc(p,partner(partnerId)):null;if(!p?.locked||!r||r.net===null)error='Kỳ chưa chốt hoặc CTV không hợp lệ.';else if(!validDate(day)||!Number.isSafeInteger(amount)||amount<=0||amount>r.net-paid(p,partner(partnerId)))error='Ngày hoặc số chi vượt thực nhận còn lại.';else db.payouts.push({id:uid(),periodId:p.id,partnerId,date:day,amount,method,note})}
 if(error){$('#modalError').textContent=error;return}closeModal();save();
}
function closePeriod(){let p=selected();if(!p||p.locked)return;let a=results(p);if(!a.length){alert('Chưa có CTV.');return}if(a.some(r=>r.commission>0&&r.tax===null)){alert('Còn CTV chưa xác nhận khấu trừ.');return}if(a.some(r=>!Number.isSafeInteger(r.sales)||!Number.isSafeInteger(r.commission)||r.tax>r.commission)){alert('Doanh số, hoa hồng hoặc khấu trừ không hợp lệ.');return}if(!confirm('Chốt kỳ '+p.name+'? Đơn và kết quả sẽ được khóa.'))return;p.snapshot={at:new Date().toISOString(),policy:clone(db.settings),results:clone(a)};p.locked=true;save()}
function reopenPeriod(){let p=selected();if(!p?.locked)return;if(db.payouts.some(q=>q.periodId===p.id)){alert('Kỳ đã chi tiền. Xóa khoản chi trước khi mở lại.');return}if(!confirm('Mở lại kỳ và bỏ kết quả chốt cũ?'))return;p.locked=false;p.snapshot=null;save()}
function partnerSheet(){return[['Mã CTV','Họ và tên','Tỷ lệ (%)','Điện thoại','Kênh','Mã số thuế','Hoạt động'],...db.partners.map(x=>[x.code,x.name,x.rate,x.phone,x.channel,x.taxId,x.active?1:0])]}
function orderSheet(list=db.orders){return[['Ngày','Mã CTV','Tên CTV','Mã đơn','Khách hàng','Giá trị đơn','Tỷ lệ (%)','Tình trạng','Hoa hồng','Kỳ','Ghi chú'],...list.map(o=>[o.date,partner(o.partnerId)?.code||'',partner(o.partnerId)?.name||'',o.code,o.customer,o.value,o.rate,o.status,net(o),findPeriod(o.date)?.name||'',o.note])]}
function resultSheet(p){return[['Mã CTV','Họ và tên','Số đơn hoàn thành','Doanh số','Hoa hồng','Khấu trừ','Thực nhận','Đã chi','Còn chi'],...results(p).map(r=>[r.code,r.name,r.count,r.sales,r.commission,r.tax??'',r.net??'',paid(p,partner(r.partnerId)),r.net===null?'':r.net-paid(p,partner(r.partnerId))])]}
function withholdSheet(){return[['Kỳ','Mã CTV','Số khấu trừ','Ghi chú'],...db.withholds.map(w=>[period(w.periodId)?.name||'',partner(w.partnerId)?.code||'',w.amount,w.note])]}
function payoutSheet(list=db.payouts){return[['Kỳ','Mã CTV','Ngày chi','Số tiền','Hình thức','Ghi chú'],...list.map(q=>[period(q.periodId)?.name||'',partner(q.partnerId)?.code||'',q.date,q.amount,q.method,q.note])]}
function download(name,type,body){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadBlob(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function xlsx(name,sheets){downloadBlob(name+'.xlsx',Excel.workbook(sheets.map(([name,rows])=>({name,rows}))))}
function exportAll(){xlsx('ai-mo-affiliate-du-lieu',[['Cộng tác viên',partnerSheet()],['Đơn hàng',orderSheet()],['Khấu trừ',withholdSheet()],['Chi hoa hồng',payoutSheet()],['Kỳ tính',[['Tên kỳ','Từ','Đến','Đã chốt'],...db.periods.map(p=>[p.name,p.start,p.end,p.locked?1:0])]]])}
function exportReport(){let p=selected();if(!p)return;xlsx('hoa-hong-ctv-'+p.name.replace(/[^\p{L}\p{N}-]+/gu,'-'),[['Đối soát',resultSheet(p)],['Đơn hàng',orderSheet(ordersIn(p))],['Chi',payoutSheet(db.payouts.filter(q=>q.periodId===p.id))]])}
const csvRows=rows=>'\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
function backup(){download('ai-mo-affiliate-sao-luu.json','application/json;charset=utf-8',JSON.stringify(db,null,2))}
function saveHtml(){let doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(db))));download('ai-mo-affiliate-kem-du-lieu.html','text/html;charset=utf-8','<!doctype html>\n'+doc.outerHTML)}
function validBackup(x){if(!shape(x)||x.partners.length>500||x.periods.length>200||x.orders.length>20000||x.withholds.length>100000||x.payouts.length>20000||!['manual','sample'].includes(x.settings.taxMode)||!Number.isSafeInteger(+x.settings.threshold)||x.settings.threshold<0||!Number.isFinite(+x.settings.taxRate)||x.settings.taxRate<0||x.settings.taxRate>100)return false;let unique=(a,k)=>new Set(a.map(z=>String(z[k]||'').toLowerCase())).size===a.length;if(!unique(x.partners,'id')||!unique(x.partners,'code')||!unique(x.periods,'id')||!unique(x.orders,'id')||!unique(x.orders,'code')||!unique(x.withholds,'id')||!unique(x.payouts,'id'))return false;let pid=new Set(x.partners.map(z=>z.id)),kid=new Set(x.periods.map(z=>z.id));for(let z of x.partners)if(!z.id||!z.code||!z.name||!Number.isFinite(+z.rate)||z.rate<0||z.rate>100)return false;for(let z of x.periods)if(!z.id||!z.name||!validDate(z.start)||!validDate(z.end)||z.end<z.start||z.locked&&(!z.snapshot||!Array.isArray(z.snapshot.results)))return false;for(let i=0;i<x.periods.length;i++)for(let j=i+1;j<x.periods.length;j++)if(x.periods[i].start<=x.periods[j].end&&x.periods[i].end>=x.periods[j].start)return false;for(let z of x.orders)if(!z.id||!z.code||!pid.has(z.partnerId)||!validDate(z.date)||!x.periods.some(p=>p.start<=z.date&&z.date<=p.end)||!Number.isSafeInteger(+z.value)||z.value<0||z.value>1e12||!Number.isFinite(+z.rate)||z.rate<0||z.rate>100||!['Hoàn thành','Hoàn trả'].includes(z.status))return false;let pairs=new Set();for(let w of x.withholds){let k=w.periodId+'|'+w.partnerId;if(!w.id||!kid.has(w.periodId)||!pid.has(w.partnerId)||pairs.has(k)||!Number.isSafeInteger(+w.amount)||w.amount<0)return false;pairs.add(k)}let paidTotals=new Map();for(let q of x.payouts){if(!q.id||!kid.has(q.periodId)||!pid.has(q.partnerId)||!x.periods.find(p=>p.id===q.periodId).locked||!validDate(q.date)||!Number.isSafeInteger(+q.amount)||q.amount<=0)return false;let k=q.periodId+'|'+q.partnerId;paidTotals.set(k,(paidTotals.get(k)||0)+q.amount)}for(let [k,v] of paidTotals){let [periodId,partnerId]=k.split('|'),r=x.periods.find(p=>p.id===periodId)?.snapshot?.results.find(z=>z.partnerId===partnerId);if(!r||!Number.isSafeInteger(v)||v>r.net)return false}return true}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);return rows}
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseMoney(v){if(typeof v==='number')return v;let s=String(v??'').trim().replace(/[₫đ\s]/gi,'');if(/^\d{1,3}(?:\.\d{3})+(?:,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^\d+,\d+$/.test(s))s=s.replace(',','.');return s===''?0:Number(s)}
const parseRate=v=>parseMoney(String(v??'').replace('%',''));
function parseDate(v){if(typeof v==='number'&&v>20000&&v<100000)return iso(new Date(Date.UTC(1899,11,30)+v*86400000));let s=String(v??'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
async function readRows(file){return file.name.toLowerCase().endsWith('.xlsx')?Object.values(await Excel.read(file))[0]||[]:parseCSV(await file.text())}
async function importPartners(file){let rows=await readRows(file);if(rows.length<2)throw Error('File cần tiêu đề và dữ liệu.');let h=rows[0].map(norm),at={code:h.findIndex(x=>['ma','mactv','macongtacvien'].includes(x)),name:h.findIndex(x=>['hovaten','hoten','ten','tenctv'].includes(x)),rate:h.findIndex(x=>['tylehoahong','tyle'].includes(x)),phone:h.findIndex(x=>['dienthoai','sdt'].includes(x))};if(at.code<0||at.name<0||at.rate<0)throw Error('Thiếu Mã, Họ và tên hoặc Tỷ lệ hoa hồng.');let items=[],codes=new Set();for(let r of rows.slice(1)){if(!r.some(v=>String(v??'').trim()))continue;let v=k=>at[k]<0?'':r[at[k]]??'',code=String(v('code')).trim(),name=String(v('name')).trim(),rate=parseRate(v('rate')),phone=String(v('phone')).trim();if(!code||!name||!Number.isFinite(rate)||rate<0||rate>100)throw Error('CTV dòng '+(items.length+2)+' không hợp lệ.');if(codes.has(code.toLowerCase()))throw Error('Trùng mã trong file: '+code);codes.add(code.toLowerCase());items.push({code,name,rate,phone})}if(!items.length)throw Error('Không có CTV hợp lệ.');if(db.partners.length+items.filter(x=>!db.partners.some(y=>y.code.toLowerCase()===x.code.toLowerCase())).length>500)throw Error('Vượt 500 CTV.');if(!confirm('Nhập '+items.length+' CTV? Mã có sẵn sẽ cập nhật tỷ lệ mặc định; đơn cũ giữ tỷ lệ đã chụp.'))return;for(let x of items){let old=db.partners.find(y=>y.code.toLowerCase()===x.code.toLowerCase());if(old){old.name=x.name;old.rate=x.rate;old.phone=x.phone||old.phone}else db.partners.push({id:uid(),...x,channel:'',taxId:'',active:true})}save();alert('Đã nhập '+items.length+' CTV.')}
async function importOrders(file){let rows=await readRows(file);if(rows.length<2)throw Error('File cần tiêu đề và dữ liệu.');let h=rows[0].map(norm),at={date:h.findIndex(x=>['ngay','ngaydon'].includes(x)),partner:h.findIndex(x=>['ctv','mactv','congtacvien'].includes(x)),code:h.findIndex(x=>['madon','madonhang'].includes(x)),value:h.findIndex(x=>['giatridon','giatri'].includes(x)),status:h.findIndex(x=>['tinhtrang','trangthai'].includes(x)),customer:h.findIndex(x=>['khachhang','khach'].includes(x))};if(at.date<0||at.partner<0||at.value<0)throw Error('Thiếu Ngày, CTV hoặc Giá trị đơn.');let items=[],max=Math.max(0,...db.orders.map(o=>/^DH-\d+$/.test(o.code)?Number(o.code.slice(3)):0));for(let r of rows.slice(1)){if(!r.some(v=>String(v??'').trim()))continue;let v=k=>at[k]<0?'':r[at[k]]??'',day=parseDate(v('date')),code=String(v('code')).trim()||'DH-'+String(max+items.length+1).padStart(4,'0'),who=String(v('partner')).trim(),x=db.partners.find(z=>z.code.toLowerCase()===who.toLowerCase()||z.name.toLowerCase()===who.toLowerCase()),value=parseMoney(v('value')),status=String(v('status')).trim()||'Hoàn thành',p=findPeriod(day);if(!validDate(day)||!x||!p||p.locked||!Number.isSafeInteger(value)||value<0||value>1e12||!['Hoàn thành','Hoàn trả'].includes(status))throw Error('Đơn '+code+' không hợp lệ: ngày, CTV, kỳ mở, giá trị hoặc trạng thái.');items.push({id:uid(),date:day,code,partnerId:x.id,customer:String(v('customer')).trim(),value,rate:x.rate,status,note:''})}if(!items.length)throw Error('Không có đơn hợp lệ.');if(db.orders.length+items.length>20000)throw Error('Vượt 20.000 đơn.');let codes=new Set(db.orders.map(o=>o.code.toLowerCase()));for(let o of items){if(codes.has(o.code.toLowerCase()))throw Error('Trùng mã đơn '+o.code);codes.add(o.code.toLowerCase())}if(!confirm('Nhập '+items.length+' đơn?'))return;db.orders.push(...items);save();alert('Đã nhập '+items.length+' đơn.')}
function loadSample(){if(db.partners.length||db.periods.length||db.orders.length||db.withholds.length||db.payouts.length){alert('Chỉ nạp mẫu khi các sổ đang trống.');return}if(!confirm('Nạp 6 CTV và 20 đơn mẫu từ file gốc? Chế độ khấu trừ sẽ chuyển sang mô phỏng file gốc.'))return;let p={id:uid(),name:'Kỳ mẫu 30 ngày',start:addDays(today(),-30),end:today(),locked:false,snapshot:null};db.periods=[p];periodId=p.id;db.settings.taxMode='sample';db.settings.threshold=2000000;db.settings.taxRate=10;db.partners=SAMPLE.ctv.map(r=>({id:uid(),code:r[0],name:r[1],rate:r[2],phone:'',channel:'',taxId:'',active:true}));db.orders=SAMPLE.dh.map(r=>({id:uid(),date:addDays(today(),Number(r[0].slice(1))),partnerId:db.partners.find(x=>x.code===r[1]).id,code:r[2],customer:'',value:r[3],rate:db.partners.find(x=>x.code===r[1]).rate,status:r[4],note:''}));save()}
function render(){if(!selected()&&db.periods.length)periodId=db.periods[0].id;let titles={dashboard:'Tổng quan',partners:'Cộng tác viên',periods:'Kỳ đối soát',orders:'Đơn hàng',settlements:'Đối soát & chốt kỳ',payouts:'Chi hoa hồng',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$('#topSub').textContent=db.partners.length+' CTV · '+db.periods.length+' kỳ · '+db.orders.length+' đơn';$$('[data-page]',$('.side-nav')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=page==='dashboard'?dashboard():page==='partners'?partnersPage():page==='periods'?periodsPage():page==='orders'?ordersPage():page==='settlements'?settlementsPage():page==='payouts'?payoutsPage():page==='report'?reportPage():page==='settings'?settingsPage():page==='data'?dataPage():guidePage()}
function navigate(to){page=to;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-edit-partner],[data-delete-partner],[data-edit-period],[data-delete-period],[data-edit-order],[data-delete-order],[data-edit-withhold],[data-delete-withhold],[data-delete-payout],[data-select-period]');if(!b)return;let d=b.dataset;if(d.page){navigate(d.page);return}if(d.selectPeriod){periodId=d.selectPeriod;page='dashboard';render();return}for(let [k,v] of [['editPartner','partner'],['editPeriod','period'],['editOrder','order'],['editWithhold','withhold']])if(d[k]){openModal(v,d[k]);return}if(d.deletePartner){let x=partner(d.deletePartner);if(db.orders.some(o=>o.partnerId===x.id)||db.withholds.some(w=>w.partnerId===x.id)||db.payouts.some(q=>q.partnerId===x.id)){alert('CTV đã có dữ liệu; chuyển trạng thái Ngừng theo dõi.');return}if(confirm('Xóa '+x.code+'?')){db.partners=db.partners.filter(z=>z.id!==x.id);save()}return}if(d.deletePeriod){let p=period(d.deletePeriod);if(p.locked||ordersIn(p).length||db.withholds.some(w=>w.periodId===p.id)||db.payouts.some(q=>q.periodId===p.id)){alert('Kỳ đã có dữ liệu hoặc đã chốt.');return}if(confirm('Xóa kỳ '+p.name+'?')){db.periods=db.periods.filter(z=>z.id!==p.id);periodId=db.periods[0]?.id||'';save()}return}if(d.deleteOrder){let o=order(d.deleteOrder);if(findPeriod(o.date)?.locked)return;if(confirm('Xóa đơn '+o.code+'?')){db.orders=db.orders.filter(z=>z.id!==o.id);save()}return}if(d.deleteWithhold){let w=db.withholds.find(z=>z.id===d.deleteWithhold);if(period(w.periodId)?.locked)return;if(confirm('Xóa xác nhận khấu trừ?')){db.withholds=db.withholds.filter(z=>z.id!==w.id);save()}return}if(d.deletePayout){let q=db.payouts.find(z=>z.id===d.deletePayout);if(q&&confirm('Xóa khoản chi '+money(q.amount)+'?')){db.payouts=db.payouts.filter(z=>z.id!==q.id);save()}return}switch(d.action){case'newPartner':openModal('partner');break;case'newPeriod':openModal('period');break;case'newOrder':openModal('order');break;case'newWithhold':openModal('withhold');break;case'newPayout':openModal('payout');break;case'closeModal':closeModal();break;case'saveModal':saveModal();break;case'closePeriod':closePeriod();break;case'reopen':reopenPeriod();break;case'print':window.print();break;case'saveSettings':{let s=clone(db.settings);for(let el of $$('[data-setting]'))s[el.dataset.setting]=['threshold','taxRate'].includes(el.dataset.setting)?Number(el.value):el.value.trim();if(!['manual','sample'].includes(s.taxMode)||!Number.isSafeInteger(s.threshold)||s.threshold<0||s.threshold>1e12||!Number.isFinite(s.taxRate)||s.taxRate<0||s.taxRate>100){alert('Thông số khấu trừ không hợp lệ.');return}db.settings=s;save();break}case'backup':backup();break;case'saveHtml':saveHtml();break;case'exportAll':exportAll();break;case'exportReport':exportReport();break;case'exportCsv':download('ai-mo-affiliate-don.csv','text/csv;charset=utf-8',csvRows(orderSheet()));break;case'sample':loadSample();break;case'clear':if(confirm('Xóa toàn bộ dữ liệu và cài đặt?')){db=empty();periodId='';page='dashboard';save()}break}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='search'){let pos=t.selectionStart;query=t.value;render();let next=$('#search');next?.focus();next?.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='periodPicker'){periodId=t.value;render();return}if(t.id==='statusFilter'){statusFilter=t.value;render();return}if(!t.dataset.import||!t.files?.[0])return;try{let file=t.files[0];if(t.dataset.import==='backup'){if(file.size>20e6)throw Error('File JSON quá lớn.');let x=JSON.parse(await file.text());if(!validBackup(x))throw Error('Bản sao lưu không đúng cấu trúc hoặc phiên bản.');if(confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện tại?')){db=x;periodId=db.periods[0]?.id||'';page='dashboard';save()}}else if(t.dataset.import==='partners')await importPartners(file);else await importOrders(file)}catch(err){alert(err.message)}finally{t.value=''}});
render();
