function flags(x){let out=[];if(x.status==='Đang xử lý'&&days(db.settings.asof,x.date)>db.settings.chamXL)out.push('Xử lý lâu chưa xong');if(x.hours>=db.settings.gioLon)out.push('Dừng máy kéo dài');return out}
function sourceWarning(x){return x.status==='Đang xử lý'&&days(db.settings.asof,x.date)>db.settings.chamXL?'Sự cố xử lý lâu chưa xong':x.hours>=db.settings.gioLon?'Dừng máy kéo dài':''}
function category(x){let f=flags(x);return x.status==='Đã xử lý'?'done':f.length?'urgent':'active'}
function totals(){let a=db.incidents;return {count:a.length,hours:a.reduce((n,x)=>n+x.hours,0),cost:a.reduce((n,x)=>n+x.cost,0),loss:a.reduce((n,x)=>n+productionLoss(x),0),open:a.filter(x=>x.status==='Đang xử lý').length,urgent:a.filter(x=>category(x)==='urgent').length}}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!Number.isFinite(x.settings.spGio)||x.settings.spGio<=0||x.settings.spGio>100000||!Number.isFinite(x.settings.gioLon)||x.settings.gioLon<=0||x.settings.gioLon>1000||!Number.isInteger(x.settings.chamXL)||x.settings.chamXL<0||x.settings.chamXL>365||!Array.isArray(x.incidents)||!Array.isArray(x.events))return 'Cấu trúc hoặc cài đặt không hợp lệ.';
 let ids=new Set();for(let z of x.incidents){if(!z.id||ids.has(z.id)||!dateOK(z.date)||!z.machine||!CAUSES.includes(z.cause)||!z.description||String(z.description).length>1200||!Number.isFinite(z.hours)||z.hours<=0||z.hours>1000||!Number.isSafeInteger(z.cost)||z.cost<0||!Number.isFinite(z.rate)||z.rate<=0||z.rate>100000||!['Đang xử lý','Đã xử lý'].includes(z.status)||String(z.assignee||'').length>120||String(z.resolution||'').length>1200||z.status==='Đã xử lý'&&(!z.closedDate&&!z.sourceClosedUnknown||z.closedDate&&(!dateOK(z.closedDate)||z.closedDate<z.date))||z.status==='Đang xử lý'&&z.closedDate)return 'Dòng sự cố không hợp lệ.';ids.add(z.id)}
 let eids=new Set();for(let e of x.events){if(!e.id||eids.has(e.id)||!ids.has(e.incidentId)||!e.action||!e.at||String(e.note||'').length>1200)return 'Nhật ký không hợp lệ.';eids.add(e.id)}return ''}
const encode=x=>btoa(unescape(encodeURIComponent(JSON.stringify(x))));function decode(){try{let s=$('#embedded-state').textContent.trim();return s==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let v=validate(db);if(v){alert('Không lưu: '+v);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ trình duyệt không lưu được. Hãy xuất JSON/HTML kèm dữ liệu.')}render();return true}
function log(id,action,note=''){db.events.push({id:uid(),incidentId:id,action,note,at:new Date().toISOString()})}
function b(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function chip(x){return `<span class="chip ${category(x)}">${category(x)==='done'?'Đã xử lý':category(x)==='urgent'?'Ưu tiên':'Đang xử lý'}</span>`}
function card(x){return `<article class="incident-card"><div class="incident-meta"><b>${esc(x.machine)}</b><span>${fmt(x.date)}</span></div><p>${esc(x.description)}</p><div class="incident-facts"><span>⏱ ${num(x.hours)} giờ</span><span>≈ ${num(productionLoss(x))} SP</span></div><small>${esc(x.cause)} · ${esc(x.assignee||'Chưa phân công')}</small>${flags(x).length?`<div class="alert-text">${esc(flags(x).join(' · '))}</div>`:''}${b('Mở hồ sơ →','open','card-link',x.id)}</article>`}
function board(){let t=totals(),open=db.incidents.filter(x=>category(x)==='active'),urgent=db.incidents.filter(x=>category(x)==='urgent'),done=db.incidents.filter(x=>category(x)==='done').slice(-6).reverse();return `<div class="page-intro"><div><span class="eyebrow">AI MỞ / NHẬT KÝ XƯỞNG</span><h1>Điều phối sự cố dừng máy</h1><p>Ghi nhận nhanh, theo dõi người xử lý và đối chiếu giờ dừng cùng sản lượng ước tính bị mất.</p></div>${b('＋ Ghi sự cố','new','primary')}</div><div class="signal-strip"><div><small>TỔNG GIỜ DỪNG</small><strong>${num(t.hours)}<em> giờ</em></strong></div><div><small>SẢN LƯỢNG ƯỚC MẤT</small><strong>${num(t.loss)}<em> SP</em></strong></div><div><small>CHI PHÍ SỬA CHỮA</small><strong>${money(t.cost)}</strong></div><div><small>ĐANG XỬ LÝ</small><strong>${t.open}</strong></div></div><div class="board"><section class="lane urgent"><header><span>● Ưu tiên</span><b>${urgent.length}</b></header><p class="lane-note">Đang xử lý quá lâu hoặc dừng máy kéo dài.</p>${urgent.map(card).join('')||'<div class="empty">Không có sự cố ưu tiên.</div>'}</section><section class="lane active"><header><span>◉ Đang xử lý</span><b>${open.length}</b></header><p class="lane-note">Đang theo dõi, chưa vượt ngưỡng.</p>${open.map(card).join('')||'<div class="empty">Không có sự cố đang xử lý.</div>'}</section><section class="lane done"><header><span>✓ Đã xử lý</span><b>${db.incidents.filter(x=>category(x)==='done').length}</b></header><p class="lane-note">Sáu hồ sơ đã khép gần nhất.</p>${done.map(card).join('')||'<div class="empty">Chưa có hồ sơ đã xử lý.</div>'}</section></div><p class="note">Sản lượng bị mất là ước tính giờ dừng × mức sản phẩm/giờ tại lúc ghi, không phải số sản phẩm thực tế đã hủy.</p>`}
function list(){let a=db.incidents.filter(x=>(filter==='all'||x.status===filter||filter==='Ưu tiên'&&category(x)==='urgent')&&(!query||[x.machine,x.cause,x.description,x.assignee].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-head"><div><h1>▤ Sổ sự cố</h1><p>Tra cứu theo máy, nguyên nhân, người xử lý và tình trạng.</p></div>${b('＋ Ghi sự cố','new','primary')}</div><div class="surface"><div class="filters"><label>Tìm nhanh<input id="search" value="${esc(query)}" placeholder="Máy, nguyên nhân, người xử lý…"></label><label>Tình trạng<select id="filter"><option value="all">Tất cả</option><option>Ưu tiên</option><option>Đang xử lý</option><option>Đã xử lý</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Máy / mô tả</th><th>Nguyên nhân</th><th>Giờ dừng</th><th>Ước mất</th><th>Chi phí</th><th>Người xử lý</th><th>Trạng thái</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${fmt(x.date)}</td><td><b>${esc(x.machine)}</b><small>${esc(x.description)}</small></td><td>${esc(x.cause)}</td><td>${num(x.hours)}</td><td>${num(productionLoss(x))}</td><td>${money(x.cost)}</td><td>${esc(x.assignee||'—')}</td><td>${chip(x)}</td><td>${b('Chi tiết','open','small',x.id)}</td></tr>`).join('')||'<tr><td colspan="9">Không có sự cố phù hợp.</td></tr>'}</tbody></table></div></div>`}
function detail(){let x=incident(selected);if(!x){page='list';return list()}let f=flags(x),events=db.events.filter(e=>e.incidentId===x.id).slice().reverse();return `<div class="page-head"><div><button class="text-link" data-act="list">← Sổ sự cố</button><h1>${esc(x.machine)}</h1><p>${fmt(x.date)} · ${chip(x)} · ${esc(x.cause)}</p></div><div class="actions">${b('Sửa hồ sơ','edit','',x.id)}${x.status==='Đang xử lý'?b('✓ Xác nhận đã xử lý','close','primary',x.id):b('↶ Mở lại','reopen','',x.id)}${b('🖨 In hồ sơ','print')}</div></div><div class="detail-grid"><section class="surface"><h2>Hồ sơ sự cố</h2><dl><dt>Mô tả</dt><dd>${esc(x.description)}</dd><dt>Nguyên nhân</dt><dd>${esc(x.cause)}</dd><dt>Người xử lý</dt><dd>${esc(x.assignee||'Chưa phân công')}</dd><dt>Giờ dừng</dt><dd>${num(x.hours)} giờ</dd><dt>Chi phí sửa chữa</dt><dd>${money(x.cost)}</dd><dt>Ngày hoàn tất</dt><dd>${fmt(x.closedDate)}</dd><dt>Hướng xử lý</dt><dd>${esc(x.resolution||'Chưa ghi')}</dd></dl></section><section class="surface highlight"><h2>Phân tích tác động</h2><div class="impact"><small>SẢN LƯỢNG ƯỚC TÍNH BỊ MẤT</small><strong>${num(productionLoss(x))}</strong><span>${num(x.hours)} giờ × ${num(x.rate)} SP/giờ</span></div><p>Hệ số ${num(x.rate)} SP/giờ đã lưu theo hồ sơ. Thay cài đặt chung sau này không sửa số cũ.</p><h3>Cảnh báo</h3>${f.length?`<ul>${f.map(z=>`<li>${esc(z)}</li>`).join('')}</ul>`:'<p>Không có điều kiện vượt ngưỡng.</p>'}<p class="note">Cảnh báo ưu tiên trong mẫu gốc: ${esc(sourceWarning(x)||'Không có')}.</p></section></div><section class="surface timeline"><h2>Nhật ký xử lý</h2>${events.map(e=>`<div class="event"><time>${esc(e.at.slice(0,16).replace('T',' '))}</time><div><b>${esc(e.action)}</b><p>${esc(e.note||'—')}</p></div></div>`).join('')||'<p>Chưa có sự kiện.</p>'}</section>`}
function reports(){let t=totals(),machines=[...new Set(db.incidents.map(x=>x.machine))],causes=[...new Set(db.incidents.map(x=>x.cause))],top=Math.max(1,...machines.map(m=>db.incidents.filter(x=>x.machine===m).reduce((n,x)=>n+x.hours,0)));return `<div class="page-head"><div><h1>▥ Báo cáo dừng máy</h1><p>Nhìn theo thiết bị, nguyên nhân và tổn thất ước tính.</p></div>${b('⬇ Excel','excel','primary')}</div><div class="signal-strip"><div><small>SỰ CỐ</small><strong>${t.count}</strong></div><div><small>GIỜ DỪNG</small><strong>${num(t.hours)}</strong></div><div><small>ƯỚC MẤT</small><strong>${num(t.loss)}<em> SP</em></strong></div><div><small>CHI PHÍ</small><strong>${money(t.cost)}</strong></div></div><div class="detail-grid"><section class="surface"><h2>Theo máy</h2>${machines.map(m=>{let a=db.incidents.filter(x=>x.machine===m),h=a.reduce((n,x)=>n+x.hours,0);return `<div class="bar-row"><span>${esc(m)}</span><div><i style="width:${Math.max(1,h/top*100)}%"></i></div><b>${num(h)} giờ</b></div>`}).join('')||'<p>Chưa có dữ liệu.</p>'}</section><section class="surface"><h2>Nguyên nhân</h2>${causes.map(c=>{let a=db.incidents.filter(x=>x.cause===c);return `<div class="cause-row"><b>${esc(c)}</b><span>${a.length} sự cố · ${num(a.reduce((n,x)=>n+x.hours,0))} giờ · ${money(a.reduce((n,x)=>n+x.cost,0))}</span></div>`}).join('')||'<p>Chưa có dữ liệu.</p>'}</section></div><section class="surface"><h2>Hồ sơ cần ưu tiên</h2>${db.incidents.filter(x=>category(x)==='urgent').map(x=>`<div class="cause-row"><button class="text-link" data-act="open" data-id="${esc(x.id)}">${esc(x.machine)} · ${fmt(x.date)}</button><span>${esc(flags(x).join(' · '))}</span></div>`).join('')||'<p>Không có hồ sơ ưu tiên.</p>'}</section><p class="note">Mức mất sản lượng là ước tính nội bộ theo hệ số mỗi hồ sơ; không cộng với số lượng sản phẩm hỏng thực tế.</p>`}
function settings(){return `<div class="page-head"><h1>⚙ Cài đặt ngưỡng</h1></div><section class="surface"><form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input type="date" name="asof" required value="${esc(db.settings.asof)}"></label><label>SP ước tính / giờ dừng<input type="number" name="spGio" required min="0.01" max="100000" step="0.01" value="${db.settings.spGio}"></label><label>Giờ dừng dài từ<input type="number" name="gioLon" required min="0.01" max="1000" step="0.01" value="${db.settings.gioLon}"></label><label>Chậm xử lý quá số ngày<input type="number" name="chamXL" required min="0" max="365" step="1" value="${db.settings.chamXL}"></label><div class="full">${b('Lưu cài đặt','saveSettings','primary')}</div></form><p class="note">Cảnh báo tính lại theo ngưỡng hiện tại. SP/giờ của hồ sơ đã ghi được giữ nguyên để bảo toàn ước tính lịch sử.</p></section>`}
function dataPage(){return `<div class="page-head"><h1>↧ Dữ liệu offline</h1></div><div class="detail-grid"><section class="surface"><h2>Sao lưu & chuyển máy</h2><p>Dữ liệu đang ở trình duyệt thiết bị này. Xuất JSON hoặc HTML kèm dữ liệu để mang sang máy khác.</p><div class="actions">${b('⬇ JSON','json','primary')}${b('⬇ HTML kèm dữ liệu','html')}${b('⬇ Excel báo cáo','excel')}</div></section><section class="surface"><h2>Nhập và mẫu đối chiếu</h2><p>Nhập JSON hoặc nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Hãy sao lưu trước.</p><div class="actions">${b('⬆ Nhập JSON','import')}${b('Nạp 20 sự cố mẫu','sample')}${b('Xóa dữ liệu','clear','danger')}</div></section></div><section class="surface"><p>Phiên bản dữ liệu ${VERSION} · ${db.incidents.length} sự cố · ${db.events.length} sự kiện. Không dùng API hay kết nối mạng.</p></section>`}
function guide(){return `<div class="page-head"><h1>? Cách sử dụng</h1></div><section class="surface"><ol><li>Ghi sự cố: chọn ngày, máy, nguyên nhân, số giờ dừng, chi phí và người xử lý.</li><li>App ước tính sản lượng mất bằng giờ dừng × sản phẩm/giờ tại lúc ghi. Chỉnh thông số trong Cài đặt cho những sự cố mới.</li><li>Bảng điều phối phân loại Ưu tiên, Đang xử lý và Đã xử lý. Sự cố đang xử lý quá ngưỡng ngày hoặc giờ dừng dài được gắn Ưu tiên.</li><li>Mở hồ sơ, ghi hướng xử lý, sau đó xác nhận đã xử lý. Nếu cần sửa tiếp, mở lại với lý do. Nhật ký thay đổi được lưu.</li><li>Dùng Báo cáo để so máy và nguyên nhân. Xuất JSON/HTML kèm dữ liệu định kỳ để sao lưu.</li></ol><p class="note">Những dòng mẫu chưa có ngày hoàn thành, nên app giữ nguyên trạng thái gốc và đánh dấu ngày hoàn thành mẫu là chưa xác định; chỉ giao dịch mới cần ngày đóng rõ ràng.</p></section>`}
function render(){let views={board,list,detail,reports,settings,data:dataPage,guide};$('#screen').innerHTML=(views[page]||board)();document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===page||page==='detail'&&e.dataset.page==='list'));if(page==='list')$('#filter').value=filter}
function fld(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function sel(label,name,opts,value=''){return `<label>${label}<select name="${name}" required>${opts.map(s=>`<option ${s===value?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`}
function area(label,name,value='',extra=''){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1200" ${extra}>${esc(value)}</textarea></label>`}
function showForm(kind,id=''){draft={kind,id};let x=incident(id)||{},html='',title='';if(kind==='incident'){title=id?'Sửa hồ sơ sự cố':'Ghi sự cố mới';html=fld('Ngày xảy ra *','date',x.date||today(),'date','required')+sel('Máy *','machine',[...new Set([...MACHINES,...db.incidents.map(x=>x.machine)])],x.machine)+fld('Số giờ dừng *','hours',x.hours??1,'number','required min="0.01" max="1000" step="0.01"')+sel('Nguyên nhân *','cause',CAUSES,x.cause)+fld('Chi phí sửa chữa (₫)','cost',x.cost??0,'number','required min="0" step="1"')+fld('Người xử lý','assignee',x.assignee,'text','maxlength="120"')+area('Mô tả sự cố *','description',x.description,'required')+(id?`<p class="full note">Hệ số lịch sử: ${num(x.rate)} SP/giờ. Không sửa hệ số khi cập nhật hồ sơ.</p>`:`<p class="full note">Ước tính sản lượng với ${num(db.settings.spGio)} SP/giờ hiện tại.</p>`)}
 else if(kind==='close'){title='Xác nhận xử lý xong';html=fld('Ngày hoàn thành *','closedDate',today(),'date',`required min="${x.date}"`)+fld('Người xác nhận','actor',x.assignee,'text','maxlength="120"')+area('Hướng xử lý / kết quả *','resolution',x.resolution,'required')}
 else if(kind==='reopen'){title='Mở lại sự cố';html=area('Lý do mở lại *','reason','','required')}
 $('#modalTitle').textContent=title;$('#formFields').innerHTML=html;$('#formError').textContent='';$('#editor').showModal()}
function fv(form,key){return String(new FormData(form).get(key)||'').trim()}function fn(form,key){return Number(fv(form,key))}
function submit(e){e.preventDefault();let form=e.target,{kind,id}=draft,before=copy(db);try{if(kind==='incident'){let obj={date:fv(form,'date'),machine:fv(form,'machine'),hours:fn(form,'hours'),cause:fv(form,'cause'),cost:fn(form,'cost'),assignee:fv(form,'assignee'),description:fv(form,'description')};if(!dateOK(obj.date)||!obj.machine||!CAUSES.includes(obj.cause)||!obj.description||!Number.isFinite(obj.hours)||obj.hours<=0||obj.hours>1000||!Number.isSafeInteger(obj.cost)||obj.cost<0)throw Error('Kiểm tra ngày, giờ dừng, chi phí và mô tả.');let x=incident(id);if(x){Object.assign(x,obj);if(x.closedDate&&x.closedDate<x.date)throw Error('Ngày sự cố sau ngày hoàn thành.');log(id,'Sửa hồ sơ','Cập nhật số liệu sự cố')}else{x={id:uid(),...obj,rate:db.settings.spGio,status:'Đang xử lý',closedDate:'',resolution:'',sourceIndex:null};db.incidents.push(x);log(x.id,'Ghi sự cố',obj.description)}selected=x.id;page='detail'}
 else if(kind==='close'){let x=incident(id),date=fv(form,'closedDate'),resolution=fv(form,'resolution');if(!dateOK(date)||date<x.date||!resolution)throw Error('Cần ngày hoàn thành và kết quả hợp lệ.');x.status='Đã xử lý';x.closedDate=date;x.resolution=resolution;log(id,'Đã xử lý',`${fv(form,'actor')||x.assignee||'Chưa ghi người'}: ${resolution}`);selected=id;page='detail'}
 else if(kind==='reopen'){let reason=fv(form,'reason');if(!reason)throw Error('Cần lý do mở lại.');let x=incident(id);x.status='Đang xử lý';x.closedDate='';log(id,'Mở lại',reason);selected=id;page='detail'}
 let v=validate(db);if(v)throw Error(v);$('#editor').close();save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'nhat-ky-su-co-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'nhat-ky-su-co-kem-du-lieu.html')}
function sheets(){return [{name:'SuCo',rows:[['Ngày','Máy','Giờ dừng','Nguyên nhân','Mô tả','Chi phí','Người xử lý','Trạng thái','Ước mất SP','Cảnh báo','Ngày hoàn thành','Hướng xử lý'],...db.incidents.map(x=>[x.date,x.machine,x.hours,x.cause,x.description,x.cost,x.assignee,x.status,productionLoss(x),sourceWarning(x),x.closedDate,x.resolution])]},{name:'TheoMay',rows:[['Máy','Số sự cố','Giờ dừng','Ước mất SP','Chi phí'],...[...new Set(db.incidents.map(x=>x.machine))].map(m=>{let a=db.incidents.filter(x=>x.machine===m);return [m,a.length,a.reduce((n,x)=>n+x.hours,0),a.reduce((n,x)=>n+productionLoss(x),0),a.reduce((n,x)=>n+x.cost,0)]})]},{name:'NhatKy',rows:[['Ngày giờ','Máy','Thao tác','Ghi chú'],...db.events.map(e=>[e.at,incident(e.incidentId)?.machine||'',e.action,e.note])]},{name:'CaiDat',rows:[['Ngày đối chiếu','SP/giờ mặc định','Giờ dừng dài từ','Chậm xử lý quá ngày'],[db.settings.asof,db.settings.spGio,db.settings.gioLon,db.settings.chamXL]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'nhat-ky-su-co-bao-cao.xlsx')}
function sampleData(){let x=blank(),dateAt=offset=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(offset.slice(1)));return d.toLocaleDateString('sv-SE')};x.incidents=DOWNTIME_SAMPLE.sc.map((r,k)=>({id:uid(),date:dateAt(r[0]),machine:r[1],hours:r[2],cause:r[3],description:r[4],cost:r[5],assignee:r[6],status:r[7],rate:60,closedDate:'',sourceClosedUnknown:r[7]==='Đã xử lý',resolution:'',sourceIndex:k+1}));return x}
function act(name,id=''){if(['board','list','reports','settings','data','guide'].includes(name)){page=name;render();return}if(name==='open'){selected=id;page='detail';render();return}if(name==='new')return showForm('incident');if(name==='edit')return showForm('incident',id);if(name==='close')return showForm('close',id);if(name==='reopen')return showForm('reopen',id);if(name==='print')return print();if(name==='saveSettings'){let f=$('#settingsForm'),settings={asof:f.elements.asof.value,spGio:Number(f.elements.spGio.value),gioLon:Number(f.elements.gioLon.value),chamXL:Number(f.elements.chamXL.value)},old=db.settings;db.settings=settings;let v=validate(db);if(v){db.settings=old;return alert(v)}save();return}if(name==='json')return exportJSON();if(name==='html')return exportHTML();if(name==='excel')return exportExcel();if(name==='import')return $('#jsonFile').click();if(name==='sample'){if(db.incidents.length&&!confirm('Nạp mẫu thay toàn bộ dữ liệu đang có. Tiếp tục?'))return;let x=sampleData(),v=validate(x);if(v)return alert('Mẫu không hợp lệ: '+v);db=x;page='board';save();return}if(name==='clear'){if(!confirm('Xóa toàn bộ dữ liệu trên máy này?')||!confirm('Xác nhận xóa lần cuối.'))return;db=blank();page='board';save()}}
document.addEventListener('click',e=>{let target=e.target.closest('[data-act],[data-page]');if(target)act(target.dataset.act||target.dataset.page,target.dataset.id||'')});$('#itemForm').addEventListener('submit',submit);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let x=JSON.parse(await file.text()),v=validate(x);if(v)throw Error(v);if(!confirm('Nhập JSON thay dữ liệu hiện tại. Tiếp tục?'))return;db=x;page='board';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}});render();
</script></body></html>
