function calcOrder(o){let s=db.settings,w=[],rev=n(o.gross)-n(o.discount)-n(o.returns)+n(o.shipping),costs=db.costs.filter(c=>c.order===o.code&&dateOK(c.date)&&c.date<=s.asof),receipts=db.receipts.filter(r=>r.order===o.code&&dateOK(r.date)&&r.date<=s.asof),cost=costs.reduce((a,c)=>a+n(c.amount),0),paid=receipts.reduce((a,r)=>a+(r.kind==='Hoàn tiền'?-1:1)*n(r.amount),0),profit=rev-cost,receivable=rev+n(o.vat)-paid,inScope=dateOK(o.date)&&o.date>=s.start&&o.date<=s.end;

function render(){let labels={overview:'Tổng quan',orders:'Đơn hàng',costs:'Chi phí',receipts:'Thu / hoàn tiền',issues:'Cần kiểm tra',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=labels[page];$('#topSub').textContent=(db.settings.company||'Chưa đặt tên đơn vị')+' · rà soát đến '+db.settings.asof;$$('[data-page]',$('.side-nav')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=page==='overview'?overview():page==='orders'||page==='costs'||page==='receipts'?entity(page):page==='issues'?issuePage():page==='report'?reportPage():page==='settings'?settingsPage():page==='data'?dataPage():guidePage();if(page==='orders'||page==='costs'||page==='receipts'){let search=$('#tableSearch');search.focus();search.setSelectionRange(search.value.length,search.value.length);$('#sortSelect').value=sortKey}}
function navigate(p){page=p;filter='';sortKey='date';sortDir=-1;render();window.scrollTo(0,0)}
function fieldMarkup(kind,field,value){let [key,label,type]=field,v=value[key]??'',opts=type==='group'?GROUPS:type==='kind'?['Thu tiền','Hoàn tiền']:type==='complete'?['Chưa đủ','Đã đủ']:type==='order'?db.orders.map(x=>x.code):null;return '<div class="field"><label for="f-'+key+'">'+esc(label)+'</label>'+(opts?'<select id="f-'+key+'" name="'+key+'">'+opts.map(x=>'<option value="'+esc(x)+'" '+(v===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>':type==='textarea'?'<textarea id="f-'+key+'" name="'+key+'">'+esc(v)+'</textarea>':'<input id="f-'+key+'" name="'+key+'" type="'+(type==='money'||type==='signed'?'number':type)+'" '+(type==='money'?'min="0"':'')+' '+(['money','signed'].includes(type)?'step="1" inputmode="numeric"':'')+' value="'+esc(v)+'">')+(type==='signed'?'<small>Nhập âm khi hoàn nhập, kèm lý do và chứng từ.</small>':'')+'</div>'}
function openEditor(kind,id=null){if(kind!=='orders'&&!db.orders.length){alert('Hãy tạo đơn hàng trước.');return}let rec=id?db[kind].find(x=>x.id===id):null;if(id&&!rec)return;editing={kind,id};let defaults=kind==='orders'?{date:today(),gross:0,discount:0,returns:0,shipping:0,vat:0,complete:'Chưa đủ'}:kind==='costs'?{date:today(),order:focusCode||db.orders[0].code,group:GROUPS[0],amount:0}:{date:today(),order:focusCode||db.orders[0].code,kind:'Thu tiền',amount:0};let value={...defaults,...rec};$('#modalTitle').textContent=(rec?'Sửa ':'Thêm ')+DEFINITIONS[kind].singular;$('#modalFields').innerHTML=DEFINITIONS[kind].fields.map(f=>fieldMarkup(kind,f,value)).join('');$('#modalError').textContent='';$('#editor').showModal();$('#modalFields input')?.focus()}
function saveEditor(){let {kind,id}=editing,d=DEFINITIONS[kind],value={};for(let [key,,type] of d.fields){let raw=$('[name="'+key+'"]',$('#modalFields')).value.trim();value[key]=['money','signed'].includes(type)?raw===''?'':Number(raw):raw}let old=id?db[kind].find(x=>x.id===id):null,previousOrder=old?.order;let errs=recordErrors(kind,value,db[kind],id);if(old&&kind==='orders'&&old.code!==value.code&&(db.costs.some(x=>x.order===old.code)||db.receipts.some(x=>x.order===old.code)))errs.push('Mã đơn đã được tham chiếu, cần giữ nguyên.');if(!old&&db[kind].length>=d.limit)errs.push('Đã đạt giới hạn '+d.limit+' dòng.');if(errs.length){$('#modalError').textContent=errs.join(' ');return}if(old)Object.assign(old,value);else db[kind].push({id:uid(),...value});if(kind==='costs'){let order=db.orders.find(x=>x.code===value.order);if(order)order.complete='Chưa đủ';if(previousOrder&&previousOrder!==value.order){let prior=db.orders.find(x=>x.code===previousOrder);if(prior)prior.complete='Chưa đủ'}}$('#editor').close();persist()}
function deleteRecord(kind,id){let row=db[kind].find(x=>x.id===id);if(!row)return;if(kind==='orders'&&(db.costs.some(x=>x.order===row.code)||db.receipts.some(x=>x.order===row.code))){alert('Đơn đang có chi phí hoặc giao dịch tiền. Hãy xử lý các dòng liên quan trước.');return}if(!confirm('Xóa '+DEFINITIONS[kind].singular+' '+row.code+'?'))return;db[kind]=db[kind].filter(x=>x.id!==id);if(kind==='costs'){let order=db.orders.find(x=>x.code===row.order);if(order)order.complete='Chưa đủ'}persist()}
function detail(id){let x=allOrders().find(o=>o.id===id);if(!x)return;focusCode=x.code;page='orders';render();let old=$('#orderDetail');old?.remove();let costs=db.costs.filter(r=>r.order===x.code).map(r=>calcLine('costs',r)),receipts=db.receipts.filter(r=>r.order===x.code).map(r=>calcLine('receipts',r));let wrap=document.createElement('section');wrap.className='card';wrap.id='orderDetail';wrap.innerHTML='<div class="toolbar"><h2 class="grow">Chi tiết · '+esc(x.code)+'</h2><button class="btn" data-action="edit" data-kind="orders" data-id="'+esc(x.id)+'">Sửa đơn</button><button class="btn danger" data-action="delete" data-kind="orders" data-id="'+esc(x.id)+'">Xóa đơn</button></div><div class="grid">'+metric('Doanh thu thuần',fmt(x.revenue))+metric('Chi phí đến ngày rà soát',fmt(x.cost),x.costCount+' khoản')+metric('Lãi sau chi phí',fmt(x.profit),x.margin===null?'Biên lãi —':'Biên lãi '+(x.margin*100).toFixed(1)+'%',x.profit<0?'bad':'good')+metric('Đã thu ròng / còn phải thu',fmt(x.paid)+' / '+fmt(x.receivable),x.receiptCount+' giao dịch')+'</div><p class="hint">Doanh thu thuần '+fmt(x.revenue)+' = '+fmt(x.gross)+' − '+fmt(x.discount)+' − '+fmt(x.returns)+' + '+fmt(x.shipping)+'. Công nợ = '+fmt(x.revenue)+' + VAT '+fmt(x.vat)+' − đã thu '+fmt(x.paid)+'.</p>'+(x.warnings.length?'<div class="notice bad">'+esc(x.warnings.join(' · '))+'</div>':'')+'<h3>Chi phí gắn đơn</h3><p><button class="btn small" data-action="new" data-kind="costs">+ Thêm chi phí</button></p>'+tableLines('costs',costs)+'<h3 style="margin-top:22px">Thu / hoàn tiền</h3><p><button class="btn small" data-action="new" data-kind="receipts">+ Thêm giao dịch</button></p>'+tableLines('receipts',receipts);$('#screen').prepend(wrap);wrap.scrollIntoView({behavior:'smooth',block:'start'})}
function download(name,type,content){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(rows){return '\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportTable(kind){let fields=DEFINITIONS[kind].fields;download('lai-that-'+kind+'.csv','text/csv;charset=utf-8',csv([[...fields.map(f=>f[1])],...db[kind].map(r=>fields.map(f=>r[f[0]]))]))}
function exportReport(){let rows=allOrders(),head=['Mã đơn','Ngày đơn','Khách hàng','Kênh bán','Doanh thu thuần','Chi phí','Lãi','Biên lãi %','Đã thu ròng','Còn phải thu','Trong phạm vi','Trạng thái','Cảnh báo'];download('lai-that-bao-cao.csv','text/csv;charset=utf-8',csv([head,...rows.map(x=>[x.code,x.date,x.customer,x.channel,x.revenue,x.cost,x.profit,x.margin===null?'':x.margin*100,x.paid,x.receivable,x.inScope?1:0,x.stage,x.warnings.join('; ')])]))}
function exportExcel(){let sheets=[{name:'Cài đặt',rows:[['Thông số','Giá trị'],['Tên đơn vị',db.settings.company],['Đơn hàng từ ngày',db.settings.start],['Đơn hàng đến ngày',db.settings.end],['Ghi nhận đến ngày',db.settings.asof],['Ngưỡng lệch nội bộ (đ)',db.settings.tolerance]]}];for(let [kind,d] of Object.entries(DEFINITIONS))sheets.push({name:d.title,rows:[d.fields.map(f=>f[1]),...db[kind].map(r=>d.fields.map(([key])=>r[key]))]});let report=allOrders();sheets.push({name:'Báo cáo',rows:[['Mã đơn','Ngày đơn','Doanh thu thuần','Tổng chi phí','Lãi','Biên lãi %','Đã thu ròng','Còn phải thu','Trạng thái','Cảnh báo'],...report.map(r=>[r.code,r.date,r.revenue,r.cost,r.profit,r.margin===null?'':r.margin*100,r.paid,r.receivable,r.stage,r.warnings.join('; ')])]});let blob=Excel.workbook(sheets),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lai-that-tung-don-bo-du-lieu.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function excelDate(v){if(typeof v==='number'&&Number.isFinite(v))return new Date(Date.UTC(1899,11,30)+v*86400000).toISOString().slice(0,10);return String(v??'').trim()}
function workbookToState(book){let settings=book['Cài đặt'];if(!settings||settings[0]?.[0]!=='Thông số'||settings[0]?.[1]!=='Giá trị')throw Error('Thiếu sheet Cài đặt đúng mẫu.');let s=Object.fromEntries(settings.slice(1).map(r=>[String(r[0]),r[1]])),out=empty();out.settings={company:String(s['Tên đơn vị']??''),start:excelDate(s['Đơn hàng từ ngày']),end:excelDate(s['Đơn hàng đến ngày']),asof:excelDate(s['Ghi nhận đến ngày']),tolerance:s['Ngưỡng lệch nội bộ (đ)']};for(let [kind,d] of Object.entries(DEFINITIONS)){let rows=book[d.title],header=d.fields.map(f=>f[1]);if(!rows||header.some((h,i)=>rows[0]?.[i]!==h))throw Error('Thiếu sheet hoặc cột '+d.title+' đúng mẫu.');out[kind]=rows.slice(1).filter(row=>row.some(v=>v!==''&&v!==null&&v!==undefined)).map(row=>{let r={id:uid()};d.fields.forEach(([key,,type],i)=>r[key]=type==='date'?excelDate(row[i]):['money','signed'].includes(type)?row[i]===''?'':Number(row[i]):String(row[i]??'').trim());return r})}let errors=validateSnapshot(out);if(errors.length)throw Error('Bộ Excel có '+errors.length+' lỗi: '+errors.slice(0,6).join(' '));return out}
function saveHtml(){let copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(db))));download('ai-mo-lai-that-tung-don-kem-du-lieu.html','text/html;charset=utf-8','<!doctype html>\n'+copy.outerHTML)}
function backup(){download('lai-that-sao-luu.json','application/json;charset=utf-8',JSON.stringify(db,null,2))}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV thiếu dấu nháy đóng.');if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(v=>v!==''))}
function validateSnapshot(x){let errors=settingsErrors(x.settings),previous=db;db=x;try{for(let kind of ['orders','costs','receipts']){if(x[kind].length>DEFINITIONS[kind].limit)errors.push(DEFINITIONS[kind].title+': vượt giới hạn dòng.');let ids=new Set();for(let r of x[kind]){if(!r.id||ids.has(r.id))errors.push(DEFINITIONS[kind].title+': ID thiếu hoặc trùng.');ids.add(r.id);errors.push(...recordErrors(kind,r,x[kind],r.id).map(t=>DEFINITIONS[kind].title+' '+(r.code||'')+': '+t))}}}finally{db=previous}return errors}
async function importCSV(kind,file){let rows=parseCSV(await file.text()),fields=DEFINITIONS[kind].fields,header=fields.map(f=>f[1]);if(!rows.length||header.some((h,i)=>rows[0][i]!==h))throw Error('Tiêu đề CSV không đúng bảng '+DEFINITIONS[kind].title+'. Hãy dùng file xuất từ app làm mẫu.');let proposed=[],errs=[];for(let i=1;i<rows.length;i++){let r={id:uid()};fields.forEach(([key,,type],j)=>r[key]=['money','signed'].includes(type)?rows[i][j]===''?'':Number(rows[i][j]):String(rows[i][j]??'').trim());let e=recordErrors(kind,r,[...db[kind],...proposed]);if(e.length)errs.push('Dòng '+(i+1)+': '+e.join(' '));else proposed.push(r)}if(errs.length)throw Error(errs.slice(0,8).join('\n')+(errs.length>8?'\n... '+(errs.length-8)+' dòng lỗi khác.':''));if(db[kind].length+proposed.length>DEFINITIONS[kind].limit)throw Error('Vượt giới hạn '+DEFINITIONS[kind].limit+' dòng.');if(!proposed.length)throw Error('Không có dòng dữ liệu.');if(!confirm('Thêm '+proposed.length+' dòng '+DEFINITIONS[kind].title+' đã kiểm tra?'))return;db[kind].push(...proposed);if(kind==='costs')proposed.forEach(c=>{let order=db.orders.find(o=>o.code===c.order);if(order)order.complete='Chưa đủ'});persist();alert('Đã nhập '+proposed.length+' dòng.')}
function demo(){let d=empty();d.settings={company:'Cửa hàng Minh Họa',start:'2026-10-01',end:'2026-10-31',asof:'2026-11-02',tolerance:0};d.orders=[['DH001','2026-10-05','Khách An','Website',100,5,0,1,9.6,'Đã đủ'],['DH002','2026-10-12','Khách Bình','Sàn bán hàng',60,3,0,0,5.7,'Đã đủ'],['DH003','2026-10-20','Khách Chi','Cửa hàng',40,0,8,0,3.2,'Chưa đủ'],['DH004','2026-10-28','Khách Dũng','Đại lý',20,0,0,0,2,'Đã đủ']].map((a,i)=>({id:uid(),code:a[0],date:a[1],customer:a[2],channel:a[3],gross:a[4]*1e6,discount:a[5]*1e6,returns:a[6]*1e6,shipping:a[7]*1e6,vat:a[8]*1e6,complete:a[9]}));let q=0;for(let [order,entries] of [['DH001',[[0,60],[1,2],[2,3],[3,4],[5,5]]],['DH002',[[0,45],[1,3],[2,6],[3,5],[5,3]]],['DH003',[[0,25],[0,-5],[1,1],[2,2]]],['DH004',[[0,12],[5,2]]]])for(let [group,value] of entries)d.costs.push({id:uid(),code:'CP'+String(++q).padStart(3,'0'),order,date:'2026-10-31',group:GROUPS[group],amount:value*1e6,evidence:'HS/'+order,owner:'Kế toán',note:value<0?'Hoàn nhập giá vốn hàng trả':''});d.receipts=[['DH001',105.6,'Thu tiền'],['DH002',40,'Thu tiền'],['DH003',44,'Thu tiền'],['DH003',8.8,'Hoàn tiền'],['DH004',22,'Thu tiền']].map((a,i)=>({id:uid(),code:'TT'+(i+1),order:a[0],date:'2026-11-01',kind:a[2],amount:a[1]*1e6,evidence:'Sao kê '+(i+1),owner:'Kế toán'}));return d}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){navigate(b.dataset.page);return}let a=b.dataset.action,kind=b.dataset.kind,id=b.dataset.id;if(a==='new')openEditor(kind);if(a==='edit')openEditor(kind,id);if(a==='delete')deleteRecord(kind,id);if(a==='detail')detail(id);if(a==='sortdir'){sortDir*=-1;render()}if(a==='csv')exportTable(kind);if(a==='reportCsv')exportReport();if(a==='excel')exportExcel();if(a==='saveHtml')saveHtml();if(a==='backup')backup();if(a==='print'){if(page==='data'){page='report';render()}window.print()}if(a==='saveSettings'){let s={company:$('#s-company').value.trim(),start:$('#s-start').value,end:$('#s-end').value,asof:$('#s-asof').value,tolerance:Number($('#s-tolerance').value)},errors=settingsErrors(s);if(errors.length){$('#settingsError').textContent=errors.join(' ');return}db.settings=s;persist()}if(a==='demo'){if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng dữ liệu mẫu?'))return;db=demo();persist();navigate('overview')}if(a==='clear'){if(!confirm('Xóa toàn bộ dữ liệu trên máy? Hãy sao lưu trước.'))return;db=empty();persist();navigate('overview')}});
document.addEventListener('input',e=>{if(e.target.id==='tableSearch'){filter=e.target.value;let pos=e.target.selectionStart;render();let input=$('#tableSearch');input.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id==='sortSelect'){sortKey=e.target.value;render()}if(e.target.dataset.import){let kind=e.target.dataset.import,file=e.target.files[0];if(!file)return;try{if(kind==='json'){let x=cleanState(JSON.parse(await file.text()));if(!x)throw Error('File sao lưu sai ứng dụng hoặc phiên bản.');let errors=validateSnapshot(x);if(errors.length)throw Error('Bản sao lưu có '+errors.length+' lỗi: '+errors.slice(0,5).join(' '));if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu?'))return;db=x;persist();alert('Đã khôi phục dữ liệu.')}else if(kind==='xlsx'){let book=await Excel.read(file),x=workbookToState(book);if(!confirm('Bộ Excel đã kiểm tra hợp lệ. Thay toàn bộ dữ liệu hiện tại bằng '+x.orders.length+' đơn, '+x.costs.length+' chi phí và '+x.receipts.length+' giao dịch?'))return;db=x;persist();alert('Đã nhập bộ Excel.')}else await importCSV(kind,file)}catch(err){alert(err.message)}finally{e.target.value=''}}});
$('#modalClose').onclick=$('#modalCancel').onclick=()=>$('#editor').close();$('#modalSave').onclick=saveEditor;$('#quickPrint').onclick=()=>window.print();render();

</script></body></html>
