function requestsPage(){let a=db.requests.filter(r=>(filter==='all'||r.state===filter)&&(!query||[r.number,r.productionOrder,r.team,r.requester].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-head"><div><h1>📋 Phiếu yêu cầu xuất vật tư</h1><p>Chỉ lượt xuất từ phiếu đã duyệt mới làm giảm tồn.</p></div>${btn('＋ Lập phiếu','newRequest','primary')}</div><div class="card"><div class="filters"><label>Tìm số phiếu / lệnh / tổ<input id="search" value="${esc(query)}" placeholder="PX-001, LSX-01…"></label><label>Tình trạng<select id="requestFilter"><option value="all" ${filter==='all'?'selected':''}>Tất cả</option>${STATES.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="table-wrap"><table><thead><tr><th>Phiếu</th><th>Ngày</th><th>Lệnh sản xuất</th><th>Tổ nhận</th><th>Số dòng</th><th>Yêu cầu</th><th>Thực xuất</th><th>Giá trị đã xuất</th><th>Cảnh báo</th><th>Tình trạng</th><th></th></tr></thead><tbody>${a.map(r=>{let v=requestStats(r),w=warnings(r);return `<tr><td><button class="link" data-act="openRequest" data-id="${esc(r.id)}">${esc(r.number)}</button></td><td>${fmt(r.date)}</td><td>${esc(r.productionOrder||'—')}</td><td>${esc(r.team||'—')}</td><td>${v.lines}</td><td>${qty(v.asked)}</td><td>${qty(v.issued)}</td><td>${money(v.value)}</td><td>${w.length?`<span class="pill red">${w.length} cần xem</span>`:'—'}</td><td>${badge(r.state)}</td><td>${btn('Xem','openRequest','small',r.id)}</td></tr>`}).join('')||'<tr><td colspan="11">Chưa có phiếu phù hợp.</td></tr>'}</tbody></table></div></div>`}
function requestDetail(){let r=request(selected);if(!r){page='requests';return requestsPage()}let v=requestStats(r),w=warnings(r),ll=linesFor(r.id),editable=r.state==='Chờ duyệt';return `<div class="page-head"><div><button class="link" data-act="requests">← Danh sách phiếu</button><h1>🧾 ${esc(r.number)}</h1><p>${fmt(r.date)} · ${esc(r.productionOrder||'Chưa ghi lệnh sản xuất')} · ${badge(r.state)}</p></div><div class="actions no-print">${editable?btn('＋ Thêm vật tư','newLine','primary',r.id)+btn('Sửa phiếu','editRequest','',r.id)+btn('Duyệt phiếu','approveRequest','',r.id)+btn('Từ chối','rejectRequest','danger',r.id):''}${['Đã duyệt','Xuất một phần','Đã xuất'].includes(r.state)&&v.issued===0?btn('Mở lại để sửa','reopenRequest','',r.id):''}${btn('🖨️ In phiếu','print')}</div></div><div class="status-grid"><div><small>Dòng vật tư</small><strong>${v.lines}</strong></div><div><small>Tổng yêu cầu*</small><strong>${qty(v.asked)}</strong></div><div><small>Thực xuất*</small><strong>${qty(v.issued)}</strong></div><div><small>Chênh lệch*</small><strong>${qty(v.variance)}</strong></div><div><small>Giá trị thực xuất</small><strong>${money(v.value)}</strong></div></div><div class="content-grid">${panel('📝 Thông tin phiếu',`<dl><dt>Người yêu cầu</dt><dd>${esc(r.requester||'—')}</dd><dt>Người duyệt</dt><dd>${esc(r.approvedBy||'—')}</dd><dt>Tổ nhận</dt><dd>${esc(r.team||'—')}</dd><dt>Ghi chú</dt><dd>${esc(r.note||'—')}</dd></dl>`)}${panel('⚠️ Kiểm soát',w.length?`<ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="success">Không có cảnh báo theo dữ liệu hiện tại.</p>')}</div>${panel('📦 Vật tư trong phiếu',`<div class="actions no-print">${editable?btn('＋ Thêm vật tư','newLine','primary',r.id):''}</div><div class="table-wrap"><table><thead><tr><th>Vật tư</th><th>Yêu cầu</th><th>Duyệt</th><th>Thực xuất đã ghi</th><th>Chênh lệch</th><th>Giá trị xuất</th><th>Tồn hiện tại</th><th>Số mẫu gốc</th><th></th></tr></thead><tbody>${ll.map(l=>{let m=material(l.materialId),actual=netLine(l);return `<tr><td>${esc(m.code)} · ${esc(m.name)}<small>${esc(m.unit)}</small></td><td>${qty(l.requested)}</td><td>${qty(l.approved)}</td><td>${qty(actual)}</td><td>${qty(actual-l.requested)}</td><td>${money(valueLine(l))}</td><td>${qty(stock(m))}</td><td>${l.sourceActual===null?'—':qty(l.sourceActual)}</td><td class="no-print">${editable?btn('Sửa','editLine','small',l.id):''}${['Đã duyệt','Xuất một phần'].includes(r.state)?btn('Xuất','newIssue','small',l.id):''}</td></tr>`}).join('')||'<tr><td colspan="9">Chưa có dòng vật tư. Hãy thêm trước khi duyệt.</td></tr>'}</tbody></table></div><p class="note">“Số mẫu gốc” chỉ là số đã ghi trên file tham chiếu, kể cả phiếu chưa xuất; không trừ tồn. Chênh lệch thực xuất = số đã ghi xuất − yêu cầu.</p>`)}${panel('🚚 Các lần xuất & trả lại',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Vật tư</th><th>Xuất</th><th>Đã trả</th><th>Đơn giá chụp</th><th>Giá trị còn xuất</th><th>Chứng từ / người giao nhận</th><th></th></tr></thead><tbody>${ll.flatMap(l=>issuesFor(l.id).map(i=>{let m=material(l.materialId);return `<tr><td>${fmt(i.date)}</td><td>${esc(m.code)}</td><td>${qty(i.qty)} ${esc(m.unit)}</td><td>${qty(returned(i.id))}</td><td>${money(i.price)}</td><td>${money((i.qty-returned(i.id))*i.price)}</td><td>${esc(i.doc||'—')}<small>${esc(i.issuedBy||'')} → ${esc(i.receivedBy||'')}</small></td><td class="no-print">${i.qty>returned(i.id)?btn('Trả lại','newReturn','small',i.id):''}</td></tr>`})).join('')||'<tr><td colspan="8">Chưa ghi lượt xuất.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký phiếu',db.audit.filter(a=>a.requestId===r.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có nhật ký.</p>')}<p class="note">* Tổng số lượng có thể gộp nhiều đơn vị tính; xem từng dòng vật tư để quyết định.</p>`}
function materialsPage(){return `<div class="page-head"><div><h1>🧵 Danh mục vật tư</h1><p>Tồn hiện tại tính từ tồn đầu, điều chỉnh và lượt xuất trừ lượt trả.</p></div>${btn('＋ Thêm vật tư','newMaterial','primary')}</div>${panel('Tồn kho & giá trị',`<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Đơn vị</th><th>Đơn giá hiện tại</th><th>Tồn đầu</th><th>Điều chỉnh</th><th>Đã xuất ròng</th><th>Tồn hiện tại</th><th>Giá trị xuất</th><th></th></tr></thead><tbody>${db.materials.map(m=>{let s=materialStats(m),adj=db.adjustments.filter(a=>a.materialId===m.id).reduce((n,a)=>n+a.delta,0);return `<tr><td><b>${esc(m.code)}</b></td><td>${esc(m.name)}</td><td>${esc(m.unit)}</td><td>${money(m.price)}</td><td>${qty(m.opening)}</td><td>${qty(adj)}</td><td>${qty(s.issued)}</td><td><strong>${qty(s.stock)}</strong></td><td>${money(s.value)}</td><td class="no-print">${btn('Chi tiết','openMaterial','small',m.id)}</td></tr>`}).join('')||'<tr><td colspan="10">Chưa có vật tư. Thêm thủ công hoặc nạp dữ liệu mẫu.</td></tr>'}</tbody></table></div>`)}`}
function materialDetail(){let m=material(activeMaterial);if(!m){page='materials';return materialsPage()}let s=materialStats(m),related=db.lines.filter(l=>l.materialId===m.id);return `<div class="page-head"><div><button class="link" data-act="materials">← Danh mục</button><h1>🧵 ${esc(m.code)} · ${esc(m.name)}</h1><p>${esc(m.unit)} · ${esc(m.note||'Không có ghi chú')}</p></div><div class="actions">${btn('Sửa vật tư','editMaterial','',m.id)}${btn('Điều chỉnh tồn','newAdjustment','primary',m.id)}</div></div><div class="status-grid"><div><small>Đơn giá hiện tại</small><strong>${money(m.price)}</strong></div><div><small>Tồn đầu</small><strong>${qty(m.opening)}</strong></div><div><small>Xuất ròng</small><strong>${qty(s.issued)}</strong></div><div><small>Tồn hiện tại</small><strong>${qty(s.stock)}</strong></div><div><small>Giá trị xuất</small><strong>${money(s.value)}</strong></div></div>${panel('📑 Các phiếu liên quan',`<div class="table-wrap"><table><thead><tr><th>Phiếu</th><th>Ngày</th><th>Lệnh</th><th>Yêu cầu</th><th>Duyệt</th><th>Xuất ròng</th><th>Giá trị</th><th>Tình trạng</th></tr></thead><tbody>${related.map(l=>{let r=request(l.requestId);return `<tr><td><button class="link" data-act="openRequest" data-id="${esc(r.id)}">${esc(r.number)}</button></td><td>${fmt(r.date)}</td><td>${esc(r.productionOrder||'—')}</td><td>${qty(l.requested)}</td><td>${qty(l.approved)}</td><td>${qty(netLine(l))}</td><td>${money(valueLine(l))}</td><td>${badge(r.state)}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có phiếu liên quan.</td></tr>'}</tbody></table></div>`)}${panel('⚖️ Điều chỉnh tồn',db.adjustments.filter(a=>a.materialId===m.id).map(a=>`<div class="mini"><b>${fmt(a.date)} · ${qty(a.delta)} ${esc(m.unit)}</b><small>${esc(a.reason)} · ${esc(a.actor||'—')}</small></div>`).join('')||'<p>Chưa có điều chỉnh.</p>')}`}
function reportsPage(){let s=summary(),pending=db.requests.filter(r=>r.state==='Chờ duyệt'&&warnings(r).length);return `<div class="page-head"><div><h1>📊 Kiểm soát & báo cáo</h1><p>Cập nhật tức thời từ chứng từ, không gồm số tham chiếu mẫu chưa xuất.</p></div>${btn('⬇ Xuất Excel','exportExcel','primary')}</div><div class="status-grid"><div><small>Vật tư</small><strong>${s.materials}</strong></div><div><small>Chờ duyệt quá hạn</small><strong>${pending.length}</strong></div><div><small>Phiếu xuất vượt yêu cầu</small><strong>${s.overRequest}</strong></div><div><small>Xuất một phần</small><strong>${s.partial}</strong></div><div><small>Giá trị thực xuất</small><strong>${money(s.value)}</strong></div></div><div class="content-grid">${panel('⚠️ Phiếu cần xem',db.requests.filter(r=>warnings(r).length).map(r=>`<div class="mini"><button class="link" data-act="openRequest" data-id="${esc(r.id)}">${esc(r.number)}</button><small>${esc(warnings(r).join('; '))}</small></div>`).join('')||'<p>Không có cảnh báo.</p>')}${panel('📦 Vật tư tồn thấp',db.materials.filter(m=>m.opening>0&&stock(m)<=m.opening*.2).map(m=>`<div class="mini"><button class="link" data-act="openMaterial" data-id="${esc(m.id)}">${esc(m.code)} · ${esc(m.name)}</button><small>${qty(stock(m))} ${esc(m.unit)} còn lại</small></div>`).join('')||'<p>Không có vật tư dưới 20% tồn đầu.</p>')}</div>${panel('📋 Tổng hợp theo lệnh sản xuất',`<div class="table-wrap"><table><thead><tr><th>Lệnh</th><th>Số phiếu</th><th>Số dòng</th><th>Giá trị xuất</th><th>Chờ duyệt</th></tr></thead><tbody>${[...new Set(db.requests.map(r=>r.productionOrder||'Chưa gắn lệnh'))].map(k=>{let rr=db.requests.filter(r=>(r.productionOrder||'Chưa gắn lệnh')===k);return `<tr><td>${esc(k)}</td><td>${rr.length}</td><td>${rr.reduce((n,r)=>n+linesFor(r.id).length,0)}</td><td>${money(rr.reduce((n,r)=>n+requestStats(r).value,0))}</td><td>${rr.filter(r=>r.state==='Chờ duyệt').length}</td></tr>`}).join('')||'<tr><td colspan="5">Chưa có dữ liệu.</td></tr>'}</tbody></table></div>`)}`}
function settingsPage(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngày đối chiếu & cảnh báo',`<form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input type="date" name="asof" required value="${esc(db.settings.asof)}"></label><label>Cảnh báo chờ duyệt sau (ngày)<input type="number" name="reviewDays" min="0" max="365" required value="${db.settings.reviewDays}"></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="note">Ngày đối chiếu có thể đặt lại để xem đúng tình trạng quá hạn của dữ liệu cũ.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div><div class="content-grid">${panel('Xuất dữ liệu',`<p>Dữ liệu lưu trên chính trình duyệt/máy đang mở. Hãy xuất bản sao trước khi đổi thiết bị.</p><div class="actions">${btn('⬇ JSON đầy đủ','exportJSON','primary')}${btn('⬇ HTML kèm dữ liệu','exportHTML')}${btn('⬇ Excel báo cáo','exportExcel')}</div>`)}${panel('Nhập & mẫu',`<p>Nhập JSON đã xuất từ app này sẽ thay toàn bộ dữ liệu hiện có. Mẫu gốc có 8 vật tư, 20 phiếu.</p><div class="actions">${btn('⬆ Nhập JSON','importJSON')}${btn('Nạp mẫu tham chiếu','loadSample')}${btn('Xóa toàn bộ dữ liệu','clearData','danger')}</div>`)}</div>${panel('Thông tin phiên bản',`<p>Phiên bản dữ liệu ${VERSION}. ${db.materials.length} vật tư · ${db.requests.length} phiếu · ${db.issues.length} lượt xuất · ${db.returns.length} lượt trả.</p><p>Không sử dụng máy chủ, tài khoản hoặc API. Số liệu chỉ nằm trong tệp HTML kèm dữ liệu khi anh chủ động xuất.</p>`)}`}
function guidePage(){return `<div class="page-head"><h1>❔ Hướng dẫn sử dụng</h1></div>${panel('Quy trình 6 bước',`<ol><li>Thêm vật tư, đơn vị, đơn giá và tồn đầu.</li><li>Lập phiếu yêu cầu, ghi lệnh sản xuất và tổ nhận.</li><li>Thêm một hoặc nhiều dòng vật tư, nhập lượng yêu cầu.</li><li>Duyệt phiếu và điều chỉnh lượng được duyệt nếu cần.</li><li>Xuất kho từng lần; số lượng vượt duyệt cần ghi lý do ngoại lệ. App chặn xuất làm tồn âm.</li><li>Nếu trả vật tư, ghi vào đúng lượt xuất. Tồn và giá trị sẽ cập nhật theo đơn giá chụp của lượt đó.</li></ol><p>Xuất JSON/HTML kèm dữ liệu sau mỗi đợt nhập liệu quan trọng. Excel dùng để xem và đối chiếu.</p>`)}${panel('Quy tắc tính',`<p><b>Tồn:</b> tồn đầu + điều chỉnh − tổng xuất + tổng trả. <b>Giá trị:</b> tổng (xuất − trả) × đơn giá tại thời điểm xuất. <b>Chênh lệch:</b> thực xuất ròng − yêu cầu.</p><p>Đơn vị tính khác nhau không cộng thành một lượng có ý nghĩa. Các con số tổng lượng chỉ dùng đối chiếu mẫu, hãy đọc theo từng vật tư.</p><p>Mẫu tham chiếu có số “thực xuất” trên phiếu chưa xuất. App giữ riêng ở cột Số mẫu gốc và chỉ tính xuất kho với phiếu trạng thái Đã xuất.</p>`)}`}
function render(){let titles={home:'Tổng quan',requests:'Phiếu yêu cầu',request:'Chi tiết phiếu',materials:'Vật tư',material:'Chi tiết vật tư',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu',guide:'Hướng dẫn'},views={home,requests:requestsPage,request:requestDetail,materials:materialsPage,material:materialDetail,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML=(views[page]||home)();$('#topTitle').textContent=titles[page]||'Tổng quan';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='request'&&b.dataset.page==='requests'||page==='material'&&b.dataset.page==='materials'))}
function fld(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function area(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1200">${esc(value)}</textarea></label>`}
function selectField(label,name,items,selected=''){return `<label>${label}<select name="${name}" required>${items.map(([v,t])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function showForm(kind,id=''){let t='',f='';draft={kind,id};if(kind==='material'){let m=material(id)||{};t=id?'Sửa vật tư':'Thêm vật tư';f=fld('Mã vật tư *','code',m.code,'text','required maxlength="40"')+fld('Tên vật tư *','name',m.name,'text','required maxlength="160"')+fld('Đơn vị *','unit',m.unit,'text','required maxlength="40"')+fld('Đơn giá hiện tại (₫) *','price',m.price??0,'number','required min="0" step="1"')+fld('Tồn đầu *','opening',m.opening??0,'number',`required min="0" step="0.01" ${id?'readonly':''}`)+area('Ghi chú','note',m.note)}
 else if(kind==='request'){let r=request(id)||{};t=id?'Sửa phiếu':'Lập phiếu yêu cầu';f=fld('Ngày phiếu *','date',r.date||today(),'date','required')+fld('Số phiếu *','number',r.number||`PX-${String(db.requests.length+1).padStart(3,'0')}`,'text','required maxlength="50"')+fld('Lệnh sản xuất','productionOrder',r.productionOrder,'text','maxlength="100"')+fld('Tổ nhận','team',r.team,'text','maxlength="100"')+fld('Người yêu cầu','requester',r.requester,'text','maxlength="100"')+area('Ghi chú','note',r.note)}
 else if(kind==='line'){let l=line(id)||{},r=request(l.requestId||selected);if(!r){alert('Hãy lập phiếu trước.');return}t=id?'Sửa dòng vật tư':'Thêm dòng vật tư';f=selectField('Vật tư *','materialId',db.materials.map(m=>[m.id,`${m.code} · ${m.name} · tồn ${qty(stock(m))} ${m.unit}`]),l.materialId)+fld('Số lượng yêu cầu *','requested',l.requested??1,'number','required min="0.01" step="0.01"')+area('Ghi chú dòng','note',l.note)}
 else if(kind==='approval'){let r=request(id);t='Duyệt phiếu '+r.number;f=fld('Người duyệt *','approvedBy',r.approvedBy,'text','required maxlength="100"')+linesFor(r.id).map(l=>fld(`${material(l.materialId).code} · duyệt tối đa ${qty(l.requested)} *`,'approved_'+l.id,l.approved||l.requested,'number',`required min="0" max="${l.requested}" step="0.01"`)).join('')+area('Ghi chú duyệt','reason','');}
 else if(kind==='issue'){let l=line(id),m=material(l.materialId),r=request(l.requestId);t='Xuất '+m.code+' · '+r.number;f=`<p class="full note">Đã xuất ròng: ${qty(netLine(l))} / được duyệt ${qty(l.approved)} ${esc(m.unit)}. Tồn hiện tại: ${qty(stock(m))} ${esc(m.unit)}. Xuất vượt duyệt cần lý do ngoại lệ.</p>`+fld('Ngày xuất *','date',today(),'date',`required min="${r.date}"`)+fld('Số lượng xuất *','qty',Math.max(0,round2(l.approved-netLine(l)))||1,'number','required min="0.01" step="0.01"')+fld('Chứng từ','doc','','text','maxlength="100"')+fld('Người xuất','issuedBy','','text','maxlength="100"')+fld('Người nhận','receivedBy','','text','maxlength="100"')+area('Lý do ngoại lệ nếu vượt duyệt','override','')}
 else if(kind==='return'){let i=issue(id),l=line(i.lineId),m=material(l.materialId);t='Trả lại '+m.code;f=`<p class="full note">Còn có thể trả ${qty(i.qty-returned(i.id))} ${esc(m.unit)} từ lượt xuất ${fmt(i.date)}; giá ghi nhận ${money(i.price)}.</p>`+fld('Ngày trả *','date',today(),'date',`required min="${i.date}"`)+fld('Số lượng trả *','qty',i.qty-returned(i.id),'number',`required min="0.01" max="${i.qty-returned(i.id)}" step="0.01"`)+fld('Người trả','actor','','text','maxlength="100"')+area('Lý do trả *','reason','')}
 else if(kind==='adjustment'){let m=material(id);t='Điều chỉnh tồn '+m.code;f=fld('Ngày *','date',today(),'date','required')+fld('Thay đổi tồn (+/−) *','delta',0,'number','required step="0.01"')+fld('Người thực hiện','actor','','text','maxlength="100"')+area('Lý do *','reason','')}
 $('#modalTitle').textContent=t;$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function formValue(form,name){return String(new FormData(form).get(name)||'').trim()}
function formNum(form,name){return Number(formValue(form,name))}
function handleForm(e){e.preventDefault();let form=e.target,{kind,id}=draft,err='',before=clone(db);try{if(kind==='material'){let m=material(id),code=formValue(form,'code'),price=formNum(form,'price'),opening=formNum(form,'opening');if(!code||!formValue(form,'name')||!formValue(form,'unit')||!Number.isSafeInteger(price)||price<0||!Number.isFinite(opening)||opening<0)throw Error('Kiểm tra mã, tên, đơn vị, giá và tồn đầu.');if(db.materials.some(x=>x.id!==id&&x.code.toUpperCase()===code.toUpperCase()))throw Error('Mã vật tư đã có.');if(m){Object.assign(m,{code,name:formValue(form,'name'),unit:formValue(form,'unit'),price,note:formValue(form,'note')})}else{m={id:uid(),code,name:formValue(form,'name'),unit:formValue(form,'unit'),price,opening,note:formValue(form,'note')};db.materials.push(m)}audit(id?'Sửa vật tư':'Thêm vật tư',m.code,'',m.id);page='material';activeMaterial=m.id}
 else if(kind==='request'){let r=request(id),number=formValue(form,'number'),date=formValue(form,'date');if(!dateOK(date)||!number)throw Error('Cần ngày và số phiếu hợp lệ.');if(db.requests.some(x=>x.id!==id&&x.number.toUpperCase()===number.toUpperCase()))throw Error('Số phiếu đã có.');let obj={date,number,productionOrder:formValue(form,'productionOrder'),team:formValue(form,'team'),requester:formValue(form,'requester'),note:formValue(form,'note')};if(r){Object.assign(r,obj)}else{r={id:uid(),...obj,state:'Chờ duyệt',approvedBy:''};db.requests.push(r)}audit(id?'Sửa phiếu':'Lập phiếu',r.number,r.id);selected=r.id;page='request'}
 else if(kind==='line'){let l=line(id),rid=l?.requestId||selected,r=request(rid),materialId=formValue(form,'materialId'),requested=formNum(form,'requested');if(!material(materialId)||!Number.isFinite(requested)||requested<=0)throw Error('Chọn vật tư và số lượng hợp lệ.');if(db.lines.some(x=>x.id!==id&&x.requestId===rid&&x.materialId===materialId))throw Error('Vật tư đã có trong phiếu; hãy sửa dòng hiện có.');if(l){Object.assign(l,{materialId,requested,approved:0,note:formValue(form,'note')})}else{l={id:uid(),requestId:rid,materialId,requested,approved:0,sourceActual:null,note:formValue(form,'note')};db.lines.push(l)}audit(id?'Sửa dòng':'Thêm dòng',material(materialId).code,rid,materialId);selected=rid;page='request'}
 else if(kind==='approval'){let r=request(id),ll=linesFor(id);if(!ll.length)throw Error('Thêm vật tư trước khi duyệt.');let who=formValue(form,'approvedBy');if(!who)throw Error('Cần tên người duyệt.');for(let l of ll){let n=formNum(form,'approved_'+l.id);if(!Number.isFinite(n)||n<0||n>l.requested)throw Error('Số duyệt phải từ 0 đến lượng yêu cầu.');l.approved=n}if(!ll.some(l=>l.approved>0))throw Error('Cần duyệt ít nhất một vật tư.');r.approvedBy=who;r.state='Đã duyệt';audit('Duyệt phiếu',formValue(form,'reason')||who,id);selected=id;page='request'}
 else if(kind==='issue'){let l=line(id),r=request(l.requestId),m=material(l.materialId),n=formNum(form,'qty'),date=formValue(form,'date'),over=formValue(form,'override');if(!dateOK(date)||date<r.date||!Number.isFinite(n)||n<=0)throw Error('Ngày hoặc lượng xuất không hợp lệ.');if(n>stock(m)+0.001)throw Error('Tồn không đủ; cần điều chỉnh tồn bằng chứng từ trước.');if(issuesFor(id).reduce((a,i)=>a+i.qty,0)+n>l.approved+0.001&&!over)throw Error('Xuất vượt số duyệt: cần ghi lý do ngoại lệ.');db.issues.push({id:uid(),lineId:id,date,qty:n,price:m.price,doc:formValue(form,'doc'),issuedBy:formValue(form,'issuedBy'),receivedBy:formValue(form,'receivedBy'),override:over});refreshState(r);audit('Xuất vật tư',`${m.code}: ${qty(n)} ${m.unit}${over?' · '+over:''}`,r.id,m.id);selected=r.id;page='request'}
 else if(kind==='return'){let i=issue(id),l=line(i.lineId),r=request(l.requestId),n=formNum(form,'qty'),date=formValue(form,'date'),reason=formValue(form,'reason');if(!dateOK(date)||date<i.date||!Number.isFinite(n)||n<=0||n>i.qty-returned(id)+.001||!reason)throw Error('Kiểm tra ngày, số lượng và lý do trả.');db.returns.push({id:uid(),issueId:id,date,qty:n,reason,actor:formValue(form,'actor')});refreshState(r);audit('Trả vật tư',`${material(l.materialId).code}: ${qty(n)} · ${reason}`,r.id,l.materialId);selected=r.id;page='request'}
 else if(kind==='adjustment'){let m=material(id),delta=formNum(form,'delta'),date=formValue(form,'date'),reason=formValue(form,'reason');if(!dateOK(date)||!Number.isFinite(delta)||delta===0||!reason)throw Error('Cần ngày, chênh lệch và lý do.');if(stock(m)+delta<-.001)throw Error('Điều chỉnh làm tồn âm.');db.adjustments.push({id:uid(),materialId:id,date,delta,reason,actor:formValue(form,'actor')});audit('Điều chỉnh tồn',`${qty(delta)} ${m.unit}: ${reason}`,'',id);activeMaterial=id;page='material'}
 let v=validate(db);if(v)throw Error(v);$('#editor').close();draft=null;save()}catch(ex){db=before;err=ex.message;$('#formError').textContent=err}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'phieu-xuat-vat-tu-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'phieu-xuat-vat-tu-kem-du-lieu.html')}
function sheets(){return [{name:'VatTu',rows:[['Mã','Tên','Đơn vị','Giá hiện tại','Tồn đầu','Tồn hiện tại','Xuất ròng','Giá trị xuất'],...db.materials.map(m=>[m.code,m.name,m.unit,m.price,m.opening,stock(m),materialStats(m).issued,materialStats(m).value])]},{name:'PhieuYeuCau',rows:[['Số phiếu','Ngày','Lệnh SX','Tổ nhận','Người yêu cầu','Trạng thái','Người duyệt','Ghi chú'],...db.requests.map(r=>[r.number,r.date,r.productionOrder,r.team,r.requester,r.state,r.approvedBy,r.note])]},{name:'DongVatTu',rows:[['Số phiếu','Mã vật tư','Yêu cầu','Được duyệt','Xuất ròng','Chênh lệch','Giá trị','Số mẫu gốc','Ghi chú'],...db.lines.map(l=>[request(l.requestId).number,material(l.materialId).code,l.requested,l.approved,netLine(l),round2(netLine(l)-l.requested),valueLine(l),l.sourceActual??'',l.note])]},{name:'LuotXuat',rows:[['Số phiếu','Vật tư','Ngày xuất','Số lượng','Đã trả','Đơn giá chụp','Giá trị còn lại','Chứng từ','Người xuất','Người nhận','Ngoại lệ'],...db.issues.map(i=>{let l=line(i.lineId);return [request(l.requestId).number,material(l.materialId).code,i.date,i.qty,returned(i.id),i.price,Math.round((i.qty-returned(i.id))*i.price),i.doc,i.issuedBy,i.receivedBy,i.override]})]},{name:'TraVatTu',rows:[['Số phiếu','Vật tư','Ngày trả','Số lượng','Đơn giá chụp','Lý do','Người trả'],...db.returns.map(t=>{let i=issue(t.issueId),l=line(i.lineId);return [request(l.requestId).number,material(l.materialId).code,t.date,t.qty,i.price,t.reason,t.actor]})]},{name:'DieuChinh',rows:[['Mã vật tư','Ngày','Thay đổi','Lý do','Người thực hiện'],...db.adjustments.map(a=>[material(a.materialId).code,a.date,a.delta,a.reason,a.actor])]},{name:'NhatKy',rows:[['Thời điểm','Thao tác','Lý do','Số phiếu','Mã vật tư'],...db.audit.map(a=>[a.at,a.action,a.reason,request(a.requestId)?.number||'',material(a.materialId)?.code||''])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Số ngày chờ duyệt'],[db.settings.asof,db.settings.reviewDays]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'phieu-xuat-vat-tu-bao-cao.xlsx')}
function sampleData(){let x=empty(),offset=s=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};for(let row of MATERIAL_ISSUE_SAMPLE.vt){x.materials.push({id:uid(),code:row[0],name:row[1],unit:row[2],price:row[3],opening:row[4],note:'Dữ liệu mẫu tham chiếu'})}for(let row of MATERIAL_ISSUE_SAMPLE.px){let [date,number,productionOrder,team,code,requested,sourceActual,state]=row,m=x.materials.find(m=>m.code===code),r={id:uid(),date:offset(date),number,productionOrder,team,requester:'Mẫu tham chiếu',approvedBy:state==='Chờ duyệt'?'':'Mẫu tham chiếu',note:'Nhập từ file tham chiếu',state},l={id:uid(),requestId:r.id,materialId:m.id,requested,approved:state==='Chờ duyệt'?0:requested,sourceActual,note:'Số thực xuất gốc lưu tham chiếu; chỉ phiếu Đã xuất mới có chứng từ xuất.'};x.requests.push(r);x.lines.push(l);if(state==='Đã xuất')x.issues.push({id:uid(),lineId:l.id,date:r.date,qty:sourceActual,price:m.price,doc:'MẪU-'+number,issuedBy:'Mẫu tham chiếu',receivedBy:team,override:sourceActual>requested?'Dữ liệu mẫu gốc xuất vượt yêu cầu; cần đối chiếu chứng từ thực tế.':''})}return x}
function act(action,id){if(['home','requests','materials','reports','settings','data','guide'].includes(action)){page=action;render();return}if(action==='openRequest'){selected=id;page='request';render();return}if(action==='openMaterial'){activeMaterial=id;page='material';render();return}if(action==='newMaterial'||action==='editMaterial')return showForm('material',action==='editMaterial'?id:'');if(action==='newRequest'||action==='editRequest')return showForm('request',action==='editRequest'?id:'');if(action==='newLine'||action==='editLine'){if(!db.materials.length)return alert('Hãy thêm vật tư trước.');if(action==='newLine')selected=id;return showForm('line',action==='editLine'?id:'')}if(action==='approveRequest')return showForm('approval',id);if(action==='newIssue')return showForm('issue',id);if(action==='newReturn')return showForm('return',id);if(action==='newAdjustment')return showForm('adjustment',id);
 if(action==='rejectRequest'){let reason=prompt('Lý do từ chối phiếu:');if(!reason?.trim())return;let r=request(id);r.state='Từ chối';audit('Từ chối phiếu',reason.trim(),id);save();return}if(action==='reopenRequest'){let r=request(id);if(linesFor(id).some(l=>issuesFor(l.id).length))return alert('Phiếu đã từng xuất không thể mở lại.');if(!confirm('Mở lại phiếu để chỉnh sửa?'))return;r.state='Chờ duyệt';r.approvedBy='';for(let l of linesFor(id))l.approved=0;audit('Mở lại phiếu','Chỉnh sửa yêu cầu',id);save();return}if(action==='print')return print();
 if(action==='saveSettings'){let form=$('#settingsForm'),asof=form.elements.asof.value,reviewDays=Number(form.elements.reviewDays.value);if(!dateOK(asof)||!Number.isInteger(reviewDays)||reviewDays<0||reviewDays>365)return alert('Cài đặt không hợp lệ.');db.settings={asof,reviewDays};save();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if(db.requests.length||db.materials.length)if(!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện có. Hãy sao lưu trước. Tiếp tục?'))return;let x=sampleData(),v=validate(x);if(v)return alert('Mẫu không hợp lệ: '+v);db=x;page='home';save();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên trình duyệt này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='home';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',handleForm);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),v=validate(x);if(v)throw Error(v);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện có. Tiếp tục?'))return;db=x;page='home';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{if(e.target.id==='requestFilter'){filter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}});render();
