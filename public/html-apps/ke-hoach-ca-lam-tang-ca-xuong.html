function overtime(s){return s.type==='Ngày thường'?Math.max(0,s.hours-s.standard):s.hours}
function monthStats(wid,m){let a=db.shifts.filter(s=>s.workerId===wid&&month(s.date)===m&&s.state!=='Hủy');return {hours:a.reduce((n,s)=>n+s.hours,0),ot:a.reduce((n,s)=>n+overtime(s),0),count:a.length}}
function allStats(wid){let a=db.shifts.filter(s=>s.workerId===wid&&s.state!=='Hủy');return {hours:a.reduce((n,s)=>n+s.hours,0),ot:a.reduce((n,s)=>n+overtime(s),0),count:a.length}}
function summary(){let a=db.shifts.filter(s=>s.state!=='Hủy'),ot=a.reduce((n,s)=>n+overtime(s),0),hours=a.reduce((n,s)=>n+s.hours,0),warn=a.filter(s=>s.hours>s.maxHours).length;return {workers:db.workers.length,shifts:a.length,hours,ot,high:warn,monthOver:db.workers.filter(w=>monthStats(w.id,filterMonth).ot>db.settings.otThang).length}}
function workerWarnings(w,m){let v=monthStats(w.id,m),a=[];if(v.ot>db.settings.otThang)a.push('Vượt ngưỡng tăng ca nội bộ');else if(db.settings.otThang-v.ot<=db.settings.sapHet)a.push('Sắp chạm ngưỡng tăng ca');return a}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!validDate(x.settings.asof)||!Array.isArray(x.workers)||!Array.isArray(x.shifts)||!Array.isArray(x.audit))return 'Cấu trúc dữ liệu không hợp lệ';for(let k of ['chuan','otThang','sapHet','gioMax'])if(!Number.isFinite(x.settings[k])||x.settings[k]<0||x.settings[k]>1000)return 'Ngưỡng không hợp lệ';let wi=new Set(),codes=new Set();for(let w of x.workers){if(!w.id||wi.has(w.id)||!w.code||codes.has(w.code.toUpperCase())||!w.name||String(w.note||'').length>1000)return 'Công nhân thiếu hoặc trùng thông tin';wi.add(w.id);codes.add(w.code.toUpperCase())}let si=new Set(),combos=new Set();for(let s of x.shifts){let combo=s.workerId+'|'+s.date+'|'+s.slot;if(!s.id||si.has(s.id)||!wi.has(s.workerId)||!validDate(s.date)||!['Ca sáng','Ca chiều','Ca đêm'].includes(s.slot)||!['Ngày thường','Ngày nghỉ hằng tuần','Ngày lễ'].includes(s.type)||!['Kế hoạch','Đã làm','Hủy'].includes(s.state)||!Number.isFinite(s.hours)||s.hours<=0||s.hours>24||!Number.isFinite(s.standard)||s.standard<0||s.standard>24||!Number.isFinite(s.maxHours)||s.maxHours<=0||s.maxHours>24||combos.has(combo)||String(s.note||'').length>1000)return 'Ca làm thiếu, sai hoặc trùng thông tin';si.add(s.id);combos.add(combo)}for(let a of x.audit)if(!a.id||!a.at||!a.action)return 'Nhật ký không hợp lệ';return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function embedded(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=embedded(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let v=validate(db);if(v){alert(v);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ không lưu được. Hãy tải bản sao JSON hoặc HTML kèm dữ liệu.')}render();return true}
function log(action,detail,ref=''){db.audit.push({id:id(),at:new Date().toISOString(),action,detail,ref})}
function btn(text,action,cls='',key=''){return `<button type="button" class="btn ${cls}" data-act="${action}" ${key?`data-id="${E(key)}"`:''}>${text}</button>`}
function box(title,body){return `<section class="box"><h2>${title}</h2>${body}</section>`}
function chip(state){return `<span class="chip ${state==='Đã làm'?'done':state==='Hủy'?'cancel':'plan'}">${E(state)}</span>`}
function mastView(){let s=summary();return `<div class="mast"><div><small>AI MỞ / ĐIỀU PHỐI NHÂN SỰ XƯỞNG</small><h1>Kế hoạch ca làm & tăng ca</h1><p>Chọn một tuần, phân ca nhanh và thấy ngay ai đang gần ngưỡng giờ thêm.</p></div><div class="mast-action">${btn('＋ Xếp ca','newShift','primary')}${btn('＋ Thêm công nhân','newWorker')}</div></div><div class="quick"><div><b>${s.workers}</b><span>công nhân</span></div><div><b>${s.shifts}</b><span>ca đã ghi</span></div><div><b>${q(s.hours)}</b><span>giờ làm</span></div><div><b>${q(s.ot)}</b><span>giờ thêm*</span></div><div><b>${s.high}</b><span>ca vượt ngưỡng ngày</span></div></div>`}
function roster(){let days=Array.from({length:7},(_,i)=>plus(weekStart,i)),rows=db.workers;return `${mastView()}<div class="roster-head"><div><h2>🗓️ Bảng phân ca tuần</h2><p>${fdate(days[0])} – ${fdate(days[6])} · Nhấn vào một ô để xếp ca.</p></div><div class="tools">${btn('‹ Tuần trước','prevWeek')}${btn('Tuần này','thisWeek')}${btn('Tuần sau ›','nextWeek')}</div></div><div class="roster-scroll"><div class="roster-grid"><div class="grid-h corner">Công nhân</div>${days.map(d=>`<div class="grid-h">${['CN','T2','T3','T4','T5','T6','T7'][new Date(d+'T12:00:00').getDay()]}<small>${fdate(d).slice(0,5)}</small></div>`).join('')}${rows.flatMap(w=>[`<div class="worker-cell"><button class="link" data-act="openWorker" data-id="${E(w.id)}">${E(w.name)}</button><small>${E(w.code)}</small><span class="worker-ot">${q(monthStats(w.id,month(days[0])).ot)}h OT trong tháng</span></div>`,...days.map(d=>{let a=db.shifts.filter(s=>s.workerId===w.id&&s.date===d&&s.state!=='Hủy');return `<div class="day-cell">${a.map(s=>`<button class="shift-tile ${s.state==='Đã làm'?'done':''}" data-act="openShift" data-id="${E(s.id)}"><b>${E(s.slot.replace('Ca ',''))}</b><small>${q(s.hours)}h · +${q(overtime(s))}h OT</small></button>`).join('')}<button class="add-cell" data-act="newShiftAt" data-id="${E(w.id+'|'+d)}" aria-label="Xếp ca ${E(w.name)} ngày ${E(d)}">＋</button></div>`})]).join('')||'<div class="empty-grid">Chưa có công nhân. Hãy thêm công nhân hoặc nạp mẫu.</div>'}</div></div>${mobileAgenda(days)}<div class="under-roster">${box('📌 Cần chú ý trong tháng',db.workers.filter(w=>workerWarnings(w,filterMonth).length).map(w=>`<div class="attention"><button class="link" data-act="openWorker" data-id="${E(w.id)}">${E(w.name)}</button><span>${E(workerWarnings(w,filterMonth).join(', '))} · ${q(monthStats(w.id,filterMonth).ot)}h</span></div>`).join('')||'<p>Không có công nhân chạm ngưỡng trong tháng đang chọn.</p>')}${box('🔎 Cách tính',`<p>Ngày thường: giờ thêm = max(0, giờ làm − giờ chuẩn ${q(db.settings.chuan)}h). Ngày nghỉ và ngày lễ: toàn bộ giờ ghi nhận tính là giờ thêm.</p><p>* Tổng giờ của mọi ca được chọn; báo cáo tháng tách theo tháng. Ngưỡng chỉ là cài đặt nội bộ.</p>`)}</div>`}
function shiftsPage(){let a=db.shifts.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-head"><div><h1>📋 Sổ ca làm</h1><p>Chi tiết từng ca, trạng thái và số giờ làm thêm theo đúng dữ liệu nguồn.</p></div>${btn('＋ Xếp ca','newShift','primary')}</div>${box('Danh sách ca',`<div class="filters"><label>Tháng <input id="monthFilter" type="month" value="${E(filterMonth)}"></label><label>Công nhân <select id="workerFilter"><option value="">Tất cả</option>${db.workers.map(w=>`<option value="${E(w.id)}">${E(w.name)}</option>`).join('')}</select></label></div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Công nhân</th><th>Ca</th><th>Loại ngày</th><th>Giờ làm</th><th>Giờ thêm</th><th>Trạng thái</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${a.map(s=>`<tr data-worker="${E(s.workerId)}" data-month="${E(month(s.date))}"><td>${fdate(s.date)}</td><td>${E(worker(s.workerId).name)}</td><td>${E(s.slot)}</td><td>${E(s.type)}</td><td>${q(s.hours)}</td><td><b>${q(overtime(s))}</b></td><td>${chip(s.state)}</td><td>${s.hours>s.maxHours?'Giờ trong ngày vượt ngưỡng':'—'}</td><td>${btn('Xem','openShift','small',s.id)}</td></tr>`).join('')||'<tr><td colspan="9">Chưa có ca làm.</td></tr>'}</tbody></table></div>`)}`}
function workersPage(){return `<div class="page-head"><div><h1>👥 Công nhân</h1><p>Theo dõi giờ làm và phần còn lại của ngưỡng tháng.</p></div>${btn('＋ Thêm công nhân','newWorker','primary')}</div><div class="worker-cards">${db.workers.map(w=>{let st=monthStats(w.id,filterMonth),left=db.settings.otThang-st.ot;return `<article class="worker-card"><small>${E(w.code)}</small><h2>${E(w.name)}</h2><p>${q(st.hours)}h làm · ${q(st.ot)}h làm thêm</p><div class="bar"><i style="width:${Math.min(100,100*st.ot/Math.max(1,db.settings.otThang))}%"></i></div><p class="${left<0?'bad':'muted'}">${left<0?'Vượt '+q(-left):'Còn '+q(left)}h theo ngưỡng tháng</p>${btn('Xem hồ sơ','openWorker','small',w.id)}</article>`}).join('')||'<p>Chưa có công nhân.</p>'}</div>`}
function workerDetail(){let w=worker(selected);if(!w)return workersPage();let a=db.shifts.filter(s=>s.workerId===w.id).sort((a,b)=>b.date.localeCompare(a.date)),st=monthStats(w.id,filterMonth);return `<div class="page-head"><div><button class="link" data-act="workers">← Công nhân</button><h1>👤 ${E(w.name)}</h1><p>${E(w.code)} · ${E(w.note||'')}</p></div>${btn('Sửa hồ sơ','editWorker','',w.id)}</div><div class="quick"><div><b>${a.length}</b><span>ca ghi nhận</span></div><div><b>${q(st.hours)}</b><span>giờ trong ${E(filterMonth)}</span></div><div><b>${q(st.ot)}</b><span>giờ thêm tháng</span></div><div><b>${q(db.settings.otThang-st.ot)}</b><span>còn theo ngưỡng</span></div></div>${box('Các ca của công nhân',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Ca</th><th>Loại</th><th>Giờ</th><th>OT</th><th>Tình trạng</th><th></th></tr></thead><tbody>${a.map(s=>`<tr><td>${fdate(s.date)}</td><td>${E(s.slot)}</td><td>${E(s.type)}</td><td>${q(s.hours)}</td><td>${q(overtime(s))}</td><td>${chip(s.state)}</td><td>${btn('Xem','openShift','small',s.id)}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có ca.</td></tr>'}</tbody></table></div>`)}`}
function shiftDetail(){let s=shift(selected);if(!s)return shiftsPage();let w=worker(s.workerId);return `<div class="page-head"><div><button class="link" data-act="shifts">← Sổ ca</button><h1>🕒 ${E(s.slot)} · ${fdate(s.date)}</h1><p>${E(w.name)} · ${chip(s.state)}</p></div><div class="tools">${s.state!=='Hủy'?btn('Sửa ca','editShift','',s.id):''}${s.state==='Kế hoạch'?btn('Xác nhận đã làm','completeShift','primary',s.id):''}${s.state!=='Hủy'?btn('Hủy ca','cancelShift','danger',s.id):''}${btn('🖨️ In','print')}</div></div><div class="detail-sheet"><div><small>Giờ làm</small><strong>${q(s.hours)}h</strong></div><div><small>Giờ chuẩn chụp</small><strong>${q(s.standard)}h</strong></div><div><small>Giờ làm thêm</small><strong>${q(overtime(s))}h</strong></div><div><small>Loại ngày</small><strong>${E(s.type)}</strong></div></div>${box('Thông tin ca',`<dl><dt>Công nhân</dt><dd>${E(w.name)} (${E(w.code)})</dd><dt>Ghi chú</dt><dd>${E(s.note||'—')}</dd><dt>Ngày ghi</dt><dd>${fdate(s.date)}</dd><dt>Cảnh báo</dt><dd>${s.hours>s.maxHours?'Số giờ vượt ngưỡng ngày nội bộ':'Không'}</dd></dl>`)}${box('Nhật ký',db.audit.filter(a=>a.ref===s.id).slice().reverse().map(a=>`<p class="audit"><b>${E(a.action)}</b> · ${E(a.at.slice(0,16).replace('T',' '))}<br>${E(a.detail||'')}</p>`).join('')||'<p>Chưa có thay đổi.</p>')}`}
function reports(){let months=[...new Set(db.shifts.map(s=>month(s.date)))].sort().reverse();return `<div class="page-head"><div><h1>📊 Báo cáo ca & giờ thêm</h1><p>So sánh theo tháng; không cộng giới hạn qua nhiều tháng.</p></div>${btn('⬇ Xuất Excel','exportExcel','primary')}</div>${box('Chọn tháng',`<label class="inline-label">Tháng báo cáo <input id="reportMonth" type="month" value="${E(filterMonth)}"></label>`)}<div class="report-grid">${box('Theo công nhân',`<div class="table-wrap"><table><thead><tr><th>Người</th><th>Ca</th><th>Giờ làm</th><th>Giờ thêm</th><th>Còn theo ngưỡng</th><th>Cảnh báo</th></tr></thead><tbody>${db.workers.map(w=>{let s=monthStats(w.id,filterMonth);return `<tr><td>${E(w.name)}</td><td>${s.count}</td><td>${q(s.hours)}</td><td>${q(s.ot)}</td><td>${q(db.settings.otThang-s.ot)}</td><td>${E(workerWarnings(w,filterMonth).join('; ')||'—')}</td></tr>`}).join('')}</tbody></table></div>`)}${box('Phân bố loại ngày',`<div class="report-bars">${['Ngày thường','Ngày nghỉ hằng tuần','Ngày lễ'].map(t=>{let a=db.shifts.filter(s=>month(s.date)===filterMonth&&s.type===t&&s.state!=='Hủy'),h=a.reduce((n,s)=>n+s.hours,0);return `<div><span>${E(t)}</span><b>${q(h)}h</b><i style="width:${Math.min(100,h*100/Math.max(1,db.shifts.filter(s=>month(s.date)===filterMonth).reduce((n,s)=>n+s.hours,0)))}%"></i></div>`}).join('')}</div>`)}</div><p class="note">Ngưỡng mặc định 40h là cài đặt nội bộ trong file tham chiếu, không phải kết luận về tuân thủ pháp luật.</p>`}
function settings(){return `<div class="page-head"><h1>⚙️ Ngưỡng nội bộ</h1></div>${box('Thông số tính',`<form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input name="asof" type="date" required value="${E(db.settings.asof)}"></label><label>Giờ chuẩn ngày thường<input name="chuan" type="number" min="0" max="24" step="0.5" value="${db.settings.chuan}"></label><label>Ngưỡng OT theo tháng<input name="otThang" type="number" min="0" max="1000" step="0.5" value="${db.settings.otThang}"></label><label>Nhắc khi còn (giờ)<input name="sapHet" type="number" min="0" max="1000" step="0.5" value="${db.settings.sapHet}"></label><label>Cảnh báo quá giờ ngày<input name="gioMax" type="number" min="0.5" max="24" step="0.5" value="${db.settings.gioMax}"></label><div class="full">${btn('Lưu ngưỡng','saveSettings','primary')}</div></form><p class="note">Giờ chuẩn và giới hạn ngày được chụp khi lập ca, nên đổi cài đặt không viết lại lịch sử. Ngưỡng tổng tháng được tính trên ca hiện có.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div><div class="report-grid">${box('Tải bản sao',`<p>Để chuyển máy, hãy dùng JSON hoặc HTML kèm dữ liệu. File HTML gốc không chứa tiến độ trong bộ nhớ trình duyệt.</p><div class="tools">${btn('JSON đầy đủ','exportJSON','primary')}${btn('HTML kèm dữ liệu','exportHTML')}${btn('Excel đối chiếu','exportExcel')}</div>`)}${box('Nhập & dữ liệu mẫu',`<p>Nhập JSON hoặc nạp mẫu sẽ thay dữ liệu hiện tại.</p><div class="tools">${btn('Nhập JSON','importJSON')}${btn('Nạp mẫu 8 người · 20 ca','loadSample')}${btn('Xóa hết','clearData','danger')}</div>`)}</div><p class="note">Dữ liệu hiện tại: ${db.workers.length} công nhân · ${db.shifts.length} ca · phiên bản ${VERSION}. App không cần API, mạng hay tài khoản.</p>`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${box('Quy trình',`<ol><li>Thêm công nhân hoặc nạp mẫu.</li><li>Mở lịch tuần; nhấn dấu ＋ tại giao điểm người và ngày để xếp ca.</li><li>Chọn ca sáng/chiều/đêm, loại ngày, số giờ và tình trạng Kế hoạch hay Đã làm.</li><li>Sau ca, xác nhận đã làm hoặc sửa giờ. Hủy ca có ghi lý do; ca hủy không tính tổng.</li><li>Xem ngưỡng OT theo từng tháng, kiểm tra số giờ ngày, xuất báo cáo và sao lưu.</li></ol>`)}${box('Cách tính & phạm vi',`<p>Ngày thường: OT = max(0, giờ làm − giờ chuẩn chụp của ca). Ngày nghỉ và lễ: OT = toàn bộ giờ ca. App dùng ngưỡng tháng để nhắc nội bộ, chưa xét các điều kiện pháp lý, giới hạn năm, sự đồng ý, phân ca thực tế hay lương làm thêm.</p><p>File nguồn cộng mọi ca khi tính tổng giờ của mỗi công nhân. App bổ sung báo cáo theo từng tháng để không dùng tổng nhiều tháng làm kết luận về giới hạn một tháng.</p>`)}`}
function render(){const views={roster,shifts:shiftsPage,workers:workersPage,worker:workerDetail,shift:shiftDetail,reports,settings,data:dataPage,guide};$('#screen').innerHTML=(views[page]||roster)();document.querySelectorAll('[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page||page==='worker'&&n.dataset.page==='workers'||page==='shift'&&n.dataset.page==='shifts'));if(page==='shifts')applyShiftFilters()}
function applyShiftFilters(){let m=$('#monthFilter')?.value||filterMonth,w=$('#workerFilter')?.value||'';document.querySelectorAll('tr[data-month]').forEach(r=>r.hidden=(m&&r.dataset.month!==m)||(w&&r.dataset.worker!==w))}
function field(label,name,value='',type='text',attrs=''){return `<label>${label}<input name="${name}" type="${type}" value="${E(value)}" ${attrs}></label>`}
function sel(label,name,values,current){return `<label>${label}<select name="${name}" required>${values.map(([v,t])=>`<option value="${E(v)}" ${v===current?'selected':''}>${E(t)}</option>`).join('')}</select></label>`}
function textArea(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1000">${E(value)}</textarea></label>`}
function form(kind,key='',pref={}){let title='',html='';draft={kind,key};if(kind==='worker'){let w=worker(key)||{};title=key?'Sửa công nhân':'Thêm công nhân';html=field('Mã công nhân *','code',w.code||'','text','required maxlength="30"')+field('Họ và tên *','name',w.name||'','text','required maxlength="120"')+textArea('Ghi chú','note',w.note)}
 else if(kind==='shift'){if(!db.workers.length)return alert('Hãy thêm công nhân trước.');let s=shift(key)||{};title=key?'Sửa ca làm':'Xếp ca làm';html=sel('Công nhân *','workerId',db.workers.map(w=>[w.id,`${w.code} · ${w.name}`]),s.workerId||pref.workerId||db.workers[0].id)+field('Ngày *','date',s.date||pref.date||today(),'date','required')+sel('Ca *','slot',['Ca sáng','Ca chiều','Ca đêm'].map(x=>[x,x]),s.slot||'Ca sáng')+sel('Loại ngày *','type',['Ngày thường','Ngày nghỉ hằng tuần','Ngày lễ'].map(x=>[x,x]),s.type||'Ngày thường')+field('Số giờ làm *','hours',s.hours??8,'number','required min="0.5" max="24" step="0.5"')+sel('Tình trạng *','state',['Kế hoạch','Đã làm','Hủy'].map(x=>[x,x]),s.state||'Kế hoạch')+textArea('Ghi chú','note',s.note)}
 $('#modalTitle').textContent=title;$('#formFields').innerHTML=html;$('#formError').textContent='';$('#editor').showModal()}
function value(fd,name){return String(fd.get(name)||'').trim()}
function submit(e){e.preventDefault();let before=copy(db),fd=new FormData(e.target),{kind,key}=draft;try{if(kind==='worker'){let code=value(fd,'code'),name=value(fd,'name'),note=value(fd,'note');if(!code||!name||db.workers.some(w=>w.id!==key&&w.code.toUpperCase()===code.toUpperCase()))throw Error('Cần mã/tên công nhân hợp lệ và không trùng mã.');if(key){let w=worker(key);Object.assign(w,{code,name,note});log('Sửa công nhân',code,key);selected=key;page='worker'}else{let w={id:id(),code,name,note};db.workers.push(w);log('Thêm công nhân',code,w.id);selected=w.id;page='worker'}}
 else if(kind==='shift'){let workerId=value(fd,'workerId'),date=value(fd,'date'),slot=value(fd,'slot'),type=value(fd,'type'),hours=Number(value(fd,'hours')),state=value(fd,'state'),note=value(fd,'note');if(!worker(workerId)||!validDate(date)||!Number.isFinite(hours)||hours<=0||hours>24)throw Error('Cần công nhân, ngày và giờ hợp lệ.');if(db.shifts.some(s=>s.id!==key&&s.workerId===workerId&&s.date===date&&s.slot===slot))throw Error('Công nhân đã có ca này trong ngày.');let obj={workerId,date,slot,type,hours,state,note};if(key){let s=shift(key);Object.assign(s,obj);log('Sửa ca',`${fdate(date)} · ${slot} · ${q(hours)}h`,key);selected=key;page='shift'}else{let s={id:id(),...obj,standard:db.settings.chuan,maxHours:db.settings.gioMax};db.shifts.push(s);log('Xếp ca',`${fdate(date)} · ${slot} · ${q(hours)}h`,s.id);selected=s.id;page='shift'}}
 let v=validate(db);if(v)throw Error(v);$('#editor').close();save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'ke-hoach-ca-lam-du-lieu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'ke-hoach-ca-lam-kem-du-lieu.html')}
function sheets(){return [{name:'CongNhan',rows:[['Mã','Họ tên','Ghi chú'],...db.workers.map(w=>[w.code,w.name,w.note])]},{name:'CaLam',rows:[['Ngày','Mã NV','Ca','Loại ngày','Giờ làm','Giờ chuẩn chụp','Giờ OT','Ngưỡng ngày chụp','Tình trạng','Ghi chú'],...db.shifts.map(s=>[s.date,worker(s.workerId).code,s.slot,s.type,s.hours,s.standard,overtime(s),s.maxHours,s.state,s.note])]},{name:'TheoThang',rows:[['Tháng','Mã NV','Họ tên','Số ca','Giờ làm','Giờ OT','Còn theo ngưỡng'],...[...new Set(db.shifts.map(s=>month(s.date)))].flatMap(m=>db.workers.map(w=>{let x=monthStats(w.id,m);return [m,w.code,w.name,x.count,x.hours,x.ot,db.settings.otThang-x.ot]}))]},{name:'NhatKy',rows:[['Thời điểm','Thao tác','Nội dung','Mã tham chiếu'],...db.audit.map(a=>[a.at,a.action,a.detail,a.ref])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Giờ chuẩn','Ngưỡng OT tháng','Nhắc còn','Ngưỡng giờ ngày'],[db.settings.asof,db.settings.chuan,db.settings.otThang,db.settings.sapHet,db.settings.gioMax]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'ke-hoach-ca-lam-bao-cao.xlsx')}
function sample(){let x=empty(),date=s=>plus(today(),Number(s.slice(1)));for(let [code,name] of SHIFT_SAMPLE.nv)x.workers.push({id:id(),code,name,note:'Mẫu tham chiếu'});for(let [d,code,slot,hours,type] of SHIFT_SAMPLE.ca){let w=x.workers.find(w=>w.code===code);x.shifts.push({id:id(),workerId:w.id,date:date(d),slot,hours,type,state:'Đã làm',note:'Mẫu tham chiếu',standard:8,maxHours:12})}return x}
function act(action,key){if(['roster','shifts','workers','reports','settings','data','guide'].includes(action)){page=action;render();return}if(action==='openWorker'){selected=key;page='worker';render();return}if(action==='openShift'){selected=key;page='shift';render();return}if(action==='newWorker'||action==='editWorker')return form('worker',action==='editWorker'?key:'');if(action==='newShift'||action==='editShift')return form('shift',action==='editShift'?key:'');if(action==='newShiftDate')return form('shift','',{date:key});if(action==='newShiftAt'){let [workerId,date]=key.split('|');return form('shift','',{workerId,date})}if(action==='prevWeek'||action==='nextWeek'||action==='thisWeek'){weekStart=action==='thisWeek'?Monday(today()):plus(weekStart,action==='prevWeek'?-7:7);render();return}if(action==='completeShift'){let s=shift(key);s.state='Đã làm';log('Xác nhận đã làm',`${q(s.hours)}h`,key);save();return}if(action==='cancelShift'){let reason=prompt('Lý do hủy ca:');if(!reason?.trim())return;let s=shift(key);s.state='Hủy';log('Hủy ca',reason.trim(),key);save();return}if(action==='print')return print();if(action==='saveSettings'){let f=$('#settingsForm'),asof=f.elements.asof.value,nums=Object.fromEntries(['chuan','otThang','sapHet','gioMax'].map(k=>[k,Number(f.elements[k].value)]));if(!validDate(asof)||Object.values(nums).some(x=>!Number.isFinite(x)||x<0)||nums.chuan>24||nums.gioMax>24)return alert('Kiểm tra cài đặt.');db.settings={asof,...nums};log('Đổi ngưỡng',JSON.stringify(nums));save();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if((db.workers.length||db.shifts.length)&&!confirm('Nạp mẫu sẽ thay dữ liệu hiện có. Tiếp tục?'))return;let x=sample(),err=validate(x);if(err)return alert(err);db=x;filterMonth=month(today());weekStart=Monday(today());page='roster';save();return}if(action==='clearData'){if(!confirm('Xóa dữ liệu hiện có?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='roster';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submit);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let x=JSON.parse(await file.text()),err=validate(x);if(err)throw Error(err);if(!confirm('Nhập JSON thay toàn bộ dữ liệu hiện có. Tiếp tục?'))return;db=x;page='roster';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{if(e.target.id==='monthFilter'||e.target.id==='workerFilter')applyShiftFilters();if(e.target.id==='reportMonth'){filterMonth=e.target.value;render()}});render();



</script></body></html>
