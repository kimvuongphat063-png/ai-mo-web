function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!Array.isArray(x.funds)||!Array.isArray(x.households)||!Array.isArray(x.entries)||!Array.isArray(x.audit)||!x.settings||!Number.isSafeInteger(x.settings.largeExpense)||x.settings.largeExpense<0)return 'Cấu trúc hoặc cài đặt không hợp lệ.';let ids=new Set(),codes=new Set();for(let f of x.funds){if(!f.id||ids.has(f.id)||!f.code||codes.has(f.code.toUpperCase())||!f.name||!f.className||!Number.isSafeInteger(f.opening)||f.opening<0||String(f.name).length>150||String(f.note||'').length>1200)return 'Quỹ không hợp lệ hoặc trùng mã.';ids.add(f.id);codes.add(f.code.toUpperCase())}let hids=new Set(),hc=new Set();for(let h of x.households){let pair=h.fundId+'|'+h.code.toUpperCase();if(!h.id||hids.has(h.id)||!ids.has(h.fundId)||!h.code||hc.has(pair)||!h.student||!h.parent||String(h.phone||'').length>30)return 'Hồ sơ phụ huynh không hợp lệ hoặc trùng mã trong quỹ.';hids.add(h.id);hc.add(pair)}let eids=new Set();for(let e of x.entries){if(!e.id||eids.has(e.id)||!ids.has(e.fundId)||!dateOK(e.date)||!KINDS.includes(e.kind)||!Number.isSafeInteger(e.amount)||e.amount<=0||e.amount>1000000000000||!e.description||!['Có','Chưa'].includes(e.proof)||!['Hợp lệ','Hủy'].includes(e.state)||e.state==='Hủy'&&!e.voidReason||e.householdId&&(!hids.has(e.householdId)||x.households.find(h=>h.id===e.householdId).fundId!==e.fundId)||e.kind==='Chi'&&e.householdId||String(e.description).length>1000)return 'Giao dịch không hợp lệ.';eids.add(e.id)}for(let f of x.funds){let balance=f.opening;for(let e of x.entries.filter(e=>e.fundId===f.id&&e.state==='Hợp lệ').sort((a,b)=>a.date.localeCompare(b.date)||a.at.localeCompare(b.at)||a.id.localeCompare(b.id))){balance+=e.kind==='Thu'?e.amount:-e.amount;if(balance<0)return 'Sổ quỹ âm theo thứ tự ngày giao dịch.'}}let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ đầy. Hãy tải bản sao JSON hoặc HTML.')}render();return true}
const entries=id=>db.entries.filter(e=>e.fundId===id&&active(e));
function totals(id){let f=fund(id),a=entries(id),inc=a.filter(e=>e.kind==='Thu').reduce((n,e)=>n+e.amount,0),out=a.filter(e=>e.kind==='Chi').reduce((n,e)=>n+e.amount,0);return {opening:f.opening,inc,out,balance:f.opening+inc-out,missing:a.filter(e=>e.kind==='Chi'&&e.proof==='Chưa').length,large:a.filter(e=>e.kind==='Chi'&&e.amount>=db.settings.largeExpense).length}}
function sorted(id){return entries(id).sort((a,b)=>a.date.localeCompare(b.date)||a.at.localeCompare(b.at)||a.id.localeCompare(b.id))}
function running(id,extra=null){let f=fund(id),balance=f.opening,rows=[...sorted(id)];if(extra)rows.push(extra);rows.sort((a,b)=>a.date.localeCompare(b.date)||a.at.localeCompare(b.at)||a.id.localeCompare(b.id));let min=balance;return rows.map(e=>{balance+=e.kind==='Thu'?e.amount:-e.amount;min=Math.min(min,balance);return {entry:e,balance,min}})}
function summary(){let a=db.funds.map(f=>totals(f.id));return {funds:a.length,opening:a.reduce((n,x)=>n+x.opening,0),inc:a.reduce((n,x)=>n+x.inc,0),out:a.reduce((n,x)=>n+x.out,0),balance:a.reduce((n,x)=>n+x.balance,0),missing:a.reduce((n,x)=>n+x.missing,0)}}
function warn(e){let out=[];if(e.kind==='Chi'&&e.proof==='Chưa')out.push('Thiếu chứng từ');if(e.kind==='Chi'&&e.amount>=db.settings.largeExpense)out.push('Khoản chi lớn');return out}
function btn(label,action,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${action}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Số quỹ</small><strong>${s.funds}</strong></div><div><small>Tổng thu</small><strong>${money(s.inc)}</strong></div><div><small>Tổng chi</small><strong>${money(s.out)}</strong></div><div><small>Số dư</small><strong>${money(s.balance)}</strong></div><div><small>Chi thiếu chứng từ</small><strong>${s.missing}</strong></div></div>`}
function home(){let alerts=db.entries.filter(e=>active(e)&&warn(e).length).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);return `<div class="hero"><span>💼 AI MỞ · SỔ QUỸ MINH BẠCH</span><h1>Thu chi quỹ lớp & phụ huynh</h1><p>Ghi từng khoản thu chi, đối chiếu số dư và chứng từ theo từng lớp.</p><div class="hero-actions">${btn('＋ Tạo quỹ','newFund','primary')}${btn('＋ Ghi thu / chi','newEntry')}</div></div>${metrics()}${panel('📍 Bắt đầu nhanh',`<ol><li>Tạo quỹ cho từng lớp, điền số dư đầu kỳ nếu có.</li><li>Ghi mỗi khoản thu hoặc chi một phiếu; có thể gắn khoản thu với phụ huynh.</li><li>Ghi mã chứng từ, xem số dư chạy và khoản chi cần bổ sung chứng từ.</li><li>In báo cáo công khai đã tổng hợp và sao lưu định kỳ.</li></ol><p class="muted">App chỉ ghi nhận khoản thực thu, không tự tạo nghĩa vụ đóng góp cho phụ huynh. Dữ liệu thật bắt đầu trống.</p>`)}<div class="two">${panel('📚 Các quỹ',db.funds.length?db.funds.map(f=>{let t=totals(f.id);return `<div class="mini"><button class="link" data-act="openFund" data-id="${esc(f.id)}">${esc(f.name)}</button><small>${esc(f.className)} · số dư ${money(t.balance)}</small></div>`}).join(''):'<p class="muted">Chưa có quỹ. Tạo quỹ để bắt đầu.</p>')}${panel('⚠️ Khoản chi cần chú ý',alerts.length?alerts.map(e=>`<div class="mini"><button class="link" data-act="openFund" data-id="${esc(e.fundId)}">${esc(e.description)}</button><small>${fmtDate(e.date)} · ${money(e.amount)} · ${warn(e).join(', ')}</small></div>`).join(''):'<p class="success">Chưa có khoản chi cần chú ý.</p>')}</div>`}
function fundsPage(){return `<div class="page-head"><div><h1>🏫 Danh sách quỹ lớp</h1><p>Mỗi quỹ có sổ riêng, số dư riêng và danh sách phụ huynh riêng.</p></div>${btn('＋ Tạo quỹ','newFund','primary')}</div>${panel('Các quỹ đang theo dõi',`<div class="table-wrap"><table><thead><tr><th>Quỹ</th><th>Lớp</th><th>Số dư đầu</th><th>Thu</th><th>Chi</th><th>Số dư</th><th>Thiếu chứng từ</th></tr></thead><tbody>${db.funds.map(f=>{let t=totals(f.id);return `<tr><td><button class="link" data-act="openFund" data-id="${esc(f.id)}">${esc(f.name)}</button><small>${esc(f.code)}</small></td><td>${esc(f.className)}</td><td>${money(t.opening)}</td><td>${money(t.inc)}</td><td>${money(t.out)}</td><td><b>${money(t.balance)}</b></td><td>${t.missing}</td></tr>`}).join('')||'<tr><td colspan="7">Chưa có quỹ.</td></tr>'}</tbody></table></div>`)}`}
function detail(){let f=fund(selected);if(!f){page='funds';return fundsPage()}let t=totals(f.id),rows=running(f.id),hs=db.households.filter(h=>h.fundId===f.id).sort((a,b)=>a.student.localeCompare(b.student,'vi')),hist=db.audit.filter(a=>a.fundId===f.id).sort((a,b)=>b.at.localeCompare(a.at));return `<div class="page-head"><div><button class="link" data-act="funds">← Danh sách quỹ</button><h1>💼 ${esc(f.name)}</h1><p>${esc(f.code)} · ${esc(f.className)} · ${esc(f.custodian||'Chưa ghi thủ quỹ')}</p></div><div class="actions no-print">${btn('＋ Ghi thu / chi','newEntry','primary',f.id)}${btn('＋ Phụ huynh','newHousehold','',f.id)}${btn('Sửa quỹ','editFund','',f.id)}${btn('🖨️ In','print')}${btn('Xóa quỹ','deleteFund','danger',f.id)}</div></div><div class="metrics"><div><small>Số dư đầu</small><strong>${money(t.opening)}</strong></div><div><small>Tổng thu</small><strong>${money(t.inc)}</strong></div><div><small>Tổng chi</small><strong>${money(t.out)}</strong></div><div><small>Số dư cuối</small><strong>${money(t.balance)}</strong></div><div><small>Chi thiếu chứng từ</small><strong>${t.missing}</strong></div></div>${panel('📒 Sổ thu chi có số dư chạy',`<p class="note">Sắp theo ngày giao dịch rồi thời điểm ghi. Số dư đầu: ${money(f.opening)}. Giao dịch đã hủy không tính vào số dư.</p><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Nội dung</th><th>Loại</th><th>Thu</th><th>Chi</th><th>Số dư</th><th>Người nộp / nhận</th><th>Chứng từ</th><th></th></tr></thead><tbody>${rows.map(({entry:e,balance})=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.description)}<small>${esc(e.category)}</small></td><td>${esc(e.kind)}</td><td>${e.kind==='Thu'?money(e.amount):'—'}</td><td>${e.kind==='Chi'?money(e.amount):'—'}</td><td><b>${money(balance)}</b></td><td>${esc(e.person||'—')}${e.householdId?`<small>${esc(household(e.householdId)?.student||'')}</small>`:''}</td><td>${esc(e.proof)}<small>${esc(e.proofCode||'')}</small></td><td class="no-print">${btn('Hủy phiếu','voidEntry','small danger' function journal(){let fs=[...db.funds].sort((a,b)=>a.name.localeCompare(b.name,'vi')),a=db.entries.filter(e=>(!fundFilter||e.fundId===fundFilter)&&(!kindFilter||e.kind===kindFilter)&&(!search||[e.description,e.person,e.proofCode,e.category].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))).sort((a,b)=>b.date.localeCompare(a.date)||b.at.localeCompare(a.at));return `<div class="page-head"><div><h1>📒 Nhật ký thu chi</h1><p>Giao dịch hủy vẫn hiển thị để truy vết, không tính vào số dư.</p></div>${btn('＋ Ghi phiếu','newEntry','primary')}</div><div class="card"><div class="filters"><label>Tìm nội dung<input id="search" value="${esc(search)}" placeholder="Nội dung, người, chứng từ…"></label><label>Quỹ<select id="fundFilter"><option value="">Tất cả</option>${fs.map(f=>`<option value="${esc(f.id)}" ${fundFilter===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label>Loại<select id="kindFilter"><option value="">Thu và chi</option>${KINDS.map(v=>`<option ${kindFilter===v?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Quỹ</th><th>Nội dung</th><th>Loại</th><th>Số tiền</th><th>Người</th><th>Chứng từ</th><th>Tình trạng</th></tr></thead><tbody>${a.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(fund(e.fundId).name)}</td><td>${esc(e.description)}<small>${esc(e.category)}</small></td><td>${e.kind}</td><td>${money(e.amount)}</td><td>${esc(e.person||'—')}</td><td>${e.proof}${e.proofCode?' · '+esc(e.proofCode):''}</td><td>${e.state}${e.state==='Hủy'?`<small>${esc(e.voidReason)}</small>`:''}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có giao dịch phù hợp.</td></tr>'}</tbody></table></div></div>`}
function reports(){let byMonth=[...new Set(db.entries.filter(active).map(e=>e.date.slice(0,7)))].sort();return `<div class="page-head"><div><h1>📊 Báo cáo công khai</h1><p>Bản tổng hợp không hiển thị thông tin liên hệ cá nhân của phụ huynh.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo quỹ',`<div class="table-wrap"><table><thead><tr><th>Quỹ</th><th>Lớp</th><th>Đầu kỳ</th><th>Thu</th><th>Chi</th><th>Cuối kỳ</th><th>Chứng từ chi còn thiếu</th></tr></thead><tbody>${db.funds.map(f=>{let t=totals(f.id);return `<tr><td>${esc(f.name)}</td><td>${esc(f.className)}</td><td>${money(t.opening)}</td><td>${money(t.inc)}</td><td>${money(t.out)}</td><td>${money(t.balance)}</td><td>${t.missing}</td></tr>`}).join('')||'<tr><td colspan="7">Chưa có quỹ.</td></tr>'}</tbody></table></div>`)}${panel('Theo tháng giao dịch',`<div class="table-wrap"><table><thead><tr><th>Tháng</th><th>Thu</th><th>Chi</th><th>Chênh lệch</th><th>Số giao dịch</th></tr></thead><tbody>${byMonth.map(m=>{let a=db.entries.filter(e=>active(e)&&e.date.startsWith(m)),inc=a.filter(e=>e.kind==='Thu').reduce((n,e)=>n+e.amount,0),out=a.filter(e=>e.kind==='Chi').reduce((n,e)=>n+e.amount,0);return `<tr><td>${m.slice(5)}/${m.slice(0,4)}</td><td>${money(inc)}</td><td>${money(out)}</td><td>${money(inc-out)}</td><td>${a.length}</td></tr>`}).join('')||'<tr><td colspan="5">Chưa có giao dịch.</td></tr>'}</tbody></table></div>`)}${panel('Khoản chi thiếu chứng từ hoặc lớn',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Quỹ</th><th>Nội dung</th><th>Số tiền</th><th>Lưu ý</th></tr></thead><tbody>${db.entries.filter(e=>active(e)&&warn(e).length).map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(fund(e.fundId).name)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td>${esc(warn(e).join('; '))}</td></tr>`).join('')||'<tr><td colspan="5">Không có khoản cần chú ý.</td></tr>'}</tbody></table></div>`)}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngưỡng khoản chi lớn',`<form id="settingsForm" class="form-grid"><label>Nhắc xem xét khoản chi từ (đồng)<input name="largeExpense" type="number" min="0" step="1" value="${db.settings.largeExpense}" required></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="note">Ngưỡng chỉ tạo cảnh báo quản trị. Không tự kết luận khoản chi hợp lệ hay không hợp lệ.</p>`)}`}

function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn sử dụng</h1></div>${panel('Quy trình',`<ol><li>Tạo quỹ theo lớp; khai báo số dư đầu kỳ từ số đã kiểm kê.</li><li>Ghi một giao dịch cho mỗi khoản thu hoặc chi thực tế, kèm người nộp/nhận, chứng từ và nội dung.</li><li>Nếu muốn đối chiếu khoản đóng từng gia đình, thêm hồ sơ phụ huynh rồi liên kết khi ghi Thu. Không có hồ sơ vẫn ghi được khoản thu chung.</li><li>Nếu ghi sai, dùng Hủy phiếu với lý do và tạo phiếu mới. Phiếu hủy còn trong nhật ký, không tính số dư.</li><li>Xem số dư chạy, in báo cáo tổng hợp và sao lưu.</li></ol>`)}${panel('Quy tắc',`<p>Số dư = số dư đầu + tổng Thu hợp lệ − tổng Chi hợp lệ. App kiểm tra số dư không âm sau từng giao dịch theo thứ tự ngày. Khoản chi thiếu chứng từ và khoản từ ngưỡng cài đặt được nhắc xem xét.</p><p>“Đã đóng” trên hồ sơ phụ huynh là tiền thực thu có liên kết, không phải nghĩa vụ hay khoản nợ. App hỗ trợ quản lý nội bộ; người phụ trách vẫn cần xác nhận chứng từ và mục đích chi.</p>`)}`}
function render(){let map={home:['Tổng quan',home],funds:['Các quỹ',fundsPage],detail:['Chi tiết quỹ',detail],journal:['Nhật ký',journal],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,l,v='',type='text',opts=null){return `<label class="${type==='textarea'?'full':''}">${l}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(v)}</textarea>`:opts?`<select name="${n}">${opts.map(o=>{let key=Array.isArray(o)?o[0]:o,label=Array.isArray(o)?o[1]:o;return `<option value="${esc(key)}" ${key===v?'selected':''}>${esc(label)}</option>`}).join('')}</select>`:`<input name="${n}" type="${type}" value="${esc(v)}" ${type==='number'?'step="1" min="0"':''} ${['code','name','className','student','parent','date','amount','description','person'].includes(n)?'required':''}>`}</label>`}
function openModal(kind,id='',ref=''){let before=id?clone(kind==='fund'?fund(id):kind==='household'?household(id):null):null;draft={kind,id,ref,before};let x=before||{},form='';if(kind==='fund'){form=field('code','Mã quỹ',x.code||'')+field('name','Tên quỹ',x.name||'')+field('className','Lớp',x.className||'')+field('opening','Số dư đầu kỳ (đồng)',x.opening??0,'number')+field('custodian','Người phụ trách / thủ quỹ',x.custodian||'')+field('note','Ghi chú',x.note||'','textarea')}else if(kind==='household'){form=field('code','Mã gia đình / học sinh',x.code||'')+field('student','Tên học sinh',x.student||'')+field('parent','Tên phụ huynh',x.parent||'')+field('phone','Điện thoại',x.phone||'')+field('note','Ghi chú',x.note||'','textarea')}else{let fs=db.funds.map(f=>[f.id,f.name+' · '+f.className]),sid=ref||db.funds[0]?.id||'';form=field('fundId','Quỹ',sid,'text',fs)+field('date','Ngày giao dịch',today(),'date')+field('kind','Loại','Thu','text',KINDS)+field('category','Nhóm','Đóng góp','text',CATS)+field('amount','Số tiền (đồng)','', 'number')+field('description','Nội dung','')+field('person','Người nộp / nhận','')+field('householdId','Liên kết phụ huynh (chỉ Thu)','', 'text',[['','Không liên kết'],...db.households.filter(h=>h.fundId===sid).map(h=>[h.id,h.student+' · '+h.parent])])+field('proof','Đã có chứng từ','Có','text',['Có','Chưa'])+field('proofCode','Mã chứng từ / biên nhận','')+field('note','Ghi chú','','textarea')}$('#modalTitle').textContent=kind==='fund'?(id?'Sửa quỹ':'Tạo quỹ'):kind==='household'?(id?'Sửa phụ huynh':'Thêm phụ huynh'):'Ghi thu / chi';$('#formFields').innerHTML=form;$('#formError').textContent='';$('#editor').showModal()}
function error(s){$('#formError').textContent=s}function audit(action,reason,fundId=''){db.audit.push({id:uid(),action,reason,fundId,at:new Date().toISOString()})}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let kind=draft.kind;if(kind==='fund'){x.code=x.code.toUpperCase();x.opening=Number(x.opening);let old=fund(x.id);if(!x.code||!x.name||!x.className||!Number.isSafeInteger(x.opening)||x.opening<0||db.funds.some(z=>z.code===x.code&&z.id!==x.id)){error('Nhập mã không trùng, tên, lớp và số dư đầu không âm.');return}if(old&&old.opening!==x.opening&&db.entries.some(e=>e.fundId===x.id)){error('Số dư đầu đã khóa khi có giao dịch. Ghi khoản điều chỉnh thực tế bằng phiếu Thu hoặc Chi có chứng từ.');return}if(old)Object.assign(old,x);else db.funds.push(x);audit(old?'Sửa quỹ':'Tạo quỹ',x.code,x.id);selected=x.id}else if(kind==='household'){x.fundId=draft.ref||draft.before?.fundId;x.code=x.code.toUpperCase();let old=household(x.id);if(!fund(x.fundId)||!x.code||!x.student||!x.parent||db.households.some(z=>z.fundId===x.fundId&&z.code===x.code&&z.id!==x.id)){error('Chọn quỹ, mã không trùng, tên học sinh và phụ huynh.');return}if(old)Object.assign(old,x);else db.households.push(x);audit(old?'Sửa phụ huynh':'Thêm phụ huynh',x.student,x.fundId);selected=x.fundId}else{ x.amount=Number(x.amount);x.at=new Date().toISOString();x.state='Hợp lệ';x.voidReason='';x.fundId=String(x.fundId||'');if(!fund(x.fundId)||!dateOK(x.date)||!KINDS.includes(x.kind)||!Number.isSafeInteger(x.amount)||x.amount<=0||x.amount>1000000000000||!x.description||!x.person||!['Có','Chưa'].includes(x.proof)||x.kind==='Chi'&&x.householdId||x.householdId&&household(x.householdId)?.fundId!==x.fundId){error('Kiểm tra quỹ, ngày, loại, số tiền, nội dung, người và liên kết phụ huynh.');return}if(running(x.fundId,x).some(r=>r.balance<0)){error('Phiếu này làm số dư quỹ âm theo thứ tự ngày. Kiểm tra ngày và nguồn tiền.');return}db.entries.push(x);audit('Ghi '+x.kind,x.description+' · '+money(x.amount),x.fundId);selected=x.fundId}let err=validate(db);if(err){let list=kind==='fund'?db.funds:kind==='household'?db.households:db.entries;if(draft.before)Object.assign(list.find(z=>z.id===x.id),draft.before);else list.splice(list.findIndex(z=>z.id===x.id),1);db.audit.pop();error(err);return}$('#editor').close();page='detail';save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'quy-lop-sao-luu.json')}function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'quy-lop-kem-du-lieu.html')}
const HF=['ID','Mã quỹ','Tên quỹ','Lớp','Số dư đầu','Thủ quỹ','Ghi chú'],HH=['ID','ID quỹ','Mã','Học sinh','Phụ huynh','Điện thoại','Ghi chú'],HE=['ID','ID quỹ','Ngày','Loại','Nhóm','Số tiền','Nội dung','Người','ID phụ huynh','Chứng từ','Mã chứng từ','Ghi chú','Tình trạng','Lý do hủy','Thời điểm ghi'],HA=['ID','Thao tác','Lý do','ID quỹ','Thời điểm'];
function sheets(){return [{name:'Quy lop',rows:[HF,...db.funds.map(f=>[f.id,f.code,f.name,f.className,f.opening,f.custodian,f.note])]},{name:'Phu huynh',rows:[HH,...db.households.map(h=>[h.id,h.fundId,h.code,h.student,h.parent,h.phone,h.note])]},{name:'Thu chi',rows:[HE,...db.entries.map(e=>[e.id,e.fundId,e.date,e.kind,e.category,e.amount,e.description,e.person,e.householdId,e.proof,e.proofCode,e.note,e.state,e.voidReason,e.at])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.fundId,a.at])]}]}function exportExcel(){download(Excel.workbook(sheets()),'thu-chi-quy-lop.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),defs=[['Quy lop',HF],['Phu huynh',HH],['Thu chi',HE],['Nhat ky',HA]];for(let [n,h] of defs)if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng mẫu bốn sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.funds=b['Quy lop'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),name:String(r[2]),className:String(r[3]),opening:Number(r[4]),custodian:String(r[5]||''),note:String(r[6]||'')}));x.households=b['Phu huynh'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),fundId:String(r[1]),code:String(r[2]),student:String(r[3]),parent:String(r[4]),phone:String(r[5]||''),note:String(r[6]||'')}));x.entries=b['Thu chi'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),fundId:String(r[1]),date:String(r[2]),kind:String(r[3]),category:String(r[4]),amount:Number(r[5]),description:String(r[6]),person:String(r[7]),householdId:String(r[8]||''),proof:String(r[9]),proofCode:String(r[10]||''),note:String(r[11]||''),state:String(r[12]),voidReason:String(r[13]||''),at:String(r[14])}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),fundId:String(r[3]||''),at:String(r[4])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.funds.length} quỹ và ${x.entries.length} giao dịch?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),id=uid(),base=today(),date=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};x.funds.push({id,code:'MAU-QUY',name:'Quỹ lớp mẫu',className:'Lớp mẫu',opening:500000,custodian:'',note:'Dữ liệu minh họa theo file nguồn.'});for(let r of FUND_SAMPLE.so)x.entries.push({id:uid(),fundId:id,date:date(r[0]),kind:r[2],category:r[2]==='Thu'?'Đóng góp':'Hoạt động lớp',amount:r[3],description:r[1],person:r[4],householdId:'',proof:r[5]==='Có'?'Có':'Chưa',proofCode:'',note:'Nguồn không có mã chứng từ hoặc phụ huynh cụ thể.',state:'Hợp lệ',voidReason:'',at:new Date().toISOString()});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;if(k==='newFund')openModal('fund');else if(k==='editFund')openModal('fund',id);else if(k==='newHousehold')openModal('household','',id);else if(k==='editHousehold')openModal('household',id);else if(k==='newEntry'){if(!db.funds.length){alert('Tạo quỹ trước khi ghi thu chi.');return}openModal('entry','',id)}else if(k==='openFund'){selected=id;page='detail';render()}else if(k==='funds'){page='funds';render()}else if(k==='voidEntry'){let x=db.entries.find(e=>e.id===id),reason=prompt('Lý do hủy phiếu (không được để trống):');if(reason===null)return;reason=reason.trim();if(!reason){alert('Cần lý do hủy.');return}x.state='Hủy';x.voidReason=reason;if(running(x.fundId).some(r=>r.balance<0)){x.state='Hợp lệ';x.voidReason='';alert('Không thể hủy phiếu thu vì sẽ làm số dư âm theo thứ tự ngày.');return}audit('Hủy phiếu',x.description+' · '+reason,x.fundId);save()}else if(k==='deleteHousehold'){let x=household(id);if(db.entries.some(e=>e.householdId===id)){alert('Phụ huynh đã có khoản thu liên kết; không thể xóa.');return}if(confirm('Xóa hồ sơ phụ huynh này?')){db.households=db.households.filter(h=>h.id!==id);audit('Xóa phụ huynh',x.student,x.fundId);save()}}else if(k==='deleteFund'){let x=fund(id);if(db.entries.some(e=>e.fundId===id)||db.households.some(h=>h.fundId===id)){alert('Quỹ đã có giao dịch hoặc phụ huynh; không thể xóa.');return}if(confirm('Xóa quỹ này?')){db.funds=db.funds.filter(f=>f.id!==id);audit('Xóa quỹ',x.code,id);page='funds';save()}}else if(k==='saveSettings'){let n=Number(new FormData($('#settingsForm')).get('largeExpense'));if(!Number.isSafeInteger(n)||n<0){alert('Ngưỡng phải là số nguyên không âm.');return}db.settings.largeExpense=n;save()}else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let p=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(p,p)}if(e.target.id==='fundFilter'){fundFilter=e.target.value;render()}if(e.target.id==='kindFilter'){kindFilter=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
document.addEventListener('change',e=>{if(e.target.name==='fundId'&&draft?.kind==='entry'){let sel=$('[name="householdId"]');if(sel)sel.innerHTML='<option value="">Không liên kết</option>'+db.households.filter(h=>h.fundId===e.target.value).map(h=>`<option value="${esc(h.id)}">${esc(h.student)} · ${esc(h.parent)}</option>`).join('')}});
window.ClassFundApp={getDB:()=>clone(db),validate,totals,running,summary,loadSample,encode,decode,sheets,importFile};
</script></body></html>
