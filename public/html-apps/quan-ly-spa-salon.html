function blank(){return{version:1,updatedAt:Date.now(),settings:{company:'',asof:'',warnDays:30},packages:[],appointments:[],payments:[]}}
const pkg=(id,x=db)=>x.packages.find(p=>p.id===id),appt=(id,x=db)=>x.appointments.find(a=>a.id===id);
const paidFor=(x,type,id)=>x.payments.filter(p=>p.targetType===type&&p.targetId===id).reduce((n,p)=>n+p.amount,0);
function packageStats(x,p,at=x.settings.asof||today()){let visits=x.appointments.filter(a=>a.packageId===p.id&&a.status==='Đã làm').sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)||a.id.localeCompare(b.id)),used=visits.length,remaining=p.sessions-used,expiry=addMonths(p.purchaseDate,p.months),unit=Math.round(p.price/p.sessions),earned=used>=p.sessions?p.price:used*unit,unperformed=p.price-earned,collected=paidFor(x,'package',p.id),advance=Math.max(0,collected-earned),warnings=[];if(remaining<=0)warnings.push('Đã dùng hết buổi');else if(expiry<at)warnings.push('Thẻ hết hạn còn buổi');else if(days(expiry,at)<=x.settings.warnDays)warnings.push('Sắp hết hạn');if(collected<p.price)warnings.push('Chưa thu đủ tiền thẻ');return{used,remaining,expiry,unit,earned,unperformed,collected,advance,warnings,visits}}

function appointmentWarning(x,a,at=x.settings.asof||today()){let list=[];if(a.status==='Đã hẹn'&&a.date<at)list.push('Quá ngày hẹn chưa cập nhật');if(a.packageId){let p=pkg(a.packageId,x);if(p&&a.date>addMonths(p.purchaseDate,p.months))list.push('Lịch sau hạn dùng thẻ')}return list}
function validBackup(x){if(!x||x.version!==1||!x.settings||typeof x.settings.company!=='string'||x.settings.company.length>160||x.settings.asof&&!validDate(x.settings.asof)||!Number.isSafeInteger(x.settings.warnDays)||x.settings.warnDays<0||x.settings.warnDays>365||!Array.isArray(x.packages)||!Array.isArray(x.appointments)||!Array.isArray(x.payments)||x.packages.length>20000||x.appointments.length>100000||x.payments.length>100000)return false;let ids=new Set(),codes=new Set();for(let p of x.packages){if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.code!=='string'||!p.code||codes.has(p.code.toLowerCase())||typeof p.customer!=='string'||!p.customer||typeof p.phone!=='string'||!SERVICES.includes(p.service)||!Number.isSafeInteger(p.sessions)||p.sessions<1||p.sessions>1000||!validMoney(p.price)||!validDate(p.purchaseDate)||!Number.isSafeInteger(p.months)||p.months<1||p.months>120||typeof p.note!=='string')return false;ids.add(p.id);codes.add(p.code.toLowerCase())}let aids=new Set();for(let a of x.appointments){if(!a||typeof a.id!=='string'||!a.id||aids.has(a.id)||!validDate(a.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(a.time)||typeof a.customer!=='string'||!a.customer||typeof a.phone!=='string'||!SERVICES.includes(a.service)||typeof a.staff!=='string'||!a.staff||!STATUSES.includes(a.status)||!validMoney(a.retailPrice)||typeof a.note!=='string'||a.packageId&&!ids.has(a.packageId))return false;if(a.packageId){let p=pkg(a.packageId,x);if(a.service!==p.service||a.customer!==p.customer||a.retailPrice!==0)return false}aids.add(a.id)}let pids=new Set();for(let p of x.payments){if(!p||typeof p.id!=='string'||!p.id||pids.has(p.id)||!['package','appointment'].includes(p.targetType)||p.targetType==='package'&&!ids.has(p.targetId)||p.targetType==='appointment'&&(!aids.has(p.targetId)||x.appointments.find(a=>a.id===p.targetId).packageId)||!validDate(p.date)||!validMoney(p.amount)||p.amount===0||!METHODS.includes(p.method)||typeof p.reference!=='string'||typeof p.note!=='string')return false;pids.add(p.id)}for(let p of x.packages)if(x.appointments.filter(a=>a.packageId===p.id&&a.status==='Đã làm').length>p.sessions)return false;return true}

function dataPage(){return hero('💾 Dữ liệu & sao lưu','Sao lưu trước khi nạp mẫu, nhập Excel hoặc chuyển máy.')+'<section class="card"><div class="grid">'+metric('Thẻ liệu trình',db.packages.length)+metric('Lịch hẹn',db.appointments.length)+metric('Khoản đã thu',db.payments.length)+'</div><p class="notice warn">File HTML gốc không mang theo dữ liệu lưu trong trình duyệt. Hãy tải HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV lịch hẹn</button></div><p class="muted">Excel có 4 sheet: thẻ liệu trình, lịch hẹn, tiền đã thu và cài đặt.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>6 thẻ, 10 lịch hẹn; 7 khoản thu demo là GIẢ ĐỊNH thẻ và lịch khách lẻ đã thanh toán, vì file gốc không có sổ thu. Mẫu chỉ nạp khi chọn.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa toàn bộ dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn sử dụng','Phân biệt thẻ bán trước, buổi đã làm và tiền thực đã thu.')+'<section class="card"><h2>Quy trình</h2><ol><li>Tạo thẻ liệu trình với khách, dịch vụ, số buổi, giá và hạn dùng.</li><li>Đặt lịch theo giờ, chọn thẻ nếu khách dùng thẻ; khách lẻ nhập giá dịch vụ riêng.</li><li>Sau buổi hẹn cập nhật “Đã làm”, “Hủy” hoặc “Không đến”. Chỉ “Đã làm” dùng buổi và tạo doanh thu dịch vụ.</li><li>Ghi từng khoản tiền khách đã trả vào thẻ hoặc lịch khách lẻ.</li><li>Xem thẻ gần hết hạn, lịch quá ngày, doanh thu theo nhân viên và sao lưu dữ liệu.</li></ol></section><section class="card"><h2>Cách tính & giới hạn</h2><p>Thẻ còn buổi = số buổi mua − số lịch “Đã làm” liên kết. Hạn thẻ = ngày mua + số tháng. Doanh thu thẻ được phân bổ theo buổi; buổi cuối nhận phần làm tròn để tổng bằng giá thẻ. Giá trị chưa thực hiện = giá thẻ − doanh thu đã làm. Tiền thu trước chưa làm = phần tiền thực đã thu vượt doanh thu đã làm, tối thiểu 0.</p><p class="notice warn">App chỉ quản lý lịch dịch vụ và khoản thu. Không chứa hồ sơ bệnh án, chẩn đoán, toa thuốc hoặc lời khuyên y tế. Dữ liệu khách hàng và khoản thanh toán cần bảo vệ khi sao lưu.</p></section>'}
function render(){let names={dashboard:'Tổng quan',agenda:'Lịch cần xử lý',calendar:'Lịch 30 ngày',appointments:'Lịch hẹn',packages:'Thẻ liệu trình',payments:'Tiền đã thu',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Spa / salon')+'</b> · '+esc(names[page])+' · Ngày '+date(asof())+'</div>'+({dashboard,agenda:agendaPage,calendar:calendarPage,appointments:appointmentsPage,packages:packagesPage,payments:paymentsPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage})[page]()}
function openModal(type,id=''){let old=type==='package'?pkg(id):type==='appointment'?appt(id):db.payments.find(p=>p.id===id);old=old||{};modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+({package:'thẻ liệu trình',appointment:'lịch hẹn',payment:'khoản đã thu'}[type]);let h='';if(type==='package')h=field('code','Mã thẻ *','text',old.code||nextCode())+field('customer','Khách hàng *','text',old.customer||'')+field('phone','Điện thoại','tel',old.phone||'')+field('service','Dịch vụ','select','',options(SERVICES,old.service||SERVICES[0]))+field('sessions','Số buổi mua','number',old.sessions??1)+field('price','Giá thẻ (đ)','number',old.price??0)+field('purchaseDate','Ngày mua','date',old.purchaseDate||today())+field('months','Hạn dùng (tháng)','number',old.months??6)+field('note','Ghi chú','textarea',old.note||'');if(type==='appointment'){let pkopts='<option value="">Khách lẻ, không dùng thẻ</option>'+db.packages.map(p=>opt(p.id,p.code+' · '+p.customer+' · '+p.service,old.packageId)).join('');h=field('date','Ngày hẹn','date',old.date||today())+field('time','Giờ','time',old.time||'09:00')+field('packageId','Thẻ liệu trình (nếu có)','select','',pkopts)+field('customer','Khách hàng *','text',old.customer||'')+field('phone','Điện thoại','tel',old.phone||'')+field('service','Dịch vụ','select','',options(SERVICES,old.service||SERVICES[0]))+field('staff','Nhân viên *','text',old.staff||'')+field('status','Trạng thái','select','',options(STATUSES,old.status||'Đã hẹn'))+field('retailPrice','Giá khách lẻ (đ)','number',old.retailPrice??0)+field('note','Ghi chú lịch / yêu cầu dịch vụ','textarea',old.note||'');h+='<p class="wide notice">Khi chọn thẻ, tên khách và dịch vụ được lấy theo thẻ; giá khách lẻ phải bằng 0.</p>'}if(type==='payment'){let opts='<option value="">Chọn thẻ hoặc lịch khách lẻ</option>'+db.packages.map(p=>opt('package|'+p.id,'Thẻ '+p.code+' · '+p.customer,(old.targetType||'')+'|'+(old.targetId||''))).join('')+db.appointments.filter(a=>!a.packageId).map(a=>opt('appointment|'+a.id,'Khách lẻ '+date(a.date)+' · '+a.customer,(old.targetType||'')+'|'+(old.targetId||''))).join('');h=field('target','Thu cho *','select','',opts)+field('date','Ngày thu','date',old.date||today())+field('amount','Số tiền (đ)','number',old.amount??0)+field('method','Hình thức','select','',options(METHODS,old.method||METHODS[0]))+field('reference','Mã chứng từ / giao dịch','text',old.reference||'')+field('note','Ghi chú','textarea',old.note||'')}if(id)h+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bản ghi này</button></div>';$('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){if(!modal)return;let{type,id}=modal,x={},error='';if(type==='package'){x={code:v('code'),customer:v('customer'),phone:v('phone'),service:v('service'),sessions:amount(v('sessions')),price:amount(v('price')),purchaseDate:v('purchaseDate'),months:amount(v('months')),note:v('note')};if(!x.code||!x.customer||!SERVICES.includes(x.service)||!validDate(x.purchaseDate)||!Number.isSafeInteger(x.sessions)||x.sessions<1||x.sessions>1000||!validMoney(x.price)||!Number.isSafeInteger(x.months)||x.months<1||x.months>120)error='Mã, khách, dịch vụ, số buổi, giá hoặc hạn thẻ không hợp lệ.';else if(db.packages.some(p=>p.id!==id&&p.code.toLowerCase()===x.code.toLowerCase()))error='Mã thẻ đã có.'}if(type==='appointment'){x={date:v('date'),time:v('time'),packageId:v('packageId'),customer:v('customer'),phone:v('phone'),service:v('service'),staff:v('staff'),status:v('status'),retailPrice:amount(v('retailPrice')),note:v('note')};let p=pkg(x.packageId);if(p){x.customer=p.customer;x.service=p.service;x.retailPrice=0}if(!validDate(x.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time)||!x.customer||!SERVICES.includes(x.service)||!x.staff||!STATUSES.includes(x.status)||!validMoney(x.retailPrice))error='Ngày, giờ, khách, dịch vụ, nhân viên hoặc giá không hợp lệ.'}if(type==='payment'){let parts=v('target').split('|');x={targetType:parts[0],targetId:parts[1],date:v('date'),amount:amount(v('amount')),method:v('method'),reference:v('reference'),note:v('note')};if(!['package','appointment'].includes(x.targetType)||x.targetType==='package'&&!pkg(x.targetId)||x.targetType==='appointment'&&!appt(x.targetId)||!validDate(x.date)||!validMoney(x.amount)||x.amount===0||!METHODS.includes(x.method))error='Đối tượng thu, ngày, số tiền hoặc hình thức không hợp lệ.'}if(error){$('#modalError').textContent=error;return}let d={...db,packages:db.packages.slice(),appointments:db.appointments.slice(),payments:db.payments.slice()},list=d[type==='package'?'packages':type==='appointment'?'appointments':'payments'];if(id){let i=list.findIndex(a=>a.id===id);list[i]={...list[i],...x}}else list.push({id:uid(),...x});if(!validBackup(d)){$('#modalError').textContent='Thay đổi làm vượt số buổi thẻ hoặc sai liên kết khách/dịch vụ.';return}db=d;closeModal();save()}
function sampleData(anchor=today()){let d=blank(),at=s=>addDays(anchor,Number(s.slice(1)));for(let [i,[code,customer,service,sessions,price,purchase,months]] of SOURCE.packages.entries()){let p={id:'sample-package-'+i,code,customer,phone:'',service,sessions,price,purchaseDate:at(purchase),months,note:'Dữ liệu thẻ từ file gốc'};d.packages.push(p);d.payments.push({id:'sample-payment-package-'+i,targetType:'package',targetId:p.id,date:p.purchaseDate,amount:price,method:'Số dư mẫu',reference:'MẪU-'+code,note:'Giả định thẻ mẫu đã thu đủ; file gốc không có sổ khoản thu'})}for(let [i,[offset,time,customer,cardCode,service,staff,status,retailPrice]] of SOURCE.appointments.entries()){let p=d.packages.find(p=>p.code===cardCode);let a={id:'sample-appointment-'+i,date:at(offset),time,customer,phone:'',packageId:p?.id||'',service,staff,status,retailPrice,note:'Lịch mẫu từ file gốc'};d.appointments.push(a);if(!p&&status==='Đã làm'&&retailPrice)d.payments.push({id:'sample-payment-retail-'+i,targetType:'appointment',targetId:a.id,date:a.date,amount:retailPrice,method:'Số dư mẫu',reference:'MẪU-KL-'+i,note:'Giả định khách lẻ mẫu đã thanh toán'})}return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('quan-ly-spa-salon-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Ngày','Giờ','Khách','Mã thẻ','Dịch vụ','Nhân viên','Trạng thái','Giá khách lẻ','Doanh thu ghi nhận']];for(let a of db.appointments)rows.push([a.date,a.time,a.customer,pkg(a.packageId)?.code||'',a.service,a.staff,a.status,a.retailPrice,appointmentRevenue(db,a)]);let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('spa-salon-lich-hen.csv',body,'text/csv;charset=utf-8')}
function excelSheets(){return[
  {name:'The lieu trinh',rows:[['Mã thẻ','Khách','Điện thoại','Dịch vụ','Số buổi','Giá thẻ','Ngày mua','Hạn tháng','Ghi chú'],...db.packages.map(p=>[p.code,p.customer,p.phone,p.service,p.sessions,p.price,p.purchaseDate,p.months,p.note])]},
  {name:'Lich hen',rows:[['Mã lịch','Ngày','Giờ','Khách','Điện thoại','Mã thẻ','Dịch vụ','Nhân viên','Trạng thái','Giá khách lẻ','Ghi chú'],...db.appointments.map(a=>[a.id,a.date,a.time,a.customer,a.phone,pkg(a.packageId)?.code||'',a.service,a.staff,a.status,a.retailPrice,a.note])]},
  {name:'Tien da thu',rows:[['Loại','Mã tham chiếu','Ngày thu','Số tiền','Hình thức','Chứng từ','Ghi chú'],...db.payments.map(p=>[p.targetType,p.targetType==='package'?pkg(p.targetId)?.code||'':p.targetId,p.date,p.amount,p.method,p.reference,p.note])]},

]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='quan-ly-spa-salon.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){let pr=sheets['The lieu trinh'],ar=sheets['Lich hen'],rr=sheets['Tien da thu'];if(!pr||!ar||!rr||pr[0]?.[0]!=='Mã thẻ'||ar[0]?.[0]!=='Mã lịch'||rr[0]?.[0]!=='Loại')throw Error('Cần workbook của app này với ba bảng dữ liệu.');let d=blank();for(let r of pr.slice(1)){if(!String(r[0]??'').trim())continue;d.packages.push({id:uid(),code:String(r[0]).trim(),customer:String(r[1]??'').trim(),phone:String(r[2]??'').trim(),service:String(r[3]??'').trim(),sessions:amount(r[4]),price:amount(r[5]),purchaseDate:parseDate(r[6]),months:amount(r[7]),note:String(r[8]??'').trim()})}for(let r of ar.slice(1)){if(!String(r[0]??'').trim())continue;let p=d.packages.find(x=>x.code===String(r[5]??'').trim());d.appointments.push({id:String(r[0]).trim(),date:parseDate(r[1]),time:String(r[2]??'').trim(),customer:String(r[3]??'').trim(),phone:String(r[4]??'').trim(),packageId:p?.id||'',service:String(r[6]??'').trim(),staff:String(r[7]??'').trim(),status:String(r[8]??'').trim(),retailPrice:amount(r[9]),note:String(r[10]??'').trim()})}for(let r of rr.slice(1)){if(!String(r[0]??'').trim())continue;let type=String(r[0]).trim(),target=type==='package'?d.packages.find(x=>x.code===String(r[1]??'').trim()):d.appointments.find(x=>x.id===String(r[1]??'').trim());if(!target)throw Error('Khoản thu thiếu thẻ hoặc lịch khách lẻ.');d.payments.push({id:uid(),targetType:type,targetId:target.id,date:parseDate(r[2]),amount:amount(r[3]),method:String(r[4]??'').trim(),reference:String(r[5]??'').trim(),note:String(r[6]??'').trim()})}if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));if(raw.company!==undefined)d.settings.company=String(raw.company);if(raw.asof!==undefined)d.settings.asof=String(raw.asof);if(raw.warnDays!==undefined)d.settings.warnDays=amount(raw.warnDays)}if(!validBackup(d))throw Error('Excel có mã trùng, ngày, số buổi hoặc số tiền không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập '+d.packages.length+' thẻ, '+d.appointments.length+' lịch và '+d.payments.length+' khoản thu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('quan-ly-spa-salon-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.packages.length||db.appointments.length||db.payments.length){if(!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();save()}if(a==='clear'){if(confirm('Xóa toàn bộ thẻ, lịch và khoản thu trên trình duyệt này?')){db=blank();save()}}if(a==='deleteRecord'){let{type,id}=modal;if(type==='package'&&(db.appointments.some(a=>a.packageId===id)||db.payments.some(p=>p.targetType==='package'&&p.targetId===id))){$('#modalError').textContent='Thẻ đã có lịch hoặc khoản thu; không thể xóa.';return}if(type==='appointment'&&db.payments.some(p=>p.targetType==='appointment'&&p.targetId===id)){$('#modalError').textContent='Lịch đã có khoản thu; không thể xóa.';return}if(confirm('Xóa vĩnh viễn bản ghi này?')){let list=db[type==='package'?'packages':type==='appointment'?'appointments':'payments'];list.splice(list.findIndex(x=>x.id===id),1);closeModal();save()}}if(a==='settings'){let s={company:v('company'),asof:v('asof'),warnDays:amount(v('warnDays'))},d={...db,settings:s};if(!validBackup(d)){alert('Tên cơ sở, ngày hoặc số ngày nhắc không hợp lệ.');return}db=d;save()}});
document.addEventListener('change',e=>{if(e.target.id==='f_packageId'&&modal?.type==='appointment'){let p=pkg(e.target.value);if(p){$('#f_customer').value=p.customer;$('#f_service').value=p.service;$('#f_retailPrice').value=0}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();


</script></body></html>
