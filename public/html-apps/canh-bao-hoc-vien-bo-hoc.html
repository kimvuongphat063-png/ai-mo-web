const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const money=n=>new Intl.NumberFormat('vi-VN').format(Math.round(Number(n)||0))+' ₫';
const num=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:1}).format(Number(n)||0);
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const validDate=s=>!s||/^\d{4}-\d{2}-\d{2}$/.test(String(s))&&Number.isFinite(Date.parse(s))&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s;
const fmtDate=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'—';
const sum=(a,f)=>a.reduce((n,x)=>n+(Number(f(x))||0),0);
const field=(name,label,value='',type='text',options=null,extra='')=>`<div class="field ${extra}"><label for="f_${name}">${esc(label)}</label>${options?`<select id="f_${name}" name="${name}">${options.map(o=>{let v=typeof o==='string'?o:o[0],t=typeof o==='string'?o:o[1];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`:type==='textarea'?`<textarea id="f_${name}" name="${name}">${esc(value)}</textarea>`:`<input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any"':''}>`}</div>`;
const btn=(text,action,klass='',attrs='')=>`<button type="button" class="btn ${klass}" data-act="${action}" ${attrs}>${text}</button>`;
const hero=(title,sub)=>`<section class="hero"><small>🧭 AI MỞ · HỖ TRỢ HỌC VIÊN</small><h1>${title}</h1><p>${sub}</p></section>`;
const metric=(label,value,sub='')=>`<div class="metric"><small>${label}</small><strong>${value}</strong>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
const table=(heads,rows,empty='Chưa có dữ liệu.')=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${heads.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
const badge=(text,kind)=>`<span class="status ${kind}">${esc(text)}</span>`;
const download=(blob,name)=>{let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)};
const empty=()=>({app:APP,version:VERSION,students:[],checks:[],actions:[],settings:{org:'',absence1:15,absence2:25,gradeBelow:6,consecutiveMin:3,mediumAt:2,highAt:3,asof:''}});
const student=id=>db.students.find(s=>s.id===id);
const asof=()=>db.settings.asof||today();
const rate=s=>s.total>0?Math.round(s.absent/s.total*1000)/10:null;
function risk(s,rules=db.settings){let absence=rate(s),a=absence===null?0:absence>=rules.absence2?2:absence>=rules.absence1?1:0,g=s.grade===null?0:s.grade<rules.gradeBelow?1:0,debt=s.debt>0?1:0,consecutive=s.consecutive>=rules.consecutiveMin?1:0,points=a+g+debt+consecutive;return {absence,points,level:points>=rules.highAt?'Cao':points>=rules.mediumAt?'Trung bình':'Thấp',parts:[['Vắng học',a,absence===null?'Chưa có buổi học':num(absence)+'%'],['Điểm kiểm tra',g,s.grade===null?'Chưa có điểm':num(s.grade)+'/10'],['Học phí còn nợ',debt,money(s.debt)],['Vắng liên tiếp',consecutive,num(s.consecutive)+' buổi']]}}
const levelKind=l=>l==='Cao'?'high':l==='Trung bình'?'medium':'low';
const priority=l=>l==='Cao'?0:l==='Trung bình'?1:2;
const followOverdue=s=>s.followupDate&&s.followupDate<asof();
const stamp=()=>new Date().toISOString();
function validate(x){
 if(!x||x.app!==APP||x.version!==VERSION||!Array.isArray(x.students)||!Array.isArray(x.checks)||!Array.isArray(x.actions)||!x.settings)return 'Cấu trúc hoặc phiên bản sao lưu không đúng.';
 let q=x.settings;if(String(q.org||'').length>120||!validDate(q.asof)||![q.absence1,q.absence2,q.gradeBelow,q.consecutiveMin,q.mediumAt,q.highAt].every(Number.isFinite)||q.absence1<0||q.absence2<=q.absence1||q.absence2>100||q.gradeBelow<0||q.gradeBelow>10||!Number.isSafeInteger(q.consecutiveMin)||q.consecutiveMin<1||q.consecutiveMin>100||!Number.isSafeInteger(q.mediumAt)||!Number.isSafeInteger(q.highAt)||q.mediumAt<1||q.highAt<=q.mediumAt||q.highAt>5)return 'Ngưỡng cảnh báo không hợp lệ.';
 let ids=new Set(),codes=new Set();for(let s of x.students){if(!s.id||ids.has(s.id)||!/^[A-Z0-9_-]{2,24}$/.test(String(s.code))||codes.has(s.code)||!String(s.name||'').trim()||!String(s.className||'').trim()||!CASES.includes(s.caseStatus)||!validDate(s.followupDate))return 'Mã, tên, lớp hoặc tình trạng hỗ trợ không hợp lệ.';ids.add(s.id);codes.add(s.code);if(!Number.isSafeInteger(s.total)||s.total<0||!Number.isSafeInteger(s.absent)||s.absent<0||s.absent>s.total||!Number.isSafeInteger(s.consecutive)||s.consecutive<0||s.consecutive>s.absent||s.grade!==null&&(!Number.isFinite(s.grade)||s.grade<0||s.grade>10)||!Number.isSafeInteger(s.debt)||s.debt<0)return 'Buổi học, điểm hoặc công nợ không hợp lệ.';if(String(s.phone||'').length>30||String(s.note||'').length>1000)return 'Số điện thoại hoặc ghi chú quá dài.'}
 let checkIds=new Set();for(let c of x.checks){if(!c.id||checkIds.has(c.id)||!ids.has(c.studentId)||!validDate(c.date)||!c.date||!String(c.reason||'').trim()||!Number.isSafeInteger(c.total)||!Number.isSafeInteger(c.absent)||!Number.isSafeInteger(c.consecutive)||!Number.isSafeInteger(c.debt)||!Number.isSafeInteger(c.points)||!['Cao','Trung bình','Thấp'].includes(c.level))return 'Lịch sử đánh giá không hợp lệ.';checkIds.add(c.id)}
 let actionIds=new Set();for(let a of x.actions){if(!a.id||actionIds.has(a.id)||!ids.has(a.studentId)||!validDate(a.date)||!a.date||!validDate(a.nextDate)||!ACTIONS.includes(a.type)||!CASES.includes(a.caseStatus)||!String(a.summary||'').trim())return 'Nhật ký hỗ trợ không hợp lệ.';actionIds.add(a.id)}return '';
}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let b=$('#embedded-state').textContent.trim();return b&&b!=='e30='?JSON.parse(decodeURIComponent(escape(atob(b)))):null}catch{return null}}
let db=empty(),page='dashboard',selected='',query='',classFilter='',levelFilter='',caseFilter='',draft=null;
try{let embedded=decode(),local=JSON.parse(localStorage.getItem(KEY)||'null');if(embedded&&!validate(embedded))db=embedded;else if(local&&!validate(local))db=local}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Trình duyệt không lưu được; hãy tải JSON hoặc HTML kèm dữ liệu.')}render();return true}
function sortRisk(list){return [...list].sort((a,b)=>priority(risk(a).level)-priority(risk(b).level)||risk(b).points-risk(a).points||a.name.localeCompare(b.name,'vi'))}
function filtered(){return sortRisk(db.students.filter(s=>(!query||[s.name,s.code,s.className,s.parent,s.phone,s.note].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))&&(!classFilter||s.className===classFilter)&&(!levelFilter||risk(s).level===levelFilter)&&(!caseFilter||s.caseStatus===caseFilter)))}
function dashboard(){let hi=db.students.filter(s=>risk(s).level==='Cao'),med=db.students.filter(s=>risk(s).level==='Trung bình'),due=db.students.filter(s=>s.followupDate&&s.followupDate<=asof()),missing=db.students.filter(s=>s.total===0||s.grade===null);return hero('Cảnh báo sớm nguy cơ bỏ học','Tổng hợp dấu hiệu từ chuyên cần, điểm học tập và công nợ để ưu tiên hỗ trợ.')+`<div class="grid">${metric('Học viên theo dõi',num(db.students.length))}${metric('Nguy cơ cao',num(hi.length),'Ưu tiên xem hồ sơ')}${metric('Nguy cơ trung bình',num(med.length))}${metric('Hẹn hỗ trợ đến hạn',num(due.length),`Ngày báo cáo ${fmtDate(asof())}`)}${metric('Thiếu dữ liệu đầu vào',num(missing.length),'Chưa có buổi học hoặc điểm')}${metric('Học phí còn nợ',money(sum(db.students,s=>s.debt)),'Dữ liệu nhập thủ công')}</div><div class="card"><h2>⚡ Bắt đầu nhanh</h2><div class="quick-actions">${btn('＋ Thêm học viên','newStudent','primary')}${btn('🚩 Xem ưu tiên','goPriorities')}${btn('📊 Báo cáo lớp','goReport')}${btn('💾 Nạp mẫu để thử','goData')}</div><p class="note">Dữ liệu thật khởi đầu trống. Nạp 20 học viên mẫu trong “Dữ liệu & sao lưu”.</p></div><div class="card"><h2>🚩 Ưu tiên nguy cơ cao</h2>${hi.length?`<div class="alert-list">${sortRisk(hi).slice(0,10).map(s=>{let r=risk(s);return `<div class="alert-item"><button class="link" data-act="openStudent" data-id="${esc(s.id)}">${esc(s.name)}</button> · ${esc(s.className)} · ${r.points} điểm nguy cơ · ${s.caseStatus}${s.followupDate?' · hẹn '+fmtDate(s.followupDate):''}</div>`}).join('')}</div>`:'<p class="ok-text">Chưa có học viên mức cao theo ngưỡng hiện tại.</p>'}</div>`}
function studentRows(list){return list.map(s=>{let r=risk(s);return `<tr><td><button class="link" data-act="openStudent" data-id="${esc(s.id)}">${esc(s.name)}</button><div class="small muted">${esc(s.code)}</div></td><td>${esc(s.className)}</td><td class="num">${num(s.total)}</td><td class="num">${num(s.absent)}${r.absence===null?' · —':' · '+num(r.absence)+'%'}</td><td class="num">${s.grade===null?'Chưa có':num(s.grade)}</td><td class="num">${num(s.consecutive)}</td><td class="num">${money(s.debt)}</td><td>${badge(r.level+' · '+r.points+' điểm',levelKind(r.level))}</td><td>${esc(s.caseStatus)}<div class="small ${followOverdue(s)?'danger-text':'muted'}">${s.followupDate?fmtDate(s.followupDate):'Chưa hẹn'}</div></td><td><div class="row-actions">${btn('Xem','openStudent','small',`data-id="${esc(s.id)}"`)}${btn('Cập nhật','editStudent','small',`data-id="${esc(s.id)}"`)}</div></td></tr>`})}
function studentsPage(){let list=filtered();return hero('Danh sách học viên','Lọc theo lớp, mức nguy cơ và tình trạng hỗ trợ; mở hồ sơ để xem lý do chấm điểm.')+`<div class="card"><div class="toolbar"><h2>Hồ sơ · ${list.length}/${db.students.length}</h2><span class="grow"></span>${btn('＋ Thêm học viên','newStudent','primary')}${btn('⬇️ Excel','exportExcel')}</div><div class="filters no-print"><input id="search" type="search" value="${esc(query)}" placeholder="Tìm tên, mã, lớp, phụ huynh…" aria-label="Tìm học viên"><select id="classFilter" aria-label="Lọc lớp"><option value="">Mọi lớp</option>${[...new Set(db.students.map(s=>s.className))].sort().map(c=>`<option ${classFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="levelFilter" aria-label="Lọc mức nguy cơ"><option value="">Mọi mức</option>${['Cao','Trung bình','Thấp'].map(c=>`<option ${levelFilter===c?'selected':''}>${c}</option>`).join('')}</select><select id="caseFilter" aria-label="Lọc xử lý"><option value="">Mọi xử lý</option>${CASES.map(c=>`<option ${caseFilter===c?'selected':''}>${c}</option>`).join('')}</select>${btn('Bỏ lọc','clearFilters','small')}</div>${table(['Học viên','Lớp','Buổi học','Vắng / tỷ lệ','Điểm TB','Vắng liên tiếp','Nợ học phí','Nguy cơ','Hỗ trợ / hẹn','Thao tác'],studentRows(list.slice(0,200)),'Chưa có học viên phù hợp.')}${list.length>200?'<p class="note">Đang hiện 200 hồ sơ đầu; hãy lọc hẹp hơn.</p>':''}</div>`}
function studentDetail(){let s=student(selected);if(!s){page='students';return studentsPage()}let r=risk(s),cs=db.checks.filter(c=>c.studentId===s.id).sort((a,b)=>b.date.localeCompare(a.date)),as=db.actions.filter(a=>a.studentId===s.id).sort((a,b)=>b.date.localeCompare(a.date));return hero(s.name,`${s.code} · ${s.className} · ${r.level} (${r.points} điểm)`)+`<div class="toolbar no-print">${btn('← Danh sách','goStudents')}${btn('Cập nhật dữ liệu','editStudent','primary',`data-id="${esc(s.id)}"`)}${btn('＋ Ghi hỗ trợ','newAction','',`data-sid="${esc(s.id)}"`)}${btn('Xóa hồ sơ','deleteStudent','danger',`data-id="${esc(s.id)}"`)}</div><div class="card"><h2>📌 Vì sao có mức ${r.level.toLowerCase()}?</h2><div class="risk-parts">${r.parts.map(([name,points,detail])=>`<div class="risk-part"><small>${esc(name)}</small><b>${esc(detail)}</b><div class="points">+${points} điểm</div></div>`).join('')}</div><p class="note">Tổng ${r.points} điểm · Trung bình từ ${db.settings.mediumAt}; Cao từ ${db.settings.highAt}. Đây là dấu hiệu để người phụ trách xem xét, không phải kết luận học viên sẽ bỏ học.</p>${s.total===0||s.grade===null?'<div class="hint">Thiếu dữ liệu: tỷ lệ vắng hoặc điểm chưa thể đánh giá đầy đủ. Hãy cập nhật khi có thông tin.</div>':''}</div><div class="grid">${metric('Buổi đã học',num(s.total))}${metric('Số buổi vắng',num(s.absent),r.absence===null?'Chưa có buổi học':num(r.absence)+'%')}${metric('Điểm TB',s.grade===null?'Chưa có':num(s.grade)+'/10')}${metric('Vắng liên tiếp',num(s.consecutive))}${metric('Học phí còn nợ',money(s.debt))}${metric('Hẹn hỗ trợ',fmtDate(s.followupDate),s.caseStatus)}</div><div class="card"><h2>👪 Thông tin & ghi chú</h2><p><b>Phụ huynh:</b> ${esc(s.parent||'Chưa ghi')} · <b>Điện thoại:</b> ${esc(s.phone||'Chưa ghi')}</p><p class="note">${esc(s.note||'Chưa có ghi chú.')}</p></div><div class="card"><div class="toolbar"><h2>🤝 Nhật ký hỗ trợ · ${as.length}</h2><span class="grow"></span>${btn('＋ Thêm hoạt động','newAction','primary',`data-sid="${esc(s.id)}"`)}</div>${as.length?`<div class="timeline">${as.map(a=>`<div class="timeline-item"><b>${fmtDate(a.date)} · ${esc(a.type)}</b><div>${esc(a.summary)}</div><div class="small muted">${esc(a.owner||'Chưa ghi người xử lý')} · ${esc(a.caseStatus)}${a.nextDate?' · hẹn '+fmtDate(a.nextDate):''}</div></div>`).join('')}</div>`:'<p class="muted">Chưa ghi hoạt động hỗ trợ.</p>'}</div><div class="card"><h2>🕘 Lịch sử cập nhật chỉ số</h2>${cs.length?`<div class="timeline">${cs.map(c=>`<div class="timeline-item"><b>${fmtDate(c.date)} · ${esc(c.level)} (${c.points} điểm)</b><div>${esc(c.reason)}</div><div class="small muted">${c.absent}/${c.total} buổi vắng · Điểm ${c.grade===null?'chưa có':num(c.grade)} · Nợ ${money(c.debt)} · Vắng liên tiếp ${c.consecutive}</div></div>`).join('')}</div>`:'<p class="muted">Mẫu gốc chỉ có số tổng hợp; không có lịch sử thay đổi trước khi dùng app.</p>'}</div>`}

function reportPage(){let levels=['Cao','Trung bình','Thấp'],classes=[...new Set(db.students.map(s=>s.className))].sort();return hero('Báo cáo nguy cơ','Tổng hợp theo mức, theo lớp và các dấu hiệu để ưu tiên nguồn lực hỗ trợ.')+`<div class="grid">${metric('Học viên',num(db.students.length))}${metric('Cao',num(db.students.filter(s=>risk(s).level==='Cao').length))}${metric('Trung bình',num(db.students.filter(s=>risk(s).level==='Trung bình').length))}${metric('Thấp',num(db.students.filter(s=>risk(s).level==='Thấp').length))}${metric('Nợ học phí',money(sum(db.students,s=>s.debt)))}</div><div class="card"><div class="toolbar"><h2>Theo mức nguy cơ</h2><span class="grow"></span>${btn('⬇️ Excel','exportExcel','primary')}${btn('🖨️ In','print')}</div>${table(['Mức','Số học viên','Tổng nợ học phí','Tỷ lệ'],levels.map(l=>{let a=db.students.filter(s=>risk(s).level===l);return `<tr><td>${badge(l,levelKind(l))}</td><td class="num">${num(a.length)}</td><td class="num">${money(sum(a,s=>s.debt))}</td><td class="num">${db.students.length?num(a.length/db.students.length*100):0}%</td></tr>`}))}</div><div class="card"><h2>Theo lớp</h2>${table(['Lớp','Học viên','Cao','Trung bình','Thấp','Nợ học phí'],classes.map(c=>{let a=db.students.filter(s=>s.className===c);return `<tr><td>${esc(c)}</td><td class="num">${a.length}</td><td class="num">${a.filter(s=>risk(s).level==='Cao').length}</td><td class="num">${a.filter(s=>risk(s).level==='Trung bình').length}</td><td class="num">${a.filter(s=>risk(s).level==='Thấp').length}</td><td class="num">${money(sum(a,s=>s.debt))}</td></tr>`}),'Chưa có lớp.')}</div><div class="card"><h2>Dấu hiệu xuất hiện</h2><div class="summary-grid">${[['Tỷ lệ vắng từ mức 1',s=>rate(s)!==null&&rate(s)>=db.settings.absence1],['Điểm thấp',s=>s.grade!==null&&s.grade<db.settings.gradeBelow],['Có nợ học phí',s=>s.debt>0],['Vắng liên tiếp',s=>s.consecutive>=db.settings.consecutiveMin],['Chưa có điểm',s=>s.grade===null]].map(([lab,test])=>`<div class="summary-box"><small>${lab}</small><strong>${num(db.students.filter(test).length)}</strong></div>`).join('')}</div></div><div class="hint">Các dấu hiệu có thể cùng xuất hiện ở một học viên, nên không cộng số dấu hiệu để suy ra tổng người. Đây là công cụ sàng lọc nội bộ; người phụ trách cần xem bối cảnh từng em trước khi liên hệ gia đình.</div>`}
function settingsPage(){let q=db.settings;return hero('Ngưỡng cảnh báo','Có thể chỉnh ngưỡng theo cách theo dõi của trung tâm. Đổi ngưỡng sẽ tính lại mức hiện tại.')+`<div class="card"><div class="formgrid">${field('org','Tên trung tâm',q.org)}${field('asof','Ngày báo cáo (để trống = hôm nay)',q.asof,'date')}${field('absence1','Tỷ lệ vắng mức 1 (%)',q.absence1,'number')}${field('absence2','Tỷ lệ vắng mức 2 (%)',q.absence2,'number')}${field('gradeBelow','Điểm trung bình thấp dưới',q.gradeBelow,'number')}${field('consecutiveMin','Vắng liên tiếp từ (buổi)',q.consecutiveMin,'number')}${field('mediumAt','Nguy cơ trung bình từ (điểm)',q.mediumAt,'number')}${field('highAt','Nguy cơ cao từ (điểm)',q.highAt,'number')}</div><div class="toolbar" style="margin-top:16px">${btn('Lưu ngưỡng','saveSettings','primary')}</div></div><div class="hint">Công thức gốc: tỷ lệ vắng từ mức 1 cộng 1 điểm, từ mức 2 cộng 2; điểm dưới ngưỡng cộng 1; còn nợ học phí cộng 1; vắng liên tiếp đạt ngưỡng cộng 1. Tổng từ ngưỡng trung bình/cao quyết định mức. Chưa có điểm kiểm tra không bị tính là điểm 0.</div>`}
function dataPage(){return hero('Dữ liệu & sao lưu','Lưu bản sao để chuyển máy hoặc khôi phục khi đổi trình duyệt.')+`<div class="card"><h2>Xuất & nhập</h2><div class="data-actions">${btn('⬇️ Sao lưu JSON','backup','primary')}${btn('⬇️ HTML kèm dữ liệu','portable')}${btn('⬇️ Xuất Excel 3 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','restore')}${btn('⬆️ Nhập Excel','importExcel')}</div><p class="note">Excel có sheet Học viên, Lịch sử chỉ số và Nhật ký hỗ trợ; giữ nguyên ID và tên cột khi nhập lại. File sao lưu có thông tin trẻ em, phụ huynh và học phí ở dạng đọc được.</p></div><div class="card"><h2>Mẫu tham chiếu</h2><p>20 học viên, 456 buổi tổng hợp, 86 buổi vắng và 14.000.000 đồng học phí còn nợ. Theo ngưỡng gốc: 7 mức cao, 1 trung bình, 12 thấp. File mẫu không có số điện thoại hoặc nhật ký xử lý.</p>${btn('Nạp 20 học viên mẫu','loadDemo')}</div><div class="card"><h2>Xóa dữ liệu trên thiết bị</h2><p>Hãy sao lưu trước; thao tác xóa hồ sơ, lịch sử, hoạt động và cài đặt trong trình duyệt này.</p>${btn('Xóa toàn bộ','clear','danger')}</div>`}
function guidePage(){return hero('Hướng dẫn sử dụng','Theo dõi dấu hiệu và hỗ trợ từng học viên theo một quy trình rõ ràng.')+`<div class="card"><h2>1 · Nhập số liệu</h2><p>Mỗi học viên có mã, lớp, số buổi đã học, số vắng, điểm trung bình (có thể để trống nếu chưa có), học phí còn nợ và số buổi vắng liên tiếp gần nhất. Không nhập vắng nhiều hơn tổng buổi.</p><h2>2 · Đọc mức nguy cơ</h2><p>App áp dụng công thức điểm từ file tham chiếu. Mở hồ sơ để xem từng yếu tố cộng điểm. “Cao” là tín hiệu ưu tiên kiểm tra, không phải kết luận học viên chắc chắn bỏ học.</p><h2>3 · Ghi hỗ trợ</h2><p>Gọi phụ huynh, trao đổi học viên, bổ trợ học tập hoặc theo dõi chuyên cần; ghi nội dung và ngày hẹn tiếp. Hoạt động được giữ trong nhật ký. Rủi ro hiện tại chỉ đổi khi cập nhật số liệu hoặc ngưỡng.</p><h2>4 · Cập nhật và so sánh</h2><p>Đổi số buổi, điểm, công nợ hoặc số vắng liên tiếp cần lý do. Mỗi lần cập nhật tạo một dòng lịch sử gồm kết quả chấm điểm tại thời điểm đó.</p><h2>5 · Báo cáo & sao lưu</h2><p>Xem danh sách ưu tiên và báo cáo theo lớp. Sao lưu JSON hoặc HTML kèm dữ liệu để chuyển máy; Excel có thể nhập lại.</p></div><div class="hint">Nguồn đối chiếu: file “Cảnh báo sớm học viên có nguy cơ bỏ học” của Thầy Đạt Tin Học. App không tự kết nối sổ điểm danh, điểm số, học phí hoặc nhắn phụ huynh; dữ liệu cần được nhập và đối chiếu thủ công.</div>`}
const pages={dashboard:['Tổng quan',dashboard],students:['Học viên',studentsPage],detail:['Hồ sơ học viên',studentDetail],priorities:['Ưu tiên hỗ trợ',prioritiesPage],report:['Báo cáo',reportPage],settings:['Cài đặt',settingsPage],data:['Dữ liệu & sao lưu',dataPage],guide:['Hướng dẫn',guidePage]};
function render(){if(!pages[page])page='dashboard';$('#topTitle').textContent=pages[page][0];$('#topSub').textContent=db.settings.org||'Offline · Dữ liệu lưu trên thiết bị';$('#screen').innerHTML=pages[page][1]();$$('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')})}
function showModal(kind,id='',pref={}){draft={kind,id};let s=kind==='student'&&id?student(id):null;let title='',html='';if(kind==='student'){title=s?'Cập nhật học viên':'Thêm học viên';html=field('code','Mã học viên *',s?.code||'')+field('name','Họ tên *',s?.name||'')+field('className','Lớp *',s?.className||'')+field('parent','Phụ huynh / người liên hệ',s?.parent||'')+field('phone','Điện thoại',s?.phone||'')+field('caseStatus','Tình trạng hỗ trợ',s?.caseStatus||CASES[0],'text',CASES)+field('total','Tổng buổi đã học *',s?.total??0,'number')+field('absent','Số buổi vắng *',s?.absent??0,'number')+field('consecutive','Vắng liên tiếp gần nhất *',s?.consecutive??0,'number')+field('grade','Điểm trung bình (để trống nếu chưa có)',s?.grade??'','number')+field('debt','Học phí còn nợ',s?.debt??0,'number')+field('followupDate','Hẹn hỗ trợ tiếp theo',s?.followupDate||'','date')+field('note','Ghi chú',s?.note||'','textarea',null,'full')+(s?field('reason','Lý do cập nhật chỉ số','','textarea',null,'full'):'')}else if(kind==='action'){if(!db.students.length){alert('Hãy tạo học viên trước.');return}let s=student(pref.studentId||selected)||db.students[0];title='Ghi hoạt động hỗ trợ';html=field('studentId','Học viên *',s.id,'text',db.students.map(x=>[x.id,x.code+' · '+x.name]))+field('date','Ngày thực hiện *',today(),'date')+field('type','Hoạt động',ACTIONS[0],'text',ACTIONS)+field('owner','Người xử lý','')+field('caseStatus','Tình trạng hỗ trợ sau hoạt động',s.caseStatus,'text',CASES)+field('nextDate','Hẹn tiếp',s.followupDate||'','date')+field('summary','Nội dung / kết quả *','','textarea',null,'full')}
$('#modalTitle').textContent=title;$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('#editor').showModal();$('#modalFields input, #modalFields select')?.focus()}
const collect=()=>Object.fromEntries($$('#modalFields [name]').map(el=>[el.name,el.value.trim()]));
function modalError(msg){$('#modalError').textContent=msg;$('#modalError').scrollIntoView({block:'nearest'})}
function saveModal(){if(!draft)return;let f=collect(),id=draft.id;if(draft.kind==='student'){let code=f.code.toUpperCase(),total=Number(f.total),absent=Number(f.absent),consecutive=Number(f.consecutive),grade=f.grade===''?null:Number(f.grade),debt=Number(f.debt),old=id?student(id):null;if(!/^[A-Z0-9_-]{2,24}$/.test(code)||db.students.some(s=>s.code===code&&s.id!==id))return modalError('Mã học viên cần 2–24 ký tự A–Z, số, _ hoặc - và không trùng.');if(!f.name||f.name.length>120||!f.className||f.className.length>120||!CASES.includes(f.caseStatus)||!validDate(f.followupDate))return modalError('Tên, lớp, ngày hẹn hoặc tình trạng hỗ trợ không hợp lệ.');if(f.phone&&!/^[0-9+().\s-]{8,30}$/.test(f.phone))return modalError('Số điện thoại cần 8–30 ký tự hợp lệ.');if(!Number.isSafeInteger(total)||total<0||!Number.isSafeInteger(absent)||absent<0||absent>total||!Number.isSafeInteger(consecutive)||consecutive<0||consecutive>absent)return modalError('Số buổi phải nguyên không âm; vắng ≤ tổng; vắng liên tiếp ≤ số vắng.');if(grade!==null&&(!Number.isFinite(grade)||grade<0||grade>10)||!Number.isSafeInteger(debt)||debt<0)return modalError('Điểm trung bình phải từ 0 đến 10 hoặc để trống; công nợ không âm.');let changed=old&&['total','absent','consecutive','grade','debt'].some(k=>old[k]!==({total,absent,consecutive,grade,debt})[k]);let oldCase=old?.caseStatus,caseChanged=old&&oldCase!==f.caseStatus;if((changed||caseChanged)&&!f.reason)return modalError('Nhập lý do khi cập nhật chỉ số hoặc tình trạng hỗ trợ.');let rec={id:id||uid(),code,name:f.name,className:f.className,parent:f.parent.slice(0,120),phone:f.phone,caseStatus:f.caseStatus,total,absent,consecutive,grade,debt,followupDate:f.followupDate,note:f.note.slice(0,1000)};if(old)Object.assign(old,rec);else db.students.push(rec);if(caseChanged)db.actions.push({id:uid(),studentId:rec.id,date:today(),type:"Khác",owner:"",summary:"Đổi tình trạng hỗ trợ: "+oldCase+" → "+rec.caseStatus+". "+f.reason.slice(0,500),nextDate:rec.followupDate,caseStatus:rec.caseStatus});if(changed){let r=risk(rec);db.checks.push({id:uid(),studentId:rec.id,date:today(),total,absent,consecutive,grade,debt,points:r.points,level:r.level,reason:f.reason.slice(0,500),rules:clone(db.settings)})}selected=rec.id;page='detail'}else if(draft.kind==='action'){let s=student(f.studentId);if(!s||!validDate(f.date)||!f.date||f.date>today()||!validDate(f.nextDate)||!ACTIONS.includes(f.type)||!CASES.includes(f.caseStatus)||!f.summary)return modalError('Chọn học viên, ngày, loại hoạt động và nhập kết quả.');db.actions.push({id:uid(),studentId:s.id,date:f.date,type:f.type,owner:f.owner.slice(0,120),summary:f.summary.slice(0,1000),nextDate:f.nextDate,caseStatus:f.caseStatus});s.caseStatus=f.caseStatus;s.followupDate=f.nextDate;selected=s.id;page='detail'}$('#editor').close();draft=null;save()}
function loadDemo(){if((db.students.length||db.checks.length||db.actions.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty();for(let [i,r] of DROPOUT_SAMPLE.hv.entries())x.students.push({id:uid(),code:'HV'+String(i+1).padStart(3,'0'),name:r[0],className:r[1],parent:'',phone:'',total:r[2],absent:r[3],grade:r[4],debt:r[5],consecutive:r[6],caseStatus:'Chưa xử lý',followupDate:'',note:'Dữ liệu mẫu gốc; chưa có lịch sử xử lý hoặc số điện thoại.'});db=x;page='dashboard';save()}

const H_STUDENT=['ID','Mã học viên','Họ tên','Lớp','Phụ huynh','Điện thoại','Tổng buổi','Số vắng','Vắng liên tiếp','Điểm TB','Nợ học phí','Tình trạng hỗ trợ','Hẹn tiếp','Ghi chú'];
const H_CHECK=['ID','ID học viên','Ngày','Tổng buổi','Số vắng','Vắng liên tiếp','Điểm TB','Nợ học phí','Điểm nguy cơ','Mức nguy cơ','Lý do','Ngưỡng tại thời điểm'];
const H_ACTION=['ID','ID học viên','Ngày','Hoạt động','Người xử lý','Nội dung','Hẹn tiếp','Tình trạng hỗ trợ'];
function exportExcel(){let sheets=[{name:'Hoc vien',rows:[H_STUDENT,...db.students.map(s=>[s.id,s.code,s.name,s.className,s.parent,s.phone,s.total,s.absent,s.consecutive,s.grade??'',s.debt,s.caseStatus,s.followupDate,s.note])]},{name:'Lich su chi so',rows:[H_CHECK,...db.checks.map(c=>[c.id,c.studentId,c.date,c.total,c.absent,c.consecutive,c.grade??'',c.debt,c.points,c.level,c.reason,JSON.stringify(c.rules)])]},{name:'Nhat ky ho tro',rows:[H_ACTION,...db.actions.map(a=>[a.id,a.studentId,a.date,a.type,a.owner,a.summary,a.nextDate,a.caseStatus])]}];download(Excel.workbook(sheets),'canh-bao-hoc-vien-bo-hoc.xlsx')}
const sheetDate=v=>typeof v==='number'&&Number.isFinite(v)?new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toISOString().slice(0,10):String(v||'').trim();
function fromExcel(book){let a=book['Hoc vien'],b=book['Lich su chi so'],c=book['Nhat ky ho tro'];if(!a||!b||!c)throw Error('Thiếu một trong ba sheet của app.');let same=(r,h)=>h.every((x,i)=>String(r?.[i]??'')===x);if(!same(a[0],H_STUDENT)||!same(b[0],H_CHECK)||!same(c[0],H_ACTION))throw Error('Tên cột Excel không khớp file do app xuất.');let x=empty();x.settings=clone(db.settings);for(let r of a.slice(1)){if(!String(r[0]||'').trim())continue;x.students.push({id:String(r[0]),code:String(r[1]),name:String(r[2]),className:String(r[3]),parent:String(r[4]||''),phone:String(r[5]||''),total:Number(r[6]),absent:Number(r[7]),consecutive:Number(r[8]),grade:r[9]===''||r[9]===undefined?null:Number(r[9]),debt:Number(r[10]),caseStatus:String(r[11]),followupDate:sheetDate(r[12]),note:String(r[13]||'')})}for(let r of b.slice(1)){if(!String(r[0]||'').trim())continue;x.checks.push({id:String(r[0]),studentId:String(r[1]),date:sheetDate(r[2]),total:Number(r[3]),absent:Number(r[4]),consecutive:Number(r[5]),grade:r[6]===''||r[6]===undefined?null:Number(r[6]),debt:Number(r[7]),points:Number(r[8]),level:String(r[9]),reason:String(r[10]),rules:JSON.parse(String(r[11]||'{}'))})}for(let r of c.slice(1)){if(!String(r[0]||'').trim())continue;x.actions.push({id:String(r[0]),studentId:String(r[1]),date:sheetDate(r[2]),type:String(r[3]),owner:String(r[4]||''),summary:String(r[5]),nextDate:sheetDate(r[6]),caseStatus:String(r[7])})}let err=validate(x);if(err)throw Error(err);return x}
function act(name,d){if(name==='newStudent')showModal('student');else if(name==='editStudent')showModal('student',d.id);else if(name==='openStudent'){selected=d.id;page='detail';render()}else if(name==='goStudents'){page='students';render()}else if(name==='deleteStudent'){let s=student(d.id);if(db.checks.some(c=>c.studentId===d.id)||db.actions.some(a=>a.studentId===d.id))return alert('Hồ sơ đã có lịch sử hoặc hoạt động; không thể xóa. Hãy lưu trữ bản sao và quản lý theo quy trình của trung tâm.');if(confirm('Xóa học viên '+s.name+'?')){db.students=db.students.filter(x=>x.id!==d.id);page='students';save()}}else if(name==='newAction')showModal('action','',{studentId:d.sid||selected});else if(name==='clearFilters'){query='';classFilter='';levelFilter='';caseFilter='';render()}else if(name==='goPriorities'){page='priorities';render()}else if(name==='goReport'){page='report';render()}else if(name==='goData'){page='data';render()}else if(name==='saveSettings'){let q={org:$('#f_org').value.trim(),asof:$('#f_asof').value,absence1:Number($('#f_absence1').value),absence2:Number($('#f_absence2').value),gradeBelow:Number($('#f_gradeBelow').value),consecutiveMin:Number($('#f_consecutiveMin').value),mediumAt:Number($('#f_mediumAt').value),highAt:Number($('#f_highAt').value)};let trial={...db,settings:q},err=validate(trial);if(err)return alert(err);db.settings=q;save()}else if(name==='backup')backup();else if(name==='portable')portable();else if(name==='exportExcel')exportExcel();else if(name==='restore')$('#jsonFile').click();else if(name==='importExcel')$('#excelFile').click();else if(name==='loadDemo')loadDemo();else if(name==='clear'){if(confirm('Xóa toàn bộ học viên, lịch sử, hoạt động và cài đặt trên thiết bị này?')){db=empty();selected='';page='dashboard';save()}}else if(name==='print')window.print()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}let b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='classFilter'){classFilter=e.target.value;render()}else if(e.target.id==='levelFilter'){levelFilter=e.target.value;render()}else if(e.target.id==='caseFilter'){caseFilter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let p=$('#screen .table-wrap');if(page==='students'&&p)p.outerHTML=table(['Học viên','Lớp','Buổi học','Vắng / tỷ lệ','Điểm TB','Vắng liên tiếp','Nợ học phí','Nguy cơ','Hỗ trợ / hẹn','Thao tác'],studentRows(filtered().slice(0,200)),'Chưa có học viên phù hợp.')}});
$('#modalSave').addEventListener('click',saveModal);$('#modalClose').addEventListener('click',()=>$('#editor').close());$('#modalCancel').addEventListener('click',()=>$('#editor').close());$('#quickPrint').addEventListener('click',()=>window.print());
$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>15e6)throw Error('File JSON vượt 15 MB.');let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm(`Khôi phục ${x.students.length} học viên, ${x.checks.length} lần đánh giá và ${x.actions.length} hoạt động? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{let x=fromExcel(await Excel.read(f));if(!confirm(`Nhập ${x.students.length} học viên, ${x.checks.length} lần đánh giá và ${x.actions.length} hoạt động từ Excel? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
window.__DROPOUT_TEST__={empty,validate,rate,risk,loadDemo,fromExcel,getDB:()=>db,setDB:x=>{db=x;render()},go:p=>{page=p;render()}};
render();
</script></body></html>
