function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!Number.isInteger(x.settings.warnDays)||x.settings.warnDays<0||x.settings.warnDays>365||!Number.isInteger(x.settings.suaMax)||x.settings.suaMax<1||x.settings.suaMax>999||!Array.isArray(x.machines)||!Array.isArray(x.services)||!Array.isArray(x.audit))return 'Cấu trúc/cài đặt không hợp lệ.';

let sids=new Set();for(let s of x.services){if(!s.id||sids.has(s.id)||!ids.has(s.machineId)||!dateOK(s.date)||!['Định kỳ','Sửa chữa đột xuất'].includes(s.type)||!Number.isSafeInteger(s.cost)||s.cost<0||!Number.isFinite(s.hours)||s.hours<0||s.hours>24||typeof s.updatesSchedule!=='boolean'||typeof s.voided!=='boolean'||s.voided&&!s.voidReason||String(s.note||'').length>1500)return 'Nhật ký bảo trì không hợp lệ.';sids.add(s.id)}
let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký thao tác không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function embedded(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=embedded(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let v=validate(db);if(v){alert('Không lưu được: '+v);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ trình duyệt không lưu được. Hãy xuất JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,reason='',machineId=''){db.audit.push({id:uid(),at:new Date().toISOString(),action,reason,machineId})}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function tag(m){let d=remaining(m),w=sourceWarning(m);return `<span class="tag ${d<0?'over':d<=db.settings.warnDays?'soon':w?'watch':''}">${esc(w||'Theo lịch')}</span>`}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function head(kicker,title,sub,actions=''){return `<div class="section-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div><div class="actions no-print">${actions}</div></div>`}
function metrics(){let s=summary();return `<div class="metricbar"><div><small>Máy đang theo dõi</small><strong>${s.machines}</strong><span>danh mục thiết bị</span></div><div><small>Quá hạn</small><strong>${s.overdue}</strong><span>cần ưu tiên</span></div><div><small>Đến hạn trong ${db.settings.warnDays} ngày</small><strong>${s.soon}</strong><span>lên lịch trước</span></div><div><small>Chi phí đã ghi</small><strong>${money(s.cost)}</strong><span>${s.services} lượt</span></div><div><small>Giờ máy dừng</small><strong>${num(s.hours)}</strong><span>giờ từ nhật ký</span></div></div>`}
function calendar(){let y=+month.slice(0,4),mo=+month.slice(5,7),first=new Date(y,mo-1,1),start=(first.getDay()+6)%7,last=new Date(y,mo,0).getDate(),cells=Math.ceil((start+last)/7)*7,items=[];for(let i=0;i<cells;i++){let day=i-start+1,date=new Date(y,mo-1,day),iso=date.toLocaleDateString('sv-SE'),on=day>=1&&day<=last;let mm=db.machines.filter(m=>due(m)===iso);items.push(`<div class="day ${on?'':'out'} ${iso===db.settings.asof?'today':''}"><strong>${date.getDate()}</strong>${mm.slice(0,3).map(m=>`<button class="event ${remaining(m)<0?'over':remaining(m)<=db.settings.warnDays?'soon':'future'}" data-act="openMachine" data-id="${esc(m.id)}" title="${esc(m.code+' · '+m.name)}">${esc(m.code)} · ${esc(m.name)}</button>`).join('')}${mm.length>3?`<small>+${mm.length-3} máy</small>`:''}</div>`)}return `<div class="calendar-head"><h2>🗓️ Lịch ${mo}/${y}</h2><div class="calendar-tools">${btn('‹','prevMonth','small')}<strong>${month}</strong>${btn('›','nextMonth','small')}${btn('Hôm nay','thisMonth','small')}</div></div><div class="cal-grid">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="cal-label">${x}</div>`).join('')}${items.join('')}</div><div class="legend"><span><i class="dot red"></i>Quá hạn</span><span><i class="dot gold"></i>Sắp hạn</span><span><i class="dot"></i>Theo lịch</span></div>`}
function calendarPage(){let upcoming=db.machines.slice().sort((a,b)=>due(a).localeCompare(due(b)));return `${head('Lịch thiết bị · AI Mở','Lịch bảo trì & nhắc hạn','Bắt đầu từ lịch. Chọn một máy để xem lịch sử và ghi lần bảo trì tiếp theo.',btn('＋ Ghi bảo trì','newService','primary')+btn('＋ Thêm máy','newMachine','brass'))}${metrics()}<div class="grid">${card('',calendar())}<aside>${card('🔔 Cần xử lý',upcoming.length?upcoming.slice(0,8).map(m=>`<div class="mini"><button class="link" data-act="openMachine" data-id="${esc(m.id)}">${esc(m.code)} · ${esc(m.name)}</button><small>${tag(m)} · hạn ${fmt(due(m))} · ${remaining(m)<0?`trễ ${-remaining(m)} ngày`: `còn ${remaining(m)} ngày`}</small></div>`).join(''):'<p>Chưa có máy. Hãy thêm máy hoặc nạp mẫu.</p>')}${card('📌 Quy tắc lịch',`<p>Hạn tiếp theo = lần bảo trì định kỳ gần nhất + chu kỳ ngày. Sửa chữa đột xuất không tự dời lịch.</p><p class="note">Ngày đối chiếu: ${fmt(db.settings.asof)}. Lịch mẫu có thể có nhật ký sau ngày gốc; app đánh dấu để kiểm tra, không tự sửa dữ liệu nguồn.</p>`)}</aside></div>`}
function machinesPage(){let rows=db.machines.filter(m=>(filter==='all'||(filter==='over'&&remaining(m)<0)||(filter==='soon'&&remaining(m)>=0&&remaining(m)<=db.settings.warnDays)||(filter==='repair'&&serviceStats(m).repairs>=db.settings.suaMax))&&(!search||[m.code,m.name].join(' ').toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>due(a).localeCompare(due(b)));return `${head('Tài sản & chu kỳ','Danh mục máy móc','Xem hạn, tổng chi phí và lịch sử từng máy.',btn('＋ Thêm máy','newMachine','primary'))}${card('Danh sách thiết bị',`<div class="filters"><label>Tìm mã hoặc tên<input id="search" value="${esc(search)}" placeholder="MC01, máy cắt..."></label><label>Tình trạng<select id="filter"><option value="all" ${filter==='all'?'selected':''}>Tất cả</option><option value="over" ${filter==='over'?'selected':''}>Quá hạn</option><option value="soon" ${filter==='soon'?'selected':''}>Sắp hạn</option><option value="repair" ${filter==='repair'?'selected':''}>Sửa nhiều</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Máy</th><th>Chu kỳ</th><th>Định kỳ gần nhất</th><th>Hạn tới</th><th>Còn ngày</th><th>Chi phí</th><th>Giờ dừng</th><th>Sửa đột xuất</th><th>Cảnh báo</th></tr></thead><tbody>${rows.map(m=>{let s=serviceStats(m);return `<tr><td><button class="link" data-act="openMachine" data-id="${esc(m.id)}">${esc(m.code)}</button><small>${esc(m.name)}</small></td><td>${m.cycle} ngày</td><td>${fmt(lastPeriodic(m))}</td><td>${fmt(due(m))}</td><td>${remaining(m)}</td><td>${money(s.cost)}</td><td>${num(s.hours)}</td><td>${s.repairs}</td><td>${tag(m)}</td></tr>`}).join('')||'<tr><td colspan="9">Chưa có máy phù hợp.</td></tr>'}</tbody></table></div>`)}`}
function serviceRows(rows){return `<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Máy</th><th>Loại</th><th>Chi phí</th><th>Dừng máy</th><th>Người thực hiện</th><th>Chứng từ / ghi chú</th><th></th></tr></thead><tbody>${rows.map(s=>{let m=machine(s.machineId);return `<tr><td>${fmt(s.date)}</td><td><button class="link" data-act="openMachine" data-id="${esc(m.id)}">${esc(m.code)}</button></td><td>${esc(s.type)}${s.updatesSchedule?'<small>Cập nhật lịch tiếp theo</small>':''}</td><td>${money(s.cost)}</td><td>${num(s.hours)} giờ</td><td>${esc(s.actor||'—')}</td><td>${esc(s.doc||'—')}<small>${esc(s.note||'')}</small></td><td class="no-print">${s.sourceRow?'':btn('Hủy ghi nhận','voidService','small danger',s.id)}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có lượt bảo trì.</td></tr>'}</tbody></table></div>`}
function servicesPage(){let rows=activeServices().slice().sort((a,b)=>b.date.localeCompare(a.date));return `${head('Nhật ký công việc','Bảo trì & sửa chữa','Mọi chi phí và giờ dừng lấy từ nhật ký. Ghi sửa chữa đột xuất không dời lịch định kỳ.',btn('＋ Ghi lượt bảo trì','newService','primary'))}${metrics()}${card('20 dòng mẫu nguồn + các phát sinh',serviceRows(rows))}`}
function machinePage(){let m=machine(selected);if(!m){page='machines';return machinesPage()}let s=serviceStats(m),ww=warnings(m);return `${head('Chi tiết thiết bị',`${esc(m.code)} · ${esc(m.name)}`,`Hạn tiếp theo ${fmt(due(m))} · ${remaining(m)<0?`trễ ${-remaining(m)} ngày`:`còn ${remaining(m)} ngày`}`,btn('＋ Ghi bảo trì','newService','primary',m.id)+btn('Sửa hồ sơ','editMachine','',m.id)+btn('🖨️ In','print'))}<div class="metricbar"><div><small>Chu kỳ</small><strong>${m.cycle} ngày</strong></div><div><small>Định kỳ gần nhất</small><strong>${fmt(lastPeriodic(m))}</strong></div><div><small>Tổng chi phí</small><strong>${money(s.cost)}</strong></div><div><small>Giờ dừng</small><strong>${num(s.hours)}</strong></div><div><small>Sửa đột xuất</small><strong>${s.repairs}</strong></div></div><div class="grid">${card('📑 Hồ sơ & cảnh báo',`<dl><dt>Ngày gốc từ hồ sơ</dt><dd>${fmt(m.baselineLast)}</dd><dt>Hạn theo chu kỳ</dt><dd>${fmt(due(m))}</dd><dt>Ngưỡng nhắc trước</dt><dd>${db.settings.warnDays} ngày</dd><dt>Ghi chú</dt><dd>${esc(m.note||'—')}</dd></dl>${ww.length?`<ul>${ww.map(w=>`<li class="warn">${esc(w)}</li>`).join('')}</ul>`:'<p class="success">Không có cảnh báo.</p>'}<p class="note">Cảnh báo ưu tiên như nguồn: quá hạn → sắp hạn → sửa nhiều. App còn hiển thị mọi vấn đề riêng để không che khuất.</p>`)}${card('🕘 Thao tác gần đây',db.audit.filter(a=>a.machineId===m.id).slice(-8).reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.reason||'—')}</small></div>`).join('')||'<p>Chưa có thao tác.</p>')}</div>${card('📋 Nhật ký máy',serviceRows(servicesFor(m.id).slice().sort((a,b)=>b.date.localeCompare(a.date))))}`}
function reportPage(){let s=summary(),rows=db.machines.slice().sort((a,b)=>serviceStats(b).cost-serviceStats(a).cost);return `${head('Phân tích vận hành','Báo cáo bảo trì','Đọc chi phí, giờ dừng và tỷ trọng sửa chữa theo từng máy.',btn('⬇ Excel','exportExcel','primary')+btn('🖨️ In báo cáo','print'))}${metrics()}<div class="grid">${card('Chi phí theo máy',rows.map(m=>{let v=serviceStats(m).cost,max=Math.max(1,...rows.map(z=>serviceStats(z).cost));return `<div class="mini"><b>${esc(m.code)} · ${esc(m.name)}</b><small>${money(v)} · ${num(serviceStats(m).hours)} giờ dừng</small><div style="height:9px;background:#e8eee4;border-radius:8px;margin-top:7px"><i style="display:block;background:#ba9b59;height:100%;width:${100*v/max}%;border-radius:8px"></i></div></div>`}).join('')||'<p>Chưa có máy.</p>')}${card('Cơ cấu lượt bảo trì',`<p><b>Định kỳ:</b> ${s.services-s.repairs} lượt · ${money(activeServices().filter(a=>a.type==='Định kỳ').reduce((n,a)=>n+a.cost,0))}</p><p><b>Sửa chữa đột xuất:</b> ${s.repairs} lượt · ${money(activeServices().filter(a=>a.type==='Sửa chữa đột xuất').reduce((n,a)=>n+a.cost,0))}</p><p class="note">Ngưỡng sửa nhiều mặc định ${db.settings.suaMax} lần là quy ước quản trị nội bộ.</p>`)}</div>`}
function settingsPage(){return `${head('Thông số quản trị','Cài đặt cảnh báo','Thay đổi ngưỡng làm cập nhật cảnh báo, không sửa nhật ký cũ.')}${card('Ngưỡng & ngày đối chiếu',`<form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input name="asof" type="date" value="${esc(db.settings.asof)}" required></label><label>Nhắc trước (ngày)<input name="warnDays" type="number" min="0" max="365" value="${db.settings.warnDays}" required></label><label>Sửa đột xuất từ (lần)<input name="suaMax" type="number" min="1" max="999" value="${db.settings.suaMax}" required></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form>`)}`}
function dataPage(){return `${head('An toàn dữ liệu','Sao lưu & khôi phục','Dữ liệu nằm trên thiết bị. Xuất bản sao để chuyển máy hoặc tránh mất dữ liệu.') }<div class="grid">${card('⬇ Xuất bản sao',`<p>JSON giữ đầy đủ hồ sơ và nhật ký. HTML kèm dữ liệu có thể mở trên máy khác. Excel để đối chiếu.</p><div class="actions">${btn('Tải JSON','exportJSON','primary')}${btn('Tải HTML kèm dữ liệu','exportHTML')}${btn('Tải Excel','exportExcel')}</div>`)}${card('⬆ Nhập / mẫu',`<p>Nhập JSON hoặc nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại; hãy sao lưu trước.</p><div class="actions">${btn('Nhập JSON','importJSON')}${btn('Nạp 8 máy · 20 lượt mẫu','loadSample')}${btn('Xóa dữ liệu','clearData','danger')}</div>`)}</div>${card('Phiên bản dữ liệu',`<p>v${VERSION} · ${db.machines.length} máy · ${activeServices().length} lượt đang hiệu lực. Không kết nối API, máy chủ hoặc tài khoản.</p>`)}`}
function guidePage(){return `${head('Cách sử dụng','Hướng dẫn nhanh','Một lịch có ích khi ngày gốc, chu kỳ và các lượt bảo trì được cập nhật đúng.')}${card('Quy trình',`<ol><li>Thêm máy: mã, tên, chu kỳ ngày và ngày bảo trì định kỳ gần nhất.</li><li>Xem lịch tháng hoặc danh mục để biết máy quá hạn/sắp hạn.</li><li>Ghi lượt bảo trì. Chọn “Định kỳ” để app tự cập nhật hạn; sửa chữa đột xuất không đổi chu kỳ.</li><li>Ghi chi phí, giờ máy dừng, người thực hiện, chứng từ và kết quả.</li><li>Kiểm tra báo cáo và sao lưu JSON/HTML sau mỗi đợt nhập liệu.</li></ol><p>Để sửa lượt ghi nhầm, dùng “Hủy ghi nhận” và nêu lý do; nhật ký thao tác vẫn được giữ.</p>`)}${card('Giới hạn nguồn mẫu',`<p>File gốc có 8 máy và 20 dòng bảo trì. Ngày bảo trì gần nhất trong bảng máy không phải lúc nào cũng trùng với nhật ký định kỳ; app giữ nguyên cả hai để đối chiếu. Các lượt mẫu không tự dời lịch. Khi ghi lượt định kỳ mới trong app, lịch sẽ cập nhật.</p><p>Đây là nhắc việc nội bộ. Thiết bị cần kiểm định an toàn theo quy định riêng phải theo hồ sơ/quy trình chính thức.</p>`)}`}
function render(){let views={calendar:calendarPage,machines:machinesPage,services:servicesPage,machine:machinePage,report:reportPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML=(views[page]||calendarPage)();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='machine'&&b.dataset.page==='machines'))}
function fld(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function area(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1500">${esc(value)}</textarea></label>`}
function select(label,name,items,selected=''){return `<label>${label}<select name="${name}" required>${items.map(([v,t])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function showForm(kind,id=''){draft={kind,id};let title='',fields='';if(kind==='machine'){let m=machine(id)||{};title=id?'Sửa hồ sơ máy':'Thêm máy';fields=fld('Mã máy *','code',m.code,'text','required maxlength="40"')+fld('Tên máy *','name',m.name,'text','required maxlength="160"')+fld('Chu kỳ định kỳ (ngày) *','cycle',m.cycle||90,'number','required min="1" max="3650" step="1"')+fld('Ngày định kỳ gốc *','baselineLast',m.baselineLast||today(),'date','required')+area('Ghi chú / vị trí / người phụ trách','note',m.note)}
 else if(kind==='service'){if(!db.machines.length){alert('Thêm máy trước khi ghi lượt bảo trì.');return}let selectedId=id||selected||db.machines[0].id;title='Ghi lượt bảo trì';fields=select('Máy *','machineId',db.machines.map(m=>[m.id,m.code+' · '+m.name]),selectedId)+fld('Ngày thực hiện *','date',today(),'date','required')+select('Loại *','type',[['Định kỳ','Định kỳ'],['Sửa chữa đột xuất','Sửa chữa đột xuất']],'Định kỳ')+fld('Chi phí (₫) *','cost',0,'number','required min="0" step="1"')+fld('Giờ máy dừng *','hours',0,'number','required min="0" max="24" step="0.01"')+fld('Người thực hiện','actor','','text','maxlength="100"')+fld('Chứng từ / biên bản','doc','','text','maxlength="100"')+area('Kết quả / vật tư thay thế / lưu ý','note','')+`<label class="full"><span><input type="checkbox" name="updatesSchedule" checked style="width:auto;margin-right:6px">Lượt định kỳ hoàn tất: cập nhật ngày gốc cho lịch tiếp theo</span></label><p class="full note">Checkbox chỉ áp dụng cho loại Định kỳ; sửa chữa đột xuất không dời lịch.</p>`}
 $('#modalTitle').textContent=title;$('#fields').innerHTML=fields;$('#formError').textContent='';$('#editor').showModal()}
function fv(f,k){return String(new FormData(f).get(k)||'').trim()}
function submitForm(e){e.preventDefault();let f=e.target,{kind,id}=draft,before=clone(db);try{if(kind==='machine'){let code=fv(f,'code'),name=fv(f,'name'),cycle=Number(fv(f,'cycle')),baselineLast=fv(f,'baselineLast');if(!code||!name||!Number.isInteger(cycle)||cycle<1||cycle>3650||!dateOK(baselineLast))throw Error('Cần mã, tên, chu kỳ và ngày gốc hợp lệ.');if(db.machines.some(m=>m.id!==id&&m.code.toUpperCase()===code.toUpperCase()))throw Error('Mã máy đã tồn tại.');let m=machine(id),obj={code,name,cycle,baselineLast,note:fv(f,'note')};if(m)Object.assign(m,obj);else{m={id:uid(),...obj};db.machines.push(m)}selected=m.id;page='machine';audit(id?'Sửa hồ sơ máy':'Thêm máy',code,m.id)}
 else if(kind==='service'){let machineId=fv(f,'machineId'),m=machine(machineId),date=fv(f,'date'),type=fv(f,'type'),cost=Number(fv(f,'cost')),hours=Number(fv(f,'hours')),updatesSchedule=type==='Định kỳ'&&new FormData(f).has('updatesSchedule');if(!m||!dateOK(date)||!['Định kỳ','Sửa chữa đột xuất'].includes(type)||!Number.isSafeInteger(cost)||cost<0||!Number.isFinite(hours)||hours<0||hours>24)throw Error('Kiểm tra máy, ngày, loại, chi phí và giờ dừng.');if(updatesSchedule&&date<lastPeriodic(m))throw Error('Ngày định kỳ mới phải từ ngày định kỳ gần nhất trở đi.');db.services.push({id:uid(),machineId,date,type,cost,hours,actor:fv(f,'actor'),doc:fv(f,'doc'),note:fv(f,'note'),updatesSchedule,voided:false,voidReason:'',sourceRow:null});audit('Ghi '+type,`${fmt(date)} · ${money(cost)} · ${num(hours)} giờ`,machineId);selected=machineId;page='machine'}let v=validate(db);if(v)throw Error(v);$('#editor').close();draft=null;save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'lich-bao-tri-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'lich-bao-tri-kem-du-lieu.html')}
function sheets(){return[{name:'MayMoc',rows:[['Mã','Tên','Chu kỳ ngày','Ngày gốc','Định kỳ gần nhất','Hạn tới','Còn ngày','Chi phí','Giờ dừng','Sửa đột xuất','Cảnh báo'],...db.machines.map(m=>{let s=serviceStats(m);return[m.code,m.name,m.cycle,m.baselineLast,lastPeriodic(m),due(m),remaining(m),s.cost,s.hours,s.repairs,warnings(m).join('; ')]})]},{name:'NhatKy',rows:[['Ngày','Mã máy','Loại','Chi phí','Giờ dừng','Người thực hiện','Chứng từ','Ghi chú','Cập nhật lịch','Hủy','Lý do hủy','Dòng mẫu'],...db.services.map(s=>[s.date,machine(s.machineId)?.code||'',s.type,s.cost,s.hours,s.actor,s.doc,s.note,s.updatesSchedule?'Có':'Không',s.voided?'Có':'Không',s.voidReason,s.sourceRow??''])]},{name:'LichHienTai',rows:[['Mã máy','Tên','Hạn','Còn ngày','Cảnh báo'],...db.machines.slice().sort((a,b)=>due(a).localeCompare(due(b))).map(m=>[m.code,m.name,due(m),remaining(m),warnings(m).join('; ')])]},{name:'ThaoTac',rows:[['Thời điểm','Thao tác','Lý do','Mã máy'],...db.audit.map(a=>[a.at,a.action,a.reason,machine(a.machineId)?.code||''])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Nhắc trước ngày','Sửa từ lần'],[db.settings.asof,db.settings.warnDays,db.settings.suaMax]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'lich-bao-tri-bao-cao.xlsx')}
function sampleData(){let x=empty(),relative=s=>addDays(today(),Number(s.slice(1)));for(let [code,name,cycle,date] of MAINTENANCE_SAMPLE.may)x.machines.push({id:uid(),code,name,cycle,baselineLast:relative(date),note:'Dữ liệu mẫu tham chiếu'});for(let i=0;i<MAINTENANCE_SAMPLE.bt.length;i++){let [date,code,type,cost,hours]=MAINTENANCE_SAMPLE.bt[i],m=x.machines.find(m=>m.code===code);x.services.push({id:uid(),machineId:m.id,date:relative(date),type,cost,hours,actor:'',doc:'',note:'Giữ nguyên dòng mẫu; không tự dời ngày gốc.',updatesSchedule:false,voided:false,voidReason:'',sourceRow:i+1})}return x}
function changeMonth(n){let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+n);month=d.toLocaleDateString('sv-SE').slice(0,7);render()}
function act(action,id=''){if(['calendar','machines','services','report','settings','data','guide'].includes(action)){page=action;render();return}if(action==='openMachine'){selected=id;page='machine';render();return}if(action==='prevMonth')return changeMonth(-1);if(action==='nextMonth')return changeMonth(1);if(action==='thisMonth'){month=db.settings.asof.slice(0,7);render();return}if(action==='newMachine')return showForm('machine');if(action==='editMachine')return showForm('machine',id);if(action==='newService')return showForm('service',id);if(action==='print')return print();if(action==='saveSettings'){let f=$('#settingsForm'),asof=f.elements.asof.value,warnDays=Number(f.elements.warnDays.value),suaMax=Number(f.elements.suaMax.value);if(!dateOK(asof)||!Number.isInteger(warnDays)||warnDays<0||warnDays>365||!Number.isInteger(suaMax)||suaMax<1||suaMax>999)return alert('Cài đặt không hợp lệ.');db.settings={asof,warnDays,suaMax};save();return}if(action==='voidService'){let s=db.services.find(s=>s.id===id);if(!s||s.sourceRow)return;let reason=prompt('Lý do hủy ghi nhận (không xóa khỏi nhật ký):');if(!reason?.trim())return;s.voided=true;s.voidReason=reason.trim();audit('Hủy lượt bảo trì',reason.trim(),s.machineId);save();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if(db.machines.length&& !confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;let x=sampleData(),v=validate(x);if(v)return alert('Dữ liệu mẫu lỗi: '+v);db=x;month=today().slice(0,7);page='calendar';save();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên thiết bị này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='calendar';save()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#form').addEventListener('submit',submitForm);$('#closeModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),v=validate(x);if(v)throw Error(v);if(!confirm('Nhập JSON sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;db=x;page='calendar';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}});render();
</script></body></html>
