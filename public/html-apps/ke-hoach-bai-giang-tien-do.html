function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function stats(){let n=db.items.length,done=db.items.filter(r=>r.status!=='Chưa dạy'),total=db.items.reduce((s,r)=>s+r.periods,0),taught=done.reduce((s,r)=>s+r.actualPeriods,0);return {n,done:done.length,remaining:n-done.length,total,taught,percent:n?Math.round(done.length/n*100):0,late:db.items.filter(warn).length}}
function metrics(){let s=stats();return `<div class="metrics"><div><small>Bài trong kế hoạch</small><strong>${s.n}</strong></div><div><small>Đã dạy / dạy bù</small><strong>${s.done}</strong></div><div><small>Tiến độ theo bài</small><strong>${s.percent}%</strong></div><div><small>Tiết kế hoạch / thực dạy</small><strong>${s.total} / ${s.taught}</strong></div><div><small>Chậm hoặc quá hạn</small><strong>${s.late}</strong></div></div>`}
function home(){let near=db.items.filter(r=>r.status==='Chưa dạy'&&days(r.planDate,db.settings.asof)>=0&&days(r.planDate,db.settings.asof)<=7).sort((a,b)=>a.planDate.localeCompare(b.planDate)),alerts=db.items.filter(warn).sort((a,b)=>b.planDate.localeCompare(a.planDate));return `<div class="hero"><span>📚 AI MỞ · TRUNG TÂM HỌC TẬP</span><h1>Kế hoạch bài giảng & tiến độ</h1><p>Lập kế hoạch theo lớp, ghi kết quả dạy và biết bài nào chậm so với lịch.</p><div class="hero-actions">${btn('＋ Thêm bài giảng','new','primary')}${btn('📅 Xem lịch dạy','calendar')}</div></div>${metrics()}${panel('⚡ Cách bắt đầu',`<ol><li>Thêm một bài giảng, lớp, ngày dự kiến và số tiết.</li><li>Sau buổi học, mở bài và ghi ngày dạy thực tế, kết quả.</li><li>Xem cảnh báo và báo cáo theo lớp. Sao lưu để chuyển máy.</li></ol><p class="muted">Dữ liệu sử dụng thật bắt đầu trống. Mẫu tham chiếu chỉ nạp khi anh chọn ở mục Dữ liệu.</p>`)}<div class="two">${panel('📌 Cần xử lý',alerts.length?alerts.slice(0,8).map(r=>`<div class="mini"><button class="link" data-action="open" data-id="${esc(r.id)}">${esc(r.title)}</button><small>${esc(r.className)} · ${dateShow(r.planDate)} · ${warn(r)}</small></div>`).join(''):'<p class="success">Không có bài quá hạn hoặc dạy chậm theo ngày báo cáo.</p>')}${panel('🗓️ Bảy ngày tới',near.length?near.slice(0,8).map(r=>`<div class="mini"><button class="link" data-action="open" data-id="${esc(r.id)}">${esc(r.title)}</button><small>${esc(r.className)} · ${dateShow(r.planDate)} · ${r.periods} tiết</small></div>`).join(''):'<p class="muted">Chưa có bài dự kiến trong bảy ngày tới.</p>')}</div>`}
function list(){let classes=[...new Set(db.items.map(r=>r.className))].sort((a,b)=>a.localeCompare(b,'vi'));return `<div class="page-head"><div><h1>📋 Danh sách bài giảng</h1><p>Lọc theo lớp, tình trạng hoặc nội dung bài.</p></div>${btn('＋ Thêm bài','new','primary')}</div><div class="card"><div class="filters"><label>Tìm kiếm<input id="search" value="${esc(filter)}" placeholder="Mã, lớp, bài, giáo viên…"></label><label>Lớp<select id="classFilter"><option value="">Tất cả</option>${classes.map(c=>`<option ${classFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Tình trạng<select id="statusFilter"><option value="">Tất cả</option>${['Chưa dạy','Đã dạy','Dạy bù'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></label></div><p class="muted">${rows().length} / ${db.items.length} bài</p><div class="table-wrap"><table><thead><tr><th>Ngày dự kiến</th><th>Bài / lớp</th><th>Tiết KH / thực</th><th>Ngày thực tế</th><th>Tình trạng</th><th>Chậm</th><th></th></tr></thead><tbody>${rows().map(r=>`<tr><td>${dateShow(r.planDate)}</td><td><button class="link" data-action="open" data-id="${esc(r.id)}">${esc(r.title)}</button><small>${esc(r.className)} · ${esc(r.subject||'Chưa ghi môn')} · ${esc(r.code)}</small></td><td>${r.periods} / ${r.actualPeriods||'—'}</td><td>${dateShow(r.actualDate)}</td><td><span class="pill ${r.status==='Chưa dạy'?'amber':'green'}">${r.status}</span></td><td>${warn(r)?`<span class="pill red">${warn(r)} · ${late(r)} ngày</span>`:late(r)+' ngày'}</td><td>${btn('Mở','open','small',r.id)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa có bài phù hợp. Thêm bài giảng để bắt đầu.</td></tr>'}</tbody></table></div></div>`}
function detail(){let r=item(selected);if(!r){page='list';return list()}let log=db.audit.filter(h=>h.itemId===r.id).sort((a,b)=>b.at.localeCompare(a.at));return `<div class="page-head"><div><button class="link" data-action="list">← Danh sách</button><h1>📖 ${esc(r.title)}</h1><p>${esc(r.className)} · ${esc(r.code)} · ${esc(r.subject||'Chưa ghi môn')}</p></div><div>${btn('Sửa bài','edit','primary',r.id)} ${btn('Xóa','delete','danger',r.id)}</div></div><div class="metrics"><div><small>Ngày kế hoạch</small><strong>${dateShow(r.planDate)}</strong></div><div><small>Ngày thực dạy</small><strong>${dateShow(r.actualDate)}</strong></div><div><small>Tiết KH / thực</small><strong>${r.periods} / ${r.actualPeriods||'—'}</strong></div><div><small>Chậm so với KH</small><strong>${late(r)} ngày</strong></div></div><div class="two">${panel('📝 Nội dung & chuẩn bị',`<dl><dt>Chương / chủ đề</dt><dd>${esc(r.unit||'—')}</dd><dt>Mục tiêu bài học</dt><dd>${esc(r.goal||'—')}</dd><dt>Học liệu & thiết bị</dt><dd>${esc(r.materials||'—')}</dd><dt>Bài tập giao về nhà</dt><dd>${esc(r.homework||'—')}</dd><dt>Giáo viên</dt><dd>${esc(r.teacher||'—')}</dd></dl>`)}${panel('✅ Thực hiện',`<p><b>Tình trạng:</b> ${r.status}</p><p><b>Cảnh báo:</b> ${warn(r)||'Không'}</p><p><b>Kết quả / nội dung đã dạy:</b><br>${esc(r.outcome||'Chưa ghi')}</p><p><b>Lý do thay đổi lịch:</b><br>${esc(r.reason||'—')}</p><p><b>Ghi chú:</b><br>${esc(r.note||'—')}</p>${btn('Cập nhật kết quả dạy','edit','primary',r.id)}`)}</div>${panel('🕘 Nhật ký thay đổi',log.length?`<div class="timeline">${log.map(h=>`<div><b>${esc(h.action)}</b> · ${dateShow(h.at.slice(0,10))}<p>${esc(h.reason)}</p></div>`).join('')}</div>`:'<p class="muted">Chưa có thay đổi.</p>')}`}
function calendar(){let groups=[...new Set(db.items.map(r=>r.planDate.slice(0,7)))].sort();return `<div class="page-head"><div><h1>🗓️ Lịch theo tháng</h1><p>Ngày trên lịch là ngày dự kiến; ngày thực dạy hiển thị trong chi tiết.</p></div>${btn('＋ Thêm bài','new','primary')}</div>${groups.map(g=>panel('Tháng '+g.slice(5)+'/'+g.slice(0,4),`<div class="calendar-list">${db.items.filter(r=>r.planDate.startsWith(g)).sort((a,b)=>a.planDate.localeCompare(b.planDate)).map(r=>`<button data-action="open" data-id="${esc(r.id)}"><b>${dateShow(r.planDate)}</b><span>${esc(r.className)} · ${esc(r.title)}</span><small>${r.status}${warn(r)?' · '+warn(r):''}</small></button>`).join('')}</div>`)).join('')||panel('Chưa có lịch','Thêm bài giảng để hình thành lịch dạy.')}`}
function reports(){let classes=[...new Set(db.items.map(r=>r.className))].sort((a,b)=>a.localeCompare(b,'vi'));return `<div class="page-head"><div><h1>📊 Báo cáo tiến độ</h1><p>Tính theo ngày báo cáo ${dateShow(db.settings.asof)}. Tiến độ theo số bài; số tiết thực tế là số đã nhập sau buổi học.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo lớp',`<div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Số bài</th><th>Đã dạy</th><th>Tiến độ</th><th>Tiết KH</th><th>Tiết thực</th><th>Chậm/quá hạn</th></tr></thead><tbody>${classes.map(c=>{let a=db.items.filter(r=>r.className===c),d=a.filter(r=>r.status!=='Chưa dạy');return `<tr><td>${esc(c)}</td><td>${a.length}</td><td>${d.length}</td><td>${Math.round(d.length/a.length*100)}%</td><td>${a.reduce((s,r)=>s+r.periods,0)}</td><td>${d.reduce((s,r)=>s+r.actualPeriods,0)}</td><td>${a.filter(warn).length}</td></tr>`}).join('')||'<tr><td colspan="7">Chưa có lớp.</td></tr>'}</tbody></table></div>`)}${panel('Theo tình trạng',`<div class="bars">${['Chưa dạy','Đã dạy','Dạy bù'].map(v=>{let n=db.items.filter(r=>r.status===v).length;return `<div><span>${v}</span><b>${n}</b><i style="width:${db.items.length?100*n/db.items.length:0}%"></i></div>`}).join('')}</div>`)}${panel('Danh sách cần xử lý',`<div class="table-wrap"><table><thead><tr><th>Lớp / bài</th><th>Dự kiến</th><th>Thực tế</th><th>Cảnh báo</th></tr></thead><tbody>${db.items.filter(warn).sort((a,b)=>a.planDate.localeCompare(b.planDate)).map(r=>`<tr><td>${esc(r.className)} · ${esc(r.title)}</td><td>${dateShow(r.planDate)}</td><td>${dateShow(r.actualDate)}</td><td>${warn(r)} (${late(r)} ngày)</td></tr>`).join('')||'<tr><td colspan="4">Không có bài cần xử lý.</td></tr>'}</tbody></table></div>`)}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngưỡng và ngày báo cáo',`<form id="settingsForm" class="form-grid"><label>Tên trung tâm<input name="org" value="${esc(db.settings.org)}" maxlength="120"></label><label>Ngày báo cáo<input type="date" name="asof" value="${esc(db.settings.asof)}" required></label><label>Cảnh báo khi dạy chậm quá (ngày)<input type="number" name="lateMax" min="0" max="365" value="${db.settings.lateMax}" required></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="muted">Bài chưa dạy được cảnh báo ngay khi quá ngày dự kiến. Bài đã dạy cảnh báo khi số ngày chậm lớn hơn ngưỡng này.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Chuyển máy và sao lưu',`<p>Dữ liệu hiện tại lưu trong trình duyệt trên máy này. Sao chép file HTML gốc sang máy khác không mang theo thay đổi đã nhập. Hãy tải HTML kèm dữ liệu hoặc JSON.</p><div class="actions">${btn('⬇️ Tải JSON','exportJson')}${btn('⬇️ Tải HTML kèm dữ liệu','exportHtml','primary')}${btn('⬇️ Tải Excel 2 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Dữ liệu minh họa',`<p>Mẫu gốc có 20 bài, 43 tiết. Một số tên bài và lớp không cùng môn; chỉ dùng thử tính năng, cần người phụ trách rà soát trước khi dùng làm kế hoạch thật.</p>${btn('Nạp mẫu nguồn (thay dữ liệu hiện tại)','sample','danger')}`)}${panel('Làm mới',`<p>Thao tác này xóa toàn bộ dữ liệu của app trên thiết bị hiện tại.</p>${btn('Xóa hết dữ liệu','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn sử dụng</h1></div>${panel('Quy trình',`<ol><li>Tạo mỗi bài / buổi dự kiến một dòng, ghi lớp, môn, ngày và số tiết.</li><li>Điền mục tiêu, học liệu, bài tập; có thể in chi tiết để chuẩn bị.</li><li>Sau khi dạy, sửa dòng: chọn Đã dạy hoặc Dạy bù, nhập ngày và số tiết thực tế, kết quả học.</li><li>Nếu đổi ngày, ghi lý do để còn dấu vết trong nhật ký.</li><li>Chọn ngày báo cáo, xem cảnh báo và báo cáo theo lớp. Sao lưu định kỳ.</li></ol>`)}${panel('Quy tắc tính',`<p><b>Tiến độ theo bài</b> = số bài đã dạy hoặc dạy bù / tổng bài. <b>Ngày chậm</b> = max(0, ngày thực dạy − ngày kế hoạch); nếu chưa dạy thì so với ngày báo cáo. Bài chưa dạy mà quá lịch luôn được cảnh báo; bài đã dạy cảnh báo khi vượt ngưỡng cài đặt.</p><p>Tiết thực tế chỉ cộng ở bài đã dạy và dùng số tiết được nhập. App hỗ trợ quản trị nội bộ, không xác nhận chất lượng giảng dạy.</p>`)}`}
function render(){let map={home:['Tổng quan',home],list:['Bài giảng',list],detail:['Chi tiết',detail],calendar:['Lịch',calendar],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===page));$('#topOrg').textContent=db.settings.org||'AI Mở · App offline'}
const fields=[['code','Mã bài','text'],['className','Lớp học','text'],['subject','Môn / chương trình','text'],['teacher','Giáo viên','text'],['planDate','Ngày dự kiến','date'],['periods','Số tiết kế hoạch','number'],['unit','Chương / chủ đề','text'],['title','Tên bài / nội dung','text'],['goal','Mục tiêu bài học','textarea'],['materials','Học liệu, thiết bị','textarea'],['homework','Bài tập giao','textarea'],['status','Tình trạng','select'],['actualDate','Ngày dạy thực tế','date'],['actualPeriods','Số tiết thực tế','number'],['outcome','Kết quả và nội dung đã dạy','textarea'],['reason','Lý do điều chỉnh (nếu sửa)','textarea'],['note','Ghi chú khác','textarea']];
function openModal(id){let r=id?item(id):null;modal={id:id||''};$('#modalTitle').textContent=r?'Sửa bài giảng':'Thêm bài giảng';$('#formFields').innerHTML=fields.map(([key,label,type])=>`<label class="${type==='textarea'?'full':''}">${label}${type==='textarea'?`<textarea name="${key}" rows="3" maxlength="2000">${esc(r?.[key]||'')}</textarea>`:type==='select'?`<select name="${key}">${['Chưa dạy','Đã dạy','Dạy bù'].map(v=>`<option ${r?.[key]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" value="${esc(r?.[key]??(key==='planDate'?today():key==='periods'?1:''))}" ${['code','className','planDate','periods','title'].includes(key)?'required':''} ${type==='number'?'min="1" max="30" step="1"':''} maxlength="2000">`}</label>`).join('');$('#formError').textContent='';$('#editor').showModal()}
function getForm(){let f=new FormData($('#itemForm')),r={};for(let [k] of fields)r[k]=String(f.get(k)||'').trim();r.periods=Number(r.periods);r.actualPeriods=r.actualDate?Number(r.actualPeriods):0;return r}
function submit(){let r=getForm(),old=modal.id?item(modal.id):null;if(!r.code||!r.className||!r.title||!dateOK(r.planDate)||!Number.isInteger(r.periods)||r.periods<1||r.periods>30){$('#formError').textContent='Điền mã, lớp, tên bài, ngày và số tiết hợp lệ.';return}if(db.items.some(x=>x.code.toLowerCase()===r.code.toLowerCase()&&x.id!==modal.id)){ $('#formError').textContent='Mã bài đã tồn tại.';return}if(r.status==='Chưa dạy'&&(r.actualDate||r.actualPeriods)){ $('#formError').textContent='Bài chưa dạy không có ngày hoặc số tiết thực tế.';return}if(r.status!=='Chưa dạy'&&(!dateOK(r.actualDate)||!Number.isInteger(r.actualPeriods)||r.actualPeriods<1||r.actualPeriods>30)){ $('#formError').textContent='Bài đã dạy cần ngày và số tiết thực tế (1–30).';return}if(old&&JSON.stringify({...old,id:''})===JSON.stringify({...r,id:''})){ $('#editor').close();return}if(old&&!r.reason){$('#formError').textContent='Nhập lý do thay đổi để lưu nhật ký.';return}let id=old?.id||uid();r.id=id;if(old)Object.assign(old,r);else db.items.push(r);db.audit.push({id:uid(),itemId:id,action:old?'Sửa bài giảng':'Tạo bài giảng',reason:r.reason||'Lập kế hoạch ban đầu',at:new Date().toISOString()});let e=validate(db);if(e){if(old)Object.assign(old,modal.before);else db.items=db.items.filter(x=>x.id!==id);db.audit.pop();$('#formError').textContent=e;return}$('#editor').close();selected=id;page='detail';save()}
function dl(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function json(){dl(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'ke-hoach-bai-giang-sao-luu.json')}
function html(){let s=encode(db),doc='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);dl(new Blob([doc],{type:'text/html;charset=utf-8'}),'ke-hoach-bai-giang-kem-du-lieu.html')}
const HEAD=['ID','Mã bài','Lớp','Môn','Giáo viên','Ngày kế hoạch','Tiết kế hoạch','Chương','Nội dung bài','Mục tiêu','Học liệu','Bài tập','Tình trạng','Ngày thực tế','Tiết thực tế','Kết quả','Lý do','Ghi chú'];
const HLOG=['ID','ID bài','Hành động','Lý do','Thời điểm'];
function excel(){let a=[HEAD,...db.items.map(r=>[r.id,r.code,r.className,r.subject,r.teacher,r.planDate,r.periods,r.unit,r.title,r.goal,r.materials,r.homework,r.status,r.actualDate,r.actualPeriods,r.outcome,r.reason,r.note])],b=[HLOG,...db.audit.map(h=>[h.id,h.itemId,h.action,h.reason,h.at])];dl(Excel.workbook([{name:'Ke hoach',rows:a},{name:'Nhat ky',rows:b}]),'ke-hoach-bai-giang.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file),a=b['Ke hoach'],h=b['Nhat ky'];if(!a||!h||HEAD.some((v,i)=>a[0]?.[i]!==v)||HLOG.some((v,i)=>h[0]?.[i]!==v))throw Error('Excel không đúng mẫu hai sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.items=a.slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),className:String(r[2]),subject:String(r[3]||''),teacher:String(r[4]||''),planDate:String(r[5]),periods:Number(r[6]),unit:String(r[7]||''),title:String(r[8]),goal:String(r[9]||''),materials:String(r[10]||''),homework:String(r[11]||''),status:String(r[12]),actualDate:String(r[13]||''),actualPeriods:Number(r[14]||0),outcome:String(r[15]||''),reason:String(r[16]||''),note:String(r[17]||'')}));x.audit=h.slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),itemId:String(r[1]),action:String(r[2]),reason:String(r[3]),at:String(r[4])}))}let e=validate(x);if(e)throw Error(e);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.items.length} bài trong file? Hãy sao lưu trước nếu cần.`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp 20 bài minh họa sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today();for(let [i,r] of LESSON_SAMPLE.bg.entries()){let d=n=>{let t=new Date(base+'T12:00:00');t.setDate(t.getDate()+Number(n.slice(1)));return t.toLocaleDateString('sv-SE')};let id=uid();x.items.push({id,code:'MAU-'+String(i+1).padStart(3,'0'),planDate:d(r[0]),className:r[1],subject:'',teacher:'',title:r[2],periods:r[3],actualDate:r[4]?d(r[4]):'',actualPeriods:r[4]?r[3]:0,status:r[5],unit:'',goal:'',materials:'',homework:'',outcome:'',reason:'Dữ liệu minh họa từ file nguồn',note:'Cần rà soát lớp và nội dung trước khi dùng thật.'})}let e=validate(x);if(e){alert(e);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-action]');if(!a)return;let k=a.dataset.action,id=a.dataset.id;if(k==='new')openModal();else if(k==='edit'){modal={id,before:clone(item(id))};openModal(id);modal.before=clone(item(id))}else if(k==='open'){selected=id;page='detail';render()}else if(['list','calendar'].includes(k)){page=k;render()}else if(k==='delete'){let r=item(id);if(confirm(`Xóa bài “${r.title}” và nhật ký liên quan?`)){db.items=db.items.filter(x=>x.id!==id);db.audit=db.audit.filter(h=>h.itemId!==id);page='list';save()}}else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),asof=String(f.get('asof')),lateMax=Number(f.get('lateMax'));if(!dateOK(asof)||!Number.isInteger(lateMax)||lateMax<0||lateMax>365){alert('Ngày báo cáo hoặc ngưỡng không hợp lệ.');return}db.settings={org:String(f.get('org')).trim().slice(0,120),asof,lateMax};save()}else if(k==='print')print();else if(k==='exportJson')json();else if(k==='exportHtml')html();else if(k==='exportExcel')excel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='sample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app trên thiết bị này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;let pos=e.target.selectionStart;render();let n=$('#search');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='classFilter'){classFilter=e.target.value;render()}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
window.LessonApp={getDB:()=>clone(db),validate,stats,late,warn,loadSample,encode,decode,excel,importFile};
</script></body></html>
