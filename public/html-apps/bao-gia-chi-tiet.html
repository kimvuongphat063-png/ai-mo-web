function saveQuote(){if(!draft)return null;let error=validateQuote(draft);if(error){alert(error);return null}let q=clone(draft),c=cBy(q.customerId),old=q.id?qBy(q.id):null;if(c&&(!old||old.customerId!==q.customerId||!q.customerSnapshot))q.customerSnapshot=clone(c);q.companySnapshot=q.companySnapshot||clone(db.settings.company);if(!q.id){if(db.quotes.length>=2000){alert('Tối đa 2.000 báo giá.');return null}q.id=uid();db.quotes.push(q)}else{let i=db.quotes.findIndex(x=>x.id===q.id);if(i<0){alert('Không tìm thấy báo giá để cập nhật.');return null}db.quotes[i]=q}clearDraft();page='quotes';save(true);return q.id}

function readMoney(n){n=Math.round(Math.abs(Number(n)||0));if(!n)return 'Không đồng';let digits=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'],units=['',' nghìn',' triệu',' tỷ',' nghìn tỷ'],parts=[];function tri(x,full){let h=Math.floor(x/100),t=Math.floor(x%100/10),o=x%10,a=[];if(h||full)a.push(digits[h]+' trăm');if(t>1){a.push(digits[t]+' mươi');if(o===1)a.push('mốt');else if(o===5)a.push('lăm');else if(o)a.push(digits[o])}else if(t===1){a.push('mười');if(o===5)a.push('lăm');else if(o)a.push(digits[o])}else if(o){if(h||full)a.push('lẻ');a.push(digits[o])}return a.join(' ')}for(let i=0;n;i++,n=Math.floor(n/1000)){let x=n%1000;if(x)parts.unshift(tri(x,i>0&&n>=1000)+units[i])}let text=parts.join(' ').replace(/\s+/g,' ').trim();return text.charAt(0).toUpperCase()+text.slice(1)+' đồng'}

function saveSettings(){let s=clone(db.settings);for(let el of $$('[data-setting]')){let path=el.dataset.setting,value=el.value.trim(),owner=path.startsWith('company.')?s.company:s,key=path.split('.').pop();owner[key]=['vat','hieuLuc'].includes(key)?dec(value):value}if(!s.company.ten.trim()){alert('Hãy nhập tên công ty hoặc đơn vị.');return}if(!/^[A-Za-z0-9_-]{1,12}$/.test(s.prefix)){alert('Tiền tố số báo giá cần 1–12 ký tự chữ, số, _ hoặc -.');return}if(!Number.isFinite(s.vat)||s.vat<0||s.vat>100||!Number.isInteger(s.hieuLuc)||s.hieuLuc<1||s.hieuLuc>365){alert('VAT hoặc số ngày hiệu lực không hợp lệ.');return}s.company.logo=db.settings.company.logo;db.settings=s;save(true);alert('Đã lưu cài đặt. Báo giá cũ vẫn giữ bản chụp thông tin đơn vị khi lập.')}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadBlob(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function sheetQuotes(list=db.quotes){return [['Số báo giá','Ngày','Hiệu lực','Mã khách hàng','Khách hàng','Nhân viên','Trạng thái','Tiêu đề','Chiết khấu tổng (%)','Phí vận chuyển','VAT (%)','Tiền hàng','Trước VAT','Tiền VAT','Tổng cộng','Giá vốn','Lãi gộp','Ngày nhắc'],...list.map(q=>{let t=totals(q),c=customer(q);return[q.so,q.ngay,q.hieuLuc,c.ma||'',c.congTy||c.ten,q.nhanVien,q.trangThai,q.tieuDe,q.ckTong,q.phiVC,q.vat,t.hang,t.truocThue,t.thue,t.tong,t.von,t.lai,q.followUpDate||'']})]}

function validImported(x){if(!shape(x)||x.products.length>5000||x.customers.length>5000||x.quotes.length>2000)return false;let unique=(a,k)=>new Set(a.map(x=>String(x[k]||'').toLocaleLowerCase('vi'))).size===a.length;let pids=new Set(x.products.map(p=>p.id)),cids=new Set(x.customers.map(c=>c.id));if(!unique(x.products,'id')||!unique(x.products,'ma')||!unique(x.customers,'id')||!unique(x.customers,'ma')||!unique(x.quotes,'id')||!unique(x.quotes,'so'))return false;for(let p of x.products)if(!p.id||!p.ma||!p.ten||!Number.isFinite(+p.giaBan)||+p.giaBan<0||!Number.isFinite(+p.giaVon)||+p.giaVon<0||p.anh&&(!/^data:image\/(?:jpeg|png|webp);base64,/i.test(String(p.anh))||String(p.anh).length>1e6))return false;for(let c of x.customers)if(!c.id||!c.ma||!c.ten)return false;for(let q of x.quotes)if(!q.id||!q.so||!Array.isArray(q.lines)||!q.lines.length||q.lines.length>200||!q.customerSnapshot&&!cids.has(q.customerId)||q.lines.some(l=>!l.ten||!Number.isFinite(+l.sl)||+l.sl<=0||!Number.isFinite(+l.gia)||+l.gia<0||!Number.isFinite(+l.ck)||+l.ck<0||+l.ck>100))return false;return true}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);return rows}
function normHeader(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'')}
async function importList(file,kind){let rows;if(file.name.toLowerCase().endsWith('.xlsx')){let sheets=await Excel.read(file);rows=Object.values(sheets)[0]||[]}else rows=parseCSV(await file.text());if(rows.length<2)throw Error('File chưa có dòng dữ liệu.');let header=rows[0].map(normHeader),cols=kind==='products'?{ma:['masanpham','ma','sku','code'],ten:['tensanpham','tenhanghoa','ten','sanpham'],nhom:['nhomhang','nhom'],dvt:['dvt','donvitinh'],giaBan:['giaban','dongia','gia'],giaVon:['giavon','gianhap'],moTa:['mota','ghichu']}:{ma:['makhachhang','ma','code'],congTy:['tencongty','congty','khachhang','donvi'],ten:['nguoilienhe','ten','hoten'],chucVu:['chucvu'],sdt:['dienthoai','sdt','sodienthoai'],email:['email'],diaChi:['diachi'],mst:['masothue','mst']},map={};for(let [k,aliases] of Object.entries(cols)){map[k]=header.findIndex(h=>aliases.includes(h))}if(map.ten<0)throw Error('Thiếu cột tên bắt buộc. Hãy xuất Excel mẫu từ ứng dụng.');let list=kind==='products'?db.products:db.customers,items=[];for(let r of rows.slice(1)){let val=k=>map[k]<0?'':String(r[map[k]]??'').trim(),ten=val('ten');if(!ten)continue;let ma=val('ma')||(kind==='products'?'SP':'KH')+String(list.length+items.length+1).padStart(3,'0');let item={ma,ten};for(let k of Object.keys(cols))if(!['ma','ten'].includes(k))item[k]=val(k);if(kind==='products'){item.giaBan=dec(item.giaBan);item.giaVon=dec(item.giaVon);item.dvt||='Chiếc';item.anh='';if(!Number.isFinite(item.giaBan)||item.giaBan<0||!Number.isFinite(item.giaVon)||item.giaVon<0)throw Error('Giá bán/giá vốn không hợp lệ ở mã '+ma)}if(items.some(x=>x.ma.toLowerCase()===ma.toLowerCase()))throw Error('Mã trùng trong file: '+ma);items.push(item)}if(!items.length)throw Error('Không có dòng hợp lệ.');if(list.length+items.filter(x=>!list.some(y=>y.ma.toLowerCase()===x.ma.toLowerCase())).length>5000)throw Error('Vượt giới hạn 5.000 mục.');let matches=items.filter(x=>list.some(y=>y.ma.toLowerCase()===x.ma.toLowerCase())).length;if(!confirm('Nhập '+items.length+' mục ('+matches+' trùng mã sẽ được cập nhật). Tiếp tục?'))return;for(let item of items){let old=list.find(x=>x.ma.toLowerCase()===item.ma.toLowerCase());if(old){if(kind==='products')item.anh=old.anh||'';Object.assign(old,item)}else list.push({id:uid(),...item})}save(true);alert('Đã nhập '+items.length+' mục. Báo giá cũ giữ nguyên dòng hàng và giá đã chụp.')}
function dataPage(){return hero('Dữ liệu & sao lưu','Một file HTML, chạy offline, không cần API hay server.')+
 '<div class="card"><h2>Sao lưu và xuất</h2><div class="toolbar"><button class="btn primary" data-action="saveHtml">Tải HTML kèm dữ liệu</button><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="exportAll">Xuất toàn bộ Excel</button><button class="btn" data-action="exportCsv">Xuất báo giá CSV</button></div><p class="muted">Sau khi nhập thêm dữ liệu, hãy tải lại HTML mới hoặc sao lưu JSON mới để mang sang máy khác.</p></div>'+

 '<div class="card"><h2>Giới hạn và riêng tư</h2><p>Dữ liệu nằm trong trình duyệt của máy này. Không có tài khoản, đồng bộ nhiều thiết bị hay gửi dữ liệu lên máy chủ. Ảnh sản phẩm và logo được thu nhỏ trước khi lưu; trình duyệt vẫn có thể giới hạn dung lượng lưu trữ.</p><p>Nhập Excel/CSV hỗ trợ sản phẩm và khách hàng. Các báo giá được nhập bằng JSON để giữ nguyên liên kết và bản chụp dòng hàng.</p></div>'}
function guide(){return hero('Cách sử dụng','Từ danh mục đến báo giá gửi khách và báo cáo kết quả.')+
 '<div class="grid two"><div class="card"><h2>Quy trình 6 bước</h2><ol><li>Vào Cài đặt để nhập thông tin đơn vị, VAT mặc định, ngân hàng và điều khoản.</li><li>Thêm sản phẩm hoặc nhập danh sách từ Excel/CSV; nhập giá vốn nếu muốn xem lãi gộp.</li><li>Thêm khách hàng với người liên hệ và thông tin nhận báo giá.</li><li>Tạo báo giá, thêm dòng hàng, chỉnh số lượng, đơn giá và chiết khấu.</li><li>Lưu, mở bản in, in ra giấy hoặc lưu PDF; có thể xuất Excel.</li><li>Cập nhật trạng thái và ngày nhắc để xem báo cáo và các báo giá cần theo dõi.</li></ol></div><div class="card"><h2>Công thức tính</h2><p>Thành tiền dòng = làm tròn(SL × đơn giá × (1 − CK dòng%)). Tiền hàng = tổng thành tiền dòng. Chiết khấu toàn đơn = làm tròn(tiền hàng × CK tổng%). Trước VAT = tiền hàng − CK tổng + phí vận chuyển. VAT = làm tròn(trước VAT × thuế suất%). Tổng cộng = trước VAT + VAT.</p><p>Lãi gộp dự kiến = tiền hàng − CK tổng − tổng(SL × giá vốn). Không gồm VAT, vận chuyển hoặc chi phí khác. Đây là số quản trị, không phải lợi nhuận kế toán.</p></div></div>'+
 '<div class="card"><h2>Dữ liệu và bản in</h2><p>Báo giá giữ bản chụp dòng hàng, khách hàng và thông tin đơn vị khi lưu. Vì vậy sửa danh mục sau đó không tự đổi báo giá cũ. Giá vốn chỉ xuất trong báo cáo nội bộ; bản in gửi khách không có giá vốn.</p><p>Giá trên báo giá và cách xử lý VAT cần được anh xác định theo thực tế giao dịch. App không phát hành hóa đơn hoặc tự kết luận nghĩa vụ thuế.</p></div>'}

 if(a==='exportCsv')download('ai-mo-bao-gia.csv','text/csv;charset=utf-8',csvRows(sheetQuotes()));
 if(a==='backup')backup();if(a==='saveHtml')saveHtml();
 if(a==='loadDemo'){if(db.products.length||db.customers.length||db.quotes.length){alert('Chỉ nạp dữ liệu mẫu khi cả ba sổ đang trống. Hãy sao lưu rồi xóa dữ liệu nếu muốn thử mẫu.');return}if(!confirm('Nạp 32 sản phẩm, 35 khách hàng, 140 báo giá mẫu?'))return;let demo=clone(DEMO);db.settings={...db.settings,...demo.settings,nhanVien:demo.settings.nhanVien.join('\n')};db.products=demo.products;db.customers=demo.customers;db.quotes=demo.quotes.map(q=>({...q,followUpDate:'',loiChao:db.settings.loiChao,customerSnapshot:clone(demo.customers.find(c=>c.id===q.customerId)),companySnapshot:clone(db.settings.company)}));save(true)}
 if(a==='clearAll'){if(!confirm('Xóa toàn bộ sản phẩm, khách hàng, báo giá và cài đặt trên máy này?'))return;db=empty();clearDraft();page='dashboard';save(true)}
});
document.addEventListener('input',e=>{
 let t=e.target;
 if(t.id==='pickSearch'){pickList();return}
 if(['quoteSearch','productSearch','customerSearch'].includes(t.id)){let key=t.id==='quoteSearch'?'quoteQuery':t.id==='productSearch'?'productQuery':'customerQuery',at=t.selectionStart;filters[key]=t.value;render();let fresh=$('#'+t.id);if(fresh){fresh.focus();fresh.setSelectionRange(at,at)}return}
 if(t.dataset.head&&draft){let k=t.dataset.head;draft[k]=['ckTong','phiVC','vat'].includes(k)?dec(t.value):t.value;if(k==='ngay'&&t.value){draft.hieuLuc=addDays(t.value,db.settings.hieuLuc);let field=$('#q-hieuLuc');if(field)field.value=draft.hieuLuc}if(k==='customerId')$('#editCustomerInfo').innerHTML=customerInfo(t.value);if(['ckTong','phiVC','vat'].includes(k))refreshTotals();persistDraft();return}
 if(t.dataset.line&&draft){let i=Number(t.dataset.i),l=draft.lines[i];if(!l)return;let k=t.dataset.line;l[k]=['sl','gia','ck','von'].includes(k)?dec(t.value):t.value;let tr=t.closest('tr'),value=tr?.querySelector('[data-line-total]');if(value)value.textContent=Number.isFinite(lineTotal(l))?money(lineTotal(l)):'—';refreshTotals();persistDraft();return}
});
document.addEventListener('change',async e=>{
 let t=e.target;
 if(t.id==='yearPick'){filters.year=t.value;render();return}
 if(t.id==='f-anh'&&t.files?.[0]){try{formImage=await resizeImage(t.files[0]);$('#imageStatus').textContent='Đã xử lý ảnh; bấm Lưu để áp dụng.'}catch(err){$('#formError').textContent=err.message}return}
 if(t.dataset.logo&&t.files?.[0]){try{db.settings.company.logo=await resizeImage(t.files[0],300);save();alert('Đã lưu logo.')}catch(err){alert(err.message)}return}
 if(!t.dataset.import||!t.files?.[0])return;
 try{let file=t.files[0];if(t.dataset.import==='backup'){let next=JSON.parse(await file.text());if(!validImported(next))throw Error('File sao lưu không hợp lệ hoặc sai phiên bản.');if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu?'))return;db=next;clearDraft();page='dashboard';save(true);alert('Đã khôi phục dữ liệu.')}else await importList(file,t.dataset.import)}
 catch(err){alert(err.message)}finally{t.value=''}
});
window.addEventListener('beforeunload',e=>{if(draft){e.preventDefault();e.returnValue=''}});
try{let old=JSON.parse(sessionStorage.getItem(KEY+'-draft')||'null');if(old&&Array.isArray(old.lines)&&old.lines.length<=200){draft=old;page='edit'}}catch{}
render();
</script></body></html>
