function summary(rows=db.checks.filter(c=>c.state!=='Hủy')){let tested=rows.reduce((n,c)=>n+c.tested,0),defects=rows.reduce((n,c)=>n+c.defects,0);return {checks:rows.length,tested,defects,pass:rows.filter(c=>result(c)==='Đạt').length,fail:rows.filter(c=>result(c)==='Không đạt').length,rate:tested?Math.round(defects/tested*10000)/100:null,open:rows.filter(c=>result(c)==='Không đạt'&&c.action!=='Đã đóng').length}}

 let ids=new Set();for(let c of x.checks){if(!c.id||ids.has(c.id)||!dateOK(c.date)||!c.lot||!c.product||!STAGES.includes(c.stage)||!Number.isSafeInteger(c.tested)||c.tested<1||!Number.isSafeInteger(c.defects)||c.defects<0||c.defects>c.tested||!GROUPS.includes(c.group)||c.defects===0&&c.group||!Number.isFinite(c.limit)||c.limit<0||c.limit>100||!STATES.includes(c.state)||!ACTIONS.includes(c.action)||c.due&&!dateOK(c.due)||String(c.note||'').length>1200||String(c.correction||'').length>1200)return 'Phiếu kiểm không hợp lệ.';ids.add(c.id)}
 let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được vào trình duyệt. Hãy tải bản sao JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,reason,checkId=''){db.audit.push({id:uid(),action,reason,checkId,at:new Date().toISOString()})}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function statsCards(s){return `<div class="metrics"><div><small>Phiếu kiểm</small><strong>${s.checks}</strong></div><div><small>Số lượng đã kiểm</small><strong>${s.tested.toLocaleString('vi-VN')}</strong></div><div><small>Số lượng lỗi</small><strong>${s.defects.toLocaleString('vi-VN')}</strong></div><div><small>Phiếu đạt / không đạt</small><strong>${s.pass} / ${s.fail}</strong></div><div><small>Chưa đóng xử lý</small><strong>${s.open}</strong></div></div>`}
function home(){let s=summary(),issues=db.checks.filter(c=>warnings(c).length).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="hero"><span>🛡️ AI MỞ · KIỂM TRA CHẤT LƯỢNG</span><h1>Phiếu kiểm theo lô</h1><p>Ghi số mẫu đã kiểm, số lỗi, giai đoạn và phương án xử lý. Xem ngay lô vượt ngưỡng do đơn vị tự đặt.</p><div class="hero-actions">${btn('＋ Tạo phiếu kiểm','newCheck','primary')}${btn('📋 Xem danh sách','checks')}</div></div>${statsCards(s)}${panel('📍 Bắt đầu nhanh',`<ol><li>Đặt ngưỡng tỷ lệ lỗi nội bộ ở Cài đặt.</li><li>Ghi mỗi lần kiểm một phiếu: ngày, mã lô, sản phẩm, giai đoạn, số kiểm và số lỗi.</li><li>Nếu có lỗi, ghi nhóm lỗi chính và xử lý lô. Xác nhận phiếu sau khi đối chiếu chứng từ.</li><li>Xem cảnh báo, báo cáo, in phiếu và sao lưu định kỳ.</li></ol><p class="muted">Tỷ lệ lỗi là phần trăm của mẫu đã kiểm, không mặc nhiên đại diện cho toàn bộ lô.</p>`)}${panel('⚠️ Cần xử lý',issues.length?issues.slice(0,15).map(c=>`<div class="mini"><button class="link" data-act="openCheck" data-id="${esc(c.id)}">${esc(c.lot)} · ${esc(c.product)}</button><small>${fmt(c.date)} · ${warnings(c).map(esc).join('; ')}</small></div>`).join(''):'<p class="success">Chưa có phiếu cần xử lý theo dữ liệu hiện tại.</p>')}`}
function checksPage(){let a=filtered();return `<div class="page-head"><div><h1>🛡️ Danh sách phiếu kiểm</h1><p>Một lần kiểm là một phiếu; cùng mã lô có thể được kiểm lại hoặc ở nhiều giai đoạn.</p></div>${btn('＋ Tạo phiếu kiểm','newCheck','primary')}</div><div class="card"><div class="filters"><label>Tìm mã lô, sản phẩm, người kiểm<input id="search" value="${esc(query)}" placeholder="Ví dụ L1201"></label><label>Giai đoạn<select id="stageFilter"><option value="">Tất cả</option>${STAGES.map(v=>`<option ${stageFilter===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Kết luận<select id="resultFilter"><option value="">Tất cả</option>${['Đạt','Không đạt'].map(v=>`<option ${resultFilter===v?'selected':''}>${v}</option>`).join('')}</select></label></div><p class="muted">${a.length} / ${db.checks.filter(c=>c.state!=='Hủy').length} phiếu</p><div class="table-wrap"><table><thead><tr><th>Ngày / mã lô</th><th>Sản phẩm</th><th>Giai đoạn</th><th>Kiểm / lỗi</th><th>Tỷ lệ lỗi</th><th>Ngưỡng</th><th>Kết luận</th><th>Xử lý</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${a.map(c=>`<tr><td>${fmt(c.date)}<small><button class="link" data-act="openCheck" data-id="${esc(c.id)}">${esc(c.lot)}</button></small></td><td>${esc(c.product)}</td><td>${esc(c.stage)}</td><td>${c.tested} / ${c.defects}</td><td>${ratio(c)===null?'—':pct(ratio(c))}</td><td>${pct(c.limit)}</td><td><span class="pill ${result(c)==='Đạt'?'green':'red'}">${result(c)}</span></td><td>${esc(c.action)}</td><td>${warnings(c).length?`<span class="pill amber">${warnings(c).length} việc</span>`:'—'}</td><td>${btn('Xem','openCheck','small',c.id)}</td></tr>`).join('')||'<tr><td colspan="10">Chưa có phiếu phù hợp.</td></tr>'}</tbody></table></div></div>`}
function detail(){let c=check(selected);if(!c){page='checks';return checksPage()}let r=ratio(c),w=warnings(c),hist=db.audit.filter(a=>a.checkId===c.id).slice().reverse();return `<div class="page-head"><div><button class="link" data-act="checks">← Danh sách phiếu</button><h1>🛡️ Lô ${esc(c.lot)}</h1><p>${esc(c.product)} · ${fmt(c.date)} · ${esc(c.stage)}</p></div><div class="actions no-print">${c.state==='Nháp'?btn('Sửa phiếu','editCheck','primary',c.id)+btn('Xác nhận','confirmCheck','',c.id):''}${c.state==='Đã xác nhận'?btn('Mở lại để sửa','reopenCheck','',c.id):''}${c.state!=='Hủy'?btn('Hủy phiếu','voidCheck','danger',c.id):''}${btn('🖨️ In phiếu','print')}</div></div><div class="metrics"><div><small>Số lượng kiểm</small><strong>${c.tested}</strong></div><div><small>Số lượng lỗi</small><strong>${c.defects}</strong></div><div><small>Tỷ lệ lỗi</small><strong>${r===null?'—':pct(r)}</strong></div><div><small>Ngưỡng tại lần kiểm</small><strong>${pct(c.limit)}</strong></div><div><small>Kết luận tính toán</small><strong>${result(c)}</strong></div></div><div class="two">${panel('📋 Thông tin phiếu',`<dl><dt>Trạng thái phiếu</dt><dd>${esc(c.state)}</dd><dt>Người kiểm</dt><dd>${esc(c.inspector||'Chưa ghi')}</dd><dt>Nhóm lỗi chính</dt><dd>${esc(c.group||'Không có / chưa ghi')}</dd><dt>Tham chiếu nguồn</dt><dd>${esc(c.ref||'Chưa ghi')}</dd><dt>Ghi chú</dt><dd>${esc(c.note||'—')}</dd></dl>`)}${panel('🔧 Xử lý và theo dõi',`<dl><dt>Phương án</dt><dd>${esc(c.action)}</dd><dt>Người phụ trách</dt><dd>${esc(c.owner||'Chưa ghi')}</dd><dt>Hạn xử lý</dt><dd>${fmt(c.due)}</dd><dt>Việc đã làm / kết quả</dt><dd>${esc(c.correction||'Chưa ghi')}</dd></dl>`)}</div>${panel('⚠️ Cảnh báo',w.length?`<ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="success">Không có cảnh báo theo dữ liệu hiện tại.</p>')}${panel('🕘 Lịch sử',hist.length?`<div class="timeline">${hist.map(a=>`<div><b>${esc(a.action)}</b> · ${esc(a.at.slice(0,16).replace('T',' '))}<p>${esc(a.reason||'—')}</p></div>`).join('')}</div>`:'<p class="muted">Chưa có thay đổi.</p>')}`}
function summaryTable(cats,field){return `<div class="table-wrap"><table><thead><tr><th>${field==='stage'?'Giai đoạn':'Nhóm lỗi chính'}</th><th>Số phiếu</th><th>Đã kiểm</th><th>Số lỗi</th><th>Tỷ lệ lỗi gộp</th><th>Không đạt</th></tr></thead><tbody>${cats.map(k=>{let a=db.checks.filter(c=>c.state!=='Hủy'&&c[field]===k),s=summary(a);return `<tr><td>${esc(k||'Chưa ghi nhóm')}</td><td>${s.checks}</td><td>${s.tested}</td><td>${s.defects}</td><td>${s.rate===null?'—':pct(s.rate)}</td><td>${s.fail}</td></tr>`}).join('')}</tbody></table></div>`}
function barChart(cats,field){let n=cats.map(k=>db.checks.filter(c=>c.state!=='Hủy'&&c[field]===k).reduce((s,c)=>s+c.defects,0)),max=Math.max(1,...n);return `<div class="bars">${cats.map((k,i)=>`<div><span>${esc(k||'Chưa ghi')}</span><b>${n[i]}</b><i style="width:${Math.max(n[i]/max*100,1)}%"></i></div>`).join('')}</div>`}
function reports(){let s=summary(),a=db.checks.filter(c=>c.state!=='Hủy'),follow=a.filter(c=>result(c)==='Không đạt'&&c.action!=='Đã đóng');return `<div class="page-head"><div><h1>📊 Báo cáo chất lượng</h1><p>Tổng hợp các phiếu chưa hủy tại ngày xem ${fmt(db.settings.asof)}.</p></div>${btn('🖨️ In báo cáo','print')}</div>${statsCards(s)}${panel('Tổng quan',`<p><b>Tỷ lệ lỗi gộp của các mẫu đã kiểm:</b> ${s.rate===null?'—':pct(s.rate)}. Đây là tổng số lỗi / tổng số lượng kiểm, không phải tỷ lệ phiếu không đạt.</p><p><b>${s.pass}</b> phiếu đạt · <b>${s.fail}</b> phiếu không đạt theo ngưỡng riêng lưu ở từng phiếu. Có <b>${s.open}</b> phiếu không đạt chưa đóng xử lý.</p>`)}<div class="two">${panel('Theo giai đoạn',summaryTable(STAGES,'stage')+barChart(STAGES,'stage'))}${panel('Theo nhóm lỗi chính',summaryTable(GROUPS.slice(1).concat(a.some(c=>c.group==='')?['']:[]),'group')+barChart(GROUPS.slice(1),'group'))}</div>${panel('Lô chưa đóng xử lý',follow.length?follow.map(c=>`<div class="mini"><button class="link" data-act="openCheck" data-id="${esc(c.id)}">${esc(c.lot)} · ${esc(c.product)}</button><small>${fmt(c.date)} · ${esc(c.action)} · ${ratio(c)===null?'—':pct(ratio(c))} lỗi</small></div>`).join(''):'<p class="success">Không có phiếu không đạt đang mở.</p>')}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt</h1></div>${panel('Ngưỡng nội bộ mặc định',`<form id="settingsForm" class="form-grid"><label>Ngày báo cáo<input name="asof" type="date" value="${db.settings.asof}"></label><label>Tỷ lệ lỗi tối đa mặc định (%)<input name="limit" type="number" min="0" max="100" step="0.01" value="${db.settings.limit}"></label><div>${btn('💾 Lưu cài đặt','saveSettings','primary')}</div></form><p class="muted">Ngưỡng mới chỉ áp dụng khi tạo phiếu tiếp theo. Mỗi phiếu lưu ngưỡng riêng tại lúc kiểm, để thay đổi cài đặt không viết lại kết luận quá khứ. Đây không phải phương pháp lấy mẫu AQL thống kê.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu / khôi phục',`<p>Dữ liệu nằm trong trình duyệt hiện tại. Sao chép HTML gốc sang máy khác không mang theo phiếu đã nhập. Dùng JSON hoặc HTML kèm dữ liệu để chuyển máy.</p><div class="actions">${btn('⬇️ JSON','exportJson','primary')}${btn('⬇️ HTML kèm dữ liệu','exportHtml')}${btn('⬇️ Excel 2 sheet','exportExcel')}${btn('⬆️ Nhập JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Dữ liệu mẫu nguồn',`<p>Mẫu gốc có 20 phiếu, kiểm 4.080 đơn vị, 93 đơn vị lỗi; 5 phiếu vượt ngưỡng 2,5%. Ngày mẫu là khoảng cách tương đối theo ngày nạp, chưa có người kiểm, số chứng từ hay hồ sơ xử lý.</p>${btn('Nạp mẫu (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ phiếu và cài đặt của app trên trình duyệt này.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Quy trình kiểm',`<ol><li>Tạo phiếu cho mỗi lần kiểm; một mã lô có thể có nhiều phiếu kiểm lại.</li><li>Nhập số lượng kiểm và số lượng lỗi. Nếu có lỗi, ghi nhóm lỗi chính; nếu không lỗi, để trống nhóm lỗi.</li><li>Tỷ lệ lỗi = số lỗi / số kiểm × 100, làm tròn hai chữ số; so với ngưỡng ghi trên phiếu để cho kết luận tính toán.</li><li>Với phiếu không đạt, ghi phương án, người phụ trách, hạn và kết quả xử lý; chỉ xác nhận sau khi đối chiếu hồ sơ nguồn.</li><li>Dùng báo cáo để xem lỗi theo giai đoạn và nhóm, in phiếu, sao lưu định kỳ.</li></ol>`)}${panel('Giới hạn dữ liệu',`<p>Ngưỡng 2,5% trong mẫu chỉ là con số doanh nghiệp tự đặt. App không đưa ra kết luận kiểm định theo tiêu chuẩn kỹ thuật hoặc AQL thống kê. Mỗi phiếu chỉ có một “nhóm lỗi chính”, không đếm phân bố mọi loại lỗi trong cùng mẫu. Kết luận tính toán không thay quyết định xử lý thực tế.</p>`)}`}
function render(){let map={home:['Tổng quan',home],checks:['Phiếu kiểm',checksPage],detail:['Chi tiết phiếu',detail],reports:['Báo cáo',reports],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,l,v='',type='text',opts=null){return `<label class="${type==='textarea'?'full':''}">${l}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(v)}</textarea>`:opts?`<select name="${n}">${opts.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o||'— Chưa ghi —')}</option>`).join('')}</select>`:`<input name="${n}" type="${type==='decimal'?'number':type}" value="${esc(v)}" ${type==='number'?'min="0" step="1"':type==='decimal'?'min="0" max="100" step="0.01"':''} ${['lot','product'].includes(n)?'required':''}>`}</label>`}
function openModal(id=''){let old=id?clone(check(id)):null;if(old?.state==='Đã xác nhận'||old?.state==='Hủy'){alert('Hãy mở lại phiếu trước khi sửa.');return}draft={id,before:old};let x=old||{},f=field('date','Ngày kiểm',x.date||today(),'date')+field('lot','Mã lô',x.lot||'')+field('product','Sản phẩm / vật tư',x.product||'')+field('stage','Giai đoạn kiểm',x.stage||'Đầu vào','text',STAGES)+field('tested','Số lượng kiểm',x.tested??0,'number')+field('defects','Số lượng lỗi',x.defects??0,'number')+field('group','Nhóm lỗi chính',x.group||'','text',GROUPS)+field('limit','Ngưỡng lỗi cho phiếu này (%)',x.limit??db.settings.limit,'decimal')+field('inspector','Người kiểm',x.inspector||'')+field('ref','Mã / vị trí hồ sơ nguồn',x.ref||'')+field('action','Phương án xử lý',x.action||'Chưa xử lý','text',ACTIONS)+field('owner','Người phụ trách xử lý',x.owner||'')+field('due','Hạn xử lý',x.due||'','date')+field('correction','Việc đã làm / kết quả',x.correction||'','textarea')+field('note','Ghi chú',x.note||'','textarea');if(id)f+=field('reason','Lý do sửa','', 'textarea');$('#modalTitle').textContent=id?'Sửa phiếu kiểm':'Tạo phiếu kiểm';$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let old=draft.before;if(old&&!x.reason){$('#formError').textContent='Cần ghi lý do sửa phiếu đã lưu.';return}x.tested=Number(x.tested);x.defects=Number(x.defects);x.limit=Number(x.limit);x.state=old?.state||'Nháp';if(!dateOK(x.date)||!x.lot||!x.product||!STAGES.includes(x.stage)||!Number.isSafeInteger(x.tested)||x.tested<1||!Number.isSafeInteger(x.defects)||x.defects<0||x.defects>x.tested||!Number.isFinite(x.limit)||x.limit<0||x.limit>100||!GROUPS.includes(x.group)||!ACTIONS.includes(x.action)||x.due&&!dateOK(x.due)){$('#formError').textContent='Kiểm tra ngày, lô, sản phẩm, số kiểm ≥ 1, số lỗi 0–số kiểm và ngưỡng 0–100%.';return}if(x.defects===0)x.group='';let backup=clone(db);delete x.reason;if(old)Object.assign(check(x.id),x);else db.checks.push(x);audit(old?'Sửa phiếu':'Tạo phiếu',(f.get('reason')||'')+' · '+x.lot,x.id);let err=validate(db);if(err){db=backup;$('#formError').textContent=err;return}$('#editor').close();selected=x.id;page='detail';save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'kiem-tra-chat-luong-sao-luu.json')}
function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'kiem-tra-chat-luong-kem-du-lieu.html')}
const HC=['ID','Ngày kiểm','Mã lô','Sản phẩm','Giai đoạn','Số kiểm','Số lỗi','Nhóm lỗi','Ngưỡng %','Trạng thái','Người kiểm','Hồ sơ nguồn','Xử lý','Người phụ trách','Hạn xử lý','Việc đã làm','Ghi chú'];
const HA=['ID','Hành động','Lý do','ID phiếu','Thời điểm'];
function sheets(){return [{name:'Phieu kiem',rows:[HC,...db.checks.map(c=>[c.id,c.date,c.lot,c.product,c.stage,c.tested,c.defects,c.group,c.limit,c.state,c.inspector,c.ref,c.action,c.owner,c.due,c.correction,c.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.checkId,a.at])]}]}
function exportExcel(){download(Excel.workbook(sheets()),'kiem-tra-chat-luong-lo.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file);for(let [n,h] of [['Phieu kiem',HC],['Nhat ky',HA]])if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng mẫu hai sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.checks=b['Phieu kiem'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),date:String(r[1]),lot:String(r[2]),product:String(r[3]),stage:String(r[4]),tested:Number(r[5]),defects:Number(r[6]),group:String(r[7]||''),limit:Number(r[8]),state:String(r[9]),inspector:String(r[10]||''),ref:String(r[11]||''),action:String(r[12]),owner:String(r[13]||''),due:String(r[14]||''),correction:String(r[15]||''),note:String(r[16]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),checkId:String(r[3]||''),at:String(r[4])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.checks.length} phiếu?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today(),rel=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};for(let r of QUALITY_SAMPLE.kq)x.checks.push({id:uid(),date:rel(r[0]),lot:r[1],product:r[2],stage:r[3],tested:r[4],defects:r[5],group:r[6],limit:2.5,state:'Nháp',inspector:'',ref:'Mẫu gốc: '+r[1],action:'Chưa xử lý',owner:'',due:'',correction:'',note:'Ngày kiểm tương đối theo ngày nạp mẫu. Nguồn chưa có người kiểm, bằng chứng hoặc xử lý.'});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;
 if(k==='newCheck')openModal();else if(k==='editCheck')openModal(id);else if(k==='openCheck'){selected=id;page='detail';render()}else if(k==='checks'){page='checks';render()}
 else if(['confirmCheck','reopenCheck','voidCheck'].includes(k)){let c=check(id);if(!c)return;if(k==='confirmCheck'){if(!c.inspector){alert('Cần ghi người kiểm trước khi xác nhận.');return}if(c.defects>0&&!c.group){alert('Cần ghi nhóm lỗi chính trước khi xác nhận.');return}if(result(c)==='Không đạt'&&c.action==='Chưa xử lý'){alert('Cần ghi phương án xử lý lô không đạt trước khi xác nhận.');return}if(c.action==='Đã đóng'&&!c.correction.trim()){alert('Cần ghi việc đã làm hoặc kết quả trước khi đóng xử lý.');return}}let reason=prompt(k==='confirmCheck'?'Ghi người rà soát / lý do xác nhận:':k==='reopenCheck'?'Ghi lý do mở lại phiếu:':'Ghi lý do hủy phiếu:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}c.state=k==='confirmCheck'?'Đã xác nhận':k==='reopenCheck'?'Nháp':'Hủy';audit(k==='confirmCheck'?'Xác nhận phiếu':k==='reopenCheck'?'Mở lại phiếu':'Hủy phiếu',reason.trim(),id);save()}
 else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),asof=String(f.get('asof')),limit=Number(f.get('limit'));if(!dateOK(asof)||!Number.isFinite(limit)||limit<0||limit>100){alert('Ngày hoặc ngưỡng không hợp lệ.');return}db.settings={asof,limit};save()}
 else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let n=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(n,n)}if(e.target.id==='stageFilter'){stageFilter=e.target.value;render()}if(e.target.id==='resultFilter'){resultFilter=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();
$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};
$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};
render();window.QualityApp={getDB:()=>clone(db),validate,ratio,result,warnings,summary,loadSample,encode,decode,sheets,importFile};
</script></body></html>
