const showDate=s=>s?String(s).split('-').reverse().join('/'):'—';
const fixed=(n,k=1)=>new Intl.NumberFormat('vi-VN',{minimumFractionDigits:k,maximumFractionDigits:k}).format(Number(n)||0);
const value=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:2}).format(Number(n)||0);
const decimal=v=>/^\d+(?:\.\d{1,4})?$/.test(String(v??'').trim())?Number(v):NaN;
const validNum=n=>Number.isFinite(n)&&n>=0&&n<=1e12;
const round1=n=>Math.round((n+Number.EPSILON)*10)/10;
function blank(){return{version:1,updatedAt:Date.now(),settings:{brand:'',asof:'',low:70},periods:[],objectives:[],krs:[],checkins:[]}}
const period=(id,d=db)=>d.periods.find(x=>x.id===id),objective=(id,d=db)=>d.objectives.find(x=>x.id===id),kr=(id,d=db)=>d.krs.find(x=>x.id===id);
const periodOfKR=(k,d=db)=>period(objective(k.objectiveId,d)?.periodId,d);
function current(d,k){let logs=d.checkins.filter(x=>x.krId===k.id).map((x,i)=>({...x,i})).sort((a,b)=>a.date.localeCompare(b.date)||a.i-b.i);return logs.length?logs.at(-1).actual:k.baseActual}
function score(d,k){let actual=current(d,k);if(k.direction==='lower'&&actual===0&&!d.checkins.some(x=>x.krId===k.id))return 0;let raw=k.direction==='lower'?(actual===0?150:k.target/actual*100):actual/k.target*100;return Math.min(150,round1(raw))}
function points(d,k){return round1(score(d,k)*k.weight/100)}
function objectiveStats(d,o){let ks=d.krs.filter(k=>k.objectiveId===o.id),weight=ks.reduce((n,k)=>n+k.weight,0),sum=ks.reduce((n,k)=>n+score(d,k)*k.weight,0);return{count:ks.length,weight,weightedPoints:round1(ks.reduce((n,k)=>n+points(d,k),0)),normalized:weight?round1(sum/weight):0}}
function sampleData(){let d=blank();let p={id:'sample-period',name:'Dữ liệu mẫu gốc',start:'',end:'',status:'open',note:'Nguồn không có kỳ OKR hoặc ngày ghi nhận'};d.periods.push(p);let names=[...new Set(SOURCE.kr.map(x=>x[0]))];for(let [i,name] of names.entries())d.objectives.push({id:'sample-objective-'+i,periodId:p.id,title:name,owner:'',note:'Mục tiêu từ file gốc'});for(let [i,[ob,title,unit,target,actual,weight,owner]] of SOURCE.kr.entries())d.krs.push({id:'sample-kr-'+i,objectiveId:d.objectives.find(o=>o.title===ob).id,title,unit,target,baseActual:actual,weight,direction:title.startsWith('Chi phí mỗi khách')?'lower':'higher',owner,dueDate:'',note:'KR từ file gốc; không có lịch sử cập nhật'});return d}
function validBackup(d){
  if(!d||d.version!==1||!d.settings||typeof d.settings.brand!=='string'||d.settings.brand.length>160||d.settings.asof&&!validDate(d.settings.asof)||!validNum(d.settings.low)||d.settings.low>150)return false;
  for(let key of ['periods','objectives','krs','checkins'])if(!Array.isArray(d[key])||d[key].length>100000)return false;
  let ids=new Set();for(let p of d.periods){if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.name!=='string'||!p.name||p.name.length>160||p.start&&!validDate(p.start)||p.end&&!validDate(p.end)||p.start&&p.end&&p.start>p.end||!['open','closed'].includes(p.status)||typeof p.note!=='string'||p.note.length>2000)return false;ids.add(p.id)}
  let oids=new Set();for(let o of d.objectives){if(!o||typeof o.id!=='string'||!o.id||oids.has(o.id)||!ids.has(o.periodId)||typeof o.title!=='string'||!o.title||o.title.length>300||typeof o.owner!=='string'||o.owner.length>160||typeof o.note!=='string'||o.note.length>2000)return false;oids.add(o.id)}
  let kids=new Set();for(let k of d.krs){if(!k||typeof k.id!=='string'||!k.id||kids.has(k.id)||!oids.has(k.objectiveId)||typeof k.title!=='string'||!k.title||k.title.length>300||typeof k.unit!=='string'||k.unit.length>80||!validNum(k.target)||k.target===0||!validNum(k.baseActual)||!validNum(k.weight)||k.weight>100||!['higher','lower'].includes(k.direction)||typeof k.owner!=='string'||k.owner.length>160||k.dueDate&&!validDate(k.dueDate)||typeof k.note!=='string'||k.note.length>2000)return false;kids.add(k.id)}
  let cids=new Set();for(let c of d.checkins){if(!c||typeof c.id!=='string'||!c.id||cids.has(c.id)||!kids.has(c.krId)||!validDate(c.date)||!validNum(c.actual)||typeof c.note!=='string'||c.note.length>2000)return false;cids.add(c.id)}
  return true;
}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return validBackup(x)?x:null}catch{return null}}

selected=db.periods[0]?.id||'';

function guidePage(){return hero('❔ Cách sử dụng','Một kỳ có nhiều mục tiêu; mỗi mục tiêu có các kết quả then chốt đo được.')+'<section class="card"><h2>Quy trình</h2><ol><li>Tạo kỳ OKR, đặt tên và ngày bắt đầu/kết thúc.</li><li>Tạo mục tiêu, thêm các KR có chỉ tiêu, đơn vị, trọng số và người phụ trách.</li><li>Chọn chiều “Tăng lên” hoặc “Giảm xuống” cho từng KR. Chi phí mỗi khách thường là chiều giảm.</li><li>Ghi check-in có ngày và kết quả thực tế; app lấy lần cập nhật mới nhất làm kết quả hiện tại.</li><li>Rà trọng số, KR dưới ngưỡng, xem báo cáo rồi chốt kỳ để khóa số liệu.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu định kỳ.</li></ol><h2>Công thức</h2><p>Chiều tăng: thực tế / chỉ tiêu. Chiều giảm: chỉ tiêu / thực tế. Mức hoàn thành tối đa 150%. Điểm KR = mức hoàn thành × trọng số / 100. Điểm mục tiêu chuẩn hóa = tổng (mức hoàn thành × trọng số) / tổng trọng số.</p><p class="notice warn">Nguồn mẫu có tổng trọng số 120%, 150%, 160% và 80% theo bốn mục tiêu. Hãy rà trước khi dùng làm OKR thật. Điểm không thay đánh giá định tính về chất lượng công việc.</p></section>'}
function render(){let names={dashboard:'Tổng quan',periods:'Kỳ OKR',objectives:'Mục tiêu',krs:'Kết quả then chốt',checkins:'Lần cập nhật',alerts:'Cần hành động',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,periods:periodsPage,objectives:objectivesPage,krs:krsPage,checkins:checkinsPage,alerts:alertsPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.brand||'Marketing OKR')+'</b> · '+esc(names[page])+' · '+showDate(asof())+'</div>'+views[page]()}
function openModal(type,id='',target=''){
  let list=db[{period:'periods',objective:'objectives',kr:'krs',checkin:'checkins'}[type]],old=list.find(x=>x.id===id)||{};
  if(type!=='period'&&type==='objective'&&!(target||old.periodId||picked()?.id)){alert('Hãy tạo kỳ OKR trước.');return}
  if(type==='kr'&&!(target||old.objectiveId||objects()[0]?.id)){alert('Hãy tạo mục tiêu trước.');return}
  if(type==='checkin'&&!(target||old.krId||keys()[0]?.id)){alert('Hãy tạo KR trước.');return}
  modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+({period:'kỳ OKR',objective:'mục tiêu',kr:'kết quả then chốt',checkin:'lần cập nhật'}[type]);let h='';
  if(type==='period')h=field('name','Tên kỳ *','text',old.name||'')+field('start','Ngày bắt đầu','date',old.start||'')+field('end','Ngày kết thúc','date',old.end||'')+field('note','Ghi chú kỳ','textarea',old.note||'');
  if(type==='objective')h=field('periodId','Kỳ OKR','select','',db.periods.filter(p=>p.status==='open'||p.id===old.periodId).map(p=>opt(p.id,p.name,old.periodId||target||picked()?.id)).join(''))+field('title','Mục tiêu *','text',old.title||'')+field('owner','Người phụ trách','text',old.owner||'')+field('note','Mô tả / định hướng','textarea',old.note||'');
  if(type==='kr')h=field('objectiveId','Mục tiêu','select','',db.objectives.filter(o=>period(o.periodId)?.status==='open'||o.id===old.objectiveId).map(o=>opt(o.id,o.title+' · '+period(o.periodId)?.name,old.objectiveId||target||objects()[0]?.id)).join(''))+field('title','Kết quả then chốt *','text',old.title||'')+field('unit','Đơn vị','text',old.unit||'')+field('target','Chỉ tiêu (> 0)','number',old.target??1)+field('baseActual','Kết quả ban đầu','number',old.baseActual??0)+field('weight','Trọng số trong mục tiêu (%)','number',old.weight??0)+field('direction','Chiều tốt lên','select','',opt('higher','Tăng lên',old.direction||'higher')+opt('lower','Giảm xuống',old.direction||'higher'))+field('owner','Người phụ trách','text',old.owner||'')+field('dueDate','Hạn KR','date',old.dueDate||'')+field('note','Ghi chú','textarea',old.note||'');
  if(type==='checkin')h=field('krId','KR *','select','',db.krs.filter(k=>periodOfKR(k)?.status==='open'||k.id===old.krId).map(k=>opt(k.id,k.title+' · '+objective(k.objectiveId)?.title,old.krId||target||keys()[0]?.id)).join(''))+field('date','Ngày cập nhật','date',old.date||today())+field('actual','Kết quả thực tế','number',old.actual??0)+field('note','Diễn biến / minh chứng','textarea',old.note||'');
  if(id)h+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bản ghi này</button></div>';
  $('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal();
}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){
  if(!modal)return;let{type,id}=modal,x={},error='';
  if(type==='period'){x={name:v('name'),start:v('start'),end:v('end'),note:v('note')};if(!x.name||x.name.length>160||x.start&&!validDate(x.start)||x.end&&!validDate(x.end)||x.start&&x.end&&x.start>x.end||x.note.length>2000)error='Tên kỳ hoặc ngày không hợp lệ.';if(id&&period(id)?.status==='closed')error='Kỳ đã chốt. Hãy mở lại kỳ trước khi sửa.'}
  if(type==='objective'){x={periodId:v('periodId'),title:v('title'),owner:v('owner'),note:v('note')};if(!period(x.periodId)||period(x.periodId).status!=='open'||!x.title||x.title.length>300||x.owner.length>160||x.note.length>2000)error='Kỳ, tên mục tiêu hoặc người phụ trách không hợp lệ.';if(id&&period(objective(id)?.periodId)?.status==='closed')error='Kỳ đã chốt. Hãy mở lại để sửa.'}
  if(type==='kr'){x={objectiveId:v('objectiveId'),title:v('title'),unit:v('unit'),target:decimal(v('target')),baseActual:decimal(v('baseActual')),weight:decimal(v('weight')),direction:v('direction'),owner:v('owner'),dueDate:v('dueDate'),note:v('note')};let o=objective(x.objectiveId);if(!o||period(o.periodId)?.status!=='open'||!x.title||x.title.length>300||x.unit.length>80||!validNum(x.target)||x.target===0||!validNum(x.baseActual)||!validNum(x.weight)||x.weight>100||!['higher','lower'].includes(x.direction)||x.owner.length>160||x.dueDate&&!validDate(x.dueDate)||x.note.length>2000)error='Mục tiêu, chỉ tiêu, trọng số hoặc ngày không hợp lệ.';let old=kr(id);if(id&&periodOfKR(old)?.status==='closed')error='Kỳ đã chốt. Hãy mở lại để sửa.';if(id&&db.checkins.some(c=>c.krId===id)&&[x.target!==old.target,x.baseActual!==old.baseActual,x.weight!==old.weight,x.direction!==old.direction,x.objectiveId!==old.objectiveId].some(Boolean))error='KR đã có check-in; không đổi chỉ tiêu, trọng số, chiều hoặc mục tiêu. Tạo KR mới cho chỉ tiêu mới.'}
  if(type==='checkin'){x={krId:v('krId'),date:v('date'),actual:decimal(v('actual')),note:v('note')};let k=kr(x.krId);if(!k||periodOfKR(k)?.status!=='open'||!validDate(x.date)||!validNum(x.actual)||x.note.length>2000)error='KR, ngày hoặc kết quả không hợp lệ.';if(id&&periodOfKR(kr(db.checkins.find(c=>c.id===id)?.krId))?.status==='closed')error='Kỳ đã chốt. Hãy mở lại để sửa.'}
  if(error){$('#modalError').textContent=error;return}
  let key={period:'periods',objective:'objectives',kr:'krs',checkin:'checkins'}[type],d={...db,[key]:db[key].slice()},list=d[key];if(id){let i=list.findIndex(a=>a.id===id);list[i]={...list[i],...x}}else list.push({id:uid(),...x,...(type==='period'?{status:'open'}:{})});
  if(!validBackup(d)){$('#modalError').textContent='Dữ liệu hoặc liên kết không hợp lệ.';return}db=d;if(type==='period'&&!id)selected=list.at(-1).id;closeModal();save();
}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('marketing-okr-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Kỳ','Mục tiêu','KR','Đơn vị','Chỉ tiêu','Kết quả hiện tại','Trọng số','Chiều','Người phụ trách','Hoàn thành %','Điểm KR','Hạn KR']];for(let k of db.krs){let o=objective(k.objectiveId);rows.push([period(o.periodId)?.name,o.title,k.title,k.unit,k.target,current(db,k),k.weight,k.direction,k.owner,score(db,k),points(db,k),k.dueDate])}let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('marketing-okr-kr.csv',body,'text/csv;charset=utf-8')}
function excelSheets(){return[
  {name:'Ky OKR',rows:[['Mã kỳ','Tên kỳ','Bắt đầu','Kết thúc','Trạng thái','Ghi chú'],...db.periods.map(p=>[p.id,p.name,p.start,p.end,p.status,p.note])]},
  {name:'Muc tieu',rows:[['Mã mục tiêu','Mã kỳ','Tên mục tiêu','Người phụ trách','Ghi chú'],...db.objectives.map(o=>[o.id,o.periodId,o.title,o.owner,o.note])]},
  {name:'Ket qua then chot',rows:[['Mã KR','Mã mục tiêu','Tên KR','Đơn vị','Chỉ tiêu','Kết quả ban đầu','Trọng số','Chiều','Người phụ trách','Hạn KR','Ghi chú'],...db.krs.map(k=>[k.id,k.objectiveId,k.title,k.unit,k.target,k.baseActual,k.weight,k.direction,k.owner,k.dueDate,k.note])]},
  {name:'Lan cap nhat',rows:[['Mã cập nhật','Mã KR','Ngày','Kết quả','Ghi chú'],...db.checkins.map(c=>[c.id,c.krId,c.date,c.actual,c.note])]},
  {name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]}
]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='marketing-okr.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
const optionalDate=v=>String(v??'').trim()?(parseDate(v)||'INVALID'):'';
function parsedExcel(sheets){for(let [name,head] of [['Ky OKR','Mã kỳ'],['Muc tieu','Mã mục tiêu'],['Ket qua then chot','Mã KR'],['Lan cap nhat','Mã cập nhật']])if(!sheets[name]||sheets[name][0]?.[0]!==head)throw Error('Cần workbook do app xuất với bốn bảng liên kết.');let d=blank();
  for(let r of sheets['Ky OKR'].slice(1)){if(!String(r[0]??'').trim())continue;d.periods.push({id:String(r[0]).trim(),name:String(r[1]??'').trim(),start:optionalDate(r[2]),end:optionalDate(r[3]),status:String(r[4]??'').trim(),note:String(r[5]??'')})}
  for(let r of sheets['Muc tieu'].slice(1)){if(!String(r[0]??'').trim())continue;d.objectives.push({id:String(r[0]).trim(),periodId:String(r[1]??'').trim(),title:String(r[2]??'').trim(),owner:String(r[3]??'').trim(),note:String(r[4]??'')})}
  for(let r of sheets['Ket qua then chot'].slice(1)){if(!String(r[0]??'').trim())continue;d.krs.push({id:String(r[0]).trim(),objectiveId:String(r[1]??'').trim(),title:String(r[2]??'').trim(),unit:String(r[3]??'').trim(),target:decimal(r[4]),baseActual:decimal(r[5]),weight:decimal(r[6]),direction:String(r[7]??'').trim(),owner:String(r[8]??'').trim(),dueDate:optionalDate(r[9]),note:String(r[10]??'')})}
  for(let r of sheets['Lan cap nhat'].slice(1)){if(!String(r[0]??'').trim())continue;d.checkins.push({id:String(r[0]).trim(),krId:String(r[1]??'').trim(),date:parseDate(r[2]),actual:decimal(r[3]),note:String(r[4]??'')})}
  if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));if(raw.brand!==undefined)d.settings.brand=String(raw.brand);if(raw.asof!==undefined)d.settings.asof=optionalDate(raw.asof);if(raw.low!==undefined)d.settings.low=decimal(raw.low)}
  if(!validBackup(d))throw Error('Excel có mã trùng, sai liên kết, ngày, chỉ tiêu hoặc trạng thái không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;selected=db.periods[0]?.id||'';save()}
function print(){window.print()}
document.addEventListener('click',e=>{
  let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;
  if(b.dataset.page){page=b.dataset.page;query='';render();return}
  if(b.dataset.new){openModal(b.dataset.new,'',b.dataset.target||'');return}
  if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}
  let a=b.dataset.action;
  if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();
  if(a==='backup')download('marketing-okr-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();
  if(a==='sample'){if((db.periods.length||db.objectives.length||db.krs.length)&&!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sampleData();selected=db.periods[0].id;save()}
  if(a==='clear'){if(confirm('Xóa toàn bộ kỳ, mục tiêu, KR và check-in trên trình duyệt này?')){db=blank();selected='';save()}}
  if(a==='selectPeriod'){selected=b.dataset.id;page='dashboard';render()}
  if(a==='togglePeriod'){let p=period(b.dataset.id);if(!p)return;let closing=p.status==='open';if(confirm(closing?'Chốt kỳ này và khóa sửa mục tiêu, KR, check-in?':'Mở lại kỳ để cho phép chỉnh sửa?')){p.status=closing?'closed':'open';save()}}
  if(a==='deleteRecord'&&modal?.id){let{type,id}=modal,old=type==='period'?period(id):type==='objective'?objective(id):type==='kr'?kr(id):db.checkins.find(c=>c.id===id),p=type==='period'?old:type==='objective'?period(old.periodId):type==='kr'?periodOfKR(old):periodOfKR(kr(old.krId));if(p?.status==='closed'){$('#modalError').textContent='Kỳ đã chốt. Hãy mở lại trước khi xóa.';return}if(type==='period'&&db.objectives.some(o=>o.periodId===id)||type==='objective'&&db.krs.some(k=>k.objectiveId===id)||type==='kr'&&db.checkins.some(c=>c.krId===id)){$('#modalError').textContent='Bản ghi có dữ liệu phụ thuộc; không thể xóa.';return}if(confirm('Xóa vĩnh viễn bản ghi này?')){let key={period:'periods',objective:'objectives',kr:'krs',checkin:'checkins'}[type];db[key]=db[key].filter(x=>x.id!==id);if(type==='period'&&selected===id)selected=db.periods[0]?.id||'';closeModal();save()}}
  if(a==='settings'){let d={...db,settings:{brand:v('brand'),asof:v('asof'),low:decimal(v('low'))}};if(!validBackup(d)){alert('Tên dự án, ngày hoặc ngưỡng không hợp lệ.');return}db=d;save()}
});
document.addEventListener('change',e=>{if(e.target.id==='periodPick'){selected=e.target.value;query='';render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;selected=db.periods[0]?.id||'';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
