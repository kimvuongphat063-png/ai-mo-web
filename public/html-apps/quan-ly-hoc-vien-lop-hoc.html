function reportPage(){let planned=db.classes.reduce((a,c)=>a+forecast(c),0),total=db.students.length,active=db.students.filter(s=>s.status==='Đang học').length;return hero('Báo cáo quản lý lớp','Đối chiếu sĩ số và học phí kế hoạch theo tình trạng hiện tại.')+`<div class="grid">${metric('Tổng hồ sơ',num(total))}${metric('Đang học',num(active))}${metric('Tỷ lệ đang học',total?Math.round(active/total*1000)/10+'%':'—')}${metric('Giá trị học phí kế hoạch',money(planned))}</div><div class="card"><h2>Theo lớp</h2>${classTable(db.classes)}</div><div class="card"><h2>Theo tình trạng học</h2><div class="table-wrap"><table class="report-table"><thead><tr><th>Tình trạng</th><th>Số học viên</th><th>Tỷ trọng</th></tr></thead><tbody>${statusSummary().map(x=>`<tr><td>${badge(x.status)}</td><td>${num(x.count)}</td><td>${total?Math.round(x.count/total*1000)/10:0}%</td></tr>`).join('')}</tbody></table></div></div><div class="hint">Đây là báo cáo sĩ số và giá trị học phí kế hoạch = học viên đang học × mức học phí hiện tại của lớp. Không ghi nhận tiền đã thu, khoản phải thu hoặc doanh thu kế toán.</div><div class="toolbar no-print">${button('⬇️ Xuất Excel 3 sheet','exportExcel','primary')}${button('🖨️ In báo cáo','print')}</div>`}
function settingsPage(){return hero('Cài đặt','Điều chỉnh tên đơn vị và ngưỡng cảnh báo lớp còn nhiều chỗ trống.')+`<div class="card"><h2>Thông số</h2><div class="formgrid"><div class="field"><label for="org">Tên đơn vị</label><input id="org" maxlength="120" value="${esc(db.settings.org)}" placeholder="Tên trung tâm hoặc trường"></div><div class="field"><label for="lowFill">Cảnh báo lấp đầy dưới (%)</label><input id="lowFill" type="number" min="0" max="100" value="${db.settings.lowFill}"></div></div><div class="toolbar" style="margin-top:15px">${button('Lưu cài đặt','saveSettings','primary')}</div></div><div class="hint">Ngưỡng cảnh báo chỉ dùng cho lớp chưa kết thúc và đã có ít nhất một học viên đang học. Lớp vượt sĩ số hoặc lớp kết thúc còn học viên đang học luôn được cảnh báo.</div>`}
function dataPage(){return hero('Dữ liệu & sao lưu','Dữ liệu thật bắt đầu trống. Mẫu 5 lớp/20 học viên chỉ nạp khi anh chọn.')+`<div class="card"><h2>Xuất và nhập dữ liệu</h2><div class="data-actions">${button('⬇️ Sao lưu JSON','backup','primary')}${button('⬇️ HTML kèm dữ liệu','portable')}${button('⬆️ Khôi phục JSON','restore')}${button('⬇️ Xuất Excel','exportExcel')}${button('⬆️ Nhập Excel','importExcel')}</div><p class="muted">File Excel có 3 sheet Lớp học, Học viên, Nhật ký. Nhập Excel sẽ thay toàn bộ dữ liệu hiện tại sau khi kiểm tra và xác nhận. Để chỉnh sửa ở Excel, hãy xuất một file mẫu từ app rồi giữ nguyên tên cột.</p></div><div class="card"><h2>Bắt đầu thử với dữ liệu mẫu</h2><p>Nạp đúng 5 lớp và 20 học viên từ file tham chiếu. Ngày vào lớp được đặt tương đối so với ngày nạp; tên người liên hệ lỗi chữ trong mẫu gốc được chuẩn hóa thành “Người liên hệ của …”.</p>${button('Nạp dữ liệu mẫu','loadDemo')}</div><div class="card"><h2>Xóa dữ liệu trên thiết bị</h2><p>Hành động này xóa lớp, học viên, nhật ký và cài đặt trong trình duyệt hiện tại. Hãy sao lưu trước.</p>${button('Xóa toàn bộ dữ liệu','clear','danger')}</div><div class="hint">File HTML gốc không tự mang dữ liệu nhập sau này. Dùng “HTML kèm dữ liệu” hoặc JSON để chuyển máy. Các file sao lưu chứa thông tin học viên và số điện thoại ở dạng đọc được; lưu ở nơi anh kiểm soát.</div>`}
function guidePage(){return hero('Cách sử dụng','Quản lý lớp từ khi nhập học đến bảo lưu, hoàn thành hoặc chuyển lớp.')+`<div class="card"><h2>Quy trình 5 bước</h2><ol><li>Ở <b>Lớp học</b>, tạo lớp với mã duy nhất, sĩ số tối đa và học phí mỗi học viên.</li><li>Ở <b>Học viên</b>, tạo hồ sơ, chọn lớp và tình trạng ban đầu. Chỉ tình trạng “Đang học” chiếm sĩ số.</li><li>Mở hồ sơ học viên để <b>đổi tình trạng hoặc chuyển lớp</b>. Nhập ngày hiệu lực và lý do; app ghi nhật ký.</li><li>Xem <b>Tổng quan/Báo cáo</b> để rà lớp vượt sĩ số, lớp còn nhiều chỗ và giá trị học phí kế hoạch.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu thường xuyên. Dùng Excel 3 sheet để rà và chuyển dữ liệu.</li></ol></div><div class="grid two"><div class="card"><h2>Cách tính</h2><p>Đang học = số học viên có tình trạng “Đang học” trong lớp hiện tại.</p><p>Còn chỗ = sĩ số tối đa − đang học. Giá trị âm nghĩa là vượt sĩ số.</p><p>Lấp đầy = đang học ÷ sĩ số tối đa × 100%.</p><p>Giá trị học phí kế hoạch = đang học × học phí mỗi học viên theo mức hiện tại của lớp.</p></div><div class="card"><h2>Phạm vi dữ liệu</h2><p>File tham chiếu có 2 bảng, 5 lớp và 20 học viên. Bản này bổ sung nhật ký trạng thái, mã học viên ổn định, kiểm tra liên kết và báo cáo.</p><p>Chưa có điểm danh, học phí thực thu, công nợ, lịch dạy chi tiết hay gửi nhắc việc. Các nghiệp vụ đó thuộc những app riêng trong danh sách.</p></div></div>`}
const titles={dashboard:'Tổng quan',classes:'Lớp học',classDetail:'Chi tiết lớp',students:'Học viên',studentDetail:'Hồ sơ học viên',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};
function render(){let view={dashboard,classes:classesPage,classDetail,students:studentsPage,studentDetail,report:reportPage,settings:settingsPage,data:dataPage,guide:guidePage}[page]||dashboard;$('#screen').innerHTML=view();$('#topTitle').textContent=titles[page]||'Tổng quan';$('#topSub').textContent=db.settings.org||'Quản lý học viên và lớp học';$$('.side-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='classDetail'&&b.dataset.page==='classes')||(page==='studentDetail'&&b.dataset.page==='students')))}
function formField(label,key,value,type='text',extra=''){return`<div class="field"><label for="f_${key}">${esc(label)}</label><input id="f_${key}" data-field="${key}" type="${type}" value="${esc(value??'')}" ${extra}></div>`}
function formSelect(label,key,value,items){return`<div class="field"><label for="f_${key}">${esc(label)}</label><select id="f_${key}" data-field="${key}">${items.map(x=>{let val=typeof x==='string'?x:x.value,txt=typeof x==='string'?x:x.label;return`<option value="${esc(val)}" ${value===val?'selected':''}>${esc(txt)}</option>`}).join('')}</select></div>`}
function formArea(label,key,value){return`<div class="field full"><label for="f_${key}">${esc(label)}</label><textarea id="f_${key}" data-field="${key}" maxlength="1000">${esc(value||'')}</textarea></div>`}
function showModal(kind,id=''){draftKind=kind;let existing=kind==='class'?cls(id):kind==='student'?student(id):kind==='event'?student(id):null;draft=existing?clone(existing):null;let title='',fields='';if(kind==='class'){if(!draft)draft={id:null,code:'',name:'',teacher:'',capacity:20,fee:0,schedule:'',room:'',state:'Đang học',note:''};title=(id?'Sửa':'Thêm')+' lớp học';fields=formField('Mã lớp *','code',draft.code,'text','maxlength="24" required')+formField('Tên lớp *','name',draft.name,'text','maxlength="120" required')+formField('Giáo viên','teacher',draft.teacher,'text','maxlength="100"')+formSelect('Trạng thái lớp','state',draft.state,CLASS_STATES)+formField('Sĩ số tối đa *','capacity',draft.capacity,'number','min="1" max="10000"')+formField('Học phí mỗi học viên','fee',draft.fee,'number','min="0" step="1"')+formField('Lịch học','schedule',draft.schedule,'text','maxlength="120" placeholder="Ví dụ: Thứ 2, 4 · 18:00"')+formField('Phòng học','room',draft.room,'text','maxlength="80"')+formArea('Ghi chú','note',draft.note)}else if(kind==='student'){if(!draft)draft={id:null,code:nextStudentCode(),name:'',classId:classId&&cls(classId)?classId:db.classes[0]?.id||'',enrolled:today(),status:'Đang học',parent:'',phone:'',birth:'',note:''};title=(id?'Sửa hồ sơ':'Thêm học viên');fields=formField('Mã học viên *','code',draft.code,'text',id?'readonly':'maxlength="24" required')+formField('Họ và tên *','name',draft.name,'text','maxlength="120" required')+(id?`<div class="field"><label>Lớp và tình trạng</label><p>${esc(cls(draft.classId)?.code||'?')} · ${esc(draft.status)}<br><small>Đổi ở mục “Đổi tình trạng / lớp” để có nhật ký.</small></p></div><div class="field"><label>Ngày vào lớp</label><p>${date(draft.enrolled)}</p></div>`:formSelect('Lớp học *','classId',draft.classId,db.classes.map(c=>({value:c.id,label:c.code+' · '+c.name})))+formSelect('Tình trạng ban đầu','status',draft.status,STATUSES)+formField('Ngày vào lớp *','enrolled',draft.enrolled,'date'))+formField('Ngày sinh','birth',draft.birth,'date')+formField('Phụ huynh / người liên hệ','parent',draft.parent,'text','maxlength="120"')+formField('Điện thoại','phone',draft.phone,'tel','maxlength="24"')+formArea('Ghi chú','note',draft.note)}else if(kind==='event'){if(!draft)return;draft={studentId:id,date:today(),toStatus:existing.status,toClassId:existing.classId,reason:''};title='Đổi tình trạng hoặc chuyển lớp · '+existing.name;fields=formField('Ngày hiệu lực *','date',draft.date,'date')+formSelect('Tình trạng mới','toStatus',draft.toStatus,STATUSES)+formSelect('Lớp mới','toClassId',draft.toClassId,db.classes.map(c=>({value:c.id,label:c.code+' · '+c.name})))+formArea('Lý do thay đổi *','reason',draft.reason)}$('#modalTitle').textContent=title;$('#modalFields').innerHTML=fields;$('#modalError').textContent='';$('#editor').showModal()}
function modalError(msg){$('#modalError').textContent=msg;return false}
function collectFields(){let out={};$$('[data-field]',$('#modalFields')).forEach(x=>out[x.dataset.field]=x.value.trim());return out}
function capacityCheck(classTarget,studentStatus,old){if(studentStatus!=='Đang học')return true;let c=cls(classTarget),current=activeCount(classTarget)-(old&&old.classId===classTarget&&old.status==='Đang học'?1:0);return current+1<=c.capacity||confirm(`Lớp ${c.code} sẽ vượt sĩ số ${c.capacity} (${current+1} đang học). Vẫn lưu và hiện cảnh báo?`)}
function saveModal(){let f=collectFields();if(draftKind==='class'){let code=f.code.toUpperCase();if(!/^[A-Z0-9_-]{2,24}$/.test(code))return modalError('Mã lớp cần 2–24 ký tự A–Z, số, _ hoặc -.');if(!f.name||f.name.length>120)return modalError('Nhập tên lớp tối đa 120 ký tự.');if(db.classes.some(c=>c.code.toLowerCase()===code.toLowerCase()&&c.id!==draft.id))return modalError('Mã lớp đã tồn tại.');let capacity=Number(f.capacity),fee=Number(f.fee);if(!Number.isInteger(capacity)||capacity<1||capacity>10000)return modalError('Sĩ số tối đa cần từ 1 đến 10.000.');if(!Number.isInteger(fee)||fee<0||fee>1e10)return modalError('Học phí cần là số nguyên không âm.');if(!CLASS_STATES.includes(f.state))return modalError('Tình trạng lớp không hợp lệ.');let c={id:draft.id||uid(),code,name:f.name,teacher:f.teacher.slice(0,100),capacity,fee,schedule:f.schedule.slice(0,120),room:f.room.slice(0,80),state:f.state,note:f.note.slice(0,1000)};if(draft.id){if(activeCount(c.id)>capacity&&!confirm('Sĩ số hiện tại vượt mức tối đa mới. Lưu và hiển thị cảnh báo?'))return;Object.assign(cls(c.id),c)}else db.classes.push(c);classId=c.id;page='classDetail'}else if(draftKind==='student'){let id=draft.id,code=f.code.toUpperCase(),name=f.name;if(!/^HV[A-Z0-9_-]{1,22}$/.test(code))return modalError('Mã học viên cần bắt đầu bằng HV và có 3–24 ký tự.');if(db.students.some(s=>s.code.toLowerCase()===code.toLowerCase()&&s.id!==id))return modalError('Mã học viên đã tồn tại.');if(!name||name.length>120)return modalError('Nhập họ tên học viên tối đa 120 ký tự.');if(f.phone&&!/^[0-9+().\s-]{8,24}$/.test(f.phone))return modalError('Số điện thoại cần 8–24 ký tự số và dấu hợp lệ.');if(f.birth&&!validDate(f.birth))return modalError('Ngày sinh không hợp lệ.');if(f.birth&&f.birth>today())return modalError('Ngày sinh không được ở tương lai.');let classTarget=id?draft.classId:f.classId,status=id?draft.status:f.status,enrolled=id?draft.enrolled:f.enrolled;if(!cls(classTarget))return modalError('Hãy tạo và chọn một lớp học.');if(!STATUSES.includes(status)||!validDate(enrolled)||enrolled>today())return modalError('Tình trạng hoặc ngày vào lớp không hợp lệ.');if(!id&&!capacityCheck(classTarget,status,null))return;let duplicate=db.students.find(s=>s.id!==id&&s.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi')&&s.phone&&s.phone===f.phone);if(duplicate&&!confirm(`Đã có học viên cùng tên và số điện thoại: ${duplicate.code}. Vẫn lưu hồ sơ này?`))return;let s={id:id||uid(),code,name,classId:classTarget,enrolled,status,parent:f.parent.slice(0,120),phone:f.phone,birth:f.birth,note:f.note.slice(0,1000)};if(id)Object.assign(student(id),s);else db.students.push(s);studentId=s.id;page='studentDetail'}else if(draftKind==='event'){let s=student(draft.studentId);if(!s)return modalError('Hồ sơ học viên không tồn tại.');if(!STATUSES.includes(f.toStatus)||!cls(f.toClassId))return modalError('Chọn tình trạng và lớp hợp lệ.');if(f.toStatus===s.status&&f.toClassId===s.classId)return modalError('Chưa có thay đổi tình trạng hoặc lớp.');if(!validDate(f.date)||f.date<s.enrolled||f.date>today())return modalError('Ngày hiệu lực phải từ ngày vào lớp đến hôm nay.');let recent=db.events.filter(e=>e.studentId===s.id).sort((a,b)=>a.date.localeCompare(b.date)).at(-1);if(recent&&f.date<recent.date)return modalError('Ngày hiệu lực không được trước lần đổi gần nhất.');if(!f.reason||f.reason.length>1000)return modalError('Nhập lý do tối đa 1.000 ký tự.');if(!capacityCheck(f.toClassId,f.toStatus,s))return;db.events.push({id:uid(),studentId:s.id,date:f.date,fromStatus:s.status,toStatus:f.toStatus,fromClassId:s.classId,toClassId:f.toClassId,reason:f.reason,createdAt:stamp()});s.status=f.toStatus;s.classId=f.toClassId;studentId=s.id;page='studentDetail'}$('#editor').close();draft=null;save()}
function downloadBlob(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function backup(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'quan-ly-hoc-vien-lop-hoc.json')}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');downloadBlob(new Blob(['<!doctype html>\n'+html],{type:'text/html;charset=utf-8'}),'quan-ly-hoc-vien-lop-hoc-kem-du-lieu.html')}
const CLASS_HEADERS=['Mã lớp','Tên lớp','Giáo viên','Sĩ số tối đa','Học phí mỗi học viên','Lịch học','Phòng học','Tình trạng lớp','Ghi chú'];
const STUDENT_HEADERS=['Mã học viên','Họ và tên','Mã lớp','Ngày vào','Tình trạng','Phụ huynh / người liên hệ','Điện thoại','Ngày sinh','Ghi chú'];
const EVENT_HEADERS=['Mã học viên','Ngày hiệu lực','Từ tình trạng','Đến tình trạng','Từ lớp','Đến lớp','Lý do','Thời điểm ghi'];
function exportExcel(){let sheets=[{name:'Lop hoc',rows:[CLASS_HEADERS,...db.classes.map(c=>[c.code,c.name,c.teacher,c.capacity,c.fee,c.schedule,c.room,c.state,c.note])]},{name:'Hoc vien',rows:[STUDENT_HEADERS,...db.students.map(s=>[s.code,s.name,cls(s.classId)?.code||'',s.enrolled,s.status,s.parent,s.phone,s.birth,s.note])]},{name:'Nhat ky',rows:[EVENT_HEADERS,...db.events.map(e=>[student(e.studentId)?.code||'',e.date,e.fromStatus,e.toStatus,cls(e.fromClassId)?.code||'',cls(e.toClassId)?.code||'',e.reason,e.createdAt])]}];downloadBlob(Excel.workbook(sheets),'quan-ly-hoc-vien-lop-hoc.xlsx')}
function sheetDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}return String(v||'').trim()}
function fromExcel(book){let classes=book['Lop hoc'],students=book['Hoc vien'],events=book['Nhat ky'];if(!classes||!students)throw Error('Thiếu sheet “Lop hoc” hoặc “Hoc vien”. Hãy nhập file xuất từ app.');let same=(a,b)=>b.every((x,i)=>String(a?.[i]??'').trim()===x);if(!same(classes[0],CLASS_HEADERS)||!same(students[0],STUDENT_HEADERS)||events&&!same(events[0],EVENT_HEADERS))throw Error('Tên cột không khớp mẫu Excel của app.');let x=empty(),byClass=new Map(),byStudent=new Map();x.settings=clone(db.settings);for(let [i,r] of classes.slice(1).entries()){if(!String(r[0]??'').trim())continue;let code=String(r[0]).trim().toUpperCase();if(byClass.has(code))throw Error('Trùng mã lớp ở dòng '+(i+2));let c={id:uid(),code,name:String(r[1]??'').trim(),teacher:String(r[2]??'').trim(),capacity:Number(r[3]),fee:Number(r[4]),schedule:String(r[5]??''),room:String(r[6]??''),state:String(r[7]||'Đang học').trim(),note:String(r[8]??'')};x.classes.push(c);byClass.set(code,c)}for(let [i,r] of students.slice(1).entries()){if(!String(r[0]??'').trim())continue;let code=String(r[0]).trim().toUpperCase(),classCode=String(r[2]??'').trim().toUpperCase(),c=byClass.get(classCode);if(byStudent.has(code))throw Error('Trùng mã học viên ở dòng '+(i+2));if(!c)throw Error('Không tìm thấy lớp '+classCode+' ở dòng học viên '+(i+2));let s={id:uid(),code,name:String(r[1]??'').trim(),classId:c.id,enrolled:sheetDate(r[3]),status:String(r[4]??'').trim(),parent:String(r[5]??''),phone:String(r[6]??''),birth:sheetDate(r[7]),note:String(r[8]??'')};x.students.push(s);byStudent.set(code,s)}for(let [i,r] of (events||[]).slice(1).entries()){if(!String(r[0]??'').trim())continue;let studentCode=String(r[0]).trim().toUpperCase(),s=byStudent.get(studentCode),from=byClass.get(String(r[4]??'').trim().toUpperCase()),to=byClass.get(String(r[5]??'').trim().toUpperCase());if(!s||!from||!to)throw Error('Nhật ký dòng '+(i+2)+' có mã học viên/lớp không tồn tại.');x.events.push({id:uid(),studentId:s.id,date:sheetDate(r[1]),fromStatus:String(r[2]??''),toStatus:String(r[3]??''),fromClassId:from.id,toClassId:to.id,reason:String(r[6]??''),createdAt:String(r[7]||stamp())})}let err=validate(x);if(err)throw Error(err);return x}
function loadDemo(){if((db.classes.length||db.students.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),ref=new Map();for(let row of CLASSROOM_SAMPLE.lop){let c={id:uid(),code:row[0],name:row[1],teacher:row[2],capacity:row[3],fee:row[4],schedule:'',room:'',state:'Đang học',note:''};x.classes.push(c);ref.set(c.code,c.id)}for(let [i,row] of CLASSROOM_SAMPLE.hv.entries()){let name=row[0],parent='Người liên hệ của '+name.replace(/^Bé\s+/,'');x.students.push({id:uid(),code:'HV'+String(i+1).padStart(4,'0'),name,classId:ref.get(row[1]),enrolled:addDays(today(),Number(String(row[2]).replace('@',''))),status:row[3],parent,phone:row[5],birth:'',note:''})}x.settings=clone(db.settings);db=x;page='dashboard';save()}
function deleteClass(){let c=cls(classId);if(!c)return;if(db.students.some(s=>s.classId===c.id)||db.events.some(e=>e.fromClassId===c.id||e.toClassId===c.id)){alert('Không thể xóa lớp đang được học viên hoặc nhật ký tham chiếu. Hãy lưu lớp ở trạng thái Kết thúc.');return}if(!confirm(`Xóa lớp ${c.code}?`))return;db.classes=db.classes.filter(x=>x.id!==c.id);page='classes';save()}
function deleteStudent(){let s=student(studentId);if(!s)return;if(!confirm(`Xóa hồ sơ ${s.code} · ${s.name} và toàn bộ nhật ký của học viên này?`))return;db.students=db.students.filter(x=>x.id!==s.id);db.events=db.events.filter(x=>x.studentId!==s.id);page='students';save()}
function act(name){if(name==='newClass')showModal('class');else if(name==='editClass')showModal('class',classId);else if(name==='newStudent'){if(!db.classes.length){alert('Hãy tạo một lớp trước khi thêm học viên.');return}showModal('student')}else if(name==='editStudent')showModal('student',studentId);else if(name==='newEvent')showModal('event',studentId);else if(name==='goClasses'){page='classes';render()}else if(name==='goStudents'){page='students';render()}else if(name==='deleteClass')deleteClass();else if(name==='deleteStudent')deleteStudent();else if(name==='exportExcel')exportExcel();else if(name==='importExcel')$('#excelFile').click();else if(name==='backup')backup();else if(name==='portable')portable();else if(name==='restore')$('#jsonFile').click();else if(name==='loadDemo')loadDemo();else if(name==='clear'){if(!confirm('Xóa toàn bộ dữ liệu lớp và học viên trên trình duyệt này?'))return;db=empty();page='dashboard';save()}else if(name==='print')window.print();else if(name==='saveSettings'){let org=$('#org').value.trim(),low=Number($('#lowFill').value);if(org.length>120||!Number.isFinite(low)||low<0||low>100){alert('Tên đơn vị tối đa 120 ký tự; ngưỡng cảnh báo từ 0 đến 100%.');return}db.settings={org,lowFill:low};save()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-open-class],[data-open-student]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0)}else if(b.dataset.openClass){classId=b.dataset.openClass;page='classDetail';render();window.scrollTo(0,0)}else if(b.dataset.openStudent){studentId=b.dataset.openStudent;page='studentDetail';render();window.scrollTo(0,0)}else if(b.dataset.action)act(b.dataset.action)});
$('#modalSave').addEventListener('click',saveModal);$('#modalClose').addEventListener('click',()=>$('#editor').close());$('#modalCancel').addEventListener('click',()=>$('#editor').close());$('#quickPrint').addEventListener('click',()=>window.print());
document.addEventListener('change',e=>{if(e.target.id==='classFilter'){classFilter=e.target.value;render()}else if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();let x=$('#search');x?.focus();x?.setSelectionRange(pos,pos)},250)}});
$('#jsonFile').addEventListener('change',async e=>{let file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>15e6){alert('File JSON vượt 15 MB.');return}try{let x=JSON.parse(await file.text()),err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.classes.length} lớp và ${x.students.length} học viên trong file?`))return;db=x;page='dashboard';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files?.[0];e.target.value='';if(!file)return;try{let book=await Excel.read(file),x=fromExcel(book);if(!confirm(`Nhập Excel sẽ thay dữ liệu hiện tại bằng ${x.classes.length} lớp, ${x.students.length} học viên và ${x.events.length} dòng nhật ký. Tiếp tục?`))return;db=x;page='dashboard';save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
window.__CLASSROOM_TEST__={empty,validate,loadDemo,activeCount,seats,fill,forecast,warning,fromExcel,getDB:()=>db,setDB:x=>{db=x;render()},go:p=>{page=p;render()}};
</script></body></html>
