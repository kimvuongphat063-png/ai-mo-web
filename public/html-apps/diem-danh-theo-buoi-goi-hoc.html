const STUDENT_STATES=['Đang học','Tạm nghỉ','Hoàn thành'];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const num=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0);
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const validDate=s=>!s||/^\d{4}-\d{2}-\d{2}$/.test(String(s))&&Number.isFinite(Date.parse(s))&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s;
const fmtDate=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'—';
const addDays=(iso,n)=>{let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const sum=(a,f)=>a.reduce((n,x)=>n+(Number(f(x))||0),0);
const field=(name,label,value='',type='text',options=null,extra='')=>`<div class="field ${extra}"><label for="f_${name}">${esc(label)}</label>${options?`<select id="f_${name}" name="${name}">${options.map(o=>{let v=typeof o==='string'?o:o[0],t=typeof o==='string'?o:o[1];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`:type==='textarea'?`<textarea id="f_${name}" name="${name}">${esc(value)}</textarea>`:`<input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any"':''}>`}</div>`;
const btn=(text,action,klass='',attrs='')=>`<button type="button" class="btn ${klass}" data-act="${action}" ${attrs}>${text}</button>`;
const hero=(title,sub)=>`<section class="hero"><small>📅 AI MỞ · QUẢN LÝ LỚP HỌC</small><h1>${title}</h1><p>${sub}</p></section>`;
const metric=(label,value,sub='')=>`<div class="metric"><small>${label}</small><strong>${value}</strong>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
const table=(heads,rows,empty='Chưa có dữ liệu.')=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${heads.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
const badge=(text,kind)=>`<span class="status ${kind}">${esc(text)}</span>`;
const download=(blob,name)=>{let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)};
const empty=()=>({app:APP,version:VERSION,students:[],sessions:[],marks:[],adjustments:[],history:[],settings:{org:'',nearEnd:3,unexcusedMax:2}});
const student=id=>db.students.find(s=>s.id===id),session=id=>db.sessions.find(s=>s.id===id);
const defaultCharge=status=>['Có mặt','Đi muộn','Vắng không phép'].includes(status);
const packageTotal=id=>{let s=student(id);return(s?.packageSize||0)+sum(db.adjustments.filter(a=>a.studentId===id),a=>a.delta)};
const used=id=>db.marks.filter(m=>m.studentId===id&&m.charged&&session(m.sessionId)?.state==='Đã học').length;
const remaining=id=>packageTotal(id)-used(id);
const countStatus=(id,status)=>db.marks.filter(m=>m.studentId===id&&m.status===status&&session(m.sessionId)?.state==='Đã học').length;
const warnings=id=>{let out=[],r=remaining(id);if(r<0)out.push('Đã dùng vượt gói');else if(r<=db.settings.nearEnd)out.push('Sắp hết buổi');if(countStatus(id,'Vắng không phép')>=db.settings.unexcusedMax)out.push('Vắng không phép nhiều');return out};
const stamp=()=>new Date().toISOString();
function validate(x){
 if(!x||x.app!==APP||x.version!==VERSION||!Array.isArray(x.students)||!Array.isArray(x.sessions)||!Array.isArray(x.marks)||!Array.isArray(x.adjustments)||!Array.isArray(x.history)||!x.settings)return 'Cấu trúc hoặc phiên bản sao lưu không đúng.';
 if(String(x.settings.org||'').length>120||!Number.isSafeInteger(x.settings.nearEnd)||x.settings.nearEnd<0||x.settings.nearEnd>1000||!Number.isSafeInteger(x.settings.unexcusedMax)||x.settings.unexcusedMax<1||x.settings.unexcusedMax>1000)return 'Cài đặt không hợp lệ.';
 let ids=new Set(),codes=new Set();for(let s of x.students){if(!s.id||ids.has(s.id)||!/^[A-Z0-9_-]{2,24}$/.test(String(s.code))||codes.has(s.code)||!String(s.name||'').trim()||!String(s.className||'').trim()||!STUDENT_STATES.includes(s.state)||!Number.isSafeInteger(s.packageSize)||s.packageSize<0||s.packageSize>100000)return 'Hồ sơ học viên không hợp lệ.';ids.add(s.id);codes.add(s.code);if(String(s.phone||'').length>30||String(s.note||'').length>1000)return 'Điện thoại hoặc ghi chú quá dài.'}
 let sessionIds=new Set(),sessionCodes=new Set();for(let s of x.sessions){if(!s.id||sessionIds.has(s.id)||!s.code||sessionCodes.has(s.code)||!String(s.className||'').trim()||!validDate(s.date)||!s.date||!SESSION_STATES.includes(s.state)||String(s.title||'').length>120)return 'Buổi học không hợp lệ hoặc trùng mã.';sessionIds.add(s.id);sessionCodes.add(s.code)}
 let markIds=new Set(),pairs=new Set();for(let m of x.marks){let pair=m.sessionId+'|'+m.studentId;if(!m.id||markIds.has(m.id)||pairs.has(pair)||!ids.has(m.studentId)||!sessionIds.has(m.sessionId)||!MARKS.includes(m.status)||typeof m.charged!=='boolean'||String(m.note||'').length>500)return 'Dòng điểm danh không hợp lệ hoặc trùng học viên/buổi.';markIds.add(m.id);pairs.add(pair);if(x.sessions.find(s=>s.id===m.sessionId).state!=='Đã học')return 'Chỉ buổi đã học mới có điểm danh.'}
 let adjIds=new Set(),totals=new Map();for(let a of x.adjustments){if(!a.id||adjIds.has(a.id)||!ids.has(a.studentId)||!validDate(a.date)||!a.date||!Number.isSafeInteger(a.delta)||a.delta===0||Math.abs(a.delta)>100000||!String(a.reason||'').trim())return 'Điều chỉnh gói không hợp lệ.';adjIds.add(a.id);totals.set(a.studentId,(totals.get(a.studentId)||0)+a.delta)}for(let s of x.students)if(s.packageSize+(totals.get(s.id)||0)<0)return 'Số buổi gói sau điều chỉnh không thể âm.';
 let hids=new Set();for(let h of x.history){if(!h.id||hids.has(h.id)||!ids.has(h.studentId)||(!sessionIds.has(h.sessionId)&&h.kind!=='class')||!String(h.reason||'').trim()||!String(h.at||'').trim())return 'Nhật ký sửa điểm danh không hợp lệ.';hids.add(h.id)}return '';
}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let b=$('#embedded-state').textContent.trim();return b&&b!=='e30='?JSON.parse(decodeURIComponent(escape(atob(b)))):null}catch{return null}}
let db=empty(),page='dashboard',selectedStudent='',selectedSession='',query='',classFilter='',warnFilter='',dateFilter='',draft=null;
try{let embedded=decode(),local=JSON.parse(localStorage.getItem(KEY)||'null');if(embedded&&!validate(embedded))db=embedded;else if(local&&!validate(local))db=local}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Trình duyệt không lưu được; hãy tải bản sao JSON hoặc HTML kèm dữ liệu.')}render();return true}
function filteredStudents(){return db.students.filter(s=>(!query||[s.code,s.name,s.className,s.parent,s.phone].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))&&(!classFilter||s.className===classFilter)&&(!warnFilter||warnings(s.id).length>0)).sort((a,b)=>remaining(a.id)-remaining(b.id)||a.name.localeCompare(b.name,'vi'))}
function dashboard(){let charged=db.marks.filter(m=>m.charged&&session(m.sessionId)?.state==='Đã học').length,near=db.students.filter(s=>remaining(s.id)>=0&&remaining(s.id)<=db.settings.nearEnd),over=db.students.filter(s=>remaining(s.id)<0),abs=db.students.filter(s=>countStatus(s.id,'Vắng không phép')>=db.settings.unexcusedMax);return hero('Điểm danh & gói buổi học','Điểm danh từng buổi, biết ai sắp hết gói và ai vắng không phép nhiều.')+`<div class="grid">${metric('Học viên',num(db.students.length))}${metric('Buổi đã học',num(db.sessions.filter(s=>s.state==='Đã học').length))}${metric('Lượt đã tính vào gói',num(charged),'Có mặt + đi muộn + vắng không phép mặc định')}${metric('Sắp hết buổi',num(near.length),`Còn ≤ ${db.settings.nearEnd} buổi`)}${metric('Vượt gói',num(over.length))}${metric('Vắng không phép nhiều',num(abs.length))}</div><div class="card"><h2>⚡ Bắt đầu nhanh</h2><div class="quick-actions">${btn('＋ Thêm học viên','newStudent','primary')}${btn('＋ Tạo buổi học','newSession')}${btn('📋 Mở danh sách buổi','goSessions')}${btn('🔔 Xem cần chú ý','goAlerts')}</div><p class="note">Dữ liệu thật bắt đầu trống. Nạp mẫu 6 học viên/20 lượt điểm danh trong “Dữ liệu & sao lưu” để thử.</p></div><div class="card"><h2>🔔 Cần chú ý</h2>${[...over,...near,...abs].length?`<div class="alert-list">${[...new Set([...over,...near,...abs])].slice(0,12).map(s=>`<div class="alert-item"><button class="link" data-act="openStudent" data-id="${esc(s.id)}">${esc(s.name)}</button> · ${esc(s.className)} · còn ${remaining(s.id)} buổi · ${warnings(s.id).join(', ')}</div>`).join('')}</div>`:'<p class="ok-text">Chưa có học viên cần chú ý theo ngưỡng hiện tại.</p>'}</div>`}
function studentRows(list){return list.map(s=>{let w=warnings(s.id),r=remaining(s.id),total=packageTotal(s.id);return `<tr><td><button class="link" data-act="openStudent" data-id="${esc(s.id)}">${esc(s.name)}</button><div class="small note">${esc(s.code)}</div></td><td>${esc(s.className)}</td><td class="num">${total}</td><td class="num">${countStatus(s.id,'Có mặt')+countStatus(s.id,'Đi muộn')}</td><td class="num">${countStatus(s.id,'Vắng có phép')}</td><td class="num">${countStatus(s.id,'Vắng không phép')}</td><td class="num">${used(s.id)}</td><td class="num"><b>${r}</b></td><td>${w.length?w.map(x=>badge(x,r<0?'bad':'warn')).join(' '):badge('Ổn','ok')}</td><td><div class="row-actions">${btn('Xem','openStudent','small',`data-id="${esc(s.id)}"`)}${btn('Sửa','editStudent','small',`data-id="${esc(s.id)}"`)}</div></td></tr>`})}
function studentsPage(){let list=filteredStudents();return hero('Học viên & gói học','Quản lý số buổi mua ban đầu, gia hạn, số đã tính vào gói và số còn lại.')+`<div class="card"><div class="toolbar"><h2>Hồ sơ · ${list.length}/${db.students.length}</h2><span class="grow"></span>${btn('＋ Thêm học viên','newStudent','primary')}${btn('⬇️ Excel','exportExcel')}</div><div class="filters no-print"><input id="search" type="search" value="${esc(query)}" placeholder="Tìm tên, mã, lớp, phụ huynh…" aria-label="Tìm học viên"><select id="classFilter" aria-label="Lọc lớp"><option value="">Mọi lớp</option>${[...new Set(db.students.map(s=>s.className))].sort().map(c=>`<option ${classFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="warnFilter" aria-label="Lọc cảnh báo"><option value="">Tất cả</option><option value="1" ${warnFilter?'selected':''}>Có cảnh báo</option></select>${btn('Bỏ lọc','clearFilters','small')}</div>${table(['Học viên','Lớp','Tổng gói','Có mặt / muộn','Vắng phép','Vắng không phép','Đã tính','Còn','Cảnh báo','Thao tác'],studentRows(list.slice(0,200)),'Chưa có học viên phù hợp.')}${list.length>200?'<p class="note">Đang hiện 200 hồ sơ đầu; hãy lọc hẹp hơn.</p>':''}</div>`}
function studentDetail(){let s=student(selectedStudent);if(!s){page='students';return studentsPage()}let marks=db.marks.filter(m=>m.studentId===s.id).sort((a,b)=>session(b.sessionId).date.localeCompare(session(a.sessionId).date)),adj=db.adjustments.filter(a=>a.studentId===s.id).sort((a,b)=>b.date.localeCompare(a.date)),total=packageTotal(s.id),r=remaining(s.id),history=db.history.filter(h=>h.studentId===s.id).sort((a,b)=>b.at.localeCompare(a.at));return hero(s.name,`${s.code} · ${s.className} · ${s.state}`)+`<div class="toolbar no-print">${btn('← Danh sách học viên','goStudents')}${btn('Sửa hồ sơ','editStudent','primary',`data-id="${esc(s.id)}"`)}${btn('＋ Gia hạn / điều chỉnh','newAdjustment','',`data-sid="${esc(s.id)}"`)}${btn('Xóa hồ sơ','deleteStudent','danger',`data-id="${esc(s.id)}"`)}</div><div class="grid">${metric('Gói ban đầu',num(s.packageSize))}${metric('Điều chỉnh gói',num(sum(adj,a=>a.delta)))}${metric('Tổng quyền học',num(total))}${metric('Đã tính vào gói',num(used(s.id)))}${metric('Còn lại',num(r))}${metric('Vắng không phép',num(countStatus(s.id,'Vắng không phép')))}</div><div class="card"><h2>📊 Tiến độ gói</h2><div class="progress"><span style="width:${total?Math.min(100,Math.round(used(s.id)/total*100)):0}%"></span></div><p>${wText(s.id)}</p><p class="note">Có mặt và đi muộn trừ gói; vắng không phép cũng trừ gói; vắng có phép mặc định không trừ. Có thể chỉnh “Tính vào gói” trên từng lượt và ghi lý do.</p><p><b>Phụ huynh:</b> ${esc(s.parent||'Chưa ghi')} · <b>Điện thoại:</b> ${esc(s.phone||'Chưa ghi')}</p>${s.note?`<p class="note">${esc(s.note)}</p>`:''}</div><div class="card"><h2>📋 Lịch sử điểm danh · ${marks.length}</h2>${table(['Ngày','Buổi học','Tình trạng','Tính vào gói','Ghi chú'],marks.map(m=>`<tr><td>${fmtDate(session(m.sessionId).date)}</td><td><button class="link" data-act="openSession" data-id="${esc(m.sessionId)}">${esc(session(m.sessionId).title||session(m.sessionId).code)}</button></td><td>${esc(m.status)}</td><td>${m.charged?'Có':'Không'}</td><td>${esc(m.note||'')}</td></tr>`),'Chưa có lượt điểm danh.')}</div><div class="card"><div class="toolbar"><h2>🎟️ Gia hạn / điều chỉnh · ${adj.length}</h2><span class="grow"></span>${btn('＋ Ghi điều chỉnh','newAdjustment','primary',`data-sid="${esc(s.id)}"`)}</div>${table(['Ngày','Số buổi cộng/trừ','Lý do','Người ghi'],adj.map(a=>`<tr><td>${fmtDate(a.date)}</td><td class="num">${a.delta>0?'+':''}${a.delta}</td><td>${esc(a.reason)}</td><td>${esc(a.owner||'')}</td></tr>`),'Chưa có gia hạn hoặc điều chỉnh.')}</div><div class="card"><h2>🕘 Nhật ký thay đổi</h2>${history.length?`<div class="timeline">${history.map(h=>`<div class="timeline-item"><b>${fmtDate(h.at.slice(0,10))} · ${esc(h.kind==='class'?'Chuyển lớp':session(h.sessionId)?.title||'Buổi học')}</b><div>${esc(h.oldStatus||'Chưa điểm danh')} → ${esc(h.newStatus||'Xóa điểm danh')}${h.kind==='class'?'':' · tính gói '+(h.oldCharged?'Có':'Không')+' → '+(h.newCharged?'Có':'Không')}</div><div class="note">${esc(h.reason)}</div></div>`).join('')}</div>`:'<p class="muted">Chưa có thao tác sửa điểm danh kể từ khi dùng app.</p>'}</div>`}
const wText=id=>warnings(id).length?'⚠️ '+warnings(id).join(' · '):'Gói đang trong mức theo dõi bình thường.';
function sessionsPage(){let list=db.sessions.filter(s=>!dateFilter||s.date.slice(0,7)===dateFilter).sort((a,b)=>b.date.localeCompare(a.date));return hero('Buổi học','Tạo buổi cho từng lớp rồi mở danh sách để điểm danh nhiều học viên cùng lúc.')+`<div class="card"><div class="toolbar"><h2>Buổi học · ${list.length}/${db.sessions.length}</h2><span class="grow"></span>${btn('＋ Tạo buổi','newSession','primary')}${btn('⬇️ Excel','exportExcel')}</div><div class="filters no-print"><input id="dateFilter" type="month" value="${esc(dateFilter)}" aria-label="Lọc tháng"><span class="grow"></span>${btn('Tất cả tháng','allMonths')}</div>${table(['Ngày','Mã buổi','Lớp','Nội dung','Giáo viên','Tình trạng','Đã điểm danh','Thao tác'],list.slice(0,200).map(s=>`<tr><td>${fmtDate(s.date)}</td><td><button class="link" data-act="openSession" data-id="${esc(s.id)}">${esc(s.code)}</button></td><td>${esc(s.className)}</td><td>${esc(s.title||'—')}</td><td>${esc(s.teacher||'—')}</td><td>${badge(s.state,s.state==='Đã học'?'ok':s.state==='Hủy'?'bad':'info')}</td><td class="num">${db.marks.filter(m=>m.sessionId===s.id).length}</td><td><div class="row-actions">${btn('Điểm danh','openSession','small primary',`data-id="${esc(s.id)}"`)}${btn('Sửa','editSession','small',`data-id="${esc(s.id)}"`)}</div></td></tr>`),'Chưa có buổi học phù hợp.')}</div>`}
function sessionDetail(){let s=session(selectedSession);if(!s){page='sessions';return sessionsPage()}let seen=new Set(db.marks.filter(m=>m.sessionId===s.id).map(m=>m.studentId)),roster=db.students.filter(x=>(x.className===s.className&&x.state==='Đang học')||seen.has(x.id)).sort((a,b)=>a.name.localeCompare(b.name,'vi')),marked=db.marks.filter(m=>m.sessionId===s.id),counts=MARKS.map(status=>marked.filter(m=>m.status===status).length);return hero(s.title||s.code,`${fmtDate(s.date)} · ${s.className} · ${s.state}`)+`<div class="toolbar no-print">${btn('← Danh sách buổi','goSessions')}${btn('Sửa buổi học','editSession','',`data-id="${esc(s.id)}"`)}${btn('Xóa buổi','deleteSession','danger',`data-id="${esc(s.id)}"`)}</div><div class="grid">${metric('Học viên trong danh sách',num(roster.length))}${metric('Đã điểm danh',num(marked.length))}${metric('Có mặt / đi muộn',num(counts[0]+counts[1]))}${metric('Vắng phép / không phép',num(counts[2]+counts[3]))}${metric('Lượt trừ gói',num(marked.filter(m=>m.charged).length))}</div><div class="card"><h2>📋 Điểm danh theo lớp</h2>${s.state==='Đã học'?`<p class="hint">Chỉ các dòng chọn tình trạng mới được lưu. Để trống không có nghĩa là vắng. Nếu sửa/xóa lượt cũ hoặc đổi quy tắc trừ gói, hãy ghi lý do ở ô bên cạnh.</p><div class="roster" id="roster">${roster.map(x=>{let m=marked.find(m=>m.studentId===x.id);return `<div class="roster-row" data-student="${esc(x.id)}"><div><b>${esc(x.name)}</b><small>${esc(x.code)} · còn ${remaining(x.id)} buổi${x.className!==s.className?' · đã chuyển lớp':''}</small></div><select class="mark-status" aria-label="Tình trạng ${esc(x.name)}"><option value="">Chưa điểm danh</option>${MARKS.map(v=>`<option ${m?.status===v?'selected':''}>${v}</option>`).join('')}</select><label><input class="mark-charge" type="checkbox" ${m?.charged?'checked':''}> Tính vào gói</label><input class="mark-note" value="${esc(m?.note||'')}" placeholder="Ghi chú / lý do sửa" aria-label="Ghi chú ${esc(x.name)}"></div>`}).join('')}</div><div class="toolbar" style="margin-top:15px">${btn('💾 Lưu điểm danh','saveRoster','primary')}${btn('Đánh dấu có mặt cho ô trống','fillPresent')}${btn('In danh sách','print')}</div>`:'<div class="hint">Buổi đang Dự kiến/Hủy nên không điểm danh. Sửa tình trạng thành “Đã học” sau khi thực hiện.</div>'}</div>`}

function reportPage(){let classes=[...new Set([...db.students.map(s=>s.className),...db.sessions.map(s=>s.className)])].sort();return hero('Báo cáo điểm danh','Tổng hợp học viên, buổi còn lại và các tình trạng điểm danh theo lớp.')+`<div class="card"><div class="toolbar"><h2>Tổng quan</h2><span class="grow"></span>${btn('⬇️ Excel 5 sheet','exportExcel','primary')}${btn('🖨️ In','print')}</div><div class="grid">${metric('Học viên',num(db.students.length))}${metric('Buổi đã học',num(db.sessions.filter(s=>s.state==='Đã học').length))}${metric('Lượt điểm danh',num(db.marks.length))}${metric('Buổi còn lại ròng',num(sum(db.students,s=>remaining(s.id))))}</div></div><div class="card"><h2>Theo lớp hiện tại</h2>${table(['Lớp','Học viên','Tổng quyền học','Đã tính gói','Còn lại','Vắng không phép'],classes.map(c=>{let a=db.students.filter(s=>s.className===c);return `<tr><td>${esc(c)}</td><td class="num">${a.length}</td><td class="num">${sum(a,s=>packageTotal(s.id))}</td><td class="num">${sum(a,s=>used(s.id))}</td><td class="num">${sum(a,s=>remaining(s.id))}</td><td class="num">${sum(a,s=>countStatus(s.id,'Vắng không phép'))}</td></tr>`}),'Chưa có lớp.')}</div><div class="card"><h2>Theo tình trạng điểm danh</h2>${table(['Tình trạng','Số lượt','Mặc định trừ gói'],MARKS.map(v=>`<tr><td>${v}</td><td class="num">${db.marks.filter(m=>m.status===v).length}</td><td>${defaultCharge(v)?'Có':'Không'}</td></tr>`))}<p class="note">Bảng thể hiện mặc định; từng lượt có thể được điều chỉnh riêng. Tổng đã dùng gói tính theo cờ lưu ở lượt, không tính lại theo mặc định hiện tại.</p></div>`}
function settingsPage(){return hero('Cài đặt cảnh báo','Đặt ngưỡng nhắc gia hạn và vắng không phép.')+`<div class="card"><div class="formgrid">${field('org','Tên trung tâm',db.settings.org)}${field('nearEnd','Nhắc gia hạn khi còn ≤ (buổi)',db.settings.nearEnd,'number')}${field('unexcusedMax','Cảnh báo vắng không phép từ (buổi)',db.settings.unexcusedMax,'number')}</div><div class="toolbar" style="margin-top:15px">${btn('Lưu cài đặt','saveSettings','primary')}</div></div><div class="hint">Quy tắc trừ gói mặc định từ file gốc: Có mặt, Đi muộn, Vắng không phép tính 1 buổi; Vắng có phép tính 0. Có thể chỉnh từng lượt trong màn điểm danh, kèm ghi chú. Cài đặt này chỉ thay đổi cảnh báo, không tính lại lịch sử điểm danh.</div>`}
function dataPage(){return hero('Dữ liệu & sao lưu','Sao lưu định kỳ và chuyển máy bằng file có dữ liệu.')+`<div class="card"><h2>Xuất & nhập</h2><div class="data-actions">${btn('⬇️ Sao lưu JSON','backup','primary')}${btn('⬇️ HTML kèm dữ liệu','portable')}${btn('⬇️ Xuất Excel 5 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','restore')}${btn('⬆️ Nhập Excel','importExcel')}</div><p class="note">Excel có Học viên, Buổi học, Điểm danh, Điều chỉnh gói, Lịch sử sửa. Giữ nguyên ID và tên cột khi nhập lại. Nhập thay dữ liệu sau khi kiểm tra và xác nhận.</p></div><div class="card"><h2>Dữ liệu mẫu tham chiếu</h2><p>6 học viên, gói ban đầu tổng 72 buổi, 20 lượt điểm danh: 12 Có mặt, 2 Đi muộn, 2 Vắng có phép, 4 Vắng không phép. Mỗi dòng mẫu được đưa vào một buổi riêng để không tự giả định điểm danh cho học viên khác cùng ngày.</p>${btn('Nạp dữ liệu mẫu','loadDemo')}</div><div class="card"><h2>Xóa dữ liệu</h2><p>Hãy sao lưu trước; thao tác xóa học viên, buổi học, điểm danh, gia hạn và lịch sử trong trình duyệt hiện tại.</p>${btn('Xóa toàn bộ','clear','danger')}</div>`}
function guidePage(){return hero('Hướng dẫn sử dụng','Quy trình đơn giản từ tạo gói đến chấm buổi và nhắc gia hạn.')+`<div class="card"><h2>1 · Tạo học viên và gói</h2><p>Nhập mã, lớp, số buổi gói ban đầu, thông tin phụ huynh. Nếu học viên đổi lớp, sửa lớp hiện tại; các buổi cũ vẫn lưu theo lớp lúc học.</p><h2>2 · Tạo buổi học</h2><p>Mỗi buổi có mã riêng, ngày, lớp, nội dung và giáo viên. Đặt “Đã học” khi buổi đã diễn ra; buổi Dự kiến/Hủy không được tính gói.</p><h2>3 · Điểm danh theo buổi</h2><p>Mở buổi để chọn trạng thái từng học viên. Ô để trống là chưa điểm danh, không bị coi là vắng. Kiểm tra “Tính vào gói” cho từng lượt; nếu sửa trạng thái hoặc cách trừ buổi, ghi lý do.</p><h2>4 · Gia hạn và xem cảnh báo</h2><p>Thêm điều chỉnh + số buổi khi gia hạn, hoặc - số buổi khi sửa gói, luôn ghi lý do. Trang Cần chú ý cho thấy gói sắp hết/vượt gói và học viên vắng không phép nhiều.</p><h2>5 · Báo cáo & sao lưu</h2><p>Xem theo lớp và tình trạng điểm danh; xuất Excel, JSON hoặc HTML kèm dữ liệu để chuyển máy.</p></div><div class="hint">Nguồn đối chiếu: file “Điểm danh theo buổi và số buổi còn lại của gói học” của Thầy Đạt Tin Học. Bản này không tự liên kết với công nợ học phí, lịch dạy giáo viên hoặc cảnh báo bỏ học; cần đối chiếu riêng nếu dùng nhiều app.</div>`}
const pages={dashboard:['Tổng quan',dashboard],students:['Học viên',studentsPage],studentDetail:['Hồ sơ học viên',studentDetail],sessions:['Buổi học',sessionsPage],sessionDetail:['Điểm danh buổi',sessionDetail],alerts:['Cần chú ý',alertsPage],report:['Báo cáo',reportPage],settings:['Cài đặt',settingsPage],data:['Dữ liệu & sao lưu',dataPage],guide:['Hướng dẫn',guidePage]};

function showModal(kind,id='',pref={}){draft={kind,id};let s=kind==='student'&&id?student(id):null,u=kind==='session'&&id?session(id):null;let title='',html='';if(kind==='student'){title=s?'Sửa hồ sơ học viên':'Thêm học viên';html=field('code','Mã học viên *',s?.code||'')+field('name','Họ tên *',s?.name||'')+field('className','Lớp hiện tại *',s?.className||'')+field('packageSize','Số buổi gói ban đầu *',s?.packageSize??0,'number')+field('state','Tình trạng học',s?.state||STUDENT_STATES[0],'text',STUDENT_STATES)+field('parent','Phụ huynh',s?.parent||'')+field('phone','Điện thoại',s?.phone||'')+field('note','Ghi chú',s?.note||'','textarea',null,'full')+(s?field('reason','Lý do nếu đổi gói ban đầu hoặc lớp','','textarea',null,'full'):'')}else if(kind==='session'){title=u?'Sửa buổi học':'Tạo buổi học';html=field('code','Mã buổi *',u?.code||'')+field('date','Ngày học *',u?.date||today(),'date')+field('className','Lớp *',u?.className||db.students[0]?.className||'')+field('title','Nội dung / tên buổi',u?.title||'')+field('teacher','Giáo viên',u?.teacher||'')+field('state','Tình trạng',u?.state||'Đã học','text',SESSION_STATES)}else if(kind==='adjustment'){if(!db.students.length){alert('Hãy thêm học viên trước.');return}let s=student(pref.studentId||selectedStudent)||db.students[0];title='Gia hạn / điều chỉnh gói';html=field('studentId','Học viên *',s.id,'text',db.students.map(x=>[x.id,x.code+' · '+x.name]))+field('date','Ngày điều chỉnh *',today(),'date')+field('delta','Số buổi cộng (+) hoặc trừ (-) *',1,'number')+field('owner','Người ghi','')+field('reason','Lý do / căn cứ *','','textarea',null,'full')}

function saveModal(){if(!draft)return;let f=collect(),id=draft.id;if(draft.kind==='student'){let code=f.code.toUpperCase(),packageSize=Number(f.packageSize),old=id?student(id):null;if(!/^[A-Z0-9_-]{2,24}$/.test(code)||db.students.some(s=>s.code===code&&s.id!==id))return modalError('Mã học viên cần 2–24 ký tự A–Z, số, _ hoặc - và không trùng.');if(!f.name||f.name.length>120||!f.className||f.className.length>120||!STUDENT_STATES.includes(f.state)||!Number.isSafeInteger(packageSize)||packageSize<0||packageSize>100000)return modalError('Tên, lớp, tình trạng hoặc số buổi gói không hợp lệ.');if(f.phone&&!/^[0-9+().\s-]{8,30}$/.test(f.phone))return modalError('Số điện thoại cần 8–30 ký tự hợp lệ.');if(old&&old.packageSize!==packageSize)return modalError('Gói ban đầu không sửa trực tiếp. Hãy dùng Gia hạn / điều chỉnh.');if(old&&old.className!==f.className&&!f.reason)return modalError('Nhập lý do khi đổi lớp.');let oldClass=old?.className;let rec={id:id||uid(),code,name:f.name,className:f.className,packageSize,state:f.state,parent:f.parent.slice(0,120),phone:f.phone,note:f.note.slice(0,1000)};let adj=sum(db.adjustments.filter(a=>a.studentId===rec.id),a=>a.delta);if(packageSize+adj<0)return modalError('Tổng gói sau điều chỉnh không được âm.');if(old)Object.assign(old,rec);else db.students.push(rec);if(oldClass&&oldClass!==rec.className)db.history.push({id:uid(),kind:'class',sessionId:'',studentId:rec.id,oldStatus:oldClass,newStatus:rec.className,oldCharged:false,newCharged:false,at:stamp(),reason:f.reason.slice(0,500)});selectedStudent=rec.id;page='studentDetail'}else if(draft.kind==='session'){let code=f.code.toUpperCase(),old=id?session(id):null;if(!/^[A-Z0-9_-]{2,24}$/.test(code)||db.sessions.some(s=>s.code===code&&s.id!==id))return modalError('Mã buổi cần 2–24 ký tự A–Z, số, _ hoặc - và không trùng.');if(!validDate(f.date)||!f.date||!f.className||f.className.length>120||!SESSION_STATES.includes(f.state)||f.state==='Đã học'&&f.date>today())return modalError('Ngày, lớp hoặc tình trạng buổi học không hợp lệ.');if(old&&db.marks.some(m=>m.sessionId===id)&&(old.date!==f.date||old.className!==f.className||f.state!=='Đã học'))return modalError('Buổi đã có điểm danh không thể đổi ngày, lớp hoặc hủy. Hãy xử lý điểm danh trước.');let rec={id:id||uid(),code,date:f.date,className:f.className,title:f.title.slice(0,120),teacher:f.teacher.slice(0,120),state:f.state};if(old)Object.assign(old,rec);else db.sessions.push(rec);selectedSession=rec.id;page='sessionDetail'}else if(draft.kind==='adjustment'){let s=student(f.studentId),delta=Number(f.delta);if(!s||!validDate(f.date)||!f.date||f.date>today()||!Number.isSafeInteger(delta)||delta===0||Math.abs(delta)>100000||!f.reason)return modalError('Học viên, ngày, số buổi hoặc lý do không hợp lệ.');if(packageTotal(s.id)+delta<0)return modalError('Tổng quyền học sau điều chỉnh không thể âm.');db.adjustments.push({id:uid(),studentId:s.id,date:f.date,delta,owner:f.owner.slice(0,120),reason:f.reason.slice(0,500),kind:'adjustment'});selectedStudent=s.id;page='studentDetail'}$('#editor').close();draft=null;save()}
function saveRoster(){let s=session(selectedSession);if(!s||s.state!=='Đã học'||s.date>today())return alert('Chỉ điểm danh buổi đã học và không ở tương lai.');let rows=$$('#roster .roster-row'),changes=[];for(let row of rows){let studentId=row.dataset.student,status=row.querySelector('.mark-status').value,charged=row.querySelector('.mark-charge').checked,note=row.querySelector('.mark-note').value.trim(),old=db.marks.find(m=>m.sessionId===s.id&&m.studentId===studentId);if(status&&!MARKS.includes(status))return alert('Tình trạng điểm danh không hợp lệ.');if(!status&&old&&!note)return alert('Nhập lý do vào ô ghi chú khi xóa lượt điểm danh của '+student(studentId).name+'.');if(status&&charged!==defaultCharge(status)&&!note)return alert('Nhập lý do khi chỉnh quy tắc trừ gói của '+student(studentId).name+'.');if(old&&(old.status!==status||old.charged!==charged||old.note!==note)&&!note)return alert('Nhập lý do khi sửa điểm danh của '+student(studentId).name+'.');if((!old&&!status)||(old&&old.status===status&&old.charged===charged&&old.note===note))continue;changes.push({studentId,status,charged,note,old})}if(!changes.length)return alert('Không có thay đổi điểm danh.');for(let c of changes){db.history.push({id:uid(),sessionId:s.id,studentId:c.studentId,kind:'mark',oldStatus:c.old?.status||'',newStatus:c.status,oldCharged:c.old?.charged||false,newCharged:c.status?c.charged:false,at:stamp(),reason:c.note||'Điểm danh ban đầu'});if(!c.status)db.marks=db.marks.filter(m=>m!==c.old);else if(c.old)Object.assign(c.old,{status:c.status,charged:c.charged,note:c.note});else db.marks.push({id:uid(),sessionId:s.id,studentId:c.studentId,status:c.status,charged:c.charged,note:c.note})}save()}
function loadDemo(){if((db.students.length||db.sessions.length||db.marks.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),map=new Map();for(let row of ATTENDANCE_SAMPLE.hv){let s={id:uid(),code:row[0],name:row[1],className:row[2],packageSize:row[3],state:'Đang học',parent:'',phone:'',note:'Dữ liệu mẫu gốc'};x.students.push(s);map.set(s.code,s)}for(let [i,row] of ATTENDANCE_SAMPLE.dd.entries()){let pupil=map.get(row[1]),ses={id:uid(),code:'M'+String(i+1).padStart(3,'0'),date:addDays(today(),Number(row[0].slice(1))),className:pupil.className,title:'Buổi mẫu '+(i+1),teacher:'',state:'Đã học'};x.sessions.push(ses);x.marks.push({id:uid(),sessionId:ses.id,studentId:pupil.id,status:row[2],charged:defaultCharge(row[2]),note:'Từ dòng điểm danh mẫu gốc'})}db=x;page='dashboard';save()}
function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'diem-danh-theo-buoi-goi-hoc.json')}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download(new Blob(['<!doctype html>\n'+html],{type:'text/html;charset=utf-8'}),'diem-danh-theo-buoi-goi-hoc-kem-du-lieu.html')}
const H_STUDENT=['ID','Mã học viên','Họ tên','Lớp hiện tại','Gói ban đầu','Tình trạng','Phụ huynh','Điện thoại','Ghi chú'];
const H_SESSION=['ID','Mã buổi','Ngày','Lớp','Nội dung','Giáo viên','Tình trạng'];
const H_MARK=['ID','ID buổi','ID học viên','Tình trạng điểm danh','Tính vào gói','Ghi chú'];
const H_ADJ=['ID','ID học viên','Ngày','Cộng/trừ buổi','Người ghi','Lý do','Loại'];
const H_HISTORY=['ID','ID buổi','ID học viên','Trước','Sau','Trừ gói trước','Trừ gói sau','Thời điểm','Lý do','Loại thay đổi'];
function exportExcel(){let sheets=[{name:'Hoc vien',rows:[H_STUDENT,...db.students.map(s=>[s.id,s.code,s.name,s.className,s.packageSize,s.state,s.parent,s.phone,s.note])]},{name:'Buoi hoc',rows:[H_SESSION,...db.sessions.map(s=>[s.id,s.code,s.date,s.className,s.title,s.teacher,s.state])]},{name:'Diem danh',rows:[H_MARK,...db.marks.map(m=>[m.id,m.sessionId,m.studentId,m.status,m.charged?'Có':'Không',m.note])]},{name:'Dieu chinh goi',rows:[H_ADJ,...db.adjustments.map(a=>[a.id,a.studentId,a.date,a.delta,a.owner,a.reason,a.kind])]},{name:'Lich su sua',rows:[H_HISTORY,...db.history.map(h=>[h.id,h.sessionId,h.studentId,h.oldStatus,h.newStatus,h.oldCharged?'Có':'Không',h.newCharged?'Có':'Không',h.at,h.reason,h.kind||'mark'])]}];download(Excel.workbook(sheets),'diem-danh-theo-buoi-goi-hoc.xlsx')}
const sheetDate=v=>typeof v==='number'&&Number.isFinite(v)?new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toISOString().slice(0,10):String(v||'').trim();
function fromExcel(book){let a=book['Hoc vien'],b=book['Buoi hoc'],c=book['Diem danh'],d=book['Dieu chinh goi'],e=book['Lich su sua'];if(!a||!b||!c||!d||!e)throw Error('Thiếu một trong năm sheet của app.');let same=(r,h)=>h.every((x,i)=>String(r?.[i]??'')===x);if(!same(a[0],H_STUDENT)||!same(b[0],H_SESSION)||!same(c[0],H_MARK)||!same(d[0],H_ADJ)||!same(e[0],H_HISTORY))throw Error('Tên cột Excel không khớp file do app xuất.');let x=empty();x.settings=clone(db.settings);for(let r of a.slice(1)){if(!String(r[0]||'').trim())continue;x.students.push({id:String(r[0]),code:String(r[1]),name:String(r[2]),className:String(r[3]),packageSize:Number(r[4]),state:String(r[5]),parent:String(r[6]||''),phone:String(r[7]||''),note:String(r[8]||'')})}for(let r of b.slice(1)){if(!String(r[0]||'').trim())continue;x.sessions.push({id:String(r[0]),code:String(r[1]),date:sheetDate(r[2]),className:String(r[3]),title:String(r[4]||''),teacher:String(r[5]||''),state:String(r[6])})}for(let r of c.slice(1)){if(!String(r[0]||'').trim())continue;x.marks.push({id:String(r[0]),sessionId:String(r[1]),studentId:String(r[2]),status:String(r[3]),charged:String(r[4])==='Có',note:String(r[5]||'')})}for(let r of d.slice(1)){if(!String(r[0]||'').trim())continue;x.adjustments.push({id:String(r[0]),studentId:String(r[1]),date:sheetDate(r[2]),delta:Number(r[3]),owner:String(r[4]||''),reason:String(r[5]),kind:String(r[6]||'adjustment')})}for(let r of e.slice(1)){if(!String(r[0]||'').trim())continue;x.history.push({id:String(r[0]),sessionId:String(r[1]),studentId:String(r[2]),oldStatus:String(r[3]||''),newStatus:String(r[4]||''),oldCharged:String(r[5])==='Có',newCharged:String(r[6])==='Có',at:String(r[7]),reason:String(r[8]),kind:String(r[9]||'mark')})}let err=validate(x);if(err)throw Error(err);return x}
function act(name,d){if(name==='newStudent')showModal('student');else if(name==='editStudent')showModal('student',d.id);else if(name==='openStudent'){selectedStudent=d.id;page='studentDetail';render()}else if(name==='goStudents'){page='students';render()}else if(name==='deleteStudent'){let s=student(d.id);if(db.marks.some(m=>m.studentId===d.id)||db.adjustments.some(a=>a.studentId===d.id)||db.history.some(h=>h.studentId===d.id))return alert('Học viên đã có điểm danh/gia hạn, không thể xóa. Hãy đổi tình trạng sang Hoàn thành hoặc Tạm nghỉ.');if(confirm('Xóa học viên '+s.name+'?')){db.students=db.students.filter(x=>x.id!==d.id);page='students';save()}}else if(name==='newSession')showModal('session');else if(name==='editSession')showModal('session',d.id);else if(name==='openSession'){selectedSession=d.id;page='sessionDetail';render()}else if(name==='goSessions'){page='sessions';render()}else if(name==='deleteSession'){let s=session(d.id);if(db.marks.some(m=>m.sessionId===d.id)||db.history.some(h=>h.sessionId===d.id))return alert('Buổi đã có điểm danh/nhật ký, không thể xóa.');if(confirm('Xóa buổi học '+s.code+'?')){db.sessions=db.sessions.filter(x=>x.id!==d.id);page='sessions';save()}}else if(name==='newAdjustment')showModal('adjustment','',{studentId:d.sid||selectedStudent});else if(name==='saveRoster')saveRoster();else if(name==='fillPresent'){$$('#roster .roster-row').forEach(row=>{let sel=row.querySelector('.mark-status');if(!sel.value){sel.value='Có mặt';row.querySelector('.mark-charge').checked=true}})}else if(name==='clearFilters'){query='';classFilter='';warnFilter='';render()}else if(name==='allMonths'){dateFilter='';render()}else if(name==='goAlerts'){page='alerts';render()}else if(name==='saveSettings'){let org=$('#f_org').value.trim(),nearEnd=Number($('#f_nearEnd').value),unexcusedMax=Number($('#f_unexcusedMax').value);if(org.length>120||!Number.isSafeInteger(nearEnd)||nearEnd<0||nearEnd>1000||!Number.isSafeInteger(unexcusedMax)||unexcusedMax<1||unexcusedMax>1000)return alert('Tên đơn vị tối đa 120 ký tự; ngưỡng buổi không hợp lệ.');db.settings={org,nearEnd,unexcusedMax};save()}else if(name==='backup')backup();else if(name==='portable')portable();else if(name==='exportExcel')exportExcel();else if(name==='restore')$('#jsonFile').click();else if(name==='importExcel')$('#excelFile').click();else if(name==='loadDemo')loadDemo();else if(name==='clear'){if(confirm('Xóa toàn bộ học viên, buổi học, điểm danh, gia hạn và lịch sử trên thiết bị này?')){db=empty();page='dashboard';selectedSession='';selectedStudent='';save()}}else if(name==='print')window.print()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}let b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='classFilter'){classFilter=e.target.value;render()}else if(e.target.id==='warnFilter'){warnFilter=e.target.value;render()}else if(e.target.id==='dateFilter'){dateFilter=e.target.value;render()}else if(e.target.classList.contains('mark-status')){let row=e.target.closest('.roster-row'),status=e.target.value;row.querySelector('.mark-charge').checked=defaultCharge(status)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let p=$('#screen .table-wrap');if(page==='students'&&p)p.outerHTML=table(['Học viên','Lớp','Tổng gói','Có mặt / muộn','Vắng phép','Vắng không phép','Đã tính','Còn','Cảnh báo','Thao tác'],studentRows(filteredStudents().slice(0,200)),'Chưa có học viên phù hợp.')}});
$('#modalSave').addEventListener('click',saveModal);$('#modalClose').addEventListener('click',()=>$('#editor').close());$('#modalCancel').addEventListener('click',()=>$('#editor').close());$('#quickPrint').addEventListener('click',()=>window.print());
$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>15e6)throw Error('File JSON vượt 15 MB.');let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm(`Khôi phục ${x.students.length} học viên, ${x.sessions.length} buổi, ${x.marks.length} lượt điểm danh? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{let x=fromExcel(await Excel.read(f));if(!confirm(`Nhập ${x.students.length} học viên, ${x.sessions.length} buổi, ${x.marks.length} lượt điểm danh từ Excel? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
window.__ATTENDANCE_TEST__={empty,validate,defaultCharge,packageTotal,used,remaining,countStatus,loadDemo,fromExcel,getDB:()=>db,setDB:x=>{db=x;render()},go:p=>{page=p;render()}};
render();
</script></body></html>
