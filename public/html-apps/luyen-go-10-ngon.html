const KEY='ai-mo-typing-v1',APP='ai-mo-typing',SCHEMA=1;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let data=(()=>{let a=embedded(),b=local();return (b?.updatedAt||0)>(a?.updatedAt||0)?b:a||b||baseState()})();
if(!data.profiles.length)data=baseState();
if(!data.profiles.some(p=>p.id===data.activeProfile))data.activeProfile=data.profiles[0].id;
if(!GROUPS.some(g=>g[0]===data.selectedKind))data.selectedKind='base';
let page='home',editing=null,timer=null,detailId=null,composing=false;
const profile=()=>data.profiles.find(p=>p.id===data.activeProfile)||data.profiles[0];
const run=()=>data.runs[data.activeProfile]||null;
const ownResults=()=>data.results.filter(x=>x.profileId===data.activeProfile);

function persist(redraw=false){data.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Không lưu được tiến độ trong trình duyệt. Hãy tải HTML kèm dữ liệu hoặc sao lưu JSON.')}if(redraw)render()}
function hero(title,desc){return '<div class="hero"><small>AI MỞ · TỰ HỌC OFFLINE</small><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>'}
function metric(label,value,note=''){return '<div class="metric"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(note)+'</div></div>'}
function score(r){let target=chars(r.target),typed=chars(r.value),hits=typed.filter((c,i)=>c===target[i]).length,total=r.timed?Math.max(1,typed.length):Math.max(target.length,typed.length),seconds=Math.max(1,Math.min(r.timed?60:Infinity,((r.finishedAt||Date.now())-(r.startedAt||Date.now()))/1000));return {correct:hits,total,percent:Math.round(hits/total*100),speed:Math.round(hits*12/seconds),seconds:Math.round(seconds)}}
function best(lessonId){return previous(lessonId).reduce((n,r)=>Math.max(n,r.speed||0),0)}
function home(){
 let p=profile(),rs=ownResults(),achieved=BANK.filter(q=>previous(q.id).some(r=>r.percent>=90)).length,latest=rs[0],current=run();
 return hero('Luyện gõ 10 ngón','90 bài theo lộ trình, luyện câu tiếng Việt có dấu và kiểm tra tốc độ 60 giây.')+
 '<div class="card"><div class="toolbar"><h2 class="grow">Xin chào, '+esc(p.name)+'</h2><button class="btn" data-page="profiles">Đổi học sinh</button></div><div class="grid">'+metric('Bài đã đạt',achieved+' / '+BANK.length,'Đạt từ 90% chính xác')+metric('Lượt đã luyện',String(rs.length),'Lưu riêng cho học sinh này')+metric('Tốc độ tốt nhất',Math.max(0,...rs.map(x=>x.speed||0))+' WPM','Từ quy đổi mỗi phút')+metric('Lần gần nhất',latest?latest.percent+'%':'—',latest?new Date(latest.at).toLocaleDateString('vi-VN'):'Bắt đầu hôm nay')+'</div>'+
 (current&&!current.ended?'<p class="notice-line">Có bài đang gõ'+(current.timed?' · đồng hồ 60 giây vẫn chạy':'')+'.</p><button class="btn primary" data-page="practice">Tiếp tục bài đang gõ</button>':'')+'</div>'+
 '<div class="card"><h2>1. Chọn hàng phím hoặc loại câu</h2><div class="grid">'+GROUPS.map(([kind,label,desc])=>{let list=lessons(kind),done=list.filter(q=>previous(q.id).some(r=>r.percent>=90)).length;return '<button type="button" class="btn lesson-card '+(data.selectedKind===kind?'primary':'')+'" data-kind="'+kind+'" aria-pressed="'+(data.selectedKind===kind)+'"><b>'+esc(label)+'</b><small>'+esc(desc)+' · '+done+'/'+list.length+' bài đạt</small></button>'}).join('')+'</div></div>'+
 '<div class="card"><div class="toolbar"><h2 class="grow">2. '+esc(groupLabel(data.selectedKind))+' · '+lessons(data.selectedKind).length+' bài</h2><span class="badge">Bấm bài để bắt đầu</span></div><div class="grid">'+lessons(data.selectedKind).map((q,i)=>{let prev=previous(q.id),done=prev.some(x=>x.percent>=90);return '<button type="button" class="btn lesson-card '+(done?'done':'')+'" data-lesson="'+esc(q.id)+'"><b>Bài '+(i+1)+(done?' · Đã đạt ✓':'')+'</b><small>'+esc(q.p)+'</small><small>'+(prev.length?'Tốt nhất: '+Math.max(...prev.map(x=>x.percent))+'% · '+best(q.id)+' WPM':'Chưa luyện')+'</small></button>'}).join('')+'</div></div>'+
 '<div class="card"><h2>3. Kiểm tra tốc độ 60 giây</h2><p class="muted">Đồng hồ bắt đầu khi gõ ký tự đầu tiên. Chọn tiếng Việt có dấu hoặc câu tiếng Anh. Tốc độ tính từ ký tự đúng.</p><div class="toolbar"><button class="btn primary" data-test="vietnamese">Kiểm tra tiếng Việt</button><button class="btn" data-test="full">Kiểm tra tiếng Anh</button></div></div>';
}
const fingers=['qaz','wsx','edc','rfvtgb','yhnujm','ik,','ol.','p;/'];
const fingerNames=['út trái','áp út trái','giữa trái','trỏ trái','trỏ phải','giữa phải','áp út phải','út phải'];
function finger(c){if(c===' ')return 'Ngón cái · phím cách';let k=String(c||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace('đ','d');let n=fingers.findIndex(s=>s.includes(k)&&k.length===1);return n<0?'':fingerNames[n]}
function keyboard(next){let k=String(next||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace('đ','d');return '<div class="keyboard" aria-hidden="true">'+['qwertyuiop','asdfghjkl;','zxcvbnm,./',' '].map(row=>'<div class="keyrow">'+Array.from(row).map(key=>'<span class="key '+(key===k?'next ':'')+(key==='f'||key==='j'?'home ':'')+(key===' '?'space':'')+'">'+(key===' '?'PHÍM CÁCH':esc(key.toUpperCase()))+'</span>').join('')+'</div>').join('')+'</div>'}
function sample(r){let expected=chars(r.target),typed=chars(r.value),pos=typed.length,from=r.timed?Math.max(0,pos-32):0,to=r.timed?Math.min(expected.length,pos+115):expected.length;return expected.slice(from,to).map((c,j)=>{let i=from+j,status=i===pos?'next':i<pos?(typed[i]===c?'good':'bad'):'';return '<span class="'+status+'">'+esc(c)+'</span>'}).join('')}
function practice(){
 let r=run();if(!r)return hero('Chưa có bài đang gõ','Chọn một bài trong lộ trình để bắt đầu.')+'<div class="card"><button class="btn primary" data-page="home">Về lộ trình</button></div>';
 if(r.ended){let s=score(r),star=s.percent===100?5:s.percent>=95?4:s.percent>=90?3:s.percent>=75?2:s.percent>0?1:0,issues=Object.entries(r.errors||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);return hero('Kết quả bài gõ',s.speed+' WPM · '+s.percent+'% chính xác')+
 '<div class="card"><h2 aria-label="'+star+' trên 5 sao">'+('★'.repeat(star)+'☆'.repeat(5-star))+'</h2><div class="grid">'+metric('Tốc độ',s.speed+' WPM','Ký tự đúng / 5 / phút')+metric('Độ chính xác',s.percent+'%',s.correct+'/'+s.total+' ký tự đúng vị trí')+metric('Thời gian',s.seconds+' giây','Tính từ ký tự đầu tiên')+'</div><p class="hint">'+(s.percent>=90?'Đã đạt mốc 90%. Hãy giữ nhịp đều và tăng tốc từ từ.':'Hãy luyện lại bài này, ưu tiên độ chính xác trước tốc độ.')+'</p><div class="toolbar"><button class="btn primary" data-action="repeat">Gõ lại</button><button class="btn" data-action="clearRun">Chọn bài khác</button><button class="btn" data-page="progress">Xem tiến độ</button></div></div>'+
 '<div class="card"><h2>Phím cần chú ý</h2>'+(issues.length?'<div class="grid">'+issues.map(([c,n])=>'<div class="metric"><strong>'+(c===' '?'Phím cách':esc(c))+'</strong><div class="sub">'+n+' lượt gõ lệch hoặc sai vị trí</div></div>').join('')+'</div>':'<p>Không có phím sai được ghi nhận trong lượt này.</p>')+'<p class="muted">Bài tiếng Việt được chấm sau khi bộ gõ hoàn tất từ và dấu. Độ chính xác dựa trên đoạn cuối cùng em đã gõ.</p></div>';
 }
 let expected=chars(r.target),typed=chars(r.value),pos=typed.length,next=expected[pos]||'',s=score(r),left=r.timed&&r.startedAt?Math.max(0,Math.ceil((r.deadline-Date.now())/1000)):60;
 return hero(r.timed?'Kiểm tra tốc độ 60 giây':groupLabel(r.kind),r.timed?'Thời gian chỉ bắt đầu khi em gõ ký tự đầu tiên.':'Bài '+(lessons(r.kind).findIndex(x=>x.id===r.lessonId)+1)+' · Gõ đúng cả chữ hoa, khoảng trắng và dấu câu.')+
 '<div class="card"><div class="toolbar"><span class="badge">'+(r.timed?'Còn '+left+' giây':'Bài luyện tự do')+'</span><span class="badge">'+s.speed+' WPM</span><span class="badge">'+s.percent+'% chính xác tạm tính</span></div><div class="segbar" role="progressbar" aria-valuenow="'+Math.min(100,Math.round(pos/expected.length*100))+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.min(100,Math.round(pos/expected.length*100))+'%"></i></div><p class="type-sample" id="typeSample">'+sample(r)+'</p><div class="field"><label for="typeEntry">Gõ theo đoạn mẫu ở trên</label><textarea class="type-entry" id="typeEntry" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="fingerHint">'+esc(r.value)+'</textarea></div><p id="fingerHint" class="hint">'+(next?'Ký tự kế tiếp: <b>'+(next===' '?'DẤU CÁCH':esc(next))+'</b> · '+esc(finger(next)):'Đã gõ hết đoạn mẫu. Kiểm tra và xem điểm.')+'</p>'+keyboard(next)+'<div class="toolbar no-print"><button class="btn primary" data-action="finish">Kết thúc và xem điểm</button><button class="btn" data-action="clearRun">Thoát bài</button></div><p class="muted">Khi dùng Telex, cứ nhập xong từ và dấu. Có thể dùng Backspace để sửa. Phím ảo chỉ là hình hướng dẫn, hãy gõ trên bàn phím thật.</p></div>';
}
function start(lessonId,timed=false){
 let current=run();if(current&&!current.ended&&!confirm('Thay bài đang gõ bằng bài mới?'))return;
 let q=BY_ID.get(lessonId);if(!q)return;
 let target=q.p;if(timed){let pool=lessons(q.kind),seed=Date.now()%pool.length;target=Array.from({length:16},(_,i)=>pool[(seed+i*7)%pool.length].p).join(' ')}
 data.runs[data.activeProfile]={id:id(),profileId:data.activeProfile,lessonId:timed?'test-'+q.kind:q.id,kind:q.kind,timed,target,value:'',startedAt:null,deadline:null,finishedAt:null,ended:false,errors:{}};
 page='practice';persist(true);window.scrollTo(0,0);
}
function updateValue(value){
 let r=run();if(!r||r.ended)return;
 if(r.timed&&r.deadline&&Date.now()>=r.deadline){finish();return}
 if(!r.startedAt&&value){r.startedAt=Date.now();if(r.timed)r.deadline=r.startedAt+60000}
 if(r.kind!=='vietnamese'){let before=chars(r.value),after=chars(value),expected=chars(r.target);after.forEach((c,i)=>{if(c!==before[i]&&expected[i]!==undefined&&c!==expected[i])r.errors[expected[i]]=(r.errors[expected[i]]||0)+1})}
 r.value=value;persist();
 if(!r.timed&&r.value.normalize('NFC')===r.target.normalize('NFC')){finish();return}
 let field=$('#typeEntry'),a=field?.selectionStart,b=field?.selectionEnd;
 render();let fresh=$('#typeEntry');if(fresh){fresh.focus();fresh.setSelectionRange(a,b)}
}
function finish(){
 let r=run();if(!r||r.ended||!r.value)return;
 r.finishedAt=Date.now();r.ended=true;
 if(r.kind==='vietnamese'){let expected=chars(r.target),actual=chars(r.value);actual.forEach((c,i)=>{if(expected[i]!==undefined&&c!==expected[i])r.errors[expected[i]]=(r.errors[expected[i]]||0)+1})}
 let s=score(r);data.results.unshift({id:r.id,profileId:r.profileId,lessonId:r.lessonId,kind:r.kind,timed:r.timed,at:new Date(r.finishedAt).toISOString(),...s,errors:r.errors});
 data.results=data.results.slice(0,2000);clearInterval(timer);timer=null;persist(true);
}
function clearRun(){let r=run();if(r&&!r.ended&&!confirm('Thoát bài đang gõ? Bài chưa hoàn tất sẽ không vào lịch sử.'))return;delete data.runs[data.activeProfile];clearInterval(timer);timer=null;page='home';persist(true)}
function tick(){clearInterval(timer);let r=run();if(!r||r.ended||!r.timed||!r.startedAt)return;timer=setInterval(()=>{let x=run();if(!x||x.ended){clearInterval(timer);return}if(Date.now()>=x.deadline){finish();return}let badge=$('.card .badge');if(page==='practice'&&badge)badge.textContent='Còn '+Math.max(0,Math.ceil((x.deadline-Date.now())/1000))+' giây'},250)}
function progress(){

 return hero('Tiến độ của '+profile().name,'Lịch sử, độ chính xác và tốc độ theo từng nhóm bài.')+

 '<div class="grid two"><div class="card"><h2>14 lượt gần đây</h2>'+(last.length?'<div class="mini-chart">'+last.map(x=>'<div class="col" title="'+new Date(x.at).toLocaleString('vi-VN')+' · '+x.speed+' WPM"><div class="stick" style="height:'+Math.max(2,Math.min(115,x.speed*2))+'px"></div><small>'+x.speed+'</small></div>').join('')+'</div><p class="muted">Chiều cao cột: WPM</p>':'<div class="empty">Chưa có lượt luyện.</div>')+'</div><div class="card"><h2>Theo nhóm</h2>'+GROUPS.map(([kind,label])=>{let list=rs.filter(x=>x.kind===kind),done=lessons(kind).filter(q=>previous(q.id).some(r=>r.percent>=90)).length;return '<div class="check"><span>'+esc(label)+' · '+done+'/'+lessons(kind).length+' bài đạt</span><b>'+(list.length?Math.round(list.reduce((n,x)=>n+x.percent,0)/list.length)+'%':'—')+'</b></div>'}).join('')+'</div></div>'+

function dataPage(){return hero('Dữ liệu & sao lưu','App chạy offline; dữ liệu không tự đồng bộ giữa các máy.')+
 '<div class="card"><h2>Mang dữ liệu sang máy khác</h2><div class="toolbar"><button class="btn primary" data-action="saveHtml">Tải HTML kèm tiến độ</button><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="csv">Xuất lịch sử CSV</button></div><p class="muted">Sau khi luyện thêm, tải lại HTML kèm tiến độ hoặc sao lưu JSON mới.</p></div>'+
 '<div class="card"><h2>Khôi phục và làm mới</h2><div class="toolbar"><label class="btn file">Khôi phục JSON<input type="file" accept=".json,application/json" data-import="json"></label><button class="btn danger" data-action="clearProfile">Xóa tiến độ học sinh đang chọn</button><button class="btn danger" data-action="clearAll">Xóa toàn bộ dữ liệu</button></div><p class="hint">Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Hãy sao lưu trước.</p></div>'+
 '<div class="card"><h2>Ngân hàng bài</h2><p>'+BANK.length+' bài lấy từ HTML Luyện Gõ 10 Ngón mà anh cung cấp: '+GROUPS.map(([k,l])=>lessons(k).length+' '+l.toLowerCase()).join(', ')+'.</p></div>';
}
function render(){
 let titles={home:'Lộ trình luyện',practice:'Bài đang gõ',progress:'Tiến độ',profiles:'Học sinh',guide:'Hướng dẫn',data:'Dữ liệu & sao lưu'};
 $('#topTitle').textContent=titles[page];$('#topSub').textContent=profile().name+' · 90 bài · offline';
 $$('[data-page]',$('.side-nav')).forEach(x=>x.classList.toggle('active',x.dataset.page===page));
 $('#screen').innerHTML=page==='home'?home():page==='practice'?practice():page==='progress'?progress():page==='profiles'?profiles():page==='guide'?guide():dataPage();
 if(page==='practice'){let input=$('#typeEntry');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}
 tick();
}
function openProfile(id=null){editing=id;let p=id?data.profiles.find(x=>x.id===id):null;$('#modalTitle').textContent=p?'Sửa học sinh':'Thêm học sinh';$('#p-name').value=p?.name||'';$('#modalError').textContent='';$('#editor').showModal();$('#p-name').focus()}
function saveProfile(){let name=$('#p-name').value.trim();if(!name||name.length>40){$('#modalError').textContent='Tên phải dài 1–40 ký tự.';return}if(data.profiles.some(p=>p.id!==editing&&p.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi'))){$('#modalError').textContent='Tên này đã có.';return}if(editing)data.profiles.find(p=>p.id===editing).name=name;else{if(data.profiles.length>=10){$('#modalError').textContent='Tối đa 10 học sinh.';return}let p={id:id(),name};data.profiles.push(p);data.activeProfile=p.id}$('#editor').close();page='profiles';persist(true)}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(){let rows=[['Học sinh','Ngày giờ','Nhóm','Bài','Kiểm tra 60 giây','Số đúng','Tổng','Chính xác (%)','WPM','Thời gian (giây)','Phím sai']];for(let r of data.results){let p=data.profiles.find(x=>x.id===r.profileId);rows.push([p?.name||'',r.at,groupLabel(r.kind),r.lessonId,r.timed?'Có':'Không',r.correct,r.total,r.percent,r.speed,r.seconds,Object.entries(r.errors||{}).map(([c,n])=>c+': '+n).join('; ')])}return '\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function backup(){download('ai-mo-luyen-go-10-ngon-sao-luu.json','application/json;charset=utf-8',JSON.stringify(data,null,2))}
function saveHtml(){let copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(data))));download('ai-mo-luyen-go-10-ngon-kem-tien-do.html','text/html;charset=utf-8','<!doctype html>\n'+copy.outerHTML)}
function validate(x){if(!validBase(x)||!x.profiles.length||x.profiles.length>10||!x.profiles.some(p=>p.id===x.activeProfile)||x.results.length>2000)return false;let ids=new Set();for(let p of x.profiles){if(!p.id||ids.has(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name.length>40)return false;ids.add(p.id)}for(let r of x.results){if(!ids.has(r.profileId)||!Number.isFinite(Date.parse(r.at))||!Number.isInteger(r.percent)||r.percent<0||r.percent>100||!Number.isInteger(r.speed)||r.speed<0||r.speed>1000||!GROUPS.some(g=>g[0]===r.kind)||(!r.timed&&!BY_ID.has(r.lessonId)))return false}for(let [pid,r] of Object.entries(x.runs)){if(!ids.has(pid)||!r||typeof r.target!=='string'||typeof r.value!=='string'||r.target.length>5000||r.value.length>10000||!GROUPS.some(g=>g[0]===r.kind)||(!r.timed&&!BY_ID.has(r.lessonId)))return false}return true}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-kind],[data-lesson],[data-test]');if(!b)return;
 if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return}
 if(b.dataset.kind){data.selectedKind=b.dataset.kind;persist(true);return}
 if(b.dataset.lesson){start(b.dataset.lesson);return}
 if(b.dataset.test){start(lessons(b.dataset.test)[0]?.id,true);return}
 let a=b.dataset.action;
 if(a==='finish'){if(!run()?.value){alert('Hãy gõ trước khi xem điểm.');return}if(composing){alert('Hãy gõ xong dấu tiếng Việt trước khi xem điểm.');return}finish()}
 if(a==='repeat'){let r=run();if(r)start(r.timed?lessons(r.kind)[0].id:r.lessonId,r.timed)}
 if(a==='clearRun')clearRun();
 if(a==='newProfile')openProfile();
 if(a==='editProfile')openProfile(b.dataset.id);
 if(a==='saveProfile')saveProfile();
 if(a==='closeModal')$('#editor').close();
 if(a==='selectProfile'){data.activeProfile=b.dataset.id;page='home';persist(true)}
 if(a==='deleteProfile'){let p=data.profiles.find(x=>x.id===b.dataset.id);if(!p||data.profiles.length<2)return;if(!confirm('Xóa '+p.name+' và toàn bộ kết quả của học sinh này?'))return;data.profiles=data.profiles.filter(x=>x.id!==p.id);data.results=data.results.filter(x=>x.profileId!==p.id);delete data.runs[p.id];if(data.activeProfile===p.id)data.activeProfile=data.profiles[0].id;persist(true)}
 if(a==='backup')backup();if(a==='saveHtml')saveHtml();if(a==='csv')download('ai-mo-luyen-go-lich-su.csv','text/csv;charset=utf-8',csv());if(a==='print')window.print();
 if(a==='clearProfile'){let p=profile();if(!confirm('Xóa toàn bộ tiến độ của '+p.name+'?'))return;data.results=data.results.filter(x=>x.profileId!==p.id);delete data.runs[p.id];persist(true)}
 if(a==='clearAll'){if(!confirm('Xóa toàn bộ học sinh và tiến độ trên máy này?'))return;data=baseState();page='home';persist(true)}
});
document.addEventListener('input',e=>{if(e.target.id==='typeEntry'&&!composing&&!e.isComposing)updateValue(e.target.value)});
document.addEventListener('compositionstart',e=>{if(e.target.id==='typeEntry')composing=true});
document.addEventListener('compositionend',e=>{if(e.target.id==='typeEntry'){composing=false;updateValue(e.target.value)}});
document.addEventListener('paste',e=>{if(e.target.id==='typeEntry')e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.id==='typeEntry')e.preventDefault()});
document.addEventListener('change',async e=>{if(e.target.dataset.import!=='json')return;let file=e.target.files[0];if(!file)return;try{let next=JSON.parse(await file.text());if(!validate(next))throw Error('File sao lưu không đúng ứng dụng hoặc dữ liệu không hợp lệ.');if(!confirm('Thay toàn bộ dữ liệu hiện có bằng bản sao lưu?'))return;data=next;page='home';persist(true);alert('Đã khôi phục dữ liệu.')}catch(err){alert(err.message)}finally{e.target.value=''}});
if(run()?.timed&&run().startedAt&&run().deadline<=Date.now()&&!run().ended)finish();
render();
</script></body></html>
