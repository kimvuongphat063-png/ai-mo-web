function sample(anchor=today()){let d=blank();d.settings={...d.settings,company:'Công ty TNHH Thương mại An Phát',address:'Số 25 Nguyễn Trãi, Thanh Xuân, Hà Nội',phone:'0912 345 678',taxCode:'0101234567'};d.assets=SOURCE.assets.map((x,i)=>({id:'asset-'+i,code:x[0],name:x[1],bandId:'band-'+x[2],department:x[3],start:x[4]==='CURRENT_MONTH_20'?anchor.slice(0,7)+'-20':x[4],cost:x[5],months:x[6],disposed:x[7]||'',rule:'Tháng sau',note:''}));return d}
function valid(d){if(!d||d.version!==1||!d.settings||!['company','address','phone','taxCode'].every(k=>typeof d.settings[k]==='string'&&d.settings[k].length<=300)||!RULES.includes(d.settings.rule)||!safe(d.settings.threshold)||!Number.isSafeInteger(d.settings.soon)||d.settings.soon<0||d.settings.soon>120||!Array.isArray(d.bands)||d.bands.length>100||!Array.isArray(d.departments)||d.departments.length>100||!Array.isArray(d.assets)||d.assets.length>100000)return false;let ids=new Set(),names=new Set();for(let b of d.bands){if(!b||typeof b.id!=='string'||!b.id||ids.has(b.id)||typeof b.name!=='string'||!b.name||b.name.length>160||names.has(b.name.toLocaleLowerCase('vi'))||!Number.isSafeInteger(b.min)||!Number.isSafeInteger(b.max)||b.min<0||b.max<b.min||b.max>200)return false;ids.add(b.id);names.add(b.name.toLocaleLowerCase('vi'))}let deps=new Set();for(let x of d.departments){if(typeof x!=='string'||!x||x.length>100||deps.has(x.toLocaleLowerCase('vi')))return false;deps.add(x.toLocaleLowerCase('vi'))}let codes=new Set();for(let a of d.assets){if(!a||typeof a.id!=='string'||!a.id||ids.has(a.id)||typeof a.code!=='string'||!a.code||a.code.length>60||codes.has(a.code.toLocaleLowerCase('vi'))||typeof a.name!=='string'||!a.name||a.name.length>220||!d.bands.some(b=>b.id===a.bandId)||!deps.has(a.department.toLocaleLowerCase('vi'))||!dateOK(a.start)||!safe(a.cost)||a.cost===0||!Number.isSafeInteger(a.months)||a.months<1||a.months>2400||a.disposed!==''&&(!dateOK(a.disposed)||a.disposed<a.start)||!RULES.includes(a.rule)||typeof a.note!=='string'||a.note.length>1000)return false;ids.add(a.id);codes.add(a.code.toLocaleLowerCase('vi'))}return true}
const band=(key,d=db)=>d.bands.find(b=>b.id===key);
function evaluate(a,ym,d){let b=band(a.bandId,d),startM=addM(a.start.slice(0,7),a.rule==='Tháng sau'?1:0),lastM=addM(startM,a.months-1),stopM=a.disposed&&a.disposed.slice(0,7)<lastM?a.disposed.slice(0,7):lastM,elapsed=Math.max(0,Math.min(a.months,mIdx(ym)-mIdx(startM)+1,mIdx(stopM)-mIdx(startM)+1)),base=Math.round(a.cost/a.months),accum=elapsed===a.months?a.cost:Math.min(a.cost,base*elapsed),previous=elapsed>0?(elapsed-1===a.months?a.cost:Math.min(a.cost,base*(elapsed-1))):0,thisM=ym>=startM&&ym<=stopM?accum-previous:0,remain=a.cost-accum,disposed=!!a.disposed&&a.disposed<=ym+'-31',status=a.start>ym+'-31'?'Chưa sử dụng':disposed?'Đã thanh lý':elapsed>=a.months?'Hết khấu hao':a.rule==='Tháng sau'&&a.start.slice(0,7)===ym?'Chờ trích':'Đang khấu hao',left=status==='Đang khấu hao'?a.months-elapsed:null;let warnings=[];if(a.cost<d.settings.threshold)warnings.push('Dưới ngưỡng tham khảo');if(b&&(a.months<b.min*12||a.months>b.max*12))warnings.push('Ngoài khung tham khảo');if(status==='Đang khấu hao'&&left<=d.settings.soon)warnings.push('Sắp hết khấu hao');if(disposed&&remain>0)warnings.push('Thanh lý còn giá trị');return{...a,band:b,startM,endM:stopM,base,elapsed,accum,thisM,remain,status,left,warnings}}
const rowsAt=(d,ym)=>d.assets.map(a=>evaluate(a,ym,d));
const active=rows=>rows.filter(a=>['Đang khấu hao','Hết khấu hao','Chờ trích'].includes(a.status));
function metrics(d,ym){let all=rowsAt(d,ym),live=active(all);return{all,live,cost:sum(live,a=>a.cost),accum:sum(live,a=>a.accum),remain:sum(live,a=>a.remain),thisM:sum(live,a=>a.thisM),warn:all.filter(a=>a.warnings.length)}}
function schedule(a,d){let out=[];let startM=addM(a.start.slice(0,7),a.rule==='Tháng sau'?1:0),endM=a.disposed?a.disposed.slice(0,7):addM(startM,a.months-1);for(let i=0;i<a.months;i++){let ym=addM(startM,i);if(ym>endM)break;let r=evaluate(a,ym,d);out.push({ym,dep:r.thisM,accum:r.accum,remain:r.remain})}return out}

function openModal(kind,key=''){let old=(kind==='asset'?db.assets:db.bands).find(x=>x.id===key)||{};modal={kind,key};$('#modalTitle').textContent=(key?'Sửa ':'Thêm ')+(kind==='asset'?'tài sản':'nhóm tài sản');let h='';if(kind==='asset')h=field('code','Mã tài sản *','text',old.code)+field('name','Tên tài sản *','text',old.name)+field('bandId','Nhóm tài sản *','select','',db.bands.map(b=>opt(b.id,b.name,old.bandId||db.bands[0]?.id)).join(''))+field('department','Bộ phận *','select','',db.departments.map(x=>opt(x,x,old.department||db.departments[0])).join(''))+field('start','Ngày đưa vào sử dụng *','date',old.start||today())+field('cost','Nguyên giá (đ) *','number',old.cost??0)+field('months','Số tháng khấu hao *','number',old.months??36)+field('rule','Bắt đầu trích *','select','',RULES.map(x=>opt(x,x,old.rule||db.settings.rule)).join(''))+field('disposed','Ngày thanh lý (nếu có)','date',old.disposed)+field('note','Ghi chú','textarea',old.note);else h=field('name','Tên nhóm *','text',old.name)+field('min','Tối thiểu (năm)','number',old.min??3)+field('max','Tối đa (năm)','number',old.max??10);if(key)h+='<div class="wide"><button type="button" class="btn danger small" data-action="deleteRecord">Xóa bản ghi</button></div>';$('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){if(!modal)return;let{kind,key}=modal,x={},err='';if(kind==='asset'){x={code:v('code'),name:v('name'),bandId:v('bandId'),department:v('department'),start:v('start'),cost:num(v('cost')),months:num(v('months')),rule:v('rule'),disposed:v('disposed'),note:v('note')};if(!x.code||x.code.length>60||!x.name||x.name.length>220||!band(x.bandId)||!db.departments.includes(x.department)||!dateOK(x.start)||!safe(x.cost)||x.cost===0||!Number.isSafeInteger(x.months)||x.months<1||x.months>2400||!RULES.includes(x.rule)||x.disposed&&(!dateOK(x.disposed)||x.disposed<x.start)||x.note.length>1000)err='Kiểm tra mã, nhóm, ngày, nguyên giá, số tháng và ngày thanh lý.';if(db.assets.some(a=>a.id!==key&&a.code.toLocaleLowerCase('vi')===x.code.toLocaleLowerCase('vi')))err='Mã tài sản đã có.'}else{x={name:v('name'),min:num(v('min')),max:num(v('max'))};if(!x.name||x.name.length>160||!Number.isSafeInteger(x.min)||!Number.isSafeInteger(x.max)||x.max<x.min||x.max>200)err='Kiểm tra tên nhóm và khung năm.';if(db.bands.some(b=>b.id!==key&&b.name.toLocaleLowerCase('vi')===x.name.toLocaleLowerCase('vi')))err='Tên nhóm đã có.'}if(err){$('#modalError').textContent=err;return}let d=structuredClone(db),arr=kind==='asset'?d.assets:d.bands;if(key)Object.assign(arr.find(a=>a.id===key),x);else arr.push({id:uid(),...x});if(!valid(d)){$('#modalError').textContent='Dữ liệu không hợp lệ.';return}db=d;closeModal();save()}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('tai-san-khau-hao-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){let rows=rowsAt(db,month),m=metrics(db,month);return[{name:'Tai san',rows:[['Mã nội bộ','Mã TS','Tên tài sản','Mã nhóm','Bộ phận','Ngày sử dụng','Nguyên giá','Số tháng','Ngày thanh lý','Quy tắc','Ghi chú'],...db.assets.map(a=>[a.id,a.code,a.name,a.bandId,a.department,a.start,a.cost,a.months,a.disposed,a.rule,a.note])]},{name:'Nhom',rows:[['Mã nhóm','Tên nhóm','Min năm','Max năm'],...db.bands.map(b=>[b.id,b.name,b.min,b.max])]},{name:'Bo phan',rows:[['Tên bộ phận'],...db.departments.map(x=>[x])]},{name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]},{name:'Bao cao thang',rows:[['Tháng',month],['Nguyên giá',m.cost],['Lũy kế',m.accum],['Còn lại',m.remain],['Khấu hao tháng',m.thisM],[],['Mã TS','Tên','Trạng thái','Nguyên giá','Khấu hao tháng','Lũy kế','Còn lại','Cảnh báo'],...rows.map(a=>[a.code,a.name,a.status,a.cost,a.thisM,a.accum,a.remain,a.warnings.join('; ')])]}]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='tai-san-co-dinh-khau-hao.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(x){if(typeof x==='number'){let d=new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000);return d.toISOString().slice(0,10)}let s=String(x??'').trim();if(dateOK(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let d=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return dateOK(d)?d:''}return''}
function parsedExcel(s){if(s['Tai san']?.[0]?.[0]!=='Mã nội bộ'||s['Nhom']?.[0]?.[0]!=='Mã nhóm'||s['Bo phan']?.[0]?.[0]!=='Tên bộ phận')throw Error('Cần file Excel do app xuất có đủ sheet Tài sản, Nhóm, Bộ phận.');let d=blank();d.bands=s['Nhom'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),name:String(r[1]??''),min:num(r[2]),max:num(r[3])}));d.departments=s['Bo phan'].slice(1).filter(r=>r[0]).map(r=>String(r[0]));d.assets=s['Tai san'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]??''),name:String(r[2]??''),bandId:String(r[3]??''),department:String(r[4]??''),start:parseDate(r[5]),cost:num(r[6]),months:num(r[7]),disposed:r[8]?parseDate(r[8]):'',rule:String(r[9]??''),note:String(r[10]??'')}));if(s['Cai dat']){let raw=Object.fromEntries(s['Cai dat'].slice(1).filter(r=>r[0]).map(r=>[String(r[0]),r[1]]));for(let k of Object.keys(d.settings))if(raw[k]!==undefined)d.settings[k]=['threshold','soon'].includes(k)?num(raw[k]):String(raw[k])}if(!valid(d))throw Error('Excel có mã liên kết, ngày, nguyên giá hoặc kỳ hạn không hợp lệ.');return d}
function csv(){let rows=[['Mã TS','Tên','Nhóm','Bộ phận','Ngày dùng','Nguyên giá','Số tháng','Quy tắc','Ngày thanh lý','Lũy kế','Giá trị còn lại','Khấu hao tháng','Trạng thái','Cảnh báo'],...rowsAt(db,month).map(a=>[a.code,a.name,a.band?.name,a.department,a.start,a.cost,a.months,a.rule,a.disposed,a.accum,a.remain,a.thisM,a.status,a.warnings.join('; ')])];download('so-tai-san.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')window.print();if(a==='excel')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv();if(a==='backup')download('tai-san-khau-hao.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='schedule'){chosen=b.dataset.id;page='schedule';render()}if(a==='sample'){if(!confirm('Nạp mẫu sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sample();month=today().slice(0,7);save()}if(a==='clear'){if(confirm('Xóa toàn bộ tài sản và cài đặt trên trình duyệt này?')){db=blank();chosen='';save()}}if(a==='settings'){let d=structuredClone(db);for(let k of ['company','address','phone','taxCode','rule'])d.settings[k]=v(k);d.settings.threshold=num(v('threshold'));d.settings.soon=num(v('soon'));if(!valid(d)){alert('Cài đặt không hợp lệ.');return}db=d;save()}if(a==='departments'){let arr=$('#departmentsText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),d=structuredClone(db);d.departments=arr;if(!valid(d)){alert('Danh sách trùng, rỗng hoặc còn tài sản dùng bộ phận đã xóa.');return}db=d;save()}if(a==='deleteRecord'&&modal?.key){let{kind,key}=modal;if(kind==='band'&&db.assets.some(x=>x.bandId===key)){$('#modalError').textContent='Nhóm đã có tài sản; không thể xóa.';return}if(!confirm('Xóa vĩnh viễn bản ghi này?'))return;let k=kind==='asset'?'assets':'bands';db[k]=db[k].filter(x=>x.id!==key);closeModal();save()}});
document.addEventListener('change',e=>{if(e.target.id==='monthPick'&&monthOK(e.target.value)){month=e.target.value;render()}if(e.target.id==='assetPick'){chosen=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
