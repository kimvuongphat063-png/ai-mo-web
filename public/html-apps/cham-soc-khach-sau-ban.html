let db=embedded()||stored()||empty(),page='dashboard',draft=null,query='',filter='Tất cả',year=String(new Date().getFullYear());
function save(redraw=true){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trong trình duyệt. Hãy sao lưu JSON hoặc tải HTML kèm dữ liệu.')}if(redraw)render()}
function persistDraft(){try{sessionStorage.setItem(KEY+'-draft',JSON.stringify(draft))}catch{}}

const asof=()=>db.settings.asof||today();
const plan=id=>db.plans.find(p=>p.id===id);
function due(p){if(p.manualNextDate)return p.manualNextDate;let anchor=p.lastContact||p.purchaseDate;return anchor&&p.cycleDays>0?addDays(anchor,p.cycleDays):''}
function state(p){if(p.status==='Tạm dừng')return 'Tạm dừng';let d=due(p);if(!d)return 'Chưa có lịch';let remain=days(d,asof());return remain<0?'Quá hạn':remain<=db.settings.remindBefore?'Sắp đến hạn':'Theo lịch'}
function dataIssue(p){if(p.lastContact&&p.lastContact>asof())return 'Lần liên hệ ở tương lai';if(p.purchaseDate&&p.purchaseDate>asof())return 'Ngày mua ở tương lai';if(p.lastContact&&p.purchaseDate&&p.lastContact<p.purchaseDate)return 'Liên hệ trước ngày mua';return ''}
function nextCode(offset=0){let n=Math.max(0,...db.plans.map(p=>/^CS\d+$/.test(p.code)?Number(p.code.slice(2)):0))+offset+1;return 'CS'+String(n).padStart(4,'0')}
const hero=(title,sub)=>'<div class="hero"><small>AI MỞ · CHĂM SÓC SAU BÁN OFFLINE</small><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div>';
const metric=(label,value,note='')=>'<div class="metric"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(note)+'</div></div>';
const pill=s=>'<span class="pill '+({'Quá hạn':'overdue','Sắp đến hạn':'soon','Theo lịch':'ontrack','Tạm dừng':'paused','Chưa có lịch':'none'}[s]||'')+'">'+esc(s)+'</span>';
function queue(list){return list.length?'<div class="table-wrap"><table><thead><tr><th>Khách hàng / sản phẩm</th><th>Điện thoại</th><th>Lần liên hệ</th><th>Chu kỳ</th><th>Hạn nhắc</th><th>Còn ngày</th><th>Trạng thái</th><th>Quyền liên hệ</th><th>Phụ trách</th></tr></thead><tbody>'+list.map(p=>{let d=due(p),left=d?days(d,asof()):null;return '<tr><td><button class="link" data-open="'+esc(p.id)+'">'+esc(p.customer)+'</button><small>'+esc(p.product)+'</small>'+(dataIssue(p)?'<small class="warning">'+esc(dataIssue(p))+'</small>':'')+'</td><td>'+esc(p.phone||'—')+'</td><td>'+date(p.lastContact)+'</td><td>'+number(p.cycleDays)+' ngày</td><td>'+date(d)+'</td><td>'+(left===null?'—':left<0?'Quá '+number(-left)+' ngày':number(left)+' ngày')+'</td><td>'+pill(state(p))+'</td><td>'+esc(p.consent)+'</td><td>'+esc(p.owner||'—')+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">Chưa có khách phù hợp. Thêm khách hoặc nạp dữ liệu mẫu.</div>'}
function dashboard(){let active=db.plans.filter(p=>p.status!=='Tạm dừng'),over=active.filter(p=>state(p)==='Quá hạn'),soon=active.filter(p=>state(p)==='Sắp đến hạn'),undated=active.filter(p=>state(p)==='Chưa có lịch'),contacts=db.plans.flatMap(p=>p.history).filter(h=>h.date?.startsWith(asof().slice(0,7))),issues=db.plans.filter(dataIssue),priority=[...over,...soon].sort((a,b)=>due(a).localeCompare(due(b)));return hero('Chăm sóc sau bán','Nhắc bảo dưỡng, gọi hỏi thăm và gợi ý mua lại đúng thời điểm.')+
 '<div class="grid metrics">'+metric('Đang theo dõi',number(active.length),'Tổng '+db.plans.length+' kế hoạch')+metric('Quá hạn',number(over.length),'Cần xử lý trước')+metric('Sắp đến hạn',number(soon.length),'Trong '+db.settings.remindBefore+' ngày')+metric('Đã ghi liên hệ tháng này',number(contacts.length),'Gồm gọi chưa thành công')+metric('Thiếu lịch / dữ liệu cần rà',number(undated.length+issues.length),'Không tự gửi thông báo')+'</div>'+
 '<div class="card"><div class="toolbar"><h2>Danh sách cần liên hệ</h2><span class="grow"></span><button class="btn" data-page="plans">Xem tất cả</button><button class="btn primary" data-action="new">+ Thêm khách</button></div>'+queue(priority.slice(0,12))+'</div>'+
 '<div class="grid two"><div class="card"><h2>Nhóm sản phẩm</h2>'+Object.entries(group(db.plans,p=>p.product||'Chưa phân nhóm')).sort((a,b)=>b[1].length-a[1].length).slice(0,8).map(([name,items])=>'<div class="check"><span>'+esc(name)+'</span><b>'+items.length+'</b></div>').join('')+'</div><div class="card"><h2>Lưu ý khi liên hệ</h2><p>Danh sách chỉ tạo việc để nhân viên tự xử lý. App không tự gửi tin nhắn hoặc gọi điện. Kiểm tra quyền liên hệ của khách trước khi dùng dữ liệu cho mục đích tiếp thị.</p><p>Những lần không nghe máy và hẹn gọi lại được ghi vào nhật ký, nhưng không tự tính lại chu kỳ chăm sóc.</p></div></div>'}
function group(list,fn){let out={};for(let x of list){let k=fn(x);(out[k]??=[]).push(x)}return out}
function plansPage(){let items=db.plans.filter(p=>(filter==='Tất cả'||state(p)===filter)&&[p.customer,p.phone,p.email,p.product,p.code,p.owner].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).sort((a,b)=>(due(a)||'9999').localeCompare(due(b)||'9999')||a.customer.localeCompare(b.customer,'vi'));return hero('Khách hàng sau bán','Mỗi dòng là một sản phẩm hoặc dịch vụ đã bán với chu kỳ chăm sóc riêng.')+'<div class="card"><div class="toolbar"><input class="search" id="search" placeholder="Tìm khách, sản phẩm, số điện thoại..." value="'+esc(query)+'"><select id="filter">'+['Tất cả','Quá hạn','Sắp đến hạn','Theo lịch','Chưa có lịch','Tạm dừng'].map(s=>'<option '+(filter===s?'selected':'')+'>'+s+'</option>').join('')+'</select><span class="grow"></span><span class="muted">'+items.length+' kế hoạch</span><button class="btn primary" data-action="new">+ Thêm khách</button></div>'+queue(items)+'</div>'}
function blank(){return{id:null,code:nextCode(),customer:'',phone:'',email:'',product:'',purchaseDate:'',cycleDays:db.settings.defaultCycle,lastContact:'',manualNextDate:'',owner:'',channel:'Điện thoại',consent:'Chưa xác nhận',status:'Đang theo dõi',notes:'',history:[]}}
function field(label,key,type='text',extra=''){return '<label class="field">'+esc(label)+'<input data-field="'+key+'" type="'+type+'" value="'+esc(draft[key]??'')+'" '+extra+'></label>'}
function area(label,key){return '<label class="field full">'+esc(label)+'<textarea data-field="'+key+'">'+esc(draft[key]||'')+'</textarea></label>'}
function select(label,key,opts){return '<label class="field">'+esc(label)+'<select data-field="'+key+'">'+opts.map(s=>'<option '+(draft[key]===s?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select></label>'}
function reminder(p){let t=db.settings.template||'',vars={ten:p.customer,san_pham:p.product,han:date(due(p)),cua_hang:db.settings.company||'cửa hàng'};return t.replace(/\{(ten|san_pham|han|cua_hang)\}/g,(_,k)=>vars[k]||'')}
function editor(){let d=due(draft),s=state(draft),left=d?days(d,asof()):null;return hero(draft.id?'Khách hàng '+draft.customer:'Thêm kế hoạch chăm sóc','Thông tin liên hệ, chu kỳ, nhật ký và mốc nhắc tiếp theo.')+'<div class="toolbar"><button class="btn" data-page="plans">← Danh sách</button><span class="grow"></span><button class="btn primary" data-action="save">Lưu kế hoạch</button></div><div class="grid edit-grid"><div><div class="card"><h2>Khách hàng & sản phẩm</h2><div class="form-grid">'+field('Mã theo dõi','code')+field('Tên khách hàng *','customer')+field('Điện thoại','phone','tel')+field('Email','email','email')+field('Sản phẩm / dịch vụ đã mua *','product')+field('Ngày mua','purchaseDate','date')+field('Chu kỳ chăm sóc (ngày) *','cycleDays','number','min="1" max="3650"')+field('Lần liên hệ gần nhất','lastContact','date')+field('Hạn hẹn riêng (nếu có)','manualNextDate','date')+field('Nhân viên phụ trách','owner')+select('Kênh ưu tiên','channel',['Điện thoại','Zalo','Email','Trực tiếp'])+select('Trạng thái','status',['Đang theo dõi','Tạm dừng'])+select('Đồng ý nhận liên hệ tiếp thị','consent',CONSENT)+area('Ghi chú nhu cầu / sở thích / lịch sử mua','notes')+'</div><p class="hint">Mốc tính = lần liên hệ gần nhất, nếu chưa có thì lấy ngày mua. Hạn nhắc = mốc tính + chu kỳ. Hạn hẹn riêng được ưu tiên đến khi hoàn tất lần chăm sóc tiếp theo.</p></div>'+
 '<div class="card"><h2>Ghi nhận lần liên hệ</h2><div class="form-grid"><label class="field">Ngày liên hệ<input id="actDate" type="date" value="'+today()+'"></label><label class="field">Kênh<select id="actMethod">'+['Điện thoại','Zalo','Email','Trực tiếp'].map(s=>'<option>'+s+'</option>').join('')+'</select></label><label class="field">Kết quả<select id="actOutcome">'+OUTCOMES.map(s=>'<option>'+s+'</option>').join('')+'</select></label><label class="field">Hẹn lại ngày<input id="actNext" type="date"></label><label class="field full">Nội dung / ghi chú<textarea id="actNote" placeholder="Ví dụ: khách muốn được gọi lại sau cuối tuần..."></textarea></label></div><div class="toolbar"><button class="btn primary" data-action="addActivity">+ Ghi vào nhật ký</button></div><p class="muted small">Chỉ các kết quả đã tư vấn, đã bảo dưỡng hoặc đã mua lại mới cập nhật “lần liên hệ gần nhất”. Nếu hẹn gọi lại, nhập ngày hẹn để đưa vào danh sách cần xử lý.</p></div>'+
 '<div class="card"><h2>Nhật ký liên hệ</h2>'+(draft.history.length?'<div class="timeline">'+[...draft.history].reverse().map(h=>'<div class="timeline-item"><div><b>'+esc(h.outcome)+'</b> · '+date(h.date)+' · '+esc(h.method)+'<small>'+esc(h.note||'')+(h.nextDate?' · Hẹn lại '+date(h.nextDate):'')+'</small></div></div>').join('')+'</div>':'<p class="muted">Chưa có lần liên hệ nào.</p>')+'</div></div><aside><div class="card sticky"><h2>Lịch chăm sóc</h2><div id="schedule">'+schedule(d,s,left)+'</div><div class="toolbar"><button class="btn primary wide" data-action="save">Lưu kế hoạch</button>'+(draft.id?'<button class="btn wide" data-action="duplicate">Nhân bản cho sản phẩm khác</button><button class="btn danger wide" data-action="delete">Xóa kế hoạch</button>':'')+'</div></div><div class="card"><h2>Nội dung nhắc gợi ý</h2><textarea readonly id="reminderText" rows="6">'+esc(reminder(draft))+'</textarea><p class="muted small">Tự kiểm tra thông tin và quyền liên hệ trước khi gửi. App không tự gửi.</p></div></aside></div>'}
function schedule(d,s,left){return '<div class="summary-list"><div><span>Trạng thái</span><b>'+pill(s)+'</b></div><div><span>Mốc tính</span><b>'+date(draft.lastContact||draft.purchaseDate)+'</b></div><div><span>Hạn tiếp theo</span><b>'+date(d)+'</b></div><div><span>Còn lại</span><b>'+(left===null?'—':left<0?'Quá '+number(-left)+' ngày':number(left)+' ngày')+'</b></div><div><span>Đồng ý tiếp thị</span><b>'+esc(draft.consent)+'</b></div></div>'+(dataIssue(draft)?'<p class="warning">'+esc(dataIssue(draft))+'</p>':'')}
function refreshSchedule(){let d=due(draft),el=$('#schedule');if(el)el.innerHTML=schedule(d,state(draft),d?days(d,asof()):null);let msg=$('#reminderText');if(msg)msg.value=reminder(draft)}
function newPlan(){if(draft&&!confirm('Bỏ thay đổi chưa lưu?'))return;draft=blank();page='edit';persistDraft();render()}
function openPlan(id){let p=plan(id);if(!p)return;if(draft&&!confirm('Bỏ thay đổi chưa lưu?'))return;draft=clone(p);page='edit';persistDraft();render()}
function validate(p){if(!p.code?.trim()||p.code.length>50)return 'Mã theo dõi cần từ 1 đến 50 ký tự.';if(db.plans.some(x=>x.id!==p.id&&x.code.toLowerCase()===p.code.toLowerCase()))return 'Mã theo dõi đã tồn tại.';if(!p.customer?.trim()||!p.product?.trim())return 'Cần nhập khách hàng và sản phẩm/dịch vụ.';if(!Number.isInteger(+p.cycleDays)||p.cycleDays<1||p.cycleDays>3650)return 'Chu kỳ từ 1 đến 3.650 ngày.';for(let k of ['purchaseDate','lastContact','manualNextDate'])if(p[k]&&!validDate(p[k]))return 'Ngày '+k+' không hợp lệ.';if(!CONSENT.includes(p.consent)||!['Đang theo dõi','Tạm dừng'].includes(p.status))return 'Trạng thái hoặc đồng ý liên hệ không hợp lệ.';if(!Array.isArray(p.history)||p.history.length>500)return 'Tối đa 500 nhật ký mỗi kế hoạch.';return ''}
function savePlan(){if(!draft)return null;let err=validate(draft);if(err){alert(err);return null}let p=clone(draft);if(!p.id){if(db.plans.length>=5000){alert('Tối đa 5.000 kế hoạch.');return null}p.id=uid();db.plans.push(p)}else{let i=db.plans.findIndex(x=>x.id===p.id);if(i<0){alert('Không tìm thấy kế hoạch.');return null}db.plans[i]=p}clearDraft();page='plans';save();return p.id}
function addActivity(){let act={id:uid(),date:$('#actDate').value,method:$('#actMethod').value,outcome:$('#actOutcome').value,nextDate:$('#actNext').value,note:$('#actNote').value.trim()};if(!validDate(act.date)||!OUTCOMES.includes(act.outcome)||act.nextDate&&!validDate(act.nextDate)){alert('Ngày hoặc kết quả liên hệ không hợp lệ.');return}if(act.nextDate&&act.nextDate<act.date){alert('Ngày hẹn lại không thể trước ngày liên hệ.');return}if(act.outcome==='Hẹn gọi lại'&&!act.nextDate){alert('Hãy nhập ngày hẹn gọi lại.');return}if(draft.history.length>=500){alert('Tối đa 500 dòng nhật ký.');return}draft.history.push(act);if(DONE.has(act.outcome)){draft.lastContact=act.date;draft.manualNextDate=act.nextDate||''}else if(act.nextDate)draft.manualNextDate=act.nextDate;persistDraft();render()}
function contactsPage(){let entries=db.plans.flatMap(p=>p.history.map(h=>({...h,customer:p.customer,product:p.product,planId:p.id,phone:p.phone}))).filter(h=>h.date?.startsWith(year)).sort((a,b)=>b.date.localeCompare(a.date)),months=Array.from({length:12},(_,i)=>year+'-'+String(i+1).padStart(2,'0'));return hero('Nhật ký & báo cáo','Theo dõi các lần chăm sóc đã ghi, cả thành công và chưa liên hệ được.')+'<div class="card"><div class="toolbar"><label>Năm <select id="yearPick">'+[...new Set([String(new Date().getFullYear()),...db.plans.flatMap(p=>p.history.map(h=>h.date?.slice(0,4))).filter(Boolean)])].sort().reverse().map(y=>'<option '+(y===year?'selected':'')+'>'+y+'</option>').join('')+'</select></label><span class="grow"></span><button class="btn" data-action="exportReport">Xuất Excel báo cáo</button></div><div class="grid metrics">'+metric('Lượt liên hệ',number(entries.length))+metric('Hoàn tất chăm sóc',number(entries.filter(h=>DONE.has(h.outcome)).length))+metric('Chưa liên hệ được',number(entries.filter(h=>!DONE.has(h.outcome)).length))+metric('Hẹn gọi lại',number(entries.filter(h=>h.outcome==='Hẹn gọi lại').length))+'</div></div><div class="grid two"><div class="card"><h2>Hoạt động theo tháng</h2><div class="table-wrap"><table><thead><tr><th>Tháng</th><th class="num">Lượt</th><th class="num">Hoàn tất</th><th class="num">Mua lại</th></tr></thead><tbody>'+months.map(m=>{let a=entries.filter(h=>h.date.startsWith(m));return '<tr><td>'+m+'</td><td class="num">'+a.length+'</td><td class="num">'+a.filter(h=>DONE.has(h.outcome)).length+'</td><td class="num">'+a.filter(h=>h.outcome==='Đã mua lại').length+'</td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><h2>Khách theo sản phẩm</h2>'+Object.entries(group(db.plans,p=>p.product)).sort((a,b)=>b[1].length-a[1].length).map(([name,a])=>'<div class="check"><span>'+esc(name)+'</span><b>'+a.length+'</b></div>').join('')+'</div></div><div class="card"><h2>Nhật ký chi tiết</h2>'+(entries.length?'<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Khách hàng</th><th>Sản phẩm</th><th>Kênh</th><th>Kết quả</th><th>Ghi chú</th></tr></thead><tbody>'+entries.slice(0,250).map(h=>'<tr><td>'+date(h.date)+'</td><td><button class="link" data-open="'+esc(h.planId)+'">'+esc(h.customer)+'</button></td><td>'+esc(h.product)+'</td><td>'+esc(h.method)+'</td><td>'+esc(h.outcome)+'</td><td>'+esc(h.note)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Chưa có nhật ký.</p>')+'</div>'}
function settingsPage(){let s=db.settings;return hero('Cài đặt','Ngày tính cảnh báo, chu kỳ mặc định và mẫu nội dung để nhân viên tự gửi.')+'<div class="card"><div class="form-grid"><label class="field">Tên cửa hàng<input data-setting="company" value="'+esc(s.company)+'"></label><label class="field">Ngày báo cáo (để trống = hôm nay)<input data-setting="asof" type="date" value="'+esc(s.asof)+'"></label><label class="field">Nhắc trước hạn (ngày)<input data-setting="remindBefore" type="number" min="0" max="365" value="'+s.remindBefore+'"></label><label class="field">Chu kỳ mặc định (ngày)<input data-setting="defaultCycle" type="number" min="1" max="3650" value="'+s.defaultCycle+'"></label><label class="field full">Mẫu nội dung nhắc<textarea data-setting="template">'+esc(s.template)+'</textarea><small>Dùng {ten}, {san_pham}, {han}, {cua_hang}. Nội dung chỉ được tạo để sao chép thủ công.</small></label></div><button class="btn primary" data-action="saveSettings">Lưu cài đặt</button></div>'}
function dataPage(){return hero('Dữ liệu & sao lưu','Một file HTML độc lập, chạy offline và không cần API.')+'<div class="card"><h2>Sao lưu & xuất</h2><div class="toolbar"><button class="btn primary" data-action="saveHtml">Tải HTML kèm dữ liệu</button><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="exportAll">Xuất Excel nội bộ</button><button class="btn" data-action="exportCsv">Xuất CSV khách hàng</button></div><p class="muted">HTML kèm dữ liệu là bản chụp. Sau khi cập nhật, tải lại file mới hoặc sao lưu JSON. Excel có hai sheet: kế hoạch và nhật ký.</p></div><div class="card"><h2>Khôi phục & dữ liệu mẫu</h2><div class="toolbar"><label class="btn file">Khôi phục JSON<input type="file" accept=".json" data-import="backup"></label><label class="btn file">Nhập CSV / Excel<input type="file" accept=".csv,.xlsx" data-import="plans"></label><button class="btn" data-action="sample">Nạp 20 khách mẫu</button><button class="btn danger" data-action="clear">Xóa toàn bộ</button></div><p class="hint">File nhập hỗ trợ 5 cột gốc: Khách hàng, Sản phẩm đã mua, Ngày mua, Chu kỳ chăm sóc (ngày), Lần liên hệ gần nhất. Có thể thêm điện thoại, email, nhân viên phụ trách và đồng ý tiếp thị. Mẫu chỉ nạp khi sổ trống.</p></div><div class="card"><h2>Riêng tư</h2><p>Khách hàng và số điện thoại lưu trong trình duyệt hiện tại. Không có tài khoản hoặc đồng bộ. App không tự gửi tin nhắn; người dùng tự xác nhận quyền liên hệ và nội dung trước khi gửi.</p></div>'}
function guide(){return hero('Hướng dẫn sử dụng','Tạo lịch chăm sóc có kiểm soát và ghi lại kết quả mỗi lần liên hệ.')+'<div class="grid two"><div class="card"><h2>Quy trình</h2><ol><li>Thêm khách và sản phẩm đã mua; mỗi sản phẩm có thể có chu kỳ riêng.</li><li>Nhập ngày mua hoặc lần liên hệ gần nhất. App tính hạn nhắc kế tiếp.</li><li>Mở Tổng quan mỗi ngày để xem quá hạn và sắp đến hạn.</li><li>Liên hệ khách qua kênh phù hợp, sau đó ghi kết quả vào nhật ký.</li><li>Nếu khách chưa nghe máy, hẹn gọi lại và nhập ngày hẹn. Nếu đã chăm sóc, app bắt đầu chu kỳ mới.</li><li>Vào Báo cáo để xem số lượt chăm sóc, rồi sao lưu JSON định kỳ.</li></ol></div><div class="card"><h2>Công thức & giới hạn</h2><p>Mốc tính = lần liên hệ gần nhất, nếu chưa có thì ngày mua. Hạn nhắc = mốc + chu kỳ ngày. Hạn hẹn riêng tạm thay hạn nhắc tính tự động. Quá hạn khi hạn trước ngày báo cáo; sắp đến hạn khi còn từ 0 đến số ngày nhắc trước.</p><p>Không có ngày mua hoặc lần liên hệ thì trạng thái “Chưa có lịch”. Kế hoạch tạm dừng không hiển thị trong danh sách cảnh báo. Các lần “Không nghe máy” không đẩy chu kỳ chăm sóc.</p><p>File mẫu gốc có vài ngày liên hệ nằm ở tương lai so với ngày báo cáo; app hiển thị dấu cần rà thay vì sửa dữ liệu mẫu.</p></div></div>'}
function render(){let titles={dashboard:'Tổng quan',plans:'Khách hàng sau bán',edit:'Kế hoạch chăm sóc',contacts:'Nhật ký & báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$('#topSub').textContent=db.plans.length+' kế hoạch · Ngày báo cáo '+date(asof());$$('[data-page]',$('.side-nav')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=page==='dashboard'?dashboard():page==='plans'?plansPage():page==='edit'?editor():page==='contacts'?contactsPage():page==='settings'?settingsPage():page==='data'?dataPage():guide()}
function navigate(to){if(page==='edit'&&draft&&!confirm('Bỏ thay đổi chưa lưu?'))return;if(page==='edit')clearDraft();page=to;render();window.scrollTo(0,0)}
function download(name,type,body){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadBlob(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function xlsx(name,sheets){downloadBlob(name+'.xlsx',Excel.workbook(sheets.map(([name,rows])=>({name,rows}))))}
function planRows(list=db.plans){return[['Mã','Khách hàng','Điện thoại','Email','Sản phẩm đã mua','Ngày mua','Chu kỳ chăm sóc (ngày)','Lần liên hệ gần nhất','Hạn hẹn riêng','Hạn nhắc tiếp theo','Số ngày còn lại','Trạng thái','Nhân viên phụ trách','Kênh','Đồng ý tiếp thị','Ghi chú'],...list.map(p=>{let d=due(p);return[p.code,p.customer,p.phone,p.email,p.product,p.purchaseDate,p.cycleDays,p.lastContact,p.manualNextDate,d,d?days(d,asof()):'',state(p),p.owner,p.channel,p.consent,p.notes]})]}
function activityRows(list=db.plans,yearFilter=''){return[['Mã','Khách hàng','Sản phẩm','Ngày liên hệ','Kênh','Kết quả','Hẹn lại','Ghi chú'],...list.flatMap(p=>p.history.filter(h=>!yearFilter||h.date?.startsWith(yearFilter)).map(h=>[p.code,p.customer,p.product,h.date,h.method,h.outcome,h.nextDate,h.note]))]}
function exportAll(){xlsx('ai-mo-cham-soc-sau-ban',[['Kế hoạch',planRows()],['Nhật ký',activityRows()]])}
function exportReport(){let list=db.plans.filter(p=>p.history.some(h=>h.date?.startsWith(year)));xlsx('bao-cao-cham-soc-'+year,[['Nhật ký',activityRows(list,year)],['Theo tháng',[['Tháng','Lượt liên hệ','Hoàn tất','Mua lại'],...Array.from({length:12},(_,i)=>{let m=year+'-'+String(i+1).padStart(2,'0'),h=db.plans.flatMap(p=>p.history).filter(h=>h.date?.startsWith(m));return[m,h.length,h.filter(x=>DONE.has(x.outcome)).length,h.filter(x=>x.outcome==='Đã mua lại').length]})]]])}
const csvRows=rows=>'\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
function backup(){download('ai-mo-cham-soc-sao-luu.json','application/json;charset=utf-8',JSON.stringify(db,null,2))}
function saveHtml(){let doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(db))));download('ai-mo-cham-soc-kem-du-lieu.html','text/html;charset=utf-8','<!doctype html>\n'+doc.outerHTML)}
function validBackup(x){if(!shape(x)||x.plans.length>5000||!Number.isInteger(+x.settings.remindBefore)||+x.settings.remindBefore<0||+x.settings.remindBefore>365||!Number.isInteger(+x.settings.defaultCycle)||+x.settings.defaultCycle<1||+x.settings.defaultCycle>3650||x.settings.asof&&!validDate(x.settings.asof))return false;let ids=new Set(),codes=new Set();for(let p of x.plans){if(!p||!p.id||!p.code||ids.has(p.id)||codes.has(String(p.code).toLowerCase())||!p.customer||!p.product||!Number.isInteger(+p.cycleDays)||+p.cycleDays<1||+p.cycleDays>3650||!['Đang theo dõi','Tạm dừng'].includes(p.status)||!CONSENT.includes(p.consent)||!Array.isArray(p.history)||p.history.length>500)return false;for(let k of ['purchaseDate','lastContact','manualNextDate'])if(p[k]&&!validDate(p[k]))return false;if(p.history.some(h=>!h||!validDate(h.date)||!OUTCOMES.includes(h.outcome)||h.nextDate&&!validDate(h.nextDate)))return false;ids.add(p.id);codes.add(String(p.code).toLowerCase())}return true}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);return rows}
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseDate(v){if(typeof v==='number'&&v>20000&&v<100000)return iso(new Date(Date.UTC(1899,11,30)+v*86400000));let s=String(v??'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
async function importPlans(file){let rows=file.name.toLowerCase().endsWith('.xlsx')?Object.values(await Excel.read(file))[0]||[]:parseCSV(await file.text());if(rows.length<2)throw Error('File cần tiêu đề và dữ liệu.');let headers=rows[0].map(norm),cols={customer:['khachhang','khach','tenkhachhang'],product:['sanphamdamua','sanpham','sp'],purchaseDate:['ngaymua'],cycleDays:['chukychamsocngay','chuky','chukychamsocnhacngay'],lastContact:['lanlienhegannhat','lienhe'],phone:['dienthoai','sdt','sodienthoai'],email:['email'],owner:['nhanvienphutrach','phutrach'],consent:['dongytiepthi','dongynhanlienhetiepthi'],code:['ma','matheodoi']},at=Object.fromEntries(Object.entries(cols).map(([k,aliases])=>[k,headers.findIndex(h=>aliases.includes(h))]));if(at.customer<0||at.product<0||at.cycleDays<0)throw Error('Thiếu cột khách hàng, sản phẩm hoặc chu kỳ.');let items=[];for(let r of rows.slice(1)){if(!r.some(x=>String(x??'').trim()))continue;let v=k=>at[k]<0?'':r[at[k]]??'',p=blank();p.code=String(v('code')).trim()||nextCode(items.length);p.customer=String(v('customer')).trim();p.product=String(v('product')).trim();p.purchaseDate=parseDate(v('purchaseDate'));p.cycleDays=Number(v('cycleDays'));p.lastContact=parseDate(v('lastContact'));p.phone=String(v('phone')).trim();p.email=String(v('email')).trim();p.owner=String(v('owner')).trim();let consent=String(v('consent')).trim();if(CONSENT.includes(consent))p.consent=consent;let err=validate(p);if(err)throw Error('Dòng '+(items.length+2)+': '+err);items.push(p)}if(!items.length)throw Error('Không có kế hoạch hợp lệ.');if(db.plans.length+items.length>5000)throw Error('Vượt giới hạn 5.000 kế hoạch.');let codes=new Set(db.plans.map(p=>p.code.toLowerCase()));for(let p of items){if(codes.has(p.code.toLowerCase()))throw Error('Mã theo dõi trùng: '+p.code);codes.add(p.code.toLowerCase())}if(!confirm('Nhập '+items.length+' kế hoạch?'))return;for(let p of items){p.id=uid();db.plans.push(p)}save();alert('Đã nhập '+items.length+' kế hoạch.')}
function loadSample(){if(db.plans.length){alert('Chỉ nạp mẫu khi sổ đang trống.');return}if(!confirm('Nạp 20 khách mẫu từ app gốc?'))return;db.plans=SAMPLE.cs.map((r,i)=>({id:uid(),code:'CS'+String(i+1).padStart(4,'0'),customer:r[0],phone:'',email:'',product:r[1],purchaseDate:addDays(today(),Number(r[2].slice(1))),cycleDays:r[3],lastContact:r[4]?addDays(today(),Number(r[4].slice(1))):'',manualNextDate:'',owner:'',channel:'Điện thoại',consent:'Chưa xác nhận',status:'Đang theo dõi',notes:'',history:[]}));save()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-open]');if(!b)return;let d=b.dataset;if(d.page){navigate(d.page);return}if(d.open){openPlan(d.open);return}switch(d.action){case'new':newPlan();break;case'save':savePlan();break;case'addActivity':addActivity();break;case'duplicate':{let p=clone(draft);p.id=null;p.code=nextCode();p.product='';p.purchaseDate='';p.lastContact='';p.manualNextDate='';p.history=[];draft=p;persistDraft();render();break}case'delete':if(draft?.id&&confirm('Xóa kế hoạch '+draft.code+'?')){db.plans=db.plans.filter(p=>p.id!==draft.id);clearDraft();page='plans';save()}break;case'saveSettings':{let s=clone(db.settings);for(let el of $$('[data-setting]'))s[el.dataset.setting]=['remindBefore','defaultCycle'].includes(el.dataset.setting)?Number(el.value):el.value.trim();if(!Number.isInteger(s.remindBefore)||s.remindBefore<0||s.remindBefore>365||!Number.isInteger(s.defaultCycle)||s.defaultCycle<1||s.defaultCycle>3650||s.asof&&!validDate(s.asof)){alert('Thông số cài đặt không hợp lệ.');return}db.settings=s;save();break}case'backup':backup();break;case'saveHtml':saveHtml();break;case'exportAll':exportAll();break;case'exportReport':exportReport();break;case'exportCsv':download('ai-mo-cham-soc-khach.csv','text/csv;charset=utf-8',csvRows(planRows()));break;case'sample':loadSample();break;case'clear':if(confirm('Xóa toàn bộ kế hoạch và cài đặt?')){db=empty();clearDraft();page='dashboard';save()}break}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='search'){let at=t.selectionStart;query=t.value;render();let n=$('#search');n?.focus();n?.setSelectionRange(at,at);return}if(t.dataset.field&&draft){draft[t.dataset.field]=t.dataset.field==='cycleDays'?Number(t.value):t.value;persistDraft();refreshSchedule()}});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='filter'){filter=t.value;render();return}if(t.id==='yearPick'){year=t.value;render();return}if(!t.dataset.import||!t.files?.[0])return;try{let file=t.files[0];if(t.dataset.import==='backup'){if(file.size>15e6)throw Error('File JSON quá lớn.');let x=JSON.parse(await file.text());if(!validBackup(x))throw Error('Bản sao lưu không đúng cấu trúc hoặc phiên bản.');if(confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?')){db=x;clearDraft();page='dashboard';save()}}else await importPlans(file)}catch(err){alert(err.message)}finally{t.value=''}});
window.addEventListener('beforeunload',e=>{if(draft){e.preventDefault();e.returnValue=''}});
try{let old=JSON.parse(sessionStorage.getItem(KEY+'-draft')||'null');if(old&&Array.isArray(old.history)){draft=old;page='edit'}}catch{}
render();
</script></body></html>
