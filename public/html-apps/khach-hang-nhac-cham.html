function guidePage(){return hero('❔ Hướng dẫn','Quy trình bán hàng trước khi chốt đơn.')+'<section class="card"><h2>4 bước</h2><ol><li>Thêm khách tiềm năng: nguồn, người phụ trách, giai đoạn, giá trị dự kiến và ngày hẹn.</li><li>Ghi từng lần liên hệ trong Nhật ký; có thể nhập ngày hẹn mới để cập nhật trực tiếp cho khách.</li><li>Mở Nhắc việc mỗi sáng để xử lý trễ hẹn, hẹn hôm nay, sắp đến hẹn và khách lâu chưa liên hệ.</li><li>Khi khách đồng ý, chuyển giai đoạn sang “Chốt đơn”; không mua thì “Mất khách”. Xem báo cáo theo nguồn và nhân viên.</li></ol></section><section class="card"><h2>Cách tính và giới hạn</h2><p>Liên hệ gần nhất lấy ngày lớn nhất trong nhật ký. Nếu chưa có nhật ký, lấy ngày nhập khách. Khách đang mở có ngày hẹn trước ngày xem là trễ; cùng ngày là hẹn hôm nay; trong ngưỡng là sắp đến hẹn. Chỉ khi không có ngày hẹn mới xét “lâu chưa liên hệ”.</p><p>Giá trị kỳ vọng = giá trị dự kiến × xác suất giai đoạn. Đây là ước lượng nội bộ, không phải doanh thu đã nhận. “Chốt đơn” và “Mất khách” là hai giai đoạn kết thúc.</p><p class="notice warn">App không tự gửi Zalo, SMS hoặc email. Trước khi liên hệ tiếp thị, hãy kiểm tra quyền liên hệ và nhu cầu của khách.</p></section>'}
function render(){let names={dashboard:'Tổng quan',reminders:'Nhắc việc',customers:'Khách hàng',logs:'Nhật ký liên hệ',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=({dashboard,reminders:remindersPage,customers:customersPage,logs:logsPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage})[page]()}
function field(k,label,type,v='',opts=''){return '<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(v||'')+'</textarea>':'<input id="f_'+k+'" type="'+type+'" '+(type==='number'?'step="1" min="0"':'')+' value="'+esc(v??'')+'">')+'</div>'}
function option(v,label,selected){return '<option value="'+esc(v)+'" '+(String(v)===String(selected)?'selected':'')+'>'+esc(label)+'</option>'}
function nextCode(){let n=Math.max(0,...db.customers.map(c=>/^KH\d+$/.test(c.code)?Number(c.code.slice(2)):0));return 'KH'+String(n+1).padStart(3,'0')}
function openModal(type,id='',preset=''){let old=type==='customer'?customer(id):type==='log'?db.logs.find(l=>l.id===id):null;old=old||{};modal={type,id};$('#modalTitle').textContent=type==='detail'?'Hồ sơ khách hàng':(id?'Sửa ':'Thêm ')+(type==='customer'?'khách hàng':'lần liên hệ');let html='';if(type==='customer'){let selections=(items,selected)=>'<option value="">Chọn...</option>'+items.map(x=>option(x,x,selected)).join('');html=field('code','Mã KH','text',old.code||nextCode())+field('name','Tên khách / công ty','text',old.name||'')+field('phone','Điện thoại / Zalo','text',old.phone||'')+field('source','Nguồn khách','select','',selections(db.settings.sources,old.source||db.settings.sources[0]))+field('owner','Phụ trách','select','',selections(db.settings.owners,old.owner||db.settings.owners[0]))+field('stage','Giai đoạn','select','',selections(db.settings.stages.map(s=>s.name),old.stage||db.settings.stages[0]?.name))+field('created','Ngày nhập','date',old.created||today())+field('value','Giá trị dự kiến (đ)','number',old.value??0)+field('follow','Hẹn liên hệ lại','date',old.follow||'')+field('note','Ghi chú','textarea',old.note||'');if(id)html+='<div class="wide"><button class="btn danger small" data-action="deleteCustomer">Xóa khách này</button></div>'}if(type==='log'){let options='<option value="">Chọn khách hàng</option>'+db.customers.map(c=>option(c.id,c.code+' · '+c.name,old.customerId||preset)).join('');html=field('customerId','Khách hàng','select','',options)+field('date','Ngày liên hệ','date',old.date||today())+field('way','Hình thức','select','',db.settings.ways.map(w=>option(w,w,old.way||db.settings.ways[0])).join(''))+field('content','Nội dung trao đổi','textarea',old.content||'')+field('result','Kết quả / việc tiếp theo','textarea',old.result||'')+field('nextDate','Hẹn lại ngày (nếu có)','date',old.nextDate||'');if(id)html+='<div class="wide"><button class="btn danger small" data-action="deleteLog">Xóa lần liên hệ</button></div>';else html+='<p class="wide notice">Nếu nhập “Hẹn lại ngày”, app sẽ cập nhật lịch hẹn trên hồ sơ khách.</p>'}if(type==='detail'){let c=customer(id),s=state(c),logs=db.logs.filter(l=>l.customerId===id).sort((a,b)=>b.date.localeCompare(a.date));html='<div class="wide"><dl class="detail-list"><dt>Mã khách</dt><dd>'+esc(c.code)+'</dd><dt>Tên khách</dt><dd>'+esc(c.name)+'</dd><dt>Điện thoại</dt><dd>'+esc(c.phone||'—')+'</dd><dt>Nguồn / phụ trách</dt><dd>'+esc(c.source||'—')+' / '+esc(c.owner||'—')+'</dd><dt>Giai đoạn</dt><dd>'+esc(c.stage)+' · '+s.prob+'%</dd><dt>Giá trị dự kiến</dt><dd>'+money(c.value)+'</dd><dt>Giá trị kỳ vọng</dt><dd>'+money(s.expected)+'</dd><dt>Hẹn lại</dt><dd>'+date(c.follow)+'</dd><dt>Trạng thái</dt><dd>'+esc(s.label)+'</dd><dt>Ghi chú</dt><dd>'+esc(c.note||'—')+'</dd></dl><p class="toolbar"><button class="btn primary" data-new="log" data-customer="'+esc(c.id)+'">+ Ghi liên hệ</button><button class="btn" data-edit="customer" data-id="'+esc(c.id)+'">Sửa khách</button></p><h3>Nhật ký gần đây</h3>'+(logs.length?logs.map(l=>'<div class="check"><span><b>'+date(l.date)+' · '+esc(l.way)+'</b><small>'+esc(l.content)+' → '+esc(l.result)+'</small></span></div>').join(''):emptyBox('Chưa có lần liên hệ.'))+'</div>'}$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('[data-action="saveModal"]').style.display=type==='detail'?'none':'';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close();$('[data-action="saveModal"]').style.display=''}
const v=k=>$('#f_'+k)?.value.trim()||'';
function saveModal(){if(!modal||modal.type==='detail')return;let{type,id}=modal,x={},error='';if(type==='customer'){x={code:v('code'),name:v('name'),phone:v('phone'),source:v('source'),owner:v('owner'),stage:v('stage'),created:v('created'),value:amount(v('value')),follow:v('follow'),note:v('note')};if(!x.code||/\s/.test(x.code)||!x.name)error='Cần mã không có dấu cách và tên khách.';else if(db.customers.some(c=>c.id!==id&&c.code.toLowerCase()===x.code.toLowerCase()))error='Mã khách đã tồn tại.';else if(!validDate(x.created)||x.follow&&!validDate(x.follow))error='Ngày nhập hoặc ngày hẹn không hợp lệ.';else if(!validMoney(x.value))error='Giá trị dự kiến phải là số nguyên không âm.';else if(!db.settings.stages.some(s=>s.name===x.stage))error='Giai đoạn không hợp lệ.'}if(type==='log'){x={customerId:v('customerId'),date:v('date'),way:v('way'),content:v('content'),result:v('result'),nextDate:v('nextDate')};if(!customer(x.customerId)||!validDate(x.date)||x.nextDate&&!validDate(x.nextDate))error='Cần khách, ngày liên hệ và ngày hẹn hợp lệ.';else if(!x.content&&!x.result)error='Cần nội dung hoặc kết quả liên hệ.';else if(!x.way)error='Cần hình thức liên hệ.'}if(error){$('#modalError').textContent=error;return}let list=type==='customer'?db.customers:db.logs;if(id)Object.assign(list.find(z=>z.id===id),x);else list.push({id:uid(),...x});if(type==='log'&&x.nextDate)customer(x.customerId).follow=x.nextDate;closeModal();save()}
function sampleData(){let d=empty(),delta=days(today(),SOURCE.anchor),shift=s=>s?addDays(s,delta):'';for(let [j,row] of SOURCE.customers.entries()){let [name,source,owner,stage,created,value,follow,note]=row;d.customers.push({id:'sample-c-'+j,code:'KH'+String(j+1).padStart(3,'0'),name,phone:'0900 000 '+String(j+1).padStart(3,'0'),source,owner,stage,created:shift(created),value,follow:shift(follow),note})}for(let [j,row] of SOURCE.logs.entries()){let [code,date,way,content,result]=row,c=d.customers.find(c=>c.code===code);d.logs.push({id:'sample-l-'+j,customerId:c.id,date:shift(date),way,content,result,nextDate:''})}return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('khach-hang-nhac-cham-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Mã KH','Tên khách','Điện thoại','Nguồn','Phụ trách','Giai đoạn','Ngày nhập','Giá trị dự kiến','Hẹn liên hệ lại','Ghi chú','Trạng thái','Xác suất %','Giá trị kỳ vọng']];for(let c of db.customers){let s=state(c);rows.push([c.code,c.name,c.phone,c.source,c.owner,c.stage,c.created,c.value,c.follow,c.note,s.label,s.prob,s.expected])}let text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('khach-hang-nhac-cham.csv',text,'text/csv;charset=utf-8')}
function excelExport(){let cRows=[['Mã KH','Tên khách','Điện thoại','Nguồn','Phụ trách','Giai đoạn','Ngày nhập','Giá trị','Hẹn liên hệ lại','Ghi chú'],...db.customers.map(c=>[c.code,c.name,c.phone,c.source,c.owner,c.stage,c.created,c.value,c.follow,c.note])],lRows=[['Mã KH','Ngày liên hệ','Hình thức','Nội dung','Kết quả','Hẹn lại ngày'],...db.logs.map(l=>[customer(l.customerId)?.code||'',l.date,l.way,l.content,l.result,l.nextDate])],reportRows=[['Giai đoạn','Số khách','Giá trị','Đã chốt'],...grouped('stage',db.settings.stages.map(s=>s.name)).map(x=>[x.name,x.count,x.value,x.won])];let blob=Excel.workbook([{name:'Khach hang',rows:cRows},{name:'Nhat ky',rows:lRows},{name:'Theo giai doan',rows:reportRows}]),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='khach-hang-nhac-cham.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');if(validDate(x))return x}return ''}
function sheetData(rows,header){let i=rows.findIndex(r=>String(r?.[0]??'').trim().toLocaleLowerCase('vi')===header.toLocaleLowerCase('vi'));return i<0?[]:rows.slice(i+1)}
function parsedExcel(sheets){let cRows=sheets['Khach hang']||sheets['Khách hàng']||sheets['Danh sách khách hàng']||[],lRows=sheets['Nhat ky']||sheets['Nhật ký']||sheets['Nhật ký chăm sóc']||[];let customerData=sheetData(cRows,'Mã KH'),logData=sheetData(lRows,'Mã KH');if(!customerData.length)throw Error('Không thấy sheet khách hàng hoặc bảng chưa có khách.');let d=empty(),codes=new Set();for(let [j,r] of customerData.entries()){if(!String(r[0]??'').trim()&&!String(r[1]??'').trim())continue;let code=String(r[0]??'').trim(),name=String(r[1]??'').trim(),stage=String(r[5]??'Mới').trim(),created=parseDate(r[6]),value=amount(r[7]||0),follow=r[8]?parseDate(r[8]):'';if(!code||!name||!created||!validMoney(value)||r[8]&&!follow||!d.settings.stages.some(s=>s.name===stage)||codes.has(code.toLowerCase()))throw Error('Khách hàng dòng '+(j+2)+' thiếu hoặc sai mã/tên/giai đoạn/ngày/giá trị.');codes.add(code.toLowerCase());d.customers.push({id:uid(),code,name,phone:String(r[2]??'').trim(),source:String(r[3]??'').trim(),owner:String(r[4]??'').trim(),stage,created,value,follow,note:String(r[9]??'').trim()})}for(let [j,r] of logData.entries()){if(!String(r[0]??'').trim()&&!String(r[1]??'').trim())continue;let c=d.customers.find(c=>c.code===String(r[0]??'').trim()),date=parseDate(r[1]),nextDate=r[5]?parseDate(r[5]):'';if(!c||!date||r[5]&&!nextDate)throw Error('Nhật ký dòng '+(j+2)+' sai mã khách hoặc ngày.');d.logs.push({id:uid(),customerId:c.id,date,way:String(r[2]??'').trim()||'Gọi điện',content:String(r[3]??'').trim(),result:String(r[4]??'').trim(),nextDate})}if(!validBackup(d))throw Error('Dữ liệu Excel không hợp lệ sau khi chuyển đổi.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let candidate=parsedExcel(await Excel.read(file));if(!confirm('Nhập '+candidate.customers.length+' khách và '+candidate.logs.length+' lần liên hệ sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Hãy sao lưu JSON trước. Tiếp tục?'))return;db=candidate;save()}
function listLines(id){let vals=$('#'+id).value.split('\n').map(s=>s.trim()).filter(Boolean);if(!vals.length||vals.length>100||new Set(vals.map(s=>s.toLocaleLowerCase('vi'))).size!==vals.length)throw Error('Danh sách phải có 1–100 mục, không trùng tên.');return vals}
function saveStages(){try{let lines=$('#stages').value.split('\n').map(s=>s.trim()).filter(Boolean),stages=lines.map(line=>{let p=line.split('|'),name=p[0]?.trim(),prob=Number(p[1]);if(!name||p.length!==2||!Number.isSafeInteger(prob)||prob<0||prob>100)throw Error('Mỗi dòng cần Tên giai đoạn|xác suất 0–100.');return{name,prob}});if(!terminal.every(t=>stages.some(s=>s.name===t)))throw Error('Phải giữ Chốt đơn và Mất khách.');if(new Set(stages.map(s=>s.name.toLocaleLowerCase('vi'))).size!==stages.length)throw Error('Tên giai đoạn bị trùng.');for(let c of db.customers)if(!stages.some(s=>s.name===c.stage))throw Error('Giai đoạn '+c.stage+' đang được khách sử dụng.');db.settings.stages=stages;save()}catch(e){alert(e.message)}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-detail],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){if($('#editor').open)closeModal();openModal(b.dataset.new,'',b.dataset.customer||'');return}if(b.dataset.edit){if($('#editor').open)closeModal();openModal(b.dataset.edit,b.dataset.id);return}if(b.dataset.detail){if($('#editor').open)closeModal();openModal('detail',b.dataset.detail);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('khach-hang-nhac-cham-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.customers.length||db.logs.length){if(!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();save()}if(a==='clear'){if(confirm('Xóa toàn bộ khách, nhật ký và cài đặt trên trình duyệt này?')){db=empty();save()}}if(a==='deleteCustomer'){if(db.logs.some(l=>l.customerId===modal.id)){alert('Khách còn nhật ký liên hệ. Hãy xử lý nhật ký trước khi xóa khách.');return}if(confirm('Xóa khách này?')){db.customers=db.customers.filter(c=>c.id!==modal.id);closeModal();save()}}if(a==='deleteLog'){if(confirm('Xóa lần liên hệ này?')){db.logs=db.logs.filter(l=>l.id!==modal.id);closeModal();save()}}if(a==='settings'){let as=v('asof'),stale=Number(v('stale')),soon=Number(v('soon'));if(as&&!validDate(as)||!Number.isSafeInteger(stale)||stale<1||stale>3650||!Number.isSafeInteger(soon)||soon<0||soon>3650){alert('Ngày hoặc số ngày nhắc không hợp lệ.');return}Object.assign(db.settings,{company:v('company'),asof:as,stale,soon});save()}if(a==='saveStages')saveStages();if(a==='saveList'){try{let k=b.dataset.key;if(!['sources','owners','ways'].includes(k))throw Error('Danh sách không hợp lệ.');let vals=listLines(k);let used=db.customers.some(c=>k==='sources'&&c.source&&!vals.includes(c.source)||k==='owners'&&c.owner&&!vals.includes(c.owner))||k==='ways'&&db.logs.some(l=>l.way&&!vals.includes(l.way));if(used)throw Error('Có mục đang được sử dụng. Hãy giữ mục đó hoặc sửa bản ghi trước.');db.settings[k]=vals;save()}catch(e){alert(e.message)}}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='ownerFilter'){db.settings.ownerFilter=e.target.value;save()}if(e.target.id==='asof'){db.settings.asof=e.target.value===today()?'':e.target.value;if(db.settings.asof&&!validDate(db.settings.asof)){alert('Ngày xem không hợp lệ.');return}save()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let x=JSON.parse(await file.text());if(!validBackup(x))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=x;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
