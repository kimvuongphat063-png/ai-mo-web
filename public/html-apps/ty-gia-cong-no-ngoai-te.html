const NAV=[['overview','◈ Tổng quan'],['debts','▤ Công nợ'],['settlements','↗ Thanh toán'],['report','▥ Báo cáo'],['settings','⚙ Tỷ giá'],['data','⇩ Dữ liệu'],['guide','? Hướng dẫn']];
function nav(){let html=NAV.map(([k,l])=>`<button data-page="${k}" class="${page===k?'on':''}">${l}</button>`).join('');$('#nav').innerHTML=html;$('#mobile').innerHTML=html}function head(title,sub='',buttons=''){return`<div class="sectionhead"><div><div class="eyebrow">AI MỞ / ${esc(title)}</div><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div><div class="actions">${buttons}</div></div>`}
function overview(){let s=stats(),by=['USD','EUR','JPY'].map(c=>({c,v:db.debts.filter(x=>x.currency===c).reduce((a,x)=>a+Math.abs(difference(x)),0)})),max=Math.max(1,...by.map(x=>x.v));return`<div class="hero"><div><div class="eyebrow">BÀN ĐỐI CHIẾU NGOẠI TỆ</div><h1>Mỗi tỷ giá một thời điểm.<br>Mỗi khoản nợ một dấu vết.</h1><p>Ghi số dư và tỷ giá ghi sổ, sau đó nhập tỷ giá cuối kỳ để xem chênh lệch. Thanh toán từng phần được theo dõi riêng.</p><div class="actions"><button class="btn primary" data-act="addDebt">+ Ghi công nợ</button><button class="btn" data-page="settings">Cập nhật tỷ giá ↗</button></div></div><div class="hero-stat"><span>CHÊNH LỆCH ĐÁNH GIÁ LẠI THUẦN</span><b>${money(s.unrealized)}</b><span>${s.count} khoản còn số dư · ngày ${esc(db.settings.asof)}</span></div></div>${db.debts.some(x=>x.sourceRow)?'<div class="notice">Đang xem dữ liệu mẫu từ file tham chiếu. Vào Dữ liệu để bắt đầu bộ dữ liệu riêng. Tỷ giá mẫu chỉ dùng để thử.</div>':''}<div class="cards"><div class="card accent"><span>Phải thu ghi sổ</span><strong>${money(s.receivable)}</strong><small>Số dư còn mở</small></div><div class="card"><span>Phải trả ghi sổ</span><strong>${money(s.payable)}</strong><small>Số dư còn mở</small></div><div class="card warn"><span>Chênh lệch chưa thực hiện</span><strong>${money(s.unrealized)}</strong><small>Lãi + / lỗ −</small></div><div class="card"><span>Chênh lệch đã thực hiện</span><strong>${money(s.realized)}</strong><small>Từ thanh toán đã ghi</small></div></div><div class="sectionhead"><h2>Phân tích cuối kỳ</h2></div><div class="grid2"><div class="panel"><h3>Độ lệch theo ngoại tệ</h3>${by.map(x=>`<div class="barrow"><b>${x.c}</b><div class="bar"><i style="width:${x.v/max*100}%"></i></div><span>${money(x.v)}</span></div>`).join('')}</div><div class="panel"><h3>Tỷ giá đang dùng</h3>${['USD','EUR','JPY'].map(c=>`<div class="barrow"><b>${c}</b><span class="muted">Quy đổi sang VND</span><strong>${fmt(db.settings.rates[c])}</strong></div>`).join('')}<p class="help">Chọn tỷ giá theo chính sách và chứng từ của đơn vị. App không tự lấy tỷ giá mạng.</p></div></div>${head('Khoản cần xem','Chênh lệch tuyệt đối lớn nhất')}<div class="tablewrap">${debtTable(db.debts.filter(x=>remaining(x)>0).sort((a,b)=>Math.abs(difference(b))-Math.abs(difference(a))).slice(0,5))}</div>`}
function debtTable(rows){if(!rows.length)return'<div class="empty">Chưa có khoản công nợ phù hợp.</div>';return`<table><thead><tr><th>Mã / Đối tượng</th><th>Loại</th><th>Tiền tệ</th><th class="num">Số dư</th><th class="num">Tỷ giá sổ</th><th class="num">Giá trị sổ</th><th class="num">Đánh giá lại</th><th class="num">Lãi (+) / lỗ (−)</th><th>Thao tác</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.code)}</b><br>${esc(x.partner)}</td><td><span class="status ${x.type==='Phải trả'?'pay':''}">${esc(x.type)}</span></td><td>${x.currency}</td><td class="num">${fmt(remaining(x))}</td><td class="num">${fmt(x.bookRate)}</td><td class="num">${money(book(x))}</td><td class="num">${money(revalued(x))}</td><td class="num ${difference(x)<0?'bad':'good'}">${money(difference(x))}</td><td><div class="rowactions"><button data-act="detail" data-id="${x.id}">Xem</button>${remaining(x)>0?`<button data-act="pay" data-id="${x.id}">Trả/thu</button>`:''}</div></td></tr>`).join('')}</tbody></table>`}
function debts(){let rows=db.debts.filter(x=>(x.code+' '+x.partner+' '+x.currency).toLowerCase().includes(search.toLowerCase()));return`${head('Công nợ ngoại tệ','Tỷ giá ghi sổ giữ cố định theo khoản.','<button class="btn primary" data-act="addDebt">+ Ghi công nợ</button>')}<div class="filters"><input id="search" placeholder="Tìm mã, đối tượng, ngoại tệ" value="${esc(search)}"><button class="btn" data-act="clearSearch">Xóa tìm</button></div><div style="height:12px"></div><div class="tablewrap">${debtTable(rows)}</div>`}
function settlements(){let rows=db.settlements.slice().reverse();return`${head('Thanh toán','Ghi từng lần thu/trả; tỷ giá lúc thanh toán được giữ cố định.','<button class="btn primary" data-act="pay">+ Thu / trả</button>')}<div class="tablewrap">${rows.length?`<table><thead><tr><th>Ngày</th><th>Mã khoản</th><th>Đối tượng</th><th class="num">Ngoại tệ</th><th class="num">Tỷ giá thanh toán</th><th class="num">VND thực tế</th><th class="num">Lãi (+) / lỗ (−)</th><th>Tham chiếu</th></tr></thead><tbody>${rows.map(s=>{let x=db.debts.find(x=>x.id===s.debtId),diff=realized(s)*(x.type==='Phải thu'?1:-1);return`<tr><td>${esc(s.date)}</td><td>${esc(x.code)}</td><td>${esc(x.partner)}</td><td class="num">${fmt(s.amount)} ${x.currency}</td><td class="num">${fmt(s.rate)}</td><td class="num">${money(s.amount*s.rate)}</td><td class="num ${diff<0?'bad':'good'}">${money(diff)}</td><td>${esc(s.reference)}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Chưa có lần thu/trả. Số liệu mẫu chỉ chứa công nợ mở.</div>'}</div><p class="help">Luồng thanh toán là phần bổ sung của AI Mở. Kết quả chênh lệch là ước tính quản trị, chưa thay bút toán kế toán.</p>`}
function report(){let s=stats();return`${head('Báo cáo cuối kỳ','Tổng hợp số dư mở và chênh lệch, theo ngoại tệ và loại công nợ.','<button class="btn" data-act="print">In báo cáo</button><button class="btn primary" data-act="excel">Xuất Excel</button>')}<div class="cards"><div class="card"><span>Số khoản còn mở</span><strong>${s.count}</strong></div><div class="card"><span>Tổng ghi sổ</span><strong>${money(s.receivable+s.payable)}</strong></div><div class="card"><span>Giá trị đánh giá lại</span><strong>${money(db.debts.reduce((a,x)=>a+revalued(x),0))}</strong></div><div class="card accent"><span>Chênh lệch thuần</span><strong>${money(s.unrealized)}</strong></div></div>${head('Theo ngoại tệ')}<div class="tablewrap"><table><thead><tr><th>Ngoại tệ</th><th class="num">Số khoản</th><th class="num">Giá trị sổ</th><th class="num">Đánh giá lại</th><th class="num">Chênh lệch thuần</th></tr></thead><tbody>${['USD','EUR','JPY'].map(c=>{let a=db.debts.filter(x=>x.currency===c&&remaining(x)>0);return`<tr><td><b>${c}</b></td><td class="num">${a.length}</td><td class="num">${money(a.reduce((n,x)=>n+book(x),0))}</td><td class="num">${money(a.reduce((n,x)=>n+revalued(x),0))}</td><td class="num">${money(a.reduce((n,x)=>n+difference(x),0))}</td></tr>`}).join('')}</tbody></table></div>${head('Theo loại công nợ')}<div class="tablewrap"><table><thead><tr><th>Loại</th><th class="num">Số khoản</th><th class="num">Giá trị ghi sổ</th><th class="num">Chênh lệch</th></tr></thead><tbody>${['Phải thu','Phải trả'].map(t=>{let a=db.debts.filter(x=>x.type===t&&remaining(x)>0);return`<tr><td>${t}</td><td class="num">${a.length}</td><td class="num">${money(a.reduce((n,x)=>n+book(x),0))}</td><td class="num">${money(a.reduce((n,x)=>n+difference(x),0))}</td></tr>`}).join('')}</tbody></table></div><div class="notice">Tỷ giá cuối kỳ trong dữ liệu mẫu là minh họa. Hãy đối chiếu nguồn tỷ giá và chính sách ghi nhận của đơn vị trước khi lập bút toán hoặc báo cáo.</div>`}
function settings(){return`${head('Tỷ giá & kỳ báo cáo','Nhập tỷ giá áp dụng cho kỳ hiện tại. Thay đổi không sửa tỷ giá ghi sổ hoặc tỷ giá thanh toán đã lưu.')}<div class="panel"><form id="settingsForm" class="formgrid"><div class="field wide"><label>Tên đơn vị</label><input name="company" value="${esc(db.settings.company)}" maxlength="100"></div><div class="field"><label>Ngày đánh giá lại</label><input name="asof" type="date" required value="${esc(db.settings.asof)}"></div>${['USD','EUR','JPY'].map(c=>`<div class="field"><label>${c}/VND cuối kỳ</label><input name="${c}" type="number" min="0.000001" step="any" required value="${db.settings.rates[c]}"></div>`).join('')}<div class="field wide"><button class="btn primary" type="submit">Lưu tỷ giá kỳ này</button></div></form></div><div class="notice">Ứng dụng không tự lấy dữ liệu trực tuyến. Tỷ giá mẫu USD 25.400, EUR 29.700, JPY 172 không phải tỷ giá áp dụng mặc định cho đơn vị của anh.</div>`}
function dataPage(){return`${head('Dữ liệu & sao lưu','Dữ liệu trình duyệt không tự đi theo file HTML gốc.')}<div class="grid2"><div class="panel"><h3>Sao lưu và chuyển máy</h3><p class="help">JSON để nhập lại dữ liệu; HTML kèm dữ liệu để mở trực tiếp trên máy khác.</p><div class="actions"><button class="btn primary" data-act="json">Tải JSON</button><button class="btn" data-act="html">Tải HTML kèm dữ liệu</button><button class="btn" data-act="import">Nhập JSON</button><button class="btn" data-act="excel">Xuất Excel</button></div></div><div class="panel"><h3>Bắt đầu bộ mới</h3><p class="help">Sao lưu trước khi thay dữ liệu đang dùng.</p><div class="actions"><button class="btn" data-act="sample">Nạp dữ liệu mẫu</button><button class="btn danger" data-act="clear">Xóa và bắt đầu mới</button></div></div></div><div class="sectionhead"><h2>Nhật ký thao tác</h2></div><div class="panel">${db.audit.length?db.audit.slice(0,50).map(a=>`<p><b>${esc(a.action)}</b> · ${esc(a.detail)} <span class="muted">${esc(a.at.slice(0,16).replace('T',' '))}</span></p>`).join(''):'<div class="empty">Chưa có thao tác trên bộ dữ liệu này.</div>'}</div>`}
function guide(){return`${head('Hướng dẫn sử dụng')}<div class="grid2"><div class="panel"><h3>Quy trình 4 bước</h3><ol><li>Ghi từng khoản công nợ với loại, tiền tệ, số dư và tỷ giá ghi sổ.</li><li>Nhập tỷ giá cuối kỳ tại mục Tỷ giá.</li><li>Xem chênh lệch từng khoản và báo cáo theo ngoại tệ.</li><li>Ghi thu/trả từng phần nếu có, rồi sao lưu dữ liệu.</li></ol></div><div class="panel"><h3>Cách tính</h3><p>Ghi sổ = số dư còn lại × tỷ giá ghi sổ. Đánh giá lại = số dư còn lại × tỷ giá cuối kỳ. Phải thu tăng giá trị là lãi; phải trả tăng giá trị là lỗ.</p><p>Chênh lệch khi thanh toán dùng tỷ giá thanh toán so với tỷ giá ghi sổ đã chụp trên khoản.</p></div></div><div class="notice">Mẫu gốc có 6 khoản công nợ mở. Phần thu/trả từng lần và nhật ký do AI Mở bổ sung. Số tính ra phục vụ đối chiếu nội bộ, cần được người phụ trách kế toán kiểm tra.</div>`}
function detail(id){let x=db.debts.find(x=>x.id===id);if(!x)return debts();return`${head('Chi tiết khoản '+x.code,`${x.partner} · ${x.type} · ${x.currency}`,'<button class="btn" data-page="debts">← Trở lại</button>')}<div class="detail"><div><span>Số dư ban đầu</span><strong>${fmt(x.original)} ${x.currency}</strong></div><div><span>Đã thu/trả</span><strong>${fmt(used(x))} ${x.currency}</strong></div><div><span>Số dư còn mở</span><strong>${fmt(remaining(x))} ${x.currency}</strong></div><div><span>Tỷ giá ghi sổ</span><strong>${fmt(x.bookRate)}</strong></div><div><span>Tỷ giá cuối kỳ</span><strong>${fmt(rate(x))}</strong></div><div><span>Chênh lệch</span><strong>${money(difference(x))}</strong></div></div><div class="actions">${remaining(x)>0?`<button class="btn primary" data-act="pay" data-id="${x.id}">+ Thu / trả khoản này</button>`:''}</div><div class="panel" style="margin-top:18px"><h3>Thông tin</h3><p>Mã: ${esc(x.code)} · Ngày: ${esc(x.date)} · ${esc(x.note)}</p><p>Giá trị ghi sổ ${money(book(x))}; đánh giá lại ${money(revalued(x))}.</p></div>`}
function render(){nav();$('#saveState').textContent='Đã lưu trên thiết bị';$('#screen').innerHTML=({overview,debts,settlements,report,settings,data:dataPage,guide,detail:()=>detail(selected)}[page]||overview)()}
function field(label,name,type,value='',extra=''){return`<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function pick(label,name,options,value=''){return`<div class="field"><label>${label}</label><select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function modal(kind,id=''){draft={kind,id};$('#formError').textContent='';if(kind==='debt'){$('#modalTitle').textContent='Ghi khoản công nợ';$('#fields').innerHTML=field('Mã khoản *','code','text','NT-'+String(db.debts.length+1).padStart(3,'0'),'required maxlength="30"')+field('Đối tượng *','partner','text','','required maxlength="100"')+pick('Loại công nợ','type',[['Phải thu','Phải thu'],['Phải trả','Phải trả']])+pick('Ngoại tệ','currency',['USD','EUR','JPY'].map(c=>[c,c]))+field('Số dư ngoại tệ *','original','number','','required min="0.000001" step="any"')+field('Tỷ giá ghi sổ *','bookRate','number','','required min="0.000001" step="any"')+field('Ngày ghi','date','date',today(),'required')+field('Ghi chú','note','text','','maxlength="300"')}else{$('#modalTitle').textContent='Ghi lần thu / trả';let a=db.debts.filter(x=>remaining(x)>0);$('#fields').innerHTML=pick('Khoản công nợ *','debtId',a.map(x=>[x.id,x.code+' · '+x.partner+' · còn '+fmt(remaining(x))+' '+x.currency]),id)+field('Ngày thanh toán *','date','date',today(),'required')+field('Số ngoại tệ *','amount','number','','required min="0.000001" step="any"')+field('Tỷ giá thực tế *','rate','number',id?rate(db.debts.find(x=>x.id===id)):'','required min="0.000001" step="any"')+field('Tham chiếu','reference','text','','maxlength="100"')}$('#editor').showModal()}
const value=(f,k)=>String(new FormData(f).get(k)||'').trim();function submit(e){e.preventDefault();let f=e.target,k=draft.kind,before=JSON.stringify(db);try{if(k==='debt'){let x={id:uid(),code:value(f,'code'),partner:value(f,'partner'),type:value(f,'type'),currency:value(f,'currency'),original:Number(value(f,'original')),bookRate:Number(value(f,'bookRate')),date:value(f,'date'),note:value(f,'note'),sourceRow:null};if(db.debts.some(t=>t.code.toUpperCase()===x.code.toUpperCase()))throw Error('Mã khoản đã tồn tại.');db.debts.push(x);audit('Ghi công nợ',x.code);page='debts'}else{let x=db.debts.find(x=>x.id===value(f,'debtId'));let s={id:uid(),debtId:x?.id,date:value(f,'date'),amount:Number(value(f,'amount')),rate:Number(value(f,'rate')),reference:value(f,'reference')};if(!x||!Number.isFinite(s.amount)||s.amount<=0||s.amount>remaining(x)+1e-8)throw Error('Số thu/trả phải lớn hơn 0 và không vượt số dư.');db.settlements.push(s);audit('Thu/trả',x.code+' · '+fmt(s.amount)+' '+x.currency);selected=x.id;page='detail'}let err=validate(db);if(err)throw Error(err);save();$('#editor').close()}catch(ex){db=JSON.parse(before);$('#formError').textContent=ex.message}}
function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function htmlBackup(){let s=JSON.stringify(db),b=btoa(unescape(encodeURIComponent(s))),html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+b+'$2');download('ty-gia-cong-no-kem-du-lieu.html','<!doctype html>'+html,'text/html;charset=utf-8')}
function sheets(){return[{name:'CongNo',rows:[['Mã','Đối tượng','Loại','Ngoại tệ','Số dư gốc','Đã thu/trả','Còn lại','Tỷ giá sổ','Tỷ giá cuối kỳ','Giá trị sổ','Đánh giá lại','Chênh lệch'],...db.debts.map(x=>[x.code,x.partner,x.type,x.currency,x.original,used(x),remaining(x),x.bookRate,rate(x),book(x),revalued(x),difference(x)])]},{name:'ThanhToan',rows:[['Ngày','Mã khoản','Ngoại tệ','Số tiền','Tỷ giá','VND thực tế','Chênh lệch'],...db.settlements.map(s=>{let x=db.debts.find(x=>x.id===s.debtId);return[s.date,x.code,x.currency,s.amount,s.rate,Math.round(s.amount*s.rate),realized(s)*(x.type==='Phải thu'?1:-1)]})]}]}
function action(k,id=''){if(NAV.some(x=>x[0]===k)){page=k;search='';render();return}if(k==='addDebt')return modal('debt');if(k==='pay')return modal('settlement',id);if(k==='detail'){selected=id;page='detail';render();return}if(k==='clearSearch'){search='';render();return}if(k==='print')return window.print();if(k==='json')return download('ty-gia-cong-no.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(k==='html')return htmlBackup();if(k==='import')return $('#importFile').click();if(k==='excel')return download('ty-gia-cong-no.xlsx',Excel.workbook(sheets()),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');if(k==='sample'||k==='clear'){if(!confirm('Thao tác này thay toàn bộ dữ liệu hiện tại. Anh đã sao lưu chưa?'))return;db=k==='sample'?sample():fresh();page='overview';save();return}}
document.addEventListener('click',e=>{let x=e.target.closest('[data-act],[data-page]');if(x)action(x.dataset.act||x.dataset.page,x.dataset.id||'')});document.addEventListener('input',e=>{if(e.target.id==='search'){let n=e.target.selectionStart;search=e.target.value;render();let z=$('#search');z.focus();z.setSelectionRange(n,n)}});$('#form').addEventListener('submit',submit);$('#cancel').addEventListener('click',()=>$('#editor').close());document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();let f=e.target,r={};for(let c of ['USD','EUR','JPY'])r[c]=Number(value(f,c));let old=db.settings;db.settings={company:value(f,'company')||'Đơn vị của tôi',asof:value(f,'asof'),rates:r};let err=validate(db);if(err){db.settings=old;notice(err);return}audit('Cập nhật tỷ giá',db.settings.asof);save()});$('#importFile').addEventListener('change',async e=>{try{let d=JSON.parse(await e.target.files[0].text()),err=validate(d);if(err)throw Error(err);if(!confirm('Nhập JSON thay toàn bộ dữ liệu hiện tại?'))return;db=d;page='overview';save()}catch(ex){notice('Không nhập được: '+ex.message)}e.target.value=''});render();

</script></body></html>
