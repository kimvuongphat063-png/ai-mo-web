<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lịch nghĩa vụ thuế · AI Mở</title><style>:root{font-family:'Segoe UI',Arial,sans-serif;color:#29223a;background:#f8f5fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e94c40;outline-offset:2px}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}aside{background:#332048;color:white;padding:18px 14px;display:flex;flex-direction:column;gap:24px}.brand{font-size:21px;font-weight:800}.brand small{display:block;font-size:12px;font-weight:500;color:#d3c7df}nav{display:grid;gap:5px}.navbtn{border:0;background:none;color:#eee8f5;text-align:left;border-radius:10px;padding:11px 12px;font-weight:700}.navbtn.active{background:#f4dce2;color:#38223e}.railnote{margin-top:auto;color:#c8bacc;font-size:12px;line-height:1.5}main{min-width:0}.top{background:white;border-bottom:1px solid #e3dce8;padding:14px 24px;display:flex;justify-content:space-between;font-size:13px;font-weight:700}.top span:last-child{color:#756780}.content{padding:26px;max-width:1400px;margin:auto}.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:#9b3c4a}.hero{background:#392244;color:#fff;border-radius:24px;padding:30px 34px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:end}.hero h1{font-size:clamp(27px,3vw,42px);line-height:1.12;margin:12px 0;max-width:620px}.hero p{max-width:610px;color:#e9dfe8;line-height:1.5}.hero .big{background:#fbe5e2;color:#442537;padding:20px;border-radius:16px;font-size:28px;font-weight:800}.hero .big small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button{border:1px solid #ccc1d4;border-radius:10px;background:white;color:#342544;padding:10px 14 </style></head><body><div class="shell"><aside><div class="brand">◈ AI Mở<small>Lịch nghĩa vụ thuế</small></div><nav id="nav"></nav><p class="railnote">Bản HTML offline · dữ liệu lưu trên trình duyệt này. Hãy tải bản sao lưu khi chuyển máy.</p></aside><main><div class="top"><span id="pageTitle">Lịch nghĩa vụ thuế</span><span id="saveBadge">Đang tải</span></div><div id="mobileNav"></div><div id="view"></div></main></div><dialog id="formDialog"><form id="itemForm"><h2 id="formTitle"></h2><div id="formFields"></div><p id="formError" role="alert"></p><div class="actions"><button type="button" id="cancel">Hủy</button><button type="submit" class="primary">Lưu</button></div></form></dialog><input id="jsonFile" type="file" accept=".json" hidden><script id="embedded" type="application/json">e30=</script><script>const KEY='ai-mo-tax-calendar-v1',VERSION=1,$=s=>document.querySelector(s),fmt=n=>Math.round(n||0).toLocaleString('vi-VN')+' đ',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=()=>new Date().toISOString().slice(0,10), day=(s,n)=>{let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)},days=(a,b)=>Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000),validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s+'T12:00:00Z'));
const TYPES=['Thuế GTGT','Thuế TNDN tạm nộp','Thuế TNDN quyết toán','Thuế TNCN khấu trừ','Thuế nhà thầu','Lệ phí môn bài','Khác'];
let page='home',editId=null,filter='all',query='';
function fresh(){return{version:VERSION,settings:{asof:iso(),rate:.03,warnDays:7,company:'Đơn vị của tôi'},items:[],payments:[]}}
function sample(){let d=fresh(),rows=[['Thuế GTGT','Tháng trước',-12,85000000,85000000,-14],['Thuế TNCN khấu trừ','Tháng trước',-12,22000000,22000000,-9],['Thuế GTGT','Tháng này',18,70000000,0,null],['Thuế TNDN tạm nộp','Quý trước',-6,150000000,100000000,-5],['Thuế nhà thầu','Hợp đồng NT-03',-25,40000000,0,null],['Lệ phí môn bài','Năm nay',-300,3000000,3000000,-310],['Thuế TNDN quyết toán','Năm trước',25,210000000,0,null]];rows.forEach((r,i)=>{let id='T'+(i+1);d.items.push({id,type:r[0],period:r[1],due:day(d.settings.asof,r[2]),amount:r[3],note:'Mẫu nguồn · dòng '+(i+1)});if(r[4])d.payments.push({id:'P'+(i+1),itemId:id,date:day(d.settings.asof,r[5]),amount:r[4],note:'Đã nộp trong mẫu nguồn'})});return d}
function check(x){if(!x||x.version!==VERSION||!x.settings||!Array.isArray(x.items)||!Array.isArray(x.payments))return'Dữ liệu không đúng phiên bản.';let s=x.settings;if(!validDate(s.asof)||!Number.isFinite(s.rate)||s.rate<0||s.rate>100||!Number.isInteger(s.warnDays)||s.warnDays<0||s.warnDays>365)return'Cài đặt không hợp lệ.';let ids=new Set();for(let t of x.items){if(!t.id||ids.has(t.id)||!TYPES.includes(t.type)||!String(t.period||'').trim()||!validDate(t.due)||!Number.isFinite(t.amount)||t.amount<0)return'Nghĩa vụ thiếu hoặc sai dữ liệu.';ids.add(t.id)}ids.clear();for(let p of x.payments){if(!p.id||ids.has(p.id)||!x.items.some(t=>t.id===p.itemId)||!validDate(p.date)||!Number.isFinite(p.amount)||p.amount<=0)return'Lần nộp không hợp lệ.';ids.add(p.id)}return''}
function embedded(){try{return JSON.parse(decodeURIComponent(escape(atob($('#embedded').textContent))))}catch{return null}}
let db=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(!check(x))return x}catch{}let x=embedded();return x&&!check(x)?x:sample()})();
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
const paid=t=>db.payments.filter(p=>p.itemId===t.id).reduce((s,p)=>s+p.amount,0),remain=t=>Math.max(0,t.amount-paid(t));
function assessed(t){let now=db.settings.asof,left=remain(t),until=days(now,t.due),late=Math.max(0,until),paidLate=db.payments.filter(p=>p.itemId===t.id).reduce((s,p)=>s+Math.max(0,days(p.date,t.due))*p.amount*db.settings.rate/100,0),openLate=left*late*db.settings.rate/100,fee=Math.round(paidLate+openLate);return{left,until,late,fee,status:left===0?'Đã nộp':until>0?'Trễ hạn':until>=-db.settings.warnDays?'Sắp đến hạn':'Còn hạn'}}
const S=()=>{let a=db.items.map(t=>({t,...assessed(t)}));return{all:a.length,open:a.filter(x=>x.left>0).length,late:a.filter(x=>x.status==='Trễ hạn').length,soon:a.filter(x=>x.status==='Sắp đến hạn').length,due:a.reduce((s,x)=>s+x.left,0),fees:a.reduce((s,x)=>s+x.fee,0),paid:db.payments.reduce((s,p)=>s+p.amount,0)}};
const navs=[['home','◈ Tổng quan'],['calendar','▦ Lịch hạn nộp'],['items','▤ Nghĩa vụ'],['reports','▥ Báo cáo'],['settings','⚙ Thiết lập'],['data','↧ Dữ liệu'],['guide','? Hướng dẫn']];
function nav(){let h=navs.map(([k,t])=>`<button class="navbtn ${page===k?'active':''}" data-page="${k}">${t}</button>`).join('');$('#nav').innerHTML=h;$('#mobileNav').innerHTML=h}
function shell(title,body){$('#pageTitle').textContent=title;$('#view').innerHTML=`<div class="content">${body}</div>`;$('#saveBadge').textContent='Đã lưu trên thiết bị'}
function badge(x){return `<span class="pill ${x.status==='Trễ hạn'?'late':x.status==='Sắp đến hạn'?'soon':''}">${x.status}</span>`}
function home(){let s=S(),urg=db.items.map(t=>({t,...assessed(t)})).filter(x=>x.left>0).sort((a,b)=>a.until-b.until).slice(0,6);shell('Bảng điều hành',`<div class="hero"><div><div class="eyebrow" style="color:#ffc0b7">AI MỞ / LỊCH NGHĨA VỤ</div><h1>Thấy rõ hạn nộp.<br>Giữ rõ chứng từ.</h1><p>Ghi từng nghĩa vụ theo kỳ, theo dõi các lần nộp và xem khoản cần xử lý trước. Hạn trong mẫu chỉ để thử tính năng.</p><div class="actions"><button class="primary" data-act="add">+ Ghi nghĩa vụ</button><button data-page="calendar">Xem lịch hạn →</button></div></div><div class="big"><small>Còn phải nộp</small>${fmt(s.due)}</div></div><div class="cards"><div class="card"><label>Nghĩa vụ mở</label><strong>${s.open}</strong><small>${s.all} khoản trong sổ</small></div><div class="card"><label>Đã trễ hạn</label><strong>${s.late}</strong><small>Theo ngày báo cáo ${esc(db.settings.asof)}</small></div><div class="card"><label>Sắp đến hạn</label><strong>${s.soon}</strong><small>Trong ${db.settings.warnDays} ngày</small></div><div class="card"><label>Chậm nộp mô phỏng</label><strong>${fmt(s.fees)}</strong><small>Phải đối chiếu thực tế</small></div></div><div class="panel"><h2>Cần xem trước</h2>${urg.length?urg.map(x=>`<div class="row"><div><strong>${esc(x.t.type)}</strong> · ${esc(x.t.period)}<br><span class="muted small">Hạn ${x.t.due} · Còn ${fmt(x.left)}</span></div>${badge(x)}</div>`).join(''):'<p class="muted">Chưa có khoản cần xử lý.</p>'}</div><div class="notice">Lịch và tỷ lệ trong dữ liệu mẫu là thông tin thử. Hãy nhập hạn theo quy định áp dụng cho từng kỳ; app không tự xác định nghĩa vụ pháp lý.</div>`)}
function table(rows){return `<div class="tablewrap"><table><thead><tr><th>Khoản / kỳ</th><th>Hạn</th><th>Phải nộp</th><th>Đã nộp</th><th>Còn</th><th>Trạng thái</th><th>Tạm tính chậm nộp</th><th>Thao tác</th></tr></thead><tbody>${rows.map(({t,...x})=>`<tr><td><strong>${esc(t.type)}</strong><br><span class="muted">${esc(t.period)}</span></td><td>${t.due}</td><td class="num">${fmt(t.amount)}</td><td class="num">${fmt(paid(t))}</td><td class="num">${fmt(x.left)}</td><td>${badge(x)}</td><td class="num">${fmt(x.fee)}</td><td><button data-act="pay" data-id="${t.id}" ${x.left===0?'disabled':''}>Nộp</button> <button data-act="edit" data-id="${t.id}">Sửa</button></td></tr>`).join('')||'<tr><td colspan="8">Không có khoản phù hợp.</td></tr>'}</tbody></table></div>`}
function items(){let rows=db.items.map(t=>({t,...assessed(t)})).filter(x=>(filter==='all'||x.status===filter)&&(!query||`${x.t.type} ${x.t.period}`.toLowerCase().includes(query)));shell('Sổ nghĩa vụ',`<div class="eyebrow">GHI CHÉP / THEO DÕI</div><h1>Sổ nghĩa vụ</h1><div class="actions"><button class="primary" data-act="add">+ Thêm khoản</button><button data-page="reports">Báo cáo →</button></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Tìm loại thuế hoặc kỳ…" value="${esc(query)}"><select id="statusFilter">${['all','Trễ hạn','Sắp đến hạn','Còn hạn','Đã nộp'].map(s=>`<option value="${s}" ${s===filter?'selected':''}>${s==='all'?'Tất cả':s}</option>`).join('')}</select></div>${table(rows)}</div><div class="panel"><h2>Nhật ký các lần nộp</h2>${db.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{let t=db.items.find(t=>t.id===p.itemId);return `<div class="row"><span><strong>${esc(t?.type||"Khoản đã xóa")}</strong> · ${esc(t?.period||"")}<br><span class="muted small">${p.date} · ${esc(p.note||"Không ghi chú")}</span></span><strong>${fmt(p.amount)}</strong></div>`}).join("")||"<p class=\"muted\">Chưa có lần nộp.</p>"}</div>`)}
function calendar(){let rows=db.items.map(t=>({t,...assessed(t)})).sort((a,b)=>a.t.due.localeCompare(b.t.due));shell('Lịch hạn nộp',`<div class="eyebrow">MỐC CẦN THEO DÕI</div><h1>Lịch hạn nộp</h1><p class="muted">Ngày báo cáo: ${db.settings.asof}. Mốc hạn do người dùng nhập, không được app tự suy đoán.</p><div class="panel">${rows.map(x=>`<div class="row"><div><b>${x.t.due}</b> · ${esc(x.t.type)}<br><span class="muted small">${esc(x.t.period)} · Còn ${fmt(x.left)} · ${x.until>0?'Trễ '+x.until+' ngày':x.until===0?'Đến hạn hôm nay':'Còn '+(-x.until)+' ngày'}</span></div>${badge(x)}</div>`).join('')||'<p>Chưa có lịch.</p>'}</div>`)}
function reports(){let s=S(),groups=db.items.reduce((a,t)=>{(a[t.type]??=[]).push(t);return a},{});shell('Báo cáo',`<div class="eyebrow">TỔNG HỢP NỘI BỘ</div><h1>Báo cáo nghĩa vụ</h1><div class="actions"><button data-act="csv">Tải CSV mở bằng Excel</button><button data-act="print">In báo cáo</button></div><div class="cards"><div class="card"><label>Tổng đã nộp</label><strong>${fmt(s.paid)}</strong></div><div class="card"><label>Còn phải nộp</label><strong>${fmt(s.due)}</strong></div><div class="card"><label>Khoản trễ</label><strong>${s.late}</strong></div><div class="card"><label>Tạm tính chậm nộp</label><strong>${fmt(s.fees)}</strong></div></div><div class="panel"><h2>Theo loại nghĩa vụ</h2>${Object.entries(groups).map(([name,ts])=>`<div class="row"><strong>${esc(name)} · ${ts.length} kỳ</strong><span>${fmt(ts.reduce((a,t)=>a+remain(t),0))} còn</span></div>`).join('')||'<p>Chưa có số liệu.</p>'}</div><div class="notice">Số tiền chậm nộp là mô phỏng theo tỷ lệ do người dùng nhập; không xét gia hạn, miễn giảm hoặc quy tắc ngày bắt đầu tính riêng.</div>`)}
function field(name,key,type,value,extra=''){return `<div class="field"><label for="f_${key}">${name}</label><input id="f_${key}" name="${key}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function settings(){shell('Thiết lập',`<div class="eyebrow">THAM SỐ TÍNH</div><h1>Thiết lập</h1><form id="settingsForm" class="panel formgrid">${field('Tên đơn vị','company','text',db.settings.company,'required maxlength="100"')}${field('Ngày báo cáo','asof','date',db.settings.asof,'required')}${field('Tỷ lệ chậm nộp mỗi ngày (%)','rate','number',db.settings.rate,'min="0" max="100" step="0.001"')}${field('Cảnh báo trước (ngày)','warnDays','number',db.settings.warnDays,'min="0" max="365" step="1"')}<div class="actions"><button class="primary">Lưu thiết lập</button></div></form><div class="notice">Giá trị mẫu 0,03%/ngày cần đối chiếu với quy định đang áp dụng. Thay tỷ lệ sẽ thay số mô phỏng trong báo cáo; lịch sử khoản đã nộp vẫn giữ ngày và số tiền gốc.</div>`)}
function dataPage(){shell('Dữ liệu & sao lưu',`<div class="eyebrow">LƯU TRỮ NGOẠI TUYẾN</div><h1>Dữ liệu & sao lưu</h1><div class="panel"><h2>Mang dữ liệu sang máy khác</h2><p>Trình duyệt lưu dữ liệu trên thiết bị này. Chép file HTML gốc sang máy khác sẽ không mang theo dữ liệu đã nhập. Hãy tải JSON hoặc HTML kèm dữ liệu.</p><div class="actions"><button data-act="json">Tải JSON</button><button data-act="html">Tải HTML kèm dữ liệu</button><button data-act="import">Nhập JSON</button><button data-act="csv">CSV cho Excel</button></div></div><div class="panel"><h2>Dữ liệu mẫu</h2><p>7 khoản mẫu để thử tính năng. Nạp mẫu sẽ thay dữ liệu hiện tại.</p><div class="actions"><button data-act="reset">Nạp lại mẫu</button><button data-act="clear">Tạo sổ trống</button></div></div>`)}
function guide(){shell('Hướng dẫn',`<div class="eyebrow">CÁCH SỬ DỤNG</div><h1>4 bước theo dõi nghĩa vụ</h1><div class="panel stack"><p>1. Vào Thiết lập để đặt ngày báo cáo, tỷ lệ mô phỏng và khoảng cảnh báo.</p><p>2. Thêm nghĩa vụ với loại, kỳ, hạn và số tiền phải nộp.</p><p>3. Ghi mỗi lần nộp. App tính số còn lại, cảnh báo hạn và tiền chậm nộp tham khảo.</p><p>4. Xem lịch, báo cáo và tải bản sao lưu định kỳ.</p></div><div class="notice">Hạn nộp phải được người dùng xác minh từ nguồn chính thức. App không tạo tờ khai hoặc chứng từ nộp NSNN.</div>`)}
function render(){nav();({home,calendar,items,reports,settings,data:dataPage,guide}[page]||home)()}
function modal(kind,id=''){editId=id;let t=db.items.find(t=>t.id===id),title='',f='';if(kind==='item'){title=t?'Sửa nghĩa vụ':'Thêm nghĩa vụ';f=`<div class="formgrid"><div class="field"><label>Loại thuế/khoản nộp</label><select name="type">${TYPES.map(v=>`<option ${v===(t?.type||TYPES[0])?'selected':''}>${v}</option>`).join('')}</select></div>${field('Kỳ tính thuế','period','text',t?.period||'','required maxlength="100"')}${field('Hạn nộp','due','date',t?.due||iso(),'required')}${field('Số phải nộp (đ)','amount','number',t?.amount??0,'required min="0" step="1"')}${field('Ghi chú','note','text',t?.note||'','maxlength="300"')}</div>`}else{title='Ghi lần nộp';f=`<input type="hidden" name="itemId" value="${id}"><p>Khoản còn nộp: <b>${fmt(remain(t))}</b></p><div class="formgrid">${field('Ngày nộp','date','date',iso(),'required')}${field('Số tiền (đ)','amount','number',remain(t),'required min="1" step="1"')}${field('Ghi chú / mã chứng từ','note','text','','maxlength="200"')}</div>`}$('#formTitle').textContent=title;$('#formFields').innerHTML=f;$('#formError').textContent='';$('#formDialog').dataset.kind=kind;$('#formDialog').showModal()}
function download(name,blob){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportHTML(){let clone=document.documentElement.cloneNode(true),state=clone.querySelector('#embedded');state.textContent=btoa(unescape(encodeURIComponent(JSON.stringify(db))));download('lich-nghia-vu-kem-du-lieu.html',new Blob(['<!doctype html>'+clone.outerHTML],{type:'text/html;charset=utf-8'}))}
function csv(){let rows=[['Loại','Kỳ','Hạn','Phải nộp','Đã nộp','Còn','Trạng thái','Tạm tính chậm nộp'],...db.items.map(t=>{let x=assessed(t);return[t.type,t.period,t.due,t.amount,paid(t),x.left,x.status,x.fee]})],s='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');download('lich-nghia-vu.csv',new Blob([s],{type:'text/csv;charset=utf-8'}))}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-act]');if(!b)return;let p=b.dataset.page,a=b.dataset.act,id=b.dataset.id;if(p){page=p;render();return}if(a==='add')modal('item');if(a==='edit')modal('item',id);if(a==='pay')modal('pay',id);if(a==='print')window.print();if(a==='csv')csv();if(a==='json')download('lich-nghia-vu.json',new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));if(a==='html')exportHTML();if(a==='import')$('#jsonFile').click();if(a==='reset'&&confirm('Thay toàn bộ dữ liệu bằng mẫu?')){db=sample();save()}if(a==='clear'&&confirm('Tạo sổ trống và xóa dữ liệu hiện tại?')){db=fresh();save()}});
document.addEventListener('input',e=>{if(e.target.id==='search')query=e.target.value.toLowerCase()});document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){filter=e.target.value;items()}});$('#cancel').onclick=()=>$('#formDialog').close();$('#itemForm').addEventListener('submit',e=>{e.preventDefault();let f=e.target,v=k=>String(new FormData(f).get(k)||'').trim(),kind=$('#formDialog').dataset.kind;try{let next=structuredClone(db);if(kind==='item'){let amount=Number(v('amount')),period=v('period'),due=v('due');if(!period||!validDate(due)||!Number.isInteger(amount)||amount<0)throw Error('Kiểm tra kỳ, hạn và số tiền nguyên không âm.');let old=next.items.find(t=>t.id===editId);if(old){if(amount<paid(old))throw Error('Số phải nộp không thể thấp hơn số đã nộp.');Object.assign(old,{type:v('type'),period,due,amount,note:v('note')})}else next.items.push({id:'T'+Date.now()+Math.random().toString(36).slice(2,6),type:v('type'),period,due,amount,note:v('note')})}else{let t=next.items.find(t=>t.id===editId),amount=Number(v('amount')),date=v('date');if(!t||!validDate(date)||!Number.isInteger(amount)||amount<=0||amount>remain(t))throw Error('Ngày hoặc số tiền không hợp lệ, hoặc vượt số còn nộp.');next.payments.push({id:'P'+Date.now(),itemId:t.id,date,amount,note:v('note')})}let err=check(next);if(err)throw Error(err);db=next;$('#formDialog').close();save()}catch(err){$('#formError').textContent=err.message}});
document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();let f=e.target,v=k=>String(new FormData(f).get(k)||'').trim(),rate=Number(v('rate')),warnDays=Number(v('warnDays'));if(!validDate(v('asof'))||!Number.isFinite(rate)||rate<0||rate>100||!Number.isInteger(warnDays)||warnDays<0||warnDays>365){alert('Kiểm tra tham số thiết lập.');return}db.settings={company:v('company'),asof:v('asof'),rate,warnDays};save()});$('#jsonFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text()),err=check(x);if(err)throw Error(err);if(confirm('Thay dữ liệu hiện tại bằng file JSON?')){db=x;save()}}catch(err){alert(err.message)}finally{e.target.value=''}};render();


</script></body></html>
