function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!monthOK(x.period)||!Array.isArray(x.costs)||!Array.isArray(x.products)||!Array.isArray(x.locks)||!Array.isArray(x.audit))return 'Cấu trúc dữ liệu không hợp lệ.';let ids=new Set(),codes=new Set();for(let c of x.costs){if(!c.id||ids.has(c.id)||!monthOK(c.period)||!c.name||!basis.includes(c.basis)||!Number.isSafeInteger(c.amount)||c.amount<0||String(c.note||'').length>1200)return 'Khoản chi phí không hợp lệ.';ids.add(c.id)}for(let p of x.products){let key=p.period+'|'+String(p.code).toUpperCase();if(!p.id||ids.has(p.id)||!monthOK(p.period)||!p.code||!p.name||codes.has(key)||!Number.isFinite(p.hours)||p.hours<0||!Number.isInteger(p.quantity)||p.quantity<0||!Number.isSafeInteger(p.direct)||p.direct<0||String(p.note||'').length>1200)return 'Sản phẩm không hợp lệ hoặc trùng mã trong kỳ.';ids.add(p.id);codes.add(key)}let periods=new Set();for(let l of x.locks){if(!l.id||ids.has(l.id)||!monthOK(l.period)||periods.has(l.period)||!Array.isArray(l.rows)||!Number.isSafeInteger(l.pool)||!Number.isSafeInteger(l.balanced)||l.pool!==l.balanced||!l.by||!l.at)return 'Bản chốt kỳ không hợp lệ.';ids.add(l.id);periods.add(l.period)}for(let a of x.audit){if(!a.id||ids.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';ids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function embedded(){try{let s=$('#embedded-state').textContent.trim();return s==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}

function desk(){let z=compute(),costCount=z.cc.length,productCount=z.pp.length;return `${periodBar()}<div class="desk-layout"><aside class="work-rail"><span class="eyebrow">AI MỞ · GIÁ THÀNH XƯỞNG</span><h1>Chi phí chung,<br>phân bổ rõ từng sản phẩm.</h1><p>Nhập các khoản chi phí, chọn tiêu thức, kiểm tra chênh lệch làm tròn rồi chốt kỳ.</p><div class="rail-actions">${btn('＋ Khoản chi','newCost','primary')}${btn('＋ Sản phẩm','newProduct')}</div><div class="rail-steps"><div><b>01</b><span>Gom ${costCount} khoản chi phí chung</span></div><div><b>02</b><span>Đối chiếu ${productCount} sản phẩm và tiêu thức</span></div><div><b>03</b><span>Chốt bản phân bổ có số điều chỉnh minh bạch</span></div></div><div class="rail-foot">Chi phí nội bộ · Chạy offline · Không dùng API</div></aside><div class="desk-main"><div class="totals-band"><div><small>QUỸ CHI PHÍ CHUNG</small><strong>${money(z.pool)}</strong></div><div><small>THEO GIỜ MÁY</small><strong>${money(z.poolHour)}</strong></div><div><small>THEO SẢN LƯỢNG</small><strong>${money(z.poolUnits)}</strong></div></div><div class="reconcile"><div><span>Tổng phân bổ theo công thức gốc</span><b>${money(z.raw)}</b></div><div><span>Chênh do làm tròn (quỹ − phân bổ gốc)</span><b class="${z.delta?'warn':''}">${money(z.delta)}</b></div><div><span>Điều chỉnh công khai khi chốt</span><b>${money(z.balanced-z.raw)}</b></div><div class="final"><span>Phân bổ sau điều chỉnh</span><b>${money(z.balanced)}</b></div></div><div class="desk-actions">${btn('📋 Bảng phân bổ chi tiết','matrix','primary')}${locked()?btn('📄 Xem bản đã chốt','locks'):btn('✓ Chốt kỳ này','lockPeriod','copper')}</div>${z.unallocated?`<p class="notice">⚠ Có ${money(z.unallocated)} chưa phân bổ vì tiêu thức tương ứng có tổng bằng 0. Hãy nhập giờ máy/sản lượng trước khi chốt.</p>`:''}${!costCount||!productCount?`<p class="empty">Bắt đầu bằng khoản chi phí và sản phẩm, hoặc nạp mẫu tại mục Dữ liệu.</p>`:''}</div></div><div class="two-col">${panel('Cơ cấu tiêu thức',`<div class="ba function form(kind,key=''){if(locked())return alert('Kỳ đã chốt. Mở lại có lý do trước khi sửa.');draft={kind,key};let v=kind==='cost'?cost(key)||{}:product(key)||{},fields=kind==='cost'?field('Khoản chi phí *','name',v.name,'text','required maxlength="160"')+`<label>Tiêu thức phân bổ<select name="basis"><option ${v.basis===basis[0]?'selected':''}>Giờ máy</option><option ${v.basis===basis[1]?'selected':''}>Sản lượng</option></select></label>`+field('Số tiền trong kỳ (₫) *','amount',v.amount??0,'number','required min="0" step="1"')+field('Ghi chú','note',v.note,'text','maxlength="1200"'):field('Mã sản phẩm *','code',v.code,'text','required maxlength="40"')+field('Tên sản phẩm *','name',v.name,'text','required maxlength="160"')+field('Giờ máy sử dụng','hours',v.hours??0,'number','required min="0" step="0.01"')+field('Sản lượng','quantity',v.quantity??0,'number','required min="0" step="1"')+field('Chi phí trực tiếp (₫)','direct',v.direct??0,'number','required min="0" step="1"')+field('Ghi chú','note',v.note,'text','maxlength="1200"');$('#modalTitle').textContent=(key?'Sửa ':'Thêm ')+(kind==='cost'?'khoản chi phí':'sản phẩm');$('#formFields').innerHTML=fields;$('#formError').textContent='';$('#editor').showModal()}
function submit(e){e.preventDefault();let f=e.target,x=new FormData(f),get=k=>String(x.get(k)||'').trim(),{kind,key}=draft,before=cp(db);try{if(locked())throw Error('Kỳ đã chốt.');if(kind==='cost'){let amount=Number(get('amount'));if(!get('name')||!basis.includes(get('basis'))||!Number.isSafeInteger(amount)||amount<0)throw Error('Kiểm tra tên, tiêu thức và số tiền.');let c=cost(key),data={name:get('name'),basis:get('basis'),amount,note:get('note')};if(c)Object.assign(c,data);else db.costs.push({id:id(),period:db.period,...data});log(key?'Sửa khoản chi':'Thêm khoản chi',`${data.name}: ${money(amount)}`)}else{let hours=Number(get('hours')),quantity=Number(get('quantity')),direct=Number(get('direct')),code=get('code');if(!code||!get('name')||!Number.isFinite(hours)||hours<0||!Number.isInteger(quantity)||quantity<0||!Number.isSafeInteger(direct)||direct<0)throw Error('Kiểm tra mã, tên, giờ máy, sản lượng và chi phí.');if(products().some(p=>p.id!==key&&p.code.toUpperCase()===code.toUpperCase()))throw Error('Mã sản phẩm đã có trong kỳ.');let p=product(key),data={code,name:get('name'),hours,quantity,direct,note:get('note')};if(p)Object.assign(p,data);else db.products.push({id:id(),period:db.period,...data});log(key?'Sửa sản phẩm':'Thêm sản phẩm',`${code}: ${num(quantity)} sản phẩm`)}let err=validate(db);if(err)throw Error(err);$('#editor').close();draft=null;save()}catch(ex){db=before;$('#formError').textContent=ex.message}}

function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'phan-bo-chi-phi-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'phan-bo-chi-phi-kem-du-lieu.html')}
function sheets(){let periods=[...new Set([...db.costs.map(x=>x.period),...db.products.map(x=>x.period)])].sort();return [{name:'ChiPhi',rows:[['Kỳ','Khoản chi','Tiêu thức','Số tiền','Ghi chú'],...db.costs.map(c=>[c.period,c.name,c.basis,c.amount,c.note])]},{name:'SanPham',rows:[['Kỳ','Mã','Tên','Giờ máy','Sản lượng','Trực tiếp','Ghi chú'],...db.products.map(p=>[p.period,p.code,p.name,p.hours,p.quantity,p.direct,p.note])]},{name:'BangPhanBo',rows:[['Kỳ','Mã','Tên','PB giờ gốc','PB SL gốc','PB gốc','Điều chỉnh','PB chốt','Trực tiếp','Tổng giá thành','Giá thành đơn vị'],...periods.flatMap(period=>compute(period).rows.map(r=>[period,r.code,r.name,r.hour,r.units,r.raw,r.adjust,r.balanced,r.direct,r.total,r.unitCost]))]},{name:'DoiChieu',rows:[['Kỳ','Quỹ giờ','Quỹ SL','Quỹ chung','PB theo nguồn','Chênh gốc','PB chốt','Chênh sau chốt'],...periods.map(period=>{let z=compute(period);return [period,z.poolHour,z.poolUnits,z.pool,z.raw,z.delta,z.balanced,z.pool-z.balanced]})]},{name:'KyDaChot',rows:[['Kỳ','Thời điểm','Người chốt','Quỹ','PB chốt','Lý do'],...db.locks.map(l=>[l.period,l.at,l.by,l.pool,l.balanced,l.reason])]},{name:'NhatKy',rows:[['Thời điểm','Kỳ','Thao tác','Chi tiết'],...db.audit.map(a=>[a.at,a.period,a.action,a.detail])]}]}
function exportExcel(){download(Excel.workbook(sheets()),'phan-bo-chi-phi-san-xuat-chung.xlsx')}
function sample(){let x=blank(),period=x.period;for(let [name,b,amount] of OVERHEAD_SAMPLE.cp)x.costs.push({id:id(),period,name,basis:b,amount,note:'Mẫu tham chiếu'});for(let [code,name,hours,quantity,direct] of OVERHEAD_SAMPLE.sp)x.products.push({id:id(),period,code,name,hours,quantity,direct,note:'Mẫu tham chiếu'});return x}
function act(a,key=''){if(['desk','costs','products','matrix','locks','data','guide'].includes(a)){page=a;render();return}if(a==='openLock'){selected=key;page='lockDetail';render();return}if(a==='newCost'||a==='editCost')return form('cost',a==='editCost'?key:'');if(a==='newProduct'||a==='editProduct')return form('product',a==='editProduct'?key:'');if(a==='deleteCost'||a==='deleteProduct'){if(locked())return alert('Mở kỳ trước khi xóa.');let row=a==='deleteCost'?cost(key):product(key);if(!row||!confirm(`Xóa ${row.name}?`))return;if(a==='deleteCost')db.costs=db.costs.filter(x=>x.id!==key);else db.products=db.products.filter(x=>x.id!==key);log('Xóa',row.name);save();return}if(a==='lockPeriod'){let z=compute();if(!z.cc.length||!z.pp.length)return alert('Cần có cả chi phí và sản phẩm.');if(!z.complete)return alert('Chưa thể chốt: quỹ theo một tiêu thức chưa có giờ máy hoặc sản lượng phù hợp.');let by=prompt('Người chốt kỳ:');if(!by?.trim())return;let reason=prompt('Ghi chú chốt kỳ:')||'';db.locks.push({id:id(),period:db.period,at:new Date().toISOString(),by:by.trim(),reason:reason.trim(),pool:z.pool,raw:z.raw,balanced:z.balanced,delta:z.delta,rows:cp(z.rows)});log('Chốt kỳ',`Quỹ ${money(z.pool)}, chỉnh ${money(z.delta)}`);save();return}if(a==='reopenPeriod'){let l=db.locks.find(x=>x.id===key),reason=prompt(`Lý do mở lại kỳ ${l?.period}:`);if(!l||!reason?.trim())return;db.locks=db.locks.filter(x=>x.id!==key);db.period=l.period;page='desk';log('Mở lại kỳ',reason.trim(),l.period);save();return}if(a==='json')return exportJSON();if(a==='html')return exportHTML();if(a==='excel')return exportExcel();if(a==='print')return print();if(a==='import')return $('#jsonFile').click();if(a==='sample'){if((db.costs.length||db.products.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu. Tiếp tục?'))return;let x=sample(),err=validate(x);if(err)return alert(err);db=x;page='desk';save();return}if(a==='clear'){if(!confirm('Xóa toàn bộ dữ liệu trên máy này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=blank();page='desk';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});document.addEventListener('change',e=>{if(e.target.id==='periodInput'){if(!monthOK(e.target.value))return alert('Kỳ không hợp lệ.');db.period=e.target.value;page='desk';save()}});document.addEventListener('input',e=>{if(e.target.id==='productSearch'){let pos=e.target.selectionStart;search=e.target.value;render();let q=$('#productSearch');q.focus();q.setSelectionRange(pos,pos)}});$('#itemForm').addEventListener('submit',submit);$('#closeModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm('Nhập JSON sẽ thay toàn bộ dữ liệu hiện có. Tiếp tục?'))return;db=x;page='desk';save()}catch(ex){alert('Không nhập được: '+ex.message)}finally{e.target.value=''}});render();
</script></body></html>
