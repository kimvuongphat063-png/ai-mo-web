function valid(d){if(!d||d.version!==1||!d.settings||!['company','address','phone','taxCode','bank','account','holder'].every(k=>typeof d.settings[k]==='string'&&d.settings[k].length<=300)||!Number.isSafeInteger(d.settings.warnDays)||d.settings.warnDays<0||d.settings.warnDays>365||!Array.isArray(d.customers)||d.customers.length>20000||!Array.isArray(d.invoices)||d.invoices.length>100000||!Array.isArray(d.receipts)||d.receipts.length>200000)return false;let ids=new Set(),codes=new Set(),nos=new Set();for(let c of d.customers){if(!c||typeof c.id!=='string'||!c.id||ids.has(c.id)||typeof c.code!=='string'||!c.code||c.code.length>60||codes.has(c.code.toLocaleLowerCase('vi'))||typeof c.name!=='string'||!c.name||c.name.length>200||!['phone','email','address','note'].every(k=>typeof c[k]==='string'&&c[k].length<=1000)||!safe(c.limit)||!Number.isSafeInteger(c.days)||c.days<0||c.days>3650)return false;ids.add(c.id);codes.add(c.code.toLocaleLowerCase('vi'))}for(let b of d.invoices){if(!b||typeof b.id!=='string'||!b.id||ids.has(b.id)||!d.customers.some(c=>c.id===b.customerId)||typeof b.no!=='string'||!b.no||b.no.length>100||nos.has(b.no.toLocaleLowerCase('vi'))||!dateOK(b.date)||!dateOK(b.due)||b.due<b.date||!safe(b.amount)||b.amount===0||typeof b.note!=='string'||b.note.length>1000)return false;ids.add(b.id);nos.add(b.no.toLocaleLowerCase('vi'))}for(let r of d.receipts){let b=d.invoices.find(i=>i.id===r?.invoiceId);if(!r||typeof r.id!=='string'||!r.id||ids.has(r.id)||!b||!dateOK(r.date)||r.date<b.date||!safe(r.amount)||r.amount===0||!METHODS.includes(r.method)||typeof r.note!=='string'||r.note.length>1000)return false;ids.add(r.id)}for(let b of d.invoices)if(sum(d.receipts.filter(r=>r.invoiceId===b.id),r=>r.amount)>b.amount)return false;return true}
function invoiceRows(d,asOf){return d.invoices.map(b=>{let c=customer(b.customerId,d),started=b.date<=asOf,paid=sum(d.receipts.filter(r=>r.invoiceId===b.id&&r.date<=asOf),r=>r.amount),left=started?b.amount-paid:null,late=started&&left>0?Math.max(0,days(asOf,b.due)):0,until=started?days(b.due,asOf):null,status=!started?'Chưa phát sinh':left===0?'Đã thu đủ':late?'Quá hạn':until<=d.settings.warnDays?'Sắp đến hạn':'Chưa đến hạn',bucket=late>90?4:late>60?3:late>30?2:late>0?1:0;return{...b,customer:c,paid,left,late,status,bucket}})}
function customerRows(d,asOf){let bs=invoiceRows(d,asOf);return d.customers.map(c=>{let ls=bs.filter(b=>b.customerId===c.id&&b.left!==null),buckets=Array.from({length:5},(_,n)=>sum(ls.filter(b=>b.bucket===n),b=>b.left)),left=sum(buckets,x=>x),overdue=sum(buckets.slice(1),x=>x);return{...c,buckets,total:sum(ls,b=>b.amount),paid:sum(ls,b=>b.paid),left,overdue,exceed:c.limit>0&&left>c.limit,maxLate:Math.max(0,...ls.map(b=>b.late))}})}
function totals(d,asOf){let bs=invoiceRows(d,asOf).filter(b=>b.left!==null),cs=customerRows(d,asOf);return{due:sum(cs,c=>c.left),overdue:sum(cs,c=>c.overdue),soon:sum(bs.filter(b=>b.status==='Sắp đến hạn'),b=>b.left),overLimit:cs.filter(c=>c.exceed).length,late:bs.filter(b=>b.late>0),issued:sum(bs,b=>b.amount),paid:sum(bs,b=>b.paid)}}
function ledger(d,customerId,asOf){let rows=[];for(let b of d.invoices.filter(x=>x.customerId===customerId&&x.date<=asOf)){rows.push({id:'i-'+b.id,date:b.date,seq:0,no:b.no,note:b.note||'Ghi nhận bán chịu',debit:b.amount,credit:0});for(let r of d.receipts.filter(x=>x.invoiceId===b.id&&x.date<=asOf))rows.push({id:'r-'+r.id,date:r.date,seq:1,no:b.no,note:r.note||'Thu tiền',debit:0,credit:r.amount})}rows.sort((a,b)=>a.date.localeCompare(b.date)||a.seq-b.seq||a.id.localeCompare(b.id));let bal=0;return rows.map(r=>({...r,balance:bal+=r.debit-r.credit}))}
function words(n){n=Math.round(Math.abs(Number(n)||0));if(n===0)return'Không đồng';let cs=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'],units=['',' nghìn',' triệu',' tỷ',' nghìn tỷ',' triệu tỷ'];const tri=(x,full)=>{let tr=Math.floor(x/100),ch=Math.floor(x%100/10),dv=x%10,s='';if(full||tr>0)s+=cs[tr]+' trăm';if(ch>1){s+=' '+cs[ch]+' mươi';if(dv===1)s+=' mốt';else if(dv===5)s+=' lăm';else if(dv===4)s+=' tư';else if(dv>0)s+=' '+cs[dv]}else if(ch===1){s+=' mười';if(dv===5)s+=' lăm';else if(dv>0)s+=' '+cs[dv]}else if(dv>0){if(full||tr>0)s+=' lẻ';s+=' '+cs[dv]}return s.trim()};let chunks=[],x=n;while(x>0){chunks.push(x%1000);x=Math.floor(x/1000)}let out=[];for(let i=chunks.length-1;i>=0;i--)if(chunks[i])out.push(tri(chunks[i],i!==chunks.length-1)+units[i]);let s=out.join(' ').replace(/\s+/g,' ').trim();return s[0].toUpperCase()+s.slice(1)+' đồng'}
function encode(d){return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}

function settingsPage(){let s=db.settings;return hero('⚙️ Cài đặt','Thông tin đơn vị, tài khoản nhận tiền và ngưỡng nhắc trước hạn.')+'<section class="card"><div class="formgrid">'+field('company','Tên đơn vị','text',s.company)+field('address','Địa chỉ','text',s.address)+field('phone','Điện thoại','text',s.phone)+field('taxCode','Mã số thuế','text',s.taxCode)+field('warnDays','Nhắc trước hạn (ngày)','number',s.warnDays)+field('bank','Ngân hàng','text',s.bank)+field('account','Số tài khoản','text',s.account)+field('holder','Chủ tài khoản','text',s.holder)+'</div><p><button class="btn primary" data-action="settings">Lưu cài đặt</button></p><p class="notice">Thay số ngày cho nợ trên khách hàng không thay hạn đã lưu của hóa đơn cũ.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Chuyển máy bằng HTML kèm dữ liệu hoặc JSON; Excel có thể nhập lại.')+'<section class="card"><div class="grid">'+metric('Khách hàng',db.customers.length)+metric('Hóa đơn',db.invoices.length)+metric('Lần thu',db.receipts.length)+'</div><p class="notice warn">File HTML gốc không mang dữ liệu đã nhập trong trình duyệt. Hãy sao lưu định kỳ.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excel">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV hóa đơn</button></div><p class="muted">Excel gồm 4 sheet dữ liệu và 1 sheet báo cáo tuổi nợ.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>5 khách hàng, 10 hóa đơn, 5 lần thu theo ngày mở app. Mẫu chỉ nạp khi chọn.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn','Theo dõi tiền khách còn nợ từ bán chịu đến đối chiếu.')+'<section class="card"><ol><li>Khai khách hàng, số ngày cho nợ và hạn mức.</li><li>Nhập mỗi hóa đơn bán chịu, kiểm tra ngày hạn được gợi ý.</li><li>Ghi từng lần thu vào đúng hóa đơn; tổng thu không được vượt giá trị hóa đơn.</li><li>Chọn ngày báo cáo để xem số cuối ngày; rà tuổi nợ và hạn mức.</li><li>Mở sổ chi tiết khách, soạn thư đối chiếu, kiểm tra rồi tự gửi.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu để chuyển máy.</li></ol><p>App không xử lý ứng trước, trả thừa, hàng trả lại, bù trừ công nợ hoặc nhiều ngoại tệ. Số liệu cần đối chiếu chứng từ trước khi chốt.</p></section>'}
function render(){let titles={dashboard:'Tổng quan',customers:'Khách hàng',invoices:'Hóa đơn bán chịu',receipts:'Thu tiền',aging:'Tuổi nợ',ledger:'Sổ chi tiết',letter:'Thư đối chiếu',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,customers:customersPage,invoices:invoicesPage,receipts:receiptsPage,aging:agingPage,ledger:customerLedgerPage,letter:letterPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Công nợ phải thu')+'</b> · '+esc(titles[page])+' · '+date(asOf)+'</div>'+views[page]()}
function openModal(kind,key='',hintInvoice=''){if(kind==='invoice'&&!db.customers.length){page='customers';render();alert('Hãy thêm khách hàng trước khi lập hóa đơn.');return}if(kind==='receipt'&&!db.invoices.length){page='invoices';render();alert('Hãy thêm hóa đơn trước khi ghi thu tiền.');return}let old=(kind==='customer'?db.customers:kind==='invoice'?db.invoices:db.receipts).find(x=>x.id===key)||{},picked=invoice(hintInvoice)||db.invoices[0],c=customer(old.customerId)||db.customers[0];modal={kind,key};$('#modalTitle').textContent=(key?'Sửa ':'Thêm ')+({customer:'khách hàng',invoice:'hóa đơn',receipt:'lần thu tiền'}[kind]);let h='';if(kind==='customer')h=field('code','Mã khách *','text',old.code||'KH'+String(db.customers.length+1).padStart(3,'0'))+field('name','Tên khách *','text',old.name)+field('phone','Điện thoại / Zalo','text',old.phone)+field('email','Email','text',old.email)+field('days','Số ngày cho nợ','number',old.days??30)+field('limit','Hạn mức nợ (đ)','number',old.limit??0)+field('address','Địa chỉ','text',old.address)+field('note','Ghi chú','textarea',old.note);if(kind==='invoice')h=field('no','Số hóa đơn *','text',old.no)+field('customerId','Khách hàng *','select','',db.customers.map(x=>opt(x.id,x.code+' · '+x.name,old.customerId||c?.id)).join(''))+field('date','Ngày hóa đơn *','date',old.date||today())+field('due','Hạn thanh toán *','date',old.due||addDays(today(),c?.days||0))+field('amount','Tổng tiền phải thu (đ) *','number',old.amount??0)+field('note','Diễn giải','textarea',old.note);if(kind==='receipt'){let b=invoice(old.invoiceId)||picked,available=b?b.amount-sum(db.receipts.filter(r=>r.invoiceId===b.id&&r.id!==key),r=>r.amount):0;h=field('invoiceId','Hóa đơn *','select','',db.invoices.map(x=>opt(x.id,x.no+' · '+customer(x.customerId)?.name,old.invoiceId||b?.id)).join(''))+field('date','Ngày thu *','date',old.date||today())+field('amount','Số tiền thu (đ) *','number',old.amount??available)+field('method','Hình thức','select','',METHODS.map(x=>opt(x,x,old.method||METHODS[0])).join(''))+field('note','Nội dung thu / mã giao dịch','textarea',old.note)+'<p class="wide notice" id="receiptHint">Có thể thu tối đa: '+money(available)+' · Hạn: '+date(b?.due)+'</p>'}if(key)h+='<div class="wide"><button type="button" class="btn danger small" data-action="deleteRecord">Xóa bản ghi</button></div>';$('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){if(!modal)return;let{kind,key}=modal,x={},error='';if(kind==='customer'){x={code:v('code'),name:v('name'),phone:v('phone'),email:v('email'),days:num(v('days')),limit:num(v('limit')),address:v('address'),note:v('note')};if(!x.code||x.code.length>60||!x.name||x.name.length>200||!['phone','email','address','note'].every(k=>x[k].length<=1000)||!Number.isSafeInteger(x.days)||x.days>3650||!safe(x.limit))error='Kiểm tra mã, tên, số ngày nợ và hạn mức.';if(db.customers.some(c=>c.id!==key&&c.code.toLocaleLowerCase('vi')===x.code.toLocaleLowerCase('vi')))error='Mã khách đã có.'}if(kind==='invoice'){x={no:v('no'),customerId:v('customerId'),date:v('date'),due:v('due'),amount:num(v('amount')),note:v('note')};let old=invoice(key),receipts=db.receipts.filter(r=>r.invoiceId===key);if(!x.no||x.no.length>100||!customer(x.customerId)||!dateOK(x.date)||!dateOK(x.due)||x.due<x.date||!safe(x.amount)||x.amount===0||x.note.length>1000)error='Kiểm tra số hóa đơn, ngày, hạn, khách và số tiền.';if(db.invoices.some(b=>b.id!==key&&b.no.toLocaleLowerCase('vi')===x.no.toLocaleLowerCase('vi')))error='Số hóa đơn đã có.';if(old&&receipts.length&&old.customerId!==x.customerId)error='Hóa đơn đã có phiếu thu; không đổi khách hàng.';if(sum(receipts,r=>r.amount)>x.amount)error='Giá trị hóa đơn nhỏ hơn số đã thu.';if(receipts.some(r=>r.date<x.date))error='Ngày hóa đơn không thể sau ngày đã thu.'}if(kind==='receipt'){x={invoiceId:v('invoiceId'),date:v('date'),amount:num(v('amount')),method:v('method'),note:v('note')};let b=invoice(x.invoiceId),paid=sum(db.receipts.filter(r=>r.invoiceId===x.invoiceId&&r.id!==key),r=>r.amount);if(!b||!dateOK(x.date)||x.date<b.date||!safe(x.amount)||x.amount===0||!METHODS.includes(x.method)||x.note.length>1000)error='Chọn hóa đơn, ngày thu từ ngày hóa đơn và số tiền dương.';if(b&&x.amount>b.amount-paid)error='Thu vượt số còn nợ. Tối đa '+money(b.amount-paid)+'.'}if(error){$('#modalError').textContent=error;return}let d=structuredClone(db),arr=kind==='customer'?d.customers:kind==='invoice'?d.invoices:d.receipts;if(key)Object.assign(arr.find(z=>z.id===key),x);else arr.push({id:uid(),...x});if(!valid(d)){$('#modalError').textContent='Dữ liệu không hợp lệ hoặc thu vượt hóa đơn.';return}db=d;closeModal();save()}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('cong-no-phai-thu-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){let bs=invoiceRows(db,asOf),cs=customerRows(db,asOf);return[{name:'Khach hang',rows:[['Mã nội bộ','Mã KH','Tên KH','Hạn mức','Ngày nợ','Điện thoại','Email','Địa chỉ','Ghi chú'],...db.customers.map(c=>[c.id,c.code,c.name,c.limit,c.days,c.phone,c.email,c.address,c.note])]},{name:'Hoa don',rows:[['Mã nội bộ','Mã KH nội bộ','Số HĐ','Ngày','Hạn','Giá trị','Diễn giải'],...db.invoices.map(b=>[b.id,b.customerId,b.no,b.date,b.due,b.amount,b.note])]},{name:'Thu tien',rows:[['Mã nội bộ','Mã HĐ nội bộ','Ngày','Số tiền','Hình thức','Nội dung'],...db.receipts.map(r=>[r.id,r.invoiceId,r.date,r.amount,r.method,r.note])]},{name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]},{name:'Tuoi no',rows:[['Mã KH','Tên','Chưa quá hạn','1-30','31-60','61-90','Trên 90','Tổng nợ','Hạn mức'],...cs.map(c=>[c.code,c.name,...c.buckets,c.left,c.limit]),[],['Ngày báo cáo',asOf]]}]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='cong-no-phai-thu.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(x){if(typeof x==='number'){let d=new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000);return d.toISOString().slice(0,10)}let s=String(x??'').trim();if(dateOK(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let d=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return dateOK(d)?d:''}return''}
function parsedExcel(s){if(s['Khach hang']?.[0]?.[0]!=='Mã nội bộ'||s['Hoa don']?.[0]?.[0]!=='Mã nội bộ'||s['Thu tien']?.[0]?.[0]!=='Mã nội bộ')throw Error('Cần file Excel do app xuất có đủ sheet khách, hóa đơn và thu tiền.');let d=blank();d.customers=s['Khach hang'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]??''),name:String(r[2]??''),limit:num(r[3]),days:num(r[4]),phone:String(r[5]??''),email:String(r[6]??''),address:String(r[7]??''),note:String(r[8]??'')}));d.invoices=s['Hoa don'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),customerId:String(r[1]??''),no:String(r[2]??''),date:parseDate(r[3]),due:parseDate(r[4]),amount:num(r[5]),note:String(r[6]??'')}));d.receipts=s['Thu tien'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),invoiceId:String(r[1]??''),date:parseDate(r[2]),amount:num(r[3]),method:String(r[4]??''),note:String(r[5]??'')}));if(s['Cai dat']){let raw=Object.fromEntries(s['Cai dat'].slice(1).filter(r=>r[0]).map(r=>[String(r[0]),r[1]]));for(let k of Object.keys(d.settings))if(raw[k]!==undefined)d.settings[k]=k==='warnDays'?num(raw[k]):String(raw[k])}if(!valid(d))throw Error('Excel có mã liên kết, ngày hoặc số tiền không hợp lệ.');return d}
function csv(){let rows=[['Số HĐ','Mã KH','Khách','Ngày','Hạn','Giá trị','Đã thu','Còn nợ','Trạng thái'],...invoiceRows(db,asOf).map(b=>[b.no,b.customer.code,b.customer.name,b.date,b.due,b.amount,b.paid,b.left??'',b.status])];download('cong-no-phai-thu.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;search='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print'){if(page==='letter'&&$('#letterPrint'))$('#letterPrint').textContent=$('#letterBody').value;window.print()}if(a==='backup')download('cong-no-phai-thu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv();if(a==='ledger'){selectedCustomer=b.dataset.id;page='ledger';render()}if(a==='collect'){openModal('receipt','',b.dataset.id)}if(a==='copyLetter'){let el=$('#letterBody');try{await navigator.clipboard.writeText(el.value);alert('Đã sao chép thư.')}catch{el.select();alert('Hãy dùng Ctrl+C để sao chép thư.')}}if(a==='sample'){if(!confirm('Nạp mẫu sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sample();asOf=today();save()}if(a==='clear'){if(confirm('Xóa toàn bộ khách hàng, hóa đơn và lần thu trên trình duyệt này?')){db=blank();selectedCustomer='';save()}}if(a==='settings'){let d=structuredClone(db);for(let k of Object.keys(d.settings))d.settings[k]=k==='warnDays'?num(v(k)):v(k);if(!valid(d)){alert('Cài đặt không hợp lệ.');return}db=d;save()}if(a==='deleteRecord'&&modal?.key){let{kind,key}=modal;if(kind==='customer'&&db.invoices.some(z=>z.customerId===key)){$('#modalError').textContent='Khách đã có hóa đơn; không thể xóa.';return}if(kind==='invoice'&&db.receipts.some(z=>z.invoiceId===key)){$('#modalError').textContent='Hóa đơn đã có lần thu; không thể xóa.';return}if(!confirm('Xóa vĩnh viễn bản ghi này?'))return;let list=kind==='customer'?'customers':kind==='invoice'?'invoices':'receipts';db[list]=db[list].filter(z=>z.id!==key);closeModal();save()}});
document.addEventListener('change',e=>{if(e.target.id==='asOf'&&dateOK(e.target.value)){asOf=e.target.value;render()}if(e.target.id==='customerFilter'){selectedCustomer=e.target.value;render()}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}if(modal?.kind==='invoice'&&!modal.key&&['f_customerId','f_date'].includes(e.target.id)){let c=customer(v('customerId')),issued=v('date');if(c&&dateOK(issued))$('#f_due').value=addDays(issued,c.days)}if(modal?.kind==='receipt'&&e.target.id==='f_invoiceId'){let b=invoice(e.target.value);if(b){let left=b.amount-sum(db.receipts.filter(r=>r.invoiceId===b.id&&r.id!==modal.key),r=>r.amount);$('#f_amount').value=left;$('#receiptHint').textContent='Có thể thu tối đa: '+money(left)+' · Hạn: '+date(b.due)}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;search=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
