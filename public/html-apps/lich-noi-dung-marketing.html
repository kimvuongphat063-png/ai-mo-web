const CHANNELS=['Facebook','TikTok','YouTube','Zalo OA','Website'],TYPES=['Bài viết','Video ngắn','Ảnh','Livestream','Email'],STATUSES=['Ý tưởng','Đang làm','Chờ duyệt','Đã đăng'];
const $=s=>document.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const validDate=s=>/^\d{4}-\d\d-\d\d$/.test(s)&&!Number.isNaN(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
const showDate=s=>s?String(s).split('-').reverse().join('/'):'—';
const addDays=(s,n)=>{let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000);
const number=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Number(n)||0);
const pct=(a,b)=>b>0?new Intl.NumberFormat('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(a/b*100)+'%':'—';
const int=v=>/^\d+$/.test(String(v??'').trim())?Number(v):NaN;
const safe=n=>Number.isSafeInteger(n)&&n>=0&&n<=1e12;
function blank(){return{version:1,updatedAt:Date.now(),settings:{brand:'',asof:''},posts:[]}}
function sampleData(anchor=today()){let d=blank();d.settings.asof=anchor;for(let [i,[offset,channel,topic,type,owner,status,reviewOffset,views,engagement]] of SOURCE.nd.entries())d.posts.push({id:'sample-'+i,planDate:addDays(anchor,Number(offset.slice(1))),channel,topic,type,owner,status,reviewDate:addDays(anchor,Number(reviewOffset.slice(1))),publishDate:'',views,engagement,brief:'',postUrl:'',note:'Dữ liệu mẫu từ file gốc; chưa có ngày đăng thực tế'});return d}
const asof=()=>db.settings.asof||today();
function warnings(p,at=asof()){let w=[];if(p.status!=='Đã đăng'&&p.planDate<at)w.push('Trễ lịch đăng '+diffDays(at,p.planDate)+' ngày');if(p.status==='Chờ duyệt'&&p.reviewDate&&p.reviewDate<at)w.push('Quá hạn duyệt');return w}
function validBackup(d){if(!d||d.version!==1||!d.settings||typeof d.settings.brand!=='string'||d.settings.brand.length>160||d.settings.asof&&!validDate(d.settings.asof)||!Array.isArray(d.posts)||d.posts.length>100000)return false;let ids=new Set();for(let p of d.posts){if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||!validDate(p.planDate)||!CHANNELS.includes(p.channel)||typeof p.topic!=='string'||!p.topic||p.topic.length>300||!TYPES.includes(p.type)||typeof p.owner!=='string'||p.owner.length>160||!STATUSES.includes(p.status)||p.reviewDate&&!validDate(p.reviewDate)||p.publishDate&&!validDate(p.publishDate)||p.status!=='Đã đăng'&&!!p.publishDate||!safe(p.views)||!safe(p.engagement)||p.status!=='Đã đăng'&&(p.views>0||p.engagement>0)||typeof p.brief!=='string'||p.brief.length>10000||typeof p.postUrl!=='string'||p.postUrl.length>2000||p.postUrl&&!/^https?:\/\//i.test(p.postUrl)||typeof p.note!=='string'||p.note.length>2000)return false;ids.add(p.id)}return true}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return validBackup(x)?x:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim()),saved=stored();
let db=validBackup(embedded)&&(!saved||(embedded.updatedAt||0)>=(saved.updatedAt||0))?embedded:saved||blank(),page='dashboard',query='',month=today().slice(0,7),filter={channel:'all',status:'all'},modal=null;
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(h,s)=>'<div class="hero"><h1>'+esc(h)+'</h1><p>'+esc(s)+'</p></div>';
const metric=(name,value,sub='')=>'<div class="metric"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>';
const badge=(s,k='')=>'<span class="badge '+k+'">'+esc(s)+'</span>';
const empty=s=>'<div class="empty">'+esc(s)+'</div>';
const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty('Chưa có dữ liệu phù hợp.');
const opt=(v,label,selected)=>'<option value="'+esc(v)+'" '+(String(v)===String(selected)?'selected':'')+'>'+esc(label)+'</option>';

function field(k,label,type,value='',opts=''){return '<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value??'')+'">')+'</div>'}
const v=k=>$('#f_'+k)?.value.trim()||'';
function filtered(){return db.posts.filter(p=>(filter.channel==='all'||p.channel===filter.channel)&&(filter.status==='all'||p.status===filter.status))}

function rowHTML(p){let w=warnings(p);return '<tr><td>'+showDate(p.planDate)+'</td><td><b>'+esc(p.topic)+'</b><br><small>'+esc(p.type)+'</small>'+(p.postUrl?'<br><a href="'+esc(p.postUrl)+'" target="_blank" rel="noopener noreferrer">Mở bài đã đăng ↗</a>':'')+'</td><td>'+esc(p.channel)+'</td><td>'+esc(p.owner)+'</td><td>'+badge(p.status,p.status==='Đã đăng'?'ok':p.status==='Chờ duyệt'?'due':'')+'</td><td>'+showDate(p.reviewDate)+'</td><td>'+showDate(p.publishDate)+'</td><td class="num">'+number(p.views)+'</td><td class="num">'+number(p.engagement)+'</td><td class="num">'+pct(p.engagement,p.views)+'</td><td>'+(w.length?w.map(x=>badge(x,'late')).join('<br>'):'—')+'</td><td><button class="btn small" data-edit="'+esc(p.id)+'">Sửa</button></td></tr>'}
function summary(rows){return{count:rows.length,posted:rows.filter(p=>p.status==='Đã đăng').length,views:rows.reduce((n,p)=>n+p.views,0),engagement:rows.reduce((n,p)=>n+p.engagement,0),late:rows.filter(p=>warnings(p).some(x=>x.startsWith('Trễ lịch'))).length}}
function dashboard(){let rows=filtered(),s=summary(rows),late=rows.filter(p=>warnings(p).length),upcoming=rows.filter(p=>p.status!=='Đã đăng'&&p.planDate>=asof()&&p.planDate<=addDays(asof(),7)).sort((a,b)=>a.planDate.localeCompare(b.planDate));return hero('🗓️ Lịch nội dung marketing','Lên ý tưởng, duyệt, đăng bài và xem tương tác trong một lịch làm việc.')+'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn primary" data-action="new">+ Lên bài mới</button><button class="btn" data-action="calendarPage">Xem lịch tháng</button></div><div class="grid">'+metric('Bài trong kế hoạch',s.count)+metric('Đã đăng',s.posted)+metric('Chưa đăng',s.count-s.posted)+metric('Lượt xem',number(s.views))+metric('Tương tác',number(s.engagement))+metric('Tỷ lệ tương tác',pct(s.engagement,s.views))+metric('Bài trễ lịch',s.late)+'</div><p class="notice">Tỷ lệ tương tác chung = tổng tương tác / tổng lượt xem. Bài mẫu gốc không có ngày đăng thực tế nên ô này để trống cho anh bổ sung.</p></section><div class="split"><section class="card"><h2>🔔 Việc cần xử lý</h2>'+(late.length?late.slice(0,8).map(p=>'<div class="check"><span><b>'+esc(p.topic)+'</b><small>'+esc(p.channel)+' · '+esc(warnings(p).join(' · '))+'</small></span><button class="btn small" data-edit="'+esc(p.id)+'">Mở</button></div>').join(''):empty('Không có bài trễ hoặc quá hạn duyệt.'))+'</section><section class="card"><h2>📅 Sắp đăng trong 7 ngày</h2>'+(upcoming.length?upcoming.slice(0,8).map(p=>'<div class="check"><span><b>'+esc(p.topic)+'</b><small>'+esc(p.channel)+' · '+esc(p.status)+'</small></span><strong>'+showDate(p.planDate)+'</strong></div>').join(''):empty('Chưa có bài sắp đăng.'))+'</section></div><section class="card"><h2>Trạng thái</h2><div class="grid">'+STATUSES.map(x=>metric(x,rows.filter(p=>p.status===x).length)).join('')+'</div></section>'}
function calendarPage(){let first=month+'-01',dow=(new Date(first+'T12:00:00Z').getUTCDay()+6)%7,start=addDays(first,-dow),rows=filtered();let days=[];for(let i=0;i<42;i++){let d=addDays(start,i),items=rows.filter(p=>p.planDate===d);days.push('<div class="calday '+(d.slice(0,7)!==month?'out ':'')+(d===asof()?'today':'')+'"><b>'+Number(d.slice(-2))+'</b>'+items.slice(0,4).map(p=>'<button class="calitem '+(warnings(p).length?'late':'')+'" data-edit="'+esc(p.id)+'" title="'+esc(p.topic)+'">'+esc(p.channel)+' · '+esc(p.topic)+'</button>').join('')+(items.length>4?'<small>+'+(items.length-4)+' bài</small>':'')+'</div>')}return hero('🗓️ Lịch đăng bài','Xem ngày dự kiến đăng; chạm vào bài để cập nhật trạng thái và số liệu.')+'<section class="card"><div class="toolbar">'+filters()+'<span class="grow"></span><button class="btn" data-action="prevMonth">‹ Tháng trước</button><button class="btn" data-action="todayMonth">Tháng này</button><b>'+esc(month.slice(5))+'/'+esc(month.slice(0,4))+'</b><button class="btn" data-action="nextMonth">Tháng sau ›</button><button class="btn primary" data-action="new">+ Bài mới</button></div><div class="calgrid">'+['T2','T3','T4','T5','T6','T7','CN'].map(x=>'<b style="text-align:center;padding:5px">'+x+'</b>').join('')+days.join('')+'</div></section>'}
function boardPage(){let rows=filtered();return hero('🧩 Bảng tiến độ','Bốn trạng thái từ ý tưởng đến đã đăng; mở thẻ bài để chuyển trạng thái.')+'<section class="card">'+filters()+'<div class="toolbar"><span class="grow"></span><button class="btn primary" data-action="new">+ Bài mới</button></div><div class="board">'+STATUSES.map(status=>'<div class="boardcol"><h3>'+esc(status)+' · '+rows.filter(p=>p.status===status).length+'</h3>'+rows.filter(p=>p.status===status).sort((a,b)=>a.planDate.localeCompare(b.planDate)).map(p=>'<div class="postcard"><b>'+esc(p.topic)+'</b><small>'+esc(p.channel)+' · '+showDate(p.planDate)+'</small><small>'+esc(p.owner)+'</small>'+(warnings(p).length?'<small class="bad">'+esc(warnings(p).join(' · '))+'</small>':'')+'<p style="margin:8px 0 0"><button class="btn small" data-edit="'+esc(p.id)+'">Mở bài</button></p></div>').join('')+'</div>').join('')+'</div></section>'}

function alertsPage(){let rows=filtered().filter(p=>warnings(p).length).sort((a,b)=>a.planDate.localeCompare(b.planDate));return hero('🔔 Cần xử lý','Bài quá lịch đăng và bài đang chờ duyệt quá hạn.')+'<section class="card">'+filters()+'<p class="notice warn">Cảnh báo dựa trên ngày báo cáo trong Cài đặt. App không tự gửi thông báo khi đóng.</p>'+table(['Dự kiến','Chủ đề / loại','Kênh','Phụ trách','Trạng thái','Hạn duyệt','Ngày đăng thật','Xem','Tương tác','Tỷ lệ','Cảnh báo',''],rows.map(rowHTML))+'</section>'}
function groupReport(items,label){return table([label,'Bài','Đã đăng','Trễ lịch','Lượt xem','Tương tác','Tỷ lệ'],items.map(([key,rows])=>{let s=summary(rows);return'<tr><td><b>'+esc(key)+'</b></td><td class="num">'+s.count+'</td><td class="num">'+s.posted+'</td><td class="num">'+s.late+'</td><td class="num">'+number(s.views)+'</td><td class="num">'+number(s.engagement)+'</td><td class="num">'+pct(s.engagement,s.views)+'</td></tr>'}))}
function groups(rows,by){let m=new Map();for(let p of rows){let k=by(p);if(!m.has(k))m.set(k,[]);m.get(k).push(p)}return[...m.entries()]}
function reportsPage(){let rows=filtered(),byChannel=CHANNELS.map(k=>[k,rows.filter(p=>p.channel===k)]),byOwner=groups(rows,p=>p.owner||'Chưa phân công').sort((a,b)=>b[1].length-a[1].length),byType=TYPES.map(k=>[k,rows.filter(p=>p.type===k)]),byMonth=groups(rows,p=>p.planDate.slice(0,7)).sort((a,b)=>b[0].localeCompare(a[0]));return hero('📈 Báo cáo nội dung','Tổng bài, tiến độ, lượt xem và tỷ lệ tương tác theo từng chiều quản lý.')+'<section class="card">'+filters()+'<div class="toolbar"><span class="grow"></span><button class="btn" data-action="print">🖨️ In</button><button class="btn" data-action="excelExport">↓ Excel</button></div><p class="notice">Tỷ lệ nhóm = tổng tương tác / tổng lượt xem; không lấy trung bình tỷ lệ từng bài. Lượt xem và tương tác cần nhập sau khi bài đã đăng.</p></section><div class="split"><section class="card"><h2>Theo kênh</h2>'+groupReport(byChannel,'Kênh')+'</section><section class="card"><h2>Theo người phụ trách</h2>'+groupReport(byOwner,'Người làm')+'</section></div><div class="split"><section class="card"><h2>Theo loại nội dung</h2>'+groupReport(byType,'Loại')+'</section><section class="card"><h2>Theo tháng dự kiến</h2>'+groupReport(byMonth,'Tháng')+'</section></div>'}
function settingsPage(){return hero('⚙️ Cài đặt','Tên đội/dự án và ngày dùng để tính cảnh báo.')+'<section class="card"><div class="formgrid">'+field('brand','Tên đội / dự án','text',db.settings.brand)+field('asof','Ngày báo cáo (trống = hôm nay)','date',db.settings.asof)+'</div><p><button class="btn primary" data-action="settings">Lưu cài đặt</button></p><p class="notice">Ngày báo cáo chỉ đổi cách hiển thị cảnh báo; không sửa ngày trong các bài.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Tạo bản lưu trước khi nhập Excel, nạp mẫu hoặc chuyển thiết bị.')+'<section class="card"><div class="grid">'+metric('Tổng bài',db.posts.length)+metric('Đã đăng',db.posts.filter(p=>p.status==='Đã đăng').length)+metric('Kênh có bài',new Set(db.posts.map(p=>p.channel)).size)+'</div><p class="notice warn">Bản HTML gốc không tự mang dữ liệu lưu trên trình duyệt. Dùng HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV danh sách</button></div><p class="muted">Excel gồm 2 sheet: bài nội dung và cài đặt.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>20 bài; ngày dự kiến và hạn duyệt đặt tương đối theo ngày nạp mẫu. Không tự tạo ngày đăng thực tế.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn sử dụng','Một bài một dòng; lên kế hoạch, duyệt, đăng và cập nhật kết quả.')+'<section class="card"><h2>Quy trình</h2><ol><li>Tạo bài với ngày dự kiến, kênh, chủ đề, loại, người phụ trách và brief.</li><li>Đặt hạn duyệt, chuyển trạng thái từ Ý tưởng → Đang làm → Chờ duyệt → Đã đăng.</li><li>Sau khi đăng, điền ngày đăng thực tế, liên kết bài, lượt xem và tương tác.</li><li>Xem lịch tháng, bảng trạng thái, danh sách quá hạn và báo cáo theo kênh/người làm.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu định kỳ.</li></ol><h2>Lưu ý</h2><p>Tỷ lệ tương tác = tương tác / lượt xem. Nếu không có lượt xem, hiển thị “—”. Tương tác do nền tảng đo; app không tự kết nối mạng xã hội hoặc tự đăng bài. Một số bài mẫu gốc đánh dấu Đã đăng với ngày dự kiến tương lai, cần rà lại trước khi dùng thật.</p></section>'}
function render(){let names={dashboard:'Tổng quan',calendar:'Lịch tháng',board:'Theo trạng thái',posts:'Danh sách bài',alerts:'Cần xử lý',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,calendar:calendarPage,board:boardPage,posts:postsPage,alerts:alertsPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.brand||'Lịch nội dung marketing')+'</b> · '+esc(names[page])+' · '+showDate(asof())+'</div>'+views[page]()}
function openModal(id=''){
  let old=db.posts.find(p=>p.id===id)||{};modal={id};$('#modalTitle').textContent=id?'Sửa bài nội dung':'Lên bài nội dung mới';
  let h=field('planDate','Ngày dự kiến đăng *','date',old.planDate||today())+field('reviewDate','Hạn duyệt','date',old.reviewDate||'')+field('channel','Kênh *','select','',options(CHANNELS,old.channel||CHANNELS[0]))+field('type','Loại nội dung','select','',options(TYPES,old.type||TYPES[0]))+field('topic','Chủ đề / tiêu đề *','text',old.topic||'')+field('owner','Người phụ trách','text',old.owner||'')+field('status','Trạng thái','select','',options(STATUSES,old.status||STATUSES[0]))+field('publishDate','Ngày đăng thực tế','date',old.publishDate||'')+field('brief','Brief / thông điệp / CTA','textarea',old.brief||'')+field('postUrl','Liên kết bài đã đăng (https://...)','url',old.postUrl||'')+field('views','Lượt xem','number',old.views??0)+field('engagement','Lượt tương tác','number',old.engagement??0)+field('note','Ghi chú / phản hồi duyệt','textarea',old.note||'');
  h+='<p class="wide notice">Chỉ ghi ngày đăng thực tế, lượt xem và tương tác khi trạng thái là “Đã đăng”. File mẫu gốc không có ngày đăng thực tế.</p>';
  if(id)h+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bài này</button></div>';
  $('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal();
}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){
  if(!modal)return;let id=modal.id,x={planDate:v('planDate'),reviewDate:v('reviewDate'),channel:v('channel'),type:v('type'),topic:v('topic'),owner:v('owner'),status:v('status'),publishDate:v('publishDate'),brief:v('brief'),postUrl:v('postUrl'),views:int(v('views')),engagement:int(v('engagement')),note:v('note')};
  if(!validDate(x.planDate)||x.reviewDate&&!validDate(x.reviewDate)||!CHANNELS.includes(x.channel)||!TYPES.includes(x.type)||!x.topic||x.topic.length>300||x.owner.length>160||!STATUSES.includes(x.status)||x.publishDate&&!validDate(x.publishDate)||!safe(x.views)||!safe(x.engagement)||x.brief.length>10000||x.note.length>2000||x.postUrl&&!/^https?:\/\//i.test(x.postUrl)){$('#modalError').textContent='Ngày, kênh, chủ đề, số lượt hoặc liên kết không hợp lệ.';return}
  if(x.status!=='Đã đăng'&&(x.publishDate||x.views||x.engagement)){$('#modalError').textContent='Bài chưa đăng cần để trống ngày đăng và để số lượt bằng 0.';return}
  let d={...db,posts:db.posts.slice()};if(id){let i=d.posts.findIndex(p=>p.id===id);d.posts[i]={...d.posts[i],...x}}else d.posts.push({id:uid(),...x});if(!validBackup(d)){$('#modalError').textContent='Dữ liệu không hợp lệ hoặc vượt giới hạn.';return}db=d;closeModal();save();
}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('lich-noi-dung-marketing-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Mã bài','Ngày dự kiến','Hạn duyệt','Kênh','Loại','Chủ đề','Người phụ trách','Trạng thái','Ngày đăng thực tế','Lượt xem','Tương tác','Brief','Link','Ghi chú']];for(let p of db.posts)rows.push([p.id,p.planDate,p.reviewDate,p.channel,p.type,p.topic,p.owner,p.status,p.publishDate,p.views,p.engagement,p.brief,p.postUrl,p.note]);let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('lich-noi-dung-marketing.csv',body,'text/csv;charset=utf-8')}
function excelSheets(){return[
  {name:'Bai noi dung',rows:[['Mã bài','Ngày dự kiến','Hạn duyệt','Kênh','Loại','Chủ đề','Người phụ trách','Trạng thái','Ngày đăng thực tế','Lượt xem','Tương tác','Brief','Link','Ghi chú'],...db.posts.map(p=>[p.id,p.planDate,p.reviewDate,p.channel,p.type,p.topic,p.owner,p.status,p.publishDate,p.views,p.engagement,p.brief,p.postUrl,p.note])]},
  {name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]}
]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='lich-noi-dung-marketing.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){let rows=sheets['Bai noi dung'];if(!rows||rows[0]?.[0]!=='Mã bài')throw Error('Cần workbook do app xuất, có sheet Bài nội dung.');let d=blank();for(let r of rows.slice(1)){if(!String(r[0]??'').trim())continue;d.posts.push({id:String(r[0]).trim(),planDate:parseDate(r[1]),reviewDate:String(r[2]??'').trim()?(parseDate(r[2])||'INVALID'):'',channel:String(r[3]??'').trim(),type:String(r[4]??'').trim(),topic:String(r[5]??'').trim(),owner:String(r[6]??'').trim(),status:String(r[7]??'').trim(),publishDate:String(r[8]??'').trim()?(parseDate(r[8])||'INVALID'):'',views:int(r[9]),engagement:int(r[10]),brief:String(r[11]??''),postUrl:String(r[12]??'').trim(),note:String(r[13]??'')})}if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));if(raw.brand!==undefined)d.settings.brand=String(raw.brand);if(raw.asof!==undefined)d.settings.asof=String(raw.asof)}if(!validBackup(d))throw Error('Excel có ngày, trạng thái, số lượt hoặc liên kết không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
function shiftMonth(n){let [y,m]=month.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}month=y+'-'+String(m).padStart(2,'0');render()}
document.addEventListener('click',e=>{
  let b=e.target.closest('[data-page],[data-edit],[data-action]');if(!b)return;
  if(b.dataset.page){page=b.dataset.page;query='';render();return}
  if(b.dataset.edit){openModal(b.dataset.edit);return}
  let a=b.dataset.action;
  if(a==='new')openModal();if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();
  if(a==='backup')download('lich-noi-dung-marketing-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();
  if(a==='sample'){if(db.posts.length&&!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sampleData();month=asof().slice(0,7);save()}
  if(a==='clear'){if(confirm('Xóa toàn bộ bài nội dung trên trình duyệt này?')){db=blank();save()}}
  if(a==='deleteRecord'&&modal?.id&&confirm('Xóa vĩnh viễn bài này?')){db.posts=db.posts.filter(p=>p.id!==modal.id);closeModal();save()}
  if(a==='settings'){let d={...db,settings:{brand:v('brand'),asof:v('asof')}};if(!validBackup(d)){alert('Tên dự án hoặc ngày báo cáo không hợp lệ.');return}db=d;save()}
  if(a==='resetFilter'){filter={channel:'all',status:'all'};render()}
  if(a==='calendarPage'){page='calendar';render()}if(a==='prevMonth')shiftMonth(-1);if(a==='nextMonth')shiftMonth(1);if(a==='todayMonth'){month=asof().slice(0,7);render()}
});
document.addEventListener('change',e=>{if(e.target.id==='filterChannel'||e.target.id==='filterStatus'){filter.channel=$('#filterChannel').value;filter.status=$('#filterStatus').value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
