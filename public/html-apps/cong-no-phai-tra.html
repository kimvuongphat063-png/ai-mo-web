function sample(anchor=today()){let d=blank();d.settings={company:'Công ty TNHH Thương mại An Phát',address:'88 Nguyễn Trãi, Thanh Xuân, Hà Nội',phone:'0912 345 678',taxCode:'0312345678'};d.suppliers=SOURCE.suppliers.map((x,i)=>({id:'s-'+i,code:x[0],name:x[1],phone:'',limit:x[2],days:x[3]}));d.invoices=SOURCE.invoices.map((x,i)=>({id:'b-'+i,date:addDays(anchor,x[0]),no:'HD'+(101+i),supplierId:d.suppliers.find(s=>s.code===x[1]).id,amount:x[2],dueDays:d.suppliers.find(s=>s.code===x[1]).days,note:'Mua hàng'}));d.payments=SOURCE.payments.map((x,i)=>{let bill=d.invoices[x[0]];return{id:'p-'+i,date:addDays(bill.date,Math.min(30,Math.max(3,-SOURCE.invoices[x[0]][0]-4))),invoiceId:bill.id,amount:x[1],method:x[2],note:x[1]===bill.amount?'Thanh toán đủ':'Trả một phần'}});return d}
function valid(d){if(!d||d.version!==1||!d.settings||!['company','address','phone','taxCode'].every(k=>typeof d.settings[k]==='string'&&d.settings[k].length<=300)||!Array.isArray(d.suppliers)||!Array.isArray(d.invoices)||!Array.isArray(d.payments)||d.suppliers.length>10000||d.invoices.length>100000||d.payments.length>200000)return false;let ids=new Set(),codes=new Set(),nos=new Set();for(let s of d.suppliers){if(!s||typeof s.id!=='string'||!s.id||ids.has(s.id)||typeof s.code!=='string'||!s.code||s.code.length>50||codes.has(s.code.toLocaleLowerCase('vi'))||typeof s.name!=='string'||!s.name||s.name.length>200||typeof s.phone!=='string'||s.phone.length>100||!safe(s.limit)||!Number.isSafeInteger(s.days)||s.days<0||s.days>3650)return false;ids.add(s.id);codes.add(s.code.toLocaleLowerCase('vi'))}for(let b of d.invoices){if(!b||typeof b.id!=='string'||!b.id||ids.has(b.id)||!dateOK(b.date)||typeof b.no!=='string'||!b.no||b.no.length>100||nos.has(b.no.toLocaleLowerCase('vi'))||!d.suppliers.some(s=>s.id===b.supplierId)||!safe(b.amount)||b.amount===0||!Number.isSafeInteger(b.dueDays)||b.dueDays<0||b.dueDays>3650||typeof b.note!=='string'||b.note.length>1000)return false;ids.add(b.id);nos.add(b.no.toLocaleLowerCase('vi'))}for(let p of d.payments){let b=d.invoices.find(x=>x.id===p?.invoiceId);if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||!b||!dateOK(p.date)||p.date<b.date||!safe(p.amount)||p.amount===0||!METHODS.includes(p.method)||typeof p.note!=='string'||p.note.length>1000)return false;ids.add(p.id)}return true}
const supplier=(sid,d=db)=>d.suppliers.find(s=>s.id===sid),invoice=(bid,d=db)=>d.invoices.find(b=>b.id===bid);
function billRows(d,asOf){return d.invoices.map(b=>{let s=supplier(b.supplierId,d),due=addDays(b.date,b.dueDays),started=b.date<=asOf,paid=sum(d.payments.filter(p=>p.invoiceId===b.id&&p.date<=asOf),p=>p.amount),remain=started?b.amount-paid:null,overdue=started&&remain>0?Math.max(0,days(asOf,due)):0,status=!started?'Chưa phát sinh':remain<0?'Trả vượt':remain===0?'Đã trả đủ':overdue>0?'Quá hạn':days(due,asOf)<=7?'Sắp đến hạn':'Chưa đến hạn';return{...b,supplier:s,due,paid,remain,overdue,status}})}
function aging(d,asOf){let bs=billRows(d,asOf);return d.suppliers.map(s=>{let ls=bs.filter(b=>b.supplierId===s.id&&b.remain!==null&&b.remain>0),over=ls.filter(b=>b.overdue>0),bucket=(a,z)=>sum(over.filter(b=>b.overdue>=a&&b.overdue<=z),b=>b.remain),total=sum(ls,b=>b.remain),c0=sum(ls.filter(b=>b.overdue===0),b=>b.remain);return{...s,total,c0,c1:bucket(1,30),c2:bucket(31,60),c3:bucket(61,90),c4:bucket(91,99999),overdue:sum(over,b=>b.remain),overLimit:s.limit>0&&total>s.limit}})}
function totals(d,asOf){let b=billRows(d,asOf),a=aging(d,asOf);return{amount:sum(b.filter(x=>x.remain!==null),x=>x.amount),paid:sum(b.filter(x=>x.remain!==null),x=>x.paid),positive:sum(a,x=>x.total),overdue:sum(a,x=>x.overdue),overpaid:sum(b.filter(x=>x.remain!==null&&x.remain<0),x=>-x.remain),soon:b.filter(x=>x.status==='Sắp đến hạn'),late:b.filter(x=>x.status==='Quá hạn'),limits:a.filter(x=>x.overLimit)}}
function encode(d){return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return valid(x)?x:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim());let db=valid(embedded)?embedded:stored()||blank(),page='dashboard',asOf=today(),search='',modal=null,selectedSupplier='',message='';
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy tải bản sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(a,b)=>'<div class="hero"><h1>'+esc(a)+'</h1><p>'+esc(b)+'</p></div>';
const metric=(a,b,c='')=>'<div class="metric"><small>'+esc(a)+'</small><strong>'+esc(b)+'</strong><div class="sub">'+esc(c)+'</div></div>';
const badge=(s)=>'<span class="badge '+({'Quá hạn':'late','Trả vượt':'late','Sắp đến hạn':'due','Đã trả đủ':'ok'}[s]||'')+'">'+esc(s)+'</span>';
const empty=t=>'<div class="empty">'+esc(t)+'</div>';
const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty('Chưa có dữ liệu phù hợp.');
const opt=(value,label,current)=>'<option value="'+esc(value)+'" '+(String(value)===String(current)?'selected':'')+'>'+esc(label)+'</option>';
const field=(k,label,type,value='',options='')=>'<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+options+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value??'')+'">')+'</div>';
const v=k=>$('#f_'+k)?.value.trim()||'';
const toolbar=(add='')=>'<div class="toolbar"><label>Ngày báo cáo <input id="asOf" type="date" value="'+esc(asOf)+'"></label><input id="search" class="search" placeholder="Tìm mã, tên, số hóa đơn..." value="'+esc(search)+'"><span class="grow"></span>'+add+'</div>';
const actions=(kind,id)=>'<button class="btn small" data-edit="'+kind+'" data-id="'+esc(id)+'">Sửa</button>';
function dashboard(){let t=totals(db,asOf),a=aging(db,asOf).sort((x,y)=>y.total-x.total),bad=[...t.late.slice(0,5).map(b=>({label:b.no+' · '+b.supplier.name,sub:b.overdue+' ngày quá hạn',value:b.remain,go:'invoices'})),...t.limits.map(s=>({label:s.name,sub:'Vượt hạn mức '+money(s.total-s.limit),value:s.total,go:'aging'})),...t.soon.map(b=>({label:b.no+' · '+b.supplier.name,sub:'Đến hạn '+date(b.due),value:b.remain,go:'invoices'}))];return hero('📊 Công nợ phải trả','Hóa đơn mua chịu, lịch trả tiền và nợ tại ngày báo cáo.')+'<section class="card">'+toolbar('<button class="btn primary" data-new="invoice">+ Hóa đơn</button><button class="btn" data-new="payment">+ Trả tiền</button>')+'<div class="grid">'+metric('Còn phải trả',money(t.positive))+metric('Nợ quá hạn',money(t.overdue),t.late.length+' hóa đơn')+metric('Sắp đến hạn',t.soon.length+' hóa đơn')+metric('Vượt hạn mức',t.limits.length+' nhà cung cấp')+metric('Trả vượt cần rà',money(t.overpaid))+'</div><p class="notice">Số còn phải trả tính từ hóa đơn phát sinh đến ngày báo cáo trừ các khoản đã trả đến ngày đó. Khoản trả vượt được nêu riêng, không bù trừ âm vào tuổi nợ.</p></section><div class="split"><section class="card"><h2>⚠️ Việc cần xử lý</h2>'+(bad.length?bad.map(x=>'<div class="check"><span><b>'+esc(x.label)+'</b><small>'+esc(x.sub)+'</small></span><strong>'+money(x.value)+'</strong></div>').join(''):empty('Không có cảnh báo tại ngày báo cáo.'))+'</section><section class="card"><h2>Nhà cung cấp có dư nợ</h2>'+table(['Nhà cung cấp','Còn nợ','Quá hạn'],a.filter(x=>x.total).slice(0,8).map(s=>'<tr><td>'+esc(s.name)+'</td><td class="num">'+money(s.total)+'</td><td class="num">'+money(s.overdue)+'</td></tr>'))+'</section></div><section class="card"><h2>Quy trình</h2><ol><li>Thêm nhà cung cấp và số ngày được nợ.</li><li>Nhập từng hóa đơn mua chịu.</li><li>Ghi mỗi lần trả tiền vào đúng hóa đơn.</li><li>Rà tuổi nợ, hạn mức và gửi thư đối chiếu.</li></ol></section>'}
function suppliersPage(){let rows=db.suppliers.filter(s=>[s.code,s.name,s.phone].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi'))),ages=aging(db,asOf);return hero('🏢 Nhà cung cấp','Thông tin đối tác, hạn mức và kỳ hạn thanh toán mặc định.')+'<section class="card">'+toolbar('<button class="btn primary" data-new="supplier">+ Nhà cung cấp</button>')+'<p class="muted">'+rows.length+' / '+db.suppliers.length+' nhà cung cấp. Kỳ hạn trên hóa đơn được chụp khi tạo hóa đơn.</p>'+table(['Mã','Nhà cung cấp','Điện thoại','Hạn mức','Ngày được nợ','Còn nợ',''],rows.map(s=>{let a=ages.find(x=>x.id===s.id);return'<tr><td><b>'+esc(s.code)+'</b></td><td>'+esc(s.name)+'</td><td>'+esc(s.phone)+'</td><td class="num">'+money(s.limit)+'</td><td>'+s.days+'</td><td class="num">'+money(a.total)+'</td><td>'+actions('supplier',s.id)+'</td></tr>'}))+'</section>'}
function invoicesPage(){let rows=billRows(db,asOf).filter(b=>[b.no,b.supplier?.name,b.supplier?.code,b.note].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi'))).sort((a,b)=>b.date.localeCompare(a.date));return hero('🧾 Hóa đơn mua chịu','Hạn thanh toán được tính theo ngày hóa đơn và kỳ hạn đã lưu trên hóa đơn.')+'<section class="card">'+toolbar('<button class="btn primary" data-new="invoice">+ Hóa đơn</button>')+table(['Ngày','Số HĐ','Nhà cung cấp','Giá trị','Hạn trả','Đã trả','Còn nợ','Trạng thái',''],rows.map(b=>'<tr><td>'+date(b.date)+'</td><td><b>'+esc(b.no)+'</b></td><td>'+esc(b.supplier?.name)+'</td><td class="num">'+money(b.amount)+'</td><td>'+date(b.due)+'</td><td class="num">'+money(b.paid)+'</td><td class="num">'+(b.remain===null?'—':money(b.remain))+'</td><td>'+badge(b.status)+'</td><td>'+actions('invoice',b.id)+'</td></tr>'))+'</section>'}
function paymentsPage(){let rows=db.payments.filter(p=>{let b=invoice(p.invoiceId);return[p.method,p.note,b?.no,supplier(b?.supplierId)?.name].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi'))}).sort((a,b)=>b.date.localeCompare(a.date));return hero('💸 Phiếu trả tiền','Mỗi lần trả được gắn với một hóa đơn. Ngày trả không thể trước ngày hóa đơn.')+'<section class="card">'+toolbar('<button class="btn primary" data-new="payment">+ Lần trả</button>')+table(['Ngày','Số HĐ','Nhà cung cấp','Số tiền','Hình thức','Ghi chú',''],rows.map(p=>{let b=invoice(p.invoiceId);return'<tr><td>'+date(p.date)+'</td><td>'+esc(b?.no)+'</td><td>'+esc(supplier(b?.supplierId)?.name)+'</td><td class="num">'+money(p.amount)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.note)+'</td><td>'+actions('payment',p.id)+'</td></tr>'}))+'</section>'}
function agingPage(){let rows=aging(db,asOf).filter(s=>[s.code,s.name].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi'))),t=totals(db,asOf);return hero('⏳ Tuổi nợ phải trả','Nợ dương được phân nhóm theo số ngày quá hạn tại ngày báo cáo.')+'<section class="card">'+toolbar('<button class="btn" data-action="print">🖨️ In báo cáo</button><button class="btn" data-action="excel">↓ Excel</button>')+'<div class="grid">'+metric('Còn phải trả',money(t.positive))+metric('Trong hạn',money(t.positive-t.overdue))+metric('Quá hạn',money(t.overdue))+metric('Trả vượt (riêng)',money(t.overpaid))+'</div><p class="notice">Đúng hạn và sắp đến hạn nằm chung trong cột Chưa quá hạn. Khoản trả vượt được cảnh báo riêng, không đưa vào các nhóm tuổi nợ.</p>'+table(['Mã','Nhà cung cấp','Tổng nợ','Chưa quá hạn','1–30 ngày','31–60','61–90','Trên 90','Hạn mức','Cảnh báo'],rows.map(s=>'<tr><td>'+esc(s.code)+'</td><td>'+esc(s.name)+'</td><td class="num">'+money(s.total)+'</td><td class="num">'+money(s.c0)+'</td><td class="num">'+money(s.c1)+'</td><td class="num">'+money(s.c2)+'</td><td class="num">'+money(s.c3)+'</td><td class="num">'+money(s.c4)+'</td><td class="num">'+money(s.limit)+'</td><td>'+(s.overLimit?badge('Vượt hạn mức'):s.overdue?badge('Quá hạn'):badge('Bình thường'))+'</td></tr>'))+'</section>'}
function letterText(sid){let s=supplier(sid),a=aging(db,asOf).find(x=>x.id===sid);if(!s||!a)return'';let bs=billRows(db,asOf).filter(b=>b.supplierId===sid&&b.remain>0);return`Kính gửi: ${s.name}\n\n${db.settings.company||'Đơn vị chúng tôi'} xin đối chiếu công nợ đến ngày ${date(asOf)}:\n- Tổng số còn phải trả: ${money(a.total)}\n- Trong đó chưa quá hạn: ${money(a.c0)}\n- Đã quá hạn: ${money(a.overdue)}\n\nChi tiết hóa đơn còn nợ:\n${bs.map(b=>`• ${b.no}, ngày ${date(b.date)}, hạn ${date(b.due)}: còn ${money(b.remain)}`).join('\n')||'(Không có)'}\n\nNếu số liệu khớp, quý đơn vị vui lòng xác nhận. Nếu có chênh lệch, xin phản hồi để hai bên rà soát.\n\nTrân trọng,\n${db.settings.company||''}${db.settings.phone?' · ĐT '+db.settings.phone:''}`}
function letterPage(){if(!supplier(selectedSupplier))selectedSupplier=db.suppliers[0]?.id||'';let text=letterText(selectedSupplier);return hero('✉️ Thư đối chiếu công nợ','Tạo nội dung tại ngày báo cáo để kiểm tra và gửi nhà cung cấp.')+'<section class="card">'+toolbar()+'<div class="toolbar"><label>Nhà cung cấp <select id="letterSupplier">'+db.suppliers.map(s=>opt(s.id,s.code+' · '+s.name,selectedSupplier)).join('')+'</select></label><span class="grow"></span><button class="btn primary" data-action="copyLetter">Sao chép thư</button><button class="btn" data-action="print">🖨️ In thư</button></div><textarea id="letterBody" rows="18" class="letter">'+esc(text)+'</textarea><pre id="letterPrint" class="print-only letter-print">'+esc(text)+'</pre><p class="notice warn">Kiểm tra số liệu, hóa đơn và ngày báo cáo trước khi gửi. App không tự gửi thư.</p></section>'}

function dataPage(){return hero('💾 Dữ liệu & sao lưu','Chuyển máy bằng HTML kèm dữ liệu hoặc JSON; Excel dùng để xem và nhập lại.')+'<section class="card"><div class="grid">'+metric('Nhà cung cấp',db.suppliers.length)+metric('Hóa đơn',db.invoices.length)+metric('Lần trả',db.payments.length)+'</div><p class="notice warn">Dữ liệu nhập được lưu trong trình duyệt này. Chép file HTML gốc sang máy khác sẽ không chép theo dữ liệu.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excel">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV hóa đơn</button></div><p class="muted">Excel gồm 4 sheet dữ liệu: nhà cung cấp, hóa đơn, khoản trả và cài đặt; thêm 1 sheet tuổi nợ để xem.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>6 nhà cung cấp, 14 hóa đơn, 8 khoản trả, tính theo ngày mở app. Mẫu chỉ nạp khi chọn.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Cách sử dụng','Quy trình quản lý công nợ phải trả trong một file offline.')+'<section class="card"><ol><li>Khai nhà cung cấp, hạn mức và số ngày được nợ.</li><li>Ghi một hóa đơn cho mỗi lần mua chịu; có thể chỉnh số ngày nợ riêng trên hóa đơn.</li><li>Ghi khoản trả và gắn với hóa đơn. App cảnh báo nếu tổng trả vượt hóa đơn.</li><li>Đặt ngày báo cáo để xem đúng số đã phát sinh và đã trả tới ngày đó.</li><li>Kiểm tra tuổi nợ, thư đối chiếu, rồi sao lưu định kỳ.</li></ol><h2>Quy tắc</h2><p>Hóa đơn và khoản trả luôn liên kết bằng mã nội bộ. Không thể xóa nhà cung cấp đã có hóa đơn hoặc hóa đơn đã có khoản trả. Đổi kỳ hạn mặc định của nhà cung cấp không làm thay đổi hạn của hóa đơn cũ.</p><p>Đây là sổ theo dõi quản trị; cần đối chiếu với hóa đơn, sao kê và sổ kế toán trước khi dùng làm xác nhận chính thức.</p></section>'}
function render(){let titles={dashboard:'Tổng quan',suppliers:'Nhà cung cấp',invoices:'Hóa đơn mua chịu',payments:'Phiếu trả tiền',aging:'Tuổi nợ',letter:'Thư đối chiếu',settings:'Thông tin đơn vị',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,suppliers:suppliersPage,invoices:invoicesPage,payments:paymentsPage,aging:agingPage,letter:letterPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Công nợ phải trả')+'</b> · '+esc(titles[page])+' · '+date(asOf)+'</div>'+views[page]()}
function openModal(kind,key=''){if(kind==='invoice'&&!db.suppliers.length){page='suppliers';render();alert('Hãy thêm nhà cung cấp trước khi lập hóa đơn.');return}if(kind==='payment'&&!db.invoices.length){page='invoices';render();alert('Hãy thêm hóa đơn trước khi ghi khoản trả.');return}let old=kind==='supplier'?supplier(key):kind==='invoice'?invoice(key):db.payments.find(p=>p.id===key);old=old||{};modal={kind,key};$('#modalTitle').textContent=(key?'Sửa ':'Thêm ')+({supplier:'nhà cung cấp',invoice:'hóa đơn',payment:'lần trả tiền'}[kind]);let h='';if(kind==='supplier')h=field('code','Mã nhà cung cấp *','text',old.code)+field('name','Tên nhà cung cấp *','text',old.name)+field('phone','Điện thoại','text',old.phone)+field('limit','Hạn mức (đ)','number',old.limit??0)+field('days','Số ngày được nợ','number',old.days??30);if(kind==='invoice')h=field('date','Ngày hóa đơn *','date',old.date||today())+field('no','Số hóa đơn *','text',old.no)+field('supplierId','Nhà cung cấp *','select','',db.suppliers.map(s=>opt(s.id,s.code+' · '+s.name,old.supplierId||db.suppliers[0]?.id)).join(''))+field('amount','Giá trị hóa đơn (đ) *','number',old.amount??0)+field('dueDays','Số ngày được nợ','number',old.dueDays??supplier(db.suppliers[0]?.id)?.days??30)+field('note','Ghi chú','textarea',old.note);if(kind==='payment')h=field('date','Ngày trả *','date',old.date||today())+field('invoiceId','Hóa đơn *','select','',db.invoices.map(b=>opt(b.id,b.no+' · '+supplier(b.supplierId)?.name,old.invoiceId||db.invoices[0]?.id)).join(''))+field('amount','Số tiền trả (đ) *','number',old.amount??0)+field('method','Hình thức','select','',METHODS.map(m=>opt(m,m,old.method||METHODS[0])).join(''))+field('note','Ghi chú','textarea',old.note);if(key)h+='<div class="wide"><button type="button" class="btn danger small" data-action="deleteRecord">Xóa bản ghi</button></div>';$('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){if(!modal)return;let{kind,key}=modal,x={},error='';if(kind==='supplier'){x={code:v('code'),name:v('name'),phone:v('phone'),limit:num(v('limit')),days:num(v('days'))};if(!x.code||x.code.length>50||/\s/.test(x.code)||!x.name||x.name.length>200||x.phone.length>100||!safe(x.limit)||!Number.isSafeInteger(x.days)||x.days>3650)error='Kiểm tra mã, tên, hạn mức và số ngày được nợ.';if(db.suppliers.some(s=>s.id!==key&&s.code.toLocaleLowerCase('vi')===x.code.toLocaleLowerCase('vi')))error='Mã nhà cung cấp đã có.'}if(kind==='invoice'){x={date:v('date'),no:v('no'),supplierId:v('supplierId'),amount:num(v('amount')),dueDays:num(v('dueDays')),note:v('note')};let old=invoice(key);if(!dateOK(x.date)||!x.no||x.no.length>100||!supplier(x.supplierId)||!safe(x.amount)||x.amount===0||!Number.isSafeInteger(x.dueDays)||x.dueDays>3650||x.note.length>1000)error='Kiểm tra ngày, số hóa đơn, nhà cung cấp, giá trị và kỳ hạn.';if(db.invoices.some(b=>b.id!==key&&b.no.toLocaleLowerCase('vi')===x.no.toLocaleLowerCase('vi')))error='Số hóa đơn đã có.';if(old&&db.payments.some(p=>p.invoiceId===key&&p.date<x.date))error='Đã có khoản trả trước ngày hóa đơn mới.'}if(kind==='payment'){x={date:v('date'),invoiceId:v('invoiceId'),amount:num(v('amount')),method:v('method'),note:v('note')};let b=invoice(x.invoiceId);if(!dateOK(x.date)||!b||x.date<b.date||!safe(x.amount)||x.amount===0||!METHODS.includes(x.method)||x.note.length>1000)error='Chọn hóa đơn, ngày trả không trước ngày hóa đơn và nhập số tiền dương.'}if(error){$('#modalError').textContent=error;return}let d=structuredClone(db),arr=kind==='supplier'?d.suppliers:kind==='invoice'?d.invoices:d.payments;if(key)Object.assign(arr.find(z=>z.id===key),x);else arr.push({id:id(),...x});if(!valid(d)){$('#modalError').textContent='Dữ liệu không hợp lệ.';return}db=d;closeModal();save()}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('cong-no-phai-tra-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){return[{name:'Nha cung cap',rows:[['Mã nội bộ','Mã NCC','Tên NCC','Điện thoại','Hạn mức','Ngày được nợ'],...db.suppliers.map(s=>[s.id,s.code,s.name,s.phone,s.limit,s.days])]},{name:'Hoa don',rows:[['Mã nội bộ','Ngày','Số HĐ','Mã NCC nội bộ','Số tiền','Ngày được nợ','Ghi chú'],...db.invoices.map(b=>[b.id,b.date,b.no,b.supplierId,b.amount,b.dueDays,b.note])]},{name:'Khoan tra',rows:[['Mã nội bộ','Ngày','Mã HĐ nội bộ','Số tiền','Hình thức','Ghi chú'],...db.payments.map(p=>[p.id,p.date,p.invoiceId,p.amount,p.method,p.note])]},{name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]},{name:'Tuoi no',rows:[['Mã NCC','Tên','Tổng còn phải trả','Chưa quá hạn','1-30','31-60','61-90','Trên 90','Hạn mức'],...aging(db,asOf).map(s=>[s.code,s.name,s.total,s.c0,s.c1,s.c2,s.c3,s.c4,s.limit])]}]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='cong-no-phai-tra.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseExcelDate(x){if(typeof x==='number'){let d=new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000);return d.toISOString().slice(0,10)}let s=String(x??'').trim();if(dateOK(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let d=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return dateOK(d)?d:''}return''}
function parsedExcel(s){if(s['Nha cung cap']?.[0]?.[0]!=='Mã nội bộ'||s['Hoa don']?.[0]?.[0]!=='Mã nội bộ'||s['Khoan tra']?.[0]?.[0]!=='Mã nội bộ')throw Error('Chỉ nhận file Excel do app xuất có đủ 3 sheet dữ liệu.');let d=blank();d.suppliers=s['Nha cung cap'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]??''),name:String(r[2]??''),phone:String(r[3]??''),limit:num(r[4]),days:num(r[5])}));d.invoices=s['Hoa don'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),date:parseExcelDate(r[1]),no:String(r[2]??''),supplierId:String(r[3]??''),amount:num(r[4]),dueDays:num(r[5]),note:String(r[6]??'')}));d.payments=s['Khoan tra'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),date:parseExcelDate(r[1]),invoiceId:String(r[2]??''),amount:num(r[3]),method:String(r[4]??''),note:String(r[5]??'')}));if(s['Cai dat']){let raw=Object.fromEntries(s['Cai dat'].slice(1).filter(r=>r[0]).map(r=>[String(r[0]),r[1]]));for(let k of Object.keys(d.settings))if(raw[k]!==undefined)d.settings[k]=String(raw[k])}if(!valid(d))throw Error('Excel có mã liên kết, ngày hoặc số tiền không hợp lệ.');return d}
function csv(){let rows=[['Ngày','Số HĐ','Nhà cung cấp','Giá trị','Hạn trả','Đã trả','Còn nợ','Trạng thái'],...billRows(db,asOf).map(b=>[b.date,b.no,b.supplier?.name,b.amount,b.due,b.paid,b.remain??'',b.status])];download('cong-no-phai-tra.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;search='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print'){if(page==='letter'&&$('#letterPrint'))$('#letterPrint').textContent=$('#letterBody').value;window.print()}if(a==='backup')download('cong-no-phai-tra.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv();if(a==='copyLetter'){let el=$('#letterBody');try{await navigator.clipboard.writeText(el.value);alert('Đã sao chép thư.')}catch{el.select();alert('Hãy dùng Ctrl+C để sao chép thư.')}}if(a==='sample'){if(!confirm('Nạp mẫu sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sample();save()}if(a==='clear'){if(confirm('Xóa toàn bộ dữ liệu công nợ trên trình duyệt này?')){db=blank();save()}}if(a==='settings'){let d=structuredClone(db);for(let k of Object.keys(d.settings))d.settings[k]=v(k);if(!valid(d)){alert('Thông tin quá dài hoặc không hợp lệ.');return}db=d;save()}if(a==='deleteRecord'&&modal?.key){let{kind,key}=modal;if(kind==='supplier'&&db.invoices.some(z=>z.supplierId===key)){$('#modalError').textContent='Nhà cung cấp đã có hóa đơn; không thể xóa.';return}if(kind==='invoice'&&db.payments.some(z=>z.invoiceId===key)){$('#modalError').textContent='Hóa đơn đã có khoản trả; không thể xóa.';return}if(!confirm('Xóa vĩnh viễn bản ghi này?'))return;let list=kind==='supplier'?'suppliers':kind==='invoice'?'invoices':'payments';db[list]=db[list].filter(z=>z.id!==key);closeModal();save()}});
document.addEventListener('change',e=>{if(e.target.id==='asOf'&&dateOK(e.target.value)){asOf=e.target.value;render()}if(e.target.id==='letterSupplier'){selectedSupplier=e.target.value;render()}if(e.target.id==='f_supplierId'&&modal?.kind==='invoice'&&!modal.key){let s=supplier(e.target.value);if(s)$('#f_dueDays').value=s.days}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;search=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai phiên bản hoặc dữ liệu không hợp lệ.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
