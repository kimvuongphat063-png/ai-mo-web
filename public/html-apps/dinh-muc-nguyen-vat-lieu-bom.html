function lineDemand(l,source=db){let p=source.products.find(x=>x.code===l.productCode);return round(l.norm*(p?.plan||0),2)}
function lineCost(l,source=db){let m=source.materials.find(x=>x.code===l.materialCode);return round(l.norm*(m?.price||0),0)}
function productStats(p,source=db){let rr=source.lines.filter(l=>l.productCode===p.code),unitCost=rr.reduce((s,l)=>s+lineCost(l,source),0);return {lines:rr.length,unitCost,batchCost:round(unitCost*p.plan,0)}}
function materialStats(m,source=db){let rr=source.lines.filter(l=>l.materialCode===m.code),demand=round(rr.reduce((s,l)=>s+lineDemand(l,source),0),2),shortage=round(Math.max(0,demand+m.minimum-m.stock),2);return {lines:rr.length,demand,shortage,purchaseCost:round(shortage*m.price,0),afterPlan:round(m.stock-demand,2)}}
function summary(source=db){let pp=source.products.map(p=>productStats(p,source)),mm=source.materials.map(m=>materialStats(m,source));return {products:source.products.length,materials:source.materials.length,lines:source.lines.length,units:source.products.reduce((s,p)=>s+p.plan,0),batchCost:pp.reduce((s,p)=>s+p.batchCost,0),purchaseCost:mm.reduce((s,m)=>s+m.purchaseCost,0),toBuy:mm.filter(m=>m.shortage>0).length,missingBOM:pp.filter((s,i)=>source.products[i].plan>0&&s.lines===0).length}}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metricCards(){let s=summary();return `<div class="metrics"><div><small>Sản phẩm</small><strong>${s.products}</strong></div><div><small>Dòng định mức</small><strong>${s.lines}</strong></div><div><small>Chi phí NVL cả kế hoạch</small><strong>${money(s.batchCost)}</strong></div><div><small>Tiền mua dự kiến</small><strong>${money(s.purchaseCost)}</strong></div><div><small>Vật liệu cần mua</small><strong>${s.toBuy}</strong></div></div>`}
function home(){let buys=db.materials.map(m=>({m,s:materialStats(m)})).filter(x=>x.s.shortage>0).sort((a,b)=>b.s.purchaseCost-a.s.purchaseCost);return `<div class="hero"><span>📦 AI MỞ · KẾ HOẠCH VẬT TƯ</span><h1>Định mức nguyên vật liệu (BOM)</h1><p>Lập kế hoạch sản xuất, đối chiếu tồn kho và tính số cần mua để giữ mức tồn tối thiểu.</p><div class="hero-actions">${btn('＋ Thêm sản phẩm','newProduct','primary')}${btn('🛒 Xem nhu cầu mua','procurement')}</div></div>${metricCards()}${panel('🧭 Cách bắt đầu',`<ol><li>Nhập sản phẩm và số lượng định sản xuất.</li><li>Nhập nguyên vật liệu, đơn vị tính, giá, tồn kho và mức tồn tối thiểu.</li><li>Thêm định mức vật liệu cho một đơn vị sản phẩm.</li><li>Xem danh sách cần mua, in hoặc xuất Excel; lưu bản chụp kế hoạch trước khi chỉnh sửa lớn.</li></ol><p class="muted">Giá mua và số tồn là số do người dùng nhập. Định mức gốc chưa gồm hao hụt.</p>`)}${panel('⚠️ Việc cần xem',`${summary().missingBOM?`<p class="pill red">${summary().missingBOM} sản phẩm có kế hoạch nhưng chưa có BOM</p>`:''}${buys.length?buys.map(x=>`<div class="mini"><button class="link" data-act="openMaterial" data-id="${esc(x.m.code)}">${esc(x.m.code)} · ${esc(x.m.name)}</button><small>Cần mua ${qty(x.s.shortage)} ${esc(x.m.unit)} · ${money(x.s.purchaseCost)}</small></div>`).join(''):'<p class="success">Chưa có vật liệu cần mua theo dữ liệu hiện tại.</p>'}`)}`}
function productsPage(){let rows=db.products.filter(p=>!search||[p.code,p.name].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')));return `<div class="page-head"><div><h1>📦 Sản phẩm & kế hoạch</h1><p>Chi phí NVL một đơn vị = tổng định mức × giá vật liệu.</p></div>${btn('＋ Thêm sản phẩm','newProduct','primary')}</div>${panel('Tìm kiếm',`<label>Tên hoặc mã<input id="search" value="${esc(search)}" placeholder="SP01, áo sơ mi…"></label>`)}${panel('Danh sách sản phẩm',`<div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Kế hoạch</th><th>Số vật liệu</th><th>NVL / sản phẩm</th><th>NVL cả lô</th><th></th></tr></thead><tbody>${rows.map(p=>{let s=productStats(p);return `<tr><td><button class="link" data-act="openProduct" data-id="${esc(p.code)}">${esc(p.code)} · ${esc(p.name)}</button></td><td>${qty(p.plan)}</td><td>${s.lines}</td><td>${money(s.unitCost)}</td><td>${money(s.batchCost)}</td><td>${btn('Xem','openProduct','small',p.code)}</td></tr>`}).join('')||'<tr><td colspan="6">Chưa có sản phẩm.</td></tr>'}</tbody></table></div>`)}${panel('Tổng kế hoạch',`<p><b>${qty(summary().units)}</b> sản phẩm cần làm · <b>${money(summary().batchCost)}</b> chi phí nguyên vật liệu ước tính.</p>`)}`}
function productDetail(){let p=product(selected);if(!p){page='products';return productsPage()}let s=productStats(p),rr=db.lines.filter(l=>l.productCode===p.code);return `<div class="page-head"><div><button class="link" data-act="products">← Sản phẩm</button><h1>📦 ${esc(p.name)}</h1><p>${esc(p.code)} · ${qty(p.plan)} sản phẩm dự kiến</p></div><div class="actions no-print">${btn('＋ Dòng định mức','newLine','primary',p.code)}${btn('Sửa sản phẩm','editProduct','',p.code)}${btn('Xóa','deleteProduct','danger',p.code)}${btn('🖨️ In','print')}</div></div><div class="metrics"><div><small>Định mức</small><strong>${s.lines} dòng</strong></div><div><small>Số lượng</small><strong>${qty(p.plan)}</strong></div><div><small>NVL / sản phẩm</small><strong>${money(s.unitCost)}</strong></div><div><small>NVL cả lô</small><strong>${money(s.batchCost)}</strong></div><div><small>Tình trạng</small><strong>${s.lines?'Đã có BOM':'Thiếu BOM'}</strong></div></div>${panel('📋 Dòng định mức',`<div class="table-wrap"><table><thead><tr><th>Vật liệu</th><th>ĐVT</th><th>Định mức / SP</th><th>Giá</th><th>Chi phí / SP</th><th>Nhu cầu cả lô</th><th></th></tr></thead><tbody>${rr.map(l=>{let m=material(l.materialCode);return `<tr><td>${esc(m?.code||'')} · ${esc(m?.name||'')}</td><td>${esc(m?.unit||'')}</td><td>${qty(l.norm)}</td><td>${money(m?.price)}</td><td>${money(lineCost(l))}</td><td>${qty(lineDemand(l))}</td><td class="no-print">${btn('Sửa','editLine','small',l.id)}${btn('Xóa','deleteLine','small danger',l.id)}</td></tr>`}).join('')||'<tr><td colspan="7">Chưa có dòng định mức. Kết quả chi phí sẽ bằng 0 cho đến khi nhập BOM.</td></tr>'}</tbody></table></div>`)}${panel('📝 Ghi chú',`<p>${esc(p.note||'Chưa có ghi chú.')}</p><p class="muted">Định mức chưa gồm hao hụt. Nếu cần, người phụ trách kỹ thuật phải cộng phần hao hụt được duyệt vào định mức trước khi lập kế hoạch.</p>`)}`}
function materialsPage(){return `<div class="page-head"><div><h1>🧵 Nguyên vật liệu</h1><p>Đơn vị tính phải thống nhất giữa tồn kho, định mức và đơn mua.</p></div>${btn('＋ Thêm vật liệu','newMaterial','primary')}</div>${panel('Danh mục vật liệu',`<div class="table-wrap"><table><thead><tr><th>Vật liệu</th><th>ĐVT</th><th>Giá tham chiếu</th><th>Tồn kho</th><th>Tồn tối thiểu</th><th>Nhu cầu</th><th>Cần mua</th><th></th></tr></thead><tbody>${db.materials.map(m=>{let s=materialStats(m);return `<tr><td><button class="link" data-act="openMaterial" data-id="${esc(m.code)}">${esc(m.code)} · ${esc(m.name)}</button></td><td>${esc(m.unit)}</td><td>${money(m.price)}</td><td>${qty(m.stock)}</td><td>${qty(m.minimum)}</td><td>${qty(s.demand)}</td><td>${s.shortage?`<span class="pill red">${qty(s.shortage)}</span>`:'—'}</td><td>${btn('Xem','openMaterial','small',m.code)}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có vật liệu. Hãy tạo danh mục trước khi thêm định mức.</td></tr>'}</tbody></table></div>`)}`}
function materialDetail(){let m=material(selected);if(!m){page='materials';return materialsPage()}let s=materialStats(m),rr=db.lines.filter(l=>l.materialCode===m.code);return `<div class="page-head"><div><button class="link" data-act="materials">← Vật liệu</button><h1>🧵 ${esc(m.name)}</h1><p>${esc(m.code)} · ${esc(m.unit)}</p></div><div class="actions no-print">${btn('Sửa vật liệu','editMaterial','primary',m.code)}${btn('Xóa','deleteMaterial','danger',m.code)}${btn('🖨️ In','print')}</div></div><div class="metrics"><div><small>Nhu cầu</small><strong>${qty(s.demand)} ${esc(m.unit)}</strong></div><div><small>Tồn hiện tại</small><strong>${qty(m.stock)}</strong></div><div><small>Tồn tối thiểu</small><strong>${qty(m.minimum)}</strong></div><div><small>Thiếu cần mua</small><strong>${qty(s.shortage)}</strong></div><div><small>Tiền mua dự kiến</small><strong>${money(s.purchaseCost)}</strong></div></div>${panel('Cách tính',`<p><b>Cần mua</b> = max(0, Nhu cầu + Tồn tối thiểu − Tồn hiện tại).</p><p><b>Tồn sau sản xuất nếu không mua:</b> ${qty(s.afterPlan)} ${esc(m.unit)}. <b>Giá tham chiếu:</b> ${money(m.price)}/${esc(m.unit)}.</p><p class="muted">Số cần mua là đề xuất tính toán; không phải đơn đặt hàng hoặc lượng hàng đã về.</p>`)}${panel('Sản phẩm dùng vật liệu này',`<div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Kế hoạch</th><th>Định mức / SP</th><th>Nhu cầu</th></tr></thead><tbody>${rr.map(l=>{let p=product(l.productCode);return `<tr><td>${esc(p?.code||'')} · ${esc(p?.name||'')}</td><td>${qty(p?.plan)}</td><td>${qty(l.norm)}</td><td>${qty(lineDemand(l))}</td></tr>`}).join('')||'<tr><td colspan="4">Chưa dùng trong BOM.</td></tr>'}</tbody></table></div>`)}${panel('Ghi chú',`<p>${esc(m.note||'Chưa có ghi chú.')}</p>`)}`}
function linesPage(){return `<div class="page-head"><div><h1>🧩 Định mức từng sản phẩm</h1><p>Mỗi cặp sản phẩm–vật liệu có một dòng định mức.</p></div>${btn('＋ Thêm định mức','newLine','primary')}</div>${panel('Bảng BOM',`<div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Vật liệu</th><th>Định mức / SP</th><th>Giá</th><th>Chi phí / SP</th><th>Nhu cầu kế hoạch</th><th></th></tr></thead><tbody>${db.lines.map(l=>{let p=product(l.productCode),m=material(l.materialCode);return `<tr><td>${esc(p?.code||'')} · ${esc(p?.name||'')}</td><td>${esc(m?.code||'')} · ${esc(m?.name||'')}</td><td>${qty(l.norm)} ${esc(m?.unit||'')}</td><td>${money(m?.price)}</td><td>${money(lineCost(l))}</td><td>${qty(lineDemand(l))} ${esc(m?.unit||'')}</td><td>${btn('Sửa','editLine','small',l.id)}${btn('Xóa','deleteLine','small danger',l.id)}</td></tr>`}).join('')||'<tr><td colspan="7">Chưa có dòng định mức.</td></tr>'}</tbody></table></div>`)}${panel('Công thức nguồn',`<p><b>Nhu cầu của dòng</b> = định mức × lượng sản xuất, làm tròn 2 chữ số thập phân. <b>Chi phí một sản phẩm trên dòng</b> = định mức × giá mua, làm tròn đến đồng. Chi phí cả lô = tổng chi phí đơn vị × lượng sản xuất.</p>`)}`}
function procurement(){let rows=db.materials.map(m=>({m,s:materialStats(m)})).sort((a,b)=>b.s.purchaseCost-a.s.purchaseCost),t=summary();return `<div class="page-head"><div><h1>🛒 Nhu cầu mua vật tư</h1><p>${esc(db.settings.planName)} · Ngày báo cáo ${esc(db.settings.asof)}</p></div><div class="actions no-print">${btn('🖨️ In danh sách','print')}${btn('⬇️ Excel','exportExcel','primary')}</div></div>${metricCards()}${panel('Danh sách đề xuất',`<div class="table-wrap"><table><thead><tr><th>Vật liệu</th><th>ĐVT</th><th>Nhu cầu</th><th>Tồn hiện tại</th><th>Tồn tối thiểu</th><th>Cần mua</th><th>Giá / ĐVT</th><th>Tiền dự kiến</th></tr></thead><tbody>${rows.map(({m,s})=>`<tr><td>${esc(m.code)} · ${esc(m.name)}</td><td>${esc(m.unit)}</td><td>${qty(s.demand)}</td><td>${qty(m.stock)}</td><td>${qty(m.minimum)}</td><td><b>${qty(s.shortage)}</b></td><td>${money(m.price)}</td><td>${money(s.purchaseCost)}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có vật liệu.</td></tr>'}<tr><th colspan="7">Tổng tiền mua dự kiến</th><th>${money(t.purchaseCost)}</th></tr></tbody></table></div><p class="note">Đề xuất này giả định toàn bộ tồn hiện tại dùng được, không có đơn hàng đang về, không tính hao hụt và không tự tạo phiếu mua.</p>`)}`}
function reports(){let t=summary();return `<div class="page-head"><div><h1>📊 Báo cáo BOM & kế hoạch</h1><p>${esc(db.settings.planName)} · ${esc(db.settings.asof)}</p></div>${btn('🖨️ In báo cáo','print')}</div>${metricCards()}${panel('Theo sản phẩm',`<div class="table-wrap"><table><thead><tr><th>Mã / tên</th><th>Số lượng</th><th>Số dòng BOM</th><th>Chi phí NVL / SP</th><th>Chi phí cả lô</th></tr></thead><tbody>${db.products.map(p=>{let s=productStats(p);return `<tr><td>${esc(p.code)} · ${esc(p.name)}</td><td>${qty(p.plan)}</td><td>${s.lines}</td><td>${money(s.unitCost)}</td><td>${money(s.batchCost)}</td></tr>`}).join('')}<tr><th>Tổng</th><th>${qty(t.units)}</th><th>${t.lines}</th><th>—</th><th>${money(t.batchCost)}</th></tr></tbody></table></div>`)}${panel('Theo vật liệu',`<div class="table-wrap"><table><thead><tr><th>Vật liệu</th><th>Nhu cầu</th><th>Thiếu cần mua</th><th>Tiền mua</th></tr></thead><tbody>${db.materials.map(m=>{let s=materialStats(m);return `<tr><td>${esc(m.code)} · ${esc(m.name)}</td><td>${qty(s.demand)} ${esc(m.unit)}</td><td>${qty(s.shortage)} ${esc(m.unit)}</td><td>${money(s.purchaseCost)}</td></tr>`}).join('')}<tr><th>Tổng tiền mua</th><th>—</th><th>—</th><th>${money(t.purchaseCost)}</th></tr></tbody></table></div>`)}${panel('Kiểm tra hoàn thiện',`<p>${t.missingBOM?`<b class="pill red">${t.missingBOM} sản phẩm có lượng kế hoạch nhưng thiếu BOM</b>`:'<span class="success">Các sản phẩm có kế hoạch đều đã có ít nhất một dòng BOM.</span>'}</p><p class="muted">Tổng nhu cầu của nhiều vật liệu có đơn vị tính khác nhau nên không cộng thành một lượng chung.</p>`)}`}
function snapshotsPage(){return `<div class="page-head"><div><h1>📌 Phiên bản kế hoạch</h1><p>Chụp lại danh mục, tồn, giá, định mức và lượng sản xuất trước khi thay đổi.</p></div>${btn('＋ Lưu bản chụp','newSnapshot','primary')}</div>${panel('Bản chụp đã lưu',db.snapshots.length?db.snapshots.slice().reverse().map(s=>{let z=summary(s.data);return `<div class="mini"><b>${esc(s.label)}</b><small>${esc(s.at.slice(0,16).replace('T',' '))} · ${z.products} SP / ${z.lines} dòng BOM · chi phí ${money(z.batchCost)} · cần mua ${money(z.purchaseCost)}</small><div class="actions">${btn('Khôi phục bản này','restoreSnapshot','small',s.id)}</div></div>`}).join(''):'<p class="muted">Chưa có bản chụp. Lưu một bản trước khi sửa giá, tồn hoặc định mức lớn.</p>')}${panel('Nhật ký thay đổi',db.audit.slice().reverse().slice(0,50).map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có thay đổi.</p>')}`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt kế hoạch</h1></div>${panel('Thông tin báo cáo',`<form id="settingsForm" class="form-grid"><label>Ngày báo cáo<input name="asof" type="date" value="${esc(db.settings.asof)}"></label><label>Tên kế hoạch<input name="planName" value="${esc(db.settings.planName)}" maxlength="120"></label><div>${btn('💾 Lưu','saveSettings','primary')}</div></form><p class="muted">Ngày báo cáo là nhãn của bản tính. App không tự tải tồn kho thực tế từ hệ thống khác.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu và chuyển máy',`<p>App lưu vào trình duyệt của thiết bị này. Gửi file HTML gốc sang máy khác không chuyển dữ liệu đã nhập. Dùng JSON hoặc HTML kèm dữ liệu để chuyển máy.</p><div class="actions">${btn('⬇️ JSON','exportJson','primary')}${btn('⬇️ HTML kèm dữ liệu','exportHtml')}${btn('⬇️ Excel 4 sheet','exportExcel')}${btn('⬆️ Nhập JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Mẫu tham chiếu',`<p>4 sản phẩm, 8 vật liệu, 20 dòng BOM. Tổng chi phí nguyên vật liệu kế hoạch 137.575.000 ₫ và tiền mua dự kiến 73.810.000 ₫. Dữ liệu mẫu dùng để thử, không phải số tồn/giá hiện tại.</p>${btn('Nạp mẫu (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ dữ liệu của app này trên trình duyệt.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn</h1></div>${panel('Quy trình',`<ol><li>Thêm sản phẩm và số lượng dự kiến.</li><li>Thêm nguyên vật liệu với đơn vị, giá tham chiếu, tồn kho, mức tồn tối thiểu.</li><li>Thêm một dòng định mức cho từng cặp sản phẩm–vật liệu.</li><li>Xem nhu cầu, thiếu cần mua và chi phí; in hoặc xuất Excel gửi bộ phận mua.</li><li>Lưu bản chụp trước khi thay đổi kế hoạch. Khôi phục nếu cần so sánh hoặc quay về dữ liệu cũ.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu để chuyển máy.</li></ol>`)}${panel('Giới hạn tính toán',`<p>Nhu cầu mỗi dòng = định mức × lượng sản xuất, làm tròn 2 chữ số thập phân. Thiếu cần mua = max(0, nhu cầu + tồn tối thiểu − tồn hiện tại). Tiền mua = thiếu × giá tham chiếu.</p><p>Định mức mẫu chưa gồm hao hụt. App không tính đơn mua đang về, tồn bị khóa, tỷ lệ phế phẩm hoặc hạch toán kế toán; người quản lý phải xác nhận đầu vào trước khi đặt mua.</p>`)}`}
function render(){let map={home:['Tổng quan',home],products:['Sản phẩm',productsPage],product:['Chi tiết sản phẩm',productDetail],materials:['Vật liệu',materialsPage],material:['Chi tiết vật liệu',materialDetail],lines:['BOM',linesPage],procurement:['Nhu cầu mua',procurement],reports:['Báo cáo',reports],snapshots:['Phiên bản',snapshotsPage],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,label,value='',type='text',options=null,readonly=false){return `<label class="${type==='textarea'?'full':''}">${label}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(value)}</textarea>`:options?`<select name="${n}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input name="${n}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''} ${readonly?'readonly':''} ${['code','name','norm'].includes(n)?'required':''}>`}</label>`}
function openModal(kind,id='',parent=''){
 let old=id?clone(kind==='product'?product(id):kind==='material'?material(id):line(id)):null;draft={kind,id,parent,before:old};let x=old||{},f='';
 if(kind==='product')f=field('code','Mã sản phẩm',x.code||'','text',null,!!id)+field('name','Tên sản phẩm',x.name||'')+field('plan','Số lượng cần sản xuất',x.plan??0,'number')+field('note','Ghi chú',x.note||'','textarea');
 if(kind==='material')f=field('code','Mã vật liệu',x.code||'','text',null,!!id)+field('name','Tên vật liệu',x.name||'')+field('unit','Đơn vị tính',x.unit||'')+field('price','Giá mua tham chiếu (₫ / ĐVT)',x.price??0,'number')+field('stock','Tồn kho hiện tại',x.stock??0,'number')+field('minimum','Tồn tối thiểu',x.minimum??0,'number')+field('note','Ghi chú',x.note||'','textarea');
 if(kind==='line'){let ps=db.products.map(p=>[p.code,p.code+' · '+p.name]),ms=db.materials.map(m=>[m.code,m.code+' · '+m.name]);if(!ps.length||!ms.length){alert('Cần tạo ít nhất một sản phẩm và một nguyên vật liệu trước.');return}f=field('productCode','Sản phẩm',x.productCode||parent||ps[0][0],'text',ps)+field('materialCode','Vật liệu',x.materialCode||ms[0][0],'text',ms)+field('norm','Định mức / 1 sản phẩm',x.norm??0,'number')+field('note','Ghi chú kỹ thuật',x.note||'','textarea')}
 if(id)f+=field('reason','Lý do sửa','', 'textarea');$('#modalTitle').textContent=kind==='product'?(id?'Sửa sản phẩm':'Thêm sản phẩm'):kind==='material'?(id?'Sửa vật liệu':'Thêm vật liệu'):(id?'Sửa định mức':'Thêm định mức');$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let kind=draft.kind,old=draft.before,backup=clone(db);if(old&&!x.reason){$('#formError').textContent='Cần ghi lý do sửa hồ sơ đã lưu.';return}
 if(kind==='product'){x.code=x.code.toUpperCase();x.plan=Number(x.plan);if(!x.code||!x.name||!Number.isInteger(x.plan)||x.plan<0||db.products.some(p=>p.code===x.code&&p.code!==old?.code)){$('#formError').textContent='Mã không trùng, tên và số lượng nguyên không âm là bắt buộc.';return}delete x.id;delete x.reason;if(old)Object.assign(product(old.code),x);else db.products.push(x);audit(old?'Sửa sản phẩm':'Thêm sản phẩm',(f.get('reason')||'')+' · '+x.name,x.code);selected=x.code;page='product'}
 else if(kind==='material'){x.code=x.code.toUpperCase();x.price=Number(x.price);x.stock=Number(x.stock);x.minimum=Number(x.minimum);if(!x.code||!x.name||!x.unit||!Number.isSafeInteger(x.price)||x.price<0||![x.stock,x.minimum].every(n=>Number.isFinite(n)&&n>=0&&round(n,2)===n)||db.materials.some(m=>m.code===x.code&&m.code!==old?.code)){$('#formError').textContent='Mã không trùng, giá nguyên không âm, tồn và mức tối thiểu tối đa 2 chữ số thập phân.';return}delete x.id;delete x.reason;if(old)Object.assign(material(old.code),x);else db.materials.push(x);audit(old?'Sửa vật liệu':'Thêm vật liệu',(f.get('reason')||'')+' · '+x.name,x.code);selected=x.code;page='material'}
 else{x.norm=Number(x.norm);if(!product(x.productCode)||!material(x.materialCode)||!Number.isFinite(x.norm)||x.norm<=0||round(x.norm,4)!==x.norm||db.lines.some(l=>l.productCode===x.productCode&&l.materialCode===x.materialCode&&l.id!==x.id)){$('#formError').textContent='Cặp sản phẩm–vật liệu phải duy nhất; định mức dương, tối đa 4 chữ số thập phân.';return}delete x.reason;if(old)Object.assign(line(x.id),x);else db.lines.push(x);audit(old?'Sửa định mức':'Thêm định mức',(f.get('reason')||'')+' · '+x.productCode+' / '+x.materialCode,x.id);selected=x.productCode;page='product'}
 let err=validate(db);if(err){db=backup;$('#formError').textContent=err;return}$('#editor').close();save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'dinh-muc-bom-sao-luu.json')}
function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'dinh-muc-bom-kem-du-lieu.html')}
const HS=['Mã sản phẩm','Tên','Lượng sản xuất','Ghi chú'],HM=['Mã vật liệu','Tên','Đơn vị','Giá mua','Tồn kho','Tồn tối thiểu','Ghi chú'],HL=['ID','Mã sản phẩm','Mã vật liệu','Định mức','Ghi chú'],HP=['Mã vật liệu','Tên','Đơn vị','Nhu cầu','Tồn hiện tại','Tồn tối thiểu','Cần mua','Giá tham chiếu','Tiền mua'];
function sheets(){return [{name:'San pham',rows:[HS,...db.products.map(p=>[p.code,p.name,p.plan,p.note])]},{name:'Vat lieu',rows:[HM,...db.materials.map(m=>[m.code,m.name,m.unit,m.price,m.stock,m.minimum,m.note])]},{name:'BOM',rows:[HL,...db.lines.map(l=>[l.id,l.productCode,l.materialCode,l.norm,l.note])]},{name:'Can mua',rows:[HP,...db.materials.map(m=>{let s=materialStats(m);return [m.code,m.name,m.unit,s.demand,m.stock,m.minimum,s.shortage,m.price,s.purchaseCost]})]}]}
function exportExcel(){download(Excel.workbook(sheets()),'dinh-muc-nguyen-vat-lieu-bom.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file);for(let [n,h] of [['San pham',HS],['Vat lieu',HM],['BOM',HL],['Can mua',HP]])if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng 4 sheet do app xuất.');x=empty();x.settings=clone(db.settings);x.products=b['San pham'].slice(1).filter(r=>r[0]).map(r=>({code:String(r[0]),name:String(r[1]),plan:Number(r[2]),note:String(r[3]||'')}));x.materials=b['Vat lieu'].slice(1).filter(r=>r[0]).map(r=>({code:String(r[0]),name:String(r[1]),unit:String(r[2]),price:Number(r[3]),stock:Number(r[4]),minimum:Number(r[5]),note:String(r[6]||'')}));x.lines=b['BOM'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),productCode:String(r[1]),materialCode:String(r[2]),norm:Number(r[3]),note:String(r[4]||'')}));let checkSource={...x,snapshots:[],audit:[]},computed=x.materials.map(m=>{let s=materialStats(m,checkSource);return [m.code,m.name,m.unit,s.demand,m.stock,m.minimum,s.shortage,m.price,s.purchaseCost]});let supplied=b['Can mua'].slice(1).filter(r=>r[0]);if(supplied.length!==computed.length||supplied.some((r,i)=>String(r[0])!==computed[i][0]||Number(r[3])!==computed[i][3]||Number(r[6])!==computed[i][6]||Number(r[8])!==computed[i][8]))throw Error('Sheet Cần mua không khớp công thức; hãy sửa ba sheet nguồn rồi xuất lại.')}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.products.length} sản phẩm, ${x.materials.length} vật liệu?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty();x.settings.planName='Mẫu định mức may mặc';for(let r of BOM_SAMPLE.sp)x.products.push({code:r[0],name:r[1],plan:r[2],note:''});for(let r of BOM_SAMPLE.nl)x.materials.push({code:r[0],name:r[1],unit:r[2],price:r[3],stock:r[4],minimum:r[5],note:''});for(let r of BOM_SAMPLE.dm)x.lines.push({id:uid(),productCode:r[0],materialCode:r[1],norm:r[2],note:''});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;
 if(k==='newProduct')openModal('product');else if(k==='editProduct')openModal('product',id);else if(k==='newMaterial')openModal('material');else if(k==='editMaterial')openModal('material',id);else if(k==='newLine')openModal('line','',id);else if(k==='editLine')openModal('line',id);
 else if(k==='openProduct'){selected=id;page='product';render()}else if(k==='openMaterial'){selected=id;page='material';render()}else if(['products','materials','lines','procurement'].includes(k)){page=k;render()}
 else if(k==='deleteProduct'){if(db.lines.some(l=>l.productCode===id)){alert('Sản phẩm đã có BOM. Xóa các dòng định mức trước.');return}let reason=prompt('Lý do xóa sản phẩm '+id+':');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}db.products=db.products.filter(p=>p.code!==id);audit('Xóa sản phẩm',reason.trim(),id);page='products';save()}
 else if(k==='deleteMaterial'){if(db.lines.some(l=>l.materialCode===id)){alert('Vật liệu đã được dùng trong BOM. Xóa dòng định mức trước.');return}let reason=prompt('Lý do xóa vật liệu '+id+':');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}db.materials=db.materials.filter(m=>m.code!==id);audit('Xóa vật liệu',reason.trim(),id);page='materials';save()}
 else if(k==='deleteLine'){let l=line(id),reason=prompt('Lý do xóa định mức '+l.productCode+' / '+l.materialCode+':');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}db.lines=db.lines.filter(x=>x.id!==id);audit('Xóa định mức',reason.trim(),id);save()}
 else if(k==='newSnapshot'){let label=prompt('Tên bản chụp kế hoạch:',db.settings.planName+' · '+today());if(label===null)return;if(!label.trim()){alert('Cần tên bản chụp.');return}db.snapshots.push({id:uid(),label:label.trim(),at:new Date().toISOString(),data:clone({products:db.products,materials:db.materials,lines:db.lines})});audit('Lưu bản chụp',label.trim());save()}
 else if(k==='restoreSnapshot'){let s=db.snapshots.find(x=>x.id===id);if(!s)return;let candidate={...db,products:clone(s.data.products),materials:clone(s.data.materials),lines:clone(s.data.lines)};let err=validate(candidate);if(err){alert('Bản chụp không hợp lệ: '+err);return}if(!confirm('Khôi phục '+s.label+'? Kế hoạch hiện tại sẽ bị thay. Nên lưu bản chụp hiện tại trước.'))return;db.products=candidate.products;db.materials=candidate.materials;db.lines=candidate.lines;audit('Khôi phục bản chụp',s.label);page='home';save()}
 else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),asof=String(f.get('asof')),planName=String(f.get('planName')).trim();if(!dateOK(asof)||!planName||planName.length>120){alert('Ngày báo cáo hoặc tên kế hoạch không hợp lệ.');return}db.settings={asof,planName};save()}
 else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let n=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(n,n)}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();
$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};
$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};
render();window.BomApp={getDB:()=>clone(db),validate,summary,lineDemand,lineCost,productStats,materialStats,loadSample,encode,decode,sheets,importFile};
</script></body></html>
