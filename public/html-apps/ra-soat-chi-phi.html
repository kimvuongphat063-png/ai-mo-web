function expensesPage(){let r=filtered();return hero('📒 Danh mục khoản chi','Mỗi chứng từ một dòng; cập nhật tiền đã trả lũy kế, không thêm lại chi phí khi trả nhiều lần.')+'<section class="card">'+toolbar()+'<p class="muted">'+r.length+' / '+db.items.length+' khoản. Chi phí hạch toán khác tổng thanh toán chứng từ gồm thuế.</p>'+table(['Mã / ngày','Đối tác / chứng từ','Nội dung / nhóm','Chi phí','Tổng chứng từ','Đã trả','Chưa trả','Phân loại','Lý do / việc cần làm',''],r.map(expenseRow))+'</section>'}
function reviewPage(){let r=rowsAt(db).filter(x=>x.inYear&&(x.risk||x.pending||x.rejected)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return hero('🗂️ Hồ sơ cần xử lý','Phân công, theo dõi hạn và bổ sung căn cứ trước khi chốt phân loại.')+'<section class="card"><div class="grid">'+metric('Khoản cần rà soát',r.filter(x=>x.risk>0).length)+metric('Chờ thanh toán',r.filter(x=>x.pending>0).length)+metric('Có phần đề xuất loại',r.filter(x=>x.rejected>0).length)+metric('Quá hạn bổ sung',r.filter(x=>x.due&&x.due<db.settings.asof&&x.risk>0).length)+'</div><p class="notice">“Cần rà soát” chưa có nghĩa là phải loại toàn bộ. Mở từng khoản để kiểm tra hóa đơn, chứng từ thanh toán, căn cứ đặc thù và số tiền đã xác định loại.</p>'+table(['Mã','Khoản chi','Phụ trách','Hạn','Cần rà soát','Theo dõi trả','Đề xuất loại','Việc cần làm',''],r.map(x=>'<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.name)+'</td><td>'+esc(x.owner||'Chưa giao')+'</td><td>'+date(x.due)+'</td><td class="num">'+money(x.risk)+'</td><td class="num">'+money(x.pending)+'</td><td class="num">'+money(x.rejected)+'</td><td>'+esc(x.reason)+'</td><td>'+edit(x)+'</td></tr>'))+'</section>'}
function dailyPage(){let map=new Map();for(let x of db.items.filter(x=>x.group===GROUPS[0]&&x.date.slice(0,4)===String(db.settings.year))){let key=x.date+'|'+x.tax,old=map.get(key)||{date:x.date,tax:x.tax,vendor:x.vendor,gross:0,cash:0,bank:0,count:0,codes:[]};old.gross+=x.gross;old.cash+=x.cash;old.bank+=x.bank;old.count++;old.codes.push(x.code);map.set(key,old)}let r=[...map.values()].sort((a,b)=>b.date.localeCompare(a.date));return hero('🧾 Mua nhiều lần cùng ngày','Cộng tổng giá trị chứng từ theo ngày và mã người bán để phát hiện trường hợp chạm ngưỡng.')+'<section class="card"><p class="notice">Nhóm này chỉ cộng các khoản “Mua hàng, dịch vụ” có cùng ngày và cùng MST/mã đối tác. Mã đối tác cần nhất quán để kết quả đúng. Ngưỡng mặc định '+money(db.settings.threshold)+'.</p>'+table(['Ngày','Đối tác / mã','Số lần','Mã khoản','Tổng chứng từ','Trả tiền mặt','Trả không tiền mặt','Tín hiệu'],r.map(x=>'<tr><td>'+date(x.date)+'</td><td>'+esc(x.vendor)+'<small class="row-note">'+esc(x.tax)+'</small></td><td>'+x.count+'</td><td>'+esc(x.codes.join(', '))+'</td><td class="num">'+money(x.gross)+'</td><td class="num">'+money(x.cash)+'</td><td class="num">'+money(x.bank)+'</td><td>'+badge({status:x.gross>=db.settings.threshold&&x.cash>0?'Cần rà soát':'Dưới ngưỡng / không tiền mặt'})+'</td></tr>'))+'</section>'}
function reportPage(){
 let g=groupTotals(db),t=totals(db),heads=['Nhóm','Số khoản','Hạch toán','Đề xuất được trừ','Theo dõi trả','Cần rà soát','Đề xuất loại'];
 let rows=g.map(x=>'<tr><td>'+esc(x.group)+'</td><td>'+x.count+'</td>'+['amount','eligible','pending','risk','rejected'].map(k=>'<td class="num">'+money(x[k])+'</td>').join('')+'</tr>');
 rows.push('<tr class="total-row"><td><b>TỔNG</b></td><td>'+t.count+'</td>'+['amount','eligible','pending','risk','rejected'].map(k=>'<td class="num"><b>'+money(t[k])+'</b></td>').join('')+'</tr>');

}function settingsPage(){let s=db.settings;return hero('⚙️ Kỳ và ngưỡng rà soát','Chọn năm, ngày đối chiếu và đơn vị; các tham số ảnh hưởng toàn bộ kết quả.')+'<section class="card"><div class="formgrid">'+field('company','Tên đơn vị','text',s.company)+field('year','Năm tính','number',s.year)+field('asof','Ngày rà soát','date',s.asof)+field('threshold','Ngưỡng kiểm tra không tiền mặt (đ)','number',s.threshold)+'</div><p><button class="btn primary" data-action="settings">Lưu cài đặt</button></p><p class="notice">Mặc định năm 2026 dùng ngưỡng tham chiếu 5.000.000 đ. Nếu chọn năm khác hoặc đổi ngưỡng, app chuyển khoản trong năm vào “Cần rà soát” cho tới khi quy tắc được xác minh, tránh dùng nhầm kết quả tự động.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & chuyển máy','Dữ liệu nhập lưu trên trình duyệt; sao lưu theo từng kỳ trước khi chỉnh lớn.')+'<section class="card"><div class="grid">'+metric('Khoản chi',db.items.length)+metric('Trong năm',totals(db).count)+metric('Ngoài kỳ',totals(db).outside)+'</div><p class="notice">File HTML gốc không tự mang dữ liệu nhập trên máy khác. Tải HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excel">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV</button></div><p class="muted">Excel gồm 4 sheet: ChiPhi, CaiDat, TongHop, CanXuLy. Nhập lại từ hai sheet dữ liệu đầu của file do app xuất.</p></section><section class="card"><h2>16 khoản mẫu gốc</h2><p>Gồm chi dưới/đúng ngưỡng, thanh toán tiền mặt, chưa trả tiền, thiếu hóa đơn, chi đặc thù, hai giao dịch cùng ngày và một khoản ngoài kỳ. Chỉ nạp khi anh chọn.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn và nguồn đối chiếu','Dùng app để phát hiện hồ sơ cần kiểm tra, không để tự quyết định thuế.')+'<section class="card"><ol><li>Chọn năm và ngày rà soát. Mẫu gốc dùng năm 2026, ngày 01/11/2026.</li><li>Mỗi hóa đơn/chứng từ hoặc khoản ghi nhận một dòng; không nhập trùng. Chi phí hạch toán không gồm phần VAT được khấu trừ, tổng thanh toán là số trên chứng từ gồm thuế.</li><li>Tiền mặt và không tiền mặt là lũy kế đã trả tới ngày rà soát. Trả nhiều lần thì cập nhật hai ô này.</li><li>Chọn “Có” cho hồ sơ chỉ sau khi đối chiếu bằng chứng. Khoản đặc thù cần ghi kết quả rà và căn cứ.</li><li>Xem Hồ sơ cần xử lý, bảng mua cùng ngày và Báo cáo. Sao lưu trước khi đổi máy hoặc nhập Excel.</li></ol><p class="notice">Ngưỡng 5 triệu và quy tắc cùng người bán trong ngày được dùng làm tín hiệu rà soát; còn trường hợp ngoại lệ, chi đặc thù và điều kiện hồ sơ phải xem theo văn bản và giao dịch thực tế.</p></section><section class="card"><h2>Văn bản đối chiếu</h2><p><a href="https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/12/320-ndcp.signed.pdf" target="_blank" rel="noopener noreferrer">Nghị định 320/2025/NĐ-CP · Điều 9–10</a></p><p><a href="https://congbao.chinhphu.vn/van-ban/thong-tu-so-20-2026-tt-btc-469144/63515.htm" target="_blank" rel="noopener noreferrer">Thông tư 20/2026/TT-BTC</a></p><p class="muted">Các liên kết chỉ để tham khảo khi có mạng; app vẫn chạy offline.</p></section>'}
function render(){let titles={dashboard:'Tổng quan',expenses:'Danh mục khoản chi',review:'Hồ sơ cần xử lý',daily:'Mua cùng ngày',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,expenses:expensesPage,review:reviewPage,daily:dailyPage,report:reportPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Rà soát chi phí')+'</b> · '+esc(titles[page])+' · Năm '+esc(db.settings.year)+'</div>'+views[page]()}
function modalField([k,l,t],x){let value=x[k]??'';if(t==='group'||t==='yes'||t==='review'){let options=t==='group'?GROUPS:t==='yes'?YES:REVIEWS;return field(k,l,'select','',options.map(z=>opt(z,z,value)).join(''))}return field(k,l,t==='money'?'number':t,value)}
function openModal(id=''){let old=db.items.find(x=>x.id===id)||{},base={code:'',date:today(),vendor:'',tax:'',invoice:'',name:'',group:GROUPS[0],amount:0,gross:0,cash:0,bank:0,proof:'Chưa rõ',business:'Chưa rõ',docs:'Chưa rõ',contract:'Chưa rõ',accept:'Chưa rõ',review:'Chưa rà soát',excluded:0,basis:'',owner:'',due:'',note:''},x={...base,...old};modal={id};$('#modalTitle').textContent=(id?'Sửa hồ sơ ':'Thêm ')+'khoản chi';$('#modalError').textContent='';let sections=[['01 · Chứng từ',['code','date','vendor','tax','invoice','name','group']],['02 · Giá trị và thanh toán',['amount','gross','cash','bank']],['03 · Điều kiện hồ sơ',['proof','business','docs','contract','accept','review']],['04 · Xử lý và phân công',['excluded','basis','owner','due','note']]];$('#modalFields').innerHTML=(id?'<p class="wide notice">'+esc(classify(old,db.items,db.settings).status)+' · '+esc(classify(old,db.items,db.settings).reason)+'</p>':'<p class="wide notice">Nhập số tiền nguyên đồng. Các ô hồ sơ “Có” cần bằng chứng thực tế.</p>')+sections.map(([h,keys])=>'<h3 class="wide section-title">'+esc(h)+'</h3>'+FIELDS.filter(f=>keys.includes(f[0])).map(f=>modalField(f,x)).join('')).join('');$('#deleteModal').hidden=!id;$('#editor').showModal()}
function closeModal(){$('#editor').close();modal=null}
function saveModal(){if(!modal)return;let old=db.items.find(x=>x.id===modal.id),x={id:old?.id||uid()};for(let[k,l,t]of FIELDS){let raw=v(k);x[k]=t==='money'?Number(raw):raw}let d=structuredClone(db);d.items=old?d.items.map(r=>r.id===old.id?x:r):[...d.items,x];if(!valid(d)){$('#modalError').textContent='Kiểm tra mã/chứng từ trùng, ngày, số tiền, các khoản trả không vượt tổng chứng từ và phần loại không vượt chi phí.';return}if(!dateOK(x.date)||!x.vendor||!x.tax||!x.invoice||!x.name){$('#modalError').textContent='Cần đủ ngày, đối tác, mã đối tác, số chứng từ và nội dung.';return}if(x.date>db.settings.asof&&!confirm('Ngày ghi nhận sau ngày rà soát sẽ vào nhóm cần kiểm tra. Vẫn lưu?'))return;db=d;closeModal();save()}
function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('ra-soat-chi-phi-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){let rows=rowsAt(db),g=groupTotals(db),t=totals(db),keys=['id',...FIELDS.map(f=>f[0])];return[{name:'ChiPhi',rows:[keys,...db.items.map(x=>keys.map(k=>x[k]??''))]},{name:'CaiDat',rows:[['key','value'],...Object.entries(db.settings)]},{name:'TongHop',rows:[['Nhóm','Số khoản','Hạch toán','Đề xuất được trừ','Theo dõi thanh toán','Cần rà soát','Đề xuất loại'],...g.map(x=>[x.group,x.count,x.amount,x.eligible,x.pending,x.risk,x.rejected]),['TỔNG',t.count,t.amount,t.eligible,t.pending,t.risk,t.rejected]]},{name:'CanXuLy',rows:[['Mã','Ngày','Đối tác','Chứng từ','Nội dung','Hạch toán','Cần rà soát','Theo dõi trả','Đề xuất loại','Nguyên nhân','Phụ trách','Hạn'],...rows.filter(x=>x.inYear&&(x.risk||x.pending||x.rejected)).map(x=>[x.code,x.date,x.vendor,x.invoice,x.name,x.amount,x.risk,x.pending,x.rejected,x.reason,x.owner,x.due])]}]}
function parsedExcel(sheets){let rows=sheets.ChiPhi,settings=sheets.CaiDat,keys=['id',...FIELDS.map(f=>f[0])];if(!Array.isArray(rows)||!Array.isArray(settings)||rows[0]?.join('|')!==keys.join('|')||settings[0]?.join('|')!=='key|value')throw Error('Excel không đúng mẫu do app xuất.');let d=blank();for(let[k,val]of settings.slice(1)){if(!Object.hasOwn(d.settings,k))continue;d.settings[k]=['year','threshold'].includes(k)?Number(val):String(val??'')}d.items=rows.slice(1).filter(r=>r.some(x=>String(x??'').trim())).map(r=>Object.fromEntries(keys.map((k,i)=>{let type=FIELDS.find(f=>f[0]===k)?.[2];return[k,type==='money'?Number(r[i]):String(r[i]??'')]})));if(!valid(d))throw Error('Excel có mã/chứng từ trùng, ngày hoặc số tiền không hợp lệ.');return d}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='ra-soat-chi-phi.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function csv(){let rows=[['Mã','Ngày','Đối tác','Mã đối tác','Chứng từ','Nội dung','Nhóm','Chi phí','Tổng chứng từ','Tiền mặt','Không tiền mặt','Chưa trả','Đề xuất được trừ','Theo dõi trả','Cần rà soát','Đề xuất loại','Lý do'],...rowsAt(db).map(x=>[x.code,x.date,x.vendor,x.tax,x.invoice,x.name,x.group,x.amount,x.gross,x.cash,x.bank,x.unpaid,x.eligible,x.pending,x.risk,x.rejected,x.reason])],cell=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};download('ra-soat-chi-phi.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-edit],[data-new],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';filter='all';render();return}if(b.dataset.edit){openModal(b.dataset.edit);return}if(b.dataset.new){openModal();return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')window.print();if(a==='backup')download('ra-soat-chi-phi.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv();if(a==='sample'&&confirm('Nạp 16 khoản mẫu sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?')){db=sample();save()}if(a==='clear'&&confirm('Xóa toàn bộ dữ liệu rà soát trên trình duyệt này?')){db=blank();save()}if(a==='settings'){let d=structuredClone(db),s=d.settings;s.company=v('company');s.year=Number(v('year'));s.asof=v('asof');s.threshold=Number(v('threshold'));if(!valid(d)){alert('Cài đặt không hợp lệ. Kiểm tra năm, ngày và ngưỡng nguyên dương.');return}if((s.year!==db.settings.year||s.asof!==db.settings.asof||s.threshold!==db.settings.threshold)&&db.items.length&&!confirm('Thay kỳ hoặc ngưỡng sẽ tính lại mọi phân loại. Tiếp tục?'))return;db=d;save()}if(a==='deleteRecord'&&modal?.id){if(!confirm('Xóa vĩnh viễn khoản chi này? Báo cáo sẽ tính lại.'))return;db.items=db.items.filter(x=>x.id!==modal.id);closeModal();save()}});
document.addEventListener('change',e=>{if(e.target.id==='filterPick'){filter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(pos,pos)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
