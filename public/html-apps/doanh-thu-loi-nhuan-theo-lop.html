 let cids=new Set();for(let r of x.costs){if(!r.id||cids.has(r.id)||!ids.has(r.classId)||!validDate(r.date)||!r.date||!Number.isSafeInteger(r.amount)||r.amount<=0||r.amount>1e12||!COSTS.includes(r.category))return 'Khoản chi không hợp lệ.';cids.add(r.id)}

}

function reportPage(){let rs=db.receipts.filter(r=>!cashPeriod||r.date.slice(0,7)===cashPeriod),cs=db.costs.filter(r=>!cashPeriod||r.date.slice(0,7)===cashPeriod),groups=[...new Set([...GROUPS,...db.classes.map(c=>c.group)])];return hero('Báo cáo theo lớp','Đối chiếu kế hoạch toàn bộ lớp với dòng tiền theo ngày giao dịch trong kỳ lọc.')+`<div class="card"><div class="toolbar"><h2>Phạm vi dòng tiền</h2><input id="cashPeriod" type="month" value="${esc(cashPeriod)}" aria-label="Tháng báo cáo" class="search" style="max-width:190px">${btn('Tất cả tháng','allPeriods')}${btn('⬇️ Excel','exportExcel','primary')}${btn('🖨️ In','print')}</div><div class="grid">${metric('Học phí dự tính · mọi lớp',money(allRevenue()))}${metric('Chi phí dự toán · mọi lớp',money(allBudget()))}${metric('Lợi nhuận dự tính · mọi lớp',money(allRevenue()-allBudget()))}${metric('Tiền thu · kỳ lọc',money(sum(rs,r=>r.amount)))}${metric('Tiền chi · kỳ lọc',money(sum(cs,r=>r.amount)))}${metric('Thu − chi · kỳ lọc',money(sum(rs,r=>r.amount)-sum(cs,r=>r.amount)))}</div><p class="note">Bộ lọc tháng chỉ áp dụng cho dòng tiền theo ngày thu/chi. Dự toán là tổng các lớp hiện có, không phân bổ doanh thu theo tháng.</p></div><div class="card"><h2>Theo lớp</h2>${table(['Lớp','Nhóm','Sĩ số','Học phí dự tính','Chi phí dự toán','Lợi nhuận dự tính','Biên','Đã thu trong kỳ','Đã chi trong kỳ'],db.classes.map(c=>`<tr><td>${esc(c.code)} · ${esc(c.name)}</td><td>${esc(c.group)}</td><td class="num">${num(c.students)}</td><td class="num">${money(revenue(c))}</td><td class="num">${money(budget(c))}</td><td class="num">${money(profit(c))}</td><td class="num">${pct(margin(c))}</td><td class="num">${money(sum(rs.filter(r=>r.classId===c.id),r=>r.amount))}</td><td class="num">${money(sum(cs.filter(r=>r.classId===c.id),r=>r.amount))}</td></tr>`),'Chưa có lớp.')}</div><div class="card"><h2>Theo nhóm môn</h2>${table(['Nhóm môn','Số lớp','Học viên','Học phí dự tính','Chi phí dự toán','Lợi nhuận dự tính'],groups.filter(g=>db.classes.some(c=>c.group===g)).map(g=>{let a=db.classes.filter(c=>c.group===g);return `<tr><td>${esc(g)}</td><td class="num">${num(a.length)}</td><td class="num">${num(sum(a,c=>c.students))}</td><td class="num">${money(sum(a,revenue))}</td><td class="num">${money(sum(a,budget))}</td><td class="num">${money(sum(a,profit))}</td></tr>`}),'Chưa có nhóm môn.')}</div>`}
function simulatePage(){let c=cls(simClass)||db.classes[0],s=c?simStudents??c.students:0,fee=c?simFee??c.fee:0,t=c?simTeacher??c.teacherBudget:0,m=c?simMaterial??c.materialBudget:0,f=c?simFacility??c.facilityBudget:0,cost=t+m+f,rev=s*fee,lai=rev-cost,be=fee?Math.ceil(cost/fee):null;return hero('Mô phỏng hòa vốn','Thử thay sĩ số, học phí và chi phí trước khi quyết định mở lớp hoặc điều chỉnh giá.')+`<div class="card"><h2>Chọn lớp và giả định</h2><div class="formgrid"><div class="field"><label for="simClass">Lớp tham chiếu</label><select id="simClass"><option value="">Chọn lớp</option>${db.classes.map(x=>`<option value="${esc(x.id)}" ${c?.id===x.id?'selected':''}>${esc(x.code)} · ${esc(x.name)}</option>`).join('')}</select></div>${field('simStudents','Sĩ số giả định',s,'number')}${field('simFee','Học phí/người',fee,'number')}${field('simTeacher','Chi phí giáo viên',t,'number')}${field('simMaterial','Chi phí tài liệu',m,'number')}${field('simFacility','Chi phí phòng học/vận hành',f,'number')}</div><div class="toolbar" style="margin-top:15px">${btn('Tính lại','recalcSim','primary')}${btn('Lấy số hiện tại','resetSim')}</div></div><div class="grid">${metric('Học phí dự tính',money(rev))}${metric('Chi phí dự toán',money(cost))}${metric('Lợi nhuận dự tính',money(lai))}${metric('Biên lợi nhuận',rev?pct(lai/rev*100):'—')}${metric('Điểm hòa vốn',be===null?'—':num(be)+' học viên')}</div><div class="hint">Điểm hòa vốn = làm tròn lên (tổng chi phí dự toán ÷ học phí một học viên). Đây là mô phỏng chi phí cố định theo lớp; chi phí tăng theo từng học viên chưa được mô hình hóa. Mô phỏng không ghi vào dữ liệu lớp.</div>`}
function settingsPage(){return hero('Cài đặt','Đặt tên trung tâm và ngưỡng cảnh báo biên lợi nhuận dự tính.')+`<div class="card"><div class="formgrid">${field('org','Tên trung tâm',db.settings.org)}${field('minMargin','Biên lợi nhuận tối thiểu mong muốn (%)',db.settings.minMargin,'number')}</div><div class="toolbar" style="margin-top:16px">${btn('Lưu cài đặt','saveSettings','primary')}</div></div><div class="hint">Báo cáo là mô hình quản trị nội bộ. App chưa phân bổ chi phí chung, thuế, khấu hao, hoàn học phí hoặc ghi nhận doanh thu kế toán theo thời gian.</div>`}
function dataPage(){return hero('Dữ liệu & sao lưu','Tải bản sao lưu và chuyển dữ liệu giữa các máy bằng file.')+`<div class="card"><h2>Xuất & nhập</h2><div class="data-actions">${btn('⬇️ Sao lưu JSON','backup','primary')}${btn('⬇️ HTML kèm dữ liệu','portable')}${btn('⬇️ Xuất Excel 4 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','restore')}${btn('⬆️ Nhập Excel','importExcel')}</div><p class="note">File Excel có 4 sheet: Lớp học, Phiếu thu, Chi phí, Nhật ký. Giữ nguyên mã ID/cột nếu muốn nhập lại. JSON/HTML là cách sao lưu đầy đủ đáng tin cậy nhất.</p></div><div class="card"><h2>Mẫu tham chiếu</h2><p>20 lớp, 305 học viên theo sĩ số nhập; học phí dự tính 538.500.000 đồng, chi phí dự toán 201.600.000 đồng, lợi nhuận dự tính 336.900.000 đồng. Mẫu không có phiếu thu hoặc chi phí thực chi.</p>${btn('Nạp 20 lớp mẫu','loadDemo')}</div><div class="card"><h2>Xóa dữ liệu trên thiết bị</h2><p>Hãy sao lưu trước. Xóa lớp, phiếu thu, chi phí, nhật ký và cài đặt trong trình duyệt hiện tại.</p>${btn('Xóa toàn bộ dữ liệu','clear','danger')}</div>`}
function guidePage(){return hero('Hướng dẫn sử dụng','Các bước để dùng app trong quản lý một khóa học thực tế.')+`<div class="card"><h2>1 · Tạo lớp</h2><p>Nhập mã, tên, nhóm môn, sĩ số hiện có, học phí mỗi học viên và ba khoản chi phí dự toán. Có thể thêm sức chứa, ngày bắt đầu/kết thúc. Sửa sĩ số, học phí hoặc dự toán cần nêu lý do; app giữ nhật ký.</p><h2>2 · Đọc kết quả dự tính</h2><p>Học phí dự tính = sĩ số × học phí. Chi phí dự toán = giáo viên + tài liệu + phòng học/vận hành. Lợi nhuận dự tính = học phí dự tính − chi phí dự toán. Điểm hòa vốn làm tròn lên số học viên.</p><h2>3 · Ghi tiền thật</h2><p>Vào Tiền thu học phí để ghi từng phiếu thu; vào Chi phí thực chi để ghi từng khoản đã trả. App không tự tạo tiền thu từ sĩ số. Thu vượt học phí dự tính bị chặn.</p><h2>4 · Xem theo lớp và báo cáo</h2><p>Trang chi tiết lớp cho thấy dự tính, số đã thu, còn dự tính chưa thu, số đã chi và nhật ký điều chỉnh. Báo cáo theo tháng chỉ lọc các khoản thu/chi theo ngày giao dịch.</p><h2>5 · Mô phỏng & sao lưu</h2><p>Dùng Mô phỏng hòa vốn để thử giá và sĩ số mà không đổi dữ liệu thật. Sao lưu JSON hoặc HTML kèm dữ liệu để chuyển máy.</p></div><div class="hint">Nguồn đối chiếu: file “Doanh thu và lợi nhuận theo lớp, theo khóa” của Thầy Đạt Tin Học. Bản này giữ đúng công thức dự toán gốc và bổ sung sổ thu, chi, nhật ký và mô phỏng. Chưa tính thuế hoặc lợi nhuận kế toán chính thức.</div>`}
const pages={dashboard:['Tổng quan',dashboard],classes:['Lớp học',classesPage],classDetail:['Chi tiết lớp',classDetail],receipts:['Tiền thu',receiptsPage],costs:['Chi phí',costsPage],report:['Báo cáo',reportPage],simulate:['Mô phỏng',simulatePage],settings:['Cài đặt',settingsPage],data:['Dữ liệu & sao lưu',dataPage],guide:['Hướng dẫn',guidePage]};
function render(){if(!pages[page])page='dashboard';$('#topTitle').textContent=pages[page][0];$('#topSub').textContent=db.settings.org||'Offline · Dữ liệu lưu trên thiết bị';$('#screen').innerHTML=pages[page][1]();$$('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')})}
function showModal(kind,id='',pref={}){draft={kind,id};let c=id&&kind==='class'?cls(id):null,r=id&&kind==='receipt'?db.receipts.find(x=>x.id===id):null,k=id&&kind==='cost'?db.costs.find(x=>x.id===id):null;let title='',html='';if(kind==='class'){title=c?'Sửa lớp/khóa':'Thêm lớp/khóa';html=field('code','Mã lớp *',c?.code||'')+field('name','Tên lớp *',c?.name||'')+field('group','Nhóm môn',c?.group||GROUPS[0],'text',GROUPS)+field('state','Tình trạng',c?.state||'Đang tuyển','text',STATES)+field('students','Sĩ số hiện có *',c?.students??0,'number')+field('capacity','Sức chứa tối đa (0 = không giới hạn)',c?.capacity??0,'number')+field('fee','Học phí mỗi học viên *',c?.fee??0,'number')+field('teacherBudget','Dự toán chi giáo viên',c?.teacherBudget??0,'number')+field('materialBudget','Dự toán tài liệu',c?.materialBudget??0,'number')+field('facilityBudget','Dự toán phòng học/vận hành',c?.facilityBudget??0,'number')+field('start','Ngày bắt đầu',c?.start||'','date')+field('end','Ngày kết thúc',c?.end||'','date')+field('note','Ghi chú',c?.note||'','textarea',null,'full')+(c?field('reason','Lý do điều chỉnh nếu đổi sĩ số, học phí hoặc dự toán','','textarea',null,'full'):'')}else if(kind==='receipt'){if(!db.classes.length){alert('Hãy tạo lớp trước khi ghi thu.');return}title=r?'Sửa phiếu thu':'Ghi thu học phí';html=field('classId','Lớp *',r?.classId||pref.classId||db.classes[0].id,'text',db.classes.map(c=>[c.id,c.code+' · '+c.name]))+field('date','Ngày thu *',r?.date||today(),'date')+field('amount','Số tiền *',r?.amount??0,'number')+field('method','Phương thức',r?.method||METHODS[0],'text',METHODS)+field('ref','Mã giao dịch/phiếu',r?.ref||'')+field('note','Ghi chú',r?.note||'','textarea',null,'full')}else if(kind==='cost'){if(!db.classes.length){alert('Hãy tạo lớp trước khi ghi chi.');return}title=k?'Sửa khoản chi':'Ghi chi phí thực tế';html=field('classId','Lớp *',k?.classId||pref.classId||db.classes[0].id,'text',db.classes.map(c=>[c.id,c.code+' · '+c.name]))+field('date','Ngày chi *',k?.date||today(),'date')+field('category','Nhóm chi phí',k?.category||COSTS[0],'text',COSTS)+field('amount','Số tiền *',k?.amount??0,'number')+field('note','Nội dung chi / chứng từ',k?.note||'','textarea',null,'full')}
$('#modalTitle').textContent=title;$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('#editor').showModal();$('#modalFields input, #modalFields select')?.focus()}
const collect=()=>Object.fromEntries($$('#modalFields [name]').map(el=>[el.name,el.value.trim()]));
function modalError(msg){$('#modalError').textContent=msg;$('#modalError').scrollIntoView({block:'nearest'})}
function saveModal(){if(!draft)return;let f=collect(),id=draft.id;if(draft.kind==='class'){let code=f.code.toUpperCase(),vals=['students','capacity','fee','teacherBudget','materialBudget','facilityBudget'];for(let key of vals)f[key]=Number(f[key]);if(!/^[A-Z0-9_-]{2,24}$/.test(code)||db.classes.some(c=>c.code===code&&c.id!==id))return modalError('Mã lớp cần 2–24 ký tự A–Z, số, _ hoặc - và không trùng.');if(!f.name||f.name.length>120||!GROUPS.includes(f.group)||!STATES.includes(f.state))return modalError('Tên lớp, nhóm hoặc tình trạng không hợp lệ.');if(vals.some(k=>!Number.isSafeInteger(f[k])||f[k]<0||f[k]>1e12)||f.capacity&&f.students>f.capacity)return modalError('Sĩ số/sức chứa/học phí/chi phí cần là số nguyên không âm; sĩ số không vượt sức chứa.');if(!validDate(f.start)||!validDate(f.end)||f.start&&f.end&&f.end<f.start)return modalError('Ngày học không hợp lệ.');let old=id?cls(id):null,changed=old&&['students','fee','teacherBudget','materialBudget','facilityBudget'].some(k=>old[k]!==f[k]);if(changed&&!f.reason)return modalError('Nhập lý do khi đổi sĩ số, học phí hoặc dự toán.');let record={id:id||uid(),code,name:f.name,group:f.group,state:f.state,students:f.students,capacity:f.capacity,fee:f.fee,teacherBudget:f.teacherBudget,materialBudget:f.materialBudget,facilityBudget:f.facilityBudget,start:f.start,end:f.end,note:f.note.slice(0,1000)};if(collected(id||'')>revenue(record))return modalError('Học phí dự tính mới thấp hơn tiền đã thu. Hãy xử lý hoàn/điều chỉnh ngoài app trước.');if(old){if(changed){let keys=['students','fee','teacherBudget','materialBudget','facilityBudget'],summary=keys.filter(k=>old[k]!==record[k]).map(k=>`${k}: ${old[k]} → ${record[k]}`).join('; ');db.changes.push({id:uid(),classId:id,at:stamp(),reason:f.reason.slice(0,500),summary})}Object.assign(old,record)}else db.classes.push(record);selectedClass=record.id;page='classDetail'}else if(draft.kind==='receipt'){let classId=f.classId,amount=Number(f.amount),r=id?db.receipts.find(x=>x.id===id):null,c=cls(classId);if(!c||!validDate(f.date)||!f.date||!METHODS.includes(f.method)||!Number.isSafeInteger(amount)||amount<=0||amount>1e12)return modalError('Lớp, ngày, phương thức hoặc số tiền không hợp lệ.');let current=collected(classId)-(r?.classId===classId?r.amount:0);if(current+amount>revenue(c))return modalError('Số thu vượt học phí dự tính còn lại của lớp.');let record={id:id||uid(),classId,date:f.date,amount,method:f.method,ref:f.ref.slice(0,100),note:f.note.slice(0,500)};if(r)Object.assign(r,record);else db.receipts.push(record);selectedClass=classId;page='classDetail'}else if(draft.kind==='cost'){let classId=f.classId,amount=Number(f.amount),r=id?db.costs.find(x=>x.id===id):null;if(!cls(classId)||!validDate(f.date)||!f.date||!COSTS.includes(f.category)||!Number.isSafeInteger(amount)||amount<=0||amount>1e12)return modalError('Lớp, ngày, nhóm hoặc số tiền không hợp lệ.');let record={id:id||uid(),classId,date:f.date,category:f.category,amount,note:f.note.slice(0,500)};if(r)Object.assign(r,record);else db.costs.push(record);selectedClass=classId;page='classDetail'}$('#editor').close();draft=null;save()}
function loadDemo(){if((db.classes.length||db.receipts.length||db.costs.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty();for(let r of CLASS_PROFIT_SAMPLE.lop)x.classes.push({id:uid(),code:r[0],name:r[1],group:r[2],state:'Đang học',students:r[3],capacity:0,fee:r[4],teacherBudget:r[5],materialBudget:r[6],facilityBudget:r[7],start:'',end:'',note:'Dữ liệu mẫu gốc'});db=x;page='dashboard';save()}

const sheetDate=v=>typeof v==='number'&&Number.isFinite(v)?new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toISOString().slice(0,10):String(v||'').trim();
function exportExcel(){let sheets=[{name:'Lop hoc',rows:[H_CLASS,...db.classes.map(c=>[c.id,c.code,c.name,c.group,c.state,c.students,c.capacity,c.fee,c.teacherBudget,c.materialBudget,c.facilityBudget,c.start,c.end,c.note])]},{name:'Phieu thu',rows:[H_RECEIPT,...db.receipts.map(r=>[r.id,r.classId,r.date,r.amount,r.method,r.ref,r.note])]},{name:'Chi phi',rows:[H_COST,...db.costs.map(r=>[r.id,r.classId,r.date,r.category,r.amount,r.note])]},{name:'Nhat ky',rows:[H_CHANGE,...db.changes.map(h=>[h.id,h.classId,h.at,h.reason,h.summary])]}];download(Excel.workbook(sheets),'doanh-thu-loi-nhuan-theo-lop.xlsx')}
function fromExcel(book){let a=book['Lop hoc'],b=book['Phieu thu'],c=book['Chi phi'],d=book['Nhat ky'];if(!a||!b||!c||!d)throw Error('Thiếu một trong bốn sheet của app.');let same=(row,head)=>head.every((x,i)=>String(row?.[i]??'')===x);if(!same(a[0],H_CLASS)||!same(b[0],H_RECEIPT)||!same(c[0],H_COST)||!same(d[0],H_CHANGE))throw Error('Tên cột Excel không khớp file do app xuất.');let x=empty();x.settings=clone(db.settings);for(let r of a.slice(1)){if(!String(r[0]||'').trim())continue;x.classes.push({id:String(r[0]),code:String(r[1]),name:String(r[2]),group:String(r[3]),state:String(r[4]),students:Number(r[5]),capacity:Number(r[6]),fee:Number(r[7]),teacherBudget:Number(r[8]),materialBudget:Number(r[9]),facilityBudget:Number(r[10]),start:sheetDate(r[11]),end:sheetDate(r[12]),note:String(r[13]||'')})}for(let r of b.slice(1)){if(!String(r[0]||'').trim())continue;x.receipts.push({id:String(r[0]),classId:String(r[1]),date:sheetDate(r[2]),amount:Number(r[3]),method:String(r[4]),ref:String(r[5]||''),note:String(r[6]||'')})}for(let r of c.slice(1)){if(!String(r[0]||'').trim())continue;x.costs.push({id:String(r[0]),classId:String(r[1]),date:sheetDate(r[2]),category:String(r[3]),amount:Number(r[4]),note:String(r[5]||'')})}for(let r of d.slice(1)){if(!String(r[0]||'').trim())continue;x.changes.push({id:String(r[0]),classId:String(r[1]),at:String(r[2]),reason:String(r[3]),summary:String(r[4]||'')})}let err=validate(x);if(err)throw Error(err);return x}
function act(name,d){if(name==='newClass')showModal('class');else if(name==='editClass')showModal('class',d.id);else if(name==='openClass'){selectedClass=d.id;page='classDetail';render()}else if(name==='goClasses'){page='classes';render()}else if(name==='deleteClass'){let c=cls(d.id);if(db.receipts.some(r=>r.classId===d.id)||db.costs.some(r=>r.classId===d.id)||db.changes.some(r=>r.classId===d.id))return alert('Lớp đã có phiếu thu, chi phí hoặc nhật ký; không thể xóa. Có thể chuyển tình trạng sang Hoàn thành/Tạm dừng.');if(confirm('Xóa lớp '+c.name+'?')){db.classes=db.classes.filter(x=>x.id!==d.id);page='classes';save()}}else if(name==='newReceipt')showModal('receipt','',{classId:d.cid||selectedClass});else if(name==='editReceipt')showModal('receipt',d.id);else if(name==='deleteReceipt'){if(confirm('Xóa phiếu thu này? Hãy đối chiếu chứng từ trước khi xóa.')){db.receipts=db.receipts.filter(r=>r.id!==d.id);save()}}else if(name==='newCost')showModal('cost','',{classId:d.cid||selectedClass});else if(name==='editCost')showModal('cost',d.id);else if(name==='deleteCost'){if(confirm('Xóa khoản chi này? Hãy đối chiếu chứng từ trước khi xóa.')){db.costs=db.costs.filter(r=>r.id!==d.id);save()}}else if(name==='clearFilters'){query='';groupFilter='';stateFilter='';render()}else if(name==='allPeriods'){cashPeriod='';render()}else if(name==='goReport'){page='report';render()}else if(name==='simulateClass'){simClass=d.id;simStudents=simFee=simTeacher=simMaterial=simFacility=null;page='simulate';render()}else if(name==='recalcSim'){simStudents=Number($('#f_simStudents').value);simFee=Number($('#f_simFee').value);simTeacher=Number($('#f_simTeacher').value);simMaterial=Number($('#f_simMaterial').value);simFacility=Number($('#f_simFacility').value);if([simStudents,simFee,simTeacher,simMaterial,simFacility].some(v=>!Number.isFinite(v)||v<0||!Number.isSafeInteger(v)))return alert('Các giá trị mô phỏng cần là số nguyên không âm.');render()}else if(name==='resetSim'){simStudents=simFee=simTeacher=simMaterial=simFacility=null;render()}else if(name==='saveSettings'){let org=$('#f_org').value.trim(),minMargin=Number($('#f_minMargin').value);if(org.length>120||!Number.isFinite(minMargin)||minMargin<0||minMargin>100)return alert('Tên trung tâm tối đa 120 ký tự; biên mong muốn từ 0 đến 100%.');db.settings={org,minMargin};save()}else if(name==='backup')backup();else if(name==='portable')portable();else if(name==='exportExcel')exportExcel();else if(name==='restore')$('#jsonFile').click();else if(name==='importExcel')$('#excelFile').click();else if(name==='loadDemo')loadDemo();else if(name==='clear'){if(confirm('Xóa toàn bộ lớp, phiếu thu, khoản chi, nhật ký và cài đặt trên thiết bị này?')){db=empty();selectedClass='';page='dashboard';save()}}else if(name==='print')window.print()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}let b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='groupFilter'){groupFilter=e.target.value;render()}else if(e.target.id==='stateFilter'){stateFilter=e.target.value;render()}else if(e.target.id==='cashPeriod'){cashPeriod=e.target.value;render()}else if(e.target.id==='simClass'){simClass=e.target.value;simStudents=simFee=simTeacher=simMaterial=simFacility=null;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let list=db.classes.filter(c=>(!query||[c.code,c.name,c.group,c.note].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')))&&(!groupFilter||c.group===groupFilter)&&(!stateFilter||c.state===stateFilter));let p=$('#screen .table-wrap');if(page==='classes'&&p)p.outerHTML=table(['Mã lớp','Lớp / nhóm','Sĩ số','Học phí/người','Học phí dự tính','Chi phí dự toán','Lợi nhuận dự tính','Hòa vốn','Đánh giá','Thao tác'],classRows(list.slice(0,200)),'Không có lớp phù hợp.') }});
$('#modalSave').addEventListener('click',saveModal);$('#modalClose').addEventListener('click',()=>$('#editor').close());$('#modalCancel').addEventListener('click',()=>$('#editor').close());$('#quickPrint').addEventListener('click',()=>window.print());
$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>15e6)throw Error('File JSON vượt 15 MB.');let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm(`Khôi phục ${x.classes.length} lớp, ${x.receipts.length} phiếu thu, ${x.costs.length} khoản chi và ${x.changes.length} nhật ký? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{let x=fromExcel(await Excel.read(f));if(!confirm(`Nhập ${x.classes.length} lớp, ${x.receipts.length} phiếu thu, ${x.costs.length} khoản chi và ${x.changes.length} nhật ký từ Excel? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
window.__CLASS_PROFIT_TEST__={empty,validate,revenue,budget,profit,margin,breakEven,collected,spent,loadDemo,fromExcel,getDB:()=>db,setDB:x=>{db=x;render()},go:p=>{page=p;render()}};
render();
</script></body></html>
