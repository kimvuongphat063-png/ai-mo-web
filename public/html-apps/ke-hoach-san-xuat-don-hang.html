function summary(){let a=db.orders.filter(o=>o.state!=='Hủy'),r={orders:db.orders.length,qty:0,made:0,remaining:0,forecastLate:0,pastDue:0,soon:0,paused:0};for(let o of a){let c=calc(o);r.qty+=o.qty;r.made+=c.made;r.remaining+=c.remaining;if(c.remaining&&c.late>0)r.forecastLate++;if(c.remaining&&c.toDue<0)r.pastDue++;if(c.remaining&&c.toDue>=0&&c.toDue<=db.settings.warnDays)r.soon++;if(o.state==='Tạm dừng')r.paused++}return r}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!Number.isInteger(x.settings.warnDays)||x.settings.warnDays<0||x.settings.warnDays>365||!Array.isArray(x.orders)||!Array.isArray(x.progress)||!Array.isArray(x.audit))return 'Cấu trúc hoặc cài đặt không hợp lệ.';
 let ids=new Set(),codes=new Set();for(let o of x.orders){if(!o.id||ids.has(o.id)||!o.code||codes.has(String(o.code).toUpperCase())||!o.product||!o.customer||!dateOK(o.received)||!dateOK(o.due)||o.due<o.received||!Number.isSafeInteger(o.qty)||o.qty<=0||!Number.isSafeInteger(o.baseDone)||o.baseDone<0||o.baseDone>o.qty||!Number.isSafeInteger(o.rate)||o.rate<=0||!['Đang làm','Tạm dừng','Hủy'].includes(o.state)||String(o.sourceRef||'').length>300||String(o.note||'').length>1200)return 'Đơn hàng không hợp lệ hoặc trùng mã.';ids.add(o.id);codes.add(String(o.code).toUpperCase())}
 let pids=new Set(),total={};for(let p of x.progress){if(!p.id||pids.has(p.id)||!ids.has(p.orderId)||!dateOK(p.date)||p.date<x.orders.find(o=>o.id===p.orderId).received||!Number.isSafeInteger(p.qty)||p.qty<=0||String(p.note||'').length>1200)return 'Nhật ký sản lượng không hợp lệ.';pids.add(p.id);total[p.orderId]=(total[p.orderId]||0)+p.qty}
 for(let o of x.orders)if(o.baseDone+(total[o.id]||0)>o.qty)return 'Sản lượng đã làm vượt số lượng đặt.';
 let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký sửa đổi không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=decode(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let err=validate(db);if(err){alert('Không lưu: '+err);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ trình duyệt đầy. Hãy tải JSON hoặc HTML kèm dữ liệu.')}render();return true}
function audit(action,reason='',orderId=''){db.audit.push({id:uid(),action,reason,orderId,at:new Date().toISOString()})}
function btn(label,act,cls='',id=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function panel(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function metrics(){let s=summary();return `<div class="metrics"><div><small>Đơn hàng</small><strong>${s.orders}</strong></div><div><small>Sản lượng đặt*</small><strong>${num(s.qty)}</strong></div><div><small>Đã hoàn thành*</small><strong>${num(s.made)}</strong></div><div><small>Còn phải làm*</small><strong>${num(s.remaining)}</strong></div><div><small>Đơn dự kiến trễ</small><strong>${s.forecastLate}</strong></div></div><p class="note">* Tổng đơn vị của các sản phẩm khác nhau chỉ để tham khảo; không cộng dồn để lập kế hoạch công suất.</p>`}
function home(){let active=db.orders.filter(o=>o.state!=='Hủy'&&calc(o).remaining>0).sort((a,b)=>a.due.localeCompare(b.due));return `<div class="hero"><span>🏭 AI MỞ · KẾ HOẠCH SẢN XUẤT</span><h1>Đơn hàng & hạn giao</h1><p>Từ số lượng còn lại và năng suất từng đơn, theo dõi ngày xong dự kiến cùng những đơn cần xử lý sớm.</p><div class="hero-actions">${btn('＋ Tạo đơn sản xuất','newOrder','primary')}${btn('📋 Xem đơn hàng','orders')}</div></div>${metrics()}${panel('🧭 Bắt đầu nhanh','<ol><li>Tạo đơn với số lượng đặt, đã làm đầu kỳ, năng suất/ngày và hạn giao.</li><li>Ghi thêm sản lượng hoàn thành qua từng lần cập nhật.</li><li>Xem đơn trễ dự kiến, gần hạn hoặc tạm dừng; mở chi tiết để xử lý.</li><li>In báo cáo, xuất Excel/JSON và sao lưu HTML kèm dữ liệu.</li></ol>')}${panel('🚨 Ưu tiên xử lý',active.length?active.slice(0,12).map(o=>{let c=calc(o),w=warnings(o);return `<div class="mini"><button class="link" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)} · ${esc(o.product)}</button><small>${esc(o.customer)} · Còn ${num(c.remaining)} · Hạn ${fmt(o.due)} · Xong dự kiến ${fmt(c.expected)}${w.length?' · ⚠️ '+esc(w.join('; ')):''}</small></div>`}).join(''):'<p class="muted">Chưa có đơn đang sản xuất. Tạo đơn mới hoặc nạp mẫu ở Dữ liệu.</p>')}`}
function filtered(){return db.orders.filter(o=>(!search||[o.code,o.customer,o.product].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))&&(!statusFilter||status(o)===statusFilter)).sort((a,b)=>a.due.localeCompare(b.due))}
function ordersPage(){let rows=filtered();return `<div class="page-head"><div><h1>📋 Đơn hàng sản xuất</h1><p>Các phép dự báo dùng ngày lịch và năng suất độc lập của từng đơn.</p></div>${btn('＋ Tạo đơn','newOrder','primary')}</div><div class="card"><div class="filters"><label>Tìm kiếm<input id="search" value="${esc(search)}" placeholder="Mã, khách hàng, sản phẩm"></label><label>Trạng thái<select id="statusFilter"><option value="">Tất cả</option>${['Đang làm','Tạm dừng','Hoàn tất','Hủy'].map(v=>`<option ${statusFilter===v?'selected':''}>${v}</option>`).join('')}</select></label></div><p class="muted">${rows.length}/${db.orders.length} đơn</p><div class="table-wrap"><table><thead><tr><th>Đơn</th><th>Khách hàng</th><th>Trạng thái</th><th>Đặt / Đã làm</th><th>Còn lại</th><th>Năng suất</th><th>Hạn giao</th><th>Dự kiến xong</th><th>Trễ</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${rows.map(o=>{let c=calc(o),w=warnings(o);return `<tr><td><button class="link" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)}</button><small>${esc(o.product)}</small></td><td>${esc(o.customer)}</td><td>${esc(status(o))}</td><td>${num(o.qty)} / ${num(c.made)}<small>${c.completion}%</small></td><td>${num(c.remaining)}</td><td>${num(o.rate)}/ngày</td><td>${fmt(o.due)}</td><td>${fmt(c.expected)}</td><td>${c.late?c.late+' ngày':'—'}</td><td>${w.length?`<span class="pill red">${w.length} cần xem</span>`:'—'}</td><td>${btn('Xem','openOrder','small',o.id)}</td></tr>`}).join('')||'<tr><td colspan="11">Chưa có đơn phù hợp.</td></tr>'}</tbody></table></div></div>`}
function detail(){let o=order(selected);if(!o){page='orders';return ordersPage()}let c=calc(o),w=warnings(o),log=progressFor(o.id).slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="page-head"><div><button class="link" data-act="orders">← Đơn hàng</button><h1>🏭 ${esc(o.code)} · ${esc(o.product)}</h1><p>${esc(o.customer)} · ${esc(status(o))}</p></div><div class="actions no-print">${btn('＋ Ghi sản lượng','newProgress','primary',o.id)}${btn('Sửa đơn','editOrder','',o.id)}${btn('Đổi trạng thái','changeState','',o.id)}${btn('🖨️ In đơn','print')}</div></div><div class="metrics"><div><small>Đặt</small><strong>${num(o.qty)}</strong></div><div><small>Đã làm</small><strong>${num(c.made)}</strong></div><div><small>Còn lại</small><strong>${num(c.remaining)}</strong></div><div><small>Tiến độ</small><strong>${c.completion}%</strong></div><div><small>Dự kiến trễ</small><strong>${c.late} ngày</strong></div></div><div class="two">${panel('📦 Kế hoạch',`<dl><dt>Ngày nhận</dt><dd>${fmt(o.received)}</dd><dt>Hạn giao</dt><dd>${fmt(o.due)}</dd><dt>Năng suất</dt><dd>${num(o.rate)} đơn vị/ngày</dd><dt>Cần thêm</dt><dd>${c.required} ngày lịch</dd><dt>Xong dự kiến</dt><dd>${fmt(c.expected)}</dd><dt>Còn đến hạn</dt><dd>${c.toDue} ngày lịch</dd></dl><p class="note">Tính từ ngày báo cáo ${fmt(db.settings.asof)}, chưa trừ ngày nghỉ và chưa chia sẻ công suất giữa nhiều đơn.</p>`)}${panel('⚠️ Việc cần xem',w.length?`<ul>${w.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'<p class="success">Không có cảnh báo theo dữ liệu hiện tại.</p>')}</div>${panel('📝 Ghi chú & nguồn',`<p>${esc(o.note||'Chưa ghi chú.')}</p><p><b>Tham chiếu:</b> ${esc(o.sourceRef||'Chưa ghi mã hồ sơ nguồn.')}</p><p><b>Đã làm đầu kỳ:</b> ${num(o.baseDone)}. Các lần cập nhật bên dưới cộng thêm vào số này.</p>`)}${panel('🧱 Nhật ký sản lượng',`<div class="actions no-print">${btn('＋ Ghi sản lượng','newProgress','primary',o.id)}</div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Sản lượng thêm</th><th>Ghi chú</th><th></th></tr></thead><tbody>${log.map(p=>`<tr><td>${fmt(p.date)}</td><td>${num(p.qty)}</td><td>${esc(p.note||'—')}</td><td class="no-print">${btn('Sửa','editProgress','small',p.id)}</td></tr>`).join('')||'<tr><td colspan="4">Chưa có lượt cập nhật; chỉ có số đã làm đầu kỳ.</td></tr>'}</tbody></table></div>`)}${panel('🕘 Nhật ký sửa đổi',db.audit.filter(a=>a.orderId===o.id).slice().reverse().map(a=>`<div class="mini"><b>${esc(a.action)}</b><small>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.reason||'—')}</small></div>`).join('')||'<p class="muted">Chưa có thay đổi.</p>')}`}
function schedule(){let rows=db.orders.filter(o=>o.state!=='Hủy'&&calc(o).remaining>0).sort((a,b)=>a.due.localeCompare(b.due));return `<div class="page-head"><div><h1>🗓️ Lịch hạn giao dự kiến</h1><p>Ưu tiên theo hạn giao. Dự báo từng đơn theo ngày lịch, không điều độ công suất xưởng.</p></div>${btn('🖨️ In lịch','print')}</div>${metrics()}${panel('Các đơn chưa hoàn thành',`<div class="table-wrap"><table><thead><tr><th>Đơn</th><th>Sản phẩm</th><th>Hạn giao</th><th>Còn ngày</th><th>Cần ngày</th><th>Dự kiến xong</th><th>Trễ dự kiến</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(o=>{let c=calc(o);return `<tr><td><button class="link" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)}</button></td><td>${esc(o.product)}</td><td>${fmt(o.due)}</td><td>${c.toDue}</td><td>${c.required}</td><td>${fmt(c.expected)}</td><td>${c.late?`<span class="pill red">${c.late} ngày</span>`:'—'}</td><td>${esc(status(o))}</td></tr>`}).join('')||'<tr><td colspan="8">Không còn đơn đang xử lý.</td></tr>'}</tbody></table></div>`)}${panel('Giải thích dự báo','<p>Ngày cần = làm tròn lên (số còn phải làm / năng suất ngày). Ngày xong = ngày báo cáo + ngày cần. Ngày trễ = max(0, ngày xong − hạn giao). Đây là dự báo từng dòng, chưa cộng năng lực máy/người giữa các đơn.</p>')}`}
function reports(){let active=db.orders.filter(o=>o.state!=='Hủy'),groups={};for(let o of active){let g=groups[o.product]??={count:0,ordered:0,made:0,remaining:0,late:0};let c=calc(o);g.count++;g.ordered+=o.qty;g.made+=c.made;g.remaining+=c.remaining;if(c.late)g.late++}let s=summary();return `<div class="page-head"><div><h1>📊 Báo cáo sản xuất</h1><p>Theo đơn và theo sản phẩm tại ngày ${fmt(db.settings.asof)}.</p></div>${btn('🖨️ In báo cáo','print')}</div>${metrics()}${panel('Theo sản phẩm',`<div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Số đơn</th><th>Số lượng đặt</th><th>Đã làm</th><th>Còn lại</th><th>Đơn dự kiến trễ</th></tr></thead><tbody>${Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'vi')).map(([name,g])=>`<tr><td>${esc(name)}</td><td>${g.count}</td><td>${num(g.ordered)}</td><td>${num(g.made)}</td><td>${num(g.remaining)}</td><td>${g.late}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có dữ liệu.</td></tr>'}</tbody></table></div>`)}${panel('Việc cần xử lý',`<p><b>${s.forecastLate}</b> đơn dự kiến trễ · <b>${s.pastDue}</b> đơn đã qua hạn · <b>${s.soon}</b> đơn sắp đến hạn · <b>${s.paused}</b> đơn tạm dừng.</p>${active.flatMap(o=>warnings(o).map(w=>`<div class="mini"><button class="link" data-act="openOrder" data-id="${esc(o.id)}">${esc(o.code)}</button><small>${esc(w)} · ${esc(o.product)}</small></div>`)).join('')||'<p class="success">Chưa có việc cần cảnh báo.</p>'}`)}${panel('Nguồn tính',`<p class="muted">Các tổng sản lượng giữa sản phẩm khác đơn vị/định mức chỉ là phép cộng tham khảo. Hãy đánh giá công suất theo xưởng và từng công đoạn trước khi cam kết hạn giao.</p>`)}`}
function scenario(){let o=order(selected)||db.orders.find(x=>x.state!=='Hủy'&&calc(x).remaining);return `<div class="page-head"><h1>🧮 Thử năng suất</h1></div>${o?panel('Kịch bản cho một đơn',`<label>Chọn đơn<select id="scenarioOrder">${db.orders.filter(x=>x.state!=='Hủy').map(x=>`<option value="${esc(x.id)}" ${x.id===o.id?'selected':''}>${esc(x.code)} · ${esc(x.product)}</option>`).join('')}</select></label><div class="form-grid"><label>Năng suất giả định (đơn vị/ngày)<input id="scenarioRate" type="number" min="1" step="1" value="${o.rate}"></label><label>Sản lượng làm thêm trước ngày báo cáo<input id="scenarioDone" type="number" min="0" step="1" value="0"></label></div>${btn('Tính kịch bản','calcScenario','primary')}<div id="scenarioResult"></div><p class="note">Chỉ mô phỏng một đơn. Không ghi vào dữ liệu và không phân bổ công suất dùng chung.</p>`):panel('Chưa có đơn','<p>Tạo ít nhất một đơn để thử kịch bản.</p>')}`}
function calcScenario(){let o=order($('#scenarioOrder').value),rate=Number($('#scenarioRate').value),more=Number($('#scenarioDone').value);if(!o||!Number.isSafeInteger(rate)||rate<=0||!Number.isSafeInteger(more)||more<0||more>calc(o).remaining){alert('Năng suất hoặc sản lượng giả định không hợp lệ.');return}let before=calc(o),remaining=before.remaining-more,required=remaining?Math.ceil(remaining/rate):0,expected=addDays(db.settings.asof,required),late=remaining?Math.max(0,days(expected,o.due)):0;$('#scenarioResult').innerHTML=`<div class="metrics" style="margin-top:20px"><div><small>Còn lại hiện tại</small><strong>${num(before.remaining)}</strong></div><div><small>Còn sau giả định</small><strong>${num(remaining)}</strong></div><div><small>Ngày cần</small><strong>${required}</strong></div><div><small>Xong dự kiến</small><strong>${fmt(expected)}</strong></div><div><small>Trễ dự kiến</small><strong>${late} ngày</strong></div></div>`}
function settings(){return `<div class="page-head"><h1>⚙️ Cài đặt dự báo</h1></div>${panel('Ngày tính và ngưỡng nhắc',`<form id="settingsForm" class="form-grid"><label>Ngày báo cáo<input name="asof" type="date" value="${db.settings.asof}"></label><label>Nhắc trước hạn (ngày lịch)<input name="warnDays" type="number" min="0" max="365" value="${db.settings.warnDays}"></label><div>${btn('💾 Lưu cài đặt','saveSettings','primary')}</div></form><p class="muted">Dự báo thay đổi theo ngày báo cáo; lịch sử sản lượng không bị sửa. Công thức dùng ngày lịch liên tiếp, chưa trừ cuối tuần và ngày nghỉ.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>💾 Dữ liệu & sao lưu</h1></div>${panel('Sao lưu / khôi phục',`<p>Dữ liệu lưu trong trình duyệt đang dùng. Sao chép file HTML gốc sang máy khác không chuyển theo dữ liệu đã nhập. Dùng JSON hoặc HTML kèm dữ liệu.</p><div class="actions">${btn('⬇️ JSON','exportJson','primary')}${btn('⬇️ HTML kèm dữ liệu','exportHtml')}${btn('⬇️ Excel 3 sheet','exportExcel')}${btn('⬆️ Nhập JSON','importJson')}${btn('⬆️ Nhập Excel','importExcel')}</div>`)}${panel('Dữ liệu tham chiếu',`<p>Mẫu gốc có 20 đơn, 85.950 đơn vị đặt, 55.710 đã làm, 30.240 còn lại. Ngày mẫu là độ lệch tương đối từ ngày nạp; chưa có nhật ký sản lượng theo ngày, nên số đã làm được ghi làm số đầu kỳ.</p>${btn('Nạp mẫu (thay dữ liệu)','loadSample','danger')}`)}${panel('Xóa dữ liệu',`<p>Xóa toàn bộ dữ liệu app này khỏi trình duyệt.</p>${btn('Xóa toàn bộ','clear','danger')}`)}`}
function guide(){return `<div class="page-head"><h1>❔ Hướng dẫn sử dụng</h1></div>${panel('Quy trình lập và theo dõi',`<ol><li>Thêm đơn hàng: mã, khách, sản phẩm, số lượng, đã làm đầu kỳ, năng suất/ngày, hạn giao.</li><li>Ghi sản lượng hoàn thành từng lần. App giữ nhật ký để đối chiếu.</li><li>Xem lịch hạn giao và cảnh báo độc lập: quá hạn, dự kiến trễ, sắp hạn, tạm dừng.</li><li>Thử năng suất cho một đơn trước khi chỉnh kế hoạch; kịch bản không ghi vào sổ.</li><li>In báo cáo và sao lưu JSON hoặc HTML kèm dữ liệu.</li></ol>`)}${panel('Công thức và giới hạn',`<p>Còn phải làm = số lượng đặt − đã làm. Tỷ lệ hoàn thành = đã làm / số lượng đặt. Ngày cần = làm tròn lên (còn phải làm / năng suất ngày). Ngày dự kiến = ngày báo cáo + ngày cần theo <b>ngày lịch</b>. Dự kiến trễ = số ngày ngày dự kiến sau hạn giao, chỉ khi còn sản lượng.</p><p>Đây là dự báo riêng từng đơn, không tự xếp lịch cho máy, ca, công nhân hoặc công suất dùng chung. Đơn tạm dừng vẫn có ngày dự báo giả định nếu chạy lại từ ngày báo cáo; app hiển thị cảnh báo tạm dừng riêng.</p>`)}`}
function render(){let map={home:['Tổng quan',home],orders:['Đơn hàng',ordersPage],detail:['Chi tiết đơn',detail],schedule:['Hạn giao',schedule],reports:['Báo cáo',reports],scenario:['Kịch bản',scenario],settings:['Cài đặt',settings],data:['Dữ liệu',dataPage],guide:['Hướng dẫn',guide]};$('#screen').innerHTML=map[page][1]();$('#topTitle').textContent=map[page][0];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function field(n,label,value='',type='text'){return `<label class="${type==='textarea'?'full':''}">${label}${type==='textarea'?`<textarea name="${n}" rows="3" maxlength="1200">${esc(value)}</textarea>`:`<input name="${n}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="1"':''} ${['code','customer','product'].includes(n)?'required':''}>`}</label>`}
function openModal(kind,id='',parentId=''){let old=id?clone(kind==='order'?order(id):db.progress.find(p=>p.id===id)):null;draft={kind,id,parentId,before:old};let x=old||{},f='';if(kind==='order'){f=field('code','Mã đơn',x.code||'')+field('customer','Khách hàng',x.customer||'')+field('product','Sản phẩm',x.product||'')+field('received','Ngày nhận',x.received||today(),'date')+field('due','Hạn giao',x.due||today(),'date')+field('qty','Số lượng đặt',x.qty??1,'number')+field('baseDone','Đã làm đầu kỳ',x.baseDone??0,'number')+field('rate','Năng suất mỗi ngày',x.rate??1,'number')+field('sourceRef','Mã hợp đồng/đơn tham chiếu',x.sourceRef||'')+field('note','Ghi chú',x.note||'','textarea')}else{f=field('date','Ngày hoàn thành',x.date||today(),'date')+field('qty','Số lượng làm thêm',x.qty??1,'number')+field('note','Ghi chú sản lượng',x.note||'','textarea')}if(id)f+=field('reason','Lý do sửa hồ sơ đã lưu','','textarea');$('#modalTitle').textContent=kind==='order'?(id?'Sửa đơn sản xuất':'Tạo đơn sản xuất'):(id?'Sửa lượt sản lượng':'Ghi sản lượng');$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
function submit(){let f=new FormData($('#itemForm')),x={id:draft.id||uid()};for(let [k,v] of f)x[k]=String(v).trim();let old=draft.before,backup=clone(db);if(old&&!x.reason){$('#formError').textContent='Cần ghi lý do sửa dữ liệu đã lưu.';return}if(draft.kind==='order'){x.code=x.code.toUpperCase();x.qty=Number(x.qty);x.baseDone=Number(x.baseDone);x.rate=Number(x.rate);x.state=old?.state||'Đang làm';if(!x.code||!x.customer||!x.product||!dateOK(x.received)||!dateOK(x.due)||x.due<x.received||!Number.isSafeInteger(x.qty)||x.qty<=0||!Number.isSafeInteger(x.baseDone)||x.baseDone<0||!Number.isSafeInteger(x.rate)||x.rate<=0||db.orders.some(o=>o.code===x.code&&o.id!==x.id)){$('#formError').textContent='Mã không trùng, khách/sản phẩm, ngày và sản lượng/năng suất hợp lệ là bắt buộc.';return}if(x.baseDone+progressFor(x.id).reduce((s,p)=>s+p.qty,0)>x.qty){$('#formError').textContent='Tổng đã làm vượt số lượng đặt.';return}if(progressFor(x.id).some(p=>p.date<x.received)){$('#formError').textContent='Ngày nhận không thể sau lượt sản lượng đã ghi.';return}delete x.reason;if(old)Object.assign(order(x.id),x);else db.orders.push(x);audit(old?'Sửa đơn':'Tạo đơn',(f.get('reason')||'')+' · '+x.code,x.id);selected=x.id}else{x.orderId=old?.orderId||draft.parentId;x.qty=Number(x.qty);let o=order(x.orderId);if(!o||o.state==='Hủy'||!dateOK(x.date)||x.date<o.received||!Number.isSafeInteger(x.qty)||x.qty<=0){$('#formError').textContent='Ngày hoàn thành phải từ ngày nhận đơn; số lượng thêm phải là số dương và đơn chưa hủy.';return}if(done(o)-(old?.qty||0)+x.qty>o.qty){$('#formError').textContent='Sản lượng cộng dồn vượt số lượng đặt.';return}delete x.reason;if(old)Object.assign(db.progress.find(p=>p.id===x.id),x);else db.progress.push(x);audit(old?'Sửa sản lượng':'Ghi sản lượng',(f.get('reason')||'')+' · '+num(x.qty)+' · '+o.code,o.id);selected=o.id}let err=validate(db);if(err){db=backup;$('#formError').textContent=err;return}$('#editor').close();page='detail';save()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJson(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'ke-hoach-san-xuat-sao-luu.json')}
function exportHtml(){let s=encode(db),h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+s+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'ke-hoach-san-xuat-kem-du-lieu.html')}
const HO=['ID','Mã đơn','Khách hàng','Sản phẩm','Ngày nhận','Hạn giao','Số lượng đặt','Đã làm đầu kỳ','Năng suất/ngày','Trạng thái','Nguồn','Ghi chú'],HP=['ID','ID đơn','Ngày','Sản lượng','Ghi chú'],HA=['ID','Hành động','Lý do','ID đơn','Thời điểm'],HS=['Ngày báo cáo','Nhắc trước hạn'];
function sheets(){return [{name:'Don hang',rows:[HO,...db.orders.map(o=>[o.id,o.code,o.customer,o.product,o.received,o.due,o.qty,o.baseDone,o.rate,o.state,o.sourceRef,o.note])]},{name:'San luong',rows:[HP,...db.progress.map(p=>[p.id,p.orderId,p.date,p.qty,p.note])]},{name:'Nhat ky',rows:[HA,...db.audit.map(a=>[a.id,a.action,a.reason,a.orderId,a.at])]},{name:'Cai dat',rows:[HS,[db.settings.asof,db.settings.warnDays]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'ke-hoach-san-xuat-don-hang.xlsx')}
async function importFile(kind,file){try{let x;if(kind==='json')x=JSON.parse(await file.text());else{let b=await Excel.read(file);for(let [n,h] of [['Don hang',HO],['San luong',HP],['Nhat ky',HA],['Cai dat',HS]])if(!b[n]||h.some((v,i)=>String(b[n][0]?.[i]??'')!==v))throw Error('Excel không đúng bốn sheet do app xuất.');x=empty();x.settings={asof:String(b['Cai dat'][1]?.[0]||''),warnDays:Number(b['Cai dat'][1]?.[1])};x.orders=b['Don hang'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),code:String(r[1]),customer:String(r[2]),product:String(r[3]),received:String(r[4]),due:String(r[5]),qty:Number(r[6]),baseDone:Number(r[7]),rate:Number(r[8]),state:String(r[9]),sourceRef:String(r[10]||''),note:String(r[11]||'')}));x.progress=b['San luong'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),orderId:String(r[1]),date:String(r[2]),qty:Number(r[3]),note:String(r[4]||'')}));x.audit=b['Nhat ky'].slice(1).filter(r=>r[0]).map(r=>({id:String(r[0]),action:String(r[1]),reason:String(r[2]||''),orderId:String(r[3]||''),at:String(r[4])}))}let err=validate(x);if(err)throw Error(err);if(!confirm(`Thay dữ liệu hiện tại bằng ${x.orders.length} đơn?`))return;db=x;page='home';save()}catch(e){alert('Không nhập được: '+e.message)}}
function loadSample(){if(!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;let x=empty(),base=today(),rel=s=>{let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};for(let r of PLAN_SAMPLE.don)x.orders.push({id:uid(),received:rel(r[0]),code:r[1],customer:r[2],product:r[3],qty:r[4],baseDone:r[5],rate:r[6],due:rel(r[7]),state:'Đang làm',sourceRef:'Mẫu nguồn '+r[1],note:'Ngày tương đối theo ngày nạp. Đã làm là số đầu kỳ mẫu gốc, chưa có nhật ký lượt sản xuất.'});let err=validate(x);if(err){alert(err);return}db=x;page='home';save()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let a=e.target.closest('[data-act]');if(!a)return;let k=a.dataset.act,id=a.dataset.id;if(k==='newOrder')openModal('order');else if(k==='editOrder')openModal('order',id);else if(k==='newProgress')openModal('progress','',id);else if(k==='editProgress'){let p=db.progress.find(p=>p.id===id);openModal('progress',id,p.orderId)}else if(k==='openOrder'){selected=id;page='detail';render()}else if(k==='orders'){page='orders';render()}else if(k==='changeState'){let o=order(id),v=prompt('Chọn trạng thái: 1. Đang làm, 2. Tạm dừng, 3. Hủy');if(v===null)return;let next={'1':'Đang làm','2':'Tạm dừng','3':'Hủy'}[v.trim()];if(!next){alert('Lựa chọn không hợp lệ.');return}let reason=prompt('Lý do đổi trạng thái:');if(reason===null)return;if(!reason.trim()){alert('Cần lý do.');return}let old=o.state;o.state=next;audit('Đổi trạng thái',old+' → '+next+' · '+reason.trim(),id);save()}else if(k==='calcScenario')calcScenario();else if(k==='saveSettings'){let f=new FormData($('#settingsForm')),asof=String(f.get('asof')),warnDays=Number(f.get('warnDays'));if(!dateOK(asof)||!Number.isInteger(warnDays)||warnDays<0||warnDays>365){alert('Ngày báo cáo hoặc số ngày nhắc không hợp lệ.');return}db.settings={asof,warnDays};save()}else if(k==='print')print();else if(k==='exportJson')exportJson();else if(k==='exportHtml')exportHtml();else if(k==='exportExcel')exportExcel();else if(k==='importJson')$('#jsonFile').click();else if(k==='importExcel')$('#excelFile').click();else if(k==='loadSample')loadSample();else if(k==='clear'){if(confirm('Xóa toàn bộ dữ liệu app này?')){db=empty();page='home';save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let n=e.target.selectionStart;render();let q=$('#search');q.focus();q.setSelectionRange(n,n)}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.id==='scenarioOrder'){selected=e.target.value;render()}});
$('#itemForm').addEventListener('submit',e=>{e.preventDefault();submit()});$('#cancelModal').onclick=()=>$('#editor').close();$('#jsonFile').onchange=e=>{if(e.target.files[0])importFile('json',e.target.files[0]);e.target.value=''};$('#excelFile').onchange=e=>{if(e.target.files[0])importFile('excel',e.target.files[0]);e.target.value=''};render();
window.ProductionApp={getDB:()=>clone(db),validate,calc,summary,warnings,done,addDays,loadSample,encode,decode,sheets,importFile};
</script></body></html>
