const order=id=>db.orders.find(x=>x.id===id);
const payout=id=>db.payouts.find(x=>x.id===id);
function save(redraw=true){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Trình duyệt không lưu được. Hãy sao lưu JSON hoặc tải HTML kèm dữ liệu.')}if(redraw)render()}
function selected(){return period(periodId)||db.periods[0]||null}
function ensurePeriod(){if(!selected()&&db.periods.length)periodId=db.periods[0].id}
function findPeriod(d){return db.periods.find(p=>p.start<=d&&d<=p.end)}
function net(o){return o.status==='Đã chốt'?Math.max(0,Number(o.value||0)-Number(o.refund||0)):0}
function ordersIn(p,saleId=''){return db.orders.filter(o=>o.date>=p.start&&o.date<=p.end&&(!saleId||o.saleId===saleId))}
function targetFor(p,s){return db.targets.find(t=>t.periodId===p.id&&t.saleId===s.id)}
function calc(p,s){
 if(p.locked&&p.snapshot){let old=p.snapshot.results.find(x=>x.saleId===s.id);if(old)return old}
 let target=targetFor(p,s)?.amount??0,orders=ordersIn(p,s.id),sales=orders.reduce((n,o)=>n+net(o),0),raw=target>0?sales/target*100:null;
 let rate=target>0?(raw>=db.settings.b3?db.settings.h3:raw>=db.settings.b2?db.settings.h2:db.settings.h1):0;
 return{saleId:s.id,code:s.code,name:s.name,target,sales,attainment:raw,rate,commission:Math.round(sales*rate/100),orders:orders.filter(o=>net(o)>0).length};
}
function rowsFor(p){return db.sales.filter(s=>s.active!==false||targetFor(p,s)||ordersIn(p,s.id).length).map(s=>calc(p,s))}
const paid=(p,s)=>db.payouts.filter(x=>x.periodId===p.id&&x.saleId===s.id).reduce((n,x)=>n+Number(x.amount||0),0);
function dueCommission(p,s){return calc(p,s).commission-paid(p,s)}
function nextOrderCode(){let n=Math.max(0,...db.orders.map(o=>/^DH\d+$/.test(o.code)?Number(o.code.slice(2)):0));return 'DH'+String(n+1).padStart(5,'0')}
function nextPeriod(){let d=new Date();for(let i=0;i<240;i++){let start=iso(new Date(d.getFullYear(),d.getMonth(),1)),end=iso(new Date(d.getFullYear(),d.getMonth()+1,0));if(!db.periods.some(p=>start<=p.end&&end>=p.start))return{name:'Tháng '+String(d.getMonth()+1)+'/'+d.getFullYear(),start,end};d.setMonth(d.getMonth()+1)}return{name:'Kỳ mới',start:today(),end:today()}}
function policyValid(s){return Number.isFinite(s.b2)&&Number.isFinite(s.b3)&&s.b2>0&&s.b2<s.b3&&s.b3<=1000&&[s.h1,s.h2,s.h3].every(x=>Number.isFinite(x)&&x>=0&&x<=100)&&s.h1<=s.h2&&s.h2<=s.h3&&Number.isFinite(s.warning)&&s.warning>=0&&s.warning<=1000}
const hero=(title,sub)=>'<div class="hero"><small>AI MỞ · QUẢN TRỊ ĐỘI SALE OFFLINE</small><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div>';
const metric=(label,value,note='')=>'<div class="metric"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(note)+'</div></div>';
const badge=(text,tone='')=>'<span class="badge '+tone+'">'+esc(text)+'</span>';
function periodPicker(){return '<label class="picker-label">Kỳ tính <select id="periodPicker">'+db.periods.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===selected()?.id?'selected':'')+'>'+esc(p.name)+' · '+date(p.start)+'–'+date(p.end)+(p.locked?' · Đã chốt':'')+'</option>').join('')+'</select></label>'}
function totalRows(p){let a=rowsFor(p),warning=p.locked?p.snapshot.policy.warning:db.settings.warning;return{target:a.reduce((n,x)=>n+x.target,0),sales:a.reduce((n,x)=>n+x.sales,0),commission:a.reduce((n,x)=>n+x.commission,0),paid:db.payouts.filter(x=>x.periodId===p.id).reduce((n,x)=>n+x.amount,0),warn:a.filter(x=>x.target>0&&x.attainment<warning).length,missing:a.filter(x=>!x.target&&x.sales>0).length}}
function dashboard(){let p=selected();if(!p)return hero('Chỉ tiêu & hoa hồng','Bắt đầu bằng kỳ tính, nhân viên và chỉ tiêu.')+'<div class="card"><h2>Chưa có kỳ tính</h2><p>Tạo kỳ, thêm nhân viên và chỉ tiêu trước khi nhập đơn đã chốt.</p><button class="btn primary" data-action="newPeriod">+ Tạo kỳ tính</button><button class="btn" data-page="data">Nạp dữ liệu mẫu</button></div>';let t=totalRows(p),results=rowsFor(p),policy=p.locked?p.snapshot.policy:db.settings,noTarget=results.filter(r=>r.sales>0&&!r.target);return hero('Chỉ tiêu & hoa hồng','Theo dõi doanh số, tỷ lệ đạt và hoa hồng theo từng kỳ.')+'<div class="card"><div class="toolbar">'+periodPicker()+'<span class="grow"></span>'+badge(p.locked?'Đã chốt kỳ':'Kỳ đang mở',p.locked?'ok':'alert')+'<button class="btn" data-page="periods">Quản lý kỳ</button></div><div class="grid metrics">'+metric('Tổng chỉ tiêu',money(t.target))+metric('Doanh số hợp lệ',money(t.sales),'Đã trừ hoàn/giảm')+metric('Hoa hồng tính',money(t.commission),'Toàn bộ doanh số theo bậc')+metric('Đã chi',money(t.paid))+metric('Còn chi',money(t.commission-t.paid))+'</div></div>'+(noTarget.length?'<p class="hint alert">'+noTarget.length+' nhân viên có doanh số nhưng chưa có chỉ tiêu. Hoa hồng để 0 và kỳ chưa thể chốt.</p>':'')+'<div class="grid two"><div class="card"><h2>Nhân viên cần chú ý</h2>'+results.filter(r=>r.target>0&&r.attainment<policy.warning).map(r=>'<div class="check"><span><b>'+esc(r.name)+'</b><small>'+esc(r.code)+' · '+money(r.sales)+' / '+money(r.target)+'</small></span>'+badge(num(r.attainment,2)+'%','loss')+'</div>').join('')+(results.some(r=>r.target>0&&r.attainment<policy.warning)?'':'<p class="muted">Không có nhân viên dưới ngưỡng cảnh báo.</p>')+'</div><div class="card"><h2>Chính sách bậc hiện tại</h2><div class="check"><span>Dưới '+num(policy.b2)+'%</span><b>'+num(policy.h1,2)+'% doanh số</b></div><div class="check"><span>Từ '+num(policy.b2)+'% đến dưới '+num(policy.b3)+'%</span><b>'+num(policy.h2,2)+'% doanh số</b></div><div class="check"><span>Từ '+num(policy.b3)+'%</span><b>'+num(policy.h3,2)+'% doanh số</b></div><p class="muted small">Kỳ đã chốt dùng kết quả đóng băng. Thay đổi cài đặt chỉ tính lại các kỳ đang mở.</p></div></div><div class="card"><div class="toolbar"><h2>Kết quả theo nhân viên</h2><span class="grow"></span><button class="btn primary" data-page="targets">Chỉ tiêu & đối soát</button></div>'+resultTable(p)+'</div>'}
function resultTable(p){let rows=rowsFor(p),policy=p.locked?p.snapshot.policy:db.settings;return rows.length?'<div class="table-wrap"><table><thead><tr><th>Nhân viên</th><th class="num">Chỉ tiêu</th><th class="num">Doanh số</th><th class="num">Đạt</th><th class="num">Tỷ lệ HH</th><th class="num">Hoa hồng</th><th class="num">Đã chi</th><th class="num">Còn chi</th><th>Ghi chú</th></tr></thead><tbody>'+rows.map(r=>{let s=sale(r.saleId),remark=!r.target&&r.sales?'Thiếu chỉ tiêu':r.target&&r.attainment<policy.warning?'Dưới ngưỡng':'—';return '<tr><td><b>'+esc(r.name)+'</b><small>'+esc(r.code)+'</small></td><td class="num">'+money(r.target)+'</td><td class="num">'+money(r.sales)+'</td><td class="num">'+(r.attainment===null?'—':num(r.attainment,2)+'%')+'</td><td class="num">'+num(r.rate,2)+'%</td><td class="num">'+money(r.commission)+'</td><td class="num">'+money(paid(p,s))+'</td><td class="num">'+money(r.commission-paid(p,s))+'</td><td>'+esc(remark)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">Chưa có nhân viên. Thêm nhân viên rồi lập chỉ tiêu.</div>'}

function dataPage(){return hero('Dữ liệu & sao lưu','Một file HTML độc lập, chạy offline và không cần API.')+'<div class="card"><h2>Sao lưu & xuất</h2><div class="toolbar"><button class="btn primary" data-action="saveHtml">Tải HTML kèm dữ liệu</button><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="exportAll">Xuất Excel toàn bộ</button><button class="btn" data-action="exportCsv">Xuất CSV đơn hàng</button></div><p class="muted">File HTML kèm dữ liệu là bản chụp; sau khi sửa, tải lại bản mới. JSON dùng để khôi phục đầy đủ liên kết và kỳ đã chốt.</p></div><div class="card"><h2>Nhập dữ liệu</h2><div class="toolbar"><label class="btn file">Khôi phục JSON<input type="file" accept=".json" data-import="backup"></label><label class="btn file">Nhập NV + chỉ tiêu<input type="file" accept=".csv,.xlsx" data-import="sales"></label><label class="btn file">Nhập đơn CSV / Excel<input type="file" accept=".csv,.xlsx" data-import="orders"></label><button class="btn" data-action="sample">Nạp mẫu 6 NV + 20 đơn</button><button class="btn danger" data-action="clear">Xóa toàn bộ</button></div><p class="hint">Nhập nhân viên theo 3 cột gốc: Mã, Họ và tên, Chỉ tiêu doanh số. Nhập đơn theo cột: Ngày chốt, Mã đơn, Mã nhân viên, Khách hàng, Giá trị đơn, Hoàn/giảm, Trạng thái. Ngày thuộc một kỳ đang mở; mã nhân viên phải có trong danh mục. Mẫu chỉ nạp khi mọi sổ đang trống.</p></div><div class="card"><h2>Giới hạn</h2><p>Dữ liệu ở trình duyệt của máy này. Không có tài khoản, phân quyền hoặc đồng bộ đa máy. Hoa hồng là số nội bộ theo chính sách anh nhập; app không tự tính thuế, bảo hiểm hoặc lập bảng lương pháp lý.</p></div>'}
function guidePage(){return hero('Hướng dẫn sử dụng','Từ nhân viên, kỳ tính và đơn hàng đến chốt kỳ và chi hoa hồng.')+'<div class="grid two"><div class="card"><h2>Quy trình 8 bước</h2><ol><li>Nhập chính sách bậc và tỷ lệ ở Cài đặt.</li><li>Thêm nhân viên với mã duy nhất.</li><li>Tạo kỳ tính theo tháng hoặc khoảng ngày tùy chọn, không chồng kỳ.</li><li>Nhập chỉ tiêu riêng cho từng nhân viên trong kỳ.</li><li>Ghi đơn đã chốt, khoản hoàn/giảm hoặc hủy; hệ thống chỉ lấy doanh số hợp lệ.</li><li>Rà kết quả và nhân viên thiếu chỉ tiêu, sau đó chốt kỳ.</li><li>Ghi nhận các khoản đã chi hoa hồng, xem số còn chi.</li><li>Xuất bảng báo cáo, sao lưu JSON hoặc HTML kèm dữ liệu.</li></ol></div><div class="card"><h2>Cách tính</h2><p>Doanh số hợp lệ = tổng(giá trị đơn − hoàn/giảm) của đơn Đã chốt trong kỳ. Đơn Hủy tính 0.</p><p>Tỷ lệ đạt = doanh số hợp lệ / chỉ tiêu × 100. Dưới bậc 2 hưởng tỷ lệ 1; từ bậc 2 đến dưới bậc 3 hưởng tỷ lệ 2; từ bậc 3 hưởng tỷ lệ 3. Hoa hồng = làm tròn(doanh số hợp lệ × tỷ lệ bậc / 100). Tỷ lệ áp dụng cho toàn bộ doanh số.</p><p>Nếu chưa có chỉ tiêu dương, hoa hồng tạm tính bằng 0 và không thể chốt kỳ. So sánh bậc bằng tỷ lệ chưa làm tròn; phần trăm trên màn hình chỉ làm tròn để đọc.</p></div></div>'}
function formField(k,label,value='',type='text',attrs=''){return '<label class="field"><span>'+esc(label)+'</span><input id="f-'+k+'" type="'+type+'" value="'+esc(value)+'" '+attrs+'></label>'}
function formSelect(k,label,opts,value){return '<label class="field"><span>'+esc(label)+'</span><select id="f-'+k+'">'+opts.map(o=>{let val=typeof o==='string'?o:o.value,lab=typeof o==='string'?o:o.label;return '<option value="'+esc(val)+'" '+(String(val)===String(value)?'selected':'')+'>'+esc(lab)+'</option>'}).join('')+'</select></label>'}
function openModal(kind,id=''){
 modalKind=kind;editingId=id;let p=selected(),body='',title='',o;
 if(!id&&(kind==='target'||kind==='order')&&!db.sales.some(s=>s.active)){alert('Hãy thêm nhân viên đang làm trước.');return}
 if(kind==='payout'&&(!p?.locked||!rowsFor(p).some(r=>r.commission>paid(p,sale(r.saleId))))){alert('Kỳ chưa chốt hoặc không còn hoa hồng để chi.');return}
 if(kind==='sale'){o=id?sale(id):{code:'S'+String(Math.max(0,...db.sales.map(s=>/^S\d+$/.test(s.code)?Number(s.code.slice(1)):0))+1).padStart(2,'0'),name:'',team:'',active:true};title=id?'Sửa nhân viên':'Thêm nhân viên';body=formField('code','Mã nhân viên *',o.code)+formField('name','Họ và tên *',o.name)+formField('team','Nhóm / bộ phận',o.team)+formSelect('active','Trạng thái',[{value:'yes',label:'Đang làm'},{value:'no',label:'Ngừng theo dõi'}],o.active?'yes':'no')}
 if(kind==='period'){o=id?period(id):nextPeriod();title=id?'Sửa kỳ tính':'Tạo kỳ tính';body=formField('name','Tên kỳ *',o.name)+formField('start','Từ ngày *',o.start,'date')+formField('end','Đến ngày *',o.end,'date')}
 if(kind==='target'){o=id?db.targets.find(t=>t.id===id):{saleId:db.sales.find(s=>s.active)?.id||'',amount:0};title=id?'Sửa chỉ tiêu':'Đặt chỉ tiêu';body=formSelect('saleId','Nhân viên *',db.sales.filter(s=>s.active||s.id===o.saleId).map(s=>({value:s.id,label:s.code+' · '+s.name})),o.saleId)+formField('amount','Chỉ tiêu doanh số (đ) *',o.amount,'number','min="1" step="1"')}
 if(kind==='order'){o=id?order(id):{code:nextOrderCode(),date:p&&p.start<=today()&&today()<=p.end?today():p?.start||today(),saleId:db.sales.find(s=>s.active)?.id||'',customer:'',value:0,refund:0,status:'Đã chốt',note:''};title=id?'Sửa đơn':'Thêm đơn';body=formField('date','Ngày chốt *',o.date,'date')+formField('code','Mã đơn *',o.code)+formSelect('saleId','Nhân viên *',db.sales.filter(s=>s.active||s.id===o.saleId).map(s=>({value:s.id,label:s.code+' · '+s.name})),o.saleId)+formField('customer','Khách hàng',o.customer)+formField('value','Giá trị đơn (đ) *',o.value,'number','min="0" step="1"')+formField('refund','Hoàn / giảm trừ (đ)',o.refund,'number','min="0" step="1"')+formSelect('status','Trạng thái',['Đã chốt','Hủy'],o.status)+'<label class="field full"><span>Ghi chú</span><textarea id="f-note">'+esc(o.note||'')+'</textarea></label>'}
 if(kind==='payout'){o={date:today(),saleId:db.sales.find(s=>s.active)?.id||'',amount:0,method:'Chuyển khoản',note:''};title='Ghi nhận chi hoa hồng';body=formField('date','Ngày chi *',o.date,'date')+formSelect('saleId','Nhân viên *',rowsFor(p).filter(r=>r.commission>paid(p,sale(r.saleId))).map(r=>({value:r.saleId,label:r.code+' · '+r.name+' · còn '+money(r.commission-paid(p,sale(r.saleId)))})),o.saleId)+formField('amount','Số tiền chi (đ) *',o.amount,'number','min="1" step="1"')+formSelect('method','Hình thức',['Chuyển khoản','Tiền mặt','Khác'],o.method)+formField('note','Ghi chú',o.note)}
 $('#modalTitle').textContent=title;$('#modalFields').innerHTML=body;$('#modalError').textContent='';$('#editor').showModal();
}
const fv=k=>$('#f-'+k)?.value.trim()??'';
function formError(msg){$('#modalError').textContent=msg}
function closeModal(){$('#editor').close();modalKind='';editingId=''}
function saveModal(){
 let kind=modalKind,id=editingId,p=selected(),error='';
 if(kind==='sale'){
  let code=fv('code'),name=fv('name'),team=fv('team'),active=fv('active')==='yes';
  if(!code||!name)error='Nhập mã và họ tên nhân viên.';
  else if(db.sales.some(s=>s.id!==id&&s.code.toLowerCase()===code.toLowerCase()))error='Mã nhân viên đã tồn tại.';
  else if(id){let s=sale(id);Object.assign(s,{code,name,team,active})}
  else if(db.sales.length>=500)error='Tối đa 500 nhân viên.';
  else db.sales.push({id:uid(),code,name,team,active});
 }
 if(kind==='period'){
  let name=fv('name'),start=fv('start'),end=fv('end');
  if(!name||!validDate(start)||!validDate(end)||end<start)error='Tên hoặc khoảng ngày không hợp lệ.';
  else if(db.periods.some(x=>x.id!==id&&start<=x.end&&end>=x.start))error='Khoảng ngày chồng với kỳ khác.';
  else if(id){let x=period(id);if(x.locked)error='Kỳ đã chốt không thể sửa.';else if(db.orders.some(o=>o.date>=x.start&&o.date<=x.end&&(o.date<start||o.date>end)))error='Có đơn nằm ngoài khoảng ngày mới.';else Object.assign(x,{name,start,end})}
  else if(db.periods.length>=200)error='Tối đa 200 kỳ.';
  else{let x={id:uid(),name,start,end,locked:false,snapshot:null};db.periods.push(x);periodId=x.id}
 }
 if(kind==='target'){
  let saleId=fv('saleId'),amount=Number(fv('amount'));
  if(!p||p.locked)error='Kỳ chưa mở.';
  else if(!sale(saleId)||!Number.isSafeInteger(amount)||amount<=0)error='Chọn nhân viên và nhập chỉ tiêu nguyên dương.';
  else if(db.targets.some(x=>x.id!==id&&x.periodId===p.id&&x.saleId===saleId))error='Nhân viên này đã có chỉ tiêu trong kỳ.';
  else if(id)Object.assign(db.targets.find(x=>x.id===id),{saleId,amount});
  else db.targets.push({id:uid(),periodId:p.id,saleId,amount});
 }
 if(kind==='order'){
  let dateValue=fv('date'),code=fv('code'),saleId=fv('saleId'),customer=fv('customer'),value=Number(fv('value')),refund=Number(fv('refund')),status=fv('status'),note=fv('note');
  let targetPeriod=findPeriod(dateValue),old=id?order(id):null,oldPeriod=old?findPeriod(old.date):null;
  if(!validDate(dateValue)||!code||!sale(saleId)||!['Đã chốt','Hủy'].includes(status))error='Ngày, mã, nhân viên hoặc trạng thái không hợp lệ.';
  else if(!Number.isSafeInteger(value)||value<0||value>1e12||!Number.isSafeInteger(refund)||refund<0||refund>value)error='Giá trị và hoàn/giảm phải là số nguyên, giảm trừ không vượt giá trị đơn.';
  else if(!targetPeriod||targetPeriod.id!==p?.id||targetPeriod.locked||oldPeriod?.locked)error='Ngày đơn phải nằm trong kỳ đang mở.';
  else if(db.orders.some(o=>o.id!==id&&o.code.toLowerCase()===code.toLowerCase()))error='Mã đơn đã tồn tại.';
  else if(id)Object.assign(old,{date:dateValue,code,saleId,customer,value,refund,status,note});
  else if(db.orders.length>=20000)error='Tối đa 20.000 đơn.';
  else db.orders.push({id:uid(),date:dateValue,code,saleId,customer,value,refund,status,note});
 }
 if(kind==='payout'){
  let dateValue=fv('date'),saleId=fv('saleId'),amount=Number(fv('amount')),method=fv('method'),note=fv('note'),s=sale(saleId);
  if(!p?.locked)error='Cần chốt kỳ trước khi ghi chi.';
  else if(!validDate(dateValue)||!s||!Number.isSafeInteger(amount)||amount<=0)error='Ngày, nhân viên hoặc số tiền chi không hợp lệ.';
  else if(amount>dueCommission(p,s))error='Số chi vượt hoa hồng còn phải trả.';
  else if(db.payouts.length>=20000)error='Tối đa 20.000 khoản chi.';
  else db.payouts.push({id:uid(),periodId:p.id,saleId,date:dateValue,amount,method,note});
 }
 if(error){formError(error);return}closeModal();save();
}
function closePeriod(){let p=selected();if(!p||p.locked)return;let rows=rowsFor(p);if(!rows.length){alert('Chưa có nhân viên trong kỳ.');return}let missing=rows.filter(r=>r.sales>0&&r.target<=0);if(missing.length){alert('Còn '+missing.length+' nhân viên có doanh số nhưng thiếu chỉ tiêu.');return}if(rows.some(r=>!Number.isSafeInteger(r.sales)||!Number.isSafeInteger(r.commission))){alert('Tổng doanh số hoặc hoa hồng vượt giới hạn tính chính xác.');return}if(!confirm('Chốt kỳ '+p.name+'? Đơn, chỉ tiêu và kết quả sẽ bị khóa.'))return;p.snapshot={at:new Date().toISOString(),policy:clone(db.settings),results:clone(rows)};p.locked=true;save()}
function reopenPeriod(){let p=selected();if(!p?.locked)return;if(db.payouts.some(x=>x.periodId===p.id)){alert('Kỳ đã có khoản chi. Hãy xóa các khoản chi trước khi mở lại.');return}if(!confirm('Mở lại kỳ '+p.name+' để sửa đơn/chỉ tiêu? Kết quả chốt cũ sẽ bị bỏ.'))return;p.locked=false;p.snapshot=null;save()}
function saleSheet(){return[['Mã nhân viên','Họ tên','Nhóm','Đang làm'],...db.sales.map(s=>[s.code,s.name,s.team,s.active?1:0])]}
function periodSheet(){return[['Tên kỳ','Từ ngày','Đến ngày','Trạng thái','Ngày chốt'],...db.periods.map(p=>[p.name,p.start,p.end,p.locked?'Đã chốt':'Đang mở',p.snapshot?.at||''])]}
function targetSheet(){return[['Kỳ','Mã nhân viên','Nhân viên','Chỉ tiêu'],...db.targets.map(t=>[period(t.periodId)?.name||'',sale(t.saleId)?.code||'',sale(t.saleId)?.name||'',t.amount])]}
function orderSheet(list=db.orders){return[['Ngày chốt','Mã đơn','Mã nhân viên','Nhân viên','Khách hàng','Giá trị đơn','Hoàn/giảm','Trạng thái','Doanh số tính HH','Kỳ','Ghi chú'],...list.map(o=>[o.date,o.code,sale(o.saleId)?.code||'',sale(o.saleId)?.name||'',o.customer,o.value,o.refund,o.status,net(o),findPeriod(o.date)?.name||'',o.note]) ]}
function resultSheet(p){return[['Mã nhân viên','Họ tên','Chỉ tiêu','Doanh số','Tỷ lệ đạt (%)','Tỷ lệ HH (%)','Hoa hồng','Đã chi','Còn chi','Số đơn'],...rowsFor(p).map(r=>[r.code,r.name,r.target,r.sales,r.attainment===null?'':Math.round(r.attainment*100)/100,r.rate,r.commission,paid(p,sale(r.saleId)),r.commission-paid(p,sale(r.saleId)),r.orders])]}
function payoutSheet(list=db.payouts){return[['Kỳ','Mã nhân viên','Ngày chi','Số tiền','Hình thức','Ghi chú'],...list.map(x=>[period(x.periodId)?.name||'',sale(x.saleId)?.code||'',x.date,x.amount,x.method,x.note])]}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadBlob(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function xlsx(name,sheets){downloadBlob(name+'.xlsx',Excel.workbook(sheets.map(([name,rows])=>({name,rows}))))}
function exportAll(){xlsx('ai-mo-hoa-hong-du-lieu',[['Nhân viên',saleSheet()],['Kỳ tính',periodSheet()],['Chỉ tiêu',targetSheet()],['Đơn hàng',orderSheet()],['Chi hoa hồng',payoutSheet()]])}
function exportReport(){let p=selected();if(!p)return;xlsx('hoa-hong-'+p.name.replace(/[^\p{L}\p{N}-]+/gu,'-'),[['Kết quả',resultSheet(p)],['Đơn hàng',orderSheet(ordersIn(p))],['Chi hoa hồng',payoutSheet(db.payouts.filter(x=>x.periodId===p.id))]])}
const csvRows=rows=>'\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
function backup(){download('ai-mo-hoa-hong-sao-luu.json','application/json;charset=utf-8',JSON.stringify(db,null,2))}
function saveHtml(){let doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(db))));download('ai-mo-hoa-hong-kem-du-lieu.html','text/html;charset=utf-8','<!doctype html>\n'+doc.outerHTML)}
function validBackup(x){
 if(!shape(x)||x.sales.length>500||x.periods.length>200||x.targets.length>100000||x.orders.length>20000||x.payouts.length>20000||!policyValid(x.settings))return false;
 let unique=(list,key)=>new Set(list.map(v=>String(v[key]||'').toLowerCase())).size===list.length;
 if(!unique(x.sales,'id')||!unique(x.sales,'code')||!unique(x.periods,'id')||!unique(x.targets,'id')||!unique(x.orders,'id')||!unique(x.orders,'code')||!unique(x.payouts,'id'))return false;
 let sid=new Set(x.sales.map(s=>s.id)),pid=new Set(x.periods.map(p=>p.id));
 for(let s of x.sales)if(!s.id||!s.code||!s.name)return false;
 for(let p of x.periods){
  if(!p.id||!p.name||!validDate(p.start)||!validDate(p.end)||p.end<p.start||p.locked&&(!p.snapshot||!Array.isArray(p.snapshot.results)||!p.snapshot.policy||!policyValid(p.snapshot.policy)))return false;
  if(p.locked&&(new Set(p.snapshot.results.map(r=>r.saleId)).size!==p.snapshot.results.length||p.snapshot.results.some(r=>!sid.has(r.saleId)||!Number.isSafeInteger(+r.commission)||+r.commission<0)))return false;
 }
 for(let i=0;i<x.periods.length;i++)for(let j=i+1;j<x.periods.length;j++)if(x.periods[i].start<=x.periods[j].end&&x.periods[i].end>=x.periods[j].start)return false;
 let targetPairs=new Set();for(let t of x.targets){let k=t.periodId+'|'+t.saleId;if(!t.id||!pid.has(t.periodId)||!sid.has(t.saleId)||targetPairs.has(k)||!Number.isSafeInteger(+t.amount)||t.amount<=0)return false;targetPairs.add(k)}
 for(let o of x.orders)if(!o.id||!o.code||!sid.has(o.saleId)||!validDate(o.date)||!x.periods.some(p=>p.start<=o.date&&o.date<=p.end)||!Number.isSafeInteger(+o.value)||o.value<0||o.value>1e12||!Number.isSafeInteger(+o.refund)||o.refund<0||o.refund>o.value||!['Đã chốt','Hủy'].includes(o.status))return false;
 let paidTotals=new Map();for(let q of x.payouts){if(!q.id||!pid.has(q.periodId)||!x.periods.find(p=>p.id===q.periodId).locked||!sid.has(q.saleId)||!validDate(q.date)||!Number.isSafeInteger(+q.amount)||q.amount<=0)return false;let k=q.periodId+'|'+q.saleId;paidTotals.set(k,(paidTotals.get(k)||0)+q.amount)}
 for(let [k,value] of paidTotals){let [pId,sId]=k.split('|'),result=x.periods.find(p=>p.id===pId)?.snapshot?.results.find(r=>r.saleId===sId);if(!result||!Number.isSafeInteger(value)||value>result.commission)return false}
 return true;
}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);return rows}
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseMoney(v){if(typeof v==='number')return v;let s=String(v??'').trim().replace(/[₫đ\s]/gi,'');if(/^\d{1,3}(?:\.\d{3})+(?:,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^\d+,\d+$/.test(s))s=s.replace(',','.');return s===''?0:Number(s)}
function parseDate(v){if(typeof v==='number'&&v>20000&&v<100000)return iso(new Date(Date.UTC(1899,11,30)+v*86400000));let s=String(v??'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
async function importSales(file){
 let p=selected();if(!p||p.locked)throw Error('Hãy chọn một kỳ đang mở để nhập chỉ tiêu.');
 let rows=file.name.toLowerCase().endsWith('.xlsx')?Object.values(await Excel.read(file))[0]||[]:parseCSV(await file.text());if(rows.length<2)throw Error('File cần tiêu đề và ít nhất một nhân viên.');
 let head=rows[0].map(norm),at={code:head.findIndex(x=>['ma','manhanvien'].includes(x)),name:head.findIndex(x=>['hovaten','ten','tennhanvien'].includes(x)),target:head.findIndex(x=>['chitieudoanhso','chitieu'].includes(x)),team:head.findIndex(x=>['nhom','bophan'].includes(x))};
 if(at.code<0||at.name<0||at.target<0)throw Error('Thiếu cột Mã, Họ và tên hoặc Chỉ tiêu doanh số.');let items=[],codes=new Set();
 for(let r of rows.slice(1)){if(!r.some(v=>String(v??'').trim()))continue;let get=k=>at[k]<0?'':r[at[k]]??'',code=String(get('code')).trim(),name=String(get('name')).trim(),amount=parseMoney(get('target')),team=String(get('team')).trim();if(!code||!name||!Number.isSafeInteger(amount)||amount<=0||amount>1e12)throw Error('Dòng '+(items.length+2)+': mã, tên hoặc chỉ tiêu không hợp lệ.');if(codes.has(code.toLowerCase()))throw Error('Mã trùng trong file: '+code);codes.add(code.toLowerCase());items.push({code,name,amount,team})}
 if(!items.length)throw Error('Không có nhân viên hợp lệ.');let fresh=items.filter(x=>!db.sales.some(s=>s.code.toLowerCase()===x.code.toLowerCase()));if(db.sales.length+fresh.length>500)throw Error('Vượt 500 nhân viên.');
 if(!confirm('Nhập '+items.length+' nhân viên/chỉ tiêu vào '+p.name+'? Mã đã có sẽ được cập nhật chỉ tiêu kỳ này.'))return;
 for(let x of items){let s=db.sales.find(z=>z.code.toLowerCase()===x.code.toLowerCase());if(!s){s={id:uid(),code:x.code,name:x.name,team:x.team,active:true};db.sales.push(s)}let t=targetFor(p,s);if(t)t.amount=x.amount;else db.targets.push({id:uid(),periodId:p.id,saleId:s.id,amount:x.amount})}save();alert('Đã nhập '+items.length+' nhân viên/chỉ tiêu.')
}
async function importOrders(file){
 let rows=file.name.toLowerCase().endsWith('.xlsx')?Object.values(await Excel.read(file))[0]||[]:parseCSV(await file.text());if(rows.length<2)throw Error('File cần tiêu đề và ít nhất một đơn.');
 let head=rows[0].map(norm),alias={date:['ngaychot','ngay'],code:['madon','madonhang'],sale:['manhanvien','nhanvien','sale'],customer:['khachhang','khach'],value:['giatridon','giatri'],refund:['hoangiam','hoangiamtru','giamtru'],status:['trangthai'],note:['ghichu']},at=Object.fromEntries(Object.entries(alias).map(([k,a])=>[k,head.findIndex(h=>a.includes(h))]));
 if(at.date<0||at.sale<0||at.value<0)throw Error('Thiếu cột ngày chốt, nhân viên hoặc giá trị đơn.');let items=[];
 for(let r of rows.slice(1)){if(!r.some(v=>String(v??'').trim()))continue;let val=k=>at[k]<0?'':r[at[k]]??'',day=parseDate(val('date')),code=String(val('code')).trim()||'DH'+String(Math.max(0,...db.orders.map(o=>/^DH\d+$/.test(o.code)?Number(o.code.slice(2)):0))+items.length+1).padStart(5,'0'),seller=String(val('sale')).trim(),s=db.sales.find(x=>x.code.toLowerCase()===seller.toLowerCase()||x.name.toLowerCase()===seller.toLowerCase()),value=parseMoney(val('value')),refund=parseMoney(val('refund')),status=String(val('status')).trim()||'Đã chốt',p=findPeriod(day);
  if(!validDate(day)||!s||!p||p.locked||!Number.isSafeInteger(value)||value<0||value>1e12||!Number.isSafeInteger(refund)||refund<0||refund>value||!['Đã chốt','Hủy'].includes(status))throw Error('Đơn '+code+': ngày, nhân viên, kỳ mở, giá trị hoặc trạng thái không hợp lệ.');
  items.push({id:uid(),code,date:day,saleId:s.id,customer:String(val('customer')).trim(),value,refund,status,note:String(val('note')).trim()});
 }
 if(!items.length)throw Error('Không có đơn hợp lệ.');if(items.length+db.orders.length>20000)throw Error('Vượt 20.000 đơn.');let codes=new Set(db.orders.map(o=>o.code.toLowerCase()));for(let o of items){if(codes.has(o.code.toLowerCase()))throw Error('Mã đơn trùng: '+o.code);codes.add(o.code.toLowerCase())}
 if(!confirm('Nhập '+items.length+' đơn hàng?'))return;db.orders.push(...items);save();alert('Đã nhập '+items.length+' đơn.');
}

 let b=e.target.closest('[data-page],[data-action],[data-edit-sale],[data-delete-sale],[data-edit-period],[data-delete-period],[data-edit-target],[data-delete-target],[data-edit-order],[data-delete-order],[data-delete-payout],[data-select-period]');if(!b)return;let d=b.dataset;

 if(d.deleteTarget){let t=db.targets.find(x=>x.id===d.deleteTarget),p=period(t.periodId);if(p?.locked)return;if(confirm('Xóa chỉ tiêu này?')){db.targets=db.targets.filter(x=>x.id!==t.id);save()}return}
 if(d.deleteOrder){let o=order(d.deleteOrder),p=findPeriod(o.date);if(p?.locked)return;if(confirm('Xóa đơn '+o.code+'?')){db.orders=db.orders.filter(x=>x.id!==o.id);save()}return}

 switch(d.action){case'newSale':openModal('sale');break;case'newPeriod':openModal('period');break;case'newTarget':openModal('target');break;case'newOrder':openModal('order');break;case'newPayout':openModal('payout');break;case'closeModal':closeModal();break;case'saveModal':saveModal();break;case'closePeriod':closePeriod();break;case'reopen':reopenPeriod();break;case'print':window.print();break;case'saveSettings':{let s=clone(db.settings);for(let el of $$('[data-setting]'))s[el.dataset.setting]=el.dataset.setting==='company'?el.value.trim():Number(el.value);if(!policyValid(s)){alert('Bậc hoặc tỷ lệ không hợp lệ.');return}db.settings=s;save();break}case'backup':backup();break;case'saveHtml':saveHtml();break;case'exportAll':exportAll();break;case'exportReport':exportReport();break;case'exportCsv':download('ai-mo-don-sale.csv','text/csv;charset=utf-8',csvRows(orderSheet()));break;case'sample':loadSample();break;case'clear':if(confirm('Xóa toàn bộ dữ liệu và cài đặt?')){db=empty();periodId='';page='dashboard';save()}break}
});
