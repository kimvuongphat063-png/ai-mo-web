const copy=x=>JSON.parse(JSON.stringify(x)),uid=()=>crypto.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('sv-SE');
const dateOK=s=>/^\d{4}-\d\d-\d\d$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s;
const offset=n=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};
const fmt=s=>s?`${s.slice(8)}/${s.slice(5,7)}/${s.slice(0,4)}`:'—',num=n=>Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:2});
const round2=n=>Math.round((n+Number.EPSILON)*100)/100,CRITERIA=[['gia','Giá cả','Giá mua, tính cạnh tranh'],['giao','Giao đúng hẹn','Độ tin cậy thời hạn'],['cl','Chất lượng','Hàng nhận đáp ứng yêu cầu'],['hotro','Hỗ trợ','Phản hồi và phối hợp']];
const empty=()=>({app:APP,version:VERSION,settings:{asof:today(),weights:{gia:25,giao:30,cl:35,hotro:10},good:3.8,pass:3.3},suppliers:[],reviews:[],actions:[],audit:[]});
let db=empty(),page='board',selected='',filter='all',query='',draft=null;
const supplier=id=>db.suppliers.find(s=>s.id===id),review=id=>db.reviews.find(r=>r.id===id),reviewsFor=id=>db.reviews.filter(r=>r.supplierId===id&&r.state==='Đã ghi'),actionsFor=id=>db.actions.filter(a=>a.supplierId===id);
function weighted(scores,weights){let total=CRITERIA.reduce((n,[k])=>n+Number(weights[k]||0),0);return total>0?round2(CRITERIA.reduce((n,[k])=>n+scores[k]*weights[k],0)/total):0}
function average(s){let r=reviewsFor(s.id);return r.length?round2(r.reduce((n,x)=>n+x.score,0)/r.length):0}
function klass(s){let r=reviewsFor(s.id);if(!r.length)return 'Chưa đánh giá';let a=average(s);return a>=db.settings.good?'Tốt':a>=db.settings.pass?'Đạt':'Cần cải thiện'}
function warn(s){return klass(s)==='Cần cải thiện'?'Cần cải thiện hoặc tìm thay thế':''}
function sourceWarn(r){return r.score<db.settings.pass?'Lần đánh giá điểm thấp':''}
function summary(){return {suppliers:db.suppliers.length,reviews:db.reviews.filter(r=>r.state==='Đã ghi').length,good:db.suppliers.filter(s=>klass(s)==='Tốt').length,pass:db.suppliers.filter(s=>klass(s)==='Đạt').length,improve:db.suppliers.filter(s=>klass(s)==='Cần cải thiện').length,low:db.reviews.filter(r=>r.state==='Đã ghi'&&r.score<db.settings.pass).length,actions:db.actions.filter(a=>a.state==='Mở').length}}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!dateOK(x.settings.asof)||!x.settings.weights||!Array.isArray(x.suppliers)||!Array.isArray(x.reviews)||!Array.isArray(x.actions)||!Array.isArray(x.audit))return 'Cấu trúc dữ liệu không hợp lệ.';if(x.suppliers.some(s=>!s||typeof s!=='object'||typeof s.id!=='string'||typeof s.code!=='string'||typeof s.name!=='string'||typeof s.nextReview!=='string')||x.reviews.some(r=>!r||typeof r!=='object'||typeof r.id!=='string'||typeof r.supplierId!=='string'||typeof r.date!=='string'||!r.scores||!r.weights)||x.actions.some(a=>!a||typeof a!=='object'||typeof a.id!=='string'||typeof a.supplierId!=='string'||typeof a.date!=='string'||typeof a.due!=='string'||typeof a.description!=='string')||x.audit.some(a=>!a||typeof a!=='object'||typeof a.id!=='string'||typeof a.at!=='string'||typeof a.action!=='string'))return 'Dòng dữ liệu không hợp lệ.';let w=x.settings.weights;if(CRITERIA.some(([k])=>!Number.isFinite(w[k])||w[k]<0||w[k]>100)||CRITERIA.reduce((n,[k])=>n+w[k],0)<=0||!Number.isFinite(x.settings.good)||!Number.isFinite(x.settings.pass)||x.settings.pass<1||x.settings.good<=x.settings.pass||x.settings.good>5)return 'Trọng số hoặc ngưỡng không hợp lệ.';
 let ids=new Set(),codes=new Set();for(let s of x.suppliers){if(!s.id||ids.has(s.id)||!s.code||codes.has(s.code.toUpperCase())||!s.name||s.nextReview&&!dateOK(s.nextReview)||String(s.note||'').length>1200)return 'Nhà cung cấp thiếu thông tin hoặc trùng mã.';ids.add(s.id);codes.add(s.code.toUpperCase())}
 let rid=new Set();for(let r of x.reviews){if(!r.id||rid.has(r.id)||!ids.has(r.supplierId)||!dateOK(r.date)||!['Đã ghi','Hủy'].includes(r.state)||!r.scores||!r.weights||CRITERIA.some(([k])=>!Number.isFinite(r.scores[k])||r.scores[k]<1||r.scores[k]>5||!Number.isFinite(r.weights[k])||r.weights[k]<0||r.weights[k]>100)||CRITERIA.reduce((n,[k])=>n+r.weights[k],0)<=0||!Number.isFinite(r.score)||Math.abs(r.score-weighted(r.scores,r.weights))>.001||String(r.note||'').length>1200||String(r.evidence||'').length>1200)return 'Lần đánh giá không hợp lệ.';rid.add(r.id)}
 let aid=new Set();for(let a of x.actions){if(!a.id||aid.has(a.id)||!ids.has(a.supplierId)||a.reviewId&&!rid.has(a.reviewId)||!dateOK(a.date)||!dateOK(a.due)||!['Mở','Hoàn tất'].includes(a.state)||!a.description||a.state==='Hoàn tất'&&!dateOK(a.doneDate))return 'Việc theo dõi không hợp lệ.';aid.add(a.id)}
 let logs=new Set();for(let a of x.audit){if(!a.id||logs.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';logs.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function embedded(){try{let b=$('#embedded-state').textContent.trim();return b==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return null}}
try{let e=embedded(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}

function log(action,detail,ref=''){db.audit.push({id:uid(),at:new Date().toISOString(),action,detail,ref})}

function ranked(){return db.suppliers.slice().sort((a,b)=>average(b)-average(a)||a.code.localeCompare(b.code))}
function board(){let t=summary(),rank=ranked(),due=db.actions.filter(a=>a.state==='Mở').sort((a,b)=>a.due.localeCompare(b.due));return `<header class="intro"><div><span class="overline">AI MỞ · BẢNG ĐIỂM ĐỐI TÁC</span><h1>Chấm rõ tiêu chí.<br>Chọn đúng nhà cung cấp.</h1><p>Mỗi lần đánh giá có bốn điểm và trọng số được lưu tại thời điểm chấm. Xem lịch sử trước khi quyết định.</p><div class="actions">${button('＋ Ghi đánh giá','newReview','primary')}${button('Xem bảng xếp hạng','suppliers')}</div></div><div class="intro-index"><small>ĐÃ ĐÁNH GIÁ</small><strong>${t.reviews}</strong><span>lần · ${t.suppliers} nhà cung cấp</span></div></header><section class="rubric"><div class="rubric-head"><div><b>01 / Khung chấm điểm</b><small>Thang 1–5 · trọng số hiện hành ${CRITERIA.reduce((n,[k])=>n+db.settings.weights[k],0)} phần</small></div>${button('Điều chỉnh trọng số','settings','small')}</div><div class="rubric-grid">${CRITERIA.map(([k,name,help],i)=>`<div><span class="rubric-no">0${i+1}</span><b>${name}</b><strong>${num(db.settings.weights[k])}%</strong><small>${help}</small></div>`).join('')}</div></section><div class="board-grid">${panel('02 / Xếp hạng nhà cung cấp',rank.length?rank.map((s,i)=>`<button class="rank-row" data-act="openSupplier" data-id="${esc(s.id)}"><span class="rank-no">${String(i+1).padStart(2,'0')}</span><span class="rank-name"><b>${esc(s.name)}</b><small>${esc(s.code)} · ${reviewsFor(s.id).length} lần</small></span><span class="rank-meter">${scoreBar(average(s))}</span><strong>${reviewsFor(s.id).length?num(average(s)):'—'}</strong>${chip(klass(s))}</button>`).join(''):'<p class="empty">Chưa có nhà cung cấp. Thêm một hồ sơ để bắt đầu.</p>','ranking')}${panel('03 / Cần theo dõi',`${db.suppliers.filter(s=>klass(s)==='Cần cải thiện').map(s=>`<div class="task"><button class="link" data-act="openSupplier" data-id="${esc(s.id)}">${esc(s.name)}</button><span>Điểm ${num(average(s))} · cần cải thiện</span></div>`).join('')}${due.slice(0,8).map(a=>`<div class="tas function reviewPage(){let r=review(selected);if(!r){page='reviews';return reviewsPage()}let s=supplier(r.supplierId);return `<div class="page-head"><div><button class="link" data-act="openSupplier" data-id="${esc(s.id)}">← ${esc(s.name)}</button><h1>Phiếu đánh giá ${fmt(r.date)}</h1><p>${esc(s.code)} · ${r.sourceRow?`Mẫu nguồn dòng ${r.sourceRow}`:'Lần chấm mới'} · ${esc(r.state)}</p></div><div class="actions">${button('＋ Việc theo dõi','newAction','primary',s.id)}${r.state==='Đã ghi'&&!r.sourceRow?button('Hủy phiếu','voidReview','danger',r.id):''}${button('In phiếu','print')}</div></div><div class="review-score"><span>ĐIỂM TỔNG HỢP</span><strong>${num(r.score)}<small> / 5</small></strong>${r.score<db.settings.pass?'<b>Điểm thấp · cần theo dõi</b>':chip(r.score>=db.settings.good?'Tốt':'Đạt')}</div><div class="criteria-grid">${CRITERIA.map(([k,name])=>`<div class="criterion"><small>${name}</small><strong>${num(r.scores[k])} / 5</strong>${scoreBar(r.scores[k])}<span>Trọng số đã lưu: ${num(r.weights[k])}%</span></div>`).join('')}</div><div class="detail-columns">${panel('Ghi nhận & chứng cứ',`<dl><dt>Người chấm</dt><dd>${esc(r.reviewer||'—')}</dd><dt>Ghi chú</dt><dd>${esc(r.note||'—')}</dd><dt>Chứng cứ / mã hồ sơ</dt><dd>${esc(r.evidence||'Chưa ghi')}</dd></dl><p class="footnote">Ghi chú mẫu gốc chỉ là dữ liệu tham chiếu, không chứng minh thực tế giao hàng hoặc chất lượng.</p>`)}${panel('Cách tính',`<p>(${CRITERIA.map(([k,name])=>`${num(r.scores[k])} × ${num(r.weights[k])}`).join(' + ')}) ÷ ${CRITERIA.reduce((n,[k])=>n+r.weights[k],0)} = <b>${num(r.score)}</b>.</p><p>Trọng số được chụp khi lập phiếu. Việc đổi trọng số hiện hành không viết lại điểm của phiếu đã ghi.</p>`)}</div>`}
function reviewsPage(){let rr=db.reviews.filter(r=>r.state==='Đã ghi').slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-head"><div><span class="overline">NHẬT KÝ CHẤM ĐIỂM</span><h1>Các lần đánh giá</h1><p>Mỗi phiếu lưu điểm và trọng số tại thời điểm chấm.</p></div>${button('＋ Ghi đánh giá','newReview','primary')}</div>${panel('Sổ đánh giá',`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Nhà cung cấp</th><th>Giá</th><th>Giao</th><th>Chất lượng</th><th>Hỗ trợ</th><th>Điểm</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${rr.map(r=>`<tr><td>${fmt(r.date)}</td><td>${esc(supplier(r.supplierId).name)}</td>${CRITERIA.map(([k])=>`<td>${num(r.scores[k])}</td>`).join('')}<td><b>${num(r.score)}</b></td><td>${r.score<db.settings.pass?'<span class="warn">Điểm thấp</span>':'—'}</td><td>${button('Xem','openReview','small',r.id)}</td></tr>`).join('')||'<tr><td colspan="9">Chưa có lần đánh giá.</td></tr>'}</tbody></table></div>`)}`}
function reportsPage(){let s=summary(),rank=ranked();return `<div class="page-head"><div><span class="overline">ĐỐI CHIẾU ĐỊNH KỲ</span><h1>Báo cáo & xếp hạng</h1><p>Số liệu từ các phiếu đang có hiệu lực.</p></div>${button('⬇ Excel','exportExcel','primary')}</div><div class="report-grid">${panel('Cơ cấu xếp loại',`<div class="class-bars">${['Tốt','Đạt','Cần cải thiện','Chưa đánh giá'].map(k=>{let n=db.suppliers.filter(t=>klass(t)===k).length;return `<div><span>${esc(k)}</span><i style="width:${s.suppliers?n/s.suppliers*100:0}%"></i><b>${n}</b></div>`}).join('')}</div>`)}${panel('Lượt cần xem',db.reviews.filter(r=>r.state==='Đã ghi'&&r.score<db.settings.pass).map(r=>`<div class="task"><button class="link" data-act="openReview" data-id="${esc(r.id)}">${esc(supplier(r.supplierId).name)}</button><span>${fmt(r.date)} · ${num(r.score)} / 5</span></div>`).join('')||'<p>Không có lượt dưới ngưỡng hiện hành.</p>')}</div>${panel('So sánh từng nhà cung cấp',`<div class="table-wrap"><table><thead><tr><th>Hạng</th><th>Mã</th><th>Nhà cung cấp</th><th>Số lượt</th><th>Điểm TB</th><th>Xếp loại</th><th>Lịch hẹn tiếp</th></tr></thead><tbody>${rank.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.code)}</td><td><button class="link" data-act="openSupplier" data-id="${esc(t.id)}">${esc(t.name)}</button></td><td>${reviewsFor(t.id).length}</td><td>${reviewsFor(t.id).length?num(average(t)):'—'}</td><td>${chip(klass(t))}</td><td>${t.nextReview?fmt(t.nextReview):'—'}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có dữ liệu.</td></tr>'}</tbody></table></div><p class="footnote">Trung bình nhà cung cấp = trung bình cộng các điểm phiếu đã làm tròn 2 chữ số. Ngưỡng xếp loại chỉ là cài đặt nội bộ.</p>`)}`}
function settingsPage(){let t=db.settings;return `<div class="page-head"><div><h1>Ngưỡng & trọng số</h1><p>Thay đổi trọng số áp dụng cho phiếu mới; điểm lịch sử được giữ nguyên.</p></div></div>${panel('Thiết lập chấm điểm',`<form id="settingsForm" class="form-grid"><label>Ngày đối chiếu<input name="asof" type="date" value="${esc(t.asof)}" required></label>${CRITERIA.map(([k,name])=>`<label>Trọng số ${name}<input name="${k}" type="number" min="0" max="100" step="1" value="${t.weights[k]}" required></label>`).join('')}<label>Điểm từ mức này là Tốt<input name="good" type="number" min="1" max="5" step="0.01" value="${t.good}" required></label><label>Điểm từ mức này là Đạt<input name="pass" type="number" min="1" max="5" step="0.01" value="${t.pass}" required></label><div class="wide">${button('Lưu thiết lập','saveSettings','primary')}</div></form><p class="footnote">Tổng trọng số có thể khác 100; app chia cho tổng thực tế. Gợi ý dùng 100 để dễ đọc tỷ lệ. Ngưỡng xếp loại sẽ phân loại lại các nhà cung cấp theo điểm trung bình hiện có.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>Dữ liệu & sao lưu</h1></div><div class="data-grid">${panel('Xuất bản sao',`<p>Dữ liệu nhập nằm trong trình duyệt trên thiết bị này. Sao chép file HTML gốc sang máy khác sẽ không mang theo dữ liệu đã nhập.</p><div class="actions">${button('⬇ JSON đầy đủ','exportJSON','primary')}${button('⬇ HTML kèm dữ liệu','exportHTML')}${button('⬇ Excel báo cáo','exportExcel')}</div>`)}${panel('Nhập & mẫu nguồn',`<p>Nhập JSON hoặc nạp mẫu sẽ thay toàn bộ dữ liệu hiện có; hãy sao lưu trước.</p><div class="actions">${button('⬆ Nhập JSON','importJSON')}${button('Nạp mẫu 6 NCC / 20 lượt','loadSample')}${button('Xóa tất cả','clearData','danger')}</div>`)}</div><p class="footnote">Phiên bản ${VERSION}: ${db.suppliers.length} nhà cung cấp, ${db.reviews.length} lượt, ${db.actions.length} việc theo dõi. Excel chỉ dùng xem/đối soát, nhập lại dùng JSON hoặc HTML kèm dữ liệu.</p>`}
function guidePage(){return `<div class="page-head"><h1>Hướng dẫn sử dụng</h1></div><div class="data-grid">${panel('Bắt đầu',`<ol><li>Thêm nhà cung cấp và nhóm hàng/dịch vụ.</li><li>Ghi một lần đánh giá: chấm bốn tiêu chí 1–5, kèm ghi chú và mã chứng cứ nếu có.</li><li>Xem điểm từng phiếu, điểm trung bình và xếp loại. Phiếu mới dùng trọng số hiện hành.</li><li>Tạo việc theo dõi khi điểm thấp, ghi người phụ trách và hạn xử lý.</li><li>Xuất JSON/HTML kèm dữ liệu định kỳ, Excel để đối chiếu.</li></ol>`)}${panel('Công thức & giới hạn',`<p><b>Điểm phiếu</b> = tổng (điểm tiêu chí × trọng số) ÷ tổng trọng số, làm tròn 2 chữ số. <b>Điểm NCC</b> = trung bình các điểm phiếu đã ghi, làm tròn 2 chữ số.</p><p>Mặc định: giá 25, giao hàng 30, chất lượng 35, hỗ trợ 10; Tốt từ 3,8; Đạt từ 3,3. Đây là ngưỡng nội bộ từ file tham chiếu, không phải kết luận chất lượng chính thức.</p><p>Dữ liệu mẫu có ghi chú văn bản nhưng không có chứng từ đính kèm. Chỉ quyết định dựa trên hồ sơ thực tế đã kiểm tra.</p>`)}</div>`}
function render(){let views={board,suppliers:suppliersPage,supplier:supplierPage,reviews:reviewsPage,review:reviewPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML=(views[page]||board)();document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page||page==='supplier'&&x.dataset.page==='suppliers'||page==='review'&&x.dataset.page==='reviews'))}
function fld(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function area(label,name,value=''){return `<label class="wide">${label}<textarea name="${name}" maxlength="1200" rows="3">${esc(value)}</textarea></label>`}
function form(kind,key=''){draft={kind,key};let title='',fields='';if(kind==='supplier'){let s=supplier(key)||{};title=key?'Sửa nhà cung cấp':'Thêm nhà cung cấp';fields=fld('Mã nhà cung cấp *','code',s.code||`NCC-${String(db.suppliers.length+1).padStart(2,'0')}`,'text','required maxlength="40"')+fld('Tên nhà cung cấp *','name',s.name,'text','required maxlength="160"')+fld('Nhóm hàng/dịch vụ','category',s.category,'text','maxlength="100"')+fld('Người phụ trách','owner',s.owner,'text','maxlength="100"')+fld('Hẹn đánh giá tiếp','nextReview',s.nextReview,'date')+area('Ghi chú hồ sơ','note',s.note)}
 else if(kind==='review'){if(!db.suppliers.length){alert('Hãy thêm nhà cung cấp trước.');return}let selectedSupplier=supplier(key)?key:db.suppliers[0].id;title='Ghi lần đánh giá';fields=`<label>Nhà cung cấp *<select name="supplierId" required>${db.suppliers.map(s=>`<option value="${esc(s.id)}" ${s.id===selectedSupplier?'selected':''}>${esc(s.code)} · ${esc(s.name)}</option>`).join('')}</select></label>`+fld('Ngày đánh giá *','date',today(),'date','required')+CRITERIA.map(([k,name])=>fld(`${name} (1–5) *`,k,3,'number','required min="1" max="5" step="0.01"')).join('')+fld('Người đánh giá','reviewer','','text','maxlength="100"')+fld('Mã chứng cứ / hồ sơ','evidence','','text','maxlength="500"')+area('Ghi chú quan sát','note','')+`<p class="wide form-hint">Trọng số hiện hành: ${CRITERIA.map(([k,name])=>`${name} ${num(db.settings.weights[k])}`).join(' · ')}. Điểm được chụp khi lưu.</p>`}
 else if(kind==='action'){let s=supplier(key);if(!s)return;title='Việc theo dõi · '+s.name;fields=fld('Ngày ghi *','date',today(),'date','required')+fld('Hạn hoàn tất *','due',offset(14),'date','required')+fld('Người phụ trách','owner',s.owner,'text','maxlength="100"')+area('Việc cần làm *','description','')}
 $('#modalTitle').textContent=title;$('#formFields').innerHTML=fields;$('#formError').textContent='';$('#editor').showModal()}
const val=(f,k)=>String(new FormData(f).get(k)||'').trim(),nval=(f,k)=>Number(val(f,k));
function submit(e){e.preventDefault();let f=e.target,{kind,key}=draft,before=copy(db);try{if(kind==='supplier'){let s=supplier(key),code=val(f,'code'),name=val(f,'name'),nextReview=val(f,'nextReview');if(!code||!name||nextReview&&!dateOK(nextReview))throw Error('Kiểm tra mã, tên và ngày hẹn.');if(db.suppliers.some(t=>t.id!==key&&t.code.toUpperCase()===code.toUpperCase()))throw Error('Mã nhà cung cấp đã có.');let obj={code,name,category:val(f,'category'),owner:val(f,'owner'),nextReview,note:val(f,'note')};if(s)Object.assign(s,obj);else{s={id:uid(),...obj,sourceRow:null};db.suppliers.push(s)}log(key?'Sửa hồ sơ':'Thêm nhà cung cấp',code,s.id);selected=s.id;page='supplier'}
 else if(kind==='review'){let sid=val(f,'supplierId'),s=supplier(sid),date=val(f,'date'),scores={};for(let [k] of CRITERIA)scores[k]=nval(f,k);if(!s||!dateOK(date)||CRITERIA.some(([k])=>!Number.isFinite(scores[k])||scores[k]<1||scores[k]>5))throw Error('Chọn nhà cung cấp, ngày và bốn điểm từ 1 đến 5.');let weights=copy(db.settings.weights),score=weighted(scores,weights),r={id:uid(),supplierId:sid,date,scores,weights,score,reviewer:val(f,'reviewer'),evidence:val(f,'evidence'),note:val(f,'note'),state:'Đã ghi',sourceRow:null};db.reviews.push(r);log('Ghi đánh giá',`${s.code}: ${num(score)} / 5`,r.id);selected=r.id;page='review'}
 else if(kind==='action'){let s=supplier(key),date=val(f,'date'),due=val(f,'due'),description=val(f,'description');if(!s||!dateOK(date)||!dateOK(due)||due<date||!description)throw Error('Cần ngày, hạn không trước ngày ghi và mô tả công việc.');let a={id:uid(),supplierId:key,reviewId:null,date,due,description,owner:val(f,'owner'),state:'Mở',doneDate:'',result:''};db.actions.push(a);log('Tạo việc theo dõi',description,a.id);selected=s.id;page='supplier'}
 let err=validate(db);if(err)throw Error(err);$('#editor').close();draft=null;save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'danh-gia-nha-cung-cap-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'danh-gia-nha-cung-cap-kem-du-lieu.html')}
function sheets(){return [{name:'NhaCungCap',rows:[['Mã','Tên','Nhóm','Người phụ trách','Số lần','Điểm TB','Xếp loại','Cảnh báo','Hẹn đánh giá'],...db.suppliers.map(s=>[s.code,s.name,s.category,s.owner,reviewsFor(s.id).length,average(s),klass(s),warn(s),s.nextReview])]},{name:'LanDanhGia',rows:[['Ngày','Mã NCC','Giá','Giao hàng','Chất lượng','Hỗ trợ','Trọng số giá','Trọng số giao','Trọng số chất lượng','Trọng số hỗ trợ','Điểm','Cảnh báo','Người chấm','Ghi chú','Chứng cứ','Trạng thái','Dòng mẫu'],...db.reviews.map(r=>[r.date,supplier(r.supplierId).code,r.scores.gia,r.scores.giao,r.scores.cl,r.scores.hotro,r.weights.gia,r.weights.giao,r.weights.cl,r.weights.hotro,r.score,sourceWarn(r),r.reviewer,r.note,r.evidence,r.state,r.sourceRow||''])]},{name:'TheoDoi',rows:[['Mã NCC','Ngày ghi','Hạn','Công việc','Người phụ trách','Tình trạng','Ngày xong','Kết quả'],...db.actions.map(a=>[supplier(a.supplierId).code,a.date,a.due,a.description,a.owner,a.state,a.doneDate,a.result])]},{name:'NhatKy',rows:[['Thời điểm','Thao tác','Nội dung','Tham chiếu'],...db.audit.map(a=>[a.at,a.action,a.detail,a.ref])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Giá','Giao','Chất lượng','Hỗ trợ','Tốt từ','Đạt từ'],[db.settings.asof,db.settings.weights.gia,db.settings.weights.giao,db.settings.weights.cl,db.settings.weights.hotro,db.settings.good,db.settings.pass]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'danh-gia-nha-cung-cap.xlsx')}
function sampleData(){let x=empty();for(let [i,row] of SUPPLIER_SAMPLE.ncc.entries())x.suppliers.push({id:uid(),code:row[0],name:row[1],category:'',owner:'',nextReview:'',note:'Hồ sơ mẫu từ file gốc.',sourceRow:i+1});for(let [i,row] of SUPPLIER_SAMPLE.dg.entries()){let [d,code,gia,giao,cl,hotro,note]=row,s=x.suppliers.find(s=>s.code===code),scores={gia,giao,cl,hotro},weights=copy(x.settings.weights);x.reviews.push({id:uid(),supplierId:s.id,date:offset(Number(d.slice(1))),scores,weights,score:weighted(scores,weights),reviewer:'',evidence:'',note:note||'',state:'Đã ghi',sourceRow:i+1})}return x}
function act(action,key=''){if(['board','suppliers','reviews','reports','settings','data','guide'].includes(action)){page=action;render();return}if(action==='openSupplier'){selected=key;page='supplier';render();return}if(action==='openReview'){selected=key;page='review';render();return}if(action==='newSupplier'||action==='editSupplier')return form('supplier',action==='editSupplier'?key:'');if(action==='newReview')return form('review',key);if(action==='newAction')return form('action',key);if(action==='print')return print();if(action==='closeAction'){let a=db.actions.find(x=>x.id===key);if(!a||a.state!=='Mở')return;let result=prompt('Kết quả theo dõi (bắt buộc):');if(!result?.trim())return;a.state='Hoàn tất';a.doneDate=today();a.result=result.trim();log('Hoàn tất theo dõi',result.trim(),a.id);save();return}if(action==='voidReview'){let r=review(key);if(!r||r.sourceRow)return alert('Phiếu mẫu gốc được giữ để đối chiếu.');let reason=prompt('Lý do hủy phiếu (bắt buộc):');if(!reason?.trim())return;r.state='Hủy';log('Hủy phiếu',reason.trim(),r.id);selected=r.supplierId;page='supplier';save();return}
 if(action==='saveSettings'){let f=$('#settingsForm'),weights={};for(let [k] of CRITERIA)weights[k]=nval(f,k);let asof=val(f,'asof'),good=nval(f,'good'),pass=nval(f,'pass');if(!dateOK(asof)||CRITERIA.some(([k])=>!Number.isFinite(weights[k])||weights[k]<0||weights[k]>100)||CRITERIA.reduce((n,[k])=>n+weights[k],0)<=0||!Number.isFinite(good)||!Number.isFinite(pass)||pass<1||good<=pass||good>5)return alert('Kiểm tra ngày, trọng số và ngưỡng điểm.');db.settings={asof,weights,good,pass};log('Đổi thiết lập','Trọng số/điểm xếp loại cập nhật');save();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if((db.suppliers.length||db.reviews.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện có. Tiếp tục?'))return;let x=sampleData(),e=validate(x);if(e)return alert('Mẫu không hợp lệ: '+e);db=x;page='board';save();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu trên trình duyệt này?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='board';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submit);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm('Nhập JSON thay toàn bộ dữ liệu hiện tại?'))return;db=x;page='board';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let t=$('#search');t.focus();t.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='classFilter'){filter=e.target.value;render()}});render();
</script></body></html>
