const saleDebt=(d,s)=>saleTotal(s)-s.paid-d.collections.filter(x=>x.saleId===s.id).reduce((n,x)=>n+x.amount,0);
function stock(d,p){return p.opening+p.baselineIn-p.baselineOut+d.purchases.filter(x=>x.productId===p.id).reduce((n,x)=>n+x.qty,0)-d.sales.filter(x=>x.productId===p.id).reduce((n,x)=>n+x.qty,0)+d.adjustments.filter(x=>x.productId===p.id).reduce((n,x)=>n+x.qty,0)}
function stockValue(d,p){let base=(p.opening+p.baselineIn-p.baselineOut)*p.cost,buys=d.purchases.filter(x=>x.productId===p.id).reduce((n,x)=>n+x.qty*x.unitCost,0),sold=d.sales.filter(x=>x.productId===p.id).reduce((n,x)=>n+x.qty*x.unitCost,0),adjust=d.adjustments.filter(x=>x.productId===p.id).reduce((n,x)=>n+x.qty*p.cost,0);return base+buys-sold+adjust}
function warnings(d,p,asof=d.settings.asof||today()){let list=[],qty=stock(d,p);if(qty<0)list.push('Tồn âm');if(qty<=p.min)list.push('Dưới tồn tối thiểu');if(p.expiry){let delta=days(p.expiry,asof);if(delta<0)list.push('Đã hết hạn');else if(delta<=d.settings.warnDays)list.push('Sắp hết hạn')}if(p.price<p.cost)list.push('Giá bán dưới giá vốn');return list}
function totals(d){let baselineRevenue=d.products.reduce((n,p)=>n+p.baselineOut*p.price,0),baselineCost=d.products.reduce((n,p)=>n+p.baselineOut*p.cost,0),revenue=baselineRevenue+d.sales.reduce((n,s)=>n+saleTotal(s),0),cogs=baselineCost+d.sales.reduce((n,s)=>n+s.qty*s.unitCost,0),expenses=d.expenses.reduce((n,e)=>n+e.amount,0),stockV=d.products.reduce((n,p)=>n+stockValue(d,p),0),debt=d.sales.reduce((n,s)=>n+saleDebt(d,s),0);return{revenue,cogs,gross:revenue-cogs,expenses,net:revenue-cogs-expenses,stockV,debt,baselineRevenue}}
function validBackup(d){
  if(!d||d.version!==1||!d.settings||typeof d.settings.shop!=='string'||d.settings.shop.length>160||d.settings.asof&&!validDate(d.settings.asof)||!validQty(d.settings.warnDays)||d.settings.warnDays>365)return false;
  for(let k of ['products','purchases','sales','collections','adjustments','expenses'])if(!Array.isArray(d[k])||d[k].length>100000)return false;
  let ids=new Set(),codes=new Set();
  for(let p of d.products){if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.code!=='string'||!p.code||codes.has(p.code.toLowerCase())||typeof p.name!=='string'||!p.name||!GROUPS.includes(p.group)||typeof p.unit!=='string'||!p.unit||![p.cost,p.price].every(validMoney)||![p.opening,p.baselineIn,p.baselineOut,p.min].every(validQty)||p.expiry&&!validDate(p.expiry)||typeof p.note!=='string')return false;ids.add(p.id);codes.add(p.code.toLowerCase())}
  let transactionIds=new Set();
  for(let x of d.purchases){if(!x||typeof x.id!=='string'||!x.id||transactionIds.has(x.id)||!validDate(x.date)||!ids.has(x.productId)||!validQty(x.qty)||x.qty===0||!validMoney(x.unitCost)||!Number.isSafeInteger(x.qty*x.unitCost)||typeof x.supplier!=='string'||typeof x.reference!=='string'||typeof x.note!=='string')return false;transactionIds.add(x.id)}
  let saleIds=new Set();
  for(let x of d.sales){if(!x||typeof x.id!=='string'||!x.id||transactionIds.has(x.id)||!validDate(x.date)||!ids.has(x.productId)||!validQty(x.qty)||x.qty===0||![x.unitPrice,x.unitCost,x.paid].every(validMoney)||x.paid>saleTotal(x)||!Number.isSafeInteger(saleTotal(x))||!Number.isSafeInteger(x.qty*x.unitCost)||typeof x.customer!=='string'||!METHODS.includes(x.method)||typeof x.reference!=='string'||typeof x.note!=='string')return false;transactionIds.add(x.id);saleIds.add(x.id)}
  for(let x of d.collections){if(!x||typeof x.id!=='string'||!x.id||transactionIds.has(x.id)||!validDate(x.date)||!saleIds.has(x.saleId)||!validMoney(x.amount)||x.amount===0||!METHODS.includes(x.method)||typeof x.note!=='string')return false;transactionIds.add(x.id)}
  for(let x of d.adjustments){if(!x||typeof x.id!=='string'||!x.id||transactionIds.has(x.id)||!validDate(x.date)||!ids.has(x.productId)||!Number.isSafeInteger(x.qty)||x.qty===0||Math.abs(x.qty)>1e9||typeof x.reason!=='string'||!x.reason||typeof x.note!=='string')return false;transactionIds.add(x.id)}
  for(let x of d.expenses){if(!x||typeof x.id!=='string'||!x.id||transactionIds.has(x.id)||!validDate(x.date)||typeof x.category!=='string'||!x.category||!validMoney(x.amount)||x.amount===0||typeof x.note!=='string')return false;transactionIds.add(x.id)}
  for(let s of d.sales)if(saleDebt(d,s)<0)return false;
  for(let p of d.products){let baseline=p.opening+p.baselineIn-p.baselineOut;if((p.sampleException&&baseline>=0)||(baseline<0&&!p.sampleException))return false;if(stock(d,p)<Math.min(0,baseline))return false;}
  return true;
}
function sampleData(anchor=today()){let d=blank();d.settings.asof=anchor;d.settings.shop='Tạp hóa Minh Anh';for(let [i,row] of SOURCE.sp.entries()){let [code,name,group,unit,cost,price,opening,baselineIn,baselineOut,min,delta]=row;d.products.push({id:'sample-'+i,code,name,group,unit,cost,price,opening,baselineIn,baselineOut,min,expiry:delta?addDays(anchor,Number(delta.slice(1))):'',note:'Bảng tổng hợp từ file gốc; nhập/bán trong kỳ không có ngày giao dịch',sampleException:opening+baselineIn-baselineOut<0})}return d}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}

    if(type==='sale')h+=field('qty','Số lượng bán *','number',old.qty??1)+field('unitPrice','Giá bán thực tế (đ)','number',old.unitPrice??0)+field('unitCost','Giá vốn chụp (đ)','number',old.unitCost??0)+field('customer','Tên khách (nếu ghi nợ)','text',old.customer||'')+field('paid','Đã thu lúc bán (đ)','number',old.paid??0)+field('method','Hình thức thu','select','',options(METHODS,old.method||METHODS[0]))+field('reference','Mã chứng từ','text',old.reference||'')+field('note','Ghi chú','textarea',old.note||'');
    if(type==='adjustment')h+=field('qty','Chênh lệch + / − *','number',old.qty??0)+field('reason','Lý do *','text',old.reason||'Kiểm kê')+field('note','Ghi chú','textarea',old.note||'');
  }
  if(type==='collection')h=field('saleId','Lượt bán còn nợ *','select','',saleOpts(old.saleId||target))+field('date','Ngày thu','date',old.date||today())+field('amount','Số tiền thu (đ)','number',old.amount??0)+field('method','Hình thức','select','',options(METHODS,old.method||METHODS[0]))+field('note','Ghi chú','textarea',old.note||'');
  if(type==='expense')h=field('date','Ngày chi','date',old.date||today())+field('category','Loại chi phí *','text',old.category||'')+field('amount','Số tiền (đ)','number',old.amount??0)+field('note','Ghi chú','textarea',old.note||'');
  if(id)h+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bản ghi này</button></div>';
  $('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal();
  if((type==='purchase'||type==='sale')&&!id)fillProductDefaults();
}
function fillProductDefaults(){let p=product(v('productId'));if(!p)return;if(modal?.type==='purchase')$('#f_unitCost').value=p.cost;if(modal?.type==='sale'){$('#f_unitPrice').value=p.price;$('#f_unitCost').value=p.cost}}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){
  if(!modal)return;let{type,id}=modal,x={},error='';
  if(type==='product'){
    x={code:v('code'),name:v('name'),group:v('group'),unit:v('unit'),cost:integer(v('cost')),price:integer(v('price')),opening:integer(v('opening')),baselineIn:integer(v('baselineIn')),baselineOut:integer(v('baselineOut')),min:integer(v('min')),expiry:v('expiry'),note:v('note')};
    if(!x.code||!x.name||!GROUPS.includes(x.group)||!x.unit||![x.cost,x.price].every(validMoney)||![x.opening,x.baselineIn,x.baselineOut,x.min].every(validQty)||x.expiry&&!validDate(x.expiry))error='Mã, tên, giá, tồn hoặc ngày hết hạn không hợp lệ.';
    if(db.products.some(p=>p.id!==id&&p.code.toLowerCase()===x.code.toLowerCase()))error='Mã hàng đã có.';
    let old=product(id);if(old?.sampleException)x.sampleException=x.opening+x.baselineIn-x.baselineOut<0;
  }
  if(type==='purchase'){
    x={date:v('date'),productId:v('productId'),qty:integer(v('qty')),unitCost:integer(v('unitCost')),supplier:v('supplier'),reference:v('reference'),note:v('note')};
    if(!validDate(x.date)||!product(x.productId)||!validQty(x.qty)||x.qty===0||!validMoney(x.unitCost))error='Ngày, mặt hàng, số lượng hoặc giá vốn không hợp lệ.';
  }
  if(type==='sale'){
    x={date:v('date'),productId:v('productId'),qty:integer(v('qty')),unitPrice:integer(v('unitPrice')),unitCost:integer(v('unitCost')),customer:v('customer'),paid:integer(v('paid')),method:v('method'),reference:v('reference'),note:v('note')};
    if(!validDate(x.date)||!product(x.productId)||!validQty(x.qty)||x.qty===0||![x.unitPrice,x.unitCost,x.paid].every(validMoney)||x.paid>saleTotal(x)||!METHODS.includes(x.method))error='Ngày, mặt hàng, số lượng, giá hoặc tiền đã thu không hợp lệ.';
    if(!error&&product(x.productId).expiry&&product(x.productId).expiry<x.date)error='Hạn dùng đại diện đã qua ngày bán. Hãy kiểm tra và cập nhật hạn trước khi ghi bán.';
  }
  if(type==='collection'){
    x={saleId:v('saleId'),date:v('date'),amount:integer(v('amount')),method:v('method'),note:v('note')};
    if(!sale(x.saleId)||!validDate(x.date)||!validMoney(x.amount)||x.amount===0||!METHODS.includes(x.method))error='Lượt bán, ngày, số tiền hoặc hình thức thu không hợp lệ.';
  }
  if(type==='adjustment'){
    x={date:v('date'),productId:v('productId'),qty:Number(v('qty')),reason:v('reason'),note:v('note')};
    if(!validDate(x.date)||!product(x.productId)||!Number.isSafeInteger(x.qty)||x.qty===0||Math.abs(x.qty)>1e9||!x.reason)error='Ngày, mặt hàng, chênh lệch hoặc lý do không hợp lệ.';
  }
  if(type==='expense'){
    x={date:v('date'),category:v('category'),amount:integer(v('amount')),note:v('note')};
    if(!validDate(x.date)||!x.category||!validMoney(x.amount)||x.amount===0)error='Ngày, loại hoặc số tiền chi phí không hợp lệ.';
  }
  if(error){$('#modalError').textContent=error;return}
  let key={product:'products',purchase:'purchases',sale:'sales',collection:'collections',adjustment:'adjustments',expense:'expenses'}[type],d={...db,[key]:db[key].slice()},list=d[key];
  if(id){let i=list.findIndex(a=>a.id===id);list[i]={...list[i],...x}}else list.push({id:uid(),...x});
  if(!validBackup(d)){$('#modalError').textContent='Thay đổi làm tồn âm, thu vượt nợ hoặc sai liên kết. Hãy kiểm tra số lượng và khoản đã thu.';return}
  db=d;closeModal();save();
}

function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){
  for(let [name,head] of [['Hang hoa','Mã'],['Nhap hang','Mã nhập'],['Ban hang','Mã bán'],['Thu cong no','Mã thu'],['Dieu chinh','Mã chỉnh'],['Chi phi','Mã chi']])if(!sheets[name]||sheets[name][0]?.[0]!==head)throw Error('Cần workbook do app xuất với đủ các bảng dữ liệu.');
  let d=blank(),pr=sheets['Hang hoa'];
  for(let r of pr.slice(1)){if(!String(r[0]??'').trim())continue;d.products.push({id:uid(),code:String(r[0]).trim(),name:String(r[1]??'').trim(),group:String(r[2]??'').trim(),unit:String(r[3]??'').trim(),cost:integer(r[4]),price:integer(r[5]),opening:integer(r[6]),baselineIn:integer(r[7]),baselineOut:integer(r[8]),min:integer(r[9]),expiry:String(r[10]??'').trim()?(parseDate(r[10])||'INVALID'):'',note:String(r[11]??'').trim(),sampleException:Number(r[12])===1})}
  const pid=code=>d.products.find(p=>p.code===String(code??'').trim())?.id||'';
  for(let r of sheets['Nhap hang'].slice(1)){if(!String(r[0]??'').trim())continue;d.purchases.push({id:String(r[0]).trim(),date:parseDate(r[1]),productId:pid(r[2]),qty:integer(r[3]),unitCost:integer(r[4]),supplier:String(r[5]??'').trim(),reference:String(r[6]??'').trim(),note:String(r[7]??'').trim()})}
  for(let r of sheets['Ban hang'].slice(1)){if(!String(r[0]??'').trim())continue;d.sales.push({id:String(r[0]).trim(),date:parseDate(r[1]),productId:pid(r[2]),qty:integer(r[3]),unitPrice:integer(r[4]),unitCost:integer(r[5]),customer:String(r[6]??'').trim(),paid:integer(r[7]),method:String(r[8]??'').trim(),reference:String(r[9]??'').trim(),note:String(r[10]??'').trim()})}
  for(let r of sheets['Thu cong no'].slice(1)){if(!String(r[0]??'').trim())continue;d.collections.push({id:String(r[0]).trim(),saleId:String(r[1]??'').trim(),date:parseDate(r[2]),amount:integer(r[3]),method:String(r[4]??'').trim(),note:String(r[5]??'').trim()})}
  for(let r of sheets['Dieu chinh'].slice(1)){if(!String(r[0]??'').trim())continue;d.adjustments.push({id:String(r[0]).trim(),date:parseDate(r[1]),productId:pid(r[2]),qty:Number(r[3]),reason:String(r[4]??'').trim(),note:String(r[5]??'').trim()})}
  for(let r of sheets['Chi phi'].slice(1)){if(!String(r[0]??'').trim())continue;d.expenses.push({id:String(r[0]).trim(),date:parseDate(r[1]),category:String(r[2]??'').trim(),amount:integer(r[3]),note:String(r[4]??'').trim()})}
  if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));if(raw.shop!==undefined)d.settings.shop=String(raw.shop);if(raw.asof!==undefined)d.settings.asof=String(raw.asof);if(raw.warnDays!==undefined)d.settings.warnDays=integer(raw.warnDays)}
  if(!validBackup(d))throw Error('Excel có mã trùng, sai liên kết, ngày, số lượng hoặc số tiền không hợp lệ.');return d;
}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{
  let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;
  if(b.dataset.page){page=b.dataset.page;query='';render();return}
  if(b.dataset.new){openModal(b.dataset.new,'',b.dataset.target||'');return}
  if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}
  let a=b.dataset.action;
  if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();
  if(a==='backup')download('quan-ly-tap-hoa-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();
  if(a==='sample'){if(db.products.length||db.purchases.length||db.sales.length){if(!confirm('Nạp mẫu sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();save()}
  if(a==='clear'){if(confirm('Xóa toàn bộ hàng, nhập, bán và khoản thu trên trình duyệt này?')){db=blank();save()}}
  if(a==='deleteRecord'){
    let{type,id}=modal;if(type==='product'&&[...db.purchases,...db.sales,...db.adjustments].some(x=>x.productId===id)){$('#modalError').textContent='Mặt hàng đã có giao dịch; không thể xóa.';return}
    if(type==='sale'&&db.collections.some(x=>x.saleId===id)){$('#modalError').textContent='Lượt bán đã có khoản thu nợ; không thể xóa.';return}
    if(confirm('Xóa vĩnh viễn bản ghi này?')){let key={product:'products',purchase:'purchases',sale:'sales',collection:'collections',adjustment:'adjustments',expense:'expenses'}[type];let d={...db,[key]:db[key].filter(x=>x.id!==id)};if(!validBackup(d)){$('#modalError').textContent='Xóa sẽ làm tồn âm hoặc sai dữ liệu liên kết.';return}db=d;closeModal();save()}
  }
  if(a==='settings'){let d={...db,settings:{shop:v('shop'),asof:v('asof'),warnDays:integer(v('warnDays'))}};if(!validBackup(d)){alert('Tên cửa hàng, ngày hoặc số ngày nhắc không hợp lệ.');return}db=d;save()}
});
document.addEventListener('change',e=>{if(e.target.id==='f_productId')fillProductDefaults()});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();




</script></body></html>
