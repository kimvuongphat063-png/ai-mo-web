function percent(a,b,d=1){return b>0?round(a/b*100,d):0}
function derive(r){let total=r.good+r.scrap,planRate=percent(r.good,r.plan,1),scrapRate=percent(r.scrap,total,2),runRate=percent(r.runHours,r.runHours+r.stopHours,1),alerts=[];if(scrapRate>db.settings.loiMax)alerts.push('Tỷ lệ lỗi cao');if(r.plan>0&&planRate<db.settings.khMin)alerts.push('Dưới mức kế hoạch');if(r.runHours+r.stopHours>0&&runRate<db.settings.chayMin)alerts.push('Máy dừng nhiều');return {total,planRate,scrapRate,runRate,alerts,sourceWarning:alerts[0]||''}}
function sum(rows){return rows.reduce((a,r)=>{a.plan+=r.plan;a.good+=r.good;a.scrap+=r.scrap;a.run+=r.runHours;a.stop+=r.stopHours;return a},{plan:0,good:0,scrap:0,run:0,stop:0})}
function stats(rows=db.records){let s=sum(rows);return {...s,total:s.good+s.scrap,planRate:percent(s.good,s.plan,1),scrapRate:percent(s.scrap,s.good+s.scrap,2),runRate:percent(s.run,s.run+s.stop,1),alerts:rows.filter(r=>derive(r).alerts.length).length}}
function grouped(rows,key){return [...new Set(rows.map(r=>r[key]))].sort().map(k=>({key:k,rows:rows.filter(r=>r[key]===k),...stats(rows.filter(r=>r[key]===k))}))}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!Array.isArray(x.records)||!Array.isArray(x.audit)||!x.settings||!dateOK(x.settings.asof))return 'Cấu trúc dữ liệu không hợp lệ.';for(let k of ['loiMax','khMin','chayMin'])if(!Number.isFinite(x.settings[k])||x.settings[k]<0||x.settings[k]>100)return 'Ngưỡng cảnh báo phải từ 0 đến 100%.';let ids=new Set(),keys=new Set();for(let r of x.records){if(!r.id||ids.has(r.id)||!dateOK(r.date)||!r.team||!r.shift||!Number.isSafeInteger(r.plan)||!Number.isSafeInteger(r.good)||!Number.isSafeInteger(r.scrap)||r.plan<0||r.good<0||r.scrap<0||!Number.isFinite(r.runHours)||!Number.isFinite(r.stopHours)||r.runHours<0||r.stopHours<0||r.runHours+r.stopHours>24.001||!r.good&&!r.scrap||String(r.note||'').length>1500||String(r.cause||'').length>800||String(r.action||'').length>800)return 'Dòng sản lượng không hợp lệ.';let key=r.date+'|'+r.team+'|'+r.shift;if(keys.has(key))return 'Ngày, tổ và ca bị trùng.';keys.add(key);ids.add(r.id)}let aids=new Set();for(let a of x.audit){if(!a.id||aids.has(a.id)||!a.at||!a.action)return 'Nhật ký không hợp lệ.';aids.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(){try{let s=$('#embedded-state').textContent.trim();return s==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
try{let embed=decode(),local=JSON.parse(localStorage.getItem(KEY)||'null');if(embed&&!validate(embed))db=embed;else if(local&&!validate(local))db=local}catch{}
function save(){let error=validate(db);if(error){alert(error);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên thiết bị. Hãy xuất JSON hoặc HTML kèm dữ liệu.')}render();return true}
function log(action,detail,id=''){db.audit.push({id:uid(),at:new Date().toISOString(),action,detail,recordId:id})}
function btn(label,action,cls='',id=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
function card(title,body,cls=''){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}
function badge(r){let d=derive(r);return d.alerts.length?`<span class="badge bad">${d.alerts.length} cảnh báo</span>`:'<span class="badge good">Ổn định</span>'}
function metric(title,value,sub,icon){return `<div class="metric"><span class="metric-icon">${icon}</span><small>${title}</small><strong>${value}</strong><span>${sub}</span></div>`}
function overview(){let s=stats(),gr=grouped(db.records,'team').sort((a,b)=>b.good-a.good),daily=grouped(db.records,'date').slice(-8);return `<section class="hero"><div><span class="eyebrow">🏭 AI MỞ · BẢNG ĐIỀU HÀNH XƯỞNG</span><h1>Mỗi ca rõ năng suất.<br>Mỗi lỗi có hướng xử lý.</h1><p>Theo dõi sản lượng đạt, phế phẩm và thời gian máy dừng trên từng tổ, ca.</p><div class="actions">${btn('＋ Ghi nhận ca sản xuất','new','primary')}${btn('Xem dữ liệu','records','light')}</div></div><div class="hero-right"><small>TỶ LỆ SẢN PHẨM ĐẠT</small><strong>${num(percent(s.good,s.total,1),1)}%</strong><span>${num(s.good)} đạt / ${num(s.total)} đã sản xuất</span></div></section><div class="metrics">${metric('Sản phẩm đạt',num(s.good),'trên '+num(s.plan)+' kế hoạch','✓')}${metric('Phế phẩm',num(s.scrap),`${num(s.scrapRate,2)}% tổng sản xuất`,'◇')}${metric('Ca cần chú ý',num(s.alerts),'có ít nhất một ngưỡng vượt','!')}${metric('Giờ dừng máy',num(s.stop,1),`${num(s.runRate,1)}% thời gian máy chạy`,'◴')}</div><div class="main-grid">${card('Năng suất theo tổ',gr.length?`<div class="bars">${gr.map(g=>`<div class="bar-row"><div><b>${esc(g.key)}</b><small>${num(g.good)} đạt · ${num(g.scrap)} lỗi</small></div><div class="track"><i style="width:${Math.max(2,percent(g.good,Math.max(...gr.map(t=>t.good)),0))}%"></i></div><strong>${num(g.planRate,1)}%</strong></div>`).join('')}</div>`:'<p class="empty">Chưa có dữ liệu. Ghi nhận ca sản xuất đầu tiên hoặc nạp dữ liệu mẫu.</p>')}${card('Ca cần xử lý',db.records.filter(r=>derive(r).alerts.length).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(r=>`<button class="alert-item" data-action="open" data-id="${esc(r.id)}"><b>${esc(r.team)} · ${esc(r.shift)}</b><span>${fmtDate(r.date)} · ${esc(derive(r).alerts.join(' · '))}</span></button>`).join('')||'<p class="success">Không có ca vượt ngưỡng.</p>')}</div>${card('Dòng thời gian 8 ngày gần nhất',daily.length?`<div class="timeline">${daily.map(d=>`<div><small>${fmtDate(d.key)}</small><div class="timeline-bar"><i style="width:${Math.max(2,percent(d.good,Math.max(...daily.map(v=>v.good)),0))}%"></i></div><b>${num(d.good)} đạt</b><span>${num(d.scrap)} lỗi</span></div>`).join('')}</div>`:'<p class="empty">Chưa có ngày sản xuất.</p>')}`}
function filtered(){let q=filter.q.toLocaleLowerCase('vi');return db.records.filter(r=>(!filter.team||r.team===filter.team)&&(!filter.shift||r.shift===filter.shift)&&(!filter.from||r.date>=filter.from)&&(!filter.to||r.date<=filter.to)&&(!q||[r.team,r.shift,r.defectType,r.cause,r.owner,r.note].join(' ').toLocaleLowerCase('vi').includes(q))).sort((a,b)=>b.date.localeCompare(a.date))}
function recordsPage(){let rows=filtered(),s=stats(rows);return `<div class="page-head"><div><h1>▤ Nhật ký sản lượng</h1><p>Mỗi tổ, mỗi ca một dòng. Bấm vào dòng để xem và xử lý.</p></div>${btn('＋ Ghi nhận ca','new','primary')}</div><div class="filter-grid"><label>Tìm tổ, loại lỗi, nguyên nhân<input id="search" value="${esc(filter.q)}" placeholder="Tìm trong nhật ký…"></label><label>Tổ / dây chuyền<select id="teamFilter"><option value="">Tất cả tổ</option>${TEAMS.map(t=>`<option ${filter.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label>Ca<select id="shiftFilter"><option value="">Tất cả ca</option>${SHIFTS.map(t=>`<option ${filter.shift===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label>Từ ngày<input id="fromFilter" type="date" value="${esc(filter.from)}"></label><label>Đến ngày<input id="toFilter" type="date" value="${esc(filter.to)}"></label></div><p class="filter-count">${rows.length} dòng · ${num(s.good)} đạt · ${num(s.scrap)} lỗi · ${num(s.scrapRate,2)}% tỷ lệ lỗi</p>${card('Dữ liệu từng ca',`<div class="table-scroll"><table><thead><tr><th>Ngày / ca</th><th>Tổ</th><th>Kế hoạch</th><th>Đạt</th><th>Lỗi</th><th>Tổng</th><th>Đạt KH</th><th>Tỷ lệ lỗi</th><th>Máy chạy</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${rows.map(r=>{let d=derive(r);return `<tr><td>${fmtDate(r.date)}<small>${esc(r.shift)}</small></td><td><b>${esc(r.team)}</b></td><td>${num(r.plan)}</td><td>${num(r.good)}</td><td>${num(r.scrap)}</td><td>${num(d.total)}</td><td>${num(d.planRate,1)}%</td><td>${num(d.scrapRate,2)}%</td><td>${num(d.runRate,1)}%</td><td>${badge(r)}</td><td>${btn('Xem','open','small',r.id)}</td></tr>`}).join('')||'<tr><td colspan="11" class="empty">Không có dòng phù hợp bộ lọc.</td></tr>'}</tbody></table></div>`)}`}
function detailPage(){let r=db.records.find(x=>x.id===chosen);if(!r){page='records';return recordsPage()}let d=derive(r),metricCards=metric('Đạt kế hoạch',num(d.planRate,1)+'%',`${num(r.good)} / ${num(r.plan)} sản phẩm`,'↗')+metric('Tỷ lệ lỗi',num(d.scrapRate,2)+'%',`${num(r.scrap)} / ${num(d.total)} sản phẩm`,'◇')+metric('Máy chạy',num(d.runRate,1)+'%',`${num(r.runHours,1)} / ${num(r.runHours+r.stopHours,1)} giờ`,'◴');return `<div class="page-head"><div><button class="link" data-action="records">← Nhật ký sản lượng</button><h1>${esc(r.team)} · ${esc(r.shift)}</h1><p>${fmtDate(r.date)} · ${badge(r)}</p></div><div class="actions">${btn('Sửa dòng','edit','',r.id)}${btn('🖨 In phiếu','print')}${btn('Xóa dòng','delete','danger',r.id)}</div></div><div class="metrics three">${metricCards}</div><div class="main-grid">${card('Sản lượng và máy',`<dl><dt>Kế hoạch</dt><dd>${num(r.plan)}</dd><dt>Sản phẩm đạt</dt><dd>${num(r.good)}</dd><dt>Phế phẩm</dt><dd>${num(r.scrap)}</dd><dt>Tổng sản xuất</dt><dd>${num(d.total)}</dd><dt>Giờ chạy / dừng</dt><dd>${num(r.runHours,1)} / ${num(r.stopHours,1)}</dd></dl>`)}${card('Phân tích ca',(d.alerts.length?`<ul class="warnings">${d.alerts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="success">Chưa vượt ngưỡng thiết lập.</p>')+`<p class="note">Ngưỡng hiện tại: lỗi &gt; ${num(db.settings.loiMax,1)}%; đạt KH &lt; ${num(db.settings.khMin,1)}%; chạy máy &lt; ${num(db.settings.chayMin,1)}%. Cảnh báo có thể thay đổi khi sửa ngưỡng.</p>`)}</div>${card('Lỗi và hành động khắc phục',`<dl><dt>Loại lỗi</dt><dd>${esc(r.defectType||'Chưa ghi')}</dd><dt>Nguyên nhân</dt><dd>${esc(r.cause||'Chưa ghi')}</dd><dt>Hành động</dt><dd>${esc(r.action||'Chưa ghi')}</dd><dt>Người theo dõi</dt><dd>${esc(r.owner||'Chưa ghi')}</dd><dt>Trạng thái</dt><dd>${r.verified?'Đã xác nhận xử lý':'Chưa xác nhận xử lý'}</dd><dt>Ghi chú</dt><dd>${esc(r.note||'—')}</dd></dl><div class="actions no-print">${btn(r.verified?'Mở lại xử lý':'Xác nhận đã xử lý','toggleVerify','primary',r.id)}</div>`)}${card('Nhật ký thay đổi',db.audit.filter(a=>a.recordId===r.id).slice().reverse().map(a=>`<div class="audit"><b>${esc(a.action)}</b><span>${esc(a.at.slice(0,16).replace('T',' '))} · ${esc(a.detail||'')}</span></div>`).join('')||'<p class="empty">Chưa có nhật ký.</p>')}`}
function reportsPage(){let teams=grouped(db.records,'team'),days=grouped(db.records,'date').sort((a,b)=>b.key.localeCompare(a.key));let row=g=>`<tr><td><b>${esc(g.key)}</b></td><td>${g.rows.length}</td><td>${num(g.plan)}</td><td>${num(g.good)}</td><td>${num(g.scrap)}</td><td>${num(g.planRate,1)}%</td><td>${num(g.scrapRate,2)}%</td><td>${num(g.runRate,1)}%</td><td>${num(g.stop,1)}</td><td>${g.alerts}</td></tr>`;let head='<tr><th>Nhóm</th><th>Ca</th><th>Kế hoạch</th><th>Đạt</th><th>Lỗi</th><th>Đạt KH</th><th>Tỷ lệ lỗi</th><th>Máy chạy</th><th>Giờ dừng</th><th>Ca cảnh báo</th></tr>';return `<div class="page-head"><div><h1>▥ Báo cáo sản xuất</h1><p>Tỷ lệ toàn nhóm tính từ tổng lượng, không lấy trung bình tỷ lệ từng ca.</p></div>${btn('⬇ Excel 4 bảng','exportExcel','primary')}</div>${card('Theo tổ / dây chuyền',`<div class="table-scroll"><table><thead>${head}</thead><tbody>${teams.map(row).join('')||'<tr><td colspan="10" class="empty">Chưa có dữ liệu.</td></tr>'}</tbody></table></div>`)}${card('Theo ngày',`<div class="table-scroll"><table><thead>${head}</thead><tbody>${days.map(row).join('')||'<tr><td colspan="10" class="empty">Chưa có dữ liệu.</td></tr>'}</tbody></table></div>`)}${card('Cách đọc chỉ số','<p>Đạt kế hoạch = sản phẩm đạt ÷ kế hoạch. Tỷ lệ lỗi = sản phẩm lỗi ÷ (đạt + lỗi). Tỷ lệ chạy máy = giờ chạy ÷ (giờ chạy + giờ dừng). Khi mẫu số bằng 0, app hiện 0% và không tự kết luận tình trạng ca từ chỉ số đó.</p>')}`}
function settingsPage(){return `<div class="page-head"><h1>⚙ Ngưỡng cảnh báo</h1></div>${card('Theo tiêu chuẩn nội bộ của xưởng',`<form id="settingsForm" class="form-grid"><label>Ngày báo cáo<input name="asof" type="date" value="${esc(db.settings.asof)}" required></label><label>Tỷ lệ lỗi cảnh báo khi vượt (%)<input name="loiMax" type="number" min="0" max="100" step="0.1" value="${db.settings.loiMax}" required></label><label>Đạt kế hoạch tối thiểu (%)<input name="khMin" type="number" min="0" max="100" step="0.1" value="${db.settings.khMin}" required></label><label>Tỷ lệ máy chạy tối thiểu (%)<input name="chayMin" type="number" min="0" max="100" step="0.1" value="${db.settings.chayMin}" required></label><div class="full">${btn('Lưu ngưỡng','saveSettings','primary')}</div></form><p class="note">Ngưỡng mặc định theo file tham chiếu: lỗi 3%, đạt KH 90%, máy chạy 90%. Đây là ngưỡng nội bộ, cần đối chiếu tiêu chuẩn hợp đồng của xưởng.</p>`)}`}
function dataPage(){return `<div class="page-head"><h1>↧ Dữ liệu & sao lưu</h1></div><div class="main-grid">${card('Xuất bản sao',`<p>${db.records.length} dòng sản lượng đang lưu trên thiết bị này.</p><div class="actions">${btn('⬇ Sao lưu JSON','exportJSON','primary')}${btn('⬇ HTML kèm dữ liệu','exportHTML')}${btn('⬇ Excel báo cáo','exportExcel')}</div>`)}${card('Nhập hoặc nạp mẫu',`<p>Nhập JSON hoặc nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Hãy sao lưu trước khi thay.</p><div class="actions">${btn('⬆ Nhập JSON','importJSON')}${btn('Nạp 20 ca mẫu','loadSample')}${btn('Xóa dữ liệu','clear','danger')}</div>`)}</div>${card('Chuyển sang máy khác','<p>Hãy xuất <b>HTML kèm dữ liệu</b> rồi chép tệp đó sang thiết bị mới, hoặc xuất JSON để nhập vào app trên máy khác. Chép tệp HTML gốc không mang theo dữ liệu đã nhập trong trình duyệt.</p><p>Excel chỉ dùng để xem và đối soát; không dùng để nhập ngược trong phiên bản này.</p>')}`}
function helpPage(){return `<div class="page-head"><h1>? Cách sử dụng</h1></div>${card('Quy trình cho quản đốc và tổ trưởng','<ol><li>Thiết lập ba ngưỡng cảnh báo phù hợp tiêu chuẩn nội bộ.</li><li>Mỗi tổ, mỗi ca ghi một dòng: kế hoạch, đạt, lỗi, giờ chạy và giờ dừng.</li><li>Mở ca có cảnh báo để ghi loại lỗi, nguyên nhân, hành động và người theo dõi.</li><li>Sau khi khắc phục, xác nhận xử lý. Dữ liệu số và trạng thái xử lý vẫn có thể xem lại trong nhật ký.</li><li>Xem báo cáo theo tổ hoặc ngày, in phiếu ca, xuất Excel và sao lưu JSON/HTML kèm dữ liệu.</li></ol>')}${card('Phân biệt số liệu nguồn và bổ sung','<p>Dữ liệu mẫu gốc chỉ có ngày, tổ, ca, kế hoạch, đạt, lỗi, giờ chạy/dừng. Các trường loại lỗi, nguyên nhân, hành động, người theo dõi và xác nhận xử lý do người dùng bổ sung; mẫu để trống các trường này.</p>')}`}
function render(){let titles={overview:'Tổng quan',records:'Nhật ký',detail:'Chi tiết ca',reports:'Báo cáo',settings:'Ngưỡng',data:'Dữ liệu',help:'Hướng dẫn'},views={overview,records:recordsPage,detail:detailPage,reports:reportsPage,settings:settingsPage,data:dataPage,help:helpPage};$('#screen').innerHTML=(views[page]||overview)();$('#topTitle').textContent=titles[page]||'Tổng quan';$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page||page==='detail'&&b.dataset.nav==='records'))}
function input(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(label,name,values,current){return `<label>${label}<select name="${name}">${values.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function textArea(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" maxlength="1500" rows="3">${esc(value)}</textarea></label>`}
function formOpen(id=''){let r=db.records.find(x=>x.id===id)||{},isEdit=!!id;editing=id;$('#modalTitle').textContent=isEdit?'Sửa ca sản xuất':'Ghi nhận ca sản xuất';$('#formFields').innerHTML=input('Ngày sản xuất *','date',r.date||today(),'date','required')+select('Tổ / dây chuyền *','team',TEAMS,r.team||TEAMS[0])+select('Ca *','shift',SHIFTS,r.shift||SHIFTS[0])+input('Kế hoạch *','plan',r.plan??0,'number','min="0" step="1" required')+input('Sản phẩm đạt *','good',r.good??0,'number','min="0" step="1" required')+input('Sản phẩm lỗi *','scrap',r.scrap??0,'number','min="0" step="1" required')+input('Giờ máy chạy *','runHours',r.runHours??0,'number','min="0" max="24" step="0.1" required')+input('Giờ máy dừng *','stopHours',r.stopHours??0,'number','min="0" max="24" step="0.1" required')+input('Loại lỗi','defectType',r.defectType,'text','maxlength="120"')+input('Người theo dõi','owner',r.owner,'text','maxlength="120"')+textArea('Nguyên nhân','cause',r.cause)+textArea('Hành động khắc phục','action',r.action)+textArea('Ghi chú ca','note',r.note);$('#formError').textContent='';$('#editor').showModal()}
function formData(f){let fd=new FormData(f),get=n=>String(fd.get(n)||'').trim();return {date:get('date'),team:get('team'),shift:get('shift'),plan:Number(get('plan')),good:Number(get('good')),scrap:Number(get('scrap')),runHours:Number(get('runHours')),stopHours:Number(get('stopHours')),defectType:get('defectType'),cause:get('cause'),action:get('action'),owner:get('owner'),note:get('note')}}
function submitForm(e){e.preventDefault();let before=clone(db),v=formData(e.target);try{if(!dateOK(v.date))throw Error('Ngày không hợp lệ.');if(!TEAMS.includes(v.team)||!SHIFTS.includes(v.shift))throw Error('Tổ hoặc ca không hợp lệ.');for(let k of ['plan','good','scrap'])if(!Number.isSafeInteger(v[k])||v[k]<0)throw Error('Số lượng phải là số nguyên không âm.');if(v.good+v.scrap===0)throw Error('Cần ghi ít nhất một sản phẩm đạt hoặc lỗi.');if(v.runHours<0||v.stopHours<0||!Number.isFinite(v.runHours+v.stopHours)||v.runHours+v.stopHours>24)throw Error('Tổng giờ máy chạy và dừng không vượt 24 giờ.');if(db.records.some(r=>r.id!==editing&&r.date===v.date&&r.team===v.team&&r.shift===v.shift))throw Error('Ngày, tổ và ca này đã có dòng. Hãy sửa dòng cũ.');let r=db.records.find(x=>x.id===editing);if(r)Object.assign(r,v);else{r={id:uid(),...v,verified:false};db.records.push(r)}log(editing?'Sửa ca':'Ghi ca',`${r.team} · ${r.shift} · ${fmtDate(r.date)}`,r.id);let error=validate(db);if(error)throw Error(error);chosen=r.id;page='detail';$('#editor').close();save()}catch(ex){db=before;$('#formError').textContent=ex.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'nang-suat-phe-pham-sao-luu.json')}
function exportHTML(){let html='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([html],{type:'text/html;charset=utf-8'}),'nang-suat-phe-pham-kem-du-lieu.html')}
function sheets(){let row=r=>{let d=derive(r);return [r.date,r.team,r.shift,r.plan,r.good,r.scrap,d.total,d.planRate,d.scrapRate,r.runHours,r.stopHours,d.runRate,d.alerts.join('; '),r.defectType,r.cause,r.action,r.owner,r.verified?'Đã xử lý':'Chưa xử lý',r.note]};let aggregate=g=>[g.key,g.rows.length,g.plan,g.good,g.scrap,g.planRate,g.scrapRate,g.runRate,g.stop,g.alerts];return [{name:'SanLuongCa',rows:[['Ngày','Tổ','Ca','Kế hoạch','Đạt','Lỗi','Tổng','Đạt KH %','Lỗi %','Giờ chạy','Giờ dừng','Chạy máy %','Cảnh báo','Loại lỗi','Nguyên nhân','Hành động','Phụ trách','Xử lý','Ghi chú'],...db.records.map(row)]},{name:'TheoTo',rows:[['Tổ','Số ca','Kế hoạch','Đạt','Lỗi','Đạt KH %','Lỗi %','Chạy máy %','Giờ dừng','Ca cảnh báo'],...grouped(db.records,'team').map(aggregate)]},{name:'TheoNgay',rows:[['Ngày','Số ca','Kế hoạch','Đạt','Lỗi','Đạt KH %','Lỗi %','Chạy máy %','Giờ dừng','Ca cảnh báo'],...grouped(db.records,'date').map(aggregate)]},{name:'NhatKy',rows:[['Thời điểm','Hành động','Chi tiết','ID dòng'],...db.audit.map(a=>[a.at,a.action,a.detail,a.recordId])]},{name:'CaiDat',rows:[['Ngày báo cáo','Lỗi max %','Đạt KH min %','Chạy máy min %'],[db.settings.asof,db.settings.loiMax,db.settings.khMin,db.settings.chayMin]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'nang-suat-phe-pham-bao-cao.xlsx')}
function sampleData(){let x=empty();for(let tup of PRODUCTIVITY_SCRAP_SAMPLE.ns){let [relative,team,shift,plan,good,scrap,runHours,stopHours]=tup,d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(relative.slice(1)));x.records.push({id:uid(),date:d.toLocaleDateString('sv-SE'),team,shift,plan,good,scrap,runHours,stopHours,defectType:'',cause:'',action:'',owner:'',note:'',verified:false})}return x}
function act(name,id=''){if(['overview','records','reports','settings','data','help'].includes(name)){page=name;render();return}if(name==='new'||name==='edit')return formOpen(name==='edit'?id:'');if(name==='open'){chosen=id;page='detail';render();return}if(name==='delete'){if(!confirm('Xóa dòng sản lượng này?'))return;db.records=db.records.filter(r=>r.id!==id);log('Xóa ca','Đã xóa dòng',id);page='records';save();return}if(name==='toggleVerify'){let r=db.records.find(r=>r.id===id);if(!r)return;r.verified=!r.verified;log(r.verified?'Xác nhận xử lý':'Mở lại xử lý',r.team+' · '+r.shift,id);save();return}if(name==='print')return print();if(name==='saveSettings'){let f=$('#settingsForm');let s={asof:f.elements.asof.value,loiMax:Number(f.elements.loiMax.value),khMin:Number(f.elements.khMin.value),chayMin:Number(f.elements.chayMin.value)};let x=clone(db);x.settings=s;let error=validate(x);if(error)return alert(error);db=x;log('Sửa ngưỡng',`${s.loiMax}% · ${s.khMin}% · ${s.chayMin}%`);save();return}if(name==='exportJSON')return exportJSON();if(name==='exportHTML')return exportHTML();if(name==='exportExcel')return exportExcel();if(name==='importJSON')return $('#jsonFile').click();if(name==='loadSample'){if(db.records.length&&!confirm('Nạp mẫu sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;db=sampleData();page='overview';save();return}if(name==='clear'){if(!confirm('Xóa toàn bộ dữ liệu?')||!confirm('Xác nhận lần cuối.'))return;db=empty();page='overview';save()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action],[data-nav]');if(b)act(b.dataset.action||b.dataset.nav,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submitForm);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),error=validate(x);if(error)throw Error(error);if(!confirm('Nhập JSON sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;db=x;page='overview';save()}catch(ex){alert('Không nhập được: '+ex.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{let map={teamFilter:'team',shiftFilter:'shift',fromFilter:'from',toFilter:'to'},k=map[e.target.id];if(k){filter[k]=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;filter.q=e.target.value;render();let q=$('#search');q.focus();q.setSelectionRange(pos,pos)}});render();
</script></body></html>
