function validate(t){if(!t.code?.trim()||t.code.length>50)return 'Nhập mã phiếu tối đa 50 ký tự.';if(db.tickets.some(x=>x.id!==t.id&&x.code.toLowerCase()===t.code.toLowerCase()))return 'Mã phiếu đã tồn tại.';if(!validDate(t.receivedDate))return 'Ngày nhận không hợp lệ.';if(!t.customer?.trim()||!t.device?.trim())return 'Cần nhập khách hàng và thiết bị.';if(t.purchaseDate&&!validDate(t.purchaseDate))return 'Ngày mua không hợp lệ.';if(t.purchaseDate&&t.purchaseDate>t.receivedDate)return 'Ngày mua không thể sau ngày nhận.';if(t.dueDate&&!validDate(t.dueDate))return 'Ngày hẹn trả không hợp lệ.';if(t.dueDate&&t.dueDate<t.receivedDate)return 'Ngày hẹn trả trước ngày nhận.';if(!Number.isInteger(+t.warrantyMonths)||t.warrantyMonths<0||t.warrantyMonths>120)return 'Thời hạn bảo hành từ 0 đến 120 tháng.';if(!STATES.includes(t.status))return 'Trạng thái không hợp lệ.';if(t.coverageOverride!=='auto'&&!t.coverageReason?.trim())return 'Ghi lý do khi duyệt hoặc từ chối bảo hành thủ công.';if(!Number.isFinite(+t.labor)||t.labor<0||t.labor>1e12)return 'Tiền công không hợp lệ.';if(t.parts.length>100||t.payments.length>100)return 'Tối đa 100 dòng linh kiện và 100 khoản thu.';for(let p of t.parts)if(!p.name?.trim()||!Number.isFinite(+p.qty)||p.qty<=0||p.qty>1e6||!Number.isFinite(+p.price)||p.price<0||p.price>1e12)return 'Dòng linh kiện cần tên, số lượng dương và đơn giá hợp lệ.';for(let p of t.payments)if(!validDate(p.date)||!Number.isFinite(+p.amount)||p.amount<=0||p.amount>1e12)return 'Ngày hoặc số tiền thanh toán không hợp lệ.';let m=metrics(t);if(!Number.isSafeInteger(m.charge)||!Number.isSafeInteger(m.paid))return 'Tổng tiền vượt giới hạn tính chính xác.';if(m.due<0)return 'Tổng đã thu vượt khách phải trả; hãy sửa khoản thu hoặc quyết định bảo hành.';return ''}

function saveTicket(){if(!draft)return null;let error=validate(draft);if(error){alert(error);return null}let t=clone(draft),old=t.id?ticket(t.id):null,when=new Date().toLocaleString('vi-VN');if(!t.id){if(db.tickets.length>=5000){alert('Tối đa 5.000 phiếu.');return null}t.id=uid();t.history=[{at:when,event:'Tiếp nhận · '+t.status}];db.tickets.push(t)}else{if(!old){alert('Không tìm thấy phiếu.');return null}let changes=[];if(old.status!==t.status)changes.push('Trạng thái: '+old.status+' → '+t.status);if(old.coverageOverride!==t.coverageOverride)changes.push('Quyết định bảo hành');if(old.dueDate!==t.dueDate)changes.push('Hẹn trả');if(metrics(old).charge!==metrics(t).charge)changes.push('Phí khách trả');if(old.payments.length!==t.payments.length||metrics(old).paid!==metrics(t).paid)changes.push('Thanh toán');t.history=[...old.history,...(changes.length?[{at:when,event:changes.join(' · ')}]:[])].slice(-100);db.tickets[db.tickets.findIndex(x=>x.id===t.id)]=t}clearDraft();page='tickets';save();return t.id}

function dataPage(){return hero('Dữ liệu & sao lưu','File HTML độc lập. Dữ liệu mặc định chỉ nằm trên trình duyệt hiện tại.')+'<div class="card"><h2>Sao lưu & xuất dữ liệu</h2><div class="toolbar"><button class="btn primary" data-action="saveHtml">Tải HTML kèm dữ liệu</button><button class="btn" data-action="backup">Sao lưu JSON</button><button class="btn" data-action="exportAll">Xuất Excel nội bộ</button><button class="btn" data-action="exportCsv">Xuất CSV</button></div><p class="muted">HTML kèm dữ liệu là một bản chụp. Sau khi nhập thêm phiếu, hãy tải lại file mới hoặc sao lưu JSON. Bản Excel nội bộ có các cột thu tiền và ghi chú.</p></div><div class="card"><h2>Khôi phục & nhập dữ liệu</h2><div class="toolbar"><label class="btn file">Khôi phục JSON<input type="file" accept=".json" data-import="backup"></label><label class="btn file">Nhập CSV / Excel phiếu<input type="file" accept=".csv,.xlsx" data-import="tickets"></label><button class="btn" data-action="loadSample">Nạp 6 phiếu mẫu</button><button class="btn danger" data-action="clear">Xóa toàn bộ</button></div><p class="hint">Nhập phiếu nhận 12 cột của bản gốc: ngày nhận, mã, khách, điện thoại, thiết bị, lỗi, ngày mua, tháng bảo hành, trạng thái, hẹn trả, tiền công, tiền linh kiện. Dữ liệu mẫu chỉ nạp khi sổ trống. Khôi phục JSON thay toàn bộ dữ liệu.</p></div><div class="card"><h2>Giới hạn</h2><p>Không có tài khoản hoặc đồng bộ thiết bị. Đóng/mở qua file HTML mới có thể dùng vùng lưu trữ khác; hãy dùng chức năng tải HTML kèm dữ liệu. Bản này không gửi thông tin khách hàng đến API hoặc máy chủ.</p></div>'}
function guide(){return hero('Hướng dẫn','Một quy trình đủ để tiếp nhận, xử lý, bàn giao và đối chiếu tiền.')+'<div class="grid two"><div class="card"><h2>Quy trình 7 bước</h2><ol><li>Nhập thông tin cửa hàng ở Cài đặt.</li><li>Tạo phiếu và ghi rõ máy, số sê-ri, phụ kiện, lỗi, ngày mua và thời hạn bảo hành.</li><li>Hẹn ngày trả, giao kỹ thuật viên và chuyển trạng thái theo tiến độ.</li><li>Nhập tiền công và các linh kiện đã thay.</li><li>Kiểm tra kết quả bảo hành; nếu duyệt hoặc từ chối thủ công, ghi lý do.</li><li>Ghi nhận khoản thu, hoàn tất, trả máy cho khách và in phiếu.</li><li>Theo dõi cảnh báo, báo cáo và sao lưu định kỳ.</li></ol></div><div class="card"><h2>Cách tính như app gốc</h2><p>Trong bảo hành khi ngày nhận nằm từ ngày mua đến hết ngày mua cộng số tháng bảo hành. Khi trong bảo hành, số khách phải trả bằng 0. Ngoài bảo hành, khách phải trả = tiền công + tổng(số lượng × đơn giá linh kiện).</p><p>Trễ hẹn = số ngày từ hẹn trả đến ngày báo cáo khi phiếu chưa xong/chưa trả khách. Chờ linh kiện lâu = số ngày từ nhận đến ngày báo cáo vượt ngưỡng cài đặt.</p><p>App có thêm khoản đã thu, còn thu, lịch sử thay đổi và bản in. Quyết định bảo hành thực tế cần đối chiếu điều kiện đã cam kết với khách.</p></div></div>'}
function render(){let title={dashboard:'Tổng quan',tickets:'Phiếu tiếp nhận',edit:'Sửa / tiếp nhận',print:'Bản in phiếu',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=title[page];$('#topSub').textContent=db.tickets.length+' phiếu · Ngày báo cáo '+date(asof());$$('[data-page]',$('.side-nav')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=page==='dashboard'?dashboard():page==='tickets'?ticketsPage():page==='edit'?editPage():page==='print'?printPage():page==='reports'?reports():page==='settings'?settingsPage():page==='data'?dataPage():guide()}
function navigate(to){if(page==='edit'&&draft&&!confirm('Bỏ thay đổi chưa lưu?'))return;if(page==='edit')clearDraft();page=to;render();window.scrollTo(0,0)}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadBlob(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function xlsx(name,sheets){downloadBlob(name+'.xlsx',Excel.workbook(sheets.map(([name,rows])=>({name,rows}))))}
const ticketHeader=['Ngày nhận','Mã phiếu','Khách hàng','Điện thoại','Thiết bị','Lỗi, yêu cầu','Ngày mua','Bảo hành (tháng)','Trạng thái','Hẹn trả','Tiền công','Tiền linh kiện','Trong bảo hành','Khách phải trả','Đã thu','Còn thu','Số ngày trễ','Cảnh báo','Kỹ thuật viên','Số sê-ri / IMEI','Ngày hoàn tất','Ngày trả khách'];
function ticketRows(list=db.tickets){return[ticketHeader,...list.map(t=>{let m=metrics(t);return[t.receivedDate,t.code,t.customer,t.phone,t.device,t.issue,t.purchaseDate,t.warrantyMonths,t.status,t.dueDate,t.labor,m.parts,m.covered?1:0,m.charge,m.paid,m.due,m.late,m.warn,t.technician,t.serial,t.completedDate,t.returnedDate]})]}
function detailRows(){return[['Mã phiếu','Linh kiện','Số lượng','Đơn giá','Thành tiền'],...db.tickets.flatMap(t=>t.parts.map(p=>[t.code,p.name,p.qty,p.price,p.qty*p.price]))]}
function paymentRows(){return[['Mã phiếu','Ngày thu','Số tiền','Hình thức','Ghi chú'],...db.tickets.flatMap(t=>t.payments.map(p=>[t.code,p.date,p.amount,p.method,p.note]))]}
function exportAll(){xlsx('ai-mo-bao-hanh-du-lieu',[['Phiếu',ticketRows()],['Linh kiện',detailRows()],['Thanh toán',paymentRows()]])}
function exportReport(){let rows=db.tickets.filter(t=>t.receivedDate.startsWith(year));xlsx('bao-cao-bao-hanh-'+year,[['Phiếu',ticketRows(rows)],['Theo tháng',[['Tháng','Số phiếu','Khách phải trả','Đã thu','Còn thu'],...Array.from({length:12},(_,i)=>{let m=year+'-'+String(i+1).padStart(2,'0'),a=rows.filter(t=>t.receivedDate.startsWith(m));return[m,a.length,a.reduce((n,t)=>n+metrics(t).charge,0),a.reduce((n,t)=>n+metrics(t).paid,0),a.reduce((n,t)=>n+metrics(t).due,0)]})]]])}
function csvRows(rows){return '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function backup(){download('ai-mo-bao-hanh-sao-luu.json','application/json;charset=utf-8',JSON.stringify(db,null,2))}
function saveHtml(){let doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-state').textContent=btoa(unescape(encodeURIComponent(JSON.stringify(db))));download('ai-mo-bao-hanh-kem-du-lieu.html','text/html;charset=utf-8','<!doctype html>\n'+doc.outerHTML)}
function validBackup(x){
 if(!shape(x)||x.tickets.length>5000||!x.settings.company||!Number.isInteger(+x.settings.choLK)||+x.settings.choLK<0||+x.settings.choLK>365||x.settings.asof&&!validDate(x.settings.asof))return false;
 let logo=x.settings.company.logo||'';
 if(logo&&(!/^data:image\/(?:png|jpeg|webp);base64,/i.test(logo)||logo.length>1e6))return false;
 let ids=new Set(),codes=new Set();
 for(let t of x.tickets){
  if(!t.id||!t.code||ids.has(t.id)||codes.has(String(t.code).toLowerCase())||!validDate(t.receivedDate)||!t.customer||!t.device||!STATES.includes(t.status)||!Array.isArray(t.parts)||!Array.isArray(t.payments)||!Array.isArray(t.history)||t.parts.length>100||t.payments.length>100||t.history.length>100||!Number.isFinite(+t.labor)||+t.labor<0||+t.labor>1e12||!Number.isInteger(+t.warrantyMonths)||+t.warrantyMonths<0||+t.warrantyMonths>120||t.purchaseDate&&!validDate(t.purchaseDate)||t.dueDate&&!validDate(t.dueDate)||t.coverageOverride&&!['auto','covered','not-covered'].includes(t.coverageOverride))return false;
  if(t.parts.some(p=>!p||!p.name||!Number.isFinite(+p.qty)||+p.qty<=0||+p.qty>1e6||!Number.isFinite(+p.price)||+p.price<0||+p.price>1e12)||t.payments.some(p=>!p||!validDate(p.date)||!Number.isFinite(+p.amount)||+p.amount<=0||+p.amount>1e12))return false;
  ids.add(t.id);codes.add(String(t.code).toLowerCase());
 }
 return true;
}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);return rows}
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseDate(v){if(typeof v==='number'&&v>20000&&v<100000)return iso(new Date(Date.UTC(1899,11,30)+v*86400000));let s=String(v??'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
async function importTickets(file){let rows=file.name.toLowerCase().endsWith('.xlsx')?Object.values(await Excel.read(file))[0]||[]:parseCSV(await file.text());if(rows.length<2)throw Error('File cần dòng tiêu đề và ít nhất một phiếu.');let heads=rows[0].map(norm),aliases=[['ngaynhan','ngay'],['maphieu','ma'],['khachhang','khach'],['dienthoai','sdt'],['thietbi','tb'],['loiyeucau','loi'],['ngaymuadexetbaohanh','ngaymua'],['baohanhthang','thangbh'],['trangthai','tt'],['hentra','hen'],['tiencong','cong'],['tienlinhkien','lk']],at=aliases.map(a=>heads.findIndex(h=>a.includes(h)));if(at[0]<0||at[1]<0||at[2]<0||at[4]<0)throw Error('Thiếu cột ngày nhận, mã phiếu, khách hàng hoặc thiết bị.');let items=[];for(let r of rows.slice(1)){if(!r.some(v=>String(v??'').trim()))continue;let v=i=>at[i]<0?'':r[at[i]]??'',t=blankTicket();t.code=String(v(1)).trim();t.receivedDate=parseDate(v(0));t.customer=String(v(2)).trim();t.phone=String(v(3)).trim();t.device=String(v(4)).trim();t.issue=String(v(5)).trim();t.purchaseDate=parseDate(v(6));t.warrantyMonths=amount(v(7));t.status=STATES.includes(String(v(8)).trim())?String(v(8)).trim():'Đã nhận';t.dueDate=parseDate(v(9));t.labor=amount(v(10));let part=amount(v(11));if(part>0)t.parts=[{name:'Linh kiện (nhập từ bản gốc)',qty:1,price:part}];let error=validate(t);if(error)throw Error('Phiếu '+(t.code||'?')+': '+error);items.push(t)}if(!items.length)throw Error('Không có phiếu hợp lệ.');if(db.tickets.length+items.length>5000)throw Error('Vượt 5.000 phiếu.');let codes=new Set(db.tickets.map(t=>t.code.toLowerCase()));for(let t of items){if(codes.has(t.code.toLowerCase()))throw Error('Mã phiếu trùng: '+t.code);codes.add(t.code.toLowerCase())}if(!confirm('Nhập '+items.length+' phiếu?'))return;for(let t of items){t.id=uid();t.history=[{at:new Date().toLocaleString('vi-VN'),event:'Nhập từ Excel/CSV'}];db.tickets.push(t)}save();alert('Đã nhập '+items.length+' phiếu.')}
async function resizeImage(file){if(file.size>5e6)throw Error('Ảnh tối đa 5 MB.');let img=await createImageBitmap(file),scale=Math.min(1,300/img.width,300/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();return canvas.toDataURL('image/webp',.8)}
function loadSample(){if(db.tickets.length){alert('Chỉ nạp mẫu khi chưa có phiếu. Hãy sao lưu trước nếu cần.');return}if(!confirm('Nạp 6 phiếu mẫu từ app gốc?'))return;db.tickets=SAMPLE.map(a=>({id:uid(),code:a[1],receivedDate:addDays(today(),a[0]),customer:a[2],phone:a[3],device:a[4],model:'',serial:'',issue:a[5],purchaseDate:a[6]===null?'':addDays(today(),a[6]),warrantyMonths:a[7],status:a[8],dueDate:addDays(today(),a[9]),labor:a[10],parts:a[11]?[{name:'Linh kiện mẫu',qty:1,price:a[11]}]:[],payments:[],accessories:'',technician:'',completedDate:'',returnedDate:'',coverageOverride:'auto',coverageReason:'',diagnosis:'',internalNote:'',history:[{at:new Date().toLocaleString('vi-VN'),event:'Nạp dữ liệu mẫu từ app gốc'}]}));save()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-open],[data-remove-part],[data-remove-payment]');if(!b)return;let d=b.dataset;if(d.page){navigate(d.page);return}if(d.open){openTicket(d.open);return}if(d.removePart!==undefined){draft.parts.splice(+d.removePart,1);persistDraft();render();return}if(d.removePayment!==undefined){draft.payments.splice(+d.removePayment,1);persistDraft();render();return}switch(d.action){case'new':newTicket();break;case'save':saveTicket();break;case'print':{let id=saveTicket();if(id)printTicket(id);break}case'browserPrint':window.print();break;case'addPart':if(draft.parts.length<100){draft.parts.push({name:'',qty:1,price:0});persistDraft();render()}break;case'addPayment':if(draft.payments.length<100){draft.payments.push({date:today(),amount:0,method:'Tiền mặt',note:''});persistDraft();render()}break;case'duplicate':if(draft){let x=clone(draft);x.id=null;x.code=ticketNo();x.receivedDate=today();x.status='Đã nhận';x.payments=[];x.history=[];draft=x;persistDraft();render()}break;case'delete':if(draft?.id&&confirm('Xóa phiếu '+draft.code+'?')){db.tickets=db.tickets.filter(t=>t.id!==draft.id);clearDraft();page='tickets';save()}break;case'saveSettings':{let s=clone(db.settings);for(let el of $$('[data-setting]')){let k=el.dataset.setting;if(k.startsWith('company.'))s.company[k.split('.')[1]]=el.value.trim();else s[k]=k==='choLK'?amount(el.value):el.value.trim()}if(!s.company.ten.trim()||!Number.isInteger(s.choLK)||s.choLK<0||s.choLK>365||s.asof&&!validDate(s.asof)){alert('Tên đơn vị hoặc thông số cảnh báo không hợp lệ.');return}db.settings=s;save();break}case'removeLogo':db.settings.company.logo='';save();break;case'backup':backup();break;case'saveHtml':saveHtml();break;case'exportAll':exportAll();break;case'exportReport':exportReport();break;case'exportCsv':download('ai-mo-bao-hanh.csv','text/csv;charset=utf-8',csvRows(ticketRows()));break;case'loadSample':loadSample();break;case'clear':if(confirm('Xóa toàn bộ dữ liệu và cài đặt?')){db=empty();clearDraft();page='dashboard';save()}break}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='search'){let at=t.selectionStart;query=t.value;render();let next=$('#search');next?.focus();next?.setSelectionRange(at,at);return}if(t.dataset.field&&draft){let k=t.dataset.field;draft[k]=['warrantyMonths','labor'].includes(k)?amount(t.value):t.value;persistDraft();refreshSummary();return}if(t.dataset.part&&draft){let p=draft.parts[+t.dataset.i];p[t.dataset.part]=['qty','price'].includes(t.dataset.part)?amount(t.value):t.value;persistDraft();refreshSummary();let row=t.closest('tr');if(row)row.querySelector('td:nth-child(4)').textContent=money(p.qty*p.price);return}if(t.dataset.payment&&draft){let p=draft.payments[+t.dataset.i];p[t.dataset.payment]=t.dataset.payment==='amount'?amount(t.value):t.value;persistDraft();refreshSummary()}});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='statusFilter'){statusFilter=t.value;render();return}if(t.id==='yearPick'){year=t.value;render();return}if(t.id==='logoFile'&&t.files?.[0]){try{db.settings.company.logo=await resizeImage(t.files[0]);save()}catch(err){alert(err.message)}return}if(!t.dataset.import||!t.files?.[0])return;try{let f=t.files[0];if(t.dataset.import==='backup'){if(f.size>15e6)throw Error('File JSON quá lớn.');let x=JSON.parse(await f.text());if(!validBackup(x))throw Error('Bản sao lưu sai cấu trúc hoặc phiên bản.');if(confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?')){db=x;clearDraft();page='dashboard';save()}}else await importTickets(f)}catch(err){alert(err.message)}finally{t.value=''}});
window.addEventListener('beforeunload',e=>{if(draft){e.preventDefault();e.returnValue=''}});
try{let old=JSON.parse(sessionStorage.getItem(KEY+'-draft')||'null');if(old&&Array.isArray(old.parts)&&Array.isArray(old.payments)){draft=old;page='edit'}}catch{}
render();
</script></body></html>
