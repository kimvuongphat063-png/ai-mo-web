const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div class="empty">Chưa có dữ liệu phù hợp.</div>';
const badge=(s,t='')=>'<span class="badge '+t+'">'+esc(s)+'</span>';
const tone=s=>s==='Trong ngưỡng'||s==='Trong kỳ'||s==='Đã kiểm tra'?'ok':s==='Ngoài kỳ'?'':'alert';
const field=(k,label,type,value='',options='')=>'<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+options+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(value)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(value??'')+'">')+'</div>';
const v=k=>$('#f_'+k)?.value.trim()||'';
const navAction=(kind,id,label='Mở')=>'<button class="btn small" data-kind="'+kind+'" data-id="'+esc(id)+'">'+esc(label)+'</button>';
function dashboard(){let m=metrics(db),a=alerts(db);return hero('🔎 Kiểm tra sổ sách trước khóa sổ','Rà số dư, nhật ký, nguồn đối chiếu và bằng chứng theo một kỳ.')+'<section class="card"><div class="toolbar"><span class="steps"><span>① Số dư</span><span>② Nhật ký</span><span>③ Đối chiếu</span><span>④ Bảng kiểm</span></span><span class="grow"></span><button class="btn primary" data-page="issues">Xem '+a.length+' việc cần xử lý</button></div><div class="grid">'+metric('TK cần xử lý',m.accountIssues,m.accounts+' TK chi tiết')+metric('Dòng nhật ký lỗi',m.journalIssues,m.journal+' dòng')+metric('Đối chiếu chưa khớp',m.reconIssues)+metric('Mục kiểm còn mở',m.pending,m.overdue+' quá hạn')+metric('Lệch số dư tuyệt đối',money(m.absAccounts))+'</div><p class="notice">'+(m.ready?'Đủ bước rà soát nội bộ trong phạm vi dữ liệu đã xác nhận.':'Chưa đủ bước rà soát nội bộ.')+' · '+esc(db.settings.company||'Chưa nhập đơn vị')+' · Kỳ '+date(db.settings.start)+' – '+date(db.settings.end)+' · '+m.confirmed+'/4 nguồn đã xác nhận.</p></section><div class="split"><section class="card"><h2>⚠️ Ưu tiên xử lý</h2>'+(a.length?a.slice(0,8).map(x=>'<div class="check"><span><b>'+esc(x.code)+' · '+esc(x.name)+'</b><small>'+esc(NAMES[x.kind])+' · '+esc(x.reason)+'</small></span>'+navAction(x.kind,x.id)+'</div>').join(''):'<div class="empty">Không có cảnh báo từ dữ liệu đã nhập.</div>')+'</section><section class="card"><h2>Đối chiếu tổng</h2>'+table(['Chỉ tiêu','Giá trị'],[['Tổng dư thuần đầu kỳ',m.opening],['Tổng dư thuần cuối kỳ nguồn',m.closing],['Lệch số dư tuyệt đối',m.absAccounts],['Lệch đối chiếu tuyệt đối',m.absRecons],['Ngưỡng lệch nội bộ',db.settings.tolerance]].map(([k,n])=>'<tr><td>'+esc(k)+'</td><td class="num">'+money(n)+'</td></tr>'))+'<p class="muted">Tổng Nợ/Có cân vẫn chưa chứng minh dữ liệu đầy đủ hoặc đúng.</p></section></div>'}
function listToolbar(kind){return'<div class="toolbar"><input id="search" class="search" placeholder="Tìm mã, tên, chứng từ, người phụ trách..." value="'+esc(query)+'"><select id="filterPick">'+[['all','Tất cả'],['issues','Chỉ cần xử lý']].map(([k,l])=>opt(k,l,filter)).join('')+'</select><span class="grow"></span><button class="btn primary" data-new="'+kind+'">+ Thêm</button><button class="btn" data-action="excel">↓ Excel</button></div>'}
function filtered(kind){return db[kind].map(x=>EVAL[kind](x,db)).filter(x=>[x.code,x.name,x.title,x.description,x.source,x.owner,x.voucher,x.account].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))).filter(x=>filter!=='issues'||(kind==='checks'?!x.done:x.warnings.length||!['Trong ngưỡng','Trong kỳ','Ngoài kỳ'].includes(x.status)))}
function accountsPage(){let r=filtered('accounts');return hero('📘 Số dư tài khoản chi tiết','Dư tính = đầu Nợ − đầu Có + phát sinh Nợ − phát sinh Có; so riêng từng bên với nguồn cuối kỳ.')+'<section class="card">'+listToolbar('accounts')+'<p class="muted">'+r.length+' / '+db.accounts.length+' tài khoản. Ô trống là thiếu dữ liệu; nhập 0 khi đã xác nhận bằng 0.</p>'+table(['Mã / tên','Đầu Nợ','Đầu Có','PS Nợ','PS Có','Cuối Nợ tính','Cuối Có tính','Cuối Nợ nguồn','Cuối Có nguồn','Lệch tuyệt đối','Trạng thái',''],r.map(x=>'<tr><td><b>'+esc(x.code)+'</b><small class="row-note">'+esc(x.name)+'</small></td>'+['openD','openC','debit','credit','calcD','calcC','endD','endC','absDiff'].map(k=>'<td class="num">'+(x[k]===null||x[k]===''?'—':money(x[k]))+'</td>').join('')+'<td>'+badge(x.status,tone(x.status))+(x.warnings.length?'<small class="row-note">'+esc(x.warnings.join('; '))+'</small>':'')+'</td><td>'+navAction('accounts',x.id,'Chi tiết / sửa')+'</td></tr>'))+'</section>'}
function journalPage(){let r=filtered('journal');return hero('🧾 Nhật ký trong kỳ','Một dòng gồm một TK Nợ, một TK Có và số tiền; chứng từ nhiều dòng dùng chung số chứng từ.')+'<section class="card">'+listToolbar('journal')+'<div class="grid">'+metric('Dòng trong kỳ',r.filter(x=>x.inPeriod).length)+metric('Tổng phát sinh Nợ',money(sum(r.filter(x=>x.inPeriod),x=>x.amount)))+metric('Tổng phát sinh Có',money(sum(r.filter(x=>x.inPeriod),x=>x.amount)))+metric('Dòng cần xử lý',r.filter(x=>x.warnings.length).length)+'</div><p class="muted">Dòng nghi trùng vẫn được tính vào phát sinh để thấy sai lệch; phải kiểm tra chứng từ rồi sửa hoặc xóa có chủ đích.</p>'+table(['Mã dòng','Ngày','Chứng từ','TK Nợ','TK Có','Số tiền','Diễn giải','Bằng chứng','Trạng thái',''],r.map(x=>'<tr><td><b>'+esc(x.code)+'</b></td><td>'+date(x.date)+'</td><td>'+esc(x.voucher)+'</td><td>'+esc(x.debit)+'</td><td>'+esc(x.credit)+'</td><td class="num">'+money(x.amount)+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.evidence||'—')+'</td><td>'+badge(x.status,tone(x.status))+(x.warnings.length?'<small class="row-note">'+esc(x.warnings.join('; '))+'</small>':'')+'</td><td>'+navAction('journal',x.id,'Chi tiết / sửa')+'</td></tr>'))+'</section>'}
function reconsPage(){let r=filtered('recons');return hero('🔁 Đối chiếu nguồn độc lập','Dư Nợ nguồn nhập dương, dư Có nguồn nhập âm; chênh lệch = dư thuần tính − nguồn sau điều chỉnh.')+'<section class="card">'+listToolbar('recons')+'<p class="notice">Mỗi mã tài khoản chi tiết có một phạm vi đối chiếu. Nếu điều chỉnh nguồn khác 0, phải ghi căn cứ; không sửa số nguồn chỉ để xóa lệch.</p>'+table(['Mã','TK','Nguồn','Ngày nguồn','Dư thuần tính','Số nguồn','Điều chỉnh','Sau điều chỉnh','Chênh lệch','Trạng thái',''],r.map(x=>'<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.account)+'</td><td>'+esc(x.source)+'</td><td>'+date(x.date)+'</td>'+['net','amount','adjust','adjusted','diff'].map(k=>'<td class="num">'+(x[k]===null||x[k]===''?'—':money(x[k]))+'</td>').join('')+'<td>'+badge(x.status,tone(x.status))+(x.warnings.length?'<small class="row-note">'+esc(x.warnings.join('; '))+'</small>':'')+'</td><td>'+navAction('recons',x.id,'Chi tiết / sửa')+'</td></tr>'))+'</section>'}
function checksPage(){let r=filtered('checks'),all=db.checks.map(x=>checkEval(x,db));return hero('✅ Bảng kiểm trước khóa sổ','Giao trách nhiệm, ghi kết quả và bằng chứng của từng bước.')+'<section class="card">'+listToolbar('checks')+'<div class="grid">'+metric('Tổng mục',all.length)+metric('Đã kiểm tra',all.filter(x=>x.done).length)+metric('Còn mở',all.filter(x=>!x.done).length)+metric('Quá hạn',all.filter(x=>x.status==='Quá hạn').length)+'</div><p class="notice">“Đạt” và “Không áp dụng” chỉ được tính hoàn tất khi có ngày rà soát trong khoảng cuối kỳ đến ngày rà soát, bằng chứng/lý do và người kiểm tra.</p>'+table(['Mã','Nhóm','Nội dung','Kết quả','Phụ trách','Hạn','Ngày kiểm','Người kiểm','Trạng thái',''],r.map(x=>'<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.group)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.result)+'</td><td>'+esc(x.owner)+'</td><td>'+date(x.due)+'</td><td>'+date(x.reviewed)+'</td><td>'+esc(x.reviewer||'—')+'</td><td>'+badge(x.status,tone(x.status))+(x.warnings.length?'<small class="row-note">'+esc(x.warnings.join('; '))+'</small>':'')+'</td><td>'+navAction('checks',x.id,'Chi tiết / sửa')+'</td></tr>'))+'</section>'}
function issuesPage(){let a=alerts(db);return hero('⚠️ Việc cần xử lý','Mỗi cảnh báo dẫn về dòng nguồn; giải quyết tại đó rồi kiểm tra lại kết quả.')+'<section class="card"><div class="grid">'+metric('Tổng việc',a.length)+metric('Số dư',a.filter(x=>x.kind==='accounts').length)+metric('Nhật ký',a.filter(x=>x.kind==='journal').length)+metric('Đối chiếu',a.filter(x=>x.kind==='recons').length)+metric('Bảng kiểm',a.filter(x=>x.kind==='checks').length)+'</div>'+table(['Nhóm','Mã','Nội dung','Trạng thái','Nguyên nhân / việc cần làm','Lệch tuyệt đối','Phụ trách',''],a.map(x=>'<tr><td>'+esc(NAMES[x.kind])+'</td><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.name)+'</td><td>'+badge(x.status,tone(x.status))+'</td><td>'+esc(x.reason)+'</td><td class="num">'+money(x.amount)+'</td><td>'+esc(x.owner)+'</td><td>'+navAction(x.kind,x.id,'Xử lý')+'</td></tr>'))+'</section>'}
function reportPage(){let m=metrics(db);return hero('📄 Báo cáo rà soát nội bộ','Bản tổng hợp để in, ký duyệt và lưu cùng hồ sơ kỳ.')+'<section class="card"><div class="toolbar"><button class="btn" data-action="print">🖨️ In báo cáo</button><button class="btn" data-action="excel">↓ Excel</button></div><h2>'+esc(db.settings.company||'Đơn vị chưa nhập')+'</h2><p>Kỳ '+date(db.settings.start)+' – '+date(db.settings.end)+' · Rà soát '+date(db.settings.asof)+' · '+esc(db.settings.regime)+'</p>'+table(['Chỉ tiêu','Kết quả'],[['Tài khoản chi tiết',m.accounts],['Dòng nhật ký',m.journal],['TK cần xử lý',m.accountIssues],['Nhật ký lỗi',m.journalIssues],['Đối chiếu chưa khớp',m.reconIssues],['Bảng kiểm còn mở',m.pending],['Lệch số dư tuyệt đối',money(m.absAccounts)],['Lệch đối chiếu tuyệt đối',money(m.absRecons)],['Nguồn đã xác nhận',m.confirmed+'/4'],['Kết luận',m.ready?'Đủ bước rà soát nội bộ':'Chưa đủ bước rà soát nội bộ']].map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>'))+'<p class="notice">Kết luận chỉ phản ánh các kiểm tra tự động và xác nhận trong bộ dữ liệu này. Cần người có trách nhiệm đối chiếu chứng từ và phê duyệt theo quy trình đơn vị.</p><div class="signatures"><span>Người lập<br><br><br>(Ký, họ tên)</span><span>Người rà soát<br><br><br>(Ký, họ tên)</span><span>Kế toán trưởng<br><br><br>(Ký, họ tên)</span></div></section>'}
function settingsPage(){let s=db.settings;return hero('⚙️ Cài đặt kỳ và phạm vi','Chọn kỳ kế toán, ngưỡng nội bộ và xác nhận nguồn sau khi đã rà đủ dữ liệu.')+'<section class="card"><div class="formgrid">'+field('company','Tên đơn vị','text',s.company)+field('regime','Chế độ kế toán áp dụng','text',s.regime)+field('start','Từ ngày','date',s.start)+field('end','Đến ngày','date',s.end)+field('asof','Ngày rà soát','date',s.asof)+field('tolerance','Ngưỡng lệch nội bộ (đ)','number',s.tolerance)+[['accountsConfirmed','Đã đủ số dư chi tiết'],['journalConfirmed','Đã đủ nhật ký trong kỳ'],['reconsConfirmed','Đã đủ nguồn đối chiếu'],['checklistConfirmed','Đã rà đủ phạm vi bảng kiểm']].map(([k,l])=>field(k,l,'select','',YESNO.map(x=>opt(x,x,s[k])).join(''))).join('')+'</div><p><button class="btn primary" data-action="settings">Lưu cài đặt</button></p><p class="notice">Chỉ chọn “Có” sau khi kiểm tra tính đầy đủ của nguồn thực tế. Thay dữ liệu hoặc đổi kỳ sẽ đặt lại xác nhận; đổi kỳ còn mở lại kết quả bảng kiểm để rà theo kỳ mới.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & chuyển máy','Sao lưu theo kỳ và kiểm tra bản nhập trước khi dùng lại.')+'<section class="card"><div class="grid">'+KINDS.map(k=>metric(NAMES[k],db[k].length)).join('')+'</div><p class="notice">File HTML gốc không mang dữ liệu đã nhập trên trình duyệt sang máy khác. Tải HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excel">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV việc cần làm</button></div><p class="muted">Excel gồm 4 sheet dữ liệu, 1 sheet cài đặt, báo cáo và việc cần xử lý. Nhập Excel theo năm sheet đầu của file xuất từ app, thay toàn bộ dữ liệu sau xác nhận.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>14 tài khoản, 9 dòng nhật ký, 5 đối chiếu, 12 mục kiểm. Có chênh lệch cố ý để thực hành.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn và phạm vi','Một bộ dữ liệu cho một kỳ; kiểm tra kết quả và lưu bộ riêng khi kết thúc.')+'<section class="card"><ol><li>Cài kỳ, ngày rà soát và chế độ kế toán thực tế của đơn vị.</li><li>Nhập tài khoản chi tiết và số dư đầu/cuối nguồn; không nhập đồng thời mã cha và mã con hoặc bù trừ dư hai bên trên cùng mã.</li><li>Nhập nhật ký một cặp Nợ/Có mỗi dòng. Cùng một số chứng từ có thể có nhiều dòng; mã dòng phải riêng.</li><li>Đối chiếu nguồn độc lập đúng ngày cuối kỳ. Số dư Có nguồn nhập âm; mọi điều chỉnh cần căn cứ.</li><li>Giao bảng kiểm, nhập bằng chứng và người kiểm tra. Xử lý cảnh báo từ màn hình Việc cần xử lý.</li><li>Sau khi rà tính đầy đủ, xác nhận bốn nguồn trong Cài đặt, in báo cáo và sao lưu.</li></ol><p class="notice">Ngưỡng lệch là lựa chọn nội bộ; không làm mất lỗi thiếu dữ liệu hoặc chứng từ. Công cụ không ghi sổ, kết chuyển, khóa sổ hay xác định nghĩa vụ thuế. Tham khảo <a href="https://vanban.chinhphu.vn/?docid=183198&amp;pageid=27160" target="_blank" rel="noopener noreferrer">Luật Kế toán 88/2015/QH13</a> và <a href="https://congbao.chinhphu.vn/van-ban/thong-tu-so-99-2025-tt-btc-46529/59652.htm" target="_blank" rel="noopener noreferrer">Thông tư 99/2025/TT-BTC</a> theo chế độ áp dụng của đơn vị.</p></section>'}
function render(){let names={dashboard:'Tổng quan',issues:'Việc cần xử lý',accounts:'Số dư tài khoản',journal:'Nhật ký',recons:'Đối chiếu nguồn',checks:'Bảng kiểm',report:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,issues:issuesPage,accounts:accountsPage,journal:journalPage,recons:reconsPage,checks:checksPage,report:reportPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Kiểm tra sổ sách')+'</b> · '+esc(names[page])+' · '+date(db.settings.start)+' – '+date(db.settings.end)+'</div>'+views[page]()}
function modalField(f,x){let[k,l,t]=f,value=x[k]??'';if(t==='nature'||t==='yesno'||t==='result'||t==='group'){let options={nature:NATURE,yesno:YESNO,result:RESULT,group:GROUPS}[t];return field(k,l,'select','',options.map(z=>opt(z,z,value)).join(''))}if(t==='account'){let codes=db.accounts.map(a=>a.code),options=value&&!codes.includes(value)?[value,...codes]:codes;return field(k,l,'select','',options.map(z=>opt(z,z+' · '+(db.accounts.find(a=>a.code===z)?.name||'TK chưa có'),value)).join(''))}return field(k,l,t==='money'||t==='signed'?'number':t,value)}
function openModal(kind,key=''){if(!KINDS.includes(kind))return;if((kind==='journal'||kind==='recons')&&!db.accounts.length){alert('Hãy nhập tài khoản chi tiết trước.');page='accounts';render();return}let old=db[kind].find(x=>x.id===key)||{},defaults={code:'',date:db.settings.end,due:db.settings.asof,reviewed:'',nature:'Nợ',external:'Không',group:'Tổng hợp',result:'Chưa kiểm tra',amount:'',adjust:0,openD:'',openC:'',endD:'',endC:''},x={...defaults,...old};if(kind==='journal'){x.debit=old.debit||db.accounts[0]?.code||'';x.credit=old.credit||db.accounts[1]?.code||db.accounts[0]?.code||''}if(kind==='recons')x.account=old.account||db.accounts[0]?.code||'';modal={kind,key};$('#modalTitle').textContent=(key?'Sửa ':'Thêm ')+NAMES[kind].toLowerCase();$('#modalError').textContent='';$('#modalFields').innerHTML=FIELDS[kind].map(f=>modalField(f,x)).join('');$('#deleteModal').hidden=!key;$('#editor').showModal()}
function closeModal(){$('#editor').close();modal=null}
function saveModal(){if(!modal)return;let{kind,key}=modal,old=db[kind].find(x=>x.id===key),x={id:old?.id||uid()};for(let[k,l,t]of FIELDS[kind]){let raw=v(k);x[k]=t==='money'||t==='signed'?raw===''?'':Number(raw):raw}let d=structuredClone(db);d[kind]=old?d[kind].map(r=>r.id===old.id?x:r):[...d[kind],x];if(!valid(d)){$('#modalError').textContent='Dữ liệu sai: mã trùng, ngày, lựa chọn hoặc số tiền không hợp lệ. Kiểm tra từng ô.';return}if(kind==='accounts'){if(!x.name){$('#modalError').textContent='Cần tên tài khoản.';return}if(old&&x.code!==old.code&&(db.journal.some(j=>j.debit===old.code||j.credit===old.code)||db.recons.some(r=>r.account===old.code))){$('#modalError').textContent='Mã TK đang được tham chiếu; xử lý các dòng liên quan trước.';return}}if(kind==='journal'&&(!x.voucher||!x.debit||!x.credit||x.debit===x.credit||!safe(x.amount)||x.amount<=0)){$('#modalError').textContent='Nhập số chứng từ, hai TK khác nhau và số tiền nguyên dương.';return}if(kind==='recons'&&d.recons.filter(r=>r.account===x.account).length>1){$('#modalError').textContent='Mỗi mã TK chỉ có một phạm vi đối chiếu.';return}if(kind==='checks'&&!x.title){$('#modalError').textContent='Cần nội dung kiểm tra.';return}resetConfirm(d);db=d;closeModal();save()}
function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('kiem-tra-so-sach-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){let head={accounts:['id',...FIELDS.accounts.map(f=>f[0])],journal:['id',...FIELDS.journal.map(f=>f[0])],recons:['id',...FIELDS.recons.map(f=>f[0])],checks:['id',...FIELDS.checks.map(f=>f[0])]},names={accounts:'SoDu',journal:'NhatKy',recons:'DoiChieu',checks:'BangKiem'},source=KINDS.map(kind=>({name:names[kind],rows:[head[kind],...db[kind].map(x=>head[kind].map(k=>x[k]??''))]})),m=metrics(db),issue=alerts(db);return[...source,{name:'CaiDat',rows:[['key','value'],...Object.entries(db.settings)]},{name:'TongHop',rows:[['Chỉ tiêu','Giá trị'],['TK cần xử lý',m.accountIssues],['Nhật ký lỗi',m.journalIssues],['Đối chiếu chưa khớp',m.reconIssues],['Bảng kiểm còn mở',m.pending],['Lệch số dư tuyệt đối',m.absAccounts],['Lệch đối chiếu tuyệt đối',m.absRecons],['Kết luận',m.ready?'Đủ bước rà soát nội bộ':'Chưa đủ bước rà soát nội bộ']]},{name:'CanXuLy',rows:[['Nhóm','Mã','Nội dung','Trạng thái','Việc cần làm','Lệch tuyệt đối','Phụ trách'],...issue.map(x=>[NAMES[x.kind],x.code,x.name,x.status,x.reason,x.amount,x.owner])]}]}
function parsedExcel(sheets){let d=blank(),names={accounts:'SoDu',journal:'NhatKy',recons:'DoiChieu',checks:'BangKiem'};for(let kind of KINDS){let rows=sheets[names[kind]],keys=['id',...FIELDS[kind].map(f=>f[0])];if(!Array.isArray(rows)||rows[0]?.join('|')!==keys.join('|'))throw Error('Thiếu hoặc sai sheet '+names[kind]);d[kind]=rows.slice(1).filter(r=>r.some(x=>String(x??'').trim())).map(r=>Object.fromEntries(keys.map((k,i)=>{let type=FIELDS[kind].find(f=>f[0]===k)?.[2],value=r[i]??'';return[k,type==='money'||type==='signed'?value===''?'':Number(value):String(value)]})))}let settings=sheets.CaiDat;if(!Array.isArray(settings)||settings[0]?.join('|')!=='key|value')throw Error('Thiếu hoặc sai sheet CaiDat');for(let[k,value]of settings.slice(1)){if(!Object.hasOwn(d.settings,k))continue;d.settings[k]=k==='tolerance'?Number(value):String(value??'')}if(!valid(d))throw Error('Excel có mã trùng, ngày hoặc số tiền không hợp lệ.');return d}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='kiem-tra-so-sach.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function csv(){let rows=[['Nhóm','Mã','Nội dung','Trạng thái','Việc cần làm','Lệch tuyệt đối','Phụ trách'],...alerts(db).map(x=>[NAMES[x.kind],x.code,x.name,x.status,x.reason,x.amount,x.owner])];let cell=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};download('viec-can-xu-ly.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-kind],[data-new],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';filter='all';render();return}if(b.dataset.kind){openModal(b.dataset.kind,b.dataset.id);return}if(b.dataset.new){openModal(b.dataset.new);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')window.print();if(a==='backup')download('kiem-tra-so-sach.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='csv')csv();if(a==='sample'&&confirm('Nạp dữ liệu mẫu sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?')){db=sample();save()}if(a==='clear'&&confirm('Xóa toàn bộ dữ liệu kiểm tra sổ sách trên trình duyệt này?')){db=blank();save()}if(a==='settings'){let d=structuredClone(db),s=d.settings,old=db.settings;s.company=v('company');s.regime=v('regime');s.start=v('start');s.end=v('end');s.asof=v('asof');s.tolerance=Number(v('tolerance'));for(let k of ['accountsConfirmed','journalConfirmed','reconsConfirmed','checklistConfirmed'])s[k]=v(k);if(!valid(d)||!s.company||!s.regime){alert('Cài đặt không hợp lệ: kiểm tra đơn vị, kỳ, ngày rà soát và ngưỡng lệch.');return}if(s.start!==old.start||s.end!==old.end){if(!confirm('Đổi kỳ sẽ mở lại bảng kiểm và đặt bốn xác nhận nguồn về Không. Tiếp tục?'))return;resetConfirm(d);for(let x of d.checks){x.result='Chưa kiểm tra';x.reviewed='';x.evidence='';x.reviewer=''}}else if(s.asof!==old.asof){resetConfirm(d)}db=d;save()}if(a==='deleteRecord'&&modal?.key){let{kind,key}=modal,x=db[kind].find(r=>r.id===key);if(kind==='accounts'&&(db.journal.some(j=>j.debit===x.code||j.credit===x.code)||db.recons.some(r=>r.account===x.code))){$('#modalError').textContent='TK đang được tham chiếu; chưa thể xóa.';return}if(!confirm('Xóa vĩnh viễn bản ghi này? Các báo cáo sẽ tính lại.'))return;db[kind]=db[kind].filter(r=>r.id!==key);resetConfirm(db);closeModal();save()}});
document.addEventListener('change',e=>{if(e.target.id==='filterPick'){filter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(pos,pos)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await f.text());if(!valid(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(f));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
