function valid(d){if(!d||d.version!==1||!d.settings||!Array.isArray(d.adjustments)||!Array.isArray(d.losses)||d.adjustments.length>3000||d.losses.length>1000)return false;let s=d.settings;if(typeof s.company!=='string'||s.company.length>200||!int(s.taxYear)||s.taxYear<2025||s.taxYear>2100||!dateOK(s.asof)||!int(s.profit)||!int(s.tolerance)||s.tolerance<0)return false;for(let k of ['adjustments','losses']){let codes=new Set(),years=new Set();for(let x of d[k]){if(!x||typeof x.id!=='string'||typeof x.code!=='string'||!x.code.trim()||x.code.length>60||codes.has(x.code))return false;codes.add(x.code);if(!int(x.year)||x.year<1900||x.year>2100||typeof x.basis!=='string'||typeof x.owner!=='string'||x.basis.length>2000||x.owner.length>200)return false;if(k==='adjustments'){if(!KINDS.includes(x.kind)||!APPROVAL.includes(x.approval)||typeof x.description!=='string'||x.description.length>2000||!int(x.amount)||x.amount<0)return false}else{if(years.has(x.year)||!int(x.original)||!int(x.prior)||!int(x.request)||x.original<0||x.prior<0||x.request<0||!YES.includes(x.eligible))return false;years.add(x.year)}}}return true}
function adjustment(x,d){let issues=[];if(x.year!==d.settings.taxYear)issues.push('Sai năm tính thuế');if(x.approval!=='Đã duyệt')issues.push('Chưa duyệt');if(!x.description.trim()||!x.basis.trim()||!x.owner.trim())issues.push('Thiếu nội dung, căn cứ hoặc người rà soát');if(x.amount<=0)issues.push('Số tiền chưa dương');return{...x,issues,included:issues.length===0,increase:issues.length?0:x.kind===KINDS[0]?x.amount:0,decrease:issues.length?0:x.kind===KINDS[1]?x.amount:0,exempt:issues.length?0:x.kind===KINDS[2]?x.amount:0}}
function lossBasic(x,d){let issues=[],remaining=Math.max(x.original-x.prior,0),expiry=x.year+5;if(x.year>=d.settings.taxYear)issues.push('Chưa đến năm được chuyển');if(d.settings.taxYear>expiry)issues.push('Hết hạn 5 năm');if(x.prior>x.original||x.request>remaining)issues.push('Vượt số lỗ còn lại');if(x.eligible!=='Có'||!x.basis.trim()||!x.owner.trim())issues.push('Chưa xác minh điều kiện hoặc thiếu hồ sơ');return{...x,remaining,expiry,issues,allowed:issues.length?0:x.request,used:0,after:remaining}}
function calculate(d){let adjustments=d.adjustments.map(x=>adjustment(x,d)),inc=adjustments.reduce((a,x)=>a+x.increase,0),dec=adjustments.reduce((a,x)=>a+x.decrease,0),exempt=adjustments.reduce((a,x)=>a+x.exempt,0),taxable=d.settings.profit+inc-dec,before=taxable-exempt,capacity=Math.max(before,0),losses=d.losses.map(x=>lossBasic(x,d)).sort((a,b)=>a.year-b.year||a.code.localeCompare(b.code,'vi'));for(let x of losses){x.used=Math.min(x.allowed,capacity);capacity-=x.used;x.after=x.remaining-x.used;if(x.allowed>x.used)x.issues.push('Chưa dùng hết yêu cầu do giới hạn thu nhập dương')}let used=losses.reduce((a,x)=>a+x.used,0),final=Math.max(before-used,0),issues=[...adjustments.filter(x=>x.issues.length).map(x=>({type:'Điều chỉnh',code:x.code,reason:x.issues.join('; '),amount:x.amount,id:x.id})),...losses.filter(x=>x.issues.length).map(x=>({type:'Chuyển lỗ',code:x.code,reason:x.issues.join('; '),amount:x.request,id:x.id}))];return{adjustments,losses,profit:d.settings.profit,increase:inc,decrease:dec,taxable,exempt,before,used,final,issues,ready:issues.length===0}}
function steps(t){return[['01','Lợi nhuận kế toán trước thuế',t.profit],['02','Điều chỉnh tăng',t.increase],['03','Điều chỉnh giảm',-t.decrease],['04','Thu nhập chịu thuế',t.taxable],['05','Thu nhập miễn thuế',-t.exempt],['06','Trước chuyển lỗ (giữ cả âm)',t.before],['07','Lỗ sử dụng năm này',-t.used],['08','Thu nhập tính thuế mô hình',t.final]]}

const hero=(h,p)=>'<div class="hero"><h1>'+esc(h)+'</h1><p>'+esc(p)+'</p></div>',metric=(h,n,p='')=>'<div class="metric"><small>'+esc(h)+'</small><strong>'+money(n)+'</strong><div class="sub">'+esc(p)+'</div></div>',table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div class="empty">Chưa có dòng nào. Dùng nút Thêm hoặc nạp mẫu để bắt đầu.</div>',btn=(name,id,k)=>'<button class="btn small" data-edit="'+esc(k)+':'+esc(id)+'">'+esc(name)+'</button>',status=x=>'<span class="badge '+(x.issues.length?'alert':'ok')+'">'+(x.issues.length?'Cần rà soát':'Đủ điều kiện')+'</span>';

function render(){$('#topTitle').textContent=titles[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML='<div class="print-head">'+esc(db.settings.company)+' · '+esc(titles[page])+' · '+esc(db.settings.taxYear)+'</div>'+views[page]()}
function openModal(kind,id=''){let old=db[kind].find(x=>x.id===id)||{},x=kind==='adjustments'?{code:'',year:db.settings.taxYear,kind:KINDS[0],description:'',amount:0,approval:'Chờ duyệt',basis:'',owner:''}:{code:'',year:db.settings.taxYear-1,original:0,prior:0,request:0,eligible:'Chưa xác minh',basis:'',owner:''};x={...x,...old};modal={kind,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+(kind==='losses'?'năm lỗ':'điều chỉnh');let t=calculate(db),ev=id?(kind==='losses'?t.losses:t.adjustments).find(y=>y.id===id):null;$('#modalFields').innerHTML=(ev?'<p class="wide notice '+(ev.issues.length?'bad':'good')+'">'+esc(ev.issues.join('; ')||'Dòng đang đủ điều kiện theo dữ liệu khai báo')+'</p>':'<p class="wide notice">Nhập số nguyên VND; căn cứ và người rà soát cần hồ sơ thực tế.</p>')+(kind==='losses'?lossFields:adjustFields).map(([k,l,type])=>field(k,l,type,x[k],type==='kind'?KINDS:type==='approval'?APPROVAL:type==='yes'?YES:[])).join('');$('#modalError').textContent='';$('#deleteModal').hidden=!id;$('#editor').showModal()}
function readModal(){let fields=modal.kind==='losses'?lossFields:adjustFields,x={id:modal.id||crypto.randomUUID()};for(let[k,l,type]of fields){let v=$('#f_'+k).value.trim();x[k]=type==='number'?v===''?NaN:Number(v):v}return x}
function saveModal(){let x=readModal(),d=clone(db),list=d[modal.kind],i=list.findIndex(y=>y.id===modal.id);if(i>=0)list[i]=x;else list.push(x);if(!valid(d)){$('#modalError').textContent='Kiểm tra mã/năm lỗ trùng, năm, lựa chọn và số tiền nguyên không âm.';return}db=d;$('#editor').close();modal=null;persist()}
function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+enc(db)+'$2');download('cau-noi-thue-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function excelSheets(){let t=calculate(db);return[{name:'DieuChinh',rows:[['id',...adjustFields.map(x=>x[0])],...db.adjustments.map(x=>[x.id,...adjustFields.map(f=>x[f[0]])])]},{name:'ChuyenLo',rows:[['id',...lossFields.map(x=>x[0])],...db.losses.map(x=>[x.id,...lossFields.map(f=>x[f[0]])])]},{name:'CaiDat',rows:[['key','value'],...Object.entries(db.settings)]},{name:'CauNoi',rows:[['Bước','Nội dung','Số tiền'],...steps(t)]},{name:'CanRa',rows:[['Loại','Mã','Lý do','Số tiền'],...t.issues.map(x=>[x.type,x.code,x.reason,x.amount])]}]}
function csv(){let t=calculate(db),rows=[['Loại','Mã','Năm','Nội dung / hồ sơ','Số tiền / yêu cầu','Dùng / tính vào','Cảnh báo'],...t.adjustments.map(x=>['Điều chỉnh',x.code,x.year,x.description,x.amount,x.increase+x.decrease+x.exempt,x.issues.join('; ')]),...t.losses.map(x=>['Chuyển lỗ',x.code,x.year,x.basis,x.request,x.used,x.issues.join('; ')])],cell=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};download('cau-noi-thue.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new);return}if(b.dataset.edit){let[k,id]=b.dataset.edit.split(':');openModal(k,id);return}let a=b.dataset.action;if(a==='close'){$('#editor').close();modal=null}if(a==='saveModal')saveModal();if(a==='deleteRecord'&&modal?.id&&confirm('Xóa dòng này và tính lại cầu nối?')){db[modal.kind]=db[modal.kind].filter(x=>x.id!==modal.id);$('#editor').close();modal=null;persist()}if(a==='print')window.print();if(a==='settings'){let d=clone(db),s=d.settings,profitInput=$('#f_profit').value.trim(),toleranceInput=$('#f_tolerance').value.trim();if(!profitInput||!toleranceInput){alert('Nhập rõ lợi nhuận và ngưỡng; dùng 0 khi đã xác nhận bằng 0.');return}s.company=$('#f_company').value.trim();s.taxYear=Number($('#f_taxYear').value);s.asof=$('#f_asof').value;s.profit=Number(profitInput);s.tolerance=Number(toleranceInput);if(!valid(d)){alert('Thiết lập không hợp lệ.');return}if(db.adjustments.length+db.losses.length&&s.taxYear!==db.settings.taxYear&&!confirm('Đổi năm sẽ tính lại điều chỉnh và chuyển lỗ. Tiếp tục?'))return;db=d;persist()}if(a==='sample'&&confirm('Nạp mẫu sẽ thay thế dữ liệu hiện tại. Tiếp tục?')){db=sample();persist()}if(a==='clear'&&confirm('Xóa dữ liệu đang lưu trên trình duyệt này?')){db=blank();persist()}if(a==='backup')download('cau-noi-thue.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='excel')download('cau-noi-thue.xlsx',Excel.workbook(excelSheets()),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');if(a==='csv')csv()});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)}});
$('#restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30000000)throw Error('File quá lớn');let d=JSON.parse(await f.text());if(!valid(d))throw Error('Sai cấu trúc hoặc phiên bản');if(!confirm('Khôi phục sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;db=d;persist()}catch(err){alert('Không khôi phục được: '+err.message)}});
window.__BRIDGE_TEST__={blank,sample,valid,dateOK,int,calculate,steps,excelSheets,enc,dec,readModal,setDB:d=>{db=d;render()},getDB:()=>db,renderPage:p=>{page=p;render()}};
render();
})();
</script></body></html>
