const copy=x=>JSON.parse(JSON.stringify(x)),id=()=>crypto.randomUUID?.()||('id-'+Date.now()+Math.random()),today=()=>new Date().toLocaleDateString('sv-SE');
const validDate=s=>/^\d{4}-\d\d-\d\d$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s;
const fmt=s=>s?`${s.slice(8)}/${s.slice(5,7)}/${s.slice(0,4)}`:'—',num=n=>Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:2});
const days=(a,b)=>Math.round((Date.parse(a+'T12:00:00')-Date.parse(b+'T12:00:00'))/86400000);
const empty=()=>({app:APP,version:VERSION,settings:{asof:today(),tonDu:400},products:[],orders:[],events:[],audit:[]});
let db=empty(),page='board',selected='',filter='all',search='',draft=null;
const product=pid=>db.products.find(p=>p.id===pid),order=oid=>db.orders.find(o=>o.id===oid),eventsFor=oid=>db.events.filter(e=>e.orderId===oid);
function delivered(o){return o.initialDelivered+db.events.filter(e=>e.orderId===o.id&&e.kind==='dispatch').reduce((n,e)=>n+e.qty,0)}
function remaining(o){return Math.max(0,o.qty-delivered(o))}
function state(o){return o.cancelled?'Hủy':remaining(o)<=0?'Đã giao':delivered(o)>0?'Giao một phần':'Chờ giao'}
function stock(p){return p.opening+db.events.filter(e=>e.productId===p.id).reduce((n,e)=>n+(e.kind==='receipt'||e.kind==='adjust'?e.qty:e.kind==='dispatch'?-e.qty:0),0)}
function held(o){return db.events.filter(e=>e.orderId===o.id).reduce((n,e)=>n+(e.kind==='hold'?e.qty:e.kind==='release'?-e.qty:e.kind==='dispatch'?-e.holdUsed:0),0)}
function heldFor(p){return db.orders.filter(o=>o.productId===p.id&&!o.cancelled).reduce((n,o)=>n+held(o),0)}
function waiting(p){return db.orders.filter(o=>o.productId===p.id&&!o.cancelled).reduce((n,o)=>n+remaining(o),0)}
function stats(p){let s=stock(p),w=waiting(p),h=heldFor(p);return {stock:s,waiting:w,free:s-w,short:Math.max(0,w-s),held:h,unheld:s-h,warning:w>s?'Thiếu thành phẩm':s-w>db.settings.tonDu?'Tồn dư lớn':''}}
function overdue(o){return !o.cancelled&&remaining(o)>0?Math.max(0,days(db.settings.asof,o.due)):0}
function orderFlags(o){let a=[];if(overdue(o)>0)a.push('Quá hạn '+overdue(o)+' ngày');if(remaining(o)>0&&stats(product(o.productId)).short>0)a.push('Mã thành phẩm đang thiếu');return a}
function total(){let p=db.products.map(stats),active=db.orders.filter(o=>!o.cancelled),open=active.filter(o=>remaining(o)>0);return {products:db.products.length,orders:db.orders.length,open:open.length,done:active.filter(o=>remaining(o)===0).length,partial:open.filter(o=>delivered(o)>0).length,stock:p.reduce((n,x)=>n+x.stock,0),waiting:p.reduce((n,x)=>n+x.waiting,0),short:p.reduce((n,x)=>n+x.short,0),held:p.reduce((n,x)=>n+x.held,0),overdue:open.filter(o=>overdue(o)>0).length}}
function validate(x){if(!x||x.app!==APP||x.version!==VERSION||!x.settings||!validDate(x.settings.asof)||!Number.isFinite(x.settings.tonDu)||x.settings.tonDu<0||!Array.isArray(x.products)||!Array.isArray(x.orders)||!Array.isArray(x.events)||!Array.isArray(x.audit))return 'Cấu trúc dữ liệu không hợp lệ.';
 let pids=new Set(),codes=new Set();for(let p of x.products){if(!p.id||pids.has(p.id)||!p.code||codes.has(p.code.toUpperCase())||!p.name||!Number.isSafeInteger(p.opening)||p.opening<0||String(p.note||'').length>1000)return 'Thành phẩm không hợp lệ hoặc trùng mã.';pids.add(p.id);codes.add(p.code.toUpperCase())}
 let oids=new Set(),nums=new Set();for(let o of x.orders){if(!o.id||oids.has(o.id)||!o.number||nums.has(o.number.toUpperCase())||!pids.has(o.productId)||!validDate(o.date)||!validDate(o.due)||o.due<o.date||!o.customer||!Number.isSafeInteger(o.qty)||o.qty<=0||!Number.isSafeInteger(o.initialDelivered)||o.initialDelivered<0||o.initialDelivered>o.qty||typeof o.cancelled!=='boolean'||String(o.note||'').length>1000)return 'Đơn hàng không hợp lệ hoặc trùng mã.';oids.add(o.id);nums.add(o.number.toUpperCase())}
 let ids=new Set();for(let e of x.events){if(!e.id||ids.has(e.id)||!['receipt','adjust','dispatch','hold','release'].includes(e.kind)||!validDate(e.date)||!Number.isSafeInteger(e.qty)||e.qty===0||!pids.has(e.productId)||String(e.note||'').length>1000)return 'Nhật ký kho không hợp lệ.';ids.add(e.id);if(['dispatch','hold','release'].includes(e.kind)){let o=x.orders.find(o=>o.id===e.orderId);if(!o||o.productId!==e.productId||o.cancelled||e.qty<=0||e.date<o.date)return 'Sự kiện đơn hàng không hợp lệ.'}else if(e.orderId)return 'Nhật ký nhập/điều chỉnh không gắn đơn hàng.';if(e.kind==='receipt'&&e.qty<0||e.kind==='hold'&&e.qty<0||e.kind==='release'&&e.qty<0||e.kind==='dispatch'&&(!Number.isSafeInteger(e.holdUsed)||e.holdUsed<0||e.holdUsed>e.qty))return 'Số lượng sự kiện không hợp lệ.'}
 for(let o of x.orders){let ev=x.events.filter(e=>e.orderId===o.id),d=o.initialDelivered+ev.filter(e=>e.kind==='dispatch').reduce((n,e)=>n+e.qty,0),h=ev.reduce((n,e)=>n+(e.kind==='hold'?e.qty:e.kind==='release'?-e.qty:e.kind==='dispatch'?-e.holdUsed:0),0);if(d>o.qty||h<0||h>o.qty-d||o.cancelled&&(d<o.qty&&h>0))return 'Phân bổ hoặc giao vượt số lượng đơn.'}
 for(let p of x.products){let s=p.opening+x.events.filter(e=>e.productId===p.id).reduce((n,e)=>n+(e.kind==='receipt'||e.kind==='adjust'?e.qty:e.kind==='dispatch'?-e.qty:0),0),h=x.orders.filter(o=>o.productId===p.id&&!o.cancelled).reduce((n,o)=>n+x.events.filter(e=>e.orderId===o.id).reduce((a,e)=>a+(e.kind==='hold'?e.qty:e.kind==='release'?-e.qty:e.kind==='dispatch'?-e.holdUsed:0),0),0);if(s<0||h>s)return 'Tồn hoặc giữ chỗ vượt hàng hiện có.'}
 let logs=new Set();for(let a of x.audit){if(!a.id||logs.has(a.id)||!a.at||!a.action)return 'Nhật ký thao tác không hợp lệ.';logs.add(a.id)}return ''}
function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function embedded(){try{let s=$('#embedded-state').textContent.trim();return s==='e30='?null:JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
try{let e=embedded(),l=JSON.parse(localStorage.getItem(KEY)||'null');if(e&&!validate(e))db=e;else if(l&&!validate(l))db=l}catch{}
function save(){let v=validate(db);if(v){alert('Không lưu: '+v);return false}try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Bộ nhớ không lưu được. Hãy tải bản sao JSON/HTML kèm dữ liệu.')}render();return true}
function log(action,detail,ref=''){db.audit.push({id:id(),at:new Date().toISOString(),action,detail,ref})}
function btn(label,action,cls='',key=''){return `<button type="button" class="btn ${cls}" data-act="${action}" ${key?`data-id="${E(key)}"`:''}>${label}</button>`}
function panel(title,body,cls=''){return `<section class="panel ${cls}"><h2>${title}</h2>${body}</section>`}
function badge(v){return `<span class="badge ${v==='Đã giao'?'done':v==='Giao một phần'?'partial':v==='Chờ giao'?'pending':'cancel'}">${E(v)}</span>`}
function orderCard(o){let p=product(o.productId),r=remaining(o),d=delivered(o);return `<article class="order-card"><div class="order-card-top"><button class="textlink" data-act="openOrder" data-id="${E(o.id)}">${E(o.number)}</button>${badge(state(o))}</div><b>${E(o.customer)}</b><p>${E(p.code)} · ${E(p.name)}</p><div class="progress"><i style="width:${Math.min(100,d/o.qty*100)}%"></i></div><small>${num(d)} đã giao / ${num(o.qty)} đặt · còn ${num(r)} · hạn ${fmt(o.due)}</small>${overdue(o)?`<span class="alert">Trễ ${overdue(o)} ngày</span>`:''}${r?`<div class="card-actions">${btn('Giữ chỗ','hold','subtle',o.id)}${btn('Giao hàng','dispatch','primary',o.id)}</div>`:''}</article>`}
function board(){let s=total(),short=db.products.filter(p=>stats(p).short>0),open=db.orders.filter(o=>!o.cancelled&&remaining(o)>0),late=open.filter(o=>overdue(o)>0).sort((a,b)=>overdue(b)-overdue(a)),partial=open.filter(o=>delivered(o)>0),ready=open.filter(o=>delivered(o)===0&&overdue(o)===0);return `<div class="page-heading"><div><span class="eyebrow">AI MỞ / ĐIỀU PHỐI THÀNH PHẨM</span><h1>Từ tồn kho đến đơn đã giao</h1><p>Nhìn thiếu hàng theo từng mã, giữ chỗ hợp lý và ghi từng lượt giao.</p></div><div class="heading-actions">${btn('＋ Lập đơn','newOrder','primary')}${btn('＋ Nhập thành phẩm','newReceipt')}</div></div><section class="inventory-strip"><div><small>THÀNH PHẨM HIỆN CÓ</small><strong>${num(s.stock)}</strong></div><div><small>ĐƠN CHỜ GIAO*</small><strong>${num(s.waiting)}</strong></div><div><small>THIẾU THEO TỪNG MÃ</small><strong>${num(s.short)}</strong></div><div><small>ĐANG GIỮ CHỖ</small><strong>${num(s.held)}</strong></div><div><small>ĐƠN QUÁ HẠN</small><strong>${s.overdue}</strong></div></section><section class="priority-zone">${panel('Cần bổ sung sản xuất',short.length?short.map(p=>{let x=stats(p);return `<div class="priority-row"><button class="textlink" data-act="openProduct" data-id="${E(p.id)}">${E(p.code)} · ${E(p.name)}</button><span>Thiếu <b>${num(x.short)}</b> · tồn ${num(x.stock)} / chờ ${num(x.waiting)}</span></div>`}).join(''):'<p class="good">Không có mã thiếu so với đơn chờ.</p>','priority-short')}${panel('Đơn đến hạn cần ưu tiên',late.length?late.slice(0,6).map(o=>`<div class="priority-row"><button class="textlink" data-act="openOrder" data-id="${E(o.id)}">${E(o.number)} · ${E(o.customer)}</button><span>Trễ ${overdue(o)} ngày · còn ${num(remaining(o))}</span></div>`).join(''):'<p class="good">Không có đơn quá hạn.</p>','priority-late')}</section><div class="board-head"><div><h2>Luồng giao hàng</h2><p>Mỗi thẻ giữ tiến độ của một đơn. Chọn thẻ để xem lịch sử.</p></div>${btn('Mở sổ đơn','orders')}</div><div class="kanban"><section><h3>01 · Cần giao <span>${ready.length}</span></h3>${ready.slice(0,5).map(orderCard).join('')||'<p class="empty">Chưa có đơn mới.</p>'}</section><section><h3>02 · Đang giao một phần <span>${partial.length}</span></h3>${partial.slice(0,5).map(orderCard).join('')||'<p class="empty">Chưa có đơn giao một phần.</p>'}</section><section><h3>03 · Quá hạn <span>${late.length}</span></h3>${late.slice(0,5).map(orderCard).join('')||'<p class="empty">Không có đơn quá hạn.</p>'}</section></div><p class="footnote">* Số chờ giao tính phần chưa giao của đơn còn hiệu lực. Tổng nhiều mã chỉ để định hướng; thiếu hàng phải xem theo từng mã. Hàng “Đã giao” trong mẫu gốc không tạo lượt xuất giả.</p>`}
function productsPage(){return `<div class="page-heading"><div><span class="eyebrow">01 / DANH MỤC THÀNH PHẨM</span><h1>Tồn và nhu cầu theo mã</h1><p>Giữ chỗ và giao hàng chỉ có hiệu lực trên từng mã, không bù chéo tồn.</p></div><div class="heading-actions">${btn('＋ Thành phẩm','newProduct','primary')}${btn('＋ Nhập kho','newReceipt')}</div></div><div class="product-grid">${db.products.map(p=>{let x=stats(p);return `<article class="product-tile ${x.short?'needs':''}"><small>${E(p.code)}</small><h2>${E(p.name)}</h2><div class="product-numbers"><div><b>${num(x.stock)}</b><span>Tồn hiện tại</span></div><div><b>${num(x.waiting)}</b><span>Đơn còn chờ</span></div><div><b>${num(x.short)}</b><span>Thiếu</span></div></div><div class="tile-foot"><span class="${x.short?'alert':'good'}">${x.warning||'Đủ so với đơn chờ'}</span>${btn('Chi tiết →','openProduct','subtle',p.id)}</div></article>`}).join('')||'<p class="empty">Chưa có thành phẩm. Hãy thêm hoặc nạp dữ liệu mẫu.</p>'}</div>`}
function productDetail(){let p=product(selected);if(!p){page='products';return productsPage()}let x=stats(p),related=db.orders.filter(o=>o.productId===p.id);return `<div class="page-heading"><div><button class="textlink" data-act="products">← Danh mục</button><h1>${E(p.code)} · ${E(p.name)}</h1><p>${E(p.note||'Thành phẩm đang quản lý trong kho.')}</p></div><div class="heading-actions">${btn('Sửa thành phẩm','editProduct','',p.id)}${btn('＋ Nhập kho','newReceipt','primary',p.id)}${btn('Điều chỉnh tồn','newAdjust','',p.id)}</div></div><section class="inventory-strip"><div><small>TỒN ĐẦU</small><strong>${num(p.opening)}</strong></div><div><small>TỒN HIỆN TẠI</small><strong>${num(x.stock)}</strong></div><div><small>ĐƠN CÒN CHỜ</small><strong>${num(x.waiting)}</strong></div><div><small>GIỮ CHỖ</small><strong>${num(x.held)}</strong></div><div><small>THIẾU</small><strong>${num(x.short)}</strong></div></section>${panel('Đơn hàng của thành phẩm',`<div class="table-wrap"><table><thead><tr><th>Mã đơn</th><th>Khách</th><th>Hạn</th><th>Đặt</th><th>Đã giao</th><th>Còn</th><th>Giữ chỗ</th><th>Trạng thái</th></tr></thead><tbody>${related.map(o=>`<tr><td><button class="textlink" data-act="openOrder" data-id="${E(o.id)}">${E(o.number)}</button></td><td>${E(o.customer)}</td><td>${fmt(o.due)}</td><td>${num(o.qty)}</td><td>${num(delivered(o))}</td><td>${num(remaining(o))}</td><td>${num(held(o))}</td><td>${badge(state(o))}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có đơn.</td></tr>'}</tbody></table></div>`)}${panel('Biến động kho có ngày và chứng từ',db.events.filter(e=>e.productId===p.id&&['receipt','adjust','dispatch'].includes(e.kind)).slice().reverse().map(e=>`<div class="log-row"><b>${fmt(e.date)} · ${E(e.kind==='receipt'?'Nhập thành phẩm':e.kind==='dispatch'?'Xuất giao đơn':'Điều chỉnh tồn')}</b><span>${e.qty>0?'+':''}${num(e.kind==='dispatch'?-e.qty:e.qty)} · ${E(e.doc||e.note||'Không ghi chứng từ')}${e.orderId?' · '+E(order(e.orderId)?.number||''):''}</span></div>`).join('')||'<p class="empty">Mẫu gốc chỉ có số tồn đầu, không có chứng từ nhập/xuất lịch sử.</p>')}`}
function ordersPage(){let a=db.orders.filter(o=>(filter==='all'||state(o)===filter)&&(!search||[o.number,o.customer,product(o.productId)?.code].join(' ').toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')))).sort((a,b)=>a.due.localeCompare(b.due));return `<div class="page-heading"><div><span class="eyebrow">02 / SỔ ĐƠN</span><h1>Đơn hàng chờ giao</h1><p>Ưu tiên theo hạn giao và theo dõi từng lần xuất thành phẩm.</p></div>${btn('＋ Lập đơn','newOrder','primary')}</div>${panel('Tìm và lọc',`<div class="filters"><label>Tìm mã đơn, khách, mã thành phẩm<input id="search" value="${E(search)}" placeholder="DH-001, TP-01…"></label><label>Trạng thái<select id="orderFilter"><option value="all">Tất cả</option>${['Chờ giao','Giao một phần','Đã giao','Hủy'].map(v=>`<option ${filter===v?'selected':''}>${v}</option>`).join('')}</select></label></div>`)}<div class="order-list">${a.map(o=>{let p=product(o.productId);return `<article class="order-row"><div><button class="textlink" data-act="openOrder" data-id="${E(o.id)}">${E(o.number)}</button><b>${E(o.customer)}</b><small>${E(p.code)} · ${E(p.name)}</small></div><div><small>Đặt / Đã giao / Còn</small><strong>${num(o.qty)} / ${num(delivered(o))} / ${num(remaining(o))}</strong></div><div><small>Hạn giao</small><strong>${fmt(o.due)}</strong>${overdue(o)?`<em class="alert">Trễ ${overdue(o)} ngày</em>`:''}</div><div>${badge(state(o))}${btn('Mở →','openOrder','subtle',o.id)}</div></article>`}).join('')||'<p class="empty">Không có đơn phù hợp.</p>'}</div>`}
function orderDetail(){let o=order(selected);if(!o){page='orders';return ordersPage()}let p=product(o.productId),r=remaining(o),h=held(o),x=stats(p);return `<div class="page-heading"><div><button class="textlink" data-act="orders">← Sổ đơn</button><span class="eyebrow">${E(o.number)} / ${E(p.code)}</span><h1>${E(o.customer)}</h1><p>${badge(state(o))} · Đặt ${fmt(o.date)} · Hạn ${fmt(o.due)} ${overdue(o)?`· Trễ ${overdue(o)} ngày`:''}</p></div><div class="heading-actions">${r&&!o.cancelled?btn('Giữ chỗ','hold','',o.id)+btn('Giao hàng','dispatch','primary',o.id):''}${h?btn('Bỏ giữ chỗ','releaseHold','',o.id):''}${!o.cancelled&&delivered(o)===0&&!h?btn('Sửa đơn','editOrder','',o.id)+btn('Hủy đơn','cancelOrder','danger',o.id):''}${btn('In hồ sơ','print')}</div></div><section class="fulfillment"><div class="fulfillment-main"><small>TIẾN ĐỘ GIAO</small><div><strong>${num(delivered(o))}</strong><span>/ ${num(o.qty)} sản phẩm</span></div><div class="progress"><i style="width:${Math.min(100,delivered(o)/o.qty*100)}%"></i></div><p>Còn phải giao ${num(r)} · Đã giữ chỗ ${num(h)} · Tồn mã ${E(p.code)} ${num(x.stock)} · Có thể giữ thêm ${num(Math.max(0,x.unheld))}</p></div><div><small>THÀNH PHẨM</small><button class="textlink" data-act="openProduct" data-id="${E(p.id)}">${E(p.code)} · ${E(p.name)}</button><p>${E(o.note||'Không có ghi chú.')}</p></div></section><div class="detail-grid">${panel('Diễn biến đơn',eventsFor(o.id).slice().reverse().map(e=>`<div class="timeline-row"><span>${fmt(e.date)}</span><div><b>${E(e.kind==='dispatch'?'Đã giao':e.kind==='hold'?'Giữ chỗ':'Bỏ giữ chỗ')} ${num(e.qty)}</b><small>${E(e.doc||e.note||'—')} · ${E(e.actor||'—')}</small></div></div>`).join('')||`<p class="empty">${o.initialDelivered?'Đơn Đã giao từ mẫu gốc; nguồn không có ngày và chứng từ giao nên không tạo lịch sử giả.':'Chưa có lượt giao hoặc giữ chỗ.'}</p>`)}${panel('Kiểm soát',`<dl><dt>Số đặt</dt><dd>${num(o.qty)}</dd><dt>Đã giao</dt><dd>${num(delivered(o))}</dd><dt>Hàng giữ riêng</dt><dd>${num(h)}</dd><dt>Còn giao</dt><dd>${num(r)}</dd><dt>Thiếu theo mã</dt><dd>${num(x.short)}</dd></dl>${orderFlags(o).map(v=>`<p class="alert">⚠ ${E(v)}</p>`).join('')||'<p class="good">Không có cảnh báo.</p>'}`)}</div>`}
function reportsPage(){let s=total();return `<div class="page-heading"><div><span class="eyebrow">03 / ĐỐI CHIẾU</span><h1>Báo cáo thành phẩm</h1><p>Tổng hợp theo mã, tách rõ tồn, nhu cầu chờ và thiếu.</p></div>${btn('⬇ Excel','exportExcel','primary')}</div><section class="inventory-strip"><div><small>ĐƠN CÒN GIAO</small><strong>${s.open}</strong></div><div><small>ĐÃ GIAO</small><strong>${s.done}</strong></div><div><small>GIAO MỘT PHẦN</small><strong>${s.partial}</strong></div><div><small>ĐƠN QUÁ HẠN</small><strong>${s.overdue}</strong></div><div><small>THIẾU THEO MÃ</small><strong>${num(s.short)}</strong></div></section>${panel('Cân đối từng mã',`<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Thành phẩm</th><th>Tồn</th><th>Chờ giao</th><th>Dự kiến dư*</th><th>Thiếu</th><th>Giữ chỗ</th><th>Cảnh báo</th></tr></thead><tbody>${db.products.map(p=>{let x=stats(p);return `<tr><td><button class="textlink" data-act="openProduct" data-id="${E(p.id)}">${E(p.code)}</button></td><td>${E(p.name)}</td><td>${num(x.stock)}</td><td>${num(x.waiting)}</td><td>${num(x.free)}</td><td>${num(x.short)}</td><td>${num(x.held)}</td><td>${E(x.warning||'—')}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có dữ liệu.</td></tr>'}</tbody></table></div><p class="footnote">* Dự kiến dư có thể âm, theo công thức tồn − đơn còn chờ của file nguồn. Tổng thiếu là tổng thiếu của từng mã, không lấy tổng chờ trừ tổng kho.</p>`)}${panel('Đơn cần ưu tiên',db.orders.filter(o=>overdue(o)>0).sort((a,b)=>overdue(b)-overdue(a)).map(o=>`<div class="priority-row"><button class="textlink" data-act="openOrder" data-id="${E(o.id)}">${E(o.number)} · ${E(o.customer)}</button><span>${E(product(o.productId).code)} · còn ${num(remaining(o))} · trễ ${overdue(o)} ngày</span></div>`).join('')||'<p class="good">Không có đơn trễ.</p>')}`}
function settingsPage(){return `<div class="page-heading"><h1>Cài đặt đối chiếu</h1></div>${panel('Ngày báo cáo và ngưỡng tồn dư',`<form id="settingsForm" class="form-grid"><label>Ngày báo cáo<input name="asof" type="date" required value="${E(db.settings.asof)}"></label><label>Báo tồn dư khi lớn hơn<input name="tonDu" type="number" min="0" step="1" required value="${db.settings.tonDu}"></label><div class="full">${btn('Lưu cài đặt','saveSettings','primary')}</div></form><p class="footnote">Ngày báo cáo chỉ dùng tính đơn trễ. Ngưỡng tồn dư là tham số quản trị nội bộ từ mẫu gốc, mặc định 400 sản phẩm theo từng mã.</p>`)}`}
function dataPage(){return `<div class="page-heading"><h1>Dữ liệu & sao lưu</h1></div><div class="detail-grid">${panel('Xuất bản sao',`<p>Tiến độ nhập trên trình duyệt này không tự theo tệp HTML gốc sang máy khác.</p><div class="actions">${btn('⬇ JSON đầy đủ','exportJSON','primary')}${btn('⬇ HTML kèm dữ liệu','exportHTML')}${btn('⬇ Excel đối soát','exportExcel')}</div>`)}${panel('Nhập và dữ liệu mẫu',`<p>Nhập JSON hoặc nạp mẫu sẽ thay toàn bộ dữ liệu hiện có. Hãy xuất bản sao trước.</p><div class="actions">${btn('⬆ Nhập JSON','importJSON')}${btn('Nạp 6 mã / 20 đơn mẫu','loadSample')}${btn('Xóa dữ liệu','clearData','danger')}</div>`)}</div>${panel('Thông tin',`<p>Phiên bản dữ liệu ${VERSION} · ${db.products.length} thành phẩm · ${db.orders.length} đơn · ${db.events.length} sự kiện phát sinh. App chạy không cần mạng, máy chủ hay API.</p>`)}`}
function guidePage(){return `<div class="page-heading"><h1>Hướng dẫn sử dụng</h1></div>${panel('Quy trình thực tế',`<ol><li>Tạo thành phẩm và nhập tồn đầu đang có.</li><li>Lập đơn; mỗi đơn gắn một mã thành phẩm, số lượng và hạn giao.</li><li>Xem bảng điều phối thiếu theo mã. Nhập thêm thành phẩm khi sản xuất xong.</li><li>Giữ chỗ cho đơn cần ưu tiên. App chặn giữ nhiều hơn tồn chưa giữ của mã.</li><li>Ghi từng lượt giao. App trừ tồn, giảm lượng chờ và tự chuyển trạng thái khi giao đủ.</li><li>Xuất JSON/HTML kèm dữ liệu thường xuyên; Excel dùng xem và đối chiếu.</li></ol>`)}${panel('Công thức & phạm vi',`<p><b>Tồn hiện tại</b> = tồn đầu + nhập + điều chỉnh − xuất giao. <b>Đơn còn chờ</b> = tổng số lượng chưa giao của đơn chưa hủy. <b>Thiếu</b> = max(0, đơn còn chờ − tồn) theo từng mã. <b>Dư sau giao</b> = tồn − đơn còn chờ, có thể âm.</p><p>Hàng Đã giao trong mẫu gốc không tạo chứng từ xuất giả vì tồn đầu là ảnh chụp tại thời điểm nguồn. Các lượt nhập/giao mới đều có ngày trong nhật ký.</p><p>App độc lập, không đồng bộ tự động với kho, lệnh sản xuất hoặc vận chuyển ở app khác. Mã đơn/mã thành phẩm có thể dùng để đối chiếu thủ công.</p>`)}`}
function render(){let views={board,products:productsPage,product:productDetail,orders:ordersPage,order:orderDetail,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML=(views[page]||board)();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='product'&&b.dataset.page==='products'||page==='order'&&b.dataset.page==='orders'))}
function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${E(value)}" ${extra}></label>`}
function textarea(label,name,value=''){return `<label class="full">${label}<textarea name="${name}" rows="3" maxlength="1000">${E(value)}</textarea></label>`}
function pick(label,name,items,current=''){return `<label>${label}<select name="${name}" required>${items.map(([v,t])=>`<option value="${E(v)}" ${v===current?'selected':''}>${E(t)}</option>`).join('')}</select></label>`}
function showForm(kind,key=''){let f='',title='';draft={kind,key};if(kind==='product'){let p=product(key)||{};title=key?'Sửa thành phẩm':'Thêm thành phẩm';f=field('Mã thành phẩm *','code',p.code,'text','required maxlength="40"')+field('Tên thành phẩm *','name',p.name,'text','required maxlength="160"')+field('Tồn đầu *','opening',p.opening??0,'number',`required min="0" step="1" ${key?'readonly':''}`)+textarea('Ghi chú','note',p.note)}
 else if(kind==='order'){if(!db.products.length)return alert('Hãy thêm thành phẩm trước.');let o=order(key)||{};title=key?'Sửa đơn':'Lập đơn chờ giao';f=field('Ngày đặt *','date',o.date||today(),'date','required')+field('Mã đơn *','number',o.number||`DH-${String(db.orders.length+1).padStart(3,'0')}`,'text','required maxlength="40"')+field('Khách hàng *','customer',o.customer,'text','required maxlength="160"')+pick('Thành phẩm *','productId',db.products.map(p=>[p.id,`${p.code} · ${p.name}`]),o.productId)+field('Số lượng đặt *','qty',o.qty??1,'number','required min="1" step="1"')+field('Hạn giao *','due',o.due||today(),'date','required')+textarea('Ghi chú','note',o.note)}
 else if(kind==='receipt'||kind==='adjust'){if(!db.products.length)return alert('Hãy thêm thành phẩm trước.');let p=product(key);title=kind==='receipt'?'Nhập thành phẩm':'Điều chỉnh tồn';f=pick('Thành phẩm *','productId',db.products.map(p=>[p.id,`${p.code} · ${p.name} · tồn ${num(stock(p))}`]),p?.id||db.products[0].id)+field('Ngày ghi *','date',today(),'date','required')+field(kind==='receipt'?'Số lượng nhập *':'Chênh lệch (+/−) *','qty',kind==='receipt'?1:0,'number',kind==='receipt'?'required min="1" step="1"':'required step="1"')+field('Chứng từ','doc','','text','maxlength="100"')+field('Người thực hiện','actor','','text','maxlength="100"')+textarea('Lý do / ghi chú *','note','')}
 else if(['hold','release','dispatch'].includes(kind)){let o=order(key),p=product(o.productId),r=remaining(o),h=held(o),available=stock(p)-heldFor(p)+h;title=kind==='hold'?'Giữ chỗ cho '+o.number:kind==='release'?'Bỏ giữ chỗ '+o.number:'Giao hàng '+o.number;f=`<p class="form-tip full">${E(p.code)} · tồn ${num(stock(p))} · còn giao ${num(r)} · đã giữ ${num(h)}. ${kind==='dispatch'?'Có thể giao tối đa '+num(Math.min(r,available)):kind==='hold'?'Còn có thể giữ '+num(Math.min(r-h,available-h)):'Có thể bỏ giữ '+num(h)}.</p>`+field('Ngày *','date',today(),'date',`required min="${E(o.date)}"`)+field('Số lượng *','qty',kind==='release'?h:kind==='hold'?Math.max(1,Math.min(r-h,available-h)):Math.max(1,Math.min(r,available)),'number','required min="1" step="1"')+field('Chứng từ','doc','','text','maxlength="100"')+field('Người thực hiện','actor','','text','maxlength="100"')+textarea('Ghi chú','note','')}
 $('#modalTitle').textContent=title;$('#formFields').innerHTML=f;$('#formError').textContent='';$('#editor').showModal()}
const fv=(f,n)=>String(new FormData(f).get(n)||'').trim(),fn=(f,n)=>Number(fv(f,n));
function submitForm(ev){ev.preventDefault();let f=ev.target,{kind,key}=draft,before=copy(db);try{if(kind==='product'){let p=product(key),code=fv(f,'code'),name=fv(f,'name'),opening=fn(f,'opening');if(!code||!name||!Number.isSafeInteger(opening)||opening<0)throw Error('Cần mã, tên và tồn đầu hợp lệ.');if(db.products.some(x=>x.id!==key&&x.code.toUpperCase()===code.toUpperCase()))throw Error('Mã thành phẩm đã có.');if(p)Object.assign(p,{code,name,note:fv(f,'note')});else{p={id:id(),code,name,opening,note:fv(f,'note')};db.products.push(p)}log(key?'Sửa thành phẩm':'Thêm thành phẩm',code,p.id);selected=p.id;page='product'}
 else if(kind==='order'){let o=order(key),date=fv(f,'date'),due=fv(f,'due'),number=fv(f,'number'),customer=fv(f,'customer'),productId=fv(f,'productId'),qty=fn(f,'qty');if(!validDate(date)||!validDate(due)||due<date||!number||!customer||!product(productId)||!Number.isSafeInteger(qty)||qty<=0)throw Error('Kiểm tra ngày, mã đơn, khách, thành phẩm và số lượng.');if(db.orders.some(x=>x.id!==key&&x.number.toUpperCase()===number.toUpperCase()))throw Error('Mã đơn đã có.');let values={date,due,number,customer,productId,qty,note:fv(f,'note')};if(o)Object.assign(o,values);else{o={id:id(),...values,initialDelivered:0,cancelled:false};db.orders.push(o)}log(key?'Sửa đơn':'Lập đơn',number,o.id);selected=o.id;page='order'}
 else if(kind==='receipt'||kind==='adjust'){let productId=fv(f,'productId'),p=product(productId),qty=fn(f,'qty'),date=fv(f,'date'),note=fv(f,'note');if(!p||!validDate(date)||!Number.isSafeInteger(qty)||kind==='receipt'&&qty<=0||kind==='adjust'&&(qty===0||!note))throw Error('Cần thành phẩm, ngày, lượng và lý do hợp lệ.');if(kind==='adjust'&&stock(p)+qty<heldFor(p))throw Error('Điều chỉnh làm tồn thấp hơn hàng đã giữ chỗ.');db.events.push({id:id(),kind,productId,orderId:'',date,qty,holdUsed:0,doc:fv(f,'doc'),actor:fv(f,'actor'),note});log(kind==='receipt'?'Nhập thành phẩm':'Điều chỉnh tồn',`${p.code} ${num(qty)}`,p.id);selected=p.id;page='product'}
 else if(['hold','release','dispatch'].includes(kind)){let o=order(key),p=product(o.productId),qty=fn(f,'qty'),date=fv(f,'date'),h=held(o),r=remaining(o),free=stock(p)-heldFor(p);if(!o||o.cancelled||!validDate(date)||date<o.date||!Number.isSafeInteger(qty)||qty<=0)throw Error('Ngày hoặc số lượng không hợp lệ.');if(kind==='hold'&&(qty>r-h||qty>free))throw Error('Không đủ hàng chưa giữ chỗ hoặc giữ vượt số còn giao.');if(kind==='release'&&qty>h)throw Error('Bỏ giữ vượt số đang giữ.');if(kind==='dispatch'&&(qty>r||qty>h+free))throw Error('Không đủ tồn có thể giao hoặc vượt số còn giao.');db.events.push({id:id(),kind,productId:p.id,orderId:o.id,date,qty,holdUsed:kind==='dispatch'?Math.min(qty,h):0,doc:fv(f,'doc'),actor:fv(f,'actor'),note:fv(f,'note')});log(kind==='hold'?'Giữ chỗ':kind==='release'?'Bỏ giữ chỗ':'Xuất giao đơn',`${o.number} ${num(qty)}`,o.id);selected=o.id;page='order'}
 let error=validate(db);if(error)throw Error(error);$('#editor').close();draft=null;save()}catch(err){db=before;$('#formError').textContent=err.message}}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},30000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'ton-kho-thanh-pham-sao-luu.json')}
function exportHTML(){let h='<!doctype html>\n'+document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encode(db)+b);download(new Blob([h],{type:'text/html;charset=utf-8'}),'ton-kho-thanh-pham-kem-du-lieu.html')}
function sheets(){return [{name:'ThanhPham',rows:[['Mã','Tên','Tồn đầu','Tồn hiện tại','Đơn chờ','Dư sau giao','Thiếu','Giữ chỗ','Cảnh báo'],...db.products.map(p=>{let s=stats(p);return [p.code,p.name,p.opening,s.stock,s.waiting,s.free,s.short,s.held,s.warning]})]},{name:'DonHang',rows:[['Mã đơn','Ngày đặt','Khách hàng','Thành phẩm','Số đặt','Đã giao','Còn giao','Hạn giao','Trạng thái','Giữ chỗ','Trễ ngày'],...db.orders.map(o=>[o.number,o.date,o.customer,product(o.productId).code,o.qty,delivered(o),remaining(o),o.due,state(o),held(o),overdue(o)])]},{name:'BienDong',rows:[['Ngày','Loại','Mã TP','Mã đơn','Số lượng','Đã dùng giữ chỗ','Chứng từ','Người thực hiện','Ghi chú'],...db.events.map(e=>[e.date,e.kind,product(e.productId).code,order(e.orderId)?.number||'',e.qty,e.holdUsed,e.doc,e.actor,e.note])]},{name:'NhatKy',rows:[['Thời điểm','Thao tác','Nội dung','Tham chiếu'],...db.audit.map(a=>[a.at,a.action,a.detail,a.ref])]},{name:'CaiDat',rows:[['Ngày đối chiếu','Ngưỡng tồn dư'],[db.settings.asof,db.settings.tonDu]]}]}
function exportExcel(){download(Excel.workbook(sheets()),'ton-kho-thanh-pham-bao-cao.xlsx')}
function sampleData(){let x=empty(),date=s=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+Number(s.slice(1)));return d.toLocaleDateString('sv-SE')};for(let [code,name,opening] of FINISHED_SAMPLE.sp)x.products.push({id:id(),code,name,opening,note:'Mẫu từ file tham chiếu'});for(let [d,number,customer,code,qty,due,status] of FINISHED_SAMPLE.dh){let p=x.products.find(p=>p.code===code);x.orders.push({id:id(),date:date(d),number,customer,productId:p.id,qty,due:date(due),initialDelivered:status==='Đã giao'?qty:0,cancelled:false,note:'Mẫu từ file tham chiếu. Nguồn không có lịch sử giao từng lần.'})}return x}
function act(action,key=''){if(['board','products','orders','reports','settings','data','guide'].includes(action)){page=action;render();return}if(action==='openProduct'){selected=key;page='product';render();return}if(action==='openOrder'){selected=key;page='order';render();return}if(action==='newProduct'||action==='editProduct')return showForm('product',action==='editProduct'?key:'');if(action==='newOrder'||action==='editOrder')return showForm('order',action==='editOrder'?key:'');if(action==='newReceipt')return showForm('receipt',key);if(action==='newAdjust')return showForm('adjust',key);if(['hold','releaseHold','dispatch'].includes(action))return showForm(action==='releaseHold'?'release':action,key);if(action==='cancelOrder'){let o=order(key);if(delivered(o)>0||held(o)>0)return alert('Đơn đã giao hoặc có giữ chỗ không thể hủy; hãy xử lý các phát sinh trước.');let reason=prompt('Lý do hủy đơn:');if(!reason?.trim())return;o.cancelled=true;log('Hủy đơn',`${o.number}: ${reason.trim()}`,o.id);save();return}if(action==='print')return print();if(action==='saveSettings'){let f=$('#settingsForm'),asof=f.elements.asof.value,tonDu=Number(f.elements.tonDu.value);if(!validDate(asof)||!Number.isSafeInteger(tonDu)||tonDu<0)return alert('Cài đặt không hợp lệ.');db.settings={asof,tonDu};save();return}if(action==='exportJSON')return exportJSON();if(action==='exportHTML')return exportHTML();if(action==='exportExcel')return exportExcel();if(action==='importJSON')return $('#jsonFile').click();if(action==='loadSample'){if((db.products.length||db.orders.length)&&!confirm('Nạp mẫu sẽ thay dữ liệu hiện có. Tiếp tục?'))return;let x=sampleData(),v=validate(x);if(v)return alert('Mẫu lỗi: '+v);db=x;page='board';save();return}if(action==='clearData'){if(!confirm('Xóa toàn bộ dữ liệu?')||!confirm('Xác nhận lần cuối: dữ liệu chưa sao lưu sẽ mất.'))return;db=empty();page='board';save();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#itemForm').addEventListener('submit',submitForm);$('#cancelModal').addEventListener('click',()=>$('#editor').close());$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text()),v=validate(x);if(v)throw Error(v);if(!confirm('Nhập JSON sẽ thay dữ liệu hiện có. Tiếp tục?'))return;db=x;page='board';save()}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}});document.addEventListener('change',e=>{if(e.target.id==='orderFilter'){filter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();let n=$('#search');n.focus();n.setSelectionRange(pos,pos)}});render();
</script></body></html>
