function encode(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}}
function stored(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return validBackup(x)?x:null}catch{return null}}
const embedded=decode($('#embedded-state').textContent.trim());
let db=validBackup(embedded)?embedded:stored()||blank(),page='dashboard',scope='all',query='',statusFilter='all',modal=null;
const carrier=id=>db.carriers.find(c=>c.id===id),order=id=>db.orders.find(o=>o.id===id);
const carrierName=o=>carrier(o.carrierId)?.name||o.carrierName||'—';
const asof=()=>db.settings.asof||today();
const expected=o=>o.status==='Đã giao'?o.cod-o.fee:o.status==='Hoàn'?-o.fee:0;
const received=o=>db.settlements.filter(s=>s.orderId===o.id).reduce((a,s)=>a+s.amount,0);
const balance=o=>expected(o)-received(o);
const reconciled=o=>o.status==='Đang giao'?'Chưa đến hạn':!db.settlements.some(s=>s.orderId===o.id)?'Chưa':balance(o)===0?'Rồi':'Chênh lệch';
function warning(o){let age=days(asof(),o.date);if(o.status==='Đang giao'&&age>db.settings.deliveryDays)return 'Đang giao quá lâu';if(o.status!=='Đang giao'&&reconciled(o)!=='Rồi'&&age>db.settings.reconcileDays)return 'Quá hạn đối soát';if(o.status!=='Đang giao'&&reconciled(o)==='Chênh lệch')return 'Chênh lệch đối soát';return ''}
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Không lưu được trên trình duyệt. Hãy tải sao lưu JSON hoặc HTML kèm dữ liệu.')}render()}
const hero=(h,s)=>'<div class="hero"><h1>'+esc(h)+'</h1><p>'+esc(s)+'</p></div>';
const metric=(name,value,sub='')=>'<div class="metric"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong><div class="sub">'+esc(sub)+'</div></div>';
const badge=(s)=>'<span class="badge '+(['Rồi','Đã giao'].includes(s)?'ok':['Hoàn','Quá hạn đối soát','Chênh lệch'].includes(s)?'loss':['Đang giao','Chưa','Chênh lệch đối soát','Đang giao quá lâu'].includes(s)?'alert':'')+'">'+esc(s)+'</span>';
const empty=s=>'<div class="empty">'+esc(s)+'</div>';
const table=(heads,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty('Chưa có dữ liệu phù hợp.');
function scopePicker(){let months=[...new Set(db.orders.map(o=>o.date.slice(0,7)))].sort().reverse();return '<label class="field">Kỳ xem <select id="scope"><option value="all">Toàn bộ</option>'+months.map(m=>'<option value="'+m+'" '+(scope===m?'selected':'')+'>'+m.slice(5)+'/'+m.slice(0,4)+'</option>').join('')+'</select></label>'}
const inScope=o=>scope==='all'||o.date.slice(0,7)===scope;
const searched=o=>[o.no,o.recipient,o.phone,carrierName(o),o.tracking].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'));
const visibleOrders=()=>db.orders.filter(o=>inScope(o)&&searched(o)&&(statusFilter==='all'||o.status===statusFilter)).sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no));
function totals(os){return os.reduce((a,o)=>{a.count++;a[o.status]=(a[o.status]||0)+1;a.cod+=o.status==='Đã giao'?o.cod:0;a.fee+=o.fee;a.expected+=expected(o);a.received+=received(o);a.balance+=balance(o);if(warning(o))a.warnings++;if(o.status!=='Đang giao'&&reconciled(o)!=='Rồi')a.unreconciled++;return a},{count:0,cod:0,fee:0,expected:0,received:0,balance:0,warnings:0,unreconciled:0})}
function byCarrier(os){let m=new Map();for(let o of os){let name=carrierName(o),x=m.get(name)||{name,count:0,cod:0,fee:0,expected:0,received:0,balance:0,returns:0,pending:0};x.count++;x.cod+=o.status==='Đã giao'?o.cod:0;x.fee+=o.fee;x.expected+=expected(o);x.received+=received(o);x.balance+=balance(o);x.returns+=o.status==='Hoàn'?1:0;x.pending+=o.status!=='Đang giao'&&reconciled(o)!=='Rồi'?1:0;m.set(name,x)}return [...m.values()].sort((a,b)=>b.count-a.count)}
function bars(rows){if(!rows.length)return empty('Chưa có đơn.');let max=Math.max(1,...rows.map(x=>Math.max(0,x.expected)));return '<div class="barrows">'+rows.map(x=>'<div class="barrow"><b>'+esc(x.name)+'</b><span class="track"><i style="width:'+Math.max(2,Math.max(0,x.expected)/max*100)+'%"></i></span><strong class="num">'+money(x.expected)+'</strong></div>').join('')+'</div>'}
function dashboard(){let os=db.orders.filter(inScope),t=totals(os),alerts=os.filter(o=>warning(o)).sort((a,b)=>days(asof(),b.date)-days(asof(),a.date));return hero('Giao hàng & COD','Theo dõi đơn đang giao, tiền COD kỳ vọng, khoản đã nhận và số còn phải đối soát.')+'<section class="card"><div class="toolbar">'+scopePicker()+'<span class="grow"></span><button class="btn primary" data-new="order">+ Thêm đơn giao hàng</button><button class="btn" data-new="settlement">+ Ghi khoản đối soát</button></div><div class="grid">'+metric('Tổng COD đơn đã giao',money(t.cod))+metric('Phí ship phát sinh',money(t.fee))+metric('Kỳ vọng thực nhận',money(t.expected),'Đã giao trừ phí; hoàn âm phí')+metric('Đã ghi nhận đối soát',money(t.received))+metric('Chênh lệch còn lại',money(t.balance))+metric('Chưa đối soát xong',t.unreconciled)+metric('Cần chú ý',t.warnings)+'</div><p class="notice">Số kỳ vọng theo công thức app gốc. “Đã ghi nhận đối soát” chỉ là các khoản thực tế anh nhập; chênh lệch = kỳ vọng − đã ghi nhận. Đơn hoàn có thể phát sinh số âm do phí ship.</p></section><div class="split"><section class="card"><h2>🚚 Kỳ vọng theo đơn vị vận chuyển</h2>'+bars(byCarrier(os))+'</section><section class="card"><h2>⚠️ Cảnh báo</h2>'+(alerts.length?alerts.slice(0,8).map(o=>'<div class="check"><span><b>'+esc(o.no)+'</b> · '+esc(carrierName(o))+'<small>'+esc(warning(o))+' · '+days(asof(),o.date)+' ngày từ ngày gửi</small></span><strong>'+money(balance(o))+'</strong></div>').join(''):empty('Không có đơn quá ngưỡng cảnh báo.'))+'</section></div><section class="card"><h2>Đơn mới nhất</h2>'+ordersTable(os.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))+'</section>'}
function ordersTable(os){return table(['Ngày / mã','Người nhận','Vận chuyển','COD','Phí ship','Trạng thái','Kỳ vọng','Đã đối soát','Còn lại','Cảnh báo',''],os.map(o=>'<tr><td><b>'+esc(o.no)+'</b><br><small>'+date(o.date)+'</small></td><td>'+esc(o.recipient||'—')+'<br><small>'+esc(o.phone||'')+'</small></td><td>'+esc(carrierName(o))+'<br><small>'+esc(o.tracking||'')+'</small></td><td class="num">'+money(o.cod)+'</td><td class="num">'+money(o.fee)+'</td><td>'+badge(o.status)+'</td><td class="num">'+money(expected(o))+'</td><td class="num">'+money(received(o))+'<br>'+badge(reconciled(o))+'</td><td class="num">'+money(balance(o))+'</td><td>'+(warning(o)?badge(warning(o)):'—')+'</td><td><button class="btn small" data-edit="order" data-id="'+esc(o.id)+'">Sửa</button></td></tr>'))}
function ordersPage(){return hero('📦 Đơn giao hàng','Mỗi mã đơn chỉ xuất hiện một lần. Nhập COD, phí ship, trạng thái và thông tin vận đơn.')+'<section class="card"><div class="toolbar filters"><input id="search" class="search" placeholder="Tìm mã, khách, vận đơn..." value="'+esc(query)+'">'+scopePicker()+'<select id="statusFilter"><option value="all">Mọi trạng thái</option>'+['Đang giao','Đã giao','Hoàn'].map(s=>'<option '+(statusFilter===s?'selected':'')+'>'+s+'</option>').join('')+'</select><span class="grow"></span><button class="btn primary" data-new="order">+ Đơn mới</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Excel</button></div>'+ordersTable(visibleOrders())+'</section>'}
function reconcilePage(){let os=db.orders.filter(o=>inScope(o)&&o.status!=='Đang giao'&&searched(o)).sort((a,b)=>Math.abs(balance(b))-Math.abs(balance(a)));let ss=db.settlements.filter(s=>{let o=order(s.orderId);return o&&inScope(o)}).sort((a,b)=>b.date.localeCompare(a.date));return hero('💰 Đối soát COD','Đối chiếu tiền kỳ vọng theo đơn với các khoản nhận hoặc bị khấu trừ thực tế.')+'<section class="card"><div class="toolbar"><span class="grow"></span><button class="btn primary" data-new="settlement">+ Ghi khoản tiền</button></div><p class="notice warn">Khoản đối soát dương: tiền đơn vị vận chuyển trả shop. Khoản âm: phí/khấu trừ shop phải chịu. Một đơn có thể có nhiều khoản, giúp theo dõi thanh toán từng phần.</p>'+table(['Mã đơn','Vận chuyển','Trạng thái','Kỳ vọng','Đã ghi nhận','Chênh lệch','Đối soát',''],os.map(o=>'<tr><td><b>'+esc(o.no)+'</b><br><small>'+date(o.date)+'</small></td><td>'+esc(carrierName(o))+'</td><td>'+badge(o.status)+'</td><td class="num">'+money(expected(o))+'</td><td class="num">'+money(received(o))+'</td><td class="num '+(balance(o)!==0?'bad':'good')+'">'+money(balance(o))+'</td><td>'+badge(reconciled(o))+'</td><td><button class="btn small" data-new="settlement" data-order="'+esc(o.id)+'">+ Khoản</button></td></tr>'))+'</section><section class="card"><h2>Nhật ký khoản đối soát</h2>'+table(['Ngày','Mã đơn','Số tiền','Tham chiếu','Ghi chú',''],ss.map(s=>{let o=order(s.orderId);return '<tr><td>'+date(s.date)+'</td><td>'+esc(o?.no||'—')+'</td><td class="num '+(s.amount<0?'bad':'good')+'">'+money(s.amount)+'</td><td>'+esc(s.reference||'—')+'</td><td>'+esc(s.note||'')+'</td><td><button class="btn small" data-edit="settlement" data-id="'+esc(s.id)+'">Sửa</button></td></tr>'}))+'</section>'}
function carriersPage(){let stats=byCarrier(db.orders.filter(inScope));return hero('🚚 Đơn vị vận chuyển','Theo dõi kênh giao hàng và khoản phải đối soát của từng đơn vị.')+'<section class="card"><div class="toolbar">'+scopePicker()+'<span class="grow"></span><button class="btn primary" data-new="carrier">+ Thêm đơn vị</button></div>'+table(['Đơn vị','Trạng thái','Số đơn','COD đã giao','Kỳ vọng','Đã nhận','Còn lại','Chưa xong',''],db.carriers.map(c=>{let s=stats.find(x=>x.name===c.name)||{count:0,cod:0,expected:0,received:0,balance:0,pending:0};return '<tr><td><b>'+esc(c.name)+'</b></td><td>'+badge(c.active===false?'Tạm ngừng':'Hoạt động')+'</td><td>'+s.count+'</td><td class="num">'+money(s.cod)+'</td><td class="num">'+money(s.expected)+'</td><td class="num">'+money(s.received)+'</td><td class="num">'+money(s.balance)+'</td><td>'+s.pending+'</td><td><button class="btn small" data-edit="carrier" data-id="'+esc(c.id)+'">Sửa</button></td></tr>'}))+'</section>'}
function reportsPage(){let os=db.orders.filter(inScope),t=totals(os),by=byCarrier(os),months=[...new Set(db.orders.map(o=>o.date.slice(0,7)))].sort().reverse().map(m=>({name:m, ...totals(db.orders.filter(o=>o.date.slice(0,7)===m))}));return hero('📈 Báo cáo COD','Tổng hợp theo tháng, vận chuyển và trạng thái, tính theo ngày gửi đơn.')+'<section class="card"><div class="toolbar">'+scopePicker()+'<span class="grow"></span><button class="btn" data-action="excelExport">↓ Xuất Excel</button><button class="btn" data-action="csv">↓ CSV</button></div><div class="grid">'+metric('Đơn',t.count)+metric('COD đã giao',money(t.cod))+metric('Kỳ vọng thực nhận',money(t.expected))+metric('Đã ghi nhận',money(t.received))+metric('Còn đối soát',money(t.balance))+'</div></section><div class="split"><section class="card"><h2>Theo đơn vị vận chuyển</h2>'+table(['Đơn vị','Đơn','COD','Phí ship','Kỳ vọng','Còn lại'],by.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.count+'</td><td class="num">'+money(x.cod)+'</td><td class="num">'+money(x.fee)+'</td><td class="num">'+money(x.expected)+'</td><td class="num">'+money(x.balance)+'</td></tr>'))+'</section><section class="card"><h2>Theo trạng thái</h2>'+table(['Trạng thái','Số đơn','COD ghi trên đơn','Kỳ vọng'],['Đang giao','Đã giao','Hoàn'].map(s=>{let a=os.filter(o=>o.status===s);return '<tr><td>'+badge(s)+'</td><td>'+a.length+'</td><td class="num">'+money(a.reduce((n,o)=>n+o.cod,0))+'</td><td class="num">'+money(a.reduce((n,o)=>n+expected(o),0))+'</td></tr>'}))+'</section></div><section class="card"><h2>Theo tháng</h2>'+table(['Tháng','Số đơn','Đã giao','Hoàn','Kỳ vọng','Đã nhận','Còn lại'],months.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.count+'</td><td>'+ (x['Đã giao']||0)+'</td><td>'+ (x['Hoàn']||0)+'</td><td class="num">'+money(x.expected)+'</td><td class="num">'+money(x.received)+'</td><td class="num">'+money(x.balance)+'</td></tr>'))+'<p class="notice">Khoản nhận tiền được gắn với tháng của đơn để đối soát đơn. Nhật ký khoản tiền vẫn giữ ngày nhận thực tế.</p></section>'}
function settingsPage(){return hero('⚙️ Cài đặt','Ngày báo cáo và ngưỡng cảnh báo dùng để tính tuổi đơn, không đổi dữ liệu gốc.')+'<section class="card"><div class="formgrid">'+field('company','Tên shop / đơn vị','text',db.settings.company)+field('asof','Ngày báo cáo (trống = hôm nay)','date',db.settings.asof)+field('reconcileDays','Cảnh báo chưa đối soát quá (ngày)','number',db.settings.reconcileDays)+field('deliveryDays','Cảnh báo đang giao quá (ngày)','number',db.settings.deliveryDays)+'</div><p><button class="btn primary" data-action="settings">Lưu cài đặt</button></p><p class="notice">Cảnh báo xuất hiện khi số ngày <b>lớn hơn</b> ngưỡng. Số ngày được tính từ ngày gửi đến ngày báo cáo, như app gốc.</p></section>'}
function dataPage(){return hero('💾 Dữ liệu & sao lưu','Giữ một bản sao riêng trước khi nhập Excel, nạp mẫu hoặc chuyển sang máy khác.')+'<section class="card"><div class="grid">'+metric('Đơn giao hàng',db.orders.length)+metric('Khoản đối soát',db.settlements.length)+metric('Đơn vị vận chuyển',db.carriers.length)+'</div><p class="notice warn">Chỉ sao chép file HTML gốc sang PC khác sẽ không chuyển dữ liệu trình duyệt. Hãy tải “HTML kèm dữ liệu” hoặc sao lưu JSON.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV</button></div><p class="muted">JSON/HTML giữ đầy đủ khoản đối soát. Nhập Excel dùng để trao đổi danh sách đơn; cờ “Rồi” từ app gốc sẽ được chuyển thành khoản giả định theo số kỳ vọng và ghi rõ nguồn.</p></section><section class="card"><h2>Mẫu tham chiếu</h2><p>10 đơn và 5 đơn vị vận chuyển của app gốc. Bốn đơn được gắn “Rồi”; bản mẫu tạo khoản đối soát giả định để tái hiện cờ gốc.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới sổ</h2><button class="btn danger" data-action="clear">Xóa toàn bộ dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Hướng dẫn','Từ đơn giao hàng đến nhận COD và tìm chênh lệch.')+'<section class="card"><h2>Quy trình</h2><ol><li>Tạo đơn vị vận chuyển. Mỗi đơn ghi ngày gửi, mã đơn, người nhận, COD thu hộ và phí ship.</li><li>Cập nhật trạng thái: Đang giao, Đã giao, Hoàn. Chỉ đơn đã giao có COD kỳ vọng; đơn hoàn ghi âm phí ship.</li><li>Khi nhận tiền hoặc bị khấu trừ, ghi khoản đối soát vào đúng mã đơn, có ngày và mã tham chiếu.</li><li>Mở “Đối soát COD” để xem khoản còn lại, khoản thu một phần và khoản chênh lệch; kiểm tra cảnh báo quá hạn.</li><li>Sao lưu JSON định kỳ. Dùng HTML kèm dữ liệu để chuyển máy.</li></ol></section><section class="card"><h2>Công thức và phạm vi</h2><p>Đã giao: kỳ vọng = COD − phí ship. Hoàn: kỳ vọng = −phí ship. Đang giao: kỳ vọng = 0. Chênh lệch = kỳ vọng − tổng khoản đối soát đã ghi. Đơn có khoản đối soát nhưng chênh lệch chưa bằng 0 hiển thị “Chênh lệch”.</p><p>Cảnh báo đối soát: đơn đã giao hoặc hoàn, chưa đối soát xong, và số ngày từ ngày gửi tới ngày báo cáo lớn hơn ngưỡng. Cảnh báo giao lâu: đơn còn đang giao và vượt ngưỡng.</p><p class="notice warn">Đây là sổ vận hành nội bộ. App không xác minh ngân hàng, vận đơn, hay nghĩa vụ thuế; cần đối chiếu chứng từ thực tế.</p></section>'}
function render(){let names={dashboard:'Tổng quan',orders:'Đơn giao hàng',reconcile:'Đối soát COD',carriers:'Đơn vị vận chuyển',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#screen').innerHTML=({dashboard,orders:ordersPage,reconcile:reconcilePage,carriers:carriersPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage})[page]()}
function field(k,label,type,v='',opts=''){return '<div class="field"><label for="f_'+k+'">'+esc(label)+'</label>'+(type==='select'?'<select id="f_'+k+'">'+opts+'</select>':type==='textarea'?'<textarea id="f_'+k+'">'+esc(v)+'</textarea>':'<input id="f_'+k+'" type="'+type+'" '+(type==='number'?'step="1"':'')+' value="'+esc(v??'')+'">')+'</div>'}
function option(v,label,sel){return '<option value="'+esc(v)+'" '+(String(v)===String(sel)?'selected':'')+'>'+esc(label)+'</option>'}
function nextNo(){let n=Math.max(0,...db.orders.map(o=>/^D\d+$/.test(o.no)?Number(o.no.slice(1)):0));return 'D'+String(n+1).padStart(3,'0')}
function openModal(type,id='',preset=''){let old=type==='carrier'?carrier(id):type==='order'?order(id):db.settlements.find(s=>s.id===id);old=old||{};modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+({carrier:'đơn vị vận chuyển',order:'đơn giao hàng',settlement:'khoản đối soát'}[type]);let html='';if(type==='carrier')html=field('name','Tên đơn vị / shipper','text',old.name||'')+field('active','Trạng thái','select','',option('true','Hoạt động',String(old.active!==false))+option('false','Tạm ngừng',String(old.active!==false)));if(type==='order'){let opts='<option value="">Chọn đơn vị</option>'+db.carriers.filter(c=>c.active!==false||c.id===old.carrierId).map(c=>option(c.id,c.name,old.carrierId)).join('');html=field('date','Ngày gửi','date',old.date||today())+field('no','Mã đơn','text',old.no||nextNo())+field('recipient','Khách nhận','text',old.recipient||'')+field('phone','Điện thoại','text',old.phone||'')+field('carrierId','Đơn vị vận chuyển','select','',opts)+field('tracking','Mã vận đơn','text',old.tracking||'')+field('cod','Tiền COD thu hộ (đ)','number',old.cod??0)+field('fee','Phí ship (đ)','number',old.fee??0)+field('status','Trạng thái','select','',['Đang giao','Đã giao','Hoàn'].map(s=>option(s,s,old.status||'Đang giao')).join(''))+field('note','Ghi chú','textarea',old.note||'');if(id)html+='<div class="wide"><p class="notice">Kỳ vọng: '+money(expected(old))+' · Đã ghi đối soát: '+money(received(old))+' · Còn lại: '+money(balance(old))+'</p><button class="btn danger small" data-action="deleteOrder" type="button">Xóa đơn</button></div>'}if(type==='settlement'){let opts='<option value="">Chọn đơn</option>'+db.orders.filter(o=>o.status!=='Đang giao'||o.id===old.orderId).map(o=>option(o.id,o.no+' · '+carrierName(o)+' · còn '+money(balance(o)),old.orderId||preset)).join('');html=field('date','Ngày nhận / khấu trừ','date',old.date||today())+field('orderId','Mã đơn','select','',opts)+field('direction','Loại khoản','select','',option('in','Tiền đơn vị vận chuyển trả shop',old.amount<0?'out':'in')+option('out','Phí / khấu trừ shop chịu',old.amount<0?'out':'in'))+field('amount','Số tiền (đ)','number',Math.abs(old.amount??0))+field('reference','Mã tham chiếu / chứng từ','text',old.reference||'')+field('note','Ghi chú','textarea',old.note||'');if(id)html+='<div class="wide"><button class="btn danger small" data-action="deleteSettlement" type="button">Xóa khoản này</button></div>'}$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('#editor').showModal()}
function closeModal(){modal=null;$('#editor').close()}
const v=k=>$('#f_'+k)?.value.trim()||'';
function saveModal(){if(!modal)return;let{type,id}=modal,x={},err='';if(type==='carrier'){x={name:v('name'),active:v('active')==='true'};if(!x.name)err='Cần tên đơn vị.';else if(db.carriers.some(c=>c.id!==id&&c.name.toLocaleLowerCase('vi')===x.name.toLocaleLowerCase('vi')))err='Đơn vị đã có.'}if(type==='order'){let c=carrier(v('carrierId'));x={date:v('date'),no:v('no'),recipient:v('recipient'),phone:v('phone'),carrierId:v('carrierId'),carrierName:c?.name||'',tracking:v('tracking'),cod:amount(v('cod')),fee:amount(v('fee')),status:v('status'),note:v('note')};if(!validDate(x.date)||!x.no||!c)err='Cần ngày hợp lệ, mã đơn và đơn vị vận chuyển.';else if(db.orders.some(o=>o.id!==id&&o.no.toLowerCase()===x.no.toLowerCase()))err='Mã đơn đã tồn tại.';else if(!validMoney(x.cod)||!validMoney(x.fee))err='COD và phí ship phải là số nguyên không âm.';else if(!['Đang giao','Đã giao','Hoàn'].includes(x.status))err='Trạng thái không hợp lệ.';else if(id&&db.settlements.some(s=>s.orderId===id)&&x.status==='Đang giao')err='Đơn đã có khoản đối soát, không thể chuyển về Đang giao. Hãy xử lý khoản tiền trước.'}if(type==='settlement'){let o=order(v('orderId')),n=amount(v('amount'));x={date:v('date'),orderId:v('orderId'),amount:v('direction')==='out'?-n:n,reference:v('reference'),note:v('note')};if(!validDate(x.date)||!o||o.status==='Đang giao')err='Cần ngày hợp lệ và đơn đã giao hoặc hoàn.';else if(!validMoney(n)||n===0)err='Số tiền phải là số nguyên lớn hơn 0.';else if(!x.reference)err='Cần mã tham chiếu hoặc chứng từ để đối soát.'}if(err){$('#modalError').textContent=err;return}let list=type==='carrier'?db.carriers:type==='order'?db.orders:db.settlements;if(id)Object.assign(list.find(a=>a.id===id),x);else list.push({id:uid(),...x});closeModal();save()}
function sampleData(){let d=blank(),anchor=SOURCE.asof;d.settings.asof=anchor;d.settings.reconcileDays=SOURCE.settings.reconcileDays;d.settings.deliveryDays=SOURCE.settings.deliveryDays;d.carriers=SOURCE.carriers.map((name,j)=>({id:'c'+j,name,active:true}));for(let [offset,no,recipient,name,cod,fee,status,flag] of SOURCE.orders){let date=new Date(anchor+'T12:00:00Z');date.setUTCDate(date.getUTCDate()+offset);let c=d.carriers.find(c=>c.name===name),o={id:'o'+no,date:date.toISOString().slice(0,10),no,recipient,phone:'',carrierId:c.id,carrierName:name,tracking:'',cod,fee,status,note:'Mẫu từ app gốc'};d.orders.push(o);if(flag==='Rồi'){let expectedAmount=status==='Đã giao'?cod-fee:status==='Hoàn'?-fee:0;if(expectedAmount)d.settlements.push({id:'s'+no,date:o.date,orderId:o.id,amount:expectedAmount,reference:'MẪU-GỐC-'+no,note:'Khoản giả định để tái hiện cờ đã đối soát của app gốc; không phải chứng từ thực tế.'})}}return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('giao-hang-cod-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Ngày gửi','Mã đơn','Khách nhận','Điện thoại','Đơn vị vận chuyển','Mã vận đơn','COD','Phí ship','Trạng thái','Kỳ vọng','Đã đối soát','Chênh lệch','Tình trạng đối soát','Cảnh báo']];for(let o of db.orders)rows.push([o.date,o.no,o.recipient,o.phone,carrierName(o),o.tracking,o.cod,o.fee,o.status,expected(o),received(o),balance(o),reconciled(o),warning(o)]);let s='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('giao-hang-cod.csv',s,'text/csv;charset=utf-8')}
function excelExport(){let rows=[['Ngày gửi','Mã đơn','Khách nhận','Đơn vị / shipper','Tiền COD thu hộ','Phí ship','Trạng thái','Đối soát']];for(let o of db.orders)rows.push([o.date,o.no,o.recipient,carrierName(o),o.cod,o.fee,o.status,reconciled(o)==='Rồi'?'Rồi':'Chưa']);let settlementRows=[['Ngày','Mã đơn','Số tiền (+ nhận / - khấu trừ)','Mã tham chiếu','Ghi chú'],...db.settlements.map(s=>[s.date,order(s.orderId)?.no||'',s.amount,s.reference,s.note])];let blob=Excel.workbook([{name:'Don giao hang',rows},{name:'Khoan doi soat',rows:settlementRows}]),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='giao-hang-cod.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');if(validDate(x))return x}return ''}
function parsedExcel(sheets){let rows=sheets['Don giao hang']||sheets['Đơn giao hàng']||[];if(rows.length<2)throw Error('Không thấy sheet Don giao hang hoặc bảng chưa có đơn.');let d=blank(),byName=new Map();for(let [j,r] of rows.slice(1).entries()){if(!String(r[1]??'').trim()&&!String(r[0]??'').trim())continue;let date=parseDate(r[0]),no=String(r[1]??'').trim(),recipient=String(r[2]??'').trim(),name=String(r[3]??'').trim(),cod=amount(r[4]||0),fee=amount(r[5]||0),status=String(r[6]??'Đang giao').trim(),flag=String(r[7]??'Chưa').trim();if(!date||!no||!name||!validMoney(cod)||!validMoney(fee)||!['Đang giao','Đã giao','Hoàn'].includes(status)||!['Chưa','Rồi'].includes(flag))throw Error('Dòng đơn '+(j+2)+' thiếu hoặc sai ngày/mã/đơn vị/COD/phí/trạng thái.');if(d.orders.some(o=>o.no.toLowerCase()===no.toLowerCase()))throw Error('Trùng mã đơn '+no+'.');let c=byName.get(name.toLowerCase());if(!c){c={id:uid(),name,active:true};d.carriers.push(c);byName.set(name.toLowerCase(),c)}let o={id:uid(),date,no,recipient,phone:'',carrierId:c.id,carrierName:name,tracking:'',cod,fee,status,note:'Nhập từ Excel'};d.orders.push(o);if(flag==='Rồi'){if(status==='Đang giao')throw Error('Đơn '+no+' đang giao nhưng đánh dấu đã đối soát.');let exp=expected(o);if(exp)d.settlements.push({id:uid(),date,orderId:o.id,amount:exp,reference:'EXCEL-CỜ-RỒI-'+no,note:'Khoản giả định theo cờ Rồi từ Excel; cần đối chiếu chứng từ thực tế.'})}}let sRows=sheets['Khoan doi soat']||sheets['Khoản đối soát']||[];if(sRows.length>1){d.settlements=[];for(let [j,r] of sRows.slice(1).entries()){if(!String(r[1]??'').trim()&&!String(r[0]??'').trim())continue;let date=parseDate(r[0]),o=d.orders.find(o=>o.no===String(r[1]??'').trim()),n=amount(r[2]),reference=String(r[3]??'').trim();if(!date||!o||o.status==='Đang giao'||!validSigned(n)||n===0||!reference)throw Error('Khoản đối soát dòng '+(j+2)+' không hợp lệ.');d.settlements.push({id:uid(),date,orderId:o.id,amount:n,reference,note:String(r[4]??'').trim()})}}if(!validBackup(d))throw Error('Dữ liệu Excel không hợp lệ sau khi chuyển đổi.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let candidate=parsedExcel(await Excel.read(file));if(!confirm('Nhập '+candidate.orders.length+' đơn sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Hãy sao lưu JSON trước. Tiếp tục?'))return;db=candidate;scope='all';save()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();return}if(b.dataset.new){openModal(b.dataset.new,'',b.dataset.order||'');return}if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}let a=b.dataset.action;if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();if(a==='backup')download('giao-hang-cod-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();if(a==='sample'){if(db.orders.length||db.carriers.length||db.settlements.length){if(!confirm('Nạp mẫu sẽ THAY THẾ sổ hiện tại. Hãy sao lưu trước. Tiếp tục?'))return}db=sampleData();scope='all';save()}if(a==='clear'){if(confirm('Xóa toàn bộ đơn, đơn vị vận chuyển và khoản đối soát trên trình duyệt này?')){db=blank();scope='all';save()}}if(a==='deleteOrder'){if(db.settlements.some(s=>s.orderId===modal.id)){alert('Đơn đã có khoản đối soát. Hãy xử lý khoản tiền trước khi xóa đơn.');return}if(confirm('Xóa vĩnh viễn đơn này?')){db.orders=db.orders.filter(o=>o.id!==modal.id);closeModal();save()}}if(a==='deleteSettlement'){if(confirm('Xóa vĩnh viễn khoản đối soát này?')){db.settlements=db.settlements.filter(s=>s.id!==modal.id);closeModal();save()}}if(a==='settings'){let as=v('asof'),rd=Number(v('reconcileDays')),dd=Number(v('deliveryDays'));if((as&&!validDate(as))||!Number.isSafeInteger(rd)||rd<0||rd>3650||!Number.isSafeInteger(dd)||dd<0||dd>3650){alert('Ngày hoặc ngưỡng cảnh báo không hợp lệ.');return}db.settings={...db.settings,company:v('company'),asof:as,reconcileDays:rd,deliveryDays:dd};save()}});
document.addEventListener('change',e=>{if(e.target.id==='scope'){scope=e.target.value;render()}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let x=JSON.parse(await file.text());if(!validBackup(x))throw Error('File không đúng định dạng hoặc dữ liệu không hợp lệ.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=x;scope='all';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
