<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Định lượng món · AI Mở</title><style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#263a2e;background:#faf5e9;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1c7d65;outline-offset:2px}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.rail{background:#254a39;color:#fff;padding:24px 14px;display:flex;flex-direction:column;gap:25px}.brand{font-weight:850;font-size:23px;padding:5px 11px}.brand small{display:block;font-size:12px;font-weight:500;color:#d3eadb}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:inherit;text-align:left;border-radius:12px;padding:11px 13px;font-weight:700}.nav button.on{background:#f9eacb;color:#264632}.foot{margin-top:auto;font-size:12px;color:#d5eadc;line-height:1.5}.main{min-width:0;padding:28px clamp(16px,3vw,48px)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;color:#795f48;font-size:13px;font-weight:700;margin-bottom:20px}.hero{background:#f4d8bc;border:1px solid #eac29c;border-radius:26px;padding:30px;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:20px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:160px;height:160px;border:30px solid #e8bd90;border-radius:50%;right:-40px;top:-70px;opacity:.3}.hero>*{position:relative;z-index:1}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:850;color:#ab4938}.hero h1{font-size:clamp(29px,3vw,44px);line-height:1.06;margin:12px 0;color:#324b36;letter-spacing:-.04em}.hero p{max-width:600px;line-height:1.5;margin:0 0 20px}.hero-stat{background:#fff9eb;border-radius:20px;padding:18px;align-self:end;border:1px solid #ecd0aa}.hero-stat strong{font-size:28px;display:block;color:#a34635}.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{background:#fff;border:1px solid #ccbca2;color:#274a3a;border-radius:10px;padding:10px 15px;font-weight:750}.btn.primary{background:#b84735;border-color:#b84735;color:#fff}.btn.green{background:#2d7854;border-color:#2d7854;color:#fff}.btn.warn{color:#a63832}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.kpi,.panel{background:#fffdf8;border:1px solid #e6d9c4;border-radius:18px;padding:18px;min-width:0}.kpi span,.muted{color:#6b786c}.kpi strong{font-size:26px;display:block;margin:6px 0;color:#2a4937}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.panel h2{font-size:19px;margin:0 0 14px}.panel h3{margin:8px 0}.list{display:grid;gap:9px}.item{border:1px solid #e9deca;border-radius:12px;padding:12px;background:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center}.item strong{display:block}.item small{display:block;color:#6b786c;margin-top:4px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#def0dc;color:#285d37;font-size:12px;font-weight:800}.badge.bad{background:#fbe6dc;color:#a44036}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee3d1;vertical-align:top}th{font-size:12px;color:#6f614e;text-transform:uppercase}td.num{text-align:right;white-space:nowrap}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar h1{font-size:29px;margin:0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px}.dish{background:#fffdf8;border:1px solid #e1d4bd;border-radius:18px;padding:17px;min-width:0}.dish h2{margin:4px 0 10px}.dish .price{font-size:24px;color:#aa4634;font-weight:850}.dish .row{display:flex;justify-content:space-between;border-top:1px solid #e9dec9;padding:8px 0}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px;font-size:13px;font-weight:700}.field input,.field select{width:100%;border:1px solid #c9bca8;border-radius:9px;padding:10px;background:#fff}.field.wide{grid-column:1/-1}.formactions{display:flex;gap:9px;margin-top:17px;flex-wrap:wrap}.notice{background:#fff1dc;border-left:4px solid #c4693c;padding:13px;border-radius:10px;margin:14px 0;line-height:1.5}.empty{padding:30px;color:#687268;text-align:center}.modal{border:0;border-radius:18px;padding:0;width:min(650px,calc(100vw - 24px));max-height:calc(100vh - 24px)}.modal::backdrop{background:#143022aa}.modal form{padding:22px}.modal h2{margin:0 0 16px}.error{color:#ab302c;font-weight:700;min-height:22px;margin-top:8px}.rowline{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eadfcc;padding:10px 0}.mobile-nav{display:none}.guide li{margin:10px 0;line-height:1.55}@media(max-width:900px){.shell{grid-template-columns:175px minmax(0,1fr)}.main{padding:18px}.hero{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}@media(max-width:620px){.shell{display:block}.rail{display:none}.mobile-nav{display:flex;overflow-x:auto;gap:5px;background:#254a39;padding:9px;scrollbar-width:none}.mobile-nav button{flex:none;border:1px solid #b3d4bf;background:transparent;color:#fff;padding:9px 12px;border-radius:9px;font-weight:700}.mobile-nav button.on{background:#f9eacb;color:#264632}.main{padding:13px}.top{font-size:11px}.hero{padding:22px}.hero-stat{max-width:100%}.fieldgrid{grid-template-columns:1fr}.kpis{gap:8px}.kpi{padding:12px}.kpi strong{font-size:20px}.toolbar h1{font-size:24px}.item{align-items:flex-start;flex-wrap:wrap}}@media print{.rail,.mobile-nav,.actions,.btn,.top,.formactions{display:none!important}.shell{display:block}.main{padding:0}.panel,.dish,.hero{break-inside:avoid;box-shadow:none}}
</style></head><body><div class="shell"><aside class="rail"><div class="brand">🍅 AI Mở<small>Định lượng & giá món</small></div><nav id="nav" class="nav"></nav><div class="foot">Bản HTML offline · Dữ liệu lưu ở trình duyệt này. Hãy sao lưu để chuyển máy.</div></aside><div><div id="mobileNav" class="mobile-nav"></div><main class="main"><div class="top"><span>AI MỞ / BẾP & GIÁ BÁN</span><span id="saveStatus">Dữ liệu trên thiết bị</span></div><div id="screen"></div></main></div></div><dialog id="modal" class="modal"><form id="editor"><h2 id="modalTitle"></h2><div id="formFields" class="fieldgrid"></div><div id="formError" class="error" role="alert"></div><div class="formactions"><button type="submit" class="btn primary">Lưu thông tin</button><button type="button" id="cancel" class="btn">Đóng</button></div></form></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><script id="embedded" type="application/json">{}</script><script>
const KEY='ai-mo-recipe-costing-v1',VERSION=1,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Math.round(n||0).toLocaleString('vi-VN')+' đ',fmt=n=>Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:3}),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36),copy=x=>JSON.parse(JSON.stringify(x));
const sample=()=>({version:1,settings:{company:'Bếp mẫu AI Mở',round:1000},ingredients:[['NL-01','Cà phê rang xay','g',1000,200000,100],['NL-02','Sữa đặc','ml',1000,100000,100],['NL-03','Cam tươi','g',1000,40000,80],['NL-04','Trà đen','g',500,90000,100]].map((x,i)=>({id:'i'+i,code:x[0],name:x[1],unit:x[2],pack:x[3],price:x[4],yield:x[5]})),dishes:[['M-01','Cà phê sữa',1,2000,0,25000,60],['M-02','Nước cam',2,2000,1000,23000,50],['M-03','Trà sữa',1,2000,0,28000,60]].map((x,i)=>({id:'d'+i,code:x[0],name:x[1],portions:x[2],packaging:x[3],other:x[4],sale:x[5],target:x[6]})),lines:[['DL-01','M-01','NL-01',25,''],['DL-02','M-01','NL-02',20,''],['DL-03','M-02','NL-03',400,'Lượng dùng được cho hai ly']].map((x,i)=>({id:'l'+i,code:x[0],dish:x[1],ingredient:x[2],qty:x[3],note:x[4]}))});
const blank=()=>({version:1,settings:{company:'Bếp của tôi',round:1000},ingredients:[],dishes:[],lines:[]});
function validate(x){if(!x||x.version!==VERSION||!x.settings||!Array.isArray(x.ingredients)||!Array.isArray(x.dishes)||!Array.isArray(x.lines))return'Dữ liệu không đúng phiên bản';let groups=[['ingredients',['code','name','unit']],['dishes',['code','name']],['lines',['code','dish','ingredient']]];for(let [key,required] of groups){let seen=new Set();for(let r of x[key]){if(!r.id||required.some(k=>!String(r[k]||'').trim())||seen.has(r.code.toUpperCase()))return`Mã trùng hoặc dòng ${key} thiếu dữ liệu`;seen.add(r.code.toUpperCase())}}for(let i of x.ingredients){if(!(i.pack>0&&i.price>=0&&i.yield>0&&i.yield<=100))return'Quy cách, giá hoặc tỷ lệ dùng được không hợp lệ'}for(let d of x.dishes){if(!(Number.isInteger(+d.portions)&&d.portions>0&&d.packaging>=0&&d.other>=0&&d.sale>=0&&d.target>=0&&d.target<100))return'Món có số phần hoặc giá không hợp lệ'}for(let l of x.lines){if(!(l.qty>0)||!x.dishes.some(d=>d.code===l.dish)||!x.ingredients.some(i=>i.code===l.ingredient))return'Định lượng thiếu liên kết hoặc số lượng'}return''}
function embedded(){try{return JSON.parse($('#embedded').textContent)}catch{return null}}let db=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&!validate(x))return x}catch{}let x=embedded();return x&&!validate(x)?x:sample()})(),page='home',draft=null,selected='';
function persist(){localStorage.setItem(KEY,JSON.stringify(db));$('#saveStatus').textContent='Đã lưu trên thiết bị';render()}
const ingredient=code=>db.ingredients.find(x=>x.code===code),dish=code=>db.dishes.find(x=>x.code===code),unitCost=i=>i&&i.pack>0&&i.yield>0?i.price/(i.pack*i.yield/100):null,lineCost=l=>{let i=ingredient(l.ingredient),c=unitCost(i);return c==null?null:l.qty*c};
function calc(d){let ls=db.lines.filter(x=>x.dish===d.code),bad=ls.some(x=>lineCost(x)==null),raw=ls.reduce((n,x)=>n+(lineCost(x)||0),0),ready=ls.length>0&&!bad,cost=ready?Math.round(raw/d.portions+d.packaging+d.other):null,profit=ready?d.sale-cost:null,margin=ready&&d.sale>0?profit/d.sale*100:null,suggested=ready?Math.ceil((cost/(1-d.target/100))/db.settings.round)*db.settings.round:null;return{ls,raw,ready,cost,profit,margin,suggested,below:ready&&margin!=null&&margin<d.target-1e-9}}
const navs=[['home','◈ Tổng quan'],['dishes','☷ Món & giá bán'],['ingredients','▦ Nguyên liệu'],['lines','≡ Định lượng'],['reports','▥ Báo cáo'],['data','↧ Dữ liệu'],['guide','? Hướng dẫn']];function nav(){let h=navs.map(([k,t])=>`<button data-page="${k}" class="${k===page?'on':''}">${t}</button>`).join('');$('#nav').innerHTML=h;$('#mobileNav').innerHTML=h}
const btn=(action,label,id='',cls='')=>`<button class="btn ${cls}" data-act="${action}" data-id="${esc(id)}">${label}</button>`;
function home(){let ready=db.dishes.filter(d=>calc(d).ready),below=ready.filter(d=>calc(d).below);return`<section class="hero"><div><div class="eyebrow">AI MỞ · BẢNG ĐỊNH LƯỢNG BẾP</div><h1>Mỗi món rõ giá vốn.<br>Mỗi giá bán có cơ sở.</h1><p>Ghi nguyên liệu, định lượng theo mẻ và số phần để xem giá vốn, lãi gộp cùng mức giá gợi ý.</p><div class="actions">${btn('newDish','+ Thêm món','','primary')}${btn('newLine','+ Ghi định lượng','','green')}</div></div><div class="hero-stat"><small>Món đủ giá vốn</small><strong>${ready.length}/${db.dishes.length}</strong><small>${below.length} món dưới biên mục tiêu</small></div></section><div class="kpis"><div class="kpi"><span>Nguyên liệu</span><strong>${db.ingredients.length}</strong><small>quy cách giá mua</small></div><div class="kpi"><span>Món</span><strong>${db.dishes.length}</strong><small>giá bán hiện tại</small></div><div class="kpi"><span>Định lượng</span><strong>${db.lines.length}</strong><small>dòng theo mẻ</small></div><div class="kpi"><span>Cần bổ sung</span><strong>${db.dishes.length-ready.length}</strong><small>món thiếu giá vốn</small></div></div><div class="grid"><section class="panel"><h2>🍽 Món cần xem</h2><div class="list">${db.dishes.map(d=>{let c=calc(d);return`<div class="item"><div><strong>${esc(d.name)}</strong><small>${esc(d.code)} · Giá bán ${money(d.sale)}</small></div><div><span class="badge ${!c.ready||c.below?'bad':''}">${!c.ready?'Thiếu định lượng':c.below?'Dưới mục tiêu':'Đủ dữ liệu'}</span> ${btn('viewDish','Xem',d.id)}</div></div>`}).join('')||'<div class="empty">Chưa có món. Hãy thêm món đầu tiên.</div>'}</div></section><section class="panel"><h2>🧮 Công thức nhanh</h2><div class="rowline"><span>Giá mỗi đơn vị dùng được</span><b>Giá mua ÷ (lượng quy cách × tỷ lệ dùng được)</b></div><div class="rowline"><span>Giá vốn mỗi phần</span><b>Nguyên liệu/mẻ ÷ số phần + bao bì + chi phí khác</b></div><div class="rowline"><span>Giá gợi ý</span><b>Giá vốn ÷ (1 − biên mục tiêu), làm tròn lên</b></div><div class="notice">Ví dụ mẫu: Cà phê sữa có giá vốn 9.000 đ/phần và giá gợi ý 23.000 đ khi đặt mục tiêu 60%.</div></section></div>`}
function dishes(){return`<div class="toolbar"><h1>Món & giá bán</h1>${btn('newDish','+ Thêm món','','primary')}</div><div class="cards">${db.dishes.map(d=>{let c=calc(d);return`<article class="dish"><small>${esc(d.code)} · ${d.portions} phần/mẻ</small><h2>${esc(d.name)}</h2><div class="price">${money(d.sale)}</div><div class="row"><span>Giá vốn/phần</span><strong>${c.ready?money(c.cost):'Chưa đủ'}</strong></div><div class="row"><span>Lãi gộp/phần</span><strong>${c.ready?money(c.profit):'—'}</strong></div><div class="row"><span>Biên hiện tại / mục tiêu</span><strong>${c.margin==null?'—':fmt(c.margin)+'%'} / ${fmt(d.target)}%</strong></div><div class="row"><span>Giá gợi ý</span><strong>${c.ready?money(c.suggested):'—'}</strong></div><div class="actions">${btn('viewDish','Xem định lượng',d.id)}${btn('editDish','Sửa',d.id)}</div></article>`}).join('')||'<div class="empty">Chưa có món.</div>'}</div>`}
function ingredients(){return`<div class="toolbar"><h1>Nguyên liệu</h1>${btn('newIngredient','+ Thêm nguyên liệu','','primary')}</div><div class="panel tablewrap"><table><thead><tr><th>Mã · Nguyên liệu</th><th>Quy cách</th><th>Giá mua</th><th>Dùng được</th><th>Giá/ĐVT dùng được</th><th></th></tr></thead><tbody>${db.ingredients.map(i=>`<tr><td><b>${esc(i.code)} · ${esc(i.name)}</b></td><td>${fmt(i.pack)} ${esc(i.unit)}</td><td>${money(i.price)}</td><td>${fmt(i.yield)}%</td><td>${fmt(unitCost(i))} đ/${esc(i.unit)}</td><td>${btn('editIngredient','Sửa',i.id)}</td></tr>`).join('')}</tbody></table></div>`}
function lines(){return`<div class="toolbar"><h1>Định lượng theo mẻ</h1>${btn('newLine','+ Thêm dòng','','primary')}</div><div class="panel tablewrap"><table><thead><tr><th>Mã dòng</th><th>Món</th><th>Nguyên liệu</th><th>Lượng dùng</th><th>Chi phí/mẻ</th><th>Ghi chú</th><th></th></tr></thead><tbody>${db.lines.map(l=>{let i=ingredient(l.ingredient);return`<tr><td>${esc(l.code)}</td><td>${esc(dish(l.dish)?.name||l.dish)}</td><td>${esc(i?.name||l.ingredient)}</td><td>${fmt(l.qty)} ${esc(i?.unit||'')}</td><td>${lineCost(l)==null?'Chưa đủ giá':money(lineCost(l))}</td><td>${esc(l.note)}</td><td>${btn('editLine','Sửa',l.id)}</td></tr>`}).join('')}</tbody></table></div>`}
function detail(){let d=db.dishes.find(x=>x.id===selected);if(!d)return dishes();let c=calc(d);return`<div class="toolbar"><h1>${esc(d.name)}</h1><div class="actions">${btn('dishes','← Danh sách')}${btn('editDish','Sửa món',d.id)}</div></div><div class="grid"><section class="panel"><h2>Phiếu định lượng · ${esc(d.code)}</h2><div class="rowline"><span>Số phần mỗi mẻ</span><b>${d.portions}</b></div>${c.ls.map(l=>{let i=ingredient(l.ingredient);return`<div class="rowline"><span>${esc(i?.name)} · ${fmt(l.qty)} ${esc(i?.unit)}</span><b>${money(lineCost(l))}</b></div>`}).join('')}<div class="rowline"><span>Bao bì/phần + chi phí khác/phần</span><b>${money(d.packaging+d.other)}</b></div><div class="rowline"><span>Giá vốn/phần</span><b>${c.ready?money(c.cost):'Chưa đủ định lượng'}</b></div>${btn('newLine','+ Thêm định lượng','','primary')}</section><section class="panel"><h2>Giá bán & biên lãi</h2><div class="rowline"><span>Giá bán/phần</span><b>${money(d.sale)}</b></div><div class="rowline"><span>Lãi gộp/phần</span><b>${c.ready?money(c.profit):'—'}</b></div><div class="rowline"><span>Biên hiện tại</span><b>${c.margin==null?'—':fmt(c.margin)+'%'}</b></div><div class="rowline"><span>Mục tiêu</span><b>${fmt(d.target)}%</b></div><div class="rowline"><span>Giá gợi ý</span><b>${c.ready?money(c.suggested):'—'}</b></div><div class="notice">Giá vốn chỉ tính nguyên liệu, bao bì và chi phí trực tiếp đã nhập. Chưa tính thuê mặt bằng, nhân sự chung, thuế hoặc chi phí nền tảng.</div></section></div>`}
function reports(){let rs=db.dishes.map(d=>({...d,...calc(d)}));return`<div class="toolbar"><h1>Báo cáo giá món</h1><div class="actions">${btn('print','⎙ In báo cáo')}${btn('exportExcel','↧ CSV mở bằng Excel')}</div></div><div class="panel tablewrap"><table><thead><tr><th>Món</th><th>Giá bán</th><th>Giá vốn</th><th>Lãi gộp</th><th>Biên hiện tại</th><th>Mục tiêu</th><th>Giá gợi ý</th><th>Trạng thái</th></tr></thead><tbody>${rs.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${money(d.sale)}</td><td>${d.ready?money(d.cost):'—'}</td><td>${d.ready?money(d.profit):'—'}</td><td>${d.margin==null?'—':fmt(d.margin)+'%'}</td><td>${fmt(d.target)}%</td><td>${d.ready?money(d.suggested):'—'}</td><td><span class="badge ${!d.ready||d.below?'bad':''}">${!d.ready?'Thiếu dữ liệu':d.below?'Dưới mục tiêu':'Đạt'}</span></td></tr>`).join('')}</tbody></table></div>`}
function dataPage(){return`<div class="toolbar"><h1>Dữ liệu & sao lưu</h1></div><div class="grid"><section class="panel"><h2>Chuyển dữ liệu sang máy khác</h2><p>Ứng dụng tự lưu trong trình duyệt của máy này. Gửi file HTML gốc sang máy khác sẽ không mang theo dữ liệu mới.</p><div class="actions">${btn('exportJSON','↧ Tải JSON','','green')}${btn('exportHTML','↧ Tải HTML kèm dữ liệu')}${btn('importJSON','↥ Nhập JSON')}</div></section><section class="panel"><h2>Bắt đầu lại</h2><p>Hãy sao lưu trước khi thay dữ liệu hiện tại.</p><div class="actions">${btn('loadSample','Nạp dữ liệu mẫu')}${btn('clearData','Xóa và dùng dữ liệu trống','','warn')}</div></section></div>`}
function guide(){return`<div class="toolbar"><h1>Hướng dẫn</h1></div><div class="panel guide"><ol><li>Thêm nguyên liệu: cùng một đơn vị trong quy cách và định lượng. Ví dụ 1 lít sữa nhập 1.000 ml.</li><li>Nhập tỷ lệ dùng được sau sơ chế. Giá/đơn vị dùng được tự tính từ giá mua, lượng quy cách và tỷ lệ này.</li><li>Thêm món với số phần mỗi mẻ, bao bì, chi phí trực tiếp khác, giá bán và biên mục tiêu.</li><li>Ghi từng dòng định lượng cho món. Chỉ khi có ít nhất một dòng hợp lệ mới hiện giá vốn.</li><li>Xem phiếu món và báo cáo. Giá gợi ý làm tròn lên theo bước 1.000 đ mặc định.</li><li>Sao lưu JSON hoặc HTML kèm dữ liệu trước khi đổi máy hoặc xóa dữ liệu trình duyệt.</li></ol><div class="notice">Mẫu nguồn có 4 nguyên liệu, 3 món, 3 dòng định lượng. Trà sữa chưa có dòng định lượng nên không được coi là đã tính giá vốn. Giá gợi ý là mô phỏng kinh doanh, cần kiểm tra giá mua và chi phí thực tế.</div></div>`}
function render(){nav();$('#screen').innerHTML=({home,dishes,ingredients,lines,reports,data:dataPage,guide,detail}[page]||home)()}
function field(label,name,type,value='',opts=null){let v=esc(value),html=opts?`<select name="${name}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(value)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${v}" ${type==='number'?'step="any"':''}>`;return`<label class="field">${label}${html}</label>`}
function openForm(kind,id=''){draft={kind,id};let r=kind==='ingredient'?db.ingredients.find(x=>x.id===id):kind==='dish'?db.dishes.find(x=>x.id===id):db.lines.find(x=>x.id===id);r=r||{};let title='',h='';if(kind==='ingredient'){title=id?'Sửa nguyên liệu':'Thêm nguyên liệu';h=field('Mã *','code','text',r.code||'')+field('Tên nguyên liệu *','name','text',r.name||'')+field('ĐVT định lượng *','unit','text',r.unit||'g')+field('Lượng trong quy cách *','pack','number',r.pack||'')+field('Giá mua quy cách (đ) *','price','number',r.price??'')+field('Tỷ lệ dùng được (%) *','yield','number',r.yield??100)}else if(kind==='dish'){title=id?'Sửa món':'Thêm món';h=field('Mã món *','code','text',r.code||'')+field('Tên món *','name','text',r.name||'')+field('Số phần/mẻ *','portions','number',r.portions??1)+field('Bao bì/phần (đ) *','packaging','number',r.packaging??0)+field('Chi phí trực tiếp khác/phần (đ) *','other','number',r.other??0)+field('Giá bán/phần (đ) *','sale','number',r.sale??0)+field('Biên lãi mục tiêu (%) *','target','number',r.target??50)}else{title=id?'Sửa định lượng':'Thêm định lượng';h=field('Mã dòng *','code','text',r.code||'')+field('Món *','dish','text',r.dish||db.dishes[0]?.code||'',db.dishes.map(x=>[x.code,x.code+' · '+x.name]))+field('Nguyên liệu *','ingredient','text',r.ingredient||db.ingredients[0]?.code||'',db.ingredients.map(x=>[x.code,x.code+' · '+x.name]))+field('Lượng dùng/mẻ *','qty','number',r.qty||'')+field('Ghi chú','note','text',r.note||'')}$('#modalTitle').textContent=title;$('#formFields').innerHTML=h;$('#formError').textContent='';$('#modal').showModal()}
function submit(e){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries()),{kind,id}=draft;try{if(!o.code?.trim())throw Error('Cần nhập mã.');if(kind==='ingredient'){for(let k of ['pack','price','yield'])o[k]=Number(o[k]);if(!o.name?.trim()||!o.unit?.trim())throw Error('Cần tên và đơn vị nguyên liệu.')}if(kind==='dish'){for(let k of ['portions','packaging','other','sale','target'])o[k]=Number(o[k]);if(!o.name?.trim())throw Error('Cần tên món.')}if(kind==='line')o.qty=Number(o.qty);let key={ingredient:'ingredients',dish:'dishes',line:'lines'}[kind],arr=db[key],old=arr.find(x=>x.id===id);if(arr.some(x=>x.id!==id&&x.code.toUpperCase()===o.code.toUpperCase()))throw Error('Mã đã tồn tại.');if(kind==='dish'&&old&&old.code!==o.code&&db.lines.some(l=>l.dish===old.code))throw Error('Món đã có định lượng; hãy giữ mã cũ.');if(kind==='ingredient'&&old&&old.code!==o.code&&db.lines.some(l=>l.ingredient===old.code))throw Error('Nguyên liệu đã được dùng; hãy giữ mã cũ.');let before=copy(db);if(old)Object.assign(old,o);else arr.push({id:uid(),...o});let error=validate(db);if(error){db=before;throw Error(error)}$('#modal').close();persist()}catch(err){$('#formError').textContent=err.message}}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportHTML(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#embedded').textContent=JSON.stringify(db).replace(/</g,'\\u003c');download('dinh-luong-mon-kem-du-lieu.html','<!doctype html>'+clone.outerHTML,'text/html;charset=utf-8')}
function exportExcel(){let rows=[['Mã món','Tên món','Giá bán','Giá vốn','Lãi gộp','Biên %','Giá gợi ý'],...db.dishes.map(d=>{let c=calc(d);return[d.code,d.name,d.sale,c.cost??'',c.profit??'',c.margin??'',c.suggested??'']})];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('bao-cao-gia-mon.csv',csv,'text/csv;charset=utf-8')}
function act(a,id=''){if(['home','dishes','ingredients','lines','reports','data','guide'].includes(a)){page=a;render();return}if(a==='newDish'||a==='editDish')return openForm('dish',a==='editDish'?id:'');if(a==='newIngredient'||a==='editIngredient')return openForm('ingredient',a==='editIngredient'?id:'');if(a==='newLine'||a==='editLine'){if(!db.dishes.length||!db.ingredients.length){alert('Cần có món và nguyên liệu trước khi ghi định lượng.');return}return openForm('line',a==='editLine'?id:'')}if(a==='viewDish'){selected=id;page='detail';return render()}if(a==='print')return print();if(a==='exportJSON')return download('dinh-luong-mon.json',JSON.stringify(db,null,2),'application/json');if(a==='exportHTML')return exportHTML();if(a==='exportExcel')return exportExcel();if(a==='importJSON')return $('#importFile').click();if(a==='loadSample'){if(confirm('Thay dữ liệu hiện tại bằng dữ liệu mẫu?')){db=sample();page='home';persist()}return}if(a==='clearData'&&confirm('Xóa toàn bộ dữ liệu trên trình duyệt này?')&&confirm('Xác nhận lần cuối: bạn đã sao lưu?')){db=blank();page='home';persist()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page]');if(b)act(b.dataset.act||b.dataset.page,b.dataset.id||'')});$('#editor').addEventListener('submit',submit);$('#cancel').onclick=()=>$('#modal').close();$('#importFile').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let x=JSON.parse(await file.text()),err=validate(x);if(err)throw Error(err);if(confirm('Nhập file này sẽ thay dữ liệu hiện tại. Tiếp tục?')){db=x;page='home';persist()}}catch(err){alert('Không nhập được: '+err.message)}finally{e.target.value=''}};render();
</script></body></html>
