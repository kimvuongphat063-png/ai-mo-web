function remindersPage(){let due=db.leads.filter(l=>active(l)&&l.nextDate&&l.nextDate<=asof()).sort((a,b)=>a.nextDate.localeCompare(b.nextDate)),fresh=db.leads.filter(l=>l.status==='Mới liên hệ'&&aging(l)>db.settings.newMax&&l.consent!=='Từ chối liên hệ');return hero('Việc cần gọi lại',`Tính theo ngày báo cáo ${fmtDate(asof())}; xem người quá hẹn và liên hệ mới chưa được tư vấn.`)+`<div class="grid">${metric('Quá hẹn',num(due.filter(l=>l.nextDate<asof()).length))}${metric('Hẹn hôm nay',num(due.filter(l=>l.nextDate===asof()).length))}${metric('Mới chưa tư vấn lâu',num(fresh.length))}</div><div class="card"><h2>📅 Đến hạn & quá hạn</h2>${table(['Hẹn','Người liên hệ','Khóa','Tư vấn','Tình trạng','Trễ','Thao tác'],due.map(l=>`<tr><td>${fmtDate(l.nextDate)}</td><td>${esc(l.name)}</td><td>${esc(l.course)}</td><td>${esc(l.owner)}</td><td>${esc(l.status)}</td><td>${l.nextDate<asof()?num(days(asof(),l.nextDate))+' ngày':'Hôm nay'}</td><td>${btn('Ghi liên hệ','newActivity','small primary',`data-lid="${esc(l.id)}"`)}</td></tr>`),'Không có lịch hẹn đến hạn.')}</div><div class="card"><h2>🕒 Mới liên hệ quá ngưỡng ${db.settings.newMax} ngày</h2>${table(['Ngày đầu','Người liên hệ','Khóa','Tuổi liên hệ','Thao tác'],fresh.map(l=>`<tr><td>${fmtDate(l.created)}</td><td>${esc(l.name)}</td><td>${esc(l.course)}</td><td>${num(aging(l))} ngày</td><td>${btn('Xem hồ sơ','openLead','small',`data-id="${esc(l.id)}"`)}</td></tr>`),'Không có liên hệ mới tồn lâu.')}</div>`}
function funnelPage(){let total=db.leads.length,paidCount=db.leads.filter(l=>paid(l.id)>0).length,sourceRows=SOURCES.map(s=>{let a=db.leads.filter(l=>l.source===s),paidN=a.filter(l=>paid(l.id)>0).length;return {source:s,total:a.length,paidN,amount:sum(a,l=>paid(l.id))}}),ownerRows=[...new Set(db.leads.map(l=>l.owner||'Chưa phân công'))].map(s=>{let a=db.leads.filter(l=>(l.owner||'Chưa phân công')===s);return {owner:s,total:a.length,paidN:a.filter(l=>paid(l.id)>0).length,amount:sum(a,l=>paid(l.id))}});return hero('Phễu tuyển sinh','Theo dõi số liên hệ ở từng giai đoạn và nguồn mang lại học phí.')+`<div class="card"><h2>Giai đoạn hiện tại</h2><div class="funnel">${STAGES.map(s=>{let n=db.leads.filter(l=>l.status===s).length;return `<div class="funnel-step"><small>${s}</small><strong>${num(n)}</strong><em>${total?num(n/total*100):0}% tổng liên hệ</em></div>`}).join('')}</div><p class="note">Tỷ lệ chốt theo dòng tiền = ${total?num(paidCount/total*100):0}% (${paidCount}/${total} có tiền đã thu). Đây là ảnh chụp trạng thái hiện tại, không phải phân tích tuần tự đầy đủ của từng lần chuyển giai đoạn.</p></div><div class="card"><h2>Theo nguồn</h2>${table(['Nguồn','Số liên hệ','Có thu','Tỷ lệ có thu','Học phí đã thu'],sourceRows.map(r=>`<tr><td>${esc(r.source)}</td><td class="num">${num(r.total)}</td><td class="num">${num(r.paidN)}</td><td class="num">${r.total?num(r.paidN/r.total*100):0}%</td><td class="num">${money(r.amount)}</td></tr>`))}</div><div class="card"><h2>Theo người tư vấn</h2>${table(['Tư vấn viên','Số liên hệ','Có thu','Tỷ lệ có thu','Học phí đã thu'],ownerRows.map(r=>`<tr><td>${esc(r.owner)}</td><td class="num">${num(r.total)}</td><td class="num">${num(r.paidN)}</td><td class="num">${r.total?num(r.paidN/r.total*100):0}%</td><td class="num">${money(r.amount)}</td></tr>`))}</div>`}
function paymentsPage(){let list=db.payments.filter(p=>!cashPeriod||p.date.slice(0,7)===cashPeriod).sort((a,b)=>b.date.localeCompare(a.date));return hero('Học phí đã thu','Ghi nhiều khoản thanh toán theo ngày; số thu ban đầu chưa rõ ngày được theo dõi riêng.')+`<div class="card"><div class="toolbar"><h2>Khoản thu ghi mới · ${list.length}</h2><span class="grow"></span>${btn('＋ Ghi học phí','newPayment','primary')}${btn('⬇️ Excel','exportExcel')}</div><div class="filters no-print"><input id="cashPeriod" type="month" value="${esc(cashPeriod)}" aria-label="Lọc tháng thu">${btn('Tất cả tháng','allPeriods')}</div><p class="note">Tổng khoản thu có ngày trong kỳ lọc: <b>${money(sum(list,p=>p.amount))}</b>. Số thu ban đầu chưa rõ ngày: <b>${money(sum(db.leads,l=>l.openingPaid))}</b>.</p>${table(['Ngày','Người liên hệ','Khóa','Số tiền','Phương thức','Tham chiếu','Thao tác'],list.slice(0,200).map(p=>`<tr><td>${fmtDate(p.date)}</td><td><button class="link" data-act="openLead" data-id="${esc(p.leadId)}">${esc(lead(p.leadId)?.name||'')}</button></td><td>${esc(lead(p.leadId)?.course||'')}</td><td class="num">${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.ref||'')}</td><td>${btn('Xóa','deletePayment','small danger',`data-id="${esc(p.id)}"`)}</td></tr>`),'Chưa có khoản thu ghi mới trong kỳ.')}</div>`}
function settingsPage(){return hero('Cài đặt','Ngày báo cáo và ngưỡng theo dõi liên hệ mới.')+`<div class="card"><div class="formgrid">${field('org','Tên trung tâm',db.settings.org)}${field('asof','Ngày báo cáo (để trống = hôm nay)',db.settings.asof,'date')}${field('newMax','Cảnh báo liên hệ mới chưa tư vấn sau (ngày)',db.settings.newMax,'number')}</div><div class="toolbar" style="margin-top:16px">${btn('Lưu cài đặt','saveSettings','primary')}</div></div><div class="hint">Dữ liệu phụ huynh là thông tin cá nhân. App chỉ lưu trên thiết bị này và không tự gửi tin nhắn hay gọi điện. Cần quản lý việc đồng ý liên hệ và quyền truy cập file sao lưu.</div>`}
function dataPage(){return hero('Dữ liệu & sao lưu','Chuyển máy bằng JSON hoặc HTML kèm dữ liệu; Excel có thể nhập lại.')+`<div class="card"><h2>Xuất & nhập</h2><div class="data-actions">${btn('⬇️ Sao lưu JSON','backup','primary')}${btn('⬇️ HTML kèm dữ liệu','portable')}${btn('⬇️ Xuất Excel 3 sheet','exportExcel')}${btn('⬆️ Khôi phục JSON','restore')}${btn('⬆️ Nhập Excel','importExcel')}</div><p class="note">Excel có ba sheet Liên hệ, Nhật ký, Học phí. Giữ nguyên ID và tên cột khi nhập lại. Nhập sẽ kiểm tra và hỏi trước khi thay dữ liệu hiện tại.</p></div><div class="card"><h2>Dữ liệu mẫu gốc</h2><p>20 liên hệ, 6 người ở trạng thái “Đã đóng tiền”, tổng số đã thu ban đầu 12.400.000 đồng. Mẫu thiếu ngày thanh toán và một số tên bị mất ký tự đầu; app giữ nguyên để đối chiếu, không tự đoán bổ sung.</p>${btn('Nạp 20 liên hệ mẫu','loadDemo')}</div><div class="card"><h2>Xóa dữ liệu trên thiết bị</h2><p>Hãy sao lưu trước; thao tác xóa toàn bộ hồ sơ, nhật ký, khoản thu và cài đặt trong trình duyệt hiện tại.</p>${btn('Xóa toàn bộ','clear','danger')}</div>`}
function guidePage(){return hero('Hướng dẫn sử dụng','Quy trình từ liên hệ đầu tiên đến khi có khoản học phí thực nhận.')+`<div class="card"><h2>1 · Ghi liên hệ</h2><p>Nhập người liên hệ, khóa quan tâm, nguồn, tư vấn viên, điện thoại và tình trạng đồng ý liên hệ. Đặt ngày gọi lại; không tự lưu hay gửi dữ liệu lên server.</p><h2>2 · Tư vấn và học thử</h2><p>Mỗi lần trao đổi, ghi một hoạt động với ngày, nội dung, giai đoạn mới và lịch hẹn tiếp theo. Nhật ký giữ lại các lần xử lý.</p><h2>3 · Ghi học phí</h2><p>Chỉ ghi khoản đã thu thật trong màn Học phí. Có thể thu nhiều lần. Nếu có tiền đã thu trước khi dùng app nhưng không rõ ngày, nhập “Số đã thu ban đầu” ở hồ sơ liên hệ.</p><h2>4 · Theo dõi nhắc việc</h2><p>Trang Việc cần gọi hiển thị hẹn hôm nay, quá hẹn, liên hệ mới chưa tư vấn sau số ngày cài đặt. Người từ chối liên hệ được đánh dấu để tránh liên lạc lại.</p><h2>5 · Đọc phễu và sao lưu</h2><p>Phễu cho thấy giai đoạn hiện tại, số có tiền đã thu, học phí theo nguồn và tư vấn viên. Sao lưu JSON hoặc HTML kèm dữ liệu khi chuyển máy.</p></div><div class="hint">Nguồn đối chiếu: file “Tuyển sinh: phễu từ liên hệ đến đóng tiền” của Thầy Đạt Tin Học. App không tự nhắn tin, gọi điện, kết nối CRM hay đồng bộ với app học viên/lớp.</div>`}

function showModal(kind,id='',pref={}){draft={kind,id};let l=kind==='lead'&&id?lead(id):null,p=kind==='payment'&&id?db.payments.find(x=>x.id===id):null;let title='',html='';if(kind==='lead'){title=l?'Sửa hồ sơ liên hệ':'Thêm liên hệ';html=field('created','Ngày liên hệ *',l?.created||today(),'date')+field('name','Người liên hệ *',l?.name||'')+field('phone','Điện thoại',l?.phone||'')+field('student','Tên học sinh',l?.student||'')+field('source','Nguồn',l?.source||SOURCES[0],'text',SOURCES)+field('course','Khóa quan tâm',l?.course||'')+field('owner','Người tư vấn',l?.owner||'')+field('status','Giai đoạn',l?.status||STAGES[0],'text',STAGES)+field('nextDate','Hẹn gọi lại',l?.nextDate||'','date')+field('consent','Đồng ý liên hệ',l?.consent||CONSENTS[0],'text',CONSENTS)+field('quotedFee','Học phí dự kiến / báo giá',l?.quotedFee??0,'number')+field('openingPaid','Số đã thu trước khi dùng app (không rõ ngày)',l?.openingPaid??0,'number')+field('note','Ghi chú',l?.note||'','textarea',null,'full')+(l?field('reason','Lý do nếu đổi giai đoạn','','textarea',null,'full'):'')}else if(kind==='activity'){if(!db.leads.length){alert('Hãy tạo liên hệ trước.');return}let l=lead(pref.leadId||selected)||db.leads[0];title='Ghi hoạt động tư vấn';html=field('leadId','Người liên hệ *',l.id,'text',db.leads.map(x=>[x.id,x.name+' · '+x.course]))+field('date','Ngày hoạt động *',today(),'date')+field('type','Loại hoạt động',TYPES[0],'text',TYPES)+field('stageAfter','Giai đoạn sau hoạt động',l.status,'text',STAGES)+field('nextDate','Hẹn tiếp theo',l.nextDate||'','date')+field('note','Nội dung / kết quả *','','textarea',null,'full')}else if(kind==='payment'){if(!db.leads.length){alert('Hãy tạo liên hệ trước.');return}let l=lead(p?.leadId||pref.leadId||selected)||db.leads[0];title='Ghi học phí đã thu';html=field('leadId','Người liên hệ *',l.id,'text',db.leads.map(x=>[x.id,x.name+' · '+x.course]))+field('date','Ngày nhận tiền *',p?.date||today(),'date')+field('amount','Số tiền đã nhận *',p?.amount??0,'number')+field('method','Phương thức',p?.method||METHODS[0],'text',METHODS)+field('ref','Mã giao dịch/phiếu',p?.ref||'')+field('note','Ghi chú',p?.note||'','textarea',null,'full')}
$('#modalTitle').textContent=title;$('#modalFields').innerHTML=html;$('#modalError').textContent='';$('#editor').showModal();$('#modalFields input, #modalFields select')?.focus()}

function modalError(msg){$('#modalError').textContent=msg;$('#modalError').scrollIntoView({block:'nearest'})}
function saveModal(){if(!draft)return;let f=collect(),id=draft.id;if(draft.kind==="lead"){let incoming=Number(f.openingPaid)+sum(db.payments.filter(p=>p.leadId===id),p=>p.amount);if(incoming>0&&f.status!=="Đã đóng tiền")return modalError("Hồ sơ đã có tiền thu; cần giữ giai đoạn Đã đóng tiền cho đến khi xử lý hoàn tiền ở quy trình riêng.")}if(draft.kind==="activity"){let target=lead(f.leadId);if(target&&paid(target.id)>0&&f.stageAfter!=="Đã đóng tiền")return modalError("Liên hệ đã có học phí thực thu; không thể chuyển về giai đoạn chưa đóng tiền.")}if(draft.kind==='lead'){let openingPaid=Number(f.openingPaid),quotedFee=Number(f.quotedFee),old=id?lead(id):null;if(!validDate(f.created)||!f.created||!validDate(f.nextDate)||!f.name||f.name.length>120||!SOURCES.includes(f.source)||!STAGES.includes(f.status)||!CONSENTS.includes(f.consent))return modalError('Ngày, tên, nguồn, giai đoạn hoặc đồng ý liên hệ không hợp lệ.');if(f.phone&&!/^[0-9+().\s-]{8,30}$/.test(f.phone))return modalError('Điện thoại cần 8–30 ký tự hợp lệ.');if(!Number.isSafeInteger(openingPaid)||openingPaid<0||!Number.isSafeInteger(quotedFee)||quotedFee<0)return modalError('Học phí cần là số đồng nguyên không âm.');if(old&&old.status!==f.status&&!f.reason)return modalError('Nhập lý do khi đổi giai đoạn.');let duplicate=db.leads.find(x=>x.id!==id&&f.phone&&x.phone===f.phone&&x.name.toLocaleLowerCase('vi')===f.name.toLocaleLowerCase('vi'));if(duplicate&&!confirm('Đã có liên hệ trùng tên và số điện thoại. Vẫn lưu hồ sơ?'))return;let rec={id:id||uid(),created:f.created,name:f.name,phone:f.phone,student:f.student.slice(0,120),source:f.source,course:f.course.slice(0,120),owner:f.owner.slice(0,120),status:f.status,nextDate:f.nextDate,openingPaid,quotedFee,consent:f.consent,note:f.note.slice(0,1000)};if(old){if(old.status!==rec.status)db.activities.push({id:uid(),leadId:id,date:today(),type:'Đổi trạng thái',note:f.reason.slice(0,500),stageAfter:rec.status,nextDate:rec.nextDate});Object.assign(old,rec)}else db.leads.push(rec);selected=rec.id;page='detail'}else if(draft.kind==='activity'){let l=lead(f.leadId);if(!l||!validDate(f.date)||!f.date||!TYPES.includes(f.type)||!STAGES.includes(f.stageAfter)||!validDate(f.nextDate)||!f.note)return modalError('Chọn liên hệ, ngày, loại, giai đoạn và nhập kết quả.');if(l.consent==='Từ chối liên hệ'&&['Gọi điện','Zalo / nhắn tin'].includes(f.type))return modalError('Người này đã từ chối liên hệ; không ghi hoạt động gọi/nhắn mới.');db.activities.push({id:uid(),leadId:l.id,date:f.date,type:f.type,note:f.note.slice(0,1000),stageAfter:f.stageAfter,nextDate:f.nextDate});l.status=f.stageAfter;l.nextDate=f.nextDate;selected=l.id;page='detail'}else if(draft.kind==='payment'){let l=lead(f.leadId),amount=Number(f.amount);if(!l||!validDate(f.date)||!f.date||!Number.isSafeInteger(amount)||amount<=0||!METHODS.includes(f.method))return modalError('Liên hệ, ngày hoặc số tiền không hợp lệ.');if(l.status==='Từ chối'&&!confirm('Liên hệ đang ở trạng thái Từ chối. Vẫn ghi khoản tiền đã nhận?'))return;let p={id:id||uid(),leadId:l.id,date:f.date,amount,method:f.method,ref:f.ref.slice(0,100),note:f.note.slice(0,500)};if(id)Object.assign(db.payments.find(x=>x.id===id),p);else db.payments.push(p);if(l.status!=='Đã đóng tiền'){l.status='Đã đóng tiền';db.activities.push({id:uid(),leadId:l.id,date:f.date,type:'Đổi trạng thái',note:'Tự động chuyển khi ghi nhận học phí thực thu',stageAfter:'Đã đóng tiền',nextDate:l.nextDate})}selected=l.id;page='detail'}$('#editor').close();draft=null;save()}
function loadDemo(){if((db.leads.length||db.activities.length||db.payments.length)&&!confirm('Nạp mẫu sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;let x=empty();for(let row of ADMISSIONS_SAMPLE.ts){x.leads.push({id:uid(),created:addDays(today(),Number(row[0].slice(1))),name:row[1],phone:'',student:'',source:row[2],course:row[3],owner:row[4],status:row[5],nextDate:addDays(today(),Number(row[6].slice(1))),openingPaid:row[7],quotedFee:0,consent:'Chưa ghi nhận',note:'Mẫu gốc: tên có thể bị mất ký tự đầu; tiền đã thu không có ngày thanh toán.'})}db=x;page='dashboard';save()}
function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'tuyen-sinh-pheu-lien-he.json')}
function portable(){let html=document.documentElement.outerHTML.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download(new Blob(['<!doctype html>\n'+html],{type:'text/html;charset=utf-8'}),'tuyen-sinh-pheu-lien-he-kem-du-lieu.html')}
const H_LEAD=['ID','Ngày liên hệ','Người liên hệ','Điện thoại','Học sinh','Nguồn','Khóa quan tâm','Tư vấn viên','Giai đoạn','Hẹn gọi lại','Đã thu ban đầu','Học phí dự kiến','Đồng ý liên hệ','Ghi chú'];
const H_ACTIVITY=['ID','ID liên hệ','Ngày','Loại','Nội dung','Giai đoạn sau','Hẹn tiếp'];
const H_PAYMENT=['ID','ID liên hệ','Ngày thu','Số tiền','Phương thức','Mã tham chiếu','Ghi chú'];
function exportExcel(){let sheets=[{name:'Lien he',rows:[H_LEAD,...db.leads.map(l=>[l.id,l.created,l.name,l.phone,l.student,l.source,l.course,l.owner,l.status,l.nextDate,l.openingPaid,l.quotedFee,l.consent,l.note])]},{name:'Nhat ky',rows:[H_ACTIVITY,...db.activities.map(a=>[a.id,a.leadId,a.date,a.type,a.note,a.stageAfter,a.nextDate])]},{name:'Hoc phi',rows:[H_PAYMENT,...db.payments.map(p=>[p.id,p.leadId,p.date,p.amount,p.method,p.ref,p.note])]}];download(Excel.workbook(sheets),'tuyen-sinh-pheu-lien-he.xlsx')}
const sheetDate=v=>typeof v==='number'&&Number.isFinite(v)?new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toISOString().slice(0,10):String(v||'').trim();
function fromExcel(book){let a=book['Lien he'],b=book['Nhat ky'],c=book['Hoc phi'];if(!a||!b||!c)throw Error('Thiếu một trong ba sheet của app.');let same=(r,h)=>h.every((x,i)=>String(r?.[i]??'')===x);if(!same(a[0],H_LEAD)||!same(b[0],H_ACTIVITY)||!same(c[0],H_PAYMENT))throw Error('Tên cột Excel không khớp file do app xuất.');let x=empty();x.settings=clone(db.settings);for(let r of a.slice(1)){if(!String(r[0]||'').trim())continue;x.leads.push({id:String(r[0]),created:sheetDate(r[1]),name:String(r[2]||''),phone:String(r[3]||''),student:String(r[4]||''),source:String(r[5]||''),course:String(r[6]||''),owner:String(r[7]||''),status:String(r[8]||''),nextDate:sheetDate(r[9]),openingPaid:Number(r[10]),quotedFee:Number(r[11]),consent:String(r[12]||''),note:String(r[13]||'')})}for(let r of b.slice(1)){if(!String(r[0]||'').trim())continue;x.activities.push({id:String(r[0]),leadId:String(r[1]),date:sheetDate(r[2]),type:String(r[3]||''),note:String(r[4]||''),stageAfter:String(r[5]||''),nextDate:sheetDate(r[6])})}for(let r of c.slice(1)){if(!String(r[0]||'').trim())continue;x.payments.push({id:String(r[0]),leadId:String(r[1]),date:sheetDate(r[2]),amount:Number(r[3]),method:String(r[4]||''),ref:String(r[5]||''),note:String(r[6]||'')})}let err=validate(x);if(err)throw Error(err);return x}
function act(name,d){if(name==='newLead')showModal('lead');else if(name==='editLead')showModal('lead',d.id);else if(name==='openLead'){selected=d.id;page='detail';render()}else if(name==='goLeads'){page='leads';render()}else if(name==='deleteLead'){let l=lead(d.id);if(db.activities.some(a=>a.leadId===d.id)||db.payments.some(p=>p.leadId===d.id))return alert('Liên hệ đã có nhật ký hoặc khoản thu; không thể xóa hồ sơ. Có thể chuyển sang trạng thái Từ chối.');if(confirm('Xóa liên hệ '+l.name+'?')){db.leads=db.leads.filter(x=>x.id!==d.id);page='leads';save()}}else if(name==='newActivity')showModal('activity','',{leadId:d.lid||selected});else if(name==='newPayment')showModal('payment','',{leadId:d.lid||selected});else if(name==='deletePayment'){if(confirm('Xóa khoản thu này? Hãy đối chiếu chứng từ trước khi xóa.')){db.payments=db.payments.filter(p=>p.id!==d.id);save()}}else if(name==='clearFilters'){query='';stageFilter='';sourceFilter='';ownerFilter='';render()}else if(name==='allPeriods'){cashPeriod='';render()}else if(name==='goReminders'){page='reminders';render()}else if(name==='goFunnel'){page='funnel';render()}else if(name==='saveSettings'){let org=$('#f_org').value.trim(),date=$('#f_asof').value,newMax=Number($('#f_newMax').value);if(org.length>120||!validDate(date)||!Number.isSafeInteger(newMax)||newMax<0||newMax>365)return alert('Tên trung tâm tối đa 120 ký tự; ngày hợp lệ; ngưỡng từ 0 đến 365 ngày.');db.settings={org,asof:date,newMax};save()}else if(name==='backup')backup();else if(name==='portable')portable();else if(name==='exportExcel')exportExcel();else if(name==='restore')$('#jsonFile').click();else if(name==='importExcel')$('#excelFile').click();else if(name==='loadDemo')loadDemo();else if(name==='clear'){if(confirm('Xóa toàn bộ liên hệ, nhật ký, khoản thu và cài đặt trên thiết bị này?')){db=empty();selected='';page='dashboard';save()}}else if(name==='print')window.print()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}let b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='stageFilter'){stageFilter=e.target.value;render()}else if(e.target.id==='sourceFilter'){sourceFilter=e.target.value;render()}else if(e.target.id==='ownerFilter'){ownerFilter=e.target.value;render()}else if(e.target.id==='cashPeriod'){cashPeriod=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let p=$('#screen .table-wrap');if(page==='leads'&&p)p.outerHTML=table(['Ngày liên hệ','Người liên hệ','Nguồn','Khóa quan tâm','Tư vấn','Giai đoạn','Hẹn lại / cảnh báo','Đã thu','Thao tác'],leadRows(filtered().slice(0,200)),'Chưa có liên hệ phù hợp.')}});
$('#modalSave').addEventListener('click',saveModal);$('#modalClose').addEventListener('click',()=>$('#editor').close());$('#modalCancel').addEventListener('click',()=>$('#editor').close());$('#quickPrint').addEventListener('click',()=>window.print());
$('#jsonFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>15e6)throw Error('File JSON vượt 15 MB.');let x=JSON.parse(await f.text()),err=validate(x);if(err)throw Error(err);if(!confirm(`Khôi phục ${x.leads.length} liên hệ, ${x.activities.length} hoạt động và ${x.payments.length} khoản thu? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{let x=fromExcel(await Excel.read(f));if(!confirm(`Nhập ${x.leads.length} liên hệ, ${x.activities.length} hoạt động và ${x.payments.length} khoản thu từ Excel? Dữ liệu hiện tại sẽ bị thay.`))return;db=x;page='dashboard';save()}catch(err){alert('Không nhập được Excel: '+err.message)}});
window.__ADMISSIONS_TEST__={empty,validate,paid,overdue,aging,loadDemo,fromExcel,getDB:()=>db,setDB:x=>{db=x;render()},go:p=>{page=p;render()}};
