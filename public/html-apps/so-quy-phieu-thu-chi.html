function validBackup(d){
  if(!d||d.version!==1||!d.settings||typeof d.settings.company!=='string'||d.settings.company.length>160||!safe(d.settings.opening)||!validDate(d.settings.start)||!['director','accountant','cashier','maker'].every(k=>typeof d.settings[k]==='string'&&d.settings[k].length<=160)||!['prefixThu','prefixChi'].every(k=>typeof d.settings[k]==='string'&&/^[A-Za-z0-9_-]{1,12}$/.test(d.settings[k]))||!Number.isSafeInteger(d.settings.nextThu)||d.settings.nextThu<1||!Number.isSafeInteger(d.settings.nextChi)||d.settings.nextChi<1||!Array.isArray(d.groups)||d.groups.length>25||!Array.isArray(d.rows)||d.rows.length>100000)return false;
  let gids=new Set(),names=new Set();for(let g of d.groups){if(!g||typeof g.id!=='string'||!g.id||gids.has(g.id)||typeof g.name!=='string'||!g.name||g.name.length>160||names.has(g.name.toLocaleLowerCase('vi'))||!['Thu','Chi'].includes(g.type)||typeof g.note!=='string'||g.note.length>2000)return false;gids.add(g.id);names.add(g.name.toLocaleLowerCase('vi'))}
  let ids=new Set(),vouchers=new Set();for(let r of d.rows){if(!r||typeof r.id!=='string'||!r.id||ids.has(r.id)||!validDate(r.date)||r.date<d.settings.start||!gids.has(r.groupId)||r.type!==group(r.groupId,d).type||typeof r.voucherNo!=='string'||!r.voucherNo||vouchers.has(r.voucherNo)||typeof r.who!=='string'||r.who.length>300||typeof r.description!=='string'||r.description.length>2000||!safe(r.amount)||r.amount===0||typeof r.doc!=='string'||r.doc.length>500)return false;ids.add(r.id);vouchers.add(r.voucherNo)}
  return true;
}

function words(n){n=Math.round(Math.abs(Number(n)||0));if(n===0)return'Không đồng';let cs=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'],units=['',' nghìn',' triệu',' tỷ',' nghìn tỷ',' triệu tỷ'];const tri=(x,full)=>{let tr=Math.floor(x/100),ch=Math.floor(x%100/10),dv=x%10,s='';if(full||tr>0)s+=cs[tr]+' trăm';if(ch>1){s+=' '+cs[ch]+' mươi';if(dv===1)s+=' mốt';else if(dv===5)s+=' lăm';else if(dv===4)s+=' tư';else if(dv>0)s+=' '+cs[dv]}else if(ch===1){s+=' mười';if(dv===5)s+=' lăm';else if(dv>0)s+=' '+cs[dv]}else if(dv>0){if(full||tr>0)s+=' lẻ';s+=' '+cs[dv]}return s.trim()};let chunks=[],x=n;while(x>0){chunks.push(x%1000);x=Math.floor(x/1000)}let out=[];for(let i=chunks.length-1;i>=0;i--)if(chunks[i])out.push(tri(chunks[i],i!==chunks.length-1)+units[i]);let s=out.join(' ').replace(/\s+/g,' ').trim();return s[0].toUpperCase()+s.slice(1)+' đồng'}

function dataPage(){return hero('💾 Dữ liệu & sao lưu','Sao lưu trước khi nạp mẫu, nhập Excel hoặc chuyển máy.')+'<section class="card"><div class="grid">'+metric('Nhóm thu chi',db.groups.length)+metric('Phiếu',db.rows.length)+metric('Số phiếu thu tiếp',db.settings.prefixThu+String(db.settings.nextThu).padStart(4,'0'))+metric('Số phiếu chi tiếp',db.settings.prefixChi+String(db.settings.nextChi).padStart(4,'0'))+'</div><p class="notice warn">Bản HTML gốc không tự mang dữ liệu đã lưu trong trình duyệt. Dùng HTML kèm dữ liệu hoặc JSON để chuyển máy.</p><div class="toolbar"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="portable">↓ HTML kèm dữ liệu</button><button class="btn" data-action="restore">↑ Khôi phục JSON</button><button class="btn" data-action="excelExport">↓ Excel</button><button class="btn" data-action="excelImport">↑ Nhập Excel</button><button class="btn" data-action="csv">↓ CSV sổ quỹ</button></div><p class="muted">Excel có 4 sheet: nhóm, phiếu, cài đặt, báo cáo tháng.</p></section><section class="card"><h2>Dữ liệu mẫu gốc</h2><p>13 nhóm, 13 giao dịch trong tháng hiện tại; số dư đầu 45 triệu đồng. Mẫu chỉ nạp khi chọn.</p><button class="btn" data-action="sample">Nạp dữ liệu mẫu</button></section><section class="card"><h2>Làm mới</h2><button class="btn danger" data-action="clear">Xóa dữ liệu trên trình duyệt này</button></section>'}
function guidePage(){return hero('❔ Cách sử dụng','Quy trình sổ quỹ tiền mặt và phiếu thu chi.')+'<section class="card"><h2>Quy trình</h2><ol><li>Vào Cài đặt, nhập số dư đầu sổ, ngày bắt đầu và người ký phiếu.</li><li>Kiểm tra danh mục nhóm thu chi; loại Thu/Chi quyết định chiều tiền của phiếu.</li><li>Thêm một phiếu cho mỗi lần tiền mặt thực vào hoặc ra quỹ.</li><li>Xem sổ quỹ, rà cảnh báo quỹ âm, chọn phiếu để in.</li><li>Cuối tháng xem báo cáo và sao lưu JSON hoặc HTML kèm dữ liệu.</li></ol><h2>Lưu ý</h2><p>App chỉ theo dõi <b>tiền mặt tại quỹ</b>. Rút tiền từ ngân hàng về quỹ là Thu tiền mặt; nộp từ quỹ vào ngân hàng là Chi tiền mặt. Đây không phải doanh thu hay chi phí toàn doanh nghiệp. Số phiếu cố định sau khi tạo và không tái sử dụng khi xóa.</p></section>'}
function render(){let names={dashboard:'Tổng quan',ledger:'Sổ quỹ',vouchers:'Phiếu thu chi',groups:'Nhóm thu chi',reports:'Báo cáo',settings:'Cài đặt',data:'Dữ liệu & sao lưu',guide:'Hướng dẫn'};$('#topTitle').textContent=names[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,ledger:ledgerPage,vouchers:vouchersPage,groups:groupsPage,reports:reportsPage,settings:settingsPage,data:dataPage,guide:guidePage};$('#screen').innerHTML='<div class="print-head"><b>'+esc(db.settings.company||'Sổ quỹ tiền mặt')+'</b> · '+esc(names[page])+' · '+esc(month)+'</div>'+views[page]()}
function openModal(type,id='',kind='Thu'){
  let old=type==='group'?db.groups.find(g=>g.id===id):db.rows.find(r=>r.id===id);old=old||{};modal={type,id};$('#modalTitle').textContent=(id?'Sửa ':'Thêm ')+(type==='group'?'nhóm thu chi':'phiếu '+(old.type||kind).toLowerCase());let h='';
  if(type==='group')h=field('name','Tên nhóm *','text',old.name||'')+field('type','Loại','select','',opt('Thu','Thu',old.type||kind)+opt('Chi','Chi',old.type||kind))+field('note','Ghi chú','textarea',old.note||'');
  if(type==='row'){let list=db.groups.filter(g=>g.type===(old.type||kind));h=field('date','Ngày giao dịch *','date',old.date||today())+field('groupId','Nhóm thu / chi *','select','',list.map(g=>opt(g.id,g.name,old.groupId||list[0]?.id)).join(''))+field('who',(old.type||kind)==='Thu'?'Người nộp tiền':'Người nhận tiền','text',old.who||'')+field('description','Diễn giải','textarea',old.description||'')+field('amount','Số tiền (đ) *','number',old.amount??0)+field('doc','Chứng từ kèm theo','text',old.doc||'');if(id)h+='<p class="wide notice">Số phiếu '+esc(old.voucherNo)+' giữ nguyên khi sửa.</p>'}
  if(id)h+='<div class="wide"><button class="btn danger small" data-action="deleteRecord" type="button">Xóa bản ghi này</button></div>';
  $('#modalFields').innerHTML=h;$('#modalError').textContent='';$('#editor').showModal();
}
function closeModal(){modal=null;$('#editor').close()}
function saveModal(){
  if(!modal)return;let{type,id}=modal,x={},error='';
  if(type==='group'){x={name:v('name'),type:v('type'),note:v('note')};if(!x.name||x.name.length>160||!['Thu','Chi'].includes(x.type)||x.note.length>2000)error='Tên hoặc loại nhóm không hợp lệ.';if(db.groups.some(g=>g.id!==id&&g.name.toLocaleLowerCase('vi')===x.name.toLocaleLowerCase('vi')))error='Tên nhóm đã có.';if(!id&&db.groups.length>=25)error='Tối đa 25 nhóm.';if(id&&db.rows.some(r=>r.groupId===id)&&db.groups.find(g=>g.id===id).type!==x.type)error='Nhóm đã có phiếu; không thể đổi loại Thu/Chi.'}
  if(type==='row'){let g=group(v('groupId'));x={date:v('date'),groupId:v('groupId'),type:g?.type||'',who:v('who'),description:v('description'),amount:int(v('amount')),doc:v('doc')};if(!validDate(x.date)||x.date<db.settings.start||!g||!safe(x.amount)||x.amount===0||x.who.length>300||x.description.length>2000||x.doc.length>500)error='Ngày phải từ ngày bắt đầu sổ; chọn nhóm và nhập số tiền lớn hơn 0.';if(id&&db.rows.find(r=>r.id===id)?.type!==x.type)error='Không thể đổi chiều Thu/Chi của phiếu đã có số. Tạo phiếu mới.'}
  if(error){$('#modalError').textContent=error;return}
  let d={...db,groups:db.groups.slice(),rows:db.rows.slice(),settings:{...db.settings}};
  if(type==='group'){if(id){let i=d.groups.findIndex(g=>g.id===id);d.groups[i]={...d.groups[i],...x}}else d.groups.push({id:uid(),...x})}
  else if(id){let i=d.rows.findIndex(r=>r.id===id);d.rows[i]={...d.rows[i],...x}}else d.rows.push({id:uid(),...x,voucherNo:nextVoucher(d,x.type)});
  if(!validBackup(d)){$('#modalError').textContent='Dữ liệu sai, nhóm trùng hoặc phiếu trước ngày bắt đầu sổ.';return}db=d;closeModal();save();
}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function portable(){let html=document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+encode(db)+'$2');download('so-quy-kem-du-lieu.html','<!doctype html>\n'+html,'text/html;charset=utf-8')}
function csv(){let rows=[['Ngày','Số phiếu','Loại','Nhóm','Người nộp/nhận','Diễn giải','Thu','Chi','Tồn quỹ','Chứng từ','Cảnh báo']];for(let r of ledger(db))rows.push([r.date,r.voucherNo,r.type,group(r.groupId)?.name,r.who,r.description,r.type==='Thu'?r.amount:0,r.type==='Chi'?r.amount:0,r.balance,r.doc,r.warning]);let body='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('so-quy-tien-mat.csv',body,'text/csv;charset=utf-8')}
function excelSheets(){let m=monthOf(db,month);return[
  {name:'Nhom thu chi',rows:[['Mã nhóm','Tên nhóm','Loại','Ghi chú'],...db.groups.map(g=>[g.id,g.name,g.type,g.note])]},
  {name:'So quy',rows:[['Mã dòng','Ngày','Mã nhóm','Loại','Số phiếu','Người nộp nhận','Diễn giải','Số tiền','Chứng từ'],...db.rows.map(r=>[r.id,r.date,r.groupId,r.type,r.voucherNo,r.who,r.description,r.amount,r.doc])]},
  {name:'Cai dat',rows:[['Khóa','Giá trị'],...Object.entries(db.settings)]},
  {name:'Bao cao thang',rows:[['Chỉ tiêu',month],['Tồn đầu',m.opening],['Thu',m.thu],['Chi',m.chi],['Tồn cuối',m.closing],[],['Nhóm','Loại','Số phiếu','Số tiền'],...db.groups.map(g=>{let rows=m.rows.filter(r=>r.groupId===g.id);return[g.name,g.type,rows.length,rows.reduce((n,r)=>n+r.amount,0)]})]}
]}
function excelExport(){let url=URL.createObjectURL(Excel.workbook(excelSheets())),a=document.createElement('a');a.href=url;a.download='so-quy-phieu-thu-chi.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function parseDate(v){if(typeof v==='number'&&Number.isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}let s=String(v??'').trim();if(validDate(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m){let x=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return validDate(x)?x:''}return ''}
function parsedExcel(sheets){let gs=sheets['Nhom thu chi'],rs=sheets['So quy'];if(!gs||!rs||gs[0]?.[0]!=='Mã nhóm'||rs[0]?.[0]!=='Mã dòng')throw Error('Cần workbook do app xuất có sheet Nhóm thu chi và Sổ quỹ.');let d=blank();d.groups=[];d.rows=[];
  for(let r of gs.slice(1)){if(!String(r[0]??'').trim())continue;d.groups.push({id:String(r[0]).trim(),name:String(r[1]??'').trim(),type:String(r[2]??'').trim(),note:String(r[3]??'')})}
  for(let r of rs.slice(1)){if(!String(r[0]??'').trim())continue;d.rows.push({id:String(r[0]).trim(),date:parseDate(r[1]),groupId:String(r[2]??'').trim(),type:String(r[3]??'').trim(),voucherNo:String(r[4]??'').trim(),who:String(r[5]??''),description:String(r[6]??''),amount:int(r[7]),doc:String(r[8]??'')})}
  if(sheets['Cai dat']){let raw=Object.fromEntries(sheets['Cai dat'].slice(1).filter(r=>String(r[0]??'').trim()).map(r=>[String(r[0]).trim(),r[1]]));for(let k of ['company','director','accountant','cashier','maker','prefixThu','prefixChi'])if(raw[k]!==undefined)d.settings[k]=String(raw[k]);if(raw.opening!==undefined)d.settings.opening=int(raw.opening);if(raw.start!==undefined)d.settings.start=parseDate(raw.start);if(raw.nextThu!==undefined)d.settings.nextThu=int(raw.nextThu);if(raw.nextChi!==undefined)d.settings.nextChi=int(raw.nextChi)}
  if(!validBackup(d))throw Error('Excel có ngày, nhóm, phiếu hoặc số tiền không hợp lệ.');return d}
async function excelImport(file){if(file.size>20_000_000)throw Error('File quá lớn.');let d=parsedExcel(await Excel.read(file));if(!confirm('Nhập Excel sẽ THAY THẾ dữ liệu hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=d;save()}
function print(){window.print()}
document.addEventListener('click',e=>{
  let b=e.target.closest('[data-page],[data-new],[data-edit],[data-action]');if(!b)return;
  if(b.dataset.page){page=b.dataset.page;query='';render();return}
  if(b.dataset.new){openModal(b.dataset.new,'',b.dataset.kind||'Thu');return}
  if(b.dataset.edit){openModal(b.dataset.edit,b.dataset.id);return}
  let a=b.dataset.action;
  if(a==='close')closeModal();if(a==='saveModal')saveModal();if(a==='print')print();if(a==='csv')csv();if(a==='excelExport')excelExport();if(a==='excelImport')$('#excelFile').click();
  if(a==='backup')download('so-quy-sao-luu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(a==='portable')portable();if(a==='restore')$('#restoreFile').click();
  if(a==='sample'){if(!confirm('Nạp mẫu sẽ THAY THẾ toàn bộ dữ liệu và cài đặt hiện tại. Hãy sao lưu trước. Tiếp tục?'))return;db=sampleData();month=db.settings.start.slice(0,7);save()}
  if(a==='clear'){if(confirm('Xóa toàn bộ phiếu và đặt lại số dư đầu sổ trên trình duyệt này?')){db=blank();chosen='';save()}}
  if(a==='deleteRecord'&&modal?.id){let{type,id}=modal;if(type==='group'&&db.rows.some(r=>r.groupId===id)){$('#modalError').textContent='Nhóm đã có phiếu; không thể xóa.';return}if(confirm('Xóa vĩnh viễn bản ghi này? Số phiếu đã xóa sẽ không dùng lại.')){let key=type==='group'?'groups':'rows';db[key]=db[key].filter(x=>x.id!==id);closeModal();save()}}
  if(a==='showVoucher'){chosen=b.dataset.id;page='vouchers';render()}
  if(a==='settings'){let s={...db.settings,company:v('company'),opening:int(v('opening')),start:v('start'),prefixThu:v('prefixThu'),prefixChi:v('prefixChi'),director:v('director'),accountant:v('accountant'),cashier:v('cashier'),maker:v('maker')},d={...db,settings:s};if(!validBackup(d)){alert('Số dư, ngày bắt đầu, ký hiệu hoặc tên người ký không hợp lệ.');return}db=d;save()}
});
document.addEventListener('change',e=>{if(e.target.id==='monthPick'){month=e.target.value;render()}if(e.target.id==='filterType'){filterType=e.target.value;render()}if(e.target.id==='voucherPick'){chosen=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let at=e.target.selectionStart;query=e.target.value;render();let el=$('#search');el.focus();el.setSelectionRange(at,at)}});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30_000_000)throw Error('File quá lớn.');let d=JSON.parse(await file.text());if(!validBackup(d))throw Error('File sai cấu trúc hoặc phiên bản.');if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?'))return;db=d;save()}catch(err){alert('Không khôi phục được: '+err.message)}});
$('#excelFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{await excelImport(file)}catch(err){alert('Không nhập được Excel: '+err.message)}});
render();
</script></body></html>
